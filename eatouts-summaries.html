<!doctype html>
<!-- PAGE: Saved summaries -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#141418">
<title>Saved summaries · EatOuts</title>
<style>
::-webkit-scrollbar{width:0;height:0;display:none}
*{scrollbar-width:none;-ms-overflow-style:none}

  *,*::before,*::after{box-sizing:border-box}
  :root{
    --ink:#0F0F12;
    --ink-2:#2A2A30;
    --ink-3:#4A4A52;
    --paper:#F4F5F7;
    --card:#FFFFFF;
    --line:#E6E8EC;
    --line-2:#F0F1F4;
    --orange:#FF5A1F;
    --orange-2:#FF7A42;
    --orange-soft:#FFEDE4;
    --orange-line:#FFD5C2;
    --green:#16A34A;
    --green-soft:#E7F7EE;
    --red:#DC2626;
    --red-soft:#FEE2E2;
    --amber:#B45309;
    --amber-soft:#FEF3C7;
    --blue:#0284C7;
    --blue-soft:#E0F2FE;
    --muted:#6B7280;
    --faint:#9AA1AC;
  }
  html,body{height:100%}
  body{
    margin:0;
    background:#E9EBEF;
    color:var(--ink);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:15px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;
    display:flex;
    justify-content:center;
  }
  button,input,select,textarea{font-family:inherit}
  button{cursor:pointer}

  #shell{
    width:100%;
    max-width:460px;
    height:100vh;
    height:100dvh;
    background:var(--paper);
    display:flex;
    flex-direction:column;
    overflow:hidden;
    position:relative;
    box-shadow:0 0 70px rgba(20,20,25,.16);
  }

  /* ============ TOPBAR ============ */
  .topbar{
    flex:0 0 auto;
    background:#141418;
    padding:calc(13px + env(safe-area-inset-top)) 18px 14px;
    position:relative;
    z-index:10;
  }
  .topbar-row{
    display:flex;align-items:center;gap:10px;
    padding-bottom:13px;
  }
  .brand{
    display:inline-flex;align-items:center;gap:9px;
    text-decoration:none;
  }
  .brand .mark{
    width:28px;height:28px;flex:0 0 auto;border-radius:8px;
    background:linear-gradient(145deg,var(--orange-2),var(--orange));
    color:#fff;
    display:grid;place-items:center;
    font-size:14px;font-weight:900;letter-spacing:-.03em;
    box-shadow:0 2px 10px rgba(255,90,31,.35);
  }
  .brand .word{
    color:#fff;font-size:15px;font-weight:800;
    letter-spacing:-.02em;
  }
  .hdr-chip{
    margin-left:auto;
    font-size:10px;font-weight:800;
    letter-spacing:.12em;text-transform:uppercase;
    color:var(--orange-2);
    border:1px solid rgba(255,122,66,.32);
    background:rgba(255,90,31,.1);
    border-radius:999px;
    padding:5px 11px;
    white-space:nowrap;
  }

  .progress{padding-bottom:2px}
  .progress-top{
    display:flex;align-items:baseline;justify-content:space-between;
    gap:10px;margin-bottom:8px;
  }
  .progress-label{
    font-size:11px;font-weight:800;
    letter-spacing:.14em;text-transform:uppercase;
    color:rgba(255,255,255,.5);
  }
  .progress-count{
    font-size:11.5px;font-weight:800;
    color:var(--orange-2);
    letter-spacing:.02em;
  }
  .progress-track{
    height:5px;border-radius:99px;
    background:rgba(255,255,255,.13);
    overflow:hidden;
  }
  .progress-fill{
    height:100%;width:0%;
    border-radius:99px;
    background:linear-gradient(90deg,var(--orange),var(--orange-2));
    transition:width .35s cubic-bezier(.4,0,.2,1);
  }

  /* ============ SCROLL ============ */
  .scroll{
    flex:1 1 auto;min-height:0;
    overflow-y:auto;
    overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
    scrollbar-width:none;
  }
  .scroll::-webkit-scrollbar{display:none}

  /* ============ INTRO ============ */
  .intro{
    background:linear-gradient(175deg,#141418 0%,#1B1B21 60%,#232329 100%);
    padding:4px 22px 46px;
    position:relative;
    overflow:hidden;
    text-align:center;
  }
  .intro::after{
    content:"";
    position:absolute;
    top:-80px;right:-80px;
    width:230px;height:230px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,90,31,.2),transparent 68%);
    pointer-events:none;
  }
  .intro h1{
    position:relative;
    margin:0 auto 12px;
    font-size:26px;
    line-height:1.15;
    font-weight:800;
    letter-spacing:-.03em;
    color:#fff;
    max-width:15ch;
  }
  .intro h1 em{font-style:normal;color:var(--orange-2)}
  .intro p{
    position:relative;
    margin:0 auto;
    font-size:14px;
    line-height:1.6;
    color:rgba(255,255,255,.6);
    max-width:32ch;
  }

  /* ============ SHEET ============ */
  .sheet{
    position:relative;
    z-index:1;
    margin-top:-26px;
    background:var(--paper);
    border-radius:26px 26px 0 0;
    padding:20px 14px 30px;
    min-height:60vh;
  }

  /* ============ META CARD ============ */
  .meta-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:15px 16px;
    margin-bottom:12px;
    box-shadow:0 1px 2px rgba(20,20,25,.03);
  }
  .meta-row{
    display:flex;align-items:center;gap:10px;
    margin-bottom:11px;
  }
  .meta-dot{
    width:9px;height:9px;border-radius:50%;flex:0 0 auto;
    background:var(--orange);
    box-shadow:0 0 0 3px var(--orange-soft);
  }
  .meta-dot.green{background:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
  .meta-dot.warn{background:var(--amber);box-shadow:0 0 0 3px var(--amber-soft)}
  .meta-dot.red{background:var(--red);box-shadow:0 0 0 3px var(--red-soft)}
  .meta-text{
    font-size:13.5px;
    color:var(--ink-2);
    line-height:1.4;
    min-width:0;
    flex:1 1 auto;
  }
  .meta-text b{color:var(--ink);font-weight:750}
  .meta-stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    padding-top:11px;
    border-top:1px solid var(--line-2);
  }
  .stat{text-align:center}
  .stat b{
    display:block;
    font-size:19px;font-weight:850;
    letter-spacing:-.03em;
    color:var(--ink);
    line-height:1.1;
    font-variant-numeric:tabular-nums;
  }
  .stat span{
    display:block;
    margin-top:3px;
    font-size:9.5px;font-weight:800;
    letter-spacing:.1em;text-transform:uppercase;
    color:var(--faint);
  }

  /* ============ ACCORDION STACK ============ */
  .stack{display:flex;flex-direction:column;gap:10px}
  .acc{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    overflow:hidden;
    transition:border-color .2s ease,box-shadow .2s ease;
  }
  .acc.open{
    border-color:var(--orange-line);
    box-shadow:0 4px 18px -6px rgba(255,90,31,.22);
  }
  .acc-head{
    width:100%;
    display:flex;align-items:center;gap:12px;
    padding:13px 15px;
    background:transparent;border:0;
    text-align:left;
    -webkit-tap-highlight-color:transparent;
    transition:background .15s;
  }
  .acc-head:active{background:#FAFBFC}

  .sum-thumb{
    width:48px;height:48px;flex:0 0 auto;
    border-radius:11px;
    background:var(--orange-soft);
    color:var(--orange);
    display:grid;place-items:center;
    font-size:13px;font-weight:850;
    letter-spacing:-.02em;
    overflow:hidden;
    position:relative;
  }
  .sum-thumb.plain{
    background:#F0F1F4;color:var(--faint);
  }

  .acc-title{
    flex:1 1 auto;min-width:0;
    display:flex;flex-direction:column;gap:2px;
  }
  .acc-title b{
    font-size:15px;font-weight:750;
    letter-spacing:-.015em;
    color:var(--ink);
    line-height:1.25;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .acc-sub{
    font-size:11.5px;
    color:var(--faint);
    line-height:1.3;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    font-weight:550;
  }

  .acc-amount{
    font-size:14px;
    font-weight:850;
    color:var(--ink);
    letter-spacing:-.02em;
    flex:0 0 auto;
    font-variant-numeric:tabular-nums;
    padding-left:4px;
  }

  .acc-body{
    display:grid;
    grid-template-rows:0fr;
    transition:grid-template-rows .32s cubic-bezier(.4,0,.2,1);
  }
  .acc.open .acc-body{grid-template-rows:1fr}
  .acc-inner{overflow:hidden;min-height:0}

  .module{padding:2px 15px 18px}

  /* Info blocks inside accordion body */
  .info-block{
    background:#FAFBFC;
    border:1px solid var(--line-2);
    border-radius:12px;
    padding:13px 14px;
    margin-bottom:10px;
  }
  .info-block:last-of-type{margin-bottom:12px}
  .info-block h4{
    margin:0 0 8px;
    font-size:11.5px;font-weight:800;
    letter-spacing:.09em;text-transform:uppercase;
    color:var(--muted);
  }

  /* Definition rows */
  .def-row{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
    padding:7px 0;
    border-bottom:1px solid var(--line-2);
    font-size:13px;
  }
  .def-row:last-child{border-bottom:0;padding-bottom:0}
  .def-row:first-child{padding-top:0}
  .def-row .k{color:var(--faint);font-weight:650;flex:0 0 auto}
  .def-row .v{color:var(--ink-2);font-weight:700;text-align:right;word-break:break-word;min-width:0}
  .def-row .v.total{color:var(--ink);font-weight:850;font-size:15px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}

  /* Item list inside accordion */
  .item-list{
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .item-row{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
    font-size:13px;
    padding:5px 0;
    border-bottom:1px solid var(--line-2);
  }
  .item-row:last-child{border-bottom:0;padding-bottom:0}
  .item-row .iname{
    color:var(--ink-2);
    font-weight:650;
    min-width:0;
    word-break:break-word;
  }
  .item-row .iprice{
    color:var(--ink);
    font-weight:750;
    white-space:nowrap;
    font-variant-numeric:tabular-nums;
  }
  .item-row .iqty{
    color:var(--faint);
    font-weight:650;
    font-size:11.5px;
    margin-left:6px;
  }

  /* Action row */
  .action-row{
    display:grid;
    grid-template-columns:1.4fr 1fr;
    gap:9px;
    margin-top:14px;
  }
  .action-row .btn{
    height:48px;
    border-radius:12px;
    font-size:14.5px;
    font-weight:750;
    border:0;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    -webkit-tap-highlight-color:transparent;
    transition:transform .1s ease,background .15s;
    letter-spacing:-.005em;
  }
  .action-row .btn:active{transform:scale(.98)}
  .btn-view{
    background:linear-gradient(145deg,var(--orange-2),var(--orange));
    color:#fff;
    box-shadow:0 6px 18px -6px rgba(255,90,31,.5);
  }
  .btn-view:active{background:var(--orange)}
  .btn-remove{
    background:#FEF2F2;
    border:1px solid #FECACA!important;
    color:var(--red);
  }
  .btn-remove:active{background:var(--red-soft)}

  /* Empty state */
  .empty-note{
    font-size:12.5px;
    color:var(--faint);
    text-align:center;
    padding:22px 16px;
    border:1.5px dashed #DCE0E6;
    border-radius:11px;
    background:#FAFBFC;
    line-height:1.55;
  }
  .empty-note b{color:var(--ink-2);font-weight:750}

  /* ============ TOAST ============ */
  .toast{
    position:fixed;left:50%;z-index:200;
    bottom:calc(28px + env(safe-area-inset-bottom));
    transform:translate(-50%,10px);
    background:var(--ink);color:#fff;
    font-size:13.5px;font-weight:650;
    padding:12px 18px;border-radius:999px;
    max-width:88vw;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    opacity:0;pointer-events:none;
    transition:opacity .2s ease,transform .2s ease;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body data-page="eatouts-summaries">
<div id="shell">

  <header class="topbar">
    <div class="topbar-row">
      <a class="brand" href="index.html">
        <span class="mark">E</span>
        <span class="word">EatOuts</span>
      </a>
      <span class="hdr-chip">Saved summaries</span>
    </div>
    <div class="progress">
      <div class="progress-top">
        <span class="progress-label">Your saved</span>
        <span class="progress-count" id="progressCount">—</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>
  </header>

  <div class="scroll" id="scroll">
    <section class="intro" id="intro">
      <h1>Saved <em>summaries</em>.</h1>
      <p>Order and checkout summaries you have kept for later reference.</p>
    </section>
    <main class="sheet" id="app"></main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script src="js/eatouts-manager-db.js"></script>
<script src="assets/data/demo/the-food-place/demo-data.js"></script>
<script src="js/eatouts-manager-seed.js"></script>
<script src="js/eatouts-roles.js"></script>
<script src="js/eatouts-users.js"></script>
<script src="js/eatouts-feedback.js"></script>
<script src="js/eatouts-blog-admin.js"></script>
<script src="js/eatouts-auth.js"></script>
<script src="js/eatouts-manager.js"></script>
<script src="js/eatouts-customer.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {

  /* ---- Auth guard (unchanged) ---- */
  if (!EO.guard({"roles": ["customer"]})) return;

  var S = window.EatoutsCustomer;

  /* ============================================================
     HELPERS
     ============================================================ */
  var toastEl = document.getElementById("toast");
  var toastTimer = null;
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove("show"); }, 2000);
  }

  function esc(s){
    return String(s == null ? "" : s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }
  function escapeAttr(s){
    return esc(s).replace(/`/g,"&#96;");
  }
  function cssEscape(s){
    return String(s).replace(/["\\]/g, "\\$&");
  }

  /* ---- data accessors (mirror original fallbacks) ---- */
  function totalOf(s){
    return (s.total != null ? s.total : (s.payload && s.payload.total)) || 0;
  }
  function itemCountOf(s){
    return (s.itemCount != null ? s.itemCount : (s.payload && s.payload.itemCount)) || 0;
  }
  function nameOf(s){
    return s.venueName
        || (s.payload && s.payload.venueName)
        || "Saved summary";
  }
  function itemsOf(s){
    var p = s.payload || {};
    var arr = s.items || p.items;
    return Array.isArray(arr) ? arr : [];
  }
  function money(v){
    try { return EO.money(v); }
    catch (e) { return "P" + Number(v || 0).toFixed(2); }
  }
  function formattedDate(ts){
    if (!ts) return "—";
    try {
      var d = new Date(ts);
      if (isNaN(d.getTime())) return "—";
      return d.toLocaleDateString(undefined, { day:"numeric", month:"short", year:"numeric" });
    } catch (e) { return "—"; }
  }

  /* Only one accordion open at a time; null = all closed */
  var OPEN = null;

  /* ============================================================
     RENDER
     ============================================================ */
  var mount = document.getElementById("app");

  function render(){
    var rows = (S && S.summaries && S.summaries.list) ? S.summaries.list() : [];

    var total = rows.length;
    var sumValue = rows.reduce(function(acc, s){ return acc + totalOf(s); }, 0);
    var totalItems = rows.reduce(function(acc, s){ return acc + itemCountOf(s); }, 0);

    /* ---- progress bar (simply shows count, fills as you collect) ---- */
    var pct = total ? Math.min(100, Math.round((total / 10) * 100)) : 0;
    document.getElementById("progressFill").style.width = pct + "%";
    document.getElementById("progressCount").textContent =
      total + " saved summar" + (total === 1 ? "y" : "ies");

    /* ---- meta card ---- */
    var dotClass, msg;
    if (total === 0){
      dotClass = "warn";
      msg = "No saved summaries yet";
    } else {
      dotClass = "green";
      msg = "<b>" + total + "</b> saved summar" + (total === 1 ? "y" : "ies") +
            " · " + totalItems + " item" + (totalItems === 1 ? "" : "s");
    }

    var metaHTML =
      '<div class="meta-card">' +
        '<div class="meta-row">' +
          '<span class="meta-dot ' + dotClass + '"></span>' +
          '<span class="meta-text">' + msg + '</span>' +
        '</div>' +
        '<div class="meta-stats">' +
          '<div class="stat"><b>' + total + '</b><span>Saved</span></div>' +
          '<div class="stat"><b>' + totalItems + '</b><span>Items</span></div>' +
          '<div class="stat"><b>' + (total ? money(sumValue) : "—") + '</b><span>Total</span></div>' +
        '</div>' +
      '</div>';

    /* ---- empty state ---- */
    if (total === 0){
      mount.innerHTML = metaHTML +
        '<div class="empty-note">No saved summaries yet.<br>Tap <b>Save Summary</b> on a restaurant, bottle store or order to keep it here.</div>';
      return;
    }

    /* ---- accordion stack ---- */
    var sections = rows.map(function(s){
      var id = String(s.id || "");
      var name = nameOf(s);
      var isOpen = OPEN === id;
      var count = itemCountOf(s);
      var amt = totalOf(s);
      var createdAt = s.createdAt || s.savedAt || s.timestamp || null;

      var sub = count + " item" + (count === 1 ? "" : "s") +
                (createdAt ? " · " + formattedDate(createdAt) : "");

      var thumbText = String(count || "•").slice(0,3);
      var thumbCls = "sum-thumb" + (count ? "" : " plain");

      var cls = "acc";
      if (isOpen) cls += " open";

      /* ---- items list inside the card ---- */
      var items = itemsOf(s);
      var itemsHTML = items.length
        ? '<div class="item-list">' + items.slice(0, 20).map(function(it){
            var n = it.name || it.title || it.label || "Item";
            var q = it.qty != null ? it.qty : (it.quantity != null ? it.quantity : null);
            var price = it.price != null ? money(it.price * (q || 1)) : (it.lineTotal != null ? money(it.lineTotal) : "");
            return '<div class="item-row">' +
              '<span class="iname">' + esc(n) +
                (q && q > 1 ? '<span class="iqty">× ' + esc(q) + '</span>' : '') +
              '</span>' +
              '<span class="iprice">' + esc(price) + '</span>' +
            '</div>';
          }).join("") +
          (items.length > 20 ? '<div class="item-row"><span class="iname" style="color:var(--faint);font-weight:550">+' + (items.length - 20) + ' more item(s)</span><span></span></div>' : '') +
          '</div>'
        : '<p style="font-size:13px;color:var(--faint);margin:0;font-weight:550">Item details not available.</p>';

      var body =
        '<div class="module">' +
          '<div class="info-block">' +
            '<h4>Summary details</h4>' +
            '<div class="def-row"><span class="k">Venue</span><span class="v">' + esc(name) + '</span></div>' +
            '<div class="def-row"><span class="k">Items</span><span class="v">' + esc(count) + '</span></div>' +
            '<div class="def-row"><span class="k">Saved</span><span class="v">' + esc(formattedDate(createdAt)) + '</span></div>' +
            '<div class="def-row"><span class="k">Summary ID</span><span class="v">' + esc(id || "—") + '</span></div>' +
            '<div class="def-row"><span class="k">Total</span><span class="v total">' + esc(money(amt)) + '</span></div>' +
          '</div>' +
          '<div class="info-block">' +
            '<h4>Items</h4>' +
            itemsHTML +
          '</div>' +
          '<div class="action-row">' +
            '<button class="btn btn-view" type="button" data-view="' + escapeAttr(id) + '">View summary</button>' +
            '<button class="btn btn-remove" type="button" data-del="' + escapeAttr(id) + '">Remove</button>' +
          '</div>' +
        '</div>';

      return '' +
        '<section class="' + cls + '" data-key="' + escapeAttr(id) + '">' +
          '<button class="acc-head" type="button" aria-expanded="' + (isOpen ? "true" : "false") + '">' +
            '<span class="' + thumbCls + '">' + esc(thumbText) + '</span>' +
            '<span class="acc-title">' +
              '<b>' + esc(name) + '</b>' +
              '<span class="acc-sub">' + esc(sub) + '</span>' +
            '</span>' +
            '<span class="acc-amount">' + esc(money(amt)) + '</span>' +
          '</button>' +
          '<div class="acc-body">' +
            '<div class="acc-inner">' + body + '</div>' +
          '</div>' +
        '</section>';
    }).join("");

    mount.innerHTML = metaHTML + '<div class="stack">' + sections + '</div>';
  }

  /* ============================================================
     ACCORDION BEHAVIOUR — only one open at a time
     ============================================================ */
  function toggleAccordion(key){
    OPEN = (OPEN === key) ? null : key;
    var accs = mount.querySelectorAll(".acc");
    for (var i = 0; i < accs.length; i++){
      var acc = accs[i];
      var isOpen = acc.getAttribute("data-key") === OPEN;
      acc.classList.toggle("open", isOpen);
      var head = acc.querySelector(".acc-head");
      if (head) head.setAttribute("aria-expanded", isOpen ? "true" : "false");
    }
    if (OPEN){
      var opened = mount.querySelector('.acc[data-key="' + cssEscape(OPEN) + '"]');
      if (opened){
        setTimeout(function(){
          try { opened.scrollIntoView({ behavior:"smooth", block:"start" }); } catch (e) {}
        }, 320);
      }
    }
  }

  /* ============================================================
     DELEGATED CLICKS
     ============================================================ */
  mount.addEventListener("click", function(e){

    /* view (navigate to checkout summary) */
    var v = e.target.closest("[data-view]");
    if (v){
      e.stopPropagation();
      var id = v.getAttribute("data-view");
      var s = (S && S.summaries && S.summaries.list ? S.summaries.list() : [])
                .find(function(x){ return String(x.id) === String(id); });
      if (s) location.href = "eatouts-checkout-summary.html?id=" + encodeURIComponent(s.id);
      return;
    }

    /* remove */
    var d = e.target.closest("[data-del]");
    if (d){
      e.stopPropagation();
      if (!EO.confirm("Remove this saved summary?")) return;
      try {
        S.summaries.remove(d.getAttribute("data-del"));
        if (OPEN === d.getAttribute("data-del")) OPEN = null;
        render();
        toast("Summary removed");
      } catch (err) { toast("Could not remove summary"); }
      return;
    }

    /* accordion header (last, so inner buttons still work) */
    var head = e.target.closest(".acc-head");
    if (head){
      var acc = head.closest(".acc");
      if (acc) toggleAccordion(acc.getAttribute("data-key"));
      return;
    }
  });

  /* ============================================================
     BOOT
     ============================================================ */
  render();

  /* live updates if customer store changes */
  if (S && typeof S.onChange === "function"){
    try { S.onChange(render); } catch (e) {}
  }
});
</script>
</body>
</html>
