<!doctype html>
<!-- PAGE: Saved summaries --><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#ffffff"><title>Saved summaries · EatOuts</title><link rel="stylesheet" href="assets/eatouts-manager.css"></head><body data-page="eatouts-summaries"><div id="mount"></div><script src="js/eatouts-manager-db.js"></script><script src="assets/data/demo/the-food-place/demo-data.js"></script><script src="js/eatouts-manager-seed.js"></script><script src="js/eatouts-roles.js"></script><script src="js/eatouts-users.js"></script><script src="js/eatouts-feedback.js"></script><script src="js/eatouts-blog-admin.js"></script><script src="js/eatouts-auth.js"></script><script src="js/eatouts-manager.js"></script><script src="js/eatouts-customer.js"></script><script>document.addEventListener("DOMContentLoaded",()=>{
 if(!EO.guard({"roles":["customer"]}))return;
 const S=window.EatoutsCustomer;
 function total(s){return (s.total!=null?s.total:(s.payload&&s.payload.total))||0;}
 function render(){
  const rows=S?S.summaries.list():[];
  document.querySelector("#list").innerHTML=rows.length?rows.map(s=>{
   const name=s.venueName||(s.payload&&s.payload.venueName)||"Saved summary";
   return `<div class="listrow"><div class="listmain"><strong>${EO.esc(name)}</strong><small>${EO.esc(s.itemCount||(s.payload&&s.payload.itemCount)||0)} item(s)${total(s)?(" · "+EO.money(total(s))):""}</small></div><button class="btn" data-view="${EO.esc(s.id)}">View</button><button class="btn danger" data-del="${EO.esc(s.id)}">Remove</button></div>`;
  }).join(""):EO.empty("No saved summaries yet","Tap “Save Summary” on a restaurant, bottle store or order to keep it here.");
 }
 document.querySelector("#mount").innerHTML=EO.shell("Saved Summaries","Order and checkout summaries you have saved",`<div id="list"></div>`,{section:"Customer"});
 document.querySelector("#list").addEventListener("click",e=>{
  const v=e.target.closest("[data-view]");
  if(v){const s=S.summaries.list().find(x=>String(x.id)===v.dataset.view);if(s)location.href="eatouts-checkout-summary.html?id="+encodeURIComponent(s.id);return;}
  const d=e.target.closest("[data-del]");
  if(d){if(!EO.confirm("Remove this saved summary?"))return;S.summaries.remove(d.dataset.del);render();}
 });
 render();
 S&&S.onChange&&S.onChange(render);
});</script></body></html>
