<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#ffffff"><title>My orders · EatOuts</title><link rel="stylesheet" href="assets/eatouts-manager.css"></head><body><div id="mount"></div><script src="js/eatouts-manager-db.js"></script><script src="js/eatouts-roles.js"></script><script src="js/eatouts-users.js"></script><script src="js/eatouts-feedback.js"></script><script src="js/eatouts-blog-admin.js"></script><script src="js/eatouts-auth.js"></script><script src="js/eatouts-manager.js"></script><script>document.addEventListener("DOMContentLoaded",()=>{if(!EO.guard({"roles": ["customer"]}))return;document.querySelector("#mount").innerHTML=EO.shell("My orders","Order history, reorder and split-share replay",`<div id="orders"></div>`,{section:"Customer"});const rows=EatoutsMgrDB.collection("orders");document.querySelector("#orders").innerHTML=rows.map(x=>`<article class="card"><div class="listrow"><div class="listmain"><strong>${x.id}</strong><small>${x.created} · ${EO.money(x.total)}</small></div>${EO.status(x.status)}</div><p style="font-size:11px">${x.items.join(" · ")}</p><div class="actions"><button class="btn primary">Reorder</button><button class="btn">Replay split</button></div></article>`).join("");});</script></body></html>
