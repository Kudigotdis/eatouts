<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#ffffff"><title>My orders · EatOuts</title><link rel="stylesheet" href="assets/eatouts-manager.css"></head><body><div id="mount"></div><script src="js/eatouts-manager-db.js"></script><script src="assets/data/demo/the-food-place/demo-data.js"></script><script src="js/eatouts-manager-seed.js"></script><script src="js/eatouts-roles.js"></script><script src="js/eatouts-users.js"></script><script src="js/eatouts-feedback.js"></script><script src="js/eatouts-blog-admin.js"></script><script src="js/eatouts-auth.js"></script><script src="js/eatouts-manager.js"></script><script src="js/eatouts-audit.js"></script><script>document.addEventListener("DOMContentLoaded",()=>{if(!EO.guard({"roles": ["customer"]}))return;document.querySelector("#mount").innerHTML=EO.shell("My orders","Order history, reorder and split-share replay",`<div id="orders"></div><div id="orderpager"></div>`,{section:"Customer"});
const state={page:1};const itemsOf=o=>(o.items||[]).map(String);const nameOf=o=>((o.restaurant&&o.restaurant.name)||"");function phoneOf(o){let w=(o.restaurant&&o.restaurant.whatsapp)||"";return EO.phoneIntl?EO.phoneIntl(w):String(w).replace(/[^0-9]/g,"")}function buildMsg(o,split){const l=["Hello"+(nameOf(o)?" "+nameOf(o):"")+"!"];l.push(split?"Splitting the bill with friends for my order "+o.id+":":"I would like to reorder "+o.id+":");itemsOf(o).forEach(x=>l.push(" - "+x));l.push("Total: "+EO.money(o.total));if(o.created)l.push("Original order: "+o.created);return l.join("\n")}function render(){const all=EO.page(EatoutsMgrDB.collection("orders").slice().sort((a,b)=>String(b.created||"").localeCompare(String(a.created||""))),state.page,25);document.querySelector("#orders").innerHTML=all.rows.length?all.rows.map(x=>`<article class="card"><div class="listrow"><div class="listmain"><strong>${EO.esc(x.id)}</strong><small>${EO.esc(x.created||"")} · ${EO.money(x.total)}</small></div>${EO.status(x.status)}</div><p style="font-size:11px">${itemsOf(x).map(EO.esc).join(" · ")}</p><div class="actions"><button class="btn primary" data-reorder="${EO.esc(x.id)}">Reorder</button><button class="btn" data-replay="${EO.esc(x.id)}">Replay split</button></div></article>`).join(""):EO.empty("No orders yet","Orders you send through WhatsApp appear here.");document.querySelector("#orderpager").innerHTML=EO.pager?EO.pager(all,"data-page"):""}document.querySelector("#orders").onclick=e=>{const btn=e.target.closest("[data-reorder],[data-replay]");if(!btn)return;const id=btn.dataset.reorder||btn.dataset.replay;const o=EatoutsMgrDB.find("orders",id);if(!o)return;const ph=phoneOf(o);if(!ph){EO.toast("No venue contact saved for this order");return}const split=!btn.dataset.reorder;window.open("https://wa.me/"+ph+"?text="+encodeURIComponent(buildMsg(o,split)),"_blank");if(window.EatoutsAudit&&window.EatoutsAudit.log)EatoutsAudit.log(split?"order.replay":"order.reorder",id,null,{id:id,venue:nameOf(o)},{mode:split?"replay":"reorder"})};document.querySelector("#orderpager").onclick=e=>{const p=e.target.dataset.page;if(p){state.page=Number(p);render()}};render();});</script></body></html>
