<!doctype html>
<!-- PAGE: My orders -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#141418">
<title>My orders · EatOuts</title>
<style>
  *,*::before,*::after{box-sizing:border-box}
  :root{
    --ink:#0F0F12;
    --ink-2:#2A2A30;
    --ink-3:#4A4A52;
    --paper:#F4F5F7;
    --card:#FFFFFF;
    --line:#E6E8EC;
    --line-2:#F0F1F4;
    --orange:#FF5A1F;
    --orange-2:#FF7A42;
    --orange-soft:#FFEDE4;
    --orange-line:#FFD5C2;
    --green:#16A34A;
    --green-soft:#E7F7EE;
    --red:#DC2626;
    --red-soft:#FEE2E2;
    --amber:#B45309;
    --amber-soft:#FEF3C7;
    --blue:#0284C7;
    --blue-soft:#E0F2FE;
    --muted:#6B7280;
    --faint:#9AA1AC;
  }
  html,body{height:100%}
  body{
    margin:0;
    background:#E9EBEF;
    color:var(--ink);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:15px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;
    display:flex;
    justify-content:center;
  }
  button,input,select,textarea{font-family:inherit}
  button{cursor:pointer}

  #shell{
    width:100%;
    max-width:460px;
    height:100vh;
    height:100dvh;
    background:var(--paper);
    display:flex;
    flex-direction:column;
    overflow:hidden;
    position:relative;
    box-shadow:0 0 70px rgba(20,20,25,.16);
  }

  /* ============ TOPBAR ============ */
  .topbar{
    flex:0 0 auto;
    background:#141418;
    padding:calc(13px + env(safe-area-inset-top)) 18px 14px;
    position:relative;
    z-index:10;
  }
  .topbar-row{
    display:flex;align-items:center;gap:10px;
    padding-bottom:13px;
  }
  .brand{
    display:inline-flex;align-items:center;gap:9px;
    text-decoration:none;
  }
  .brand .mark{
    width:28px;height:28px;flex:0 0 auto;border-radius:8px;
    background:linear-gradient(145deg,var(--orange-2),var(--orange));
    color:#fff;
    display:grid;place-items:center;
    font-size:14px;font-weight:900;letter-spacing:-.03em;
    box-shadow:0 2px 10px rgba(255,90,31,.35);
  }
  .brand .word{
    color:#fff;font-size:15px;font-weight:800;
    letter-spacing:-.02em;
  }
  .hdr-chip{
    margin-left:auto;
    font-size:10px;font-weight:800;
    letter-spacing:.12em;text-transform:uppercase;
    color:var(--orange-2);
    border:1px solid rgba(255,122,66,.32);
    background:rgba(255,90,31,.1);
    border-radius:999px;
    padding:5px 11px;
    white-space:nowrap;
  }

  .progress{padding-bottom:2px}
  .progress-top{
    display:flex;align-items:baseline;justify-content:space-between;
    gap:10px;margin-bottom:8px;
  }
  .progress-label{
    font-size:11px;font-weight:800;
    letter-spacing:.14em;text-transform:uppercase;
    color:rgba(255,255,255,.5);
  }
  .progress-count{
    font-size:11.5px;font-weight:800;
    color:var(--orange-2);
    letter-spacing:.02em;
  }
  .progress-track{
    height:5px;border-radius:99px;
    background:rgba(255,255,255,.13);
    overflow:hidden;
  }
  .progress-fill{
    height:100%;width:0%;
    border-radius:99px;
    background:linear-gradient(90deg,var(--orange),var(--orange-2));
    transition:width .35s cubic-bezier(.4,0,.2,1);
  }

  /* ============ SCROLL ============ */
  .scroll{
    flex:1 1 auto;min-height:0;
    overflow-y:auto;
    overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
    scrollbar-width:none;
  }
  .scroll::-webkit-scrollbar{display:none}

  /* ============ INTRO ============ */
  .intro{
    background:linear-gradient(175deg,#141418 0%,#1B1B21 60%,#232329 100%);
    padding:4px 22px 46px;
    position:relative;
    overflow:hidden;
    text-align:center;
  }
  .intro::after{
    content:"";
    position:absolute;
    top:-80px;right:-80px;
    width:230px;height:230px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,90,31,.2),transparent 68%);
    pointer-events:none;
  }
  .intro h1{
    position:relative;
    margin:0 auto 12px;
    font-size:26px;
    line-height:1.15;
    font-weight:800;
    letter-spacing:-.03em;
    color:#fff;
    max-width:15ch;
  }
  .intro h1 em{font-style:normal;color:var(--orange-2)}
  .intro p{
    position:relative;
    margin:0 auto;
    font-size:14px;
    line-height:1.6;
    color:rgba(255,255,255,.6);
    max-width:32ch;
  }

  /* ============ SHEET ============ */
  .sheet{
    position:relative;
    z-index:1;
    margin-top:-26px;
    background:var(--paper);
    border-radius:26px 26px 0 0;
    padding:20px 14px 30px;
    min-height:60vh;
  }

  /* ============ META CARD ============ */
  .meta-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:15px 16px;
    margin-bottom:12px;
    box-shadow:0 1px 2px rgba(20,20,25,.03);
  }
  .meta-row{
    display:flex;align-items:center;gap:10px;
    margin-bottom:11px;
  }
  .meta-dot{
    width:9px;height:9px;border-radius:50%;flex:0 0 auto;
    background:var(--orange);
    box-shadow:0 0 0 3px var(--orange-soft);
  }
  .meta-dot.green{background:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
  .meta-dot.warn{background:var(--amber);box-shadow:0 0 0 3px var(--amber-soft)}
  .meta-dot.red{background:var(--red);box-shadow:0 0 0 3px var(--red-soft)}
  .meta-text{
    font-size:13.5px;
    color:var(--ink-2);
    line-height:1.4;
    min-width:0;
    flex:1 1 auto;
  }
  .meta-text b{color:var(--ink);font-weight:750}
  .meta-stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    padding-top:11px;
    border-top:1px solid var(--line-2);
  }
  .stat{text-align:center}
  .stat b{
    display:block;
    font-size:19px;font-weight:850;
    letter-spacing:-.03em;
    color:var(--ink);
    line-height:1.1;
    font-variant-numeric:tabular-nums;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .stat span{
    display:block;
    margin-top:3px;
    font-size:9.5px;font-weight:800;
    letter-spacing:.1em;text-transform:uppercase;
    color:var(--faint);
  }

  /* ============ ACCORDION STACK ============ */
  .stack{display:flex;flex-direction:column;gap:10px}
  .acc{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    overflow:hidden;
    transition:border-color .2s ease,box-shadow .2s ease;
  }
  .acc.open{
    border-color:var(--orange-line);
    box-shadow:0 4px 18px -6px rgba(255,90,31,.22);
  }
  .acc-head{
    width:100%;
    display:flex;align-items:center;gap:14px;
    padding:12px 15px;
    background:transparent;border:0;
    text-align:left;
    -webkit-tap-highlight-color:transparent;
    transition:background .15s;
  }
  .acc-head:active{background:#FAFBFC}

  /* 90px order logo thumbnail */
  .ord-thumb{
    width:90px;height:90px;flex:0 0 auto;
    border-radius:14px;
    background:linear-gradient(145deg,#FFF3EC,#FFE2D2);
    color:var(--orange);
    display:grid;place-items:center;
    font-size:34px;font-weight:850;
    letter-spacing:-.03em;
    overflow:hidden;
    position:relative;
  }
  .ord-thumb img{
    width:100%;height:100%;
    object-fit:cover;display:block;
  }
  .ord-thumb.plain{
    background:#F0F1F4;
    color:var(--faint);
  }

  .acc-title{
    flex:1 1 auto;min-width:0;
    display:flex;flex-direction:column;gap:5px;
  }
  .acc-title b{
    font-size:15.5px;font-weight:750;
    letter-spacing:-.015em;
    color:var(--ink);
    line-height:1.25;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .acc-sub{
    font-size:11.5px;
    color:var(--faint);
    line-height:1.4;
    font-weight:550;
    display:flex;flex-wrap:wrap;gap:4px 6px;
  }
  .acc-sub .dotsep{color:#D3D7DE}

  .acc-total{
    display:inline-flex;align-items:center;
    margin-top:2px;
    padding:3px 9px;
    border-radius:999px;
    background:var(--orange-soft);
    color:var(--orange);
    font-size:12px;
    font-weight:850;
    letter-spacing:-.01em;
    font-variant-numeric:tabular-nums;
    width:fit-content;
    line-height:1.4;
  }

  .acc-right{
    flex:0 0 auto;
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:8px;
  }
  .vis-dot{
    width:9px;height:9px;border-radius:50%;
    background:var(--orange);
    box-shadow:0 0 0 3px var(--orange-soft);
  }
  .vis-dot.green{background:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
  .vis-dot.warn{background:var(--amber);box-shadow:0 0 0 3px var(--amber-soft)}
  .vis-dot.red{background:var(--red);box-shadow:0 0 0 3px var(--red-soft)}
  .vis-dot.off{background:#D3D7DE;box-shadow:none}

  .acc-body{
    display:grid;
    grid-template-rows:0fr;
    transition:grid-template-rows .32s cubic-bezier(.4,0,.2,1);
  }
  .acc.open .acc-body{grid-template-rows:1fr}
  .acc-inner{overflow:hidden;min-height:0}

  .module{padding:2px 15px 18px}

  /* ============ INFO BLOCK ============ */
  .info-block{
    background:#FAFBFC;
    border:1px solid var(--line-2);
    border-radius:12px;
    padding:13px 14px;
    margin-bottom:10px;
  }
  .info-block:last-of-type{margin-bottom:12px}
  .info-block h4{
    margin:0 0 8px;
    font-size:11.5px;font-weight:800;
    letter-spacing:.09em;text-transform:uppercase;
    color:var(--muted);
  }

  /* Definition rows */
  .def-row{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
    padding:7px 0;
    border-bottom:1px solid var(--line-2);
    font-size:13px;
  }
  .def-row:last-child{border-bottom:0;padding-bottom:0}
  .def-row:first-child{padding-top:0}
  .def-row .k{color:var(--faint);font-weight:650;flex:0 0 auto}
  .def-row .v{color:var(--ink-2);font-weight:700;text-align:right;word-break:break-word;min-width:0}
  .def-row .v.total{color:var(--ink);font-weight:850;font-size:15px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}

  /* Status pill */
  .pill{
    display:inline-flex;align-items:center;
    padding:3px 9px;border-radius:999px;
    font-size:10.5px;font-weight:800;
    letter-spacing:.05em;text-transform:uppercase;
    background:var(--green-soft);color:var(--green);
    line-height:1.3;
  }
  .pill.pending,.pill.new,.pill.open,.pill.processing,.pill.preparing,.pill.in-progress{background:var(--amber-soft);color:var(--amber)}
  .pill.cancelled,.pill.rejected,.pill.failed,.pill.declined{background:var(--red-soft);color:var(--red)}
  .pill.delivered,.pill.paid,.pill.completed,.pill.confirmed,.pill.accepted{background:var(--green-soft);color:var(--green)}
  .pill.unknown,.pill.neutral{background:#F0F1F4;color:var(--muted)}

  /* Item list */
  .item-list{
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .item-row{
    display:flex;
    align-items:flex-start;
    gap:8px;
    padding:6px 0;
    border-bottom:1px solid var(--line-2);
    font-size:13px;
  }
  .item-row:last-child{border-bottom:0;padding-bottom:0}
  .item-row:first-child{padding-top:0}
  .item-row .ibullet{
    width:6px;height:6px;border-radius:50%;
    background:var(--orange);
    flex:0 0 auto;
    margin-top:7px;
  }
  .item-row .iname{
    color:var(--ink-2);
    font-weight:650;
    min-width:0;
    word-break:break-word;
    line-height:1.4;
  }

  /* Action row */
  .action-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
    margin-top:14px;
  }
  .action-row .btn{
    height:48px;
    border-radius:12px;
    font-size:14px;
    font-weight:750;
    border:0;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    -webkit-tap-highlight-color:transparent;
    transition:transform .1s ease,background .15s;
    letter-spacing:-.005em;
  }
  .action-row .btn:active{transform:scale(.98)}
  .btn-primary{
    grid-column:1 / -1;
    background:linear-gradient(145deg,var(--orange-2),var(--orange));
    color:#fff;
    box-shadow:0 6px 18px -6px rgba(255,90,31,.5);
  }
  .btn-primary:active{background:var(--orange)}
  .btn-ghost{
    background:#F4F5F7;
    border:1px solid var(--line)!important;
    color:var(--ink-2);
  }
  .btn-ghost:active{background:#EBEDF0}

  /* ============ PAGER ============ */
  .pager{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    margin-top:14px;
  }
  .pager button{
    min-width:44px;
    height:40px;
    padding:0 14px;
    border:1px solid var(--line);
    background:#fff;
    border-radius:11px;
    font-size:13px;
    font-weight:750;
    color:var(--ink-2);
    -webkit-tap-highlight-color:transparent;
  }
  .pager button:active{background:#F4F5F7}
  .pager button[disabled]{opacity:.35;pointer-events:none}
  .pager .page-info{
    font-size:13px;
    font-weight:750;
    color:var(--muted);
    padding:0 6px;
  }

  /* ============ EMPTY ============ */
  .empty-note{
    font-size:12.5px;
    color:var(--faint);
    text-align:center;
    padding:22px 16px;
    border:1.5px dashed #DCE0E6;
    border-radius:11px;
    background:#FAFBFC;
    line-height:1.55;
  }
  .empty-note b{color:var(--ink-2);font-weight:750}

  /* ============ BLOCKED ============ */
  .blocked-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:22px 18px;
    text-align:center;
    box-shadow:0 1px 2px rgba(20,20,25,.03);
  }
  .blocked-card h2{
    margin:0 0 8px;
    font-size:18px;font-weight:800;
    letter-spacing:-.02em;
    color:var(--ink);
  }
  .blocked-card p{
    margin:0 0 16px;
    font-size:13.5px;
    line-height:1.55;
    color:var(--muted);
  }
  .blocked-card a{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:100%;
    height:48px;
    border-radius:12px;
    font-size:14.5px;
    font-weight:750;
    text-decoration:none;
    margin-top:8px;
    background:linear-gradient(145deg,var(--orange-2),var(--orange));
    color:#fff;
    box-shadow:0 6px 18px -6px rgba(255,90,31,.5);
  }

  /* ============ TOAST ============ */
  .toast{
    position:fixed;left:50%;z-index:200;
    bottom:calc(28px + env(safe-area-inset-bottom));
    transform:translate(-50%,10px);
    background:var(--ink);color:#fff;
    font-size:13.5px;font-weight:650;
    padding:12px 18px;border-radius:999px;
    max-width:88vw;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    opacity:0;pointer-events:none;
    transition:opacity .2s ease,transform .2s ease;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body data-page="eatouts-orders">
<div id="shell">

  <header class="topbar">
    <div class="topbar-row">
      <a class="brand" href="index.html">
        <span class="mark">E</span>
        <span class="word">EatOuts</span>
      </a>
      <span class="hdr-chip">My orders</span>
    </div>
    <div class="progress">
      <div class="progress-top">
        <span class="progress-label">Order history</span>
        <span class="progress-count" id="progressCount">—</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>
  </header>

  <div class="scroll" id="scroll">
    <section class="intro" id="intro">
      <h1>Your <em>orders</em>.</h1>
      <p>Reorder, replay a split-share, or save a summary for later.</p>
    </section>
    <main class="sheet" id="app"></main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script src="js/eatouts-manager-db.js"></script>
<script src="assets/data/demo/the-food-place/demo-data.js"></script>
<script src="js/eatouts-manager-seed.js"></script>
<script src="js/eatouts-roles.js"></script>
<script src="js/eatouts-users.js"></script>
<script src="js/eatouts-feedback.js"></script>
<script src="js/eatouts-blog-admin.js"></script>
<script src="js/eatouts-auth.js"></script>
<script src="js/eatouts-manager.js"></script>
<script src="js/eatouts-audit.js"></script>
<script src="js/eatouts-customer.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {

  /* ---- Auth guard (unchanged) ---- */
  if (!EO.guard({"roles": ["customer"]})) return;

  var S = window.EatoutsCustomer;

  /* ============================================================
     HELPERS
     ============================================================ */
  function esc(v){
    return String(v == null ? "" : v)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }
  function escapeAttr(v){ return esc(v).replace(/`/g,"&#96;"); }
  function cssEscape(s){ return String(s).replace(/["\\]/g, '\\$&'); }

  var toastEl = document.getElementById("toast");
  var toastTimer = null;
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove("show"); }, 2000);
  }

  /* ---- Data accessors (mirror original) ---- */
  function itemsOf(o){ return (o.items || []).map(String); }
  function nameOf(o){ return (o.restaurant && o.restaurant.name) || ""; }
  function logoOf(o){ return (o.restaurant && o.restaurant.logo) || ""; }
  function phoneOf(o){
    var w = (o.restaurant && o.restaurant.whatsapp) || "";
    return EO.phoneIntl ? EO.phoneIntl(w) : String(w).replace(/[^0-9]/g, "");
  }
  function buildMsg(o, split){
    var l = ["Hello" + (nameOf(o) ? " " + nameOf(o) : "") + "!"];
    l.push(split
      ? "Splitting the bill with friends for my order " + o.id + ":"
      : "I would like to reorder " + o.id + ":");
    itemsOf(o).forEach(function(x){ l.push(" - " + x); });
    l.push("Total: " + EO.money(o.total));
    if (o.created) l.push("Original order: " + o.created);
    return l.join("\n");
  }

  function statusKey(s){
    return String(s || "unknown").toLowerCase().trim().replace(/\s+/g, "-");
  }
  function statusDotClass(s){
    var v = statusKey(s);
    if (/deliver|paid|complete|confirm|accept/.test(v)) return "green";
    if (/pending|process|prepar|new|open/.test(v))      return "warn";
    if (/cancel|reject|fail|declin/.test(v))            return "red";
    if (!s)                                             return "off";
    return "";
  }
  function statusPill(s){
    if (!s) return "";
    return '<span class="pill ' + escapeAttr(statusKey(s)) + '">' + esc(s) + '</span>';
  }

  /* ============================================================
     ACCORDION STATE
     ============================================================ */
  var OPEN = null;   /* only one open at a time */
  var PAGE_SIZE = 25;

  /* ============================================================
     PAGINATION STATE
     ============================================================ */
  var state = { page: 1 };

  /* ============================================================
     RENDER — section builders
     ============================================================ */
  function orderBodyHTML(o){
    var items = itemsOf(o);
    var itemsHTML = items.length
      ? '<div class="item-list">' +
          items.slice(0, 12).map(function(it){
            return '<div class="item-row">' +
              '<span class="ibullet"></span>' +
              '<span class="iname">' + esc(it) + '</span>' +
            '</div>';
          }).join('') +
          (items.length > 12
            ? '<div class="item-row"><span class="ibullet" style="background:#D3D7DE"></span><span class="iname" style="color:var(--faint);font-weight:550">+' + (items.length - 12) + ' more item(s)</span></div>'
            : '') +
        '</div>'
      : '<p style="font-size:13px;color:var(--faint);margin:0;font-weight:550">No items in this order.</p>';

    return '<div class="module">' +
      '<div class="info-block">' +
        '<h4>Order details</h4>' +
        '<div class="def-row"><span class="k">Order ID</span><span class="v">' + esc(o.id || '—') + '</span></div>' +
        '<div class="def-row"><span class="k">Placed</span><span class="v">' + esc(o.created || '—') + '</span></div>' +
        '<div class="def-row"><span class="k">Items</span><span class="v">' + items.length + '</span></div>' +
        (o.status ? '<div class="def-row"><span class="k">Status</span><span class="v">' + statusPill(o.status) + '</span></div>' : '') +
        '<div class="def-row"><span class="k">Total</span><span class="v total">' + esc(EO.money(o.total || 0)) + '</span></div>' +
      '</div>' +
      '<div class="info-block">' +
        '<h4>Items</h4>' +
        itemsHTML +
      '</div>' +
      '<div class="action-row">' +
        '<button class="btn btn-primary" type="button" data-reorder="' + escapeAttr(o.id) + '">Reorder on WhatsApp</button>' +
        '<button class="btn btn-ghost" type="button" data-replay="' + escapeAttr(o.id) + '">Replay split</button>' +
        '<button class="btn btn-ghost" type="button" data-save="' + escapeAttr(o.id) + '">Save Summary</button>' +
      '</div>' +
    '</div>';
  }

  function orderSection(o){
    var id     = String(o.id || "");
    var name   = nameOf(o) || id || "Order";
    var logo   = logoOf(o);
    var items  = itemsOf(o);
    var isOpen = OPEN === id;
    var total  = EO.money(o.total || 0);

    var thumbInner = logo
      ? '<img src="' + escapeAttr(logo) + '" alt="">'
      : esc((name || "E").slice(0, 1).toUpperCase());

    var thumbCls = "ord-thumb" + (logo ? "" : " plain");

    var sub =
      '<span>' + esc(o.created || "—") + '</span>' +
      '<span class="dotsep">·</span>' +
      '<span>' + items.length + ' item' + (items.length === 1 ? "" : "s") + '</span>';

    var totalBadge = '<span class="acc-total">' + esc(total) + '</span>';

    var dotCls = statusDotClass(o.status);

    return '<section class="acc' + (isOpen ? ' open' : '') + '" data-key="' + escapeAttr(id) + '">' +
      '<button class="acc-head" type="button" aria-expanded="' + (isOpen ? 'true' : 'false') + '">' +
        '<span class="' + thumbCls + '">' + thumbInner + '</span>' +
        '<span class="acc-title">' +
          '<b>' + esc(name) + '</b>' +
          '<span class="acc-sub">' + sub + '</span>' +
          totalBadge +
        '</span>' +
        '<span class="acc-right">' +
          '<span class="vis-dot ' + dotCls + '"></span>' +
        '</span>' +
      '</button>' +
      '<div class="acc-body">' +
        '<div class="acc-inner">' + orderBodyHTML(o) + '</div>' +
      '</div>' +
    '</section>';
  }

  /* ============================================================
     META CARD
     ============================================================ */
  function renderMeta(){
    var all     = EatoutsMgrDB.collection("orders") || [];
    var total   = all.length;
    var spend   = all.reduce(function(sum, o){ return sum + Number(o.total || 0); }, 0);
    var venues  = {};
    all.forEach(function(o){
      var n = nameOf(o);
      if (n) venues[n] = true;
    });
    var venueCount = Object.keys(venues).length;

    var dotClass, msg;
    if (total === 0){
      dotClass = "warn";
      msg = "No orders yet";
    } else {
      dotClass = "green";
      msg = "<b>" + total + "</b> order" + (total === 1 ? "" : "s") +
            " · <b>" + esc(EO.money(spend)) + "</b> total spend";
    }

    return '<div class="meta-card">' +
      '<div class="meta-row">' +
        '<span class="meta-dot ' + dotClass + '"></span>' +
        '<span class="meta-text">' + msg + '</span>' +
      '</div>' +
      '<div class="meta-stats">' +
        '<div class="stat"><b>' + total + '</b><span>Orders</span></div>' +
        '<div class="stat"><b>' + esc(EO.money(spend)) + '</b><span>Spent</span></div>' +
        '<div class="stat"><b>' + venueCount + '</b><span>Venues</span></div>' +
      '</div>' +
    '</div>';
  }

  function updateProgress(){
    var all = EatoutsMgrDB.collection("orders") || [];
    var total = all.length;
    var pct = total ? Math.min(100, Math.round((total / 10) * 100)) : 0;
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('progressCount').textContent =
      total + ' order' + (total === 1 ? '' : 's') + ' on file';
  }

  /* ============================================================
     PAGER
     ============================================================ */
  function renderPager(st){
    if (st.pages <= 1) return "";
    return '<div class="pager">' +
      '<button type="button" data-page="' + (st.page - 1) + '"' + (st.page <= 1 ? ' disabled' : '') + '>Prev</button>' +
      '<span class="page-info">Page ' + st.page + ' / ' + st.pages + '</span>' +
      '<button type="button" data-page="' + (st.page + 1) + '"' + (st.page >= st.pages ? ' disabled' : '') + '>Next</button>' +
    '</div>';
  }

  /* ============================================================
     MAIN RENDER
     ============================================================ */
  var mount = document.getElementById('app');

  function render(){
    var all = (EatoutsMgrDB.collection("orders") || [])
      .slice()
      .sort(function(a, b){
        return String(b.created || "").localeCompare(String(a.created || ""));
      });

    var total = all.length;

    /* Empty state */
    if (total === 0){
      mount.innerHTML =
        renderMeta() +
        '<div class="empty-note">No orders yet.<br><b>Orders you send through WhatsApp</b> appear here.</div>';
      updateProgress();
      return;
    }

    /* Paginate */
    var pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
    if (state.page > pages) state.page = pages;
    if (state.page < 1)     state.page = 1;
    var start = (state.page - 1) * PAGE_SIZE;
    var rows = all.slice(start, start + PAGE_SIZE);

    var sections = rows.map(orderSection).join('');

    mount.innerHTML =
      renderMeta() +
      '<div class="stack">' + sections + '</div>' +
      renderPager({ page: state.page, pages: pages, total: total });

    updateProgress();
  }

  /* ============================================================
     ACCORDION BEHAVIOUR — only one open at a time
     ============================================================ */
  function toggleAccordion(key){
    OPEN = (OPEN === key) ? null : key;
    var accs = mount.querySelectorAll('.acc');
    for (var i = 0; i < accs.length; i++){
      var acc = accs[i];
      var isOpen = acc.getAttribute('data-key') === OPEN;
      acc.classList.toggle('open', isOpen);
      var head = acc.querySelector('.acc-head');
      if (head) head.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    }
    if (OPEN){
      var opened = mount.querySelector('.acc[data-key="' + cssEscape(OPEN) + '"]');
      if (opened){
        setTimeout(function(){
          try { opened.scrollIntoView({ behavior:'smooth', block:'start' }); } catch (e) {}
        }, 320);
      }
    }
  }

  /* ============================================================
     DELEGATED CLICKS
     ============================================================ */
  mount.addEventListener('click', function(e){

    /* pager */
    var pg = e.target.closest('[data-page]');
    if (pg){
      e.stopPropagation();
      var n = parseInt(pg.getAttribute('data-page'), 10);
      if (!isNaN(n) && n >= 1){
        state.page = n;
        OPEN = null;
        render();
        var sc = document.getElementById('scroll');
        if (sc) sc.scrollTop = 0;
      }
      return;
    }

    /* save summary */
    var save = e.target.closest('[data-save]');
    if (save){
      e.stopPropagation();
      var o = EatoutsMgrDB.find("orders", save.getAttribute('data-save'));
      if (!o || !S) return;
      try {
        S.summaries.add({
          orderRef:  o.id,
          venueName: nameOf(o),
          venueLogo: logoOf(o),
          itemCount: itemsOf(o).length,
          total:     o.total,
          source:    "order",
          payload: {
            items:     itemsOf(o),
            total:     o.total,
            venueName: nameOf(o)
          }
        });
        toast("Summary saved");
      } catch (err) {
        toast("Could not save summary");
      }
      return;
    }

    /* reorder or replay */
    var btn = e.target.closest('[data-reorder],[data-replay]');
    if (btn){
      e.stopPropagation();
      var id = btn.getAttribute('data-reorder') || btn.getAttribute('data-replay');
      var ord = EatoutsMgrDB.find("orders", id);
      if (!ord) return;

      var ph = phoneOf(ord);
      if (!ph){ toast("No venue contact saved for this order"); return; }

      var split = !btn.hasAttribute('data-reorder');
      window.open("https://wa.me/" + ph + "?text=" + encodeURIComponent(buildMsg(ord, split)), "_blank");

      if (window.EatoutsAudit && window.EatoutsAudit.log){
        try {
          EatoutsAudit.log(split ? "order.replay" : "order.reorder", id, null,
            { id: id, venue: nameOf(ord) });
        } catch (_) {}
      }
      return;
    }

    /* accordion header (last, so inner buttons still work) */
    var head = e.target.closest('.acc-head');
    if (head){
      var acc = head.closest('.acc');
      if (acc) toggleAccordion(acc.getAttribute('data-key'));
      return;
    }
  });

  /* ============================================================
     BOOT
     ============================================================ */
  render();

  /* live updates if customer store changes */
  if (S && typeof S.onChange === "function"){
    try { S.onChange(render); } catch (e) {}
  }
});
</script>
</body>
</html>
