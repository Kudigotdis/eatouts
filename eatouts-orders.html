<!doctype html>
<!-- PAGE: My orders --><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#ffffff"><title>My orders · EatOuts</title><link rel="stylesheet" href="assets/eatouts-manager.css"><style>.ocard{display:flex;align-items:center;gap:12px}.ologo{width:90px;height:90px;border-radius:12px;overflow:hidden;flex:0 0 auto;background:#f4efe4;display:flex;align-items:center;justify-content:center}.ologo img{width:100%;height:100%;object-fit:cover;display:block}.ologo.fallback{font-size:30px;font-weight:900;color:#a89a7e}</style></head><body data-page="eatouts-orders"><div id="mount"></div><script src="js/eatouts-manager-db.js"></script><script src="assets/data/demo/the-food-place/demo-data.js"></script><script src="js/eatouts-manager-seed.js"></script><script src="js/eatouts-roles.js"></script><script src="js/eatouts-users.js"></script><script src="js/eatouts-feedback.js"></script><script src="js/eatouts-blog-admin.js"></script><script src="js/eatouts-auth.js"></script><script src="js/eatouts-manager.js"></script><script src="js/eatouts-audit.js"></script><script src="js/eatouts-customer.js"></script><script>document.addEventListener("DOMContentLoaded",()=>{
 if(!EO.guard({"roles":["customer"]}))return;
 const S=window.EatoutsCustomer;
 const state={page:1};
 const itemsOf=o=>(o.items||[]).map(String);
 const nameOf=o=>((o.restaurant&&o.restaurant.name)||"");
 function phoneOf(o){let w=(o.restaurant&&o.restaurant.whatsapp)||"";return EO.phoneIntl?EO.phoneIntl(w):String(w).replace(/[^0-9]/g,"")}
 function buildMsg(o,split){const l=["Hello"+(nameOf(o)?" "+nameOf(o):"")+"!"];l.push(split?"Splitting the bill with friends for my order "+o.id+":":"I would like to reorder "+o.id+":");itemsOf(o).forEach(x=>l.push(" - "+x));l.push("Total: "+EO.money(o.total));if(o.created)l.push("Original order: "+o.created);return l.join("\n")}
 function logoOf(o){return (o.restaurant&&o.restaurant.logo)||"";}
 function card(x){
  const logo=logoOf(x);
  return `<article class="card"><div class="ocard"><div class="ologo${logo?"":" fallback"}">${logo?('<img src="'+EO.esc(logo)+'" alt="">'):EO.esc((nameOf(x)||"E").slice(0,1))}</div><div class="listmain"><strong>${EO.esc(nameOf(x)||x.id)}</strong><small>${EO.esc(x.created||"")} · ${itemsOf(x).length} item(s) · ${EO.money(x.total)}</small></div>${EO.status(x.status)}</div><div class="actions"><button class="btn primary" data-reorder="${EO.esc(x.id)}">Reorder</button><button class="btn" data-replay="${EO.esc(x.id)}">Replay split</button><button class="btn" data-save="${EO.esc(x.id)}">Save Summary</button></div></article>`;
 }
 function render(){
  const all=EO.page(EatoutsMgrDB.collection("orders").slice().sort((a,b)=>String(b.created||"").localeCompare(String(a.created||""))),state.page,25);
  document.querySelector("#orders").innerHTML=all.rows.length?all.rows.map(card).join(""):EO.empty("No orders yet","Orders you send through WhatsApp appear here.");
  document.querySelector("#orderpager").innerHTML=EO.pager?EO.pager(all,"data-page"):"";
 }
 document.querySelector("#mount").innerHTML=EO.shell("My orders","Order history, reorder, split-share replay and save summaries",`<div id="orders"></div><div id="orderpager"></div>`,{section:"Customer"});
 document.querySelector("#orders").addEventListener("click",e=>{
  const save=e.target.closest("[data-save]");
  if(save){const o=EatoutsMgrDB.find("orders",save.dataset.save);if(!o||!S)return;
   S.summaries.add({orderRef:o.id,venueName:nameOf(o),venueLogo:logoOf(o),itemCount:itemsOf(o).length,total:o.total,source:"order",payload:{items:itemsOf(o),total:o.total,venueName:nameOf(o)}});
   EO.toast("Summary saved");return;
  }
  const btn=e.target.closest("[data-reorder],[data-replay]");if(!btn)return;
  const id=btn.dataset.reorder||btn.dataset.replay;const o=EatoutsMgrDB.find("orders",id);if(!o)return;
  const ph=phoneOf(o);if(!ph){EO.toast("No venue contact saved for this order");return}
  const split=!btn.dataset.reorder;
  window.open("https://wa.me/"+ph+"?text="+encodeURIComponent(buildMsg(o,split)),"_blank");
  if(window.EatoutsAudit&&window.EatoutsAudit.log)EatoutsAudit.log(split?"order.replay":"order.reorder",id,null,{id:id,venue:nameOf(o)});
 });
 document.querySelector("#orderpager").addEventListener("click",e=>{const b=e.target.closest("[data-page]");if(!b)return;state.page=parseInt(b.dataset.page,10)||1;render();});
 render();
});</script></body></html>
