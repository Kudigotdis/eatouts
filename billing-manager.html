<!doctype html>
<!-- PAGE: Billing manager --><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#ffffff"><title>Billing manager · EatOuts</title><link rel="stylesheet" href="assets/eatouts-manager.css"></head><body data-page="billing-manager"><div id="mount"></div><script src="js/eatouts-manager-db.js"></script><script src="assets/data/demo/the-food-place/demo-data.js"></script><script src="js/eatouts-manager-seed.js"></script><script src="js/eatouts-roles.js"></script><script src="js/eatouts-users.js"></script><script src="js/eatouts-feedback.js"></script><script src="js/eatouts-blog-admin.js"></script><script src="js/eatouts-auth.js"></script><script src="js/eatouts-manager.js"></script><script src="js/eatouts-audit.js"></script><script>document.addEventListener("DOMContentLoaded",()=>{const u=EO.guard({});if(!u)throw new Error("guard");
const PRICE={setup:300,starter:100,growth:300,pro:500};try{const p=JSON.parse(localStorage.getItem("eatouts_db_v2")||"null");const s=p&&p.settings&&p.settings.pricing;if(s&&typeof s==="object"){PRICE.setup=Number(s.setup)||PRICE.setup;"starter"in s&&(PRICE.starter=Number(s.starter));"growth"in s&&(PRICE.growth=Number(s.growth));"pro"in s&&(PRICE.pro=Number(s.pro));}}catch(e){}
document.querySelector("#mount").innerHTML=EO.shell("Billing manager","Subscription, invoices, setup fee and payment method",`<div class="grid"><div class="metric"><span>Current tier</span><strong id="tier"></strong><small>Business subscription</small></div><div class="metric"><span>Setup fee</span><strong id="setup"></strong><small>One-time onboarding</small></div></div><div class="card"><div class="card-title">Change tier</div><div class="choice-grid"><button class="choice" data-tier="Starter"><strong>Starter</strong><small>P${PRICE.starter} / month</small></button><button class="choice" data-tier="Growth"><strong>Growth</strong><small>P${PRICE.growth} / month</small></button><button class="choice" data-tier="Pro"><strong>Pro</strong><small>P${PRICE.pro} / month</small></button></div></div><div class="card"><div class="card-title">Invoice history</div><div id="inv"></div></div>`,{section:"Manager"});
const b=EO.business();document.querySelector("#tier").textContent=b.subscription||"Starter";document.querySelector("#setup").textContent="P"+PRICE.setup+(b.setupPaid||(b.billing&&b.billing.setupPaidAt)?" saved":" pending");document.querySelector("#inv").innerHTML=EatoutsMgrDB.filter("invoices",x=>x.businessId===b.id).map(x=>`<div class="listrow"><div class="listmain"><strong>${EO.esc(x.id)}</strong><small>${EO.esc(x.date)} · ${EO.money(x.amount)}</small></div>${EO.status(x.status)}</div>`).join("")||'<div class="empty">No invoices yet.</div>';document.querySelectorAll("[data-tier]").forEach(x=>x.onclick=()=>{const before={id:b.id,subscription:b.subscription};b.subscription=x.dataset.tier;EatoutsMgrDB.save();document.querySelector("#tier").textContent=b.subscription;if(window.EatoutsAudit&&window.EatoutsAudit.log)EatoutsAudit.log("billing.tier.changed",b.id,before,{id:b.id,subscription:b.subscription},{businessId:b.id,tier:x.dataset.tier});EO.toast("Tier changed to "+x.dataset.tier)});});</script></body></html>
