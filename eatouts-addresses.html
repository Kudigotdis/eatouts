<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#ffffff"><title>Addresses · EatOuts</title><link rel="stylesheet" href="assets/eatouts-manager.css"><style>.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:520px){.two{grid-template-columns:1fr}}</style></head><body><div id="mount"></div><script src="js/eatouts-manager-db.js"></script><script src="assets/data/demo/the-food-place/demo-data.js"></script><script src="js/eatouts-manager-seed.js"></script><script src="js/eatouts-roles.js"></script><script src="js/eatouts-users.js"></script><script src="js/eatouts-feedback.js"></script><script src="js/eatouts-blog-admin.js"></script><script src="js/eatouts-auth.js"></script><script src="botswana_locations.js"></script><script src="js/eatouts-locations.js"></script><script src="js/eatouts-audit.js"></script><script src="js/eatouts-manager.js"></script><script>document.addEventListener("DOMContentLoaded",()=>{
  if(!EO.guard({"roles":["customer"]}))return;
  const L=window.EatoutsLocations;const u=EO.currentUser();
  let editing=null;
  function opts(list,cur,ph){const o=[{value:'',label:ph}].concat(list||[]);if(cur&&!o.some(x=>String(x.value)===String(cur)))o.splice(1,0,{value:cur,label:cur});return o;}
  document.querySelector("#mount").innerHTML=EO.shell("Addresses","Address book for delivery auto-fill",`<div class="actions" style="margin-bottom:10px"><button class="btn primary" id="add">Add address</button></div><div id="form" class="card" hidden></div><div id="a" class="card"></div>`,{section:"Customer"});
  function render(){
    const a=EatoutsMgrDB.collection("addresses").filter(x=>x.userId===u.id);
    document.querySelector("#a").innerHTML='<div class="card-title">Saved addresses</div>'+(a.length?a.map(x=>`<div class="listrow"><div class="listmain"><strong>${EO.esc(x.label)}</strong><small>${EO.esc(x.address)} · ${EO.esc(x.contact||'')}</small></div><div class="actions" style="gap:8px"><button class="btn" data-edit="${x.id}">Edit</button><button class="btn danger" data-del="${x.id}">Delete</button></div></div>`).join(""):"<div class='empty'>No saved addresses.</div>");
  }
  function renderForm(addr){
    const f=document.querySelector("#form");
    if(!L){f.innerHTML="<div class='empty'>Location data unavailable.</div>";return}
    editing=addr||null;
    f.innerHTML=`<div class="card-title">${editing?"Edit address":"New address"}</div><label class="field"><span>Label</span><input id="ad-label" value="${EO.esc(editing?editing.label:'Home')}"></label><div class="two"><label class="field"><span>District</span><select id="ad-district">${opts(L.districtOptions(),editing?editing.district:'','— Select district —').map(o=>`<option value="${EO.esc(o.value)}">${EO.esc(o.label)}</option>`).join('')}</select></label><label class="field"><span>Town / city</span><select id="ad-town"><option value="">— Select town —</option></select></label></div><div class="two"><label class="field"><span>Area</span><select id="ad-area"><option value="">— Select area —</option></select></label><label class="field"><span>Street / plot</span><input id="ad-street" value="${EO.esc(editing?editing.street||'':'')}"></label></div><label class="field"><span>Delivery contact</span><input id="ad-contact" value="${EO.esc(editing?(editing.contact||''):(u.whatsapp||''))}"></label><div class="actions"><button class="btn primary" id="ad-save">${editing?"Save changes":"Save address"}</button><button class="btn" id="ad-cancel">Cancel</button></div>`;
    const d=f.querySelector('#ad-district'),t=f.querySelector('#ad-town'),a=f.querySelector('#ad-area');
    function fillTowns(){t.innerHTML=opts(L.townOptions(d.value),editing?editing.town:'','— Select town —').map(x=>`<option value="${EO.esc(x.value)}">${EO.esc(x.label)}</option>`).join('');fillAreas()}
    function fillAreas(){a.innerHTML=opts(L.areaOptions(d.value,t.value),editing?editing.area:'','— Select area —').map(x=>`<option value="${EO.esc(x.value)}">${EO.esc(x.label)}</option>`).join('')}
    d.onchange=()=>{if(editing){editing.town='';editing.area=''}fillTowns()};t.onchange=()=>{if(editing)editing.area='';fillAreas()};
    if(editing){d.value=editing.district||'';fillTowns();t.value=editing.town||'';fillAreas();a.value=editing.area||'';}
    else fillTowns();
    f.hidden=false;
    f.querySelector('#ad-cancel').onclick=()=>{f.hidden=true;editing=null};
    f.querySelector('#ad-save').onclick=()=>{
      if(!d.value){EO.toast('Choose a district');return}
      if(!t.value){EO.toast('Choose a town');return}
      const dd=(L.allDistricts()||[]).find(x=>String(x.code)===String(d.value))||{};
      const street=f.querySelector('#ad-street').value.trim();
      const area=a.value==='Other / not listed'?'':a.value;
      const addr=[street,area,t.value,dd.name].filter(Boolean).join(', ');
      const isEdit=!!editing;
      const id=isEdit?editing.id:"AD-"+Date.now();
      const before=isEdit?EatoutsMgrDB.find("addresses",id):null;
      EatoutsMgrDB.upsert("addresses",{id:id,userId:u.id,label:f.querySelector('#ad-label').value.trim()||"Address",district:d.value,districtName:dd.name||'',town:t.value,area,street,address:addr,contact:f.querySelector('#ad-contact').value.trim()});
      if(window.EatoutsAudit)try{EatoutsAudit.log(isEdit?"address.edit":"address.create",id,{label:f.querySelector('#ad-label').value.trim(),address:addr},before?{label:before.label,address:before.address}:null)}catch(_){}
      f.hidden=true;editing=null;render();
      EO.toast(isEdit?'Address updated':'Address saved');
    }
  }
  document.querySelector("#add").onclick=()=>{renderForm(null)};
  document.querySelector("#a").onclick=e=>{
    const ed=e.target.dataset.edit;
    if(ed){const a=EatoutsMgrDB.find("addresses",ed);if(a)renderForm(a);return}
    const id=e.target.dataset.del;if(!id)return;
    if(!EO.confirm("Delete this saved address?"))return;
    const before=EatoutsMgrDB.find("addresses",id);
    EatoutsMgrDB.remove("addresses",id);
    if(window.EatoutsAudit)try{EatoutsAudit.log("address.delete",id,before?{label:before.label,address:before.address}:null,null)}catch(_){}
    render();
  };
  render();
});</script></body></html>
