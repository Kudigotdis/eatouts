<!doctype html>
<!-- PAGE: My profile -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#141418">
<title>My profile · EatOuts</title>
<style>
  *,*::before,*::after{box-sizing:border-box}
  :root{
    --ink:#0F0F12;
    --ink-2:#2A2A30;
    --ink-3:#4A4A52;
    --paper:#F4F5F7;
    --card:#FFFFFF;
    --line:#E6E8EC;
    --line-2:#F0F1F4;
    --orange:#FF5A1F;
    --orange-2:#FF7A42;
    --orange-soft:#FFEDE4;
    --orange-line:#FFD5C2;
    --green:#16A34A;
    --green-soft:#E7F7EE;
    --red:#DC2626;
    --red-soft:#FEE2E2;
    --amber:#B45309;
    --amber-soft:#FEF3C7;
    --blue:#0284C7;
    --blue-soft:#E0F2FE;
    --muted:#6B7280;
    --faint:#9AA1AC;
  }
  html,body{height:100%}
  body{
    margin:0;
    background:#E9EBEF;
    color:var(--ink);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:15px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;
    display:flex;
    justify-content:center;
  }
  button,input,select,textarea{font-family:inherit}
  button{cursor:pointer}

  #shell{
    width:100%;
    max-width:460px;
    height:100vh;
    height:100dvh;
    background:var(--paper);
    display:flex;
    flex-direction:column;
    overflow:hidden;
    position:relative;
    box-shadow:0 0 70px rgba(20,20,25,.16);
  }

  /* ============ TOPBAR ============ */
  .topbar{
    flex:0 0 auto;
    background:#141418;
    padding:calc(13px + env(safe-area-inset-top)) 18px 14px;
    position:relative;
    z-index:10;
  }
  .topbar-row{
    display:flex;align-items:center;gap:10px;
    padding-bottom:13px;
  }
  .brand{
    display:inline-flex;align-items:center;gap:9px;
    text-decoration:none;
  }
  .brand .mark{
    width:28px;height:28px;flex:0 0 auto;border-radius:8px;
    background:linear-gradient(145deg,var(--orange-2),var(--orange));
    color:#fff;
    display:grid;place-items:center;
    font-size:14px;font-weight:900;letter-spacing:-.03em;
    box-shadow:0 2px 10px rgba(255,90,31,.35);
  }
  .brand .word{
    color:#fff;font-size:15px;font-weight:800;
    letter-spacing:-.02em;
  }
  .hdr-chip{
    margin-left:auto;
    font-size:10px;font-weight:800;
    letter-spacing:.12em;text-transform:uppercase;
    color:var(--orange-2);
    border:1px solid rgba(255,122,66,.32);
    background:rgba(255,90,31,.1);
    border-radius:999px;
    padding:5px 11px;
    white-space:nowrap;
  }

  .progress{padding-bottom:2px}
  .progress-top{
    display:flex;align-items:baseline;justify-content:space-between;
    gap:10px;margin-bottom:8px;
  }
  .progress-label{
    font-size:11px;font-weight:800;
    letter-spacing:.14em;text-transform:uppercase;
    color:rgba(255,255,255,.5);
  }
  .progress-count{
    font-size:11.5px;font-weight:800;
    color:var(--orange-2);
    letter-spacing:.02em;
  }
  .progress-track{
    height:5px;border-radius:99px;
    background:rgba(255,255,255,.13);
    overflow:hidden;
  }
  .progress-fill{
    height:100%;width:0%;
    border-radius:99px;
    background:linear-gradient(90deg,var(--orange),var(--orange-2));
    transition:width .35s cubic-bezier(.4,0,.2,1);
  }

  /* ============ SCROLL ============ */
  .scroll{
    flex:1 1 auto;min-height:0;
    overflow-y:auto;
    overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
    scrollbar-width:none;
  }
  .scroll::-webkit-scrollbar{display:none}

  /* ============ INTRO ============ */
  .intro{
    background:linear-gradient(175deg,#141418 0%,#1B1B21 60%,#232329 100%);
    padding:4px 22px 46px;
    position:relative;
    overflow:hidden;
    text-align:center;
  }
  .intro::after{
    content:"";
    position:absolute;
    top:-80px;right:-80px;
    width:230px;height:230px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,90,31,.2),transparent 68%);
    pointer-events:none;
  }
  .intro h1{
    position:relative;
    margin:0 auto 12px;
    font-size:26px;
    line-height:1.15;
    font-weight:800;
    letter-spacing:-.03em;
    color:#fff;
    max-width:15ch;
  }
  .intro h1 em{font-style:normal;color:var(--orange-2)}
  .intro p{
    position:relative;
    margin:0 auto;
    font-size:14px;
    line-height:1.6;
    color:rgba(255,255,255,.6);
    max-width:32ch;
  }

  /* ============ SHEET ============ */
  .sheet{
    position:relative;
    z-index:1;
    margin-top:-26px;
    background:var(--paper);
    border-radius:26px 26px 0 0;
    padding:20px 14px 30px;
    min-height:60vh;
  }

  /* ============ META CARD ============ */
  .meta-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:15px 16px;
    margin-bottom:12px;
    box-shadow:0 1px 2px rgba(20,20,25,.03);
  }
  .meta-row{
    display:flex;align-items:center;gap:10px;
    margin-bottom:11px;
  }
  .meta-dot{
    width:9px;height:9px;border-radius:50%;flex:0 0 auto;
    background:var(--orange);
    box-shadow:0 0 0 3px var(--orange-soft);
  }
  .meta-dot.green{background:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
  .meta-dot.warn{background:var(--amber);box-shadow:0 0 0 3px var(--amber-soft)}
  .meta-dot.red{background:var(--red);box-shadow:0 0 0 3px var(--red-soft)}
  .meta-text{
    font-size:13.5px;
    color:var(--ink-2);
    line-height:1.4;
    min-width:0;
    flex:1 1 auto;
  }
  .meta-text b{color:var(--ink);font-weight:750}
  .meta-stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    padding-top:11px;
    border-top:1px solid var(--line-2);
  }
  .stat{text-align:center}
  .stat b{
    display:block;
    font-size:19px;font-weight:850;
    letter-spacing:-.03em;
    color:var(--ink);
    line-height:1.1;
    font-variant-numeric:tabular-nums;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .stat span{
    display:block;
    margin-top:3px;
    font-size:9.5px;font-weight:800;
    letter-spacing:.1em;text-transform:uppercase;
    color:var(--faint);
  }

  /* ============ ACCORDION STACK ============ */
  .stack{display:flex;flex-direction:column;gap:10px}
  .acc{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    overflow:hidden;
    transition:border-color .2s ease,box-shadow .2s ease;
  }
  .acc.open{
    border-color:var(--orange-line);
    box-shadow:0 4px 18px -6px rgba(255,90,31,.22);
  }
  .acc-head{
    width:100%;
    display:flex;align-items:center;gap:12px;
    padding:13px 15px;
    background:transparent;border:0;
    text-align:left;
    -webkit-tap-highlight-color:transparent;
    transition:background .15s;
  }
  .acc-head:active{background:#FAFBFC}

  .sec-thumb{
    width:48px;height:48px;flex:0 0 auto;
    border-radius:11px;
    background:var(--orange-soft);
    color:var(--orange);
    display:grid;place-items:center;
    font-size:17px;font-weight:850;
    letter-spacing:-.02em;
    position:relative;
  }
  .sec-thumb.plain{
    background:#F0F1F4;color:var(--faint);
  }

  .acc-title{
    flex:1 1 auto;min-width:0;
    display:flex;flex-direction:column;gap:2px;
  }
  .acc-title b{
    font-size:15px;font-weight:750;
    letter-spacing:-.015em;
    color:var(--ink);
    line-height:1.25;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .acc-sub{
    font-size:11.5px;
    color:var(--faint);
    line-height:1.3;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    font-weight:550;
  }

  .vis-dot{
    width:9px;height:9px;border-radius:50%;flex:0 0 auto;
    background:var(--orange);
    box-shadow:0 0 0 3px var(--orange-soft);
  }
  .vis-dot.off{background:#D3D7DE;box-shadow:none}
  .vis-dot.green{background:var(--green);box-shadow:0 0 0 3px var(--green-soft)}

  .acc-body{
    display:grid;
    grid-template-rows:0fr;
    transition:grid-template-rows .32s cubic-bezier(.4,0,.2,1);
  }
  .acc.open .acc-body{grid-template-rows:1fr}
  .acc-inner{overflow:hidden;min-height:0}

  .module{padding:2px 15px 18px}

  .module-note{
    font-size:12.5px;
    line-height:1.5;
    color:var(--muted);
    margin:0 0 14px;
    padding:11px 12px;
    background:#FAFBFC;
    border:1px solid var(--line-2);
    border-radius:11px;
  }
  .module-note b{color:var(--ink);font-weight:750}

  /* ============ FORM FIELDS ============ */
  .field{margin-bottom:14px}
  .field:last-child{margin-bottom:0}
  .field > label{
    display:block;
    font-size:11.5px;font-weight:800;
    letter-spacing:.09em;text-transform:uppercase;
    color:var(--muted);
    margin-bottom:7px;
  }
  .field input,
  .field select,
  .field textarea{
    width:100%;
    border:1px solid var(--line);
    border-radius:11px;
    background:#fff;
    color:var(--ink);
    font-size:15px;
    line-height:1.4;
    padding:13px;
    outline:none;
    transition:border-color .15s,box-shadow .15s;
    -webkit-appearance:none;
    appearance:none;
    font-family:inherit;
  }
  .field textarea{min-height:90px;resize:vertical;line-height:1.55}
  .field input:focus,
  .field select:focus,
  .field textarea:focus{
    border-color:var(--orange);
    box-shadow:0 0 0 3px rgba(255,90,31,.13);
  }
  .field input::placeholder,
  .field textarea::placeholder{color:#B7BDC6}
  .field input[disabled]{
    background:#F4F5F7;
    color:var(--faint);
    cursor:not-allowed;
  }
  .field .hint{
    display:block;
    margin-top:6px;
    font-size:11.5px;
    color:var(--faint);
    line-height:1.45;
    font-weight:550;
  }

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:400px){.grid2{grid-template-columns:1fr}}

  /* ============ CHECK ROWS ============ */
  .check-row{
    display:flex;align-items:center;gap:12px;
    padding:14px 13px;
    border:1px solid var(--line);
    border-radius:12px;
    background:#fff;
    margin-bottom:8px;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    transition:background .15s,border-color .15s;
  }
  .check-row:last-child{margin-bottom:0}
  .check-row:active{background:#FAFBFC}
  .check-row input{
    width:20px;height:20px;
    accent-color:var(--orange);
    margin:0;flex:0 0 auto;
  }
  .check-body{
    flex:1 1 auto;min-width:0;
    display:flex;flex-direction:column;gap:2px;
  }
  .check-body b{
    font-size:13.5px;font-weight:750;
    letter-spacing:-.01em;
    color:var(--ink);
    line-height:1.3;
  }
  .check-body span{
    font-size:11.5px;
    color:var(--muted);
    line-height:1.4;
    font-weight:550;
  }

  /* ============ SAVE BUTTON ============ */
  .save-row{
    margin-top:16px;
    display:flex;
    gap:9px;
  }
  .save-row .btn{
    flex:1;
    height:52px;
    border-radius:13px;
    font-size:15px;
    font-weight:750;
    letter-spacing:-.01em;
    border:0;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    -webkit-tap-highlight-color:transparent;
    transition:transform .1s ease,background .15s;
  }
  .save-row .btn:active{transform:scale(.98)}
  .btn-save{
    background:linear-gradient(145deg,var(--orange-2),var(--orange));
    color:#fff;
    box-shadow:0 6px 18px -6px rgba(255,90,31,.5);
  }
  .btn-save:active{background:var(--orange)}
  .btn-save[disabled]{
    background:#E6E8EC;
    color:var(--faint);
    box-shadow:none;
    pointer-events:none;
  }

  /* ============ QUICK LINKS ============ */
  .quick-links{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-top:14px;
  }
  .quick-link{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    padding:14px 8px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:14px;
    text-decoration:none;
    color:var(--ink-2);
    font-size:11.5px;
    font-weight:750;
    letter-spacing:-.005em;
    text-align:center;
    -webkit-tap-highlight-color:transparent;
    transition:background .15s,border-color .15s;
  }
  .quick-link:active{background:var(--orange-soft);border-color:var(--orange-line)}
  .quick-link .ql-icon{
    width:32px;height:32px;
    border-radius:9px;
    background:var(--orange-soft);
    color:var(--orange);
    display:grid;place-items:center;
    font-size:14px;font-weight:850;
    letter-spacing:-.02em;
  }

  /* ============ EMPTY ============ */
  .empty-note{
    font-size:12.5px;
    color:var(--faint);
    text-align:center;
    padding:18px 14px;
    border:1.5px dashed #DCE0E6;
    border-radius:11px;
    background:#FAFBFC;
    line-height:1.5;
  }
  .empty-note b{color:var(--ink-2);font-weight:750}

  /* ============ BLOCKED ============ */
  .blocked-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:22px 18px;
    text-align:center;
    box-shadow:0 1px 2px rgba(20,20,25,.03);
  }
  .blocked-card h2{
    margin:0 0 8px;
    font-size:18px;font-weight:800;
    letter-spacing:-.02em;
    color:var(--ink);
  }
  .blocked-card p{
    margin:0 0 16px;
    font-size:13.5px;
    line-height:1.55;
    color:var(--muted);
  }
  .blocked-card a{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:100%;
    height:48px;
    border-radius:12px;
    font-size:14.5px;
    font-weight:750;
    text-decoration:none;
    margin-top:8px;
    background:linear-gradient(145deg,var(--orange-2),var(--orange));
    color:#fff;
    box-shadow:0 6px 18px -6px rgba(255,90,31,.5);
  }

  /* ============ TOAST ============ */
  .toast{
    position:fixed;left:50%;z-index:200;
    bottom:calc(28px + env(safe-area-inset-bottom));
    transform:translate(-50%,10px);
    background:var(--ink);color:#fff;
    font-size:13.5px;font-weight:650;
    padding:12px 18px;border-radius:999px;
    max-width:88vw;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    opacity:0;pointer-events:none;
    transition:opacity .2s ease,transform .2s ease;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body data-page="eatouts-profile">
<div id="shell">

  <header class="topbar">
    <div class="topbar-row">
      <a class="brand" href="index.html">
        <span class="mark">E</span>
        <span class="word">EatOuts</span>
      </a>
      <span class="hdr-chip">My profile</span>
    </div>
    <div class="progress">
      <div class="progress-top">
        <span class="progress-label">Profile completeness</span>
        <span class="progress-count" id="progressCount">—</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>
  </header>

  <div class="scroll" id="scroll">
    <section class="intro" id="intro">
      <h1>Your <em>profile</em>.</h1>
      <div style="display:flex;align-items:center;gap:16px;margin:16px 0 8px 0">
        <div id="avatarPreview" style="width:72px;height:72px;border-radius:50%;background:#e9edf2;display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid var(--line);font-size:28px;color:#9aa1ac">?</div>
        <div style="display:flex;flex-direction:column;gap:8px">
          <input type="file" id="avatarInput" accept="image/*" hidden>
          <button type="button" class="btn btn-ghost btn-sm" id="avatarBtn">Upload photo</button>
          <div class="hint">JPEG, PNG, WebP up to ~5MB</div>
        </div>
      </div>
      <p>Personal details, contacts, delivery defaults and notification preferences.</p>
    </section>
    <main class="sheet" id="app"></main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script src="js/eatouts-roles.js"></script>
<script src="js/eatouts-users.js"></script>
<script src="js/eatouts-feedback.js"></script>
<script src="js/eatouts-blog-admin.js"></script>
<script src="js/eatouts-auth.js"></script>
<script src="botswana_locations.js"></script>
<script src="js/eatouts-locations.js"></script>
<script src="js/eatouts-manager.js"></script>
<script src="js/eatouts-customer.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {

  /* ---- Auth guard (unchanged) ---- */
  if (!EO.guard({"roles": ["customer"]})) return;

  var L = window.EatoutsLocations;
  var u = EO.currentUser();

  /* ============================================================
     HELPERS
     ============================================================ */
  function esc(v){
    return String(v == null ? "" : v)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }
  function escapeAttr(v){ return esc(v).replace(/`/g,"&#96;"); }
  function cssEscape(s){ return String(s).replace(/["\\]/g, '\\$&'); }

  var toastEl = document.getElementById("toast");
  var toastTimer = null;
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove("show"); }, 2000);
  }

  /* Only one accordion open at a time; null = all closed */
  var OPEN = null;

  /* ---- Location option helpers (preserved) ---- */
  function optHtml(list){
    return (list || []).map(function(o){
      return '<option value="' + escapeAttr(o.value) + '">' + esc(o.label) + '</option>';
    }).join("");
  }
  function locOpts(list, cur, ph){
    var o = [{ value:"", label: ph }].concat(list || []);
    if (cur && !o.some(function(x){ return String(x.value) === String(cur); })){
      o.splice(1, 0, { value: cur, label: cur });
    }
    return o;
  }
  function districtCodeFor(v){
    if (!L) return "";
    var c = L.allDistricts().find(function(d){ return String(d.code) === String(v); });
    if (c) return c.code;
    var n = L.allDistricts().find(function(d){
      return String(d.name).toLowerCase() === String(v || "").toLowerCase();
    });
    return n ? n.code : "";
  }

  /* ============================================================
     WORKING STATE — profile edits are held in memory
     ============================================================ */
  var working = {
    firstName: u.firstName || "",
    surname:   u.surname   || "",
    dob:       u.dob       || "",
    gender:    u.gender    || "Prefer not to say",
    bio:       u.bio       || "",
    contacts:  Array.isArray(u.contacts) ? u.contacts.slice() : [],
    notify: {
      promo: u.notify ? (u.notify.promo !== false) : true,
      order: u.notify ? (u.notify.order !== false) : true
    },
    deliveryLocation: (function(){
      var cur = u.deliveryLocation || {};
      return {
        district:     districtCodeFor(cur.district) || cur.district || "",
        districtName: cur.districtName || "",
        town:         cur.town  || "",
        area:         cur.area  || "",
        plot:         cur.plot  || ""
      };
    })()
  };

  /* Track which sections have changed since last save */
  function profileDirty(){
    return  working.firstName !== (u.firstName || "") ||
            working.surname   !== (u.surname   || "") ||
            working.dob       !== (u.dob       || "") ||
            working.gender    !== (u.gender    || "Prefer not to say") ||
            (working.bio || "") !== (u.bio || "") ||
            working.contacts.join("\n") !== (u.contacts || []).join("\n") ||
            (working.notify.promo !== (u.notify ? (u.notify.promo !== false) : true)) ||
            (working.notify.order !== (u.notify ? (u.notify.order !== false) : true));
  }

  function locationDirty(){
    var cur = u.deliveryLocation || {};
    var curD = districtCodeFor(cur.district) || cur.district || "";
    return  working.deliveryLocation.district !== curD ||
            working.deliveryLocation.town     !== (cur.town || "") ||
            working.deliveryLocation.area     !== (cur.area || "") ||
            working.deliveryLocation.plot     !== (cur.plot || "");
  }

  /* ============================================================
     SECTION SUBTITLES
     ============================================================ */
  function nameSub(){
    var n = (working.firstName + " " + working.surname).trim();
    return n || "Set your name";
  }
  function contactsSub(){
    var n = working.contacts.length;
    var channels = [];
    if (working.notify.promo) channels.push("promo");
    if (working.notify.order) channels.push("order");
    var chan = channels.length ? channels.join(" + ") : "no alerts";
    return n + " extra contact" + (n === 1 ? "" : "s") + " · " + chan;
  }
  function locationSub(){
    var d = working.deliveryLocation;
    if (!d.district && !d.town) return "Not set";
    var parts = [];
    if (d.town) parts.push(d.town);
    else if (d.districtName) parts.push(d.districtName);
    else if (d.district) parts.push(d.district);
    if (d.area) parts.push(d.area);
    return parts.join(" · ");
  }

  /* ============================================================
     MODULE HTML
     ============================================================ */
  function personalModule(){
    var genderOpts = ["Prefer not to say","Female","Male","Other"];
    return '<div class="module">' +
      '<p class="module-note">Your legal name and basic details. The WhatsApp number tied to your login is read-only.</p>' +
      '<div class="grid2">' +
        '<div class="field"><label>First name</label>' +
          '<input type="text" data-k="firstName" value="' + escapeAttr(working.firstName) + '" placeholder="e.g. Kagiso">' +
        '</div>' +
        '<div class="field"><label>Surname</label>' +
          '<input type="text" data-k="surname" value="' + escapeAttr(working.surname) + '" placeholder="e.g. Molefe">' +
        '</div>' +
      '</div>' +
      '<div class="grid2">' +
        '<div class="field"><label>Date of birth</label>' +
          '<input type="date" data-k="dob" value="' + escapeAttr(working.dob) + '">' +
        '</div>' +
        '<div class="field"><label>Gender</label>' +
          '<select data-k="gender">' +
            genderOpts.map(function(g){
              return '<option value="' + escapeAttr(g) + '"' + (g === working.gender ? ' selected' : '') + '>' + esc(g) + '</option>';
            }).join('') +
          '</select>' +
        '</div>' +
      '</div>' +
      '<div class="field"><label>Bio</label>          <textarea data-k="bio" rows="3" maxlength="240" placeholder="Tell people a little about you">' + escapeAttr(working.bio || '') + '</textarea></div><div class="save-row">' +
        '<button type="button" class="btn btn-save" data-save="personal"' + (profileDirty() ? '' : ' disabled') + '>' +
          (profileDirty() ? 'Save profile' : 'Saved') +
        '</button>' +
      '</div>' +
    '</div>';
  }

  function contactsModule(){
    return '<div class="module">' +
      '<p class="module-note">Add extra ways for businesses to reach you, and pick which notifications you want to receive.</p>' +
      '<div class="field">' +
        '<label>WhatsApp login</label>' +
        '<input type="text" value="' + escapeAttr(u.whatsapp || "") + '" disabled>' +
        '<span class="hint">Contact support to change your login number.</span>' +
      '</div>' +
      '<div class="field">' +
        '<label>Additional contacts</label>' +
        '<textarea data-k="contacts" placeholder="One per line&#10;+267 71 234 567&#10;hello@example.com">' + esc(working.contacts.join("\n")) + '</textarea>' +
        '<span class="hint">One number or email per line.</span>' +
      '</div>' +
      '<label class="check-row">' +
        '<input type="checkbox" data-k="notify:promo"' + (working.notify.promo ? ' checked' : '') + '>' +
        '<span class="check-body">' +
          '<b>Promo notifications</b>' +
          '<span>Deals, events and featured venues near you.</span>' +
        '</span>' +
      '</label>' +
      '<label class="check-row">' +
        '<input type="checkbox" data-k="notify:order"' + (working.notify.order ? ' checked' : '') + '>' +
        '<span class="check-body">' +
          '<b>Order notifications</b>' +
          '<span>Status updates for your orders and deliveries.</span>' +
        '</span>' +
      '</label>' +
      '<div class="save-row">' +
        '<button type="button" class="btn btn-save" data-save="contacts"' + (profileDirty() ? '' : ' disabled') + '>' +
          (profileDirty() ? 'Save profile' : 'Saved') +
        '</button>' +
      '</div>' +
    '</div>';
  }

  function locationModule(){
    if (!L){
      return '<div class="module"><div class="empty-note">Location data unavailable.</div></div>';
    }
    var cur = working.deliveryLocation;
    var districtHtml = optHtml(locOpts(L.districtOptions(), cur.district, "— Select district —"));
    var townHtml     = optHtml(locOpts(L.townOptions(cur.district), cur.town, "— Select town —"));
    var areaHtml     = optHtml(locOpts(L.areaOptions(cur.district, cur.town), cur.area, "— Select area —"));

    return '<div class="module">' +
      '<p class="module-note">Used to prefill delivery at checkout. Manage exact drop-off points in your address book.</p>' +
      '<div class="grid2">' +
        '<div class="field"><label>District</label>' +
          '<select data-k="dDistrict">' + districtHtml + '</select>' +
        '</div>' +
        '<div class="field"><label>Town / city</label>' +
          '<select data-k="dTown">' + townHtml + '</select>' +
        '</div>' +
      '</div>' +
      '<div class="grid2">' +
        '<div class="field"><label>Area / neighbourhood</label>' +
          '<select data-k="dArea">' + areaHtml + '</select>' +
        '</div>' +
        '<div class="field"><label>Plot / street</label>' +
          '<input type="text" data-k="dPlot" value="' + escapeAttr(cur.plot || "") + '" placeholder="e.g. Plot 1234">' +
        '</div>' +
      '</div>' +
      '<div class="save-row">' +
        '<button type="button" class="btn btn-save" data-save="location"' + (locationDirty() ? '' : ' disabled') + '>' +
          (locationDirty() ? 'Save delivery location' : 'Saved') +
        '</button>' +
      '</div>' +
    '</div>';
  }

  /* ============================================================
     ACCORDION BUILDER
     ============================================================ */
  function section(key, letter, title, sub, body){
    var isOpen = OPEN === key;
    var cls = 'acc' + (isOpen ? ' open' : '');
    return '<section class="' + cls + '" data-key="' + escapeAttr(key) + '">' +
      '<button class="acc-head" type="button" aria-expanded="' + (isOpen ? 'true' : 'false') + '">' +
        '<span class="sec-thumb">' + esc(letter) + '</span>' +
        '<span class="acc-title">' +
          '<b>' + esc(title) + '</b>' +
          '<span class="acc-sub">' + esc(sub) + '</span>' +
        '</span>' +
        '<span class="vis-dot off"></span>' +
      '</button>' +
      '<div class="acc-body">' +
        '<div class="acc-inner">' + body + '</div>' +
      '</div>' +
    '</section>';
  }

  /* ============================================================
     META CARD + PROGRESS
     ============================================================ */
  function completeness(){
    var filled = 0;
    var total  = 5;
    if (working.firstName) filled++;
    if (working.surname)   filled++;
    if (working.dob)       filled++;
    if (working.contacts.length) filled++;
    if (working.deliveryLocation.district) filled++;
    return { filled: filled, total: total };
  }

  function renderMeta(){
    var c = completeness();
    var name = (working.firstName + " " + working.surname).trim() || "Your profile";

    var dotClass = "green";
    var msg = "<b>" + esc(name) + "</b> · " + c.filled + " of " + c.total + " fields complete";
    if (c.filled === 0){
      dotClass = "warn";
      msg = "Start by adding your name";
    } else if (c.filled < c.total){
      dotClass = "";
    }

    var notifyCount = 0;
    if (working.notify.promo) notifyCount++;
    if (working.notify.order) notifyCount++;

    var districtLabel = working.deliveryLocation.town
      || working.deliveryLocation.districtName
      || working.deliveryLocation.district
      || "—";

    return '<div class="meta-card">' +
      '<div class="meta-row">' +
        '<span class="meta-dot ' + dotClass + '"></span>' +
        '<span class="meta-text">' + msg + '</span>' +
      '</div>' +
      '<div class="meta-stats">' +
        '<div class="stat"><b>' + esc(districtLabel) + '</b><span>Location</span></div>' +
        '<div class="stat"><b>' + working.contacts.length + '</b><span>Contacts</span></div>' +
        '<div class="stat"><b>' + notifyCount + '/2</b><span>Alerts</span></div>' +
      '</div>' +
    '</div>';
  }

  function updateProgress(){
    var c = completeness();
    var pct = Math.round((c.filled / c.total) * 100);
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('progressCount').textContent =
      c.filled + ' of ' + c.total + ' complete';
  }

  /* ============================================================
     RENDER
     ============================================================ */
  var mount = document.getElementById('app');

  function render(){
    mount.innerHTML =
      renderMeta() +
      '<div class="stack">' +
        section('personal', 'P', 'Personal details', nameSub(), personalModule()) +
        section('contacts', 'C', 'Contacts & notifications', contactsSub(), contactsModule()) +
        section('location', 'L', 'Default delivery location', locationSub(), locationModule()) +
      '</div>' +
      '<div class="quick-links">' +
        '<a class="quick-link" href="eatouts-addresses.html">' +
          '<span class="ql-icon">A</span>' +
          '<span>Addresses</span>' +
        '</a>' +
        '<a class="quick-link" href="eatouts-favourites.html">' +
          '<span class="ql-icon">★</span>' +
          '<span>Favourites</span>' +
        '</a>' +
        '<a class="quick-link" href="eatouts-orders.html">' +
          '<span class="ql-icon">O</span>' +
          '<span>Orders</span>' +
        '</a>' +
      '</div>';

    updateProgress();
    wireInputs();
    wireSaves();
  }

  /* ============================================================
     ACCORDION BEHAVIOUR — only one open at a time
     ============================================================ */
  function toggleAccordion(key){
    OPEN = (OPEN === key) ? null : key;
    var accs = mount.querySelectorAll('.acc');
    for (var i = 0; i < accs.length; i++){
      var acc = accs[i];
      var isOpen = acc.getAttribute('data-key') === OPEN;
      acc.classList.toggle('open', isOpen);
      var head = acc.querySelector('.acc-head');
      if (head) head.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    }
    if (OPEN){
      var opened = mount.querySelector('.acc[data-key="' + cssEscape(OPEN) + '"]');
      if (opened){
        setTimeout(function(){
          try { opened.scrollIntoView({ behavior:'smooth', block:'start' }); } catch (e) {}
        }, 320);
      }
    }
  }

  /* ============================================================
     INPUT WIRING
     ============================================================ */
  function wireInputs(){
    mount.querySelectorAll('[data-k]').forEach(function(el){
      var k = el.getAttribute('data-k');

      /* Notifications checkboxes */
      if (k.indexOf('notify:') === 0){
        var key = k.slice(7);
        el.onchange = function(){
          working.notify[key] = el.checked;
          refreshHeaderAndSave();
        };
        return;
      }

      /* Location chain — district */
      if (k === 'dDistrict'){
        el.onchange = function(){
          working.deliveryLocation.district = el.value;
          var d = L.allDistricts().find(function(x){ return String(x.code) === String(el.value); }) || {};
          working.deliveryLocation.districtName = d.name || "";
          working.deliveryLocation.town = "";
          working.deliveryLocation.area = "";
          /* Rebuild the town + area selects in place */
          var townSel = mount.querySelector('[data-k="dTown"]');
          var areaSel = mount.querySelector('[data-k="dArea"]');
          if (townSel) townSel.innerHTML = optHtml(locOpts(L.townOptions(el.value), "", "— Select town —"));
          if (areaSel) areaSel.innerHTML = optHtml(locOpts(L.areaOptions(el.value, ""), "", "— Select area —"));
          refreshHeaderAndSave();
        };
        return;
      }

      /* Location chain — town */
      if (k === 'dTown'){
        el.onchange = function(){
          working.deliveryLocation.town = el.value;
          working.deliveryLocation.area = "";
          var areaSel = mount.querySelector('[data-k="dArea"]');
          var distSel = mount.querySelector('[data-k="dDistrict"]');
          if (areaSel && distSel){
            areaSel.innerHTML = optHtml(locOpts(L.areaOptions(distSel.value, el.value), "", "— Select area —"));
          }
          refreshHeaderAndSave();
        };
        return;
      }

      if (k === 'dArea'){
        el.onchange = function(){
          working.deliveryLocation.area = el.value;
          refreshHeaderAndSave();
        };
        return;
      }

      if (k === 'dPlot'){
        el.oninput = function(){
          working.deliveryLocation.plot = el.value;
          refreshHeaderAndSave();
        };
        return;
      }

      /* Profile fields */
      el.oninput = el.onchange = function(){
        if (k === 'firstName') working.firstName = el.value;
        else if (k === 'surname') working.surname = el.value;
        else if (k === 'dob') working.dob = el.value;
        else if (k === 'gender') working.gender = el.value;
        else if (k === 'contacts') working.contacts = el.value.split("\n").map(function(s){ return s.trim(); }).filter(Boolean);
        refreshHeaderAndSave();
      };
    });

    /* Live update subtitles on each accordion header */
    mount.querySelectorAll('.acc').forEach(function(acc){
      var key = acc.getAttribute('data-key');
      var sub = acc.querySelector('.acc-sub');
      if (!sub) return;
      if (key === 'personal') sub.textContent = nameSub();
      if (key === 'contacts') sub.textContent = contactsSub();
      if (key === 'location') sub.textContent = locationSub();
    });
  }

  /* Refreshes meta card + progress + Save button state without
     tearing down the accordion body (keeps focus). */
  function refreshHeaderAndSave(){
    var metaCard = mount.querySelector('.meta-card');
    if (metaCard){
      var wrap = document.createElement('div');
      wrap.innerHTML = renderMeta();
      metaCard.replaceWith(wrap.firstChild);
    }
    updateProgress();

    /* Personal save button */
    var pBtn = mount.querySelector('[data-save="personal"]');
    if (pBtn){
      var pd = profileDirty();
      pBtn.disabled = !pd;
      pBtn.textContent = pd ? 'Save profile' : 'Saved';
    }
    /* Contacts save button */
    var cBtn = mount.querySelector('[data-save="contacts"]');
    if (cBtn){
      var cd = profileDirty();
      cBtn.disabled = !cd;
      cBtn.textContent = cd ? 'Save profile' : 'Saved';
    }
    /* Location save button */
    var lBtn = mount.querySelector('[data-save="location"]');
    if (lBtn){
      var ld = locationDirty();
      lBtn.disabled = !ld;
      lBtn.textContent = ld ? 'Save delivery location' : 'Saved';
    }
  }

  /* ============================================================
     SAVE HANDLERS
     ============================================================ */
  function wireSaves(){
    mount.querySelectorAll('[data-save]').forEach(function(btn){
      btn.onclick = function(){
        var kind = btn.getAttribute('data-save');
        if (kind === 'personal' || kind === 'contacts') saveProfile();
        else if (kind === 'location') saveLocation();
      };
    });
  }

  function saveProfile(){
    if (!profileDirty()){ toast('No changes to save'); return; }
    var patch = {
      firstName: working.firstName,
      surname:   working.surname,
      dob:       working.dob,
      gender:    working.gender,
      bio:       working.bio || '',
      contacts:  working.contacts.slice(),
      notify: {
        promo: !!working.notify.promo,
        order: !!working.notify.order
      }
    };
    EatoutsUsers.update(u.id, patch);

    if (window.EatoutsCustomer){
      EatoutsCustomer.updateProfile(patch)
        .then(function(){ toast('Profile saved'); })
        .catch(function(){ toast('Profile saved on this device'); });
    } else {
      toast('Profile saved');
    }
    /* Update the local user reference so dirty checks are accurate */
    try { u = EO.currentUser() || u; } catch (e) {}
    render();
  }

  function saveLocation(){
    if (!locationDirty()){ toast('No changes to save'); return; }
    var d = working.deliveryLocation;
    var dist = L.allDistricts().find(function(x){ return String(x.code) === String(d.district); }) || {};
    var loc = {
      district:     d.district,
      districtName: dist.name || "",
      town:         d.town,
      area:         d.area === 'Other / not listed' ? "" : d.area,
      plot:         (d.plot || "").trim()
    };
    EatoutsUsers.update(u.id, { deliveryLocation: loc });
    if (window.EatoutsCustomer && EatoutsCustomer.updateProfile){
      EatoutsCustomer.updateProfile({ deliveryLocation: loc });
    }
    toast('Delivery location saved');
    try { u = EO.currentUser() || u; } catch (e) {}
    render();
  }

  /* ============================================================
     DELEGATED CLICKS — accordion headers
     ============================================================ */
  mount.addEventListener('click', function(e){
    var head = e.target.closest('.acc-head');
    if (head){
      var acc = head.closest('.acc');
      if (acc) toggleAccordion(acc.getAttribute('data-key'));
    }
  });

  /* ============================================================
     AVATAR
     ============================================================ */
  var avatarBtn = document.getElementById('avatarBtn');
  var avatarInput = document.getElementById('avatarInput');
  var avatarPrev = document.getElementById('avatarPreview');
  function setAvatarUrl(url){
    if(!avatarPrev) return;
    if(url){
      avatarPrev.innerHTML = '<img src="' + url + '" alt="avatar" style="width:100%;height:100%;object-fit:cover">';
    }else{
      avatarPrev.textContent = '?';
    }
  }
  if(u && (u.photoKey || u.avatar || (u.profile && (u.profile.photoKey||u.profile.avatar||u.profile.photo)))){
    var au = u.photoKey || u.avatar || (u.profile && (u.profile.photoKey||u.profile.avatar||u.profile.photo));
    setAvatarUrl(au);
  }
  if(avatarBtn && avatarInput){
    avatarBtn.addEventListener('click', function(){ avatarInput.click(); });
    avatarInput.addEventListener('change', function(){
      var f=avatarInput.files && avatarInput.files[0];
      if(!f) return;
      var id=(u&&u.id)||(window.EO&&EO.currentUser()&&EO.currentUser().id);
      if(window.EatoutsCustomer && window.EatoutsCustomer.uploadAvatar){
        avatarBtn.disabled=true; avatarBtn.textContent='Uploading...';
        window.EatoutsCustomer.uploadAvatar(f,id).then(function(res){
          var url=res&&res.url?res.url:res;
          if(url) setAvatarUrl(url);
          avatarBtn.disabled=false; avatarBtn.textContent='Upload photo';
          try{ toast('Photo updated'); }catch(e){}
        }).catch(function(){
          avatarBtn.disabled=false; avatarBtn.textContent='Upload photo';
          try{ toast('Upload failed'); }catch(e){}
        });
      }else{
        avatarBtn.disabled=false;
      }
    });
  }

  /* ============================================================
     BOOT
     ============================================================ */
  render();
});
</script>
</body>
</html>
