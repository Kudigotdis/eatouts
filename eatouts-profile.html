<!doctype html>
<!-- PAGE: My profile --><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#ffffff"><title>My profile · EatOuts</title><link rel="stylesheet" href="assets/eatouts-manager.css"><style>.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:520px){.two{grid-template-columns:1fr}}</style></head><body data-page="eatouts-profile"><div id="mount"></div><script src="js/eatouts-manager-db.js"></script><script src="assets/data/demo/the-food-place/demo-data.js"></script><script src="js/eatouts-manager-seed.js"></script><script src="js/eatouts-roles.js"></script><script src="js/eatouts-users.js"></script><script src="js/eatouts-feedback.js"></script><script src="js/eatouts-blog-admin.js"></script><script src="js/eatouts-auth.js"></script><script src="botswana_locations.js"></script><script src="js/eatouts-locations.js"></script><script src="js/eatouts-manager.js"></script><script src="js/eatouts-customer.js"></script><script>document.addEventListener("DOMContentLoaded",()=>{
 if(!EO.guard({"roles": ["customer"]}))return;
 const L=window.EatoutsLocations,u=EO.currentUser();
 function optHtml(list){return (list||[]).map(o=>`<option value="${EO.esc(o.value)}">${EO.esc(o.label)}</option>`).join("")}
 function locOpts(list,cur,ph){const o=[{value:'',label:ph}].concat(list||[]);if(cur&&!o.some(x=>String(x.value)===String(cur)))o.splice(1,0,{value:cur,label:cur});return o}
 function districtCodeFor(v){if(!L)return '';const c=L.allDistricts().find(d=>String(d.code)===String(v));if(c)return c.code;const n=L.allDistricts().find(d=>String(d.name).toLowerCase()===String(v||'').toLowerCase());return n?n.code:''}
 document.querySelector("#mount").innerHTML=EO.shell("My profile","Personal details, contacts, addresses and notifications",`<div class="card"><form id="p"><div class="two"><label class="field"><span>First name</span><input name="firstName"></label><label class="field"><span>Surname</span><input name="surname"></label></div><div class="two"><label class="field"><span>DOB</span><input name="dob" type="date"></label><label class="field"><span>Gender</span><select name="gender"><option>Prefer not to say</option><option>Female</option><option>Male</option><option>Other</option></select></label></div><label class="field"><span>WhatsApp login</span><input name="whatsapp" disabled></label><label class="field"><span>Additional contacts</span><textarea name="contacts"></textarea></label><div class="checkgrid"><label class="check"><input name="promo" type="checkbox">Promo notifications</label><label class="check"><input name="order" type="checkbox">Order notifications</label></div><button class="btn primary" style="margin-top:10px">Save profile</button></form></div><div class="card"><div class="card-title">Default delivery location</div><p class="minor">Used to prefill delivery at checkout. Manage exact drop-off points in your address book.</p><form id="loc"><div class="two"><label class="field"><span>District</span><select name="district"></select></label><label class="field"><span>Town / city</span><select name="town"></select></label></div><div class="two"><label class="field"><span>Area / neighbourhood</span><select name="area"></select></label><label class="field"><span>Plot / street</span><input name="plot"></label></div><button class="btn primary" style="margin-top:10px">Save delivery location</button></form></div><div class="actions"><a class="btn" href="eatouts-addresses.html">Addresses</a><a class="btn" href="eatouts-favourites.html">Favourites</a><a class="btn" href="eatouts-orders.html">Orders</a></div>`,{section:"Customer"});
 const f=document.querySelector("#p"),fe=f.elements;["firstName","surname","dob","gender","whatsapp"].forEach(k=>{if(fe[k])fe[k].value=u[k]||""});fe.contacts.value=(u.contacts||[]).join("\n");f.onsubmit=e=>{e.preventDefault();const patch={firstName:fe.firstName.value,surname:fe.surname.value,dob:fe.dob.value,gender:fe.gender.value,contacts:fe.contacts.value.split("\n").filter(Boolean),notify:{promo:fe.promo?fe.promo.checked:true,order:fe.order?fe.order.checked:true}};EatoutsUsers.update(u.id,patch);if(window.EatoutsCustomer){EatoutsCustomer.updateProfile(patch).then(()=>EO.toast("Profile saved")).catch(()=>EO.toast("Profile saved on this device"))}else{EO.toast("Profile saved")}};
 const lf=document.querySelector("#loc");
 if(!L){lf.innerHTML="<div class='empty'>Location data unavailable.</div>";return;}
 const cur=u.deliveryLocation||{},dCode=districtCodeFor(cur.district)||cur.district||'',town=cur.town||'';
 const d=lf.querySelector('[name=district]'),t=lf.querySelector('[name=town]'),a=lf.querySelector('[name=area]'),plot=lf.querySelector('[name=plot]');
 d.innerHTML=optHtml(locOpts(L.districtOptions(),dCode,'— Select district —'));t.innerHTML=optHtml(locOpts(L.townOptions(dCode),town,'— Select town —'));a.innerHTML=optHtml(locOpts(L.areaOptions(dCode,town),cur.area||'','— Select area —'));if(plot)plot.value=cur.plot||'';
 d.onchange=()=>{t.innerHTML=optHtml(locOpts(L.townOptions(d.value),'','— Select town —'));a.innerHTML=optHtml(locOpts(L.areaOptions(d.value,''),'','— Select area —'))};
 t.onchange=()=>{a.innerHTML=optHtml(locOpts(L.areaOptions(d.value,t.value),'','— Select area —'))};
 lf.onsubmit=e=>{e.preventDefault();const dd=L.allDistricts().find(x=>String(x.code)===String(d.value))||{};EatoutsUsers.update(u.id,{deliveryLocation:{district:d.value,districtName:dd.name||'',town:t.value,area:a.value==='Other / not listed'?'':a.value,plot:plot?plot.value.trim():''}});EO.toast("Delivery location saved")};
});</script></body></html>
