<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#ffffff"><title>Blog creator dashboard · EatOuts</title><link rel="stylesheet" href="assets/eatouts-manager.css"></head><body><div id="mount"></div><script src="js/eatouts-manager-db.js"></script><script src="js/eatouts-roles.js"></script><script src="js/eatouts-users.js"></script><script src="js/eatouts-feedback.js"></script><script src="js/eatouts-blog-admin.js"></script><script src="js/eatouts-auth.js"></script><script src="js/eatouts-manager.js"></script><script>document.addEventListener("DOMContentLoaded",()=>{if(!EO.guard({"roles": ["platform_admin", "platform_author", "platform_author_editor"]}))return;document.querySelector("#mount").innerHTML=EO.shell("Blog creator dashboard","Writer and publisher workspace",`<div class="card"><div class="card-title">Writer</div><form id="post"><label class="field"><span>Title</span><input name="title" required></label><label class="field"><span>Body</span><textarea name="body" required></textarea></label><button class="btn primary">Save draft</button></form></div><div class="card"><div class="card-title">Posts</div><div id="posts"></div></div>`,{section:"Platform content"});
function render(){document.querySelector("#posts").innerHTML=EatoutsBlogAdmin.all().map(p=>`<div class="listrow"><div class="listmain"><strong>${EO.esc(p.title)}</strong><small>${p.author||"Demo Author"} · ${p.updated}</small></div><div class="actions">${EO.status(p.status)}<button class="btn" data-publish="${p.id}">${p.status==="published"?"Unpublish":"Publish"}</button></div></div>`).join("")}document.querySelector("#post").onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);EatoutsBlogAdmin.create({title:f.get("title"),body:f.get("body"),author:"Demo Author"});e.target.reset();render()};document.querySelector("#posts").onclick=e=>{const id=e.target.dataset.publish;if(id){const p=EatoutsBlogAdmin.all().find(x=>x.id===id);p.status==="published"?EatoutsBlogAdmin.unpublish(id):EatoutsBlogAdmin.publish(id);render()}};render();});</script></body></html>
