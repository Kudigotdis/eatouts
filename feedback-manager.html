<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#ffffff"><title>Feedback manager · EatOuts</title><link rel="stylesheet" href="assets/eatouts-manager.css"></head><body><div id="mount"></div><script src="js/eatouts-db.js"></script><script src="js/eatouts-manager-db.js"></script><script src="assets/data/demo/the-food-place/demo-data.js"></script><script src="js/eatouts-manager-seed.js"></script><script src="js/eatouts-roles.js"></script><script src="js/eatouts-users.js"></script><script src="js/eatouts-feedback.js"></script><script src="js/eatouts-blog-admin.js"></script><script src="js/eatouts-auth.js"></script><script src="js/eatouts-data.js"></script><script src="js/eatouts-audit.js"></script><script src="js/eatouts-manager.js"></script><script>document.addEventListener("DOMContentLoaded",()=>{if(!EO.guard({"roles": ["platform_admin", "platform_ops", "staff_ops", "platform_support", "staff_support"]}))return;document.querySelector("#mount").innerHTML=EO.shell("Feedback manager","Feedback queue, ticket IDs, assignment and WhatsApp replies",`<div class="actions" style="margin-bottom:10px"><button class="btn primary" id="seed">Create demo ticket</button></div><div id="fb" class="card"></div>`,{section:"Platform support"});
let cur=1;
function render(){const all=EatoutsFeedback.all();const st=EO.page(all,cur,50);cur=st.page;document.querySelector("#fb").innerHTML=st.total?st.rows.map(x=>`<article class="card" style="margin:0 0 8px"><div class="listrow"><div class="listmain"><strong>${EO.esc(x.id)} · ${EO.esc(x.subject||"Feedback")}</strong><small>${EO.esc(x.created||"")} · user ${EO.esc(x.userId||"—")} · assigned ${EO.esc(x.assignedTo||"unassigned")}</small></div>${EO.status(x.status||"open")}</div><p style="font-size:11px">${EO.esc(x.message||"")}</p><div class="actions"><button class="btn" data-status="${EO.esc(x.id)}">Mark resolved</button>${x.whatsapp?`<a class="btn" rel="noopener" target="_blank" href="https://wa.me/${EO.phoneIntl(x.whatsapp)}?text=${encodeURIComponent("EatOuts feedback ticket "+x.id)}">WhatsApp reply</a>`:""}</div></article>`).join("")+EO.pager(st):EO.empty("No feedback tickets","Feedback submitted from the app will appear here.")}document.querySelector("#seed").onclick=()=>{EatoutsFeedback.create({userId:"u-customer",whatsapp:"26770000001",subject:"Delivery question",message:"My order is late."});cur=1;render()};document.querySelector("#fb").onclick=e=>{if(e.target.dataset.page){cur=Number(e.target.dataset.page);render();return}const id=e.target.dataset.status;if(id){const before=EatoutsMgrDB.find("feedback",id);EatoutsFeedback.update(id,{status:"resolved"});if(window.EatoutsAudit)try{EatoutsAudit.log("feedback.resolve",id,before?{status:before.status}:null,{status:"resolved"})}catch(_){}render()}};render();});</script></body></html>
