<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#171719">
<title>Event Supplier Dashboard · EatOuts</title>
<style>
:root{
  --ink:#171719;--ink2:#303138;--muted:#626773;--faint:#777D88;
  --paper:#F3F4F6;--card:#FFFFFF;--line:#E0E3E8;--line2:#ECEEF1;
  --orange:#FF5A1F;--orange2:#E94E18;--orangeSoft:#FFF0E9;--orangeLine:#FFD0BC;
  --green:#187A45;--greenSoft:#E9F7EE;--amber:#9A5808;--amberSoft:#FFF4D9;
  --red:#B42318;--redSoft:#FDEDEC;--blue:#1769AA;--blueSoft:#EAF4FD;
  --shadow:0 2px 12px rgba(23,23,25,.045);--radius:8px;
  --rail:#0E0F12;--railLine:#24252B;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:#E7E9ED;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid rgba(255,90,31,.32);outline-offset:2px}a{color:inherit;text-decoration:none}
#shell{width:100%;max-width:520px;height:100vh;height:100dvh;margin:0 auto;background:var(--paper);display:flex;flex-direction:column;overflow:hidden;position:relative;box-shadow:0 0 48px rgba(16,18,25,.13)}
.topbar{flex:0 0 auto;background:#171719;color:#fff;padding:calc(12px + env(safe-area-inset-top)) 14px 14px;display:flex;align-items:center;gap:13px;border-bottom:1px solid #323238}
.restaurant-logo{width:90px;height:90px;flex:0 0 90px;display:block;object-fit:cover;background:#34343A;border:1px solid #56565E;border-radius:4px}
.logo-fallback{display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,#FF7A42,#D94512);font-size:36px;font-weight:900;letter-spacing:-.06em}
.brand-info{min-width:0;flex:1}
.brand-name{font-size:20px;line-height:1.2;font-weight:900;letter-spacing:-.03em;overflow-wrap:anywhere;margin:0}
.brand-tagline{font-size:12px;color:#AEB1B8;margin-top:2px;font-weight:500;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.filter-section{flex:0 0 auto;background:#fff;border-bottom:1px solid var(--line);position:relative;z-index:10;box-shadow:0 2px 4px rgba(0,0,0,.025)}
.filter-accordion-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;border:0;background:#fff;padding:13px 14px;text-align:left;transition:background .15s}
.filter-accordion-toggle:hover{background:#FAFBFC}
.filter-accordion-toggle[aria-expanded="true"]{border-bottom:1px solid var(--line2)}
.filter-accordion-title{font-size:16px;font-weight:900;letter-spacing:.035em;text-transform:uppercase;color:#666B75}
.filter-accordion-meta{font-size:14px;color:var(--muted);font-weight:700;text-align:right;line-height:1.3}
.filter-accordion-body{padding:4px 14px 14px}
.filter-stack{display:grid;grid-template-columns:1fr;gap:9px}
.filter-control{width:100%;border:1px solid #D9DDE3;background:#fff;border-radius:6px;color:var(--ink);padding:11px 12px;min-height:48px;text-align:left;display:flex;align-items:center;gap:10px}
.filter-control:hover{border-color:#B6BAC3}
.filter-control-main{min-width:0;flex:1}
.filter-control-label{display:block;font-size:16px;font-weight:800;line-height:1.25}
.filter-control-sub{display:block;font-size:14px;color:var(--muted);margin-top:2px;line-height:1.25}
.filter-select{width:100%;min-height:48px;border:1px solid #D9DDE3;border-radius:6px;background:#fff;color:var(--ink);padding:10px 12px;font-size:16px;font-weight:700;text-align:center;display:flex;align-items:center;justify-content:center}
.filter-select:hover{border-color:#B6BAC3}
.filter-label{display:block;font-size:16px;font-weight:800;line-height:1.25;text-align:center}
.filter-reset{width:100%;margin-top:6px;min-height:42px;border:1px dashed #CDD1D8;border-radius:6px;background:#FAFBFC;color:var(--red);font-size:15px;font-weight:800}
.filter-reset:hover{background:#FDEDEC;border-color:#E8B8B3}
.filter-dim{position:absolute;left:0;right:0;background:rgba(13,14,18,.52);z-index:9;opacity:0;pointer-events:none;transition:opacity .18s ease;cursor:pointer}
.filter-dim.show{opacity:1;pointer-events:auto}
.scroll{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;padding:14px 12px 22px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:none;-ms-overflow-style:none}
.scroll::-webkit-scrollbar{display:none}
.page-head{margin:1px 2px 13px}
.page-title{font-size:20px;font-weight:900;letter-spacing:-.025em;line-height:1.2;margin:0}
.page-subtitle{font-size:16px;color:var(--muted);margin:5px 0 0;line-height:1.4}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:19px 2px 9px;font-size:18px;font-weight:900;line-height:1.25}
.section-title:first-of-type{margin-top:5px}
.section-note{font-size:14px;color:var(--muted);font-weight:500;margin-top:3px;line-height:1.35}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px;box-shadow:var(--shadow);min-width:0}
.card:last-child{margin-bottom:0}
.card-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
.card-head-main{min-width:0;flex:1}
.card-title{font-size:18px;font-weight:900;line-height:1.25;margin:0}
.card-subtitle{font-size:14px;color:var(--muted);margin:4px 0 0;line-height:1.4}
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:11px}
.kpi{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0;padding:10px;border-radius:8px;background:#F7F8FA;border:1px solid rgba(224,227,232,.9);color:var(--ink);text-align:left;font:inherit;appearance:none;-webkit-appearance:none;transition:background .15s,border-color .15s,transform .12s}
.kpi:hover{background:#F0F2F5;border-color:#C9CED6}
.kpi:active{transform:scale(.985)}
.kpi-main{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.kpi-label{font-size:11px;font-weight:700;color:var(--muted);line-height:1.25;overflow-wrap:anywhere}
.kpi-value{flex:0 0 auto;font-size:14px;font-weight:900;letter-spacing:-.02em;color:var(--ink);background:#fff;border:1px solid #E1E4EA;border-radius:6px;padding:2px 8px;line-height:1.4;box-shadow:0 1px 2px rgba(23,23,25,.06);white-space:nowrap}
.stat-list{display:flex;flex-direction:column;gap:0}
.stat-row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line2)}
.stat-row:last-child{border-bottom:0;padding-bottom:0}.stat-row:first-child{padding-top:0}
.stat-row-main{flex:1;min-width:0}.stat-row-label{font-size:15px;color:#353840;font-weight:750;line-height:1.3}.stat-row-note{font-size:14px;color:var(--muted);line-height:1.35;margin-top:3px}.stat-row-value{font-size:15px;font-weight:900;text-align:right;white-space:nowrap;line-height:1.35}
.bar-list{display:flex;flex-direction:column;gap:12px}
.bar-row{display:grid;grid-template-columns:minmax(110px,1fr) minmax(70px,1.05fr) auto;align-items:center;gap:9px}
.bar-label{font-size:15px;font-weight:750;color:#363840;line-height:1.3;overflow-wrap:anywhere}
.bar-track{height:10px;background:#ECEEF1;border-radius:3px;overflow:hidden;min-width:20px}
.bar-fill{height:100%;display:block;background:var(--orange);border-radius:3px;min-width:2px}
.bar-fill.green{background:var(--green)}.bar-fill.amber{background:var(--amber)}.bar-fill.red{background:var(--red)}.bar-fill.blue{background:var(--blue)}
.bar-value{font-size:14px;font-weight:900;white-space:nowrap;text-align:right}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{width:100%;border-collapse:collapse;min-width:440px;background:#fff}th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line2);font-size:14px;vertical-align:top}th{background:#F7F8FA;color:#50545E;font-weight:900;white-space:nowrap}td{color:#303239}tbody tr:last-child td{border-bottom:0}td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.table-title{font-weight:800}.table-sub{font-size:13px;color:var(--muted);margin-top:3px}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:4px;padding:4px 7px;font-size:13px;font-weight:800;line-height:1.25;white-space:normal}.badge.good{background:var(--greenSoft);color:var(--green)}.badge.warn{background:var(--amberSoft);color:var(--amber)}.badge.bad{background:var(--redSoft);color:var(--red)}.badge.info{background:var(--blueSoft);color:var(--blue)}.badge.neutral{background:#F1F2F4;color:#545963}
.alert-list{display:flex;flex-direction:column;gap:9px}.alert{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--line);border-radius:6px;padding:11px}.alert-mark{width:30px;height:30px;flex:0 0 30px;display:grid;place-items:center;border-radius:5px;font-size:14px;font-weight:900}.alert.warning .alert-mark{background:var(--amberSoft);color:var(--amber)}.alert.danger .alert-mark{background:var(--redSoft);color:var(--red)}.alert.info .alert-mark{background:var(--blueSoft);color:var(--blue)}.alert.good .alert-mark{background:var(--greenSoft);color:var(--green)}.alert-main{flex:1;min-width:0}.alert-title{font-size:15px;font-weight:900;line-height:1.3}.alert-text{font-size:14px;color:#50545E;line-height:1.4;margin-top:3px}.alert-action{font-size:14px;color:var(--orange2);font-weight:900;border:0;background:transparent;padding:6px 0 0;text-align:left}
.empty-state{border:1px dashed #CDD1D8;border-radius:7px;padding:22px 14px;text-align:center;background:#FAFBFC;color:var(--muted);font-size:15px;line-height:1.45}
.btn{min-height:46px;border:1px solid transparent;border-radius:6px;padding:10px 13px;font-size:15px;font-weight:850;line-height:1.25;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn.primary{background:var(--orange);color:#fff;border-color:var(--orange)}.btn.primary:hover{background:var(--orange2)}
.btn.secondary{background:#fff;border-color:var(--line);color:var(--ink)}.btn.secondary:hover{background:#F6F7F8}
.btn.full{width:100%}
.button-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.bottom-rail{flex:0 0 auto;background:var(--rail);border-top:1px solid var(--railLine);padding:0 0 env(safe-area-inset-bottom);overflow-x:auto;overflow-y:hidden;display:flex;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;touch-action:pan-x}
.bottom-rail::-webkit-scrollbar{display:none}
.rail-tab{flex:0 0 25%;width:25%;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 4px;border:0;border-top:3px solid transparent;background:transparent;color:rgba(255,255,255,.5);text-align:center;line-height:1.15;font-size:clamp(12px,3.4vw,14px);font-weight:800;scroll-snap-align:center;scroll-snap-stop:always;white-space:normal}
.rail-tab .rail-label{display:block;max-width:100%;overflow-wrap:anywhere}
.rail-tab.active{color:var(--orange);border-top-color:var(--orange)}
.rail-tab:focus-visible{outline-offset:-4px}
.scrim{position:fixed;inset:0;background:rgba(12,13,17,.58);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .22s ease,visibility 0s linear .22s}
.scrim.open{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .22s ease,visibility 0s}
.sheet{width:100%;max-width:500px;max-height:min(88vh,860px);background:#fff;border-radius:12px;box-shadow:0 20px 50px rgba(0,0,0,.28);display:flex;flex-direction:column;overflow:hidden;transform:translateY(-40px);opacity:0;transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .22s ease}
.scrim.open .sheet{transform:translateY(0);opacity:1}
.sheet-head{padding:17px 16px 12px;border-bottom:1px solid var(--line);flex:0 0 auto}.sheet-title{font-size:20px;font-weight:900;margin:0}.sheet-sub{font-size:14px;color:var(--muted);margin-top:4px;line-height:1.4}
.sheet-search-wrap{display:flex;align-items:center;gap:8px;padding:12px 16px 8px;flex:0 0 auto}
.sheet-search{flex:1;min-width:0;min-height:44px;border:1px solid #D6DAE1;border-radius:5px;padding:9px 12px;font-size:15px}
.sheet-all-btn,.sheet-clear-btn{flex:0 0 auto;min-height:44px;min-width:44px;border:1px solid var(--line);border-radius:5px;background:#F8F9FA;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 12px}
.sheet-all-btn:hover,.sheet-clear-btn:hover{background:#EFF1F4}
.sheet-clear-btn{color:var(--red);font-size:16px;padding:0 10px}
.branch-options{padding:0 16px 12px;overflow:auto;min-height:120px;max-height:44vh}
.branch-option{display:flex;align-items:flex-start;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line2);cursor:pointer}
.branch-option:last-child{border-bottom:0}
.branch-option input[type="checkbox"]{appearance:none;-webkit-appearance:none;width:22px;height:22px;border-radius:5px;border:2px solid #C6CBD3;background:#F0F1F4;position:relative;cursor:pointer;flex:0 0 auto;margin:1px 0 0}
.branch-option input[type="checkbox"]:checked{background:var(--green);border-color:var(--green)}
.branch-option input[type="checkbox"]:checked::after{content:'';position:absolute;left:6px;top:2px;width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.branch-option-main{flex:1;min-width:0}
.branch-option-name{display:block;font-size:16px;font-weight:900}
.branch-option-location{display:block;font-size:14px;color:var(--muted);margin-top:3px;line-height:1.3}
.sheet-foot{flex:0 0 auto;padding:12px 16px 16px;border-top:1px solid var(--line);background:#fff}
.sheet-actions{display:grid;grid-template-columns:1fr;gap:8px}
.popup{width:100%;max-width:480px;max-height:min(86vh,780px);background:#fff;border-radius:12px;box-shadow:0 20px 50px rgba(0,0,0,.28);display:flex;flex-direction:column;overflow:hidden;transform:translateY(12px) scale(.97);opacity:0;transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .2s ease}
.scrim.open .popup{transform:translateY(0) scale(1);opacity:1}
.popup-head{padding:16px 16px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;flex:0 0 auto}
.popup-title{font-size:18px;font-weight:900;margin:0}
.popup-close{border:1px solid var(--line);background:#F8F9FA;border-radius:5px;padding:7px 12px;font-size:14px;font-weight:800;color:var(--muted)}
.popup-close:hover{background:#EFF1F4}
.popup-body{padding:14px 16px;overflow:auto;flex:1 1 auto;min-height:0}
.popup-foot{padding:12px 16px 16px;border-top:1px solid var(--line);flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.popup-foot.single{grid-template-columns:1fr}
.kpi-popup{max-width:400px}
.kpi-popup-value{font-size:32px;font-weight:900;letter-spacing:-.035em;line-height:1.1;color:var(--ink);overflow-wrap:anywhere}
.kpi-popup-sub{font-size:14px;color:var(--muted);font-weight:700;margin-top:6px}
.kpi-popup-text{font-size:15px;color:#50545E;line-height:1.45;margin:12px 0 0}
.date-presets{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:14px}
.date-preset{min-height:42px;border:1px solid var(--line);border-radius:5px;background:#F8F9FA;font-size:14px;font-weight:700;padding:8px 10px;text-align:left}
.date-preset:hover{background:#EFF1F4}
.date-preset.active{background:var(--orangeSoft);border-color:var(--orangeLine);color:#A83A10}
.date-section-title{font-size:14px;font-weight:900;text-transform:uppercase;letter-spacing:.04em;color:#666B75;margin:6px 0 8px;padding-top:6px;border-top:1px solid var(--line2)}
.date-rows{display:flex;flex-direction:column;gap:6px}
.date-row{display:grid;grid-template-columns:28px 1fr 1fr 1fr 60px;gap:5px;align-items:center}
.date-row-head{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;padding:0 1px}
.date-row-head span{text-align:center}
.date-row input[type="checkbox"]{appearance:none;-webkit-appearance:none;width:22px;height:22px;border-radius:4px;border:2px solid #C6CBD3;background:#F0F1F4;position:relative;cursor:pointer;justify-self:center}
.date-row input[type="checkbox"]:checked{background:var(--green);border-color:var(--green)}
.date-row input[type="checkbox"]:checked::after{content:'';position:absolute;left:6px;top:2px;width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.date-row input[type="number"],.date-row select{min-height:38px;border:1px solid #D9DDE3;border-radius:4px;padding:6px 7px;font-size:14px;width:100%;background:#fff}
.date-actions{display:flex;gap:3px;justify-content:center}
.date-actions button{width:26px;height:30px;border:1px solid var(--line);border-radius:4px;background:#F8F9FA;font-size:15px;font-weight:900;color:var(--ink2);display:flex;align-items:center;justify-content:center;padding:0}
.date-actions button:hover{background:#EFF1F4}
.date-add-row{width:100%;margin-top:8px;min-height:38px;border:1px dashed #CDD1D8;border-radius:5px;background:#FAFBFC;font-size:14px;font-weight:800;color:var(--orange2)}
.date-add-row:hover{background:#FFF7F2;border-color:var(--orangeLine)}
.service-options{display:flex;flex-direction:column;gap:6px}
.service-option{min-height:48px;border:1px solid var(--line);border-radius:6px;background:#F8F9FA;font-size:15px;font-weight:700;padding:10px 12px;text-align:left}
.service-option:hover{background:#EFF1F4}
.service-option.active{background:var(--orangeSoft);border-color:var(--orangeLine);color:#A83A10}
.toast{position:fixed;left:50%;bottom:calc(82px + env(safe-area-inset-bottom));transform:translate(-50%,10px);background:#202126;color:#fff;border-radius:6px;padding:12px 16px;max-width:90vw;min-width:180px;text-align:center;font-size:14px;font-weight:800;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:200}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:560px){body{padding:12px 0;display:flex;align-items:center}#shell{height:calc(100vh - 24px);height:calc(100dvh - 24px);max-height:1000px;border-radius:9px}.scrim{padding:20px}.sheet{border-radius:10px}}
@media(max-height:700px){.topbar{padding-top:calc(8px + env(safe-area-inset-top));padding-bottom:9px}.rail-tab{min-height:46px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div id="shell">
  <header class="topbar">
    <img id="restaurantLogo" class="restaurant-logo" alt="Supplier logo" hidden>
    <div id="logoFallback" class="restaurant-logo logo-fallback" aria-hidden="true">S</div>
    <div class="brand-info">
      <h1 id="restaurantName" class="brand-name">Event Supplier</h1>
      <div class="brand-tagline"><span>Rental &amp; logistics dashboard</span></div>
    </div>
  </header>

  <section class="filter-section" aria-label="Dashboard filters" id="filterAccordion">
    <button class="filter-accordion-toggle" type="button" aria-expanded="false" aria-controls="filterAccordionBody" id="filterToggle">
      <span class="filter-accordion-title">Filter</span>
      <span class="filter-accordion-meta" id="filterAccordionMeta"></span>
    </button>
    <div class="filter-accordion-body" id="filterAccordionBody" hidden>
      <div class="filter-stack">
        <div>
          <button id="branchPicker" class="filter-control" type="button" aria-haspopup="dialog" aria-expanded="false">
            <span class="filter-control-main"><span id="branchControlLabel" class="filter-control-label">All locations</span><span id="branchControlSub" class="filter-control-sub">4 locations</span></span>
          </button>
        </div>
        <div>
          <button id="dateRange" class="filter-select" type="button">
            <span class="filter-label">Last 30 days</span>
          </button>
        </div>
        <div>
          <button id="serviceType" class="filter-select" type="button">
            <span class="filter-label">All services</span>
          </button>
        </div>
        <button id="clearFilters" class="filter-reset" type="button" hidden>Reset all filters</button>
      </div>
    </div>
  </section>

  <div id="filterDim" class="filter-dim" aria-hidden="true"></div>

  <main id="workspace" class="scroll" tabindex="0" aria-live="polite"></main>

  <nav id="bottomRail" class="bottom-rail" role="tablist" aria-label="Event supplier dashboard sections">
    <button class="rail-tab" type="button" role="tab" aria-selected="false" data-tab="overview"><span class="rail-label">Overview</span></button>
    <button class="rail-tab" type="button" role="tab" aria-selected="false" data-tab="quotes"><span class="rail-label">Quotes</span></button>

function scopeLocations(){return locations().filter(b=>channel==='all'||b.channels.includes(channel))}
function channelRevenue(b){
 if(channel==='all')return Object.values(b.revenue).reduce((a,c)=>a+c,0)*periodFactor();
 return (b.revenue[channel]||0)*periodFactor();
}
function nfmt(v){return Math.round(v).toLocaleString('en-US')}
function money(v){return 'P'+Math.round(v).toLocaleString('en-US')}
function dec(v,d=1){return Number(v).toFixed(d)}
function percent(v,d=0){return dec(v,d)+'%'}
function selectedScope(){const bs=locations();return bs.length===LOCATIONS.length?'All locations':bs.length===1?bs[0].name:bs.length+' locations selected'}
function rangeNote(){return `${selectedScope()} · ${periodLabel()} · ${CHANNELS[channel]}`}
function pageHeader(title,sub){return `<div class="page-head"><h2 class="page-title">${title}</h2><p class="page-subtitle">${esc(sub||rangeNote())}</p></div>`}
function sectionTitle(title,note=''){return `<div class="section-title"><div>${title}${note?`<div class="section-note">${note}</div>`:''}</div></div>`}
function cardHead(title,sub=''){return `<div class="card-head"><div class="card-head-main"><h3 class="card-title">${title}</h3>${sub?`<p class="card-subtitle">${sub}</p>`:''}</div></div>`}
function badge(text,type='neutral'){return `<span class="badge ${type}">${text}</span>`}
function statRows(rows){return `<div class="stat-list">${rows.map(r=>`<div class="stat-row"><div class="stat-row-main"><div class="stat-row-label">${r.label}</div>${r.note?`<div class="stat-row-note">${r.note}</div>`:''}</div><div class="stat-row-value">${r.value}</div></div>`).join('')}</div>`}
function barRows(rows,maxValue){return `<div class="bar-list">${rows.map(r=>`<div class="bar-row"><div class="bar-label">${esc(r.label)}</div><div class="bar-track"><i class="bar-fill ${r.colour||''}" style="width:${Math.max(2,Math.min(100,(r.value/(maxValue||1))*100))}%"></i></div><div class="bar-value">${esc(r.display==null?r.value:r.display)}</div></div>`).join('')}</div>`}
function zeroState(){return `<div class="empty-state">No locations are selected. Open Filter above and choose at least one branch to view the dashboard.</div>`}

/* ── KPI tiles ── */
let kpiSeq=0;
const KPI_INFO=new Map();
function kpi(label,value,sub,detail){
 const id='k'+(++kpiSeq);
 KPI_INFO.set(id,{label,value,sub:sub||'',detail:detail||''});
 return `<button class="kpi" type="button" data-kpi="${id}" aria-haspopup="dialog" aria-label="${esc(label)}: ${esc(value)}"><span class="kpi-main"><span class="kpi-label">${label}</span></span><span class="kpi-value">${value}</span></button>`;
}
function openKpiPopup(id){
 const info=KPI_INFO.get(id);if(!info)return;
 $('#kpiPopupTitle').textContent=info.label;
 $('#kpiPopupValue').textContent=info.value;
 $('#kpiPopupSub').textContent=info.sub;
 $('#kpiPopupText').textContent=info.detail||'Illustrative sample data for the current branch, period and service selection.';
 $('#kpiScrim').classList.add('open');
 $('#kpiScrim').setAttribute('aria-hidden','false');
}
function closeKpiPopup(){
 $('#kpiScrim').classList.remove('open');
 $('#kpiScrim').setAttribute('aria-hidden','true');
}

 html+=`<div class="card">${cardHead('Partner performance','Reliability, margin and volume.')}<div class="table-wrap"><table><thead><tr><th>Partner</th><th>Category</th><th class="num">Deliveries</th><th class="num">On-time</th><th class="num">Margin</th><th>Reliability</th></tr></thead><tbody>${PARTNER_PERFORMANCE.map(p=>`<tr><td>${esc(p.partner)}</td><td>${esc(p.category)}</td><td class="num">${p.deliveries}</td><td class="num">${p.onTime}%</td><td class="num">${money(p.margin)}</td><td>${badge(p.reliability,p.reliability==='A'?'good':p.reliability==='B'?'info':'warn')}</td></tr>`).join('')}</tbody></table></div></div>`;

 html+=`<div class="card">${cardHead('Exclusivity effectiveness','Are exclusive partnerships generating enough volume?')}<div class="table-wrap"><table><thead><tr><th>Partner</th><th>Exclusive</th><th>Volume</th><th class="num">Monthly value</th><th>Assessment</th></tr></thead><tbody>${EXCLUSIVITY.map(e=>`<tr><td>${esc(e.partner)}</td><td>${e.exclusive?badge('Exclusive','warn'):badge('Open','neutral')}</td><td>${esc(e.volume)}</td><td class="num">${esc(e.value)}</td><td>${badge(e.assessment,e.assessment==='Renew'?'good':e.assessment==='Expand'?'info':'warn')}</td></tr>`).join('')}</tbody></table></div></div>`;

 html+=`<div class="card">${cardHead('Backup supplier reliability','When a supplier fails, how often do you recover?')}${statRows([
   {label:'Supplier failures this quarter',note:'Events affected',value:'4'},
   {label:'Successful recoveries',note:'Backup supplier used',value:'3'},
   {label:'Recovery rate',note:'Recoveries ÷ failures',value:percent(75)},
   {label:'Main backup used',note:'Most common fallback',value:'Glow Lighting'}
 ])}</div>`;
 return html;
}

/* ── Compliance ── */
function renderCompliance(){
 const bs=scopeLocations();if(!bs.length)return pageHeader('Compliance')+zeroState();
 const expiring=INSURANCE_POLICIES.filter(p=>p.daysLeft<=60).length;
 const active=INSURANCE_POLICIES.filter(p=>p.daysLeft>60).length;
 const checkCompliance=CONDITION_CHECK.reduce((s,c)=>(s+c.checkoutComplete+c.checkinComplete)/2,0)/CONDITION_CHECK.length;
 const missingDisputes=MISSING_DISPUTES.reduce((s,d)=>s+d.count,0);

 let html=pageHeader('Compliance & risk','Insurance, condition checks and disputes for '+rangeNote()+'.');
 html+=`<div class="kpi-grid">
   ${kpi('Active policies',String(active),'of '+INSURANCE_POLICIES.length,'Insurance policies that are current and not expiring within 60 days.')}
   ${kpi('Expiring soon',String(expiring),'≤60 days','Policies expiring within 60 days.')}
   ${kpi('Check compliance',percent(checkCompliance),'Checkout & check-in','Average completion rate of condition check-out and check-in logs.')}
   ${kpi('Missing items',nfmt(missingDisputes),'Disputes','Total missing-item disputes logged in the period.')}
 </div>`;

 html+=`<div class="card">${cardHead('Insurance policies','Cover, expiry and status.')}<div class="table-wrap"><table><thead><tr><th>Type</th><th>Provider</th><th>Policy</th><th>Expiry</th><th class="num">Days left</th><th>Status</th></tr></thead><tbody>${INSURANCE_POLICIES.map(p=>`<tr><td>${esc(p.type)}</td><td>${esc(p.provider)}</td><td>${esc(p.policyNumber)}</td><td>${esc(p.expiry)}</td><td class="num">${p.daysLeft}</td><td>${badge(p.status,p.status==='Current'?'good':'warn')}</td></tr>`).join('')}</tbody></table></div></div>`;

 html+=`<div class="card">${cardHead('Condition check compliance','Check-out and check-in inspections being done.')}<div class="table-wrap"><table><thead><tr><th>Cycle</th><th class="num">Checkout</th><th class="num">Check-in</th><th class="num">Missing</th><th class="num">Disputes</th><th>Signal</th></tr></thead><tbody>${CONDITION_CHECK.map(c=>`<tr><td>${esc(c.cycle)}</td><td class="num">${c.checkoutComplete}%</td><td class="num">${c.checkinComplete}%</td><td class="num">${c.missing}</td><td class="num">${c.disputes}</td><td>${c.checkoutComplete>=95&&c.checkinComplete>=95?badge('Excellent','good'):c.checkoutComplete>=90?badge('Watch','warn'):badge('Fix','bad')}</td></tr>`).join('')}</tbody></table></div></div>`;

 html+=`<div class="card">${cardHead('Missing item disputes','Items most frequently disputed.')}<div class="table-wrap"><table><thead><tr><th>Item</th><th class="num">Count</th><th class="num">Disputed</th><th class="num">Resolved</th><th class="num">Value</th></tr></thead><tbody>${MISSING_DISPUTES.map(m=>`<tr><td>${esc(m.item)}</td><td class="num">${m.count}</td><td class="num">${m.disputed}</td><td class="num">${m.resolved}</td><td class="num">${money(m.value)}</td></tr>`).join('')}</tbody></table></div></div>`;

 html+=`<div class="card">${cardHead('Dispute trend','Is the dispute rate improving?')}${statRows([
   {label:'Disputes this period',note:'Total disputed items',value:nfmt(MISSING_DISPUTES.reduce((s,d)=>s+d.disputed,0))},
   {label:'Disputes last period',note:'Baseline',value:nfmt(4)},
   {label:'Change',note:'Relative to previous period',value:badge('+40%','bad')},
   {label:'Recommended action',note:'Review check-in process',value:badge('Review','warn')}
 ])}</div>`;

 html+=`<div class="card">${cardHead('Condition check-in/out compliance','Documented inspections per rental cycle.')}${statRows([
   {label:'Cycles documented',note:'Fully checked',value:CONDITION_CHECK.filter(c=>c.checkoutComplete>=95&&c.checkinComplete>=95).length+' of '+CONDITION_CHECK.length},
   {label:'Avg check-out',note:'Completion rate',value:percent(CONDITION_CHECK.reduce((s,c)=>s+c.checkoutComplete,0)/CONDITION_CHECK.length)},
   {label:'Avg check-in',note:'Completion rate',value:percent(CONDITION_CHECK.reduce((s,c)=>s+c.checkinComplete,0)/CONDITION_CHECK.length)},
   {label:'Missing item rate',note:'Missing per cycle',value:percent(MISSING_DISPUTES.reduce((s,d)=>s+d.count,0)/CONDITION_CHECK.length)}
 ])}</div>`;
 return html;
}

/* ── Alerts ── */
function renderAlerts(){
 let html=pageHeader('Alerts & signals','Trend and risk signals across '+rangeNote()+'.');
 const list=ALERTS.map(a=>`<div class="alert ${a.type}"><div class="alert-mark">${a.type==='danger'||a.type==='warning'?'!':a.type==='good'?'✓':'i'}</div><div class="alert-main"><div class="alert-title">${esc(a.title)}</div><div class="alert-text">${esc(a.text)}</div></div></div>`).join('');
 html+=`<div class="card"><div class="alert-list">${list}</div></div>`;
 return html;
}

/* ── Reviews ── */
function renderReviews(){
 const avg=(REVIEWS.reduce((s,r)=>s+r.stars,0)/REVIEWS.length).toFixed(1);
 const list=REVIEWS.map(r=>`<div class="card" style="margin-bottom:9px"><div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><div><div class="table-title">${esc(r.customer)}</div><div class="table-sub">${'★'.repeat(r.stars)}${'☆'.repeat(5-r.stars)} · ${esc(r.date)}</div></div>${badge(r.type,'info')}</div><p style="font-size:14px;color:var(--ink2);line-height:1.4;margin:8px 0 0">${esc(r.text)}</p></div>`).join('');
 return pageHeader('Reviews','Post-event feedback and ratings.')+
  `<div class="kpi-grid">
    ${kpi('Reviews',nfmt(REVIEWS.length),'Total','Post-event reviews received in this period.')}
    ${kpi('Average rating',avg,'Out of 5','Mean star rating across the listed reviews.')}
    ${kpi('Response rate','100%','All reviewed','All reviews have been acknowledged or replied to.')}
    ${kpi('Awaiting reply',nfmt(0),'Pending','Reviews still needing a response.')}
   </div>`+list;
}

/* ── Reports ── */
function renderReports(){
 const bs=scopeLocations();
 const revenue=bs.reduce((s,b)=>s+channelRevenue(b),0);
 return pageHeader('Reports','Summary and export for the current scope.')+
  `<div class="kpi-grid">
    ${kpi('Locations',String(bs.length),'In scope','Locations included in this report.')}
    ${kpi('Recorded revenue',money(revenue),'Sample total','Total illustrative revenue in scope.')}
    ${kpi('Quotes',nfmt(bs.reduce((s,b)=>s+b.quotesIssued,0)),'Issued','Quotes issued across selected locations.')}
    ${kpi('Bookings',nfmt(bs.reduce((s,b)=>s+b.quotesBooked,0)),'Confirmed','Bookings confirmed across selected locations.')}
   </div>`+
  `<div class="card">${cardHead('Export')}<p class="card-subtitle">Download a CSV summary for the current location selection, period and service category.</p><div class="button-row"><button id="exportCsv" class="btn primary full" type="button">Download CSV report</button></div></div>`+
  `<div class="card">${cardHead('Revenue breakdown by service')}<div class="table-wrap"><table><thead><tr><th>Service</th><th class="num">Revenue</th></tr></thead><tbody>${['rental','decor','av','floristry','crew'].map(k=>`<tr><td>${esc(CHANNELS[k])}</td><td class="num">${money(bs.reduce((s,b)=>s+(b.revenue[k]||0)*(channel==='all'||channel===k?1:0),0)*periodFactor())}</td></tr>`).join('')}</tbody></table></div></div>`;
}

/* ── Settings ── */
function renderSettings(){
 return pageHeader('Settings','Business identity and publishing controls.')+
  `<div class="card">${cardHead('Business profile')}${statRows([{label:'Display name',note:'Shown across the dashboard and listing.',value:esc(businessName)},{label:'Locations',note:'Locations included in this workspace.',value:String(LOCATIONS.length)},{label:'Publishing status',note:'Live or draft.',value:badge('Ready','good')}])}<div class="button-row"><button class="btn secondary full" type="button">Edit profile</button></div></div>`+
  `<div class="card">${cardHead('Publishing')}<p class="card-subtitle">Publishing is blocked until profile, insurance and inventory confirmation are complete.</p><div class="button-row"><button class="btn primary full" type="button">Publish business</button></div></div>`;
}

const RENDERERS={
 overview:renderOverview,
 quotes:renderQuotes,
 inventory:renderInventory,
 logistics:renderLogistics,
 partners:renderPartners,
 compliance:renderCompliance,
 alerts:renderAlerts,
 reviews:renderReviews,
 reports:renderReports,
 settings:renderSettings
};

/* ── Workspace ── */
function renderWorkspace(){
 const host=$('#workspace');host.innerHTML=RENDERERS[activeTab]();
 $$('#bottomRail .rail-tab').forEach(btn=>{const on=btn.dataset.tab===activeTab;btn.classList.toggle('active',on);btn.setAttribute('aria-selected',String(on));btn.tabIndex=on?0:-1});
 updateFilterUI();
 if(filterOpen)positionFilterDim();
}
function updateFilterUI(){
 const bs=locations(),num=selectedIds.length;
 $('#branchControlLabel').textContent=num===LOCATIONS.length?'All locations':num===1?bs[0].name:`${num} locations`;
 $('#branchControlSub').textContent=bs.length?bs.map(b=>b.name).join(', '):'No locations selected';
 const dl=periodLabel();
 $('#dateRange').querySelector('.filter-label').textContent=dl;
 $('#serviceType').querySelector('.filter-label').textContent=CHANNELS[channel];
 const active=[];
 if(num!==LOCATIONS.length)active.push(`${num} ${num===1?'location':'locations'}`);
 if(period!=='30')active.push(dl);
 if(channel!=='all')active.push(CHANNELS[channel]);
 $('#filterAccordionMeta').textContent=active.length?active.join(' · '):'All locations · Last 30 days';
 $('#clearFilters').hidden=(num===LOCATIONS.length&&period==='30'&&channel==='all');
}

/* ── Filter dim ── */
function positionFilterDim(){
 const shell=$('#shell'),fs=$('#filterAccordion'),rail=$('#bottomRail'),dim=$('#filterDim');
 const shellRect=shell.getBoundingClientRect(),fsRect=fs.getBoundingClientRect(),railRect=rail.getBoundingClientRect();
 dim.style.top=(fsRect.bottom-shellRect.top)+'px';
 dim.style.bottom=(shellRect.bottom-railRect.top)+'px';
}
function setFilterOpen(open){
 filterOpen=open;
 $('#filterToggle').setAttribute('aria-expanded',String(open));
 $('#filterAccordionBody').hidden=!open;
 const dim=$('#filterDim');
 if(open){positionFilterDim();dim.classList.add('show');dim.setAttribute('aria-hidden','false')}
 else{dim.classList.remove('show');dim.setAttribute('aria-hidden','true')}
}

/* ── Branch sheet ── */
function renderBranchOptions(){
 const q=($('#branchSearchInput').value||'').trim().toLowerCase();
 const list=LOCATIONS.filter(b=>(b.name+' '+b.area+' '+b.type).toLowerCase().includes(q));
 $('#branchOptions').innerHTML=list.length?list.map(b=>`<label class="branch-option"><input type="checkbox" data-branch-check="${esc(b.id)}" ${draftIds.includes(b.id)?'checked':''}><span class="branch-option-main"><span class="branch-option-name">${esc(b.name)}</span><span class="branch-option-location">${esc(b.area)} · ${esc(b.type)}</span></span></label>`).join(''):`<div class="empty-state">No matching location. Try another name or area.</div>`;
 updateApplyBtn();
}
function updateApplyBtn(){
 const btn=$('#applyBranches');
 if(draftIds.length){btn.hidden=false;btn.textContent='View '+draftIds.length}
 else{btn.hidden=true;btn.textContent='View 0'}
}
function openBranchSheet(){
 draftIds=[...selectedIds];
 $('#branchSearchInput').value='';
 renderBranchOptions();
 $('#branchScrim').classList.add('open');
 $('#branchScrim').setAttribute('aria-hidden','false');
 $('#branchPicker').setAttribute('aria-expanded','true');
 setTimeout(()=>$('#branchSearchInput').focus(),150);
}
function closeBranchSheet(){
 $('#branchScrim').classList.remove('open');
 $('#branchScrim').setAttribute('aria-hidden','true');
 $('#branchPicker').setAttribute('aria-expanded','false');
 $('#branchPicker').focus();
}

/* ── Date popup ── */
const DATE_PRESETS=[
 ['today','Today'],['yesterday','Yesterday'],['7','Last 7 days'],['30','Last 30 days'],
 ['3m','Last 3 months'],['6m','Last 6 months'],['1y','Last 1 year']
];
function renderDatePopup(){
 const wrap=$('#datePresets');
 wrap.innerHTML=DATE_PRESETS.map(([key,label])=>`<button type="button" class="date-preset ${period===key?'active':''}" data-preset="${key}">${label}</button>`).join('');
 const rows=$('#specificDateRows');
 if(!customDraftDates.length){customDraftDates=[{checked:false,year:new Date().getFullYear(),month:1,day:1}]}
 rows.innerHTML=customDraftDates.map((d,i)=>`
  <div class="date-row" data-row="${i}">
    <input type="checkbox" data-check ${d.checked?'checked':''}>
    <input type="number" data-year min="2000" max="2100" value="${d.year||''}" placeholder="YYYY">
    <select data-month>${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'].map((m,idx)=>`<option value="${idx+1}" ${Number(d.month)===idx+1?'selected':''}>${m}</option>`).join('')}</select>
    <input type="number" data-day min="1" max="31" value="${d.day||''}" placeholder="DD">
    <div class="date-actions"><button type="button" data-add title="Add a row below">+</button><button type="button" data-remove title="Remove this row">−</button></div>
  </div>`).join('');
}
function openDatePopup(){
 customDraftDates=customDates.length?customDates.map(d=>({...d})):[{checked:false,year:new Date().getFullYear(),month:new Date().getMonth()+1,day:new Date().getDate()}];
 renderDatePopup();
 $('#dateScrim').classList.add('open');
 $('#dateScrim').setAttribute('aria-hidden','false');
}
function closeDatePopup(){
 $('#dateScrim').classList.remove('open');
 $('#dateScrim').setAttribute('aria-hidden','true');
 $('#dateRange').focus();
}
function collectDateDraft(){
 const rows=$$('#specificDateRows .date-row');
 customDraftDates=rows.map(r=>({
  checked:r.querySelector('[data-check]').checked,
  year:Number(r.querySelector('[data-year]').value)||0,
  month:Number(r.querySelector('[data-month]').value)||1,
  day:Number(r.querySelector('[data-day]').value)||0
 }));
}

/* ── Channel popup ── */
function renderServicePopup(){
 const opts=['all','rental','decor','av','floristry','crew'];
 $('#serviceOptions').innerHTML=opts.map(k=>`<button type="button" class="service-option ${channel===k?'active':''}" data-service="${k}">${CHANNELS[k]}</button>`).join('');
}
function openServicePopup(){
 renderServicePopup();
 $('#serviceScrim').classList.add('open');
 $('#serviceScrim').setAttribute('aria-hidden','false');
}
function closeServicePopup(){
 $('#serviceScrim').classList.remove('open');
 $('#serviceScrim').setAttribute('aria-hidden','true');
 $('#serviceType').focus();
}

/* ── CSV ── */
function csvCell(v){return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'}
function downloadCsv(){
 const rows=[['EatOuts Event Supplier Dashboard — illustrative demo report'],['Business',businessName],['Scope',selectedScope()],['Period',periodLabel()],['Service',CHANNELS[channel]],['Data status','Illustrative demo data — not live measurements'],[],['Location','Area','Type','Quotes issued','Quotes booked','Avg quote','Utilisation','Damage rate','On-time delivery','Rating']];
 scopeLocations().forEach(b=>{rows.push([b.name,b.area,b.type,b.quotesIssued,b.quotesBooked,b.avgQuote,b.utilizationPct,b.damageRate,b.onTimeDelivery,b.rating])});
 const csv=rows.map(r=>r.map(csvCell).join(',')).join('\r\n');
 const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});
 const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='eatouts-event-supplier-demo-report.csv';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);toast('CSV report downloaded');
}

/* ── Tab switching ── */
function setTab(tab){
 if(!RENDERERS[tab])return;
 activeTab=tab;renderWorkspace();$('#workspace').scrollTop=0;
 const btn=$(`#bottomRail [data-tab="${tab}"]`);
 if(btn){const rail=$('#bottomRail');const left=btn.offsetLeft,right=left+btn.offsetWidth,vl=rail.scrollLeft,vr=vl+rail.clientWidth;if(left<vl||right>vr)btn.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'})}
}

/* ── Events ── */
function bindEvents(){
 $('#filterToggle').addEventListener('click',()=>setFilterOpen(!filterOpen));
 $('#filterDim').addEventListener('click',()=>setFilterOpen(false));
 window.addEventListener('resize',()=>{if(filterOpen)positionFilterDim()});

 $('#branchPicker').addEventListener('click',openBranchSheet);
 $('#branchSearchInput').addEventListener('input',renderBranchOptions);
 $('#branchSearch').addEventListener('click',()=>{draftIds=LOCATIONS.map(b=>b.id);renderBranchOptions()});
 $('#clearBranchSelection').addEventListener('click',()=>{draftIds=[];renderBranchOptions()});
 $('#branchOptions').addEventListener('change',e=>{
  const cb=e.target.closest('[data-branch-check]');if(!cb)return;
  if(cb.checked){if(!draftIds.includes(cb.dataset.branchCheck))draftIds.push(cb.dataset.branchCheck)}
  else draftIds=draftIds.filter(id=>id!==cb.dataset.branchCheck);
  renderBranchOptions();
 });
 $('#applyBranches').addEventListener('click',()=>{
  selectedIds=LOCATIONS.map(b=>b.id).filter(id=>draftIds.includes(id));
  closeBranchSheet();renderWorkspace();
  toast(selectedIds.length?`Showing ${selectedIds.length} ${selectedIds.length===1?'location':'locations'}`:'Choose a location to populate the dashboard');
 });
 $('#branchScrim').addEventListener('click',e=>{if(e.target===$('#branchScrim'))closeBranchSheet()});

 $('#dateRange').addEventListener('click',openDatePopup);
 $('#datePresets').addEventListener('click',e=>{
  const btn=e.target.closest('[data-preset]');if(!btn)return;
  period=btn.dataset.preset;customDates=[];customDraftDates=[];
  $('#dateScrim').classList.remove('open');$('#dateScrim').setAttribute('aria-hidden','true');
  renderWorkspace();
 });
 $('#addSpecificDate').addEventListener('click',()=>{
  collectDateDraft();
  customDraftDates.push({checked:false,year:new Date().getFullYear(),month:new Date().getMonth()+1,day:new Date().getDate()});
  renderDatePopup();
 });
 $('#specificDateRows').addEventListener('click',e=>{
  const add=e.target.closest('[data-add]'),rm=e.target.closest('[data-remove]');
  if(add){collectDateDraft();customDraftDates.push({checked:false,year:new Date().getFullYear(),month:new Date().getMonth()+1,day:new Date().getDate()});renderDatePopup()}
  if(rm){const row=e.target.closest('.date-row');const idx=Number(row.dataset.row);collectDateDraft();customDraftDates.splice(idx,1);if(!customDraftDates.length)customDraftDates=[{checked:false,year:new Date().getFullYear(),month:new Date().getMonth()+1,day:new Date().getDate()}];renderDatePopup()}
 });
 $('#applyDate').addEventListener('click',()=>{
  collectDateDraft();
  const picked=customDraftDates.filter(d=>d.checked&&d.year>=2000&&d.month>=1&&d.day>=1);
  if(!picked.length){toast('Tick at least one specific date');return}
  customDates=picked;period='custom';
  closeDatePopup();renderWorkspace();
 });
 $$('[data-close-date]').forEach(b=>b.addEventListener('click',closeDatePopup));
 $('#dateScrim').addEventListener('click',e=>{if(e.target===$('#dateScrim'))closeDatePopup()});

 $('#serviceType').addEventListener('click',openServicePopup);
 $('#serviceOptions').addEventListener('click',e=>{
  const btn=e.target.closest('[data-service]');if(!btn)return;
  channel=btn.dataset.service;
  closeServicePopup();renderWorkspace();
 });
 $$('[data-close-service]').forEach(b=>b.addEventListener('click',closeServicePopup));
 $('#serviceScrim').addEventListener('click',e=>{if(e.target===$('#serviceScrim'))closeServicePopup()});

 $$('[data-close-kpi]').forEach(b=>b.addEventListener('click',closeKpiPopup));
 $('#kpiScrim').addEventListener('click',e=>{if(e.target===$('#kpiScrim'))closeKpiPopup()});

 $('#clearFilters').addEventListener('click',()=>{
  selectedIds=LOCATIONS.map(b=>b.id);period='30';channel='all';customDates=[];customDraftDates=[];
  renderWorkspace();toast('Filters reset');
 });

 $('#bottomRail').addEventListener('click',e=>{const btn=e.target.closest('[data-tab]');if(btn)setTab(btn.dataset.tab)});

 $('#workspace').addEventListener('click',e=>{
  const kp=e.target.closest('[data-kpi]');
  if(kp){openKpiPopup(kp.dataset.kpi);return}
  const go=e.target.closest('[data-goto]');if(go){setTab(go.dataset.goto);return}
  if(e.target.closest('#exportCsv')){downloadCsv();return}
 });

 document.addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  if($('#branchScrim').classList.contains('open'))closeBranchSheet();
  else if($('#dateScrim').classList.contains('open'))closeDatePopup();
  else if($('#serviceScrim').classList.contains('open'))closeServicePopup();
  else if($('#kpiScrim').classList.contains('open'))closeKpiPopup();
  else if(filterOpen)setFilterOpen(false);
 });
}

function start(){
 loadSavedProfile();
 $('#restaurantName').textContent=businessName;
 $('#logoFallback').textContent=(businessName||'S').charAt(0).toUpperCase();
 bindEvents();
 renderWorkspace();
}
start();
})();
</script>
</body>
</html>
