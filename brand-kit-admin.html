<!DOCTYPE html>

<style>

body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;font-size:14px;line-height:1.45}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none;text-align:left}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.topbar{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;gap:14px}
.brand{font-weight:900;font-size:16px;letter-spacing:-.02em;color:var(--black)}.brand span{color:var(--gold)}
.page{flex:1;font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.top-actions{display:flex;gap:8px;align-items:center}.demo-note{font-size:10px;color:var(--warn);font-weight:800}
.tabs{background:#fff;border-bottom:1px solid var(--line);display:flex;overflow-x:auto;padding:0 12px;position:sticky;top:57px;z-index:29}
.tab{flex:0 0 auto;padding:13px 14px;font-size:12.5px;font-weight:800;color:var(--muted);border-bottom:2px solid transparent;text-decoration:none;white-space:nowrap}

.app{max-width:1300px;margin:0 auto;padding:20px 20px 60px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:20px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.stat label{font-size:10px;font-weight:900;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:6px}
.stat strong{font-size:22px;font-weight:900;letter-spacing:-.02em;display:block;overflow-wrap:anywhere}
.stat em{font-style:normal;font-size:10.5px;color:var(--muted);font-weight:600}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);margin-bottom:16px;padding:18px;min-width:0}
.card h2{margin:0 0 12px;font-size:15px;font-weight:900;letter-spacing:-.01em}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filter{border:1px solid var(--line);background:#fff;padding:8px 12px;font-size:11.5px;font-weight:800;border-radius:8px;color:#5c5547}
.filter.active{background:var(--black);color:#fff;border-color:var(--black)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.toolbar input,.toolbar select,.field input,.field select,.field textarea{min-width:0;width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:8px;background:#fff}
.toolbar .search{flex:1 1 230px}.toolbar select{width:auto;flex:0 1 180px}
.table-wrap{width:100%;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:740px}
th{text-align:left;background:#faf8f2;color:var(--muted);padding:11px 10px;font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:top}tr:last-child td{border-bottom:0}
.biz{font-weight:900;font-size:12.5px}.sub{font-size:11px;color:var(--muted);font-weight:600;margin-top:2px}
.pill{display:inline-flex;align-items:center;font-size:10px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;padding:4px 8px;border-radius:999px;background:var(--soft);border:1px solid var(--line);color:#5c5547;white-space:nowrap}
.pill.ok{background:#f5faf6;border-color:#b9d2c0;color:var(--ok)}.pill.warn{background:#fffbef;border-color:#ead8a8;color:var(--warn)}.pill.bad{background:#fff7f6;border-color:#e9c6c1;color:var(--danger)}.pill.neutral{background:#f7f7f7;color:#666}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:34px;padding:0 12px;border-radius:8px;font-size:11.5px;font-weight:800;background:var(--soft);border:1px solid var(--line);color:#3a3324;text-decoration:none;gap:6px;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--black);color:#fff;border-color:var(--black)}.btn.ok{background:#e3f5e9;color:var(--ok);border-color:#b8e6c1}.btn.bad{background:#fbeaea;color:var(--danger);border-color:#e0c9c9}.btn.sm{min-height:28px;padding:0 10px;font-size:11px}
.empty{padding:36px 20px;text-align:center;color:var(--muted);font-size:13px}.muted{color:var(--muted)}.footnote{font-size:11px;color:var(--muted);line-height:1.55;margin-top:12px}
.notice{background:#fffbef;border:1px solid #ead8a8;color:#694d00;border-radius:8px;padding:11px 13px;font-size:11.5px;line-height:1.5;margin-bottom:16px}
.notice.bad{background:#fff7f6;border-color:#e9c6c1;color:#8a2e27}.notice.ok{background:#f5faf6;border-color:#b9d2c0;color:#17663d}
.job-detail{background:#fbfaf8;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.job-detail h3{margin:0 0 8px;font-size:14px;font-weight:900}.job-detail h4{margin:16px 0 7px;font-size:12px}
.brow{display:flex;gap:8px;padding:7px 0;font-size:12px;border-bottom:1px solid var(--line);overflow-wrap:anywhere}.brow:last-of-type{border:0}
.brow strong{flex:0 0 140px;color:var(--muted);font-size:10.5px;font-weight:900;text-transform:uppercase;letter-spacing:.05em;padding-top:1px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.portfolio-thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.portfolio-thumbs .th{width:56px;height:56px;border-radius:6px;background:var(--soft);overflow:hidden;border:1px solid var(--line)}
.portfolio-thumbs .th img{width:100%;height:100%;object-fit:cover}.fallback{width:100%;height:100%;background:linear-gradient(135deg,#f1ede0,#e4ddc9);display:flex;align-items:center;justify-content:center;color:#8d805e;font-size:10px;font-weight:900}
.ds-av-wrap{position:relative;flex:0 0 auto;border-radius:50%;overflow:hidden;background:linear-gradient(135deg,#f1ede0,#e4ddc9);display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;margin-right:8px}
.ds-av-wrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%}
.ds-av-ini{display:inline-flex;align-items:center;justify-content:center;width:100%;height:100%;color:#8d805e;font-weight:900;letter-spacing:.04em;text-transform:uppercase;border-radius:50%}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:11px;min-width:0}.field label{font-size:10px;text-transform:uppercase;letter-spacing:.06em;font-weight:900;color:var(--muted)}
.field textarea{min-height:78px;resize:vertical}.field input[type=checkbox]{width:auto;min-height:auto}
.inline-check{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;margin:8px 0}.inline-check input{width:auto}
.service-category{margin:17px 0 8px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:900}
.small{font-size:11px}.right{text-align:right}.nowrap{white-space:nowrap}
.footer-note{padding:4px 2px 22px;color:var(--muted);font-size:10.5px;line-height:1.5}
@media(max-width:800px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.app{padding:14px 12px 40px}.card{padding:14px}.topbar{padding:12px}.brow strong{flex-basis:112px}}
@media(max-width:520px){.page{font-size:10px}.stats{gap:8px}.stat{padding:11px}.stat strong{font-size:20px}.grid2{grid-template-columns:1fr}.top-actions .demo-note{display:none}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style>
</head>

var app=document.getElementById('app');
var serviceFallback=[
{id:'svc_logo_cleanup',category:'identity',name:'Logo clean-up',base_price:250,delivery_days:2,revision_rounds:1,deliverables:['Refined logo files'],is_recurring:false,recurrence:null,is_featured:true},

{id:'svc_packaging_system',category:'packaging',name:'Full packaging system',base_price:1800,delivery_days:14,revision_rounds:3,deliverables:['Bag','Box','Cup','Label'],is_recurring:false,recurrence:null,is_featured:true},
{id:'svc_animated_promo',category:'motion',name:'Animated promo (5–10 seconds)',base_price:400,delivery_days:4,revision_rounds:2,deliverables:['5–10 second animation'],is_recurring:false,recurrence:null,is_featured:false},
{id:'svc_event_teaser',category:'motion',name:'Event teaser reel (15–30 seconds)',base_price:800,delivery_days:7,revision_rounds:2,deliverables:['15–30 second reel'],is_recurring:false,recurrence:null,is_featured:false},
{id:'svc_social_video',category:'motion',name:'Full social video (30–60 seconds)',base_price:1200,delivery_days:10,revision_rounds:2,deliverables:['30–60 second edit from supplied footage'],is_recurring:false,recurrence:null,is_featured:false}
];
var categoryNames={identity:'Identity',promo:'Promo graphics',event:'Event flyers',menu:'Menu design',print:'Print & signage',social:'Social media packs',packaging:'Packaging',motion:'Motion graphics'};

function parseJSON(raw,fallback){try{var v=JSON.parse(raw);return v==null?fallback:v;}catch(e){return fallback;}}
function readArray(key){var a=parseJSON(localStorage.getItem(key),[]);return Array.isArray(a)?a:[];}
function writeArray(key,a){localStorage.setItem(key,JSON.stringify(a));}
function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function money(v){var n=Number(v);if(!Number.isFinite(n))n=0;try{return new Intl.NumberFormat('en-BW',{style:'currency',currency:'BWP',maximumFractionDigits:2}).format(n);}catch(e){return 'P'+n.toFixed(2);}}
function safeDate(v){var d=typeof v==='number'?new Date(v):new Date(v||0);return isNaN(d.getTime())?'—':d.toLocaleDateString();}
function stamp(){return Date.now();}
function makeId(prefix){return prefix+'_'+stamp().toString(36)+'_'+Math.random().toString(36).slice(2,7);}
function getDBSettings(){try{if(window.EatoutsDB&&typeof window.EatoutsDB.load==='function'){var db=window.EatoutsDB.load();return db&&db.settings||{};}}catch(e){}return {};}
function logAudit(action,target,before,after){
  var logs=readArray(KEYS.audit);
  logs.push({id:makeId('audit'),at:stamp(),actor:getAdminLabel(),action:action,target:target||'',before:before==null?null:before,after:after==null?null:after});
  if(logs.length>5000)logs=logs.slice(-5000);
  try{writeArray(KEYS.audit,logs);}catch(e){console.warn('Audit log could not be saved',e);}
}
function getAdminLabel(){try{if(window.EatoutsAuth&&typeof window.EatoutsAuth.getUser==='function'){var u=window.EatoutsAuth.getUser();if(u)return u.name||u.fullName||u.id||u.platformRole||'admin';}}catch(e){}return 'local-admin';}
function jobs(){
  var canonical=readArray(KEYS.jobs);
  if(canonical.length)return canonical;
  var old=readArray(KEYS.oldJobs);
  if(old.length){writeArray(KEYS.jobs,old);if(!localStorage.getItem(KEYS.oldJobs+'_migrated_at'))localStorage.setItem(KEYS.oldJobs+'_migrated_at',String(stamp()));return old;}
  return canonical;
}
function saveJobs(a){writeArray(KEYS.jobs,a);}
function designers(){
  var a=readArray(KEYS.designers);
  if(a.length)return a;
  try{if(window.EatoutsBrandKit&&typeof window.EatoutsBrandKit.designers==='function'){var b=window.EatoutsBrandKit.designers();if(b&&b.length)return b;}}catch(e){}
  return a;
}
function saveDesigners(a){writeArray(KEYS.designers,a);}
function services(){return readArray(KEYS.services);}
function saveServices(a){writeArray(KEYS.services,a);}
function normalizeJob(j){
  j=j||{};if(!j.id)j.id=makeId('job');if(!j.status)j.status='awaiting_admin';
  if(!j.price_breakdown){var total=Number(j.total||j.base_price||j.price||0);j.price_breakdown={gross:total,platform_cut:round2(total*.15),designer_payout:round2(total-round2(total*.15))};}
  if(!j.brief)j.brief={};if(!j.payout_status)j.payout_status='pending';
  if(j.is_recurring==null)j.is_recurring=!!(j.recurrence||j.slot_type==='retainer');
  if(!j.created_at)j.created_at=stamp();if(!j.updated_at)j.updated_at=j.created_at;
  return j;
}
function round2(n){return Math.round((Number(n)+Number.EPSILON)*100)/100;}
function seedIfNeeded(){
  /* Let the project's service module seed first if it exposes the expected API. */
  try{if(window.EatoutsBrandKit&&typeof window.EatoutsBrandKit.seedIfEmpty==='function')window.EatoutsBrandKit.seedIfEmpty();}catch(e){console.warn('Brand Kit seed module unavailable',e);}
  var ss=services();
  if(!ss.length){ss=serviceFallback.map(function(s){return Object.assign({tagline:'Design service for EatOuts businesses.',description:'Brief and deliverables confirmed during approval.',image:'',is_active:true},s);});saveServices(ss);}
  var ds=designers();
  if(!ds.length){
    var seedDes=(window.EATOUTS_DESIGNERS_SEED&&window.EATOUTS_DESIGNERS_SEED.designers)||null;
    if(seedDes&&seedDes.length){ds=seedDes.map(function(d){return Object.assign({},d);});}
    else ds=[
      {id:'des_001',portfolio_style:'Restaurant identity',portfolio:[],specialties:['identity','menu','print'],slot_type:['project'],active_projects:0,active_retainers:0,max_projects:1,max_retainers:3,jobs_completed:0,avg_turnaround_days:4,available:true,locked_by_admin:false},
      {id:'des_002',portfolio_style:'Promotional artwork',portfolio:[],specialties:['promo','event','social'],slot_type:['project','retainer'],active_projects:0,active_retainers:0,max_projects:1,max_retainers:3,jobs_completed:0,avg_turnaround_days:3,available:true,locked_by_admin:false},
      {id:'des_003',portfolio_style:'Digital & motion',portfolio:[],specialties:['promo','social','packaging','motion'],slot_type:['project','retainer'],active_projects:0,active_retainers:0,max_projects:1,max_retainers:3,jobs_completed:0,avg_turnaround_days:5,available:true,locked_by_admin:false}
    ];
    saveDesigners(ds);
  }
  /* Do not seed fake jobs. Real and demo jobs should only enter through a request or explicit demo action. */
}
function moneyFromJob(j,key){return Number((j.price_breakdown||{})[key]||0);}
function statusLabel(s){return ({awaiting_admin:'Awaiting admin',awaiting_match:'Awaiting match',assigned:'Assigned',in_progress:'In progress',revision:'Revision requested',delivered:'Delivered',client_approved:'Client approved',closed:'Closed',cancelled:'Cancelled',stalled:'Stalled',paused:'Paused'})[s]||String(s||'Unknown').replace(/_/g,' ');}
function pill(status){
  var cls=({awaiting_admin:'warn',awaiting_match:'warn',assigned:'warn',in_progress:'warn',revision:'warn',delivered:'ok',client_approved:'ok',closed:'ok',cancelled:'bad',stalled:'bad',paused:'neutral'})[status]||'neutral';
  return '<span class="pill '+cls+'">'+esc(statusLabel(status))+'</span>';
}
function tabTitle(){return ({jobs:'Brand & Design Jobs',designers:'Designer Roster',payouts:'Payouts & Earnings',services:'Service Catalogue'})[state.tab]||'Admin';}
function currentUserDenied(){
  var auth=window.EatoutsAuth;
  if(!auth)return false; /* local prototype mode if the auth module has not been integrated */
  try{
    var u=typeof auth.getUser==='function'?auth.getUser():null;
    if(!u)return false;
    var roles=[u.platformRole].concat(Array.isArray(u.roles)?u.roles:[]).filter(Boolean);
    var explicit=roles.some(function(r){return ['super_admin','platform_admin','platform_admin_owner','admin'].indexOf(r)>=0;});
    if(explicit)return false;
    if(typeof auth.can==='function' && (auth.can('brand_jobs.manage')||auth.can('platform.super_admin')||auth.can('jobs.assign')))return false;
    return true;
  }catch(e){return false;}

function getPendingCount(d,slot,excludeId){
  return jobs().filter(function(j){
    if(j.id===excludeId||j.designer_id!==d.id||j.status!=='awaiting_admin')return false;
    var jt=j.slot_type||(j.is_recurring?'retainer':'project');
    return jt===slot;
  }).length;
}
function getActiveCount(d,slot){
  var key=slot==='retainer'?'active_retainers':'active_projects';
  var stored=Math.max(0,Number(d[key]||0));
  var derived=jobs().filter(function(j){
    if(j.designer_id!==d.id)return false;
    var type=j.slot_type||(j.is_recurring?'retainer':'project');
    if(type!==slot)return false;
    if(slot==='retainer')return ['assigned','in_progress','revision','delivered','client_approved','stalled'].indexOf(j.status)>=0 && j.retainer_state!=='ended' && j.retainer_state!=='paused';
    return ['assigned','in_progress','revision','delivered','client_approved'].indexOf(j.status)>=0;
  }).length;
  /* Protect capacity if either the stored counter or the job ledger says the slot is occupied. */
  return Math.max(stored,derived);
}
function designerCanTake(d,slot,excludingJobId){
  if(!d||d.locked_by_admin)return false;
  var used=getActiveCount(d,slot)+getPendingCount(d,slot,excludingJobId);
  var limit=Number(slot==='retainer'?(d.max_retainers||3):(d.max_projects||1));
  return used<limit;
}
function reservePendingSlot(designer,jobId){
  if(!designer)return;
  if(!Array.isArray(designer.pending_job_ids))designer.pending_job_ids=[];
  if(designer.pending_job_ids.indexOf(jobId)<0)designer.pending_job_ids.push(jobId);
  designer.reserved_by_job_id=designer.pending_job_ids[0]||null;
}
function runAutoStall(){
  var all=jobs(),ds=designers(),now=stamp(),cutoff=14*24*60*60*1000,changed=[];
  all.forEach(function(j){
    if(j.is_recurring||['assigned','in_progress','revision','delivered'].indexOf(j.status)<0)return;
    var last=Number(j.client_activity_at||j.created_at||now);
    if(now-last<cutoff)return;
    var before=JSON.parse(JSON.stringify(j));
    j.status='stalled';j.stalled_at=now;j.stall_reason='No client activity for 14 days';j.updated_at=now;
    changed.push({id:j.id,before:before,after:j});
    var d=ds.findIndex(function(x){return x.id===j.designer_id;});
    if(d>=0)ds[d].active_projects=Math.max(0,Number(ds[d].active_projects||0)-1);
  });
  if(changed.length){
    saveAndAudit(KEYS.jobs,all,'job.auto_stalled',changed.map(function(x){return x.id;}).join(','),null,changed.map(function(x){return {id:x.id,status:x.after.status};}));
    saveDesigners(ds);
    changed.forEach(function(x){logAudit('designer.project.slot.released.stalled',x.after.designer_id,x.before,x.after);});
  }
}

function whatsappLink(j){

function saveAndAudit(key,rows,action,target,before,after){writeArray(key,rows);logAudit(action,target,before,after);}
function updateJob(id,action,mutator){
  var all=jobs(),idx=all.findIndex(function(j){return j.id===id;});
  if(idx<0){notify('Job not found.');return;}
  var before=JSON.parse(JSON.stringify(all[idx])),j=all[idx];

  j.updated_at=stamp();
  all[idx]=j;

function clearReservation(designer,jobId){
  if(!designer)return;
  if(Array.isArray(designer.pending_job_ids))designer.pending_job_ids=designer.pending_job_ids.filter(function(id){return id!==jobId;});
  if(designer.reserved_by_job_id===jobId)designer.reserved_by_job_id=null;
  if(Array.isArray(designer.reserved_jobs))designer.reserved_jobs=designer.reserved_jobs.filter(function(id){return id!==jobId;});
}
function getSlot(j){return j.slot_type||(j.is_recurring?'retainer':'project');}
function adjustCounter(d,slot,delta){
  var key=slot==='retainer'?'active_retainers':'active_projects';
  d[key]=Math.max(0,Number(d[key]||0)+delta);
}
function assignPendingDesigner(jobId,designerId){
  var j=jobs().filter(function(x){return x.id===jobId;})[0];
  if(!j||['awaiting_admin','awaiting_match'].indexOf(j.status)<0){notify('Only pending requests can be assigned here.');return;}
  if(!designerId){notify('Choose a designer portfolio first.');return;}
  var next=assignedDesigner(designerId);
  if(!next){notify('Designer record not found.');return;}
  var slot=getSlot(j);
  if(!designerCanTake(next,slot,jobId)&&next.id!==j.designer_id){notify('That designer has no available '+slot+' slot.');return;}
  if(!confirm('Assign this request to '+(next.portfolio_style||next.id)+'? The public portfolio remains anonymous.'))return;
  var old=assignedDesigner(j.designer_id);
  if(old&&old.id!==next.id){
    var oldBefore=JSON.parse(JSON.stringify(old));clearReservation(old,jobId);
    var oldList=designers(),oi=oldList.findIndex(function(x){return x.id===old.id;});
    if(oi>=0){oldList[oi]=old;saveAndAudit(KEYS.designers,oldList,'designer.pending.reservation.removed',old.id,oldBefore,old);}
  }
  updateJob(jobId,'job.designer.assigned',function(x){x.designer_id=next.id;x.slot_type=slot;x.assigned_candidate_at=stamp();});
  var ds=designers(),ni=ds.findIndex(function(x){return x.id===next.id;});
  if(ni>=0){var before=JSON.parse(JSON.stringify(ds[ni]));reservePendingSlot(ds[ni],jobId);saveAndAudit(KEYS.designers,ds,'designer.pending.reservation.added',next.id,before,ds[ni]);}
  notify('Designer portfolio assigned to the pending request.');
}
function approveJob(id){
  var all=jobs(),j=all.filter(function(x){return x.id===id;})[0];if(!j)return;
  var d=assignedDesigner(j.designer_id);if(!d){notify('This job has no valid designer assigned. Assign a designer first.');return;}
  if(d.locked_by_admin){notify('This designer is paused by admin. Unlock or reassign before approving.');return;}
  var slot=getSlot(j),active=getActiveCount(d,slot),pendingOther=getPendingCount(d,slot,id),max=Number(slot==='retainer'?d.max_retainers||3:d.max_projects||1);
  if(active+pendingOther>=max){notify('That designer has no available '+slot+' slot. Reassign the job before approving.');return;}
  if(!confirm('Approve '+j.id+' and assign it to '+(d.portfolio_style||d.id)+'? This will occupy a '+slot+' slot.'))return;
  var before=JSON.parse(JSON.stringify(j));
  updateJob(id,'job.approved',function(x){x.status='assigned';x.assigned_at=stamp();x.approved_by=getAdminLabel();x.slot_type=slot;});
  var ds=designers(),di=ds.findIndex(function(x){return x.id===d.id;});if(di>=0){clearReservation(ds[di],id);adjustCounter(ds[di],slot,1);saveAndAudit(KEYS.designers,ds,'designer.slot.occupied',d.id,d,ds[di]);}
  notify('Job approved and designer capacity updated.');
}
function rejectJob(id){
  var reason=prompt('Reason for rejecting this request (saved in the job record):','Not approved by EatOuts admin');
  if(reason===null)return;
  var j=jobs().filter(function(x){return x.id===id;})[0];if(!j)return;
  updateJob(id,'job.rejected',function(x){x.status='cancelled';x.cancel_reason=reason;x.cancelled_at=stamp();x.cancelled_by=getAdminLabel();});
  var ds=designers(),d=ds.findIndex(function(x){return x.id===j.designer_id;});if(d>=0){clearReservation(ds[d],id);saveAndAudit(KEYS.designers,ds,'designer.reservation.cleared',ds[d].id,designers()[d],ds[d]);}
  notify('Request rejected and pending reservation cleared.');
}
function deliverJob(id){
  if(!confirm('Confirm that the designer has submitted the delivery for client review?'))return;
  updateJob(id,'job.delivery_recorded',function(j){j.status='delivered';j.delivery=j.delivery||{};j.delivery.final_submitted_at=stamp();j.delivery.draft_submitted_at=j.delivery.draft_submitted_at||stamp();});

function clientApproved(id){

  updateJob(id,'job.client_approved',function(j){j.status='client_approved';j.delivery=j.delivery||{};j.delivery.client_reviewed_at=stamp();j.client_approved_at=stamp();});

}
function closeJob(id){
  var j=jobs().filter(function(x){return x.id===id;})[0];if(!j)return;
  if(j.is_recurring){notify('Use “End retainer” to release a recurring designer slot.');return;}
  if(j.status!=='client_approved'){notify('Record client approval before closing this job.');return;}
  if(!confirm('Close this job and release the designer project slot?'))return;
  updateJob(id,'job.closed',function(x){x.status='closed';x.closed_at=stamp();x.closed_by=getAdminLabel();});
  var ds=designers(),idx=ds.findIndex(function(d){return d.id===j.designer_id;});
  if(idx>=0){clearReservation(ds[idx],id);adjustCounter(ds[idx],'project',-1);ds[idx].jobs_completed=Number(ds[idx].jobs_completed||0)+1;saveAndAudit(KEYS.designers,ds,'designer.project.released',ds[idx].id,designers()[idx],ds[idx]);}
  notify('Job closed. Designer project slot released.');

function closeRetainerCycle(id){
  var j=jobs().filter(function(x){return x.id===id;})[0];if(!j)return;
  if(!confirm('Mark this monthly cycle approved? The retainer stays active and its slot remains occupied.'))return;
  updateJob(id,'retainer.cycle.closed',function(x){
    x.last_cycle_approved_at=stamp();x.cycle_number=Number(x.cycle_number||1)+1;x.status='in_progress';
    x.delivery={draft_submitted_at:null,client_reviewed_at:null,final_submitted_at:null,revisions_used:0,revisions_included:Number((x.delivery||{}).revisions_included||2)};
    x.payout_status='pending';
  });
  notify('Cycle recorded. Retainer remains active for the next cycle.');

function endRetainer(id){
  var j=jobs().filter(function(x){return x.id===id;})[0];if(!j)return;
  var reason=prompt('Reason for ending this retainer (saved to record):','Retainer ended by admin');

  var ds=designers(),idx=ds.findIndex(function(d){return d.id===j.designer_id;});
  if(idx>=0){clearReservation(ds[idx],id);adjustCounter(ds[idx],'retainer',-1);ds[idx].jobs_completed=Number(ds[idx].jobs_completed||0)+1;saveAndAudit(KEYS.designers,ds,'designer.retainer.released',ds[idx].id,designers()[idx],ds[idx]);}

function cancelJob(id){
  var j=jobs().filter(function(x){return x.id===id;})[0];if(!j)return;
  var reason=prompt('Reason for cancellation:','Cancelled by admin');if(reason===null)return;
  if(!confirm('Cancel this job? If it occupies an active slot, that slot will be released.'))return;
  updateJob(id,'job.cancelled',function(x){x.status='cancelled';x.cancel_reason=reason;x.cancelled_at=stamp();});
  var ds=designers(),idx=ds.findIndex(function(d){return d.id===j.designer_id;});
  if(idx>=0){
    clearReservation(ds[idx],id);
    if(['assigned','in_progress','revision','delivered','client_approved'].indexOf(j.status)>=0)adjustCounter(ds[idx],getSlot(j),-1);
    saveAndAudit(KEYS.designers,ds,'designer.capacity.released.cancel',ds[idx].id,designers()[idx],ds[idx]);
  }
  notify('Job cancelled.');
}
function setPayout(id,status){
  var j=jobs().filter(function(x){return x.id===id;})[0];if(!j)return;
  if(status==='sent'&&!confirm('Confirm that the designer payout has been initiated?'))return;
  if(status==='received'&&!confirm('Confirm the designer has received the payout?'))return;

function setStalled(id){
  var j=jobs().filter(function(x){return x.id===id;})[0];if(!j)return;

function resumeJob(id){
  if(!confirm('Resume this job and return it to in-progress?'))return;
  updateJob(id,'job.resumed',function(x){x.status='in_progress';x.resumed_at=stamp();});
  notify('Job resumed.');
}
function lockDesigner(id,locked){
  var ds=designers(),i=ds.findIndex(function(d){return d.id===id;});if(i<0)return;

  var ds=designers(),idx=ds.findIndex(function(d){return d.id===id;});if(idx<0)return;

  var specs=prompt('Specialties, comma separated (identity, promo, event, menu, print, social, packaging, motion):','identity, promo');if(specs===null)return;

function toggleFeatured(id){
  var ss=services(),i=ss.findIndex(function(x){return x.id===id;});if(i<0)return;
  var before=JSON.parse(JSON.stringify(ss[i]));ss[i].is_featured=!ss[i].is_featured;ss[i].updated_at=stamp();
  saveAndAudit(KEYS.services,ss,'service.featured.changed',id,before,ss[i]);notify(ss[i].is_featured?'Service featured.':'Featured flag removed.');

  var ss=services(),i=ss.findIndex(function(s){return s.id===id;});if(i<0)return;
  var s=ss[i],name=prompt('Service name:',s.name||'');if(name===null)return;

  var days=prompt('Delivery estimate in days:',String(Number(s.delivery_days||0)));if(days===null)return;
  var revisions=prompt('Included revision rounds:',String(Number(s.revision_rounds||0)));if(revisions===null)return;
  if(!name.trim()||!Number.isFinite(Number(price))||Number(price)<0||!Number.isFinite(Number(days))||Number(days)<0||!Number.isFinite(Number(revisions))||Number(revisions)<0){notify('Please enter a valid name and non-negative numeric values.');return;}
  var before=JSON.parse(JSON.stringify(s));
  s.name=name.trim();s.base_price=Number(price);s.delivery_days=Number(days);s.revision_rounds=Number(revisions);s.updated_at=stamp();

  var before=JSON.parse(JSON.stringify(ss[i]));ss[i].is_active=ss[i].is_active===false;ss[i].updated_at=stamp();

function exportCSV(filename,rows){
  if(!rows.length){notify('Nothing to export for this selection.');return;}
  var headers=Object.keys(rows[0]),csv=[headers.join(',')].concat(rows.map(function(row){return headers.map(function(k){var v=row[k];if(v&&typeof v==='object')v=JSON.stringify(v);return '"'+String(v==null?'':v).replace(/"/g,'""')+'"';}).join(',');})).join('\r\n');
  var blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url);},1000);
}
function notify(msg){
  var old=document.getElementById('admin-toast');if(old)old.remove();
  var t=document.createElement('div');t.id='admin-toast';t.textContent=msg;
  t.style.cssText='position:fixed;left:50%;bottom:18px;transform:translateX(-50%);max-width:calc(100vw - 24px);z-index:100;background:#151515;color:#fff;padding:12px 16px;border-radius:8px;font-size:12px;font-weight:800;box-shadow:0 8px 24px #0002';
  document.body.appendChild(t);setTimeout(function(){if(t.parentNode)t.remove();},3500);
}
function handleClick(e){
  var target=e.target.closest('[data-act],[data-tab]');if(!target)return;
  if(target.hasAttribute('data-tab')){e.preventDefault();state.tab=target.getAttribute('data-tab');state.openJob=null;render();return;}
  var act=target.getAttribute('data-act'),id=target.getAttribute('data-id');
  switch(act){
    case 'filter':state.filter=id;state.openJob=null;render();break;
    case 'open-job':state.openJob=id;render();break;
    case 'close-detail':state.openJob=null;render();break;
    case 'payout-filter':state.payoutFilter=id;render();break;
    case 'service-filter':state.serviceCategory=id;render();break;
    case 'assign-designer':var sel=document.getElementById('assign-designer-'+id);assignPendingDesigner(id,sel?sel.value:'');render();break;
    case 'approve-job':approveJob(id);render();break;
    case 'reject-job':rejectJob(id);state.openJob=null;render();break;
    case 'mark-delivered':deliverJob(id);render();break;
    case 'client-approved':clientApproved(id);render();break;
    case 'close-job':closeJob(id);render();break;
    case 'close-cycle':closeRetainerCycle(id);render();break;
    case 'end-retainer':endRetainer(id);render();break;
    case 'cancel-job':cancelJob(id);render();break;
    case 'payout-sent':setPayout(id,'sent');render();break;
    case 'payout-received':setPayout(id,'received');render();break;
    case 'stall-job':setStalled(id);render();break;
    case 'resume-job':resumeJob(id);render();break;
    case 'lock-designer':lockDesigner(id,true);render();break;
    case 'unlock-designer':lockDesigner(id,false);render();break;
    case 'edit-designer':editDesigner(id);render();break;
    case 'add-designer':addDesigner();render();break;
    case 'edit-service':editService(id);render();break;
    case 'toggle-featured':toggleFeatured(id);render();break;
    case 'toggle-service':toggleService(id);render();break;
    case 'add-service':addService();render();break;
    case 'export-jobs':exportCSV('eatouts-jobs.csv',jobs().map(function(j){return Object.assign({},j,{brief:JSON.stringify(j.brief||{}),price_breakdown:JSON.stringify(j.price_breakdown||{})});}));break;
    case 'export-designers':exportCSV('eatouts-designers.csv',designers().map(function(d){return Object.assign({},d,{portfolio:JSON.stringify(d.portfolio||[]),specialties:(d.specialties||[]).join('|')});}));break;
    case 'export-payouts':exportCSV('eatouts-payouts.csv',jobs().filter(function(j){return j.payout_status;}).map(function(j){return {job_id:j.id,business_name:j.business_name,designer_id:j.designer_id,total:j.total,platform_cut:moneyFromJob(j,'platform_cut'),designer_payout:moneyFromJob(j,'designer_payout'),payout_status:j.payout_status,status:j.status,updated_at:j.updated_at};}));break;
    case 'export-services':exportCSV('eatouts-services.csv',services());break;
  }
}
function handleInput(e){
  var t=e.target;
  if(t.matches('[data-input="query"]')){var pos=t.selectionStart;state.query=t.value;var currentScroll=window.scrollY;render();var n=app.querySelector('[data-input="query"]');if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(err){}}window.scrollTo(0,currentScroll);}
}
function whatsappAdminNumber(){
  var s=getDBSettings(),w=s.whatsapp||{};
  var raw=typeof w==='string'?w:(w.admin||w.support||w.flagship||'');
  return String(raw||'').replace(/\D/g,'');
}
function initialize(){
  try{seedIfNeeded();runAutoStall();}catch(e){console.error(e);app.innerHTML='<div class="notice bad">Unable to initialise the service workspace. Check browser storage permissions and the shared modules.</div>';return;}
  var session=parseJSON(localStorage.getItem(KEYS.session),null);
  if(session)document.getElementById('mode-note').textContent='Admin workspace';
  else document.getElementById('mode-note').textContent='Local preview mode';
  if(!localStorage.getItem(KEYS.jobs)&&localStorage.getItem(KEYS.oldJobs)){jobs();}
  document.querySelector('.tabs').addEventListener('click',handleClick);
  app.addEventListener('click',handleClick);
  app.addEventListener('input',handleInput);
  document.getElementById('refresh-btn').addEventListener('click',function(){runAutoStall();render();notify('Data refreshed from this browser.');});
  window.addEventListener('storage',function(e){if([KEYS.jobs,KEYS.oldJobs,KEYS.designers,KEYS.services,KEYS.audit].indexOf(e.key)>=0)render();});
  render();
}
initialize();
})();
