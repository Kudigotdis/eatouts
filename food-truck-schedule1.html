<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff"><title>Food truck schedule · EatOuts</title><link rel="stylesheet" href="assets/eatouts-manager.css"><style>.dayrow{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.dayrow:last-child{border-bottom:0}.dayname{font-size:11px;font-weight:900;text-transform:uppercase}.daydetail strong{display:block;font-size:13px}.daydetail small{display:block;color:var(--muted);font-size:10px;margin-top:4px}.live-switch{display:flex;align-items:center;gap:8px;padding:10px;background:var(--soft);border:1px solid var(--line);font-size:11px;font-weight:800}.live-switch input{accent-color:#111}.substitution{padding:10px 0;border-bottom:1px solid var(--line)}@media(max-width:490px){.dayrow{grid-template-columns:55px minmax(0,1fr)}.dayrow .actions{grid-column:1/-1}}
</style></head><body><div id="mount"></div>
<script src="js/eatouts-db.js"></script><script src="js/eatouts-manager-db.js"></script><script src="assets/data/demo/the-food-place/demo-data.js"></script><script src="js/eatouts-manager-seed.js"></script><script src="js/eatouts-roles.js"></script><script src="js/eatouts-users.js"></script><script src="js/eatouts-feedback.js"></script><script src="js/eatouts-blog.js"></script><script src="js/eatouts-data.js"></script><script src="js/eatouts-auth.js"></script><script src="js/eatouts-manager.js"></script><script src="js/eatouts-audit.js"></script><script src="js/eatouts-analytics.js"></script><script src="botswana_locations.js"></script><script src="js/eatouts-locations.js"></script><script src="assets/data/business_types.js"></script>
<script>
document.addEventListener('DOMContentLoaded',()=>{
 const user=EO.guard({demo:false});if(!user)return;const p=new URLSearchParams(location.search),bizId=p.get('biz')||((EatoutsAuth.getActiveBusiness()||{}).id);let biz=bizId?EatoutsDB.find('businesses',bizId):null;
 if(!biz){location.href='business-onboarding1.html?type=foodtruck';return;}
 const roles=(user.roles||[]).concat(user.platformRole||[]),isPlatform=roles.some(r=>['platform_admin','super_admin','platform_ops'].includes(r))||user.type==='platform_admin';
 const owns=biz.ownerUserId===user.id||biz.ownerId===user.id||user.businessId===biz.id||(Array.isArray(user.businessIds)&&user.businessIds.includes(biz.id));
 if(!owns&&!isPlatform){document.querySelector('#mount').innerHTML='<main class="blocked"><h1>Access restricted</h1><p>This business schedule is not attached to your account.</p><a class="btn primary" href="operator-dashboard1.html">Return to workspace</a></main>';return;}
 if(!['foodtruck','food_truck'].includes(String(biz.type).toLowerCase().replace(/-/g,'').replace(/_/g,''))){document.querySelector('#mount').innerHTML='<main class="blocked"><h1>Food-truck schedule only</h1><p>This schedule applies to mobile food businesses.</p><a class="btn primary" href="operator-dashboard1.html?biz='+encodeURIComponent(biz.id)+'">Open business workspace</a></main>';return;}
 const mayEditRoles=roles.some(r=>['biz_owner','biz_admin','owner','admin','manager','biz_manager','schedule_manager'].includes(r));const readOnly=isPlatform||!owns||!mayEditRoles;let sch;
 function schedule(){biz=EatoutsDB.find('businesses',biz.id)||biz;biz.modules=biz.modules||{};let s=biz.modules.schedule;if(Array.isArray(s))s={weekly:s,substitutions:[]};if(!s||typeof s!=='object')s={weekly:[],substitutions:[]};s.weekly=Array.isArray(s.weekly)?s.weekly:[];s.substitutions=Array.isArray(s.substitutions)?s.substitutions:[];biz.modules.schedule=s;return s;}
 sch=schedule();const days=[['mon','Monday'],['tue','Tuesday'],['wed','Wednesday'],['thu','Thursday'],['fri','Friday'],['sat','Saturday'],['sun','Sunday']];const currentDay=(()=>{const d=new Intl.DateTimeFormat('en-US',{timeZone:'Africa/Gaborone',weekday:'short'}).format(new Date()).toLowerCase().slice(0,3);return ({mon:'mon',tue:'tue',wed:'wed',thu:'thu',fri:'fri',sat:'sat',sun:'sun'})[d]||'mon'})();
 function todayDate(){const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Africa/Gaborone',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const o={};parts.forEach(x=>o[x.type]=x.value);return `${o.year}-${o.month}-${o.day}`}
 function stale(x){return !!x.liveNow&&(!x.liveSetAt||Date.now()-x.liveSetAt>12*60*60*1000);}
 function isLive(x){return !!x.liveNow&&!stale(x)}
 function esc(v){return EO.esc(v)}function findDay(day){return sch.weekly.find(x=>x.day===day)||{day,status:'tentative',location:{},startTime:'11:00',endTime:'15:00',notes:'',liveNow:false}}
 function locHas(){return !!(window.EatoutsLocations&&window.EatoutsLocations.stats&&window.EatoutsLocations.stats().loaded)}
 function locOpts(list,cur,ph){const o=[{value:'',label:ph}].concat(list||[]);if(cur&&!o.some(x=>String(x.value)===String(cur)))o.splice(1,0,{value:cur,label:cur});return o}
 function optHtml(list){return list.map(o=>`<option value="${esc(o.value)}">${esc(o.label)}</option>`).join('')}
 function districtCodeFor(v){const L=window.EatoutsLocations;if(!L)return '';const c=(L.allDistricts()||[]).find(d=>String(d.code)===String(v));if(c)return c.code;const n=(L.allDistricts()||[]).find(d=>String(d.name).toLowerCase()===String(v||'').toLowerCase());return n?n.code:''}
 function districtSelectHtml(){return locHas()?optHtml(locOpts(EatoutsLocations.districtOptions(),'','— Select district —')):'<option value="">— Select district —</option>'}
 function locFieldsHtml(loc){loc=loc||{};if(!locHas())return `<div class="two"><label class="field"><span>District</span><input name="district" value="${esc(loc.district||'')}"></label><label class="field"><span>Town / city</span><input name="town" value="${esc(loc.town||biz.town||'')}" required></label></div><div class="two"><label class="field"><span>Area</span><input name="area" value="${esc(loc.area||biz.area||'')}"></label><label class="field"><span>Plot / street</span><input name="plot" value="${esc(loc.plot||'')}"></label></div>`;const L=window.EatoutsLocations,dCode=districtCodeFor(loc.district)||loc.district||'',town=loc.town||biz.town||'',area=(loc.area||biz.area||'')==='Other / not listed'?'':(loc.area||biz.area||'');return `<div class="two"><label class="field"><span>District</span><select name="district" data-loc="district">${optHtml(locOpts(L.districtOptions(),dCode,'— Select district —'))}</select></label><label class="field"><span>Town / city</span><select name="town" data-loc="town" required>${optHtml(locOpts(L.townOptions(dCode),town,'— Select town —'))}</select></label></div><div class="two"><label class="field"><span>Area</span><select name="area" data-loc="area">${optHtml(locOpts(L.areaOptions(dCode,town),area,'— Select area —'))}</select></label><label class="field"><span>Plot / street</span><input name="plot" value="${esc(loc.plot||'')}"></label></div>`}
 function wireLoc(form){if(!form)return;const L=window.EatoutsLocations;if(!L)return;const d=form.querySelector('[data-loc="district"]'),t=form.querySelector('[data-loc="town"]'),a=form.querySelector('[data-loc="area"]');if(!d||!t||!a)return;function ft(){t.innerHTML=optHtml(locOpts(L.townOptions(d.value),'','— Select town —'));fa()}function fa(){a.innerHTML=optHtml(locOpts(L.areaOptions(d.value,t.value),'','— Select area —'))}d.addEventListener('change',ft);t.addEventListener('change',fa)}
 function wireSub(form){if(!form)return;const L=window.EatoutsLocations;if(!L)return;const d=form.querySelector('[data-sloc="district"]'),t=form.querySelector('[data-sloc="town"]'),a=form.querySelector('[data-sloc="area"]');if(!d||!t||!a)return;function ft(){t.innerHTML=optHtml(locOpts(L.townOptions(d.value),'','— Select town —'));fa()}function fa(){a.innerHTML=optHtml(locOpts(L.areaOptions(d.value,t.value),'','— Select area —'))}d.addEventListener('change',ft);t.addEventListener('change',fa)}
 document.querySelector('#mount').innerHTML=`<div class="app"><header class="top"><a class="brand" href="operator-dashboard1.html?biz=${encodeURIComponent(biz.id)}">EatOuts</a><div class="top-right"><span class="mode">${esc(biz.name||biz.identity?.name||'Food truck')}</span><button class="icon-btn" id="exit">Exit</button></div></header><main class="page"><div class="crumb">Business operations · Schedule</div><div class="hero"><div><h1>Weekly route</h1><p>Set the recurring location and hours customers should expect, then mark the truck live for today.</p></div><button class="btn primary" id="add-day" ${readOnly?'hidden':''}>Add / edit day</button></div>${readOnly?'<div class="notice">Read-only view. Platform administrators can inspect this schedule but cannot change it here.</div>':''}<div id="notice"></div><div class="grid3" id="stats"></div><section class="card"><div class="card-title">Monday–Sunday rotation</div><div id="week"></div><div class="minor" style="margin-top:10px">All schedule times are Botswana local time. Live status expires after 12 hours and must be activated again each day.</div></section><section class="card"><div class="card-title">One-off substitutions</div><p class="minor">Override a single calendar date without changing the weekly pattern.</p><div id="subs"></div><div id="sub-form" style="margin-top:12px" ${readOnly?'hidden':''}><form id="sf"><div class="two"><label class="field"><span>Date</span><input name="date" type="date" required min="${todayDate()}"></label><label class="field"><span>Weekly day to override</span><select name="originalDay">${days.map(d=>`<option value="${d[0]}">${d[1]}</option>`).join('')}</select></label></div><div class="two"><label class="field"><span>Override district</span><select name="district" data-sloc="district">${districtSelectHtml()}</select></label><label class="field"><span>Override town</span><select name="town" data-sloc="town" required><option value="">— Select town —</option></select></label></div><div class="two"><label class="field"><span>Area</span><select name="area" data-sloc="area"><option value="">— Select area —</option></select></label><label class="field"><span>Plot / location</span><input name="plot"></label></div><label class="field"><span>Time range</span><div class="two"><input name="startTime" type="time" value="11:00" required><input name="endTime" type="time" value="15:00" required></div></label><label class="field"><span>Notes</span><input name="notes"></label><button class="btn primary">Save one-off substitution</button></form></div></section><div id="edit-panel"></div></main><nav class="bottom"><a href="operator-dashboard1.html?biz=${encodeURIComponent(biz.id)}">Workspace</a><a href="order-manager.html">Orders</a><a href="staff-manager.html?biz=${encodeURIComponent(biz.id)}">Staff</a><a href="delivery-manager.html">Delivery</a><a href="business-onboarding1.html?biz=${encodeURIComponent(biz.id)}">Setup</a></nav></div>`;wireSub(document.querySelector('#sf'));
 function persist(action,before){biz.modules=biz.modules||{};biz.modules.schedule=sch;biz.updatedAt=Date.now();EatoutsDB.upsert('businesses',biz);if(window.EatoutsAudit)EatoutsAudit.log(action,biz.id,before||null,JSON.parse(JSON.stringify(sch)));}
 function render(){sch=schedule();const confirmed=sch.weekly.filter(x=>x.status==='confirmed').length,live=sch.weekly.filter(isLive).length;document.querySelector('#stats').innerHTML=EO.metric('Confirmed days',confirmed,'weekly locations')+EO.metric('Live flags',live,'active now or recently')+EO.metric('Substitutions',sch.substitutions.length,'one-off overrides');document.querySelector('#week').innerHTML=days.map(([k,label])=>{const x=findDay(k),loc=x.location||{},empty=!sch.weekly.some(y=>y.day===k);return `<div class="dayrow"><div class="dayname">${label.slice(0,3)}${k===currentDay?'<br><span class="status active">Today</span>':''}</div><div class="daydetail"><strong>${empty?'No location set':esc([loc.town,loc.area,loc.plot||loc.landmark].filter(Boolean).join(' · ')||'Location details needed')}</strong><small>${empty?'Schedule coming soon':esc((x.startTime||'—')+'–'+(x.endTime||'—'))} · <span class="status ${esc(x.status||'tentative')}">${esc(x.status||'tentative')}</span> ${isLive(x)?'<span class="status active">Live now</span>':''}${stale(x)?'<span class="status">Live expired</span>':''}</small>${x.notes?`<small>${esc(x.notes)}</small>`:''}</div><div class="actions">${!readOnly?`<button class="btn" data-edit-day="${k}">Edit</button>`:''}${!readOnly&& !empty?`<button class="btn" data-duplicate="${k}">Duplicate</button><button class="btn danger" data-delete-day="${k}">Delete</button>`:''}</div></div>`}).join('');document.querySelector('#subs').innerHTML=sch.substitutions.length?sch.substitutions.slice().sort((a,b)=>a.date.localeCompare(b.date)).map((x,i)=>`<div class="substitution"><div class="listrow"><div class="listmain"><strong>${esc(x.date)} · replaces ${esc(days.find(d=>d[0]===x.originalDay)?.[1]||x.originalDay)}</strong><small>${esc([x.override?.location?.town,x.override?.location?.area,x.override?.location?.plot].filter(Boolean).join(' · '))} · ${esc(x.override?.startTime||'—')}–${esc(x.override?.endTime||'—')}</small></div>${!readOnly?`<button class="btn danger" data-delete-sub="${i}">Remove</button>`:''}</div></div>`).join(''):'<div class="empty">No dated substitutions.</div>';}
 function editDay(k){if(readOnly){EO.toast('Your role can view this schedule but cannot edit it');return;}const x=findDay(k),loc=x.location||{};const panel=document.querySelector('#edit-panel');panel.innerHTML=`<section class="card"><div class="card-title">Edit ${days.find(d=>d[0]===k)[1]}</div><form id="day-form"><input type="hidden" name="day" value="${k}">${locFieldsHtml(loc)}<div class="two"><label class="field"><span>Landmark</span><input name="landmark" value="${esc(loc.landmark||'')}"></label><label class="field"><span>Backup location</span><input name="backup" value="${esc(x.backup||'')}"></label></div><div class="two"><label class="field"><span>Start time</span><input name="startTime" type="time" value="${esc(x.startTime||'11:00')}" required></label><label class="field"><span>End time</span><input name="endTime" type="time" value="${esc(x.endTime||'15:00')}" required></label></div><div class="two"><label class="field"><span>Status</span><select name="status">${['confirmed','tentative','cancelled'].map(s=>`<option value="${s}" ${x.status===s?'selected':''}>${s[0].toUpperCase()+s.slice(1)}</option>`).join('')}</select></label><label class="field"><span>Live right now</span><label class="live-switch"><input type="checkbox" name="liveNow" ${isLive(x)?'checked':''}> Mark as live today</label></label></div><label class="field"><span>Customer directions / notes</span><textarea name="notes">${esc(x.notes||'')}</textarea></label><div class="actions"><button class="btn primary">Save day</button><button class="btn" type="button" id="cancel-edit">Cancel</button></div></form></section>`;wireLoc(panel.querySelector('#day-form'));panel.querySelector('#cancel-edit').onclick=()=>panel.innerHTML='';panel.querySelector('#day-form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),before=JSON.parse(JSON.stringify(sch)),day=f.get('day'),idx=sch.weekly.findIndex(x=>x.day===day);const old=idx>=0?sch.weekly[idx]:{};const entry=Object.assign({},old,{day,location:{district:f.get('district'),districtName:((window.EatoutsLocations&&EatoutsLocations.allDistricts().find(x=>String(x.code)===String(f.get('district')))||{}).name||''),town:f.get('town'),area:f.get('area')==='Other / not listed'?'':f.get('area'),plot:f.get('plot'),landmark:f.get('landmark')},backup:f.get('backup'),startTime:f.get('startTime'),endTime:f.get('endTime'),status:f.get('status'),notes:f.get('notes'),liveNow:f.get('liveNow')==='on'&&f.get('status')!=='cancelled',liveSetAt:f.get('liveNow')==='on'&&f.get('status')!=='cancelled'?Date.now():null});if(idx>=0)sch.weekly[idx]=entry;else sch.weekly.push(entry);sch.weekly.sort((a,b)=>days.findIndex(d=>d[0]===a.day)-days.findIndex(d=>d[0]===b.day));persist('schedule.day.updated',before);panel.innerHTML='';render();EO.toast('Weekly schedule saved');};panel.scrollIntoView({behavior:'smooth',block:'start'});}
 document.querySelector('#week').addEventListener('click',e=>{const edit=e.target.closest('[data-edit-day]'),del=e.target.closest('[data-delete-day]'),dup=e.target.closest('[data-duplicate]');if(edit){editDay(edit.dataset.editDay);return}if(del){if(readOnly)return;const before=JSON.parse(JSON.stringify(sch));if(!confirm('Delete '+del.dataset.deleteDay+' from the weekly schedule?'))return;sch.weekly=sch.weekly.filter(x=>x.day!==del.dataset.deleteDay);persist('schedule.day.deleted',before);render();return}if(dup){if(readOnly)return;const source=findDay(dup.dataset.duplicate),target=prompt('Duplicate to which day? Enter mon, tue, wed, thu, fri, sat, or sun:');if(!target)return;const k=target.toLowerCase().slice(0,3);if(!days.some(d=>d[0]===k)){EO.toast('Please enter a valid weekday');return}const before=JSON.parse(JSON.stringify(sch)),copy=JSON.parse(JSON.stringify(source));copy.day=k;copy.liveNow=false;copy.liveSetAt=null;const idx=sch.weekly.findIndex(x=>x.day===k);if(idx>=0)sch.weekly[idx]=copy;else sch.weekly.push(copy);persist('schedule.day.duplicated',before);render();}});
 document.querySelector('#add-day').onclick=()=>editDay(currentDay);document.querySelector('#subs').addEventListener('click',e=>{const b=e.target.closest('[data-delete-sub]');if(!b||readOnly)return;if(!confirm('Remove this substitution?'))return;const before=JSON.parse(JSON.stringify(sch));sch.substitutions.splice(Number(b.dataset.deleteSub),1);persist('schedule.substitution.deleted',before);render()});
 document.querySelector('#sf').onsubmit=e=>{e.preventDefault();if(readOnly){EO.toast('Your role cannot edit the schedule');return;}const f=new FormData(e.target),date=f.get('date'),originalDay=f.get('originalDay');if(f.get('endTime')<=f.get('startTime')){EO.toast('End time must be after start time');return}const before=JSON.parse(JSON.stringify(sch));const replacement={date,originalDay,override:{location:{district:f.get('district'),districtName:((window.EatoutsLocations&&EatoutsLocations.allDistricts().find(x=>String(x.code)===String(f.get('district')))||{}).name||''),town:f.get('town'),area:f.get('area')==='Other / not listed'?'':f.get('area'),plot:f.get('plot'),landmark:''},startTime:f.get('startTime'),endTime:f.get('endTime'),status:'confirmed',notes:f.get('notes')}};const idx=sch.substitutions.findIndex(x=>x.date===date);if(idx>=0)sch.substitutions[idx]=replacement;else sch.substitutions.push(replacement);persist('schedule.substitution.saved',before);e.target.reset();render();EO.toast('One-off substitution saved');};
 document.querySelector('#exit').onclick=()=>location.href='operator-dashboard1.html?biz='+encodeURIComponent(biz.id);if(p.get('day'))editDay(p.get('day').slice(0,3));render();
});
</script></body></html>
