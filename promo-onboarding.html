<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Promotions — Eatouts</title>
<link rel="icon" type="image/png" href="assets/logo/EatOuts_Badge.png">
<link rel="apple-touch-icon" href="assets/logo/EatOuts_Badge.png">
<style>
:root{--gold:#c9a84c;--black:#151515;--bg:#f7f6f3;--card:#fff;--text:#1b1b1b;--muted:#7a7466;--border:#e7e4dd;--danger:#c43c3c;--radius:16px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;line-height:1.5}
.topbar{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:12px}
.brand{font-weight:900;font-size:16px;color:var(--black)}.brand span{color:var(--gold)}
.topbar .page{flex:1;font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.tabs{position:sticky;top:57px;z-index:49;background:#fff;border-bottom:1px solid var(--border);display:flex;overflow-x:auto;padding:0 8px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:12px 14px;font-size:12.5px;font-weight:800;color:var(--muted);text-decoration:none;border-bottom:2px solid transparent}
.tab.active{color:var(--black);border-bottom-color:var(--gold)}
.app{max-width:1180px;margin:0 auto;padding-bottom:130px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin:12px;padding:14px}
.promo-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin:12px;overflow:hidden}
.promo-img{height:150px;background:#f0eee8 center/cover no-repeat;position:relative}
.promo-img .st{position:absolute;top:10px;left:10px}
.promo-body{padding:14px 16px}
.promo-title{font-weight:800;font-size:15.5px}
.promo-meta{font-size:11.5px;color:var(--muted);margin-top:4px}
.promo-price{font-size:14px;font-weight:900;color:var(--gold);margin-top:8px}
.promo-actions{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap}
.btn{min-height:44px;border:0;border-radius:12px;padding:0 16px;font:inherit;font-size:13px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-primary{background:var(--black);color:#fff}
.btn-gold{background:var(--gold);color:#fff}
.btn-ghost{background:transparent;border:1px solid var(--border);color:#3a3324}
.btn-danger{background:#fbeaea;color:var(--danger)}
.btn-sm{min-height:34px;padding:0 11px;font-size:11.5px;border-radius:9px}
.btn-full{width:100%}
.empty{border:1.5px dashed var(--border);border-radius:14px;padding:22px 16px;text-align:center;color:var(--muted);font-size:13px}
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:999px;font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.badge.draft{background:#f0eee8;color:#7a7466}
.badge.active{background:#e3f5e9;color:#17834b}
.badge.paused{background:#fdf3dc;color:#9a6a0a}
.badge.expired{background:#eee;color:#999}
.section{background:#fff;border:1px solid var(--border);border-radius:14px;margin-bottom:12px}
.section-hdr{padding:12px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:13.5px}
.section-body{padding:0 14px 14px;display:none}
.section.open .section-body{display:block}
.field{margin-bottom:12px}
.field label{display:block;margin-bottom:6px;font-size:12.5px;font-weight:750;color:#3a3324}
input,textarea,select{width:100%;min-height:44px;border:1px solid var(--border);border-radius:12px;padding:10px 12px;background:#fff;font:inherit;font-size:13.5px;outline:0}
textarea{min-height:80px;resize:vertical}
input:focus,textarea:focus,select:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,168,76,.15)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.grid2{grid-template-columns:1fr}}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--black);color:#fff;padding:12px 22px;border-radius:12px;font-size:13px;font-weight:700;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.action-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:1180px;background:#fff;border-top:1px solid var(--border);border-left:1px solid var(--border);border-right:1px solid var(--border);border-radius:16px 16px 0 0;padding:12px 16px;display:flex;gap:10px;z-index:40;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
.action-bar .btn{flex:1}
.modal-scrim{position:fixed;inset:0;background:rgba(20,18,14,.55);z-index:100;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:701px){.modal-scrim{align-items:center;padding:20px}}
.modal{background:#fff;width:100%;max-width:560px;max-height:92vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;overflow:hidden}
@media(min-width:701px){.modal{border-radius:20px}}
.modal-hdr{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.modal-hdr h3{margin:0;font-size:15px;font-weight:800;flex:1}
.modal-body{padding:16px 20px;overflow-y:auto;flex:1}
.modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:10px;background:#fafaf7}
.modal-foot .btn{flex:1}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;min-height:34px;padding:0 13px;border-radius:999px;background:#f0eee8;font-size:12px;font-weight:700;cursor:pointer;color:#5c5547;border:1px solid transparent}
.chip.active{background:var(--gold);color:#fff}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">EAT<span>OUTS</span></div>
  <div class="page">Promotions</div>
</header>
<nav class="tabs">
  <a class="tab" href="restaurant-onboarding.html">Restaurant</a>
  <a class="tab" href="menu-onboarding.html">Menu</a>
  <a class="tab active" href="promo-onboarding.html">Promos</a>
  <a class="tab" href="event-onboarding.html">Events</a>
  <a class="tab" href="gallery-onboarding.html">Gallery</a>
  <a class="tab" href="restaurant-dashboard.html">Dashboard</a>
</nav>
<main id="app" class="app"></main>
<div class="action-bar">
  <button class="btn btn-ghost" id="btnBack">← Back</button>
  <button class="btn btn-gold" id="btnNew">+ Create Promo</button>
</div>
<div id="toast" class="toast"></div>

<script src="js/eatouts-db.js"></script>
<script src="js/eatouts-auth.js"></script>
<script src="js/eatouts-owner-compat.js"></script>
<script>
/* Operator pages are only reachable through the About Us sign-in.
   This runs before any page content paints. */
if(!EatoutsAuth.requireSession()){EatoutsAuth.redirectToLogin();}
else{EatoutsAuth.applyActive();}
</script>
<script>
const DB_KEY=EatoutsDB.KEY;
const EMPTY_DB={version:1,restaurant:{id:'rest_001',identity:{name:''},location:{city:'',area:''},contacts:[]},menuCategories:[],menuItems:[],promos:[],events:[],performers:[],performances:[],galleryGroups:[],galleryImages:[],settings:{currency:'BWP',currencySymbol:'P'}};
function dbLoad(){return EatoutsOwnerCompat.load();}
function dbSave(d){EatoutsOwnerCompat.save(d);}
function uid(p){return p+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800);}
let DB=dbLoad();function save(){dbSave(DB);render();}
const money=v=>DB.settings.currencySymbol+(Number(v)||0).toFixed(2);

let VIEW={mode:'list',id:null};
const OPEN={};

function openForm({title,fields,values,onSave,saveLabel}){
  values=values||{};
  const scrim=document.createElement('div');
  scrim.className='modal-scrim';
  scrim.innerHTML=`<div class="modal">
    <div class="modal-hdr"><h3>${esc(title)}</h3><button class="btn btn-ghost btn-sm" data-close>Close</button></div>
    <div class="modal-body">${fields.map(f=>field(f,values[f.key])).join('')}</div>
    <div class="modal-foot">
      <button class="btn btn-ghost" data-close>Cancel</button>
      <button class="btn btn-gold" data-save>${esc(saveLabel||'Save')}</button>
    </div></div>`;
  document.body.appendChild(scrim);
  scrim.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>scrim.remove());
  scrim.querySelector('[data-save]').onclick=()=>{
    const out={};
    scrim.querySelectorAll('[name]').forEach(el=>{
      const k=el.getAttribute('name');
      if(el.type==='checkbox')out[k]=el.checked;
      else if(el.type==='number')out[k]=el.value===''?null:Number(el.value);
      else out[k]=el.value;
    });
    onSave(out,scrim);
  };
  return scrim;
}
function field(f,v){
  if(f.type==='html')return f.html;
  if(f.type==='textarea')return `<div class="field"><label>${esc(f.label)}</label><textarea name="${f.key}">${esc(v||'')}</textarea></div>`;
  if(f.type==='select')return `<div class="field"><label>${esc(f.label)}</label><select name="${f.key}">${(f.options||[]).map(o=>{const val=typeof o==='string'?o:o.value;const lbl=typeof o==='string'?o:o.label;return `<option value="${esc(val)}"${val===v?' selected':''}>${esc(lbl)}</option>`;}).join('')}</select></div>`;
  if(f.type==='checkbox')return `<label style="display:flex;gap:8px;align-items:center;padding:8px 0;font-weight:700;font-size:13px"><input type="checkbox" name="${f.key}" ${v?'checked':''}> ${esc(f.label)}</label>`;
  return `<div class="field"><label>${esc(f.label)}</label><input type="${f.type||'text'}" name="${f.key}" value="${esc(v||'')}" placeholder="${esc(f.placeholder||'')}"></div>`;
}

/* ========== RENDER ========== */
function statusOf(p){
  if(p.status)return p.status;
  const now=new Date();
  if(p.endDate&&new Date(p.endDate)<now)return 'expired';
  return 'active';
}
function render(){
  if(VIEW.mode==='edit'){
    renderEditor();return;
  }
  const list=DB.promos.slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  let h=`<div class="card" style="display:flex;justify-content:space-between;align-items:center">
    <div><div style="font-weight:800;font-size:15px">Promotions</div>
    <div style="font-size:11.5px;color:var(--muted);margin-top:2px">${list.length} promo${list.length===1?'':'s'}</div></div>
  </div>`;
  if(!list.length)h+=`<div class="empty">No promos yet. Tap <b>+ Create Promo</b> to launch your first one.</div>`;
  list.forEach(p=>{
    const s=statusOf(p);
    h+=`<div class="promo-card">
      <div class="promo-img" ${p.image?`style="background-image:url('${esc(p.image)}')"`:''}>
        <span class="badge ${s} st">${s}</span>
      </div>
      <div class="promo-body">
        <div class="promo-title">${esc(p.title||'Untitled promo')}</div>
        <div class="promo-meta">${esc(p.location&&p.location.city||'')}${p.location&&p.location.area?' · '+esc(p.location.area):''}</div>
        ${p.promoPrice?`<div class="promo-price">${money(p.promoPrice)} <span style="color:var(--muted);text-decoration:line-through;font-weight:600;font-size:12px">${money(p.originalPrice)}</span></div>`:''}
        <div class="promo-actions">
          <button class="btn btn-ghost btn-sm" data-act="edit" data-id="${p.id}">Edit</button>
          <button class="btn btn-ghost btn-sm" data-act="dup" data-id="${p.id}">Duplicate</button>
          <button class="btn btn-ghost btn-sm" data-act="pause" data-id="${p.id}">${p.status==='paused'?'Resume':'Pause'}</button>
          <button class="btn btn-danger btn-sm" data-act="del" data-id="${p.id}">Remove</button>
        </div>
      </div></div>`;
  });
  document.getElementById('app').innerHTML=h;
}

function renderEditor(){
  const p=DB.promos.find(x=>x.id===VIEW.id);
  if(!p){VIEW.mode='list';render();return;}
  const r=DB.restaurant;
  const contacts=r.contacts||[];
  const menuItems=DB.menuItems||[];
  const cats=DB.menuCategories||[];
  document.getElementById('app').innerHTML=`
    <div class="card" style="display:flex;justify-content:space-between;align-items:center">
      <div style="font-weight:800;font-size:15px">${esc(p.title||'Edit Promo')}</div>
      <span class="badge ${statusOf(p)}">${statusOf(p)}</span>
    </div>
    ${sec('idn','01 · Promo Identity',`
      ${fld('Title *','title',p.title)}
      ${fld('Promo Image URL','image',p.image)}
      ${fld('Promo Type','type',p.type,['Food Special','Beverage','Combo','Platter','Happy Hour','Seasonal'])}
      ${fldArea('Description','description',p.description)}
    `)}
    ${sec('pri','02 · Pricing',`
      <div class="grid2">
        ${fldNum('Original Price','originalPrice',p.originalPrice)}
        ${fldNum('Promo Price','promoPrice',p.promoPrice)}
      </div>
      <div style="font-size:12px;color:var(--muted)">Saving: <b>${money((p.originalPrice||0)-(p.promoPrice||0))}</b></div>
    `)}
    ${sec('loc','03 · Location',`
      <label style="display:flex;gap:8px;align-items:center;padding:6px 0;font-size:13px;font-weight:700">
        <input type="checkbox" id="useRestLoc" ${p.location&&p.location.useRestaurantLocation?'checked':''}>
        Use restaurant location (${esc(r.location.city||'—')} · ${esc(r.location.area||'—')})
      </label>
      <div class="grid2" style="margin-top:8px">
        ${fld('Village / Town / City','locCity',p.location&&p.location.city)}
        ${fld('Area / Neighbourhood','locArea',p.location&&p.location.area)}
      </div>
    `)}
    ${sec('sch','04 · Schedule',`
      <div class="grid2">
        ${fldDate('Start Date','startDate',p.startDate)}
        ${fldTime('Start Time','startTime',p.startTime)}
      </div>
      <div class="grid2">
        ${fldDate('End Date','endDate',p.endDate)}
        ${fldTime('End Time','endTime',p.endTime)}
      </div>
      ${fldChk('Recurring','recurring',p.recurring)}
      ${fld('Recurring Days (comma separated)','days',(p.days||[]).join(', '),null,'Monday, Friday')}
    `)}
    ${sec('mnu','05 · Menu Connection',`
      <div style="font-size:12px;color:var(--muted);margin-bottom:8px">Link existing menu items to this promo.</div>
      <div class="chips" id="menuPicker">
        ${cats.map(c=>{
          const its=menuItems.filter(i=>i.categoryId===c.id);
          if(!its.length)return '';
          return `<div style="width:100%;margin:6px 0 2px;font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em">${esc(c.name)}</div>`+
            its.map(i=>`<span class="chip ${(p.linkedMenuItems||[]).includes(i.id)?'active':''}" data-menu="${i.id}">${esc(i.name)}</span>`).join('');
        }).join('')}
      </div>
    `)}
    ${sec('act','06 · Action',`
      ${fld('Action','actionType',p.action&&p.action.type,['Order','Reserve','Book','RSVP','Enquire','Call'])}
      <label class="field"><label>WhatsApp / Contact</label>
        <select id="actionContact">
          <option value="">— choose contact —</option>
          ${contacts.map(c=>`<option value="${c.id}" ${p.action&&p.action.contactId===c.id?'selected':''}>${esc(c.title||c.number)}</option>`).join('')}
        </select></label>
    `)}
    ${sec('trm','07 · Sponsor & Terms',`
      ${fld('Sponsor','sponsor',p.sponsor)}
      ${fldArea('Terms & Conditions','terms',p.terms)}
    `)}
    <div style="display:flex;gap:10px;margin:12px 0 40px">
      <button class="btn btn-ghost" style="flex:1" id="btnCancel">Cancel</button>
      <button class="btn btn-gold" style="flex:1" id="btnSavePromo">Save Promo</button>
    </div>
  `;
  wireEditor(p);
}

function sec(k,title,body){
  return `<div class="section ${OPEN[k]!==false?'open':''}" data-sec="${k}">
    <div class="section-hdr" data-sec-toggle="${k}"><span>${title}</span><span>▾</span></div>
    <div class="section-body">${body}</div></div>`;
}
function fld(label,key,val,options,placeholder){
  if(options)return `<div class="field"><label>${esc(label)}</label><select data-k="${key}">${['<option value="">—</option>',...options.map(o=>`<option value="${esc(o)}"${o===val?' selected':''}>${esc(o)}</option>`)].join('')}</select></div>`;
  return `<div class="field"><label>${esc(label)}</label><input data-k="${key}" value="${esc(val||'')}" placeholder="${esc(placeholder||'')}"></div>`;
}
function fldNum(label,key,val){return `<div class="field"><label>${esc(label)}</label><input type="number" data-k="${key}" value="${val==null?'':val}"></div>`;}
function fldDate(label,key,val){return `<div class="field"><label>${esc(label)}</label><input type="date" data-k="${key}" value="${esc(val||'')}"></div>`;}
function fldTime(label,key,val){return `<div class="field"><label>${esc(label)}</label><input type="time" data-k="${key}" value="${esc(val||'')}"></div>`;}
function fldArea(label,key,val){return `<div class="field"><label>${esc(label)}</label><textarea data-k="${key}">${esc(val||'')}</textarea></div>`;}
function fldChk(label,key,val){return `<label style="display:flex;gap:8px;align-items:center;padding:8px 0;font-weight:700;font-size:13px"><input type="checkbox" data-k="${key}" ${val?'checked':''}> ${esc(label)}</label>`;}

function wireEditor(p){
  document.querySelectorAll('[data-sec-toggle]').forEach(el=>el.onclick=()=>{const k=el.getAttribute('data-sec-toggle');OPEN[k]=OPEN[k]===false?true:false;renderEditor();});
  document.querySelectorAll('[data-k]').forEach(el=>{
    const k=el.getAttribute('data-k');
    el.onchange=el.oninput=()=>{
      let v=el.type==='checkbox'?el.checked:el.value;
      if(el.type==='number')v=v===''?null:Number(v);
      if(k==='locCity'||k==='locArea'){p.location=p.location||{};p.location[k==='locCity'?'city':'area']=v;}
      else if(k==='actionType'){p.action=p.action||{};p.action.type=v.toLowerCase();}
      else if(k==='days'){p.days=v.split(',').map(s=>s.trim()).filter(Boolean);}
      else p[k]=v;
      dbSave(DB);
    };
  });
  const useLoc=document.getElementById('useRestLoc');
  if(useLoc)useLoc.onchange=()=>{p.location=p.location||{};p.location.useRestaurantLocation=useLoc.checked;if(useLoc.checked){p.location.city=DB.restaurant.location.city;p.location.area=DB.restaurant.location.area;}dbSave(DB);renderEditor();};
  const ac=document.getElementById('actionContact');
  if(ac)ac.onchange=()=>{p.action=p.action||{};p.action.contactId=ac.value||null;dbSave(DB);};
  document.querySelectorAll('[data-menu]').forEach(el=>{
    el.onclick=()=>{
      const id=el.getAttribute('data-menu');
      p.linkedMenuItems=p.linkedMenuItems||[];
      const i=p.linkedMenuItems.indexOf(id);
      if(i>=0)p.linkedMenuItems.splice(i,1);else p.linkedMenuItems.push(id);
      el.classList.toggle('active');dbSave(DB);
    };
  });
  document.getElementById('btnCancel').onclick=()=>{VIEW={mode:'list',id:null};render();};
  document.getElementById('btnSavePromo').onclick=()=>{
    if(!p.title){toast('Title is required');return;}
    VIEW={mode:'list',id:null};save();toast('Promo saved');
  };
}

function newPromo(){
  const p={id:uid('promo'),title:'',image:'',type:'Food Special',description:'',
    originalPrice:0,promoPrice:0,
    location:{useRestaurantLocation:true,city:DB.restaurant.location.city,area:DB.restaurant.location.area},
    startDate:'',startTime:'',endDate:'',endTime:'',recurring:false,days:[],
    linkedMenuItems:[],action:{type:'reserve',contactId:null},sponsor:'',terms:'',
    status:'active',createdAt:Date.now()};
  DB.promos.push(p);dbSave(DB);VIEW={mode:'edit',id:p.id};render();
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const act=t.getAttribute('data-act');const id=t.getAttribute('data-id');
  if(act==='edit'){VIEW={mode:'edit',id};render();return;}
  if(act==='dup'){const p=DB.promos.find(x=>x.id===id);if(!p)return;const c=JSON.parse(JSON.stringify(p));c.id=uid('promo');c.title+=' (copy)';c.createdAt=Date.now();DB.promos.push(c);save();return;}
  if(act==='pause'){const p=DB.promos.find(x=>x.id===id);if(!p)return;p.status=p.status==='paused'?'active':'paused';save();return;}
  if(act==='del'){if(confirm('Remove this promo?')){DB.promos=DB.promos.filter(x=>x.id!==id);save();}return;}
});
document.getElementById('btnNew').onclick=newPromo;
document.getElementById('btnBack').onclick=()=>{if(VIEW.mode==='edit'){VIEW={mode:'list',id:null};render();}else history.back();};

render();
</script>
</body>
</html>
