<!doctype html>
<!-- PAGE: EatOuts admin dashboard -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#141418">
<title>EatOuts admin dashboard · EatOuts</title>
<style>
  *,*::before,*::after{box-sizing:border-box}
  :root{
    --ink:#0F0F12;--ink-2:#2A2A30;--paper:#F4F5F7;--card:#FFF;
    --line:#E6E8EC;--line-2:#F0F1F4;
    --orange:#FF5A1F;--orange-2:#FF7A42;--orange-soft:#FFEDE4;--orange-line:#FFD5C2;
    --green:#16A34A;--green-soft:#E7F7EE;
    --red:#DC2626;--red-soft:#FEE2E2;
    --amber:#B45309;--amber-soft:#FEF3C7;
    --blue:#0284C7;--blue-soft:#E0F2FE;
    --muted:#6B7280;--faint:#9AA1AC;
  }
  html,body{height:100%}
  body{margin:0;background:#E9EBEF;color:var(--ink);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;overscroll-behavior:none;
    display:flex;justify-content:center;}
  button,input,select,textarea{font-family:inherit}
  button{cursor:pointer}
  #shell{width:100%;max-width:460px;height:100vh;height:100dvh;
    background:var(--paper);display:flex;flex-direction:column;
    overflow:hidden;position:relative;box-shadow:0 0 70px rgba(20,20,25,.16);}

  /* ============ TOPBAR ============ */
  .topbar{flex:0 0 auto;background:#141418;
    padding:calc(13px + env(safe-area-inset-top)) 18px 14px;
    position:relative;z-index:10;}
  .topbar-row{display:flex;align-items:center;gap:10px;padding-bottom:13px;}
  .brand{display:inline-flex;align-items:center;gap:9px;text-decoration:none;}
  .brand .mark{width:28px;height:28px;flex:0 0 auto;border-radius:8px;
    background:linear-gradient(145deg,var(--orange-2),var(--orange));
    color:#fff;display:grid;place-items:center;
    font-size:14px;font-weight:900;letter-spacing:-.03em;
    box-shadow:0 2px 10px rgba(255,90,31,.35);}
  .brand .word{color:#fff;font-size:15px;font-weight:800;letter-spacing:-.02em;}
  .hdr-chip{margin-left:auto;font-size:10px;font-weight:800;
    letter-spacing:.12em;text-transform:uppercase;color:var(--orange-2);
    border:1px solid rgba(255,122,66,.32);background:rgba(255,90,31,.1);
    border-radius:999px;padding:5px 11px;white-space:nowrap;}
  .progress{padding-bottom:2px}
  .progress-top{display:flex;align-items:baseline;justify-content:space-between;
    gap:10px;margin-bottom:8px;}
  .progress-label{font-size:11px;font-weight:800;letter-spacing:.14em;
    text-transform:uppercase;color:rgba(255,255,255,.5);}
  .progress-count{font-size:11.5px;font-weight:800;color:var(--orange-2);}
  .progress-track{height:5px;border-radius:99px;background:rgba(255,255,255,.13);
    overflow:hidden;}
  .progress-fill{height:100%;width:0%;border-radius:99px;
    background:linear-gradient(90deg,var(--orange),var(--orange-2));
    transition:width .35s cubic-bezier(.4,0,.2,1);}

  /* ============ SCROLL ============ */
  .scroll{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;
    -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
    scrollbar-width:none;}
  .scroll::-webkit-scrollbar{display:none}

  /* ============ INTRO ============ */
  .intro{background:linear-gradient(175deg,#141418 0%,#1B1B21 60%,#232329 100%);
    padding:4px 22px 46px;position:relative;overflow:hidden;text-align:center;}
  .intro::after{content:"";position:absolute;top:-80px;right:-80px;
    width:230px;height:230px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,90,31,.2),transparent 68%);
    pointer-events:none;}
  .intro h1{position:relative;margin:0 auto 12px;font-size:26px;
    line-height:1.15;font-weight:800;letter-spacing:-.03em;color:#fff;
    max-width:15ch;}
  .intro h1 em{font-style:normal;color:var(--orange-2)}
  .intro p{position:relative;margin:0 auto;font-size:14px;line-height:1.6;
    color:rgba(255,255,255,.6);max-width:32ch;}

  /* ============ SHEET ============ */
  .sheet{position:relative;z-index:1;margin-top:-26px;background:var(--paper);
    border-radius:26px 26px 0 0;padding:20px 14px 30px;min-height:60vh;}

  /* ============ META CARD ============ */
  .meta-card{background:var(--card);border:1px solid var(--line);
    border-radius:16px;padding:15px 16px;margin-bottom:12px;
    box-shadow:0 1px 2px rgba(20,20,25,.03);}
  .meta-row{display:flex;align-items:center;gap:10px;margin-bottom:11px;}
  .meta-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;
    background:var(--orange);box-shadow:0 0 0 3px var(--orange-soft);}
  .meta-dot.green{background:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
  .meta-dot.warn{background:var(--amber);box-shadow:0 0 0 3px var(--amber-soft)}
  .meta-text{font-size:13.5px;color:var(--ink-2);line-height:1.4;
    min-width:0;flex:1 1 auto;}
  .meta-text b{color:var(--ink);font-weight:750}
  .meta-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
    padding-top:11px;border-top:1px solid var(--line-2);}
  .stat{text-align:center}
  .stat b{display:block;font-size:19px;font-weight:850;
    letter-spacing:-.03em;color:var(--ink);line-height:1.1;
    font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;}
  .stat span{display:block;margin-top:3px;font-size:9.5px;font-weight:800;
    letter-spacing:.1em;text-transform:uppercase;color:var(--faint);}

  /* ============ ACCORDION STACK ============ */
  .stack{display:flex;flex-direction:column;gap:10px}
  .acc{background:var(--card);border:1px solid var(--line);border-radius:16px;
    overflow:hidden;transition:border-color .2s ease,box-shadow .2s ease;}
  .acc.open{border-color:var(--orange-line);
    box-shadow:0 4px 18px -6px rgba(255,90,31,.22);}
  .acc-head{width:100%;display:flex;align-items:center;gap:12px;
    padding:13px 15px;background:transparent;border:0;text-align:left;
    -webkit-tap-highlight-color:transparent;transition:background .15s;}
  .acc-head:active{background:#FAFBFC}
  .sec-thumb{width:48px;height:48px;flex:0 0 auto;border-radius:11px;
    background:var(--orange-soft);color:var(--orange);
    display:grid;place-items:center;font-size:17px;font-weight:850;
    letter-spacing:-.02em;position:relative;}
  .sec-thumb.plain{background:#F0F1F4;color:var(--faint);}
  .sec-thumb .count{position:absolute;bottom:3px;right:3px;
    background:rgba(15,15,18,.72);color:#fff;font-size:9px;font-weight:800;
    padding:1.5px 5px;border-radius:4px;line-height:1;}
  .acc-title{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .acc-title b{font-size:15px;font-weight:750;letter-spacing:-.015em;
    color:var(--ink);line-height:1.25;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;}
  .acc-sub{font-size:11.5px;color:var(--faint);line-height:1.3;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:550;}
  .vis-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;
    background:var(--orange);box-shadow:0 0 0 3px var(--orange-soft);}
  .vis-dot.green{background:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
  .vis-dot.red{background:var(--red);box-shadow:0 0 0 3px var(--red-soft)}
  .vis-dot.off{background:#D3D7DE;box-shadow:none}
  .acc-body{display:grid;grid-template-rows:0fr;
    transition:grid-template-rows .32s cubic-bezier(.4,0,.2,1);}
  .acc.open .acc-body{grid-template-rows:1fr}
  .acc-inner{overflow:hidden;min-height:0}
  .module{padding:2px 15px 18px}

  /* ============ CHIPS (filter row) ============ */
  .chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
  .chip{display:inline-flex;align-items:center;height:32px;padding:0 12px;
    border-radius:999px;border:1px solid var(--line);background:#fff;
    color:var(--ink-2);font-size:12px;font-weight:750;
    -webkit-tap-highlight-color:transparent;
    transition:background .15s,border-color .15s,color .15s;}
  .chip:active{background:#F4F5F7}
  .chip.on{border-color:transparent;
    background:linear-gradient(145deg,var(--orange-2),var(--orange));
    color:#fff;box-shadow:0 4px 12px -6px rgba(255,90,31,.55);}

  /* ============ SEARCH ROW ============ */
  .search-row{display:flex;gap:8px;margin-bottom:12px;}
  .search-row input{flex:1 1 auto;min-width:0;height:42px;padding:0 12px;
    border:1px solid var(--line);border-radius:11px;background:#fff;
    font-size:14px;color:var(--ink);outline:none;
    -webkit-appearance:none;appearance:none;
    transition:border-color .15s,box-shadow .15s;font-family:inherit;}
  .search-row input:focus{border-color:var(--orange);
    box-shadow:0 0 0 3px rgba(255,90,31,.13);}
  .search-row input::placeholder{color:#B7BDC6}
  .search-btn{flex:0 0 auto;height:42px;padding:0 16px;border-radius:11px;
    border:0;background:linear-gradient(145deg,var(--orange-2),var(--orange));
    color:#fff;font-size:13.5px;font-weight:750;
    -webkit-tap-highlight-color:transparent;
    box-shadow:0 4px 12px -6px rgba(255,90,31,.55);}
  .search-btn:active{background:var(--orange)}

  /* ============ PILLS ============ */
  .pill{display:inline-flex;align-items:center;padding:2px 8px;
    border-radius:999px;font-size:10px;font-weight:800;
    letter-spacing:.05em;text-transform:uppercase;line-height:1.4;
    background:#F0F1F4;color:var(--muted);white-space:nowrap;}
  .pill.pending,.pill.draft,.pill.due{background:var(--amber-soft);color:var(--amber);}
  .pill.approved,.pill.published,.pill.active,.pill.paid,.pill.resolved,.pill.refunded{
    background:var(--green-soft);color:var(--green);}
  .pill.rejected,.pill.revoked,.pill.failed,.pill.cancelled{
    background:var(--red-soft);color:var(--red);}
  .pill.redirect{background:var(--blue-soft);color:var(--blue);}
  .pill.orange{background:var(--orange-soft);color:var(--orange);}

  /* ============ PLATFORM CONTROLS GRID ============ */
  .choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .choice{display:flex;align-items:center;gap:10px;padding:12px;
    background:#FAFBFC;border:1px solid var(--line-2);border-radius:12px;
    text-decoration:none;color:var(--ink-2);
    -webkit-tap-highlight-color:transparent;
    transition:background .15s,border-color .15s;}
  .choice:active{background:var(--orange-soft);border-color:var(--orange-line);}
  .choice .ch-icon{width:36px;height:36px;flex:0 0 auto;border-radius:9px;
    background:var(--orange-soft);color:var(--orange);
    display:grid;place-items:center;font-size:14px;font-weight:850;}
  .choice .ch-body{flex:1 1 auto;min-width:0;
    display:flex;flex-direction:column;gap:1px;}
  .choice .ch-body b{font-size:12.5px;font-weight:750;color:var(--ink);
    line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .choice .ch-body span{font-size:10.5px;color:var(--faint);
    font-weight:550;line-height:1.3;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  /* ============ LIST ITEM ROWS ============ */
  .item-row{display:flex;gap:12px;padding:12px;background:#FAFBFC;
    border:1px solid var(--line-2);border-radius:12px;margin-bottom:8px;
    align-items:flex-start;}
  .item-row:last-child{margin-bottom:0}

  /* 90px thumbnail for promo submissions */
  .item-thumb{width:90px;height:90px;flex:0 0 auto;border-radius:12px;
    background:linear-gradient(145deg,#FFF3EC,#FFE2D2);color:var(--orange);
    display:grid;place-items:center;font-size:32px;font-weight:850;
    letter-spacing:-.03em;overflow:hidden;position:relative;}
  .item-thumb img{width:100%;height:100%;object-fit:cover;display:block}

  /* 44px badge for links and invoices */
  .item-badge{width:44px;height:44px;flex:0 0 auto;border-radius:11px;
    background:var(--orange-soft);color:var(--orange);
    display:grid;place-items:center;font-size:14px;font-weight:850;
    letter-spacing:-.02em;}
  .item-badge.green{background:var(--green-soft);color:var(--green);}
  .item-badge.red{background:var(--red-soft);color:var(--red);}
  .item-badge.blue{background:var(--blue-soft);color:var(--blue);}
  .item-badge.amber{background:var(--amber-soft);color:var(--amber);}
  .item-badge.muted{background:#F0F1F4;color:var(--faint);}

  .item-body{flex:1 1 auto;min-width:0;
    display:flex;flex-direction:column;gap:4px;}
  .item-title{font-size:13.5px;font-weight:750;letter-spacing:-.01em;
    color:var(--ink);line-height:1.3;word-break:break-word;}
  .item-sub{font-size:11.5px;color:var(--faint);font-weight:550;
    line-height:1.4;word-break:break-word;}

  .item-meta{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px;}
  .item-meta .pill{font-size:9.5px;padding:1.5px 7px;}

  .item-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}

  .mini-btn{height:32px;padding:0 12px;border-radius:9px;
    border:1px solid var(--line);background:#fff;color:var(--ink-2);
    font-size:11.5px;font-weight:750;display:inline-flex;
    align-items:center;justify-content:center;
    -webkit-tap-highlight-color:transparent;
    transition:background .15s,border-color .15s,color .15s;}
  .mini-btn:active{background:#F4F5F7}
  .mini-btn.primary{border-color:transparent;
    background:linear-gradient(145deg,var(--orange-2),var(--orange));
    color:#fff;box-shadow:0 4px 12px -6px rgba(255,90,31,.55);}
  .mini-btn.primary:active{background:var(--orange)}
  .mini-btn.danger{color:var(--red);border-color:#FECACA;background:#FEF2F2;}
  .mini-btn.danger:active{background:var(--red-soft)}
  .mini-btn[disabled]{opacity:.4;pointer-events:none;}

  /* ============ EMPTY / LOADING ============ */
  .empty-note{font-size:12.5px;color:var(--faint);text-align:center;
    padding:22px 16px;border:1.5px dashed #DCE0E6;border-radius:11px;
    background:#FAFBFC;line-height:1.55;}
  .empty-note b{color:var(--ink-2);font-weight:750}

  /* ============ TOAST ============ */
  .toast{position:fixed;left:50%;z-index:200;
    bottom:calc(28px + env(safe-area-inset-bottom));
    transform:translate(-50%,10px);background:var(--ink);color:#fff;
    font-size:13.5px;font-weight:650;padding:12px 18px;border-radius:999px;
    max-width:88vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    opacity:0;pointer-events:none;
    transition:opacity .2s ease,transform .2s ease;}
  .toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body data-page="eatouts-admin-dashboard">
<div id="shell">
  <header class="topbar">
    <div class="topbar-row">
      <a class="brand" href="index.html">
        <span class="mark">E</span><span class="word">EatOuts</span>
      </a>
      <span class="hdr-chip">Admin</span>
    </div>
    <div class="progress">
      <div class="progress-top">
        <span class="progress-label">Platform status</span>
        <span class="progress-count" id="progressCount">—</span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
  </header>

  <div class="scroll" id="scroll">
    <section class="intro">
      <h1>Platform <em>control</em>.</h1>
      <p>Approve promos, manage links, track invoices and jump into any admin surface.</p>
    </section>
    <main class="sheet" id="app"></main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script src="js/eatouts-manager-db.js"></script>
<script src="assets/data/demo/the-food-place/demo-data.js"></script>
<script src="js/eatouts-manager-seed.js"></script>
<script src="js/eatouts-roles.js"></script>
<script src="js/eatouts-users.js"></script>
<script src="js/eatouts-feedback.js"></script>
<script src="js/eatouts-blog-admin.js"></script>
<script src="js/eatouts-auth.js"></script>
<script src="js/eatouts-analytics.js"></script>
<script src="js/eatouts-manager.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {

  /* ---- Auth guard (unchanged) ---- */
  if (!EO.guard({"roles":["platform_admin"]})) return;

  /* ============================================================
     HELPERS
     ============================================================ */
  function esc(v){
    return String(v == null ? "" : v)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }
  function escapeAttr(v){ return esc(v).replace(/`/g,"&#96;"); }
  function cssEscape(s){ return String(s).replace(/["\\]/g, '\\$&'); }

  var toastEl = document.getElementById("toast");
  var toastTimer = null;
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove("show"); }, 2000);
  }

  /* Only one accordion open at a time; null = all closed */
  var OPEN = null;

  /* ============================================================
     DB SNAPSHOT FOR META CARD
     ============================================================ */
  var db = EatoutsMgrDB.get();
  var userCount = (db.users || []).length;
  var bizCount  = (db.businesses || []).length;
  var ordCount  = (db.orders || []).length;

  /* ============================================================
     META CARD + PROGRESS
     ============================================================ */
  function renderMeta(){
    var dotClass = "green";
    var msg = "<b>" + userCount + "</b> users · <b>" + bizCount + "</b> businesses · <b>" + ordCount + "</b> orders";
    if (!userCount && !bizCount && !ordCount){
      dotClass = "warn";
      msg = "No platform data yet";
    }
    return '<div class="meta-card">' +
      '<div class="meta-row">' +
        '<span class="meta-dot ' + dotClass + '"></span>' +
        '<span class="meta-text">' + msg + '</span>' +
      '</div>' +
      '<div class="meta-stats">' +
        '<div class="stat"><b>' + userCount + '</b><span>Users</span></div>' +
        '<div class="stat"><b>' + bizCount + '</b><span>Businesses</span></div>' +
        '<div class="stat"><b>' + ordCount + '</b><span>Orders</span></div>' +
      '</div>' +
    '</div>';
  }

  function updateProgress(){
    var total = userCount + bizCount + ordCount;
    var pct = Math.min(100, Math.round((total / 100) * 100));
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('progressCount').textContent =
      total + ' total · ' + userCount + ' users · ' + bizCount + ' biz · ' + ordCount + ' orders';
  }

  /* ============================================================
     SECTION HELPERS
     ============================================================ */
  function setSectionSub(key, text){
    var sub = mount.querySelector('.acc[data-key="' + cssEscape(key) + '"] .acc-sub');
    if (sub) sub.textContent = text;
  }
  function setSectionDot(key, cls){
    var dot = mount.querySelector('.acc[data-key="' + cssEscape(key) + '"] .vis-dot');
    if (!dot) return;
    dot.className = 'vis-dot' + (cls ? ' ' + cls : '');
  }

  /* ============================================================
     PLATFORM CONTROLS BODY
     ============================================================ */
  function choiceHTML(icon, title, sub, href){
    return '<a class="choice" href="' + escapeAttr(href) + '">' +
      '<span class="ch-icon">' + esc(icon) + '</span>' +
      '<span class="ch-body">' +
        '<b>' + esc(title) + '</b>' +
        '<span>' + esc(sub) + '</span>' +
      '</span>' +
    '</a>';
  }

  function controlsBody(){
    return '<div class="module">' +
      '<div class="choice-grid">' +
        choiceHTML('U', 'Users',        'All accounts & roles', 'eatouts-users-manager.html') +
        choiceHTML('F', 'Feedback',     'Support queue',        'feedback-manager.html') +
        choiceHTML('V', 'Verification', 'Business approvals',   'eatouts-verification-queue.html') +
        choiceHTML('D', 'Disputes',     'Refunds & escalations','eatouts-disputes.html') +
        choiceHTML('A', 'Analytics',    'Cross-platform stats', 'eatouts-platform-analytics.html') +
        choiceHTML('N', 'Notifications','Segment messaging',    'eatouts-notifications.html') +
        choiceHTML('B', 'Blog',         'Write & publish',      'blog-creator-dashboard.html') +
        choiceHTML('R', 'Brand & Design','Roster & payouts',    'brand-kit-admin.html') +
        choiceHTML('S', 'Settings',     'Platform configuration','eatouts-settings.html') +
      '</div>' +
    '</div>';
  }

  /* ============================================================
     PROMO SUBMISSIONS BODY
     ============================================================ */
  function promosBody(){
    return '<div class="module">' +
      '<div class="chip-row" id="ps-filter">' +
        '<button class="chip on" type="button" data-ps-status="pending">Pending</button>' +
        '<button class="chip" type="button" data-ps-status="approved">Approved</button>' +
        '<button class="chip" type="button" data-ps-status="published">Published</button>' +
        '<button class="chip" type="button" data-ps-status="rejected">Rejected</button>' +
        '<button class="chip" type="button" data-ps-status="all">All</button>' +
      '</div>' +
      '<div id="ps"><div class="empty-note">Loading submissions…</div></div>' +
    '</div>';
  }

  /* ============================================================
     BUSINESS LINKS BODY
     ============================================================ */
  function linksBody(){
    return '<div class="module">' +
      '<div class="search-row">' +
        '<input id="bl-q" placeholder="Search slug or business name" autocomplete="off">' +
        '<button class="search-btn" id="bl-search" type="button">Search</button>' +
      '</div>' +
      '<div class="chip-row" id="bl-filter">' +
        '<button class="chip on" type="button" data-bl-status="">All</button>' +
        '<button class="chip" type="button" data-bl-status="active">Active</button>' +
        '<button class="chip" type="button" data-bl-status="redirect">Redirect</button>' +
        '<button class="chip" type="button" data-bl-status="revoked">Revoked</button>' +
      '</div>' +
      '<div id="bl"><div class="empty-note">Loading links…</div></div>' +
    '</div>';
  }

  /* ============================================================
     INVOICES BODY
     ============================================================ */
  function invoicesBody(){
    return '<div class="module">' +
      '<div class="chip-row" id="inv-filter">' +
        '<button class="chip on" type="button" data-inv-status="all">All</button>' +
        '<button class="chip" type="button" data-inv-status="draft">Draft</button>' +
        '<button class="chip" type="button" data-inv-status="due">Due</button>' +
        '<button class="chip" type="button" data-inv-status="paid">Paid</button>' +
      '</div>' +
      '<div class="search-row">' +
        '<input id="inv-q" placeholder="Restaurant ID or name" autocomplete="off">' +
      '</div>' +
      '<div id="inv"><div class="empty-note">Loading invoices…</div></div>' +
    '</div>';
  }

  /* ============================================================
     ACCORDION SECTION BUILDER
     ============================================================ */
  function section(key, letter, title, sub, body, dotCls, count){
    var isOpen = OPEN === key;
    var cls = 'acc' + (isOpen ? ' open' : '');
    var countBadge = (count && count > 0)
      ? '<span class="count">' + count + '</span>' : '';
    return '<section class="' + cls + '" data-key="' + escapeAttr(key) + '">' +
      '<button class="acc-head" type="button" aria-expanded="' + (isOpen ? 'true' : 'false') + '">' +
        '<span class="sec-thumb' + (count > 0 ? '' : ' plain') + '">' + esc(letter) + countBadge + '</span>' +
        '<span class="acc-title">' +
          '<b>' + esc(title) + '</b>' +
          '<span class="acc-sub">' + esc(sub) + '</span>' +
        '</span>' +
        '<span class="vis-dot ' + (dotCls || '') + '"></span>' +
      '</button>' +
      '<div class="acc-body"><div class="acc-inner">' + body + '</div></div>' +
    '</section>';
  }

  /* ============================================================
     MAIN RENDER
     ============================================================ */
  var mount = document.getElementById('app');

  function render(){
    mount.innerHTML =
      renderMeta() +
      '<div class="stack">' +
        section('controls', 'C', 'Platform controls', 'Jump into any admin surface', controlsBody(), 'off', 0) +
        section('promos',   'P', 'Promo submissions', 'Loading…',                 promosBody(),   '',   0) +
        section('links',    'L', 'Business links',    'Loading…',                 linksBody(),    'off', 0) +
        section('invoices', 'I', 'Invoices',          'Loading…',                 invoicesBody(), 'off', 0) +
      '</div>';
    updateProgress();
    wireFilters();
  }

  /* ============================================================
     ACCORDION BEHAVIOUR
     ============================================================ */
  function toggleAccordion(key){
    OPEN = (OPEN === key) ? null : key;
    var accs = mount.querySelectorAll('.acc');
    for (var i = 0; i < accs.length; i++){
      var acc = accs[i];
      var isOpen = acc.getAttribute('data-key') === OPEN;
      acc.classList.toggle('open', isOpen);
      var head = acc.querySelector('.acc-head');
      if (head) head.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    }
    if (OPEN){
      var opened = mount.querySelector('.acc[data-key="' + cssEscape(OPEN) + '"]');
      if (opened){
        setTimeout(function(){
          try { opened.scrollIntoView({ behavior:'smooth', block:'start' }); } catch (e) {}
        }, 320);
      }
    }
  }

  /* ============================================================
     FILTER CHIP HELPERS
     ============================================================ */
  function setChipActive(containerId, attr, value){
    var chips = document.querySelectorAll('#' + containerId + ' .chip');
    for (var i = 0; i < chips.length; i++){
      var c = chips[i];
      c.classList.toggle('on', String(c.getAttribute(attr)) === String(value));
    }
  }

  /* ============================================================
     PROMO SUBMISSIONS — fetch + render (preserves original APIs)
     ============================================================ */
  var psStatus = "pending";
  var verdictLabel = { pending:"Pending", approved:"Approved", published:"Published", rejected:"Rejected" };

  function psStatusClass(s){
    return ({ pending:"pending", approved:"approved", published:"published", rejected:"rejected" })[s] || "";
  }

  function psThumb(x){
    var img = x.image || x.coverImage || x.cover
      || (x.payload && (x.payload.image || x.payload.coverImage || x.payload.cover)) || "";
    if (img) {
      return '<div class="item-thumb"><img src="' + escapeAttr(img) + '" alt=""></div>';
    }
    var initial = String(x.title || "?").charAt(0).toUpperCase();
    return '<div class="item-thumb">' + esc(initial) + '</div>';
  }

  function renderPromos(rows, note){
    var box = document.querySelector("#ps");
    if (!box) return;

    if (note){
      box.innerHTML = '<div class="empty-note">' + esc(note) + '</div>';
      setSectionSub('promos', 'Unavailable');
      setSectionDot('promos', 'red');
      return;
    }
    if (!rows || !rows.length){
      box.innerHTML = '<div class="empty-note">No submissions for this status.</div>';
      setSectionSub('promos', '0 submissions · ' + psStatus);
      setSectionDot('promos', 'off');
      return;
    }

    box.innerHTML = rows.map(function(x){
      var st = x.status || "pending";
      var when = x.whenText || (x.payload && x.payload.meta && x.payload.meta.when) || "";
      var meta = '';
      meta += '<span class="pill ' + psStatusClass(st) + '">' + esc(verdictLabel[st] || st) + '</span>';
      meta += '<span class="pill orange">' + esc((x.currency || "BWP") + " " + (x.fee != null ? x.fee : 50)) + '</span>';
      if (x.source === "business") meta += '<span class="pill">Business</span>';
      if (x.restaurantId) meta += '<span class="pill">' + esc(x.restaurantId) + '</span>';
      if (x.userId) meta += '<span class="pill">' + esc(x.userId) + '</span>';

      var actions = '';
      if (st !== "approved" && st !== "published"){
        actions += '<button class="mini-btn" type="button" data-ps-act="approve">Approve</button>';
      }
      if (st !== "published"){
        actions += '<button class="mini-btn primary" type="button" data-ps-act="publish">Publish</button>';
      }
      if (st !== "rejected"){
        actions += '<button class="mini-btn danger" type="button" data-ps-act="reject">Reject</button>';
      }

      var subBits = [];
      if (x.venueName) subBits.push(esc(x.venueName));
      if (when) subBits.push(esc(when));

      return '<div class="item-row" data-pid="' + escapeAttr(x.id) + '">' +
        psThumb(x) +
        '<div class="item-body">' +
          '<div class="item-title">' + esc(x.title || "Untitled Event") + '</div>' +
          (subBits.length ? '<div class="item-sub">' + subBits.join(" · ") + '</div>' : '') +
          '<div class="item-meta">' + meta + '</div>' +
          (x.adminNote ? '<div class="item-sub" style="color:var(--muted)">Note: ' + esc(x.adminNote) + '</div>' : '') +
          (actions ? '<div class="item-actions">' + actions + '</div>' : '') +
        '</div>' +
      '</div>';
    }).join('');

    setSectionSub('promos', rows.length + ' submission' + (rows.length === 1 ? '' : 's') + ' · ' + psStatus);
    setSectionDot('promos', psStatus === 'pending' ? '' : 'off');
  }

  function loadPromos(){
    if (!window.fetch){
      renderPromos([], "Sign in as a platform admin to load the queue.");
      return;
    }
    var url = "/api/admin/promo-submissions" + (psStatus === "all" ? "" : ("?status=" + encodeURIComponent(psStatus)));
    fetch(url, { credentials:"include" })
      .then(function(r){ return r.json().catch(function(){ return {}; }); })
      .then(function(j){
        renderPromos(j && j.submissions ? j.submissions : []);
      })
      .catch(function(){
        renderPromos([], "Could not reach the server. Check your connection.");
      });
  }

  async function actPromo(id, action, btn){
    if (!window.fetch) return;
    btn.disabled = true;
    try {
      var r = await fetch("/api/admin/promo-submissions", {
        method: "PATCH",
        headers: { "content-type": "application/json" },
        credentials: "include",
        body: JSON.stringify({ id: id, action: action })
      });
      var j = await r.json().catch(function(){ return {}; });
      if (j && j.ok){
        toast("Submission " + ({ approve:"approved", reject:"rejected", publish:"published" }[action] || action));
        loadPromos();
      } else {
        toast((j && j.error) || "Action failed");
        btn.disabled = false;
      }
    } catch (e) {
      toast("Action failed");
      btn.disabled = false;
    }
  }

  /* ============================================================
     BUSINESS LINKS — fetch + render (preserves original APIs)
     ============================================================ */
  var blStatus = "";
  var blQuery  = "";
  var blLabel = { active:"Active", pending:"Pending", redirect:"Redirect", revoked:"Revoked" };

  function blStatusClass(s){
    return ({ active:"active", pending:"pending", redirect:"redirect", revoked:"revoked" })[s] || "";
  }

  function renderLinks(rows, note){
    var box = document.querySelector("#bl");
    if (!box) return;

    if (note){
      box.innerHTML = '<div class="empty-note">' + esc(note) + '</div>';
      setSectionSub('links', 'Unavailable');
      setSectionDot('links', 'red');
      return;
    }
    if (!rows || !rows.length){
      box.innerHTML = '<div class="empty-note">No links match this filter.<br>They appear once the registry is seeded or a business claims one.</div>';
      setSectionSub('links', '0 links');
      setSectionDot('links', 'off');
      return;
    }

    box.innerHTML = rows.map(function(x){
      var st = x.status || "active";
      var badgeCls = 'item-badge';
      if (st === 'active')   badgeCls += ' green';
      if (st === 'revoked')  badgeCls += ' red';
      if (st === 'redirect') badgeCls += ' blue';
      if (st === 'pending')  badgeCls += ' amber';

      var slug = x.displaySlug || x.slug;
      var initial = String(slug || "?").charAt(0).toUpperCase();

      var meta = '';
      meta += '<span class="pill ' + blStatusClass(st) + '">' + esc(blLabel[st] || st) + '</span>';
      meta += '<span class="pill">/' + esc(x.country || "bw") + '/' + esc(x.slug) + '</span>';
      if (x.redirectTo) meta += '<span class="pill orange">→ ' + esc(x.redirectTo) + '</span>';
      if (x.claimedBy)  meta += '<span class="pill">' + esc(x.claimedBy) + '</span>';

      var action = (st !== "revoked")
        ? '<button class="mini-btn danger" type="button" data-bl-act="revoke">Revoke</button>'
        : '<button class="mini-btn primary" type="button" data-bl-act="activate">Activate</button>';

      var subBits = [];
      if (x.name) subBits.push(esc(x.name));
      if (x.type) subBits.push(esc(x.type));
      if (x.refId) subBits.push(esc(x.refId));

      return '<div class="item-row" data-bid="' + escapeAttr(x.id) + '">' +
        '<div class="' + badgeCls + '">' + esc(initial) + '</div>' +
        '<div class="item-body">' +
          '<div class="item-title">' + esc(slug) + '</div>' +
          (subBits.length ? '<div class="item-sub">' + subBits.join(" · ") + '</div>' : '') +
          '<div class="item-meta">' + meta + '</div>' +
          '<div class="item-actions">' + action + '</div>' +
        '</div>' +
      '</div>';
    }).join('');

    setSectionSub('links', rows.length + ' link' + (rows.length === 1 ? '' : 's') + (blStatus ? ' · ' + blStatus : ''));
    setSectionDot('links', 'off');
  }

  function loadLinks(){
    if (!window.fetch){
      renderLinks([], "Sign in as a platform admin to load links.");
      return;
    }
    var parts = [];
    if (blStatus) parts.push("status=" + encodeURIComponent(blStatus));
    if (blQuery)  parts.push("q=" + encodeURIComponent(blQuery));
    var url = "/api/admin/links" + (parts.length ? ("?" + parts.join("&")) : "");
    fetch(url, { credentials:"include" })
      .then(function(r){ return r.json().catch(function(){ return {}; }); })
      .then(function(j){
        renderLinks(j && j.links ? j.links : []);
      })
      .catch(function(){
        renderLinks([], "Could not reach the server. Check your connection.");
      });
  }

  async function actLink(id, action, btn){
    if (!window.fetch) return;
    btn.disabled = true;
    try {
      var r = await fetch("/api/admin/links", {
        method: "PATCH",
        headers: { "content-type": "application/json" },
        credentials: "include",
        body: JSON.stringify({ id: id, action: action })
      });
      var j = await r.json().catch(function(){ return {}; });
      if (j && j.ok){
        toast("Link " + action + "d");
        loadLinks();
      } else {
        toast((j && j.error) || "Action failed");
        btn.disabled = false;
      }
    } catch (e) {
      toast("Action failed");
      btn.disabled = false;
    }
  }

  /* ============================================================
     INVOICES — fetch + render (preserves original APIs)
     ============================================================ */
  var invStatus = "all";
  var invQuery  = "";

  function invStatusClass(s){
    return ({ draft:"draft", due:"due", paid:"paid" })[s] || "";
  }

  function renderInvoices(rows, note){
    var box = document.querySelector("#inv");
    if (!box) return;

    if (note){
      box.innerHTML = '<div class="empty-note">' + esc(note) + '</div>';
      setSectionSub('invoices', 'Unavailable');
      setSectionDot('invoices', 'red');
      return;
    }
    if (!rows || !rows.length){
      box.innerHTML = '<div class="empty-note">No invoices match this filter.</div>';
      setSectionSub('invoices', '0 invoices');
      setSectionDot('invoices', 'off');
      return;
    }

    box.innerHTML = rows.map(function(x){
      var st = x.status || "draft";
      var badgeCls = 'item-badge';
      if (st === 'paid')  badgeCls += ' green';
      if (st === 'draft') badgeCls += ' muted';
      if (st === 'due')   badgeCls += ' amber';

      var idLabel = String(x.id || "—");
      var initial = idLabel.replace(/[^0-9A-Z]/gi,'').slice(-2).toUpperCase() || "IN";

      var created = x.createdAt ? (function(){
        try {
          var d = new Date(x.createdAt);
          return d.toLocaleString();
        } catch (e) { return x.createdAt; }
      })() : "";

      var amount = (x.currency || "BWP") + " " + (x.amount != null ? x.amount : 0);

      var meta = '<span class="pill ' + invStatusClass(st) + '">' + esc(st) + '</span>';

      var action = (st !== "paid")
        ? '<button class="mini-btn primary" type="button" data-act="inv-paid" data-id="' + escapeAttr(x.id) + '">Mark paid</button>'
        : '<button class="mini-btn" type="button" data-act="inv-due" data-id="' + escapeAttr(x.id) + '">Mark due</button>';

      var subBits = [];
      if (created) subBits.push(esc(created));
      subBits.push(esc(amount));

      return '<div class="item-row">' +
        '<div class="' + badgeCls + '">' + esc(initial) + '</div>' +
        '<div class="item-body">' +
          '<div class="item-title">' + esc((x.type || "Invoice") + " #" + idLabel) + '</div>' +
          '<div class="item-sub">' + subBits.join(" · ") + '</div>' +
          '<div class="item-meta">' + meta + '</div>' +
          '<div class="item-actions">' + action + '</div>' +
        '</div>' +
      '</div>';
    }).join('');

    setSectionSub('invoices', rows.length + ' invoice' + (rows.length === 1 ? '' : 's') + (invStatus !== 'all' ? ' · ' + invStatus : ''));
    setSectionDot('invoices', invStatus === 'paid' ? 'green' : 'off');
  }

  async function loadInvoices(){
    if (!window.fetch){
      renderInvoices([], "Sign in as a platform admin to load invoices.");
      return;
    }
    try {
      var q = new URLSearchParams();
      if (invStatus && invStatus !== "all") q.set("status", invStatus);
      if (invQuery) q.set("restaurant", invQuery);
      var r = await fetch("/api/admin/invoices?" + q.toString(), { credentials:"include" });
      var d = await r.json();
      if (!r.ok) throw d;
      renderInvoices(d.invoices || []);
    } catch (e) {
      renderInvoices([], "Failed to load invoices.");
    }
  }

  /* ============================================================
     WIRE FILTERS + ACTIONS
     ============================================================ */
  function wireFilters(){
    /* promo filter */
    var psF = document.getElementById('ps-filter');
    if (psF){
      psF.addEventListener('click', function(e){
        var b = e.target.closest('[data-ps-status]');
        if (!b) return;
        psStatus = b.getAttribute('data-ps-status');
        setChipActive('ps-filter', 'data-ps-status', psStatus);
        loadPromos();
      });
    }

    /* promo action buttons */
    var psL = document.getElementById('ps');
    if (psL){
      psL.addEventListener('click', function(e){
        var b = e.target.closest('[data-ps-act]');
        if (!b) return;
        var row = b.closest('[data-pid]');
        if (!row) return;
        actPromo(row.getAttribute('data-pid'), b.getAttribute('data-ps-act'), b);
      });
    }

    /* link filter */
    var blF = document.getElementById('bl-filter');
    if (blF){
      blF.addEventListener('click', function(e){
        var b = e.target.closest('[data-bl-status]');
        if (!b) return;
        blStatus = b.getAttribute('data-bl-status');
        setChipActive('bl-filter', 'data-bl-status', blStatus);
        loadLinks();
      });
    }

    /* link search */
    var blS = document.getElementById('bl-search');
    if (blS){
      blS.addEventListener('click', function(){
        blQuery = document.getElementById('bl-q').value.trim();
        loadLinks();
      });
    }
    var blQ = document.getElementById('bl-q');
    if (blQ){
      blQ.addEventListener('keydown', function(e){
        if (e.key === 'Enter'){
          blQuery = e.target.value.trim();
          loadLinks();
        }
      });
    }

    /* link action buttons */
    var blL = document.getElementById('bl');
    if (blL){
      blL.addEventListener('click', function(e){
        var b = e.target.closest('[data-bl-act]');
        if (!b) return;
        var row = b.closest('[data-bid]');
        if (!row) return;
        actLink(row.getAttribute('data-bid'), b.getAttribute('data-bl-act'), b);
      });
    }

    /* invoice filter */
    var invF = document.getElementById('inv-filter');
    if (invF){
      invF.addEventListener('click', function(e){
        var b = e.target.closest('[data-inv-status]');
        if (!b) return;
        invStatus = b.getAttribute('data-inv-status');
        setChipActive('inv-filter', 'data-inv-status', invStatus);
        loadInvoices();
      });
    }

    /* invoice search */
    var invQ = document.getElementById('inv-q');
    if (invQ){
      invQ.addEventListener('input', function(){
        invQuery = invQ.value;
        loadInvoices();
      });
    }
  }

  /* ---- Document-level click for invoice actions (preserved from original) ---- */
  document.addEventListener("click", async function(ev){
    var t = ev.target.closest("[data-act]");
    if (!t) return;
    var act = t.getAttribute("data-act");
    var id  = t.getAttribute("data-id");
    if (act === "inv-paid"){
      await fetch("/api/admin/invoices", {
        method: "PATCH",
        credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: id, action: "mark_paid" })
      });
      loadInvoices();
      return;
    }
    if (act === "inv-due"){
      await fetch("/api/admin/invoices", {
        method: "PATCH",
        credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: id, action: "mark_due" })
      });
      loadInvoices();
      return;
    }
  });

  /* ---- Reload invoices on tab visibility change (preserved) ---- */
  document.addEventListener("visibilitychange", function(){
    if (!document.hidden) loadInvoices();
  });

  /* ============================================================
     ACCORDION HEADER CLICK
     ============================================================ */
  mount.addEventListener('click', function(e){
    var head = e.target.closest('.acc-head');
    if (head){
      var acc = head.closest('.acc');
      if (acc) toggleAccordion(acc.getAttribute('data-key'));
    }
  });

  /* ============================================================
     BOOT
     ============================================================ */
  render();
  loadPromos();
  loadLinks();
  loadInvoices();
});
</script>
</body>
</html>
