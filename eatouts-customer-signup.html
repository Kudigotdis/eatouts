<!doctype html>
<!-- PAGE: Customer signup -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171719">
<title>Customer Signup · EatOuts</title>
<style>
::-webkit-scrollbar{width:0;height:0;display:none}
*{scrollbar-width:none;-ms-overflow-style:none}

:root{--ink:#171719;--ink2:#35353B;--muted:#5E626B;--faint:#8A8F99;--paper:#F4F5F7;--card:#fff;--line:#E2E5EA;--line2:#F0F1F3;--orange:#FF5A1F;--orange2:#FF7A42;--orangeSoft:#FFF0E9;--orangeLine:#FFD4C2;--green:#178247;--greenSoft:#E7F6ED;--red:#B91C1C;--redSoft:#FDECEC;--redLine:#F3C9C9;--shadow:0 5px 20px rgba(22,22,28,.055)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#E8EAEE;color:var(--ink);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid rgba(255,90,31,.24);outline-offset:2px}

/* ---------- shell ---------- */
#app-shell{width:100%;max-width:520px;height:100dvh;min-height:560px;margin:0 auto;background:var(--paper);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 60px rgba(20,20,25,.12);position:relative}
.topbar{flex:0 0 auto;background:#171719;color:#fff;padding:calc(13px + env(safe-area-inset-top)) 18px 14px}
.topbar-row{display:flex;align-items:center;gap:11px;margin-bottom:13px}
.brand-mark{height:36px;width:36px;display:grid;place-items:center;background:var(--orange);color:#fff;font-weight:900;font-size:19px;border-radius:7px}
.brand-title{font-size:18px;font-weight:850;letter-spacing:-.03em;line-height:1.2}
.brand-subtitle{font-size:11.5px;color:#AEB1B8;letter-spacing:.1em;text-transform:uppercase;margin-top:1px}
.draft-pill{margin-left:auto;border:1px solid #44444A;background:#242428;color:#FF9A70;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;padding:5px 9px;border-radius:3px}
.progress-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#B5B7BF;margin-bottom:7px}
.progress-row strong{color:#FF9A70;font-weight:800}
.progress-track{height:6px;background:#3B3B40;overflow:hidden;border-radius:3px}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--orange),var(--orange2));width:0;transition:width .2s}
.scroll{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}

/* ---------- intro ---------- */
.intro{padding:24px 20px 34px;background:linear-gradient(150deg,#171719,#25252B);color:#fff;position:relative;overflow:hidden}
.intro:after{content:"";position:absolute;width:220px;height:220px;right:-105px;top:-120px;border-radius:50%;background:radial-gradient(circle,rgba(255,90,31,.28),transparent 68%);pointer-events:none}
.eyebrow{font-size:11.5px;color:#FF9A70;font-weight:850;letter-spacing:.15em;text-transform:uppercase;margin-bottom:9px}
.intro h1{font-size:30px;letter-spacing:-.045em;line-height:1.08;margin:0 0 10px;max-width:16ch;font-weight:850}
.intro h1 span{color:#FF8B5A}
.intro p{font-size:15.5px;line-height:1.6;color:#C8C9CF;margin:0;max-width:38ch}
.content{padding:16px 13px 30px}

/* ---------- accordion ---------- */
.accordion-stack{display:flex;flex-direction:column;gap:10px}
.acc{background:var(--card);border:1px solid var(--line);border-radius:6px;box-shadow:0 1px 2px rgba(20,20,25,.02);transition:opacity .22s,filter .22s,box-shadow .22s,border-color .22s}
.acc.open{border-color:var(--orangeLine);box-shadow:0 4px 14px rgba(255,90,31,.08)}
.accordion-stack.has-open .acc:not(.open){opacity:.15;filter:blur(1.6px)}
.accordion-stack.has-open .acc.open{opacity:1;filter:none}
.acc-head{display:flex;align-items:center;text-align:left;gap:12px;width:100%;border:0;background:#fff;padding:16px 15px;color:var(--ink);border-radius:6px}
.acc.open .acc-head{border-radius:6px 6px 0 0}
.acc-head:active{background:#FAFAFB}
.acc-num{width:32px;height:32px;flex:0 0 auto;border-radius:6px;background:#F0F1F4;color:var(--faint);font-size:13px;font-weight:850;display:grid;place-items:center;letter-spacing:-.01em;transition:background .2s,color .2s}
.acc.open .acc-num{background:var(--orange);color:#fff}
.acc-num.done{background:var(--greenSoft);color:var(--green)}
.acc-title-wrap{flex:1;min-width:0}
.acc-title{font-size:17px;font-weight:800;display:block;line-height:1.3}
.acc-sub{font-size:13px;color:var(--muted);display:block;margin-top:3px;font-weight:450;line-height:1.4}
.acc-state{width:10px;height:10px;border-radius:50%;background:#D6DAE0;flex:0 0 auto;margin-left:auto}
.acc-state.progress{background:#FFB27A}
.acc-state.complete{background:var(--green)}
.acc-body{border-top:1px solid var(--line2);padding:17px 15px 18px;border-radius:0 0 6px 6px}

/* ---------- form primitives ---------- */
.note{background:#F7F8FA;border:1px solid #EBEDF0;padding:11px 12px;color:var(--muted);font-size:13.5px;line-height:1.55;border-radius:4px;margin:0 0 15px}
.note strong{color:var(--ink2)}
.field{display:block;margin-bottom:15px;min-width:0;position:relative}
.field:last-child{margin-bottom:0}
.field>span,.field>label{display:block;font-size:12.5px;font-weight:850;text-transform:uppercase;letter-spacing:.07em;color:#666A74;margin-bottom:7px}
.field .hint{display:block;text-transform:none;letter-spacing:0;font-weight:450;font-size:12.5px;color:var(--faint);margin-top:6px}
.input,.select,.textarea{width:100%;min-width:0;border:1px solid #DDE1E7;background:#fff;border-radius:4px;color:var(--ink);padding:12px 13px;font-size:17px;outline:none;line-height:1.4}
.input,.select{min-height:50px}
.input:focus,.select:focus,.textarea:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,90,31,.09)}
.input::placeholder,.textarea::placeholder{color:#B0B5BE}

/* ---------- profile picture (square, rounded) ---------- */
.pfp-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;margin:4px 0 22px}
.pfp-thumb{
  width:150px;height:150px;border-radius:22px;
  overflow:hidden;background:#F0F1F4;border:2px dashed #CDD2DA;
  display:grid;place-items:center;cursor:pointer;position:relative;
  transition:border-color .15s,background .15s,transform .15s;
  -webkit-tap-highlight-color:transparent;
}
.pfp-thumb:hover{border-color:var(--orange);background:var(--orangeSoft)}
.pfp-thumb:active{transform:scale(.98)}
.pfp-thumb.has-photo{border-style:solid;border-color:var(--line)}
.pfp-thumb.has-photo:hover{border-color:var(--orange)}
.pfp-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.pfp-input{display:none}
.pfp-caption{font-size:13px;color:var(--muted);font-weight:650;text-align:center}
.pfp-remove{
  border:0;background:transparent;color:var(--red);
  font-size:13px;font-weight:750;padding:4px 10px;cursor:pointer;border-radius:4px;
}
.pfp-remove:hover{background:var(--redSoft)}

/* ---------- DOB buttons ---------- */
.dob-row{display:grid;grid-template-columns:1fr 1.15fr .85fr;gap:9px}
.dob-btn{
  -webkit-appearance:none;appearance:none;touch-action:manipulation;
  width:100%;min-height:50px;padding:11px 10px;
  border:1px solid #DDE1E7;border-radius:4px;background:#fff;
  color:var(--ink);font-size:17px;font-weight:600;
  text-align:center;line-height:1.3;
  transition:border-color .15s,box-shadow .15s,background .15s;
}
.dob-btn:hover{border-color:#C6CBD3;background:#FAFAFB}
.dob-btn.empty{color:#B0B5BE;font-weight:500}
.dob-btn[aria-expanded="true"]{border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,90,31,.09);background:#fff}
.dob-btn:focus-visible{outline:3px solid rgba(255,90,31,.24);outline-offset:2px}

/* ---------- DOB floating popover ---------- */
.dob-popover{
  position:fixed;z-index:200;
  background:#fff;border:1px solid var(--line);border-radius:6px;
  box-shadow:0 12px 32px rgba(23,23,25,.18);
  max-height:min(280px,50vh);overflow-y:auto;
  scrollbar-width:none;-ms-overflow-style:none;
  padding:4px;-webkit-overflow-scrolling:touch;
}
.dob-popover::-webkit-scrollbar{display:none;width:0;height:0}
.dob-popover.hide{display:none}
.dob-opt{
  -webkit-appearance:none;appearance:none;touch-action:manipulation;
  display:block;width:100%;padding:11px 14px;
  border:0;background:transparent;border-radius:4px;
  color:var(--ink);font-size:16px;font-weight:600;
  text-align:center;line-height:1.3;cursor:pointer;
  transition:background .12s,color .12s;
}
.dob-opt:hover{background:var(--paper)}
.dob-opt.on{background:var(--orangeSoft);color:#C84513;font-weight:800}

/* ---------- Gender (no label, no dots) ---------- */
.seg-row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.seg{
  -webkit-appearance:none;appearance:none;touch-action:manipulation;
  display:flex;align-items:center;justify-content:center;
  min-height:50px;border:1px solid #DDE1E7;border-radius:4px;
  background:#fff;color:var(--ink);font-size:17px;font-weight:700;
  transition:border-color .15s,background .15s,color .15s;
}
.seg:hover{border-color:#C6CBD3;background:#FAFAFB}
.seg.on{border-color:var(--orange);background:var(--orangeSoft);color:#C84513;font-weight:850}

/* ---------- Password ---------- */
.pw-wrap{position:relative}
.pw-wrap .input{padding-right:52px}
.pw-toggle{
  position:absolute;right:6px;top:50%;transform:translateY(-50%);
  width:38px;height:38px;border:0;background:transparent;color:var(--faint);
  display:grid;place-items:center;border-radius:4px;cursor:pointer;
  transition:background .15s,color .15s;
  -webkit-tap-highlight-color:transparent;
}
.pw-toggle:hover{background:var(--paper);color:var(--ink2)}
.pw-toggle[aria-pressed="true"]{color:var(--orange)}
.pw-toggle:focus-visible{outline:3px solid rgba(255,90,31,.24);outline-offset:0}

/* ---------- Phone row (dial code + number) ---------- */
.phone-row{display:grid;grid-template-columns:auto 1fr;gap:9px;align-items:stretch}
.phone-code-btn{
  -webkit-appearance:none;appearance:none;touch-action:manipulation;
  min-width:100px;min-height:50px;padding:11px 12px;
  border:1px solid #DDE1E7;border-radius:4px;background:#fff;
  color:var(--ink);font-size:17px;font-weight:700;
  text-align:center;line-height:1.3;
  transition:border-color .15s,box-shadow .15s,background .15s;
}
.phone-code-btn:hover{border-color:#C6CBD3;background:#FAFAFB}
.phone-code-btn[aria-expanded="true"]{border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,90,31,.09);background:#fff}
.phone-code-btn:focus-visible{outline:3px solid rgba(255,90,31,.24);outline-offset:2px}
.phone-num{min-width:0}

/* ---------- Phone floating popover ---------- */
.phone-popover{
  position:fixed;z-index:210;
  background:#fff;border:1px solid var(--line);border-radius:6px;
  box-shadow:0 12px 32px rgba(23,23,25,.18);
  width:320px;max-width:calc(100vw - 20px);
  max-height:min(420px,70vh);
  display:flex;flex-direction:column;overflow:hidden;
}
.phone-popover.hide{display:none}
.phone-search-wrap{padding:8px;border-bottom:1px solid var(--line2);flex:0 0 auto}
.phone-search{
  width:100%;min-height:42px;padding:9px 12px;
  border:1px solid #DDE1E7;border-radius:4px;background:#fff;
  font-size:16px;color:var(--ink);outline:none;
}
.phone-search:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,90,31,.09)}
.phone-search::placeholder{color:#B0B5BE}
.phone-list{
  flex:1;min-height:0;overflow-y:auto;
  scrollbar-width:none;-ms-overflow-style:none;
  padding:4px;-webkit-overflow-scrolling:touch;
}
.phone-list::-webkit-scrollbar{display:none;width:0;height:0}
.phone-opt{
  -webkit-appearance:none;appearance:none;touch-action:manipulation;
  display:flex;align-items:center;gap:10px;width:100%;
  padding:11px 12px;border:0;background:transparent;
  border-radius:4px;color:var(--ink);font-size:15px;font-weight:600;
  text-align:left;line-height:1.3;cursor:pointer;
  transition:background .12s;
}
.phone-opt:hover{background:var(--paper)}
.phone-opt.on{background:var(--orangeSoft);color:#C84513;font-weight:800}
.phone-opt .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.phone-opt .code{flex:0 0 auto;font-size:14px;color:var(--faint);font-weight:700;white-space:nowrap}
.phone-opt.on .code{color:#C84513}
.phone-empty{padding:14px;font-size:14px;color:var(--faint);text-align:center}

/* ---------- checkboxes ---------- */
.check-list{display:flex;flex-direction:column;gap:8px}
.check-item{display:flex;align-items:flex-start;gap:10px;padding:12px;border:1px solid var(--line);background:#fff;border-radius:5px;min-height:48px}
.check-item input{accent-color:var(--orange);width:20px;height:20px;flex:0 0 auto;margin:2px 0 0}
.check-item span{font-size:15px;font-weight:650;line-height:1.45}
.check-item small{display:block;font-size:12.5px;color:var(--muted);font-weight:450;margin-top:2px}

/* ---------- buttons ---------- */
.btn{border:1px solid transparent;border-radius:4px;min-height:48px;padding:11px 14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:800;text-align:center;text-decoration:none;line-height:1.2}
.btn-primary{background:var(--orange);color:#fff}
.btn-primary:hover{background:#E94E18}
.btn-secondary{background:#fff;border-color:#DDE1E7;color:var(--ink2)}
.btn-wide{width:100%}
.btn-row{display:flex;flex-direction:column;gap:9px;margin-top:12px}
@media(min-width:420px){.btn-row{flex-direction:row}.btn-row>*{flex:1}}

/* ---------- footer ---------- */
.footer-actions{flex:0 0 auto;background:#fff;border-top:1px solid var(--line);padding:10px 13px calc(10px + env(safe-area-inset-bottom));display:flex;gap:9px}
.footer-actions .btn{flex:1;min-height:48px}

/* ---------- toast ---------- */
.status-toast{position:absolute;z-index:30;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,12px);opacity:0;pointer-events:none;background:#171719;color:#fff;padding:12px 16px;border-radius:5px;max-width:88%;font-size:13.5px;font-weight:750;box-shadow:var(--shadow);transition:opacity .2s,transform .2s;white-space:normal;text-align:center}
.status-toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- typeahead ---------- */
.tip-list{position:absolute;z-index:40;left:0;right:0;top:100%;margin:5px 0 0;background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 12px 28px rgba(23,23,25,.14);max-height:250px;overflow:auto;display:none}
.tip-list.open{display:block}
.tip-opt{display:flex;gap:8px;align-items:baseline;padding:11px 13px;font-size:15px;cursor:pointer;border-bottom:1px solid var(--line2)}
.tip-opt:last-child{border-bottom:0}
.tip-opt:hover,.tip-opt.on{background:var(--paper)}
.tip-opt .tip-kind{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);margin-left:auto;white-space:nowrap}
.tip-empty{padding:12px 13px;font-size:14px;color:var(--faint)}

/* ---------- picks ---------- */
.picks-list{max-height:280px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:4px;margin:9px 0;background:#fff}
.pick{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:5px;font-size:15px;cursor:pointer}
.pick:hover{background:var(--paper)}
.pick input{accent-color:var(--orange);margin:0;width:19px;height:19px;flex:0 0 auto}
.pick .pick-sub{margin-left:auto;font-size:12.5px;color:var(--faint);white-space:nowrap}
.pick.pick-off{opacity:.45}

/* ---------- phase card ---------- */
.phase-card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:18px;box-shadow:var(--shadow)}
.phase-card .card-title{font-size:12px;font-weight:850;letter-spacing:.1em;text-transform:uppercase;color:#6E727C;margin-bottom:11px}
.phase-card p{font-size:14.5px;color:var(--muted);margin:0 0 15px;line-height:1.6}

.hide{display:none!important}

@media(min-width:520px){body{padding:12px 0}#app-shell{height:calc(100dvh - 24px);border-radius:9px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body data-page="eatouts-customer-signup">
<div id="app-shell">
  <header class="topbar">

  <footer class="footer-actions" id="footerActions">

</div>

const $  = (s,r=document) => r.querySelector(s);
const $$ = (s,r=document) => Array.from(r.querySelectorAll(s));
const e  = (v) => String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const nonEmpty = (v) => v != null && String(v).trim().length > 0;

function getPath(obj, path){
  const parts = path.split('.');
  let v = obj;
  for (const p of parts){ if (v == null) return ''; v = v[p]; }
  return v == null ? '' : v;
}
function setPath(obj, path, value){
  const parts = path.split('.');
  let t = obj;
  for (let i=0;i<parts.length-1;i++){
    const k = parts[i];
    if (t[k] == null) t[k] = {};
    t = t[k];
  }
  t[parts[parts.length-1]] = value;
}
function pathGet(path){ return getPath(state, path); }
function setPathState(path, value){ setPath(state, path, value); }

function calcAge(year, month, day){
  if (!year || !month || !day) return NaN;
  const dob = new Date(Number(year), Number(month) - 1, Number(day));
  if (isNaN(dob.getTime())) return NaN;
  const now = new Date();
  let a = now.getFullYear() - dob.getFullYear();
  const m = now.getMonth() - dob.getMonth();
  if (m < 0 || (m === 0 && now.getDate() < dob.getDate())) a--;
  return a;
}
function daysInMonth(year, month){
  if (!year || !month) return 31;
  return new Date(Number(year), Number(month), 0).getDate();
}
function dobISO(){
  const p = state.personal;
  if (!p.dobYear || !p.dobMonth || !p.dobDay) return '';
  return `${p.dobYear}-${String(p.dobMonth).padStart(2,'0')}-${String(p.dobDay).padStart(2,'0')}`;
}
function slugify(s){ return String(s||'').toLowerCase().replace(/&/g,' and ').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,''); }

function buildFullWhatsapp(){
  const code = String(state.contact.dialCode || '267').replace(/\D/g,'');
  const num  = String(state.contact.number || '').replace(/\D/g,'');
  return code + num;
}

let toastTimer = null;
function toast(msg){
  const t = $('#toast'); if (!t) return;
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2800);
}

function inputPath(path){ return 'data-bind="'+e(path)+'"'; }
function field(label,path,type='text',opts={}){
  const value = pathGet(path);
  let extra = '';
  if (opts.placeholder) extra += ' placeholder="'+e(opts.placeholder)+'"';
  if (opts.min !== undefined) extra += ' min="'+e(opts.min)+'"';
  if (opts.max !== undefined) extra += ' max="'+e(opts.max)+'"';
  if (opts.step !== undefined) extra += ' step="'+e(opts.step)+'"';
  if (opts.autocomplete) extra += ' autocomplete="'+e(opts.autocomplete)+'"';
  if (opts.inputmode) extra += ' inputmode="'+e(opts.inputmode)+'"';
  if (opts.required) extra += ' required';
  return `<label class="field"><span>${e(label)}${opts.required?' *':''}</span><input class="input" type="${e(type)}" ${inputPath(path)} value="${e(value)}"${extra}>${opts.hint?`<small class="hint">${e(opts.hint)}</small>`:''}</label>`;
}
function checkItem(label,path,opts={}){
  const checked = !!pathGet(path);
  return `<label class="check-item"><input type="checkbox" ${inputPath(path)} ${checked?'checked':''}><span>${e(label)}${opts.desc?`<small>${e(opts.desc)}</small>`:''}</span></label>`;
}

   ============================================================ */
function isPersonalDone(){
  const p = state.personal;
  return nonEmpty(p.firstName) && nonEmpty(p.surname) && nonEmpty(p.username)
      && nonEmpty(p.dobYear) && nonEmpty(p.dobMonth) && nonEmpty(p.dobDay)
      && nonEmpty(p.gender);
}
function isLocationDone(){ return nonEmpty(state.location.town); }
function isPasswordDone(){
  return state.account.password.length >= 8 && state.account.password === state.account.confirm;
}
function isContactDone(){
  const num = String(state.contact.number || '').replace(/\D/g,'');
  /* The email is required: it is where a password reset link is sent. */
  const mail = String(state.contact.email || '').trim();
  const mailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mail);
  return num.length >= 6 && nonEmpty(state.contact.dialCode) && mailOk;
}
function moduleDone(key){
  if (key === 'personal') return isPersonalDone();
  if (key === 'location') return isLocationDone();
  if (key === 'password') return isPasswordDone();
  if (key === 'contact')  return isContactDone();
  if (key === 'review')   return isPersonalDone() && isLocationDone() && isPasswordDone() && isContactDone() && !!state.ageGate;
  return false;
}
function moduleState(key){
  if (moduleDone(key)) return 'complete';
  if (key === 'personal') return (nonEmpty(state.personal.firstName) || nonEmpty(state.personal.surname)) ? 'progress' : '';
  if (key === 'location') return nonEmpty(state.location.town) ? 'progress' : '';
  if (key === 'password') return state.account.password.length ? 'progress' : '';
  if (key === 'contact')  return (nonEmpty(state.contact.number) || nonEmpty(state.contact.email)) ? 'progress' : '';
  return '';
}
function completedCount(){
  return ['personal','location','password','contact'].filter(k=>moduleDone(k)).length;
}
function updateProgress(){
  const pct = Math.round(completedCount()/4*100);
  const t = $('#progressText'), f = $('#progressFill');
  if (t) t.textContent = pct + '% complete';
  if (f) f.style.width = pct + '%';
}

  const pr = $('#progressRow');
  const pt = $('#progressTrack');
  if (sub){
    sub.textContent = state.phase === 'form' ? 'Customer signup'
                   : state.phase === 'verify' ? 'Confirm WhatsApp'
                   : 'Pick favourites';
  }
  const show = state.phase === 'form';
  if (pr) pr.style.display = show ? 'flex' : 'none';
  if (pt) pt.style.display = show ? 'block' : 'none';
}

/* ============================================================
   RENDER: APP
   ============================================================ */
function renderApp(preserve=true){
  const sc = $('#scroll');
  const top = preserve && sc ? sc.scrollTop : 0;
  updateTopbar();
  renderIntro();

  if (state.phase === 'form'){
    $('#moduleStack').classList.remove('hide');
    $('#phasePanel').classList.add('hide');
    $('#footerActions').style.display = 'flex';
    renderModules();
    updateProgress();
  } else {
    $('#moduleStack').classList.add('hide');
    $('#phasePanel').classList.remove('hide');
    $('#footerActions').style.display = 'none';
    if (state.phase === 'verify') renderVerifyPanel();
    else if (state.phase === 'picks') renderPicksPanel();
  }
  if (sc) sc.scrollTop = top;
}

function setPhase(phase){
  state.phase = phase;
  renderApp(false);
}

/* ============================================================
   TYPEAHEAD (town / area)
   ============================================================ */
function closeTips(){
  ['fTownList','fAreaList'].forEach(id=>{
    const l = document.getElementById(id);
    if (l){ l.classList.remove('open'); l.innerHTML = ''; }
  });
}
function openTips(list, rows, onPick){
  list.innerHTML = rows.length ? rows.map((r,i)=>{
    return '<div class="tip-opt'+(i===0?' on':'')+'" data-i="'+i+'"><span>'+e(r.name)+'</span><span class="tip-kind">'+e(r.kind||'')+(r.district?' · '+e(r.district):'')+'</span></div>';
  }).join('') : '<div class="tip-empty">No matches — type a little more.</div>';
  list.classList.add('open');
  list.onmousedown = function(ev){
    const opt = ev.target.closest('.tip-opt'); if (!opt) return;
    ev.preventDefault();
    onPick(rows[Number(opt.getAttribute('data-i'))]);
    closeTips();
  };
}
function wireTypeahead(inputId, listId, kind, filter){
  const input = document.getElementById(inputId);
  const list = document.getElementById(listId);
  if (!input || !list || !window.EatoutsLocations) return;
  input.addEventListener('input', function(){
    const q = (input.value||'').trim();
    if (q.length < 2){ closeTips(); return; }
    let rows = window.EatoutsLocations.search(q, 12).filter(r => !kind || r.kind === kind);
    if (typeof filter === 'function') rows = rows.filter(filter);
    openTips(list, rows, r=>{
      input.value = r.name;
      input.dispatchEvent(new Event('input', {bubbles:true}));
    });
  });
  input.addEventListener('blur', ()=>setTimeout(closeTips, 120));
  input.addEventListener('keydown', function(ev){
    if (ev.key === 'Escape'){ closeTips(); return; }
    if (ev.key !== 'ArrowDown' && ev.key !== 'ArrowUp') return;
    const opts = list.querySelectorAll('.tip-opt'); if (!opts.length) return;
    ev.preventDefault();
    let i = -1; opts.forEach((o,k)=>{ if (o.classList.contains('on')) i = k; });
    const next = ev.key === 'ArrowDown' ? Math.min(i+1, opts.length-1) : Math.max(i-1, 0);
    opts.forEach((o,k)=>o.classList.toggle('on', k === next));
    opts[next].scrollIntoView({block:'nearest'});
  });
}
function wireTypeaheads(){
  wireTypeahead('fTown', 'fTownList', 'town', null);
  wireTypeahead('fArea', 'fAreaList', 'area', r=>{
    const town = state.location.town || '';
    return !town || !r.town || r.town.toLowerCase() === town.toLowerCase();
  });
}

/* ============================================================
   DOB FLOATING POPOVER
   ============================================================ */
let dobPopoverEl = null;
let dobActiveField = null;

function getDobPopover(){
  if (!dobPopoverEl){
    dobPopoverEl = document.createElement('div');
    dobPopoverEl.className = 'dob-popover hide';
    dobPopoverEl.setAttribute('role', 'listbox');
    document.body.appendChild(dobPopoverEl);
  }
  return dobPopoverEl;
}
function closeDobPopover(){
  if (dobPopoverEl) dobPopoverEl.classList.add('hide');
  if (dobActiveField){
    const btn = document.querySelector(`[data-dob-btn="${dobActiveField}"]`);
    if (btn) btn.setAttribute('aria-expanded', 'false');
  }
  dobActiveField = null;
}
function buildDobOptions(field){
  if (field === 'year'){
    const now = new Date().getFullYear();
    const maxY = now - (MIN_AGE + 1);
    const minY = now - MAX_AGE;
    const out = [];
    for (let y = maxY; y >= minY; y--) out.push({ value: String(y), label: String(y) });
    return out;
  }
  if (field === 'month'){
    const out = [];
    for (let i = 1; i <= 12; i++) out.push({ value: String(i), label: MONTH_NAMES[i-1] });
    return out;
  }
  if (field === 'day'){
    const max = daysInMonth(state.personal.dobYear, state.personal.dobMonth);
    const out = [];
    for (let i = 1; i <= max; i++) out.push({ value: String(i), label: String(i) });
    return out;
  }
  return [];
}
function currentDobValue(field){
  if (field === 'year') return state.personal.dobYear;
  if (field === 'month') return state.personal.dobMonth;
  if (field === 'day') return state.personal.dobDay;
  return '';
}
function openDobPopover(field){
  const btn = document.querySelector(`[data-dob-btn="${field}"]`);
  if (!btn) return;
  const pop = getDobPopover();
  const options = buildDobOptions(field);
  const current = String(currentDobValue(field));
  pop.innerHTML = options.map(o =>
    `<button type="button" class="dob-opt${current === o.value ? ' on' : ''}" data-dob-val="${o.value}" role="option" aria-selected="${current === o.value}">${o.label}</button>`
  ).join('');

  pop.style.visibility = 'hidden';
  pop.style.top = '0px';
  pop.style.left = '0px';
  pop.classList.remove('hide');

  const rect = btn.getBoundingClientRect();
  const minW = field === 'month' ? 160 : 90;
  pop.style.width = Math.max(rect.width, minW) + 'px';

  const popW = pop.offsetWidth;
  const popH = pop.offsetHeight;

  let top = rect.bottom + 6;
  const spaceBelow = window.innerHeight - rect.bottom;
  if (spaceBelow < popH + 12 && rect.top > popH + 12) top = rect.top - popH - 6;
  top = Math.max(10, Math.min(top, window.innerHeight - popH - 10));

  let left = rect.left;
  if (left + popW > window.innerWidth - 10) left = window.innerWidth - popW - 10;
  left = Math.max(10, left);

  pop.style.top = top + 'px';
  pop.style.left = left + 'px';

  let target = pop.querySelector('.dob-opt.on');
  if (!target && field === 'year'){
    const defaultYear = String(new Date().getFullYear() - 30);
    target = pop.querySelector(`.dob-opt[data-dob-val="${defaultYear}"]`);
  }
  if (target) pop.scrollTop = Math.max(0, target.offsetTop - (pop.clientHeight - target.offsetHeight) / 2);

  pop.style.visibility = '';
  dobActiveField = field;
  btn.setAttribute('aria-expanded', 'true');
}

/* ============================================================
   PHONE DIAL CODE FLOATING POPOVER
   ============================================================ */
let phonePopoverEl = null;
let phonePopoverOpen = false;

function getPhonePopover(){
  if (!phonePopoverEl){
    phonePopoverEl = document.createElement('div');
    phonePopoverEl.className = 'phone-popover hide';
    phonePopoverEl.setAttribute('role', 'dialog');
    phonePopoverEl.setAttribute('aria-label', 'Country dial code');
    document.body.appendChild(phonePopoverEl);
  }
  return phonePopoverEl;
}
function ensurePhoneStructure(pop){
  if (pop.querySelector('.phone-search')) return;
  pop.innerHTML = `<div class="phone-search-wrap"><input class="phone-search" type="text" placeholder="Search country..." autocomplete="off"></div><div class="phone-list" role="listbox"></div>`;
  const s = pop.querySelector('.phone-search');
  s.addEventListener('input', ()=> renderPhoneList(s.value));
}
function renderPhoneList(filter){
  const pop = getPhonePopover();
  ensurePhoneStructure(pop);
  const q = String(filter||'').toLowerCase().trim();
  const current = String(state.contact.dialCode || '267');
  const list = pop.querySelector('.phone-list');
  const matches = COUNTRY_CODES.filter(c => {
    if (!q) return true;
    const name = c[0].toLowerCase();
    const code = c[1];
    return name.includes(q) || ('+'+code).includes(q) || code.includes(q);
  });
  list.innerHTML = matches.length
    ? matches.map(c => {
        const isOn = c[1] === current;
        return `<button type="button" class="phone-opt${isOn?' on':''}" data-phone-code="${e(c[1])}" role="option" aria-selected="${isOn}"><span class="name">${e(c[0])}</span><span class="code">+${e(c[1])}</span></button>`;
      }).join('')
    : '<div class="phone-empty">No country matches.</div>';
}
function closePhonePopover(){
  if (phonePopoverEl) phonePopoverEl.classList.add('hide');
  if (phonePopoverOpen){
    const btn = document.querySelector('[data-phone-code-btn]');
    if (btn) btn.setAttribute('aria-expanded', 'false');
  }
  phonePopoverOpen = false;
}
function openPhonePopover(){
  const btn = document.querySelector('[data-phone-code-btn]');
  if (!btn) return;
  const pop = getPhonePopover();
  ensurePhoneStructure(pop);

  const search = pop.querySelector('.phone-search');
  if (search) search.value = '';
  renderPhoneList('');

  pop.style.visibility = 'hidden';
  pop.style.top = '0px';
  pop.style.left = '0px';
  pop.classList.remove('hide');

  const rect = btn.getBoundingClientRect();
  const popW = pop.offsetWidth;
  const popH = pop.offsetHeight;

  let top = rect.bottom + 6;
  const spaceBelow = window.innerHeight - rect.bottom;
  if (spaceBelow < popH + 12 && rect.top > popH + 12) top = rect.top - popH - 6;
  top = Math.max(10, Math.min(top, window.innerHeight - popH - 10));

  let left = rect.left;
  if (left + popW > window.innerWidth - 10) left = window.innerWidth - popW - 10;
  left = Math.max(10, left);

  pop.style.top = top + 'px';
  pop.style.left = left + 'px';
  pop.style.visibility = '';

  phonePopoverOpen = true;
  btn.setAttribute('aria-expanded', 'true');

  const current = pop.querySelector('.phone-opt.on');
  if (current){
    const list = pop.querySelector('.phone-list');
    if (list) list.scrollTop = Math.max(0, current.offsetTop - (list.clientHeight - current.offsetHeight) / 2);
  }

  if (window.matchMedia('(hover: hover)').matches && search){
    setTimeout(()=>search.focus(), 30);
  }
}

/* ============================================================
   GLOBAL CLICK: both popovers
   ============================================================ */
document.addEventListener('click', function(ev){
  /* DOB option */
  const dobOpt = ev.target.closest('.dob-opt');
  if (dobOpt && dobActiveField && dobPopoverEl && dobPopoverEl.contains(dobOpt)){
    const field = dobActiveField;
    const val = dobOpt.dataset.dobVal;
    if (field === 'year') state.personal.dobYear = val;
    else if (field === 'month') state.personal.dobMonth = val;
    else if (field === 'day') state.personal.dobDay = val;
    if (field === 'year' || field === 'month'){
      const max = daysInMonth(state.personal.dobYear, state.personal.dobMonth);
      if (Number(state.personal.dobDay) > max) state.personal.dobDay = '';
    }
    closeDobPopover();
    saveState();
    renderApp(true);
    return;
  }

  /* Phone code option */
  const phoneOpt = ev.target.closest('.phone-opt');
  if (phoneOpt && phonePopoverOpen && phonePopoverEl && phonePopoverEl.contains(phoneOpt)){
    state.contact.dialCode = phoneOpt.dataset.phoneCode;
    closePhonePopover();
    saveState();
    renderApp(true);
    return;
  }

  /* DOB button */
  const dobBtn = ev.target.closest('[data-dob-btn]');
  if (dobBtn){
    const field = dobBtn.dataset.dobBtn;
    closePhonePopover();
    if (dobActiveField === field){ closeDobPopover(); }
    else { closeDobPopover(); openDobPopover(field); }
    return;
  }

  /* Phone code button */
  const phoneBtn = ev.target.closest('[data-phone-code-btn]');
  if (phoneBtn){
    closeDobPopover();
    if (phonePopoverOpen) closePhonePopover();
    else openPhonePopover();
    return;
  }

  /* Outside clicks */
  if (dobActiveField && (!dobPopoverEl || !dobPopoverEl.contains(ev.target))){
    closeDobPopover();
  }
  if (phonePopoverOpen && (!phonePopoverEl || !phonePopoverEl.contains(ev.target))){
    closePhonePopover();
  }
}, true);

window.addEventListener('scroll', ()=>{ closeDobPopover(); closePhonePopover(); }, {capture:true, passive:true});
window.addEventListener('resize', ()=>{ closeDobPopover(); closePhonePopover(); });
document.addEventListener('keydown', ev=>{ if (ev.key === 'Escape'){ closeDobPopover(); closePhonePopover(); } });

/* ============================================================
   SIGNUP FLOW
   ============================================================ */
function handleSignup(){
  const p = state.personal, a = state.account, c = state.contact, l = state.location;

  if (!nonEmpty(p.firstName) || !nonEmpty(p.surname)){ toast('Enter your first name and surname.'); return; }
  if (!nonEmpty(p.username)){ toast('Choose a username.'); return; }
  if (!nonEmpty(p.dobYear) || !nonEmpty(p.dobMonth) || !nonEmpty(p.dobDay)){ toast('Enter your full date of birth.'); return; }
  if (!nonEmpty(p.gender)){ toast('Select your gender.'); return; }

  const years = calcAge(p.dobYear, p.dobMonth, p.dobDay);
  if (isNaN(years) || years < MIN_AGE){ toast(`You must be at least ${MIN_AGE} years old.`); return; }
  if (years > MAX_AGE){ toast('Please check your date of birth.'); return; }

  if (!nonEmpty(l.town)){ toast('Enter your town or city.'); return; }
  if (a.password.length < 8){ toast('Password must be at least 8 characters.'); return; }
  if (a.password !== a.confirm){ toast('Passwords do not match.'); return; }
  if (String(c.number || '').replace(/\D/g,'').length < 6){ toast('Enter a valid WhatsApp number.'); return; }
  if (!state.ageGate){ toast(`Please confirm you are ${MIN_AGE} or older.`); return; }

  pendingWa = buildFullWhatsapp();
  pendingTown = l.town;

  const payload = {
    firstName: p.firstName,
    surname: p.surname,
    username: p.username,
    dob: dobISO(),
    gender: p.gender,
    town: l.town,
    area: l.area,
    password: a.password,
    whatsapp: pendingWa,
    dialCode: String(c.dialCode||'267'),
    email: c.email,
    photo: p.photo || '',
    type: 'customer'
  };

  const btn = document.querySelector('[data-action="signup"]');
  if (btn){ btn.disabled = true; btn.textContent = 'Creating account…'; }

  Promise.resolve()
    .then(()=> ecustomer.signup(payload))
    .then(r=>{
      if (btn){ btn.disabled = false; btn.textContent = 'Create account'; }
      if (r && r.ok){ onSignedUp(r); return; }
      if (r && r.error === 'backend_not_configured'){ localFallback(payload); return; }
      toast((r && r.error) || 'Could not create account.');
    })
    .catch(()=>{
      if (btn){ btn.disabled = false; btn.textContent = 'Create account'; }
      toast('Network error. Please try again.');
    });
}

function onSignedUp(r){
  pendingVerifyLink = (r.verify && r.verify.link) || 'https://wa.me/26771844129';
  if (r.verify && r.verify.whatsapp) pendingWa = r.verify.whatsapp;
  clearDraft();
  setPhase('verify');
}

function localFallback(p){
  function finish(u){
    try { if (u && EatoutsAuth.startSession) EatoutsAuth.startSession(u); } catch(err){}
    if (window.EatoutsCustomer){
      window.EatoutsCustomer.state = window.EatoutsCustomer.state || {};
      window.EatoutsCustomer.state.user = {id:u && u.id, username:p.username, name:p.firstName+' '+p.surname, whatsapp:p.whatsapp, type:'customer', local:true};
    }
    clearDraft();
    setPhase('picks');
  }
  function make(extra){
    return EatoutsUsers.create(Object.assign({
      firstName:p.firstName, surname:p.surname, dob:p.dob, gender:p.gender,
      town:p.town, area:p.area, whatsapp:p.whatsapp, dialCode:p.dialCode, contacts:[],
      email:p.email, photo:p.photo, type:'customer', roles:['customer'], username:p.username
    }, extra||{}));
  }
  if (window.EatoutsAuth && EatoutsAuth.hashPassword && EatoutsAuth.randomSalt){
    const salt = EatoutsAuth.randomSalt();
    EatoutsAuth.hashPassword(p.password, salt)
      .then(hash => finish(make({passwordHash:hash, salt:salt})))
      .catch(()=>finish(make({})));
    return;
  }
  finish(make({}));
}

function handleVerify(){
  const btn = document.getElementById('verifiedBtn');
  if (btn){ btn.disabled = true; btn.textContent = 'Checking…'; }
  Promise.resolve()
    .then(()=> ecustomer.verify({whatsapp: pendingWa}))
    .then(r=>{
      if (btn){ btn.disabled = false; btn.textContent = "I've confirmed"; }
      if (r && r.ok){ setPhase('picks'); return; }
      if (r && r.error === 'backend_not_configured'){ location.href = 'eatouts-profile.html'; return; }
      toast((r && r.error) || 'Verification failed. Try again.');
    })
    .catch(()=>{
      if (btn){ btn.disabled = false; btn.textContent = "I've confirmed"; }
      toast('Network error. Please try again.');
    });
}

/* ============================================================
   PICKS PANEL
   ============================================================ */
function initPicksPanel(){
  const townSel = document.querySelector('#pkTown');
  const bottleSel = document.querySelector('#pkBottle');
  const search = document.querySelector('#pkSearch');
  const list = document.querySelector('#pkRests');
  const countEl = document.querySelector('#pkCount');
  const saveBtn = document.querySelector('#pkSave');
  const skipBtn = document.querySelector('#pkSkip');
  if (!townSel || !bottleSel || !search || !list) return;

  const data = window.EATOUTS_RESTAURANT_PICKS || {};
  const towns = Object.keys(data);

  if (towns.length){
    const match = towns.filter(t=>t.toLowerCase() === String(pendingTown).toLowerCase())[0] || towns[0];
    townSel.innerHTML = towns.map(t=>'<option'+(t === match?' selected':'')+'>'+e(t)+'</option>').join('');
  }

  if (window.EatoutsBottleStores){
    const brands = window.EatoutsBottleStores.all();
    brands.forEach(b=>{ brandBySlug[b.slug] = {name:b.name, sub:window.EatoutsBottleStores.metaFor(b)}; });
    bottleSel.innerHTML = '<option value="">— None —</option>' + brands.map(b=>'<option value="'+e(b.slug)+'">'+e(b.name)+'</option>').join('');
  }

  function updateCount(){
    const n = document.querySelectorAll('#pkRests input:checked').length;
    if (countEl) countEl.textContent = n + ' of 5 restaurants selected';
  }
  function markDisabled(){
    const n = document.querySelectorAll('#pkRests input:checked').length;
    document.querySelectorAll('#pkRests input').forEach(cb=>{
      cb.disabled = !cb.checked && n >= 5;
      const row = cb.closest('.pick');
      if (row) row.classList.toggle('pick-off', cb.disabled);
    });
  }
  function renderList(){
    const town = townSel.value;
    const q = (search.value||'').toLowerCase().trim();
    const rows = (data[town]||[]).filter(r=> !q || String(r.name).toLowerCase().indexOf(q) > -1);
    list.innerHTML = rows.map(r=>{
      const ref = slugify(r.name);
      const saved = !!(window.EatoutsCustomer && EatoutsCustomer.favourites.has({type:'restaurant', refId:ref}));
      return '<label class="pick"><input type="checkbox" value="'+e(ref)+'" data-title="'+e(r.name)+'" data-sub="'+e(town+' · '+(r.type||r.category||''))+'"'+(saved?' checked':'')+'><span>'+e(r.name)+'</span><span class="pick-sub">'+e(r.type||r.category||'')+'</span></label>';
    }).join('') || '<p class="note" style="padding:11px;margin:0">No restaurants match.</p>';
    updateCount();
    markDisabled();
  }

  townSel.onchange = renderList;
  search.oninput = renderList;
  list.onchange = function(ev){
    const cb = ev.target;
    if (!cb || cb.type !== 'checkbox') return;
    if (document.querySelectorAll('#pkRests input:checked').length > 5){
      cb.checked = false;
      toast('You can pick up to 5 restaurants.');
    }
    updateCount();
    markDisabled();
  };
  saveBtn.onclick = function(){
    saveBtn.disabled = true;
    const S = window.EatoutsCustomer;
    const jobs = [];
    document.querySelectorAll('#pkRests input:checked').forEach(cb=>{
      if (S) jobs.push(S.favourites.add({type:'restaurant', refId:cb.value, title:cb.getAttribute('data-title'), subtitle:cb.getAttribute('data-sub')}));
    });
    const slug = bottleSel.value;
    if (slug && S && brandBySlug[slug]){
      jobs.push(S.favourites.add({type:'bottlestore', refId:slug, title:brandBySlug[slug].name, subtitle:brandBySlug[slug].sub}));
    }
    Promise.all(jobs)
      .then(()=>{ location.href = 'eatouts-profile.html'; })
      .catch(()=>{ location.href = 'eatouts-profile.html'; });
  };
  skipBtn.onclick = function(){ location.href = 'eatouts-profile.html'; };

  renderList();
}

/* ============================================================
   PROFILE PICTURE COMPRESSION
   ============================================================ */
function compressAvatar(file, cb){
  const reader = new FileReader();
  reader.onload = ()=>{
    const img = new Image();
    img.onload = ()=>{
      const size = 320;
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      const min = Math.min(img.width, img.height);
      const sx = (img.width - min) / 2;
      const sy = (img.height - min) / 2;
      ctx.drawImage(img, sx, sy, min, min, 0, 0, size, size);
      try { cb(canvas.toDataURL('image/webp', 0.85)); }
      catch(err){ cb(reader.result); }
    };
    img.onerror = ()=>cb(reader.result);
    img.src = reader.result;
  };
  reader.onerror = ()=>toast('Could not read that image.');
  reader.readAsDataURL(file);
}

appShell.addEventListener('click', ev=>{

  if (t){
    const key = t.dataset.toggleAcc;
    state.uiOpen = state.uiOpen === key ? '' : key;
    renderApp(true);
    return;
  }
  const g = ev.target.closest('[data-gender]');
  if (g){
    state.personal.gender = g.dataset.gender;
    saveState();
    renderApp(true);
    return;
  }
  const pfpRemove = ev.target.closest('[data-pfp-remove]');
  if (pfpRemove){
    state.personal.photo = '';
    saveState();
    renderApp(true);
    return;
  }
  const pwBtn = ev.target.closest('[data-pw-toggle]');
  if (pwBtn){
    const path = pwBtn.dataset.pwToggle;
    pwVisible[path] = !pwVisible[path];
    const wrap = pwBtn.closest('.pw-wrap');
    const input = wrap && wrap.querySelector('input');
    if (input){
      const len = input.value.length;
      input.type = pwVisible[path] ? 'text' : 'password';
      try { input.focus(); input.setSelectionRange(len, len); } catch(e){}
    }
    pwBtn.setAttribute('aria-pressed', String(!!pwVisible[path]));
    pwBtn.setAttribute('aria-label', pwVisible[path] ? 'Hide password' : 'Show password');
    pwBtn.innerHTML = pwVisible[path] ? SVG_EYE_OFF : SVG_EYE;
    return;
  }
  if (ev.target.closest('[data-action="save-draft"]')){ saveState(true); return; }
  if (ev.target.closest('[data-action="publish"]')){
    state.uiOpen = 'review';
    renderApp(true);
    const r = $('[data-acc-key="review"]');
    if (r) setTimeout(()=>r.scrollIntoView({behavior:'smooth',block:'start'}), 60);
    return;
  }
  if (ev.target.closest('[data-action="signup"]')){ handleSignup(); return; }
  const jump = ev.target.closest('[data-jump-to]');
  if (jump){
    state.uiOpen = jump.dataset.jumpTo;
    renderApp(true);
    return;
  }
});

appShell.addEventListener('input', ev=>{
  const t = ev.target;
  if (!t.dataset || !t.dataset.bind) return;
  if (t.matches('select')) return;
  if (t.type === 'checkbox') return;
  const path = t.dataset.bind;
  setPathState(path, t.value);
  saveState();
  updateProgress();
});

appShell.addEventListener('change', ev=>{
  const t = ev.target;

  if (t.matches('[data-pfp-input]')){
    const file = t.files && t.files[0];
    if (!file) return;
    if (!file.type.startsWith('image/')){ toast('Choose an image file.'); return; }
    compressAvatar(file, data=>{
      state.personal.photo = data;
      saveState();
      renderApp(true);
      toast('Profile picture added.');
    });
    t.value = '';
    return;
  }

  if (!t.dataset) return;
  if (t.matches('select') && t.dataset.bind){
    setPathState(t.dataset.bind, t.value);
    saveState();
    renderApp(true);
    return;
  }
  if (t.type === 'checkbox' && t.dataset.bind){
    setPathState(t.dataset.bind, t.checked);
    saveState();
    renderApp(true);
    return;
  }
});

/* ============================================================
   BOOT
   ============================================================ */
if (!state.uiOpen) state.uiOpen = 'personal';
renderApp(false);
saveState();
})();
</script>
</body>
</html>
