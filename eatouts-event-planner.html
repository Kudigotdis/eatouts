<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Event Planner — EatOuts</title>
<style>
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#f0ece2;height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;color:#1a1a1a;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;text-align:left}
img{display:block;max-width:100%}
::-webkit-scrollbar{width:0;height:0;display:none}
*{scrollbar-width:none;-ms-overflow-style:none}

:root{
  --black:#1a1a1a; --border:#ece7db; --muted:#a89a7e; --muted-2:#8a8170;
  --ok:#17834b; --danger:#c43c3c;
  --s1-bg:#faf8f2; --s1-bd:#f1ece1; --s1-fg:#8a7a55;
  --s2-bg:#f5ebe2; --s2-bd:#e8cfbd; --s2-fg:#8a4a2a;
  --s3-bg:#eef2e4; --s3-bd:#d6dfc1; --s3-fg:#4a6b2a;
  --s4-bg:#e8f0f5; --s4-bd:#c5d5e0; --s4-fg:#2a527a;
  --s5-bg:#f8ecf0; --s5-bd:#ebd0d8; --s5-fg:#8a3a4a;
  --s6-bg:#f0ecf5; --s6-bd:#ddd2e8; --s6-fg:#5c3a7a;
  --s7-bg:#efede7; --s7-bd:#d8d4c8; --s7-fg:#3a3324;
}

#shell{position:fixed;inset:0;max-width:460px;margin:0 auto;display:flex;flex-direction:column;background:#fff;box-shadow:0 0 80px rgba(0,0,0,.08);overflow:hidden}
@media(min-width:520px){#shell{border-left:1px solid var(--border);border-right:1px solid var(--border)}}

#hdr{flex:0 0 auto;height:58px;display:flex;align-items:center;gap:10px;padding:0 14px;background:#fff;border-bottom:1px solid var(--border);position:relative;z-index:58;padding-top:env(safe-area-inset-top)}
.brand-mark{height:34px;width:auto;aspect-ratio:1172/504;flex:0 0 auto;display:flex;align-items:center}
.brand-mark img{width:100%;height:100%;object-fit:contain;display:block}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.status{font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#a89a7e;border:1px solid var(--border);border-radius:20px;padding:4px 9px;background:#faf8f2;white-space:nowrap}
.status.on{color:var(--ok);border-color:#b8e6c1;background:#e3f5e9}
#nav{flex:0 0 auto;position:relative;display:flex;background:#0a0a0a;border-top:1px solid #1a1a1a;padding-bottom:env(safe-area-inset-bottom);z-index:50}
.nav-btn{flex:1;padding:16px 2px 15px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.42);text-decoration:none;transition:color .18s}
.nav-btn svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav-btn:active{color:rgba(255,255,255,.75)}

#scroll{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:#fff}
#bar{flex:0 0 auto;display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--border);position:relative;z-index:50}
#bar .btn{flex:1;min-height:46px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 14px;border-radius:11px;font-size:12.5px;font-weight:800;letter-spacing:.02em;background:#f7f4ec;border:1px solid var(--border);color:#3a3324}
.btn:active{background:#efe9da}
.btn.primary{background:#0d0d0d;border-color:#0d0d0d;color:#fff}
.btn.gold{background:#1a1a1a;border-color:#1a1a1a;color:#fff}
.btn.ghost{background:transparent;border-color:var(--border);color:#6f6754}

.hero{padding:16px 16px 14px;background:#fff;border-bottom:1px solid var(--border)}
.hero .tag{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#8a6a1a;background:#fdf6e8;border:1px solid #f0dfb8;padding:4px 8px;border-radius:6px;margin-bottom:6px}
.hero h1{margin:0 0 2px;font-size:20px;font-weight:900;letter-spacing:-.015em;color:#1a1a1a}
.hero p{margin:0;font-size:12px;color:var(--muted);line-height:1.5}

.cover{position:relative;width:100%;aspect-ratio:16/9;background:#f4efe4;overflow:hidden;cursor:pointer;border-bottom:1px solid var(--border)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover .placeholder{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#a89a7e;font-size:12px;font-weight:700}
.cover .placeholder .ico{font-size:26px;opacity:.55}
.cover .badge{position:absolute;left:12px;bottom:10px;font-size:9.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:rgba(0,0,0,.55);padding:4px 9px;border-radius:20px}
.cover .pill{position:absolute;right:12px;top:10px;font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;border-radius:20px}
.cover .pill.draft{background:#f0eee8;color:#7a7466}
.cover .pill.published{background:#e3f5e9;color:var(--ok)}

.acc{padding:12px 12px 100px}
.acc-item{margin-bottom:10px;border:1px solid var(--border);border-radius:14px;background:#fff;overflow:hidden}
.acc-hdr{width:100%;min-height:64px;padding:12px 14px;border:1px solid transparent;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:2px;cursor:pointer;text-align:left}
.acc-hdr .t{font-size:14.5px;font-weight:800;line-height:1.2}
.acc-hdr .s{font-size:11px;font-weight:600;opacity:.85;line-height:1.3}
.acc-hdr .n{font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:rgba(0,0,0,.06);margin-bottom:2px}
.acc-item.i1 .acc-hdr{background:var(--s1-bg);border-color:var(--s1-bd);color:var(--s1-fg)}
.acc-item.i2 .acc-hdr{background:var(--s2-bg);border-color:var(--s2-bd);color:var(--s2-fg)}
.acc-item.i3 .acc-hdr{background:var(--s3-bg);border-color:var(--s3-bd);color:var(--s3-fg)}
.acc-item.i4 .acc-hdr{background:var(--s4-bg);border-color:var(--s4-bd);color:var(--s4-fg)}
.acc-item.i5 .acc-hdr{background:var(--s5-bg);border-color:var(--s5-bd);color:var(--s5-fg)}
.acc-item.i6 .acc-hdr{background:var(--s6-bg);border-color:var(--s6-bd);color:var(--s6-fg)}
.acc-item.i7 .acc-hdr{background:var(--s7-bg);border-color:var(--s7-bd);color:var(--s7-fg)}
.acc-item.open .acc-hdr{border-bottom-left-radius:0;border-bottom-right-radius:0;filter:brightness(.98)}
.acc-body{max-height:0;overflow:hidden;transition:max-height .3s cubic-bezier(.4,0,.2,1)}
.acc-item.open .acc-body{max-height:20000px;transition:max-height .55s ease-in-out;border-top:1px solid var(--border)}
.acc-in{padding:14px}

.field{margin-bottom:12px}
.field label{display:block;font-size:9.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#a89a7e;margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;padding:11px 12px;background:#faf8f2;border:1px solid var(--border);border-radius:11px;color:#1a1a1a;font-size:13.5px;outline:none;min-height:44px}
.field input:focus,.field textarea:focus,.field select:focus{border-color:#1a1a1a;background:#fff}
.field textarea{resize:vertical;min-height:78px;line-height:1.55}
.field .row{display:flex;gap:8px}
.field .row > *{flex:1;min-width:0}
.counter{float:right;font-size:10px;color:#a89a7e;font-weight:400}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:11px;font-weight:700;padding:6px 12px;border-radius:999px;background:#faf8f2;border:1px solid var(--border);color:#5c5547;cursor:pointer}
.chip.on{background:#0d0d0d;border-color:#0d0d0d;color:#fff}

.sw{display:flex;align-items:center;gap:12px;padding:11px 12px;background:#faf8f2;border:1px solid var(--border);border-radius:11px;margin-bottom:8px;cursor:pointer}
.sw input{display:none}
.sw .track{width:42px;height:24px;flex:0 0 auto;background:#d6cfbf;border-radius:999px;position:relative;transition:background .2s}
.sw .track:after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;background:#fff;border-radius:50%;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.sw input:checked + .track{background:#1a1a1a}
.sw input:checked + .track:after{transform:translateX(18px)}
.sw .lbl{flex:1;font-size:12.5px;font-weight:700;color:#3a3324}
.sw .lbl em{display:block;font-style:normal;font-size:10.5px;color:var(--muted);font-weight:600;margin-top:2px}

.tpls{margin-bottom:14px}
.tpls-head{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#a89a7e;margin-bottom:8px}
.tpl{width:100%;display:flex;gap:10px;align-items:center;padding:11px 12px;background:#fff;border:1px solid var(--border);border-radius:11px;margin-bottom:6px;cursor:pointer}
.tpl.on{border-color:#1a1a1a;background:#faf8f2}
.tpl .ico{width:34px;height:34px;flex:0 0 auto;border-radius:9px;background:#faf8f2;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:17px}
.tpl .info{flex:1;min-width:0}
.tpl .info b{display:block;font-size:12.5px;font-weight:800;color:#1a1a1a;line-height:1.25;margin-bottom:2px}
.tpl .info span{display:block;font-size:10.5px;color:var(--muted);line-height:1.3}

.sup-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px;background:#e8f0f5;border:1px solid #c5d5e0;border-radius:11px}
.sup-stat{display:flex;flex-direction:column;gap:2px}
.sup-stat .l{font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#4a6b8a}
.sup-stat b{font-size:15px;font-weight:900;color:var(--s4-fg)}

.sup-cat{border:1px solid var(--border);border-radius:11px;margin-bottom:8px;overflow:hidden;background:#fff}
.sup-cat-hdr{width:100%;display:flex;align-items:center;gap:10px;padding:12px 14px;background:#faf8f2;cursor:pointer;text-align:left}
.sup-cat-ico{font-size:18px;flex:0 0 auto}
.sup-cat-info{flex:1;min-width:0}
.sup-cat-info b{display:block;font-size:12.5px;font-weight:800;color:#1a1a1a;line-height:1.2}
.sup-cat-info span{display:block;font-size:10.5px;color:var(--muted);margin-top:2px}
.sup-cat-chev{font-size:14px;color:var(--muted);flex:0 0 auto;transition:transform .2s}
.sup-cat.open .sup-cat-chev{transform:rotate(90deg)}
.sup-cat-body{padding:10px 12px;border-top:1px solid var(--border)}
.sup-cat-blurb{margin:0 0 10px;font-size:11.5px;color:var(--muted);line-height:1.5;font-style:italic}

.sup-type{border:1px solid var(--border);border-radius:10px;margin-bottom:6px;background:#fff;overflow:hidden}
.sup-type.on{border-color:#c5d5e0;background:#f8fbfd}
.sup-type-row{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;text-align:left;width:100%}
.sup-tick{width:22px;height:22px;flex:0 0 auto;border:1.5px solid var(--border);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;color:#a89a7e}
.sup-type.on .sup-tick{background:var(--s4-fg);border-color:var(--s4-fg);color:#fff}
.sup-type-info{flex:1;min-width:0}
.sup-type-info b{display:block;font-size:12.5px;font-weight:700;color:#1a1a1a;line-height:1.3}
.sup-type-info span{display:block;font-size:10.5px;color:var(--muted);margin-top:2px}
.sup-detail{padding:10px 12px 12px;border-top:1px solid var(--border);background:#fafbfc}
.sup-detail .field{margin-bottom:8px}
.sup-detail .field:last-child{margin-bottom:0}
.sup-detail .field input,.sup-detail .field select{min-height:38px;padding:8px 10px;font-size:12.5px}

.dish-row{display:flex;gap:6px;align-items:center;padding:8px 10px;border:1px solid var(--border);border-radius:10px;margin-bottom:6px;background:#fff}
.dish-row .n{flex:1;font-size:12.5px;font-weight:700;color:#1a1a1a}
.dish-row .p{font-size:11.5px;font-weight:800;color:#a89a7e;min-width:70px;text-align:right}
.dish-row .x{width:26px;height:26px;flex:0 0 auto;border-radius:6px;background:#fbeaea;color:var(--danger);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px;padding:0;min-height:26px}

.perf-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:11px;background:#faf8f2;margin-bottom:8px}
.perf-info{min-width:0;flex:1}
.perf-info b{display:block;font-size:12.5px;font-weight:800;color:#1a1a1a}
.perf-info span{display:block;font-size:11px;color:var(--muted);margin-top:2px}

.budget-box{background:#faf8f2;border:1px solid var(--border);border-radius:11px;padding:12px;margin-top:12px}
.budget-row{display:flex;justify-content:space-between;align-items:baseline;padding:5px 0;font-size:12.5px;color:#3a3324}
.budget-row.total{border-top:1px solid var(--border);margin-top:6px;padding-top:8px;font-size:14px;font-weight:900;color:#1a1a1a}
.sup-list{margin-top:12px;border:1px solid var(--border);border-radius:11px;overflow:hidden;background:#fff}
.sup-list-row{display:grid;grid-template-columns:14px 1fr auto auto;gap:8px;align-items:center;padding:9px 12px;border-bottom:1px solid #f4efe4;font-size:12px}
.sup-list-row:last-child{border-bottom:0}
.sup-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.sup-list-name{font-weight:700;color:#1a1a1a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sup-list-cat{font-size:10px;color:var(--muted);font-weight:600}
.sup-list-cost{font-weight:900;color:#3a3324;text-align:right}

.check{padding:11px 13px;border-radius:11px;margin-bottom:8px;font-size:12px;line-height:1.5;display:flex;gap:8px;align-items:flex-start}
.check.ok{background:#e3f5e9;border:1px solid #b8e6c1;color:#1c6b2e}
.check.warn{background:#fdf3dc;border:1px solid #ece0be;color:#8a6a1a}
.check.info{background:#eef4ff;border:1px solid #cfdcf4;color:#24476e}
.check .ic{font-weight:900;flex:0 0 auto}

.preview-head{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#a89a7e;margin:16px 0 8px}
.pcard{border:1px solid var(--border);border-radius:14px;overflow:hidden;background:#fff}
.pcard-img{aspect-ratio:16/10;background:#f4efe4;display:flex;align-items:center;justify-content:center;color:#c9c2b3;font-size:30px;position:relative}
.pcard-img img{width:100%;height:100%;object-fit:cover;display:block}
.pcard-img .when{position:absolute;left:10px;bottom:10px;background:rgba(0,0,0,.6);color:#fff;font-size:10px;font-weight:800;letter-spacing:.06em;padding:4px 9px;border-radius:20px;text-transform:uppercase}
.pcard-img .sponsor{position:absolute;right:10px;top:10px;background:rgba(26,26,26,.9);color:#fff;font-size:9.5px;font-weight:800;letter-spacing:.08em;padding:4px 9px;border-radius:20px;text-transform:uppercase}
.pcard-body{padding:12px 14px}
.pcard-body h3{font-size:15px;font-weight:900;letter-spacing:-.01em;line-height:1.25;color:#1a1a1a;margin:0 0 4px}
.pcard-body .venue{font-size:11px;color:#a89a7e;font-weight:700;margin-bottom:8px}
.pcard-body .desc{font-size:12px;color:#5c5547;line-height:1.5;margin:0 0 8px}
.pcard-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:10px;border-top:1px solid #f4efe4}
.pcard-foot .price{font-size:13px;font-weight:900;color:#1a1a1a}
.pcard-foot .cta{font-size:11px;font-weight:800;color:var(--muted-2)}

.wa{background:#e5ddd5;border-radius:12px;padding:12px 12px 14px}
.wa-bubble{background:#fff;border-radius:12px;padding:10px 12px;max-width:92%;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.wa-bubble .b{font-size:12.5px;line-height:1.5;color:#1a1a1a;white-space:pre-wrap;word-break:break-word}
.wa-meta{display:flex;justify-content:flex-end;margin-top:4px}
.wa-meta .t{font-size:9.5px;color:#8a8170}

.hint{font-size:10.5px;color:#a89a7e;margin-top:5px;line-height:1.4}

.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#0d0d0d;color:#fff;padding:11px 20px;border-radius:11px;font-size:12.5px;font-weight:700;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none;box-shadow:0 8px 30px -8px rgba(0,0,0,.4);max-width:90%;text-align:center}
.toast.on{opacity:1}

.scrim{position:fixed;inset:0;background:rgba(20,18,12,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:100;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:520px){.scrim{align-items:center;padding:16px}}
.sheet{background:#fff;width:100%;max-width:460px;max-height:92vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;overflow:hidden}
@media(min-width:520px){.sheet{border-radius:16px}}
.sheet-hdr{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.sheet-hdr h3{margin:0;font-size:14px;font-weight:900;flex:1}
.sheet-body{padding:14px 16px;overflow-y:auto}
.sheet-foot{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;background:#faf8f2}
.sheet-foot .btn{flex:1}
</style>
</head>
<body>
<div id="shell">
  <header id="hdr">
    <a class="brand-mark" href="index.html#promos"><img src="assets/logo/EatOuts_Logo.png" alt="EatOuts"></a>
    <div class="hdr-right"><span class="status" id="hdrStatus">Draft</span></div>
  </header>
  <div id="scroll"></div>
  <div id="bar"></div>
  <nav id="nav">
    <a class="nav-btn" href="index.html#promos" aria-label="Promos"><svg viewBox="0 0 24 24"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg></a>
    <a class="nav-btn" href="index.html#restaurants" aria-label="Restaurants"><svg viewBox="0 0 24 24"><path d="M3 9l1.5-5h15L21 9"/><path d="M3 9v11a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V9"/><path d="M3 9h18"/><path d="M9 13h6"/></svg></a>
    <a class="nav-btn" href="index.html#reserve" aria-label="Events"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></a>
    <a class="nav-btn" href="index.html#gallery" aria-label="Gallery"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></a>
    <a class="nav-btn" href="index.html#about" aria-label="About"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg></a>
  </nav>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';

  /* ============================================================
     CONSTANTS
     ============================================================ */
  var STORAGE_KEY = 'eatouts_event_planner_v1';

  var EVENT_TYPES = [
    'Live Music / DJ Night','Match Day Screening','Ladies Night','Lads Night',
    'Poetry / Spoken Word','Comedy Night','Karaoke Night','Quiz / Trivia Night',
    'Chisanyama / Braai','Tasting Menu','Guest Chef Evening','Wine / Beer Tasting',
    'Coffee Cupping','Cocktail Masterclass','Pop-Up / Collab','Product Launch',
    'Brand Activation','Holiday Special','Family Funday','Sunday Roast',
    'Birthday / Private Party','Corporate Dinner','Kids Party',
    'Wedding Reception','Conference','Other'
  ];

  var THEMES = ['Heritage','Independence','Christmas','New Year',"Valentine's",
    "Women's Day","Men's Day",'Youth','Football','Rugby','Africa Day','Oktoberfest',

  /* ============================================================

     ============================================================ */
  function esc(s){
    return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function uid(p){ return (p||'id') + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,7); }
  function money(n){ return 'P' + (Number(n)||0).toFixed(2); }
  function dateLabel(iso){
    if(!iso) return '';
    try { return new Date(iso + 'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
    catch(e){ return iso; }
  }
  function timeLabel(hhmm){
    if(!hhmm) return '';
    var p = String(hhmm).split(':');
    if (p.length < 2) return hhmm;
    var h = parseInt(p[0],10), m = p[1], ap = h>=12?'pm':'am', h12 = h%12 || 12;
    return h12 + ':' + m + ap;
  }
  function findCategory(cid){
    for (var i=0;i<CATALOG.length;i++) if (CATALOG[i].id === cid) return CATALOG[i];
    return null;
  }
  function findType(cid, tid){
    var cat = findCategory(cid);
    if (!cat) return null;
    for (var i=0;i<cat.types.length;i++) if (cat.types[i].id === tid) return cat.types[i];
    return null;
  }

  /* ============================================================
     PERSISTENCE
     ============================================================ */
  function saveDraft(){
    try {
      state.draft.updatedAt = Date.now();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.draft));
      state.dirty = false;
      paintHeader();
    } catch(e){ console.warn('[planner] save failed', e); }
  }
  function loadDraft(){
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return blankDraft();
      var parsed = JSON.parse(raw);
      var merged = Object.assign(blankDraft(), parsed);
      if (!Array.isArray(merged.dishes)) merged.dishes = [];
      if (!Array.isArray(merged.suppliers)) merged.suppliers = [];
      if (!Array.isArray(merged.themes)) merged.themes = [];
      if (!Array.isArray(merged.recurrence)) merged.recurrence = [];
      if (!Array.isArray(merged.dietaryOptions)) merged.dietaryOptions = [];
      if (!Array.isArray(merged.performances)) merged.performances = [];
      return merged;
    } catch(e){ return blankDraft(); }
  }

  /* ============================================================
     SUPPLIER HELPERS
     ============================================================ */
  function supplierFor(cid, tid){
    for (var i=0;i<state.draft.suppliers.length;i++){
      var s = state.draft.suppliers[i];
      if (s.categoryId === cid && s.typeId === tid) return s;
    }
    return null;
  }
  function addSupplier(cid, tid){
    if (supplierFor(cid, tid)) return;
    state.draft.suppliers.push({
      id: uid('sup'), categoryId: cid, typeId: tid,
      name: '', contact: '', status: 'needed', cost: null, notes: ''
    });
    state.dirty = true;
  }
  function removeSupplierByType(cid, tid){
    state.draft.suppliers = state.draft.suppliers.filter(function(s){
      return !(s.categoryId === cid && s.typeId === tid);
    });
    state.dirty = true;
  }
  function supplierBudget(){
    return state.draft.suppliers.reduce(function(sum, s){
      return sum + (Number(s.cost) || 0);
    }, 0);
  }
  function suppliersConfirmed(){
    return state.draft.suppliers.filter(function(s){
      return s.status === 'confirmed' || s.status === 'paid';
    }).length;
  }

  /* ============================================================

  function toast(m){
    var t = document.getElementById('toast');
    if (!t) return;
    t.textContent = m; t.classList.add('on');
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ t.classList.remove('on'); }, 2000);
  }

  function openSheet(title, bodyHTML, onSave, saveLabel){
    var scrim = document.createElement('div');
    scrim.className = 'scrim';
    scrim.innerHTML =
      '<div class="sheet">' +
        '<div class="sheet-hdr"><h3>' + esc(title) + '</h3>' +
          '<button class="btn ghost" data-close style="min-height:auto;padding:6px 10px;font-size:11px">Close</button>' +
        '</div>' +
        '<div class="sheet-body">' + bodyHTML + '</div>' +
        '<div class="sheet-foot">' +
          '<button class="btn ghost" data-close>Cancel</button>' +
          (onSave ? '<button class="btn gold" data-save>' + esc(saveLabel||'Save') + '</button>' : '') +
        '</div>' +
      '</div>';
    document.body.appendChild(scrim);
    var close = function(){ scrim.remove(); };
    scrim.querySelectorAll('[data-close]').forEach(function(b){ b.onclick = close; });
    var saveBtn = scrim.querySelector('[data-save]');
    if (saveBtn && onSave) saveBtn.onclick = function(){ onSave(scrim); };
    scrim.addEventListener('click', function(ev){ if (ev.target === scrim) close(); });
    return scrim;
  }

  function paintHeader(){
    var s = els.hdr; if (!s || !state.draft) return;
    if (state.draft.status === 'published') { s.classList.add('on'); s.textContent = 'Published'; }
    else { s.classList.remove('on'); s.textContent = state.dirty ? 'Editing…' : 'Draft saved'; }
  }

    if (!state.draft) state.draft = loadDraft();
    paintHeader();

    var h = '';
    h += renderHero();
    h += renderCover();
    h += '<div class="acc">';
    h += step('basics',    1, 'The Event',        'Name, type, theme, templates');
    h += step('schedule',  2, 'When & Where',     'Dates, times, venue, capacity');
    h += step('food',      3, 'Food & Drink',     'Featured dishes, drink specials');
    h += step('suppliers', 4, 'Suppliers',        'Eight categories — track status and cost');
    h += step('booking',   5, 'Booking & Guests', 'How customers book, age, deposit');
    h += step('lineup',    6, 'Lineup',           'DJ, band, MC, poets');
    h += step('publish',   7, 'Review & Publish', 'Budget, conflict check, WhatsApp preview');

    els.scroll.innerHTML = h;

  function step(key, num, title, subtitle){
    var open = state.openStep === key;
    var cls = 'i' + num;
    return '' +
      '<section class="acc-item ' + cls + (open ? ' open' : '') + '">' +
        '<button class="acc-hdr" data-act="toggleStep" data-step="' + key + '">' +

          '<span class="t">' + esc(title) + '</span>' +
          '<span class="s">' + esc(subtitle) + '</span>' +
        '</button>' +
        '<div class="acc-body"><div class="acc-in">' + stepBody(key) + '</div></div>' +
      '</section>';
  }

  function stepBody(key){
    if (key === 'basics')    return rBasics();
    if (key === 'schedule')  return rSchedule();
    if (key === 'food')      return rFood();
    if (key === 'suppliers') return rSuppliers();
    if (key === 'booking')   return rBooking();
    if (key === 'lineup')    return rLineup();
    if (key === 'publish')   return rPublish();
    return '';

    '</select></div>';

    h += '<div class="field"><label>Theme / occasion</label><div class="chips">' +
      THEMES.map(function(t){

  function renderChecks(){
    var d = state.draft;
    var checks = [];
    if (!d.name)      checks.push({ k:'warn', ic:'!', txt:'Give the event a name before publishing.' });
    if (!d.startDate) checks.push({ k:'warn', ic:'!', txt:'Pick a start date.' });
    else checks.push({ k:'ok', ic:'✓', txt:'Event date set: ' + dateLabel(d.startDate) + '.' });
    if (!d.shortDesc) checks.push({ k:'info', ic:'ℹ', txt:'A short description boosts tap-through on the feed.' });
    if (!d.startTime) checks.push({ k:'info', ic:'ℹ', txt:'No start time — will show "Time TBC".' });
    if (d.suppliers.length && suppliersConfirmed() === 0) {
      checks.push({ k:'info', ic:'ℹ', txt:d.suppliers.length + ' supplier(s) marked as needed — none confirmed yet.' });
    }
    return checks.map(function(c){
      return '<div class="check ' + c.k + '"><span class="ic">' + c.ic + '</span><span>' + esc(c.txt) + '</span></div>';
    }).join('');
  }

  function renderEventCard(){
    var d = state.draft;
    var when = d.startDate ? dateLabel(d.startDate) + (d.startTime ? ' · ' + timeLabel(d.startTime) : '') : 'Date TBC';
    var h = '';
    h += '<div class="pcard">';
    h += '<div class="pcard-img">';
    h += d.coverImage ? '<img src="' + esc(d.coverImage) + '" alt="">' : '🖼';
    h += '<span class="when">' + esc(when) + '</span>';
    if (d.sponsor) h += '<span class="sponsor">' + esc(d.sponsor) + '</span>';
    h += '</div>';
    h += '<div class="pcard-body">';
    h += '<h3>' + esc(d.name || 'Untitled event') + '</h3>';
    h += '<div class="venue">' + esc(d.type || 'Event') + (d.roomArea ? ' · ' + esc(d.roomArea) : '') + '</div>';
    if (d.shortDesc) h += '<p class="desc">' + esc(d.shortDesc) + '</p>';
    h += '<div class="pcard-foot">';
    h += '<span class="price">' + esc(d.coverCharge || 'Free entry') + '</span>';
    h += '<span class="cta">Reserve on WhatsApp →</span>';
    h += '</div>';
    h += '</div></div>';
    return h;
  }

  function buildShareMessage(){
    var d = state.draft;
    var lines = [];
    lines.push('*' + (d.name || 'EatOuts Event') + '*');
    if (d.startDate) {
      var when = dateLabel(d.startDate);
      if (d.startTime) when += ' · ' + timeLabel(d.startTime);
      lines.push(when);
    }
    if (d.shortDesc) { lines.push(''); lines.push(d.shortDesc); }
    if (d.coverCharge) { lines.push(''); lines.push('Entry: ' + d.coverCharge); }
    lines.push('');
    lines.push('Reserve on WhatsApp: +267 71 844 129');
    return lines.join('\n');
  }

    var pub = d.status === 'published';
    els.bar.innerHTML =
      '<button class="btn ghost" data-act="resetDraft">Reset</button>' +
      '<button class="btn primary" data-act="saveDraft">' + (pub?'Save':'Save draft') + '</button>' +
      '<button class="btn ' + (pub?'ghost':'gold') + '" data-act="togglePublish">' +
        (pub?'Unpublish':'Publish') + '</button>';
  }

  /* ============================================================
     LIVE INPUT BINDING
     ============================================================ */
  function bindInputs(){
    var d = state.draft;

    /* Simple text/number inputs */
    var map = {
      'f_name':         function(v){ d.name = v; },
      'f_short':        function(v){ d.shortDesc = v; },
      'f_long':         function(v){ d.longDesc = v; },
      'f_sponsor':      function(v){ d.sponsor = v; },
      'f_startDate':    function(v){ d.startDate = v; },
      'f_startTime':    function(v){ d.startTime = v; },
      'f_endDate':      function(v){ d.endDate = v; },
      'f_endTime':      function(v){ d.endTime = v; },
      'f_roomArea':     function(v){ d.roomArea = v; },
      'f_expected':     function(v){ d.expectedGuests = v===''?null:Number(v); },
      'f_maxcap':       function(v){ d.maxCapacity = v===''?null:Number(v); },
      'f_featuredNote': function(v){ d.featuredNote = v; },
      'f_drinks':       function(v){ d.drinkSpecials = v; },
      'f_cover':        function(v){ d.coverCharge = v; },
      'f_minspend':     function(v){ d.minimumSpend = v===''?null:Number(v); },
      'f_depositAmount':function(v){ d.depositAmount = v===''?null:Number(v); },
      'f_bkOpen':       function(v){ d.bookingOpenDate = v; },
      'f_bkClose':      function(v){ d.bookingCloseDate = v; },
      'f_minGuests':    function(v){ d.minGuests = v===''?null:Number(v); },
      'f_maxGuests':    function(v){ d.maxGuests = v===''?null:Number(v); },
      'f_cancel':       function(v){ d.cancellationPolicy = v; },
      'f_sound':        function(v){ d.soundCheckTime = v; },
      'f_green':        function(v){ d.greenRoomNotes = v; }
    };
    Object.keys(map).forEach(function(id){
      var el = document.getElementById(id);
      if (!el) return;
      el.addEventListener('input', function(){
        map[id](el.value);
        state.dirty = true;
        paintHeader();
        if (id === 'f_name' || id === 'f_short') {
          var hero = els.scroll.querySelector('.hero');
          if (hero) {
            var tmp = document.createElement('div');
            tmp.innerHTML = renderHero();
            hero.replaceWith(tmp.firstElementChild);
          }
        }
      });
    });

    /* Selects */
    var selects = {
      'f_type':     function(v){ d.type = v; },
      'f_menuMode': function(v){ d.menuMode = v; },
      'f_bkMethod': function(v){ d.bookingMethod = v; }
    };
    Object.keys(selects).forEach(function(id){
      var el = document.getElementById(id);
      if (!el) return;
      el.addEventListener('change', function(){ selects[id](el.value); state.dirty = true; paintHeader(); });
    });

    /* Toggles */
    var toggles = {
      'f_recurring': function(el){ d.recurring = el.checked; render(); },
      'f_deposit':   function(el){ d.depositRequired = el.checked; render(); },
      'f_preorder':  function(el){ d.preorderEnabled = el.checked; state.dirty = true; },
      'f_sameDay':   function(el){ d.sameDayBooking = el.checked; state.dirty = true; },
      'f_tableReq':  function(el){ d.tableRequired = el.checked; state.dirty = true; }
    };
    Object.keys(toggles).forEach(function(id){
      var el = document.getElementById(id);
      if (!el) return;
      el.addEventListener('change', function(){ toggles[id](el); });
    });

    /* Supplier detail inputs */
    document.querySelectorAll('[data-sup]').forEach(function(el){
      var sid = el.getAttribute('data-sup');
      var key = el.getAttribute('data-key');
      var sup = d.suppliers.filter(function(s){ return s.id === sid; })[0];
      if (!sup) return;
      el.addEventListener('input', function(){
        if (key === 'cost') sup.cost = el.value === '' ? null : Number(el.value);
        else sup[key] = el.value;
        state.dirty = true;
        paintHeader();
        if (key === 'cost') {
          var lastStat = els.scroll.querySelector('.sup-summary .sup-stat:last-child b');
          if (lastStat) lastStat.textContent = money(supplierBudget());
        }
      });
      el.addEventListener('change', function(){
        if (key === 'status') sup.status = el.value;
        state.dirty = true;
      });
    });

    /* Autosave */
    clearInterval(autosaveTimer);
    autosaveTimer = setInterval(function(){ if (state.dirty) saveDraft(); }, 2500);
  }

  /* ============================================================
     ACTIONS
     ============================================================ */
  document.addEventListener('click', function(e){
    var t = e.target.closest('[data-act]');
    if (!t) return;
    var act = t.getAttribute('data-act');
    var d = state.draft;

    if (act === 'toggleStep') {
      var stepKey = t.getAttribute('data-step');
      state.openStep = (state.openStep === stepKey) ? null : stepKey;
      render();
      return;
    }

    if (act === 'toggleSupplierCat') {
      var cid = t.getAttribute('data-cat');
      state.openSupplierCat = (state.openSupplierCat === cid) ? null : cid;
      render();
      return;
    }

    if (act === 'toggleSupplier') {
      var catId = t.getAttribute('data-cat');
      var typeId = t.getAttribute('data-type');
      if (supplierFor(catId, typeId)) removeSupplierByType(catId, typeId);
      else addSupplier(catId, typeId);
      render();
      return;
    }

    if (act === 'addCustomSupplier') {
      openSheet('Custom supplier',
        '<div class="field"><label>Category</label><select id="__csCat">' +
          CATALOG.map(function(c){ return '<option value="' + c.id + '">' + esc(c.name) + '</option>'; }).join('') +
        '</select></div>' +
        '<div class="field"><label>Supplier name</label><input id="__csName" type="text" placeholder="Vendor name"></div>' +
        '<div class="field"><label>Contact</label><input id="__csContact" type="text" placeholder="+267 …"></div>' +
        '<div class="field"><label>Cost (BWP)</label><input id="__csCost" type="number" min="0" placeholder="0"></div>',
        function(scrim){
          var name = (scrim.querySelector('#__csName').value || '').trim();
          if (!name) { toast('Give the supplier a name'); return; }
          d.suppliers.push({
            id: uid('sup'),
            categoryId: scrim.querySelector('#__csCat').value,
            typeId: 'custom',
            name: name,
            contact: (scrim.querySelector('#__csContact').value || '').trim(),
            status: 'needed',
            cost: scrim.querySelector('#__csCost').value === '' ? null : Number(scrim.querySelector('#__csCost').value),
            notes: ''
          });
          scrim.remove();
          state.dirty = true;
          render();
        }, 'Add supplier');
      return;
    }

    if (act === 'pickCover') {
      openSheet('Cover image',
        '<div class="field"><label>Image URL</label><input id="__imgUrl" type="text" placeholder="https://… or assets/…"></div>' +
        '<div class="hint">Uploads to R2 are coming later. For now paste an image URL.</div>',
        function(scrim){
          var v = (scrim.querySelector('#__imgUrl').value || '').trim();
          if (v) { d.coverImage = v; state.dirty = true; }
          scrim.remove();
          render();
        }, 'Use this image');
      return;
    }

    if (act === 'toggleTheme') {
      var tv = t.getAttribute('data-val');
      var ti = d.themes.indexOf(tv);
      if (ti > -1) d.themes.splice(ti,1); else d.themes.push(tv);
      state.dirty = true;
      t.classList.toggle('on');
      return;
    }
    if (act === 'toggleRecur') {
      var rv = t.getAttribute('data-val');
      var ri = d.recurrence.indexOf(rv);
      if (ri > -1) d.recurrence.splice(ri,1); else d.recurrence.push(rv);
      state.dirty = true;
      t.classList.toggle('on');
      return;
    }
    if (act === 'toggleDietary') {
      var dv = t.getAttribute('data-val');
      var di = d.dietaryOptions.indexOf(dv);
      if (di > -1) d.dietaryOptions.splice(di,1); else d.dietaryOptions.push(dv);
      state.dirty = true;
      t.classList.toggle('on');
      return;
    }
    if (act === 'pickAge') {
      d.ageBracket = t.getAttribute('data-val');
      state.dirty = true;
      render();
      return;
    }

    if (act === 'addDish') {
      openSheet('Add featured dish',
        '<div class="field"><label>Dish name</label><input id="__dName" type="text" placeholder="e.g. TYG Taco Bowl"></div>' +
        '<div class="field"><label>Price (BWP, optional)</label><input id="__dPrice" type="number" min="0" placeholder="95"></div>',
        function(scrim){
          var n = (scrim.querySelector('#__dName').value || '').trim();
          if (!n) { toast('Give the dish a name'); return; }
          var p = scrim.querySelector('#__dPrice').value;
          d.dishes.push({ id: uid('dish'), name: n, price: p === '' ? null : Number(p) });
          scrim.remove();
          state.dirty = true;
          render();
        }, 'Add dish');
      return;
    }
    if (act === 'removeDish') {
      var ii = parseInt(t.getAttribute('data-i'),10);
      d.dishes.splice(ii,1);
      state.dirty = true;
      render();
      return;
    }

    if (act === 'applyTpl') {
      var k = t.getAttribute('data-tpl');
      var tpl = TEMPLATES[k];
      if (!tpl) return;
      /* keep user-typed name if they had one */
      var keepName = d.name;
      Object.assign(d, tpl.fill);
      if (!keepName) d.name = tpl.name;
      d.templateUsed = k;
      /* materialise supplier types */
      d.suppliers = [];
      (tpl.fill.supplierIds || []).forEach(function(tid){
        for (var i=0;i<CATALOG.length;i++){
          var cat = CATALOG[i];
          var found = cat.types.some(function(tt){ return tt.id === tid; });
          if (found) { addSupplier(cat.id, tid); break; }
        }
      });
      state.dirty = true;
      state.openStep = 'schedule';
      render();
      toast(tpl.name + ' loaded — ' + d.suppliers.length + ' supplier slots');
      return;
    }

    if (act === 'addPerf') {
      openSheet('Add performer',
        '<div class="field"><label>Stage name</label><input id="__pName" type="text" placeholder="DJ Kellz, Thato Band"></div>' +
        '<div class="field"><label>Set title / role</label><input id="__pRole" type="text" placeholder="Main set, Opening act, MC"></div>' +
        '<div class="field"><label>Start / end</label><div class="row">' +
          '<input id="__pStart" type="time"><input id="__pEnd" type="time">' +
        '</div></div>',
        function(scrim){
          var n = (scrim.querySelector('#__pName').value || '').trim();
          if (!n) { toast('Give the performer a name'); return; }
          d.performances.push({
            id: uid('perf'),
            stageName: n,
            setTitle: (scrim.querySelector('#__pRole').value || '').trim(),
            startTime: scrim.querySelector('#__pStart').value || '',
            endTime: scrim.querySelector('#__pEnd').value || ''
          });
          scrim.remove();
          state.dirty = true;
          render();
        }, 'Add performer');
      return;
    }
    if (act === 'removePerf') {
      d.performances.splice(parseInt(t.getAttribute('data-i'),10),1);
      state.dirty = true;
      render();
      return;
    }

    if (act === 'saveDraft') { saveDraft(); toast('Draft saved'); return; }

    if (act === 'resetDraft') {
      if (!confirm('Discard current draft and start fresh?')) return;
      state.draft = blankDraft();
      state.openStep = 'basics';
      state.openSupplierCat = null;
      saveDraft();
      render();
      toast('Starting fresh');
      return;
    }

    if (act === 'togglePublish') {
      if (d.status === 'published') {
        d.status = 'draft'; d.publishedAt = null;
        saveDraft(); render(); toast('Unpublished'); return;
      }
      if (!d.name) { toast('Give the event a name first'); return; }
      if (!d.startDate) { toast('Pick a start date'); return; }
      d.status = 'published';
      d.publishedAt = Date.now();
      saveDraft(); render();
      toast('Event published');
      return;
    }
  });

  /* ============================================================
     BOOT
     ============================================================ */
  function boot(){
    try {
      els.scroll = document.getElementById('scroll');
      els.bar    = document.getElementById('bar');
      els.hdr    = document.getElementById('hdrStatus');
      if (!els.scroll || !els.bar || !els.hdr) {
        throw new Error('Shell elements missing');
      }
      state.draft = loadDraft();
      render();
      window.addEventListener('beforeunload', function(){ clearInterval(autosaveTimer); });
    } catch(err) {
      console.error('[planner] boot failed', err);
      var s = document.getElementById('scroll');
      if (s) s.innerHTML =
        '<div style="padding:40px 20px;text-align:center;color:#c43c3c;font-size:13px;line-height:1.7">' +
          '<b>Planner failed to start.</b><br><br>' +
          esc(err && err.message || String(err)) +
          '<br><br>Press F12 for details.' +
        '</div>';
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
