<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EatOuts — About Guest Popup</title>
<!-- PAGE: About Guest Popup -->
<style>
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#f0ece2}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;color:#1a1a1a;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{cursor:pointer;border:0;background:none;font-family:inherit;font-size:inherit;color:inherit}
img{display:block;max-width:100%}
::-webkit-scrollbar{width:0;height:0;display:none}
*{scrollbar-width:none;-ms-overflow-style:none}

/* ───── Shell ───── */
#shell{position:fixed;inset:0;max-width:460px;margin:0 auto;display:flex;flex-direction:column;background:#fff;box-shadow:0 0 80px rgba(0,0,0,.08);overflow:hidden}
#hdr{flex:0 0 auto;height:58px;display:flex;align-items:center;gap:10px;padding:0 14px;background:#fff;border-bottom:1px solid #ece7db;position:relative;z-index:58}
#viewport{flex:1 1 auto;position:relative;overflow:hidden;background:#fff}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:#fff}
.scroll{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;background:#fff}
#nav{flex:0 0 auto;position:relative;display:flex;background:#0a0a0a;border-top:1px solid #1a1a1a;z-index:50}
.nav-btn{flex:1;padding:16px 2px 15px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.42)}
.nav-btn svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav-btn.on{color:#fff}
.brand-mark{display:flex;align-items:center;height:34px}
.brand-mark img{height:100%;width:auto;object-fit:contain}

/* ───── About page ───── */
.about-hero{padding:26px 18px 20px;background:#fff;border-bottom:1px solid #ece7db;text-align:center}
.about-logo{display:block;width:76%;max-width:290px;height:auto;max-height:150px;object-fit:contain;margin:0 auto 16px}
.about-hero p{margin:0;font-size:12px;color:#8a8170}
.pad{padding:14px}
.pcdivider{height:1px;background:rgba(0,0,0,.10);margin:18px 0}
.setlist{margin-top:20px;border-top:1px solid #f1ece1}
.setrow{display:block;width:100%;text-align:center;padding:14px;font-size:16px;font-weight:800;color:#1a1a1a;background:#fff;border-bottom:1px solid #f1ece1;font-family:inherit;cursor:pointer}
.setrow:active{background:#faf8f2}
.profilecard.guest{display:flex;align-items:center;justify-content:center;width:100%;padding:16px 20px;border:2px solid orange;border-radius:14px;background:orange;color:#fff;font:inherit;cursor:pointer;text-align:center}
.profilecard.guest strong{font-size:20px;font-weight:900;color:#fff}

/* ───── Popup foundation ───── */
.card-alert-scrim{position:fixed;inset:0;z-index:78;background:rgba(9,13,20,.55);backdrop-filter:blur(8px) saturate(1.1);-webkit-backdrop-filter:blur(8px) saturate(1.1);animation:cardScrimIn .18s ease}
@keyframes cardScrimIn{from{opacity:0}to{opacity:1}}
.card-alert{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:79;width:100%;max-width:340px;max-height:calc(100% - 40px);overflow-y:auto;background:#fff;border-radius:24px;padding:22px 22px 18px;text-align:center;box-shadow:0 28px 64px rgba(0,0,0,.34),0 2px 6px rgba(0,0,0,.08);animation:cardAlertIn .24s cubic-bezier(.34,1.56,.64,1)}
@keyframes cardAlertIn{from{opacity:0;transform:translate(-50%,-50%) scale(.92)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.card-alert-logo{width:240px;height:120px;max-width:100%;margin:0 auto 16px;display:block;object-fit:contain}
.card-alert h3{margin:0;font-size:18px;font-weight:800;color:#111827;line-height:1.25}
.card-alert p{margin:9px 0 0;font-size:14px;line-height:1.55;color:#6b7280}
.card-alert-options{margin-top:16px;display:flex;flex-direction:column;gap:8px}
.card-opt{width:100%;min-height:44px;display:flex;align-items:center;justify-content:center;border:1px solid #ece7db;border-radius:12px;background:#fff;font-size:14.5px;font-weight:600;color:#111827;cursor:pointer;font-family:inherit;transition:background .16s}
.card-opt:active{background:#faf8f2}
.card-alert-actions{margin-top:20px;display:flex;flex-direction:row;gap:8px}
.card-alert-actions .dlg-btn{flex:1 1 0;min-width:0;padding:0 8px;white-space:nowrap}
.dlg-btn{min-height:47px;border-radius:14px;border:1px solid #ece7db;background:#fff;font:inherit;font-size:15px;font-weight:600;color:#111827;cursor:pointer;text-decoration:none;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 12px}
.dlg-btn.primary{background:#e11d2e;border-color:#e11d2e;color:#fff;box-shadow:0 8px 18px rgba(225,29,46,.26)}
</style>
</head>
<body data-page="about-guest-popup">

<div id="shell">
  <header id="hdr"><div class="brand-mark"><img id="hdrLogo" alt="EatOuts"></div></header>
  <div id="viewport"></div>
  <nav id="nav"></nav>
</div>
<div id="popup-root"></div>

<script>
/* ───── Helpers ───── */
const LOGO_SVG='data:image/svg+xml;charset=utf-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 120"><text x="120" y="62" font-family="Arial Black, Arial, sans-serif" font-size="44" font-weight="900" text-anchor="middle" fill="#111">Eat<tspan fill="#e11d2e">Outs</tspan></text><text x="120" y="90" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#a89a7e" letter-spacing="3">DISCOVER BOTSWANA</text></svg>');

const NAV_ICONS={
  tag:'<svg viewBox="0 0 24 24"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>',
  shop:'<svg viewBox="0 0 24 24"><path d="M3 9l1.5-5h15L21 9"/><path d="M3 9v11a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V9"/><path d="M3 9h18"/></svg>',
  cal:'<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>',
  img:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>',
  info:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>'
};

const GUEST_FEATURES=[
  {id:'favourites',label:'Favourites',heading:'Everything you love, one tap away',copy:'Tap the heart on any dish, drink, promo or venue and it lands here — your personal shortlist of all the good stuff. Promos, restaurants, bottle stores and more, ready when you are.'},
  {id:'orders',label:'Orders',heading:'Your order history, sorted',copy:"Every order you've placed, neatly lined up with dates, totals and venues. Reorder a favourite in a tap, or look back at what hit the spot last time."},
  {id:'summaries',label:'Summaries',heading:'Saved totals, ready when you are',copy:"Building a menu or planning a get-together? Save the summary here and come back anytime — pick up where you left off, or share it with whoever's splitting the bill."},
  {id:'gallery',label:'Gallery',heading:'Your photos, all in one grid',copy:"Every EatOuts photo you've saved — dishes, venues, moments — gathered into a clean, scrollable grid. A little visual diary of your food adventures."}
];

const state={ cardAlert:null, guestFeature:null };

/* ───── Render Shell ───── */
function renderHeader(){document.getElementById('hdrLogo').src=LOGO_SVG;}
function renderNav(){
  document.getElementById('nav').innerHTML=['tag','shop','cal','img','info'].map((k,i)=>'<button class="nav-btn'+(i===4?' on':'')+'" aria-label="'+k+'">'+NAV_ICONS[k]+'</button>').join('');
}
function renderAboutPage(){
  let h='<div class="screen" data-page="about-main"><div class="scroll">';
  h+='<div class="about-hero"><img class="about-logo" src="'+LOGO_SVG+'" alt="EatOuts"><p>Discover restaurants, food, promos and events<br>across Botswana.</p></div>';
  h+='<div class="pad"><div class="pcdivider"></div>';
  h+='<button class="profilecard guest" data-act="openGuestPopup"><span><strong>Create Profile</strong></span></button>';
  h+='<div class="setlist"><button class="setrow">About EatOuts</button><button class="setrow">Install EatOuts</button><button class="setrow">Blog</button><button class="setrow">Terms of Service</button><button class="setrow">Privacy Policy</button></div>';
  h+='</div><div style="height:34px"></div></div></div>';
  return h;
}

/* ───── Popup Renders ───── */
function popupScrim(){return '<div class="card-alert-scrim" data-act="closePopup"></div>';}

function renderGuestMainPopup(){
  let h=popupScrim()+'<div class="card-alert" role="alertdialog" aria-modal="true">';
  h+='<img class="card-alert-logo" src="'+LOGO_SVG+'" alt="">';
  h+='<div class="card-alert-options">';
  GUEST_FEATURES.forEach(f=>{h+='<button class="card-opt" data-act="openGuestFeature" data-feature="'+f.id+'">'+f.label+'</button>';});
  h+='</div>';
  h+='<div class="card-alert-actions"><a class="dlg-btn primary" href="eatouts-login.html?next=about-profile-options.html">Sign In</a><a class="dlg-btn" href="eatouts-customer-signup.html">Sign Up</a><button class="dlg-btn" data-act="closePopup">Later</button></div>';
  h+='</div>';
  return h;
}

function renderGuestFeaturePopup(){
  const f=GUEST_FEATURES.find(x=>x.id===state.guestFeature);
  if(!f) return '';
  let h=popupScrim()+'<div class="card-alert" role="alertdialog" aria-modal="true">';
  h+='<img class="card-alert-logo" src="'+LOGO_SVG+'" alt="">';
  h+='<h3>'+f.heading+'</h3><p>'+f.copy+'</p>';
  h+='<div class="card-alert-actions"><button class="dlg-btn" data-act="backToGuestMain">Back</button><a class="dlg-btn primary" href="eatouts-customer-signup.html">Create Account</a></div>';
  h+='</div>';
  return h;
}

function renderPopup(){
  const root=document.getElementById('popup-root');
  if(!state.cardAlert){root.innerHTML='';return;}
  if(state.cardAlert==='guest-main'){root.innerHTML=renderGuestMainPopup();}
  if(state.cardAlert==='guest-feature'){root.innerHTML=renderGuestFeaturePopup();}
}

function render(){
  renderHeader();
  document.getElementById('viewport').innerHTML=renderAboutPage();
  renderNav();
  renderPopup();
}

/* ───── Events ───── */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  if(!t) return;
  const act=t.getAttribute('data-act');
  if(act==='openGuestPopup'){state.cardAlert='guest-main';state.guestFeature=null;renderPopup();return;}
  if(act==='openGuestFeature'){state.guestFeature=t.getAttribute('data-feature');state.cardAlert='guest-feature';renderPopup();return;}
  if(act==='backToGuestMain'){state.cardAlert='guest-main';state.guestFeature=null;renderPopup();return;}
  if(act==='demoSignIn'){return;} // Default link behavior
  if(act==='closePopup'){state.cardAlert=null;state.guestFeature=null;renderPopup();return;}
});

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'||e.keyCode===27){ if(state.cardAlert){state.cardAlert=null;state.guestFeature=null;renderPopup();} }
});

render();
</script>
</body>
</html>
