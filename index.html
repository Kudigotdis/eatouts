  if(!name) return null;
  if(state.splitPeople.some(function(p){return p.name.toLowerCase()===name.toLowerCase();})) return null;
  const id="p"+(++_splitSeq);
  state.splitPeople.push({id:id,name:name,color:SPLIT_COLORS[state.splitPeople.length%SPLIT_COLORS.length]});
  return id;
}
function removeSplitPerson(id){
  state.splitPeople=state.splitPeople.filter(function(p){return p.id!==id;});
  Object.keys(state.splitAssign).forEach(function(k){
    if(state.splitAssign[k]&&state.splitAssign[k][id]!==undefined) delete state.splitAssign[k][id];
  });
}
function splitQty(key,pid){const a=state.splitAssign[key];return (a&&a[pid])||0;}
function setSplitQty(key,pid,q){if(!state.splitAssign[key])state.splitAssign[key]={};state.splitAssign[key][pid]=Math.max(0,q|0);}
function lineAssignedQty(key){const a=state.splitAssign[key]||{};return Object.keys(a).reduce(function(s,p){return s+(a[p]||0);},0);}
function lineUnassignedQty(line){return Math.max(0,line.qty-lineAssignedQty(line.key));}
function lineUnitPrice(line){return line.qty>0?(line.total/line.qty):0;}
function personLines(pid){
  const out=[];
  checkoutLines().forEach(function(line){
    const q=splitQty(line.key,pid);
    if(!q) return;
    out.push({line:line,qty:q,subtotal:q*lineUnitPrice(line)});
  });
  return out;
}
function personTotal(pid){return personLines(pid).reduce(function(s,x){return s+x.subtotal;},0);}
function unassignedTotal(){return checkoutLines().reduce(function(s,line){return s+lineUnassignedQty(line)*lineUnitPrice(line);},0);}
function splitInUse(){return state.splitPeople.length>0;}
/* if a cart qty drops below what has been assigned, clamp first-come-first-served */
function normalizeSplitAssignments(){
  checkoutLines().forEach(function(line){
    const a=state.splitAssign[line.key];if(!a) return;
    let sum=0;state.splitPeople.forEach(function(p){sum+=(a[p.id]||0);});
    if(sum<=line.qty) return;
    let remaining=line.qty;
    state.splitPeople.forEach(function(p){
      const q=a[p.id]||0;if(!q) return;
      const take=Math.min(q,remaining);a[p.id]=take;remaining-=take;
    });
  });
}

/* ================================================================
   PROMO CATEGORIES — the Promos tab filters by one of four segments
   (All · Combos · Food · Beverages) plus an optional list of subtype
   checkboxes (cuisines for food, drink styles for beverages).
   Category: explicit `category` field wins, otherwise derived from
   the promo's own words. Subtypes: bar promos carry their own, food
   promos borrow the owning restaurant's cuisine types.
   ================================================================ */
const PROMO_CATEGORIES=[
  {id:"All",label:"All"},
  {id:"Combo",label:"Combos"},
  {id:"Food",label:"Food"},
  {id:"Beverage",label:"Beverages"}
];
function promoCategoryLabel(id){
  const c=PROMO_CATEGORIES.find(function(x){return x.id===id;});
  return c?c.label:String(id||"All");
}
function promoCategoryOf(p){
  const explicit=String((p&&p.category)||"").toLowerCase().trim();
  if(explicit.indexOf("bev")===0)return "Beverage";
  if(explicit.indexOf("comb")===0)return "Combo";
  if(explicit.indexOf("food")===0)return "Food";
  /* a bar promo keeps its drink style even when the category field was left off */
  if(!explicit&&p&&p.subtype)return "Beverage";
  const raw=String((p&&p.type)||"")+" "+String((p&&p.title)||"");
  /* "Platter Special Without Beer/Cider" is food, so drop negated spans */
  const text=raw.replace(/\bwithout\b[\s\S]*$/gi," ");
  const drink=/\b(beer|beers|lager|cider|ciders|wine|wines|spirit|spirits|vodka|gin|rum|whisk[ey]|champagne|mcc|cocktails?|mocktails?|bubbles|drinks?|beverages?|bottle|shooters?)\b/i.test(text);
  const food=/\b(food|meals?|pizza|pastas?|burgers?|wings?|platters?|steaks?|breakfast|brunch|curry|curries|dessert|rice|chicken|beef|braai|fries|lunch|dinner|roast|sushi|starters?)\b/i.test(text);
  if(drink&&food)return "Combo";
  if(drink)return "Beverage";
  return "Food";
}
/* Fixed tick vocabulary for the Beverages segment - the popup lists these
   in exactly this order. "Beverages" answers to every drink promo, the rest
   narrow it down, so the option list never drifts with the data. */
const BEV_TICK_OPTIONS=[
  "Beverages","Spirits","Beers","Brandy","Champagne","Ciders","Cold Drinks",
  "Red Wines","Fizzy Drinks","Fruit Juices","Gin","Tequila","Rum","Vodka"
];
/* drink words -> ticks. Umbrella tags (Spirits, Cold Drinks) keep broad
   taps forgiving: a gin promo answers to both "Gin" and "Spirits". */
const BEV_TICK_RULES=[
  [/\b(beers?|lagers?|budweiser|castle lite|heineken|st louis|black label|amstel)\b/i,["Beers"]],
  [/\bciders?\b/i,["Ciders"]],
  [/\b(champagne|mcc|prosecco|bubbles)\b/i,["Champagne"]],
  [/\b(brand(?:y|ie)s?|klipdrift|kwh|cognac|hennessy|remy martin)\b/i,["Brandy","Spirits"]],
  [/\btequilas?\b/i,["Tequila","Spirits"]],
  [/\bvodkas?\b/i,["Vodka","Spirits"]],
  [/\bgins?\b/i,["Gin","Spirits"]],
  [/\brums?\b/i,["Rum","Spirits"]],
  [/\b(whisk[ey]|single malts?|shooters?|spirits?|liqueurs?|amarula|jagermeister)\b/i,["Spirits"]],
  [/\b(wines?|merlot|cabernet|shiraz|pinot|chardonnay|sauvignon|roses?)\b/i,["Red Wines"]],
  [/\b(juices?|nectar)\b/i,["Fruit Juices","Cold Drinks"]],
  [/\b(fizzy|soda|cola|coca|coke|fanta|sprite|pepsi|minerals?)\b/i,["Fizzy Drinks","Cold Drinks"]],
  [/\b(cold drinks?|soft drinks?|iced teas?|energy|water)\b/i,["Cold Drinks"]]
];
function promoBevTags(p){
  const text=[String((p&&p.subtype)||""),String((p&&p.brand)||""),
    String((p&&p.type)||""),String((p&&p.title)||""),String((p&&p.desc)||""),
    (Array.isArray(p&&p.items)?p.items.map(function(it){return (it&&it.name)||"";}).join(" "):"")
  ].join(" ").toLowerCase();
  const tags=["Beverages"];
  for(let i=0;i<BEV_TICK_RULES.length;i++){
    if(!BEV_TICK_RULES[i][0].test(text))continue;
    BEV_TICK_RULES[i][1].forEach(function(t){if(tags.indexOf(t)<0)tags.push(t);});
  }
  return tags;
}
function promoSubtypeList(p,restaurant){
  const cat=promoCategoryOf(p);
  const out=[];
  if(cat==="Beverage"||cat==="Combo"){
    promoBevTags(p).forEach(function(t){if(out.indexOf(t)<0)out.push(t);});
  }
  if(cat==="Food"||cat==="Combo"){
    const types=(restaurant&&restaurant.types)||[];
    if(Array.isArray(types))types.forEach(function(t){
      t=String(t);if(t&&out.indexOf(t)<0)out.push(t);
    });
  }
  return out;
}
/* Loose match so a venue type like "Fast Food/Takeout" still answers to
   the catalog option "Fast Food". */
function normSubtype(s){
  return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"");
}
function subtypeMatches(list,selected){
  for(let i=0;i<list.length;i++){
    const a=normSubtype(list[i]);
    for(let j=0;j<selected.length;j++){
      const b=normSubtype(selected[j]);
      if(!a||!b)continue;
      if(a===b)return true;
      if(a.length>3&&b.length>3&&(a.indexOf(b)===0||b.indexOf(a)===0))return true;
    }
  }
  return false;
}
function promoPassesFilter(entry){
  const p=entry.promo;
  if(!p)return false;
  const cat=promoCategoryOf(p);
  if(state.promoType!=="All"&&cat!==state.promoType)return false;
  if(state.promoSubtypes.length){
    const list=promoSubtypeList(p,entry.restaurant);
    if(!subtypeMatches(list,state.promoSubtypes))return false;
  }
  return true;
}

/* pinned beverage promos jump to the top of the beverage block on a day */
const PINNED_BEV_PROMOS={Monday:["bevp-lipton-promo"]};
function allDayPromos(dayIdx){
  const dayName=DAY_NAMES[dayIdx];
  let out=[];
  if(hasBridge()){
    /* type/subtype filtering happens in promoPassesFilter, so the bridge
       is asked for the whole day and narrowed here */
    out=EatoutsBridge.promosForDay(dayIdx,state.promoTown,null,state.promoArea,state.promoDistrict,state.promoDistrictName);
    if(!out.length)out=(PROMOS[dayName]||[]).map(function(p){return {promo:p,day:dayName,restaurant:null};});
  }else{
    out=(PROMOS[dayName]||[]).map(function(p){return {promo:p,day:dayName,restaurant:null};});
  }
  const bev=beveragePromosOnDay(dayName);
  const pin=PINNED_BEV_PROMOS[dayName]||[];
  if(pin.length&&bev.length){
    const rank=function(e){const i=pin.indexOf(e.promo.id);return i<0?pin.length:i;};
    bev.sort(function(a,b){return rank(a)-rank(b);});   /* stable: keeps the rest in place */
  }

}

function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
function startOfWeek(d){
  const x=new Date(d);x.setHours(0,0,0,0);
  const day=x.getDay();
  const diff=(day===0?-6:1-day);
  x.setDate(x.getDate()+diff);
  return x;
}
function getWeekDays(){
  const monday=state.promoWeekStart||startOfWeek(new Date());
  const arr=[];
  for(let i=0;i<7;i++){const d=new Date(monday);d.setDate(monday.getDate()+i);arr.push(d);}
  return arr;
}
function weeksInMonth(year,monthIndex){
  const firstOfMonth=new Date(year,monthIndex,1);
  const lastOfMonth=new Date(year,monthIndex+1,0);
  const firstMonday=startOfWeek(firstOfMonth);
  const lastMonday=startOfWeek(lastOfMonth);
  const diff=Math.round((lastMonday-firstMonday)/(7*86400000));
  return diff+1;
}
function weekLabel(){
  const days=getWeekDays();
  const first=days[0];
  const anchor=state.promoMonth;
  const year=anchor?anchor.year:first.getFullYear();
  const monthIndex=anchor?anchor.monthIndex:first.getMonth();
  const month=new Date(year,monthIndex,1).toLocaleString("en",{month:"long"});
  const firstOfMonth=new Date(year,monthIndex,1);
  const firstMonday=startOfWeek(firstOfMonth);
  const diffDays=Math.round((first-firstMonday)/86400000);
  const totalWeeks=weeksInMonth(year,monthIndex);
  const weekNum=Math.max(1,Math.min(totalWeeks,Math.floor(diffDays/7)+1));
  return {month:month,monthIndex:monthIndex,year:year,weekNum:weekNum,totalWeeks:totalWeeks};
}
/* Keeps the displayed month in step with the week after week navigation:
   shift the anchor one month when promoWeekStart leaves its week range. */
function syncPromoMonth(){
  const monday=state.promoWeekStart||startOfWeek(new Date());
  const a=state.promoMonth;
  if(!a){state.promoMonth={year:monday.getFullYear(),monthIndex:monday.getMonth()};return;}
  const fm=startOfWeek(new Date(a.year,a.monthIndex,1));
  const last=addDays(fm,(weeksInMonth(a.year,a.monthIndex)-1)*7);
  if(monday<fm){
    const p=new Date(a.year,a.monthIndex-1,1);
    state.promoMonth={year:p.getFullYear(),monthIndex:p.getMonth()};
  }else if(monday>last){
    const n=new Date(a.year,a.monthIndex+1,1);
    state.promoMonth={year:n.getFullYear(),monthIndex:n.getMonth()};
  }
}

    '<button type="button" class="cal-title-btn" data-act="openWeekPicker">Week '+w.weekNum+'</button>'+
  '</div>';
}

/* Cart quantities are patched in place rather than re-rendered, so the
   scroll container, open accordions and focus all survive a +/- tap. */
function cartLineTotal(itemId,sizeIdx){
  const l=state.cart[cartKey(itemId,sizeIdx)];
  if(!l) return 0;
  const it=getMenuItem(itemId); if(!it) return 0;
  const sz=itemSizes(it)[sizeIdx]; if(!sz) return 0;
  let t=sz[1]*l.qty;
  Object.keys(l.extras||{}).forEach(ei=>{
    const ex=(it.extras||[])[ei];
    if(ex&&l.extras[ei]>0) t+=ex[1]*l.extras[ei];
  });
  return t;
}

function syncCart(){
  const vp=document.getElementById("viewport");
  if(!vp) return;

  Array.prototype.forEach.call(vp.querySelectorAll("[data-qkey]"),function(el){
    const p=el.getAttribute("data-qkey").split(":");
    const l=state.cart[cartKey(parseInt(p[0],10),parseInt(p[1],10))];
    el.textContent=(l&&l.qty)||0;
  });

  Array.prototype.forEach.call(vp.querySelectorAll("[data-ekey]"),function(el){
    /* menu keys are "id:ei" (size 0); checkout keys are "id:sizeIdx:ei" */
    const p=el.getAttribute("data-ekey").split(":");
    const itemId=parseInt(p[0],10);
    const si=p.length>2?parseInt(p[1],10):0;
    const ei=parseInt(p.length>2?p[2]:p[1],10);
    const l=state.cart[cartKey(itemId,si)];
    el.textContent=(l&&l.extras&&l.extras[ei])||0;
  });

  Array.prototype.forEach.call(vp.querySelectorAll("[data-itotal]"),function(el){
    const id=parseInt(el.getAttribute("data-itotal"),10);
    const tot=cartTotalForItem(id,0);
    const bar=el.closest?el.closest(".tbar"):null;
    if(bar) bar.style.display=tot>0?"":"none";
    el.textContent=fmt(tot);
  });

  Array.prototype.forEach.call(vp.querySelectorAll("[data-linetotal]"),function(el){
    const p=el.getAttribute("data-linetotal").split(":");
    el.textContent=fmt(cartLineTotal(parseInt(p[0],10),parseInt(p[1],10)));
  });

  Array.prototype.forEach.call(vp.querySelectorAll("[data-exsum]"),function(el){
    const p=el.getAttribute("data-exsum").split(":");
    const itemId=parseInt(p[0],10), si=parseInt(p[1],10), ei=parseInt(p[2],10);
    const l=state.cart[cartKey(itemId,si)];
    const it=getMenuItem(itemId);
    const ex=it&&(it.extras||[])[ei];
    const q=(l&&l.extras&&l.extras[ei])||0;
    const row=el.closest?el.closest(".co-exsum"):null;
    if(row) row.style.display=q>0?"":"none";
    el.textContent=q+" × "+((ex&&ex[0])||"")+"  "+fmt((ex?ex[1]:0)*q);
  });

  const n=cartCount(), tot=cartTotal();
  const cs=vp.querySelector("[data-cartcount]");
  if(cs) cs.textContent=fmt(tot)+" for "+n+" item"+(n===1?"":"s");
  Array.prototype.forEach.call(vp.querySelectorAll("[data-act='openCheckout']"),function(b){
    if(tot>0) b.removeAttribute("disabled"); else b.setAttribute("disabled","");
  });
  /* an emptied cart would leave stale checkout rows behind */
  if(state.checkoutView && n===0) render();
}

  if (window.RESTAURANT_TYPES_FILTER_DATA) {

    if(!data||!Array.isArray(data.filterGroups)){
      restaurantTypeLoadState="fallback";
      restaurantTypeDataRev++;
      console.warn("[EatOuts] Invalid restaurant type filter data");
      renderControlBar();
      return;
    }
    restaurantTypeFilterGroups=data.filterGroups;
    restaurantTypeLoadState="ready";
    restaurantTypeDataRev++;
    renderControlBar();
    return;
  }
  fetch("assets/data/restaurant_listings/restaurant_types_filter.json")
    .then(function(response){if(!response.ok)throw new Error("HTTP "+response.status);return response.json();})
    .then(function(data){
      if(!data||!Array.isArray(data.filterGroups))throw new Error("Invalid restaurant type filter data");
      restaurantTypeFilterGroups=data.filterGroups;
      restaurantTypeLoadState="ready";
      restaurantTypeDataRev++;
      renderControlBar();
    })
    .catch(function(error){
      restaurantTypeLoadState="fallback";
      restaurantTypeDataRev++;
      console.warn("[EatOuts] Restaurant type filters unavailable; using listing types",error);
      renderControlBar();
    });
}

/* ---------- promo subtype options ---------- */
/* Every promo the current town/area filter can reach, across the whole
   week. Built only while the type popup is open so the checkbox list
   stays stable as the day changes. */
function promoWeekEntries(){
  const out=[];
  for(let d=0;d<7;d++){
    const dayName=DAY_NAMES[d];
    let list=[];
    if(hasBridge()){
      list=EatoutsBridge.promosForDay(d,state.promoTown,null,state.promoArea,state.promoDistrict,state.promoDistrictName);
      if(!list.length)list=(PROMOS[dayName]||[]).map(function(p){return {promo:p,day:dayName,restaurant:null};});
    }else{
      list=(PROMOS[dayName]||[]).map(function(p){return {promo:p,day:dayName,restaurant:null};});
    }
    Array.prototype.push.apply(out,list.concat(beveragePromosOnDay(dayName)));
  }
  return out;
}
/* The restaurant cuisine catalog - the same source the Restaurants tab
   filter is built from. */
function promoCuisineOptions(){
  const out=[];
  if(Array.isArray(restaurantTypeFilterGroups)){
    restaurantTypeFilterGroups.forEach(function(group){
      if(String(group.name||"").toLowerCase().indexOf("cuisine")===-1)return;
      (group.subgroups||[]).forEach(function(subgroup){
        (subgroup.options||[]).forEach(function(option){out.push(String(option));});
      });
    });
  }
  return out;
}
/* Checkbox list for the open segment: cuisines for food/combos, drink
   styles for beverage, both for All. */
function promoSubtypeGroups(segment){
  const seg=segment||state.promoType;
  const wantCuisine=seg==="All"||seg==="Food"||seg==="Combo";
  const wantDrink=seg==="All"||seg==="Beverage";
  const cuisines={};
  if(wantCuisine){
    promoWeekEntries().forEach(function(entry){
      const cat=promoCategoryOf(entry.promo);
      if(cat!=="Food"&&cat!=="Combo")return;
      promoSubtypeList(entry.promo,entry.restaurant).forEach(function(label){
        if(label)cuisines[label]=1;
      });
    });
    promoCuisineOptions().forEach(function(label){cuisines[label]=1;});
  }
  const query=normalizeRestType(state.promoSubtypeSearch);
  const match=function(label){return !query||normalizeRestType(label).indexOf(query)>-1;};
  const groups=[];
  if(wantCuisine){
    const options=Object.keys(cuisines).filter(match).sort(function(a,b){return a.localeCompare(b);});
    if(options.length)groups.push({name:"Cuisines",options:options});
  }
  if(wantDrink){
    const options=BEV_TICK_OPTIONS.filter(match);
    if(options.length)groups.push({name:"Drinks",options:options});
  }
  return groups;
}
function promoSubtypeOptionCount(){
  let n=0;
  promoSubtypeGroups().forEach(function(g){n+=g.options.length;});
  return n;
}
/* One writer for the segment picker so taps, swipes and arrow keys all end
   up pruning ticks the same way. `close` shuts the popup (the All segment). */
function setPromoTypeSegment(seg,close){
  const prev=state.promoType;
  state.promoType=seg;
  state.promoSubtypeSearch="";
  if(seg==="All"){
    state.promoSubtypes=[];
  }else if(seg!==prev&&state.promoSubtypes.length){
    const keep={};
    promoSubtypeGroups(seg).forEach(function(g){g.options.forEach(function(o){keep[o]=1;});});
    state.promoSubtypes=state.promoSubtypes.filter(function(s){return !!keep[s];});
  }
  if(close){
    state.promoTypePicker=false;state.promoTownPicker=false;state.promoAreaPicker=false;
  }
  render();renderControlBar();
}
function cyclePromoType(dir){
  if(!state.promoTypePicker)return;
  const ids=PROMO_CATEGORIES.map(function(c){return c.id;});
  let i=ids.indexOf(state.promoType);
  if(i<0)i=0;
  setPromoTypeSegment(ids[(i+dir+ids.length)%ids.length],false);
}

/* ---------- Restaurants tab ---------- */
let _listingRev=null;
let _listingCache=null;
function allRestaurants(){
  const rev=dbEventRev+"|"+(DIRECTORY_LOADED?1:0);
  if(rev===_listingRev) return _listingCache;
  _listingRev=rev;
  _listingCache=hasBridge()?EatoutsBridge.groupedListing():[];
  return _listingCache;
}
function restaurantMatchesType(r,type){
  const selected=restTypeTokens(type).map(normalizeRestType);
  const types=(r.types&&r.types.length)?r.types:["Restaurant"];
  return types.some(function(value){
    return restTypeTokens(value).some(function(token){return selected.indexOf(normalizeRestType(token))>-1;});
  });
}
function branchMatchesLocation(b,town,district,districtName,area){
  const loc=b.location||{};
  if(town&&town!=="All"&&normalizeRestType(loc.town)!==normalizeRestType(town))return false;
  const recordDistrict=String(loc.district||loc.districtCode||"");
  if(district&&recordDistrict&&recordDistrict!==String(district)&&normalizeRestType(loc.districtName)!==normalizeRestType(districtName))return false;
  if(area&&area!=="All"&&normalizeRestType(loc.area)!==normalizeRestType(area))return false;
  return true;
}
function restaurantMatchesLocation(r,town,district,districtName,area){
  if(r&&r.branches&&r.branches.length)return r.branches.some(function(b){return branchMatchesLocation(b,town,district,districtName,area);});
  return branchMatchesLocation(r,town,district,districtName,area);
}
function groupBranches(r){
  return (r&&r.branches&&r.branches.length)?r.branches:[r];
}
function restaurantBaseRows(){
  let rows=allRestaurants();
  rows=rows.filter(function(r){
    if(r&&(r.status==="archived"||r.status==="rejected"||r.status==="hidden"))return false;
    return restaurantMatchesLocation(r,state.restTown,state.restDistrict,state.restDistrictName,state.restArea);
  });
  return rows;
}
/* A venue is "locked" while its EatOuts setup fee is unpaid: it stays
   discoverable but its menu/ordering are greyed until it goes live. */
function listingLocked(r){
  r=r||curRestaurant();
  if(!r)return false;
  return r.status==="pending_payment";
}
function listingContactNumber(r){
  r=r||curRestaurant();
  if(!r)return "";
  var n=(r.field&&r.field.contactNumber)||"";
  if(!n){try{n=resolveVenueWhatsapp(r);}catch(e){n="";}}
  return String(n||"").replace(/[^\d]/g,"");
}
/* PAGE: venue-locked — Menu (locked) */
function renderMenuLocked(r){

function filteredRestaurants(){
  const rows=restaurantBaseRows();
  if(!state.restTypes.length)return rows;
  return rows.filter(function(r){return state.restTypes.some(function(type){return restaurantMatchesType(r,type);});});
}
function restaurantCountByType(type,rows){
  return (rows||restaurantBaseRows()).filter(function(r){return restaurantMatchesType(r,type);}).length;
}
function restaurantNameMatches(r,q){
  if(!q)return true;
  const names=(r&&r.branchNames&&r.branchNames.length)?r.branchNames.join(" "):"";
  const places=(r&&r.branchLabels&&r.branchLabels.length)?r.branchLabels.join(" "):(r&&r.placeLabel||"");
  return (String(r.name||"")+" "+names+" "+places).toLowerCase().indexOf(q)>-1;
}
function restaurantCountAt(town,district,districtName,area){
  return allRestaurants().filter(function(r){
    if(!restaurantMatchesLocation(r,town,district,districtName,area))return false;
    return !state.restTypes.length||state.restTypes.some(function(type){return restaurantMatchesType(r,type);});
  }).length;
}
function restaurantTownOptions(){
  const locations=window.EatoutsLocations;
  const options=locations?locations.allTowns():[];
  const seen={};
  options.forEach(function(t){seen[normalizeRestType(t.value)+"|"+String(t.districtCode||"")]=true;});
  allRestaurants().forEach(function(r){
    (groupBranches(r)).forEach(function(b){
      const loc=b.location||{};
      const town=String(loc.town||"").trim();
      if(!town)return;
      const code=String(loc.district||loc.districtCode||"");
      const key=normalizeRestType(town)+"|"+code;
      if(seen[key])return;
      seen[key]=true;
      options.push({value:town,label:town,districtCode:code,districtName:loc.districtName||"Other / not listed",areaCount:0});
    });
  });
  return options;
}
function restaurantAreaOptions(){
  const locations=window.EatoutsLocations;
  const options=locations&&state.restTown!=="All"?locations.areas(state.restDistrict,state.restTown):[];
  const seen={};
  options.forEach(function(area){seen[normalizeRestType(area)]=area;});
  allRestaurants().forEach(function(r){
    (groupBranches(r)).forEach(function(b){
      const loc=b.location||{};
      if(normalizeRestType(loc.town)!==normalizeRestType(state.restTown))return;
      const area=String(loc.area||"").trim();
      if(area&&!seen[normalizeRestType(area)])seen[normalizeRestType(area)]=area;
    });
  });
  return Object.keys(seen).map(function(key){return seen[key];}).sort();
}
function restaurantTypeCatalog(){
  const seen={};
  const groups=[];
  function optionsFor(values){
    return (values||[]).filter(function(value){
      const label=String(value||"").trim();
      const key=normalizeRestType(label);
      if(!key||seen[key])return false;
      seen[key]=true;
      return true;
    }).map(function(value){return {name:String(value).trim()};});
  }
  restaurantTypeFilterGroups.forEach(function(group){
    const item={name:String(group.name||"Other types"),options:[],subgroups:[]};
    item.options=optionsFor(group.options);
    (group.subgroups||[]).forEach(function(subgroup){
      const subOptions=optionsFor(subgroup.options);
      if(subOptions.length)item.subgroups.push({name:String(subgroup.name||""),options:subOptions});
    });
    if(item.options.length||item.subgroups.length)groups.push(item);
  });
  const extras=[];
  const typeNames={};
  allRestaurants().forEach(function(r){
    (r.types&&r.types.length?r.types:["Restaurant"]).forEach(function(type){
      const label=String(type||"").trim();
      const key=normalizeRestType(label);
      if(!key||typeNames[key])return;
      typeNames[key]=label;
      if(!restTypeTokens(label).some(function(token){return seen[normalizeRestType(token)];}))extras.push(label);
    });
  });
  if(restaurantTypeLoadState!=="ready"){
    return [{name:restaurantTypeLoadState==="loading"?"Available types":"Listing types",options:optionsFor(Object.keys(typeNames).map(function(key){return typeNames[key];})),subgroups:[]}];
  }
  if(extras.length)groups.push({name:"Other listing types",options:optionsFor(extras),subgroups:[]});
  return groups;
}

function renderRestaurantTypePicker(){
  const query=normalizeRestType(state.restTypeSearch);
  const nameQuery=state.restTypeSearch.trim().toLowerCase();
  const nameRows=nameQuery?restaurantBaseRows().filter(function(r){return restaurantNameMatches(r,nameQuery);}):[];
  const activeRows=nameRows.length?nameRows:restaurantBaseRows();
  const groups=restaurantTypeCatalog();
  const baseRows=restaurantBaseRows();
  const optionVisible=function(group,subgroup,option){
    if(!nameQuery)return true;
    const groupMatch=query&&(normalizeRestType(group.name).indexOf(query)>-1||(subgroup&&normalizeRestType(subgroup.name).indexOf(query)>-1));
    const typeMatch=!query||groupMatch||normalizeRestType(option.name).indexOf(query)>-1;

    });
  }
  groups.forEach(function(group){
    const direct=(group.options||[]).filter(function(option){return optionVisible(group,null,option);});
    const nested=(group.subgroups||[]).map(function(subgroup){
      return {name:subgroup.name,options:subgroup.options.filter(function(option){return optionVisible(group,subgroup,option);})};
    }).filter(function(subgroup){return subgroup.options.length;});

    shown++;
    h+='<section><div class="rest-type-group-title">'+esc(group.name)+'</div>';

      subgroup.options.forEach(function(option){h+=renderRestaurantTypeOption(option,activeRows);});
    });
    h+='</section>';
  });
  if(!shown)h+='<div class="rest-type-empty">No matching types or restaurants</div>';
  if(restaurantTypeLoadState==="fallback")h+='<div class="rest-type-note">Taxonomy unavailable; showing types found in restaurant listings.</div>';
  h+='</div><div class="rest-type-footer"><button type="button" data-act="closeRestTypePicker">Cancel</button><button type="button" class="apply" data-act="applyRestTypeSelection">Apply</button></div></div>';
  return h;
}

/* ---------- beverage type picker (Drinks + Liquors, grouped) ---------- */
function bevTypeCatalog(){
  const B=window._BEV&&window._BEV.beverages;

/* Pinned to the top of the list, in this order. Matched on canonical slug
   (EatoutsBrand.canonicalKey), so Nando's -> nandos and zen-cafe-lounge ->
   zen-cafe match. The photo-menu brands come first (chicken-licken, hungry-lion,
   kfc, nandos, zen-cafe, the-yellow-giraffe, mozambik), then the other curated
   brands with both a logo and a menu. Drawn from the FILTERED rows so search
   and the cuisine filter still apply, then excluded from the tiers below (first
   venue per brand only). The tiers below are partitioned logo-first. */
const PINNED_REST_SLUGS=["chicken-licken","hungry-lion","kfc","nandos","zen-cafe","the-yellow-giraffe","mozambik","spur","rocomamas","pie-city","butter-chicken-indian-restaurant","the-game-reserve"];
function canonicalSlugKey(slug){
  const B=window.EatoutsBrand;
  return B&&typeof B.canonicalKey==="function"?B.canonicalKey(slug):slug;
}
/* Canonical brand key for a restaurant record (bridge owns the real
   grouping; this mirrors it so rendering works before the bridge is up). */
function brandKeyOf(r){
  if(!r)return null;
  if(window.EatoutsBridge&&typeof EatoutsBridge.brandKeyOf==="function")return EatoutsBridge.brandKeyOf(r);
  return canonicalSlugKey(r.slug);
}
/* Find the group descriptor for a brand from the deduplicated list. */
function brandGroupByKey(key){
  const all=allRestaurants();
  if(!all||!all.length)return null;
  for(let i=0;i<all.length;i++)if(all[i].brandKey===key)return all[i];
  return null;
}
/* The branch currently selected for a group: session choice wins, else
   the bridge default (Gaborone branch, else first). */
function activeBranchRecord(g){
  if(!g||!g.branches||!g.branches.length)return null;
  const sel=state.restBranchOf&&state.restBranchOf[g.brandKey];
  if(sel)for(let i=0;i<g.branches.length;i++)if(g.branches[i].id===sel)return g.branches[i];
  if(window.EatoutsBridge&&typeof EatoutsBridge.primaryBranch==="function"){
    const p=EatoutsBridge.primaryBranch(g.branches);
    if(p)return p;
  }
  return g.branches[0];
}
/* genuine logo test: the brand resolution (manifest -> record logo -> match)
   decides whether a venue counts as logo'd for ordering */
function usesGenuineLogo(r){
  if(!r) return false;
  const B=window.EatoutsBrand;
  if(!B||typeof B.logoFor!=="function") return !!(r.logo&&String(r.logo).indexOf("assets/logo")===0&&r.logo.indexOf("logo_placement_image")===-1);
  const p=B.logoFor(r);
  return !!p&&!B.isPlaceholderLogo(p);
}
const _restList={sig:null,html:null};
function renderRestaurants(){
  const rowsLen=filteredRestaurants().length;
  const allLen=allRestaurants().length;
  const sig=[dbEventRev,state.restTown,state.restDistrict,state.restDistrictName,state.restArea,
    state.restTypes.join("|"),state.restaurantOpen||"",rowsLen,allLen,
    JSON.stringify(state.restBranchOf),JSON.stringify(state.restLocPicker)].join("~");
  if(sig===_restList.sig) return _restList.html;
  _restList.sig=sig;
  _restList.html=buildRestaurantsHTML();
  return _restList.html;
}
function buildRestaurantsHTML(){
  const rows=filteredRestaurants();
  const now=Date.now();

  /* Flat single column: the pinned featured venues come first (drawn from the
     FILTERED rows so search and the cuisine filter still apply), then the
     remaining venues partitioned logo-first - venues with a real logo above
     the ones still on the placeholder. No section headers. Rows are already
     deduplicated to one per brand (groupedListing), so each brand renders
     once regardless of how many branches it has. */
  const pinned=[];
  const usedPinned={};
  rows.forEach(function(g){
    const key=g.brandKey||canonicalSlugKey(g.slug);
    if(PINNED_REST_SLUGS.indexOf(key)>-1&&!usedPinned[key]){pinned.push(g);usedPinned[key]=1;}
  });
  const rest=rows.filter(function(g){return !usedPinned[g.brandKey||canonicalSlugKey(g.slug)];});
  const withLogo=rest.filter(usesGenuineLogo);
  const withoutLogo=rest.filter(function(g){return !usesGenuineLogo(g);});

  let h='<div class="scroll">';

  if(!rows.length){
    h+='<div class="empty">No restaurants match your search.</div>';
    h+='</div>';
    return h;
  }

  pinned.forEach(function(g){ h+=restaurantItem(g,now); });
  withLogo.forEach(function(g){ h+=restaurantItem(g,now); });
  withoutLogo.forEach(function(g){ h+=restaurantItem(g,now); });

  h+='<div style="height:24px"></div></div>';
  return h;
}

const REST_PANELS=['food','catering','bakery','beverages'];
function restPanelFromScroll(pager){
  const pageW=pager.clientWidth||1;
  const at=pageW>0?(pager.scrollLeft/pageW):0;
  const i=Math.max(0,Math.min(REST_PANELS.length-1,Math.round(at)));

}
function syncBeveragesPanel(){
  const pager=document.getElementById('bev-pager');
  if(!pager) return;
  const panel=restPanelFromScroll(pager);
  if(panel!==state.restPanel){
    /* route through the existing crossfade; do NOT clear view state
       if the user was mid-scroll inside a sub-view (bottle menu, category) */
    if(state.bevView||state.bevCheckout){
      state.restPanel=panel;
      renderControlBar();
    }else{
      switchRestPanel(panel);
    }
  }
  const shellEl=document.getElementById('shell');
  if(shellEl) shellEl.classList.toggle('bev-panel', state.tab==='restaurants' && state.restPanel==='beverages' && !state.restaurantView && !state.bevView && !state.bevCheckout);
  const bar=pager.previousElementSibling;
  if(bar&&bar.classList&&bar.classList.contains('bev-toggle')){
    REST_PANELS.forEach(function(p){
      bar.classList.toggle(restPanelClass(p),state.restPanel===p);
    });
    Array.prototype.forEach.call(bar.querySelectorAll('.bev-toggle-btn'),function(b){
      const on=b.getAttribute('data-act')===restPanelAct(state.restPanel);
      b.classList.toggle('on',on);
      b.setAttribute('aria-selected',on?'true':'false');
    });
  }
}
function scrollToRestPanelPage(){
  try{
    const el=document.getElementById('bev-pager');
    if(!el) return;
    const i=REST_PANELS.indexOf(state.restPanel);
    el.scrollTo({left:Math.max(0,i)*el.clientWidth, behavior:'auto'});
  }catch(e){}

/* Restaurants <-> Catering <-> Beverages panel switch: crossfade instead of
   the harsh full-viewport re-render flash. View Transitions when available,
   a cloned overlay fade otherwise. */
let panelFade=false;
function reduceMotion(){return !!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches);}
function switchRestPanel(panel){
  loadBeverageData();
  const doChange=function(){
    panelFade=true;
    state.restPanel=panel;
    state.bevView=null;
    state.bevCheckout=false;
    render();
    panelFade=false;
  };
  if(document.startViewTransition&&!reduceMotion()){
    document.startViewTransition(doChange);
  }else{
    doChange();
  }
}

function renderCateringLocPicker(){
  const lp=state.cateringLocPicker;
  if(!lp)return "";
  const api=cateringAPI();
  const brand=api?api.get(lp.brand):null;
  if(!brand)return "";
  const active=cateringActiveBranch(brand);
  const axis=lp.axis;
  let h='<div class="fpop-scrim" data-act="closeCateringLocPicker"></div>';
  h+='<div class="fpop rest-loc-pop" role="listbox" aria-label="Choose '+(axis==="town"?"town":"area or neighbourhood")+'">';
  if(axis==="town"){
    const seen={};
    const towns=[];
    brand.branches.forEach(function(b){
      const t=String(b.town||"").trim();
      if(!t||seen[t.toLowerCase()])return;
      seen[t.toLowerCase()]=true;towns.push(t);
    });
    towns.sort(function(a,b){return a.localeCompare(b);});
    towns.forEach(function(t){
      const matches=brand.branches.filter(function(b){return String(b.town||"").trim().toLowerCase()===t.toLowerCase();});
      const target=matches[0];
      const selected=active&&String(active.town||"").trim().toLowerCase()===t.toLowerCase();
      h+='<button class="loc-town-main'+(selected?" on":"")+'" data-act="pickCateringBranch" data-id="'+esc(target.id)+'" data-brand="'+esc(brand.slug)+'" role="option" aria-selected="'+selected+'">'+
        '<span class="lbl">'+esc(t)+'</span>'+(matches.length>1?'<span class="loc-count">'+matches.length+'</span>':'')+
        '</button>';
    });
  }else{
    const activeTown=String((active&&active.town)||"").trim().toLowerCase();
    const seen={};
    const opts=[];
    brand.branches.forEach(function(b){
      if(activeTown&&String(b.town||"").trim().toLowerCase()!==activeTown)return;
      const area=String(b.area||"").trim();
      const town=String(b.town||"").trim();
      const key=(area+"|"+town).toLowerCase();
      if(seen[key])return;seen[key]=true;
      opts.push({b:b,label:area?(area+" · "+town):(town||"Other")});
    });
    opts.sort(function(a,b){return a.label.toLowerCase().localeCompare(b.label.toLowerCase());});
    opts.forEach(function(o){
      const selected=active&&active.id===o.b.id;
      h+='<button class="loc-area-option'+(selected?" on":"")+'" data-act="pickCateringBranch" data-id="'+esc(o.b.id)+'" data-brand="'+esc(brand.slug)+'" role="option" aria-selected="'+selected+'"><span>'+esc(o.label)+(o.b.address?'<span class="loc-sub">'+esc(o.b.address)+'</span>':'')+'</span></button>';
    });
  }
  return h+'</div>';

    const seen={};

      if(!t||seen[t.toLowerCase()])return;
      seen[t.toLowerCase()]=true;towns.push(t);
    });
    towns.sort(function(a,b){return a.localeCompare(b);});
    towns.forEach(function(t){
      const matches=brand.branches.filter(function(b){return String(b.town||"").trim().toLowerCase()===t.toLowerCase();});

      const key=(area+"|"+town).toLowerCase();
      if(seen[key])return;seen[key]=true;
      opts.push({b:b,label:area?(area+" · "+town):(town||"Other")});
    });
    opts.sort(function(a,b){return a.label.toLowerCase().localeCompare(b.label.toLowerCase());});

    });
  }
  return h+'</div>';
}

function bottleStoreCount(town,area){

function bottleAreasForTown(town){
  const api=bottleAPI();if(!api)return [];
  const seen={};const out=[];
  api.all().forEach(function(b){
    (b.branches||[]).forEach(function(s){
      if(town&&town!=="All"&&String(s.town||"").toLowerCase()!==String(town).toLowerCase())return;

      if(!a||seen[a.toLowerCase()])return;seen[a.toLowerCase()]=true;out.push(a);

/* Branch picker: the "exact places" a brand is at, opened from the two
   location filter buttons in the row's options panel. Town axis lists the
   brand's towns; area axis lists its area/neighbourhood combinations.
   Picking a row makes that branch active for this brand. */
function renderRestLocPicker(){
  const lp=state.restLocPicker;
  if(!lp)return "";
  const g=brandGroupByKey(lp.brand);
  if(!g)return "";
  const active=activeBranchRecord(g);
  const axis=lp.axis;
  let h='<div class="fpop-scrim" data-act="closeRestLocPicker"></div>';
  h+='<div class="fpop rest-loc-pop" role="listbox" aria-label="Choose '+(axis==="town"?"town":"area or neighbourhood")+'">';
  if(axis==="town"){
    const seenT={};
    const towns=[];
    g.branches.forEach(function(b){
      const t=String((b.location&&b.location.town)||"").trim();
      const code=String((b.location&&b.location.district)||"");
      const key=normalizeRestType(t)+"|"+code;
      if(!t||seenT[key])return;
      seenT[key]=true;
      towns.push({town:t,district:code});
    });
    towns.sort(function(a,b){return normalizeRestType(a.town).localeCompare(normalizeRestType(b.town));});
    towns.forEach(function(tp){
      const matches=g.branches.filter(function(b){return normalizeRestType((b.location&&b.location.town))===normalizeRestType(tp.town);});
      const target=matches[0];
      const names=[];
      matches.forEach(function(b){if(names.indexOf(b.name)===-1)names.push(b.name);});
      const selected=active&&normalizeRestType((active.location&&active.location.town))===normalizeRestType(tp.town);
      const label=tp.town;
      h+='<button class="loc-town-main'+(selected?" on":"")+'" data-act="pickRestBranch" data-id="'+esc(target.id)+'" data-brand="'+esc(g.brandKey)+'" role="option" aria-selected="'+selected+'">'+
        '<span class="lbl">'+esc(label)+'</span>'+(names.length>1?'<span class="loc-count">'+matches.length+'</span>':'')+
        '</button>';
    });
  }else{
    /* Area axis is scoped to the active town: pick a town first, then the
       neighbourhood within it. Falls back to all branches when no town. */
    const activeTown=String((active&&active.location&&active.location.town)||"").trim();
    const seenA={};
    const opts=[];
    g.branches.forEach(function(b){
      const loc=b.location||{};
      if(activeTown&&normalizeRestType(loc.town)!==normalizeRestType(activeTown))return;
      const area=String(loc.area||"").trim();
      const town=String(loc.town||"").trim();
      const key=normalizeRestType(area)+"|"+normalizeRestType(town);
      if(seenA[key])return;
      seenA[key]=true;
      opts.push({b:b,label:area?(area+" · "+town):(town||"Other")});
    });
    opts.sort(function(a,b){return normalizeRestType(a.label).localeCompare(normalizeRestType(b.label));});
    opts.forEach(function(o){
      const selected=active&&active.id===o.b.id;
      const nameTag=(o.b.name&&o.b.name!==g.name)?o.b.name+" · ":"";
      h+='<button class="loc-area-option'+(selected?" on":"")+'" data-act="pickRestBranch" data-id="'+esc(o.b.id)+'" data-brand="'+esc(g.brandKey)+'" role="option" aria-selected="'+selected+'"><span>'+esc(nameTag+o.label)+'</span></button>';
    });
  }
  return h+'</div>';
}

/* ---------- SOCIAL PLATFORMS ----------
   One place that knows which icon a platform uses and how to turn a
   stored value into a real link. Handles come in as bare text
   ("theyellowgiraffebw"), so each builder normalises first. */
const SOCIAL_ICON={
  instagram:"iconIG", facebook:"iconFB", whatsapp:"iconWA", tiktok:"iconTT",
  twitter:"iconX", youtube:"iconYT", website:"iconWeb", call:"iconCall", gps:"iconGPS"
};
const SOCIAL_OFF_ICON={
  instagram:"iconIGOff", facebook:"iconFBOff", whatsapp:"iconWAOff", tiktok:"iconTTOff",
  twitter:"iconXOff", youtube:"iconYTOff", website:"iconWebOff", call:"iconCallOff", gps:"iconGPSOff"
};
const SOCIAL_GRID=[
  {platform:"instagram"},
  {platform:"facebook"},
  {platform:"whatsapp"},
  {platform:"tiktok"},
  {platform:"twitter"},
  {platform:"youtube"},
  {platform:"website"},
  {platform:"call"},
  {platform:"gps"}
];
const SOCIAL_LABEL={
  instagram:"Instagram", facebook:"Facebook", whatsapp:"WhatsApp", tiktok:"TikTok",
  twitter:"X (Twitter)", youtube:"YouTube", website:"Website", call:"Call", gps:"Location"
};

function socialHandle(v){
  return String(v||"").trim().replace(/^https?:\/\//i,"").replace(/^www\./i,"").replace(/^@/,"").replace(/\/+$/,"");
}
/* value may already be a full URL; otherwise it is a handle for that platform */
function socialUrl(platform,value){
  const raw=String(value||"").trim();
  if(!raw) return "";
  if(/^(https?:|mailto:|tel:)/i.test(raw)) return raw;
  const h=socialHandle(raw);
  if(!h) return "";
  if(platform==="whatsapp") return "https://wa.me/"+h.replace(/\D/g,"");
  if(platform==="instagram") return "https://www.instagram.com/"+h+"/";
  if(platform==="facebook") return "https://www.facebook.com/"+h;
  if(platform==="tiktok") return "https://www.tiktok.com/@"+h;
  if(platform==="youtube") return "https://www.youtube.com/@"+h;
  if(platform==="twitter") return "https://x.com/"+h;
  if(platform==="call") return "tel:+"+h.replace(/\D/g,"");
  /* a bare word is not a host, so refuse to build a broken link */
  if(/\s/.test(h)||!/\.[a-z]{2,}/i.test(h)) return "";
  return "https://"+h;
}
/* no explicit platform field, so read it off the link itself */
function socialPlatformFromUrl(url){
  const u=String(url||"").toLowerCase();
  if(/^(tel:|call)/.test(u)) return "call";
  if(/(wa\.me|whatsapp)/.test(u)) return "whatsapp";
  if(/instagram\.com/.test(u)) return "instagram";
  if(/(facebook\.com|fb\.com)/.test(u)) return "facebook";
  if(/tiktok\.com/.test(u)) return "tiktok";
  if(/(youtube\.com|youtu\.be)/.test(u)) return "youtube";
  if(/(twitter\.com|x\.com)/.test(u)) return "twitter";
  if(/(maps\.app\.goo\.gl|google\.[a-z.]+\/maps|goo\.gl\/maps)/.test(u)) return "gps";
  return "website";
}
function socialImg(platform,label,on){
  const id=String(platform||"").toLowerCase().replace(/[^a-z]/g,"");
  const table=on?SOCIAL_ICON:SOCIAL_OFF_ICON;
  const key=(table[id]||SOCIAL_ICON[id]||SOCIAL_ICON.website)||"iconIG";
  return '<img src="'+IMG[key]+'" alt="'+esc(label||SOCIAL_LABEL[id]||"Link")+'">';
}
/* one grid slot: live anchor when a destination exists, otherwise the
   off-colour glyph, never a dead link */
function socialSlot(platform,url,label){
  const name=label||SOCIAL_LABEL[platform]||"Link";
  if(url){
    return '<a class="social-ico" href="'+esc(url)+'" target="_blank" rel="noopener noreferrer" aria-label="'+esc(name)+'">'+socialImg(platform,name,true)+'</a>';
  }
  return '<span class="social-ico off" role="img" aria-label="'+esc(name+" — contact unavailable")+'">'+socialImg(platform,name,false)+'</span>';
}
/* contact numbers live on the profile: prefer the primary one */
function restCallHref(profile){
  const list=(profile&&profile.contacts)||[];
  const usable=list.filter(function(c){return c&&c.number&&c.active!==false;});
  const pick=usable.filter(function(c){return c.primary;})[0]||usable[0];
  if(!pick) return "";
  return socialUrl("call",(pick.countryCode||"+267")+" "+pick.number);
}
function restSocialLinks(r){
  const out=[];
  const push=function(platform,value,label){
    const raw=String(value||"").trim();
    if(!raw) return;
    const key=String(platform||"").toLowerCase().replace(/[^a-z]/g,"");
    let id=SOCIAL_ICON[key]?key:null;
    /* a bare number with no platform field is a phone number, not a site */
    if(!id&&/^[+\d][\d\s()-]{6,}$/.test(raw)) id="call";
    const url=socialUrl(id||"",raw);
    if(!url) return;
    id=id||socialPlatformFromUrl(url);
    out.push({platform:id,url:url,label:label||SOCIAL_LABEL[id]||"Link"});
  };
  (r&&r.socials||[]).forEach(function(s){
    if(!s) return;
    if(typeof s==="string"){ push("",s,null); return; }
    if(typeof s!=="object") return;
    const url=s.url||s.link||s.href||null;
    if(url){ push(s.platform||s.network||s.type||"",url,s.label||s.handle||""); return; }
    /* keyed shape: one entry per platform, value is a handle or URL */
    Object.keys(s).forEach(function(k){
      if(k==="label"||k==="platform"||k==="network"||k==="type") return;
      push(k,s[k],typeof s[k]==="object"?(s[k]&&s[k].label):null);
    });
  });
  return out;
}

/* .fpop-scrim's clip-path needs the nav's height to stop the blur above it,
   but that height is not a constant: .nav-btn padding plus
   env(safe-area-inset-bottom) vary per device and change on rotation. So we
   measure it into --navh rather than hardcoding an inset. The observer also
   fires when the nav is hidden for operator sign-in, which is exactly when
   the scrim is not on screen anyway. */
function measureNav(){
  const nav=document.getElementById("nav");
  if(!nav) return;
  document.documentElement.style.setProperty("--navh",nav.offsetHeight+"px");
}
if(window.ResizeObserver){
  const navEl=document.getElementById("nav");
  if(navEl){
    new ResizeObserver(measureNav).observe(navEl);
  }
}

function renderViewport(){
  const vp=document.getElementById("viewport");
  /* remember where the user was before the DOM is replaced */
  const prevScrollers=vp.querySelectorAll(".scroll");
  const keepTops=Array.prototype.map.call(prevScrollers,function(s){return s.scrollTop;});
  const prevPager=vp.querySelector("#bev-pager");
  const keepPagerLeft=prevPager?prevPager.scrollLeft:-1;
  const prevScreen=vp.querySelector(".screen");
  const key=viewKey();
  const viewChanged=(key!==lastViewKey);
  lastViewKey=key;
  /* a panel switch crossfades: suppress the slide so the two don't fight */
  const doFade=panelFade&&!document.startViewTransition&&!reduceMotion();

  const screenHtml=renderScreen();
  const pageId=activePage||"";
  const pageTitle=PAGE_TITLES[pageId]||"";
  const pageIns=pageRef();
  vp.innerHTML='<div class="screen'+((viewChanged&&!panelFade)?" anim":"")+'" data-page="'+esc(pageId)+'" data-page-title="'+esc(pageTitle)+'" data-page-ref="'+esc(pageIns)+'">'+screenHtml+'</div>'+renderPreview()+renderRestLocPicker()+renderBottleLocPicker()+renderCateringLocPicker()+renderRestNotice()+renderCardAlert()+renderPromoMonthPicker()+renderPromoWeekPicker()+renderAboutPopup()+renderAboutPreview();
  if(document.body){ document.body.dataset.page=pageId; document.body.dataset.pageRef=pageIns; }
  if(doFade&&prevScreen){
    const old=prevScreen.cloneNode(true);
    old.classList.remove("anim");
    Array.prototype.forEach.call(old.querySelectorAll("[id]"),function(n){n.removeAttribute("id");});
    old.classList.add("panelfade-out");
    old.setAttribute("aria-hidden","true");
    vp.appendChild(old);
    setTimeout(function(){ if(old.parentNode) old.parentNode.removeChild(old); },320);
  }

  /* same view re-render -> put them back where they were */
  if(!viewChanged&&keepTops.length){
    const nextScrollers=vp.querySelectorAll(".scroll");
    Array.prototype.forEach.call(nextScrollers,function(s,i){
      if(keepTops[i]) s.scrollTop=keepTops[i];
    });
  }

  renderHeader();
  renderNav();
  renderControlBar();
  applyPromoFocus();
  const shellEl=document.getElementById("shell");
  if(shellEl) shellEl.classList.toggle("bev-panel", state.tab==="restaurants" && state.restPanel==="beverages" && !state.restaurantView && !state.bevView && !state.bevCheckout);
  if(shellEl) shellEl.classList.toggle("gal-photo", state.tab==="gallery" && state.galleryView==="photo");
  const pagerEl=document.getElementById("bev-pager");
  if(pagerEl){
    pagerEl.addEventListener("scroll",syncBeveragesPanel,{passive:true});
    scrollToRestPanelPage();
  }
  if(state.galleryView==="photo") scrollPhotoTo();
  scrollPromoPickerToActive();
}
/* Centres the active row of an open month/week picker so the current
   month (or week) is visible the moment the popup opens. */
function scrollPromoPickerToActive(){
  const vp=document.getElementById("viewport");
  if(!vp||(!state.promoMonthPicker&&!state.promoWeekPicker))return;
  const pop=vp.querySelector(state.promoMonthPicker?".fpop.month-pop":".fpop.week-pop");
  if(!pop)return;
  const row=pop.querySelector(state.promoMonthPicker?".month-row.on":".week-row.on");
  if(!row||!pop.clientHeight)return;
  pop.scrollTop=Math.max(0,row.offsetTop-(pop.clientHeight-row.offsetHeight)/2);
}

function renderPromosFeed(){
  /* the bar & bottle promos arrive with their own JSON, so ask for it
     before the feed is built */
  loadBeverageData();
  const days=getWeekDays();
  const dayIdx=state.promoDay;

  const dayPromos=promosOnDay(dayIdx);
  const dayEvents=eventsOnDay(dayIdx);
  const feat=featuredEventsForDay(dayIdx);

    let cal='<div class="cal">';
    cal+=renderCalTitle();
  cal+='<div class="cal-days">';
  days.forEach(function(d){
    const idx=d.getDay();
    const on=idx===dayIdx;
    const td=sameDay(d,new Date());
    cal+='<button class="day'+(on?" on":"")+(td?" td":"")+'" data-act="pickDay" data-day="'+idx+'" aria-label="'+DAY_NAMES[idx]+'">'+
      '<b>'+DAY_SHORT[idx]+'</b><span>'+d.getDate()+'</span></button>';
  });
  cal+='</div></div>';

  let body='<div class="scroll">';
  const matchingRestaurants=hasBridge()?EatoutsBridge.restaurantCountAt(promoLocation()):0;
  /* brand-led bar promos are not tied to a venue, so they survive a
     town filter that matches no restaurant */
  const hasBarPromos=!!beveragePromosOnDay(DAY_NAMES[dayIdx]).length;

  if(matchingRestaurants===0&&!hasBarPromos){
    body+='<div class="empty">No Foodies Here Sorry,</div>';
    body+='<div style="height:24px"></div></div>';
    return cal+body;
  }

  /* the weekday's featured events lead the feed (national listings, so
     they are not tied to the town filter) */
  feat.forEach(function(ev){ body+=renderFeaturedCard(ev); });

  dayEvents.forEach(function(x){ body+=renderEventCard(x.event,dayIdx,x.restaurant); });
  dayPromos.forEach(function(x,i){
    body+=renderPromoCard(x.promo,dayIdx,i,x.restaurant);
    if((i+1)%3===0) body+=signupBanner();
  });

  if(!dayPromos.length && !dayEvents.length && !feat.length){
    const filterBits=esc(state.promoTown)+
      (state.promoType!=='All'?' &middot; '+esc(promoCategoryLabel(state.promoType)):'')+
      (state.promoSubtypes.length?' &middot; '+esc(state.promoSubtypes.slice(0,3).join(", ")+(state.promoSubtypes.length>3?' +'+(state.promoSubtypes.length-3):'')):'');
    body+='<div class="empty">No promos for '+DAY_NAMES[dayIdx]+'<br>'+
            'in '+filterBits+'.<br><br>'+
            'Try a different day, town, or style.</div>';
  }
  body+='<div style="height:24px"></div></div>';
  return cal+body;
}

function promosCountForDate(d){
  const idx=d.getDay();
  const dayName=DAY_NAMES[idx];
  let count=0;
  if(hasBridge()){
    count+=EatoutsBridge.promosForDay(idx,state.promoTown,null,state.promoArea,state.promoDistrict,state.promoDistrictName).length;
  }else{
    count+=(PROMOS[dayName]||[]).length;
  }
  count+=beveragePromosOnDay(dayName).length;
  count+=featuredEventsForDay(idx).length;
  if(hasBridge()){
    count+=EatoutsBridge.eventsForDay(idx,state.promoTown,state.promoArea,state.promoDistrict,state.promoDistrictName).length;
  }else if(EVENTS[dayName]){
    count+=1;
  }
  return count;
}

function renderPromoWeekPicker(){
  if(!state.promoWeekPicker)return "";
  const w=weekLabel();
  const year=w.year,monthIndex=w.monthIndex;
  const firstOfMonth=new Date(year,monthIndex,1);
  const firstMonday=startOfWeek(firstOfMonth);
  const totalWeeks=w.totalWeeks;
  let h='<div class="fpop-scrim" data-act="closePromoWeekPicker"></div>';
  h+='<div class="fpop week-pop'+(state.promoWeekExpanded?' expanded-open':'')+'" role="dialog" aria-label="Choose week">';
  h+='<div class="month-year">'+esc(w.month)+' '+year+'</div>';
  for(let i=0;i<totalWeeks;i++){
    const weekNumber=i+1;
    const expanded=(state.promoWeekExpanded===weekNumber);
    const isCurrentWeek=(w.weekNum===weekNumber);
    h+='<button type="button" class="week-row'+(isCurrentWeek?' on':'')+(expanded?' expanded':'')+'" '+
       'data-act="toggleWeek" data-week="'+weekNumber+'" '+
       'aria-expanded="'+expanded+'" '+
       'aria-controls="week-'+weekNumber+'-days">'+
       '<span class="week-row-label">Week '+weekNumber+'</span>'+
       '</button>';
    h+='<div class="week-days" id="week-'+weekNumber+'-days" '+
       'style="max-height:'+(expanded?'400px':'0')+';opacity:'+(expanded?'1':'0')+'">';
    if(expanded){
      const monday=addDays(firstMonday,i*7);
      for(let di=0;di<7;di++){
        const day=addDays(monday,di);
        const dayName=DAY_NAMES[day.getDay()];
        const dayNum=day.getDate();
        const inMonth=(day.getMonth()===monthIndex);
        const count=promosCountForDate(day);
        const empty=(count===0);
        const wkIdx=PROMO_WEEK_ORDER.indexOf(state.promoDay);
        const isSelected=sameDay(day,getWeekDays()[wkIdx>=0?wkIdx:0]);
        h+='<button type="button" class="day-row'+
           (empty?' day-row-empty':'')+
           (isSelected?' on':'')+
           (inMonth?'':' day-row-out')+'" '+
           'data-act="pickDayFromWeek" data-week="'+weekNumber+'" data-offset="'+di+'" '+
           (empty?' aria-disabled="true"':'')+'>'+
           '<span class="day-row-name">'+esc(dayName.slice(0,3))+'</span>'+
           '<span class="day-row-num">'+dayNum+'</span>'+
           '<span class="day-row-count">'+(empty?'No promos':(count+(count===1?' promo':' promos'))) + '</span>'+
           '</button>';
      }
    }
    h+='</div>';
  }
  h+='</div>';
  return h;
}

   ================================================================ */
function loadBeverageData(){
  if(window._BEV){return Promise.resolve(window._BEV);}
  if(window._BEV_LOAD){return window._BEV_LOAD;}
  if(typeof fetch!=="function"){
    window._BEV={beverages:{items:[],subcats:[]},alcohols:{items:[],buckets:[]},promos:{promotions:[]}};
    window._BEV_LOAD=Promise.resolve(window._BEV);
    return window._BEV_LOAD;
  }
  window._BEV_LOAD=Promise.all([
    fetch('assets/data/beverages.json',{cache:'no-cache'}).then(function(r){return r.json();}).catch(function(){return {items:[],subcats:[]};}),
    fetch('assets/data/alcohols.json',{cache:'no-cache'}).then(function(r){return r.json();}).catch(function(){return {items:[],buckets:[]};}),
    fetch('assets/data/beverage-and-bar-promotions.json',{cache:'no-cache'}).then(function(r){return r.json();}).catch(function(){return {promotions:[]};})
  ]).then(function(a){
    window._BEV={beverages:a[0]||{items:[]},alcohols:a[1]||{items:[]},promos:a[2]||{promotions:[]}};
    return window._BEV;
  }).catch(function(){window._BEV={beverages:{items:[]},alcohols:{items:[]},promos:{promotions:[]}};return window._BEV;});
  window._BEV_LOAD.then(function(){
    try{
      if(typeof render==="function"&&((state.tab==="restaurants"&&state.restPanel==="beverages")||state.tab==="promos")) render();
    }catch(e){}
  });
  return window._BEV_LOAD;
}
function getBeverageCartKey(it){return 'bev:'+it.id;}
function bevCartCount(){
  let n=0; const c=state.bevCart; for(const k in c){n+=c[k].qty;}
  return n;
}
function formatBWP(n){
  if(n===null||n===undefined||isNaN(n)) return 'P0.00';
  return 'P'+Number(n).toFixed(2);
}
function bevPrice(it){
  const p=it&&it.price;
  if(typeof p==='number') return p;
  if(typeof p==='string') return parseFloat(p)||0;
  return 0;
}
function bevFindItem(id){
  const B=window._BEV&&window._BEV.beverages;
  const A=window._BEV&&window._BEV.alcohols;
  let list=(B&&B.items)||[];
  for(let i=0;i<list.length;i++) if(list[i].id===id) return list[i];
  list=(A&&A.items)||[];
  for(let i=0;i<list.length;i++) if(list[i].id===id) return list[i];
  return null;
}
function bevOrderText(){
  const c=state.bevCart;
  const keys=Object.keys(c);
  let out="EatOuts beverage order:\n";
  keys.forEach(function(k){
    const row=c[k];
    out+="• "+row.item.name+(row.item.size?" ("+row.item.size+")":"")+" × "+row.qty+" — "+formatBWP(bevPrice(row.item)*row.qty)+"\n";
  });
  out+="Total: "+formatBWP(bevCartTotal())+" ("+bevCartCount()+" items)\n";
  if(state.bevSplitPeople.length){
    out+="\nSplit:\n";
    state.bevSplitPeople.forEach(function(p){
      out+="• "+p.name+": "+formatBWP(bevPersonTotal(p.id))+"\n";
    });
    const un=bevUnassignedTotal();
    if(un>0.005)out+="• Unassigned: "+formatBWP(un)+"\n";
  }
  const dl=deliverySummaryLine();
  if(dl){
    const rc=(state.delivery&&state.delivery.recipient)||{};
    out+="\nDelivery: "+dl.label+(dl.area?" · "+dl.area:"")+" — "+formatBWP(dl.fee)+"\n";
    if(rc.name||rc.phone)out+="Recipient: "+[rc.name,rc.phone].filter(Boolean).join(" · ")+"\n";
    out+="Grand total: "+formatBWP(bevCartTotal()+dl.fee)+"\n";
  }
  return out.replace(/\n$/,"");
}

function bevLines(){
  const c=state.bevCart;const out=[];
  Object.keys(c).forEach(function(k){
    const it=c[k].item;const price=bevPrice(it);
    out.push({key:k,item:it,name:it.name,size:it.size||null,price:price,qty:c[k].qty,total:price*c[k].qty});
  });
  return out;
}
function bevAddSplitPerson(name){
  name=String(name||"").trim().slice(0,24);
  if(!name)return null;
  if(state.bevSplitPeople.some(function(p){return p.name.toLowerCase()===name.toLowerCase();}))return null;
  const id="p"+(++_splitSeq);
  state.bevSplitPeople.push({id:id,name:name,color:SPLIT_COLORS[state.bevSplitPeople.length%SPLIT_COLORS.length]});
  return id;
}
function bevRemoveSplitPerson(id){
  state.bevSplitPeople=state.bevSplitPeople.filter(function(p){return p.id!==id;});
  Object.keys(state.bevSplitAssign).forEach(function(k){
    if(state.bevSplitAssign[k]&&state.bevSplitAssign[k][id]!==undefined)delete state.bevSplitAssign[k][id];
  });
}
function bevSplitQty(key,pid){const a=state.bevSplitAssign[key];return (a&&a[pid])||0;}
function bevSetSplitQty(key,pid,q){if(!state.bevSplitAssign[key])state.bevSplitAssign[key]={};state.bevSplitAssign[key][pid]=Math.max(0,q|0);}
function bevLineAssignedQty(key){const a=state.bevSplitAssign[key]||{};return Object.keys(a).reduce(function(s,p){return s+(a[p]||0);},0);}
function bevPersonTotal(pid){
  return bevLines().reduce(function(s,l){return s+bevSplitQty(l.key,pid)*l.price;},0);
}
function bevUnassignedTotal(){
  return bevLines().reduce(function(s,l){return s+Math.max(0,l.qty-bevLineAssignedQty(l.key))*l.price;},0);
}
function bevSplitAssignedLines(pid){
  return bevLines().filter(function(l){return bevSplitQty(l.key,pid)>0;});
}
function bevNormalizeSplitAssign(){
  bevLines().forEach(function(line){
    const a=state.bevSplitAssign[line.key];if(!a)return;
    let sum=0;state.bevSplitPeople.forEach(function(p){sum+=(a[p.id]||0);});
    if(sum<=line.qty)return;
    let rem=line.qty;
    state.bevSplitPeople.forEach(function(p){
      const q=a[p.id]||0;if(!q)return;
      const take=Math.min(q,rem);a[p.id]=take;rem-=take;
    });
  });
}
function bevPersonMessage(p){
  let out="EatOuts beverage order - "+p.name+"'s share:\n";
  bevLines().forEach(function(l){
    const q=bevSplitQty(l.key,p.id);
    if(q>0)out+="• "+l.name+(l.size?" ("+l.size+")":"")+" × "+q+" — "+formatBWP(q*l.price)+"\n";
  });
  out+="Share total: "+formatBWP(bevPersonTotal(p.id))+"\nFull order total: "+formatBWP(bevCartTotal());
  return out;
}

function aboutHash(s){var h=0;var t=String(s||"");for(var i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))|0;return Math.abs(h);}
function aboutTile(emoji,seed){var c=ABOUT_PALETTES[aboutHash(seed||emoji)%ABOUT_PALETTES.length];return '<div class="about-tile" style="background:linear-gradient(135deg,'+c+')">'+emoji+'</div>';}
function aboutTypeEmoji(t){return {restaurant:"🍽",catering:"🍽",bottle_store:"🍷",promo:"🏷",beverage:"🥤",item:"🍽",menu:"🍽",gallery:"🖼",event:"🎵",venue:"🏟",supplier:"🤝"}[t]||"⭐";}
function aboutUser(){return (window.EatoutsCustomer&&EatoutsCustomer.getUser&&EatoutsCustomer.getUser())||null;}
function aboutFavList(){return (aboutUser()&&window.EatoutsCustomer&&EatoutsCustomer.favourites)?EatoutsCustomer.favourites.list():[];}
function aboutSummaryList(){return (aboutUser()&&window.EatoutsCustomer&&EatoutsCustomer.summaries)?EatoutsCustomer.summaries.list():[];}
function aboutUserPhoto(){var u=aboutUser();return state.profilePhoto||(u&&u.photoKey)||null;}
function aboutFmtDate(v){try{var d=new Date(v);if(isNaN(d.getTime()))return "";return d.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});}catch(e){return "";}}
function aboutFavImage(ref){return (typeof ref==="string"&&/\.(png|jpe?g|webp|gif|svg)$/i.test(ref))?ref:null;}

/* PAGE: venue-checkout — Checkout */
function renderCheckout(){
  clearEmptyCart();
  const lines=[];
  cartKeys().forEach(k=>{
    const l=state.cart[k];if(!l.qty&&!Object.keys(l.extras||{}).length)return;
    const it=getMenuItem(l.itemId);if(!it)return;
    const sz=itemSizes(it)[l.sizeIdx];
    lines.push({itemId:l.itemId,sizeIdx:l.sizeIdx,it:it,name:it.name,desc:it.desc,
      size:sz[0]||null,price:sz[1],qty:l.qty,extras:l.extras||{},hasEx:!!(it.extras&&it.extras.length)});
  });
  const total=cartTotal();
  const restName=curRestaurantName();
  let h='<div class="scroll">';
  h+='<div class="crumb"><button data-act="backFromCheckout">'+esc(restName)+'</button><span class="cur">Checkout</span></div>';
  h+='<div class="phead" style="padding-top:12px"><h2>Order Summary</h2><p>'+esc(restName)+' &middot; review your items and send your order via WhatsApp</p></div>';
  if(!lines.length){
    h+='<div class="empty">Your cart is empty.</div>';
    h+='<div class="pad"><button class="btn ghost full" data-act="backFromCheckout">Back</button></div>';
  } else {
    h+='<div class="pad" style="padding-top:12px">';
    lines.forEach(function(l){
      const key=l.itemId+":"+l.sizeIdx;
      const open=state.checkoutOpen===key;
      const exN=Object.keys(l.extras).filter(ei=>l.extras[ei]>0).length;
      h+='<div class="co-item">';
      h+='<div class="co-row">';
      h+='<button class="co-main" data-act="toggleCheckoutRow" data-key="'+key+'">'+
         '<div class="co-thumb">'+imgTag(menuPhoto(l.name,l.itemId-1),l.name)+'</div>'+
         '<div class="co-info">'+
           '<div class="co-name">'+esc(l.name)+(l.size?' <em>('+esc(l.size)+')</em>':'')+'</div>'+
           '<div class="co-sub">'+fmt(cartLineTotal(l.itemId,l.sizeIdx))+'</div>'+
           (exN?'<div class="co-meta">+ '+exN+' extra'+(exN===1?"":"s")+'</div>':'')+
         '</div><span class="co-edit">'+(open?"Close":"Details")+'</span></button>';
      h+='<div class="co-step"><div class="stp">'+
         '<button data-act="szMinus" data-id="'+l.itemId+'" data-si="'+l.sizeIdx+'">&minus;</button>'+
         '<span class="val" data-qkey="'+key+'">'+l.qty+'</span>'+
         '<button data-act="szPlus" data-id="'+l.itemId+'" data-si="'+l.sizeIdx+'">+</button></div></div>';
      h+='</div>';
      if(open){
        h+='<div class="co-open">';
        if(l.desc) h+='<p class="co-desc">'+esc(l.desc)+'</p>';
        if(l.hasEx){
          l.it.extras.forEach(function(ex,ei){
            const q=l.extras[ei]||0;
            h+='<div class="co-exsum" data-exsum="'+key+':'+ei+'"'+(q?"":" style=\"display:none\"")+'>'+q+' × '+esc(ex[0])+'  '+fmt(ex[1]*q)+'</div>';
            h+='<div class="co-ex"><div class="lbl" style="flex:1">'+esc(ex[0])+'<em>'+fmt(ex[1])+'</em></div>'+
               '<div class="stp">'+
               '<button data-act="exMinus" data-id="'+l.itemId+'" data-si="'+l.sizeIdx+'" data-ei="'+ei+'">&minus;</button>'+
               '<span class="val" data-ekey="'+key+':'+ei+'">'+q+'</span>'+
               '<button data-act="exPlus" data-id="'+l.itemId+'" data-si="'+l.sizeIdx+'" data-ei="'+ei+'">+</button></div></div>';
          });
        }
        h+='<div class="co-foot"><span>Item Total</span><b data-linetotal="'+key+'">'+fmt(cartLineTotal(l.itemId,l.sizeIdx))+'</b></div>';
        h+='</div>';
      }
      h+='</div>';
    });
    h+='</div>';
    const foodDelivery=deliverySummaryLine();
    h+='<div class="tbar" style="margin:12px 14px"><span class="tl">'+(foodDelivery?'Subtotal':'Total')+'</span><span class="tv">'+fmt(total)+'</span></div>';
    if(foodDelivery){
      h+='<div class="pad" style="padding-top:0"><div style="display:flex;justify-content:space-between;gap:10px;font-size:13px;font-weight:700;color:#8a8170"><span>Delivery · '+esc(foodDelivery.label)+(foodDelivery.area?' · '+esc(foodDelivery.area):'')+'</span><b style="color:#1a1a1a">'+fmt(foodDelivery.fee)+'</b></div></div>';
      h+='<div class="tbar" style="margin:0 14px 12px"><span class="tl">Grand Total</span><span class="tv">'+fmt(total+foodDelivery.fee)+'</span></div>';
    }
    /* split-the-bill entry point + a compact preview once names exist */
    h+='<div class="pad" style="padding-top:0">';
    if(state.splitPeople.length){
      h+='<div class="split-preview">';
      state.splitPeople.forEach(function(p){
        h+='<div class="sp-row"><span>'+esc(p.name)+'</span><b>'+fmt(personTotal(p.id))+'</b></div>';
      });
      const un=unassignedTotal();
      if(un>0.005) h+='<div class="sp-row muted"><span>Unassigned</span><b>'+fmt(un)+'</b></div>';
      h+='</div>';
    }
    h+='<button class="btn full" data-act="openSplit">Split the Bill'+
       (state.splitPeople.length?' <span style="color:#a89a7e;font-weight:700;margin-left:4px">· '+state.splitPeople.length+' '+(state.splitPeople.length===1?'person':'people')+'</span>':'')+
       '</button>';
    h+='</div>';
    h+='<div class="pad">';
    h+='<div class="fld"><label>Your Name</label><input id="orderName" type="text" placeholder="e.g. Kagiso M." value="'+esc(state.orderName)+'"></div>';
    h+='<div class="fld"><label>Contact Number</label><input id="orderContact" type="tel" placeholder="e.g. +267 71 234 567" value="'+esc(state.orderContact)+'"></div>';
    h+='<div class="fld"><label>Notes</label><textarea id="orderNotes" rows="3" placeholder="e.g. extra spicy, pickup time, table number">'+esc(state.orderNotes)+'</textarea></div>';
    h+='<button class="btn full" style="margin-bottom:9px" data-act="goDelivery">'+(foodDelivery?'Edit delivery':'Add Delivery Details')+'</button>';
    h+='<button class="btn ghost full" style="margin-bottom:9px" data-act="backFromCheckout">Back</button>';
    h+='<button class="btn wa full" data-act="waOrder">Send via WhatsApp</button>';
    h+='</div>';
  }
  h+='<div style="height:24px"></div></div>';
  return h;
}

function renderSplitLines(){
  const lines=checkoutLines();
  let h='<div class="subh">Items</div>';
  if(!state.splitPeople.length){
    h+='<div class="empty" style="padding:20px 8px">Add a person above to start splitting.<br>'+
       'Every item stays editable until you send.</div>';
    return h;
  }
  lines.forEach(function(line){
    const unit=lineUnitPrice(line);
    const un=lineUnassignedQty(line);
    h+='<div class="split-line">';
    h+='<div class="split-line-head">'+
       '<div class="split-line-name">'+line.qty+'× '+esc(line.name)+
       (line.size?' <em>('+esc(line.size)+')</em>':'')+'</div>'+
       '<div class="split-line-tot">'+fmt(line.total)+'</div></div>';
    const exBits=[];
    Object.keys(line.extras||{}).forEach(function(ei){
      const q=line.extras[ei];const ex=line.it.extras&&line.it.extras[ei];
      if(q>0&&ex) exBits.push(q+'× '+ex[0]);
    });
    if(exBits.length) h+='<div class="split-line-meta">+ '+esc(exBits.join(" · "))+'</div>';
    h+='<div class="split-line-unit">'+fmt(unit)+' each</div>';
    h+='<div class="split-line-rows">';
    state.splitPeople.forEach(function(p){
      const q=splitQty(line.key,p.id);
      h+='<div class="split-row">'+
         '<span class="split-dot" style="background:'+p.color+'"></span>'+
         '<span class="split-row-name">'+esc(p.name)+'</span>'+
         '<div class="stp">'+
           '<button data-act="splitMinus" data-key="'+esc(line.key)+'" data-pid="'+p.id+'"'+(q<=0?" disabled":"")+'>&minus;</button>'+
           '<span class="val" data-splitq="'+esc(line.key)+':'+p.id+'">'+q+'</span>'+
           '<button data-act="splitPlus" data-key="'+esc(line.key)+'" data-pid="'+p.id+'"'+(un<=0?" disabled":"")+'>+</button>'+
         '</div>'+
         '<span class="split-row-sub">'+fmt(q*unit)+'</span>'+
         '</div>';
    });
    h+='<div class="split-unrow'+(un?"":" zero")+'">'+
       '<span class="split-row-name">Unassigned</span>'+
       '<span class="split-row-sub">'+fmt(un*unit)+' <em>('+un+' of '+line.qty+')</em></span>'+
       '</div>';
    h+='</div></div>';
  });
  return h;
}

function buildFullBillMessage(){

  if(state.orderName.trim())    msg+="\nName: "+state.orderName.trim();
  if(state.orderContact.trim()) msg+="\nContact: "+state.orderContact.trim();
  if(state.orderNotes.trim())   msg+="\nNotes: "+state.orderNotes.trim();
  msg+="\n\n*Order Summary:*\n";
  lines.forEach(function(l){
    if(l.qty>0) msg+=l.qty+"x "+l.name+(l.size?" ("+l.size+")":"")+
      " @"+fmt(l.price)+" — "+fmt(l.price*l.qty)+"\n";
    Object.keys(l.extras||{}).forEach(function(ei){
      const q=l.extras[ei];const ex=l.it.extras&&l.it.extras[ei];
      if(q>0&&ex) msg+=" + "+q+"x "+ex[0]+" — "+fmt(ex[1]*q)+"\n";
    });
  });
  if(state.splitPeople.length){
    msg+="\n*Split:*\n";
    state.splitPeople.forEach(function(p){
      msg+=p.name+": "+fmt(personTotal(p.id))+"\n";
    });
    const un=unassignedTotal();
    if(un>0.005) msg+="Unassigned: "+fmt(un)+"\n";
  }
  const dl=deliverySummaryLine();
  if(dl){
    const dd=state.delivery||{};
    const rc=dd.recipient||{};
    msg+="\n*Delivery:*\n";
    msg+="Type: "+dl.label+"\n";
    if(dl.area) msg+="Area: "+dl.area+"\n";
    if(dd.date||dd.window) msg+="Window: "+[dd.date,dd.window].filter(Boolean).join(" · ")+"\n";
    if(dd.address&&dd.address.plot) msg+="Plot: "+dd.address.plot+"\n";
    if(dd.address&&dd.address.directions) msg+="Directions: "+dd.address.directions+"\n";
    if(rc.name||rc.phone) msg+="Recipient: "+[rc.name,rc.phone].filter(Boolean).join(" · ")+"\n";
    if(dd.payment) msg+="Payment: "+(dd.payment==="cash"?"Cash on Delivery":"Card on Delivery")+"\n";
    msg+="\n*Subtotal:* "+fmt(total);
    msg+="\n*Delivery fee:* "+fmt(dl.fee);
    msg+="\n*Total:* "+fmt(total+dl.fee);
  }else{
    msg+="\n*Total:* "+fmt(total);
  }
  return msg;
}
function buildPersonMessage(p){

/* Venue-provider ordering for the "Choose a venue" page: the named
   functional-menu brands lead in this exact order, then the rest are
   partitioned logo-first - venues with a genuine logo above the ones
   still on the placeholder. Matched on the canonical brand key. */
const PINNED_VENUE_PROVIDER_KEYS=["mozambik","zen-cafe","pie-city","nandos","the-yellow-giraffe","kfc","chicken-licken","hungry-lion"];
function orderVenueProviders(list){
  const keyOf=function(p){return String((p&&(p.key||p.brandKey))||"");};
  const pinned=[];
  const used={};
  PINNED_VENUE_PROVIDER_KEYS.forEach(function(k){
    for(let i=0;i<list.length;i++){
      if(!used[i]&&keyOf(list[i])===k){pinned.push(list[i]);used[i]=1;break;}
    }
  });
  const rest=list.filter(function(_,i){return !used[i];});
  const withLogo=rest.filter(usesGenuineLogo);
  const withoutLogo=rest.filter(function(p){return !usesGenuineLogo(p);});
  return pinned.concat(withLogo,withoutLogo);
}

/* ================================================================
   A–Z JUMP RAIL for the town pickers
   Each open .fpop.town-pop gets a 26-letter rail down its right edge.
   Tapping / dragging the rail scrolls the inner .town-scroll; a scroll
   spy keeps the active letter lit and a floating bubble shows the letter
   under the finger. Re-armed after every render (fresh DOM each time).
   ================================================================ */
function armTownRails(){
  const pops=document.querySelectorAll(".fpop.town-pop");
  Array.prototype.forEach.call(pops,function(pop){
    if(pop.getAttribute("data-az-armed"))return;
    const scroll=pop.querySelector(".town-scroll");
    const rail=pop.querySelector(".az-rail");
    const bubble=pop.querySelector(".az-bubble");
    if(!scroll||!rail||!bubble)return;
    pop.setAttribute("data-az-armed","1");

    const ALPHABET="ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
    const letters=[];
    ALPHABET.forEach(function(L){
      const b=document.createElement("button");
      b.type="button";
      b.className="az-letter";
      b.setAttribute("data-letter",L);
      b.setAttribute("aria-label","Jump to "+L);
      b.textContent=L;
      rail.appendChild(b);
      letters.push(b);
    });

    function itemLabel(btn){
      const l=btn.querySelector(".lbl");
      return String((l&&l.textContent)||btn.textContent||"").trim();
    }

    const items=Array.prototype.slice.call(scroll.querySelectorAll("button")).filter(function(b){
      return !b.classList.contains("loc-all");
    });

    const available={};
    items.forEach(function(b){
      const L=itemLabel(b).charAt(0).toUpperCase();
      if(/^[A-Z]$/.test(L)){b.setAttribute("data-letter",L);available[L]=true;}
    });
    letters.forEach(function(b){
      if(!available[b.getAttribute("data-letter")]){
        b.classList.add("empty");
        b.setAttribute("aria-disabled","true");
      }
    });

    let offsets=[];
    function computeOffsets(){
      const listRect=scroll.getBoundingClientRect();
      const seen={};
      offsets=[];
      items.forEach(function(t){
        const L=t.getAttribute("data-letter");
        if(!L||seen[L])return;
        seen[L]=true;
        offsets.push({letter:L,top:t.getBoundingClientRect().top-listRect.top+scroll.scrollTop});
      });
    }
    function jumpTo(L,smooth){
      for(let i=0;i<offsets.length;i++){
        if(offsets[i].letter===L){
          scroll.scrollTo({top:Math.max(0,offsets[i].top-4),behavior:smooth?"smooth":"auto"});
          return;
        }
      }
    }

    let activeLetter=null,ticking=false;
    function updateActive(){
      ticking=false;
      const y=scroll.scrollTop+6;
      let current=null;
      for(let i=0;i<offsets.length;i++){
        if(offsets[i].top<=y)current=offsets[i].letter;else break;
      }
      if(current===activeLetter)return;
      activeLetter=current;
      letters.forEach(function(b){b.classList.toggle("active",b.getAttribute("data-letter")===current);});
    }
    scroll.addEventListener("scroll",function(){
      if(!ticking){ticking=true;requestAnimationFrame(updateActive);}
    },{passive:true});

    let dragging=false,lastDragLetter=null;
    function letterFromClientY(clientY){
      const first=letters[0];
      if(!first)return null;
      const rect=first.getBoundingClientRect();
      if(rect.height<=0)return null;
      let i=Math.floor((clientY-rect.top)/rect.height);
      i=Math.max(0,Math.min(letters.length-1,i));
      return letters[i];
    }
    function showBubble(t){bubble.textContent=t;bubble.classList.add("show");}
    function hideBubble(){bubble.classList.remove("show");}
    function handleDrag(clientY){
      const el=letterFromClientY(clientY);
      if(!el||el.classList.contains("empty"))return;
      const L=el.getAttribute("data-letter");
      if(L===lastDragLetter)return;
      lastDragLetter=L;showBubble(L);jumpTo(L,false);
    }
    rail.addEventListener("pointerdown",function(e){
      if(e.button!==undefined&&e.button!==0)return;
      dragging=true;lastDragLetter=null;
      try{rail.setPointerCapture(e.pointerId);}catch(err){}
      handleDrag(e.clientY);
    });
    rail.addEventListener("pointermove",function(e){
      if(!dragging)return;e.preventDefault();handleDrag(e.clientY);
    });
    function endDrag(e){
      if(!dragging)return;dragging=false;lastDragLetter=null;hideBubble();
      try{rail.releasePointerCapture(e.pointerId);}catch(err){}
    }
    rail.addEventListener("pointerup",endDrag);
    rail.addEventListener("pointercancel",endDrag);
    rail.addEventListener("click",function(e){
      const b=e.target.closest?e.target.closest(".az-letter"):null;
      if(!b||b.classList.contains("empty"))return;
      jumpTo(b.getAttribute("data-letter"),true);
    });

    computeOffsets();
    updateActive();
    if(window.ResizeObserver){new ResizeObserver(function(){computeOffsets();}).observe(scroll);}
  });
}
