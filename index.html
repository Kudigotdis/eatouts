document.addEventListener("click",function(e){
  /* Header logo returns to the Promos home, resetting any open popup / filter. */
  const homeTap=e.target.closest(".brand-mark");
  if(homeTap){
    state.promoTownPicker=state.promoAreaPicker=state.promoTypePicker=false;
    state.promoFilterOpen=state.bevFilterOpen=state.restFilterOpen=false;
    if(!(state.tab==="promos" && state.promoView==="feed" && !state.promoId && !state.promoGalleryId && !state.promoExpanded)){
      state.tab="promos"; state.promoView="feed";
      state.promoId=null; state.promoGalleryId=null; state.promoExpanded=null;
      state.restPanel="food"; state.operatorView="about"; state.preview=null;
      try{history.replaceState(null,"","#promos");}catch(e){}
      render();
      return;
    }
    renderControlBar();
    return;
  }
  const nav=e.target.closest("[data-tab]");
  if(nav){
    const nextTab=nav.getAttribute("data-tab");
    /* tapping Promos again while on Promos shows/hides the promo filter bar */
    if(nextTab==="promos" && state.tab==="promos"){
      state.promoFilterOpen=!state.promoFilterOpen;
      if(!state.promoFilterOpen){state.promoTownPicker=false;state.promoAreaPicker=false;state.promoTypePicker=false;}
      /* only the filter bar changes here - a full render() was flashing the
         whole promo feed just to toggle one CSS class */
      renderControlBar();return;
    }
    /* same deal on Restaurants, but only from the list itself - inside a
       restaurant sub-view the tap means "take me back to the list".
       On the Beverages panel the same tap toggles the beverage filter bar. */
    if(nextTab==="restaurants" && state.tab==="restaurants" && !state.restaurantView){
      if(state.restPanel==="beverages" && !state.bevView && !state.bevCheckout){
        state.bevFilterOpen=!state.bevFilterOpen;
        if(!state.bevFilterOpen){
          state.bevTypePicker=false;state.restTownPicker=false;state.restAreaPicker=false;
          state.bottleTownFilter=false;state.bottleAreaFilter=false;
        }
      }else{
        state.restFilterOpen=!state.restFilterOpen;
        if(!state.restFilterOpen){state.filterOpen=false;}
      }
      renderControlBar();return;
    }
    state.tab=nextTab;
    state.restPanel='food';
    state.bevView=null;
    state.bevCheckout=false;
    resetBevSplit();
    state.promoFilterOpen=false;
    state.operatorView="about";
    state.preview=null;
    state.about=null;state.aboutFeature=null;state.aboutPreview=null;state.cardAlert=null;
    if(state.tab==="promos"){state.promoView="feed";state.promoId=null;state.promoGalleryId=null;state.promoExpanded=null;}
    if(state.tab==="menu"){state.menuCat=null;state.menuOpen=null;state.checkoutView=false;state.splitOpen=false;}
    if(state.tab==="restaurants"){
      /* always land back on the list, and hide the filter bar again.
         The cuisine choice and search text are kept deliberately. */
      state.restaurantView=null;state.restaurantOpen=null;state.restFilterOpen=false;state.restLocPicker=null;state.restNotice=null;
      state.menuCat=null;state.menuOpen=null;
      state.splitOpen=false;state.splitPeople=[];state.splitAssign={};
    }
    if(state.tab==="reserve"){
      state.reserveCat=null;state.reserveGroup=null;state.reserveSub=null;
      state.reserveVenueTown="All";state.reserveVenueQuery="";
      state.reserveVenueTownPicker=false;
    }
    if(state.tab==="gallery"){state.galleryView="grid";state.galleryPhoto=null;state.filterOpen=false;state.searchOpen=false;}
    if(state.tab==="about"){state.aboutView="main";}
    render();
    return;
  }
  /* Photo preview: tapping a menu item's thumbnail or a strip photo opens
     a large view of that image instead of toggling the row. */
  const menuThumb=e.target.closest(".mthumb")||e.target.closest(".th");
  if(menuThumb){
    const img=menuThumb.querySelector("img");
    if(img&&img.src){
      const mitem=menuThumb.closest(".mitem");
      const nameEl=mitem?mitem.querySelector(".mtitle"):null;
      state.preview={src:img.src,name:nameEl?nameEl.textContent:""};
      render();
      return;
    }
  }
  /* Restaurant logo preview: only when the venue has a real logo image;
     letter-tile venues fall through to the normal row toggle. */
  const restThumb=e.target.closest(".rthumb");
  if(restThumb){
    const img=restThumb.querySelector("img");
    if(img&&img.src){
      const row=restThumb.closest(".rrow");
      const nameEl=row?row.querySelector(".rname"):null;
      state.preview={src:img.src,name:nameEl?nameEl.textContent:""};
      render();
      return;
    }
  }
  /* Restaurant-Card logo preview (top of the Menu views): tap the 90px
     logo to view it large on the blurred backdrop. */
  const cardThumb=e.target.closest(".restcard-thumb");
  if(cardThumb){
    const img=cardThumb.querySelector("img");
    if(img&&img.src){
      const main=cardThumb.parentNode?cardThumb.parentNode.querySelector(".restcard-name"):null;
      state.preview={src:img.src,name:main?main.textContent:""};
      render();
      return;
    }
  }

  const t=e.target.closest("[data-act]");
  if(!t)return;
  const act=t.getAttribute("data-act");
  const id=t.getAttribute("data-id");

  /* A card row that is disabled until a location is chosen: open the alert,
     which offers a primary button that jumps straight into the picker. */
  if(t.getAttribute("data-locked")==="1"){
    state.cardAlert={
      icon:"!",
      title:t.getAttribute("data-lock-title")||"",
      message:t.getAttribute("data-lock-msg")||"",
      act:t.getAttribute("data-lock-act")||"",
      label:t.getAttribute("data-lock-label")||"Continue",
      brand:t.getAttribute("data-brand")||"",
      axis:t.getAttribute("data-lock-axis")||"town"
    };
    render();return;
  }
  if(act==="dismissCardAlert"){state.cardAlert=null;render();return;}

  /* Close the photo preview; tapping the image itself stays inert */
  if(act==="closePreview"){if(e.target.closest(".preview-img"))return;state.preview=null;render();return;}

  /* CUSTOMER FAVOURITES */
  if(act==="toggleFav"){toggleFav(t);return;}

  /* SAVE SUMMARY (black/white button on restaurant / bottle / promo views) */

  if(act==="galLocMode"){

  if(act==="pickGalRest"){

  if(act==="openSearch"){state.searchOpen=true;render();setTimeout(function(){const i=document.getElementById("gsearch");if(i)i.focus();},60);return;}

  if(act==="backAboutGallery"){state.aboutView="main";render();return;}
  if(act==="toggleAboutSettings"){state.aboutSettingsOpen=!state.aboutSettingsOpen;if(!state.aboutSettingsOpen)state.aboutListOpen=false;syncAboutAccordions();return;}

  /* TERMS / PRIVACY */
  if(act==="openTerms"){state.legalView="terms";render();return;}
  if(act==="openPrivacy"){state.legalView="privacy";render();return;}
  if(act==="backLegal"){state.legalView=null;render();return;}

  /* OPERATOR LOGIN */
  if(act==="openOperatorLogin"){
    if(state.tab!=="about"){state.tab="about";state.aboutView="main";}
    state.operatorView="login";render();return;

  if(act==="backFromOperatorLogin"){state.operatorView="about";state.aboutView="main";render();return;}
  if(act==="openUniversalLogin"){location.href="eatouts-login.html";return;}
  if(act==="doOperatorLogin"){
    const wEl=document.getElementById("opWhats"), pEl=document.getElementById("opPass");

    setTimeout(function(){
      EatoutsAuth.login(whats,pass).then(function(res){
        if(res.ok){location.href=(res.user&&EatoutsAuth.routeFor)?EatoutsAuth.routeFor(res.user):"operator-dashboard1.html";return;}
        show(res.message||"Sign-in failed.");
        if(pEl){pEl.value="";pEl.focus();}
      }).catch(function(){show("Sign-in failed. Check the console.");});
    },30);
    return;
  }
  if(act==="doOperatorDemo"){
    if(!window.EatoutsAuth){alert("Sign-in is unavailable.");return;}
    EatoutsAuth.loginDemo().then(function(res){
      if(res.ok){location.href=(res.user&&EatoutsAuth.routeFor)?EatoutsAuth.routeFor(res.user):"operator-dashboard1.html";return;}
      alert(res.message||"Demo login failed.");
    });
    return;

  if(act==="waAbout"){
    const msg="*INQUIRY — EatOuts*\n\nHi! I'd like to know more about EatOuts and the venues available.";
    window.location.href=waLink(msg);
    return;
  }
});

/* Escape closes the filter popup */
document.addEventListener("keydown",function(e){
  if(e.key==="Enter" && e.target && e.target.id==="bevSplitNewName"){
    e.preventDefault();
    const name=e.target.value;
    if(!String(name).trim()) return;
    bevAddSplitPerson(name);
    state.bevSplitNewName="";
    render();
    setTimeout(function(){const i=document.getElementById("bevSplitNewName");if(i)i.focus();},40);
    return;
  }
  if(e.key==="Enter" && e.target && e.target.id==="splitNewName"){
    e.preventDefault();
    const name=e.target.value;
    if(!String(name).trim()) return;
    addSplitPerson(name);
    state.splitNewName="";
    render();
    setTimeout(function(){const i=document.getElementById("splitNewName");if(i)i.focus();},40);
    return;
  }
  if(state.promoTypePicker&&e.target.tagName!=="INPUT"&&
     (e.key==="ArrowRight"||e.key==="ArrowLeft"||e.keyCode===37||e.keyCode===39)){
    e.preventDefault();
    cyclePromoType((e.key==="ArrowLeft"||e.keyCode===37)?-1:1);
    return;
  }
  if(e.key==="Escape"||e.keyCode===27){
    if(state.aboutPreview){state.aboutPreview=null;render();}
    else if(state.about){aboutBack();}
    else if(state.promoMonthPicker){state.promoMonthPicker=false;render();}
    else if(state.promoWeekPicker){state.promoWeekPicker=false;state.promoWeekExpanded=null;render();}
    else if(state.preview){state.preview=null;render();}
    else if(state.restLocPicker){state.restLocPicker=null;render();}
    else if(state.restNotice){state.restNotice=null;render();}
    else if(state.restTownPicker||state.restAreaPicker||state.restTypePicker){
      state.restTownPicker=false;state.restAreaPicker=false;state.restTypePicker=false;
      state.restTypeDraft=state.restTypes.slice();state.restTypeSearch="";renderControlBar();
    }
    else if(state.galPopup){state.galPopup=false;renderControlBar();}
    else if(state.filterOpen){state.filterOpen=false;renderControlBar();}
    else if(state.searchOpen){state.searchOpen=false;state.gallerySearch="";render();}
  }
});

/* Swipe across the promo type popup to move between the four segments.
   Horizontal only - a vertical drag keeps scrolling the tick list. */
(function(){
  let origin=null;
  const SWIPE=44;
  document.addEventListener("pointerdown",function(e){
    origin=null;
    if(!state.promoTypePicker)return;
    const pop=e.target&&e.target.closest?e.target.closest(".fpop.type-pop"):null;
    if(!pop)return;
    origin={x:e.clientX,y:e.clientY};
  },true);
  document.addEventListener("pointermove",function(e){
    if(!origin)return;
    const dx=e.clientX-origin.x,dy=e.clientY-origin.y;
    if(Math.abs(dx)<SWIPE||Math.abs(dx)<Math.abs(dy)*1.4)return;
    origin=null;
    cyclePromoType(dx<0?1:-1);
  },{passive:true});
  ["pointerup","pointercancel","pointerleave"].forEach(function(ev){
    document.addEventListener(ev,function(){origin=null;},true);
  });
})();

/* --------------------------------------------------------------
   Promos feed: swipe left/right to walk the days of the week.
   Not triggered by touches on the header, the bottom nav, the
   calendar strip itself, or any open popup.
   -------------------------------------------------------------- */
const PROMO_WEEK_ORDER=[1,2,3,4,5,6,0];
function stepPromoDay(dir){
  let idx=PROMO_WEEK_ORDER.indexOf(state.promoDay);
  if(idx<0)idx=0;
  let next=idx+dir;
  if(next>6){
    state.promoWeekStart=addDays(state.promoWeekStart||startOfWeek(new Date()),7);
    next=0;
  }else if(next<0){
    state.promoWeekStart=addDays(state.promoWeekStart||startOfWeek(new Date()),-7);
    next=6;
  }
  state.promoDay=PROMO_WEEK_ORDER[next];
  state.promoExpanded=null;
  syncPromoMonth();
  render();
}
(function(){
  let origin=null;
  const SWIPE=50;
  const H_RATIO=1.4;
  function allowed(e){
    if(state.tab!=="promos")return false;
    if(state.promoView!=="feed")return false;
    if(state.promoExpanded)return false;
    if(state.promoTypePicker||state.promoTownPicker||state.promoAreaPicker)return false;
    if(state.promoMonthPicker||state.promoWeekPicker)return false;
    if(e.target.closest&&e.target.closest("#hdr, #nav, .cal, .cal-days, .fpop, .fpop-scrim, .preview-layer"))return false;
    return true;
  }
  document.addEventListener("pointerdown",function(e){
    origin=null;
    if(!allowed(e))return;
    origin={x:e.clientX,y:e.clientY};
  },true);
  document.addEventListener("pointermove",function(e){
    if(!origin)return;
    const dx=e.clientX-origin.x;
    const dy=e.clientY-origin.y;
    if(Math.abs(dx)<SWIPE)return;
    if(Math.abs(dx)<Math.abs(dy)*H_RATIO)return;
    origin=null;
    stepPromoDay(dx<0?1:-1);
  },{passive:true});
  ["pointerup","pointercancel","pointerleave"].forEach(function(ev){
    document.addEventListener(ev,function(){origin=null;},true);
  });
})();

  if(e.target.matches("[data-rest-type-option]")){
    const value=e.target.value;

    if(!e.target.checked&&selected)state.restTypeDraft=state.restTypeDraft.filter(function(type){return type!==value;});
    renderControlBar();
    Array.prototype.forEach.call(document.querySelectorAll("[data-rest-type-option]"),function(input){if(input.value===value)input.focus();});
    return;
  }
  if(e.target.matches("[data-bev-type-option]")){
    const value=e.target.value;
    const selected=state.bevTypeDraft.indexOf(value)>-1;
    if(e.target.checked&&!selected)state.bevTypeDraft.push(value);
    if(!e.target.checked&&selected)state.bevTypeDraft=state.bevTypeDraft.filter(function(type){return type!==value;});
    renderControlBar();
    Array.prototype.forEach.call(document.querySelectorAll("[data-bev-type-option]"),function(input){if(input.value===value)input.focus();});
    return;

  if(e.target.matches("[data-promo-subtype]")){
    const value=e.target.value;

    if(e.target.checked&&!selected)state.promoSubtypes.push(value);
    if(!e.target.checked&&selected)state.promoSubtypes=state.promoSubtypes.filter(function(style){return style!==value;});
    render();
    renderControlBar();
    Array.prototype.forEach.call(document.querySelectorAll("[data-promo-subtype]"),function(input){if(input.value===value)input.focus();});
    return;
  }
});

/* Swiper dot indicator (vertical paging) */
document.addEventListener("scroll",function(e){
  const sw=e.target.closest?e.target.closest(".swiper"):null;
  if(!sw)return;
  const idx=Math.round(sw.scrollTop/sw.clientHeight);
  const parent=sw.parentElement;
  if(!parent)return;
  const dots=parent.querySelectorAll(".dots i");
  dots.forEach((d,i)=>d.classList.toggle("on",i===idx));
},true);

/* Connectivity chip — shown only when offline */
const netChip=document.querySelector(".hdr-chip");

window.addEventListener("online",refreshNetChip);
window.addEventListener("offline",refreshNetChip);
refreshNetChip();

/* Profile photo picker: preview locally, then upload to media storage. */
document.addEventListener("change",function(e){
  if(!e.target||e.target.id!=="pcFile")return;
  const file=e.target.files&&e.target.files[0];
  if(!file)return;
  const s=window.EatoutsCustomer;
  const done=function(val){
    state.profilePhoto=val;
    try{
      if(s&&s.state&&s.state.user){s.state.user.photoKey=val;}
      if(s&&s.updateProfile){s.updateProfile({photoKey:val});}
    }catch(err){}
    render();
  };
  const reader=new FileReader();
  reader.onload=function(){
    done(reader.result);
    /* Upgrade the local preview to a hosted URL when the backend is reachable. */
    if(s&&s.uploadPhoto){
      s.uploadPhoto(file).then(function(url){if(url)done(url);}).catch(function(){});
    }
  };
  reader.readAsDataURL(file);
});

/* Boot */
bootEatoutsBridge();
/* Deep-link a tab from the URL hash (e.g. index.html#reserve), used by the
   standalone pages that link back here. */
try{
  const hashTab=(window.location.hash||"").replace(/^#\/?/,"").toLowerCase();
  if(NAV_TABS.some(function(t){return t.id===hashTab;})) state.tab=hashTab;
  /* Deep-link straight into a venue's Menu/Promos from a standalone page
     (venue-about.html emits index.html#<slug>/menu or #<slug>/promos). */
  const hashParts=hashTab.split("/");
  if(hashParts.length>1&&(hashParts[1]==="menu"||hashParts[1]==="promos")&&hasBridge()){
    const canonKey=function(s){const B=window.EatoutsBrand;return (B&&B.canonicalKey)?B.canonicalKey(s):String(s||"").toLowerCase().replace(/[^a-z0-9]+/g,"");};
    const want=canonKey(hashParts[0]);
    const list=(EatoutsBridge.all&&EatoutsBridge.all())||[];
    const r=list.filter(function(x){return canonKey(x.slug)===want||canonKey(x.id)===want;})[0];
    if(r){
      const brand=(EatoutsBridge.brandKeyOf)?EatoutsBridge.brandKeyOf(r):(r.slug||r.id);
      state.tab="restaurants";state.restPanel="food";
      state.restaurantOpen=brand;
      state.restaurantView={id:r.id,brand:brand,view:hashParts[1],promoId:null};
      state.menuCat=null;state.menuOpen=null;state.checkoutView=false;state.splitOpen=false;
      state.splitPeople=[];state.splitAssign={};state.restLocPicker=null;state.restNotice=null;state.delivery=null;
      if(EatoutsBridge.setActive)EatoutsBridge.setActive(r.id);
    }
  }
  /* Deep-link straight back to a venue-provider list (e.g. from the event
     builder's "Back to Venues") by restoring the reserve breadcrumb. */
  const resEvent=(new URLSearchParams(window.location.search||"")).get("resEvent");
  if(resEvent){
    for(let i=0;i<RESERVE.length;i++){
      const cat=RESERVE[i];
      for(let j=0;j<cat.groups.length;j++){
        const grp=cat.groups[j];
        for(let k=0;k<grp.events.length;k++){
          if(grp.events[k].id===resEvent){
            state.tab="reserve";
            state.reserveCat=cat.id;
            state.reserveGroup=grp.name;
            state.reserveSub=grp.events[k].id;
          }
        }
      }
    }
  }
  /* Returning from customer-delivery.html (its total bar links back here
     with ?resume=1): rebuild the in-memory checkout from the shared key. */
  const resume=(new URLSearchParams(window.location.search||"")).get("resume");
  if(resume) restoreOrder();
}catch(e){}
/* Customer session probe: prefers the server (cookie) session, falls back to
   the local store. Keeps the header/profile UI in sync after sign-in. */
if(window.EatoutsCustomer){
  EatoutsCustomer.onChange(function(){ try{ render(); }catch(e){} });
  EatoutsCustomer.refresh().then(function(){ try{ render(); }catch(e){} }).catch(function(){});
}
/* Public business link: www.eatouts.online/bw/<businessname> opens that
   business. The edge function leaves a <meta name="eatouts-vanity">
   hint; on the mirror / shared ?link=<slug> we resolve via the API. */
function openVanityTarget(t){
  if(!t)return false;
  if(t.redirect){window.location.replace("/"+(t.country||"bw")+"/"+t.slug);return true;}
  if(t.type==="restaurant"){
    const r=hasBridge()?EatoutsBridge.byId(t.refId):null;
    if(!r)return false;
    const brand=(hasBridge()&&EatoutsBridge.brandKeyOf)?EatoutsBridge.brandKeyOf(r):(r.slug||t.refId);
    state.tab="restaurants";state.restPanel="food";
    state.restaurantOpen=brand;
    state.restaurantView={id:r.id,brand:brand,view:"menu",promoId:null};
    state.checkoutView=false;state.splitOpen=false;state.splitPeople=[];state.splitAssign={};
    if(hasBridge())EatoutsBridge.setActive(r.id);
    return true;
  }
  if(t.type==="bottle_store"){
    state.tab="restaurants";state.restPanel="beverages";
    state.bevView=null;state.bevCheckout=false;state.bottleOpen=t.refId;
    return true;
  }
  if(t.type==="supplier"){
    window.location.replace("eatouts-suppliers.html?link="+encodeURIComponent(t.slug));
    return true;
  }
  return false;
}
try{
  if(window.EatoutsRouter){
    const vt=EatoutsRouter.detect();
    if(vt){
      if(vt.needsResolve){
        EatoutsRouter.resolve(vt).then(function(t){
          if(t&&openVanityTarget(t)){try{render();}catch(e){}}
          else if(t&&t.redirect){}
        }).catch(function(){});
      } else {
        openVanityTarget(vt);
      }
    }
  }
}catch(e){}
openVenueFromSlug(readVenueMeta());
render();
loadRestaurantTypeFilters();
loadDirectoryMenus(function(){
  if((new URLSearchParams(window.location.search||"")).get("resume")) restoreOrder();
  render();
  /* Canonical public content: hydrate the venue that booted open (if any)
     from D1, then re-render once server content lands. Best-effort — an
     unreachable backend leaves the local/imported path untouched. */
  if(state.restaurantView&&state.restaurantView.id) hydrateVenueContent(state.restaurantView.id);
});
window.addEventListener("storage",function(e){
  if(e.key===EatoutsDB.KEY||e.key===null){
    bootEatoutsBridge();
    render();
  }
});
/* Hydrate-on-open: whenever the active venue changes, pull its published
   content from D1 and re-render if it applied. */
window.addEventListener("eatouts:venue-active",function(e){
  const id=e&&e.detail&&e.detail.id;
  if(id) hydrateVenueContent(id);
});
