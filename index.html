<!DOCTYPE html>
<!-- PAGE: EatOuts (customer SPA) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>EatOuts</title>
<link rel="icon" type="image/png" href="assets/logo/EatOuts_Badge.png">
<link rel="apple-touch-icon" href="assets/logo/EatOuts_Badge.png">
<style>
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* Fallback so .fpop-scrim's clip-path stays valid before the first measurement
   (and if the observer never runs): a 0px bottom inset just means the blur
   reaches the screen edge. Layout never depends on this value. */
:root{--navh:0px}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#f0ece2}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;color:#1a1a1a;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
::-webkit-scrollbar{width:0;height:0;display:none}
*{scrollbar-width:none;-ms-overflow-style:none}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;text-align:left}
img{display:block;max-width:100%}

#shell{position:fixed;inset:0;max-width:460px;margin:0 auto;display:flex;flex-direction:column;background:#ffffff;box-shadow:0 0 80px rgba(0,0,0,.08);overflow:hidden}
@media(min-width:520px){#shell{border-left:1px solid #e8e3d8;border-right:1px solid #e8e3d8}}

/* ---------- HEADER (WHITE) ---------- */
/* z-index 58 keeps the header above .fpop-scrim (55) so it is never blurred,
   while staying below .fpop (60) so an open menu still overlays it. */
#hdr{flex:0 0 auto;height:58px;display:flex;align-items:center;gap:10px;padding:0 14px;background:#ffffff;border-bottom:1px solid #ece7db;position:relative;z-index:58;padding-top:env(safe-area-inset-top)}
#hdr.hide{display:none}
/* Promos feed focus mode: while an accordion e-card is open on the Promos
   feed, drop the top header, the sticky week calendar and the bottom nav so
   the open card fills the screen. Toggled by applyPromoFocus() on #shell. */
#shell.promos-tab.promo-focus #hdr,#shell.promos-tab.promo-focus #nav,
#shell.promos-tab.promo-focus #cbar,#shell.promos-tab.promo-focus #filter-bar,
#shell.promos-tab.promo-focus .cal{display:none}
/* #hdr is gone in this mode, so a popup pinned below it would float over a
   66px dead gap — tuck it against the top edge instead. */
#shell.promos-tab.promo-focus .fpop{top:16px}
/* Gallery full-photo view: drop the top header, control/filter bar and bottom
   nav so the photo fills the screen. Toggle the shell class from renderViewport(). */
#shell.gal-photo #hdr,#shell.gal-photo #cbar,#shell.gal-photo #filter-bar,
#shell.gal-photo #nav{display:none}
.brand-mark{height:34px;width:auto;aspect-ratio:1172/504;flex:0 0 auto;display:flex;align-items:center;justify-content:flex-start;background:none;border:0;border-radius:0;box-shadow:none;overflow:hidden;padding:0;margin:0}
.brand-mark img{width:100%;height:100%;object-fit:contain;display:block}
.hdr-right{margin-left:auto}
.hdr-chip{font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#a89a7e;border:1px solid #ece7db;border-radius:20px;padding:4px 9px;background:#faf8f2}

/* ---------- VIEWPORT (WHITE) ---------- */
#viewport{flex:1 1 auto;position:relative;overflow:hidden;background:#ffffff;padding-top:0;view-transition-name:app-vp}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:#ffffff;color:#1a1a1a}
.screen.anim{animation:screenfade .28s ease}
@keyframes screenfade{from{opacity:0}to{opacity:1}}
::view-transition-old(app-vp),::view-transition-new(app-vp){animation-duration:.28s;animation-timing-function:ease}
::view-transition-old(app-vp){animation-name:vtFadeOut}
::view-transition-new(app-vp){animation-name:vtFadeIn}
@keyframes vtFadeOut{to{opacity:0}}
@keyframes vtFadeIn{from{opacity:0}}
.panelfade-out{position:absolute;inset:0;z-index:5;pointer-events:none;animation:pfOut .28s ease forwards}
@keyframes pfOut{from{opacity:1}to{opacity:0}}
.scroll{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:#ffffff}

/* ---------- BOTTOM NAV (BLACK, WHITE ICONS, NO TEXT) ---------- */
/* position:relative is load-bearing: without it the element is static and
   z-index is inert, so the nav could never sit above .fpop-scrim. */
#nav{flex:0 0 auto;position:relative;display:flex;background:#0a0a0a;border-top:1px solid #1a1a1a;padding-bottom:env(safe-area-inset-bottom);z-index:50}
.nav-btn{flex:1;padding:16px 2px 15px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.42);transition:color .18s}
.nav-btn svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;transition:transform .18s}
.nav-btn.on{color:#ffffff}
.nav-btn.on svg{transform:translateY(-1px);filter:drop-shadow(0 0 8px rgba(255,255,255,.35))}
.nav-btn:active{color:rgba(255,255,255,.75)}

/* ---------- CONTROL BAR ---------- */
#cbar{flex:0 0 auto;display:none;background:#ffffff;border-top:1px solid #ece7db;position:relative}
#cbar.on{display:block}

/* ---------- FLOATING FILTER POPUP (lightweight overlay) ---------- */
/* Shared geometry for every popup: fixed, pinned 66px below the top of the
   screen (just under the 58px #hdr) instead of hovering above its trigger at
   the bottom, and inset 16px inside the 460px phone frame on both sides.
   For a fixed element 100% is the viewport width, so max(16px,calc((100% -
   460px)/2 + 16px)) = the grey gutter + 16px on wide screens and a plain
   16px on phones — equal spacing either side, never touching an edge.
   (keep 460px in sync with #shell and with .fpop-scrim's clip-path below). */
.fpop{position:fixed;top:66px;bottom:calc(66px + var(--navh));left:max(16px,calc((100% - 460px)/2 + 16px));right:max(16px,calc((100% - 460px)/2 + 16px));background:#ffffff;border:1px solid #ece7db;border-radius:14px;box-shadow:0 -6px 26px -6px rgba(0,0,0,.2);overflow:hidden;z-index:60;animation:fpop .18s ease}
/* Frosted backdrop for all 5 picker popups. The scrim sits above page content
   but below .fpop (60) and .pfbtn (56), so the menu and its trigger stay sharp.
   -webkit- prefix is required: Safari ignores the unprefixed form entirely.

   clip-path confines the *paint* to the app column and to the band between
   header and nav, so the header, the bottom nav and the grey gutters either
   side of #shell stay crisp. It does NOT shrink the element's hit area, so
   tap-to-dismiss still works anywhere on screen.

   Insets: 58px clears #hdr (height:58px); the horizontal max(0px,...) pair
   tracks #shell's max-width:460px (keep those two in sync); var(--navh) is
   measured at runtime because it varies with env(safe-area-inset-bottom). */
.fpop-scrim{position:fixed;inset:0;z-index:55;background:rgba(20,18,12,.28);backdrop-filter:blur(10px) saturate(1.2);-webkit-backdrop-filter:blur(10px) saturate(1.2);clip-path:inset(58px max(0px,calc((100% - 460px)/2)) var(--navh) max(0px,calc((100% - 460px)/2)))}
@keyframes fpop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fpop button{display:block;width:100%;padding:12px 14px;font-size:12.5px;font-weight:700;color:#3a3324;border-bottom:1px solid #f4efe4;text-align:left}
.fpop button:last-child{border-bottom:0}
.fpop button:active{background:#faf8f2}
.fpop button.on{color:#1a1a1a;font-weight:900;background:#f2f1ee}

/* ---------- COMMON ---------- */
.pad{padding:14px}
.subh{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#a89a7e;font-weight:800;margin:0 0 9px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 15px;border-radius:11px;font-size:12.5px;font-weight:800;background:#f7f4ec;border:1px solid #ece7db;color:#3a3324;letter-spacing:.02em;transition:background .15s;text-decoration:none}
.btn:active{background:#efe9da}
.btn.primary{background:#0d0d0d;border-color:#0d0d0d;color:#ffffff}
.btn.primary:active{background:#000000}
.btn.wa{background:#dff5e4;border-color:#b8e6c1;color:#1c6b2e}
.btn.wa:active{background:#c9ecd0}
.btn.full{width:100%}
.btn.half{flex:1}
.btn.sm{padding:8px 12px;font-size:11.5px;border-radius:9px}
.btn.ghost{background:transparent;border-color:#e2dccd;color:#6f6754}

/* ---------- ART TILES ---------- */
.tile{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
.tile-ico{font-size:26px;opacity:.55;filter:saturate(.75)}
.tile-ico.lg{font-size:52px;opacity:.42}

/* ---------- CALENDAR (STICKY) ---------- */
.cal{flex:0 0 auto;background:#ffffff;border-bottom:1px solid #ece7db;padding:11px 0 10px;position:relative;z-index:5;box-shadow:0 4px 10px -8px rgba(0,0,0,.12)}
.cal-title{padding:0 16px 10px;font-size:14px;letter-spacing:.17em;text-transform:uppercase;color:#a89a7e;font-weight:800;display:flex;align-items:baseline;justify-content:space-between}
.cal-title-btn{font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit;font-weight:inherit;padding:0;background:none;border:0;cursor:pointer;min-height:28px}
.cal-title-btn:active{color:#1a1a1a}
.cal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;padding:0 16px;width:100%;box-sizing:border-box;overflow:visible}
.day{width:100%;height:56px;min-width:0;border-radius:14px;border:1px solid #ece7db;background:#faf8f2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:#a89a7e;transition:all .16s;padding:0}
.day b{font-size:9.5px;font-weight:800;letter-spacing:.09em}
.day span{font-size:15px;font-weight:900;color:#3a3324}
.day.on{background:#0d0d0d;border-color:#0d0d0d;color:#ffffff}
.day.on span{color:#ffffff}
.day.td:not(.on){border-color:#1a1a1a}

/* ---------- MONTH / WEEK PICKERS ---------- */
.fpop.month-pop,.fpop.week-pop{overflow-y:auto;padding:6px 0}
.month-year{font-size:22px;font-weight:900;color:#1a1a1a;text-align:center;padding:14px 12px 10px;background:rgba(0,0,0,.03);border-bottom:1px solid #f4efe4;letter-spacing:-.01em}
.fpop .month-row{display:block;width:100%;text-align:center;padding:14px 12px;font-size:20px;font-weight:700;color:#3a3324;background:#fff;border-bottom:1px solid #f4efe4;opacity:.25;transition:opacity .15s}
.fpop .month-row:last-child{border-bottom:0}
.fpop .month-row.on{background:#faf8f2;color:#1a1a1a;font-weight:900;opacity:1}
.fpop .month-row:active{background:#f4efe4}
.fpop .week-row{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:14px 16px;font-size:20px;font-weight:800;color:#3a3324;background:#fff;border-bottom:1px solid #f4efe4;min-height:48px}
.fpop .week-row.on{background:#faf8f2;color:#1a1a1a}
.fpop .week-row.expanded{background:#f4efe4}
.fpop .week-row:active{background:#efe9da}
.fpop .week-row-label{transition:opacity .18s}
.fpop.week-pop.expanded-open .week-row:not(.expanded) .week-row-label{opacity:.25}
.fpop .week-days{overflow:hidden;transition:max-height .24s ease,opacity .18s ease;background:#faf8f2;border-bottom:1px solid #f4efe4}
.fpop .day-row{display:grid;grid-template-columns:44px 40px 1fr;align-items:center;gap:10px;width:100%;padding:10px 18px;font-size:13px;font-weight:700;color:#3a3324;background:transparent;border-bottom:1px solid #f1ece1;text-align:left;min-height:44px}
.fpop .day-row:last-child{border-bottom:0}
.fpop .day-row-name{color:#a89a7e;font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:10.5px}
.fpop .day-row-num{font-size:15px;font-weight:900;color:#1a1a1a}
.fpop .day-row-count{font-size:11.5px;font-weight:700;color:#8a8170;text-align:right}
.fpop .day-row.on{background:#ffffff}
.fpop .day-row.on .day-row-num{color:#1a1a1a}
.fpop .day-row-empty{opacity:.42}
.fpop .day-row-empty .day-row-num{color:#b5a888}
.fpop .day-row-empty .day-row-count{color:#b5a888;font-style:italic}
.fpop .day-row-out{opacity:.35}

/* ---------- PROMO CARD (ACCORDION, IMAGE-ONLY) ---------- */
.pcard{margin:12px 14px;border-radius:16px;overflow:hidden;background:#ffffff;border:1px solid #ece7db;box-shadow:0 2px 8px -4px rgba(0,0,0,.06)}
.pimg{position:relative;aspect-ratio:16/10;display:block;width:100%;padding:0;overflow:hidden;border:0}
.pimg .tile{position:absolute;inset:0}
.pimg .tile-ico{font-size:48px;opacity:.28}
.pimg>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.pbody{padding:14px;border-top:1px solid #f1ece1;background:#ffffff}
.promo-venue-card{display:flex;align-items:center;gap:14px;margin:12px 14px;padding:10px;border:1px solid rgba(0,0,0,.05);border-radius:12px;background:#ffffff}
.promo-venue-name{flex:1;min-width:0;text-align:left;font-size:15px;font-weight:800;color:#1a1a1a;background:transparent;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.promo-venue-name:active{opacity:.6}
@keyframes fd{from{opacity:0}to{opacity:1}}
.phead-btn{display:block;width:100%;padding:0;margin:0 0 10px}
.phead-btn h3{margin:0 0 6px;font-size:17px;font-weight:900;color:#1a1a1a;line-height:1.2;letter-spacing:-.01em}
.pprice{font-size:15px;font-weight:900;color:#1a1a1a;letter-spacing:-.01em}
.pprice .pwas{font-size:11.5px;font-weight:700;color:#b5a888;text-decoration:line-through;margin-left:6px;letter-spacing:0}
.pprice.pcat{font-size:11.5px;font-weight:800;color:#8a7a55;letter-spacing:.05em;text-transform:uppercase}
.phl{margin:0;padding:0;list-style:none}
.phl li{font-size:12px;color:#5c5547;line-height:1.5;padding:7px 0 7px 14px;position:relative;border-bottom:1px solid #f4efe4}
.phl li:last-child{border-bottom:0}
.phl li::before{content:"";position:absolute;left:0;top:14px;width:5px;height:5px;border-radius:50%;background:#1a1a1a}

/* ---------- EVENT CARD (ACCORDION) ---------- */
.ecard{margin:12px 14px;border-radius:16px;overflow:hidden;background:#ffffff;border:1px solid #ece7db;box-shadow:0 2px 8px -4px rgba(0,0,0,.06)}
/* image drives card height: full width, full height, nothing cropped */
.ecard .pimg{aspect-ratio:auto;display:block}
.ecard .pimg>img{position:relative;inset:auto;width:100%;height:auto;object-fit:cover;display:block}

/* ---------- ACCORDION (smooth collapse/expand) ---------- */
.acc-wrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s cubic-bezier(.4,0,.2,1)}
.acc-wrap>.acc-in{overflow:hidden;min-height:0}
.ecard.open>.acc-wrap,.mitem.open>.acc-wrap,.ritem.open>.acc-wrap,.venuemenu.open>.acc-wrap{grid-template-rows:1fr}
@media (prefers-reduced-motion:reduce){.acc-wrap{transition:none}.screen.anim{animation:none}.fpop{animation:none}#filter-bar.on{animation:none}#cbar.on{animation:none}.bev-toggle-thumb{transition:none}::view-transition-old(app-vp),::view-transition-new(app-vp){animation:none}.panelfade-out{animation:none}.fpop-scrim{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(20,18,12,.42)}.fpop .week-days{transition:none}.az-bubble,.az-rail .az-letter{transition:none}}

/* ---------- COUNTERS ---------- */
.ctr{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:#faf8f2;border:1px solid #f1ece1;border-radius:12px;margin-bottom:7px}
.ctr .lbl{font-size:12.5px;font-weight:700;color:#3a3324;display:flex;flex-direction:column}
.ctr .lbl em{font-style:normal;font-size:10px;color:#a89a7e;font-weight:600;letter-spacing:.03em;margin-top:2px}
.stp{display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid #e2dcc9;border-radius:10px;overflow:hidden;background:#ffffff}
.stp button{width:50px;height:45px;font-size:24px;font-weight:800;color:#1a1a1a;display:flex;align-items:center;justify-content:center}
.stp button:active{background:#f4efe4}
.stp .val{min-width:44px;text-align:center;font-size:20px;font-weight:900;color:#1a1a1a;padding:0 8px}

.tbar{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;margin:12px 0;border-radius:13px;background:#f4f4f2;border:1px solid #e4e4e0}
.tbar .tl{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:#1a1a1a;font-weight:800}
.tbar .tv{font-size:19px;font-weight:900;color:#1a1a1a;letter-spacing:-.01em}

/* ---------- MENU ---------- */
.cat-row{display:flex;align-items:center;justify-content:center;gap:13px;padding:15px 16px;border-bottom:1px solid #f1ece1;background:#ffffff;width:100%}
.cat-row:active{background:#faf8f2}
.cat-ico{width:44px;height:44px;flex:0 0 auto;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;border:1px solid #f1ece1;overflow:hidden}
.cat-ico img{width:100%;height:100%;object-fit:cover;display:block;border-radius:0}
.cat-name{font-size:24px;font-weight:800;color:#1a1a1a;letter-spacing:.01em;text-align:center;display:block;width:100%}
.cat-meta{font-size:10.5px;color:#a89a7e;margin-top:2px;letter-spacing:.03em;font-weight:600}
.cat-row .cat-ico{display:none}
.cat-row .cat-meta{text-align:center}
/* Events tab category rows: icon-less, centred, larger label */
.cat-row.evcat{padding:22px 16px;gap:0}
.cat-row.evcat .minfo{text-align:center}
.cat-row.evcat .cat-name{font-size:30px}

.mitem{border-bottom:1px solid #f1ece1;background:#ffffff}
.mrow{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%}
.cat-wrap{position:relative}
.mitem{position:relative}
.mitem>.ico-btn{position:absolute;top:10px;right:8px;z-index:2}
.mitem .mrow{padding-right:58px}
.mrow:active{background:#faf8f2}
.mthumb{width:54px;height:54px;flex:0 0 auto;border-radius:6px;overflow:hidden;border:1px solid #ece7db;position:relative}
.mthumb .tile-ico{font-size:22px}
.mthumb>img{width:100%;height:100%;object-fit:cover;display:block}
.minfo{flex:1;min-width:0}
.cat-row .minfo{flex:none;text-align:center}
.mtitle{font-size:13.5px;font-weight:800;color:#1a1a1a;line-height:1.28}
.mprice{font-size:12.5px;font-weight:900;color:#1a1a1a;margin-top:3px;letter-spacing:.01em}
.mbody{padding:0 14px 15px;animation:fd .2s ease;background:#faf8f2;border-top:1px solid #f1ece1}
.mdesc{font-size:12px;color:#5c5547;line-height:1.55;margin:12px 0 12px}
/* Restaurant-Card: replaces the breadcrumb at the top of both Menu views.
   White card, faint 4% black border, a 90px logo (tap for the large view)
   and the venue name + tagline (tap for the venue info page). */
.restcard{display:flex;align-items:center;gap:13px;padding:12px 14px;margin:12px 14px 0;background:#ffffff;border:1px solid rgba(0,0,0,.04);border-radius:14px}
.restcard-thumb{width:90px;height:90px;flex:0 0 auto;border-radius:8px;overflow:hidden;border:1px solid #ece7db;background:#faf8f2;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.restcard-thumb:active{opacity:.85}
.restcard-thumb img{width:100%;height:100%;object-fit:contain;display:block}
.restcard-thumb .eo-thumb{width:100%;height:100%}
.restcard-ph{font-size:34px;font-weight:900;color:#a89a7e}
.restcard-main{flex:1;min-width:0;text-align:left;background:transparent;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.restcard-name{display:block;font-size:18px;font-weight:700;color:#141414;line-height:1.3;letter-spacing:0}
.restcard-tag{display:block;font-size:14px;font-weight:500;color:#8e8e8e;margin-top:3px;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Menu-view enlargements, scoped so Beverages/Events keep their own sizes. */
.menu-view .cat-meta{font-size:21px}
.menu-view .mthumb{width:90px;height:90px;border-radius:8px}
.menu-view .mthumb .tile-ico{font-size:34px}
.menu-view .mtitle{font-size:20px}
.menu-view .mprice{font-size:18px}
.menu-view .mbody{text-align:center}
.menu-view .mdesc{font-size:14px;text-align:center}
.menu-view .ctr .lbl{font-size:14px;text-align:left;align-items:flex-start}
.menu-view .ctr .lbl em{font-size:12px}
.menu-view .ctr .lbl em.price{font-size:20px;text-align:left;font-weight:800;color:#000}
.menu-view .mitem>.ico-btn{right:24px;width:34px;height:34px}
.menu-view .mitem>.ico-btn img{width:28px;height:28px}
/* 3-up paging: each thumb is (100% - 2 gaps)/3 so exactly three fit,
   and mandatory snapping always lands on a clean group of three. */
.thumbs{display:flex;gap:7px;overflow-x:auto;padding-bottom:3px;margin-bottom:13px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.thumbs .th{flex:0 0 auto;width:calc((100% - 14px)/3);height:auto;aspect-ratio:1/1;border-radius:6px;overflow:hidden;border:1px solid #ece7db;position:relative;scroll-snap-align:start;scroll-snap-stop:always}
.thumbs .th .tile-ico{font-size:26px}
.thumbs .th>img{width:100%;height:100%;object-fit:cover;display:block}
/* Menu photo preview (lightbox): blurred backdrop, image centred with
   equal gaps on both sides so it sits away from the screen edges. */
.preview-layer{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;padding:10vh 8vw;background:rgba(20,18,12,.6);backdrop-filter:blur(18px) saturate(1.1);-webkit-backdrop-filter:blur(18px) saturate(1.1);animation:fd .18s ease}
.preview-layer .preview-img{max-width:100%;max-height:100%;border-radius:10px;box-shadow:0 18px 50px rgba(0,0,0,.55);object-fit:contain}
.preview-close{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;font-size:19px;line-height:1;padding:0}

/* ---------- RESTAURANTS PANEL (swipe inside the Restaurants tab) ---------- */
/* Three-button strip above the pager: tap to jump, or swipe the pages. */
.bev-toggle{position:relative;display:flex;align-items:center;flex:0 0 auto;min-height:2.25em;margin:0 0 8px;padding:5px;border-radius:0;background-color:#e7eff9;border:0;overflow:hidden}
.bev-toggle-thumb{position:absolute;top:5px;left:5px;z-index:0;width:calc((100% - 10px)/4);height:calc(100% - 10px);border-radius:3px;background:#fff;transition:transform .4s ease}
.bev-toggle.catering .bev-toggle-thumb{transform:translateX(100%)}
.bev-toggle.bakery .bev-toggle-thumb{transform:translateX(200%)}
.bev-toggle.bev .bev-toggle-thumb{transform:translateX(300%)}
.bev-toggle-btn{position:relative;z-index:1;flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:center;background:transparent;border:0;padding:9px 15px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:11.5px;font-weight:700;line-height:normal;letter-spacing:.06em;text-transform:uppercase;color:#7e93ad;cursor:pointer;transition:color .2s}
.bev-toggle-btn:first-of-type{justify-content:flex-start}
.bev-toggle-btn:last-of-type{justify-content:flex-end}
.bev-toggle-btn:active{color:#1a1a1a}
.bev-toggle-btn.on{color:#7e93ad;font-weight:700;opacity:1}
/* Horizontal pager: page 1 = Restaurants list, page 2 = Beverages. Native
   scroll-snap does the swiping; each page owns its own vertical .scroll. */
.bev-pager{flex:1 1 auto;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.bev-pager::-webkit-scrollbar{display:none}
.bevpage{flex:0 0 100%;width:100%;height:100%;min-width:0;display:flex;flex-direction:column;scroll-snap-align:start;scroll-snap-stop:always}
.bev-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px 14px}
.bev-tile{position:relative;border-radius:9px;overflow:hidden;border:3px solid rgba(138,125,99,.3);background:transparent;display:flex;align-items:center;justify-content:center;text-align:center;height:45px;min-height:45px;padding:4px 12px;cursor:pointer;outline:none;box-sizing:border-box}
.bev-tile:active{filter:brightness(.96)}
.bev-tile .bt-name{font-size:16px;font-weight:800;color:rgb(138,125,99);line-height:1.2}
.bev-tile.off{opacity:.55}
.bev-tile.off:active{filter:none}
.bev-tile.off .bt-name{color:#6f6553}
.bev-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid #f1ece1;background:#fff;transition:background .15s ease}
.bev-item:active{background:#faf8f2}
.bev-item .mthumb{width:54px;height:54px;transition:transform .15s ease}
.bev-item .mthumb:active{transform:scale(1.06)}
.bev-item .minfo{flex:1;min-width:0}
.bev-item .mtitle{font-size:13px}
.bev-item .mprice{font-size:12.5px}
.bev-item .mprice em{font-style:normal;font-size:10.5px;color:#a89a7e;font-weight:700}
.bev-step{flex:0 0 auto}
.bev-ratio{font-size:20px;letter-spacing:.06em;color:#8a7d63;font-weight:700;padding:14px 16px 4px;text-align:center;margin-bottom:4px}
.bev-ratio.liquors{margin-top:12px;border-top:3px solid rgba(168,154,126,.15)}

/* ---------- CHECKOUT ---------- */
.cbwrap{flex:0 0 auto;border-top:1px solid #ece7db;background:#ffffff}
.cbar{display:flex;align-items:center;gap:12px;padding:11px 14px}
.cbtot{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:4px 0;border-radius:8px;transition:opacity .15s}
.cbtot span{font-size:17px;font-weight:900;color:#1a1a1a}
button.cbtot{cursor:pointer;-webkit-tap-highlight-color:transparent}
button.cbtot:active{opacity:.55}
button.cbtot[disabled]{opacity:.4;cursor:default}

/* ---------- CHECKOUT SUMMARY ---------- */
.co-item{border:1px solid #f1ece1;border-radius:12px;background:#ffffff;margin-bottom:8px;overflow:hidden}
.co-row{display:flex;align-items:center;gap:10px;padding:9px 10px;background:#faf8f2}
.co-main{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
.co-main:active{opacity:.6}
.co-thumb{width:52px;height:52px;flex:0 0 auto;border-radius:7px;overflow:hidden;border:1px solid #ece7db;background:#f3efe4}
.co-thumb>img{width:100%;height:100%;object-fit:cover;display:block}
.co-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.co-name{font-size:12.5px;font-weight:800;color:#1a1a1a;line-height:1.3}
.co-name em{font-style:normal;font-weight:700;color:#1a1a1a}
.co-sub{font-size:10.5px;color:#1a1a1a;font-weight:800}
.co-meta{font-size:10px;color:#a89a7e;font-weight:700}
.co-edit{font-size:9.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:#1a1a1a;flex:0 0 auto}
.co-step{flex:0 0 auto}
.co-open{border-top:1px solid #f1ece1;padding:11px 12px;background:#ffffff}
.co-desc{margin:0 0 10px;font-size:11.5px;line-height:1.55;color:#5c5546}
.co-ex{margin-bottom:6px}
.co-exsum{font-size:10.5px;color:#8a8170;padding:2px 0 6px}
.co-none{font-size:10.5px;color:#a89a7e;font-weight:700;padding:2px 0}
.co-foot{display:flex;justify-content:space-between;align-items:center;font-size:9.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:#a89a7e;margin-top:10px;padding-top:9px;border-top:1px solid #f4efe4}
.co-foot b{font-size:13px;letter-spacing:-.01em;color:#1a1a1a}

/* ---------- FORMS ---------- */
.fld{margin-bottom:11px}
.fld label{display:block;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:#a89a7e;font-weight:800;margin-bottom:6px}
.fld input,.fld textarea{width:100%;padding:12px 13px;background:#faf8f2;border:1px solid #ece7db;border-radius:11px;color:#1a1a1a;font-size:13px;outline:none;transition:border-color .16s}
.fld input:focus,.fld textarea:focus{border-color:#1a1a1a;background:#ffffff}
.fld textarea{resize:none;min-height:76px;line-height:1.5}

/* ---------- LISTS ---------- */
.lrow{display:flex;align-items:center;gap:11px;padding:15px 16px;border-bottom:1px solid #f1ece1;background:#ffffff;width:100%}
.lrow:active{background:#faf8f2}
.lrow .ln{font-size:18px;font-weight:700;color:#1a1a1a;flex:1;text-align:center}
.lrow .ld{font-size:11.5px;color:#a89a7e;font-weight:500;margin-top:3px;text-align:center}
.resback{flex:0 0 auto;background:#ffffff;border-top:1px solid #f1ece1;padding:10px 14px 12px}

/* ---------- GALLERY ---------- */
.gal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:0 0 2px;background:#ffffff}
.gal-cell{position:relative;aspect-ratio:1;overflow:hidden;background:#f4efe4;border:0;padding:0;display:block}
.gal-cell .tile-ico{font-size:30px}
.gal-cell>img{width:100%;height:100%;object-fit:cover;display:block}

/* ---------- CONTROL BAR (GALLERY) ---------- */
.cbar2{display:flex;align-items:center;gap:8px;padding:10px 12px}
.cbar2:empty{display:none}
.cbtn{font-size:12px;font-weight:800;letter-spacing:.03em;color:#3a3324;padding:9px 15px;border-radius:10px;background:#faf8f2;border:1px solid #ece7db}
.cbtn:active{background:#f4efe4}
.cbtn.ic{padding:9px 11px;display:flex;align-items:center;justify-content:center;background:#0a0a0a;border-color:#0a0a0a;color:#ffffff}
.cbtn.ic svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.cbtn.ic:active{background:#222}
.cbtn.ic.on{background:#0a0a0a;border-color:#0a0a0a;color:#ffffff}
.csearch{flex:1;display:flex;align-items:center;gap:8px;background:#faf8f2;border:1px solid #ece7db;border-radius:10px;padding:0 12px}
.csearch input{flex:1;background:none;border:0;outline:none;padding:10px 0;font-size:13px;color:#1a1a1a}
.csearch input::placeholder{color:#b5a888}
.rest-filter-row{display:flex;gap:8px;padding:0 12px 8px}
.rest-filter-row .cbtn{flex:1;min-width:0;overflow:hidden;text-align:left;text-overflow:ellipsis;white-space:nowrap}
.rest-filter-row .cbtn.align-right{text-align:right}
/* Bottle + restaurant filter bars: 12px breathing room above the first row
   (search / town) and 18px button labels. Scoped to .rest-filter-controls so
   the reserve venue town row (a bare .rest-filter-row) is untouched. */
.rest-filter-controls{padding-top:12px}
.rest-filter-controls .rest-filter-row .cbtn{font-size:18px}
.rest-filter-controls .rest-filter-row .cbtn.align-center{text-align:center}
/* cbar slides up from the bottom when a filter bar is toggled open */
#cbar.on{animation:cbarUp .18s ease-out}
@keyframes cbarUp{from{transform:translateY(14px);opacity:.35}to{transform:translateY(0);opacity:1}}
/* Beverages filtered-results list + sticky Clear Search button */
.bev-result{width:100%;text-align:left;border:0;font:inherit;cursor:pointer;color:inherit}
.bev-result .mthumb{width:90px;height:90px;border:0;background:#f1ece1;border-radius:10px}
.bev-result .mthumb img{width:100%;height:100%;object-fit:cover;display:block;border-radius:10px}
/* "Offered by ..." line under the item name/price on a filter result card */
.bev-offer{font-size:11px;color:#a89a7e;font-weight:700;margin-top:3px;letter-spacing:.01em}
.bev-result-go{margin-left:auto;font-size:20px;line-height:1;color:#c8bda6;font-weight:700}
.bev-clear-row{position:sticky;bottom:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(255,255,255,0),#ffffff 36%)}
.bev-clear-row .btn{width:100%;display:flex;background:#0a0a0a;border-color:#0a0a0a;color:#ffffff}
/* Town row: centred label, minimal clearance above the town picker. */
.rest-filter-row.town-row{padding:6px 12px 12px;margin-top:0}
.rest-filter-row.town-row .cbtn{text-align:center}
/* Gallery cbar: two value buttons whose text may be long (venue names) */
.cbtn.gal-val{flex:0 1 auto;min-width:0;max-width:44%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Viewed Restaurant popup: Town/City | Area side-by-side row */
.fpop .gal-locrow{display:flex;gap:8px;padding:10px 10px 8px;border-bottom:1px solid #f4efe4}
.fpop .gal-locrow .cbtn{display:block;flex:1;min-width:0;width:auto;padding:9px 8px;border:1px solid #ece7db;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fpop .gal-locrow .cbtn.on{background:#0a0a0a;border-color:#0a0a0a;color:#ffffff}
.fpop .gal-back{font-weight:900;background:#faf8f2}
.rest-type-pop{width:auto;max-width:none;max-height:min(70vh,620px,calc(100vh - 66px - var(--navh) - 16px));padding:0;display:flex;flex-direction:column}
.rest-type-top{flex:0 0 auto;padding:10px;background:#fff;border-bottom:1px solid #ece7db}
.rest-type-top .csearch{min-height:38px}
.rest-type-status{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:8px;font-size:11px;font-weight:800;color:#645b48}
.rest-type-status span,.rest-type-status button{flex:0 0 auto;white-space:nowrap}
.rest-type-status button{width:auto}
.rest-type-status button,.rest-type-footer button{font-size:11px;font-weight:800;color:#3a3324;padding:8px 12px;border:1px solid #ece7db;border-radius:8px;background:#faf8f2}
.rest-type-options{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.rest-type-group-title{padding:10px 14px 7px;background:#f7f6f3;color:#817766;font-size:11px;font-weight:900;letter-spacing:.02em;text-align:center;text-transform:none}
.rest-type-subgroup-title{padding:9px 14px 4px;color:#645b48;font-size:10px;font-weight:900}
.rest-type-option{display:flex;align-items:center;gap:10px;width:100%;padding:10px 14px;border-bottom:1px solid #f4efe4;text-align:left;font-size:12px;font-weight:700;color:#3a3324;cursor:pointer}
.rest-type-option input{flex:0 0 18px;width:18px;height:18px;margin:0;accent-color:#1a1a1a}
.rest-type-option .rest-type-count{margin-left:auto}
.rest-results-heading{padding:9px 14px;color:#645b48;font-size:10px;font-weight:900;text-transform:uppercase;border-bottom:1px solid #ece7db;background:#faf8f2}
.rest-result-option{display:flex;align-items:baseline;gap:10px;width:100%;padding:11px 14px;border-bottom:1px solid #f4efe4;text-align:left;font-size:12px;font-weight:700;color:#3a3324;cursor:pointer}
.rest-result-option .rr-meta{margin-left:auto;font-size:10.5px;font-weight:600;color:#645b48}
.rest-type-footer{flex:0 0 auto;display:flex;justify-content:center;gap:8px;padding:10px;background:#fff;border-top:1px solid #ece7db}
.rest-type-footer button{min-width:110px;text-align:center;justify-content:center}
.rest-type-footer .apply{background:#1a1a1a;border-color:#1a1a1a;color:#fff}
.rest-type-note,.rest-type-empty{padding:12px 14px;color:#817766;font-size:11px;line-height:1.45}

/* ---------- SWIPER ---------- */
.swiper{display:flex;flex-direction:column;flex:1 1 0%;min-height:0;overflow-y:auto;overflow-x:hidden;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.swiper>.slide{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;height:100%;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.swiper>.slide .tile{position:absolute;inset:0}
.swiper>.slide>img{position:relative;z-index:1;width:100%;height:100%;object-fit:contain;display:block}
/* Gallery photo view: each slide is a top-aligned column of photo + action
   row, so the icons hug the photo. The photo is inset from the side edges and
   the icon pair is centred under it, clear of the screen edges; the dark
   slide stays tappable around it (tap the backdrop to dismiss). */
.gal-photo .swiper>.slide{flex-direction:column;justify-content:flex-start;padding:16px 14px 0;gap:14px}
.gal-photo .swiper>.slide>img{width:auto;height:auto;max-width:100%;max-height:calc(100% - 78px)}
.gal-photo .ico-row{margin:0;width:auto;justify-content:center;gap:36px}
.gal-photo .ico-row.split{justify-content:center}
.dots{display:flex;gap:5px;justify-content:center;padding:10px 0;flex:0 0 auto;z-index:5}
.dots i{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.22);display:block}
.dots i.on{background:#1a1a1a;width:16px;border-radius:3px}

/* ---------- ABOUT ---------- */
.about-hero{padding:26px 18px 20px;background:#ffffff;border-bottom:1px solid #ece7db}
.about-hero h2{margin:0 0 6px;font-size:21px;font-weight:900;letter-spacing:-.015em;color:#1a1a1a}
.about-hero p{margin:0;font-size:12px;color:#8a8170;letter-spacing:.02em}
.about-logo{display:block;width:76%;max-width:290px;height:auto;max-height:150px;object-fit:contain;margin:0 auto 18px;border:0;box-shadow:none;background:none}
.kv{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #f4efe4}
.kv .k{font-size:11.5px;color:#a89a7e;font-weight:700}
.kv .v{font-size:11.5px;color:#3a3324;font-weight:700;text-align:right}
/* ---------- ABOUT: stacked centred blocks ---------- */
.about-sec{margin:26px 0 4px;font-size:12px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:#8a8170;text-align:center}
.ablock{padding:15px 2px;text-align:center}
.ablock .abh{font-size:15px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:#a89a7e;margin:0 0 6px}
.ablock .abv{font-size:17px;font-weight:600;line-height:1.55;color:#26221a;margin:0}
.legal-sec{font-size:13px;font-weight:700;letter-spacing:.03em;color:#1a1a1a;margin:18px 0 4px}
.legal-para{font-size:13px;color:#3a3a3a;margin:0 0 8px;line-height:1.5}
/* ---------- FEATURE PILLS ---------- */
/* .tagwrap stays left-aligned: it is shared with the venue and
   restaurant-about tag rows. Opt into centring with .center. */
.tagwrap{display:flex;flex-wrap:wrap;gap:6px;padding-top:4px}
.tagwrap.center{justify-content:center}
.chip{font-size:10px;font-weight:800;letter-spacing:.05em;padding:5px 10px;border-radius:20px;background:#faf8f2;border:1px solid #ece7db;color:#5c5547}
.chip.pill{font-size:11px;font-weight:700;letter-spacing:.02em;padding:7px 14px;border-radius:999px}
.tagwrap.center .chip.pill{font-size:13px;border-radius:4px;padding:6px 12px}
.chip.g{background:rgba(26,26,26,.06);border-color:rgba(26,26,26,.18);color:#1a1a1a}

/* ---------- SOCIAL ICON ROW ----------
   Bare icons only: the PNGs carry their own brand disc, so the anchor
   stays a plain hit area (no border/background/radius). Every row is a
   fixed 370px = 5 slots of 70px + 4 gaps of 5px on line one, which is
   exactly what drops a 6th icon onto the second (centred) line. An
   icon with no destination yet renders its _Off glyph, not a link. */
.social-row{display:flex;flex-wrap:wrap;gap:5px;width:370px;max-width:100%;margin:16px auto 4px;justify-content:center;align-items:center}
.social-ico{flex:0 0 auto;width:70px;height:70px;display:flex;align-items:center;justify-content:center;padding:8px;border:none;border-radius:0;background:transparent;box-shadow:none;text-decoration:none;-webkit-tap-highlight-color:transparent}
.social-ico:active{opacity:.65}
.social-ico img{width:100%;height:100%;object-fit:contain;display:block}
.social-ico.off{pointer-events:none;cursor:default}

/* ---------- ACTION ICON ROW (save / share) ----------
   Bare icons only: no container, border, background or label. The PNG
   carries its own glyph, so the control is just a plain hit area. */
.ico-row{display:flex;gap:14px;align-items:center;margin-top:12px}
.ico-row.split{justify-content:space-between}
.ico-row.single{justify-content:center}
.ico-btn{background:transparent;border:0;padding:0;margin:0;cursor:pointer;display:flex;align-items:center;justify-content:center;width:44px;height:44px;-webkit-tap-highlight-color:transparent}
.ico-btn:active{opacity:.6}
.ico-btn img{width:36px;height:36px;object-fit:contain;display:block}
img[src*="heart_inactive_icon"]{opacity:.5}
.ico-btn.fav-on{background:transparent}

/* ---------- CUSTOMER PROFILE CARD (About tab) ---------- */
.pcdivider{height:1px;background:rgba(0,0,0,.10);margin:18px 0}
.profilecard{display:flex;align-items:center;gap:12px;width:100%;height:90px;padding:0 12px 0 0;border:2px solid rgba(0,0,0,.10);border-radius:14px;background:rgba(0,0,0,.10);overflow:hidden;text-align:left;font:inherit;-webkit-tap-highlight-color:transparent}
.profilecard.guest{justify-content:center;padding:10px 20px;background:orange;border-color:orange;color:#fff;height:auto;min-height:unset}
.profilecard.guest:active{opacity:.9}
.profilecard.guest .pc-main{display:flex;flex-direction:column;align-items:center;text-align:center;width:100%}
.profilecard.guest .pc-main strong{color:#fff;font-size:30px;line-height:1.2;white-space:normal}
.pc-thumb{width:90px;height:90px;border-radius:3px;overflow:hidden;flex:0 0 auto;background:#e9e5db;display:flex;align-items:center;justify-content:center;cursor:pointer}
.pc-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.pc-main{flex:1 1 auto;min-width:0;display:block;text-decoration:none;color:inherit}
.pc-main strong{display:block;font-size:15px;font-weight:900;color:#1a1a1a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc-main small{display:block;font-size:11.5px;color:#928875;font-weight:700;margin-top:2px}
.pc-fav{flex:0 0 auto;display:flex;align-items:center;gap:5px}
.pc-fav img{width:20px;height:20px;display:block}
.pc-fav span{font-size:11px;font-weight:800;color:#a89a7e}
.pc-toggle{flex:0 0 auto;width:34px;height:34px;border:0;background:transparent;cursor:pointer;font:inherit;font-size:18px;line-height:1;font-weight:900;color:#8a8170;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
.pc-toggle:active{opacity:.6}
.pc-chev{flex:0 0 auto;width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:22px;line-height:1;font-weight:900;color:#a89a7e}
.pc-rows{border:2px solid rgba(0,0,0,.10);border-top:0;border-radius:0 0 14px 14px;overflow:hidden;margin-top:-2px}
.pc-row{display:flex;width:100%;text-align:left;padding:14px 16px;background:#fff;border:0;border-bottom:1px solid #f1ece1;font-size:13.5px;font-weight:800;color:#1a1a1a;text-decoration:none;cursor:pointer;font-family:inherit}
.pc-row:last-child{border-bottom:0}
.pc-row:active{background:#faf8f2}
.pc-photo{position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:60;padding:24px}
.pc-photo img{width:min(72vw,300px);height:min(72vw,300px);object-fit:cover;border-radius:18px;background:#222}
.pc-photo .pc-actions{display:flex;gap:10px;align-items:center}

/* ---------- ABOUT: SETTINGS ACCORDION ---------- */
/* Centred text rows, no chevron. The whole list collapses behind the
   "Settings" header; "List Business" nests a second accordion whose only
   rows are the "List As ..." signup links. */
.setlist{margin-top:14px;border-top:1px solid #f1ece1}
.setrow{display:block;width:100%;text-align:center;padding:16px 14px;font-size:25px;line-height:1.35;font-weight:800;letter-spacing:.01em;color:#1a1a1a;background:#ffffff;border-bottom:1px solid #f1ece1;text-decoration:none;cursor:pointer;min-height:auto}
.setrow:active{background:#faf8f2}
.setacc.open>.acc-wrap{grid-template-rows:1fr}
.setacc[open]>.acc-wrap{grid-template-rows:1fr}
.setacc>summary{list-style:none;-webkit-appearance:none;-moz-appearance:none;appearance:none}
.setacc>summary::-webkit-details-marker{display:none}
.setacc>summary::before,.setacc>summary::after{content:"";display:none}
.setacc[data-sacc="settings"].open>.setrow{background:rgba(0,0,0,.04)}
/* Nested sub-options (the List Business "List As ..." rows) sit on a faint
   2% black tint so they read as a second level under the settings list. */
.setacc .setacc .acc-in>.setrow{background:rgba(0,0,0,.02)}
.setacc .setacc .acc-in>.setrow:active{background:#faf8f2}
.signup-banner{display:block;max-width:480px;margin:14px auto 6px;border-radius:0;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.signup-banner img{display:block;width:100%;height:auto}
@media (prefers-reduced-motion:reduce){.signup-banner img{filter:none}}

/* ---------- CRUMB ---------- */
.crumb{display:flex;align-items:center;gap:8px;padding:12px 16px 10px;flex-wrap:wrap;background:rgba(0,0,0,.04)}
.crumb button{font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:#a89a7e;padding:4px 0}
.crumb button:active{color:#1a1a1a}
.crumb .sep{color:#e2dcc9;font-size:10px}
.crumb .cur{font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:#1a1a1a}
.phead{width:100vw;box-sizing:border-box;margin-left:calc(-50vw + 50%);margin-right:calc(-50vw + 50%);padding:20px 16px 16px;text-align:center;border-radius:0;background-color:rgba(211,211,211,.2)}
.phead h2{margin:0 0 4px;font-size:28px;line-height:1.2;font-weight:900;letter-spacing:-.01em;color:#1a1a1a}
.phead p{margin:0;font-size:15px;font-weight:700;color:#a89a7e;line-height:1.5}
.menu-view .phead{padding-top:8px;padding-bottom:8px}
.menu-view .phead h2{margin-bottom:0}
.empty{padding:44px 20px;text-align:center;color:#a89a7e;font-size:12.5px;line-height:1.6}

/* ---------- PROMO FILTER BAR (rises above nav) ---------- */
#filter-bar{flex:0 0 auto;background:#ffffff;border-top:1px solid #ece7db;position:relative;display:none}
#filter-bar.on{display:block;animation:pfrise .22s ease}
@keyframes pfrise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.pfbar{display:flex;flex-direction:column;gap:8px;padding:10px 12px;position:relative}
.pfrow{display:flex;gap:8px}
.pfbtn{flex:1 1 0;display:flex;align-items:center;gap:6px;padding:10px 12px;background:#faf8f2;border:1px solid #ece7db;border-radius:10px;font-size:12px;font-weight:800;color:#3a3324;cursor:pointer;min-width:0;text-align:left;transition:background .15s;position:relative;z-index:56}
.pfbtn:active{background:#f4efe4}
.pfbtn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.02em}
.pfbtn.pf-town{flex:1 1 100%;justify-content:center;text-align:center}
.pfbtn.pf-area{justify-content:flex-start;text-align:left}
.pfbtn.pf-type{justify-content:flex-end;text-align:right}
.pfbtn[disabled]{opacity:.45;cursor:default}
.pfbtn[disabled]:active{background:#faf8f2}
.fpop{max-height:none;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
/* width:auto/max-width:none keep the shared .fpop side insets in charge;
   without them a capped intrinsic width could win and shift the popup
   off-centre (it used to sit at 8px caps against #cbar's edge). */
.fpop.town-pop,.fpop.area-pop,.fpop.type-pop{width:auto;max-width:none}
/* type popup: a four-segment category bar pinned above a scrolling
   checkbox list, so the popup can size itself without the segments
   scrolling away */
.fpop.type-pop{display:flex;flex-direction:column;padding:0;overflow:hidden;touch-action:pan-y}
.segbar{flex:0 0 auto;display:flex;gap:8px;padding:12px 12px 8px;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.segbtn{flex:1 1 auto;scroll-snap-align:start;min-width:74px;padding:9px 8px;border:1px solid #ece7db;border-radius:999px;background:#faf8f2;font-size:11.5px;font-weight:800;color:#3a3324;cursor:pointer;white-space:nowrap}
.segbtn.on{background:#1a1a1a;border-color:#1a1a1a;color:#ffffff}
.typepop-top{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:0 12px 10px}
.typepop-top .csearch{min-height:38px}
.typepop-options{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;border-top:1px solid #f4efe4}
.typepop-group-title{position:sticky;top:0;z-index:1;padding:10px 14px 6px;background:#fffdf8;border-bottom:1px solid #f4efe4;font-size:10.5px;font-weight:900;letter-spacing:.13em;text-transform:uppercase;color:#8d8264}
.typepop-option{display:flex;align-items:center;gap:10px;width:100%;padding:10px 14px;border-bottom:1px solid #f4efe4;text-align:left;font-size:12px;font-weight:700;color:#3a3324;cursor:pointer}
.typepop-option input{flex:0 0 18px;width:18px;height:18px;margin:0;accent-color:#1a1a1a}
.typepop-footer{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;background:#fff;border-top:1px solid #ece7db}
.typepop-hint{font-size:11px;font-weight:700;color:#8d8264}
.typepop-footer .apply{min-width:110px;text-align:center;font-size:11px;font-weight:800;color:#ffffff;background:#1a1a1a;border:1px solid #1a1a1a;border-radius:8px;padding:8px 12px}
/* .fpop prefix is load-bearing: plain .loc-* is (0,1,0) and loses to
   .fpop button's (0,1,0)+type, so the rows would fall back to display:block
   and space-between would never push the count pill to the right edge. */
.fpop .loc-all,.fpop .loc-town-main,.fpop .loc-area-option{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left}
.fpop .loc-all{position:sticky;top:0;z-index:2;background:#fff;font-weight:900}
.loc-district{padding:10px 14px 6px;background:#f7f6f3;color:#817766;font-size:10px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}
.fpop .loc-town-main{padding:11px 14px}
.fpop .lbl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:24px;font-weight:700;color:#3a3324}
.loc-count{flex:0 0 auto;min-width:26px;padding:6px 12px;border-radius:12px;background:transparent;color:#645b48;font-size:18px;font-weight:900;text-align:center}
/* min-width:0 lets these flex items shrink below content width; without it
   min-width:auto keeps a long area name at full width and shoves the count
   pill off the row. Matches the .lbl guards the town rows already had. */
.fpop .loc-area-option>span:first-child,.fpop .loc-all>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fpop .loc-area-option{padding:11px 14px;border:0;background:transparent;font-size:20px}
.fpop .loc-area-option.on{background:#fdf9ef}
.fpop .loc-area-option .loc-sub{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px;font-weight:500;color:#a89a7e;margin-top:2px}
.ropts .baddr{margin:9px 2px 2px;font-size:10.5px;font-weight:600;color:#8a8170;text-align:left;line-height:1.45}
.fpop-note{padding:12px 14px;font-size:11px;color:#a89a7e}
/* "All Towns" first row reads as a centred caption */
.fpop .loc-all{justify-content:center;text-align:center}
/* Restaurant + bottle town pickers render every row at 20px */
.fpop.town-pop.rest-town-pop .town-scroll button,.fpop.town-pop.rest-town-pop .town-scroll .lbl{font-size:20px}

/* ---------- A–Z JUMP RAIL (town pickers) ---------- */
/* .fpop is position:fixed, so it already anchors the absolutely-positioned
   rail + bubble; overflow:hidden clips them. The scroller moves to an inner
   .town-scroll so the rail stays put while the list scrolls. */
.fpop.town-pop{display:flex;flex-direction:column;overflow:hidden;padding:0}
.town-scroll{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:2px;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:8px 36px 8px 8px}
.az-rail{position:absolute;top:8px;right:4px;bottom:8px;width:24px;display:flex;flex-direction:column;align-items:stretch;justify-content:center;padding:4px 0;border-radius:12px;background:rgba(255,255,255,.78);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 1px 6px rgba(15,23,42,.06);overflow:hidden;scrollbar-width:none;-ms-overflow-style:none;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;z-index:5}
.az-rail::-webkit-scrollbar{display:none;width:0;height:0}
.az-rail .az-letter{flex:1 1 0;min-height:0;display:flex;align-items:center;justify-content:center;padding:0;border:0;background:transparent;font-family:inherit;font-size:10px;font-weight:700;line-height:1;color:#64748b;border-radius:999px;cursor:pointer;transition:background .12s ease,color .12s ease}
.az-rail .az-letter:active{background:rgba(15,23,42,.08)}
.az-rail .az-letter.active{background:#0f172a;color:#ffffff}
.az-rail .az-letter.empty{color:#cbd5e1;pointer-events:none}
.az-rail .az-letter:focus-visible{outline:2px solid #0f172a;outline-offset:-2px}
.az-bubble{position:absolute;top:50%;left:50%;width:78px;height:78px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(15,23,42,.88);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);color:#ffffff;font-size:34px;font-weight:800;line-height:1;pointer-events:none;opacity:0;transform:translate(-50%,-50%) scale(.82);transition:opacity .14s ease,transform .14s ease;z-index:20}
.az-bubble.show{opacity:1;transform:translate(-50%,-50%) scale(1)}

/* ---------- RESTAURANT LIST (Restaurants tab) ---------- */
/* .ritem wraps the row + its options so the options can live OUTSIDE the
   row button (interactive content inside a <button> is invalid) and still
   animate via the shared .acc-wrap grid-rows transition. */
.ritem{width:calc(100% - 20px);margin:7px 10px;background:#ffffff;border:1px solid #ece7db;border-radius:7px;overflow:hidden;box-shadow:0 1px 2px rgba(16,24,40,.05),0 10px 26px rgba(16,24,40,.06);transition:box-shadow .25s ease,border-color .25s ease}
.ritem.open{border-color:#dfe3e9;box-shadow:0 2px 4px rgba(16,24,40,.06),0 18px 40px rgba(16,24,40,.10)}
.ritem.open>.rrow{background:#ffffff}
.rrow{display:flex;align-items:center;gap:13px;padding:13px 14px;background:#ffffff;border-bottom:0;width:100%;cursor:pointer;text-align:left;font:inherit;color:inherit;border-top:0;border-left:0;border-right:0;-webkit-tap-highlight-color:transparent}
.rrow:active{background:#fafbfc}
.venuemenu{background:#f4f1ea;border:1px solid #ece7db;border-radius:14px;overflow:hidden;margin:8px auto 16px;max-width:370px}
.vmrow{display:block;width:100%;text-align:center;padding:14px;background:#e8e3d8;color:#3a3324;font-size:13px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;border:0;cursor:pointer}
.vmrow:active{background:#ddd6c8}
/* Layout box only. The square itself is painted by the injected
   .eo-thumb styles (js/eatouts-brand.js) so there is a single border
   and the colour fills the whole tile instead of hugging the letter. */
.rthumb{width:54px;height:54px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;border-radius:15px;overflow:hidden;background:#333;box-shadow:inset 0 0 0 1px rgba(255,255,255,.16);padding:0;border:0;cursor:pointer}
.rthumb .eo-thumb{width:54px;height:54px}
.ritem .rthumb{width:90px;height:90px;border-radius:12px;background:transparent;box-shadow:none}
.ritem .rthumb .eo-thumb{width:90px;height:90px}
.ritem .rthumb .eo-thumb-img{background-color:transparent;background-size:cover;background-position:center}
.rinfo{flex:1;min-width:0}
/* Business title: bold sans, deep charcoal, matching the app's default
   system font stack for a consistent look across the whole app. */
.rname{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:16.5px;font-weight:700;color:#141414;line-height:1.3;letter-spacing:-.2px}
/* Metadata: lighter, neutral sans so the title stays the focal point */
.rmeta{font-size:14px;color:#8e8e8e;font-weight:500;margin-top:3px;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Badges: bold sans inside soft neutral pills, inheriting the app font */
.rnew,.rflag{font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#1a1a1a;background:#f2f2f0;border:1px solid #e2e2df;border-radius:20px;padding:3px 8px;flex:0 0 auto}
.rnew{margin-left:8px}
.rflag{margin-left:6px;letter-spacing:.1em}

/* no cuisine group headers: the list is one flat filtered column */

/* ---------- RESTAURANT 4-OPTION DROPDOWN ---------- */
/* No fd animation here: the .acc-wrap height transition owns the motion,
   and replaying a fade on freshly inserted markup is what made the old
   dropdown flash open/close. */
.ropts{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 14px;background:#efe9db;border-bottom:1px solid #e2dbc9}
/* 5-row card body: a vertical stack of full-width rows (Town, Area, Menu,
   Promos) plus a centred icon row, matching the menu-selector redesign.
   Scoped to the accordion cards so other .ropts users keep the grid. */
.ropts.brows{display:flex;flex-direction:column;gap:9px;padding:2px 14px 16px;background:#ffffff;border-bottom:0}
.venuemenu .ropts.brows{padding-top:12px}
.brow{display:flex;gap:8px;align-items:center}
.brow .cbtn,.brow .cbtn-area{flex:1 1 0;min-width:0;overflow:hidden;text-align:center;text-overflow:ellipsis;white-space:nowrap}
.brow .ropt{flex:1 1 0;min-width:0}
.line{appearance:none;-webkit-appearance:none;width:100%;min-height:48px;padding:0 14px;border-radius:14px;border:1px solid #ece7db;background:#fbfbfc;display:flex;align-items:center;justify-content:center;text-align:center;font:inherit;font-size:15px;font-weight:600;letter-spacing:.1px;color:#6b7280;cursor:pointer;transition:background .16s,border-color .16s,color .16s,transform .08s;-webkit-tap-highlight-color:transparent}
.line:active{transform:scale(.985)}
.line span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.line-select.is-set{color:#111827;background:#ffffff;border-color:#cfd6df}
.line-select.is-disabled{color:#aab1bb;background:#f3f4f6;border-color:#ebedf1}
.line-action{background:#ffffff;color:#111827;border-color:#dfe3e9}
.line-action.is-disabled{color:#aab1bb;background:#f3f4f6;border-color:#ebedf1}
.line-action.is-disabled:active{transform:none}
/* centred icon row at the bottom of the card: heart, WhatsApp, info */
.card-ico-row{display:flex;align-items:center;justify-content:center;gap:18px;padding-top:3px}
.card-ico-row .ico-btn{width:54px;height:54px;border-radius:50%;border:1px solid #ece7db;background:#ffffff;display:flex;align-items:center;justify-content:center;transition:transform .1s,background .18s,border-color .18s}
.card-ico-row .ico-btn:active{transform:scale(.93)}
.card-ico-row .ico-btn img{width:25px;height:25px;object-fit:contain;display:block}
.card-ico-row .ico-btn .ico-info-img{opacity:.5}
.ropt{padding:11px 12px;background:#ffffff;border:1px solid #ece7db;border-radius:12px;font-size:12.5px;font-weight:800;color:#3a3324;text-align:center;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .15s}
/* location strip inside a restaurant's options panel: the town + area filter
   buttons occupy the top line of the grid, the Menu/Promos actions the second.
   "Also known as" surfaces a branch whose real name differs from the brand. */
.ropts-loc-name{grid-column:1/-1;font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#a89a7e;padding:0 2px}
.ropts .cbtn,.ropts .cbtn-area{min-width:0;overflow:hidden;text-align:center;text-overflow:ellipsis;white-space:nowrap;background:#fff}
.ropts .cbtn-area{font-size:12px;font-weight:800;letter-spacing:.03em;color:#3a3324;padding:9px 15px;border-radius:10px;border:1px solid #ece7db}
.ropts .cbtn-area:active{background:#f4efe4}
/* Per-restaurant branch picker: shares the base .fpop geometry (fixed at
   top:66px, 16px inside the phone frame); only width:auto/max-width:none
   are kept here. */
.rest-loc-pop{width:auto;max-width:none}
/* hint/footer text reads as a centred caption inside the branch picker */
.fpop.rest-loc-pop .fpop-note{text-align:center}
/* Inactive Menu/Promos actions: greyed but still tappable so a notice can
   explain why (choose a location / no promos here). */
.ropt.off{opacity:.4}
.ropt.off:active{background:#ffffff;border-color:#ece7db;transform:none}
/* Floating notice for an inactive action (e.g. "select a location first"). */
.rest-notice{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--navh) + 18px);z-index:66;max-width:min(92%,420px);background:#1a1a1a;color:#fff;font-size:12px;font-weight:700;line-height:1.4;padding:11px 15px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.32);text-align:center;animation:fpop .18s ease}
/* Card alert: a centred floating dialog that explains a disabled action and
   can jump straight into the location picker. */
.card-alert-scrim{position:fixed;inset:0;z-index:78;background:rgba(9,13,20,.48);backdrop-filter:blur(1.5px);-webkit-backdrop-filter:blur(1.5px)}
.card-alert{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:79;width:100%;max-width:316px;max-height:calc(100% - 40px);overflow-y:auto;background:#ffffff;border-radius:24px;padding:24px 22px 18px;text-align:center;box-shadow:0 28px 64px rgba(0,0,0,.34),0 2px 6px rgba(0,0,0,.08);animation:fpop .18s ease}
.card-alert-icon{width:50px;height:50px;margin:0 auto 14px;border-radius:50%;background:#fdecef;display:flex;align-items:center;justify-content:center;color:#e11d2e;font-size:22px;font-weight:800}
.card-alert-logo{width:56px;height:56px;margin:0 auto 14px;border-radius:14px;display:block;object-fit:contain}
.card-alert h3{margin:0;font-size:17.5px;font-weight:700;letter-spacing:-.2px;color:#111827}
.card-alert p{margin:9px 0 0;font-size:14px;line-height:1.55;color:#6b7280;white-space:pre-line}
.card-alert-options{margin-top:16px;display:flex;flex-direction:column;gap:8px}
.card-opt{width:100%;min-height:44px;display:flex;align-items:center;justify-content:center;border:1px solid #ece7db;border-radius:12px;background:#ffffff;font-size:14.5px;font-weight:600;color:#111827;text-decoration:none;-webkit-tap-highlight-color:transparent;transition:background .16s}
.card-opt:active{background:#faf8f2}
.card-alert-actions{margin-top:20px;display:flex;flex-direction:column;gap:8px}
.dlg-btn{width:100%;min-height:47px;border-radius:14px;border:1px solid #ece7db;background:#ffffff;font:inherit;font-size:15px;font-weight:600;color:#111827;cursor:pointer;transition:transform .08s,background .16s;-webkit-tap-highlight-color:transparent}
a.dlg-btn{display:flex;align-items:center;justify-content:center;text-decoration:none}
.dlg-btn:active{transform:scale(.985)}
.dlg-btn.primary{background:#e11d2e;border-color:#e11d2e;color:#ffffff;box-shadow:0 8px 18px rgba(225,29,46,.26)}
/* ---------- ABOUT TAB POPUPS (guest explainer + profile options) ---------- */
@keyframes cardAlertIn{from{opacity:0;transform:translate(-50%,-50%) scale(.92)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes cardScrimIn{from{opacity:0}to{opacity:1}}

/* ================================================================
   MENU — normalised from DATA_MENU (the_yellow_giraffe_menu-master)
   Internal item shape: [id, name, desc, price, extras]
     price  = number                       (single price)
            = [[label, price, happyHourPrice], ...]   (size / option variants)
     extras = [[label, price], ...]
   ================================================================ */
function money(v){
  if(v===null||v===undefined) return null;
  if(typeof v==="number") return isFinite(v)?v:null;
  const m=String(v).replace(/[^\d.]/g,"");
  if(!m) return null;
  const n=parseFloat(m);
  return isFinite(n)?n:null;
}
function variants(slots){
  const out=[];
  (slots||[]).forEach(function(s){
    if(!s) return;
    const p=money(s[1]);
    const hh=money(s[2]);
    if(p===null&&hh===null) return;
    out.push([s[0]===undefined?null:s[0], p, hh]);
  });
  return out;
}
function collapsePrice(price){
  if(!price||!price.length) return 0;
  if(price.length===1&&price[0][0]===null&&price[0][2]===null) return price[0][1]===null?0:price[0][1];
  return price;
}
function rowVariants(o){
  if(o.glass_price!==undefined||o.bottle_price!==undefined)
    return variants([["Glass",o.glass_price],["Bottle",o.bottle_price]]);
  if(o.single_price!==undefined||o.double_price!==undefined||o.grande_price!==undefined)
    return variants([["Single",o.single_price],["Double",o.double_price],["Grande",o.grande_price]]);
  if(Array.isArray(o.options)){
    if(!o.options.length) return [];
    if(typeof o.options[0]==="string")
      return variants(o.options.map(function(n){return [n,o.price];}));
    return variants(o.options.map(function(op){
      return [op.item||op.protein||op.variant||op.name, op.price, op.happy_hour_price];
    }));
  }
  if(Array.isArray(o.flavors)&&o.flavors.length)
    return variants(o.flavors.map(function(n){return [n,o.price];}));
  if(typeof o.price==="string"&&o.price.indexOf("|")>-1){
    const parts=o.price.split("|").map(function(s){return s.trim();}).filter(Boolean);
    return variants(parts.map(function(p,i){return ["Option "+(i+1),p];}));
  }
  if(o.price!==undefined) return variants([[null,o.price,o.happy_hour_price]]);
  return [];
}
function rowExtras(o){
  const out=[];
  if(Array.isArray(o.add_ons)){
    o.add_ons.forEach(function(a){
      const p=money(a.price);
      if(a&&a.item&&p!==null) out.push([a.item,p]);
    });
  }
  if(Array.isArray(o.addons)){
    o.addons.forEach(function(a){
      if(!a||!a.item) return;
      const p=money(a.price);
      const hh=money(a.happy_hour_price);
      if(p===null&&hh===null) return;
      out.push([a.addons?(a.item+" ("+a.addons+")"):a.item, p!==null?p:(hh||0)]);
    });
  }
  return out;
}
function rowDesc(o,groupLabel){
  const bits=[];
  if(groupLabel) bits.push(groupLabel);
  if(o.description) bits.push(o.description);
  if(Array.isArray(o.veggie_options)&&o.veggie_options.length)
    bits.push("("+o.veggie_options.join(", ")+")");
  if(o.pricing) bits.push("Add to any breakfast above.");
  if(Array.isArray(o.options)){
    const notes=[];
    o.options.forEach(function(op){ if(op&&op.addons) notes.push(op.addons); });
    if(notes.length) bits.push("("+notes.join("; ")+")");
  }
  return bits.join(" ");
}
const GROUP_LABEL={
  tequila:"Tequila",gin:"Gin",vodka:"Vodka",whisky:"Whisky",rum:"Rum",brandy:"Brandy",
  shots:"Shots",white_wine:"White Wine",red_wine:"Red Wine",
  salads:"Salads",on_the_side_trail:"On The Side Trail"
};
function addRow(out,o,groupLabel){
  if(!o||typeof o!=="object") return;
  const name=o.item||o.name||o.category;
  if(!name) return;
  let price;
  if(o.pricing&&typeof o.pricing==="object"){
    price=variants(Object.keys(o.pricing).map(function(k){return [k,o.pricing[k]];}));
  } else {
    price=rowVariants(o);
  }
  if(!price||!price.length) return;
  out.push({name:name, desc:rowDesc(o,groupLabel), price:price, extras:rowExtras(o)});
}
function collectRows(value){
  const out=[];
  if(value===null||value===undefined) return out;
  if(Array.isArray(value)){ value.forEach(function(r){addRow(out,r,null);}); return out; }
  if(Array.isArray(value.items)){ value.items.forEach(function(r){addRow(out,r,null);}); return out; }
  Object.keys(value).forEach(function(g){
    const sub=value[g];
    const label=GROUP_LABEL[g]||g;
    if(Array.isArray(sub)) sub.forEach(function(r){addRow(out,r,label);});
    else addRow(out,sub,label);
  });
  return out;
}
function catNote(key){
  const raw=DATA_MENU.menu[key];
  if(raw&&typeof raw==="object"&&!Array.isArray(raw)&&typeof raw.note==="string") return raw.note;
  return "";
}

function slugish(s){

  }
  return String(s||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
}

function iconForCat(name){

/* Pulls [{category,name,description,price,extras}] rows out of any of the
   JSON shapes the directory ships (KFC/Nando's/etc grouped menus, the Game
   Reserve's menus|sections, Zen Cafe's food_menu/bar_menu, the demo file). */
function catRowsOf(payload){
  const out=[];
  function push(cat,note,items){if(items&&items.length)out.push({cat:cat||"Menu",note:note||"",items:items});}
  function groupFlat(arr,fallback){
    if(!Array.isArray(arr)||!arr.length)return;
    const byCat={};
    arr.forEach(function(g){
      if(!g||typeof g!=="object")return;
      const cat=g.category||fallback;
      (byCat[cat]=byCat[cat]||[]).push(g);
    });
    Object.keys(byCat).forEach(function(cat){push(cat,"",byCat[cat]);});
  }
  const menu=payload.menu;
  if(Array.isArray(menu)){
    const structured=menu.every(function(g){return g&&(Array.isArray(g.items)||Array.isArray(g.subcategories));});
    if(structured){
      menu.forEach(function(g){
        if(Array.isArray(g.items))push(g.category||g.name,g.note||"",g.items);
        if(Array.isArray(g.subcategories))g.subcategories.forEach(function(sc){
          if(sc&&Array.isArray(sc.items))push(sc.name||g.category,(sc&&sc.note)||"",sc.items);
        });
      });
    }else{
      groupFlat(menu,"Menu");
    }
  }
  const menus=payload.menus;
  if(menus&&typeof menus==="object"){
    Object.keys(menus).forEach(function(k){
      const m=menus[k];
      if(!m||typeof m!=="object")return;
      const label=m.category||capitalize(pickText(k).replace(/[_-]+/g," "))||"Menu";
      if(Array.isArray(m.sections))m.sections.forEach(function(s){push((s&&s.section)||label,s&&s.note,s&&s.items||[]);});
      else if(Array.isArray(m.items))push(label,m&&m.note,m.items);
    });
  }
  if(Array.isArray(payload.food_menu))groupFlat(payload.food_menu,"Food & Coffee");
  if(Array.isArray(payload.bar_menu))groupFlat(payload.bar_menu,"Bar & Cocktails");
  return out;
}
function capitalize(s){return s.replace(/\b\w/g,function(c){return c.toUpperCase();});}

/* price -> number | [[label,price,happyHourPrice],...] | null */
function importedPrice(item){
  if(Array.isArray(item.variants)&&item.variants.length){
    const arr=[];
    item.variants.forEach(function(v){
      if(!v||typeof v!=="object")return;
      const p=money(v.price);
      if(p===null)return;
      arr.push([pickText(v.name)||null,p,money(v.happy_hour_price)]);
    });
    return arr.length?arr:null;
  }
  if(Array.isArray(item.options)&&item.options.length){
    const arr=[];
    const firstHasPrice=item.options.some(function(o){return o&&typeof o==="object"&&o.price!==undefined&&o.price!==null;});
    item.options.forEach(function(o,i){
      if(typeof o==="string"){
        const p=money(item.price);
        if(p!==null)arr.push([o,p,null]);
      }else if(o&&typeof o==="object"){
        const p=money(firstHasPrice?o.price:item.price);
        if(p!==null)arr.push([pickText(o.name||o.item||o.variant||o.protein)||null,p,money(o.happy_hour_price)]);
      }else{
        const p=money(item.price);
        if(p!==null)arr.push(["Option "+(i+1),p,null]);
      }
    });
    return arr.length?arr:null;
  }
  let base=item.price;
  if(base===undefined||base===null)base=item.price_token;
  const p=money(base);
  if(p===null)return null;
  return [[null,p,money(item.happy_hour_price)]];
}
function importedExtras(item){
  const src=Array.isArray(item.extras)?item.extras
    :Array.isArray(item.add_ons)?item.add_ons
    :Array.isArray(item.addons)?item.addons:[];
  const out=[];
  src.forEach(function(a){
    if(!a)return;
    let label=a,price=item.price;
    if(typeof a==="object"){label=a.name||a.item;price=a.price;}
    const p=money(price);
    const s=pickText(label);
    if(s&&p!==null)out.push([s,p]);
  });
  const seen={};
  return out.filter(function(x){if(seen[x[0]])return false;seen[x[0]]=1;return true;});
}
function importedItem(raw){
  if(!raw||typeof raw!=="object")return null;
  const name=pickText(raw.name||raw.item||raw.title);
  if(!name)return null;
  const price=importedPrice(raw);
  if(!price||!price.length)return null;
  return {name:name,desc:pickText(raw.description||raw.desc||raw.details||raw.pricing),price:collapsePrice(price),extras:importedExtras(raw)};
}
function normaliseImported(payload){
  const rows=catRowsOf(payload);
  const usedCat={};
  const menu=[];
  let seq=0;
  rows.forEach(function(cr){
    const items=[];
    (cr.items||[]).forEach(function(raw){
      const it=importedItem(raw);
      if(it)items.push([++seq,it.name,it.desc,it.price,it.extras]);
    });
    if(!items.length)return;
    let base=slugish(cr.cat)||"menu";
    let catId=base,i=2;
    while(usedCat[catId]){catId=base+"-"+(i++);}
    usedCat[catId]=1;
    menu.push({id:catId,name:cr.cat,icon:iconForCat(cr.cat),note:cr.note||"",items:items});
  });
  return menu;
}

/* photo manifest lookup (assets/images/menu_images/<brand>/<slug>.jpg) */ 
function photoNormalize(s){
  return slugish(s).replace(/pcs?/g,"pc").replace(/pieces?/g,"pc").replace(/-+$/,"");

function indexImages(){
  EATOUTS_IMAGE_INDEX={};
  const mf=(window.DIRECTORY_DATA&&window.DIRECTORY_DATA.menuImages)||{};
  Object.keys(mf).forEach(function(key){
    const list=mf[key]||[];
    const byKey={};
    const normSet={};
    list.forEach(function(img){
      if(!img||!img.key)return;
      byKey[img.key]=img.path;
      normSet[photoNormalize(img.key)]=img.path;
    });
    EATOUTS_IMAGE_INDEX[key]={list:list,byKey:byKey,normSet:normSet,paths:list.map(function(i){return i&&i.path;})};
  });
}
function menuItemPhoto(itemName){
  const r=curRestaurant();
  if(!r)return null;
  const idx=EATOUTS_IMAGE_INDEX[brandKeyOf(r)];
  if(!idx||!idx.list.length)return null;
  const needle=photoNormalize(itemName);
  if(!needle)return null;
  if(idx.byKey[slugish(itemName)])return idx.byKey[slugish(itemName)];
  if(idx.normSet[needle])return idx.normSet[needle];
  for(let i=0;i<idx.list.length;i++){
    const k=photoNormalize(idx.list[i].key);
    if(k&&(k.indexOf(needle)>-1||needle.indexOf(k)>-1))return idx.list[i].path;
  }
  return null;
}

function menuCatThumb(cat){

  for(let i=0;i<cat.items.length;i++){

function loadMenus(payload){
  const files=(payload&&payload.menuFiles)||{};
  const raw=(payload&&payload.menusRaw)||window.EATOUTS_MENUS_RAW||null;
  const tasks=Object.keys(files).map(function(key){
    if(raw&&raw[key]){
      const m=normaliseImported(raw[key]);
      if(m.length)EATOUTS_MENUS[key]=m;
      return Promise.resolve();
    }
    return fetch(files[key])
      .then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json();})
      .then(function(data){const m=normaliseImported(data);if(m.length)EATOUTS_MENUS[key]=m;})
      .catch(function(e){console.warn("[EatOuts] menu '"+key+"' unavailable: "+e);});
  });
  if(raw&&raw._demo){
    const m=normaliseImported(raw._demo);
    if(m.length)EATOUTS_MENUS._demo=m;
  }else{
    tasks.push(fetch(DEMO_MENU_PATH)
      .then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json();})
      .then(function(data){const m=normaliseImported(data);if(m.length)EATOUTS_MENUS._demo=m;})
      .catch(function(e){console.warn("[EatOuts] demo menu unavailable: "+e);}));
  }
  return Promise.all(tasks);
}
function loadDirectoryMenus(onReady){
  if (window.DIRECTORY_RUNTIME_DATA) {
    const directory = window.DIRECTORY_RUNTIME_DATA;
    window.DIRECTORY_DATA=directory;
    if(window.EatoutsSeed&&typeof window.EatoutsSeed.mergeDirectory==="function"){
      DIRECTORY_MERGE_REPORT=window.EatoutsSeed.mergeDirectory(directory);
    }
    indexImages();
    loadMenus(directory).then(function(){
      DIRECTORY_LOADED=true;if(onReady)onReady();
    });
    return;
  }
  if(!window.fetch){if(onReady)onReady();return;}
  fetch(DIRECTORY_DATA_PATH)
    .then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json();})
    .then(function(directory){
      window.DIRECTORY_DATA=directory;
      if(window.EatoutsSeed&&typeof window.EatoutsSeed.mergeDirectory==="function"){
        DIRECTORY_MERGE_REPORT=window.EatoutsSeed.mergeDirectory(directory);
      }
      indexImages();
      return loadMenus(directory);
    })
    .then(function(){DIRECTORY_LOADED=true;if(onReady)onReady();})
    .catch(function(e){console.warn("[EatOuts] directory/menus unavailable: "+e);if(onReady)onReady();});
}

function poolSlice(list,seed){
  const out=[];
  if(!list||!list.length) return out;
  const n=list.length, off=hash(String(seed||""))%n, take=Math.max(3,Math.ceil(n/2));

];
function hash(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h);}
function artStyle(seed){const h=hash(seed);const p=PAL[h%PAL.length];const a=118+(h%96);return "background:linear-gradient("+a+"deg,"+p[0]+","+p[1]+");";}
function tile(seed,ico,cls){return '<div class="tile" style="'+artStyle(seed)+'"><span class="tile-ico '+(cls||"")+'">'+ico+'</span></div>';}

/* Per-venue WhatsApp routing (integration_file.txt step 8a / plan task A7):
   the venue being viewed wins; flagship CONFIG.whatsapp is the fallback. */
function resolveVenueWhatsapp(venue){
  const fallback=String(CONFIG.whatsapp||"").replace(/[^\d]/g,"");
  if(!venue)return fallback;
  /* a raw number (beverage orders route to a dedicated line) is used as-is */
  if(typeof venue==="string"||typeof venue==="number"){
    const raw=String(venue).replace(/[^\d]/g,"");
    return raw||fallback;
  }
  const direct=venue.whatsapp||venue.contactWhatsapp||"";
  if(direct)return String(direct).replace(/[^\d]/g,"");
  if(Array.isArray(venue.contacts)){
    const list=venue.contacts.filter(c=>c&&c.number!=null&&String(c.number).length&&c.active!==false);
    const wa=list.filter(c=>c.whatsapp)[0];
    const c=wa||list.filter(x=>x.primary)[0]||list[0];
    if(c){
      const cc=String(c.countryCode||"+267").replace(/[^\d]/g,"");
      const num=String(c.number).replace(/[^\d]/g,"");
      if(num)return cc+num;
    }
  }
  return fallback;
}

/* The cart is namespaced by restaurant id, so the same menu item id
   (all 133 restaurants share one template) can be in two carts at once. */
function activeRestId(){

}
function getMenuItem(id){const m=curMenu();for(const cat of m){for(const it of cat.items){if(it[0]===id)return {cat:cat.id,id:it[0],name:it[1],desc:it[2],price:it[3],extras:it[4]};}}return null;}
function variantPrice(v){const p=v[1];return (p!==null&&p!==undefined)?p:((v[2]!==null&&v[2]!==undefined)?v[2]:0);}
function itemSizes(it){
  /* accepts a normalised row object (getMenuItem) or a raw tuple [id,name,desc,price,extras] */
  const raw=Array.isArray(it)?it[3]:it.price;
  const v=Array.isArray(raw)?raw:[[null,raw]];
  return v.map(function(x){return [x[0],variantPrice(x),(x[2]===undefined?null:x[2])];});
}

function cartKey(itemId,sizeIdx){return "i"+activeRestId()+":"+itemId+"_"+sizeIdx;}

function cartLine(itemId,sizeIdx){

function cartTotal(){
  let t=0;
  cartKeys().forEach(k=>{
    const l=state.cart[k];if(!l.qty&&!Object.keys(l.extras||{}).length)return;
    const it=getMenuItem(l.itemId);if(!it)return;
    const sz=itemSizes(it)[l.sizeIdx];if(!sz)return;
    t+=sz[1]*l.qty;
    Object.keys(l.extras||{}).forEach(ei=>{
      const ex=it.extras[ei];if(!ex)return;
      t+=ex[1]*l.extras[ei];
    });
  });
  return t;
}
function cartCount(){let c=0;cartKeys().forEach(k=>{c+=(state.cart[k].qty||0);});return c;}
function clearEmptyCart(){Object.keys(state.cart).forEach(k=>{const l=state.cart[k];if(!l.qty&&!Object.keys(l.extras||{}).length) delete state.cart[k];});}

  const it=getMenuItem(itemId);const sz=itemSizes(it)[sizeIdx];if(!sz)return 0;
  let t=sz[1]*l.qty;

/* ================================================================
   SPLIT THE BILL
   Model: each cart line has `qty` units. The user assigns integer
   quantities to people; anything not assigned is "unassigned".
   The per-unit price includes the line's extras, averaged over its
   qty, so a person who takes 1 of 2 burgers pays half the bacon too.
   Names live only in this session — nothing about a person is stored.
   ================================================================ */
const SPLIT_COLORS=["#c2410c","#0369a1","#15803d","#7c3aed","#b91c1c","#a16207","#0f766e","#be185d"];
let _splitSeq=0;

function checkoutLines(){
  clearEmptyCart();
  const lines=[];
  cartKeys().forEach(function(k){
    const l=state.cart[k];if(!l.qty&&!Object.keys(l.extras||{}).length)return;
    const it=getMenuItem(l.itemId);if(!it)return;
    const sz=itemSizes(it)[l.sizeIdx];if(!sz)return;
    lines.push({key:k,itemId:l.itemId,sizeIdx:l.sizeIdx,it:it,name:it.name,
      size:sz[0]||null,price:sz[1],qty:l.qty,extras:l.extras||{},total:cartLineTotal(l.itemId,l.sizeIdx)});
  });
  return lines;
}

function addSplitPerson(name){
