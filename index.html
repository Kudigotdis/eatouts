<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>EatOuts</title>
<link rel="icon" type="image/png" href="assets/logo/EatOuts_Badge.png">
<link rel="apple-touch-icon" href="assets/logo/EatOuts_Badge.png">
<style>
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* Fallback so .fpop-scrim's clip-path stays valid before the first measurement
   (and if the observer never runs): a 0px bottom inset just means the blur
   reaches the screen edge. Layout never depends on this value. */
:root{--navh:0px}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#f0ece2}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;color:#1a1a1a;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
::-webkit-scrollbar{width:0;height:0;display:none}
*{scrollbar-width:none;-ms-overflow-style:none}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;text-align:left}
img{display:block;max-width:100%}

#shell{position:fixed;inset:0;max-width:460px;margin:0 auto;display:flex;flex-direction:column;background:#ffffff;box-shadow:0 0 80px rgba(0,0,0,.08);overflow:hidden}
@media(min-width:520px){#shell{border-left:1px solid #e8e3d8;border-right:1px solid #e8e3d8}}

/* ---------- HEADER (WHITE) ---------- */
/* z-index 58 keeps the header above .fpop-scrim (55) so it is never blurred,
   while staying below .fpop (60) so an open menu still overlays it. */
#hdr{flex:0 0 auto;height:58px;display:flex;align-items:center;gap:10px;padding:0 14px;background:#ffffff;border-bottom:1px solid #ece7db;position:relative;z-index:58;padding-top:env(safe-area-inset-top)}
#hdr.hide{display:none}
/* Promos feed focus mode: while an accordion e-card is open on the Promos
   feed, drop the top header, the sticky week calendar and the bottom nav so
   the open card fills the screen. Toggled by applyPromoFocus() on #shell. */
#shell.promos-tab.promo-focus #hdr,#shell.promos-tab.promo-focus #nav,
#shell.promos-tab.promo-focus #cbar,#shell.promos-tab.promo-focus #filter-bar,
#shell.promos-tab.promo-focus .cal{display:none}
.brand-mark{height:34px;width:auto;aspect-ratio:1172/504;flex:0 0 auto;display:flex;align-items:center;justify-content:flex-start;background:none;border:0;border-radius:0;box-shadow:none;overflow:hidden}
.brand-mark img{width:100%;height:100%;object-fit:contain;display:block}
.hdr-right{margin-left:auto}
.hdr-chip{font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#a89a7e;border:1px solid #ece7db;border-radius:20px;padding:4px 9px;background:#faf8f2}

/* ---------- VIEWPORT (WHITE) ---------- */
#viewport{flex:1 1 auto;position:relative;overflow:hidden;background:#ffffff}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:#ffffff;color:#1a1a1a}
.screen.anim{animation:sl .18s ease}
@keyframes sl{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}
.scroll{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:#ffffff}

/* ---------- BOTTOM NAV (BLACK, WHITE ICONS, NO TEXT) ---------- */
/* position:relative is load-bearing: without it the element is static and
   z-index is inert, so the nav could never sit above .fpop-scrim. */
#nav{flex:0 0 auto;position:relative;display:flex;background:#0a0a0a;border-top:1px solid #1a1a1a;padding-bottom:env(safe-area-inset-bottom);z-index:50}
.nav-btn{flex:1;padding:16px 2px 15px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.42);transition:color .18s}
.nav-btn svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;transition:transform .18s}
.nav-btn.on{color:#ffffff}
.nav-btn.on svg{transform:translateY(-1px);filter:drop-shadow(0 0 8px rgba(255,255,255,.35))}
.nav-btn:active{color:rgba(255,255,255,.75)}

/* ---------- CONTROL BAR ---------- */
#cbar{flex:0 0 auto;display:none;background:#ffffff;border-top:1px solid #ece7db;position:relative}
#cbar.on{display:block}

/* ---------- FLOATING FILTER POPUP (lightweight overlay) ---------- */
/* Frosted backdrop for all 5 picker popups. The scrim sits above page content
   but below .fpop (60) and .pfbtn (56), so the menu and its trigger stay sharp.
   -webkit- prefix is required: Safari ignores the unprefixed form entirely.

   clip-path confines the *paint* to the app column and to the band between
   header and nav, so the header, the bottom nav and the grey gutters either
   side of #shell stay crisp. It does NOT shrink the element's hit area, so
   tap-to-dismiss still works anywhere on screen.

   Insets: 58px clears #hdr (height:58px); the horizontal max(0px,...) pair
   tracks #shell's max-width:460px (keep those two in sync); var(--navh) is
   measured at runtime because it varies with env(safe-area-inset-bottom). */
.fpop-scrim{position:fixed;inset:0;z-index:55;background:rgba(20,18,12,.28);backdrop-filter:blur(10px) saturate(1.2);-webkit-backdrop-filter:blur(10px) saturate(1.2);clip-path:inset(58px max(0px,calc((100% - 460px)/2)) var(--navh) max(0px,calc((100% - 460px)/2)))}
.fpop{position:absolute;left:8px;right:8px;bottom:calc(100% + 8px);background:#ffffff;border:1px solid #ece7db;border-radius:14px;box-shadow:0 -6px 26px -6px rgba(0,0,0,.2);overflow:hidden;z-index:60;animation:fpop .18s ease}
@keyframes fpop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fpop button{display:block;width:100%;padding:12px 14px;font-size:12.5px;font-weight:700;color:#3a3324;border-bottom:1px solid #f4efe4;text-align:left}
.fpop button:last-child{border-bottom:0}
.fpop button:active{background:#faf8f2}
.fpop button.on{color:#1a1a1a;font-weight:900;background:#f2f1ee}

/* ---------- COMMON ---------- */
.pad{padding:14px}
.subh{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#a89a7e;font-weight:800;margin:0 0 9px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 15px;border-radius:11px;font-size:12.5px;font-weight:800;background:#f7f4ec;border:1px solid #ece7db;color:#3a3324;letter-spacing:.02em;transition:background .15s}
.btn:active{background:#efe9da}
.btn.primary{background:#0d0d0d;border-color:#0d0d0d;color:#ffffff}
.btn.primary:active{background:#000000}
.btn.wa{background:#dff5e4;border-color:#b8e6c1;color:#1c6b2e}
.btn.wa:active{background:#c9ecd0}
.btn.full{width:100%}
.btn.half{flex:1}
.btn.sm{padding:8px 12px;font-size:11.5px;border-radius:9px}
.btn.ghost{background:transparent;border-color:#e2dccd;color:#6f6754}

/* ---------- ART TILES ---------- */
.tile{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
.tile-ico{font-size:26px;opacity:.55;filter:saturate(.75)}
.tile-ico.lg{font-size:52px;opacity:.42}

/* ---------- CALENDAR (STICKY) ---------- */
.cal{flex:0 0 auto;background:#ffffff;border-bottom:1px solid #ece7db;padding:11px 0 10px;position:relative;z-index:5;box-shadow:0 4px 10px -8px rgba(0,0,0,.12)}
.cal-title{padding:0 16px 10px;font-size:10px;letter-spacing:.17em;text-transform:uppercase;color:#a89a7e;font-weight:800}
.cal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;padding:0 16px;width:100%;box-sizing:border-box;overflow:visible}
.day{width:100%;height:56px;min-width:0;border-radius:14px;border:1px solid #ece7db;background:#faf8f2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:#a89a7e;transition:all .16s;padding:0}
.day b{font-size:9.5px;font-weight:800;letter-spacing:.09em}
.day span{font-size:15px;font-weight:900;color:#3a3324}
.day.on{background:#0d0d0d;border-color:#0d0d0d;color:#ffffff}
.day.on span{color:#ffffff}
.day.td:not(.on){border-color:#1a1a1a}

/* ---------- PROMO CARD (ACCORDION, IMAGE-ONLY) ---------- */
.pcard{margin:12px 14px;border-radius:16px;overflow:hidden;background:#ffffff;border:1px solid #ece7db;box-shadow:0 2px 8px -4px rgba(0,0,0,.06)}
.pimg{position:relative;aspect-ratio:16/10;display:block;width:100%;padding:0;overflow:hidden;border:0}
.pimg .tile{position:absolute;inset:0}
.pimg .tile-ico{font-size:48px;opacity:.28}
.pimg>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.pbody{padding:14px;border-top:1px solid #f1ece1;background:#ffffff}
@keyframes fd{from{opacity:0}to{opacity:1}}
.phead-btn{display:block;width:100%;padding:0;margin:0 0 10px}
.phead-btn h3{margin:0 0 6px;font-size:17px;font-weight:900;color:#1a1a1a;line-height:1.2;letter-spacing:-.01em}
.pprice{font-size:15px;font-weight:900;color:#1a1a1a;letter-spacing:-.01em}
.pprice .pwas{font-size:11.5px;font-weight:700;color:#b5a888;text-decoration:line-through;margin-left:6px;letter-spacing:0}
.phl{margin:0;padding:0;list-style:none}
.phl li{font-size:12px;color:#5c5547;line-height:1.5;padding:7px 0 7px 14px;position:relative;border-bottom:1px solid #f4efe4}
.phl li:last-child{border-bottom:0}
.phl li::before{content:"";position:absolute;left:0;top:14px;width:5px;height:5px;border-radius:50%;background:#1a1a1a}

/* ---------- EVENT CARD (ACCORDION) ---------- */
.ecard{margin:12px 14px;border-radius:16px;overflow:hidden;background:#ffffff;border:1px solid #ece7db;box-shadow:0 2px 8px -4px rgba(0,0,0,.06)}
/* image drives card height: full width, full height, nothing cropped */
.ecard .pimg{aspect-ratio:auto;display:block}
.ecard .pimg>img{position:relative;inset:auto;width:100%;height:auto;object-fit:cover;display:block}

/* ---------- ACCORDION (smooth collapse/expand) ---------- */
.acc-wrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s cubic-bezier(.4,0,.2,1)}
.acc-wrap>.acc-in{overflow:hidden;min-height:0}
.ecard.open>.acc-wrap,.mitem.open>.acc-wrap,.ritem.open>.acc-wrap{grid-template-rows:1fr}
@media (prefers-reduced-motion:reduce){.acc-wrap{transition:none}.screen.anim{animation:none}.fpop{animation:none}#filter-bar.on{animation:none}.fpop-scrim{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(20,18,12,.42)}}

/* ---------- COUNTERS ---------- */
.ctr{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:#faf8f2;border:1px solid #f1ece1;border-radius:12px;margin-bottom:7px}
.ctr .lbl{font-size:12.5px;font-weight:700;color:#3a3324;display:flex;flex-direction:column}
.ctr .lbl em{font-style:normal;font-size:10px;color:#a89a7e;font-weight:600;letter-spacing:.03em;margin-top:2px}
.stp{display:flex;align-items:center;border:1px solid #e2dcc9;border-radius:10px;overflow:hidden;background:#ffffff}
.stp button{width:34px;height:32px;font-size:16px;font-weight:800;color:#1a1a1a;display:flex;align-items:center;justify-content:center}
.stp button:active{background:#f4efe4}
.stp .val{min-width:30px;text-align:center;font-size:13.5px;font-weight:900;color:#1a1a1a;padding:0 3px}

.tbar{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;margin:12px 0;border-radius:13px;background:#f4f4f2;border:1px solid #e4e4e0}
.tbar .tl{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:#1a1a1a;font-weight:800}
.tbar .tv{font-size:19px;font-weight:900;color:#1a1a1a;letter-spacing:-.01em}

/* ---------- MENU ---------- */
.cat-row{display:flex;align-items:center;gap:13px;padding:15px 16px;border-bottom:1px solid #f1ece1;background:#ffffff;width:100%}
.cat-row:active{background:#faf8f2}
.cat-ico{width:44px;height:44px;flex:0 0 auto;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;border:1px solid #f1ece1;overflow:hidden}
.cat-ico img{width:100%;height:100%;object-fit:cover;display:block;border-radius:0}
.cat-name{font-size:14.5px;font-weight:800;color:#1a1a1a;letter-spacing:.01em}
.cat-meta{font-size:10.5px;color:#a89a7e;margin-top:2px;letter-spacing:.03em;font-weight:600}

.mitem{border-bottom:1px solid #f1ece1;background:#ffffff}
.mrow{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%}
.mrow:active{background:#faf8f2}
.mthumb{width:54px;height:54px;flex:0 0 auto;border-radius:6px;overflow:hidden;border:1px solid #ece7db;position:relative}
.mthumb .tile-ico{font-size:22px}
.mthumb>img{width:100%;height:100%;object-fit:cover;display:block}
.minfo{flex:1;min-width:0}
.mtitle{font-size:13.5px;font-weight:800;color:#1a1a1a;line-height:1.28}
.mprice{font-size:12.5px;font-weight:900;color:#1a1a1a;margin-top:3px;letter-spacing:.01em}
.mbody{padding:0 14px 15px;animation:fd .2s ease;background:#faf8f2;border-top:1px solid #f1ece1}
.mdesc{font-size:12px;color:#5c5547;line-height:1.55;margin:12px 0 12px}
/* 3-up paging: each thumb is (100% - 2 gaps)/3 so exactly three fit,
   and mandatory snapping always lands on a clean group of three. */
.thumbs{display:flex;gap:7px;overflow-x:auto;padding-bottom:3px;margin-bottom:13px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.thumbs .th{flex:0 0 auto;width:calc((100% - 14px)/3);height:auto;aspect-ratio:1/1;border-radius:6px;overflow:hidden;border:1px solid #ece7db;position:relative;scroll-snap-align:start;scroll-snap-stop:always}
.thumbs .th .tile-ico{font-size:26px}
.thumbs .th>img{width:100%;height:100%;object-fit:cover;display:block}
/* Menu photo preview (lightbox): blurred backdrop, image centred with
   equal gaps on both sides so it sits away from the screen edges. */
.preview-layer{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;padding:10vh 8vw;background:rgba(20,18,12,.6);backdrop-filter:blur(18px) saturate(1.1);-webkit-backdrop-filter:blur(18px) saturate(1.1);animation:fd .18s ease}
.preview-layer .preview-img{max-width:100%;max-height:100%;border-radius:10px;box-shadow:0 18px 50px rgba(0,0,0,.55);object-fit:contain}
.preview-close{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;font-size:19px;line-height:1;padding:0}

/* ---------- CHECKOUT ---------- */
.cbwrap{flex:0 0 auto;border-top:1px solid #ece7db;background:#ffffff}
.cbar{display:flex;align-items:center;gap:12px;padding:11px 14px}
.cbtot{flex:1;display:flex;flex-direction:column}
.cbtot span{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:#a89a7e;font-weight:800}
.cbtot b{font-size:17px;font-weight:900;color:#1a1a1a}
.cbbtn{padding:13px 24px;border-radius:12px;font-size:12.5px;font-weight:900;letter-spacing:.04em;background:#0d0d0d;color:#ffffff}
.cbbtn:active{background:#000000}
.cbbtn[disabled]{opacity:.35}

/* cart summary strip: whole left block is a tap target for checkout */
.cbtot{flex:1;display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:4px 0;border-radius:8px;transition:opacity .15s}
button.cbtot{cursor:pointer;-webkit-tap-highlight-color:transparent}
button.cbtot:active{opacity:.55}
button.cbtot[disabled]{opacity:.4;cursor:default}

/* ---------- CHECKOUT SUMMARY ---------- */
.co-item{border:1px solid #f1ece1;border-radius:12px;background:#ffffff;margin-bottom:8px;overflow:hidden}
.co-row{display:flex;align-items:center;gap:10px;padding:9px 10px;background:#faf8f2}
.co-main{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
.co-main:active{opacity:.6}
.co-thumb{width:52px;height:52px;flex:0 0 auto;border-radius:7px;overflow:hidden;border:1px solid #ece7db;background:#f3efe4}
.co-thumb>img{width:100%;height:100%;object-fit:cover;display:block}
.co-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.co-name{font-size:12.5px;font-weight:800;color:#1a1a1a;line-height:1.3}
.co-name em{font-style:normal;font-weight:700;color:#1a1a1a}
.co-sub{font-size:10.5px;color:#1a1a1a;font-weight:800}
.co-meta{font-size:10px;color:#a89a7e;font-weight:700}
.co-edit{font-size:9.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:#1a1a1a;flex:0 0 auto}
.co-step{flex:0 0 auto}
.co-open{border-top:1px solid #f1ece1;padding:11px 12px;background:#ffffff}
.co-desc{margin:0 0 10px;font-size:11.5px;line-height:1.55;color:#5c5546}
.co-ex{margin-bottom:6px}
.co-exsum{font-size:10.5px;color:#8a8170;padding:2px 0 6px}
.co-none{font-size:10.5px;color:#a89a7e;font-weight:700;padding:2px 0}
.co-foot{display:flex;justify-content:space-between;align-items:center;font-size:9.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:#a89a7e;margin-top:10px;padding-top:9px;border-top:1px solid #f4efe4}
.co-foot b{font-size:13px;letter-spacing:-.01em;color:#1a1a1a}

/* ---------- FORMS ---------- */
.fld{margin-bottom:11px}
.fld label{display:block;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:#a89a7e;font-weight:800;margin-bottom:6px}
.fld input,.fld textarea{width:100%;padding:12px 13px;background:#faf8f2;border:1px solid #ece7db;border-radius:11px;color:#1a1a1a;font-size:13px;outline:none;transition:border-color .16s}
.fld input:focus,.fld textarea:focus{border-color:#1a1a1a;background:#ffffff}
.fld textarea{resize:none;min-height:76px;line-height:1.5}

/* ---------- LISTS ---------- */
.lrow{display:flex;align-items:center;gap:11px;padding:15px 16px;border-bottom:1px solid #f1ece1;background:#ffffff;width:100%}
.lrow:active{background:#faf8f2}
.lrow .ln{font-size:13.5px;font-weight:700;color:#1a1a1a;flex:1}
.lrow .lc{font-size:11px;color:#a89a7e;font-weight:700}

/* ---------- GALLERY ---------- */
.gal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:0 0 2px;background:#ffffff}
.gal-cell{position:relative;aspect-ratio:1;overflow:hidden;background:#f4efe4;border:0;padding:0;display:block}
.gal-cell .tile-ico{font-size:30px}
.gal-cell>img{width:100%;height:100%;object-fit:cover;display:block}

/* ---------- CONTROL BAR (GALLERY) ---------- */
.cbar2{display:flex;align-items:center;gap:8px;padding:10px 12px}
.cbtn{font-size:12px;font-weight:800;letter-spacing:.03em;color:#3a3324;padding:9px 15px;border-radius:10px;background:#faf8f2;border:1px solid #ece7db}
.cbtn:active{background:#f4efe4}
.cbtn.ic{padding:9px 11px;display:flex;align-items:center;justify-content:center;background:#0a0a0a;border-color:#0a0a0a;color:#ffffff}
.cbtn.ic svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.cbtn.ic:active{background:#222}
.cbtn.ic.on{background:#0a0a0a;border-color:#0a0a0a;color:#ffffff}
.csearch{flex:1;display:flex;align-items:center;gap:8px;background:#faf8f2;border:1px solid #ece7db;border-radius:10px;padding:0 12px}
.csearch input{flex:1;background:none;border:0;outline:none;padding:10px 0;font-size:13px;color:#1a1a1a}
.csearch input::placeholder{color:#b5a888}
.rest-filter-row{display:flex;gap:8px;padding:0 12px 8px}
.rest-filter-row .cbtn{flex:1;min-width:0;overflow:hidden;text-align:left;text-overflow:ellipsis;white-space:nowrap}
/* Town row: centred label with comfortable clearance above (overrides the
   .cbar2+.rest-filter-row padding stack so the button isn't cramped). */
.rest-filter-row.town-row{padding:14px 12px 12px}
.rest-filter-row.town-row .cbtn{text-align:center}
.rest-type-pop{left:8px;right:8px;width:auto;max-width:none;max-height:min(70vh,620px);padding:0;display:flex;flex-direction:column}
.rest-type-top{flex:0 0 auto;padding:10px;background:#fff;border-bottom:1px solid #ece7db}
.rest-type-top .csearch{min-height:38px}
.rest-type-status{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:8px;font-size:11px;font-weight:800;color:#645b48}
.rest-type-status span,.rest-type-status button{flex:0 0 auto;white-space:nowrap}
.rest-type-status button{width:auto}
.rest-type-status button,.rest-type-footer button{font-size:11px;font-weight:800;color:#3a3324;padding:8px 12px;border:1px solid #ece7db;border-radius:8px;background:#faf8f2}
.rest-type-options{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.rest-type-group-title{padding:10px 14px 7px;background:#f7f6f3;color:#817766;font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}
.rest-type-subgroup-title{padding:9px 14px 4px;color:#645b48;font-size:10px;font-weight:900}
.rest-type-option{display:flex;align-items:center;gap:10px;width:100%;padding:10px 14px;border-bottom:1px solid #f4efe4;text-align:left;font-size:12px;font-weight:700;color:#3a3324;cursor:pointer}
.rest-type-option input{flex:0 0 18px;width:18px;height:18px;margin:0;accent-color:#1a1a1a}
.rest-type-option .rest-type-count{margin-left:auto}
.rest-type-footer{flex:0 0 auto;display:flex;justify-content:space-between;gap:8px;padding:10px;background:#fff;border-top:1px solid #ece7db}
.rest-type-footer .apply{background:#1a1a1a;border-color:#1a1a1a;color:#fff}
.rest-type-note,.rest-type-empty{padding:12px 14px;color:#817766;font-size:11px;line-height:1.45}

/* ---------- SWIPER ---------- */
.swiper{display:flex;flex-direction:column;flex:1 1 0%;min-height:0;overflow-y:auto;overflow-x:hidden;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.swiper>.slide{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;height:100%;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.swiper>.slide .tile{position:absolute;inset:0}
.swiper>.slide>img{position:relative;z-index:1;width:100%;height:100%;object-fit:contain;display:block}
.dots{display:flex;gap:5px;justify-content:center;padding:10px 0;flex:0 0 auto;z-index:5}
.dots i{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.22);display:block}
.dots i.on{background:#1a1a1a;width:16px;border-radius:3px}

/* ---------- ABOUT ---------- */
.about-hero{padding:26px 18px 20px;background:#ffffff;border-bottom:1px solid #ece7db}
.about-hero h2{margin:0 0 6px;font-size:21px;font-weight:900;letter-spacing:-.015em;color:#1a1a1a}
.about-hero p{margin:0;font-size:12px;color:#8a8170;letter-spacing:.02em}
.about-logo{display:block;width:76%;max-width:290px;height:auto;max-height:150px;object-fit:contain;margin:0 auto 18px;border:0;box-shadow:none;background:none}
.kv{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #f4efe4}
.kv .k{font-size:11.5px;color:#a89a7e;font-weight:700}
.kv .v{font-size:11.5px;color:#3a3324;font-weight:700;text-align:right}
/* ---------- ABOUT: stacked centred blocks ---------- */
.about-sec{margin:26px 0 4px;font-size:12px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:#8a8170;text-align:center}
.about-sec::after{content:"";display:block;width:34px;height:2px;border-radius:2px;background:#1a1a1a;margin:9px auto 0}
.ablock{padding:15px 2px;border-bottom:1px solid #f4efe4;text-align:center}
.ablock:last-child{border-bottom:0}
.ablock .abh{font-size:11px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:#a89a7e;margin:0 0 6px}
.ablock .abv{font-size:13px;font-weight:600;line-height:1.55;color:#26221a;margin:0}
.legal-sec{font-size:13px;font-weight:700;letter-spacing:.03em;color:#1a1a1a;margin:18px 0 4px}
.legal-para{font-size:13px;color:#3a3a3a;margin:0 0 8px;line-height:1.5}
/* ---------- FEATURE PILLS ---------- */
/* .tagwrap stays left-aligned: it is shared with the venue and
   restaurant-about tag rows. Opt into centring with .center. */
.tagwrap{display:flex;flex-wrap:wrap;gap:6px;padding-top:4px}
.tagwrap.center{justify-content:center}
.chip{font-size:10px;font-weight:800;letter-spacing:.05em;padding:5px 10px;border-radius:20px;background:#faf8f2;border:1px solid #ece7db;color:#5c5547}
.chip.pill{font-size:11px;font-weight:700;letter-spacing:.02em;padding:7px 14px;border-radius:999px}
.chip.g{background:rgba(26,26,26,.06);border-color:rgba(26,26,26,.18);color:#1a1a1a}

/* ---------- SOCIAL ICON ROW ----------
   Bare icons only: the PNGs carry their own brand disc, so the anchor
   stays a plain hit area (no border/background/radius). Every row is a
   fixed 370px = 5 slots of 70px + 4 gaps of 5px on line one, which is
   exactly what drops a 6th icon onto the second (centred) line. An
   icon with no destination yet renders its _Off glyph, not a link. */
.social-row{display:flex;flex-wrap:wrap;gap:5px;width:370px;max-width:100%;margin:16px auto 4px;justify-content:center;align-items:center}
.social-ico{flex:0 0 auto;width:70px;height:70px;display:flex;align-items:center;justify-content:center;padding:8px;border:none;border-radius:0;background:transparent;box-shadow:none;text-decoration:none;-webkit-tap-highlight-color:transparent}
.social-ico:active{opacity:.65}
.social-ico img{width:100%;height:100%;object-fit:contain;display:block}
.social-ico.off{pointer-events:none;cursor:default}

/* ---------- CRUMB ---------- */
.crumb{display:flex;align-items:center;gap:8px;padding:12px 16px 10px;flex-wrap:wrap;background:#ffffff}
.crumb button{font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:#a89a7e;padding:4px 0}
.crumb button:active{color:#1a1a1a}
.crumb .sep{color:#e2dcc9;font-size:10px}
.crumb .cur{font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:#1a1a1a}
.phead{padding:4px 16px 16px}
.phead h2{margin:0 0 4px;font-size:19px;font-weight:900;letter-spacing:-.01em;color:#1a1a1a}
.phead p{margin:0;font-size:11.5px;color:#a89a7e;line-height:1.5}
.empty{padding:44px 20px;text-align:center;color:#a89a7e;font-size:12.5px;line-height:1.6}

/* ---------- PROMO FILTER BAR (rises above nav) ---------- */
#filter-bar{flex:0 0 auto;background:#ffffff;border-top:1px solid #ece7db;position:relative;display:none}
#filter-bar.on{display:block;animation:pfrise .22s ease}
@keyframes pfrise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.pfbar{display:flex;flex-direction:column;gap:8px;padding:10px 12px;position:relative}
.pfrow{display:flex;gap:8px}
.pfbtn{flex:1 1 0;display:flex;align-items:center;gap:6px;padding:10px 12px;background:#faf8f2;border:1px solid #ece7db;border-radius:10px;font-size:12px;font-weight:800;color:#3a3324;cursor:pointer;min-width:0;text-align:left;transition:background .15s;position:relative;z-index:56}
.pfbtn:active{background:#f4efe4}
.pfbtn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.02em}
.pfbtn.pf-town{flex:1 1 100%;justify-content:center;text-align:center}
.pfbtn.pf-area{justify-content:flex-start;text-align:left}
.pfbtn.pf-type{justify-content:flex-end;text-align:right}
.pfbtn[disabled]{opacity:.45;cursor:default}
.pfbtn[disabled]:active{background:#faf8f2}
.fpop{max-height:min(60vh,520px);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.fpop.town-pop{left:8px;right:8px;width:auto}
/* area/type popups must match the base .fpop insets so they sit symmetric
   within #cbar instead of hugging one edge at a 300px cap */
.fpop.area-pop{left:8px;right:8px;width:auto;max-width:none}
.fpop.type-pop{left:8px;right:8px;width:auto;max-width:none}
/* .fpop prefix is load-bearing: plain .loc-* is (0,1,0) and loses to
   .fpop button's (0,1,0)+type, so the rows would fall back to display:block
   and space-between would never push the count pill to the right edge. */
.fpop .loc-all,.fpop .loc-town-main,.fpop .loc-area-option{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left}
.fpop .loc-all{position:sticky;top:0;z-index:2;background:#fff;font-weight:900}
.loc-district{padding:10px 14px 6px;background:#f7f6f3;color:#817766;font-size:10px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}
.fpop .loc-town-main{padding:11px 14px}
.loc-town-main .lbl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px;font-weight:700;color:#3a3324}
.loc-count{flex:0 0 auto;min-width:26px;padding:3px 7px;border-radius:12px;background:#f3efe4;color:#645b48;font-size:10px;font-weight:900;text-align:center}
/* min-width:0 lets these flex items shrink below content width; without it
   min-width:auto keeps a long area name at full width and shoves the count
   pill off the row. Matches the .lbl guards the town rows already had. */
.fpop .loc-area-option>span:first-child,.fpop .loc-all>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fpop .loc-area-option{padding:11px 14px;border:0;background:transparent;font-size:11px}
.fpop .loc-area-option.on{background:#fdf9ef}
.fpop-note{padding:12px 14px;font-size:11px;color:#a89a7e}

/* ---------- RESTAURANT LIST (Restaurants tab) ---------- */
/* .ritem wraps the row + its options so the options can live OUTSIDE the
   row button (interactive content inside a <button> is invalid) and still
   animate via the shared .acc-wrap grid-rows transition. */
.ritem{background:#ffffff}
.ritem.open>.rrow{background:#efe9db;border-bottom-color:#e2dbc9}
.rrow{display:flex;align-items:center;gap:13px;padding:12px 14px;background:#ffffff;border-bottom:1px solid #f1ece1;width:100%;cursor:pointer;text-align:left}
.rrow:active{background:#faf8f2}
/* Layout box only. The square itself is painted by the injected
   .eo-thumb styles (js/eatouts-brand.js) so there is a single border
   and the colour fills the whole tile instead of hugging the letter. */
.rthumb{width:56px;height:56px;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.rthumb .eo-thumb{width:56px;height:56px}
.rinfo{flex:1;min-width:0}
/* Business title: bold serif, deep charcoal. Georgia-first because the app
   ships no font files and runs offline from localhost. */
.rname{font-family:Georgia,'Times New Roman',Times,serif;font-size:15px;font-weight:700;color:#141414;line-height:1.3;letter-spacing:0}
/* Metadata: lighter, neutral sans so the serif name stays the focal point */
.rmeta{font-size:11px;color:#8e8e8e;font-weight:500;margin-top:3px;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Badges: bold sans inside soft neutral pills. font-family is pinned because
   these render inside .rname, which is now serif. */
.rnew,.rflag{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#1a1a1a;background:#f2f2f0;border:1px solid #e2e2df;border-radius:20px;padding:3px 8px;flex:0 0 auto}
.rnew{margin-left:8px}
.rflag{margin-left:6px;letter-spacing:.1em}

/* no cuisine group headers: the list is one flat filtered column */

/* ---------- RESTAURANT 4-OPTION DROPDOWN ---------- */
/* No fd animation here: the .acc-wrap height transition owns the motion,
   and replaying a fade on freshly inserted markup is what made the old
   dropdown flash open/close. */
.ropts{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 14px;background:#efe9db;border-bottom:1px solid #e2dbc9}
.ropt{padding:11px 12px;background:#ffffff;border:1px solid #ece7db;border-radius:12px;font-size:12.5px;font-weight:800;color:#3a3324;text-align:center;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .15s}
/* location strip inside a restaurant's options panel: the town + area filter
   buttons occupy the top line of the grid, the Menu/Promos actions the second.
   "Also known as" surfaces a branch whose real name differs from the brand. */
.ropts-loc-name{grid-column:1/-1;font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#a89a7e;padding:0 2px}
.ropts .cbtn,.ropts .cbtn-area{min-width:0;overflow:hidden;text-align:center;text-overflow:ellipsis;white-space:nowrap;background:#fff}
.ropts .cbtn-area{font-size:12px;font-weight:800;letter-spacing:.03em;color:#3a3324;padding:9px 15px;border-radius:10px;border:1px solid #ece7db}
.ropts .cbtn-area:active{background:#f4efe4}
/* Per-restaurant branch picker: fixed so it floats over the list like the
   promo popups, but anchored above the nav instead of a trigger row. */
.rest-loc-pop{position:fixed;left:8px;right:8px;bottom:calc(var(--navh) + 14px);width:auto;max-width:none}
/* Inactive Menu/Promos actions: greyed but still tappable so a notice can
   explain why (choose a location / no promos here). */
.ropt.off{opacity:.4}
.ropt.off:active{background:#ffffff;border-color:#ece7db;transform:none}
/* Floating notice for an inactive action (e.g. "select a location first"). */
.rest-notice{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--navh) + 18px);z-index:66;max-width:min(92%,420px);background:#1a1a1a;color:#fff;font-size:12px;font-weight:700;line-height:1.4;padding:11px 15px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.32);text-align:center;animation:fpop .18s ease}
.ropt:active{background:#f4efe4;border-color:#1a1a1a;transform:translateY(1px)}
.ropt em{font-style:normal;font-size:9px;color:#a89a7e;font-weight:800;letter-spacing:.08em;text-transform:uppercase;flex:0 0 auto}

/* ---------- RESTAURANT PROMOS GRID (2-col) ---------- */
.rpgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:12px}
.rpcell{position:relative;aspect-ratio:4/5;border-radius:14px;overflow:hidden;background:#f4efe4;border:1px solid #ece7db;display:block;text-align:left;padding:0;cursor:pointer}
.rpcell img{width:100%;height:100%;object-fit:cover;display:block;position:absolute;inset:0}
.rpcell .rpbadge{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.62);color:#fff;font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;border-radius:20px}
.rpcell .rplbl{position:absolute;left:0;right:0;bottom:0;padding:26px 10px 10px;background:linear-gradient(transparent,rgba(0,0,0,.78));color:#ffffff;line-height:1.25}
.rpcell .rplbl b{display:block;font-size:12.5px;font-weight:900;letter-spacing:-.01em}
.rpcell .rplbl em{font-style:normal;font-size:10.5px;font-weight:800;opacity:.9;display:block;margin-top:3px}
.rpcell .rplbl s{font-size:10px;opacity:.7;font-weight:600;margin-left:6px}

/* ---------- RESTAURANT ABOUT (compact) ---------- */
/* logo sits between the crumb and the hero, in its own generous slot */
.rabout-logo{padding:22px 18px;background:#ffffff;border-bottom:1px solid #ece7db;text-align:center}
.rabout-logo img{width:100%;max-width:300px;height:auto;max-height:132px;object-fit:contain;display:block;margin:0 auto}
.rabout-hero{padding:20px 18px 18px;background:#ffffff;border-bottom:1px solid #ece7db;text-align:center}
.rabout-hero .rlogo{width:70%;max-width:240px;height:auto;max-height:120px;object-fit:contain;margin:0 auto 14px;display:block}
.rabout-hero h2{margin:0 0 6px;font-size:20px;font-weight:900;letter-spacing:-.015em;color:#1a1a1a}
.rabout-hero p{margin:0;font-size:12px;color:#8a8170;letter-spacing:.02em}

/* ---------- SPLIT THE BILL ---------- */
.split-people{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.split-person{display:inline-flex;align-items:center;gap:7px;padding:6px 8px 6px 9px;border:1px solid #ece7db;border-radius:999px;background:#faf8f2;font-size:12px;font-weight:800;color:#3a3324}
.split-person i{width:8px;height:8px;border-radius:50%;display:block;flex:0 0 auto}
.split-pname{max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.split-ptot{color:#1a1a1a;font-weight:900}
.split-px{width:18px;height:18px;border-radius:50%;background:transparent;color:#a89a7e;font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0;flex:0 0 auto}
.split-px:active{background:#f1ece1;color:#1a1a1a}
.split-add{display:flex;gap:8px;align-items:stretch}
.split-add input{flex:1;padding:11px 13px;background:#faf8f2;border:1px solid #ece7db;border-radius:11px;font-size:13px;color:#1a1a1a;outline:none;min-width:0}
.split-add input:focus{border-color:#1a1a1a;background:#ffffff}
.split-add .btn{padding:11px 16px}
.split-line{border:1px solid #f1ece1;border-radius:12px;background:#ffffff;padding:12px;margin-bottom:10px}
.split-line-head{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.split-line-name{font-size:13px;font-weight:800;color:#1a1a1a;line-height:1.3;min-width:0}
.split-line-name em{font-style:normal;color:#a89a7e;font-weight:700}
.split-line-tot{font-size:13px;font-weight:900;color:#1a1a1a;flex:0 0 auto}
.split-line-meta{font-size:11px;color:#8a8170;margin-top:3px}
.split-line-unit{font-size:10.5px;color:#a89a7e;font-weight:700;margin:4px 0 8px;letter-spacing:.02em}
.split-line-rows{display:flex;flex-direction:column;gap:6px}
.split-row{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:9px;background:#faf8f2}
.split-dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.split-row-name{flex:1;font-size:12px;font-weight:800;color:#3a3324;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.split-row-sub{font-size:11.5px;font-weight:900;color:#1a1a1a;flex:0 0 auto;min-width:56px;text-align:right}
.split-row .stp button{width:30px;height:28px;font-size:15px}
.split-row .stp .val{min-width:24px;font-size:12.5px;padding:0 2px}
.split-unrow{display:flex;align-items:center;gap:8px;padding:6px 8px;font-size:11.5px;color:#a89a7e}
.split-unrow.zero{opacity:.35}
.split-unrow .split-row-name{color:#a89a7e;font-weight:800}
.split-unrow .split-row-sub{color:#8a8170;font-weight:800}
.split-unrow .split-row-sub em{font-style:normal;font-weight:600;color:#a89a7e;margin-left:4px}
.split-hint{font-size:11.5px;color:#a89a7e;padding:6px 0;font-style:italic}
.split-sumrow{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-left:3px solid #1a1a1a;background:#faf8f2;border-radius:0 9px 9px 0;margin-bottom:6px;font-size:12.5px;font-weight:800;color:#3a3324}
.split-sumrow b{font-size:14px;font-weight:900;color:#1a1a1a}
.split-sumrow.muted{border-left-color:#d6cfbf;color:#a89a7e}
.split-sumrow.muted b{color:#8a8170}
.split-note{font-size:10.5px;color:#a89a7e;line-height:1.5;margin:8px 0 0}
.split-actions{display:flex;flex-direction:column;gap:8px}
.split-preview{margin:-2px 0 12px;padding:10px 12px;background:#faf8f2;border:1px solid #f1ece1;border-radius:12px}
.split-preview .sp-row{display:flex;justify-content:space-between;font-size:11.5px;font-weight:800;color:#3a3324;padding:2px 0}
.split-preview .sp-row b{color:#1a1a1a}
.split-preview .sp-row.muted{color:#a89a7e}

<script>
/* ================================================================
   CONFIG & CONSTANTS
   ================================================================ */
const CONFIG = { whatsapp:"26771844129", displayNumber:"+267 71 844 129", entity:"the-yellow-giraffe-coffee-club", lastUpdated:"2026-10-02" };

/* ================================================================
   ASSET PATHS
   ================================================================ */
const IMG = {
  logo:"assets/logo/yellow_giraffe_logo.jpg",
  /* the EatOuts brand mark - distinct from the venue logo above */
  eatoutsLogo:"assets/logo/EatOuts_Logo.png",
  iconIG:"assets/icons/Instagram_icon.png",
  iconFB:"assets/icons/facebook_icon.png",
  iconWA:"assets/icons/whatsApp_icon_on.png",

  iconFBOff:"assets/icons/facebook_icon_off.png",
  iconWAOff:"assets/icons/whatsApp_icon_off.png",
  iconTTOff:"assets/icons/TikTok_Off.png",
  iconXOff:"assets/icons/Twitter_Off.png",
  iconYTOff:"assets/icons/YouTube_Off.png",
  iconWebOff:"assets/icons/Website_Off.png",
  iconCallOff:"assets/icons/Call_Off.png",

/* ================================================================
   MENU — normalised from DATA_MENU (the_yellow_giraffe_menu-master)
   Internal item shape: [id, name, desc, price, extras]
     price  = number                       (single price)
            = [[label, price, happyHourPrice], ...]   (size / option variants)
     extras = [[label, price], ...]
   ================================================================ */
function money(v){
  if(v===null||v===undefined) return null;
  if(typeof v==="number") return isFinite(v)?v:null;
  const m=String(v).replace(/[^\d.]/g,"");
  if(!m) return null;
  const n=parseFloat(m);
  return isFinite(n)?n:null;
}
function variants(slots){
  const out=[];
  (slots||[]).forEach(function(s){
    if(!s) return;
    const p=money(s[1]);
    const hh=money(s[2]);
    if(p===null&&hh===null) return;
    out.push([s[0]===undefined?null:s[0], p, hh]);
  });
  return out;
}
function collapsePrice(price){
  if(!price||!price.length) return 0;
  if(price.length===1&&price[0][0]===null&&price[0][2]===null) return price[0][1]===null?0:price[0][1];
  return price;
}
function rowVariants(o){
  if(o.glass_price!==undefined||o.bottle_price!==undefined)
    return variants([["Glass",o.glass_price],["Bottle",o.bottle_price]]);
  if(o.single_price!==undefined||o.double_price!==undefined||o.grande_price!==undefined)
    return variants([["Single",o.single_price],["Double",o.double_price],["Grande",o.grande_price]]);
  if(Array.isArray(o.options)){
    if(!o.options.length) return [];
    if(typeof o.options[0]==="string")
      return variants(o.options.map(function(n){return [n,o.price];}));
    return variants(o.options.map(function(op){
      return [op.item||op.protein||op.variant||op.name, op.price, op.happy_hour_price];
    }));
  }
  if(Array.isArray(o.flavors)&&o.flavors.length)
    return variants(o.flavors.map(function(n){return [n,o.price];}));
  if(typeof o.price==="string"&&o.price.indexOf("|")>-1){
    const parts=o.price.split("|").map(function(s){return s.trim();}).filter(Boolean);
    return variants(parts.map(function(p,i){return ["Option "+(i+1),p];}));
  }
  if(o.price!==undefined) return variants([[null,o.price,o.happy_hour_price]]);
  return [];
}
function rowExtras(o){
  const out=[];
  if(Array.isArray(o.add_ons)){
    o.add_ons.forEach(function(a){
      const p=money(a.price);
      if(a&&a.item&&p!==null) out.push([a.item,p]);
    });
  }
  if(Array.isArray(o.addons)){
    o.addons.forEach(function(a){
      if(!a||!a.item) return;
      const p=money(a.price);
      const hh=money(a.happy_hour_price);
      if(p===null&&hh===null) return;
      out.push([a.addons?(a.item+" ("+a.addons+")"):a.item, p!==null?p:(hh||0)]);
    });
  }
  return out;
}
function rowDesc(o,groupLabel){
  const bits=[];
  if(groupLabel) bits.push(groupLabel);
  if(o.description) bits.push(o.description);
  if(Array.isArray(o.veggie_options)&&o.veggie_options.length)
    bits.push("("+o.veggie_options.join(", ")+")");
  if(o.pricing) bits.push("Add to any breakfast above.");
  if(Array.isArray(o.options)){
    const notes=[];
    o.options.forEach(function(op){ if(op&&op.addons) notes.push(op.addons); });
    if(notes.length) bits.push("("+notes.join("; ")+")");
  }
  return bits.join(" ");
}
const GROUP_LABEL={
  tequila:"Tequila",gin:"Gin",vodka:"Vodka",whisky:"Whisky",rum:"Rum",brandy:"Brandy",
  shots:"Shots",white_wine:"White Wine",red_wine:"Red Wine",
  salads:"Salads",on_the_side_trail:"On The Side Trail"
};
function addRow(out,o,groupLabel){
  if(!o||typeof o!=="object") return;
  const name=o.item||o.name||o.category;
  if(!name) return;
  let price;
  if(o.pricing&&typeof o.pricing==="object"){
    price=variants(Object.keys(o.pricing).map(function(k){return [k,o.pricing[k]];}));
  } else {
    price=rowVariants(o);
  }
  if(!price||!price.length) return;
  out.push({name:name, desc:rowDesc(o,groupLabel), price:price, extras:rowExtras(o)});
}
function collectRows(value){
  const out=[];
  if(value===null||value===undefined) return out;
  if(Array.isArray(value)){ value.forEach(function(r){addRow(out,r,null);}); return out; }
  if(Array.isArray(value.items)){ value.items.forEach(function(r){addRow(out,r,null);}); return out; }
  Object.keys(value).forEach(function(g){
    const sub=value[g];
    const label=GROUP_LABEL[g]||g;
    if(Array.isArray(sub)) sub.forEach(function(r){addRow(out,r,label);});
    else addRow(out,sub,label);
  });
  return out;
}
function catNote(key){
  const raw=DATA_MENU.menu[key];
  if(raw&&typeof raw==="object"&&!Array.isArray(raw)&&typeof raw.note==="string") return raw.note;
  return "";
}

function slugish(s){
  if(window.EatoutsBrand&&typeof window.EatoutsBrand.slugify==="function"){
    const k=window.EatoutsBrand.slugify(s); if(k)return k;
  }
  return String(s||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
}
function pickText(v){return v===null||v===undefined?"":String(v);}
function iconForCat(name){
  return /drink|beer|wine|cider|lager|spirit|cocktail|mocktail|shake|smoothie|coffee|tea|juice|soda|beverage|bar|vodka|gin|rum|whiskey|whisky|brandy|liqueur|shots|fizz/.test(String(name).toLowerCase())
    ?"\u{1F379}":"\u{1F5C0}";

/* Pulls [{category,name,description,price,extras}] rows out of any of the
   JSON shapes the directory ships (KFC/Nando's/etc grouped menus, the Game
   Reserve's menus|sections, Zen Cafe's food_menu/bar_menu, the demo file). */
function catRowsOf(payload){
  const out=[];
  function push(cat,note,items){if(items&&items.length)out.push({cat:cat||"Menu",note:note||"",items:items});}
  function groupFlat(arr,fallback){
    if(!Array.isArray(arr)||!arr.length)return;
    const byCat={};
    arr.forEach(function(g){
      if(!g||typeof g!=="object")return;
      const cat=g.category||fallback;
      (byCat[cat]=byCat[cat]||[]).push(g);
    });
    Object.keys(byCat).forEach(function(cat){push(cat,"",byCat[cat]);});
  }
  const menu=payload.menu;
  if(Array.isArray(menu)){
    const structured=menu.every(function(g){return g&&(Array.isArray(g.items)||Array.isArray(g.subcategories));});
    if(structured){
      menu.forEach(function(g){
        if(Array.isArray(g.items))push(g.category||g.name,g.note||"",g.items);
        if(Array.isArray(g.subcategories))g.subcategories.forEach(function(sc){
          if(sc&&Array.isArray(sc.items))push(sc.name||g.category,(sc&&sc.note)||"",sc.items);
        });
      });
    }else{
      groupFlat(menu,"Menu");
    }
  }
  const menus=payload.menus;
  if(menus&&typeof menus==="object"){
    Object.keys(menus).forEach(function(k){
      const m=menus[k];
      if(!m||typeof m!=="object")return;
      const label=m.category||capitalize(pickText(k).replace(/[_-]+/g," "))||"Menu";
      if(Array.isArray(m.sections))m.sections.forEach(function(s){push((s&&s.section)||label,s&&s.note,s&&s.items||[]);});
      else if(Array.isArray(m.items))push(label,m&&m.note,m.items);
    });
  }
  if(Array.isArray(payload.food_menu))groupFlat(payload.food_menu,"Food & Coffee");
  if(Array.isArray(payload.bar_menu))groupFlat(payload.bar_menu,"Bar & Cocktails");
  return out;
}
function capitalize(s){return s.replace(/\b\w/g,function(c){return c.toUpperCase();});}

/* price -> number | [[label,price,happyHourPrice],...] | null */
function importedPrice(item){
  if(Array.isArray(item.variants)&&item.variants.length){
    const arr=[];
    item.variants.forEach(function(v){
      if(!v||typeof v!=="object")return;
      const p=money(v.price);
      if(p===null)return;
      arr.push([pickText(v.name)||null,p,money(v.happy_hour_price)]);
    });
    return arr.length?arr:null;
  }
  if(Array.isArray(item.options)&&item.options.length){
    const arr=[];
    const firstHasPrice=item.options.some(function(o){return o&&typeof o==="object"&&o.price!==undefined&&o.price!==null;});
    item.options.forEach(function(o,i){
      if(typeof o==="string"){
        const p=money(item.price);
        if(p!==null)arr.push([o,p,null]);
      }else if(o&&typeof o==="object"){
        const p=money(firstHasPrice?o.price:item.price);
        if(p!==null)arr.push([pickText(o.name||o.item||o.variant||o.protein)||null,p,money(o.happy_hour_price)]);
      }else{
        const p=money(item.price);
        if(p!==null)arr.push(["Option "+(i+1),p,null]);
      }
    });
    return arr.length?arr:null;
  }
  let base=item.price;
  if(base===undefined||base===null)base=item.price_token;
  const p=money(base);
  if(p===null)return null;
  return [[null,p,money(item.happy_hour_price)]];
}
function importedExtras(item){
  const src=Array.isArray(item.extras)?item.extras
    :Array.isArray(item.add_ons)?item.add_ons
    :Array.isArray(item.addons)?item.addons:[];
  const out=[];
  src.forEach(function(a){
    if(!a)return;
    let label=a,price=item.price;
    if(typeof a==="object"){label=a.name||a.item;price=a.price;}
    const p=money(price);
    const s=pickText(label);
    if(s&&p!==null)out.push([s,p]);
  });
  const seen={};
  return out.filter(function(x){if(seen[x[0]])return false;seen[x[0]]=1;return true;});
}
function importedItem(raw){
  if(!raw||typeof raw!=="object")return null;
  const name=pickText(raw.name||raw.item||raw.title);
  if(!name)return null;
  const price=importedPrice(raw);
  if(!price||!price.length)return null;
  return {name:name,desc:pickText(raw.description||raw.desc||raw.details||raw.pricing),price:collapsePrice(price),extras:importedExtras(raw)};
}
function normaliseImported(payload){
  const rows=catRowsOf(payload);
  const usedCat={};
  const menu=[];
  let seq=0;
  rows.forEach(function(cr){
    const items=[];
    (cr.items||[]).forEach(function(raw){
      const it=importedItem(raw);
      if(it)items.push([++seq,it.name,it.desc,it.price,it.extras]);
    });
    if(!items.length)return;
    let base=slugish(cr.cat)||"menu";
    let catId=base,i=2;
    while(usedCat[catId]){catId=base+"-"+(i++);}
    usedCat[catId]=1;
    menu.push({id:catId,name:cr.cat,icon:iconForCat(cr.cat),note:cr.note||"",items:items});
  });
  return menu;
}

/* photo manifest lookup (assets/images/menu_images/<brand>/<slug>.jpg) */ 
function photoNormalize(s){
  return slugish(s).replace(/pcs?/g,"pc").replace(/pieces?/g,"pc").replace(/-+$/,"");
}
function indexImages(){
  EATOUTS_IMAGE_INDEX={};
  const mf=(window.DIRECTORY_DATA&&window.DIRECTORY_DATA.menuImages)||{};
  Object.keys(mf).forEach(function(key){
    const list=mf[key]||[];
    const byKey={};
    const normSet={};
    list.forEach(function(img){
      if(!img||!img.key)return;
      byKey[img.key]=img.path;
      normSet[photoNormalize(img.key)]=img.path;
    });
    EATOUTS_IMAGE_INDEX[key]={list:list,byKey:byKey,normSet:normSet,paths:list.map(function(i){return i&&i.path;})};
  });
}
function menuItemPhoto(itemName){
  const r=curRestaurant();
  if(!r)return null;
  const idx=EATOUTS_IMAGE_INDEX[brandKeyOf(r)];
  if(!idx||!idx.list.length)return null;
  const needle=photoNormalize(itemName);
  if(!needle)return null;
  if(idx.byKey[slugish(itemName)])return idx.byKey[slugish(itemName)];
  if(idx.normSet[needle])return idx.normSet[needle];
  for(let i=0;i<idx.list.length;i++){
    const k=photoNormalize(idx.list[i].key);
    if(k&&(k.indexOf(needle)>-1||needle.indexOf(k)>-1))return idx.list[i].path;
  }
  return null;
}
function menuPhoto(name,fallbackIdx){
  const p=menuItemPhoto(name);
  return p||foodImg(fallbackIdx);
}
function menuPhotoStrip(it){
  const name=typeof it==="string"?it:(it?it[1]:"");

/* first photo-matched item in a menu category, or null - drives the
   cat-ico thumbnail so a category card shows a real dish photo */
function menuCatThumb(cat){
  if(!cat||!cat.items) return null;
  for(let i=0;i<cat.items.length;i++){
    const it=cat.items[i];
    const name=(typeof it==="string")?it:(it&&it[1]);
    if(!name) continue;
    const p=menuItemPhoto(name);
    if(p) return p;
  }
  return null;
}

function loadMenus(payload){
  const files=(payload&&payload.menuFiles)||{};
  const raw=(payload&&payload.menusRaw)||window.EATOUTS_MENUS_RAW||null;
  const tasks=Object.keys(files).map(function(key){
    if(raw&&raw[key]){
      const m=normaliseImported(raw[key]);
      if(m.length)EATOUTS_MENUS[key]=m;
      return Promise.resolve();
    }
    return fetch(files[key])
      .then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json();})
      .then(function(data){const m=normaliseImported(data);if(m.length)EATOUTS_MENUS[key]=m;})
      .catch(function(e){console.warn("[EatOuts] menu '"+key+"' unavailable: "+e);});
  });
  if(raw&&raw._demo){
    const m=normaliseImported(raw._demo);
    if(m.length)EATOUTS_MENUS._demo=m;
  }else{
    tasks.push(fetch(DEMO_MENU_PATH)
      .then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json();})
      .then(function(data){const m=normaliseImported(data);if(m.length)EATOUTS_MENUS._demo=m;})
      .catch(function(e){console.warn("[EatOuts] demo menu unavailable: "+e);}));
  }
  return Promise.all(tasks);
}
function loadDirectoryMenus(onReady){
  if (window.DIRECTORY_RUNTIME_DATA) {
    const directory = window.DIRECTORY_RUNTIME_DATA;
    window.DIRECTORY_DATA=directory;
    if(window.EatoutsSeed&&typeof window.EatoutsSeed.mergeDirectory==="function"){
      DIRECTORY_MERGE_REPORT=window.EatoutsSeed.mergeDirectory(directory);
    }
    indexImages();
    loadMenus(directory).then(function(){
      DIRECTORY_LOADED=true;if(onReady)onReady();
    });
    return;
  }
  if(!window.fetch){if(onReady)onReady();return;}
  fetch(DIRECTORY_DATA_PATH)
    .then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json();})
    .then(function(directory){
      window.DIRECTORY_DATA=directory;
      if(window.EatoutsSeed&&typeof window.EatoutsSeed.mergeDirectory==="function"){
        DIRECTORY_MERGE_REPORT=window.EatoutsSeed.mergeDirectory(directory);
      }
      indexImages();
      return loadMenus(directory);
    })
    .then(function(){DIRECTORY_LOADED=true;if(onReady)onReady();})
    .catch(function(e){console.warn("[EatOuts] directory/menus unavailable: "+e);if(onReady)onReady();});
}

function hash(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h);}
function artStyle(seed){const h=hash(seed);const p=PAL[h%PAL.length];const a=118+(h%96);return "background:linear-gradient("+a+"deg,"+p[0]+","+p[1]+");";}
function tile(seed,ico,cls){return '<div class="tile" style="'+artStyle(seed)+'"><span class="tile-ico '+(cls||"")+'">'+ico+'</span></div>';}
function fmt(n){return "P"+(Number(n)||0).toFixed(2);}

/* ---------- per-restaurant viewing context ----------
   curBundle() is the bundle for the restaurant currently open in the
   Restaurants tab. When no restaurant is open it falls back to the
   flagship bundle, then to index.html's own globals - so the app still
   behaves correctly if the bridge is unavailable. */
function curBundle(){
  if(window.EatoutsBridge&&EatoutsBridge.activeBundle())return EatoutsBridge.activeBundle();
  if(window.EatoutsBridge&&EatoutsBridge.sourceBundle())return EatoutsBridge.sourceBundle();
  return {id:null,name:(PROFILE&&PROFILE.name)||"",menu:MENU,promos:PROMOS,events:EVENTS,profile:PROFILE,gallery:GALLERY,restaurant:null};
}
function curMenu(){const b=curBundle();return (b&&b.menu&&b.menu.length)?b.menu:MENU;}
function curRestaurant(){const b=curBundle();return b?b.restaurant:null;}
function curRestaurantName(){const b=curBundle();return (b&&b.name)||(PROFILE&&PROFILE.name)||"";}

/* The cart is namespaced by restaurant id, so the same menu item id
   (all 133 restaurants share one template) can be in two carts at once. */
function activeRestId(){
  const r=curRestaurant();
  return r?r.id:"_tyg";
}
function getMenuItem(id){const m=curMenu();for(const cat of m){for(const it of cat.items){if(it[0]===id)return {cat:cat.id,id:it[0],name:it[1],desc:it[2],price:it[3],extras:it[4]};}}return null;}
function variantPrice(v){const p=v[1];return (p!==null&&p!==undefined)?p:((v[2]!==null&&v[2]!==undefined)?v[2]:0);}
function itemSizes(it){
  /* accepts a normalised row object (getMenuItem) or a raw tuple [id,name,desc,price,extras] */
  const raw=Array.isArray(it)?it[3]:it.price;
  const v=Array.isArray(raw)?raw:[[null,raw]];
  return v.map(function(x){return [x[0],variantPrice(x),(x[2]===undefined?null:x[2])];});
}

function cartKey(itemId,sizeIdx){return "i"+activeRestId()+":"+itemId+"_"+sizeIdx;}
/* only the active restaurant's keys */
function cartKeys(){
  const p="i"+activeRestId()+":";
  return Object.keys(state.cart).filter(function(k){return k.indexOf(p)===0;});
}
function cartLine(itemId,sizeIdx){
  const k=cartKey(itemId,sizeIdx);
  if(!state.cart[k]) state.cart[k]={itemId:itemId,sizeIdx:sizeIdx,qty:0,extras:{}};
  return state.cart[k];
}
function cartTotal(){
  let t=0;
  cartKeys().forEach(k=>{
    const l=state.cart[k];if(!l.qty&&!Object.keys(l.extras||{}).length)return;
    const it=getMenuItem(l.itemId);if(!it)return;
    const sz=itemSizes(it)[l.sizeIdx];if(!sz)return;
    t+=sz[1]*l.qty;
    Object.keys(l.extras||{}).forEach(ei=>{
      const ex=it.extras[ei];if(!ex)return;
      t+=ex[1]*l.extras[ei];
    });
  });
  return t;
}
function cartCount(){let c=0;cartKeys().forEach(k=>{c+=(state.cart[k].qty||0);});return c;}
function clearEmptyCart(){Object.keys(state.cart).forEach(k=>{const l=state.cart[k];if(!l.qty&&!Object.keys(l.extras||{}).length) delete state.cart[k];});}
function cartTotalForItem(itemId,sizeIdx){
  const l=state.cart[cartKey(itemId,sizeIdx)];if(!l)return 0;
  const it=getMenuItem(itemId);const sz=itemSizes(it)[sizeIdx];if(!sz)return 0;
  let t=sz[1]*l.qty;
  Object.keys(l.extras||{}).forEach(ei=>{const ex=it.extras[ei];if(ex)t+=ex[1]*l.extras[ei];});
  return t;
}
/* ================================================================
   SPLIT THE BILL
   Model: each cart line has `qty` units. The user assigns integer
   quantities to people; anything not assigned is "unassigned".
   The per-unit price includes the line's extras, averaged over its
   qty, so a person who takes 1 of 2 burgers pays half the bacon too.
   Names live only in this session — nothing about a person is stored.
   ================================================================ */
const SPLIT_COLORS=["#c2410c","#0369a1","#15803d","#7c3aed","#b91c1c","#a16207","#0f766e","#be185d"];
let _splitSeq=0;

function checkoutLines(){
  clearEmptyCart();
  const lines=[];
  cartKeys().forEach(function(k){
    const l=state.cart[k];if(!l.qty&&!Object.keys(l.extras||{}).length)return;
    const it=getMenuItem(l.itemId);if(!it)return;
    const sz=itemSizes(it)[l.sizeIdx];if(!sz)return;
    lines.push({key:k,itemId:l.itemId,sizeIdx:l.sizeIdx,it:it,name:it.name,
      size:sz[0]||null,price:sz[1],qty:l.qty,extras:l.extras||{},total:cartLineTotal(l.itemId,l.sizeIdx)});
  });
  return lines;
}

function addSplitPerson(name){
  name=String(name||"").trim().slice(0,24);
  if(!name) return null;
  if(state.splitPeople.some(function(p){return p.name.toLowerCase()===name.toLowerCase();})) return null;
  const id="p"+(++_splitSeq);
  state.splitPeople.push({id:id,name:name,color:SPLIT_COLORS[state.splitPeople.length%SPLIT_COLORS.length]});
  return id;
}
function removeSplitPerson(id){
  state.splitPeople=state.splitPeople.filter(function(p){return p.id!==id;});
  Object.keys(state.splitAssign).forEach(function(k){
    if(state.splitAssign[k]&&state.splitAssign[k][id]!==undefined) delete state.splitAssign[k][id];
  });
}
function splitQty(key,pid){const a=state.splitAssign[key];return (a&&a[pid])||0;}
function setSplitQty(key,pid,q){if(!state.splitAssign[key])state.splitAssign[key]={};state.splitAssign[key][pid]=Math.max(0,q|0);}
function lineAssignedQty(key){const a=state.splitAssign[key]||{};return Object.keys(a).reduce(function(s,p){return s+(a[p]||0);},0);}
function lineUnassignedQty(line){return Math.max(0,line.qty-lineAssignedQty(line.key));}
function lineUnitPrice(line){return line.qty>0?(line.total/line.qty):0;}
function personLines(pid){
  const out=[];
  checkoutLines().forEach(function(line){
    const q=splitQty(line.key,pid);
    if(!q) return;
    out.push({line:line,qty:q,subtotal:q*lineUnitPrice(line)});
  });
  return out;
}
function personTotal(pid){return personLines(pid).reduce(function(s,x){return s+x.subtotal;},0);}
function unassignedTotal(){return checkoutLines().reduce(function(s,line){return s+lineUnassignedQty(line)*lineUnitPrice(line);},0);}
function splitInUse(){return state.splitPeople.length>0;}
/* if a cart qty drops below what has been assigned, clamp first-come-first-served */
function normalizeSplitAssignments(){
  checkoutLines().forEach(function(line){
    const a=state.splitAssign[line.key];if(!a) return;
    let sum=0;state.splitPeople.forEach(function(p){sum+=(a[p.id]||0);});
    if(sum<=line.qty) return;
    let remaining=line.qty;
    state.splitPeople.forEach(function(p){
      const q=a[p.id]||0;if(!q) return;
      const take=Math.min(q,remaining);a[p.id]=take;remaining-=take;
    });
  });
}

/* Promos/events now live per-restaurant in the v2 database. These lookups
   search every restaurant that owns promos, so the feed and the detail
   views work no matter which venue a promo came from. */
function promoLocation(){return {town:state.promoTown,district:state.promoDistrict,districtName:state.promoDistrictName,area:state.promoArea};}
function promosOnDay(dayIdx){

function eventsOnDay(dayIdx){

function promoListFor(dayIdx){const b=curBundle();return (b&&b.promos)?(b.promos[DAY_NAMES[dayIdx]]||[]):[];}
function promoById(id){if(hasBridge())return EatoutsBridge.findPromoAnywhere(id);for(const d in PROMOS){const p=PROMOS[d].find(x=>x.id===id);if(p)return {promo:p,day:d};}return null;}
function eventFor(dayIdx){

    const list=EatoutsBridge.eventsForDay(dayIdx,state.promoTown,state.promoArea,state.promoDistrict,state.promoDistrictName);
    return list.length?list[0].event:undefined;
  }
  return EVENTS[DAY_NAMES[dayIdx]];
}
function getWeekDays(){
  const today=new Date();
  const day=today.getDay();
  const monday=new Date(today);
  monday.setDate(today.getDate()-((day+6)%7));
  const arr=[];
  for(let i=0;i<7;i++){const d=new Date(monday);d.setDate(monday.getDate()+i);arr.push(d);}
  return arr;
}
function weekLabel(){
  const days=getWeekDays();
  const first=days[0];
  const month=first.toLocaleString("en",{month:"long"});
  const weekNum=Math.ceil(first.getDate()/7);
  return month+" – Week "+weekNum;
}
function sameDay(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();}

/* Cart quantities are patched in place rather than re-rendered, so the
   scroll container, open accordions and focus all survive a +/- tap. */
function cartLineTotal(itemId,sizeIdx){
  const l=state.cart[cartKey(itemId,sizeIdx)];
  if(!l) return 0;
  const it=getMenuItem(itemId); if(!it) return 0;
  const sz=itemSizes(it)[sizeIdx]; if(!sz) return 0;
  let t=sz[1]*l.qty;
  Object.keys(l.extras||{}).forEach(ei=>{
    const ex=(it.extras||[])[ei];
    if(ex&&l.extras[ei]>0) t+=ex[1]*l.extras[ei];
  });
  return t;
}

function syncCart(){
  const vp=document.getElementById("viewport");
  if(!vp) return;

  Array.prototype.forEach.call(vp.querySelectorAll("[data-qkey]"),function(el){
    const p=el.getAttribute("data-qkey").split(":");
    const l=state.cart[cartKey(parseInt(p[0],10),parseInt(p[1],10))];
    el.textContent=(l&&l.qty)||0;
  });

  Array.prototype.forEach.call(vp.querySelectorAll("[data-ekey]"),function(el){
    /* menu keys are "id:ei" (size 0); checkout keys are "id:sizeIdx:ei" */
    const p=el.getAttribute("data-ekey").split(":");
    const itemId=parseInt(p[0],10);
    const si=p.length>2?parseInt(p[1],10):0;
    const ei=parseInt(p.length>2?p[2]:p[1],10);
    const l=state.cart[cartKey(itemId,si)];
    el.textContent=(l&&l.extras&&l.extras[ei])||0;
  });

  Array.prototype.forEach.call(vp.querySelectorAll("[data-itotal]"),function(el){
    const id=parseInt(el.getAttribute("data-itotal"),10);
    const tot=cartTotalForItem(id,0);
    const bar=el.closest?el.closest(".tbar"):null;
    if(bar) bar.style.display=tot>0?"":"none";
    el.textContent=fmt(tot);
  });

  Array.prototype.forEach.call(vp.querySelectorAll("[data-linetotal]"),function(el){
    const p=el.getAttribute("data-linetotal").split(":");
    el.textContent=fmt(cartLineTotal(parseInt(p[0],10),parseInt(p[1],10)));
  });

  Array.prototype.forEach.call(vp.querySelectorAll("[data-exsum]"),function(el){
    const p=el.getAttribute("data-exsum").split(":");
    const itemId=parseInt(p[0],10), si=parseInt(p[1],10), ei=parseInt(p[2],10);
    const l=state.cart[cartKey(itemId,si)];
    const it=getMenuItem(itemId);
    const ex=it&&(it.extras||[])[ei];
    const q=(l&&l.extras&&l.extras[ei])||0;
    const row=el.closest?el.closest(".co-exsum"):null;
    if(row) row.style.display=q>0?"":"none";
    el.textContent=q+" × "+((ex&&ex[0])||"")+"  "+fmt((ex?ex[1]:0)*q);
  });

  const n=cartCount(), tot=cartTotal();
  const cs=vp.querySelector("[data-cartcount]");
  if(cs) cs.textContent="Cart · "+n+" item"+(n===1?"":"s");
  const ct=vp.querySelector("[data-carttotal]");
  if(ct) ct.textContent=fmt(tot);
  Array.prototype.forEach.call(vp.querySelectorAll("[data-act='openCheckout']"),function(b){
    if(tot>0) b.removeAttribute("disabled"); else b.setAttribute("disabled","");
  });
  /* an emptied cart would leave stale checkout rows behind */
  if(state.checkoutView && n===0) render();
}

        const areaCount=countAt(state.promoTown,state.promoDistrict,state.promoDistrictName,area);
        const areaSelected=state.promoArea===area;
        h+='<button class="loc-area-option'+(areaSelected?" on":"")+'" role="option" aria-selected="'+areaSelected+'" data-act="pickArea" data-town="'+esc(state.promoTown)+'" data-district="'+esc(state.promoDistrict)+'" data-district-name="'+esc(state.promoDistrictName)+'" data-area="'+esc(area)+'"><span>'+esc(area)+'</span><span class="loc-count">'+areaCount+'</span></button>';
      });
    }else{
      h+='<div class="fpop-note">No neighbourhoods listed</div>';
    }
    h+='</div>';
  }

  /* promo type popup */
  if(state.promoTypePicker){
    h+='<div class="fpop-scrim" data-act="closePickers"></div>';
    h+='<div class="fpop type-pop" role="listbox">';
    types.forEach(function(c){
      h+='<button role="option" aria-selected="'+(c===state.promoType)+'" class="'+(c===state.promoType?"on":"")+'" data-act="pickPromoType" data-val="'+esc(c)+'">'+esc(c)+'</button>';
    });
    h+='</div>';
  }
  h+='</div>';
  return h;
}

/* ---------- Restaurants tab ---------- */
let _listingRev=null;
let _listingCache=null;
function allRestaurants(){
  const rev=dbEventRev+"|"+(DIRECTORY_LOADED?1:0);
  if(rev===_listingRev) return _listingCache;
  _listingRev=rev;
  _listingCache=hasBridge()?EatoutsBridge.groupedListing():[];
  return _listingCache;
}
function restaurantMatchesType(r,type){
  const selected=restTypeTokens(type).map(normalizeRestType);
  const types=(r.types&&r.types.length)?r.types:["Restaurant"];
  return types.some(function(value){
    return restTypeTokens(value).some(function(token){return selected.indexOf(normalizeRestType(token))>-1;});
  });
}
function branchMatchesLocation(b,town,district,districtName,area){
  const loc=b.location||{};
  if(town&&town!=="All"&&normalizeRestType(loc.town)!==normalizeRestType(town))return false;
  const recordDistrict=String(loc.district||loc.districtCode||"");
  if(district&&recordDistrict&&recordDistrict!==String(district)&&normalizeRestType(loc.districtName)!==normalizeRestType(districtName))return false;
  if(area&&area!=="All"&&normalizeRestType(loc.area)!==normalizeRestType(area))return false;
  return true;
}
function restaurantMatchesLocation(r,town,district,districtName,area){
  if(r&&r.branches&&r.branches.length)return r.branches.some(function(b){return branchMatchesLocation(b,town,district,districtName,area);});
  return branchMatchesLocation(r,town,district,districtName,area);
}
function restaurantMatchesSearch(r){
  const query=state.restSearch.trim().toLowerCase();
  const places=(r&&r.branchLabels&&r.branchLabels.length)?r.branchLabels.join(" "):(r&&r.placeLabel||"");
  const names=(r&&r.branchNames&&r.branchNames.length)?r.branchNames.join(" "):"";
  return !query||(String(r.name||"")+" "+names+" "+String(r.category||"")+" "+places).toLowerCase().indexOf(query)>-1;
}
function groupBranches(r){
  return (r&&r.branches&&r.branches.length)?r.branches:[r];
}
function restaurantBaseRows(){
  let rows=allRestaurants();
  rows=rows.filter(function(r){
    return restaurantMatchesLocation(r,state.restTown,state.restDistrict,state.restDistrictName,state.restArea)&&restaurantMatchesSearch(r);
  });
  return rows;
}
function filteredRestaurants(){
  const rows=restaurantBaseRows();
  if(!state.restTypes.length)return rows;
  return rows.filter(function(r){return state.restTypes.some(function(type){return restaurantMatchesType(r,type);});});
}
function restaurantCountByType(type,rows){
  return (rows||restaurantBaseRows()).filter(function(r){return restaurantMatchesType(r,type);}).length;
}
function restaurantCountAt(town,district,districtName,area){
  return allRestaurants().filter(function(r){
    if(!restaurantMatchesLocation(r,town,district,districtName,area)||!restaurantMatchesSearch(r))return false;
    return !state.restTypes.length||state.restTypes.some(function(type){return restaurantMatchesType(r,type);});
  }).length;
}
function restaurantTownOptions(){
  const locations=window.EatoutsLocations;
  const options=locations?locations.allTowns():[];
  const seen={};
  options.forEach(function(t){seen[normalizeRestType(t.value)+"|"+String(t.districtCode||"")]=true;});
  allRestaurants().forEach(function(r){
    (groupBranches(r)).forEach(function(b){
      const loc=b.location||{};
      const town=String(loc.town||"").trim();
      if(!town)return;
      const code=String(loc.district||loc.districtCode||"");
      const key=normalizeRestType(town)+"|"+code;
      if(seen[key])return;
      seen[key]=true;
      options.push({value:town,label:town,districtCode:code,districtName:loc.districtName||"Other / not listed",areaCount:0});
    });
  });
  return options;
}
function restaurantAreaOptions(){
  const locations=window.EatoutsLocations;
  const options=locations&&state.restTown!=="All"?locations.areas(state.restDistrict,state.restTown):[];
  const seen={};
  options.forEach(function(area){seen[normalizeRestType(area)]=area;});
  allRestaurants().forEach(function(r){
    (groupBranches(r)).forEach(function(b){
      const loc=b.location||{};
      if(normalizeRestType(loc.town)!==normalizeRestType(state.restTown))return;
      const area=String(loc.area||"").trim();
      if(area&&!seen[normalizeRestType(area)])seen[normalizeRestType(area)]=area;
    });
  });
  return Object.keys(seen).map(function(key){return seen[key];}).sort();
}
function restaurantTypeCatalog(){
  const seen={};
  const groups=[];
  function optionsFor(values){
    return (values||[]).filter(function(value){
      const label=String(value||"").trim();
      const key=normalizeRestType(label);
      if(!key||seen[key])return false;
      seen[key]=true;
      return true;
    }).map(function(value){return {name:String(value).trim()};});
  }
  restaurantTypeFilterGroups.forEach(function(group){
    const item={name:String(group.name||"Other types"),options:[],subgroups:[]};
    item.options=optionsFor(group.options);
    (group.subgroups||[]).forEach(function(subgroup){
      const subOptions=optionsFor(subgroup.options);
      if(subOptions.length)item.subgroups.push({name:String(subgroup.name||""),options:subOptions});
    });
    if(item.options.length||item.subgroups.length)groups.push(item);
  });
  const extras=[];
  const typeNames={};
  allRestaurants().forEach(function(r){
    (r.types&&r.types.length?r.types:["Restaurant"]).forEach(function(type){
      const label=String(type||"").trim();
      const key=normalizeRestType(label);
      if(!key||typeNames[key])return;
      typeNames[key]=label;
      if(!restTypeTokens(label).some(function(token){return seen[normalizeRestType(token)];}))extras.push(label);
    });
  });
  if(restaurantTypeLoadState!=="ready"){
    return [{name:restaurantTypeLoadState==="loading"?"Available types":"Listing types",options:optionsFor(Object.keys(typeNames).map(function(key){return typeNames[key];})),subgroups:[]}];
  }
  if(extras.length)groups.push({name:"Other listing types",options:optionsFor(extras),subgroups:[]});
  return groups;
}
function renderRestaurantTownPicker(){
  const query=normalizeRestType(state.restTownSearch);
  const towns=restaurantTownOptions();
  const groups={};
  towns.forEach(function(t){
    if(query && normalizeRestType(t.label).indexOf(query) === -1) return;
    (groups[t.districtName||"Other / not listed"]|| (groups[t.districtName||"Other / not listed"]=[])).push(t);

  h+='<div class="rest-type-top" style="border-bottom: 1px solid #ece7db; padding-bottom: 10px; margin-bottom: 10px;"><div class="csearch"><input id="restTownSearch" type="search" placeholder="Search towns..." value="'+esc(state.restTownSearch)+'" aria-label="Search towns"></div></div>';
  if(!query) h+='<button class="loc-all'+(state.restTown==="All"?" on":"")+'" data-act="pickRestTown" data-town="All" role="option" aria-selected="'+(state.restTown==="All")+'"><span>All Botswana</span><span class="loc-count">'+restaurantCountAt("All","","","All")+'</span></button>';
  Object.keys(groups).sort().forEach(function(name){
    h+='<div class="loc-district">'+esc(name)+'</div>';

    });

  return h+'</div>';

function renderRestaurantAreaPicker(){
  const query=normalizeRestType(state.restAreaSearch);
  const areas=restaurantAreaOptions();
  const hasAreaData=allRestaurants().some(function(r){
    return (groupBranches(r)).some(function(b){
      return branchMatchesLocation(b,state.restTown,state.restDistrict,state.restDistrictName,"All")&&String((b.location||{}).area||"").trim();
    });
  });
  let h='<div class="fpop-scrim" data-act="closeRestAreaPicker"></div><div class="fpop area-pop rest-area-pop" role="listbox" aria-label="Choose area or neighbourhood">';
  h+='<div class="rest-type-top" style="border-bottom: 1px solid #ece7db; padding-bottom: 10px; margin-bottom: 10px;"><div class="csearch"><input id="restAreaSearch" type="search" placeholder="Search areas..." value="'+esc(state.restAreaSearch)+'" aria-label="Search areas"></div></div>';
  if(!query) h+='<button class="loc-area-option'+(state.restArea==="All"?" on":"")+'" role="option" aria-selected="'+(state.restArea==="All")+'" data-act="pickRestArea" data-area="All"><span>All areas</span><span class="loc-count">'+restaurantCountAt(state.restTown,state.restDistrict,state.restDistrictName,"All")+'</span></button>';
  if(areas.length&&!hasAreaData)h+='<div class="fpop-note">Current listings do not include neighbourhood details for this town.</div>';
  if(areas.length){
    let shown=0;
    areas.forEach(function(area){
      if(query && normalizeRestType(area).indexOf(query) === -1) return;
      shown++;
      const selected=normalizeRestType(state.restArea)===normalizeRestType(area);
      h+='<button class="loc-area-option'+(selected?" on":"")+'" role="option" aria-selected="'+selected+'" data-act="pickRestArea" data-area="'+esc(area)+'"><span>'+esc(area)+'</span><span class="loc-count">'+restaurantCountAt(state.restTown,state.restDistrict,state.restDistrictName,area)+'</span></button>';
    });
    if(!shown && query) h+='<div class="fpop-note">No matching areas found.</div>';
  }else h+='<div class="fpop-note">No neighbourhoods listed</div>';
  return h+'</div>';
}
function renderRestaurantTypePicker(){
  const query=normalizeRestType(state.restTypeSearch);
  const groups=restaurantTypeCatalog();
  const baseRows=restaurantBaseRows();
  let h='<div class="fpop-scrim" data-act="closeRestTypePicker"></div><div class="fpop rest-type-pop" role="dialog" aria-label="Choose restaurant types">';
  h+='<div class="rest-type-top"><div class="csearch"><input id="restTypeSearch" type="search" placeholder="Search types..." value="'+esc(state.restTypeSearch)+'" aria-label="Search restaurant types"></div>';
  h+='<div class="rest-type-status"><span>'+state.restTypeDraft.length+' selected</span><button type="button" data-act="clearRestTypeDraft">Clear</button></div></div>';
  h+='<div class="rest-type-options">';
  let shown=0;
  groups.forEach(function(group){
    const groupMatch=query&&normalizeRestType(group.name).indexOf(query)>-1;
    const direct=(group.options||[]).filter(function(option){return !query||groupMatch||normalizeRestType(option.name).indexOf(query)>-1;});
    const nested=(group.subgroups||[]).map(function(subgroup){
      const subMatch=query&&(groupMatch||normalizeRestType(subgroup.name).indexOf(query)>-1);
      return {name:subgroup.name,options:subgroup.options.filter(function(option){return !query||subMatch||normalizeRestType(option.name).indexOf(query)>-1;})};
    }).filter(function(subgroup){return subgroup.options.length;});
    if(!direct.length&&!nested.length)return;
    shown++;
    h+='<section><div class="rest-type-group-title">'+esc(group.name)+'</div>';
    direct.forEach(function(option){h+=renderRestaurantTypeOption(option,baseRows);});
    nested.forEach(function(subgroup){
      h+='<div class="rest-type-subgroup-title">'+esc(subgroup.name)+'</div>';
      subgroup.options.forEach(function(option){h+=renderRestaurantTypeOption(option,baseRows);});
    });
