  if(!shown)h+='<div class="rest-type-empty">No matching types</div>';
  if(restaurantTypeLoadState==="fallback")h+='<div class="rest-type-note">Taxonomy unavailable; showing types found in restaurant listings.</div>';
  h+='</div><div class="rest-type-footer"><button type="button" data-act="closeRestTypePicker">Cancel</button><button type="button" class="apply" data-act="applyRestTypeSelection">Apply</button></div></div>';
  return h;
}
function renderRestaurantTypeOption(option,rows){
  const selected=state.restTypeDraft.indexOf(option.name)>-1;
  return '<label class="rest-type-option"><input type="checkbox" data-rest-type-option value="'+esc(option.name)+'"'+(selected?' checked':'')+'><span>'+esc(option.name)+'</span><span class="loc-count rest-type-count">'+restaurantCountByType(option.name,rows)+'</span></label>';
}

/* Pinned to the top of the list, in this order. Matched on canonical slug
   (EatoutsBrand.canonicalKey), so Nando's -> nandos and zen-cafe-lounge ->
   zen-cafe match. The photo-menu brands come first (chicken-licken, hungry-lion,
   kfc, nandos, zen-cafe, the-yellow-giraffe, mozambik), then the other curated
   brands with both a logo and a menu. Drawn from the FILTERED rows so search
   and the cuisine filter still apply, then excluded from the tiers below (first
   venue per brand only). The tiers below are partitioned logo-first. */
const PINNED_REST_SLUGS=["chicken-licken","hungry-lion","kfc","nandos","zen-cafe","the-yellow-giraffe","mozambik","spur","rocomamas","pie-city","butter-chicken-indian-restaurant","the-game-reserve"];
function canonicalSlugKey(slug){
  const B=window.EatoutsBrand;
  return B&&typeof B.canonicalKey==="function"?B.canonicalKey(slug):slug;
}
/* Canonical brand key for a restaurant record (bridge owns the real
   grouping; this mirrors it so rendering works before the bridge is up). */
function brandKeyOf(r){
  if(!r)return null;
  if(window.EatoutsBridge&&typeof EatoutsBridge.brandKeyOf==="function")return EatoutsBridge.brandKeyOf(r);
  return canonicalSlugKey(r.slug);
}
/* Find the group descriptor for a brand from the deduplicated list. */
function brandGroupByKey(key){
  const all=allRestaurants();
  if(!all||!all.length)return null;
  for(let i=0;i<all.length;i++)if(all[i].brandKey===key)return all[i];
  return null;
}
/* The branch currently selected for a group: session choice wins, else
   the bridge default (Gaborone branch, else first). */
function activeBranchRecord(g){
  if(!g||!g.branches||!g.branches.length)return null;
  const sel=state.restBranchOf&&state.restBranchOf[g.brandKey];
  if(sel)for(let i=0;i<g.branches.length;i++)if(g.branches[i].id===sel)return g.branches[i];
  if(window.EatoutsBridge&&typeof EatoutsBridge.primaryBranch==="function"){
    const p=EatoutsBridge.primaryBranch(g.branches);
    if(p)return p;
  }
  return g.branches[0];
}
/* genuine logo test: the brand resolution (manifest -> record logo -> match)
   decides whether a venue counts as logo'd for ordering */
function usesGenuineLogo(r){
  if(!r) return false;
  const B=window.EatoutsBrand;
  if(!B||typeof B.logoFor!=="function") return !!(r.logo&&String(r.logo).indexOf("assets/logo")===0&&r.logo.indexOf("logo_placement_image")===-1);
  const p=B.logoFor(r);
  return !!p&&!B.isPlaceholderLogo(p);
}
const _restList={sig:null,html:null};
function renderRestaurants(){
  const rowsLen=filteredRestaurants().length;
  const allLen=allRestaurants().length;
  const sig=[dbEventRev,state.restTown,state.restDistrict,state.restDistrictName,state.restArea,
    state.restSearch,state.restTypes.join("|"),state.restaurantOpen||"",rowsLen,allLen,
    JSON.stringify(state.restBranchOf),JSON.stringify(state.restLocPicker)].join("~");
  if(sig===_restList.sig) return _restList.html;
  _restList.sig=sig;
  _restList.html=buildRestaurantsHTML();
  return _restList.html;
}
function buildRestaurantsHTML(){
  const rows=filteredRestaurants();
  const now=Date.now();

  /* Flat single column: the pinned featured venues come first (drawn from the
     FILTERED rows so search and the cuisine filter still apply), then the
     remaining venues partitioned logo-first - venues with a real logo above
     the ones still on the placeholder. No section headers. Rows are already
     deduplicated to one per brand (groupedListing), so each brand renders
     once regardless of how many branches it has. */
  const pinned=[];
  const usedPinned={};
  rows.forEach(function(g){
    const key=g.brandKey||canonicalSlugKey(g.slug);
    if(PINNED_REST_SLUGS.indexOf(key)>-1&&!usedPinned[key]){pinned.push(g);usedPinned[key]=1;}
  });
  const rest=rows.filter(function(g){return !usedPinned[g.brandKey||canonicalSlugKey(g.slug)];});
  const withLogo=rest.filter(usesGenuineLogo);
  const withoutLogo=rest.filter(function(g){return !usesGenuineLogo(g);});

  let h='<div class="scroll">';
  h+='<div class="phead"><h2>Restaurants</h2><p>'+rows.length+' of '+allRestaurants().length+' places · curated order</p></div>';

  if(!rows.length){
    h+='<div class="empty">No restaurants match your search.</div>';
    h+='</div>';
    return h;
  }

  pinned.forEach(function(g){ h+=restaurantItem(g,now); });
  withLogo.forEach(function(g){ h+=restaurantItem(g,now); });
  withoutLogo.forEach(function(g){ h+=restaurantItem(g,now); });

  h+='<div style="height:24px"></div></div>';
  return h;
}

/* One brand row plus its always-present, collapsed options panel. Each row
   stands for a whole group of branches (kfc = 13 locations); the active
   branch drives the Menu/Promos/About buttons and the town/area labels. */
function restaurantItem(g,now){
  const open=state.restaurantOpen===g.brandKey;
  const meta=g.locationCount>1?(g.locationCount+" places"):(g.placeLabel||"");
  let h='<div class="ritem'+(open?" open":"")+'" data-racc="'+esc(g.brandKey)+'">';
  h+='<button class="rrow" data-act="toggleRestaurant" data-id="'+esc(g.brandKey)+'" aria-expanded="'+(open?"true":"false")+'">';
  h+='<div class="rthumb">'+(g.thumbHtml||"")+'</div>';
  h+='<div class="rinfo"><div class="rname">'+esc(g.name)+'</div>';
  h+='<div class="rmeta">'+esc(g.category)+' · '+esc(meta)+'</div></div>';
  h+='</button>';
  h+='<div class="acc-wrap"><div class="acc-in">'+restaurantOptions(g,activeBranchRecord(g))+'</div></div>';
  h+='</div>';
  return h;
}

function restaurantOptions(g,active){
  const bid=active?(active.id||g.brandKey):(g.branches&&g.branches[0]?g.branches[0].id:g.brandKey);
  const brand=g.brandKey;
  const bundle=hasBridge()?EatoutsBridge.bundleOf(bid):null;
  let promoN=0;
  if(bundle) for(const d in bundle.promos) promoN+=(bundle.promos[d]||[]).length;
  const activeLoc=(active&&active.location)||{};
  const townL=String(activeLoc.town||"").trim()||"Select Town";
  const nameTag=(active&&active.name&&active.name!==g.name)?active.name:null;
  const chosen=!!(state.restBranchOf&&state.restBranchOf[brand]);
  const locationReady=g.locationCount<=1||chosen;
  const pickAxis=function(axis,label,cls){
    return '<button class="'+cls+'" data-act="openRestLocPicker" data-brand="'+esc(brand)+'" data-axis="'+axis+'" aria-haspopup="listbox" aria-expanded="'+(state.restLocPicker&&state.restLocPicker.brand===brand&&state.restLocPicker.axis===axis?"true":"false")+'"><span>'+esc(label)+'</span></button>';
  };
  /* areas in the active town: one -> show it, several -> "N locations",
     none -> the placeholder neighbourhood until listings are completed */
  const seenArea={};
  (g.branches||[]).forEach(function(b){
    const loc=b.location||{};
    if(normalizeRestType(loc.town)!==normalizeRestType(activeLoc.town))return;
    const area=String(loc.area||"").trim();
    if(area)seenArea[normalizeRestType(area)]=area;
  });
  const areaKeys=Object.keys(seenArea);
  const areaLabel=areaKeys.length>1?(areaKeys.length+" locations"):(areaKeys.length===1?seenArea[areaKeys[0]]:"Block 8");
  const menuBtn=locationReady
    ?'<button class="ropt" data-act="openRestView" data-id="'+esc(bid)+'" data-brand="'+esc(brand)+'" data-view="menu">Menu</button>'
    :'<button class="ropt off" data-act="showRestNotice" data-notice="'+esc("Choose a location first — each location has its own menu & specials.")+'">Menu</button>';
  let promosBtn;
  if(!locationReady)promosBtn='<button class="ropt off" data-act="showRestNotice" data-notice="'+esc("Choose a location first — each location has its own menu & specials.")+'">Promos</button>';
  else if(promoN>0)promosBtn='<button class="ropt" data-act="openRestView" data-id="'+esc(bid)+'" data-brand="'+esc(brand)+'" data-view="promos">Promos</button>';
  else promosBtn='<button class="ropt off" data-act="showRestNotice" data-notice="'+esc("No promos available at this location right now.")+'">Promos</button>';

  return '<div class="ropts">'+
    (nameTag?'<div class="ropts-loc-name">Also known as: '+esc(nameTag)+'</div>':'')+
    pickAxis("town",townL,"cbtn")+
    pickAxis("area",areaL,"cbtn-area")+
    menuBtn+
    promosBtn+
    '</div>';
}

/* Branch picker: the "exact places" a brand is at, opened from the two
   location filter buttons in the row's options panel. Town axis lists the
   brand's towns; area axis lists its area/neighbourhood combinations.
   Picking a row makes that branch active for this brand. */
function renderRestLocPicker(){
  const lp=state.restLocPicker;
  if(!lp)return "";
  const g=brandGroupByKey(lp.brand);
  if(!g)return "";
  const active=activeBranchRecord(g);
  const axis=lp.axis;
  let h='<div class="fpop-scrim" data-act="closeRestLocPicker"></div>';
  h+='<div class="fpop rest-loc-pop" role="listbox" aria-label="Choose '+(axis==="town"?"town":"area or neighbourhood")+'">';
  if(axis==="town"){
    const seenT={};
    const towns=[];
    g.branches.forEach(function(b){
      const t=String((b.location&&b.location.town)||"").trim();
      const code=String((b.location&&b.location.district)||"");
      const key=normalizeRestType(t)+"|"+code;
      if(!t||seenT[key])return;
      seenT[key]=true;
      towns.push({town:t,district:code});
    });
    towns.sort(function(a,b){return normalizeRestType(a.town).localeCompare(normalizeRestType(b.town));});
    towns.forEach(function(tp){
      const matches=g.branches.filter(function(b){return normalizeRestType((b.location&&b.location.town))===normalizeRestType(tp.town);});
      const target=matches[0];
      const names=[];
      matches.forEach(function(b){if(names.indexOf(b.name)===-1)names.push(b.name);});
      const selected=active&&normalizeRestType((active.location&&active.location.town))===normalizeRestType(tp.town);
      const label=tp.town+(names.length>1?" ("+(matches.length===2?"2":matches.length)+" locations)":"");
      h+='<button class="loc-town-main'+(selected?" on":"")+'" data-act="pickRestBranch" data-id="'+esc(target.id)+'" data-brand="'+esc(g.brandKey)+'" role="option" aria-selected="'+selected+'">'+
        '<span class="lbl">'+esc(label)+'</span>'+(names.length>1?'<span class="loc-count">'+esc(names.join(" · "))+'</span>':'')+
        '</button>';
    });
  }else{
    /* Area axis is scoped to the active town: pick a town first, then the
       neighbourhood within it. Falls back to all branches when no town. */
    const activeTown=String((active&&active.location&&active.location.town)||"").trim();
    const seenA={};
    const opts=[];
    g.branches.forEach(function(b){
      const loc=b.location||{};
      if(activeTown&&normalizeRestType(loc.town)!==normalizeRestType(activeTown))return;
      const area=String(loc.area||"").trim();
      const town=String(loc.town||"").trim();
      const key=normalizeRestType(area)+"|"+normalizeRestType(town);
      if(seenA[key])return;
      seenA[key]=true;
      opts.push({b:b,label:area?(area+" · "+town):(town||"Other")});
    });
    opts.sort(function(a,b){return normalizeRestType(a.label).localeCompare(normalizeRestType(b.label));});
    opts.forEach(function(o){
      const selected=active&&active.id===o.b.id;
      const nameTag=(o.b.name&&o.b.name!==g.name)?o.b.name+" · ":"";
      h+='<button class="loc-area-option'+(selected?" on":"")+'" data-act="pickRestBranch" data-id="'+esc(o.b.id)+'" data-brand="'+esc(g.brandKey)+'" role="option" aria-selected="'+selected+'"><span>'+esc(nameTag+o.label)+'</span></button>';
    });
  }
  h+='<div class="fpop-note">'+(g.branches.length>1?(g.branches.length+" locations · picking one makes it active"):"One location")+'</div>';
  return h+'</div>';
}

/* ---------- SOCIAL PLATFORMS ----------
   One place that knows which icon a platform uses and how to turn a
   stored value into a real link. Handles come in as bare text
   ("theyellowgiraffebw"), so each builder normalises first. */
const SOCIAL_ICON={
  instagram:"iconIG", facebook:"iconFB", whatsapp:"iconWA", tiktok:"iconTT",
  twitter:"iconX", youtube:"iconYT", website:"iconWeb", call:"iconCall", gps:"iconGPS"
};
/* unavailable / no-destination glyph per platform, used by the off state */
const SOCIAL_OFF_ICON={
  instagram:"iconIGOff", facebook:"iconFBOff", whatsapp:"iconWAOff", tiktok:"iconTTOff",
  twitter:"iconXOff", youtube:"iconYTOff", website:"iconWebOff", call:"iconCallOff", gps:"iconGPSOff"
};
/* canonical row: line one holds the first five (370px exactly), the rest
   drop onto the second, centred line */
const SOCIAL_GRID=[
  {platform:"instagram"},
  {platform:"facebook"},
  {platform:"whatsapp"},
  {platform:"tiktok"},
  {platform:"twitter"},
  {platform:"youtube"},
  {platform:"website"},
  {platform:"call"},
  {platform:"gps"}
];
const SOCIAL_LABEL={
  instagram:"Instagram", facebook:"Facebook", whatsapp:"WhatsApp", tiktok:"TikTok",
  twitter:"X (Twitter)", youtube:"YouTube", website:"Website", call:"Call", gps:"Location"
};
function socialHandle(v){
  return String(v||"").trim().replace(/^https?:\/\//i,"").replace(/^www\./i,"").replace(/^@/,"").replace(/\/+$/,"");
}
/* value may already be a full URL; otherwise it is a handle for that platform */
function socialUrl(platform,value){
  const raw=String(value||"").trim();
  if(!raw) return "";
  if(/^(https?:|mailto:|tel:)/i.test(raw)) return raw;
  const h=socialHandle(raw);
  if(!h) return "";
  if(platform==="whatsapp") return "https://wa.me/"+h.replace(/\D/g,"");
  if(platform==="instagram") return "https://www.instagram.com/"+h+"/";
  if(platform==="facebook") return "https://www.facebook.com/"+h;
  if(platform==="tiktok") return "https://www.tiktok.com/@"+h;
  if(platform==="youtube") return "https://www.youtube.com/@"+h;
  if(platform==="twitter") return "https://x.com/"+h;
  if(platform==="call") return "tel:+"+h.replace(/\D/g,"");
  /* a bare word is not a host, so refuse to build a broken link */
  if(/\s/.test(h)||!/\.[a-z]{2,}/i.test(h)) return "";
  return "https://"+h;
}
/* no explicit platform field, so read it off the link itself */
function socialPlatformFromUrl(url){
  const u=String(url||"").toLowerCase();
  if(/^(tel:|call)/.test(u)) return "call";
  if(/(wa\.me|whatsapp)/.test(u)) return "whatsapp";
  if(/instagram\.com/.test(u)) return "instagram";
  if(/(facebook\.com|fb\.com)/.test(u)) return "facebook";
  if(/tiktok\.com/.test(u)) return "tiktok";
  if(/(youtube\.com|youtu\.be)/.test(u)) return "youtube";
  if(/(twitter\.com|x\.com)/.test(u)) return "twitter";
  if(/(maps\.app\.goo\.gl|google\.[a-z.]+\/maps|goo\.gl\/maps)/.test(u)) return "gps";
  return "website";
}
/* socials[] is free-form in the DB: entries can be a plain URL string, a
   {url,platform} record, or a {instagram:'handle',facebook:'…'} map keyed
   by platform (what onboarding writes). Handle all three and drop anything
   we cannot link to rather than rendering a dead icon. */
function restSocialLinks(r){
  const out=[];
  const push=function(platform,value,label){
    const raw=String(value||"").trim();
    if(!raw) return;
    const key=String(platform||"").toLowerCase().replace(/[^a-z]/g,"");
    let id=SOCIAL_ICON[key]?key:null;
    /* a bare number with no platform field is a phone number, not a site */
    if(!id&&/^[+\d][\d\s()-]{6,}$/.test(raw)) id="call";
    const url=socialUrl(id||"",raw);
    if(!url) return;
    id=id||socialPlatformFromUrl(url);
    out.push({platform:id,url:url,label:label||SOCIAL_LABEL[id]||"Link"});
  };
  (r&&r.socials||[]).forEach(function(s){
    if(!s) return;
    if(typeof s==="string"){ push("",s,null); return; }
    if(typeof s!=="object") return;
    const url=s.url||s.link||s.href||null;
    if(url){ push(s.platform||s.network||s.type||"",url,s.label||s.handle||""); return; }
    /* keyed shape: one entry per platform, value is a handle or URL */
    Object.keys(s).forEach(function(k){
      if(k==="label"||k==="platform"||k==="network"||k==="type") return;
      push(k,s[k],typeof s[k]==="object"?(s[k]&&s[k].label):null);
    });
  });
  return out;
}
/* contact numbers live on the profile: prefer the primary one */
function restCallHref(profile){
  const list=(profile&&profile.contacts)||[];
  const usable=list.filter(function(c){return c&&c.number&&c.active!==false;});
  const pick=usable.filter(function(c){return c.primary;})[0]||usable[0];
  if(!pick) return "";
  return socialUrl("call",(pick.countryCode||"+267")+" "+pick.number);
}
function socialImg(platform,label,on){
  const id=String(platform||"").toLowerCase().replace(/[^a-z]/g,"");
  const table=on?SOCIAL_ICON:SOCIAL_OFF_ICON;
  const key=(table[id]||SOCIAL_ICON[id]||SOCIAL_ICON.website)||"iconIG";
  return '<img src="'+IMG[key]+'" alt="'+esc(label||SOCIAL_LABEL[id]||"Link")+'">';
}
/* one grid slot: live anchor when a destination exists, otherwise the
   off-colour glyph, never a dead link */
function socialSlot(platform,url,label){
  const name=label||SOCIAL_LABEL[platform]||"Link";
  if(url){
    return '<a class="social-ico" href="'+esc(url)+'" target="_blank" rel="noopener noreferrer" aria-label="'+esc(name)+'">'+socialImg(platform,name,true)+'</a>';
  }
  return '<span class="social-ico off" role="img" aria-label="'+esc(name+" — contact unavailable")+'">'+socialImg(platform,name,false)+'</span>';
}

  row+=socialSlot("tiktok","");

  row+=socialSlot("gps","https://maps.app.goo.gl/ftCWbv24eRgmd3uYA");

function renderRestSocialRow(r,profile){
  const links=restSocialLinks(r);
  const have={};
  links.forEach(function(l){ if(!have[l.platform]) have[l.platform]=l.url; });  /* one slot per platform */
  const call=restCallHref(profile);
  if(call&&!have.call) have.call=call;
  /* WhatsApp always applies, and guarantees the row is never empty */
  if(!have.whatsapp){
    have.whatsapp=waLink("*"+(r.name||"this restaurant")+"*\n\nHi! I found you on EatOuts and would like to ask about your menu, promos or booking a venue.");
  }
  let row='<div class="social-row">';
  SOCIAL_GRID.forEach(function(slot){
    row+=socialSlot(slot.platform,have[slot.platform]||"");
  });
  row+='</div>';
  return row;
}

  {id:"gallery",icon:ICON.img},

function renderNav(){
  const nav=document.getElementById("nav");
  /* build once, then only flip the active class - rebuilding on every
     render made the button under your finger repaint */
  if(nav.childElementCount!==NAV_TABS.length){
    nav.innerHTML=NAV_TABS.map(t=>
      '<button class="nav-btn" data-tab="'+t.id+'" aria-label="'+t.id+'">'+t.icon+'</button>'
    ).join("");
  }
  Array.prototype.forEach.call(nav.children,function(b){
    b.classList.toggle("on", b.getAttribute("data-tab")===state.tab);
  });
  /* Operator sign-in is a focused portrait task - hide the tab bar
     while it is open, and the filter bar that belongs to other tabs */
  const onLogin=(state.tab==="about"&&state.operatorView==="login");
  nav.style.display=onLogin?"none":"";
  if(onLogin){
    document.getElementById("cbar").classList.remove("on");
    document.getElementById("filter-bar").classList.remove("on");
  }
  measureNav();
}

/* .fpop-scrim's clip-path needs the nav's height to stop the blur above it,
   but that height is not a constant: .nav-btn padding plus
   env(safe-area-inset-bottom) vary per device and change on rotation. So we
   measure it into --navh rather than hardcoding an inset. The observer also
   fires when the nav is hidden for operator sign-in, which is exactly when
   the scrim is not on screen anyway. */
function measureNav(){
  const nav=document.getElementById("nav");
  if(!nav) return;
  document.documentElement.style.setProperty("--navh",nav.offsetHeight+"px");
}
if(window.ResizeObserver){
  const navEl=document.getElementById("nav");
  if(navEl){
    new ResizeObserver(measureNav).observe(navEl);
  }
}

    state.searchOpen,state.gallerySearch,state.galleryFilter].join("~");

/* Identity of what is on screen. When this does not change we re-render
   silently: no .anim replay, and the scroll position is kept. */
let lastViewKey=null;
function viewKey(){
  return [state.tab,state.promoView,state.restaurantView&&state.restaurantView.view,
    state.reserveCat,state.reserveSub,state.galleryView,state.aboutView,
    state.operatorView,state.legalView,state.checkoutView,state.splitOpen].join("|");
}
function renderViewport(){
  const vp=document.getElementById("viewport");
  /* remember where the user was before the DOM is replaced */
  const prevScroller=vp.querySelector(".scroll");
  const keepTop=prevScroller?prevScroller.scrollTop:0;
  const key=viewKey();
  const viewChanged=(key!==lastViewKey);
  lastViewKey=key;

  vp.innerHTML='<div class="screen'+(viewChanged?" anim":"")+'">'+renderScreen()+'</div>'+renderPreview()+renderRestLocPicker()+renderRestNotice();

  /* same view re-render -> put them back where they were */
  if(!viewChanged&&keepTop){
    const nextScroller=vp.querySelector(".scroll");
    if(nextScroller) nextScroller.scrollTop=keepTop;
  }

  renderHeader();
  renderNav();
  renderControlBar();
  applyPromoFocus();
  if(state.galleryView==="photo") scrollPhotoTo();
}
function renderScreen(){
  if(state.tab==="promos"){
    if(state.promoView==="feed")return renderPromosFeed();
    if(state.promoView==="detail")return renderPromoDetail();
    if(state.promoView==="gallery")return renderPromoGallery();
    if(state.promoView==="link")return renderPromoLink();
  }
  if(state.tab==="restaurants"){
    if(state.restaurantView&&state.restaurantView.view==="promo"&&state.restaurantView.promoId){
      const r=hasBridge()?EatoutsBridge.byId(state.restaurantView.id):null;
      if(r){
        EatoutsBridge.setActive(r.id);
        return '<div class="scroll">'+renderRestaurantPromoDetail(r,state.restaurantView.promoId)+'<div style="height:24px"></div></div>';
      }
    }
    if(state.restaurantView)return renderRestaurantSubView();
    return renderRestaurants();
  }
  if(state.tab==="reserve"){
    if(state.reserveSub)return renderReserveForm();
    if(state.reserveCat)return renderReserveSubs();
    return renderReserveCats();
  }
  if(state.tab==="gallery"){
    if(state.galleryView==="photo")return renderPhoto();
    return renderGalleryGrid();
  }
  if(state.tab==="about"){
    if(state.legalView)return renderLegalDoc(state.legalView);
    if(state.operatorView==="login")return renderOperatorLogin();
    if(state.aboutView==="gallery")return renderRestaurantGallery();
    return renderAbout();
  }
  return "";
}

  const f=promoById(p&&p.id);
  if(!f) return foodImg(0);

  const list=promoListFor(dayIdx);
  let idx=list.findIndex(function(x){return x.id===p.id;});

            h+='<div class="co-exsum" data-exsum="'+key+':'+ei+'"'+(q?"":" style=\"display:none\"")+'>'+q+' × '+esc(ex[0])+'  '+fmt(ex[1]*q)+'</div>';

function renderSplitLines(){
  const lines=checkoutLines();
  let h='<div class="subh">Items</div>';
  if(!state.splitPeople.length){
    h+='<div class="empty" style="padding:20px 8px">Add a person above to start splitting.<br>'+
       'Every item stays editable until you send.</div>';
    return h;
  }
  lines.forEach(function(line){
    const unit=lineUnitPrice(line);
    const un=lineUnassignedQty(line);
    h+='<div class="split-line">';
    h+='<div class="split-line-head">'+
       '<div class="split-line-name">'+line.qty+'× '+esc(line.name)+
       (line.size?' <em>('+esc(line.size)+')</em>':'')+'</div>'+
       '<div class="split-line-tot">'+fmt(line.total)+'</div></div>';
    const exBits=[];
    Object.keys(line.extras||{}).forEach(function(ei){
      const q=line.extras[ei];const ex=line.it.extras&&line.it.extras[ei];
      if(q>0&&ex) exBits.push(q+'× '+ex[0]);
    });
    if(exBits.length) h+='<div class="split-line-meta">+ '+esc(exBits.join(" · "))+'</div>';
    h+='<div class="split-line-unit">'+fmt(unit)+' each</div>';
    h+='<div class="split-line-rows">';
    state.splitPeople.forEach(function(p){
      const q=splitQty(line.key,p.id);
      h+='<div class="split-row">'+
         '<span class="split-dot" style="background:'+p.color+'"></span>'+
         '<span class="split-row-name">'+esc(p.name)+'</span>'+
         '<div class="stp">'+
           '<button data-act="splitMinus" data-key="'+esc(line.key)+'" data-pid="'+p.id+'"'+(q<=0?" disabled":"")+'>&minus;</button>'+
           '<span class="val" data-splitq="'+esc(line.key)+':'+p.id+'">'+q+'</span>'+
           '<button data-act="splitPlus" data-key="'+esc(line.key)+'" data-pid="'+p.id+'"'+(un<=0?" disabled":"")+'>+</button>'+
         '</div>'+
         '<span class="split-row-sub">'+fmt(q*unit)+'</span>'+
         '</div>';
    });
    h+='<div class="split-unrow'+(un?"":" zero")+'">'+
       '<span class="split-row-name">Unassigned</span>'+
       '<span class="split-row-sub">'+fmt(un*unit)+' <em>('+un+' of '+line.qty+')</em></span>'+
       '</div>';
    h+='</div></div>';
  });
  return h;
}

/* ================================================================
   SPLIT MESSAGES
   ================================================================ */
function buildFullBillMessage(){
  const lines=checkoutLines();
  const total=cartTotal();
  const restName=curRestaurantName();
  let msg="*NEW MENU ORDER*\nVenue: "+restName;
  if(state.orderName.trim())    msg+="\nName: "+state.orderName.trim();
  if(state.orderContact.trim()) msg+="\nContact: "+state.orderContact.trim();
  if(state.orderNotes.trim())   msg+="\nNotes: "+state.orderNotes.trim();
  msg+="\n\n*Order Summary:*\n";
  lines.forEach(function(l){
    if(l.qty>0) msg+=l.qty+"x "+l.name+(l.size?" ("+l.size+")":"")+
      " @"+fmt(l.price)+" — "+fmt(l.price*l.qty)+"\n";
    Object.keys(l.extras||{}).forEach(function(ei){
      const q=l.extras[ei];const ex=l.it.extras&&l.it.extras[ei];
      if(q>0&&ex) msg+=" + "+q+"x "+ex[0]+" — "+fmt(ex[1]*q)+"\n";
    });
  });
  if(state.splitPeople.length){
    msg+="\n*Split:*\n";
    state.splitPeople.forEach(function(p){
      msg+=p.name+": "+fmt(personTotal(p.id))+"\n";
    });
    const un=unassignedTotal();
    if(un>0.005) msg+="Unassigned: "+fmt(un)+"\n";
  }
  msg+="\n*Total:* "+fmt(total);
  return msg;
}
function buildPersonMessage(p){
  const restName=curRestaurantName();
  const rc=restaurantContact();
  const lines=personLines(p.id);
  const myTotal=personTotal(p.id);
  const grand=cartTotal();
  let msg="*BILL SPLIT — "+restName+"*\n\n"+
    "Hi "+p.name+", here's your share:\n\n"+
    "*Your Items:*\n";
  lines.forEach(function(x){
    msg+=x.qty+"x "+x.line.name+(x.line.size?" ("+x.line.size+")":"")+" — "+fmt(x.subtotal)+"\n";
    Object.keys(x.line.extras||{}).forEach(function(ei){
      const q=x.line.extras[ei];const ex=x.line.it.extras&&x.line.it.extras[ei];
      if(q>0&&ex) msg+=" + "+q+"x "+ex[0]+"\n";
    });
  });
  if(!lines.length) msg+="(Nothing assigned yet)\n";
  msg+="\n*Your Total: "+fmt(myTotal)+"*\n"+
    "Full order: "+fmt(grand)+"\n\n"+
    "---\n"+
    "To pay, or forward to the restaurant:\n"+
    restName+"\n"+
    "WhatsApp: "+rc.display;
  return msg;
}

/* subheading above body, centred, divided by a hairline */
function aboutBlock(head,body){
  return '<div class="ablock"><p class="abh">'+esc(head)+'</p><p class="abv">'+esc(body)+'</p></div>';
}

/* ================================================================
   LEGAL DOCS
   Reachable from the About tab. The JSON documents are loaded
   inline via <script> tags (no fetch/CORS), each wrapped in a
   window global that byte-mirrors its .json source:
   terms   -> window.EATOUTS_TERMS_OF_SERVICE.termsOfService
   privacy -> window.EATOUTS_PRIVACY_POLICY.legal.privacyPolicy
   ============================================================ */
function legalDoc(type){
  if(type==="terms"){
    const w=window.EATOUTS_TERMS_OF_SERVICE;
    return w&&w.termsOfService||null;
  }
  if(type==="privacy"){
    const w=window.EATOUTS_PRIVACY_POLICY;
    return w&&w.legal&&w.legal.privacyPolicy||null;
  }
  return null;
}
function renderLegalDoc(type){
  const doc=legalDoc(type);
  let h='<div class="scroll">';
  h+='<div class="crumb"><button data-act="backLegal">'+esc("About")+'</button><span class="sep">/</span><span class="cur">'+esc((doc&&doc.title)||"Legal")+'</span></div>';
  if(!doc){
    h+='<div class="empty">This document is unavailable right now.</div>';
    h+='<div style="height:24px"></div></div>';
    return h;
  }
  h+='<div class="phead" style="padding-top:0"><h2>'+esc(doc.title)+'</h2>'+
    '<p>Last updated '+esc(doc.lastUpdated||"")+(doc.version?' · Version '+esc(doc.version):'')+'</p></div>';
  h+='<div class="pad">';
  (doc.sections||[]).forEach(function(sec){
    h+='<div class="legal-sec">'+esc(sec.number+". "+sec.heading)+'</div>';
    (sec.paragraphs||[]).forEach(function(p){
      h+='<p class="legal-para">'+esc(p)+'</p>';
    });
  });
  h+='</div><div style="height:34px"></div></div>';
  return h;
}

  h+='<div class="fld"><label>Password</label>'+
    '<input id="opPass" type="password" autocomplete="current-password" placeholder="'+
    esc(demo?demo.password:"")+'" value="'+(demo?esc(demo.password):"")+'"></div>';

  h+='<div id="opErr" style="display:none;color:#8a3a3a;font-size:12px;font-weight:700;margin:-2px 0 10px"></div>';

  h+='<button class="btn primary full" data-act="doOperatorLogin"'+(insecure?" disabled":"")+'>Log in</button>';

  /* Demo is a real feature: one tap into The Yellow Giraffe */
  h+='<div class="subh" style="margin-top:22px">Or preview as</div>';
  h+='<button class="btn primary full" data-act="doOperatorDemo">Demo &mdash; The Yellow Giraffe</button>';
  h+='<p style="font-size:11px;color:#a89a7e;text-align:center;margin:9px 0 0;line-height:1.5">'+
    'Opens the owner console as The Yellow Giraffe so you can view and change its information. '+

/* ================================================================

   ================================================================ */
function bootEatoutsBridge(){
  if(!window.EatoutsBridge || typeof window.EatoutsBridge.setSource !== "function") return;
  const source={
    profile: PROFILE || null,
    menu: MENU || [],
    gallery: GALLERY || [],
    promos: PROMOS || {},
    events: EVENTS || {},
    performers: (window.PERFORMERS || [])
  };
  window.EatoutsBridge.setSource(source);
  if(typeof window.EatoutsBridge.ensureSeeded === "function") window.EatoutsBridge.ensureSeeded();
  if(typeof window.EatoutsBridge.setDayNames === "function") window.EatoutsBridge.setDayNames(DAY_NAMES);
  cbarDataRev++;
}

function render(){
  bootEatoutsBridge();
  renderViewport();
}

/* ================================================================
   EVENT HANDLING
   ================================================================ */
document.addEventListener("click",function(e){
  const nav=e.target.closest("[data-tab]");
  if(nav){
    const nextTab=nav.getAttribute("data-tab");
    /* tapping Promos again while on Promos shows/hides the promo filter bar */
    if(nextTab==="promos" && state.tab==="promos"){
      state.promoFilterOpen=!state.promoFilterOpen;
      if(!state.promoFilterOpen){state.promoTownPicker=false;state.promoAreaPicker=false;state.promoTypePicker=false;}
      /* only the filter bar changes here - a full render() was flashing the
         whole promo feed just to toggle one CSS class */
      renderControlBar();return;
    }
    /* same deal on Restaurants, but only from the list itself - inside a
       restaurant sub-view the tap means "take me back to the list" */
    if(nextTab==="restaurants" && state.tab==="restaurants" && !state.restaurantView){
      state.restFilterOpen=!state.restFilterOpen;
      if(!state.restFilterOpen){state.filterOpen=false;}
      renderControlBar();return;
    }
    state.tab=nextTab;
    state.promoFilterOpen=false;
    state.operatorView="about";
    state.preview=null;
    if(state.tab==="promos"){state.promoView="feed";state.promoId=null;state.promoGalleryId=null;state.promoExpanded=null;}
    if(state.tab==="menu"){state.menuCat=null;state.menuOpen=null;state.checkoutView=false;state.splitOpen=false;}
    if(state.tab==="restaurants"){
      /* always land back on the list, and hide the filter bar again.
         The cuisine choice and search text are kept deliberately. */
      state.restaurantView=null;state.restaurantOpen=null;state.restFilterOpen=false;state.restLocPicker=null;state.restNotice=null;
      state.splitOpen=false;state.splitPeople=[];state.splitAssign={};
    }
    if(state.tab==="reserve"){state.reserveCat=null;state.reserveSub=null;}
    if(state.tab==="gallery"){state.galleryView="grid";state.galleryPhoto=null;state.filterOpen=false;state.searchOpen=false;}
    if(state.tab==="about"){state.aboutView="main";}
    render();
    return;
  }
  /* Photo preview: tapping a menu item's thumbnail or a strip photo opens
     a large view of that image instead of toggling the row. */
  const menuThumb=e.target.closest(".mthumb")||e.target.closest(".th");
  if(menuThumb){
    const img=menuThumb.querySelector("img");
    if(img&&img.src){
      const mitem=menuThumb.closest(".mitem");
      const nameEl=mitem?mitem.querySelector(".mtitle"):null;
      state.preview={src:img.src,name:nameEl?nameEl.textContent:""};
      render();
      return;
    }
  }
  /* Restaurant logo preview: only when the venue has a real logo image;
     letter-tile venues fall through to the normal row toggle. */
  const restThumb=e.target.closest(".rthumb");
  if(restThumb){
    const img=restThumb.querySelector("img");
    if(img&&img.src){
      const row=restThumb.closest(".rrow");
      const nameEl=row?row.querySelector(".rname"):null;
      state.preview={src:img.src,name:nameEl?nameEl.textContent:""};
      render();
      return;
    }
  }

  const t=e.target.closest("[data-act]");
  if(!t)return;
  const act=t.getAttribute("data-act");
  const id=t.getAttribute("data-id");

  /* Close the photo preview; tapping the image itself stays inert */
  if(act==="closePreview"){if(e.target.closest(".preview-img"))return;state.preview=null;render();return;}

  /* PROMOS */
  if(act==="pickDay"){state.promoDay=parseInt(t.getAttribute("data-day"),10);state.promoExpanded=null;render();return;}
  if(act==="togglePromo"){state.promoExpanded=(state.promoExpanded===id)?null:id;syncAccordions();return;}
  if(act==="togglePoetryAll"){state.poetryAll=!state.poetryAll;render();syncAccordions();return;}
  if(act==="openPromo"){state.promoView="detail";state.promoId=id;if(!state.promoSeats[id])state.promoSeats[id]=1;render();return;}
  if(act==="backPromo"){state.promoView="feed";state.promoId=null;render();return;}
  if(act==="openPromoGallery"){state.promoView="gallery";state.promoGalleryId=id;render();return;}
  if(act==="backPromoGallery"){state.promoView="detail";state.promoGalleryId=null;render();return;}
  if(act==="openPromoLink"){state.promoView="link";state.promoId=id;render();return;}
  if(act==="backPromoLink"){state.promoView="detail";render();return;}
  if(act==="seatPlus"){state.promoSeats[id]=(state.promoSeats[id]||1)+1;render();return;}
  if(act==="seatMinus"){state.promoSeats[id]=Math.max(1,(state.promoSeats[id]||1)-1);render();return;}
  if(act==="addonPlus"){const i=parseInt(t.getAttribute("data-idx"),10);if(!state.promoAddons[id])state.promoAddons[id]={};state.promoAddons[id][i]=(state.promoAddons[id][i]||0)+1;render();return;}
  if(act==="addonMinus"){const i=parseInt(t.getAttribute("data-idx"),10);if(!state.promoAddons[id])state.promoAddons[id]={};state.promoAddons[id][i]=Math.max(0,(state.promoAddons[id][i]||0)-1);render();return;}
  if(act==="waPromo"){
    const f=promoById(id);if(!f)return;
    const p=f.promo;
    const seats=state.promoSeats[p.id]||1;
    const addons=state.promoAddons[p.id]||{};
    let msg="*EVENT RESERVATION REQUEST*\nEvent: "+p.title+"\nDate: "+f.day+" ("+p.valid+")\nSeats: "+seats+"\n";
    let extras=[];
    PROMO_ADDONS.forEach((a,i)=>{if(addons[i])extras.push("- "+a.name+" ("+addons[i]+")");});
    if(extras.length)msg+="Extras:\n"+extras.join("\n")+"\n";
    let total=p.price*seats;
    PROMO_ADDONS.forEach((a,i)=>{total+=a.price*(addons[i]||0);});
    msg+="Estimated Total: P"+total.toFixed(2)+"\n\nPlease confirm seat availability.";
    window.location.href=waLink(msg);
    return;
  }
  if(act==="waPoetry"){
    const seats=state.poetrySeats||2;
    const msg="*POETRY NIGHT RESERVATION*\nEvent: "+POETRY.title+"\nVenue: Masa Square, central Gaborone\n"+
      "Tagline: "+POETRY.tag+"\nTickets: "+seats+"\n\n"+
      "Standard/Early Bird P100 | Door P150 | Students P50 | Double P150\n\n"+
      "Please confirm availability and how to pay.";
    window.location.href=waLink(msg);
    return;
  }
  if(act==="waEvent"){
    const evId=t.getAttribute("data-ev") || t.getAttribute("data-day");
    let evInfo = null;
    if(evId){
      evInfo = hasBridge() ? EatoutsBridge.findEventAnywhere(evId) : null;
      if(!evInfo && evId!==null && evId!==undefined){
        const dayIdx=parseInt(evId,10);
        const ev=eventFor(dayIdx);
        if(ev){
          evInfo={event:ev, day:DAY_NAMES[dayIdx]||"Today", restaurant:{name:(PROFILE&&PROFILE.name)||"The Yellow Giraffe"}};
        }
      }
    }
    if(!evInfo || !evInfo.event) return;
    const day=evInfo.day || (evInfo.event.day || "Today");
    const venueName=(evInfo.restaurant && evInfo.restaurant.name) || (PROFILE && PROFILE.name) || "EatOuts";
    const msg="*EVENT INQUIRY*\nEvent: "+(evInfo.event.name || evInfo.event.title || "Event")+"\nVenue: "+venueName+"\nDay: "+day+"\nTime: "+(evInfo.event.time || "TBC")+"\n\nPlease share more details.";
    window.location.href=waLink(msg);
    return;
  }
  if(act==="pickTown"){
    state.promoTown=t.getAttribute("data-town")||"All";
    state.promoDistrict=t.getAttribute("data-district")||"";
    state.promoDistrictName=t.getAttribute("data-district-name")||"";
    state.promoArea="All";state.promoTownPicker=false;state.promoAreaPicker=false;render();return;
  }
  if(act==="pickArea"){
    state.promoTown=t.getAttribute("data-town")||"All";
    state.promoDistrict=t.getAttribute("data-district")||"";
    state.promoDistrictName=t.getAttribute("data-district-name")||"";
    state.promoArea=t.getAttribute("data-area")||"All";state.promoTownPicker=false;state.promoAreaPicker=false;render();return;
  }
  if(act==="pickPromoType"){state.promoType=t.getAttribute("data-val")||"All";state.promoTypePicker=false;render();return;}
  if(act==="openTownPicker"){state.promoTownPicker=true;state.promoAreaPicker=false;state.promoTypePicker=false;renderControlBar();return;}
  if(act==="openAreaPicker"){if(state.promoTown==="All")return;state.promoAreaPicker=true;state.promoTownPicker=false;state.promoTypePicker=false;renderControlBar();return;}
  if(act==="openPromoTypePicker"){state.promoTypePicker=true;state.promoTownPicker=false;state.promoAreaPicker=false;renderControlBar();return;}
  if(act==="closePickers"){state.promoTownPicker=false;state.promoAreaPicker=false;state.promoTypePicker=false;renderControlBar();return;}
  if(act==="toggleRestaurant"){const nextId=id;state.restaurantOpen=(state.restaurantOpen===nextId)?null:nextId;state.restaurantView=null;state.filterOpen=false;state.restLocPicker=null;state.restNotice=null;syncRestAccordions();return;}
  if(act==="openRestView"){const bid=id;const brand=t.getAttribute("data-brand")||state.restaurantOpen||bid;state.restaurantOpen=brand;state.restaurantView={id:bid,brand:brand,view:t.getAttribute("data-view")||"menu",promoId:null};state.checkoutView=false;state.splitOpen=false;state.splitPeople=[];state.splitAssign={};state.restLocPicker=null;state.restNotice=null;if(hasBridge())EatoutsBridge.setActive(bid);render();return;}
  if(act==="backFromRestView"){state.restaurantView=null;state.restaurantOpen=null;state.checkoutView=false;state.splitOpen=false;state.splitPeople=[];state.splitAssign={};state.restLocPicker=null;state.restNotice=null;render();return;}
  if(act==="openRestPromo"){const brand=t.getAttribute("data-brand")||(state.restaurantView&&state.restaurantView.brand)||id;state.restaurantView={id:id,brand:brand,view:"promo",promoId:t.getAttribute("data-promo")||null};render();return;}

  if(act==="dismissRestNotice"){if(restNoticeTimer)clearTimeout(restNoticeTimer);state.restNotice=null;render();return;}

  }
  if(act==="closeRestLocPicker"){state.restLocPicker=null;render();return;}

    const brand=t.getAttribute("data-brand")||(state.restLocPicker&&state.restLocPicker.brand)||"";
    if(brand&&id)state.restBranchOf[brand]=id;
    else if(brand)delete state.restBranchOf[brand];
    state.restLocPicker=null;render();return;
  }
  if(act==="backRestPromo"){if(state.restaurantView){state.restaurantView.view="promos";state.restaurantView.promoId=null;}render();return;}
  if(act==="waVenue"){const r=hasBridge()?EatoutsBridge.byId(id):null;const venue=(r&&r.name)||(PROFILE&&PROFILE.name)||"EatOuts";const venueType=document.getElementById("venueType")||{};const venueDate=document.getElementById("venueDate")||{};const venuePax=document.getElementById("venuePax")||{};const venueNotes=document.getElementById("venueNotes")||{};const msg="*VENUE BOOKING INQUIRY*\nVenue: "+venue+"\nEvent Type: "+(venueType.value||"TBC")+"\nDate: "+(venueDate.value||"TBC")+"\nGuests: "+(venuePax.value||"TBC")+"\nNotes: "+(venueNotes.value||"N/A");window.location.href=waLink(msg);return;}
  if(act==="waRestPromo"){const r=hasBridge()?EatoutsBridge.byId(id):null;const promo=(r && EatoutsBridge.bundleOf(r.id)) ? ((function(){for(const d in EatoutsBridge.bundleOf(r.id).promos){const found=(EatoutsBridge.bundleOf(r.id).promos[d]||[]).find(x=>x.id===t.getAttribute("data-promo"));if(found)return found;}return null;})()) : null;const venue=(r&&r.name)||(PROFILE&&PROFILE.name)||"EatOuts";const p=promo||{};const msg="*PROMO ENQUIRY*\nVenue: "+venue+"\nPromo: "+(p.title||"Promo")+"\nPrice: P"+(p.price||0)+"\nValid: "+(p.valid||"TBC")+"\n\nPlease confirm availability.";window.location.href=waLink(msg);return;}
  if(act==="waRestAbout"){const r=hasBridge()?EatoutsBridge.byId(id):null;const venue=(r&&r.name)||(PROFILE&&PROFILE.name)||"EatOuts";const msg="*VENUE INQUIRY*\nVenue: "+venue+"\n\nHi! I'd like to know more about this location.";window.location.href=waLink(msg);return;}
  if(act==="openRestTownPicker"){
    state.restTownPicker=!state.restTownPicker;state.restAreaPicker=false;state.restTypePicker=false;
    state.restTypeDraft=state.restTypes.slice();state.restTypeSearch="";renderControlBar();return;
  }
  if(act==="closeRestTownPicker"){state.restTownPicker=false;renderControlBar();return;}

  if(act==="szMinus"){const si=parseInt(t.getAttribute("data-si"),10);const nid=parseInt(id,10);const l=cartLine(nid,si);l.qty=Math.max(0,(l.qty||0)-1);if(!l.qty&&!Object.keys(l.extras||{}).length)delete state.cart[cartKey(nid,si)];syncCart();return;}
  if(act==="exPlus"){const ei=parseInt(t.getAttribute("data-ei"),10);const si=t.hasAttribute("data-si")?parseInt(t.getAttribute("data-si"),10):0;const nid=parseInt(id,10);const l=cartLine(nid,si);if(!l.extras)l.extras={};l.extras[ei]=(l.extras[ei]||0)+1;syncCart();return;}
  if(act==="exMinus"){const ei=parseInt(t.getAttribute("data-ei"),10);const si=t.hasAttribute("data-si")?parseInt(t.getAttribute("data-si"),10):0;const nid=parseInt(id,10);const l=cartLine(nid,si);if(!l.extras)l.extras={};l.extras[ei]=Math.max(0,(l.extras[ei]||0)-1);if(!l.qty&&!Object.keys(l.extras).length)delete state.cart[cartKey(nid,si)];syncCart();return;}
  if(act==="openCheckout"){if(cartTotal()<=0)return;state.checkoutView=true;render();return;}
  if(act==="backFromCheckout"){state.checkoutView=false;state.checkoutOpen=null;state.splitOpen=false;render();return;}
  if(act==="toggleCheckoutRow"){const k=t.getAttribute("data-key");state.checkoutOpen=(state.checkoutOpen===k?null:k);render();return;}

  /* SPLIT THE BILL */
  if(act==="openSplit"){state.splitOpen=true;render();return;}
  if(act==="backFromSplit"){state.splitOpen=false;render();return;}
  if(act==="addSplitPerson"){
    const el=document.getElementById("splitNewName");
    const name=el?el.value:"";
    if(!String(name).trim()){if(el)el.focus();return;}
    addSplitPerson(name);
    state.splitNewName="";
    render();
    setTimeout(function(){const i=document.getElementById("splitNewName");if(i)i.focus();},40);
    return;
  }
  if(act==="removeSplitPerson"){removeSplitPerson(id);render();return;}
  if(act==="splitPlus"){
    const skey=t.getAttribute("data-key");
    const spid=t.getAttribute("data-pid");
    let line=null;checkoutLines().forEach(function(l){if(l.key===skey)line=l;});
    if(!line||lineUnassignedQty(line)<=0) return;
    setSplitQty(skey,spid,splitQty(skey,spid)+1);
    render();return;
  }
  if(act==="splitMinus"){
    const skey=t.getAttribute("data-key");
    const spid=t.getAttribute("data-pid");
    setSplitQty(skey,spid,Math.max(0,splitQty(skey,spid)-1));
    render();return;
  }
  if(act==="waSplitRestaurant"){
    const nameEl=document.getElementById("orderName");
    const contactEl=document.getElementById("orderContact");
    const notesEl=document.getElementById("orderNotes");
    if(nameEl)state.orderName=nameEl.value;
    if(contactEl)state.orderContact=contactEl.value;
    if(notesEl)state.orderNotes=notesEl.value;
    if(!state.orderName.trim()||!state.orderContact.trim()){
      alert("Please enter your name and contact number.");return;
    }
    window.location.href=waLink(buildFullBillMessage());
    return;
  }
  if(act==="waSplitPerson"){
    const p=state.splitPeople.find(function(x){return x.id===id;});
    if(!p) return;
    /* no phone number -> WhatsApp opens its built-in contact picker */
    window.location.href=waShareLink(buildPersonMessage(p));
    return;
  }

  if(act==="waOrder"){
    const nameEl=document.getElementById("orderName");
    const contactEl=document.getElementById("orderContact");
    const notesEl=document.getElementById("orderNotes");
    if(nameEl)state.orderName=nameEl.value;
    if(contactEl)state.orderContact=contactEl.value;
    if(notesEl)state.orderNotes=notesEl.value;
    if(!state.orderName.trim()||!state.orderContact.trim()){alert("Please enter your name and contact number.");return;}
    if(cartTotal()<=0){alert("Your cart is empty.");return;}
    window.location.href=waLink(buildFullBillMessage());
    return;
  }

  /* RESERVE */
  if(act==="openResCat"){state.reserveCat=id;state.reserveSub=null;render();return;}
  if(act==="backResCats"){state.reserveCat=null;state.reserveSub=null;render();return;}
  if(act==="openResSub"){state.reserveSub=id;render();return;}
  if(act==="backResSubs"){state.reserveSub=null;render();return;}
  if(act==="waReserve"){
    const cat=RESERVE.find(c=>c.id===state.reserveCat);
    if(!cat)return;
    const dateEl=document.getElementById("resDate");
    const paxEl=document.getElementById("resPax");
    const notesEl=document.getElementById("resNotes");
    const date=dateEl?dateEl.value:"";
    const pax=paxEl?paxEl.value:"";
    const notes=notesEl?notesEl.value:"";
    const msg="*VENUE BOOKING INQUIRY*\nCategory: "+cat.name+" ("+state.reserveSub+")\nEstimated Guests: "+(pax||"TBC")+"\nPreferred Date: "+(date||"TBC")+"\nNotes: "+(notes||"N/A");
    window.location.href=waLink(msg);
    return;
  }

  /* GALLERY */
  if(act==="cycleFilter"){state.filterOpen=!state.filterOpen;renderControlBar();return;}
  if(act==="pickFilter"){state.galleryFilter=t.getAttribute("data-val")||"All";state.filterOpen=false;state.galleryPhoto=null;state.galleryView="grid";render();return;}
  if(act==="closeFilter"){if(!state.filterOpen)return;state.filterOpen=false;renderControlBar();return;}
  if(act==="openPhoto"){state.galleryPhoto=id;state.galleryView="photo";render();return;}
  if(act==="backAlbum"){state.galleryView="grid";state.galleryPhoto=null;render();return;}
  if(act==="openSearch"){state.searchOpen=true;render();setTimeout(function(){const i=document.getElementById("gsearch");if(i)i.focus();},60);return;}
  if(act==="closeSearch"){state.searchOpen=false;state.gallerySearch="";render();return;}

  /* ABOUT */
  if(act==="openAboutGallery"){state.aboutView="gallery";render();return;}
  if(act==="backAboutGallery"){state.aboutView="main";render();return;}

  /* TERMS / PRIVACY */
  if(act==="openTerms"){state.legalView="terms";render();return;}
  if(act==="openPrivacy"){state.legalView="privacy";render();return;}
  if(act==="backLegal"){state.legalView=null;render();return;}

  /* OPERATOR LOGIN */
  if(act==="openOperatorLogin"){
    if(state.tab!=="about"){state.tab="about";state.aboutView="main";}
    state.operatorView="login";render();return;
  }
  if(act==="backFromOperatorLogin"){state.operatorView="about";state.aboutView="main";render();return;}
  if(act==="doOperatorLogin"){
    const wEl=document.getElementById("opWhats"), pEl=document.getElementById("opPass");
    const errEl=document.getElementById("opErr");
    const show=(msg)=>{if(errEl){errEl.textContent=msg;errEl.style.display="block";}};
    const whats=wEl?wEl.value:"", pass=pEl?pEl.value:"";
    if(!window.EatoutsAuth){show("Sign-in is unavailable.");return;}
    setTimeout(function(){
      EatoutsAuth.login(whats,pass).then(function(res){
        if(res.ok){location.href="restaurant-dashboard.html";return;}
        show(res.message||"Sign-in failed.");
        if(pEl){pEl.value="";pEl.focus();}
      }).catch(function(){show("Sign-in failed. Check the console.");});
    },30);
    return;
  }
  if(act==="doOperatorDemo"){
    if(!window.EatoutsAuth){alert("Sign-in is unavailable.");return;}
    EatoutsAuth.loginDemo().then(function(res){
      if(res.ok){location.href="restaurant-dashboard.html";return;}
      alert(res.message||"Demo login failed.");
    });
    return;
  }
  if(act==="waAbout"){
    const msg="*INQUIRY — EatOuts*\n\nHi! I'd like to know more about EatOuts and the venues available.";
    window.location.href=waLink(msg);
    return;
  }
});

/* Escape closes the filter popup */
document.addEventListener("keydown",function(e){
  if(e.key==="Enter" && e.target && e.target.id==="splitNewName"){
    e.preventDefault();
    const name=e.target.value;
    if(!String(name).trim()) return;
    addSplitPerson(name);
    state.splitNewName="";
    render();
    setTimeout(function(){const i=document.getElementById("splitNewName");if(i)i.focus();},40);
    return;
  }
  if(e.key==="Escape"||e.keyCode===27){
    if(state.preview){state.preview=null;render();}
    else if(state.restLocPicker){state.restLocPicker=null;render();}
    else if(state.restNotice){state.restNotice=null;render();}
    else if(state.restTownPicker||state.restAreaPicker||state.restTypePicker){
      state.restTownPicker=false;state.restAreaPicker=false;state.restTypePicker=false;
      state.restTypeDraft=state.restTypes.slice();state.restTypeSearch="";renderControlBar();
    }
    else if(state.filterOpen){state.filterOpen=false;renderControlBar();}
    else if(state.searchOpen){state.searchOpen=false;state.gallerySearch="";render();}
  }
});

document.addEventListener("change",function(e){
  if(!e.target.matches("[data-rest-type-option]"))return;
  const value=e.target.value;
  const selected=state.restTypeDraft.indexOf(value)>-1;
  if(e.target.checked&&!selected)state.restTypeDraft.push(value);
  if(!e.target.checked&&selected)state.restTypeDraft=state.restTypeDraft.filter(function(type){return type!==value;});
  renderControlBar();
  Array.prototype.forEach.call(document.querySelectorAll("[data-rest-type-option]"),function(input){if(input.value===value)input.focus();});
});

/* Live search input */
document.addEventListener("input",function(e){
  if(e.target.id==="restTypeSearch"){
    state.restTypeSearch=e.target.value;
    const inputValue=state.restTypeSearch;
    const start=e.target.selectionStart;
    renderControlBar();
    const input=document.getElementById("restTypeSearch");
    if(input){input.focus();input.setSelectionRange(start,start);}
    state.restTypeSearch=inputValue;
  }
  if(e.target.id==="restTownSearch"){
    state.restTownSearch=e.target.value;
    const inputValue=state.restTownSearch;
    const start=e.target.selectionStart;
    renderControlBar();
    const input=document.getElementById("restTownSearch");
    if(input){input.focus();input.setSelectionRange(start,start);}
    state.restTownSearch=inputValue;
  }
  if(e.target.id==="restAreaSearch"){
    state.restAreaSearch=e.target.value;
    const inputValue=state.restAreaSearch;
    const start=e.target.selectionStart;
    renderControlBar();
    const input=document.getElementById("restAreaSearch");
    if(input){input.focus();input.setSelectionRange(start,start);}
    state.restAreaSearch=inputValue;
  }
  if(e.target.id==="gsearch"){
    state.gallerySearch=e.target.value;
    const val=state.gallerySearch;
    render();
    state.gallerySearch=val;
    const inp=document.getElementById("gsearch");
    if(inp){inp.value=val;inp.focus();inp.setSelectionRange(val.length,val.length);}
  }
  if(e.target.id==="rsearch"){
    state.restSearch=e.target.value;
    render();
    const inp=document.getElementById("rsearch");
    if(inp){inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length);}
  }
  if(e.target.id==="orderName")state.orderName=e.target.value;
  if(e.target.id==="orderContact")state.orderContact=e.target.value;
  if(e.target.id==="orderNotes")state.orderNotes=e.target.value;
  if(e.target.id==="splitNewName")state.splitNewName=e.target.value;
});

/* Swiper dot indicator (vertical paging) */
document.addEventListener("scroll",function(e){
  const sw=e.target.closest?e.target.closest(".swiper"):null;
  if(!sw)return;
  const idx=Math.round(sw.scrollTop/sw.clientHeight);
  const parent=sw.parentElement;
  if(!parent)return;
  const dots=parent.querySelectorAll(".dots i");
  dots.forEach((d,i)=>d.classList.toggle("on",i===idx));
},true);

/* Boot */
bootEatoutsBridge();
render();
loadRestaurantTypeFilters();
loadDirectoryMenus(function(){
  bootEatoutsBridge();
  render();
});
window.addEventListener("storage",function(e){
  if(e.key===EatoutsDB.KEY||e.key===null){
    bootEatoutsBridge();
    render();
  }
});
</script>
