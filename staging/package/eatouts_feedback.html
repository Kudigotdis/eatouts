<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#ffffff"><title>Feedback · EatOuts</title><link rel="stylesheet" href="assets/eatouts-manager.css"></head><body><div class="login"><div class="loginbox"><div class="loginlogo">EatOuts</div><div class="crumb">Feedback</div><h1>Tell us what happened</h1><form id="f"><label class="field"><span>Subject</span><input name="subject" required></label><label class="field"><span>Message</span><textarea name="message" required></textarea></label><button class="btn primary full">Submit feedback</button></form><div class="card" style="margin-top:14px"><div class="card-title">My past submissions</div><div id="mine"></div></div></div></div><script src="js/eatouts-db.js"></script><script src="js/eatouts-roles.js"></script><script src="js/eatouts-users.js"></script><script src="js/eatouts-feedback.js"></script><script src="js/eatouts-blog.js"></script><script src="js/eatouts-auth.js"></script><script src="js/eatouts-manager.js"></script><script>const u=EatoutsAuth.getUser()||{id:"u-customer",whatsapp:"26770000001"};function render(){document.querySelector("#mine").innerHTML=EatoutsFeedback.mine(u.id).map(x=>`<div class="listrow"><div class="listmain"><strong>${x.id} · ${EO.esc(x.subject)}</strong><small>${x.created}</small></div>${EO.status(x.status)}</div>`).join("")||"<div class='empty'>No previous submissions.</div>"}document.querySelector("#f").onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),x=EatoutsFeedback.create({userId:u.id,whatsapp:u.whatsapp,subject:f.get("subject"),message:f.get("message")});alert("Submitted as "+x.id);e.target.reset();render()};render();</script></body></html>
