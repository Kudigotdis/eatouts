<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#ffffff"><title>Event suppliers · EatOuts</title><link rel="stylesheet" href="assets/eatouts-manager.css"></head><body><div class="login"><div class="loginbox"><div class="loginlogo">EatOuts</div><div class="crumb">Supplier catalogue</div><h1>Event suppliers</h1><p>Uses the same EatOuts authentication and database model as the rest of the platform. Supplier catalogue is now one canonical data source.</p><div id="cat"></div><div class="actions" style="margin-top:12px"><a class="btn primary" href="supplier-onboarding.html">Become a supplier</a><a class="btn" href="quote-manager.html">Manage quotes</a></div></div></div><script src="assets/data/supplier_catalog.js"></script><script src="js/eatouts-db.js"></script><script src="js/eatouts-roles.js"></script><script src="js/eatouts-users.js"></script><script src="js/eatouts-feedback.js"></script><script src="js/eatouts-blog.js"></script><script src="js/eatouts-auth.js"></script><script src="js/eatouts-manager.js"></script><script>document.addEventListener("DOMContentLoaded",()=>document.querySelector("#cat").innerHTML=EATOUTS_SUPPLIER_CATALOG.map(c=>`<div class="card"><div class="card-title">${c.name}</div><div>${c.items.map(i=>`<span class="btn" style="margin:2px">${i}</span>`).join("")}</div></div>`).join(""));</script></body></html>
