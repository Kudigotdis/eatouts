<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#ffffff"><title>Review manager · EatOuts</title><link rel="stylesheet" href="assets/eatouts-manager.css"></head><body><div id="mount"></div><script src="js/eatouts-db.js"></script><script src="js/eatouts-roles.js"></script><script src="js/eatouts-users.js"></script><script src="js/eatouts-feedback.js"></script><script src="js/eatouts-blog.js"></script><script src="js/eatouts-auth.js"></script><script src="js/eatouts-manager.js"></script><script>document.addEventListener("DOMContentLoaded",()=>{const u=EO.guard({});if(!u)throw new Error("guard");document.querySelector("#mount").innerHTML=EO.shell("Review manager","Customer reviews, star breakdown and replies",`<div id="metrics" class="grid3"></div><div id="reviews"></div>`,{section:"Manager"});
const b=EO.business();function render(){const r=EatoutsDB.filter("reviews",x=>x.businessId===b.id),avg=r.length?r.reduce((s,x)=>s+x.stars,0)/r.length:0;document.querySelector("#metrics").innerHTML=EO.metric("Average",avg.toFixed(1),"stars")+EO.metric("Reviews",r.length,"total")+EO.metric("5 star",r.filter(x=>x.stars===5).length,"reviews");document.querySelector("#reviews").innerHTML=r.map(x=>`<article class="card"><div class="stars">${"★".repeat(x.stars)}${"☆".repeat(5-x.stars)}</div><strong>${EO.esc(x.customer)}</strong><small style="display:block;color:#999">${x.date}</small><p>${EO.esc(x.text)}</p><label class="field"><span>Reply</span><textarea data-reply="${x.id}">${EO.esc(x.reply||"")}</textarea></label><button class="btn primary" data-save="${x.id}">Save reply</button></article>`).join("")}document.querySelector("#reviews").onclick=e=>{const id=e.target.dataset.save;if(id){EatoutsDB.upsert("reviews",{id,reply:document.querySelector(`[data-reply="${id}"]`).value});render();EO.toast("Reply saved")}};render();});</script></body></html>
