<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#ffffff"><title>Users manager · EatOuts</title><link rel="stylesheet" href="assets/eatouts-manager.css"></head><body><div id="mount"></div><script src="js/eatouts-db.js"></script><script src="js/eatouts-roles.js"></script><script src="js/eatouts-users.js"></script><script src="js/eatouts-feedback.js"></script><script src="js/eatouts-blog.js"></script><script src="js/eatouts-auth.js"></script><script src="js/eatouts-manager.js"></script><script>document.addEventListener("DOMContentLoaded",()=>{if(!EO.guard({"roles": ["platform_admin", "platform_ops"]}))return;document.querySelector("#mount").innerHTML=EO.shell("Users manager","All users, roles, status, business and demo impersonation",`<div class="two"><label class="field"><span>Search</span><input id="search" placeholder="Name or WhatsApp"></label><label class="field"><span>Type</span><select id="type"><option value="">All</option><option>customer</option><option>biz_owner</option><option>supplier</option><option>platform_admin</option></select></label></div><div id="users" class="card"></div>`,{section:"Platform admin"});
function render(){let a=EatoutsUsers.all(),q=document.querySelector("#search").value.toLowerCase(),t=document.querySelector("#type").value;a=a.filter(u=>(!q||(u.firstName+" "+u.surname+" "+u.whatsapp).toLowerCase().includes(q))&&(!t||u.type===t));document.querySelector("#users").innerHTML=a.map(u=>`<div class="listrow"><div class="listmain"><strong>${EO.esc(u.firstName+" "+u.surname)}</strong><small>${u.whatsapp} · ${u.type} · ${u.businessId||"—"}</small></div><div class="actions">${EO.status(u.status)}<button class="btn" data-imp="${u.id}">Impersonate</button><button class="btn" data-reset="${u.id}">Reset PIN</button></div></div>`).join("")}document.querySelector("#search").oninput=render;document.querySelector("#type").onchange=render;document.querySelector("#users").onclick=e=>{const id=e.target.dataset.imp||e.target.dataset.reset;if(!id)return;localStorage.setItem(EatoutsAuth.SESSION,id);const u=EatoutsUsers.find(id);if(u.businessId)localStorage.setItem(EatoutsAuth.BUSINESS,u.businessId);if(e.target.dataset.reset)EO.toast("Demo PIN reset to 1234");else location.href=EatoutsAuth.routeFor(u)};render();});</script></body></html>
