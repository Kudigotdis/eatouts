<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#ffffff"><title>Business dashboard · EatOuts</title><link rel="stylesheet" href="assets/eatouts-manager.css"></head><body><div id="mount"></div><script src="js/eatouts-db.js"></script><script src="js/eatouts-roles.js"></script><script src="js/eatouts-users.js"></script><script src="js/eatouts-feedback.js"></script><script src="js/eatouts-blog.js"></script><script src="js/eatouts-auth.js"></script><script src="js/eatouts-manager.js"></script><script>document.addEventListener("DOMContentLoaded",()=>{const u=EO.guard({});if(!u)throw new Error("guard");document.querySelector("#mount").innerHTML=EO.shell("Business dashboard","Operational home for owners, admins and managers",`<div class="grid3" id="metrics"></div><div class="card"><div class="card-title">Operational actions</div><div class="grid"><a class="choice" href="order-manager.html"><strong>Orders</strong><small>Open the live queue.</small></a><a class="choice" href="staff-manager.html"><strong>Staff</strong><small>Manage team records.</small></a><a class="choice" href="delivery-manager.html"><strong>Delivery</strong><small>Zones and drivers.</small></a><a class="choice" href="analytics-manager.html"><strong>Analytics</strong><small>Real order aggregates.</small></a><a class="choice" href="reservation-manager.html"><strong>Reservations</strong><small>Bookings and deposits.</small></a><a class="choice" href="review-manager.html"><strong>Reviews</strong><small>Ratings and replies.</small></a></div></div><div class="card"><div class="card-title">Business setup</div><div class="actions"><a class="btn" href="billing-manager.html">Billing</a><a class="btn" href="restaurant-onboarding.html">Edit onboarding</a><a class="btn" href="menu-onboarding.html">Menu</a></div></div>`,{section:"Manager"});
const b=EO.business(),o=EatoutsDB.filter("orders",x=>x.businessId===b.id),today=o.filter(x=>String(x.created).startsWith("2026-10-11"));document.querySelector("#metrics").innerHTML=EO.metric("Orders today",today.length,"live DB")+EO.metric("GMV today",EO.money(today.reduce((s,x)=>s+x.total,0)),"gross value")+EO.metric("Open",o.filter(x=>!["delivered","cancelled"].includes(x.status)).length,"needs action");});</script></body></html>
