<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#ffffff"><title>Customer onboarding · EatOuts</title><link rel="stylesheet" href="assets/eatouts-manager.css"></head><body>
<div class="login"><div class="loginbox"><div class="loginlogo">EatOuts</div><div class="crumb">Customer onboarding</div><div class="onboard-steps"><i class="step on"></i><i class="step"></i><i class="step"></i></div>
<h1>Create your customer account</h1><p>We use your WhatsApp number as your login credential. Date of birth is used for the 18+ age gate.</p>
<form id="onboard">
<div class="two"><label class="field"><span>First name</span><input name="firstName" required></label><label class="field"><span>Surname</span><input name="surname" required></label></div>
<div class="two"><label class="field"><span>Date of birth</span><input name="dob" type="date" required></label><label class="field"><span>Gender</span><select name="gender"><option>Prefer not to say</option><option>Female</option><option>Male</option><option>Other</option></select></label></div>
<div class="two"><label class="field"><span>Town / city</span><input name="town" placeholder="Gaborone" required></label><label class="field"><span>Area</span><input name="area" placeholder="CBD"></label></div>
<label class="field"><span>WhatsApp number — login</span><input name="whatsapp" inputmode="tel" required></label>
<label class="field"><span>Additional contact</span><input name="contact" inputmode="tel" placeholder="Optional"></label>
<label class="field"><span>Email (optional)</span><input name="email" type="email"></label>
<label class="check"><input type="checkbox" name="ageGate" required> I confirm I am 18 or older.</label>
<button class="btn primary full" style="margin-top:10px">Create account</button></form></div></div><script src="js/eatouts-db.js"></script><script src="js/eatouts-roles.js"></script><script src="js/eatouts-users.js"></script><script src="js/eatouts-feedback.js"></script><script src="js/eatouts-blog.js"></script><script src="js/eatouts-auth.js"></script><script src="js/eatouts-manager.js"></script><script>
document.querySelector("#onboard").addEventListener("submit",e=>{e.preventDefault();const f=new FormData(e.target),dob=f.get("dob");const age=new Date().getFullYear()-new Date(dob).getFullYear()-((new Date().getMonth()+1<new Date(dob).getMonth()+1||new Date().getDate()<new Date(dob).getDate())?1:0);if(age<18){alert("You must be 18 or older to use this account.");return}const u=EatoutsUsers.create({firstName:f.get("firstName"),surname:f.get("surname"),dob,gender:f.get("gender"),town:f.get("town"),area:f.get("area"),whatsapp:String(f.get("whatsapp")).replace(/\D/g,""),contacts:[f.get("contact")].filter(Boolean),email:f.get("email"),type:"customer",roles:["customer"]});localStorage.setItem(EatoutsAuth.SESSION,u.id);location.href="eatouts_profile.html"});
</script></body></html>
