<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#ffffff"><title>Disputes · EatOuts</title><link rel="stylesheet" href="assets/eatouts-manager.css"></head><body><div id="mount"></div><script src="js/eatouts-db.js"></script><script src="js/eatouts-roles.js"></script><script src="js/eatouts-users.js"></script><script src="js/eatouts-feedback.js"></script><script src="js/eatouts-blog.js"></script><script src="js/eatouts-auth.js"></script><script src="js/eatouts-manager.js"></script><script>document.addEventListener("DOMContentLoaded",()=>{if(!EO.guard({"roles": ["platform_admin", "platform_ops"]}))return;document.querySelector("#mount").innerHTML=EO.shell("Disputes","Order/booking issues, refunds and escalations",`<div id="d" class="card"></div>`,{section:"Platform operations"});
function render(){document.querySelector("#d").innerHTML=EatoutsDB.collection("disputes").map(x=>`<article class="card" style="margin:0 0 8px"><div class="listrow"><div class="listmain"><strong>${x.id} · Order ${x.orderId}</strong><small>${EO.esc(x.customer)} · ${EO.esc(x.reason)} · ${EO.money(x.amount)}</small></div>${EO.status(x.status)}</div><div class="actions"><button class="btn" data-close="${x.id}">Resolve</button><button class="btn danger" data-refund="${x.id}">Refund</button></div></article>`).join("")}document.querySelector("#d").onclick=e=>{const id=e.target.dataset.close||e.target.dataset.refund;if(!id)return;const d=EatoutsDB.find("disputes",id);d.status=e.target.dataset.refund?"refund_pending":"resolved";EatoutsDB.save();render()};render();});</script></body></html>
