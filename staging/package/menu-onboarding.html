<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#ffffff"><title>Menu onboarding · EatOuts</title><link rel="stylesheet" href="assets/eatouts-manager.css"></head><body><div class="login"><div class="loginbox"><div class="loginlogo">EatOuts</div><div class="crumb">Restaurant setup</div><h1>Menu editor</h1><p>Categories, items and modifiers are saved locally and can be promoted into the shared menu data model.</p><form id="m"><label class="field"><span>Category</span><input name="category" placeholder="Main meals" required></label><label class="field"><span>Item</span><input name="item" placeholder="Chicken platter" required></label><div class="two"><label class="field"><span>Price</span><input name="price" type="number" required></label><label class="field"><span>Modifiers</span><input name="modifiers" placeholder="Extra cheese, fries"></label></div><button class="btn primary">Add item</button></form><div class="card"><div class="card-title">Current menu</div><div id="menu"></div></div><a class="btn full" href="restaurant-dashboard.html">Back to dashboard</a></div></div><script src="js/eatouts-db.js"></script><script src="js/eatouts-roles.js"></script><script src="js/eatouts-users.js"></script><script src="js/eatouts-feedback.js"></script><script src="js/eatouts-blog.js"></script><script src="js/eatouts-auth.js"></script><script src="js/eatouts-manager.js"></script><script>const key="eatouts_menu_items";function all(){try{return JSON.parse(localStorage.getItem(key)||"[]")}catch(e){return[]}}function render(){document.querySelector("#menu").innerHTML=all().map((x,i)=>`<div class="listrow"><div class="listmain"><strong>${EO.esc(x.item)}</strong><small>${EO.esc(x.category)} · BWP ${x.price} · ${EO.esc(x.modifiers||"No modifiers")}</small></div><button class="btn danger" data-i="${i}">Delete</button></div>`).join("")||"<div class='empty'>No menu items yet.</div>"}document.querySelector("#m").onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),a=all();a.push({category:f.get("category"),item:f.get("item"),price:Number(f.get("price")),modifiers:f.get("modifiers")});localStorage.setItem(key,JSON.stringify(a));e.target.reset();render()};document.querySelector("#menu").onclick=e=>{if(e.target.dataset.i!==undefined){const a=all();a.splice(Number(e.target.dataset.i),1);localStorage.setItem(key,JSON.stringify(a));render()}};render();</script></body></html>
