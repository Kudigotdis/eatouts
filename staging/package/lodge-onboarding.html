<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#ffffff"><title>Lodge onboarding · EatOuts</title><link rel="stylesheet" href="assets/eatouts-manager.css"></head><body>
<div class="login"><div class="loginbox"><div class="loginlogo">EatOuts</div><div class="crumb">Business onboarding · lodge</div>
<div class="onboard-steps"><i class="step on"></i><i class="step"></i><i class="step"></i></div>
<h1>Lodge onboarding</h1><p>Lodges need rooms, nightly rates, availability, housekeeping status and booking requests.</p><form id="biz-onboard">
<div class="two"><label class="field"><span>Owner first name</span><input name="ownerFirstName" required></label><label class="field"><span>Owner surname</span><input name="ownerSurname" required></label></div><label class="field"><span>Lodge name</span><input name="businessName" required></label><div class="two"><label class="field"><span>Check-in time</span><input name="checkin" type="time" value="14:00"></label><label class="field"><span>Check-out time</span><input name="checkout" type="time" value="10:00"></label></div><label class="field"><span>Housekeeping cycle</span><select name="housekeeping"><option>Daily</option><option>On checkout</option><option>Guest request</option></select></label>
<div class="two"><label class="field"><span>Owner WhatsApp — login</span><input name="whatsapp" inputmode="tel" required></label><label class="field"><span>Business phone</span><input name="phone" inputmode="tel"></label></div>
<div class="two"><label class="field"><span>Town / city</span><input name="town" required value="Gaborone"></label><label class="field"><span>Area</span><input name="area"></label></div>
<label class="field"><span>Business description</span><textarea name="description"></textarea></label>
<button class="btn primary full">Save and continue</button></form></div></div>
<script src="js/eatouts-db.js"></script><script src="js/eatouts-roles.js"></script><script src="js/eatouts-users.js"></script><script src="js/eatouts-feedback.js"></script><script src="js/eatouts-blog.js"></script><script src="js/eatouts-auth.js"></script><script src="js/eatouts-manager.js"></script><script>
document.querySelector("#biz-onboard").addEventListener("submit",e=>{e.preventDefault();const f=new FormData(e.target),id="biz-"+Date.now(),uid="u-"+Date.now();const u=EatoutsUsers.create({id:uid,firstName:f.get("ownerFirstName")||"Business",surname:f.get("ownerSurname")||"Owner",whatsapp:String(f.get("whatsapp")).replace(/\D/g,""),type:"biz_owner",roles:["biz_owner"],status:"active",businessId:id});const b={id,name:f.get("businessName"),type:"lodge",status:"pending",ownerId:u.id,town:f.get("town"),area:f.get("area"),phone:f.get("phone"),description:f.get("description"),subscription:"Starter",onboarding: Object.fromEntries(f.entries())};EatoutsDB.upsert("businesses",b);localStorage.setItem(EatoutsAuth.SESSION,u.id);localStorage.setItem(EatoutsAuth.BUSINESS,id);alert("Business profile saved. It is now in verification.");location.href="restaurant-dashboard.html"});
</script></body></html>
