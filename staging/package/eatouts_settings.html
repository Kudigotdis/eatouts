<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#ffffff"><title>Platform settings · EatOuts</title><link rel="stylesheet" href="assets/eatouts-manager.css"></head><body><div id="mount"></div><script src="js/eatouts-db.js"></script><script src="js/eatouts-roles.js"></script><script src="js/eatouts-users.js"></script><script src="js/eatouts-feedback.js"></script><script src="js/eatouts-blog.js"></script><script src="js/eatouts-auth.js"></script><script src="js/eatouts-manager.js"></script><script>document.addEventListener("DOMContentLoaded",()=>{if(!EO.guard({"roles": ["platform_admin"]}))return;document.querySelector("#mount").innerHTML=EO.shell("Platform settings","Currency, fees, default zones and feature flags",`<div class="card"><form id="s"><div class="two"><label class="field"><span>Currency</span><input name="currency"></label><label class="field"><span>Setup fee</span><input name="setupFee" type="number"></label></div><label class="field"><span>Default delivery fee</span><input name="delivery" type="number"></label><label class="field"><span>Default zones — one per line</span><textarea name="zones"></textarea></label><div class="field"><span>Feature flags</span><div class="checkgrid"><label class="check"><input name="reviews" type="checkbox">Reviews</label><label class="check"><input name="deliveryFlag" type="checkbox">Delivery</label><label class="check"><input name="quotes" type="checkbox">Quotes</label></div></div><button class="btn primary">Save settings</button></form></div>`,{section:"Platform admin"});
const s=EatoutsDB.get().settings,f=document.querySelector("#s");f.currency.value=s.currency;f.setupFee.value=s.setupFee;f.delivery.value=s.defaultDeliveryFee;f.zones.value=s.zones.join("\n");f.reviews.checked=s.featureFlags.reviews;f.deliveryFlag.checked=s.featureFlags.delivery;f.quotes.checked=s.featureFlags.quotes;f.onsubmit=e=>{e.preventDefault();s.currency=f.currency.value;s.setupFee=Number(f.setupFee.value);s.defaultDeliveryFee=Number(f.delivery.value);s.zones=f.zones.value.split("\n").filter(Boolean);s.featureFlags={reviews:f.reviews.checked,delivery:f.deliveryFlag.checked,quotes:f.quotes.checked};EatoutsDB.save();EO.toast("Platform settings saved")};});</script></body></html>
