<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#ffffff"><title>Billing manager · EatOuts</title><link rel="stylesheet" href="assets/eatouts-manager.css"></head><body><div id="mount"></div><script src="js/eatouts-db.js"></script><script src="js/eatouts-roles.js"></script><script src="js/eatouts-users.js"></script><script src="js/eatouts-feedback.js"></script><script src="js/eatouts-blog.js"></script><script src="js/eatouts-auth.js"></script><script src="js/eatouts-manager.js"></script><script>document.addEventListener("DOMContentLoaded",()=>{const u=EO.guard({});if(!u)throw new Error("guard");document.querySelector("#mount").innerHTML=EO.shell("Billing manager","Subscription, invoices, setup fee and payment method",`<div class="grid"><div class="metric"><span>Current tier</span><strong id="tier">—</strong><small>Business subscription</small></div><div class="metric"><span>Setup fee</span><strong>Paid</strong><small>BWP 450</small></div></div><div class="card"><div class="card-title">Change tier</div><div class="choice-grid"><button class="choice" data-tier="Starter"><strong>Starter</strong><small>BWP 250 / month</small></button><button class="choice" data-tier="Growth"><strong>Growth</strong><small>BWP 450 / month</small></button><button class="choice" data-tier="Pro"><strong>Pro</strong><small>BWP 850 / month</small></button></div></div><div class="card"><div class="card-title">Invoice history</div><div id="inv"></div></div>`,{section:"Manager"});
const b=EO.business();document.querySelector("#tier").textContent=b.subscription||"Starter";document.querySelector("#inv").innerHTML=EatoutsDB.filter("invoices",x=>x.businessId===b.id).map(x=>`<div class="listrow"><div class="listmain"><strong>${x.id}</strong><small>${x.date} · ${EO.money(x.amount)}</small></div>${EO.status(x.status)}</div>`).join("");document.querySelectorAll("[data-tier]").forEach(x=>x.onclick=()=>{b.subscription=x.dataset.tier;EatoutsDB.save();document.querySelector("#tier").textContent=b.subscription;EO.toast("Tier changed")});});</script></body></html>
