<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#ffffff"><title>Restaurant onboarding · EatOuts</title><link rel="stylesheet" href="assets/eatouts-manager.css"></head><body><div class="login"><div class="loginbox"><div class="loginlogo">EatOuts</div><div class="crumb">Restaurant onboarding</div><div class="tabs"><button class="tab on">Business</button><button class="tab">Staff</button><button class="tab">Beverages</button><button class="tab">Delivery</button></div><h1>Restaurant profile</h1><form id="r"><label class="field"><span>Business name</span><input name="name" value="The Yellow Giraffe Coffee Club" required></label><div class="two"><label class="field"><span>Town</span><input name="town" value="Gaborone"></label><label class="field"><span>Area</span><input name="area" value="CBD"></label></div><label class="field"><span>WhatsApp</span><input name="whatsapp" value="26770000002"></label><label class="field"><span>About</span><textarea name="about"></textarea></label><button class="btn primary full">Save restaurant profile</button></form><div class="actions" style="margin-top:10px"><a class="btn" href="staff-manager.html">Staff</a><a class="btn" href="menu-onboarding.html">Menu</a><a class="btn" href="delivery-manager.html">Delivery</a></div></div></div><script src="js/eatouts-db.js"></script><script src="js/eatouts-roles.js"></script><script src="js/eatouts-users.js"></script><script src="js/eatouts-feedback.js"></script><script src="js/eatouts-blog.js"></script><script src="js/eatouts-auth.js"></script><script src="js/eatouts-manager.js"></script><script>document.querySelector("#r").onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),b=EatoutsDB.find("businesses","biz-restaurant");Object.assign(b,{name:f.get("name"),town:f.get("town"),area:f.get("area"),whatsapp:f.get("whatsapp"),about:f.get("about")});EatoutsDB.save();EO.toast("Restaurant profile saved")};</script></body></html>
