<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#ffffff"><title>Addresses · EatOuts</title><link rel="stylesheet" href="assets/eatouts-manager.css"></head><body><div id="mount"></div><script src="js/eatouts-db.js"></script><script src="js/eatouts-roles.js"></script><script src="js/eatouts-users.js"></script><script src="js/eatouts-feedback.js"></script><script src="js/eatouts-blog.js"></script><script src="js/eatouts-auth.js"></script><script src="js/eatouts-manager.js"></script><script>document.addEventListener("DOMContentLoaded",()=>{if(!EO.guard({"roles": ["customer"]}))return;document.querySelector("#mount").innerHTML=EO.shell("Addresses","Address book for delivery auto-fill",`<div class="actions" style="margin-bottom:10px"><button class="btn primary" id="add">Add address</button></div><div id="a" class="card"></div>`,{section:"Customer"});const u=EO.currentUser();function render(){const a=EatoutsDB.collection("addresses").filter(x=>x.userId===u.id);document.querySelector("#a").innerHTML=a.length?a.map(x=>`<div class="listrow"><div class="listmain"><strong>${EO.esc(x.label)}</strong><small>${EO.esc(x.address)} · ${x.contact}</small></div><button class="btn danger" data-del="${x.id}">Delete</button></div>`).join(""):"<div class='empty'>No saved addresses.</div>"}document.querySelector("#add").onclick=()=>{const label=prompt("Address label","Home"),address=prompt("Address"),contact=prompt("Delivery contact",u.whatsapp);if(address)EatoutsDB.upsert("addresses",{id:"AD-"+Date.now(),userId:u.id,label:label||"Address",address,contact});render()};document.querySelector("#a").onclick=e=>{if(e.target.dataset.del)EatoutsDB.remove("addresses",e.target.dataset.del);render()};render();});</script></body></html>
