<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#ffffff"><title>Room manager · EatOuts</title><link rel="stylesheet" href="assets/eatouts-manager.css"></head><body><div id="mount"></div><script src="js/eatouts-db.js"></script><script src="js/eatouts-roles.js"></script><script src="js/eatouts-users.js"></script><script src="js/eatouts-feedback.js"></script><script src="js/eatouts-blog.js"></script><script src="js/eatouts-auth.js"></script><script src="js/eatouts-manager.js"></script><script>document.addEventListener("DOMContentLoaded",()=>{if(!EO.guard({"roles": ["biz_owner"]}))return;document.querySelector("#mount").innerHTML=EO.shell("Room manager","Lodge rooms, rates, availability and housekeeping",`<div class="grid3" id="rm"></div><div class="card"><div class="card-title">Rooms</div><div id="rooms"></div></div><div class="card"><div class="card-title">Availability calendar</div><div id="cal" class="grid3"></div></div>`,{section:"Manager"});
const b=EO.business(),rooms=()=>EatoutsDB.filter("rooms",x=>x.businessId===b.id);function render(){const r=rooms();document.querySelector("#rm").innerHTML=EO.metric("Rooms",r.length,"inventory")+EO.metric("Available",r.filter(x=>x.status==="available").length,"tonight")+EO.metric("Needs service",r.filter(x=>x.housekeeping!=="clean").length,"housekeeping");document.querySelector("#rooms").innerHTML=r.map(x=>`<div class="listrow"><div class="listmain"><strong>${x.name} · ${x.type}</strong><small>${EO.money(x.rate)} / night · ${x.housekeeping}</small></div><div class="actions">${EO.status(x.status)}<button class="btn" data-id="${x.id}">Cycle</button></div></div>`).join("");document.querySelector("#cal").innerHTML=["11 Oct","12 Oct","13 Oct"].map(d=>EO.metric(d,r.filter(x=>x.status==="available").length+" free","rooms")).join("")}document.querySelector("#rooms").onclick=e=>{const id=e.target.dataset.id;if(!id)return;const x=EatoutsDB.find("rooms",id);x.status=x.status==="available"?"occupied":x.status==="occupied"?"maintenance":"available";x.housekeeping=x.status==="available"?"clean":x.status==="occupied"?"needs_service":"maintenance";EatoutsDB.save();render()};render();});</script></body></html>
