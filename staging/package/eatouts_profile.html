<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#ffffff"><title>My profile · EatOuts</title><link rel="stylesheet" href="assets/eatouts-manager.css"></head><body><div id="mount"></div><script src="js/eatouts-db.js"></script><script src="js/eatouts-roles.js"></script><script src="js/eatouts-users.js"></script><script src="js/eatouts-feedback.js"></script><script src="js/eatouts-blog.js"></script><script src="js/eatouts-auth.js"></script><script src="js/eatouts-manager.js"></script><script>document.addEventListener("DOMContentLoaded",()=>{if(!EO.guard({"roles": ["customer"]}))return;document.querySelector("#mount").innerHTML=EO.shell("My profile","Personal details, contacts, addresses and notifications",`<div class="card"><form id="p"><div class="two"><label class="field"><span>First name</span><input name="firstName"></label><label class="field"><span>Surname</span><input name="surname"></label></div><div class="two"><label class="field"><span>DOB</span><input name="dob" type="date"></label><label class="field"><span>Gender</span><select name="gender"><option>Prefer not to say</option><option>Female</option><option>Male</option><option>Other</option></select></label></div><label class="field"><span>WhatsApp login</span><input name="whatsapp" disabled></label><label class="field"><span>Additional contacts</span><textarea name="contacts"></textarea></label><div class="checkgrid"><label class="check"><input name="promo" type="checkbox">Promo notifications</label><label class="check"><input name="order" type="checkbox">Order notifications</label></div><button class="btn primary" style="margin-top:10px">Save profile</button></form></div><div class="actions"><a class="btn" href="eatouts_addresses.html">Addresses</a><a class="btn" href="eatouts_favourites.html">Favourites</a></div>`,{section:"Customer"});const u=EO.currentUser(),f=document.querySelector("#p");["firstName","surname","dob","gender","whatsapp"].forEach(k=>{if(f[k])f[k].value=u[k]||""});f.contacts.value=(u.contacts||[]).join("\n");f.onsubmit=e=>{e.preventDefault();EatoutsUsers.update(u.id,{firstName:f.firstName.value,surname:f.surname.value,dob:f.dob.value,gender:f.gender.value,contacts:f.contacts.value.split("\n").filter(Boolean)});EO.toast("Profile saved")};});</script></body></html>
