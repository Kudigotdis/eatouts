<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#ffffff"><title>Feedback manager · EatOuts</title><link rel="stylesheet" href="assets/eatouts-manager.css"></head><body><div id="mount"></div><script src="js/eatouts-db.js"></script><script src="js/eatouts-roles.js"></script><script src="js/eatouts-users.js"></script><script src="js/eatouts-feedback.js"></script><script src="js/eatouts-blog.js"></script><script src="js/eatouts-auth.js"></script><script src="js/eatouts-manager.js"></script><script>document.addEventListener("DOMContentLoaded",()=>{if(!EO.guard({"roles": ["platform_admin", "platform_support"]}))return;document.querySelector("#mount").innerHTML=EO.shell("Feedback manager","Feedback queue, ticket IDs, assignment and WhatsApp replies",`<div class="actions" style="margin-bottom:10px"><button class="btn primary" id="seed">Create demo ticket</button></div><div id="fb" class="card"></div>`,{section:"Platform support"});
function render(){const a=EatoutsFeedback.all();document.querySelector("#fb").innerHTML=a.length?a.map(x=>`<article class="card" style="margin:0 0 8px"><div class="listrow"><div class="listmain"><strong>${x.id} · ${EO.esc(x.subject||"Feedback")}</strong><small>${x.created} · user ${x.userId||"—"} · assigned ${x.assignedTo||"unassigned"}</small></div>${EO.status(x.status)}</div><p style="font-size:11px">${EO.esc(x.message||"")}</p><div class="actions"><button class="btn" data-status="${x.id}">Mark resolved</button><a class="btn" href="https://wa.me/${x.whatsapp||""}?text=${encodeURIComponent("EatOuts feedback ticket "+x.id)}>WhatsApp reply</a></div></article>`).join(""):"<div class='empty'>No feedback tickets.</div>"}document.querySelector("#seed").onclick=()=>{EatoutsFeedback.create({userId:"u-customer",whatsapp:"26770000001",subject:"Delivery question",message:"My order is late."});render()};document.querySelector("#fb").onclick=e=>{const id=e.target.dataset.status;if(id){EatoutsFeedback.update(id,{status:"resolved"});render()}};render();});</script></body></html>
