<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Not found · EatOuts</title>
<style>
  :root{--cream:#faf8f2;--line:#ece7db;--ink:#1a1a1a;--muted:#a89a7e}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;min-height:100%}
  body{
    background:var(--cream);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  #shell{position:fixed;inset:0;max-width:460px;margin:0 auto;display:flex;flex-direction:column;background:#fff;box-shadow:0 0 80px rgba(0,0,0,.08);overflow:hidden}
  @media(min-width:520px){#shell{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
  .topbar{height:58px;padding:0 14px;padding-top:env(safe-area-inset-top);flex:0 0 auto;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
  .brand{height:34px;width:auto;aspect-ratio:1172/504;flex:0 0 auto;display:flex;align-items:center;text-decoration:none}
  .brand img{width:100%;height:100%;object-fit:contain;display:block}
  .hdr-right{margin-left:auto;display:flex;align-items:center;gap:8px}
  .hdr-chip{font-size:9.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:4px 9px;background:var(--cream);white-space:nowrap}
  .view{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{
    width:100%;max-width:380px;text-align:center;
    background:#ffffff;border:1px solid var(--line);border-radius:16px;
    box-shadow:0 10px 34px -12px rgba(0,0,0,.14);padding:34px 24px 28px;
  }
  .mark{font-size:13px;font-weight:900;letter-spacing:.34em;text-transform:uppercase;color:var(--muted);margin:0 0 22px}
  .code{font-size:56px;font-weight:900;line-height:1;letter-spacing:-.02em;margin:0 0 10px}
  h1{font-size:16px;font-weight:800;margin:0 0 8px}
  p{font-size:13px;line-height:1.55;color:#645b48;margin:0 0 24px}
  .btn{
    display:inline-block;text-decoration:none;
    background:var(--ink);color:#ffffff;font-size:13px;font-weight:800;
    padding:13px 22px;border-radius:12px;
  }
  .btn:active{opacity:.85}
  .appnav{flex:0 0 auto;display:flex;background:#0a0a0a;padding:8px 6px calc(8px + env(safe-area-inset-bottom));gap:2px}
  .appnav a{flex:1;text-align:center;font-size:10px;font-weight:700;letter-spacing:.04em;color:rgba(255,255,255,.62);text-decoration:none;padding:3px 0 1px}
  .appnav a.on{color:#fff}
</style>
</head>
<body>
<div id="shell">
  <header class="topbar">
    <a class="brand" href="index.html#promos"><img src="assets/logo/EatOuts_Logo.png" alt="EatOuts"></a>
    <div class="hdr-right"><span class="hdr-chip">Not Found</span></div>
  </header>
  <main class="view">
    <div class="card">
      <p class="mark">EatOuts</p>
      <p class="code">404</p>
      <h1>Page not found</h1>
      <p>This link may be old or mistyped. Head back to discover restaurants, promos and events near you.</p>
      <a class="btn" href="/">Back to EatOuts</a>
    </div>
  </main>
  <nav class="appnav">
    <a href="index.html#promos" class="on">Promos</a>
    <a href="index.html#restaurants">Restaurants</a>
    <a href="index.html#reserve">Reserve</a>
    <a href="index.html#gallery">Gallery</a>
    <a href="index.html#about">About</a>
  </nav>
</div>
</body>
</html>
