<!doctype html>
<!-- PAGE: Verification queue -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#141418">
<title>Verification queue · EatOuts</title>
<style>
  *,*::before,*::after{box-sizing:border-box}
  :root{
    --ink:#0F0F12;
    --ink-2:#2A2A30;
    --ink-3:#4A4A52;
    --paper:#F4F5F7;
    --card:#FFFFFF;
    --line:#E6E8EC;
    --line-2:#F0F1F4;
    --orange:#FF5A1F;
    --orange-2:#FF7A42;
    --orange-soft:#FFEDE4;
    --orange-line:#FFD5C2;
    --green:#16A34A;
    --green-soft:#E7F7EE;
    --red:#DC2626;
    --red-soft:#FEE2E2;
    --amber:#B45309;
    --amber-soft:#FEF3C7;
    --muted:#6B7280;
    --faint:#9AA1AC;
  }
  html,body{height:100%}
  body{
    margin:0;
    background:#E9EBEF;
    color:var(--ink);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:15px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;
    display:flex;
    justify-content:center;
  }
  button,input,select,textarea{font-family:inherit}
  button{cursor:pointer}

  #shell{
    width:100%;
    max-width:460px;
    height:100vh;
    height:100dvh;
    background:var(--paper);
    display:flex;
    flex-direction:column;
    overflow:hidden;
    position:relative;
    box-shadow:0 0 70px rgba(20,20,25,.16);
  }

  /* ============ TOPBAR ============ */
  .topbar{
    flex:0 0 auto;
    background:#141418;
    padding:calc(13px + env(safe-area-inset-top)) 18px 14px;
    position:relative;
    z-index:10;
  }
  .topbar-row{
    display:flex;align-items:center;gap:10px;
    padding-bottom:13px;
  }
  .brand{
    display:inline-flex;align-items:center;gap:9px;
    text-decoration:none;
  }
  .brand .mark{
    width:28px;height:28px;flex:0 0 auto;border-radius:8px;
    background:linear-gradient(145deg,var(--orange-2),var(--orange));
    color:#fff;
    display:grid;place-items:center;
    font-size:14px;font-weight:900;letter-spacing:-.03em;
    box-shadow:0 2px 10px rgba(255,90,31,.35);
  }
  .brand .word{
    color:#fff;font-size:15px;font-weight:800;
    letter-spacing:-.02em;
  }
  .hdr-chip{
    margin-left:auto;
    font-size:10px;font-weight:800;
    letter-spacing:.12em;text-transform:uppercase;
    color:var(--orange-2);
    border:1px solid rgba(255,122,66,.32);
    background:rgba(255,90,31,.1);
    border-radius:999px;
    padding:5px 11px;
    white-space:nowrap;
  }

  .progress{padding-bottom:2px}
  .progress-top{
    display:flex;align-items:baseline;justify-content:space-between;
    gap:10px;margin-bottom:8px;
  }
  .progress-label{
    font-size:11px;font-weight:800;
    letter-spacing:.14em;text-transform:uppercase;
    color:rgba(255,255,255,.5);
  }
  .progress-count{
    font-size:11.5px;font-weight:800;
    color:var(--orange-2);
    letter-spacing:.02em;
  }
  .progress-track{
    height:5px;border-radius:99px;
    background:rgba(255,255,255,.13);
    overflow:hidden;
  }
  .progress-fill{
    height:100%;width:0%;
    border-radius:99px;
    background:linear-gradient(90deg,var(--orange),var(--orange-2));
    transition:width .35s cubic-bezier(.4,0,.2,1);
  }

  /* ============ SCROLL ============ */
  .scroll{
    flex:1 1 auto;min-height:0;
    overflow-y:auto;
    overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
    scrollbar-width:none;
  }
  .scroll::-webkit-scrollbar{display:none}

  /* ============ INTRO ============ */
  .intro{
    background:linear-gradient(175deg,#141418 0%,#1B1B21 60%,#232329 100%);
    padding:4px 22px 46px;
    position:relative;
    overflow:hidden;
    text-align:center;
  }
  .intro::after{
    content:"";
    position:absolute;
    top:-80px;right:-80px;
    width:230px;height:230px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,90,31,.2),transparent 68%);
    pointer-events:none;
  }
  .intro h1{
    position:relative;
    margin:0 auto 12px;
    font-size:26px;
    line-height:1.15;
    font-weight:800;
    letter-spacing:-.03em;
    color:#fff;
    max-width:15ch;
  }
  .intro h1 em{font-style:normal;color:var(--orange-2)}
  .intro p{
    position:relative;
    margin:0 auto;
    font-size:14px;
    line-height:1.6;
    color:rgba(255,255,255,.6);
    max-width:32ch;
  }

  /* ============ SHEET ============ */
  .sheet{
    position:relative;
    z-index:1;
    margin-top:-26px;
    background:var(--paper);
    border-radius:26px 26px 0 0;
    padding:20px 14px 30px;
    min-height:60vh;
  }

  /* ============ META CARD ============ */
  .meta-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:15px 16px;
    margin-bottom:12px;
    box-shadow:0 1px 2px rgba(20,20,25,.03);
  }
  .meta-row{
    display:flex;align-items:center;gap:10px;
    margin-bottom:11px;
  }
  .meta-dot{
    width:9px;height:9px;border-radius:50%;flex:0 0 auto;
    background:var(--orange);
    box-shadow:0 0 0 3px var(--orange-soft);
  }
  .meta-dot.green{background:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
  .meta-dot.warn{background:var(--amber);box-shadow:0 0 0 3px var(--amber-soft)}
  .meta-dot.red{background:var(--red);box-shadow:0 0 0 3px var(--red-soft)}
  .meta-text{
    font-size:13.5px;
    color:var(--ink-2);
    line-height:1.4;
    min-width:0;
    flex:1 1 auto;
  }
  .meta-text b{color:var(--ink);font-weight:750}
  .meta-stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    padding-top:11px;
    border-top:1px solid var(--line-2);
  }
  .stat{text-align:center}
  .stat b{
    display:block;
    font-size:19px;font-weight:850;
    letter-spacing:-.03em;
    color:var(--ink);
    line-height:1.1;
    font-variant-numeric:tabular-nums;
  }
  .stat span{
    display:block;
    margin-top:3px;
    font-size:9.5px;font-weight:800;
    letter-spacing:.1em;text-transform:uppercase;
    color:var(--faint);
  }

  /* ============ ACCORDION STACK ============ */
  .stack{display:flex;flex-direction:column;gap:10px}
  .acc{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    overflow:hidden;
    transition:border-color .2s ease,box-shadow .2s ease;
  }
  .acc.open{
    border-color:var(--orange-line);
    box-shadow:0 4px 18px -6px rgba(255,90,31,.22);
  }
  .acc.reviewed .acc-sub{color:var(--green);font-weight:650}
  .acc.rejected .acc-sub{color:var(--red);font-weight:650}
  .acc-head{
    width:100%;
    display:flex;align-items:center;gap:12px;
    padding:13px 15px;
    background:transparent;border:0;
    text-align:left;
    -webkit-tap-highlight-color:transparent;
    transition:background .15s;
  }
  .acc-head:active{background:#FAFBFC}

  .grp-thumb{
    width:48px;height:48px;flex:0 0 auto;
    border-radius:11px;
    background:#F0F1F4;
    display:grid;place-items:center;
    font-size:14px;font-weight:850;
    color:var(--faint);
    overflow:hidden;
    position:relative;
    letter-spacing:-.02em;
  }
  .grp-thumb.num{
    color:var(--orange);
    background:var(--orange-soft);
  }
  .grp-thumb.ok{color:var(--green);background:var(--green-soft)}
  .grp-thumb.no{color:var(--red);background:var(--red-soft)}

  .acc-title{
    flex:1 1 auto;min-width:0;
    display:flex;flex-direction:column;gap:2px;
  }
  .acc-title b{
    font-size:15px;font-weight:750;
    letter-spacing:-.015em;
    color:var(--ink);
    line-height:1.25;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .acc-sub{
    font-size:11.5px;
    color:var(--faint);
    line-height:1.3;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    font-weight:550;
  }

  .vis-dot{
    width:9px;height:9px;border-radius:50%;flex:0 0 auto;
    background:var(--orange);
    box-shadow:0 0 0 3px var(--orange-soft);
  }
  .vis-dot.green{background:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
  .vis-dot.red{background:var(--red);box-shadow:0 0 0 3px var(--red-soft)}

  .acc-body{
    display:grid;
    grid-template-rows:0fr;
    transition:grid-template-rows .32s cubic-bezier(.4,0,.2,1);
  }
  .acc.open .acc-body{grid-template-rows:1fr}
  .acc-inner{overflow:hidden;min-height:0}

  .module{padding:2px 15px 18px}

  /* Info blocks inside accordion body */
  .info-block{
    background:#FAFBFC;
    border:1px solid var(--line-2);
    border-radius:12px;
    padding:13px 14px;
    margin-bottom:10px;
  }
  .info-block:last-of-type{margin-bottom:12px}
  .info-block h4{
    margin:0 0 7px;
    font-size:11.5px;font-weight:800;
    letter-spacing:.09em;text-transform:uppercase;
    color:var(--muted);
  }
  .info-block p{
    margin:0;
    font-size:13px;
    line-height:1.5;
    color:var(--ink-2);
  }
  .info-block p + p{margin-top:4px}
  .info-block b{color:var(--ink);font-weight:750}

  /* Document chips */
  .doc-list{
    display:flex;flex-wrap:wrap;gap:6px;
  }
  .doc-chip{
    display:inline-flex;align-items:center;gap:6px;
    padding:6px 10px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:9px;
    font-size:12px;
    font-weight:650;
    color:var(--ink-2);
    line-height:1;
  }
  .doc-chip::before{
    content:"";
    width:6px;height:6px;border-radius:50%;
    background:var(--orange);
    flex:0 0 auto;
  }

  /* Reviewed timestamp */
  .meta-stamp{
    font-size:11.5px;
    color:var(--faint);
    font-weight:550;
    margin-top:2px;
  }

  /* Action row */
  .verdict-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
    margin-top:14px;
  }
  .verdict-row .btn{
    height:48px;
    font-size:14.5px;
    border-radius:12px;
    font-weight:750;
    border:0;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    -webkit-tap-highlight-color:transparent;
    transition:transform .1s ease,background .15s;
  }
  .verdict-row .btn:active{transform:scale(.98)}
  .btn-approve{
    background:linear-gradient(145deg,var(--orange-2),var(--orange));
    color:#fff;
    box-shadow:0 6px 18px -6px rgba(255,90,31,.5);
  }
  .btn-approve:active{background:var(--orange)}
  .btn-reject{
    background:#FEF2F2;
    border:1px solid #FECACA!important;
    color:var(--red);
  }
  .btn-reject:active{background:var(--red-soft)}

  /* Empty state */
  .empty-note{
    font-size:12.5px;
    color:var(--faint);
    text-align:center;
    padding:22px 16px;
    border:1.5px dashed #DCE0E6;
    border-radius:11px;
    background:#FAFBFC;
    line-height:1.55;
  }
  .empty-note b{color:var(--ink-2);font-weight:750}

  /* ============ TOAST ============ */
  .toast{
    position:fixed;left:50%;z-index:200;
    bottom:calc(28px + env(safe-area-inset-bottom));
    transform:translate(-50%,10px);
    background:var(--ink);color:#fff;
    font-size:13.5px;font-weight:650;
    padding:12px 18px;border-radius:999px;
    max-width:88vw;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    opacity:0;pointer-events:none;
    transition:opacity .2s ease,transform .2s ease;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body data-page="eatouts-verification-queue">
<div id="shell">

  <header class="topbar">
    <div class="topbar-row">
      <a class="brand" href="index.html">
        <span class="mark">E</span>
        <span class="word">EatOuts</span>
      </a>
      <span class="hdr-chip">Verification</span>
    </div>
    <div class="progress">
      <div class="progress-top">
        <span class="progress-label">Queue status</span>
        <span class="progress-count" id="progressCount">—</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>
  </header>

  <div class="scroll" id="scroll">
    <section class="intro" id="intro">
      <h1>Review <em>submissions</em>.</h1>
      <p>Approve or reject business verifications. Open a card to see documents and the callback log.</p>
    </section>
    <main class="sheet" id="app"></main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script src="js/eatouts-manager-db.js"></script>
<script src="assets/data/demo/the-food-place/demo-data.js"></script>
<script src="js/eatouts-manager-seed.js"></script>
<script src="js/eatouts-roles.js"></script>
<script src="js/eatouts-users.js"></script>
<script src="js/eatouts-feedback.js"></script>
<script src="js/eatouts-blog-admin.js"></script>
<script src="js/eatouts-auth.js"></script>
<script src="js/eatouts-manager.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {

  /* ---- Auth guard (unchanged) ---- */
  if (!EO.guard({"roles": ["platform_admin", "platform_ops"]})) return;

  /* ============================================================
     HELPERS
     ============================================================ */
  function esc(s){
    return String(s == null ? "" : s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }

  var toastEl = document.getElementById("toast");
  var toastTimer = null;
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove("show"); }, 2000);
  }

  function statusMeta(s){
    if (s === "approved") return { key:"approved", dot:"green", label:"Approved" };
    if (s === "rejected") return { key:"rejected", dot:"red",   label:"Rejected" };
    return { key:"pending", dot:"", label:"Pending" };
  }

  /* Only one accordion open at a time; null = all closed */
  var OPEN = null;

  /* ============================================================
     RENDER
     ============================================================ */
  var mount = document.getElementById("app");

  function render(){
    var items = (EatoutsMgrDB.collection("verification") || []).slice();

    /* ---- counts ---- */
    var total    = items.length;
    var pending  = items.filter(function(x){ return x.status !== "approved" && x.status !== "rejected"; }).length;
    var approved = items.filter(function(x){ return x.status === "approved"; }).length;
    var rejected = items.filter(function(x){ return x.status === "rejected"; }).length;
    var reviewed = approved + rejected;

    /* ---- progress bar ---- */
    var pct = total ? Math.round((reviewed / total) * 100) : 0;
    document.getElementById("progressFill").style.width = pct + "%";
    document.getElementById("progressCount").textContent =
      total + " item" + (total === 1 ? "" : "s") + " · " + pending + " pending";

    /* ---- meta card ---- */
    var dotClass, msg;
    if (total === 0){
      dotClass = "warn";
      msg = "No submissions yet — the queue is empty";
    } else if (pending === 0){
      dotClass = "green";
      msg = "All <b>" + total + "</b> submission" + (total === 1 ? "" : "s") + " reviewed";
    } else {
      dotClass = "";
      msg = "<b>" + pending + "</b> pending review · " + total + " total";
    }

    var metaHTML =
      '<div class="meta-card">' +
        '<div class="meta-row">' +
          '<span class="meta-dot ' + dotClass + '"></span>' +
          '<span class="meta-text">' + msg + '</span>' +
        '</div>' +
        '<div class="meta-stats">' +
          '<div class="stat"><b>' + total + '</b><span>Total</span></div>' +
          '<div class="stat"><b>' + pending + '</b><span>Pending</span></div>' +
          '<div class="stat"><b>' + reviewed + '</b><span>Reviewed</span></div>' +
        '</div>' +
      '</div>';

    /* ---- empty state ---- */
    if (total === 0){
      mount.innerHTML = metaHTML + '<div class="empty-note">No verification submissions yet.<br><b>New submissions</b> will appear here for review.</div>';
      return;
    }

    /* ---- accordion stack ---- */
    var sections = items.map(function(x, i){
      var biz = EatoutsMgrDB.find("businesses", x.businessId);
      var name = (biz && biz.name) || x.businessId || "Unknown business";
      var meta = statusMeta(x.status);
      var isOpen = OPEN === x.id;

      var cls = "acc";
      if (isOpen) cls += " open";
      if (meta.key === "approved") cls += " reviewed";
      if (meta.key === "rejected") cls += " rejected";

      var thumbCls = "grp-thumb num";
      if (meta.key === "approved") thumbCls = "grp-thumb ok";
      if (meta.key === "rejected") thumbCls = "grp-thumb no";

      var docs = Array.isArray(x.documents) ? x.documents : [];
      var submitted = x.submitted || "—";
      var callback = x.callback || "—";

      var sub = "Submitted " + submitted + " · " + docs.length + " doc" + (docs.length === 1 ? "" : "s");

      var docsHTML = docs.length
        ? '<div class="doc-list">' + docs.map(function(d){
            return '<span class="doc-chip">' + esc(d) + '</span>';
          }).join("") + '</div>'
        : '<p style="font-size:13px;color:var(--faint);margin:0">No documents attached.</p>';

      var stamp = (meta.key === "approved" || meta.key === "rejected")
        ? '<div class="meta-stamp">Marked ' + meta.label.toLowerCase() + '</div>'
        : '';

      var body =
        '<div class="module">' +
          '<div class="info-block">' +
            '<h4>Documents</h4>' +
            docsHTML +
          '</div>' +
          '<div class="info-block">' +
            '<h4>Callback log</h4>' +
            '<p>' + esc(callback) + '</p>' +
            stamp +
          '</div>' +
          '<div class="verdict-row">' +
            '<button class="btn btn-approve" type="button" data-approve="' + esc(x.id) + '">Approve</button>' +
            '<button class="btn btn-reject" type="button" data-reject="' + esc(x.id) + '">Reject</button>' +
          '</div>' +
        '</div>';

      return '' +
        '<section class="' + cls + '" data-key="' + esc(x.id) + '">' +
          '<button class="acc-head" type="button" aria-expanded="' + (isOpen ? "true" : "false") + '">' +
            '<span class="' + thumbCls + '">' + (i + 1) + '</span>' +
            '<span class="acc-title">' +
              '<b>' + esc(name) + '</b>' +
              '<span class="acc-sub">' + esc(sub) + '</span>' +
            '</span>' +
            '<span class="vis-dot ' + meta.dot + '"></span>' +
          '</button>' +
          '<div class="acc-body">' +
            '<div class="acc-inner">' + body + '</div>' +
          '</div>' +
        '</section>';
    }).join("");

    mount.innerHTML = metaHTML + '<div class="stack">' + sections + '</div>';
  }

  /* ============================================================
     ACCORDION BEHAVIOUR — only one open at a time
     ============================================================ */
  function toggleAccordion(key){
    OPEN = (OPEN === key) ? null : key;
    var accs = mount.querySelectorAll(".acc");
    for (var i = 0; i < accs.length; i++){
      var acc = accs[i];
      var isOpen = acc.getAttribute("data-key") === OPEN;
      acc.classList.toggle("open", isOpen);
      var head = acc.querySelector(".acc-head");
      if (head) head.setAttribute("aria-expanded", isOpen ? "true" : "false");
    }
    if (OPEN){
      var opened = mount.querySelector('.acc[data-key="' + OPEN + '"]');
      if (opened){
        setTimeout(function(){
          try { opened.scrollIntoView({ behavior:"smooth", block:"start" }); } catch (e) {}
        }, 320);
      }
    }
  }

  /* ============================================================
     DELEGATED CLICKS
     ============================================================ */
  mount.addEventListener("click", function(e){
    /* accordion header */
    var head = e.target.closest(".acc-head");
    if (head){
      var acc = head.closest(".acc");
      if (acc) toggleAccordion(acc.getAttribute("data-key"));
      return;
    }

    /* approve */
    var ap = e.target.closest("[data-approve]");
    if (ap){
      e.stopPropagation();
      setStatus(ap.getAttribute("data-approve"), "approved");
      return;
    }

    /* reject */
    var rj = e.target.closest("[data-reject]");
    if (rj){
      e.stopPropagation();
      setStatus(rj.getAttribute("data-reject"), "rejected");
      return;
    }
  });

  /* ============================================================
     STATUS CHANGE
     ============================================================ */
  function setStatus(id, status){
    var v = EatoutsMgrDB.find("verification", id);
    if (!v) return;
    v.status = status;

    var biz = EatoutsMgrDB.find("businesses", v.businessId);
    if (biz){
      biz.status = (status === "approved") ? "verified" : "rejected";
    }

    try { EatoutsMgrDB.save(); } catch (e) {}

    /* keep the current card open so the reviewer sees the updated state */
    OPEN = id;
    render();
    toast(status === "approved" ? "Submission approved" : "Submission rejected");
  }

  /* ============================================================
     BOOT
     ============================================================ */
  render();
});
</script>
</body>
</html>
