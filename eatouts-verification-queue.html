<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#ffffff"><title>Verification queue · EatOuts</title><link rel="stylesheet" href="assets/eatouts-manager.css"></head><body><div id="mount"></div><script src="js/eatouts-manager-db.js"></script><script src="js/eatouts-roles.js"></script><script src="js/eatouts-users.js"></script><script src="js/eatouts-feedback.js"></script><script src="js/eatouts-blog-admin.js"></script><script src="js/eatouts-auth.js"></script><script src="js/eatouts-manager.js"></script><script>document.addEventListener("DOMContentLoaded",()=>{if(!EO.guard({"roles": ["platform_admin", "platform_ops"]}))return;document.querySelector("#mount").innerHTML=EO.shell("Verification queue","Documents, callback log and approve/reject",`<div id="q" class="card"></div>`,{section:"Platform operations"});
function render(){document.querySelector("#q").innerHTML=EatoutsMgrDB.collection("verification").map(x=>{const b=EatoutsMgrDB.find("businesses",x.businessId);return `<article class="card" style="margin:0 0 8px"><div class="listrow"><div class="listmain"><strong>${EO.esc(b&&b.name||x.businessId)}</strong><small>Submitted ${x.submitted} · ${x.documents.join(", ")} · Callback: ${x.callback}</small></div>${EO.status(x.status)}</div><div class="actions"><button class="btn primary" data-approve="${x.id}">Approve</button><button class="btn danger" data-reject="${x.id}">Reject</button></div></article>`}).join("")}document.querySelector("#q").onclick=e=>{const id=e.target.dataset.approve||e.target.dataset.reject;if(!id)return;const v=EatoutsMgrDB.find("verification",id),b=EatoutsMgrDB.find("businesses",v.businessId);v.status=e.target.dataset.approve?"approved":"rejected";b.status=v.status==="approved"?"verified":"rejected";EatoutsMgrDB.save();render()};render();});</script></body></html>
