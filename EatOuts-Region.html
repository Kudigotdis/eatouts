<!doctype html>
<!-- PAGE: Select Region -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Select Region · EatOuts</title>
<style>
::-webkit-scrollbar{width:0;height:0;display:none}
*{scrollbar-width:none;-ms-overflow-style:none}
*,*::before,*::after{box-sizing:border-box}
:root{
  --ink:#1a1a1a;
  --mute:#8a8170;
  --line:#f1ece1;
  --paper:#f4f2ec;
  --green:#1f8a53;
}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#fff;color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
#shell{max-width:460px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative;background:#fff}

/* standard header (T08) */
#hdr{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:10px 14px;background:#fff;position:relative;z-index:20}
.brand-mark{border:0;background:transparent;padding:0;height:34px;width:auto;aspect-ratio:1172/504;
  display:flex;align-items:center;cursor:pointer;text-decoration:none}
.brand-mark img{width:100%;height:100%;object-fit:contain}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.region-code{font-size:11px;font-weight:900;letter-spacing:.09em;color:#a89a7e}

.scroll{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch}
.phead{padding:4px 16px 12px;background:#fff}
.phead h1{margin:0;font-size:26px;font-weight:900;letter-spacing:-.02em}
.phead p{margin:6px 0 0;font-size:13px;font-weight:600;color:var(--mute)}
.pad{background:rgba(0,0,0,.03);padding:12px 14px 26px;min-height:100%}

.rs-search{display:block;width:100%;margin:0 0 12px;background:#fff;border:1px solid var(--line);border-radius:14px;
  padding:12px 14px;font-family:inherit;font-size:16px;font-weight:600;color:var(--ink);outline:none}
.rs-search:focus{border-color:var(--green)}

.rs-list{display:flex;flex-direction:column;gap:9px}
.rs-item{display:flex;align-items:center;gap:12px;width:100%;padding:12px;background:#fff;
  border:1px solid var(--line);border-radius:14px;text-align:left;font-family:inherit;cursor:pointer}
.rs-item:active{transform:scale(.99)}
.rs-item[aria-pressed="true"]{border-color:var(--green);box-shadow:0 0 0 1px var(--green)}
/* Regions you are not in stay visible but recede — still tappable. */
.rs-item[aria-pressed="false"]{opacity:.4}
.rs-flag{flex:0 0 48px;width:48px;height:32px;border-radius:3px;object-fit:cover;border:1px solid var(--line);background:var(--paper)}
.rs-name{flex:1 1 auto;min-width:0;font-size:16px;font-weight:900;color:var(--ink)}
.rs-tag{flex:0 0 auto;font-size:11px;font-weight:900;letter-spacing:.07em;text-transform:uppercase;color:var(--green)}
.rs-empty{margin:18px 4px 0;text-align:center;font-size:13px;font-weight:700;color:var(--mute)}

/* G3 floating popup - 420px / 80dvh / 16px, centred, plain X */
.fpop-scrim{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;
  padding:16px;background:rgba(0,0,0,.45)}
.fpop-scrim[hidden]{display:none}
.fpop-scrim.open{display:flex}
.fpop{width:100%;max-width:420px;max-height:80dvh;background:#fff;border-radius:16px;
  display:flex;flex-direction:column;overflow:hidden}
.fpop-hdr{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:14px 16px 12px;border-bottom:1px solid var(--line)}
.fpop-hdr h3{margin:0;flex:1;min-width:0;font-size:16px;font-weight:900;line-height:1.3}
.fpop-x{flex:0 0 auto;border:0;background:transparent;color:var(--mute);font-size:22px;line-height:1;
  padding:0 2px;cursor:pointer;border-radius:0}
.fpop-body{flex:1 1 auto;overflow-y:auto;padding:16px;font-size:16px;font-weight:600;line-height:1.5;color:var(--ink)}
.fpop-foot{flex:0 0 auto;padding:0 16px 16px}
.fpop-btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font-family:inherit;font-size:15px;
  font-weight:800;cursor:pointer;background:var(--green);color:#fff}

/* bottom nav — the house five (same bar as index.html) */
#nav{flex:0 0 auto;position:relative;display:flex;background:#0a0a0a;border-top:1px solid #1a1a1a;
  padding-bottom:env(safe-area-inset-bottom);z-index:50}
.nav-btn{flex:1;padding:16px 2px 15px;display:flex;align-items:center;justify-content:center;
  color:rgba(255,255,255,.42);transition:color .18s;border:0;background:none;cursor:pointer}
.nav-btn svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round;transition:transform .18s}
.nav-btn.on{color:#ffffff}
.nav-btn.on svg{transform:translateY(-1px);filter:drop-shadow(0 0 8px rgba(255,255,255,.35))}
.nav-btn:active{color:rgba(255,255,255,.75)}
</style>
</head>


<body data-page="EatOuts-Region">
<div id="shell">

  <header id="hdr">
    <button class="brand-mark" type="button" aria-label="EatOuts home" data-act="backHistory">
      <img src="assets/logo/EatOuts_Logo.png" alt="EatOuts">
    </button>
    <div class="hdr-right"><span class="region-code" id="regionCode">BW</span></div>
  </header>

  <div class="scroll">
    <div class="phead">
      <h1>Select Region</h1>
      <p>Your region sets the currency, locations and content the app loads.</p>
    </div>
    <main class="pad">
      <input id="regionSearch" class="rs-search" type="search" placeholder="Search regions…" autocomplete="off" aria-label="Search regions">
      <div id="regionList" class="rs-list"></div>
    </main>
  </div>

  <nav id="nav"><button class="nav-btn" type="button" data-tab="promos" aria-label="promos"><svg viewBox="0 0 24 24"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path><line x1="7" y1="7" x2="7.01" y2="7"></line></svg></button><button class="nav-btn" type="button" data-tab="restaurants" aria-label="restaurants"><svg viewBox="0 0 24 24"><path d="M3 9l1.5-5h15L21 9"></path><path d="M3 9v11a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V9"></path><path d="M3 9h18"></path><path d="M9 13h6"></path></svg></button><button class="nav-btn" type="button" data-tab="reserve" aria-label="reserve"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg></button><button class="nav-btn" type="button" data-tab="gallery" aria-label="gallery"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg></button><button class="nav-btn on" type="button" data-tab="about" aria-label="about"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg></button></nav>

</div>

<script src="js/eatouts-back-history.js"></script>
<script src="js/eatouts-regions.js"></script>
<script>
(function(){
  "use strict";

  var R = window.EatoutsRegions;
  var listEl = document.getElementById('regionList');
  var searchEl = document.getElementById('regionSearch');
  var codeEl = document.getElementById('regionCode');

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  function current(){
    return (R && R.getActiveRegion) ? R.getActiveRegion() : null;
  }

  function rowHtml(r, active){
    var on = !!(active && active.code === r.code);
    return '<button class="rs-item" type="button" data-code="' + esc(r.code) + '" aria-pressed="' + (on ? 'true' : 'false') + '">' +
      '<img class="rs-flag" src="assets/flags/' + esc(String(r.code).toLowerCase()) + '.png" alt="' + esc(r.name) + '" loading="lazy">' +
      '<span class="rs-name">' + esc(r.name) + '</span>' +
      (on ? '<span class="rs-tag">Selected</span>' : '') +
    '</button>';
  }

  function render(q){
    if (!R || !R.all){
      listEl.innerHTML = '<div class="rs-empty">Regions are unavailable right now.</div>';
      return;
    }
    var active = current();
    var term = String(q || '').trim().toLowerCase();
    /* Every live region is selectable. The one you are in comes first, the
       rest follow alphabetically. */
    var rows = R.all().filter(function(r){ return !!r.active; }).sort(function(a, b){
      var aOn = !!(active && active.code === a.code);
      var bOn = !!(active && active.code === b.code);
      if (aOn !== bOn) return aOn ? -1 : 1;
      return a.name < b.name ? -1 : a.name > b.name ? 1 : 0;
    });
    if (term){
      rows = rows.filter(function(r){
        return r.name.toLowerCase().indexOf(term) !== -1 || String(r.code).toLowerCase().indexOf(term) !== -1;
      });
    }
    codeEl.textContent = active ? active.code : '';
    listEl.innerHTML = rows.length
      ? rows.map(function(r){ return rowHtml(r, active); }).join('')
      : '<div class="rs-empty">No region matches "' + esc(term) + '".</div>';
  }

  /* tapping a row switches region and drops the user into that region's
     restaurants — the payload, currency and towns are chosen at page load, so
     the switch has to be a navigation. */
  listEl.addEventListener('click', function(ev){
    var btn = ev.target.closest ? ev.target.closest('.rs-item') : null;
    if (!btn) return;
    var r = (R && R.get) ? R.get(btn.getAttribute('data-code')) : null;
    if (!r || !r.active) return;
    if (R.setActiveRegion) R.setActiveRegion(r.code);
    window.location.href = 'index.html#restaurants';
  });

  /* bottom nav: the five house tabs */
  var navEl = document.getElementById('nav');
  if (navEl){
    navEl.addEventListener('click', function(ev){
      var btn = ev.target.closest ? ev.target.closest('.nav-btn') : null;
      if (!btn) return;
      var tab = btn.getAttribute('data-tab');
      if (tab) window.location.href = 'index.html#' + tab;
    });
  }

  searchEl.addEventListener('input', function(){ render(this.value); });

  render('');
})();
</script>
</body>
</html>
