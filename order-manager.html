<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#ffffff"><title>Order manager · EatOuts</title><link rel="stylesheet" href="assets/eatouts-manager.css"></head><body><div id="mount"></div><script src="js/eatouts-manager-db.js"></script><script src="js/eatouts-roles.js"></script><script src="js/eatouts-users.js"></script><script src="js/eatouts-feedback.js"></script><script src="js/eatouts-blog-admin.js"></script><script src="js/eatouts-auth.js"></script><script src="js/eatouts-manager.js"></script><script>document.addEventListener("DOMContentLoaded",()=>{const u=EO.guard({});if(!u)throw new Error("guard");document.querySelector("#mount").innerHTML=EO.shell("Order manager","Live queue across new \u2192 delivered / cancelled",`<div class="notice" style="margin-bottom:12px">This is the live incoming-order queue replacing the old empty delivery shell.</div><div id="board" class="orderboard"></div>`,{section:"Manager"});
const b=EO.business(),statuses=["new","accepted","preparing","ready","dispatched","delivered","cancelled"];function render(){const orders=EatoutsMgrDB.filter("orders",o=>o.businessId===b.id);document.querySelector("#board").innerHTML=statuses.map(s=>`<section class="ordercol"><h3>${s} · ${orders.filter(o=>o.status===s).length}</h3>${orders.filter(o=>o.status===s).map(o=>`<article class="ordercard"><strong>${o.id} · ${EO.esc(o.customer)}</strong><p>${o.items.map(EO.esc).join(" · ")}<br>${EO.money(o.total)} · ${o.delivery}<br>${o.created}</p>${!["delivered","cancelled"].includes(s)?`<button class="btn primary" data-next="${o.id}">Advance</button>`:""}</article>`).join("")||"<div style='font-size:10px;color:#999'>No orders</div>"}</section>`).join("")}document.querySelector("#board").onclick=e=>{const id=e.target.dataset.next;if(id){const o=EatoutsMgrDB.find("orders",id),i=statuses.indexOf(o.status);o.status=statuses[Math.min(i+1,5)];EatoutsMgrDB.save();render()}};render();setInterval(render,5000);});</script></body></html>
