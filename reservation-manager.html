<!doctype html>
<!-- PAGE: Reservation manager --><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#ffffff"><title>Reservation manager · EatOuts</title><link rel="stylesheet" href="assets/eatouts-manager.css"></head><body data-page="reservation-manager"><div id="mount"></div><script src="js/eatouts-manager-db.js"></script><script src="assets/data/demo/the-food-place/demo-data.js"></script><script src="js/eatouts-manager-seed.js"></script><script src="js/eatouts-roles.js"></script><script src="js/eatouts-users.js"></script><script src="js/eatouts-feedback.js"></script><script src="js/eatouts-blog-admin.js"></script><script src="js/eatouts-auth.js"></script><script src="js/eatouts-manager.js"></script><script src="js/eatouts-audit.js"></script><script>document.addEventListener("DOMContentLoaded",()=>{const u=EO.guard({});if(!u)throw new Error("guard");document.querySelector("#mount").innerHTML=EO.shell("Reservation manager","Table bookings, guest list and deposits",`<div class="card"><div class="card-title">Upcoming bookings</div><div id="res"></div></div><div class="card"><div class="card-title">New booking</div><form id="rf"><div class="two"><label class="field"><span>Guest</span><input name="guest" required></label><label class="field"><span>Guests</span><input name="guests" type="number" value="2"></label></div><div class="two"><label class="field"><span>Date</span><input name="date" type="date" required></label><label class="field"><span>Time</span><input name="time" type="time" required></label></div><label class="field"><span>Deposit</span><input name="deposit" type="number" value="0"></label><button class="btn primary">Add booking</button></form></div>`,{section:"Manager"});
const b=EO.business();function render(){document.querySelector("#res").innerHTML=EatoutsMgrDB.filter("reservations",x=>x.businessId===b.id).map(x=>`<div class="listrow"><div class="listmain"><strong>${EO.esc(x.guest)}</strong><small>${EO.esc(x.date)} · ${EO.esc(x.time)} · ${EO.esc(x.guests)} guests · Deposit ${EO.money(x.deposit)}</small></div>${EO.status(x.status)}</div>`).join("")||"<div class='empty'>No bookings.</div>"}document.querySelector("#rf").onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);const doc={id:"RS-"+Date.now(),businessId:b.id,guest:f.get("guest"),guests:Number(f.get("guests")),date:f.get("date"),time:f.get("time"),deposit:Number(f.get("deposit")),status:"pending"};EatoutsMgrDB.upsert("reservations",doc);if(window.EatoutsAudit&&window.EatoutsAudit.log)EatoutsAudit.log("reservation.created",doc.id,null,{id:doc.id,guest:doc.guest,guests:doc.guests,date:doc.date,time:doc.time},{businessId:b.id});e.target.reset();render();EO.toast("Reservation added")};render();});</script></body></html>
