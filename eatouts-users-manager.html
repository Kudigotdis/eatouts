<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#ffffff"><title>Users manager · EatOuts</title><link rel="stylesheet" href="assets/eatouts-manager.css"></head><body><div id="mount"></div><script src="js/eatouts-manager-db.js"></script><script src="js/eatouts-roles.js"></script><script src="js/eatouts-users.js"></script><script src="js/eatouts-feedback.js"></script><script src="js/eatouts-blog-admin.js"></script><script src="js/eatouts-auth.js"></script><script src="js/eatouts-manager.js"></script><script src="js/eatouts-audit.js"></script><script>document.addEventListener("DOMContentLoaded",()=>{if(!EO.guard({"roles": ["platform_admin", "platform_ops"]}))return;document.querySelector("#mount").innerHTML=EO.shell("Users manager","All users, roles, status, business and demo impersonation",`<div class="two"><label class="field"><span>Search</span><input id="search" placeholder="Name or WhatsApp"></label><label class="field"><span>Type</span><select id="type"><option value="">All</option><option>customer</option><option>biz_owner</option><option>supplier</option><option>platform_admin</option></select></label></div><div id="users" class="card"></div>`,{section:"Platform admin"});
let cur=1;
function render(){const all=EatoutsUsers.all(),q=document.querySelector("#search").value.toLowerCase().trim(),t=document.querySelector("#type").value;const a=all.filter(u=>(!q||((u.firstName||"")+" "+(u.surname||"")+" "+(u.whatsapp||"")).toLowerCase().includes(q)||EO.phone(u.whatsapp).includes(EO.phone(q)))&&(!t||u.type===t));const st=EO.page(a,cur,50);cur=st.page;document.querySelector("#users").innerHTML=st.total?st.rows.map(u=>`<div class="listrow"><div class="listmain"><strong>${EO.esc((u.firstName||"")+" "+(u.surname||""))}</strong><small>${EO.esc(EO.phoneDisplay(u.whatsapp))} · ${EO.esc(u.type||"")} · ${EO.esc(u.businessId||"—")}</small></div><div class="actions">${EO.status(u.status||"active")}<button class="btn" data-imp="${EO.esc(u.id)}">Impersonate</button><button class="btn" data-reset="${EO.esc(u.id)}">Reset PIN</button></div></div>`).join("")+EO.pager(st):EO.empty("No users match","Adjust the search or type filter.")}
document.querySelector("#search").oninput=()=>{cur=1;render()};document.querySelector("#type").onchange=()=>{cur=1;render()};
document.querySelector("#users").onclick=e=>{if(e.target.dataset.page){cur=Number(e.target.dataset.page);render();return}const id=e.target.dataset.imp||e.target.dataset.reset;if(!id)return;const u=EatoutsUsers.find(id)||{};if(e.target.dataset.reset){if(!EO.confirm("Reset the demo PIN for "+((u.firstName||"")+" "+(u.surname||"")).trim()+" to 1234?"))return;if(window.EatoutsAudit)try{EatoutsAudit.log("user.pin-reset",id,null,{note:"demo PIN reset to 1234"})}catch(_){}EO.toast("Demo PIN reset to 1234");return}if(window.EatoutsAudit)try{EatoutsAudit.log("user.impersonate",id,null,{note:"admin opened demo session"})}catch(_){}localStorage.setItem(EatoutsAuth.SESSION,id);if(u.businessId)localStorage.setItem(EatoutsAuth.BUSINESS,u.businessId);location.href=u&&u.id?EatoutsAuth.routeFor(u):"index.html"};
render();});</script></body></html>
