<!doctype html>
<!-- PAGE: Users manager -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#141418">
<title>Users manager · EatOuts</title>
<style>
::-webkit-scrollbar{width:0;height:0;display:none}
*{scrollbar-width:none;-ms-overflow-style:none}

  *,*::before,*::after{box-sizing:border-box}
  :root{
    --ink:#0F0F12;
    --ink-2:#2A2A30;
    --ink-3:#4A4A52;
    --paper:#F4F5F7;
    --card:#FFFFFF;
    --line:#E6E8EC;
    --line-2:#F0F1F4;
    --orange:#FF5A1F;
    --orange-2:#FF7A42;
    --orange-soft:#FFEDE4;
    --orange-line:#FFD5C2;
    --green:#16A34A;
    --green-soft:#E7F7EE;
    --red:#DC2626;
    --red-soft:#FEE2E2;
    --amber:#B45309;
    --amber-soft:#FEF3C7;
    --blue:#0284C7;
    --blue-soft:#E0F2FE;
    --muted:#6B7280;
    --faint:#9AA1AC;
  }
  html,body{height:100%}
  body{
    margin:0;
    background:#E9EBEF;
    color:var(--ink);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:15px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;
    display:flex;
    justify-content:center;
  }
  button,input,select,textarea{font-family:inherit}
  button{cursor:pointer}

  #shell{
    width:100%;
    max-width:460px;
    height:100vh;
    height:100dvh;
    background:var(--paper);
    display:flex;
    flex-direction:column;
    overflow:hidden;
    position:relative;
    box-shadow:0 0 70px rgba(20,20,25,.16);
  }

  /* ============ TOPBAR ============ */
  .topbar{
    flex:0 0 auto;
    background:#141418;
    padding:calc(13px + env(safe-area-inset-top)) 18px 14px;
    position:relative;
    z-index:10;
  }
  .topbar-row{
    display:flex;align-items:center;gap:10px;
    padding-bottom:13px;
  }
  .brand{
    display:inline-flex;align-items:center;gap:9px;
    text-decoration:none;
  }
  .brand .mark{
    width:28px;height:28px;flex:0 0 auto;border-radius:8px;
    background:linear-gradient(145deg,var(--orange-2),var(--orange));
    color:#fff;
    display:grid;place-items:center;
    font-size:14px;font-weight:900;letter-spacing:-.03em;
    box-shadow:0 2px 10px rgba(255,90,31,.35);
  }
  .brand .word{
    color:#fff;font-size:15px;font-weight:800;
    letter-spacing:-.02em;
  }
  .hdr-chip{
    margin-left:auto;
    font-size:10px;font-weight:800;
    letter-spacing:.12em;text-transform:uppercase;
    color:var(--orange-2);
    border:1px solid rgba(255,122,66,.32);
    background:rgba(255,90,31,.1);
    border-radius:999px;
    padding:5px 11px;
    white-space:nowrap;
  }

  .progress{padding-bottom:2px}
  .progress-top{
    display:flex;align-items:baseline;justify-content:space-between;
    gap:10px;margin-bottom:8px;
  }
  .progress-label{
    font-size:11px;font-weight:800;
    letter-spacing:.14em;text-transform:uppercase;
    color:rgba(255,255,255,.5);
  }
  .progress-count{
    font-size:11.5px;font-weight:800;
    color:var(--orange-2);
    letter-spacing:.02em;
  }
  .progress-track{
    height:5px;border-radius:99px;
    background:rgba(255,255,255,.13);
    overflow:hidden;
  }
  .progress-fill{
    height:100%;width:0%;
    border-radius:99px;
    background:linear-gradient(90deg,var(--orange),var(--orange-2));
    transition:width .35s cubic-bezier(.4,0,.2,1);
  }

  /* ============ SCROLL ============ */
  .scroll{
    flex:1 1 auto;min-height:0;
    overflow-y:auto;
    overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
    scrollbar-width:none;
  }
  .scroll::-webkit-scrollbar{display:none}

  /* ============ INTRO ============ */
  .intro{
    background:linear-gradient(175deg,#141418 0%,#1B1B21 60%,#232329 100%);
    padding:4px 22px 46px;
    position:relative;
    overflow:hidden;
    text-align:center;
  }
  .intro::after{
    content:"";
    position:absolute;
    top:-80px;right:-80px;
    width:230px;height:230px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,90,31,.2),transparent 68%);
    pointer-events:none;
  }
  .intro h1{
    position:relative;
    margin:0 auto 12px;
    font-size:26px;
    line-height:1.15;
    font-weight:800;
    letter-spacing:-.03em;
    color:#fff;
    max-width:15ch;
  }
  .intro h1 em{font-style:normal;color:var(--orange-2)}
  .intro p{
    position:relative;
    margin:0 auto;
    font-size:14px;
    line-height:1.6;
    color:rgba(255,255,255,.6);
    max-width:32ch;
  }

  /* ============ SHEET ============ */
  .sheet{
    position:relative;
    z-index:1;
    margin-top:-26px;
    background:var(--paper);
    border-radius:26px 26px 0 0;
    padding:20px 14px 30px;
    min-height:60vh;
  }

  /* ============ META CARD ============ */
  .meta-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:15px 16px;
    margin-bottom:12px;
    box-shadow:0 1px 2px rgba(20,20,25,.03);
  }
  .meta-row{
    display:flex;align-items:center;gap:10px;
    margin-bottom:11px;
  }
  .meta-dot{
    width:9px;height:9px;border-radius:50%;flex:0 0 auto;
    background:var(--orange);
    box-shadow:0 0 0 3px var(--orange-soft);
  }
  .meta-dot.green{background:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
  .meta-dot.warn{background:var(--amber);box-shadow:0 0 0 3px var(--amber-soft)}
  .meta-dot.red{background:var(--red);box-shadow:0 0 0 3px var(--red-soft)}
  .meta-text{
    font-size:13.5px;
    color:var(--ink-2);
    line-height:1.4;
    min-width:0;
    flex:1 1 auto;
  }
  .meta-text b{color:var(--ink);font-weight:750}
  .meta-stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    padding-top:11px;
    border-top:1px solid var(--line-2);
  }
  .stat{text-align:center}
  .stat b{
    display:block;
    font-size:19px;font-weight:850;
    letter-spacing:-.03em;
    color:var(--ink);
    line-height:1.1;
    font-variant-numeric:tabular-nums;
  }
  .stat span{
    display:block;
    margin-top:3px;
    font-size:9.5px;font-weight:800;
    letter-spacing:.1em;text-transform:uppercase;
    color:var(--faint);
  }

  /* ============ FILTER BAR ============ */
  .filter-bar{
    display:flex;
    gap:8px;
    margin-bottom:12px;
  }
  .filter-bar input,
  .filter-bar select{
    flex:1 1 auto;
    min-width:0;
    height:44px;
    border:1px solid var(--line);
    border-radius:12px;
    background:#fff;
    color:var(--ink);
    font-size:14px;
    padding:0 12px;
    outline:none;
    transition:border-color .15s,box-shadow .15s;
    -webkit-appearance:none;
    appearance:none;
    font-family:inherit;
  }
  .filter-bar input:focus,
  .filter-bar select:focus{
    border-color:var(--orange);
    box-shadow:0 0 0 3px rgba(255,90,31,.13);
  }
  .filter-bar input::placeholder{color:#B7BDC6}
  .filter-bar select{flex:0 0 130px}

  /* ============ ACCORDION STACK ============ */
  .stack{display:flex;flex-direction:column;gap:10px}
  .acc{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    overflow:hidden;
    transition:border-color .2s ease,box-shadow .2s ease;
  }
  .acc.open{
    border-color:var(--orange-line);
    box-shadow:0 4px 18px -6px rgba(255,90,31,.22);
  }
  .acc.active-user .acc-sub{color:var(--green);font-weight:650}

  .acc-head{
    width:100%;
    display:flex;align-items:center;gap:12px;
    padding:13px 15px;
    background:transparent;border:0;
    text-align:left;
    -webkit-tap-highlight-color:transparent;
    transition:background .15s;
  }
  .acc-head:active{background:#FAFBFC}

  .usr-thumb{
    width:48px;height:48px;flex:0 0 auto;
    border-radius:50%;
    background:var(--orange-soft);
    color:var(--orange);
    display:grid;place-items:center;
    font-size:16px;font-weight:850;
    letter-spacing:-.02em;
    overflow:hidden;
    position:relative;
  }
  .usr-thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .usr-thumb.muted{
    background:#F0F1F4;color:var(--faint);
  }

  .acc-title{
    flex:1 1 auto;min-width:0;
    display:flex;flex-direction:column;gap:2px;
  }
  .acc-title b{
    font-size:15px;font-weight:750;
    letter-spacing:-.015em;
    color:var(--ink);
    line-height:1.25;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .acc-sub{
    font-size:11.5px;
    color:var(--faint);
    line-height:1.3;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    font-weight:550;
  }

  .vis-dot{
    width:9px;height:9px;border-radius:50%;flex:0 0 auto;
    background:var(--green);
    box-shadow:0 0 0 3px var(--green-soft);
  }
  .vis-dot.off{background:#D3D7DE;box-shadow:none}
  .vis-dot.warn{background:var(--amber);box-shadow:0 0 0 3px var(--amber-soft)}
  .vis-dot.red{background:var(--red);box-shadow:0 0 0 3px var(--red-soft)}

  .acc-body{
    display:grid;
    grid-template-rows:0fr;
    transition:grid-template-rows .32s cubic-bezier(.4,0,.2,1);
  }
  .acc.open .acc-body{grid-template-rows:1fr}
  .acc-inner{overflow:hidden;min-height:0}

  .module{padding:2px 15px 18px}

  /* Info blocks inside accordion body */
  .info-block{
    background:#FAFBFC;
    border:1px solid var(--line-2);
    border-radius:12px;
    padding:13px 14px;
    margin-bottom:10px;
  }
  .info-block:last-of-type{margin-bottom:12px}
  .info-block h4{
    margin:0 0 8px;
    font-size:11.5px;font-weight:800;
    letter-spacing:.09em;text-transform:uppercase;
    color:var(--muted);
  }
  .info-block p{
    margin:0;
    font-size:13px;
    line-height:1.5;
    color:var(--ink-2);
    font-weight:550;
  }
  .info-block p + p{margin-top:5px}
  .info-block b{color:var(--ink);font-weight:750}

  /* Definition rows */
  .def-row{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
    padding:7px 0;
    border-bottom:1px solid var(--line-2);
    font-size:13px;
  }
  .def-row:last-child{border-bottom:0;padding-bottom:0}
  .def-row:first-child{padding-top:0}
  .def-row .k{color:var(--faint);font-weight:650;flex:0 0 auto}
  .def-row .v{color:var(--ink-2);font-weight:700;text-align:right;word-break:break-word;min-width:0}

  /* Role pill */
  .role-pill{
    display:inline-flex;align-items:center;
    padding:3px 9px;border-radius:999px;
    font-size:10.5px;font-weight:800;
    letter-spacing:.05em;text-transform:uppercase;
    background:var(--orange-soft);color:var(--orange);
  }
  .role-pill.customer{background:var(--blue-soft);color:var(--blue)}
  .role-pill.biz_owner{background:var(--green-soft);color:var(--green)}
  .role-pill.supplier{background:var(--amber-soft);color:var(--amber)}
  .role-pill.investor{background:#F3E8FF;color:#7C3AED}
  .role-pill.platform_admin{background:var(--orange-soft);color:var(--orange)}

  /* Status pill */
  .status-pill{
    display:inline-flex;align-items:center;
    padding:3px 9px;border-radius:999px;
    font-size:10.5px;font-weight:800;
    letter-spacing:.05em;text-transform:uppercase;
    background:var(--green-soft);color:var(--green);
  }
  .status-pill.pending{background:var(--amber-soft);color:var(--amber)}
  .status-pill.suspended,.status-pill.rejected{background:var(--red-soft);color:var(--red)}

  /* Action row */
  .action-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
    margin-top:14px;
  }
  .action-row .btn{
    height:48px;
    border-radius:12px;
    font-size:14px;
    font-weight:750;
    border:0;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    -webkit-tap-highlight-color:transparent;
    transition:transform .1s ease,background .15s;
    letter-spacing:-.005em;
  }
  .action-row .btn:active{transform:scale(.98)}
  .btn-imp{
    background:linear-gradient(145deg,var(--orange-2),var(--orange));
    color:#fff;
    box-shadow:0 6px 18px -6px rgba(255,90,31,.5);
  }
  .btn-imp:active{background:var(--orange)}
  .btn-reset{
    background:#F4F5F7;
    border:1px solid var(--line)!important;
    color:var(--ink-2);
  }
  .btn-reset:active{background:#EBEDF0}

  /* Empty state */
  .empty-note{
    font-size:12.5px;
    color:var(--faint);
    text-align:center;
    padding:22px 16px;
    border:1.5px dashed #DCE0E6;
    border-radius:11px;
    background:#FAFBFC;
    line-height:1.55;
  }
  .empty-note b{color:var(--ink-2);font-weight:750}

  /* ============ PAGER ============ */
  .pager{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    margin-top:14px;
  }
  .pager button{
    min-width:44px;
    height:40px;
    padding:0 14px;
    border:1px solid var(--line);
    background:#fff;
    border-radius:11px;
    font-size:13px;
    font-weight:750;
    color:var(--ink-2);
    -webkit-tap-highlight-color:transparent;
  }
  .pager button:active{background:#F4F5F7}
  .pager button[disabled]{opacity:.35;pointer-events:none}
  .pager .page-info{
    font-size:13px;
    font-weight:750;
    color:var(--muted);
    padding:0 6px;
  }

  /* ============ TOAST ============ */
  .toast{
    position:fixed;left:50%;z-index:200;
    bottom:calc(28px + env(safe-area-inset-bottom));
    transform:translate(-50%,10px);
    background:var(--ink);color:#fff;
    font-size:13.5px;font-weight:650;
    padding:12px 18px;border-radius:999px;
    max-width:88vw;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    opacity:0;pointer-events:none;
    transition:opacity .2s ease,transform .2s ease;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body data-page="eatouts-users-manager">
<div id="shell">

  <header class="topbar">
    <div class="topbar-row">
      <a class="brand" href="index.html">
        <span class="mark">E</span>
        <span class="word">EatOuts</span>
      </a>
      <span class="hdr-chip">Users manager</span>
    </div>
    <div class="progress">
      <div class="progress-top">
        <span class="progress-label">Directory</span>
        <span class="progress-count" id="progressCount">—</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>
  </header>

  <div class="scroll" id="scroll">
    <section class="intro" id="intro">
      <h1>Manage <em>users</em>.</h1>
      <p>Search, filter and impersonate accounts across the platform.</p>
    </section>
    <main class="sheet" id="app"></main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script src="js/eatouts-manager-db.js"></script>
<script src="assets/data/demo/the-food-place/demo-data.js"></script>
<script src="js/eatouts-manager-seed.js"></script>
<script src="js/eatouts-roles.js"></script>
<script src="js/eatouts-users.js"></script>
<script src="js/eatouts-feedback.js"></script>
<script src="js/eatouts-blog-admin.js"></script>
<script src="js/eatouts-auth.js"></script>
<script src="js/eatouts-manager.js"></script>
<script src="js/eatouts-audit.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {

  /* ---- Auth guard (unchanged) ---- */
  if (!EO.guard({"roles": ["platform_admin", "platform_ops"]})) return;

  /* ============================================================
     HELPERS
     ============================================================ */
  var toastEl = document.getElementById("toast");
  var toastTimer = null;
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove("show"); }, 2000);
  }

  /* Only one accordion open at a time; null = all closed */
  var OPEN = null;

  /* Current pagination page (matches original 50-per-page behaviour) */
  var curPage = 1;
  var PER_PAGE = 50;

  /* Current filter state (read/write via the filter bar) */
  var filter = { q: "", type: "" };

  /* ============================================================
     STATE HELPERS
     ============================================================ */
  function allUsers(){
    try { return EatoutsUsers.all() || []; }
    catch (e) { return []; }
  }

  function userDisplayName(u){
    var n = ((u.firstName || "") + " " + (u.surname || "")).trim();
    return n || "Unnamed user";
  }

  function initials(u){
    var f = (u.firstName || "").trim().charAt(0);
    var s = (u.surname  || "").trim().charAt(0);
    var out = (f + s).toUpperCase();
    return out || "?";
  }

  function statusClass(s){
    var v = String(s || "active").toLowerCase();
    if (v === "suspended" || v === "rejected") return "red";
    if (v === "pending") return "warn";
    if (v === "inactive" || v === "off") return "off";
    return "";
  }

  function statusPillClass(s){
    var v = String(s || "active").toLowerCase();
    if (v === "pending") return "pending";
    if (v === "suspended" || v === "rejected") return "suspended";
    return "";
  }

  function roleClass(t){
    var v = String(t || "").toLowerCase();
    if (v === "customer")     return "customer";
    if (v === "biz_owner")    return "biz_owner";
    if (v === "supplier")     return "supplier";
    if (v === "investor")     return "investor";
    if (v === "platform_admin") return "platform_admin";
    return "";
  }

  /* ============================================================
     FILTER + PAGE
     ============================================================ */
  function filteredUsers(){
    var all = allUsers();
    var q = (filter.q || "").toLowerCase().trim();
    var t = filter.type || "";

    return all.filter(function(u){
      var name = ((u.firstName || "") + " " + (u.surname || "")).toLowerCase();
      var phone = String(u.whatsapp || "");
      var phoneNorm = "";
      try { phoneNorm = EO.phone(u.whatsapp) || ""; } catch (e) { phoneNorm = phone; }
      var qNorm = "";
      try { qNorm = EO.phone(q) || q; } catch (e) { qNorm = q; }

      var matchesQ = !q
        || name.indexOf(q) !== -1
        || phone.toLowerCase().indexOf(q) !== -1
        || (phoneNorm && phoneNorm.indexOf(qNorm) !== -1);

      var matchesT = !t || u.type === t;
      return matchesQ && matchesT;
    });
  }

  function paginate(list){
    var total = list.length;
    var pages = Math.max(1, Math.ceil(total / PER_PAGE));
    if (curPage > pages) curPage = pages;
    if (curPage < 1)     curPage = 1;
    var start = (curPage - 1) * PER_PAGE;
    return {
      total: total,
      page: curPage,
      pages: pages,
      rows: list.slice(start, start + PER_PAGE)
    };
  }

  /* ============================================================
     RENDER
     ============================================================ */
  var mount = document.getElementById("app");

  function render(){
    var all     = allUsers();
    var list    = filteredUsers();
    var st      = paginate(list);

    var totalUsers = all.length;
    var pageShown  = st.rows.length;

    /* ---- progress bar: show filtered/total coverage ---- */
    var pct = totalUsers ? Math.round((list.length / totalUsers) * 100) : 0;
    document.getElementById("progressFill").style.width = pct + "%";
    document.getElementById("progressCount").textContent =
      list.length + " of " + totalUsers + " user" + (totalUsers === 1 ? "" : "s");

    /* ---- meta card ---- */
    var activeCount   = all.filter(function(u){ return (u.status||"active") === "active"; }).length;
    var bizCount      = all.filter(function(u){ return u.type === "biz_owner"; }).length;
    var adminCount    = all.filter(function(u){ return u.type === "platform_admin"; }).length;

    var dotClass, msg;
    if (totalUsers === 0){
      dotClass = "warn";
      msg = "No users registered yet";
    } else if (list.length === 0){
      dotClass = "warn";
      msg = "No users match the current filter";
    } else {
      dotClass = "green";
      msg = "<b>" + list.length + "</b> user" + (list.length === 1 ? "" : "s") +
            " shown · " + activeCount + " active";
    }

    var metaHTML =
      '<div class="meta-card">' +
        '<div class="meta-row">' +
          '<span class="meta-dot ' + dotClass + '"></span>' +
          '<span class="meta-text">' + msg + '</span>' +
        '</div>' +
        '<div class="meta-stats">' +
          '<div class="stat"><b>' + totalUsers + '</b><span>Total</span></div>' +
          '<div class="stat"><b>' + bizCount + '</b><span>Owners</span></div>' +
          '<div class="stat"><b>' + adminCount + '</b><span>Admins</span></div>' +
        '</div>' +
      '</div>';

    /* ---- filter bar ---- */
    var filterHTML =
      '<div class="filter-bar">' +
        '<input id="search" type="search" placeholder="Name or WhatsApp" value="' + escapeAttr(filter.q) + '">' +
        '<select id="type">' +
          '<option value=""' + (filter.type === "" ? " selected" : "") + '>All types</option>' +
          '<option value="customer"'       + (filter.type === "customer"       ? " selected" : "") + '>Customer</option>' +
          '<option value="biz_owner"'      + (filter.type === "biz_owner"      ? " selected" : "") + '>Biz owner</option>' +
          '<option value="supplier"'       + (filter.type === "supplier"       ? " selected" : "") + '>Supplier</option>' +
          '<option value="investor"'       + (filter.type === "investor"       ? " selected" : "") + '>Investor</option>' +
          '<option value="platform_admin"' + (filter.type === "platform_admin" ? " selected" : "") + '>Platform admin</option>' +
        '</select>' +
      '</div>';

    /* ---- empty state ---- */
    if (totalUsers === 0){
      mount.innerHTML = metaHTML + filterHTML +
        '<div class="empty-note">No users registered yet.<br><b>New accounts</b> will appear here as they sign up.</div>';
      wireFilters();
      return;
    }

    if (st.total === 0){
      mount.innerHTML = metaHTML + filterHTML +
        '<div class="empty-note">No users match the current filter.<br><b>Try adjusting</b> the search or type.</div>';
      wireFilters();
      return;
    }

    /* ---- accordion stack ---- */
    var sections = st.rows.map(function(u){
      var id = u.id || "";
      var name = userDisplayName(u);
      var isOpen = OPEN === id;

      var phone = "";
      try { phone = EO.phoneDisplay(u.whatsapp) || u.whatsapp || "—"; }
      catch (e) { phone = u.whatsapp || "—"; }

      var typeLabel = u.type || "—";
      var bizId = u.businessId || "";
      var status = u.status || "active";

      var sub = phone + " · " + typeLabel + (bizId ? " · " + bizId : "");

      var thumbInner = initials(u);
      /* If a user ever carries an avatar URL we render it, otherwise initials */
      if (u.avatar || u.photo) {
        thumbInner = '<img src="' + escapeAttr(u.avatar || u.photo) + '" alt="">';
      }

      var cls = "acc";
      if (isOpen) cls += " open";
      if (status === "active") cls += " active-user";

      var body =
        '<div class="module">' +
          '<div class="info-block">' +
            '<h4>Account details</h4>' +
            '<div class="def-row"><span class="k">Full name</span><span class="v">' + esc(name) + '</span></div>' +
            '<div class="def-row"><span class="k">WhatsApp</span><span class="v">' + esc(phone) + '</span></div>' +
            '<div class="def-row"><span class="k">Type</span><span class="v"><span class="role-pill ' + roleClass(u.type) + '">' + esc(typeLabel) + '</span></span></div>' +
            '<div class="def-row"><span class="k">Status</span><span class="v"><span class="status-pill ' + statusPillClass(status) + '">' + esc(status) + '</span></span></div>' +
            '<div class="def-row"><span class="k">Business ID</span><span class="v">' + esc(bizId || "—") + '</span></div>' +
            '<div class="def-row"><span class="k">User ID</span><span class="v">' + esc(id || "—") + '</span></div>' +
          '</div>' +
          '<div class="action-row">' +
            '<button class="btn btn-imp" type="button" data-imp="' + escapeAttr(id) + '">Impersonate</button>' +
            '<button class="btn btn-reset" type="button" data-reset="' + escapeAttr(id) + '">Reset PIN</button>' +
          '</div>' +
        '</div>';

      return '' +
        '<section class="' + cls + '" data-key="' + escapeAttr(id) + '">' +
          '<button class="acc-head" type="button" aria-expanded="' + (isOpen ? "true" : "false") + '">' +
            '<span class="usr-thumb' + (status === "suspended" ? " muted" : "") + '">' + thumbInner + '</span>' +
            '<span class="acc-title">' +
              '<b>' + esc(name) + '</b>' +
              '<span class="acc-sub">' + esc(sub) + '</span>' +
            '</span>' +
            '<span class="vis-dot ' + statusClass(status) + '"></span>' +
          '</button>' +
          '<div class="acc-body">' +
            '<div class="acc-inner">' + body + '</div>' +
          '</div>' +
        '</section>';
    }).join("");

    /* ---- pager ---- */
    var pagerHTML = "";
    if (st.pages > 1){
      pagerHTML =
        '<div class="pager">' +
          '<button type="button" data-page="' + (st.page - 1) + '"' + (st.page <= 1 ? " disabled" : "") + '>Prev</button>' +
          '<span class="page-info">Page ' + st.page + ' / ' + st.pages + '</span>' +
          '<button type="button" data-page="' + (st.page + 1) + '"' + (st.page >= st.pages ? " disabled" : "") + '>Next</button>' +
        '</div>';
    }

    mount.innerHTML = metaHTML + filterHTML + '<div class="stack">' + sections + '</div>' + pagerHTML;

    wireFilters();
  }

  /* ============================================================
     FILTER WIRING
     ============================================================ */
  function wireFilters(){
    var s = document.getElementById("search");
    var t = document.getElementById("type");
    if (s){
      s.oninput = function(){
        filter.q = s.value;
        curPage = 1;
        render();
      };
    }
    if (t){
      t.onchange = function(){
        filter.type = t.value;
        curPage = 1;
        render();
      };
    }
  }

  /* ============================================================
     ACCORDION BEHAVIOUR — only one open at a time
     ============================================================ */
  function toggleAccordion(key){
    OPEN = (OPEN === key) ? null : key;
    var accs = mount.querySelectorAll(".acc");
    for (var i = 0; i < accs.length; i++){
      var acc = accs[i];
      var isOpen = acc.getAttribute("data-key") === OPEN;
      acc.classList.toggle("open", isOpen);
      var head = acc.querySelector(".acc-head");
      if (head) head.setAttribute("aria-expanded", isOpen ? "true" : "false");
    }
    if (OPEN){
      var opened = mount.querySelector('.acc[data-key="' + cssEscape(OPEN) + '"]');
      if (opened){
        setTimeout(function(){
          try { opened.scrollIntoView({ behavior:"smooth", block:"start" }); } catch (e) {}
        }, 320);
      }
    }
  }

  /* ============================================================
     DELEGATED CLICKS
     ============================================================ */
  mount.addEventListener("click", function(e){

    /* pager */
    var pg = e.target.closest("[data-page]");
    if (pg){
      e.stopPropagation();
      var n = Number(pg.getAttribute("data-page"));
      if (!isNaN(n) && n >= 1){
        curPage = n;
        render();
        var sc = document.getElementById("scroll");
        if (sc) sc.scrollTop = 0;
      }
      return;
    }

    /* impersonate */
    var imp = e.target.closest("[data-imp]");
    if (imp){
      e.stopPropagation();
      doImpersonate(imp.getAttribute("data-imp"));
      return;
    }

    /* reset PIN */
    var rst = e.target.closest("[data-reset]");
    if (rst){
      e.stopPropagation();
      doResetPin(rst.getAttribute("data-reset"));
      return;
    }

    /* accordion header (last, so inner buttons still work) */
    var head = e.target.closest(".acc-head");
    if (head){
      var acc = head.closest(".acc");
      if (acc) toggleAccordion(acc.getAttribute("data-key"));
      return;
    }
  });

  /* ============================================================
     ACTIONS (mirrors original behaviour)
     ============================================================ */
  function doImpersonate(id){
    var u = (EatoutsUsers.find && EatoutsUsers.find(id)) || {};
    if (window.EatoutsAudit){
      try { EatoutsAudit.log("user.impersonate", id, null, { note: "admin opened demo session" }); }
      catch (_) {}
    }
    localStorage.setItem(EatoutsAuth.SESSION, id);
    if (u.businessId) localStorage.setItem(EatoutsAuth.BUSINESS, u.businessId);
    location.href = (u && u.id) ? EatoutsAuth.routeFor(u) : "index.html";
  }

  function doResetPin(id){
    var u = (EatoutsUsers.find && EatoutsUsers.find(id)) || {};
    var name = ((u.firstName || "") + " " + (u.surname || "")).trim() || "this user";
    if (!EO.confirm("Reset the demo PIN for " + name + " to 1234?")) return;
    if (window.EatoutsAudit){
      try { EatoutsAudit.log("user.pin-reset", id, null, { note: "demo PIN reset to 1234" }); }
      catch (_) {}
    }
    toast("Demo PIN reset to 1234");
  }

  /* ============================================================
     TINY UTILS
     ============================================================ */
  function esc(s){
    return String(s == null ? "" : s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }
  function escapeAttr(s){
    return esc(s).replace(/`/g,"&#96;");
  }
  function cssEscape(s){
    /* Minimal escaping for our generated IDs (only used in attribute selectors) */
    return String(s).replace(/["\\]/g, "\\$&");
  }

  /* ============================================================
     BOOT
     ============================================================ */
  render();
});
</script>
</body>
</html>
