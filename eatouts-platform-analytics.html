<!doctype html>
<!-- PAGE: Platform analytics -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#141418">
<title>Platform analytics · EatOuts</title>
<style>
::-webkit-scrollbar{width:0;height:0;display:none}
*{scrollbar-width:none;-ms-overflow-style:none}

  *,*::before,*::after{box-sizing:border-box}
  :root{
    --ink:#0F0F12;
    --ink-2:#2A2A30;
    --ink-3:#4A4A52;
    --paper:#F4F5F7;
    --card:#FFFFFF;
    --line:#E6E8EC;
    --line-2:#F0F1F4;
    --orange:#FF5A1F;
    --orange-2:#FF7A42;
    --orange-soft:#FFEDE4;
    --orange-line:#FFD5C2;
    --green:#16A34A;
    --green-soft:#E7F7EE;
    --red:#DC2626;
    --red-soft:#FEE2E2;
    --amber:#B45309;
    --amber-soft:#FEF3C7;
    --blue:#0284C7;
    --blue-soft:#E0F2FE;
    --muted:#6B7280;
    --faint:#9AA1AC;
  }
  html,body{height:100%}
  body{
    margin:0;
    background:#E9EBEF;
    color:var(--ink);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:15px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;
    display:flex;
    justify-content:center;
  }
  button,input,select,textarea{font-family:inherit}
  button{cursor:pointer}

  #shell{
    width:100%;
    max-width:460px;
    height:100vh;
    height:100dvh;
    background:var(--paper);
    display:flex;
    flex-direction:column;
    overflow:hidden;
    position:relative;
    box-shadow:0 0 70px rgba(20,20,25,.16);
  }/* ============ TOPBAR ============ */

  .brand{
    display:inline-flex;align-items:center;gap:9px;
    text-decoration:none;
  }
  .brand .mark{
    width:28px;height:28px;flex:0 0 auto;border-radius:8px;
    background:linear-gradient(145deg,var(--orange-2),var(--orange));
    color:#fff;
    display:grid;place-items:center;
    font-size:14px;font-weight:900;letter-spacing:-.03em;
    box-shadow:0 2px 10px rgba(255,90,31,.35);
  }
  .brand .word{
    color:#fff;font-size:15px;font-weight:800;
    letter-spacing:-.02em;
  }

  .progress{padding-bottom:2px}
  .progress-top{
    display:flex;align-items:baseline;justify-content:space-between;
    gap:10px;margin-bottom:8px;
  }
  .progress-label{
    font-size:11px;font-weight:800;
    letter-spacing:.14em;text-transform:uppercase;
    color:rgba(255,255,255,.5);
  }
  .progress-count{
    font-size:11.5px;font-weight:800;
    color:var(--orange-2);
    letter-spacing:.02em;
  }
  .progress-track{
    height:5px;border-radius:99px;
    background:rgba(255,255,255,.13);
    overflow:hidden;
  }
  .progress-fill{
    height:100%;width:0%;
    border-radius:99px;
    background:linear-gradient(90deg,var(--orange),var(--orange-2));
    transition:width .35s cubic-bezier(.4,0,.2,1);
  }

  /* ============ SCROLL ============ */
  .scroll{
    flex:1 1 auto;min-height:0;
    overflow-y:auto;
    overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
    scrollbar-width:none;
  }
  .scroll::-webkit-scrollbar{display:none}

  /* ============ INTRO ============ */
  .intro{
    background:linear-gradient(175deg,#141418 0%,#1B1B21 60%,#232329 100%);
    padding:4px 22px 46px;
    position:relative;
    overflow:hidden;
    text-align:center;
  }
  .intro::after{
    content:"";
    position:absolute;
    top:-80px;right:-80px;
    width:230px;height:230px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,90,31,.2),transparent 68%);
    pointer-events:none;
  }
  .intro h1{
    position:relative;
    margin:0 auto 12px;
    font-size:26px;
    line-height:1.15;
    font-weight:800;
    letter-spacing:-.03em;
    color:#fff;
    max-width:15ch;
  }
  .intro h1 em{font-style:normal;color:var(--orange-2)}
  .intro p{
    position:relative;
    margin:0 auto;
    font-size:14px;
    line-height:1.6;
    color:rgba(255,255,255,.6);
    max-width:32ch;
  }

  /* ============ SHEET ============ */
  .sheet{
    position:relative;
    z-index:1;
    margin-top:-26px;
    background:var(--paper);
    border-radius:26px 26px 0 0;
    padding:20px 14px 30px;
    min-height:60vh;
  }

  /* ============ META CARD ============ */
  .meta-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:15px 16px;
    margin-bottom:12px;
    box-shadow:0 1px 2px rgba(20,20,25,.03);
  }
  .meta-row{
    display:flex;align-items:center;gap:10px;
    margin-bottom:11px;
  }
  .meta-dot{
    width:9px;height:9px;border-radius:50%;flex:0 0 auto;
    background:var(--orange);
    box-shadow:0 0 0 3px var(--orange-soft);
  }
  .meta-dot.green{background:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
  .meta-dot.warn{background:var(--amber);box-shadow:0 0 0 3px var(--amber-soft)}
  .meta-text{
    font-size:13.5px;
    color:var(--ink-2);
    line-height:1.4;
    min-width:0;
    flex:1 1 auto;
  }
  .meta-text b{color:var(--ink);font-weight:750}
  .meta-stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    padding-top:11px;
    border-top:1px solid var(--line-2);
  }
  .stat{text-align:center}
  .stat b{
    display:block;
    font-size:19px;font-weight:850;
    letter-spacing:-.03em;
    color:var(--ink);
    line-height:1.1;
    font-variant-numeric:tabular-nums;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .stat span{
    display:block;
    margin-top:3px;
    font-size:9.5px;font-weight:800;
    letter-spacing:.1em;text-transform:uppercase;
    color:var(--faint);
  }

  /* ============ ACCORDION STACK ============ */
  .stack{display:flex;flex-direction:column;gap:10px}
  .acc{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    overflow:hidden;
    transition:border-color .2s ease,box-shadow .2s ease;
  }
  .acc.open{
    border-color:var(--orange-line);
    box-shadow:0 4px 18px -6px rgba(255,90,31,.22);
  }
  .acc-head{
    width:100%;
    display:flex;align-items:center;gap:12px;
    padding:13px 15px;
    background:transparent;border:0;
    text-align:left;
    -webkit-tap-highlight-color:transparent;
    transition:background .15s;
  }
  .acc-head:active{background:#FAFBFC}

  .sec-thumb{
    width:48px;height:48px;flex:0 0 auto;
    border-radius:11px;
    background:var(--orange-soft);
    color:var(--orange);
    display:grid;place-items:center;
    font-size:17px;font-weight:850;
    letter-spacing:-.02em;
    position:relative;
  }
  .sec-thumb.plain{
    background:#F0F1F4;color:var(--faint);
  }
  .sec-thumb .count{
    position:absolute;
    bottom:3px;right:3px;
    background:rgba(15,15,18,.72);
    color:#fff;
    font-size:9px;
    font-weight:800;
    letter-spacing:.02em;
    padding:1.5px 5px;
    border-radius:4px;
    line-height:1;
  }

  .acc-title{
    flex:1 1 auto;min-width:0;
    display:flex;flex-direction:column;gap:2px;
  }
  .acc-title b{
    font-size:15px;font-weight:750;
    letter-spacing:-.015em;
    color:var(--ink);
    line-height:1.25;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .acc-sub{
    font-size:11.5px;
    color:var(--faint);
    line-height:1.3;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    font-weight:550;
  }

  .vis-dot{
    width:9px;height:9px;border-radius:50%;flex:0 0 auto;
    background:var(--orange);
    box-shadow:0 0 0 3px var(--orange-soft);
  }
  .vis-dot.off{background:#D3D7DE;box-shadow:none}
  .vis-dot.green{background:var(--green);box-shadow:0 0 0 3px var(--green-soft)}

  .acc-body{
    display:grid;
    grid-template-rows:0fr;
    transition:grid-template-rows .32s cubic-bezier(.4,0,.2,1);
  }
  .acc.open .acc-body{grid-template-rows:1fr}
  .acc-inner{overflow:hidden;min-height:0}

  .module{padding:2px 15px 18px}

  /* ============ METRIC GRID ============ */
  .metric-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
  }
  .metric{
    background:#FAFBFC;
    border:1px solid var(--line-2);
    border-radius:12px;
    padding:13px 12px;
    text-align:center;
  }
  .metric b{
    display:block;
    font-size:20px;font-weight:850;
    letter-spacing:-.03em;
    color:var(--ink);
    line-height:1.1;
    font-variant-numeric:tabular-nums;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .metric span{
    display:block;
    margin-top:4px;
    font-size:9.5px;font-weight:800;
    letter-spacing:.09em;text-transform:uppercase;
    color:var(--faint);
    line-height:1.35;
  }

  /* ============ TOWN ROWS ============ */
  .town-row{
    display:flex;align-items:center;gap:12px;
    padding:12px 0;
    border-bottom:1px solid var(--line-2);
  }
  .town-row:last-child{border-bottom:0;padding-bottom:0}
  .town-row:first-child{padding-top:0}
  .town-info{
    flex:1 1 auto;min-width:0;
    display:flex;flex-direction:column;gap:2px;
  }
  .town-info b{
    font-size:13.5px;font-weight:750;
    letter-spacing:-.01em;
    color:var(--ink);
    line-height:1.25;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .town-info span{
    font-size:11.5px;
    color:var(--faint);
    font-weight:550;
    line-height:1.3;
  }
  .town-bar-wrap{
    flex:0 0 90px;
    display:flex;flex-direction:column;align-items:flex-end;gap:5px;
  }
  .town-bar{
    width:100%;
    height:6px;
    border-radius:99px;
    background:var(--line-2);
    overflow:hidden;
  }
  .town-bar .fill{
    height:100%;
    border-radius:99px;
    background:linear-gradient(90deg,var(--orange),var(--orange-2));
  }
  .town-pct{
    font-size:12.5px;
    font-weight:850;
    color:var(--ink);
    letter-spacing:-.02em;
    font-variant-numeric:tabular-nums;
    line-height:1;
  }

  /* ============ EMPTY ============ */
  .empty-note{
    font-size:12.5px;
    color:var(--faint);
    text-align:center;
    padding:18px 14px;
    border:1.5px dashed #DCE0E6;
    border-radius:11px;
    background:#FAFBFC;
    line-height:1.5;
  }
  .empty-note b{color:var(--ink-2);font-weight:750}

  /* ============ BLOCKED ============ */
  .blocked-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:22px 18px;
    text-align:center;
    box-shadow:0 1px 2px rgba(20,20,25,.03);
  }
  .blocked-card h2{
    margin:0 0 8px;
    font-size:18px;font-weight:800;
    letter-spacing:-.02em;
    color:var(--ink);
  }
  .blocked-card p{
    margin:0 0 16px;
    font-size:13.5px;
    line-height:1.55;
    color:var(--muted);
  }
  .blocked-card a{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:100%;
    height:48px;
    border-radius:12px;
    font-size:14.5px;
    font-weight:750;
    text-decoration:none;
    margin-top:8px;
    background:linear-gradient(145deg,var(--orange-2),var(--orange));
    color:#fff;
    box-shadow:0 6px 18px -6px rgba(255,90,31,.5);
  }

  /* ============ TOAST ============ */
  .toast{
    position:fixed;left:50%;z-index:200;
    bottom:calc(28px + env(safe-area-inset-bottom));
    transform:translate(-50%,10px);
    background:var(--ink);color:#fff;
    font-size:13.5px;font-weight:650;
    padding:12px 18px;border-radius:999px;
    max-width:88vw;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    opacity:0;pointer-events:none;
    transition:opacity .2s ease,transform .2s ease;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
/* ---- T08b standard header ---- */
#hdr{height:58px;box-sizing:border-box;flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:0 14px;padding-top:env(safe-area-inset-top);background:#fff;border-bottom:1px solid #ece7db;position:sticky;top:0;z-index:58}
.brand-mark{height:34px;width:auto;aspect-ratio:1172/504;flex:0 0 auto;display:flex;align-items:center;justify-content:flex-start;background:none;border:0;border-radius:0;box-shadow:none;overflow:hidden;padding:0;margin:0;cursor:pointer}
.brand-mark img{width:100%;height:100%;object-fit:contain;display:block}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:0}
/* the progress strip that used to sit inside the dark bar */
#hdr + .progress,#hdr + .progress-row{background:#fff;border-bottom:1px solid #ece7db;padding:9px 14px 10px}
#hdr + .progress .progress-label,#hdr + .progress-row span{color:#8a7d64}
#hdr + .progress .progress-count,#hdr + .progress-row strong{color:#c84513}
#hdr + .progress .progress-track{background:#ece7db}

  /* ============ VENUE INTEREST ============ */
  .interest-source{
    font-size:10.5px;font-weight:750;letter-spacing:.06em;text-transform:uppercase;
    color:var(--faint);text-align:right;margin:-2px 0 8px;
  }
  .interest-source.live{color:var(--green)}
  .interest-item{padding:12px 0;border-bottom:1px solid var(--line-2)}
  .interest-item:last-child{border-bottom:0;padding-bottom:0}
  .interest-item:first-child{padding-top:0}
  .interest-item .town-row{padding:0;border:0}
  .interest-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
  .interest-pill{
    font-size:10.5px;font-weight:700;color:var(--muted);background:#F4F1EA;
    border-radius:999px;padding:4px 8px;line-height:1;
  }
  .interest-details{margin-top:8px}
  .interest-details summary{
    font-size:11.5px;font-weight:750;color:var(--orange);cursor:pointer;list-style:none;
  }
  .interest-details summary::-webkit-details-marker{display:none}
  .interest-details summary:before{content:"+ ";font-weight:850}
  .interest-details[open] summary:before{content:"– "}
  .interest-body{
    margin-top:8px;font-size:11.5px;line-height:1.55;color:var(--muted);
    display:grid;gap:4px;
  }
  .interest-body b{color:var(--ink-2);font-weight:750}
  .interest-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
  .interest-btn{
    border:1px solid var(--line);background:#fff;color:var(--ink-2);
    font:inherit;font-size:11px;font-weight:750;border-radius:9px;
    padding:7px 10px;cursor:pointer;
  }
  .interest-btn.primary{background:var(--orange);border-color:var(--orange);color:#fff}
  .interest-btn:disabled{opacity:.5;cursor:wait}
</style>
</head>
<body data-page="eatouts-platform-analytics">
<div id="shell">

  <header id="hdr">
    <button class="brand-mark" type="button" aria-label="EatOuts home" data-act="backHistory"><img src="assets/logo/EatOuts_Logo.png" alt="EatOuts"></button></header>
  <div class="progress">
      <div class="progress-top">
        <span class="progress-label">Platform metrics</span>
        <span class="progress-count" id="progressCount">—</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

  <div class="scroll" id="scroll">
    <section class="intro" id="intro">
      <h1>Platform <em>analytics</em>.</h1>
      <p>Cross-platform order volume, GMV, towns and growth at a glance.</p>
    </section>
    <main class="sheet" id="app"></main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script src="js/eatouts-manager-db.js"></script>
<script src="assets/data/demo/the-food-place/demo-data.js"></script>
<script src="js/eatouts-manager-seed.js"></script>
<script src="js/eatouts-roles.js"></script>
<script src="js/eatouts-users.js"></script>
<script src="js/eatouts-feedback.js"></script>
<script src="js/eatouts-blog-admin.js"></script>
<script src="js/eatouts-auth.js"></script>
<script src="js/eatouts-analytics.js"></script>
<script src="js/eatouts-manager.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {

  /* ---- Auth guard (unchanged) ---- */
  if (!EO.guard({"roles": ["platform_admin", "platform_analyst"]})) return;

  /* ============================================================
     HELPERS
     ============================================================ */
  function esc(v){
    return String(v == null ? "" : v)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }
  function escapeAttr(v){ return esc(v).replace(/`/g,"&#96;"); }
  function cssEscape(s){ return String(s).replace(/["\\]/g, '\\$&'); }

  var toastEl = document.getElementById("toast");
  var toastTimer = null;
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove("show"); }, 2000);
  }

  /* Only one accordion open at a time; null = all closed */
  var OPEN = null;

  /* ============================================================
     DATA
     ============================================================ */
  var d        = EatoutsMgrDB.get();
  var orders   = Array.isArray(d.orders) ? d.orders : [];
  var bizList  = Array.isArray(d.businesses) ? d.businesses : [];
  var gmv      = EatoutsAnalytics.sumMoney(orders, 'total');
  var avgOrder = orders.length ? gmv / orders.length : 0;

  /* Businesses grouped by town */
  var townCounts = {};
  bizList.forEach(function(b){
    var t = (b && b.town) ? String(b.town) : "Unspecified";
    townCounts[t] = (townCounts[t] || 0) + 1;
  });
  var townEntries = Object.entries(townCounts)
    .sort(function(a,b){ return b[1] - a[1]; });

  /* Orders grouped by town via business lookup */
  var bizById = {};
  bizList.forEach(function(b){ if (b && b.id) bizById[String(b.id)] = b; });

  /* Cross-device venue interest. The server report is used when this browser
     has an admin session cookie; otherwise the section falls back to the
     local analytics buffer and says so. */
  var interest = { loading: true, source: 'server', data: null };

  var orderByTown = {};
  var revenueByTown = {};
  orders.forEach(function(o){
    var bizId = o.businessId || o.bizId;
    var b = bizId ? bizById[String(bizId)] : null;
    var town = (b && b.town) ? String(b.town) : "Unspecified";
    orderByTown[town]   = (orderByTown[town]   || 0) + 1;
    revenueByTown[town] = (revenueByTown[town] || 0) + Number(o.total || 0);
  });
  var topTownsByOrders = Object.entries(orderByTown)
    .sort(function(a,b){ return b[1] - a[1]; });

  var topTownsByRevenue = Object.entries(revenueByTown)
    .sort(function(a,b){ return b[1] - a[1]; });

  /* ============================================================
     SECTION SUBTITLES
     ============================================================ */
  function overviewSub(){
    return orders.length + " order" + (orders.length === 1 ? "" : "s") +
           " · " + esc(EO.money(gmv));
  }
  function townsSub(){
    var n = townEntries.length;
    return n + " town" + (n === 1 ? "" : "s") + " with businesses";
  }
  function ordersByTownSub(){
    var n = topTownsByOrders.length;
    if (!n) return "No orders yet";
    return "Top: " + topTownsByOrders[0][0] + " (" + topTownsByOrders[0][1] + ")";
  }
  function revenueByTownSub(){
    var n = topTownsByRevenue.length;
    if (!n) return "No revenue yet";
    return "Top: " + topTownsByRevenue[0][0] + " (" + esc(EO.money(topTownsByRevenue[0][1])) + ")";
  }

  /* ============================================================
     MODULE HTML
     ============================================================ */
  function overviewModule(){
    return '<div class="module">' +
      '<div class="metric-grid">' +
        '<div class="metric"><b>' + orders.length + '</b><span>Order volume</span></div>' +
        '<div class="metric"><b>' + esc(EO.money(gmv)) + '</b><span>GMV</span></div>' +
        '<div class="metric"><b>' + bizList.length + '</b><span>Businesses</span></div>' +
        '<div class="metric"><b>' + esc(EO.money(avgOrder)) + '</b><span>Avg order</span></div>' +
      '</div>' +
    '</div>';
  }

  function townsModule(){
    if (!townEntries.length){
      return '<div class="module"><div class="empty-note">No businesses registered yet.</div></div>';
    }
    var total = bizList.length || 1;
    return '<div class="module">' +
      townEntries.map(function(pair){
        var name = pair[0], count = pair[1];
        var pct = Math.round((count / total) * 100);
        return '<div class="town-row">' +
          '<div class="town-info">' +
            '<b>' + esc(name) + '</b>' +
            '<span>' + count + ' business' + (count === 1 ? "" : "es") + '</span>' +
          '</div>' +
          '<div class="town-bar-wrap">' +

  /* ============================================================
     VENUE INTEREST
     ============================================================ */
  function interestSub(){
    if (interest.loading) return "Loading cross-device report";
    var t = (interest.data && interest.data.totals) || {};
    var suffix = interest.source === "server" ? "" : " · this device only";
    return (t.people || 0) + " people · " + (t.taps || 0) + " taps" + suffix;
  }

  function interestSourceNote(){
    if (interest.loading) return "";
    if (interest.source === "server") {
      return '<div class="interest-source live">Cross-device report</div>';
    }
    return '<div class="interest-source">This device only · sign in with a server admin session for all devices</div>';
  }

  function interestMetric(value, label){
    return '<div class="metric"><b>' + esc(value) + '</b><span>' + esc(label) + '</span></div>';
  }

  function interestBreakdown(obj){
    var entries = Object.entries(obj || {}).sort(function(a,b){ return b[1] - a[1]; });
    if (!entries.length) return "No data yet";
    return entries.map(function(p){ return String(p[0]) + " " + p[1]; }).join(" · ");
  }

  function interestTop(obj){
    var entries = Object.entries(obj || {}).sort(function(a,b){ return b[1] - a[1]; });
    return entries.length ? entries[0][0] : "";
  }

  function interestShortTime(ms){
    try {
      return new Date(Number(ms)).toLocaleString(undefined, {
        day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"
      });
    } catch (e) { return ""; }
  }

  function interestShortDate(ms){
    try {
      return new Date(Number(ms)).toLocaleDateString(undefined, {
        day:"numeric", month:"short", year:"numeric"
      });
    } catch (e) { return ""; }
  }

  function interestPitch(v){
    var people = Number(v.people) || 0;
    var taps = Number(v.taps) || 0;
    var repeatPeople = Number(v.repeatPeople) || 0;
    var repeatTaps = Number(v.repeatTaps) || 0;
    var users = Number(v.users) || 0;
    var browsers = Number(v.browsers) || 0;
    var period = v.firstAt ? ("since " + interestShortDate(v.firstAt)) : "recently";
    var repeat = repeatPeople
      ? (repeatPeople + " people came back more than once (" + repeatTaps + " extra taps)")
      : "No repeat taps yet";
    var topTown = interestTop(v.towns);
    var topAge = interestTop(v.ageBands);
    return "Hi " + (v.venueName || "there") + ", " + people +
      " people on EatOuts tapped to order from you " + period + ". " + taps +
      " taps in total; " + repeat + ". " + users + " signed-in customers and " +
      browsers + " browsers showed interest" +
      (topTown ? " — most from " + topTown : "") +
      (topAge ? ", mostly aged " + topAge : "") +
      ". Join EatOuts to turn that demand into direct orders.";
  }

  function interestBrowserBreakdown(b){
    if (!b) return "No browser signals yet";
    var bits = [];
    if (b.family && Object.keys(b.family).length) bits.push("Browser " + interestBreakdown(b.family));
    if (b.os && Object.keys(b.os).length) bits.push("OS " + interestBreakdown(b.os));
    if (b.device && Object.keys(b.device).length) bits.push("Device " + interestBreakdown(b.device));
    if (b.language && Object.keys(b.language).length) bits.push("Language " + interestBreakdown(b.language));
    if (b.timezone && Object.keys(b.timezone).length) bits.push("Time " + interestBreakdown(b.timezone));
    if (b.screen && Object.keys(b.screen).length) bits.push("Screen " + interestBreakdown(b.screen));
    return bits.length ? bits.join(" · ") : "No browser signals yet";
  }

  function interestVenue(v, max){
    var people = Number(v.people) || 0;
    var taps = Number(v.taps) || 0;
    var repeatPeople = Number(v.repeatPeople) || 0;
    var repeatTaps = Number(v.repeatTaps) || 0;
    var users = Number(v.users) || 0;
    var browsers = Number(v.browsers) || 0;
    var pct = Math.round((people / (max || 1)) * 100);
    var meta = [taps + " taps"];
    if (repeatPeople) meta.push(repeatPeople + " repeat people");
    if (repeatTaps) meta.push(repeatTaps + " extra taps");
    meta.push(users + " signed in");
    meta.push(browsers + " browsers");
    var when = [];
    if (v.firstAt) when.push("First " + interestShortTime(v.firstAt));
    if (v.lastAt) when.push("Last " + interestShortTime(v.lastAt));
    var status = v.participating
      ? (v.claimed ? "Claimed · participating" : "Participating")
      : "Not participating";
    var toggle = interest.source !== "server"
      ? '<button class="interest-btn" type="button" disabled>Sign in to manage</button>'
      : (v.claimed
        ? '<button class="interest-btn" type="button" disabled>Claimed · always participating</button>'
        : '<button class="interest-btn primary" type="button" data-act="interestToggle" data-venue-id="' +
          escapeAttr(v.venueId) + '" data-next="' + (v.participating ? "0" : "1") + '">' +
          (v.participating ? "Mark not participating" : "Mark participating") + '</button>');

    return '<div class="interest-item">' +
      '<div class="town-row">' +
        '<div class="town-info">' +
          '<b>' + esc(v.venueName || v.venueId) + '</b>' +
          '<span>' + people + ' ' + (people === 1 ? "person" : "people") + ' · ' +
            esc(v.venueTown || "Town unknown") + '</span>' +
          '<span>' + esc(meta.join(" · ")) + '</span>' +
          (when.length ? '<span>' + esc(when.join(" · ")) + '</span>' : '') +
        '</div>' +
        '<div class="town-bar-wrap">' +
          '<span class="town-pct">' + people + '</span>' +
          '<div class="town-bar"><div class="fill" style="width:' + pct + '%"></div></div>' +
        '</div>' +
      '</div>' +
      '<div class="interest-meta">' +
        '<span class="interest-pill">' + esc(status) + '</span>' +
        '<span class="interest-pill">' + (Number(v.today) || 0) + ' today</span>' +
        '<span class="interest-pill">' + (Number(v.last7) || 0) + ' in 7 days</span>' +
      '</div>' +
      '<details class="interest-details">' +
        '<summary>Breakdown & pitch</summary>' +
        '<div class="interest-body">' +
          '<div><b>Gender:</b> ' + esc(interestBreakdown(v.gender)) + '</div>' +
          '<div><b>Age:</b> ' + esc(interestBreakdown(v.ageBands)) + '</div>' +
          '<div><b>Towns:</b> ' + esc(interestBreakdown(v.towns)) + '</div>' +
          '<div><b>Areas:</b> ' + esc(interestBreakdown(v.areas)) + '</div>' +
          '<div><b>Browsers:</b> ' + esc(interestBrowserBreakdown(v.browser)) + '</div>' +
          '<div><b>First:</b> ' + (v.firstAt ? esc(interestShortTime(v.firstAt)) : "—") +
            ' · <b>Last:</b> ' + (v.lastAt ? esc(interestShortTime(v.lastAt)) : "—") + '</div>' +
        '</div>' +
        '<div class="interest-actions">' +
          toggle +
          '<button class="interest-btn" type="button" data-act="interestPitch" data-venue-id="' +
            escapeAttr(v.venueId) + '">Copy pitch</button>' +
        '</div>' +
      '</details>' +
    '</div>';
  }

  function interestModule(){
    if (interest.loading) {
      return '<div class="module"><div class="empty-note">Loading venue interest…</div></div>';
    }
    var data = interest.data || {};
    var totals = data.totals || {};
    var venues = Array.isArray(data.venues) ? data.venues : [];
    if (!venues.length) {
      return '<div class="module">' + interestSourceNote() +
        '<div class="empty-note">No venue interest recorded yet. When someone taps to order from a venue that is not participating, it will show here.</div>' +
      '</div>';
    }
    var max = Number(venues[0].people) || 1;
    return '<div class="module">' +
      interestSourceNote() +
      '<div class="metric-grid">' +
        interestMetric(totals.people || 0, "People") +
        interestMetric(totals.taps || 0, "Taps") +
        interestMetric(totals.repeatPeople || 0, "Repeat people") +
        interestMetric(totals.repeatTaps || 0, "Extra taps") +
        interestMetric(totals.users || 0, "Signed in") +
        interestMetric(totals.browsers || 0, "Browsers") +
      '</div>' +
      venues.map(function(v){ return interestVenue(v, max); }).join("") +
    '</div>';
  }

  function interestIncrement(obj, key){
    var k = key || "Unknown";
    obj[k] = (obj[k] || 0) + 1;
  }

  function interestParseBrowser(raw){
    if (!raw) return {};
    if (typeof raw === "object") return raw;
    try {
      var parsed = JSON.parse(String(raw));
      return parsed && typeof parsed === "object" ? parsed : {};
    } catch (e) { return {}; }
  }

  function interestBrowserBuckets(){
    return { family:{}, os:{}, device:{}, language:{}, timezone:{}, screen:{} };
  }

  function interestAggregate(rows){
    var list = Array.isArray(rows) ? rows : [];
    var current = Date.now();
    var todayStart = new Date(current);
    todayStart.setHours(0,0,0,0);
    var todayMs = todayStart.getTime();
    var weekMs = current - 7 * 24 * 60 * 60 * 1000;
    var venues = {};
    var globalPeople = {};
    var globalPersonTaps = {};
    var globalLatest = {};
    var totals = {
      people:0, taps:0, repeatPeople:0, repeatTaps:0,
      users:0, browsers:0, firstAt:null, lastAt:null, today:0, last7:0
    };

    list.forEach(function(r){
      var at = Number(r.at) || 0;
      var vid = String(r.venue_id || "unknown");
      var pk = String(r.person_key || "unknown");
      var v = venues[vid];
      if (!v) {
        var status = String(r.current_status || r.venue_status || "");
        var claimed = !!(Number(r.current_claimed) || String(r.current_claimed) === "true" ||
          status.toLowerCase() === "claimed");
        v = venues[vid] = {
          venueId: vid,
          venueName: r.venue_name || vid,
          venueTown: r.venue_town || "",
          venueArea: r.venue_area || "",
          venueStatus: status,
          participating: !!(Number(r.current_participating) || String(r.current_participating) === "true" ||
            claimed || status.toLowerCase() === "claimed"),
          claimed: claimed,
          people:{}, personTaps:{}, taps:0, firstAt:null, lastAt:null,
          today:0, last7:0, users:0, browsers:0,
          gender:{}, ageBands:{}, towns:{}, areas:{},
          browser:interestBrowserBuckets(), latest:{}
        };
      }

      v.taps++;
      v.personTaps[pk] = (v.personTaps[pk] || 0) + 1;
      v.people[pk] = true;
      if (!v.firstAt || at < v.firstAt) v.firstAt = at;
      if (!v.lastAt || at > v.lastAt) v.lastAt = at;
      if (at >= todayMs) v.today++;
      if (at >= weekMs) v.last7++;
      if (!v.latest[pk] || at > v.latest[pk].at) v.latest[pk] = { row:r, at:at };

      globalPeople[pk] = true;
      globalPersonTaps[pk] = (globalPersonTaps[pk] || 0) + 1;
      totals.taps++;
      if (!totals.firstAt || at < totals.firstAt) totals.firstAt = at;
      if (!totals.lastAt || at > totals.lastAt) totals.lastAt = at;
      if (at >= todayMs) totals.today++;
      if (at >= weekMs) totals.last7++;
      if (!globalLatest[pk] || at > globalLatest[pk].at) globalLatest[pk] = { row:r, at:at };
    });

    Object.keys(venues).forEach(function(key){
      var v = venues[key];
      v.people = Object.keys(v.people).length;
      var repeatPeople = 0;
      Object.keys(v.personTaps).forEach(function(pk){
        if (v.personTaps[pk] > 1) repeatPeople++;
      });
      v.repeatPeople = repeatPeople;
      v.repeatTaps = v.taps - v.people;

      Object.keys(v.latest).forEach(function(pk){
        var row = v.latest[pk].row;
        if (String(row.user_type) === "user") v.users++;
        else v.browsers++;
        interestIncrement(v.gender, row.gender || "Unknown");
        interestIncrement(v.ageBands, row.age_band || "Unknown");
        interestIncrement(v.towns, row.town || "Unknown");
        interestIncrement(v.areas, row.area || "Unknown");
        if (String(row.user_type) !== "user") {
          var b = interestParseBrowser(row.browser_json);
          interestIncrement(v.browser.family, b.browser || "Other");
          interestIncrement(v.browser.os, b.os || "Other");
          interestIncrement(v.browser.device, b.device || "Other");
          interestIncrement(v.browser.language, b.language || "Unknown");
          interestIncrement(v.browser.timezone, b.timezone || "Unknown");
          interestIncrement(v.browser.screen, b.screen || "Unknown");
        }
      });

      delete v.personTaps;
      delete v.latest;
    });

    totals.people = Object.keys(globalPeople).length;
    Object.keys(globalPersonTaps).forEach(function(pk){
      if (globalPersonTaps[pk] > 1) totals.repeatPeople++;
    });
    totals.repeatTaps = totals.taps - totals.people;
    Object.keys(globalLatest).forEach(function(pk){
      if (String(globalLatest[pk].row.user_type) === "user") totals.users++;
      else totals.browsers++;
    });

    var venueList = Object.keys(venues).map(function(key){ return venues[key]; })
      .sort(function(a,b){
        if (b.people !== a.people) return b.people - a.people;
        if (b.taps !== a.taps) return b.taps - a.taps;
        return String(a.venueName).localeCompare(String(b.venueName));
      });

    return { totals:totals, venues:venueList };
  }

  function localInterest(){
    var list = [];
    try { list = EatoutsAnalytics.all ? EatoutsAnalytics.all() : []; } catch (e) { list = []; }
    var rows = (Array.isArray(list) ? list : []).filter(function(e){
      return e && e.eventName === "venue.interest";
    }).map(function(e){
      var p = e.properties || {};
      return {
        venue_id: String(p.venueId || p.venueSlug || "unknown"),
        venue_name: String(p.venueName || p.venueId || "Unknown venue"),
        venue_town: String(p.venueTown || ""),
        venue_area: String(p.venueArea || ""),
        venue_status: String(p.venueStatus || ""),
        person_key: String(p.personKey || e.userId || "unknown"),
        user_type: String(p.userType || (e.userId ? "user" : "browser")),
        gender: String(p.gender || ""),
        age_band: String(p.ageBand || ""),
        town: String(p.town || ""),
        area: String(p.area || ""),
        browser_json: p.browser ? JSON.stringify(p.browser) : "",
        at: Date.parse(e.at) || 0,
        current_status: String(p.venueStatus || ""),
        current_claimed: 0,
        current_participating: p.participating ? 1 : 0
      };
    });
    return interestAggregate(rows);
  }

  function loadInterest(){
    if (typeof fetch !== "function") {
      interest.data = localInterest();
      interest.source = "local";
      interest.loading = false;
      render();
      return;
    }
    fetch("/api/venue-interest", { credentials:"same-origin", headers:{ accept:"application/json" } })
      .then(function(r){
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function(j){
        if (!j || !j.ok) throw new Error((j && j.error) || "bad payload");
        interest.data = {
          totals: j.totals || {},
          venues: Array.isArray(j.venues) ? j.venues : []
        };
        interest.source = "server";
      })
      .catch(function(){
        interest.data = localInterest();
        interest.source = "local";
      })
      .then(function(){
        interest.loading = false;
        render();
      });
  }

  function interestCopyText(text){
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text);
    }
    return new Promise(function(resolve, reject){
      try {
        var ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        var ok = document.execCommand("copy");
        document.body.removeChild(ta);
        if (ok) resolve(); else reject(new Error("Copy failed"));
      } catch (e) { reject(e); }
    });
  }

  function interestCopyPitch(venueId){
    var list = (interest.data && interest.data.venues) || [];
    var v = null;
    for (var i = 0; i < list.length; i++) {
      if (String(list[i].venueId) === String(venueId)) { v = list[i]; break; }
    }
    if (!v) return;
    interestCopyText(interestPitch(v)).then(function(){
      toast("Pitch copied.");
    }, function(){
      toast("Copy failed.");
    });
  }

  function interestToggle(venueId, next, btn){
    if (interest.source !== "server") {
      toast("Open this page with a server admin session to change participation.");
      return;
    }
    if (btn) btn.disabled = true;
    fetch("/api/venue-interest", {
      method:"PATCH",
      credentials:"same-origin",
      headers:{ "content-type":"application/json" },
      body:JSON.stringify({ venueId:venueId, participating:!!next })
    }).then(function(r){
      return r.json().then(function(j){ return { ok:r.ok, j:j }; });
    }).then(function(x){
      if (!x.ok || !x.j || !x.j.ok) {
        throw new Error((x.j && x.j.error) || "Could not update venue.");
      }
      var list = (interest.data && interest.data.venues) || [];
      for (var i = 0; i < list.length; i++) {
        if (String(list[i].venueId) === String(venueId)) {
          list[i].participating = !!next;
          if (x.j && typeof x.j.claimed === "boolean") list[i].claimed = x.j.claimed;
          break;
        }
      }
      render();
      toast(next ? "Venue marked participating." : "Venue marked not participating.");
    }).catch(function(e){
      if (btn) btn.disabled = false;
      toast((e && e.message) || "Could not update venue.");
    });
  }

  /* ============================================================
     ACCORDION BUILDER
     ============================================================ */
  function section(key, letter, title, sub, body){
    var isOpen = OPEN === key;
    var cls = 'acc' + (isOpen ? ' open' : '');
    return '<section class="' + cls + '" data-key="' + escapeAttr(key) + '">' +
      '<button class="acc-head" type="button" aria-expanded="' + (isOpen ? 'true' : 'false') + '">' +
        '<span class="sec-thumb">' + esc(letter) + '</span>' +
        '<span class="acc-title">' +
          '<b>' + esc(title) + '</b>' +
          '<span class="acc-sub">' + esc(sub) + '</span>' +
        '</span>' +
        '<span class="vis-dot off"></span>' +
      '</button>' +
      '<div class="acc-body">' +
        '<div class="acc-inner">' + body + '</div>' +
      '</div>' +
    '</section>';
  }

  /* ============================================================
     META CARD + PROGRESS
     ============================================================ */
  function renderMeta(){
    var dotClass = "green";
    var msg = "<b>" + orders.length + "</b> order" + (orders.length === 1 ? "" : "s") +
              " · <b>" + esc(EO.money(gmv)) + "</b> GMV";
    if (!orders.length){
      dotClass = "warn";
      msg = "No orders recorded yet";
    }

    return '<div class="meta-card">' +
      '<div class="meta-row">' +
        '<span class="meta-dot ' + dotClass + '"></span>' +
        '<span class="meta-text">' + msg + '</span>' +
      '</div>' +
      '<div class="meta-stats">' +
        '<div class="stat"><b>' + orders.length + '</b><span>Orders</span></div>' +
        '<div class="stat"><b>' + bizList.length + '</b><span>Businesses</span></div>' +
        '<div class="stat"><b>' + townEntries.length + '</b><span>Towns</span></div>' +
      '</div>' +
    '</div>';
  }

  function updateProgress(){
    /* Progress = share of sections that have data */
    var sections = 5;
    var filled = 0;
    if (orders.length) filled++;
    if (bizList.length) filled++;
    if (townEntries.length) filled++;
    if (gmv > 0) filled++;
    if (interest.data && interest.data.totals && interest.data.totals.taps > 0) filled++;
    var pct = Math.round((filled / sections) * 100);
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('progressCount').textContent =
      filled + ' of ' + sections + ' datasets populated';
  }

  /* ============================================================
     RENDER
     ============================================================ */
  var mount = document.getElementById('app');

  function render(){
    mount.innerHTML =
      renderMeta() +
      '<div class="stack">' +
        section('overview',        '1', 'Overview',              overviewSub(),       overviewModule()) +
        section('towns',           '2', 'Businesses by town',    townsSub(),          townsModule()) +
        section('ordersByTown',    '3', 'Orders by town',        ordersByTownSub(),   ordersByTownModule()) +
        section('revenueByTown',   '4', 'Revenue by town',       revenueByTownSub(),  revenueByTownModule()) +
        section('venueInterest',   '5', 'Venue interest',        interestSub(),       interestModule()) +
      '</div>';

    updateProgress();
  }

  /* ============================================================
     ACCORDION BEHAVIOUR — only one open at a time
     ============================================================ */
  function toggleAccordion(key){
    OPEN = (OPEN === key) ? null : key;
    var accs = mount.querySelectorAll('.acc');
    for (var i = 0; i < accs.length; i++){
      var acc = accs[i];
      var isOpen = acc.getAttribute('data-key') === OPEN;
      acc.classList.toggle('open', isOpen);
      var head = acc.querySelector('.acc-head');
      if (head) head.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    }
    if (OPEN){
      var opened = mount.querySelector('.acc[data-key="' + cssEscape(OPEN) + '"]');
      if (opened){
        setTimeout(function(){
          try { opened.scrollIntoView({ behavior:'smooth', block:'start' }); } catch (e) {}
        }, 320);
      }
    }
  }

  /* ============================================================
     DELEGATED CLICKS
     ============================================================ */
  mount.addEventListener('click', function(e){
    var action = e.target.closest('[data-act]');
    if (action){
      var act = action.getAttribute('data-act');
      if (act === 'interestToggle'){
        interestToggle(action.getAttribute('data-venue-id'), action.getAttribute('data-next') === '1', action);
        return;
      }
      if (act === 'interestPitch'){
        interestCopyPitch(action.getAttribute('data-venue-id'));
        return;
      }
    }
    var head = e.target.closest('.acc-head');
    if (head){
      var acc = head.closest('.acc');
      if (acc) toggleAccordion(acc.getAttribute('data-key'));
    }
  });

  /* ============================================================
     BOOT
     ============================================================ */
  render();
  loadInterest();
});
</script>
