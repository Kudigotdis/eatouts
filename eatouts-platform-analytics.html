<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#ffffff"><title>Platform analytics · EatOuts</title><link rel="stylesheet" href="assets/eatouts-manager.css"></head><body><div id="mount"></div><script src="js/eatouts-manager-db.js"></script><script src="js/eatouts-roles.js"></script><script src="js/eatouts-users.js"></script><script src="js/eatouts-feedback.js"></script><script src="js/eatouts-blog-admin.js"></script><script src="js/eatouts-auth.js"></script><script src="js/eatouts-manager.js"></script><script>document.addEventListener("DOMContentLoaded",()=>{if(!EO.guard({"roles": ["platform_admin", "platform_analyst"]}))return;document.querySelector("#mount").innerHTML=EO.shell("Platform analytics","Cross-platform order volume, GMV, towns and growth",`<div class="grid3" id="m"></div><div class="card"><div class="card-title">Businesses by town</div><div id="towns"></div></div>`,{section:"Platform analytics"});
const d=EatoutsMgrDB.get(),g=d.orders.reduce((s,x)=>s+x.total,0),town={};d.businesses.forEach(b=>town[b.town]=(town[b.town]||0)+1);document.querySelector("#m").innerHTML=EO.metric("Order volume",d.orders.length,"all time")+EO.metric("GMV",EO.money(g),"gross merchandise value")+EO.metric("Businesses",d.businesses.length,"registered");document.querySelector("#towns").innerHTML=Object.entries(town).map(([k,v])=>`<div class="listrow"><div class="listmain"><strong>${EO.esc(k)}</strong><small>${v} businesses</small></div><strong>${Math.round(v/d.businesses.length*100)}%</strong></div>`).join("");});</script></body></html>
