<!doctype html>
<!-- PAGE: Platform analytics -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#141418">
<title>Platform analytics · EatOuts</title>
<style>
::-webkit-scrollbar{width:0;height:0;display:none}
*{scrollbar-width:none;-ms-overflow-style:none}

  *,*::before,*::after{box-sizing:border-box}
  :root{
    --ink:#0F0F12;
    --ink-2:#2A2A30;
    --ink-3:#4A4A52;
    --paper:#F4F5F7;
    --card:#FFFFFF;
    --line:#E6E8EC;
    --line-2:#F0F1F4;
    --orange:#FF5A1F;
    --orange-2:#FF7A42;
    --orange-soft:#FFEDE4;
    --orange-line:#FFD5C2;
    --green:#16A34A;
    --green-soft:#E7F7EE;
    --red:#DC2626;
    --red-soft:#FEE2E2;
    --amber:#B45309;
    --amber-soft:#FEF3C7;
    --blue:#0284C7;
    --blue-soft:#E0F2FE;
    --muted:#6B7280;
    --faint:#9AA1AC;
  }
  html,body{height:100%}
  body{
    margin:0;
    background:#E9EBEF;
    color:var(--ink);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:15px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;
    display:flex;
    justify-content:center;
  }
  button,input,select,textarea{font-family:inherit}
  button{cursor:pointer}

  #shell{
    width:100%;
    max-width:460px;
    height:100vh;
    height:100dvh;
    background:var(--paper);
    display:flex;
    flex-direction:column;
    overflow:hidden;
    position:relative;
    box-shadow:0 0 70px rgba(20,20,25,.16);
  }

  /* ============ TOPBAR ============ */
  .topbar{
    flex:0 0 auto;
    background:#141418;
    padding:calc(13px + env(safe-area-inset-top)) 18px 14px;
    position:relative;
    z-index:10;
  }
  .topbar-row{
    display:flex;align-items:center;gap:10px;
    padding-bottom:13px;
  }
  .brand{
    display:inline-flex;align-items:center;gap:9px;
    text-decoration:none;
  }
  .brand .mark{
    width:28px;height:28px;flex:0 0 auto;border-radius:8px;
    background:linear-gradient(145deg,var(--orange-2),var(--orange));
    color:#fff;
    display:grid;place-items:center;
    font-size:14px;font-weight:900;letter-spacing:-.03em;
    box-shadow:0 2px 10px rgba(255,90,31,.35);
  }
  .brand .word{
    color:#fff;font-size:15px;font-weight:800;
    letter-spacing:-.02em;
  }
  .hdr-chip{
    margin-left:auto;
    font-size:10px;font-weight:800;
    letter-spacing:.12em;text-transform:uppercase;
    color:var(--orange-2);
    border:1px solid rgba(255,122,66,.32);
    background:rgba(255,90,31,.1);
    border-radius:999px;
    padding:5px 11px;
    white-space:nowrap;
  }

  .progress{padding-bottom:2px}
  .progress-top{
    display:flex;align-items:baseline;justify-content:space-between;
    gap:10px;margin-bottom:8px;
  }
  .progress-label{
    font-size:11px;font-weight:800;
    letter-spacing:.14em;text-transform:uppercase;
    color:rgba(255,255,255,.5);
  }
  .progress-count{
    font-size:11.5px;font-weight:800;
    color:var(--orange-2);
    letter-spacing:.02em;
  }
  .progress-track{
    height:5px;border-radius:99px;
    background:rgba(255,255,255,.13);
    overflow:hidden;
  }
  .progress-fill{
    height:100%;width:0%;
    border-radius:99px;
    background:linear-gradient(90deg,var(--orange),var(--orange-2));
    transition:width .35s cubic-bezier(.4,0,.2,1);
  }

  /* ============ SCROLL ============ */
  .scroll{
    flex:1 1 auto;min-height:0;
    overflow-y:auto;
    overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
    scrollbar-width:none;
  }
  .scroll::-webkit-scrollbar{display:none}

  /* ============ INTRO ============ */
  .intro{
    background:linear-gradient(175deg,#141418 0%,#1B1B21 60%,#232329 100%);
    padding:4px 22px 46px;
    position:relative;
    overflow:hidden;
    text-align:center;
  }
  .intro::after{
    content:"";
    position:absolute;
    top:-80px;right:-80px;
    width:230px;height:230px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,90,31,.2),transparent 68%);
    pointer-events:none;
  }
  .intro h1{
    position:relative;
    margin:0 auto 12px;
    font-size:26px;
    line-height:1.15;
    font-weight:800;
    letter-spacing:-.03em;
    color:#fff;
    max-width:15ch;
  }
  .intro h1 em{font-style:normal;color:var(--orange-2)}
  .intro p{
    position:relative;
    margin:0 auto;
    font-size:14px;
    line-height:1.6;
    color:rgba(255,255,255,.6);
    max-width:32ch;
  }

  /* ============ SHEET ============ */
  .sheet{
    position:relative;
    z-index:1;
    margin-top:-26px;
    background:var(--paper);
    border-radius:26px 26px 0 0;
    padding:20px 14px 30px;
    min-height:60vh;
  }

  /* ============ META CARD ============ */
  .meta-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:15px 16px;
    margin-bottom:12px;
    box-shadow:0 1px 2px rgba(20,20,25,.03);
  }
  .meta-row{
    display:flex;align-items:center;gap:10px;
    margin-bottom:11px;
  }
  .meta-dot{
    width:9px;height:9px;border-radius:50%;flex:0 0 auto;
    background:var(--orange);
    box-shadow:0 0 0 3px var(--orange-soft);
  }
  .meta-dot.green{background:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
  .meta-dot.warn{background:var(--amber);box-shadow:0 0 0 3px var(--amber-soft)}
  .meta-text{
    font-size:13.5px;
    color:var(--ink-2);
    line-height:1.4;
    min-width:0;
    flex:1 1 auto;
  }
  .meta-text b{color:var(--ink);font-weight:750}
  .meta-stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    padding-top:11px;
    border-top:1px solid var(--line-2);
  }
  .stat{text-align:center}
  .stat b{
    display:block;
    font-size:19px;font-weight:850;
    letter-spacing:-.03em;
    color:var(--ink);
    line-height:1.1;
    font-variant-numeric:tabular-nums;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .stat span{
    display:block;
    margin-top:3px;
    font-size:9.5px;font-weight:800;
    letter-spacing:.1em;text-transform:uppercase;
    color:var(--faint);
  }

  /* ============ ACCORDION STACK ============ */
  .stack{display:flex;flex-direction:column;gap:10px}
  .acc{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    overflow:hidden;
    transition:border-color .2s ease,box-shadow .2s ease;
  }
  .acc.open{
    border-color:var(--orange-line);
    box-shadow:0 4px 18px -6px rgba(255,90,31,.22);
  }
  .acc-head{
    width:100%;
    display:flex;align-items:center;gap:12px;
    padding:13px 15px;
    background:transparent;border:0;
    text-align:left;
    -webkit-tap-highlight-color:transparent;
    transition:background .15s;
  }
  .acc-head:active{background:#FAFBFC}

  .sec-thumb{
    width:48px;height:48px;flex:0 0 auto;
    border-radius:11px;
    background:var(--orange-soft);
    color:var(--orange);
    display:grid;place-items:center;
    font-size:17px;font-weight:850;
    letter-spacing:-.02em;
    position:relative;
  }
  .sec-thumb.plain{
    background:#F0F1F4;color:var(--faint);
  }
  .sec-thumb .count{
    position:absolute;
    bottom:3px;right:3px;
    background:rgba(15,15,18,.72);
    color:#fff;
    font-size:9px;
    font-weight:800;
    letter-spacing:.02em;
    padding:1.5px 5px;
    border-radius:4px;
    line-height:1;
  }

  .acc-title{
    flex:1 1 auto;min-width:0;
    display:flex;flex-direction:column;gap:2px;
  }
  .acc-title b{
    font-size:15px;font-weight:750;
    letter-spacing:-.015em;
    color:var(--ink);
    line-height:1.25;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .acc-sub{
    font-size:11.5px;
    color:var(--faint);
    line-height:1.3;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    font-weight:550;
  }

  .vis-dot{
    width:9px;height:9px;border-radius:50%;flex:0 0 auto;
    background:var(--orange);
    box-shadow:0 0 0 3px var(--orange-soft);
  }
  .vis-dot.off{background:#D3D7DE;box-shadow:none}
  .vis-dot.green{background:var(--green);box-shadow:0 0 0 3px var(--green-soft)}

  .acc-body{
    display:grid;
    grid-template-rows:0fr;
    transition:grid-template-rows .32s cubic-bezier(.4,0,.2,1);
  }
  .acc.open .acc-body{grid-template-rows:1fr}
  .acc-inner{overflow:hidden;min-height:0}

  .module{padding:2px 15px 18px}

  /* ============ METRIC GRID ============ */
  .metric-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
  }
  .metric{
    background:#FAFBFC;
    border:1px solid var(--line-2);
    border-radius:12px;
    padding:13px 12px;
    text-align:center;
  }
  .metric b{
    display:block;
    font-size:20px;font-weight:850;
    letter-spacing:-.03em;
    color:var(--ink);
    line-height:1.1;
    font-variant-numeric:tabular-nums;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .metric span{
    display:block;
    margin-top:4px;
    font-size:9.5px;font-weight:800;
    letter-spacing:.09em;text-transform:uppercase;
    color:var(--faint);
    line-height:1.35;
  }

  /* ============ TOWN ROWS ============ */
  .town-row{
    display:flex;align-items:center;gap:12px;
    padding:12px 0;
    border-bottom:1px solid var(--line-2);
  }
  .town-row:last-child{border-bottom:0;padding-bottom:0}
  .town-row:first-child{padding-top:0}
  .town-info{
    flex:1 1 auto;min-width:0;
    display:flex;flex-direction:column;gap:2px;
  }
  .town-info b{
    font-size:13.5px;font-weight:750;
    letter-spacing:-.01em;
    color:var(--ink);
    line-height:1.25;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .town-info span{
    font-size:11.5px;
    color:var(--faint);
    font-weight:550;
    line-height:1.3;
  }
  .town-bar-wrap{
    flex:0 0 90px;
    display:flex;flex-direction:column;align-items:flex-end;gap:5px;
  }
  .town-bar{
    width:100%;
    height:6px;
    border-radius:99px;
    background:var(--line-2);
    overflow:hidden;
  }
  .town-bar .fill{
    height:100%;
    border-radius:99px;
    background:linear-gradient(90deg,var(--orange),var(--orange-2));
  }
  .town-pct{
    font-size:12.5px;
    font-weight:850;
    color:var(--ink);
    letter-spacing:-.02em;
    font-variant-numeric:tabular-nums;
    line-height:1;
  }

  /* ============ EMPTY ============ */
  .empty-note{
    font-size:12.5px;
    color:var(--faint);
    text-align:center;
    padding:18px 14px;
    border:1.5px dashed #DCE0E6;
    border-radius:11px;
    background:#FAFBFC;
    line-height:1.5;
  }
  .empty-note b{color:var(--ink-2);font-weight:750}

  /* ============ BLOCKED ============ */
  .blocked-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:22px 18px;
    text-align:center;
    box-shadow:0 1px 2px rgba(20,20,25,.03);
  }
  .blocked-card h2{
    margin:0 0 8px;
    font-size:18px;font-weight:800;
    letter-spacing:-.02em;
    color:var(--ink);
  }
  .blocked-card p{
    margin:0 0 16px;
    font-size:13.5px;
    line-height:1.55;
    color:var(--muted);
  }
  .blocked-card a{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:100%;
    height:48px;
    border-radius:12px;
    font-size:14.5px;
    font-weight:750;
    text-decoration:none;
    margin-top:8px;
    background:linear-gradient(145deg,var(--orange-2),var(--orange));
    color:#fff;
    box-shadow:0 6px 18px -6px rgba(255,90,31,.5);
  }

  /* ============ TOAST ============ */
  .toast{
    position:fixed;left:50%;z-index:200;
    bottom:calc(28px + env(safe-area-inset-bottom));
    transform:translate(-50%,10px);
    background:var(--ink);color:#fff;
    font-size:13.5px;font-weight:650;
    padding:12px 18px;border-radius:999px;
    max-width:88vw;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    opacity:0;pointer-events:none;
    transition:opacity .2s ease,transform .2s ease;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body data-page="eatouts-platform-analytics">
<div id="shell">

  <header class="topbar">
    <div class="topbar-row">
      <a class="brand" href="index.html">
        <span class="mark">E</span>
        <span class="word">EatOuts</span>
      </a>
      <span class="hdr-chip">Analytics</span>
    </div>
    <div class="progress">
      <div class="progress-top">
        <span class="progress-label">Platform metrics</span>
        <span class="progress-count" id="progressCount">—</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>
  </header>

  <div class="scroll" id="scroll">
    <section class="intro" id="intro">
      <h1>Platform <em>analytics</em>.</h1>
      <p>Cross-platform order volume, GMV, towns and growth at a glance.</p>
    </section>
    <main class="sheet" id="app"></main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script src="js/eatouts-manager-db.js"></script>
<script src="assets/data/demo/the-food-place/demo-data.js"></script>
<script src="js/eatouts-manager-seed.js"></script>
<script src="js/eatouts-roles.js"></script>
<script src="js/eatouts-users.js"></script>
<script src="js/eatouts-feedback.js"></script>
<script src="js/eatouts-blog-admin.js"></script>
<script src="js/eatouts-auth.js"></script>
<script src="js/eatouts-analytics.js"></script>
<script src="js/eatouts-manager.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {

  /* ---- Auth guard (unchanged) ---- */
  if (!EO.guard({"roles": ["platform_admin", "platform_analyst"]})) return;

  /* ============================================================
     HELPERS
     ============================================================ */
  function esc(v){
    return String(v == null ? "" : v)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }
  function escapeAttr(v){ return esc(v).replace(/`/g,"&#96;"); }
  function cssEscape(s){ return String(s).replace(/["\\]/g, '\\$&'); }

  var toastEl = document.getElementById("toast");
  var toastTimer = null;
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove("show"); }, 2000);
  }

  /* Only one accordion open at a time; null = all closed */
  var OPEN = null;

  /* ============================================================
     DATA
     ============================================================ */
  var d        = EatoutsMgrDB.get();
  var orders   = Array.isArray(d.orders) ? d.orders : [];
  var bizList  = Array.isArray(d.businesses) ? d.businesses : [];
  var gmv      = EatoutsAnalytics.sumMoney(orders, 'total');
  var avgOrder = orders.length ? gmv / orders.length : 0;

  /* Businesses grouped by town */
  var townCounts = {};
  bizList.forEach(function(b){
    var t = (b && b.town) ? String(b.town) : "Unspecified";
    townCounts[t] = (townCounts[t] || 0) + 1;
  });
  var townEntries = Object.entries(townCounts)
    .sort(function(a,b){ return b[1] - a[1]; });

  /* Orders grouped by town via business lookup */
  var bizById = {};
  bizList.forEach(function(b){ if (b && b.id) bizById[String(b.id)] = b; });

  var orderByTown = {};
  var revenueByTown = {};
  orders.forEach(function(o){
    var bizId = o.businessId || o.bizId;
    var b = bizId ? bizById[String(bizId)] : null;
    var town = (b && b.town) ? String(b.town) : "Unspecified";
    orderByTown[town]   = (orderByTown[town]   || 0) + 1;
    revenueByTown[town] = (revenueByTown[town] || 0) + Number(o.total || 0);
  });
  var topTownsByOrders = Object.entries(orderByTown)
    .sort(function(a,b){ return b[1] - a[1]; });

  var topTownsByRevenue = Object.entries(revenueByTown)
    .sort(function(a,b){ return b[1] - a[1]; });

  /* ============================================================
     SECTION SUBTITLES
     ============================================================ */
  function overviewSub(){
    return orders.length + " order" + (orders.length === 1 ? "" : "s") +
           " · " + esc(EO.money(gmv));
  }
  function townsSub(){
    var n = townEntries.length;
    return n + " town" + (n === 1 ? "" : "s") + " with businesses";
  }
  function ordersByTownSub(){
    var n = topTownsByOrders.length;
    if (!n) return "No orders yet";
    return "Top: " + topTownsByOrders[0][0] + " (" + topTownsByOrders[0][1] + ")";
  }
  function revenueByTownSub(){
    var n = topTownsByRevenue.length;
    if (!n) return "No revenue yet";
    return "Top: " + topTownsByRevenue[0][0] + " (" + esc(EO.money(topTownsByRevenue[0][1])) + ")";
  }

  /* ============================================================
     MODULE HTML
     ============================================================ */
  function overviewModule(){
    return '<div class="module">' +
      '<div class="metric-grid">' +
        '<div class="metric"><b>' + orders.length + '</b><span>Order volume</span></div>' +
        '<div class="metric"><b>' + esc(EO.money(gmv)) + '</b><span>GMV</span></div>' +
        '<div class="metric"><b>' + bizList.length + '</b><span>Businesses</span></div>' +
        '<div class="metric"><b>' + esc(EO.money(avgOrder)) + '</b><span>Avg order</span></div>' +
      '</div>' +
    '</div>';
  }

  function townsModule(){
    if (!townEntries.length){
      return '<div class="module"><div class="empty-note">No businesses registered yet.</div></div>';
    }
    var total = bizList.length || 1;
    return '<div class="module">' +
      townEntries.map(function(pair){
        var name = pair[0], count = pair[1];
        var pct = Math.round((count / total) * 100);
        return '<div class="town-row">' +
          '<div class="town-info">' +
            '<b>' + esc(name) + '</b>' +
            '<span>' + count + ' business' + (count === 1 ? "" : "es") + '</span>' +
          '</div>' +
          '<div class="town-bar-wrap">' +
            '<span class="town-pct">' + pct + '%</span>' +
            '<div class="town-bar"><div class="fill" style="width:' + pct + '%"></div></div>' +
          '</div>' +
        '</div>';
      }).join('') +
    '</div>';
  }

  function ordersByTownModule(){
    if (!topTownsByOrders.length){
      return '<div class="module"><div class="empty-note">No orders recorded yet.</div></div>';
    }
    var max = topTownsByOrders[0][1] || 1;
    return '<div class="module">' +
      topTownsByOrders.map(function(pair){
        var name = pair[0], count = pair[1];
        var pct = Math.round((count / max) * 100);
        return '<div class="town-row">' +
          '<div class="town-info">' +
            '<b>' + esc(name) + '</b>' +
            '<span>' + count + ' order' + (count === 1 ? "" : "s") + '</span>' +
          '</div>' +
          '<div class="town-bar-wrap">' +
            '<span class="town-pct">' + count + '</span>' +
            '<div class="town-bar"><div class="fill" style="width:' + pct + '%"></div></div>' +
          '</div>' +
        '</div>';
      }).join('') +
    '</div>';
  }

  function revenueByTownModule(){
    if (!topTownsByRevenue.length){
      return '<div class="module"><div class="empty-note">No revenue recorded yet.</div></div>';
    }
    var max = topTownsByRevenue[0][1] || 1;
    return '<div class="module">' +
      topTownsByRevenue.map(function(pair){
        var name = pair[0], amt = pair[1];
        var pct = Math.round((amt / max) * 100);
        return '<div class="town-row">' +
          '<div class="town-info">' +
            '<b>' + esc(name) + '</b>' +
            '<span>Gross merchandise value</span>' +
          '</div>' +
          '<div class="town-bar-wrap">' +
            '<span class="town-pct">' + esc(EO.money(amt)) + '</span>' +
            '<div class="town-bar"><div class="fill" style="width:' + pct + '%"></div></div>' +
          '</div>' +
        '</div>';
      }).join('') +
    '</div>';
  }

  /* ============================================================
     ACCORDION BUILDER
     ============================================================ */
  function section(key, letter, title, sub, body){
    var isOpen = OPEN === key;
    var cls = 'acc' + (isOpen ? ' open' : '');
    return '<section class="' + cls + '" data-key="' + escapeAttr(key) + '">' +
      '<button class="acc-head" type="button" aria-expanded="' + (isOpen ? 'true' : 'false') + '">' +
        '<span class="sec-thumb">' + esc(letter) + '</span>' +
        '<span class="acc-title">' +
          '<b>' + esc(title) + '</b>' +
          '<span class="acc-sub">' + esc(sub) + '</span>' +
        '</span>' +
        '<span class="vis-dot off"></span>' +
      '</button>' +
      '<div class="acc-body">' +
        '<div class="acc-inner">' + body + '</div>' +
      '</div>' +
    '</section>';
  }

  /* ============================================================
     META CARD + PROGRESS
     ============================================================ */
  function renderMeta(){
    var dotClass = "green";
    var msg = "<b>" + orders.length + "</b> order" + (orders.length === 1 ? "" : "s") +
              " · <b>" + esc(EO.money(gmv)) + "</b> GMV";
    if (!orders.length){
      dotClass = "warn";
      msg = "No orders recorded yet";
    }

    return '<div class="meta-card">' +
      '<div class="meta-row">' +
        '<span class="meta-dot ' + dotClass + '"></span>' +
        '<span class="meta-text">' + msg + '</span>' +
      '</div>' +
      '<div class="meta-stats">' +
        '<div class="stat"><b>' + orders.length + '</b><span>Orders</span></div>' +
        '<div class="stat"><b>' + bizList.length + '</b><span>Businesses</span></div>' +
        '<div class="stat"><b>' + townEntries.length + '</b><span>Towns</span></div>' +
      '</div>' +
    '</div>';
  }

  function updateProgress(){
    /* Progress = share of sections that have data */
    var sections = 4;
    var filled = 0;
    if (orders.length) filled++;
    if (bizList.length) filled++;
    if (townEntries.length) filled++;
    if (gmv > 0) filled++;
    var pct = Math.round((filled / sections) * 100);
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('progressCount').textContent =
      filled + ' of ' + sections + ' datasets populated';
  }

  /* ============================================================
     RENDER
     ============================================================ */
  var mount = document.getElementById('app');

  function render(){
    mount.innerHTML =
      renderMeta() +
      '<div class="stack">' +
        section('overview',        '1', 'Overview',              overviewSub(),       overviewModule()) +
        section('towns',           '2', 'Businesses by town',    townsSub(),          townsModule()) +
        section('ordersByTown',    '3', 'Orders by town',        ordersByTownSub(),   ordersByTownModule()) +
        section('revenueByTown',   '4', 'Revenue by town',       revenueByTownSub(),  revenueByTownModule()) +
      '</div>';

    updateProgress();
  }

  /* ============================================================
     ACCORDION BEHAVIOUR — only one open at a time
     ============================================================ */
  function toggleAccordion(key){
    OPEN = (OPEN === key) ? null : key;
    var accs = mount.querySelectorAll('.acc');
    for (var i = 0; i < accs.length; i++){
      var acc = accs[i];
      var isOpen = acc.getAttribute('data-key') === OPEN;
      acc.classList.toggle('open', isOpen);
      var head = acc.querySelector('.acc-head');
      if (head) head.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    }
    if (OPEN){
      var opened = mount.querySelector('.acc[data-key="' + cssEscape(OPEN) + '"]');
      if (opened){
        setTimeout(function(){
          try { opened.scrollIntoView({ behavior:'smooth', block:'start' }); } catch (e) {}
        }, 320);
      }
    }
  }

  /* ============================================================
     DELEGATED CLICKS
     ============================================================ */
  mount.addEventListener('click', function(e){
    var head = e.target.closest('.acc-head');
    if (head){
      var acc = head.closest('.acc');
      if (acc) toggleAccordion(acc.getAttribute('data-key'));
    }
  });

  /* ============================================================
     BOOT
     ============================================================ */
  render();
});
</script>
</body>
</html>
