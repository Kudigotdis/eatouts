<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#141418">
<title>Delivery manager · EatOuts</title>
<style>
  *,*::before,*::after{box-sizing:border-box}
  :root{
    --ink:#0F0F12;--ink-2:#2A2A30;--paper:#F4F5F7;--card:#FFF;
    --line:#E6E8EC;--line-2:#F0F1F4;
    --orange:#FF5A1F;--orange-2:#FF7A42;--orange-soft:#FFEDE4;--orange-line:#FFD5C2;
    --green:#16A34A;--green-soft:#E7F7EE;
    --red:#DC2626;--red-soft:#FEE2E2;
    --amber:#B45309;--amber-soft:#FEF3C7;
    --blue:#0284C7;--blue-soft:#E0F2FE;
    --muted:#6B7280;--faint:#9AA1AC;
  }
  html,body{height:100%}
  body{margin:0;background:#E9EBEF;color:var(--ink);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;overscroll-behavior:none;
    display:flex;justify-content:center;}
  button,input,select,textarea{font-family:inherit}
  button{cursor:pointer}
  #shell{width:100%;max-width:460px;height:100vh;height:100dvh;
    background:var(--paper);display:flex;flex-direction:column;
    overflow:hidden;position:relative;box-shadow:0 0 70px rgba(20,20,25,.16);}

  /* ============ TOPBAR ============ */
  .topbar{flex:0 0 auto;background:#141418;
    padding:calc(13px + env(safe-area-inset-top)) 18px 14px;
    position:relative;z-index:10;}
  .topbar-row{display:flex;align-items:center;gap:10px;padding-bottom:13px;}
  .brand{display:inline-flex;align-items:center;gap:9px;text-decoration:none;}
  .brand .mark{width:28px;height:28px;flex:0 0 auto;border-radius:8px;
    background:linear-gradient(145deg,var(--orange-2),var(--orange));
    color:#fff;display:grid;place-items:center;
    font-size:14px;font-weight:900;letter-spacing:-.03em;
    box-shadow:0 2px 10px rgba(255,90,31,.35);}
  .brand .word{color:#fff;font-size:15px;font-weight:800;letter-spacing:-.02em;}
  .hdr-chip{margin-left:auto;font-size:10px;font-weight:800;
    letter-spacing:.12em;text-transform:uppercase;color:var(--orange-2);
    border:1px solid rgba(255,122,66,.32);background:rgba(255,90,31,.1);
    border-radius:999px;padding:5px 11px;white-space:nowrap;}
  .progress{padding-bottom:2px}
  .progress-top{display:flex;align-items:baseline;justify-content:space-between;
    gap:10px;margin-bottom:8px;}
  .progress-label{font-size:11px;font-weight:800;letter-spacing:.14em;
    text-transform:uppercase;color:rgba(255,255,255,.5);}
  .progress-count{font-size:11.5px;font-weight:800;color:var(--orange-2);}
  .progress-track{height:5px;border-radius:99px;background:rgba(255,255,255,.13);
    overflow:hidden;}
  .progress-fill{height:100%;width:0%;border-radius:99px;
    background:linear-gradient(90deg,var(--orange),var(--orange-2));
    transition:width .35s cubic-bezier(.4,0,.2,1);}

  /* ============ SCROLL ============ */
  .scroll{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;
    -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
    scrollbar-width:none;}
  .scroll::-webkit-scrollbar{display:none}

  /* ============ INTRO ============ */
  .intro{background:linear-gradient(175deg,#141418 0%,#1B1B21 60%,#232329 100%);
    padding:4px 22px 46px;position:relative;overflow:hidden;text-align:center;}
  .intro::after{content:"";position:absolute;top:-80px;right:-80px;
    width:230px;height:230px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,90,31,.2),transparent 68%);
    pointer-events:none;}
  .intro h1{position:relative;margin:0 auto 12px;font-size:26px;
    line-height:1.15;font-weight:800;letter-spacing:-.03em;color:#fff;
    max-width:15ch;}
  .intro h1 em{font-style:normal;color:var(--orange-2)}
  .intro p{position:relative;margin:0 auto;font-size:14px;line-height:1.6;
    color:rgba(255,255,255,.6);max-width:32ch;}

  /* ============ SHEET ============ */
  .sheet{position:relative;z-index:1;margin-top:-26px;background:var(--paper);
    border-radius:26px 26px 0 0;padding:20px 14px 30px;min-height:60vh;}

  /* ============ META CARD ============ */
  .meta-card{background:var(--card);border:1px solid var(--line);
    border-radius:16px;padding:15px 16px;margin-bottom:12px;
    box-shadow:0 1px 2px rgba(20,20,25,.03);}
  .meta-row{display:flex;align-items:center;gap:10px;margin-bottom:11px;}
  .meta-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;
    background:var(--orange);box-shadow:0 0 0 3px var(--orange-soft);}
  .meta-dot.green{background:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
  .meta-dot.warn{background:var(--amber);box-shadow:0 0 0 3px var(--amber-soft)}
  .meta-dot.red{background:var(--red);box-shadow:0 0 0 3px var(--red-soft)}
  .meta-text{font-size:13.5px;color:var(--ink-2);line-height:1.4;
    min-width:0;flex:1 1 auto;}
  .meta-text b{color:var(--ink);font-weight:750}
  .meta-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
    padding-top:11px;border-top:1px solid var(--line-2);}
  .stat{text-align:center}
  .stat b{display:block;font-size:19px;font-weight:850;
    letter-spacing:-.03em;color:var(--ink);line-height:1.1;
    font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;}
  .stat span{display:block;margin-top:3px;font-size:9.5px;font-weight:800;
    letter-spacing:.1em;text-transform:uppercase;color:var(--faint);}

  /* ============ ACCORDION STACK ============ */
  .stack{display:flex;flex-direction:column;gap:10px}
  .acc{background:var(--card);border:1px solid var(--line);border-radius:16px;
    overflow:hidden;transition:border-color .2s ease,box-shadow .2s ease;}
  .acc.open{border-color:var(--orange-line);
    box-shadow:0 4px 18px -6px rgba(255,90,31,.22);}
  .acc.has-items .acc-sub{color:var(--green);font-weight:650}
  .acc-head{width:100%;display:flex;align-items:center;gap:12px;
    padding:13px 15px;background:transparent;border:0;text-align:left;
    -webkit-tap-highlight-color:transparent;transition:background .15s;}
  .acc-head:active{background:#FAFBFC}
  .sec-thumb{width:48px;height:48px;flex:0 0 auto;border-radius:11px;
    background:var(--orange-soft);color:var(--orange);
    display:grid;place-items:center;font-size:17px;font-weight:850;
    letter-spacing:-.02em;position:relative;}
  .sec-thumb.plain{background:#F0F1F4;color:var(--faint);}
  .sec-thumb .count{position:absolute;bottom:3px;right:3px;
    background:rgba(15,15,18,.72);color:#fff;font-size:9px;font-weight:800;
    padding:1.5px 5px;border-radius:4px;line-height:1;}
  .acc-title{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .acc-title b{font-size:15px;font-weight:750;letter-spacing:-.015em;
    color:var(--ink);line-height:1.25;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;}
  .acc-sub{font-size:11.5px;color:var(--faint);line-height:1.3;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:550;}
  .vis-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;
    background:var(--orange);box-shadow:0 0 0 3px var(--orange-soft);}
  .vis-dot.green{background:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
  .vis-dot.off{background:#D3D7DE;box-shadow:none}
  .acc-body{display:grid;grid-template-rows:0fr;
    transition:grid-template-rows .32s cubic-bezier(.4,0,.2,1);}
  .acc.open .acc-body{grid-template-rows:1fr}
  .acc-inner{overflow:hidden;min-height:0}
  .module{padding:2px 15px 18px}

  /* ============ ROWS ============ */
  .addr-row{display:flex;gap:12px;padding:12px;background:#FAFBFC;
    border:1px solid var(--line-2);border-radius:12px;margin-bottom:8px;
    align-items:flex-start;}
  .addr-row:last-child{margin-bottom:0}

  .addr-thumb{width:90px;height:90px;flex:0 0 auto;border-radius:14px;
    background:linear-gradient(145deg,#FFF3EC,#FFE2D2);color:var(--orange);
    display:grid;place-items:center;font-size:34px;font-weight:850;
    letter-spacing:-.03em;overflow:hidden;position:relative;}
  .addr-thumb.sm{width:56px;height:56px;font-size:22px;border-radius:12px;}

  .addr-body{flex:1 1 auto;min-width:0;
    display:flex;flex-direction:column;gap:4px;}
  .addr-title{font-size:14px;font-weight:750;letter-spacing:-.01em;
    color:var(--ink);line-height:1.3;word-break:break-word;}
  .addr-sub{font-size:11.5px;color:var(--faint);font-weight:550;
    line-height:1.4;word-break:break-word;}
  .addr-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;
    align-items:center;}

  .mini-btn{height:32px;padding:0 12px;border-radius:9px;
    border:1px solid var(--line);background:#fff;color:var(--ink-2);
    font-size:11.5px;font-weight:750;display:inline-flex;
    align-items:center;justify-content:center;
    -webkit-tap-highlight-color:transparent;
    transition:background .15s,border-color .15s,color .15s;}
  .mini-btn:active{background:#F4F5F7}
  .mini-btn.danger{color:var(--red);border-color:#FECACA;background:#FEF2F2;}
  .mini-btn.danger:active{background:var(--red-soft)}

  .pill{display:inline-flex;align-items:center;gap:5px;height:32px;
    padding:0 12px;border-radius:999px;font-size:10px;font-weight:800;
    letter-spacing:.09em;text-transform:uppercase;white-space:nowrap;
    background:#F0F1F4;color:var(--faint);}
  .pill.on{background:var(--green-soft);color:var(--green)}
  .pill.off{background:#F0F1F4;color:var(--faint)}
  .pill.brand{background:var(--orange-soft);color:var(--orange)}

  /* Add dashed button */
  .add-addr-btn{display:flex;align-items:center;justify-content:center;
    width:100%;height:44px;border-radius:11px;
    border:1.5px dashed #D3D7DE;background:#fff;color:var(--orange);
    font-size:13.5px;font-weight:750;margin-top:10px;
    -webkit-tap-highlight-color:transparent;
    transition:background .15s,border-color .15s;}
  .add-addr-btn:active{background:var(--orange-soft);border-color:var(--orange-line)}

  /* Inline editor */
  .inline-form{margin-top:12px;padding-top:16px;border-top:1px solid var(--line-2);}

  /* ============ FORM FIELDS ============ */
  .field{margin-bottom:14px}
  .field:last-child{margin-bottom:0}
  .field > label{display:block;font-size:11.5px;font-weight:800;
    letter-spacing:.09em;text-transform:uppercase;color:var(--muted);
    margin-bottom:7px;}
  .field input,
  .field select{
    width:100%;border:1px solid var(--line);border-radius:11px;
    background:#fff;color:var(--ink);font-size:15px;line-height:1.4;
    padding:13px;outline:none;
    transition:border-color .15s,box-shadow .15s;
    -webkit-appearance:none;appearance:none;font-family:inherit;}
  .field input:focus,
  .field select:focus{border-color:var(--orange);
    box-shadow:0 0 0 3px rgba(255,90,31,.13);}
  .field input::placeholder{color:#B7BDC6}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:400px){.grid2{grid-template-columns:1fr}}

  /* Save / Cancel buttons */
  .form-actions{display:flex;gap:9px;margin-top:16px;}
  .form-actions .btn{flex:1;height:52px;border-radius:13px;
    font-size:15px;font-weight:750;letter-spacing:-.01em;border:0;
    display:inline-flex;align-items:center;justify-content:center;
    -webkit-tap-highlight-color:transparent;
    transition:transform .1s ease,background .15s;}
  .form-actions .btn:active{transform:scale(.98)}
  .btn-save{background:linear-gradient(145deg,var(--orange-2),var(--orange));
    color:#fff;box-shadow:0 6px 18px -6px rgba(255,90,31,.5);}
  .btn-save:active{background:var(--orange)}
  .btn-cancel{background:#F4F5F7;border:1px solid var(--line)!important;
    color:var(--ink-2);}
  .btn-cancel:active{background:#EBEDF0}

  /* ============ EMPTY ============ */
  .empty-note{font-size:12.5px;color:var(--faint);text-align:center;
    padding:22px 16px;border:1.5px dashed #DCE0E6;border-radius:11px;
    background:#FAFBFC;line-height:1.55;}
  .empty-note b{color:var(--ink-2);font-weight:750}

  /* ============ TOAST ============ */
  .toast{position:fixed;left:50%;z-index:200;
    bottom:calc(28px + env(safe-area-inset-bottom));
    transform:translate(-50%,10px);background:var(--ink);color:#fff;
    font-size:13.5px;font-weight:650;padding:12px 18px;border-radius:999px;
    max-width:88vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    opacity:0;pointer-events:none;
    transition:opacity .2s ease,transform .2s ease;}
  .toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body data-page="delivery-manager">
<div id="shell">

  <header class="topbar">
    <div class="topbar-row">
      <a class="brand" href="index.html">
        <span class="mark">E</span><span class="word">EatOuts</span>
      </a>
      <span class="hdr-chip">Manager</span>
    </div>
    <div class="progress">
      <div class="progress-top">
        <span class="progress-label">Delivery setup</span>
        <span class="progress-count" id="progressCount">—</span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
  </header>

  <div class="scroll" id="scroll">
    <section class="intro">
      <h1>Delivery <em>control</em>.</h1>
      <p>Zones, fees, capacity, drivers and delivery windows — all in one place.</p>
    </section>
    <main class="sheet" id="app"></main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script src="js/eatouts-manager-db.js"></script>
<script src="assets/data/demo/the-food-place/demo-data.js"></script>
<script src="js/eatouts-manager-seed.js"></script>
<script src="js/eatouts-roles.js"></script>
<script src="js/eatouts-users.js"></script>
<script src="js/eatouts-feedback.js"></script>
<script src="js/eatouts-blog-admin.js"></script>
<script src="js/eatouts-auth.js"></script>
<script src="js/eatouts-manager.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {

  /* ---------- guard ---------- */
  if (!window.EO || !EO.guard({})) return;

  var DB = window.EatoutsMgrDB;

  /* ============================================================
     HELPERS
     ============================================================ */
  function esc(v){
    return String(v == null ? "" : v)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }
  function attr(v){ return esc(v).replace(/`/g,"&#96;"); }
  function cssEscape(s){ return String(s).replace(/["\\]/g, "\\$&"); }
  function money(n){
    if (window.EO && typeof EO.money === "function") return EO.money(Number(n) || 0);
    return "P " + (Number(n) || 0).toFixed(2);
  }
  function confirmDialog(msg){
    if (window.EO && typeof EO.confirm === "function") return EO.confirm(msg);
    return window.confirm(msg);
  }

  var toastEl = document.getElementById("toast");
  var toastTimer = null;
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove("show"); }, 2000);
  }

  /* ============================================================
     DATA
     ============================================================ */
  function settings(){
    var d = (DB && DB.get) ? DB.get() : {};
    if (!d.settings) d.settings = {};
    var s = d.settings;
    if (!Array.isArray(s.zones)) s.zones = [];
    if (typeof s.defaultDeliveryFee !== "number" || isNaN(s.defaultDeliveryFee)) s.defaultDeliveryFee = 25;
    if (typeof s.slotCapacity !== "number" || !s.slotCapacity) s.slotCapacity = 12;
    if (!s.startTime) s.startTime = "10:00";
    if (!s.endTime) s.endTime = "22:00";
    return s;
  }
  function persist(){ try { if (DB && DB.save) DB.save(); } catch (e) {} }

  function drivers(){
    var s = settings();
    if (!Array.isArray(s.drivers)){
      s.drivers = [
        { id:"drv-1", name:"Kabelo Driver", phone:"+267 70 123 456", zone:"Gaborone CBD", active:true },
        { id:"drv-2", name:"Neo Driver",    phone:"+267 71 987 654", zone:"Broadhurst",   active:true }
      ];
    }
    return s.drivers;
  }

  function zoneName(z){
    return typeof z === "string" ? z : ((z && z.name) || "Zone");
  }
  function zoneFee(z){
    var s = settings();
    return (z && typeof z === "object" && z.fee != null) ? z.fee : s.defaultDeliveryFee;
  }

  /* ============================================================
     STATE — accordion open key + inline editors
     ============================================================ */
  var OPEN = null;        // 'zones' | 'windows' | 'drivers' | null
  var zoneEdit = null;    // null | { index:Number|null, name:String, fee:Number }
  var driverEdit = null;  // null | {}

  /* ============================================================
     SUBTITLES
     ============================================================ */
  function zonesSub(){
    var zs = settings().zones;
    if (!zs.length) return "No zones configured";
    var names = zs.map(zoneName).filter(Boolean);
    if (names.length <= 3) return names.length + " zone" + (names.length === 1 ? "" : "s") + " · " + names.join(", ");
    return names.length + " zones · " + names.slice(0, 2).join(", ") + " +" + (names.length - 2);
  }
  function windowsSub(){
    var s = settings();
    return s.startTime + " – " + s.endTime + " · " + s.slotCapacity + " orders / slot";
  }
  function driversSub(){
    var ds = drivers();
    if (!ds.length) return "No drivers on the roster";
    var act = ds.filter(function(d){ return d.active !== false; }).length;
    return ds.length + " driver" + (ds.length === 1 ? "" : "s") + " · " + act + " active";
  }

  /* ============================================================
     MODULE — ZONES
     ============================================================ */
  function zonesModule(){
    var s = settings();
    var zs = s.zones;
    var out = "";

    if (!zs.length){
      out += '<div class="empty-note">No delivery zones yet.<br><b>Add a zone</b> to start delivering.</div>';
    } else {
      out += zs.map(function(z, i){
        var name = zoneName(z);
        var fee  = zoneFee(z);
        return '<div class="addr-row">' +
            '<div class="addr-thumb sm">' + esc(String(name).charAt(0).toUpperCase()) + '</div>' +
            '<div class="addr-body">' +
              '<div class="addr-title">' + esc(name) + '</div>' +
              '<div class="addr-sub">Fee ' + esc(money(fee)) + ' · Capacity ' + esc(s.slotCapacity) + ' / slot</div>' +
              '<div class="addr-actions">' +
                '<button class="mini-btn" type="button" data-zone-edit="' + i + '">Edit</button>' +
                '<button class="mini-btn danger" type="button" data-zone-del="' + i + '">Delete</button>' +
              '</div>' +
            '</div>' +
          '</div>';
      }).join('');
    }

    if (zoneEdit){
      out += '<div class="inline-form">' +
        '<div class="field">' +
          '<label>' + (zoneEdit.index == null ? "New zone name" : "Zone name") + '</label>' +
          '<input id="zn-name" type="text" value="' + attr(zoneEdit.name) + '" placeholder="e.g. Gaborone CBD">' +
        '</div>' +
        '<div class="field">' +
          '<label>Delivery fee</label>' +
          '<input id="zn-fee" type="number" min="0" step="1" value="' + attr(zoneEdit.fee) + '" placeholder="25">' +
        '</div>' +
        '<div class="form-actions">' +
          '<button class="btn btn-save" type="button" id="zn-save">' +
            (zoneEdit.index == null ? "Add zone" : "Save zone") +
          '</button>' +
          '<button class="btn btn-cancel" type="button" id="zn-cancel">Cancel</button>' +
        '</div>' +
      '</div>';
    } else {
      out += '<button class="add-addr-btn" type="button" data-zone-add>+ Add zone</button>';
    }

    return '<div class="module">' + out + '</div>';
  }

  /* ============================================================
     MODULE — DELIVERY WINDOWS / CONFIG
     ============================================================ */
  function windowsModule(){
    var s = settings();
    return '<div class="module">' +
      '<div class="grid2">' +
        '<div class="field">' +
          '<label>Default fee</label>' +
          '<input id="cfg-fee" type="number" min="0" step="1" value="' + attr(s.defaultDeliveryFee) + '">' +
        '</div>' +
        '<div class="field">' +
          '<label>Slot capacity</label>' +
          '<input id="cfg-capacity" type="number" min="1" step="1" value="' + attr(s.slotCapacity) + '">' +
        '</div>' +
      '</div>' +
      '<div class="grid2">' +
        '<div class="field">' +
          '<label>Window start</label>' +
          '<input id="cfg-start" type="time" value="' + attr(s.startTime) + '">' +
        '</div>' +
        '<div class="field">' +
          '<label>Window end</label>' +
          '<input id="cfg-end" type="time" value="' + attr(s.endTime) + '">' +
        '</div>' +
      '</div>' +
      '<div class="form-actions">' +
        '<button class="btn btn-save" type="button" id="cfg-save">Save delivery config</button>' +
      '</div>' +
    '</div>';
  }

  /* ============================================================
     MODULE — DRIVER ROSTER
     ============================================================ */
  function driversModule(){
    var ds = drivers();
    var out = "";

    if (!ds.length){
      out += '<div class="empty-note">No drivers on the roster.<br><b>Add a driver</b> below to start assigning drops.</div>';
    } else {
      out += ds.map(function(d, i){
        var paused = d.active === false;
        return '<div class="addr-row">' +
            '<div class="addr-thumb sm">' + esc(String(d.name || "?").charAt(0).toUpperCase()) + '</div>' +
            '<div class="addr-body">' +
              '<div class="addr-title">' + esc(d.name || "Driver") + '</div>' +
              '<div class="addr-sub">' + esc(d.phone || "No number") +
                (d.zone ? " · " + esc(d.zone) : "") + '</div>' +
              '<div class="addr-actions">' +
                '<span class="pill ' + (paused ? "off" : "on") + '">' + (paused ? "Paused" : "Active") + '</span>' +
                '<button class="mini-btn" type="button" data-drv-toggle="' + i + '">' +
                  (paused ? "Activate" : "Pause") +
                '</button>' +
                '<button class="mini-btn danger" type="button" data-drv-del="' + i + '">Remove</button>' +
              '</div>' +
            '</div>' +
          '</div>';
      }).join('');
    }

    if (driverEdit){
      out += '<div class="inline-form">' +
        '<div class="field">' +
          '<label>Driver name</label>' +
          '<input id="dv-name" type="text" value="" placeholder="e.g. Thabo M.">' +
        '</div>' +
        '<div class="field">' +
          '<label>Phone</label>' +
          '<input id="dv-phone" type="text" value="" placeholder="+267 71 234 567">' +
        '</div>' +
        '<div class="field">' +
          '<label>Zone</label>' +
          '<input id="dv-zone" type="text" value="" placeholder="e.g. Gaborone CBD">' +
        '</div>' +
        '<div class="form-actions">' +
          '<button class="btn btn-save" type="button" id="dv-save">Add driver</button>' +
          '<button class="btn btn-cancel" type="button" id="dv-cancel">Cancel</button>' +
        '</div>' +
      '</div>';
    } else {
      out += '<button class="add-addr-btn" type="button" data-drv-add>+ Add driver</button>';
    }

    return '<div class="module">' + out + '</div>';
  }

  /* ============================================================
     SECTION BUILDER — no chevrons / arrows / +- indicators
     ============================================================ */
  function section(key, letter, title, sub, body, badge, active){
    var isOpen = OPEN === key;
    var cls = 'acc' + (isOpen ? ' open' : '') + (active ? ' has-items' : '');
    var badgeHtml = (badge != null && badge !== "")
      ? '<span class="count">' + esc(badge) + '</span>' : '';

    return '<section class="' + cls + '" data-key="' + attr(key) + '">' +
      '<button class="acc-head" type="button" aria-expanded="' + (isOpen ? 'true' : 'false') + '">' +
        '<span class="sec-thumb' + (active ? '' : ' plain') + '">' + esc(letter) + badgeHtml + '</span>' +
        '<span class="acc-title">' +
          '<b>' + esc(title) + '</b>' +
          '<span class="acc-sub">' + esc(sub) + '</span>' +
        '</span>' +
        '<span class="vis-dot ' + (active ? 'green' : 'off') + '"></span>' +
      '</button>' +
      '<div class="acc-body"><div class="acc-inner">' + body + '</div></div>' +
    '</section>';
  }

  /* ============================================================
     META CARD + PROGRESS
     ============================================================ */
  function renderMeta(){
    var s = settings();
    var ds = drivers();
    var zc = s.zones.length;
    var dc = ds.length;

    var dot = (zc && dc) ? "green" : ((zc || dc) ? "warn" : "red");
    var msg;
    if (!zc && !dc){
      msg = "Delivery is not set up yet — open a section below to begin";
    } else {
      msg = "<b>" + zc + "</b> zone" + (zc === 1 ? "" : "s") + " · <b>" + dc +
            "</b> driver" + (dc === 1 ? "" : "s") + " on the roster";
    }

    return '<div class="meta-card">' +
      '<div class="meta-row">' +
        '<span class="meta-dot ' + dot + '"></span>' +
        '<span class="meta-text">' + msg + '</span>' +
      '</div>' +
      '<div class="meta-stats">' +
        '<div class="stat"><b>' + zc + '</b><span>Zones</span></div>' +
        '<div class="stat"><b>' + esc(money(s.defaultDeliveryFee)) + '</b><span>Base fee</span></div>' +
        '<div class="stat"><b>' + esc(s.slotCapacity) + '</b><span>Per slot</span></div>' +
      '</div>' +
    '</div>';
  }

  function updateProgress(){
    var s = settings();
    var steps = [
      s.zones.length > 0,
      Number(s.defaultDeliveryFee) > 0,
      !!(s.startTime && s.endTime),
      drivers().length > 0
    ];
    var done = steps.filter(Boolean).length;
    var pct = Math.round((done / steps.length) * 100);
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('progressCount').textContent =
      done + ' of ' + steps.length + ' configured';
  }

  /* ============================================================
     RENDER
     ============================================================ */
  var mount = document.getElementById('app');

  function render(){
    var s = settings();
    var ds = drivers();

    mount.innerHTML =
      renderMeta() +
      '<div class="stack">' +
        section('zones',   'Z', 'Delivery zones',   zonesSub(),   zonesModule(),   s.zones.length, s.zones.length > 0) +
        section('windows', 'W', 'Delivery windows', windowsSub(), windowsModule(), null,           true) +
        section('drivers', 'D', 'Driver roster',    driversSub(), driversModule(), ds.length,      ds.length > 0) +
      '</div>';

    updateProgress();
    wire();
  }

  /* ============================================================
     ACCORDION — only one open at a time, closed by default
     ============================================================ */
  function toggleAccordion(key){
    OPEN = (OPEN === key) ? null : key;
    var accs = mount.querySelectorAll('.acc');
    for (var i = 0; i < accs.length; i++){
      var acc = accs[i];
      var isOpen = acc.getAttribute('data-key') === OPEN;
      acc.classList.toggle('open', isOpen);
      var head = acc.querySelector('.acc-head');
      if (head) head.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    }
    if (OPEN){
      var opened = mount.querySelector('.acc[data-key="' + cssEscape(OPEN) + '"]');
      if (opened){
        setTimeout(function(){
          try { opened.scrollIntoView({ behavior:'smooth', block:'start' }); } catch (e) {}
        }, 320);
      }
    }
  }

  /* ============================================================
     FORM WIRING
     ============================================================ */
  function wire(){

    /* --- zone editor --- */
    var znSave = document.getElementById('zn-save');
    var znCancel = document.getElementById('zn-cancel');
    if (znSave && zoneEdit){
      znSave.onclick = function(){
        var name = document.getElementById('zn-name').value.trim();
        var fee  = Number(document.getElementById('zn-fee').value);
        if (!name){ toast('Enter a zone name'); return; }
        if (!isFinite(fee) || fee < 0){ toast('Enter a valid fee'); return; }

        var s = settings();
        var entry = { name: name, fee: fee };
        if (zoneEdit.index == null) s.zones.push(entry);
        else s.zones[zoneEdit.index] = entry;

        zoneEdit = null;
        OPEN = 'zones';
        persist(); render();
        toast('Zone saved');
      };
      znCancel.onclick = function(){
        zoneEdit = null;
        OPEN = 'zones';
        render();
      };
    }

    /* --- delivery config --- */
    var cfgSave = document.getElementById('cfg-save');
    if (cfgSave){
      cfgSave.onclick = function(){
        var fee = Number(document.getElementById('cfg-fee').value);
        var cap = Number(document.getElementById('cfg-capacity').value);
        var st  = document.getElementById('cfg-start').value;
        var en  = document.getElementById('cfg-end').value;

        if (!isFinite(fee) || fee < 0){ toast('Enter a valid fee'); return; }
        if (!isFinite(cap) || cap < 1){ toast('Enter a valid capacity'); return; }
        if (!st || !en){ toast('Set the delivery window'); return; }
        if (st >= en){ toast('End time must be after start'); return; }

        var s = settings();
        s.defaultDeliveryFee = fee;
        s.slotCapacity = cap;
        s.startTime = st;
        s.endTime = en;

        OPEN = 'windows';
        persist(); render();
        toast('Delivery settings saved');
      };
    }

    /* --- driver editor --- */
    var dvSave = document.getElementById('dv-save');
    var dvCancel = document.getElementById('dv-cancel');
    if (dvSave && driverEdit){
      dvSave.onclick = function(){
        var name  = document.getElementById('dv-name').value.trim();
        var phone = document.getElementById('dv-phone').value.trim();
        var zone  = document.getElementById('dv-zone').value.trim();
        if (!name){ toast('Enter a driver name'); return; }

        drivers().push({
          id: 'drv-' + Date.now(),
          name: name, phone: phone, zone: zone, active: true
        });

        driverEdit = null;
        OPEN = 'drivers';
        persist(); render();
        toast('Driver added');
      };
      dvCancel.onclick = function(){
        driverEdit = null;
        OPEN = 'drivers';
        render();
      };
    }
  }

  /* ============================================================
     CLICK DELEGATION
     ============================================================ */
  mount.addEventListener('click', function(e){
    var t = e.target;
    if (!t || !t.closest) return;

    /* Add zone */
    if (t.closest('[data-zone-add]')){
      e.stopPropagation();
      var s0 = settings();
      zoneEdit = { index: null, name: '', fee: s0.defaultDeliveryFee };
      OPEN = 'zones';
      render();
      return;
    }

    /* Edit zone */
    var zEdit = t.closest('[data-zone-edit]');
    if (zEdit){
      e.stopPropagation();
      var i = Number(zEdit.getAttribute('data-zone-edit'));
      var s1 = settings();
      var z = s1.zones[i];
      if (z == null) return;
      zoneEdit = { index: i, name: zoneName(z), fee: zoneFee(z) };
      OPEN = 'zones';
      render();
      return;
    }

    /* Delete zone */
    var zDel = t.closest('[data-zone-del]');
    if (zDel){
      e.stopPropagation();
      var di = Number(zDel.getAttribute('data-zone-del'));
      var s2 = settings();
      var zz = s2.zones[di];
      if (zz == null) return;
      if (!confirmDialog('Delete "' + zoneName(zz) + '" from delivery zones?')) return;
      s2.zones.splice(di, 1);
      if (zoneEdit && zoneEdit.index === di) zoneEdit = null;
      OPEN = 'zones';
      persist(); render();
      toast('Zone removed');
      return;
    }

    /* Add driver */
    if (t.closest('[data-drv-add]')){
      e.stopPropagation();
      driverEdit = {};
      OPEN = 'drivers';
      render();
      return;
    }

    /* Toggle driver active / paused */
    var dTog = t.closest('[data-drv-toggle]');
    if (dTog){
      e.stopPropagation();
      var ti = Number(dTog.getAttribute('data-drv-toggle'));
      var ds = drivers();
      if (!ds[ti]) return;
      ds[ti].active = !(ds[ti].active !== false);
      OPEN = 'drivers';
      persist(); render();
      return;
    }

    /* Remove driver */
    var dDel = t.closest('[data-drv-del]');
    if (dDel){
      e.stopPropagation();
      var ri = Number(dDel.getAttribute('data-drv-del'));
      var dds = drivers();
      if (!dds[ri]) return;
      if (!confirmDialog('Remove ' + (dds[ri].name || 'this driver') + ' from the roster?')) return;
      dds.splice(ri, 1);
      OPEN = 'drivers';
      persist(); render();
      toast('Driver removed');
      return;
    }

    /* Accordion header (last, so inner buttons win) */
    var head = t.closest('.acc-head');
    if (head){
      var acc = head.closest('.acc');
      if (acc) toggleAccordion(acc.getAttribute('data-key'));
      return;
    }
  });

  /* ============================================================
     BOOT — all accordions closed
     ============================================================ */
  render();
});
</script>
</body>
</html>
