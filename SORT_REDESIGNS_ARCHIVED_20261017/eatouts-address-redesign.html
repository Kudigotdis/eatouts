<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#141418">
<title>Addresses · EatOuts</title>
<style>
  *,*::before,*::after{box-sizing:border-box}
  :root{
    --ink:#0F0F12;--ink-2:#2A2A30;--paper:#F4F5F7;--card:#FFF;
    --line:#E6E8EC;--line-2:#F0F1F4;
    --orange:#FF5A1F;--orange-2:#FF7A42;--orange-soft:#FFEDE4;--orange-line:#FFD5C2;
    --green:#16A34A;--green-soft:#E7F7EE;
    --red:#DC2626;--red-soft:#FEE2E2;
    --amber:#B45309;--amber-soft:#FEF3C7;
    --blue:#0284C7;--blue-soft:#E0F2FE;
    --muted:#6B7280;--faint:#9AA1AC;
  }
  html,body{height:100%}
  body{margin:0;background:#E9EBEF;color:var(--ink);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;overscroll-behavior:none;
    display:flex;justify-content:center;}
  button,input,select,textarea{font-family:inherit}
  button{cursor:pointer}
  #shell{width:100%;max-width:460px;height:100vh;height:100dvh;
    background:var(--paper);display:flex;flex-direction:column;
    overflow:hidden;position:relative;box-shadow:0 0 70px rgba(20,20,25,.16);}

  /* ============ TOPBAR ============ */
  .topbar{flex:0 0 auto;background:#141418;
    padding:calc(13px + env(safe-area-inset-top)) 18px 14px;
    position:relative;z-index:10;}
  .topbar-row{display:flex;align-items:center;gap:10px;padding-bottom:13px;}
  .brand{display:inline-flex;align-items:center;gap:9px;text-decoration:none;}
  .brand .mark{width:28px;height:28px;flex:0 0 auto;border-radius:8px;
    background:linear-gradient(145deg,var(--orange-2),var(--orange));
    color:#fff;display:grid;place-items:center;
    font-size:14px;font-weight:900;letter-spacing:-.03em;
    box-shadow:0 2px 10px rgba(255,90,31,.35);}
  .brand .word{color:#fff;font-size:15px;font-weight:800;letter-spacing:-.02em;}
  .hdr-chip{margin-left:auto;font-size:10px;font-weight:800;
    letter-spacing:.12em;text-transform:uppercase;color:var(--orange-2);
    border:1px solid rgba(255,122,66,.32);background:rgba(255,90,31,.1);
    border-radius:999px;padding:5px 11px;white-space:nowrap;}
  .progress{padding-bottom:2px}
  .progress-top{display:flex;align-items:baseline;justify-content:space-between;
    gap:10px;margin-bottom:8px;}
  .progress-label{font-size:11px;font-weight:800;letter-spacing:.14em;
    text-transform:uppercase;color:rgba(255,255,255,.5);}
  .progress-count{font-size:11.5px;font-weight:800;color:var(--orange-2);}
  .progress-track{height:5px;border-radius:99px;background:rgba(255,255,255,.13);
    overflow:hidden;}
  .progress-fill{height:100%;width:0%;border-radius:99px;
    background:linear-gradient(90deg,var(--orange),var(--orange-2));
    transition:width .35s cubic-bezier(.4,0,.2,1);}

  /* ============ SCROLL ============ */
  .scroll{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;
    -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
    scrollbar-width:none;}
  .scroll::-webkit-scrollbar{display:none}

  /* ============ INTRO ============ */
  .intro{background:linear-gradient(175deg,#141418 0%,#1B1B21 60%,#232329 100%);
    padding:4px 22px 46px;position:relative;overflow:hidden;text-align:center;}
  .intro::after{content:"";position:absolute;top:-80px;right:-80px;
    width:230px;height:230px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,90,31,.2),transparent 68%);
    pointer-events:none;}
  .intro h1{position:relative;margin:0 auto 12px;font-size:26px;
    line-height:1.15;font-weight:800;letter-spacing:-.03em;color:#fff;
    max-width:15ch;}
  .intro h1 em{font-style:normal;color:var(--orange-2)}
  .intro p{position:relative;margin:0 auto;font-size:14px;line-height:1.6;
    color:rgba(255,255,255,.6);max-width:32ch;}

  /* ============ SHEET ============ */
  .sheet{position:relative;z-index:1;margin-top:-26px;background:var(--paper);
    border-radius:26px 26px 0 0;padding:20px 14px 30px;min-height:60vh;}

  /* ============ META CARD ============ */
  .meta-card{background:var(--card);border:1px solid var(--line);
    border-radius:16px;padding:15px 16px;margin-bottom:12px;
    box-shadow:0 1px 2px rgba(20,20,25,.03);}
  .meta-row{display:flex;align-items:center;gap:10px;margin-bottom:11px;}
  .meta-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;
    background:var(--orange);box-shadow:0 0 0 3px var(--orange-soft);}
  .meta-dot.green{background:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
  .meta-dot.warn{background:var(--amber);box-shadow:0 0 0 3px var(--amber-soft)}
  .meta-dot.red{background:var(--red);box-shadow:0 0 0 3px var(--red-soft)}
  .meta-text{font-size:13.5px;color:var(--ink-2);line-height:1.4;
    min-width:0;flex:1 1 auto;}
  .meta-text b{color:var(--ink);font-weight:750}
  .meta-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
    padding-top:11px;border-top:1px solid var(--line-2);}
  .stat{text-align:center}
  .stat b{display:block;font-size:19px;font-weight:850;
    letter-spacing:-.03em;color:var(--ink);line-height:1.1;
    font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;}
  .stat span{display:block;margin-top:3px;font-size:9.5px;font-weight:800;
    letter-spacing:.1em;text-transform:uppercase;color:var(--faint);}

  /* ============ ACCORDION STACK ============ */
  .stack{display:flex;flex-direction:column;gap:10px}
  .acc{background:var(--card);border:1px solid var(--line);border-radius:16px;
    overflow:hidden;transition:border-color .2s ease,box-shadow .2s ease;}
  .acc.open{border-color:var(--orange-line);
    box-shadow:0 4px 18px -6px rgba(255,90,31,.22);}
  .acc.has-items .acc-sub{color:var(--green);font-weight:650}
  .acc-head{width:100%;display:flex;align-items:center;gap:12px;
    padding:13px 15px;background:transparent;border:0;text-align:left;
    -webkit-tap-highlight-color:transparent;transition:background .15s;}
  .acc-head:active{background:#FAFBFC}
  .sec-thumb{width:48px;height:48px;flex:0 0 auto;border-radius:11px;
    background:var(--orange-soft);color:var(--orange);
    display:grid;place-items:center;font-size:17px;font-weight:850;
    letter-spacing:-.02em;position:relative;}
  .sec-thumb.plain{background:#F0F1F4;color:var(--faint);}
  .sec-thumb .count{position:absolute;bottom:3px;right:3px;
    background:rgba(15,15,18,.72);color:#fff;font-size:9px;font-weight:800;
    padding:1.5px 5px;border-radius:4px;line-height:1;}
  .acc-title{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .acc-title b{font-size:15px;font-weight:750;letter-spacing:-.015em;
    color:var(--ink);line-height:1.25;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;}
  .acc-sub{font-size:11.5px;color:var(--faint);line-height:1.3;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:550;}
  .vis-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;
    background:var(--orange);box-shadow:0 0 0 3px var(--orange-soft);}
  .vis-dot.green{background:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
  .vis-dot.off{background:#D3D7DE;box-shadow:none}
  .acc-body{display:grid;grid-template-rows:0fr;
    transition:grid-template-rows .32s cubic-bezier(.4,0,.2,1);}
  .acc.open .acc-body{grid-template-rows:1fr}
  .acc-inner{overflow:hidden;min-height:0}
  .module{padding:2px 15px 18px}

  /* ============ ADDRESS ROW (90px thumbnail) ============ */
  .addr-row{display:flex;gap:12px;padding:12px;background:#FAFBFC;
    border:1px solid var(--line-2);border-radius:12px;margin-bottom:8px;
    align-items:flex-start;}
  .addr-row:last-child{margin-bottom:0}

  .addr-thumb{width:90px;height:90px;flex:0 0 auto;border-radius:14px;
    background:linear-gradient(145deg,#FFF3EC,#FFE2D2);color:var(--orange);
    display:grid;place-items:center;font-size:34px;font-weight:850;
    letter-spacing:-.03em;overflow:hidden;position:relative;}

  .addr-body{flex:1 1 auto;min-width:0;
    display:flex;flex-direction:column;gap:4px;}
  .addr-title{font-size:14px;font-weight:750;letter-spacing:-.01em;
    color:var(--ink);line-height:1.3;word-break:break-word;}
  .addr-sub{font-size:11.5px;color:var(--faint);font-weight:550;
    line-height:1.4;word-break:break-word;}
  .addr-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}

  .mini-btn{height:32px;padding:0 12px;border-radius:9px;
    border:1px solid var(--line);background:#fff;color:var(--ink-2);
    font-size:11.5px;font-weight:750;display:inline-flex;
    align-items:center;justify-content:center;
    -webkit-tap-highlight-color:transparent;
    transition:background .15s,border-color .15s,color .15s;}
  .mini-btn:active{background:#F4F5F7}
  .mini-btn.danger{color:var(--red);border-color:#FECACA;background:#FEF2F2;}
  .mini-btn.danger:active{background:var(--red-soft)}

  /* Add address dashed button */
  .add-addr-btn{display:flex;align-items:center;justify-content:center;
    width:100%;height:44px;border-radius:11px;
    border:1.5px dashed #D3D7DE;background:#fff;color:var(--orange);
    font-size:13.5px;font-weight:750;margin-top:10px;
    -webkit-tap-highlight-color:transparent;
    transition:background .15s,border-color .15s;}
  .add-addr-btn:active{background:var(--orange-soft);border-color:var(--orange-line)}

  /* ============ FORM FIELDS ============ */
  .field{margin-bottom:14px}
  .field:last-child{margin-bottom:0}
  .field > label{display:block;font-size:11.5px;font-weight:800;
    letter-spacing:.09em;text-transform:uppercase;color:var(--muted);
    margin-bottom:7px;}
  .field input,
  .field select{
    width:100%;border:1px solid var(--line);border-radius:11px;
    background:#fff;color:var(--ink);font-size:15px;line-height:1.4;
    padding:13px;outline:none;
    transition:border-color .15s,box-shadow .15s;
    -webkit-appearance:none;appearance:none;font-family:inherit;}
  .field input:focus,
  .field select:focus{border-color:var(--orange);
    box-shadow:0 0 0 3px rgba(255,90,31,.13);}
  .field input::placeholder{color:#B7BDC6}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:400px){.grid2{grid-template-columns:1fr}}

  /* Save / Cancel buttons */
  .form-actions{display:flex;gap:9px;margin-top:16px;}
  .form-actions .btn{flex:1;height:52px;border-radius:13px;
    font-size:15px;font-weight:750;letter-spacing:-.01em;border:0;
    display:inline-flex;align-items:center;justify-content:center;
    -webkit-tap-highlight-color:transparent;
    transition:transform .1s ease,background .15s;}
  .form-actions .btn:active{transform:scale(.98)}
  .btn-save{background:linear-gradient(145deg,var(--orange-2),var(--orange));
    color:#fff;box-shadow:0 6px 18px -6px rgba(255,90,31,.5);}
  .btn-save:active{background:var(--orange)}
  .btn-cancel{background:#F4F5F7;border:1px solid var(--line)!important;
    color:var(--ink-2);}
  .btn-cancel:active{background:#EBEDF0}

  /* ============ EMPTY ============ */
  .empty-note{font-size:12.5px;color:var(--faint);text-align:center;
    padding:22px 16px;border:1.5px dashed #DCE0E6;border-radius:11px;
    background:#FAFBFC;line-height:1.55;}
  .empty-note b{color:var(--ink-2);font-weight:750}

  /* ============ TOAST ============ */
  .toast{position:fixed;left:50%;z-index:200;
    bottom:calc(28px + env(safe-area-inset-bottom));
    transform:translate(-50%,10px);background:var(--ink);color:#fff;
    font-size:13.5px;font-weight:650;padding:12px 18px;border-radius:999px;
    max-width:88vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    opacity:0;pointer-events:none;
    transition:opacity .2s ease,transform .2s ease;}
  .toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body data-page="eatouts-addresses">
<div id="shell">

  <header class="topbar">
    <div class="topbar-row">
      <a class="brand" href="index.html">
        <span class="mark">E</span><span class="word">EatOuts</span>
      </a>
      <span class="hdr-chip">Addresses</span>
    </div>
    <div class="progress">
      <div class="progress-top">
        <span class="progress-label">Address book</span>
        <span class="progress-count" id="progressCount">—</span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
  </header>

  <div class="scroll" id="scroll">
    <section class="intro">
      <h1>Your <em>addresses</em>.</h1>
      <p>Saved drop-off points for fast delivery auto-fill across EatOuts.</p>
    </section>
    <main class="sheet" id="app"></main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script src="js/eatouts-manager-db.js"></script>
<script src="assets/data/demo/the-food-place/demo-data.js"></script>
<script src="js/eatouts-manager-seed.js"></script>
<script src="js/eatouts-roles.js"></script>
<script src="js/eatouts-users.js"></script>
<script src="js/eatouts-feedback.js"></script>
<script src="js/eatouts-blog-admin.js"></script>
<script src="js/eatouts-auth.js"></script>
<script src="botswana_locations.js"></script>
<script src="js/eatouts-locations.js"></script>
<script src="js/eatouts-audit.js"></script>
<script src="js/eatouts-customer.js"></script>
<script src="js/eatouts-manager.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {

  /* ---- Auth guard (unchanged) ---- */
  if (!EO.guard({"roles":["customer"]})) return;

  var L = window.EatoutsLocations;
  var C = window.EatoutsCustomer;
  var u = (C && C.getUser && C.getUser()) || EO.currentUser();

  /* ============================================================
     HELPERS
     ============================================================ */
  function esc(v){
    return String(v == null ? "" : v)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }
  function escapeAttr(v){ return esc(v).replace(/`/g,"&#96;"); }
  function cssEscape(s){ return String(s).replace(/["\\]/g, '\\$&'); }

  var toastEl = document.getElementById("toast");
  var toastTimer = null;
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove("show"); }, 2000);
  }

  function opts(list, cur, ph){
    var o = [{ value:"", label: ph }].concat(list || []);
    if (cur && !o.some(function(x){ return String(x.value) === String(cur); })){
      o.splice(1, 0, { value: cur, label: cur });
    }
    return o;
  }
  function list(){ return (C && C.addresses) ? C.addresses.list() : []; }

  /* ============================================================
     ACCORDION STATE
     ============================================================ */
  var OPEN = null;
  var editing = null;

  /* ============================================================
     SECTION SUBTITLES
     ============================================================ */
  function listSub(){
    var arr = list();
    if (!arr.length) return "No saved addresses yet";
    if (arr.length === 1) return "1 saved · " + (arr[0].label || "Address");
    if (arr.length <= 3){
      return arr.length + " saved · " + arr.map(function(x){ return x.label || "Address"; }).join(", ");
    }
    return arr.length + " saved · " + arr.slice(0, 2).map(function(x){ return x.label; }).join(", ") + " +" + (arr.length - 2);
  }

  function formTitle(){
    return editing ? "Edit address" : "New address";
  }
  function formSub(){
    if (editing) return "Editing: " + (editing.label || "Address");
    return "Fill in the details and save";
  }

  /* ============================================================
     LIST MODULE
     ============================================================ */
  function listModule(){
    var arr = list();
    var body = '';

    if (!arr.length){
      body += '<div class="empty-note">No saved addresses yet.<br><b>Tap below</b> to add your first address.</div>';
    } else {
      body += arr.map(function(x){
        var initial = String(x.label || "?").charAt(0).toUpperCase();
        var metaBits = [];
        if (x.address) metaBits.push(esc(x.address));
        if (x.contact) metaBits.push(esc(x.contact));

        return '<div class="addr-row">' +
          '<div class="addr-thumb">' + esc(initial) + '</div>' +
          '<div class="addr-body">' +
            '<div class="addr-title">' + esc(x.label || "Address") + '</div>' +
            (x.address ? '<div class="addr-sub">' + esc(x.address) + '</div>' : '') +
            (x.contact ? '<div class="addr-sub">' + esc(x.contact) + '</div>' : '') +
            '<div class="addr-actions">' +
              '<button class="mini-btn" type="button" data-edit="' + escapeAttr(x.id) + '">Edit</button>' +
              '<button class="mini-btn danger" type="button" data-del="' + escapeAttr(x.id) + '">Delete</button>' +
            '</div>' +
          '</div>' +
        '</div>';
      }).join('');
    }

    body += '<button class="add-addr-btn" type="button" data-add>+ Add address</button>';
    return '<div class="module">' + body + '</div>';
  }

  /* ============================================================
     FORM MODULE
     ============================================================ */
  function formModule(){
    if (!L){
      return '<div class="module"><div class="empty-note">Location data unavailable.</div></div>';
    }

    var isEdit       = !!editing;
    var curLabel     = editing ? (editing.label || "") : "Home";
    var curDistrict  = editing ? (editing.district || "") : "";
    var curTown      = editing ? (editing.town || "") : "";
    var curArea      = editing ? (editing.area || "") : "";
    var curStreet    = editing ? (editing.street || "") : "";
    var curContact   = editing ? (editing.contact || "") : (u.whatsapp || "");

    var districtOpts = opts(L.districtOptions(), curDistrict, '— Select district —');
    var townOpts     = opts(L.townOptions(curDistrict), curTown, '— Select town —');
    var areaOpts     = opts(L.areaOptions(curDistrict, curTown), curArea, '— Select area —');

    function renderOpts(arr, cur){
      return arr.map(function(o){
        return '<option value="' + escapeAttr(o.value) + '"' +
          (String(o.value) === String(cur) ? ' selected' : '') + '>' +
          esc(o.label) + '</option>';
      }).join('');
    }

    return '<div class="module">' +
      '<div class="field">' +
        '<label>Label</label>' +
        '<input id="ad-label" type="text" value="' + escapeAttr(curLabel) + '" placeholder="Home, Work, etc.">' +
      '</div>' +
      '<div class="grid2">' +
        '<div class="field">' +
          '<label>District</label>' +
          '<select id="ad-district">' + renderOpts(districtOpts, curDistrict) + '</select>' +
        '</div>' +
        '<div class="field">' +
          '<label>Town / city</label>' +
          '<select id="ad-town">' + renderOpts(townOpts, curTown) + '</select>' +
        '</div>' +
      '</div>' +
      '<div class="grid2">' +
        '<div class="field">' +
          '<label>Area</label>' +
          '<select id="ad-area">' + renderOpts(areaOpts, curArea) + '</select>' +
        '</div>' +
        '<div class="field">' +
          '<label>Street / plot</label>' +
          '<input id="ad-street" type="text" value="' + escapeAttr(curStreet) + '" placeholder="e.g. Plot 1234">' +
        '</div>' +
      '</div>' +
      '<div class="field">' +
        '<label>Delivery contact</label>' +
        '<input id="ad-contact" type="text" value="' + escapeAttr(curContact) + '" placeholder="+267 71 234 567">' +
      '</div>' +
      '<div class="form-actions">' +
        '<button class="btn btn-save" type="button" id="ad-save">' + (isEdit ? "Save changes" : "Save address") + '</button>' +
        '<button class="btn btn-cancel" type="button" id="ad-cancel">Cancel</button>' +
      '</div>' +
    '</div>';
  }

  /* ============================================================
     ACCORDION SECTION BUILDER
     ============================================================ */
  function section(key, letter, title, sub, body, hasItems){
    var isOpen = OPEN === key;
    var cls = 'acc' + (isOpen ? ' open' : '') + (hasItems ? ' has-items' : '');
    var countBadge = hasItems
      ? '<span class="count">' + list().length + '</span>' : '';

    return '<section class="' + cls + '" data-key="' + escapeAttr(key) + '">' +
      '<button class="acc-head" type="button" aria-expanded="' + (isOpen ? 'true' : 'false') + '">' +
        '<span class="sec-thumb' + (hasItems ? '' : ' plain') + '">' + esc(letter) + countBadge + '</span>' +
        '<span class="acc-title">' +
          '<b>' + esc(title) + '</b>' +
          '<span class="acc-sub">' + esc(sub) + '</span>' +
        '</span>' +
        '<span class="vis-dot ' + (hasItems ? 'green' : 'off') + '"></span>' +
      '</button>' +
      '<div class="acc-body"><div class="acc-inner">' + body + '</div></div>' +
    '</section>';
  }

  /* ============================================================
     META CARD + PROGRESS
     ============================================================ */
  function renderMeta(){
    var arr = list();
    var total = arr.length;
    var districts = {};
    var contactable = 0;
    arr.forEach(function(x){
      if (x.district) districts[x.district] = true;
      if (x.contact && x.contact.trim()) contactable++;
    });
    var districtCount = Object.keys(districts).length;

    var dotClass, msg;
    if (total === 0){
      dotClass = "warn";
      msg = "No addresses saved yet";
    } else {
      dotClass = "green";
      msg = "<b>" + total + "</b> saved address" + (total === 1 ? "" : "es") +
            " across " + districtCount + " district" + (districtCount === 1 ? "" : "s");
    }

    return '<div class="meta-card">' +
      '<div class="meta-row">' +
        '<span class="meta-dot ' + dotClass + '"></span>' +
        '<span class="meta-text">' + msg + '</span>' +
      '</div>' +
      '<div class="meta-stats">' +
        '<div class="stat"><b>' + total + '</b><span>Saved</span></div>' +
        '<div class="stat"><b>' + districtCount + '</b><span>Districts</span></div>' +
        '<div class="stat"><b>' + contactable + '</b><span>Contactable</span></div>' +
      '</div>' +
    '</div>';
  }

  function updateProgress(){
    var total = list().length;
    var pct = total ? Math.min(100, Math.round((total / 5) * 100)) : 0;
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('progressCount').textContent =
      total + ' saved address' + (total === 1 ? '' : 'es');
  }

  /* ============================================================
     MAIN RENDER
     ============================================================ */
  var mount = document.getElementById('app');

  function render(){
    mount.innerHTML =
      renderMeta() +
      '<div class="stack">' +
        section('list', 'A', 'Saved addresses', listSub(), listModule(), list().length > 0) +
        section('form', 'N', formTitle(),        formSub(), formModule(), false) +
      '</div>';
    updateProgress();
    wireForm();
  }

  /* ============================================================
     ACCORDION BEHAVIOUR — only one open at a time
     ============================================================ */
  function toggleAccordion(key){
    OPEN = (OPEN === key) ? null : key;
    var accs = mount.querySelectorAll('.acc');
    for (var i = 0; i < accs.length; i++){
      var acc = accs[i];
      var isOpen = acc.getAttribute('data-key') === OPEN;
      acc.classList.toggle('open', isOpen);
      var head = acc.querySelector('.acc-head');
      if (head) head.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    }
    if (OPEN){
      var opened = mount.querySelector('.acc[data-key="' + cssEscape(OPEN) + '"]');
      if (opened){
        setTimeout(function(){
          try { opened.scrollIntoView({ behavior:'smooth', block:'start' }); } catch (e) {}
        }, 320);
      }
    }
  }

  /* ============================================================
     FORM WIRING — cascade + save/cancel
     ============================================================ */
  function wireForm(){
    var d = document.getElementById('ad-district');
    var t = document.getElementById('ad-town');
    var a = document.getElementById('ad-area');
    var saveBtn = document.getElementById('ad-save');
    var cancelBtn = document.getElementById('ad-cancel');

    if (!d || !t || !a || !saveBtn || !cancelBtn) return;

    function fillTowns(){
      t.innerHTML = opts(L.townOptions(d.value), '', '— Select town —').map(function(o){
        return '<option value="' + escapeAttr(o.value) + '">' + esc(o.label) + '</option>';
      }).join('');
      fillAreas();
    }
    function fillAreas(){
      a.innerHTML = opts(L.areaOptions(d.value, t.value), '', '— Select area —').map(function(o){
        return '<option value="' + escapeAttr(o.value) + '">' + esc(o.label) + '</option>';
      }).join('');
    }

    d.onchange = function(){
      if (editing){ editing.town = ''; editing.area = ''; }
      fillTowns();
    };
    t.onchange = function(){
      if (editing){ editing.area = ''; }
      fillAreas();
    };

    saveBtn.onclick = function(){
      if (!d.value){ toast('Choose a district'); return; }
      if (!t.value){ toast('Choose a town'); return; }

      var dd = (L.allDistricts() || []).find(function(x){
        return String(x.code) === String(d.value);
      }) || {};

      var street = document.getElementById('ad-street').value.trim();
      var area = a.value === 'Other / not listed' ? '' : a.value;
      var addr = [street, area, t.value, dd.name].filter(Boolean).join(', ');
      var isEdit = !!editing;
      var before = isEdit ? { label: editing.label, address: editing.address } : null;

      var entry = {
        id: isEdit ? editing.id : undefined,
        label: document.getElementById('ad-label').value.trim() || "Address",
        district: d.value,
        districtName: dd.name || '',
        town: t.value,
        area: area,
        street: street,
        address: addr,
        contact: document.getElementById('ad-contact').value.trim()
      };

      if (C && C.addresses) C.addresses.save(entry);

      if (window.EatoutsAudit){
        try {
          EatoutsAudit.log(
            isEdit ? "address.edit" : "address.create",
            entry.id || addr,
            { label: entry.label, address: addr },
            before
          );
        } catch (_) {}
      }

      editing = null;
      OPEN = 'list';
      render();
      toast(isEdit ? 'Address updated' : 'Address saved');
    };

    cancelBtn.onclick = function(){
      editing = null;
      OPEN = 'list';
      render();
    };
  }

  /* ============================================================
     CLICK DELEGATION
     ============================================================ */
  mount.addEventListener('click', function(e){

    /* Edit address */
    var ed = e.target.closest('[data-edit]');
    if (ed){
      e.stopPropagation();
      var id = ed.getAttribute('data-edit');
      var addr = list().find(function(x){ return String(x.id) === String(id); });
      if (addr){
        editing = JSON.parse(JSON.stringify(addr));
        OPEN = 'form';
        render();
      }
      return;
    }

    /* Delete address */
    var del = e.target.closest('[data-del]');
    if (del){
      e.stopPropagation();
      var did = del.getAttribute('data-del');
      if (!EO.confirm("Delete this saved address?")) return;
      var before = list().find(function(x){ return String(x.id) === String(did); });
      if (C && C.addresses) C.addresses.remove(did);
      if (window.EatoutsAudit){
        try {
          EatoutsAudit.log(
            "address.delete",
            did,
            before ? { label: before.label, address: before.address } : null,
            null
          );
        } catch (_) {}
      }
      render();
      return;
    }

    /* Add address — opens form with editing=null */
    var addBtn = e.target.closest('[data-add]');
    if (addBtn){
      e.stopPropagation();
      editing = null;
      OPEN = 'form';
      render();
      return;
    }

    /* Accordion header (last, so inner buttons work) */
    var head = e.target.closest('.acc-head');
    if (head){
      var acc = head.closest('.acc');
      if (acc) toggleAccordion(acc.getAttribute('data-key'));
      return;
    }
  });

  /* ============================================================
     BOOT
     ============================================================ */
  render();

  /* Refresh from server, then re-render if data arrives */
  if (C && C.addresses){
    try {
      C.addresses.pull().then(render).catch(function(){});
    } catch (_) {}
  }
});
</script>
</body>
</html>
