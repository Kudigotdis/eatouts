<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Restaurant Cards — Redesign Demo</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }

  :root{
    --bg:      #f5f6f8;
    --card:    #ffffff;
    --ink:     #111827;
    --muted:   #6b7280;
    --line:    #e6e8ec;
    --accent:  #e11d2e;
    --wa:      #25d366;
  }

  html, body { height: 100%; }

  body{
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 20px;
    background: radial-gradient(1200px 600px at 50% -10%, #1e2636, #0a0d13 70%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ============================== PHONE SHELL ============================== */
  .phone{
    position: relative;
    width: 390px;
    height: min(844px, calc(100vh - 40px));
    background: var(--bg);
    border-radius: 44px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow:
      0 0 0 10px #11151d,
      0 0 0 12px #2a3140,
      0 30px 70px rgba(0,0,0,.65);
  }

  .statusbar{
    flex: 0 0 auto;
    height: 46px;
    padding: 14px 26px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
  }
  .sb-dots{ letter-spacing: 2px; opacity: .55; }

  .screen{
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 4px 16px 28px;
  }

  .appbar{ padding: 6px 2px 16px; }
  .appbar h1{
    margin: 0;
    font-size: 26px;
    line-height: 1.15;
    letter-spacing: -.4px;
    color: var(--ink);
  }
  .appbar p{
    margin: 6px 0 0;
    font-size: 13.5px;
    color: var(--muted);
  }

  /* ============================== CARDS ============================== */
  .cards{ display: flex; flex-direction: column; gap: 14px; }

  .ritem{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(16,24,40,.05), 0 10px 26px rgba(16,24,40,.06);
    transition: box-shadow .25s ease, border-color .25s ease;
  }
  .ritem.open{
    border-color: #dfe3e9;
    box-shadow: 0 2px 4px rgba(16,24,40,.06), 0 18px 40px rgba(16,24,40,.10);
  }

  /* --- header row (tap to toggle) --- */
  .rrow{
    width: 100%;
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 13px 14px;
    background: none;
    border: 0;
    font: inherit;
    color: inherit;
    text-align: left;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .rrow:active{ background: #fafbfc; }

  .rthumb{
    flex: 0 0 auto;
    width: 54px; height: 54px;
    border-radius: 15px;
    background: var(--brand, #333);
    display: grid;
    place-items: center;
    color: #fff;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: .3px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.16);
  }
  .rthumb.big{ font-size: 20px; }

  .rinfo{ flex: 1 1 auto; min-width: 0; }
  .rname{
    font-size: 16.5px;
    font-weight: 700;
    letter-spacing: -.2px;
    color: var(--ink);
  }
  .rmeta{
    margin-top: 3px;
    font-size: 13px;
    color: var(--muted);
  }

  /* --- accordion body --- */
  .acc-wrap{
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows .32s cubic-bezier(.4,0,.2,1);
  }
  .ritem.open .acc-wrap{ grid-template-rows: 1fr; }

  .acc-in{ overflow: hidden; min-height: 0; }

  .ropts{
    display: flex;
    flex-direction: column;
    gap: 9px;
    padding: 2px 14px 16px;
    opacity: 0;
    transform: translateY(-6px);
    transition: opacity .25s ease .05s, transform .25s ease .05s;
  }
  .ritem.open .ropts{ opacity: 1; transform: none; }

  /* ============================== THE 5 ROWS ============================== */
  .line{
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    min-height: 48px;
    padding: 0 14px;
    border-radius: 14px;
    border: 1px solid var(--line);
    background: #fbfbfc;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font: inherit;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: .1px;
    color: var(--muted);
    cursor: pointer;
    transition: background .16s, border-color .16s, color .16s, transform .08s;
    -webkit-tap-highlight-color: transparent;
  }
  .line:active{ transform: scale(.985); }

  /* rows 1 & 2 — selectors */
  .line-select.is-set{
    color: var(--ink);
    background: #fff;
    border-color: #cfd6df;
  }

  /* rows 3 & 4 — actions */
  .line-action{
    background: #fff;
    color: var(--ink);
    border-color: #dfe3e9;
  }
  .line-action.is-disabled{
    color: #aab1bb;
    background: #f3f4f6;
    border-color: #ebedf1;
  }

  /* row 5 — icons */
  .icon-row{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding-top: 3px;
  }
  .ico-btn{
    -webkit-appearance: none;
    appearance: none;
    width: 54px; height: 54px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: #fff;
    display: grid;
    place-items: center;
    cursor: pointer;
    color: #8b929d;
    transition: transform .1s, background .18s, border-color .18s, color .18s;
    -webkit-tap-highlight-color: transparent;
  }
  .ico-btn:active{ transform: scale(.93); }
  .ico-btn svg{ width: 25px; height: 25px; display: block; }

  .ico-heart path{
    fill: none;
    stroke: currentColor;
    stroke-width: 1.9;
    stroke-linejoin: round;
  }
  .ico-btn.is-on{
    color: #e11d48;
    border-color: #f6c9d5;
    background: #fff5f7;
  }
  .ico-btn.is-on .ico-heart path{ fill: #e11d48; stroke: #e11d48; }

  .ico-wa path{ fill: var(--wa); }

  /* ============================== SCRIM ============================== */
  .scrim{
    position: absolute;
    inset: 0;
    z-index: 40;
    background: rgba(9,13,20,.48);
    backdrop-filter: blur(1.5px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .22s ease;
  }
  .scrim.show{ opacity: 1; pointer-events: auto; }

  /* ============================== FLOATING OVERLAY ============================== */
  .overlay{
    position: absolute;
    inset: 0;
    z-index: 50;
    display: grid;
    place-items: center;
    padding: 30px 24px;
    pointer-events: none;
  }
  .overlay.show{ pointer-events: auto; }

  .popup{ display: none; }

  @keyframes popIn{
    from{ opacity: 0; transform: scale(.9) translateY(10px); }
    to  { opacity: 1; transform: scale(1) translateY(0); }
  }
  .popup.show{
    display: flex;
    flex-direction: column;
    animation: popIn .24s cubic-bezier(.34,1.4,.64,1) both;
  }

  /* --- floating alert dialog --- */
  .popup-alert{
    width: 100%;
    max-width: 316px;
    background: #fff;
    border-radius: 24px;
    padding: 24px 22px 18px;
    text-align: center;
    box-shadow: 0 28px 64px rgba(0,0,0,.34), 0 2px 6px rgba(0,0,0,.08);
  }

  .popup-icon{
    width: 50px; height: 50px;
    margin: 0 auto 14px;
    border-radius: 50%;
    background: #fdecef;
    display: grid;
    place-items: center;
    color: var(--accent);
    font-size: 22px;
    font-weight: 800;
  }

  .popup-title{
    margin: 0;
    font-size: 17.5px;
    font-weight: 700;
    letter-spacing: -.2px;
    color: var(--ink);
  }

  .popup-msg{
    margin: 9px 0 0;
    font-size: 14px;
    line-height: 1.55;
    color: var(--muted);
    white-space: pre-line;
  }

  .popup-actions{
    margin-top: 20px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .dlg-btn{
    width: 100%;
    min-height: 47px;
    border-radius: 14px;
    border: 1px solid var(--line);
    background: #fff;
    font: inherit;
    font-size: 15px;
    font-weight: 600;
    color: var(--ink);
    cursor: pointer;
    transition: transform .08s, background .16s;
    -webkit-tap-highlight-color: transparent;
  }
  .dlg-btn:active{ transform: scale(.985); }
  .dlg-btn.primary{
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 8px 18px rgba(225,29,46,.26);
  }

  /* --- floating list picker --- */
  .popup-list{
    width: 100%;
    max-width: 330px;
    max-height: 100%;
    background: #fff;
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 28px 64px rgba(0,0,0,.34), 0 2px 6px rgba(0,0,0,.08);
  }

  .popup-head{
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 17px 14px 14px 20px;
    border-bottom: 1px solid var(--line);
  }
  .popup-head .popup-title{ font-size: 16.5px; }

  .popup-x{
    flex: 0 0 auto;
    width: 32px; height: 32px;
    border-radius: 50%;
    border: 0;
    background: #f2f3f5;
    color: #6b7280;
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .popup-x:active{ background: #e8eaee; }

  .popup-body{
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 6px 0 8px;
  }

  .opt{
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 20px;
    border: 0;
    background: none;
    font: inherit;
    font-size: 15.5px;
    color: var(--ink);
    text-align: left;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .opt:active{ background: #f6f7f9; }
  .opt.is-sel{ color: var(--accent); font-weight: 700; }
  .opt .tick{ font-weight: 800; color: var(--accent); }

  /* ============================== TOAST ============================== */
  .toast{
    position: absolute;
    left: 50%;
    bottom: 34px;
    z-index: 60;
    max-width: 300px;
    padding: 11px 18px;
    border-radius: 999px;
    background: rgba(17,24,39,.94);
    color: #fff;
    font-size: 13.5px;
    font-weight: 500;
    text-align: center;
    transform: translate(-50%, 18px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .22s ease, transform .22s ease;
  }
  .toast.show{ opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>

<div class="phone">

<script>
(function () {
  "use strict";

  /* =========================================================
     HARD-CODED DEMO DATA
     ========================================================= */
  const TOWNS = [
    {
      name: "Gaborone",
      neighbourhoods: [
        "Phakalane","Block 5","Block 9","Gaborone North","Extension 9",
        "Extension 11","The Village","Maru-a-Pula","Broadhurst","Old Naledi"
      ]
    },
    {
      name: "Francistown",
      neighbourhoods: [
        "Selepa","Gerald Estates","Monarch","Donga","Satellite",
        "Molapo Estates","Bluetown","Somerset East","Minestone","Area W"
      ]
    },
    {
      name: "Maun",
      neighbourhoods: [
        "Matlapana","Disaneng","Boseja","Sedie","Airport Area",
        "Wenela","Borolong","Matshwane","Boyei","Kubung"
      ]
    }
  ];

  const RESTAURANTS = {
    kfc:    { name: "KFC"     },
    nandos: { name: "Nando's" }
  };

  const MENU = {
    kfc: [
      "Streetwise 2 — P49.90",
      "Zinger Burger — P54.90",
      "Dunked Wings (6) — P59.90",
      "Krushers — P24.90"
    ],
    nandos: [
      "1/4 Peri-Peri Chicken — P79.00",
      "Chicken Wrap — P64.00",
      "Full Platter — P329.00",
      "Spicy Rice — P25.00"
    ]
  };

  /* KFC has promos → demonstrates the promo list.
     Nando's has none → demonstrates the "no promotions" popup. */
  const PROMOS = {
    kfc: [
      { title: "Streetwise 2 Tuesday", detail: "2 pieces + chips + roll — P49.90" },
      { title: "Family Feast",         detail: "9 pieces + 2 large chips — P199.00" }
    ],
    nandos: []
  };

  /* =========================================================
     STATE — both cards start with nothing selected
     ========================================================= */
  const state = {
    kfc:    { town: "", area: "", fav: false },
    nandos: { town: "", area: "", fav: false }
  };

  /* =========================================================
     DOM
     ========================================================= */
  const cardsWrap  = document.querySelector(".cards");
  const scrim      = document.getElementById("scrim");
  const overlay    = document.getElementById("overlay");

  const popupAlert = document.getElementById("popupAlert");
  const alertIcon  = document.getElementById("alertIcon");
  const alertTitle = document.getElementById("alertTitle");
  const alertMsg   = document.getElementById("alertMsg");
  const alertActs  = document.getElementById("alertActions");

  const popupList  = document.getElementById("popupList");
  const listTitle  = document.getElementById("listTitle");
  const listBody   = document.getElementById("listBody");
  const listClose  = document.getElementById("listClose");

  const toastEl    = document.getElementById("toast");

  const cardEl = (id) => cardsWrap.querySelector('.ritem[data-id="' + id + '"]');

  /* =========================================================
     RENDER A CARD
     ========================================================= */
  function render(id) {
    const card = cardEl(id);
    if (!card) return;

    const s = state[id];

    const townRow = card.querySelector('[data-act="pickTown"]');
    const areaRow = card.querySelector('[data-act="pickArea"]');
    const townLbl = townRow.querySelector(".lbl");
    const areaLbl = areaRow.querySelector(".lbl");

    /* Row 1 — Town / City */
    townLbl.textContent = s.town || "Select Town / City";
    townRow.classList.toggle("is-set", !!s.town);

    /* Row 2 — Neighbourhood */
    areaLbl.textContent = s.area || "Select Neighbourhood";
    areaRow.classList.toggle("is-set", !!s.area);

    /* Rows 3 & 4 — deactivated until BOTH are set */
    const ready = !!(s.town && s.area);
    ["openMenu", "openPromos"].forEach(function (act) {
      const btn = card.querySelector('[data-act="' + act + '"]');
      btn.classList.toggle("is-disabled", !ready);
      btn.setAttribute("aria-disabled", String(!ready));
    });

    /* Row 5 — heart */
    const favBtn = card.querySelector('[data-act="fav"]');
    favBtn.classList.toggle("is-on", s.fav);
    favBtn.setAttribute("aria-pressed", String(s.fav));
  }

  /* =========================================================
     LAYER CONTROL — all popups are floating + centered
     ========================================================= */
  function syncScrim() {
    const anyOpen =
      popupAlert.classList.contains("show") ||
      popupList.classList.contains("show");

    scrim.classList.toggle("show", anyOpen);
    overlay.classList.toggle("show", anyOpen);
  }

  function closeAll() {
    popupAlert.classList.remove("show");
    popupList.classList.remove("show");
    syncScrim();
  }

  /* ---------- floating alert dialog ---------- */
  function showAlert(opts) {
    const actions = opts.actions || [{ label: "OK", primary: true }];

    alertIcon.textContent  = opts.icon || "!";
    alertTitle.textContent = opts.title || "";
    alertMsg.textContent   = opts.message || "";
    alertActs.innerHTML    = "";

    actions.forEach(function (a) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "dlg-btn" + (a.primary ? " primary" : "");
      btn.textContent = a.label;

      btn.addEventListener("click", function () {
        closeAll();
        if (typeof a.onClick === "function") {
          setTimeout(a.onClick, 70);   // let the popup finish closing first
        }
      });

      alertActs.appendChild(btn);
    });

    popupList.classList.remove("show");
    popupAlert.classList.add("show");
    syncScrim();
  }

  /* ---------- floating list picker ---------- */
  function showList(title, options, selected, onPick) {
    listTitle.textContent = title;
    listBody.innerHTML = "";

    options.forEach(function (opt) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "opt" + (opt === selected ? " is-sel" : "");

      const label = document.createElement("span");
      label.textContent = opt;
      btn.appendChild(label);

      const tick = document.createElement("span");
      tick.className = "tick";
      tick.textContent = opt === selected ? "✓" : "";
      btn.appendChild(tick);

      btn.addEventListener("click", function () {
        closeAll();
        onPick(opt);
      });

      listBody.appendChild(btn);
    });

    popupAlert.classList.remove("show");
    popupList.classList.add("show");
    syncScrim();
  }

  /* ---------- toast ---------- */
  let toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toastEl.classList.remove("show");
    }, 2200);
  }

  /* =========================================================
     LOCATION GUARD
     ========================================================= */
  function requireLocation(id, onReady) {
    const s    = state[id];
    const name = RESTAURANTS[id].name;

    if (!s.town) {
      showAlert({
        title: "Select a Town / City",
        message:
          "Choose a Town / City for " + name + " first — the menu, promos and " +
          "contact details all depend on the location.",
        actions: [
          { label: "Select Town / City", primary: true,
            onClick: function () { openTownPicker(id); } },
          { label: "Not now" }
        ]
      });
      return;
    }

    if (!s.area) {
      showAlert({
        title: "Select a Neighbourhood",
        message: "Now choose a Neighbourhood in " + s.town + " to continue.",
        actions: [
          { label: "Select Neighbourhood", primary: true,
            onClick: function () { openAreaPicker(id); } },
          { label: "Not now" }
        ]
      });
      return;
    }

    onReady();
  }

  /* =========================================================
     PICKERS
     ========================================================= */
  function openTownPicker(id) {
    const s = state[id];

    showList(
      "Select Town / City",
      TOWNS.map(function (t) { return t.name; }),
      s.town,
      function (val) {
        s.town = val;
        s.area = "";                 // neighbourhood resets when town changes
        render(id);
        toast(RESTAURANTS[id].name + " · " + val + " selected");
      }
    );
  }

  function openAreaPicker(id) {
    const s = state[id];

    /* Neighbourhood depends on the town — guard it */
    if (!s.town) {
      showAlert({
        title: "Select a Town / City first",
        message:
          "Please choose a Town / City before selecting a Neighbourhood — " +
          "neighbourhoods are listed per town.",
        actions: [
          { label: "Select Town / City", primary: true,
            onClick: function () { openTownPicker(id); } },
          { label: "Not now" }
        ]
      });
      return;
    }

    const town = TOWNS.find(function (t) { return t.name === s.town; });

    showList(
      "Neighbourhood in " + s.town,
      town.neighbourhoods,
      s.area,
      function (val) {
        s.area = val;
        render(id);
        toast(RESTAURANTS[id].name + " · " + val + ", " + s.town);
      }
    );
  }

  /* =========================================================
     ACTIONS
     ========================================================= */
  function openMenu(id) {
    requireLocation(id, function () {
      const s     = state[id];
      const name  = RESTAURANTS[id].name;
      const items = MENU[id] || [];

      showAlert({
        icon: "☰",
        title: name + " Menu",
        message:
          s.area + ", " + s.town + "\n\n" +
          items.map(function (i) { return "• " + i; }).join("\n"),
        actions: [{ label: "Close", primary: true }]
      });
    });
  }

  function openPromos(id) {
    requireLocation(id, function () {
      const list = PROMOS[id] || [];

      /* No promos → dedicated floating popup */
      if (!list.length) {
        showAlert({
          icon: "%",
          title: "Promos",
          message: "There are currently no promotions on offer.",
          actions: [{ label: "OK", primary: true }]
        });
        return;
      }

      showAlert({
        icon: "%",
        title: RESTAURANTS[id].name + " Promos",
        message: list.map(function (p) {
          return p.title + "\n" + p.detail;
        }).join("\n\n"),
        actions: [{ label: "Close", primary: true }]
      });
    });
  }

  function openWhatsApp(id) {
    requireLocation(id, function () {
      const s    = state[id];
      const name = RESTAURANTS[id].name;

      showAlert({
        icon: "✆",
        title: "WhatsApp",
        message:
          "Share " + name + " with a friend, or contact the " + name +
          " branch in " + s.area + ", " + s.town + ".",
        actions: [
          { label: "Share via WhatsApp", primary: true, onClick: function () {
              toast("Opening WhatsApp to share " + name + "…");
          }},
          { label: "Contact restaurant", onClick: function () {
              toast("Opening chat with " + name + " · " + s.area + "…");
          }},
          { label: "Cancel" }
        ]
      });
    });
  }

  function toggleFav(id) {
    state[id].fav = !state[id].fav;
    render(id);
    toast(
      state[id].fav
        ? RESTAURANTS[id].name + " added to favourites"
        : RESTAURANTS[id].name + " removed from favourites"
    );
  }

  /* =========================================================
     EVENTS
     ========================================================= */
  cardsWrap.addEventListener("click", function (e) {
    const btn = e.target.closest("[data-act]");
    if (!btn) return;

    const card = btn.closest(".ritem");
    if (!card) return;

    const id  = card.dataset.id;
    const act = btn.dataset.act;

    switch (act) {
      case "toggle":
        card.classList.toggle("open");
        btn.setAttribute("aria-expanded", String(card.classList.contains("open")));
        break;
      case "pickTown":   openTownPicker(id); break;
      case "pickArea":   openAreaPicker(id); break;
      case "openMenu":   openMenu(id);       break;
      case "openPromos": openPromos(id);     break;
      case "fav":        toggleFav(id);      break;
      case "wa":         openWhatsApp(id);   break;
    }
  });

  listClose.addEventListener("click", closeAll);
  scrim.addEventListener("click", closeAll);

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closeAll();
  });

  /* =========================================================
     INIT — both cards closed, nothing selected
     ========================================================= */
  Object.keys(state).forEach(render);
})();
</script>
</body>
</html>
