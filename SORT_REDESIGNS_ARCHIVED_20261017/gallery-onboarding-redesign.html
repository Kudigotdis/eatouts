<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#141418">
<title>Gallery · EatOuts</title>
<style>
  *,*::before,*::after{box-sizing:border-box}
  :root{
    --ink:#0F0F12;
    --ink-2:#2A2A30;
    --ink-3:#4A4A52;
    --paper:#F4F5F7;
    --card:#FFFFFF;
    --line:#E6E8EC;
    --line-2:#F0F1F4;
    --orange:#FF5A1F;
    --orange-2:#FF7A42;
    --orange-soft:#FFEDE4;
    --orange-line:#FFD5C2;
    --green:#16A34A;
    --green-soft:#E7F7EE;
    --red:#DC2626;
    --red-soft:#FEE2E2;
    --amber:#B45309;
    --amber-soft:#FEF3C7;
    --blue:#0284C7;
    --blue-soft:#E0F2FE;
    --muted:#6B7280;
    --faint:#9AA1AC;
  }
  html,body{height:100%}
  body{
    margin:0;
    background:#E9EBEF;
    color:var(--ink);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:15px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;
    display:flex;
    justify-content:center;
  }
  button,input,select,textarea{font-family:inherit}
  button{cursor:pointer}

  #shell{
    width:100%;
    max-width:460px;
    height:100vh;
    height:100dvh;
    background:var(--paper);
    display:flex;
    flex-direction:column;
    overflow:hidden;
    position:relative;
    box-shadow:0 0 70px rgba(20,20,25,.16);
  }

  /* topbar */
  .topbar{
    flex:0 0 auto;
    background:#141418;
    padding:calc(13px + env(safe-area-inset-top)) 18px 0;
  }
  .topbar-row{
    display:flex;align-items:center;gap:10px;
    padding-bottom:13px;
  }
  .brand{
    display:inline-flex;align-items:center;gap:9px;
    text-decoration:none;
  }
  .brand .mark{
    width:28px;height:28px;flex:0 0 auto;border-radius:8px;
    background:linear-gradient(145deg,var(--orange-2),var(--orange));
    color:#fff;
    display:grid;place-items:center;
    font-size:14px;font-weight:900;letter-spacing:-.03em;
    box-shadow:0 2px 10px rgba(255,90,31,.35);
  }
  .brand .word{
    color:#fff;font-size:15px;font-weight:800;
    letter-spacing:-.02em;
  }
  .hdr-chip{
    margin-left:auto;
    font-size:10px;font-weight:800;
    letter-spacing:.12em;text-transform:uppercase;
    color:var(--orange-2);
    border:1px solid rgba(255,122,66,.32);
    background:rgba(255,90,31,.1);
    border-radius:999px;
    padding:5px 11px;
    white-space:nowrap;
  }

  .progress{padding-bottom:14px}
  .progress-top{
    display:flex;align-items:baseline;justify-content:space-between;
    gap:10px;margin-bottom:8px;
  }
  .progress-label{
    font-size:11px;font-weight:800;
    letter-spacing:.14em;text-transform:uppercase;
    color:rgba(255,255,255,.5);
  }
  .progress-count{
    font-size:11.5px;font-weight:800;
    color:var(--orange-2);
    letter-spacing:.02em;
  }
  .progress-track{
    height:5px;border-radius:99px;
    background:rgba(255,255,255,.13);
    overflow:hidden;
  }
  .progress-fill{
    height:100%;width:0%;
    border-radius:99px;
    background:linear-gradient(90deg,var(--orange),var(--orange-2));
    transition:width .35s cubic-bezier(.4,0,.2,1);
  }

  /* scroll */
  .scroll{
    flex:1 1 auto;min-height:0;
    overflow-y:auto;
    overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
    scrollbar-width:none;
  }
  .scroll::-webkit-scrollbar{display:none}

  /* intro */
  .intro{
    background:linear-gradient(175deg,#141418 0%,#1B1B21 60%,#232329 100%);
    padding:4px 22px 46px;
    position:relative;
    overflow:hidden;
    text-align:center;
  }
  .intro::after{
    content:"";
    position:absolute;
    top:-80px;right:-80px;
    width:230px;height:230px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,90,31,.2),transparent 68%);
    pointer-events:none;
  }
  .intro h1{
    position:relative;
    margin:0 auto 12px;
    font-size:26px;
    line-height:1.15;
    font-weight:800;
    letter-spacing:-.03em;
    color:#fff;
    max-width:15ch;
  }
  .intro h1 em{font-style:normal;color:var(--orange-2)}
  .intro p{
    position:relative;
    margin:0 auto;
    font-size:14px;
    line-height:1.6;
    color:rgba(255,255,255,.6);
    max-width:32ch;
  }

  /* sheet */
  .sheet{
    position:relative;
    z-index:1;
    margin-top:-26px;
    background:var(--paper);
    border-radius:26px 26px 0 0;
    padding:20px 14px 30px;
  }

  /* meta card */
  .meta-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:15px 16px;
    margin-bottom:12px;
    box-shadow:0 1px 2px rgba(20,20,25,.03);
  }
  .meta-row{
    display:flex;align-items:center;gap:10px;
    margin-bottom:11px;
  }
  .meta-dot{
    width:9px;height:9px;border-radius:50%;flex:0 0 auto;
    background:var(--orange);
    box-shadow:0 0 0 3px var(--orange-soft);
  }
  .meta-dot.green{background:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
  .meta-text{
    font-size:13.5px;
    color:var(--ink-2);
    line-height:1.4;
    min-width:0;
    flex:1 1 auto;
  }
  .meta-text b{color:var(--ink);font-weight:750}
  .meta-stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    padding-top:11px;
    border-top:1px solid var(--line-2);
  }
  .stat{text-align:center}
  .stat b{
    display:block;
    font-size:19px;font-weight:850;
    letter-spacing:-.03em;
    color:var(--ink);
    line-height:1.1;
    font-variant-numeric:tabular-nums;
  }
  .stat span{
    display:block;
    margin-top:3px;
    font-size:9.5px;font-weight:800;
    letter-spacing:.1em;text-transform:uppercase;
    color:var(--faint);
  }

  /* accordion stack */
  .stack{display:flex;flex-direction:column;gap:10px}
  .acc{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    overflow:hidden;
    transition:border-color .2s ease,box-shadow .2s ease;
  }
  .acc.open{
    border-color:var(--orange-line);
    box-shadow:0 4px 18px -6px rgba(255,90,31,.22);
  }
  .acc.hidden-group{
    background:#FAFBFC;
  }
  .acc-head{
    width:100%;
    display:flex;align-items:center;gap:12px;
    padding:13px 15px;
    background:transparent;border:0;
    text-align:left;
    -webkit-tap-highlight-color:transparent;
    transition:background .15s;
  }
  .acc-head:active{background:#FAFBFC}

  .grp-thumb{
    width:48px;height:48px;flex:0 0 auto;
    border-radius:11px;
    background:#F0F1F4;
    display:grid;place-items:center;
    font-size:20px;
    color:#B7BDC6;
    overflow:hidden;
    position:relative;
  }
  .grp-thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .grp-thumb .count{
    position:absolute;
    bottom:3px;right:3px;
    background:rgba(15,15,18,.72);
    color:#fff;
    font-size:9px;
    font-weight:800;
    letter-spacing:.02em;
    padding:1.5px 5px;
    border-radius:4px;
    line-height:1;
  }
  .grp-thumb.hidden .count{background:var(--faint)}

  .acc-title{
    flex:1 1 auto;min-width:0;
    display:flex;flex-direction:column;gap:2px;
  }
  .acc-title b{
    font-size:15px;font-weight:750;
    letter-spacing:-.015em;
    color:var(--ink);
    line-height:1.25;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .acc-sub{
    font-size:11.5px;
    color:var(--faint);
    line-height:1.3;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    font-weight:550;
  }
  .acc.touched .acc-sub{color:var(--green);font-weight:650}

  .vis-dot{
    width:9px;height:9px;border-radius:50%;flex:0 0 auto;
    background:var(--green);
    box-shadow:0 0 0 3px var(--green-soft);
  }
  .vis-dot.off{
    background:#D3D7DE;
    box-shadow:none;
  }

  .acc-body{
    display:grid;
    grid-template-rows:0fr;
    transition:grid-template-rows .32s cubic-bezier(.4,0,.2,1);
  }
  .acc.open .acc-body{grid-template-rows:1fr}
  .acc-inner{overflow:hidden;min-height:0}
  .module{padding:2px 15px 18px}
  .module-note{
    font-size:12.5px;
    line-height:1.5;
    color:var(--muted);
    margin:0 0 14px;
    padding:11px 12px;
    background:#FAFBFC;
    border:1px solid var(--line-2);
    border-radius:11px;
  }
  .module-note b{color:var(--ink);font-weight:750}

  /* gallery rail */
  .gallery-rail{
    display:flex;
    gap:10px;
    overflow-x:auto;
    overflow-y:hidden;
    scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    padding:6px 2px;
    margin:0 -2px 8px;
  }
  .gallery-rail::-webkit-scrollbar{display:none}

  .gallery-tile{
    flex:0 0 calc((100% - 20px) / 3);
    max-width:120px;
    aspect-ratio:1/1;
    border-radius:14px;
    background:#F0F1F4;
    border:1px solid var(--line);
    overflow:hidden;
    position:relative;
    scroll-snap-align:start;
  }
  .gallery-tile img{
    width:100%;height:100%;
    object-fit:cover;display:block;
    pointer-events:none;
  }
  .gallery-tile.main{
    outline:3px solid rgba(255,90,31,.08);
    outline-offset:2px;
    border-color:var(--orange-line);
  }
  .gallery-tile .tile-x{
    position:absolute;
    top:6px;right:6px;
    width:26px;height:26px;
    border:0;border-radius:50%;
    background:rgba(15,15,18,.68);
    color:#fff;
    font-size:11px;font-weight:800;
    line-height:1;
    display:grid;place-items:center;
    padding:0;
    -webkit-tap-highlight-color:transparent;
  }
  .gallery-tile .tile-x:active{background:var(--red)}

  .gallery-tile.add-tile{
    border:1.5px dashed #C8CDD4;
    background:#FAFBFC;
    display:grid;place-items:center;
    color:var(--orange);
    font-size:34px;font-weight:300;line-height:1;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .gallery-tile.add-tile:active{background:var(--orange-soft);border-color:var(--orange)}
  .gallery-tile.add-tile input{display:none}

  .gallery-dots{
    display:flex;gap:6px;justify-content:center;align-items:center;
    margin-bottom:14px;min-height:6px;
  }
  .gallery-dots .dot{
    width:6px;height:6px;border-radius:50%;
    background:#D3D7DE;transition:background .2s;
  }
  .gallery-dots .dot.first{background:var(--orange)}

  /* empty note */
  .empty-note{
    font-size:12.5px;
    color:var(--faint);
    text-align:center;
    padding:18px 12px;
    border:1.5px dashed #DCE0E6;
    border-radius:11px;
    background:#FAFBFC;
    line-height:1.5;
  }

  /* action row inside accordion */
  .group-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:12px;
  }
  .act-btn{
    height:42px;
    border:1px solid var(--line);
    background:#fff;
    border-radius:11px;
    font-size:13px;
    font-weight:750;
    color:var(--ink-2);
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    -webkit-tap-highlight-color:transparent;
    transition:background .15s,border-color .15s,color .15s,transform .08s;
    padding:0 10px;
  }
  .act-btn:active{transform:scale(.98);background:#F4F5F7}
  .act-btn.primary{
    background:linear-gradient(145deg,var(--orange-2),var(--orange));
    border-color:transparent;
    color:#fff;
    box-shadow:0 4px 12px -6px rgba(255,90,31,.55);
  }
  .act-btn.primary:active{background:var(--orange)}
  .act-btn.danger{
    color:var(--red);
    border-color:#FECACA;
    background:#FEF2F2;
  }
  .act-btn.danger:active{background:var(--red-soft)}
  .act-btn.wide{
    grid-column:1 / -1;
  }

  /* move row */
  .move-row{
    display:flex;
    gap:8px;
    margin-top:8px;
  }
  .move-btn{
    flex:1 1 auto;
    height:38px;
    border:1px solid var(--line);
    background:#fff;
    border-radius:10px;
    font-size:12px;
    font-weight:750;
    color:var(--muted);
    display:inline-flex;
    align-items:center;
    justify-content:center;
    -webkit-tap-highlight-color:transparent;
    transition:background .15s,border-color .15s,color .15s;
  }
  .move-btn:active{background:#F4F5F7;color:var(--ink-2)}
  .move-btn[disabled]{
    opacity:.35;
    pointer-events:none;
  }

  /* add group button */
  .add-group-btn{
    width:100%;
    border:1.5px dashed #D3D7DE;
    background:#fff;
    border-radius:12px;
    padding:15px;
    font-size:14px;font-weight:750;
    color:var(--orange);
    -webkit-tap-highlight-color:transparent;
    transition:background .15s,border-color .15s;
    margin-top:10px;
  }
  .add-group-btn:active{background:var(--orange-soft);border-color:var(--orange-line)}

  /* info block */
  .info-block{
    background:#FAFBFC;
    border:1px solid var(--line-2);
    border-radius:12px;
    padding:13px 14px;
    margin-bottom:10px;
  }
  .info-block:last-child{margin-bottom:0}
  .info-block h4{
    margin:0 0 6px;
    font-size:13.5px;font-weight:750;
    letter-spacing:-.01em;
    color:var(--ink);
  }
  .info-block p{
    margin:0;
    font-size:12.5px;
    line-height:1.55;
    color:var(--muted);
  }
  .info-block p + p{margin-top:6px}
  .info-block b{color:var(--ink);font-weight:750}

  /* bottom action */
  .actions{
    flex:0 0 auto;
    display:flex;
    gap:9px;
    padding:11px 14px calc(11px + env(safe-area-inset-bottom));
    background:#fff;
    border-top:1px solid var(--line);
  }
  .btn{
    height:52px;
    border:0;
    border-radius:13px;
    font-family:inherit;
    font-size:15px;
    font-weight:750;
    letter-spacing:-.01em;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    text-decoration:none;
    -webkit-tap-highlight-color:transparent;
    transition:transform .1s ease,background .15s;
  }
  .btn:active{transform:scale(.98)}
  .btn-primary{
    width:100%;
    background:linear-gradient(145deg,var(--orange-2),var(--orange));
    color:#fff;
    box-shadow:0 6px 18px -6px rgba(255,90,31,.5);
  }
  .btn-primary:active{background:var(--orange)}

  /* modal */
  .modal-scrim{
    position:fixed;inset:0;z-index:100;
    background:rgba(15,15,18,.55);
    display:flex;align-items:flex-end;justify-content:center;
    animation:fade .18s ease;
  }
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @media(min-width:520px){.modal-scrim{align-items:center;padding:20px}}
  .modal{
    background:#fff;
    width:100%;max-width:460px;
    max-height:92vh;height:auto;
    border-radius:20px 20px 0 0;
    display:flex;flex-direction:column;
    overflow:hidden;
    animation:slideup .25s cubic-bezier(.4,0,.2,1);
  }
  @keyframes slideup{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
  @media(min-width:520px){
    .modal{border-radius:18px}
    @keyframes slideup{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
  }
  .modal-hdr{
    padding:14px 18px;
    border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:12px;
    background:#fff;
    flex:0 0 auto;
  }
  .modal-hdr h3{
    margin:0;flex:1;
    font-size:16px;font-weight:800;
    letter-spacing:-.02em;
    color:var(--ink);
  }
  .modal-close{
    width:32px;height:32px;
    border:1px solid var(--line);
    background:#fff;
    border-radius:9px;
    color:var(--muted);
    font-size:14px;line-height:1;
    display:grid;place-items:center;
    -webkit-tap-highlight-color:transparent;
  }
  .modal-close:active{background:#F4F5F7}
  .modal-body{
    flex:1 1 auto;min-height:0;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding:16px 18px 20px;
    scrollbar-width:none;
  }
  .modal-body::-webkit-scrollbar{display:none}
  .modal-foot{
    flex:0 0 auto;
    padding:12px 18px calc(12px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line);
    background:#FAFBFC;
    display:flex;gap:9px;
  }
  .modal-foot .btn{flex:1;height:48px;font-size:14.5px}
  .modal-foot .btn-ghost{
    background:#F4F5F7;
    border:1px solid var(--line);
    color:var(--ink-2);
  }
  .modal-foot .btn-primary{
    background:linear-gradient(145deg,var(--orange-2),var(--orange));
    color:#fff;
  }

  /* form */
  .field{margin-bottom:14px}
  .field:last-child{margin-bottom:0}
  .field label{
    display:block;
    font-size:11.5px;font-weight:800;
    letter-spacing:.09em;text-transform:uppercase;
    color:var(--muted);
    margin-bottom:7px;
  }
  .field label .opt{
    text-transform:none;letter-spacing:0;
    font-weight:650;color:var(--faint);
    font-size:11px;
  }
  .input,.textarea{
    width:100%;
    border:1px solid var(--line);
    border-radius:11px;
    background:#fff;
    color:var(--ink);
    font-size:15px;
    line-height:1.4;
    padding:13px;
    outline:none;
    transition:border-color .15s,box-shadow .15s;
    -webkit-appearance:none;
    appearance:none;
  }
  .textarea{min-height:80px;resize:vertical;line-height:1.55}
  .input:focus,.textarea:focus{
    border-color:var(--orange);
    box-shadow:0 0 0 3px rgba(255,90,31,.13);
  }
  .input::placeholder,.textarea::placeholder{color:#B7BDC6}

  .check-row{
    display:flex;align-items:center;gap:10px;
    padding:12px 13px;
    border:1px solid var(--line);
    border-radius:11px;
    background:#fff;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    font-size:14px;
    font-weight:650;
    color:var(--ink-2);
  }
  .check-row:active{background:#FAFBFC}
  .check-row input{
    width:20px;height:20px;
    accent-color:var(--orange);
    margin:0;flex:0 0 auto;
  }

  /* upload zone in modal */
  .upload-zone{
    display:grid;
    grid-template-columns:1fr;
    gap:10px;
    margin-bottom:12px;
  }
  .upload-tile{
    width:120px;height:120px;
    border-radius:14px;
    background:#F0F1F4;
    border:1.5px dashed #C8CDD4;
    display:grid;place-items:center;
    color:var(--orange);
    font-size:34px;
    font-weight:300;
    line-height:1;
    cursor:pointer;
    position:relative;
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
    transition:border-color .15s,background .15s;
  }
  .upload-tile:active{border-color:var(--orange);background:var(--orange-soft)}
  .upload-tile img{width:100%;height:100%;object-fit:cover;display:block}
  .upload-tile input{display:none}

  /* toast */
  .toast{
    position:fixed;left:50%;z-index:200;
    bottom:calc(88px + env(safe-area-inset-bottom));
    transform:translate(-50%,10px);
    background:var(--ink);color:#fff;
    font-size:13.5px;font-weight:650;
    padding:12px 18px;border-radius:999px;
    max-width:88vw;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    opacity:0;pointer-events:none;
    transition:opacity .2s ease,transform .2s ease;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  @media print{
    body{background:#fff;display:block}
    #shell{max-width:none;height:auto;box-shadow:none;display:block;overflow:visible}
    .topbar,.actions{display:none!important}
    .scroll{overflow:visible;height:auto}
    .acc-body{grid-template-rows:1fr!important}
    .intro{border-radius:0}
    .sheet{margin-top:0;border-radius:0}
  }
</style>
</head>
<body>

<div id="shell">

  <header class="topbar">
    <div class="topbar-row">
      <a class="brand" href="index.html">
        <span class="mark">E</span>
        <span class="word">EatOuts</span>
      </a>
      <span class="hdr-chip">Gallery</span>
    </div>
    <div class="progress">
      <div class="progress-top">
        <span class="progress-label">Gallery status</span>
        <span class="progress-count" id="progressCount">0 groups · 0 images</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>
  </header>

  <div class="scroll" id="scroll">
    <section class="intro">
      <h1>Build your <em>gallery</em>.</h1>
      <p>Group photos by theme — Food, Interior, Events. The first image in each group becomes the cover thumbnail.</p>
    </section>
    <main class="sheet">
      <div class="meta-card" id="metaCard"></div>
      <div class="stack" id="stack"></div>
    </main>
  </div>

  <div class="actions">
    <button class="btn btn-primary" id="btnNewGroup" type="button">+ Create gallery group</button>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script>
(function () {
  "use strict";

  /* ============================================================
     CONFIG
     ============================================================ */
  var STORE_KEY = "eatouts.gallery-onboarding.v1";
  var MAX_IMAGES_PER_GROUP = 24;

  var SEED_GROUPS = ["Food","Interior","Exterior","Events","Drinks","Atmosphere"];

  /* ============================================================
     STATE
     ============================================================ */
  function seed() {
    return {
      groups: SEED_GROUPS.map(function (name, i) {
        return {
          id: uid("gg"),
          title: name,
          visible: true,
          order: i + 1,
          images: []
        };
      })
    };
  }

  var state = seed();

  try {
    var raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      var p = JSON.parse(raw);
      if (p && Array.isArray(p.groups) && p.groups.length) {
        state.groups = p.groups.map(function (g) {
          if (!Array.isArray(g.images)) g.images = [];
          if (typeof g.visible !== "boolean") g.visible = true;
          if (typeof g.order !== "number") g.order = 999;
          return g;
        });
      }
    }
  } catch (e) {}

  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
  }

  /* ============================================================
     HELPERS
     ============================================================ */
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };

  function esc(v) {
    return String(v == null ? "" : v)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function uid(p) {
    return p + "_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 7);
  }
  function nonEmpty(v) { return v != null && String(v).trim().length > 0; }

  var stack = $("#stack");
  var metaCard = $("#metaCard");
  var toastEl = $("#toast");
  var progressFill = $("#progressFill");
  var progressCount = $("#progressCount");
  var toastTimer = null;

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 2000);
  }

  /* ============================================================
     HELPERS ON STATE
     ============================================================ */
  function groupsSorted() {
    return state.groups.slice().sort(function (a, b) {
      return (a.order || 0) - (b.order || 0);
    });
  }
  function totalImages() {
    return state.groups.reduce(function (s, g) { return s + (g.images ? g.images.length : 0); }, 0);
  }
  function groupsWithImages() {
    return state.groups.filter(function (g) { return g.images && g.images.length > 0; }).length;
  }
  function visibleGroups() {
    return state.groups.filter(function (g) { return g.visible !== false; }).length;
  }

  /* ============================================================
     META CARD
     ============================================================ */
  function renderMeta() {
    var total = state.groups.length;
    var images = totalImages();
    var visible = visibleGroups();

    var dotClass = "";
    var message;
    if (total === 0) {
      dotClass = "warn";
      message = "No gallery groups yet — tap below to add one";
    } else if (images === 0) {
      dotClass = "";
      message = "<b>" + total + "</b> group" + (total === 1 ? "" : "s") + " ready · add your first photos";
    } else {
      dotClass = "green";
      message = "<b>" + images + "</b> photo" + (images === 1 ? "" : "s") +
        " across " + groupsWithImages() + " group" + (groupsWithImages() === 1 ? "" : "s");
    }

    metaCard.innerHTML =
      '<div class="meta-row">' +
        '<span class="meta-dot ' + dotClass + '"></span>' +
        '<span class="meta-text">' + message + '</span>' +
      '</div>' +
      '<div class="meta-stats">' +
        '<div class="stat"><b>' + total + '</b><span>Groups</span></div>' +
        '<div class="stat"><b>' + images + '</b><span>Photos</span></div>' +
        '<div class="stat"><b>' + visible + '</b><span>Visible</span></div>' +
      '</div>';

    var pct = total ? Math.round((Math.min(images, 20) / 20) * 100) : 0;
    progressFill.style.width = pct + "%";
    progressCount.textContent = total + " group" + (total === 1 ? "" : "s") + " · " + images + " image" + (images === 1 ? "" : "s");
  }

  /* ============================================================
     MODULE BODIES
     ============================================================ */
  function groupBodyHTML(g, gi, totalGroups) {
    var images = g.images || [];

    if (!images.length) {
      return '' +
        '<div class="module">' +
          '<p class="module-note">No photos in this group yet. Add your first image below — it becomes the cover thumbnail.</p>' +
          '<div class="empty-note">This group is empty.</div>' +
          '<button type="button" class="add-group-btn" data-add-image="' + esc(g.id) + '">+ Add first photo</button>' +
          '<div class="group-actions">' +
            '<button type="button" class="act-btn" data-rename-group="' + esc(g.id) + '">Rename</button>' +
            '<button type="button" class="act-btn" data-toggle-group="' + esc(g.id) + '">' + (g.visible !== false ? "Hide" : "Show") + '</button>' +
            '<button type="button" class="act-btn danger wide" data-del-group="' + esc(g.id) + '">Remove group</button>' +
          '</div>' +
          '<div class="move-row">' +
            '<button type="button" class="move-btn" data-move-group="' + esc(g.id) + '" data-dir="-1"' + (gi === 0 ? " disabled" : "") + '>Move up</button>' +
            '<button type="button" class="move-btn" data-move-group="' + esc(g.id) + '" data-dir="1"' + (gi === totalGroups - 1 ? " disabled" : "") + '>Move down</button>' +
          '</div>' +
        '</div>';
    }

    return '' +
      '<div class="module">' +
        '<p class="module-note">' + images.length + ' photo' + (images.length === 1 ? "" : "s") + ' in <b>' + esc(g.title) + '</b>. The first image is the cover.</p>' +

        '<div class="gallery-rail">' +
          images.map(function (im, i) {
            return '<div class="gallery-tile' + (i === 0 ? " main" : "") + '">' +
              '<img src="' + esc(im.src) + '" alt="">' +
              '<button type="button" class="tile-x" data-del-image="' + esc(g.id) + '" data-image-index="' + i + '" aria-label="Remove image">✕</button>' +
            '</div>';
          }).join("") +
          (images.length >= MAX_IMAGES_PER_GROUP
            ? ''
            : '<label class="gallery-tile add-tile" data-add-image-tile="' + esc(g.id) + '">' +
                '<span>+</span>' +
                '<input type="file" accept="image/*" multiple data-image-input="' + esc(g.id) + '">' +
              '</label>') +
        '</div>' +
        '<div class="gallery-dots">' +
          images.map(function (_, i) {
            return '<span class="dot' + (i === 0 ? " first" : "") + '"></span>';
          }).join("") +
        '</div>' +

        '<button type="button" class="add-group-btn" data-add-image="' + esc(g.id) + '">+ Add photo</button>' +

        '<div class="group-actions">' +
          '<button type="button" class="act-btn" data-rename-group="' + esc(g.id) + '">Rename</button>' +
          '<button type="button" class="act-btn" data-toggle-group="' + esc(g.id) + '">' + (g.visible !== false ? "Hide" : "Show") + '</button>' +
          '<button type="button" class="act-btn danger wide" data-del-group="' + esc(g.id) + '">Remove group</button>' +
        '</div>' +

        '<div class="move-row">' +
          '<button type="button" class="move-btn" data-move-group="' + esc(g.id) + '" data-dir="-1"' + (gi === 0 ? " disabled" : "") + '>Move up</button>' +
          '<button type="button" class="move-btn" data-move-group="' + esc(g.id) + '" data-dir="1"' + (gi === totalGroups - 1 ? " disabled" : "") + '>Move down</button>' +
        '</div>' +
      '</div>';
  }

  function bodyHowItWorks() {
    return '' +
      '<div class="module">' +
        '<div class="info-block">' +
          '<h4>Cover image</h4>' +
          '<p>The <b>first photo</b> in each group is used as that group\'s cover thumbnail. It shows up on your listing card and in the directory.</p>' +
        '</div>' +

        '<div class="info-block">' +
          '<h4>Grouping photos</h4>' +
          '<p>Keep each group focused on one theme — Food, Interior, Events. Groups with unrelated images perform worse with guests.</p>' +
        '</div>' +

        '<div class="info-block">' +
          '<h4>Visibility</h4>' +
          '<p>Hidden groups stay saved but are not shown to customers. Use this to prepare a group before publishing it.</p>' +
        '</div>' +

        '<div class="info-block">' +
          '<h4>Order</h4>' +
          '<p>Groups are shown to guests in the order you set here. Use <b>Move up</b> and <b>Move down</b> to reorder them.</p>' +
        '</div>' +
      '</div>';
  }

  function bodyFor(key) {
    if (key === "__how") return bodyHowItWorks();
    var g = state.groups.filter(function (x) { return x.id === key; })[0];
    if (!g) return "";
    var sorted = groupsSorted();
    var gi = sorted.findIndex(function (x) { return x.id === key; });
    return groupBodyHTML(g, gi, sorted.length);
  }

  /* ============================================================
     BUILD STACK
     ============================================================ */
  var openKey = null;

  function buildStack() {
    var sorted = groupsSorted();

    // group sections
    var groupSections = sorted.map(function (g) {
      var isOpen = openKey === g.id;
      var hasImages = g.images && g.images.length > 0;
      var isHidden = g.visible === false;
      var imgCount = g.images ? g.images.length : 0;
      var cover = hasImages ? g.images[0].src : "";
      var cls = "acc";
      if (isOpen) cls += " open";
      if (hasImages) cls += " touched";
      if (isHidden) cls += " hidden-group";

      var thumb = cover
        ? '<img src="' + esc(cover) + '" alt="">' +
          (imgCount > 1 ? '<span class="count">' + imgCount + '</span>' : '')
        : '<span>▣</span>';

      var sub = hasImages
        ? imgCount + " photo" + (imgCount === 1 ? "" : "s") + (isHidden ? " · hidden" : "")
        : (isHidden ? "Hidden · no photos yet" : "No photos yet");

      return '' +
        '<section class="' + cls + '" data-key="' + esc(g.id) + '">' +
          '<button class="acc-head" type="button" aria-expanded="' + isOpen + '">' +
            '<span class="grp-thumb' + (isHidden ? " hidden" : "") + '">' + thumb + '</span>' +
            '<span class="acc-title">' +
              '<b>' + esc(g.title) + '</b>' +
              '<span class="acc-sub">' + esc(sub) + '</span>' +
            '</span>' +
            '<span class="vis-dot' + (isHidden ? " off" : "") + '"></span>' +
          '</button>' +
          '<div class="acc-body">' +
            '<div class="acc-inner" data-body="' + esc(g.id) + '">' +
              bodyFor(g.id) +
            '</div>' +
          '</div>' +
        '</section>';
    }).join("");

    // how-it-works section
    var howOpen = openKey === "__how";
    var howSection = '' +
      '<section class="acc' + (howOpen ? " open" : "") + '" data-key="__how">' +
        '<button class="acc-head" type="button" aria-expanded="' + howOpen + '">' +
          '<span class="grp-thumb"><span>i</span></span>' +
          '<span class="acc-title">' +
            '<b>How the gallery works</b>' +
            '<span class="acc-sub">Cover image, grouping and visibility</span>' +
          '</span>' +
        '</button>' +
        '<div class="acc-body">' +
          '<div class="acc-inner" data-body="__how">' +
            bodyHowItWorks() +
          '</div>' +
        '</div>' +
      '</section>';

    stack.innerHTML = groupSections + howSection;
  }

  function render() {
    renderMeta();
    buildStack();
  }

  function refreshBody(groupId) {
    var body = stack.querySelector('[data-body="' + groupId + '"]');
    if (!body) return;
    body.innerHTML = bodyFor(groupId);
  }

  function refreshAllBodies() {
    // refresh each group body without touching the open state
    state.groups.forEach(function (g) {
      refreshBody(g.id);
    });
  }

  /* ============================================================
     ACCORDION
     ============================================================ */
  function openAccordion(key, scrollTo) {
    openKey = key;
    $$(".acc", stack).forEach(function (acc) {
      var isOpen = acc.dataset.key === key;
      acc.classList.toggle("open", isOpen);
      var head = acc.querySelector(".acc-head");
      if (head) head.setAttribute("aria-expanded", isOpen ? "true" : "false");
    });
    if (key && scrollTo) {
      var acc = stack.querySelector('.acc[data-key="' + key + '"]');
      if (acc) {
        setTimeout(function () {
          try { acc.scrollIntoView({ behavior:"smooth", block:"start" }); } catch (e) {}
        }, 320);
      }
    }
  }
  function toggleAccordion(key) {
    if (openKey === key) openAccordion(null);
    else openAccordion(key, true);
  }

  /* ============================================================
     MODAL SYSTEM
     ============================================================ */
  function openModal(opts) {
    var scrim = document.createElement("div");
    scrim.className = "modal-scrim";
    scrim.innerHTML =
      '<div class="modal" role="dialog" aria-modal="true">' +
        '<div class="modal-hdr">' +
          '<h3>' + esc(opts.title) + '</h3>' +
          '<button class="modal-close" type="button" data-close aria-label="Close">✕</button>' +
        '</div>' +
        '<div class="modal-body">' + opts.body + '</div>' +
        '<div class="modal-foot">' + opts.footer + '</div>' +
      '</div>';
    document.body.appendChild(scrim);
    scrim.querySelectorAll("[data-close]").forEach(function (b) {
      b.onclick = function () { scrim.remove(); };
    });
    scrim.addEventListener("click", function (e) {
      if (e.target === scrim) scrim.remove();
    });
    if (opts.onMount) opts.onMount(scrim);
    return scrim;
  }

  /* ============================================================
     MODALS
     ============================================================ */
  function newGroupModal() {
    var scrim = openModal({
      title: "Create gallery group",
      body:
        '<div class="field">' +
          '<label>Group title</label>' +
          '<input class="input" type="text" id="ng-title" placeholder="e.g. Rooftop, Brunch, Live Music">' +
        '</div>' +
        '<label class="check-row">' +
          '<input type="checkbox" id="ng-visible" checked>' +
          '<span>Visible to customers</span>' +
        '</label>',
      footer:
        '<button class="btn btn-ghost" type="button" data-close>Cancel</button>' +
        '<button class="btn btn-primary" type="button" data-save>Create group</button>'
    });
    var input = scrim.querySelector("#ng-title");
    setTimeout(function () { try { input.focus(); } catch (e) {} }, 80);
    scrim.querySelector("[data-save]").onclick = function () {
      var title = input.value.trim();
      if (!title) { toast("Give the group a title"); input.focus(); return; }
      state.groups.push({
        id: uid("gg"),
        title: title,
        visible: scrim.querySelector("#ng-visible").checked,
        order: state.groups.length + 1,
        images: []
      });
      save();
      render();
      scrim.remove();
      // auto-open the new group
      var sorted = groupsSorted();
      var newG = sorted[sorted.length - 1];
      if (newG) openAccordion(newG.id, true);
      toast("Group created");
    };
  }

  function renameGroupModal(group) {
    var scrim = openModal({
      title: "Rename group",
      body:
        '<div class="field">' +
          '<label>Group title</label>' +
          '<input class="input" type="text" id="rg-title" value="' + esc(group.title) + '">' +
        '</div>',
      footer:
        '<button class="btn btn-ghost" type="button" data-close>Cancel</button>' +
        '<button class="btn btn-primary" type="button" data-save>Save</button>'
    });
    var input = scrim.querySelector("#rg-title");
    setTimeout(function () { try { input.focus(); input.select(); } catch (e) {} }, 80);
    scrim.querySelector("[data-save]").onclick = function () {
      var title = input.value.trim();
      if (!title) { toast("Give the group a title"); input.focus(); return; }
      group.title = title;
      save();
      // refresh header + body
      buildStack();
      refreshMeta();
      scrim.remove();
      toast("Renamed");
    };
  }

  function addImageModal(group) {
    var scrim = openModal({
      title: "Add photo to " + group.title,
      body:
        '<p class="module-note" style="margin-bottom:14px">Paste an image URL, or tap the tile below to pick a file from your device. File uploads are stored as data URLs in your browser.</p>' +
        '<div class="upload-zone">' +
          '<label class="upload-tile" id="ai-tile">' +
            '<span id="ai-glyph">+</span>' +
            '<input type="file" accept="image/*" id="ai-file">' +
          '</label>' +
        '</div>' +
        '<div class="field">' +
          '<label>Image URL</label>' +
          '<input class="input" type="text" id="ai-url" placeholder="https://… or data URL">' +
        '</div>' +
        '<div class="field">' +
          '<label>Label <span class="opt">— optional</span></label>' +
          '<input class="input" type="text" id="ai-label" placeholder="e.g. Sunset terrace">' +
        '</div>',
      footer:
        '<button class="btn btn-ghost" type="button" data-close>Cancel</button>' +
        '<button class="btn btn-primary" type="button" data-save>Add photo</button>'
    });

    var tile = scrim.querySelector("#ai-tile");
    var fileInput = scrim.querySelector("#ai-file");
    var urlInput = scrim.querySelector("#ai-url");
    var glyph = scrim.querySelector("#ai-glyph");

    fileInput.onchange = function () {
      var f = fileInput.files && fileInput.files[0];
      if (!f) return;
      var r = new FileReader();
      r.onload = function (ev) {
        urlInput.value = ev.target.result;
        var existing = tile.querySelector("img");
        if (existing) existing.remove();
        var img = document.createElement("img");
        img.src = ev.target.result;
        tile.insertBefore(img, fileInput);
        if (glyph) glyph.style.display = "none";
      };
      r.readAsDataURL(f);
      fileInput.value = "";
    };

    scrim.querySelector("[data-save]").onclick = function () {
      var src = urlInput.value.trim();
      if (!src) { toast("Add an image URL or upload a file"); urlInput.focus(); return; }
      if ((group.images || []).length >= MAX_IMAGES_PER_GROUP) {
        toast("Max " + MAX_IMAGES_PER_GROUP + " images per group");
        return;
      }
      group.images = group.images || [];
      group.images.push({
        id: uid("img"),
        src: src,
        label: scrim.querySelector("#ai-label").value.trim(),
        visible: true,
        order: group.images.length + 1
      });
      save();
      // refresh body + header
      refreshBody(group.id);
      buildStack();
      refreshMeta();
      scrim.remove();
      toast("Photo added");
    };
  }

  /* ============================================================
     EVENT DELEGATION
     ============================================================ */
  stack.addEventListener("click", function (e) {

    /* accordion header */
    var head = e.target.closest(".acc-head");
    if (head) {
      var acc = head.closest(".acc");
      if (acc) toggleAccordion(acc.dataset.key);
      return;
    }

    /* add image via button */
    var addImg = e.target.closest("[data-add-image]");
    if (addImg) {
      e.stopPropagation();
      var g1 = state.groups.filter(function (x) { return x.id === addImg.dataset.addImage; })[0];
      if (g1) addImageModal(g1);
      return;
    }

    /* delete image */
    var delImg = e.target.closest("[data-del-image]");
    if (delImg) {
      e.stopPropagation();
      if (!confirm("Remove this photo?")) return;
      var g2 = state.groups.filter(function (x) { return x.id === delImg.dataset.delImage; })[0];
      if (!g2) return;
      var idx = parseInt(delImg.dataset.imageIndex, 10);
      if (idx > -1 && idx < g2.images.length) {
        g2.images.splice(idx, 1);
        g2.images.forEach(function (im, i) { im.order = i + 1; });
        save();
        refreshBody(g2.id);
        buildStack();
        refreshMeta();
        toast("Photo removed");
      }
      return;
    }

    /* rename group */
    var rename = e.target.closest("[data-rename-group]");
    if (rename) {
      e.stopPropagation();
      var g3 = state.groups.filter(function (x) { return x.id === rename.dataset.renameGroup; })[0];
      if (g3) renameGroupModal(g3);
      return;
    }

    /* toggle visibility */
    var toggle = e.target.closest("[data-toggle-group]");
    if (toggle) {
      e.stopPropagation();
      var g4 = state.groups.filter(function (x) { return x.id === toggle.dataset.toggleGroup; })[0];
      if (!g4) return;
      g4.visible = g4.visible === false;
      save();
      buildStack();
      refreshMeta();
      toast(g4.visible ? "Group is now visible" : "Group hidden");
      return;
    }

    /* move group */
    var move = e.target.closest("[data-move-group]");
    if (move) {
      e.stopPropagation();
      var id = move.dataset.moveGroup;
      var dir = parseInt(move.dataset.dir, 10);
      var sorted = groupsSorted();
      var i = sorted.findIndex(function (x) { return x.id === id; });
      var j = i + dir;
      if (i < 0 || j < 0 || j >= sorted.length) return;
      var tmp = sorted[i];
      sorted[i] = sorted[j];
      sorted[j] = tmp;
      sorted.forEach(function (g, idx) { g.order = idx + 1; });
      save();
      buildStack();
      refreshMeta();
      toast("Moved");
      return;
    }

    /* delete group */
    var del = e.target.closest("[data-del-group]");
    if (del) {
      e.stopPropagation();
      var g5 = state.groups.filter(function (x) { return x.id === del.dataset.delGroup; })[0];
      if (!g5) return;
      if (!confirm('Remove group "' + g5.title + '" and all ' + (g5.images.length) + ' photo' + (g5.images.length === 1 ? "" : "s") + '?')) return;
      state.groups = state.groups.filter(function (x) { return x.id !== g5.id; });
      // re-number order
      groupsSorted().forEach(function (g, i) { g.order = i + 1; });
      save();
      render();
      if (openKey === g5.id) openAccordion(null);
      toast("Group removed");
      return;
    }
  });

  /* file input change (delegated) */
  stack.addEventListener("change", function (e) {
    var input = e.target.closest("[data-image-input]");
    if (!input) return;
    var groupId = input.dataset.imageInput;
    var g = state.groups.filter(function (x) { return x.id === groupId; })[0];
    if (!g) return;
    var files = Array.prototype.slice.call(input.files || []);
    if (!files.length) return;
    var remaining = MAX_IMAGES_PER_GROUP - (g.images ? g.images.length : 0);
    if (remaining <= 0) { input.value = ""; toast("Max " + MAX_IMAGES_PER_GROUP + " images per group"); return; }
    var take = files.slice(0, remaining);
    var loaded = 0;
    take.forEach(function (f) {
      var r = new FileReader();
      r.onload = function (ev) {
        g.images = g.images || [];
        g.images.push({
          id: uid("img"),
          src: ev.target.result,
          label: "",
          visible: true,
          order: g.images.length + 1
        });
        loaded++;
        if (loaded === take.length) {
          save();
          refreshBody(g.id);
          buildStack();
          refreshMeta();
          if (files.length > remaining) toast("Max " + MAX_IMAGES_PER_GROUP + " images per group");
          else toast(loaded + " photo" + (loaded === 1 ? "" : "s") + " added");
        }
      };
      r.readAsDataURL(f);
    });
    input.value = "";
  });

  /* ============================================================
     BOTTOM ACTION
     ============================================================ */
  $("#btnNewGroup").addEventListener("click", function () {
    newGroupModal();
  });

  /* ============================================================
     BOOT
     ============================================================ */
  render();
  openAccordion(null);

})();
</script>
</body>
</html>
