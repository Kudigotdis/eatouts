<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#141418">
<title>Blog creator dashboard · EatOuts</title>
<style>
  *,*::before,*::after{box-sizing:border-box}
  :root{
    --ink:#0F0F12;--ink-2:#2A2A30;--paper:#F4F5F7;--card:#FFF;
    --line:#E6E8EC;--line-2:#F0F1F4;
    --orange:#FF5A1F;--orange-2:#FF7A42;--orange-soft:#FFEDE4;--orange-line:#FFD5C2;
    --green:#16A34A;--green-soft:#E7F7EE;
    --red:#DC2626;--red-soft:#FEE2E2;
    --amber:#B45309;--amber-soft:#FEF3C7;
    --blue:#0284C7;--blue-soft:#E0F2FE;
    --muted:#6B7280;--faint:#9AA1AC;
  }
  html,body{height:100%}
  body{margin:0;background:#E9EBEF;color:var(--ink);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;overscroll-behavior:none;
    display:flex;justify-content:center;}
  button,input,select,textarea{font-family:inherit}
  button{cursor:pointer}
  #shell{width:100%;max-width:460px;height:100vh;height:100dvh;
    background:var(--paper);display:flex;flex-direction:column;
    overflow:hidden;position:relative;box-shadow:0 0 70px rgba(20,20,25,.16);}

  /* ============ TOPBAR ============ */
  .topbar{flex:0 0 auto;background:#141418;
    padding:calc(13px + env(safe-area-inset-top)) 18px 14px;
    position:relative;z-index:10;}
  .topbar-row{display:flex;align-items:center;gap:10px;padding-bottom:13px;}
  .brand{display:inline-flex;align-items:center;gap:9px;text-decoration:none;}
  .brand .mark{width:28px;height:28px;flex:0 0 auto;border-radius:8px;
    background:linear-gradient(145deg,var(--orange-2),var(--orange));
    color:#fff;display:grid;place-items:center;
    font-size:14px;font-weight:900;letter-spacing:-.03em;
    box-shadow:0 2px 10px rgba(255,90,31,.35);}
  .brand .word{color:#fff;font-size:15px;font-weight:800;letter-spacing:-.02em;}
  .hdr-chip{margin-left:auto;font-size:10px;font-weight:800;
    letter-spacing:.12em;text-transform:uppercase;color:var(--orange-2);
    border:1px solid rgba(255,122,66,.32);background:rgba(255,90,31,.1);
    border-radius:999px;padding:5px 11px;white-space:nowrap;}
  .progress{padding-bottom:2px}
  .progress-top{display:flex;align-items:baseline;justify-content:space-between;
    gap:10px;margin-bottom:8px;}
  .progress-label{font-size:11px;font-weight:800;letter-spacing:.14em;
    text-transform:uppercase;color:rgba(255,255,255,.5);}
  .progress-count{font-size:11.5px;font-weight:800;color:var(--orange-2);}
  .progress-track{height:5px;border-radius:99px;background:rgba(255,255,255,.13);
    overflow:hidden;}
  .progress-fill{height:100%;width:0%;border-radius:99px;
    background:linear-gradient(90deg,var(--orange),var(--orange-2));
    transition:width .35s cubic-bezier(.4,0,.2,1);}

  /* ============ SCROLL ============ */
  .scroll{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;
    -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
    scrollbar-width:none;}
  .scroll::-webkit-scrollbar{display:none}

  /* ============ INTRO ============ */
  .intro{background:linear-gradient(175deg,#141418 0%,#1B1B21 60%,#232329 100%);
    padding:4px 22px 46px;position:relative;overflow:hidden;text-align:center;}
  .intro::after{content:"";position:absolute;top:-80px;right:-80px;
    width:230px;height:230px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,90,31,.2),transparent 68%);
    pointer-events:none;}
  .intro h1{position:relative;margin:0 auto 12px;font-size:26px;
    line-height:1.15;font-weight:800;letter-spacing:-.03em;color:#fff;
    max-width:15ch;}
  .intro h1 em{font-style:normal;color:var(--orange-2)}
  .intro p{position:relative;margin:0 auto;font-size:14px;line-height:1.6;
    color:rgba(255,255,255,.6);max-width:32ch;}

  /* ============ SHEET ============ */
  .sheet{position:relative;z-index:1;margin-top:-26px;background:var(--paper);
    border-radius:26px 26px 0 0;padding:20px 14px 30px;min-height:60vh;}

  /* ============ META CARD ============ */
  .meta-card{background:var(--card);border:1px solid var(--line);
    border-radius:16px;padding:15px 16px;margin-bottom:12px;
    box-shadow:0 1px 2px rgba(20,20,25,.03);}
  .meta-row{display:flex;align-items:center;gap:10px;margin-bottom:11px;}
  .meta-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;
    background:var(--orange);box-shadow:0 0 0 3px var(--orange-soft);}
  .meta-dot.green{background:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
  .meta-dot.warn{background:var(--amber);box-shadow:0 0 0 3px var(--amber-soft)}
  .meta-dot.red{background:var(--red);box-shadow:0 0 0 3px var(--red-soft)}
  .meta-text{font-size:13.5px;color:var(--ink-2);line-height:1.4;
    min-width:0;flex:1 1 auto;}
  .meta-text b{color:var(--ink);font-weight:750}
  .meta-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
    padding-top:11px;border-top:1px solid var(--line-2);}
  .stat{text-align:center}
  .stat b{display:block;font-size:19px;font-weight:850;
    letter-spacing:-.03em;color:var(--ink);line-height:1.1;
    font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;}
  .stat span{display:block;margin-top:3px;font-size:9.5px;font-weight:800;
    letter-spacing:.1em;text-transform:uppercase;color:var(--faint);}

  /* ============ ACCORDION STACK ============ */
  .stack{display:flex;flex-direction:column;gap:10px}
  .acc{background:var(--card);border:1px solid var(--line);border-radius:16px;
    overflow:hidden;transition:border-color .2s ease,box-shadow .2s ease;}
  .acc.open{border-color:var(--orange-line);
    box-shadow:0 4px 18px -6px rgba(255,90,31,.22);}
  .acc.has-items .acc-sub{color:var(--green);font-weight:650}
  .acc-head{width:100%;display:flex;align-items:center;gap:12px;
    padding:13px 15px;background:transparent;border:0;text-align:left;
    -webkit-tap-highlight-color:transparent;transition:background .15s;}
  .acc-head:active{background:#FAFBFC}
  .sec-thumb{width:48px;height:48px;flex:0 0 auto;border-radius:11px;
    background:var(--orange-soft);color:var(--orange);
    display:grid;place-items:center;font-size:17px;font-weight:850;
    letter-spacing:-.02em;position:relative;}
  .sec-thumb.plain{background:#F0F1F4;color:var(--faint);}
  .sec-thumb .count{position:absolute;bottom:3px;right:3px;
    background:rgba(15,15,18,.72);color:#fff;font-size:9px;font-weight:800;
    padding:1.5px 5px;border-radius:4px;line-height:1;}
  .acc-title{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .acc-title b{font-size:15px;font-weight:750;letter-spacing:-.015em;
    color:var(--ink);line-height:1.25;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;}
  .acc-sub{font-size:11.5px;color:var(--faint);line-height:1.3;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:550;}
  .vis-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;
    background:var(--orange);box-shadow:0 0 0 3px var(--orange-soft);}
  .vis-dot.green{background:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
  .vis-dot.off{background:#D3D7DE;box-shadow:none}
  .acc-body{display:grid;grid-template-rows:0fr;
    transition:grid-template-rows .32s cubic-bezier(.4,0,.2,1);}
  .acc.open .acc-body{grid-template-rows:1fr}
  .acc-inner{overflow:hidden;min-height:0}
  .module{padding:2px 15px 18px}

  /* ============ 90px THUMBNAILS ============ */
  .thumb-90{width:90px;height:90px;flex:0 0 auto;border-radius:14px;
    background:linear-gradient(145deg,#FFF3EC,#FFE2D2);color:var(--orange);
    display:grid;place-items:center;font-size:34px;font-weight:850;
    letter-spacing:-.03em;overflow:hidden;position:relative;}
  .thumb-90.empty{background:#FAFBFC;border:1.5px dashed #D3D7DE;color:var(--faint);
    font-size:26px;}
  .thumb-90 img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb-90 .badge{position:absolute;bottom:5px;right:5px;
    background:rgba(15,15,18,.72);color:#fff;font-size:9px;font-weight:800;
    padding:2px 6px;border-radius:5px;line-height:1;letter-spacing:.06em;}

  .thumb-row{display:flex;gap:12px;padding:12px;background:#FAFBFC;
    border:1px solid var(--line-2);border-radius:12px;margin-bottom:8px;
    align-items:flex-start;}
  .thumb-row:last-child{margin-bottom:0}
  .thumb-body{flex:1 1 auto;min-width:0;
    display:flex;flex-direction:column;gap:4px;}
  .thumb-title{font-size:14px;font-weight:750;letter-spacing:-.01em;
    color:var(--ink);line-height:1.3;word-break:break-word;}
  .thumb-sub{font-size:11.5px;color:var(--faint);font-weight:550;
    line-height:1.4;word-break:break-word;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
    overflow:hidden;}
  .thumb-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;
    align-items:center;}

  /* ============ MINI BUTTONS ============ */
  .mini-btn{height:32px;padding:0 12px;border-radius:9px;
    border:1px solid var(--line);background:#fff;color:var(--ink-2);
    font-size:11.5px;font-weight:750;display:inline-flex;
    align-items:center;justify-content:center;
    -webkit-tap-highlight-color:transparent;
    transition:background .15s,border-color .15s,color .15s;
    text-decoration:none;}
  .mini-btn:active{background:#F4F5F7}
  .mini-btn.danger{color:var(--red);border-color:#FECACA;background:#FEF2F2;}
  .mini-btn.danger:active{background:var(--red-soft)}
  .mini-btn.ok{color:var(--green);border-color:#BBE7C7;background:var(--green-soft);}
  .mini-btn.ok:active{background:#D2F0DB}

  .pill{display:inline-flex;align-items:center;gap:5px;height:32px;
    padding:0 12px;border-radius:999px;font-size:10px;font-weight:800;
    letter-spacing:.09em;text-transform:uppercase;white-space:nowrap;
    background:#F0F1F4;color:var(--faint);}
  .pill.on{background:var(--green-soft);color:var(--green)}
  .pill.off{background:var(--amber-soft);color:var(--amber)}

  /* ============ FORM FIELDS ============ */
  .field{margin-bottom:14px}
  .field:last-child{margin-bottom:0}
  .field > label{display:block;font-size:11.5px;font-weight:800;
    letter-spacing:.09em;text-transform:uppercase;color:var(--muted);
    margin-bottom:7px;}
  .field input,
  .field select,
  .field textarea{
    width:100%;border:1px solid var(--line);border-radius:11px;
    background:#fff;color:var(--ink);font-size:15px;line-height:1.4;
    padding:13px;outline:none;
    transition:border-color .15s,box-shadow .15s;
    -webkit-appearance:none;appearance:none;font-family:inherit;}
  .field textarea{min-height:160px;resize:vertical;line-height:1.55}
  .field input:focus,
  .field select:focus,
  .field textarea:focus{border-color:var(--orange);
    box-shadow:0 0 0 3px rgba(255,90,31,.13);}
  .field input::placeholder,
  .field textarea::placeholder{color:#B7BDC6}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:400px){.grid2{grid-template-columns:1fr}}

  .form-actions{display:flex;gap:9px;margin-top:16px;}
  .form-actions .btn{flex:1;height:52px;border-radius:13px;
    font-size:15px;font-weight:750;letter-spacing:-.01em;border:0;
    display:inline-flex;align-items:center;justify-content:center;
    -webkit-tap-highlight-color:transparent;
    transition:transform .1s ease,background .15s;}
  .form-actions .btn:active{transform:scale(.98)}
  .btn-save{background:linear-gradient(145deg,var(--orange-2),var(--orange));
    color:#fff;box-shadow:0 6px 18px -6px rgba(255,90,31,.5);}
  .btn-save:active{background:var(--orange)}
  .btn-cancel{background:#F4F5F7;border:1px solid var(--line)!important;
    color:var(--ink-2);}
  .btn-cancel:active{background:#EBEDF0}

  /* ============ EMPTY ============ */
  .empty-note{font-size:12.5px;color:var(--faint);text-align:center;
    padding:22px 16px;border:1.5px dashed #DCE0E6;border-radius:11px;
    background:#FAFBFC;line-height:1.55;}
  .empty-note b{color:var(--ink-2);font-weight:750}

  /* ============ WORD COUNT HELPER ============ */
  .wc-row{display:flex;justify-content:space-between;align-items:center;
    font-size:11px;color:var(--faint);font-weight:650;
    margin-top:-8px;margin-bottom:12px;padding:0 2px;}

  /* ============ TOAST ============ */
  .toast{position:fixed;left:50%;z-index:200;
    bottom:calc(28px + env(safe-area-inset-bottom));
    transform:translate(-50%,10px);background:var(--ink);color:#fff;
    font-size:13.5px;font-weight:650;padding:12px 18px;border-radius:999px;
    max-width:88vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    opacity:0;pointer-events:none;
    transition:opacity .2s ease,transform .2s ease;}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  .hidden-file{position:absolute;width:1px;height:1px;opacity:0;
    pointer-events:none;overflow:hidden;}
</style>
</head>
<body data-page="blog-creator-dashboard">
<div id="shell">

  <header class="topbar">
    <div class="topbar-row">
      <a class="brand" href="index.html">
        <span class="mark">E</span><span class="word">EatOuts</span>
      </a>
      <span class="hdr-chip">Blog</span>
    </div>
    <div class="progress">
      <div class="progress-top">
        <span class="progress-label">Creator workspace</span>
        <span class="progress-count" id="progressCount">—</span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
  </header>

  <div class="scroll" id="scroll">
    <section class="intro">
      <h1>Your <em>blog</em> workspace.</h1>
      <p>Write, draft and publish stories for the EatOuts community — all from one mobile dashboard.</p>
    </section>
    <main class="sheet" id="app"></main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script src="js/eatouts-manager-db.js"></script>
<script src="assets/data/demo/the-food-place/demo-data.js"></script>
<script src="js/eatouts-manager-seed.js"></script>
<script src="js/eatouts-roles.js"></script>
<script src="js/eatouts-users.js"></script>
<script src="js/eatouts-feedback.js"></script>
<script src="js/eatouts-blog-admin.js"></script>
<script src="js/eatouts-auth.js"></script>
<script src="js/eatouts-manager.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {

  /* ============================================================
     AUTH GUARD
     ============================================================ */
  if (!window.EO || !EO.guard({
    "roles": ["platform_admin","staff_content","platform_author","platform_author_editor"]
  })) return;

  var Blog = window.EatoutsBlogAdmin;

  /* ============================================================
     HELPERS
     ============================================================ */
  function esc(v){
    return String(v == null ? "" : v)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }
  function attr(v){ return esc(v).replace(/`/g,"&#96;"); }
  function cssEscape(s){ return String(s).replace(/["\\]/g, "\\$&"); }
  function confirmDialog(msg){
    if (window.EO && typeof EO.confirm === "function") return EO.confirm(msg);
    return window.confirm(msg);
  }

  var toastEl = document.getElementById("toast");
  var toastTimer = null;
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove("show"); }, 2200);
  }

  /* ============================================================
     DATA
     ============================================================ */
  function allPosts(){
    try {
      var arr = (Blog && typeof Blog.all === "function") ? Blog.all() : [];
      return Array.isArray(arr) ? arr : [];
    } catch (e) { return []; }
  }
  function drafts(){ return allPosts().filter(function(p){ return p.status !== "published"; }); }
  function published(){ return allPosts().filter(function(p){ return p.status === "published"; }); }

  function wordCount(s){
    return String(s || "").trim().split(/\s+/).filter(Boolean).length;
  }
  function readTime(s){
    var w = wordCount(s);
    return Math.max(1, Math.round(w / 220)) + " min read";
  }
  function postThumb(p){
    var initial = String(p.title || "?").charAt(0).toUpperCase();
    return '<div class="thumb-90">' + esc(initial) + '</div>';
  }

  /* ============================================================
     STATE
     ============================================================ */
  var OPEN = null;   /* accordion key — closed by default */
  var editor = null; /* null | { id:String|null, title:String, body:String } */

  /* ============================================================
     SUBTITLES
     ============================================================ */
  function draftsSub(){
    var d = drafts();
    if (!d.length) return "No drafts yet";
    if (d.length === 1) return "1 draft · " + (d[0].title || "Untitled");
    return d.length + " drafts · " + d.slice(0,2).map(function(p){ return p.title || "Untitled"; }).join(", ") +
      (d.length > 2 ? " +" + (d.length - 2) : "");
  }
  function publishedSub(){
    var p = published();
    if (!p.length) return "Nothing published yet";
    if (p.length === 1) return "1 published · " + (p[0].title || "Untitled");
    return p.length + " published · " + p.slice(0,2).map(function(x){ return x.title || "Untitled"; }).join(", ") +
      (p.length > 2 ? " +" + (p.length - 2) : "");
  }
  function editorSub(){
    if (editor && editor.id) return "Editing: " + (editor.title || "Untitled");
    if (editor) return "New story in progress";
    return "Start a new blog story";
  }

  /* ============================================================
     MODULE — WRITER / EDITOR
     ============================================================ */
  function moduleEditor(){
    var isEdit = !!(editor && editor.id);
    var t = editor ? editor.title : "";
    var b = editor ? editor.body : "";
    var wc = wordCount(b);

    return '<div class="module">' +
      '<div class="field">' +
        '<label>Title</label>' +
        '<input id="ed-title" type="text" value="' + attr(t) + '" placeholder="Give your story a title">' +
      '</div>' +
      '<div class="field">' +
        '<label>Body</label>' +
        '<textarea id="ed-body" placeholder="Write your story here…">' + esc(b) + '</textarea>' +
      '</div>' +
      '<div class="wc-row">' +
        '<span id="ed-wc">' + wc + ' word' + (wc === 1 ? '' : 's') + '</span>' +
        '<span id="ed-rt">' + readTime(b) + '</span>' +
      '</div>' +
      '<div class="form-actions">' +
        '<button class="btn btn-save" type="button" id="ed-save">' +
          (isEdit ? "Save changes" : "Save draft") +
        '</button>' +
        (isEdit ? '<button class="btn btn-cancel" type="button" id="ed-cancel">Cancel</button>' : '') +
      '</div>' +
    '</div>';
  }

  /* ============================================================
     MODULE — LIST (drafts OR published)
     ============================================================ */
  function moduleList(posts, kind){
    var h = '<div class="module">';

    if (!posts.length){
      h += '<div class="empty-note">' +
        (kind === 'drafts'
          ? 'No drafts yet.<br><b>Open the writer</b> above to start a new story.'
          : 'Nothing published yet.<br><b>Publish a draft</b> to see it here.') +
      '</div>';
    } else {
      posts.forEach(function(p){
        var isPub = p.status === "published";
        var meta = (p.author || "Demo Author") + " · " + (p.updated || "—");
        h += '<div class="thumb-row">' +
          postThumb(p) +
          '<div class="thumb-body">' +
            '<div class="thumb-title">' + esc(p.title || "Untitled") + '</div>' +
            '<div class="thumb-sub">' + esc(meta) + '</div>' +
            '<div class="thumb-sub">' + esc(readTime(p.body)) + '</div>' +
            '<div class="thumb-actions">' +
              (isPub ? '<span class="pill on">Published</span>' : '<span class="pill off">Draft</span>') +
              '<button class="mini-btn" type="button" data-edit="' + attr(p.id) + '">Edit</button>' +
              '<button class="mini-btn ' + (isPub ? 'danger' : 'ok') + '" type="button" data-toggle="' + attr(p.id) + '">' +
                (isPub ? "Unpublish" : "Publish") +
              '</button>' +
            '</div>' +
          '</div>' +
        '</div>';
      });
    }

    h += '</div>';
    return h;
  }

  /* ============================================================
     SECTION BUILDER — no chevrons / arrows / +– indicators
     ============================================================ */
  function section(key, letter, title, sub, body, badge, active){
    var isOpen = OPEN === key;
    var cls = 'acc' + (isOpen ? ' open' : '') + (active ? ' has-items' : '');
    var badgeHtml = (badge != null && badge !== "")
      ? '<span class="count">' + esc(badge) + '</span>' : '';

    return '<section class="' + cls + '" data-key="' + attr(key) + '">' +
      '<button class="acc-head" type="button" aria-expanded="' + (isOpen ? 'true' : 'false') + '">' +
        '<span class="sec-thumb' + (active ? '' : ' plain') + '">' + esc(letter) + badgeHtml + '</span>' +
        '<span class="acc-title">' +
          '<b>' + esc(title) + '</b>' +
          '<span class="acc-sub">' + esc(sub) + '</span>' +
        '</span>' +
        '<span class="vis-dot ' + (active ? 'green' : 'off') + '"></span>' +
      '</button>' +
      '<div class="acc-body"><div class="acc-inner">' + body + '</div></div>' +
    '</section>';
  }

  /* ============================================================
     META CARD + PROGRESS
     ============================================================ */
  function renderMeta(){
    var d = drafts(), p = published(), all = allPosts();
    var totalWords = all.reduce(function(sum, x){ return sum + wordCount(x.body); }, 0);
    var readTotal = Math.max(1, Math.round(totalWords / 220));

    var dot = p.length > 0 ? "green" : (d.length > 0 ? "warn" : "warn");
    var msg;
    if (!all.length){
      msg = "Your blog is empty — open the writer below to start your first story";
    } else if (p.length && d.length){
      msg = "<b>" + d.length + "</b> draft" + (d.length === 1 ? "" : "s") + " and <b>" +
            p.length + "</b> published " + (p.length === 1 ? "story" : "stories");
    } else if (p.length){
      msg = "<b>" + p.length + "</b> published " + (p.length === 1 ? "story" : "stories");
    } else {
      msg = "<b>" + d.length + "</b> draft" + (d.length === 1 ? "" : "s") + " — publish your first story";
    }

    return '<div class="meta-card">' +
      '<div class="meta-row">' +
        '<span class="meta-dot ' + dot + '"></span>' +
        '<span class="meta-text">' + msg + '</span>' +
      '</div>' +
      '<div class="meta-stats">' +
        '<div class="stat"><b>' + d.length + '</b><span>Drafts</span></div>' +
        '<div class="stat"><b>' + p.length + '</b><span>Published</span></div>' +
        '<div class="stat"><b>' + readTotal + ' min</b><span>Total read</span></div>' +
      '</div>' +
    '</div>';
  }

  function updateProgress(){
    var all = allPosts();
    var p = published().length;
    var pct = all.length ? Math.round((p / all.length) * 100) : 0;
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('progressCount').textContent =
      all.length + ' post' + (all.length === 1 ? '' : 's') + ' · ' + p + ' live';
  }

  /* ============================================================
     RENDER
     ============================================================ */
  var mount = document.getElementById('app');

  function render(){
    var d = drafts(), p = published();

    mount.innerHTML =
      renderMeta() +
      '<div class="stack">' +
        section('editor', 'N', editor && editor.id ? 'Edit story' : 'New story',
          editorSub(), moduleEditor(), null, true) +
        section('drafts', 'D', 'Drafts', draftsSub(), moduleList(d, 'drafts'), d.length, d.length > 0) +
        section('published', 'P', 'Published', publishedSub(), moduleList(p, 'published'), p.length, p.length > 0) +
      '</div>';

    updateProgress();
    wire();
  }

  /* ============================================================
     ACCORDION — one open at a time, closed by default
     ============================================================ */
  function toggleAccordion(key){
    OPEN = (OPEN === key) ? null : key;
    render();
    if (OPEN){
      var opened = mount.querySelector('.acc[data-key="' + cssEscape(OPEN) + '"]');
      if (opened){
        setTimeout(function(){
          try { opened.scrollIntoView({ behavior:'smooth', block:'start' }); } catch (e) {}
        }, 320);
      }
    }
  }

  /* ============================================================
     CAPTURE EDITOR TEXT INTO STATE (avoid loss on re-render)
     ============================================================ */
  function captureEditor(){
    if (!editor) return;
    var t = document.getElementById('ed-title');
    var b = document.getElementById('ed-body');
    if (t) editor.title = t.value;
    if (b) editor.body  = b.value;
  }

  /* ============================================================
     WIRING
     ============================================================ */
  function wire(){
    /* --- live word count --- */
    var titleEl = document.getElementById('ed-title');
    var bodyEl  = document.getElementById('ed-body');
    var wcEl    = document.getElementById('ed-wc');
    var rtEl    = document.getElementById('ed-rt');

    if (bodyEl && wcEl){
      bodyEl.oninput = function(){
        if (editor) editor.body = bodyEl.value;
        var wc = wordCount(bodyEl.value);
        wcEl.textContent = wc + ' word' + (wc === 1 ? '' : 's');
        if (rtEl) rtEl.textContent = readTime(bodyEl.value);
      };
    }
    if (titleEl && editor){
      titleEl.oninput = function(){ editor.title = titleEl.value; };
    }

    /* --- save / cancel --- */
    var saveBtn = document.getElementById('ed-save');
    if (saveBtn){
      saveBtn.onclick = function(){
        captureEditor();
        var title = (editor && editor.title ? editor.title : "").trim();
        var body  = (editor && editor.body  ? editor.body  : "").trim();

        if (!title){ toast('Add a title first'); return; }
        if (!body){ toast('Add some body text first'); return; }

        try {
          if (editor && editor.id){
            Blog.update(editor.id, { title: title, body: body });
            toast('Draft updated');
          } else {
            Blog.create({ title: title, body: body, author: "Demo Author" });
            toast('Draft saved');
          }
        } catch (e) {
          toast('Could not save — storage may be full');
          return;
        }

        editor = null;
        OPEN = 'drafts';
        render();
      };
    }

    var cancelBtn = document.getElementById('ed-cancel');
    if (cancelBtn){
      cancelBtn.onclick = function(){
        editor = null;
        OPEN = null;
        render();
      };
    }
  }

  /* ============================================================
     CLICK DELEGATION
     ============================================================ */
  mount.addEventListener('click', function(e){
    var t = e.target;
    if (!t || !t.closest) return;

    /* --- edit post --- */
    var ed = t.closest('[data-edit]');
    if (ed){
      e.stopPropagation();
      var id = ed.getAttribute('data-edit');
      var post = allPosts().filter(function(x){ return String(x.id) === String(id); })[0];
      if (post){
        editor = {
          id: post.id,
          title: post.title || "",
          body: post.body || ""
        };
        OPEN = 'editor';
        render();
        /* focus title for quick editing */
        setTimeout(function(){
          var ti = document.getElementById('ed-title');
          if (ti){ try { ti.focus(); } catch (err) {} }
        }, 360);
      }
      return;
    }

    /* --- toggle publish / unpublish --- */
    var tg = t.closest('[data-toggle]');
    if (tg){
      e.stopPropagation();
      var tid = tg.getAttribute('data-toggle');
      var p = allPosts().filter(function(x){ return String(x.id) === String(tid); })[0];
      if (!p) return;

      var isPub = p.status === "published";
      try {
        if (isPub){
          Blog.unpublish(tid);
          toast('Unpublished — moved to drafts');
        } else {
          Blog.publish(tid);
          toast('Published');
        }
      } catch (err) {
        toast('Could not change publish state');
        return;
      }
      render();
      return;
    }

    /* --- accordion header (last, so inner buttons win) --- */
    var head = t.closest('.acc-head');
    if (head){
      /* capture editor text before switching sections */
      if (editor) captureEditor();
      var acc = head.closest('.acc');
      if (acc) toggleAccordion(acc.getAttribute('data-key'));
      return;
    }
  });

  /* ============================================================
     BOOT — all accordions closed
     ============================================================ */
  render();
});
</script>
</body>
</html>
