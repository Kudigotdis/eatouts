<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#141418">
<title>Dashboard · EatOuts</title>
<style>
  *,*::before,*::after{box-sizing:border-box}
  :root{
    --ink:#0F0F12;
    --ink-2:#2A2A30;
    --ink-3:#4A4A52;
    --paper:#F4F5F7;
    --card:#FFFFFF;
    --line:#E6E8EC;
    --line-2:#F0F1F4;
    --orange:#FF5A1F;
    --orange-2:#FF7A42;
    --orange-soft:#FFEDE4;
    --orange-line:#FFD5C2;
    --green:#16A34A;
    --green-soft:#E7F7EE;
    --red:#DC2626;
    --red-soft:#FEE2E2;
    --amber:#B45309;
    --amber-soft:#FEF3C7;
    --blue:#0284C7;
    --blue-soft:#E0F2FE;
    --muted:#6B7280;
    --faint:#9AA1AC;
  }
  html,body{height:100%}
  body{
    margin:0;
    background:#E9EBEF;
    color:var(--ink);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:15px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;
    display:flex;
    justify-content:center;
  }
  button,input,select,textarea{font-family:inherit}
  button{cursor:pointer}
  a{color:inherit;text-decoration:none}

  #shell{
    width:100%;
    max-width:460px;
    height:100vh;
    height:100dvh;
    background:var(--paper);
    display:flex;
    flex-direction:column;
    overflow:hidden;
    position:relative;
    box-shadow:0 0 70px rgba(20,20,25,.16);
  }

  /* top bar */
  .topbar{
    flex:0 0 auto;
    background:#141418;
    padding:calc(13px + env(safe-area-inset-top)) 18px 0;
  }
  .topbar-row{
    display:flex;align-items:center;gap:10px;
    padding-bottom:13px;
  }
  .brand{
    display:inline-flex;align-items:center;gap:9px;
  }
  .brand .mark{
    width:28px;height:28px;flex:0 0 auto;border-radius:8px;
    background:linear-gradient(145deg,var(--orange-2),var(--orange));
    color:#fff;
    display:grid;place-items:center;
    font-size:14px;font-weight:900;letter-spacing:-.03em;
    box-shadow:0 2px 10px rgba(255,90,31,.35);
  }
  .brand .word{
    color:#fff;font-size:15px;font-weight:800;
    letter-spacing:-.02em;
  }
  .hdr-chip{
    margin-left:auto;
    font-size:10px;font-weight:800;
    letter-spacing:.12em;text-transform:uppercase;
    color:var(--orange-2);
    border:1px solid rgba(255,122,66,.32);
    background:rgba(255,90,31,.1);
    border-radius:999px;
    padding:5px 11px;
    white-space:nowrap;
  }

  .progress{padding-bottom:14px}
  .progress-top{
    display:flex;align-items:baseline;justify-content:space-between;
    gap:10px;margin-bottom:8px;
  }
  .progress-label{
    font-size:11px;font-weight:800;
    letter-spacing:.14em;text-transform:uppercase;
    color:rgba(255,255,255,.5);
  }
  .progress-count{
    font-size:11.5px;font-weight:800;
    color:var(--orange-2);
    letter-spacing:.02em;
  }
  .progress-track{
    height:5px;border-radius:99px;
    background:rgba(255,255,255,.13);
    overflow:hidden;
  }
  .progress-fill{
    height:100%;width:0%;
    border-radius:99px;
    background:linear-gradient(90deg,var(--orange),var(--orange-2));
    transition:width .35s cubic-bezier(.4,0,.2,1);
  }

  /* scroll */
  .scroll{
    flex:1 1 auto;min-height:0;
    overflow-y:auto;
    overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
    scrollbar-width:none;
  }
  .scroll::-webkit-scrollbar{display:none}

  /* intro / hero */
  .intro{
    background:linear-gradient(175deg,#141418 0%,#1B1B21 60%,#232329 100%);
    padding:8px 22px 46px;
    position:relative;
    overflow:hidden;
    text-align:center;
  }
  .intro::after{
    content:"";
    position:absolute;
    top:-80px;right:-80px;
    width:230px;height:230px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,90,31,.2),transparent 68%);
    pointer-events:none;
  }
  .intro h1{
    position:relative;
    margin:0 auto 12px;
    font-size:26px;
    line-height:1.15;
    font-weight:800;
    letter-spacing:-.03em;
    color:#fff;
    max-width:15ch;
  }
  .intro h1 em{font-style:normal;color:var(--orange-2)}
  .intro p{
    position:relative;
    margin:0 auto;
    font-size:14px;
    line-height:1.6;
    color:rgba(255,255,255,.6);
    max-width:32ch;
  }
  .intro .live-badge{
    position:relative;
    display:inline-flex;
    align-items:center;
    gap:7px;
    margin-top:16px;
    padding:7px 13px;
    border-radius:999px;
    font-size:11px;
    font-weight:800;
    letter-spacing:.12em;
    text-transform:uppercase;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.14);
    color:rgba(255,255,255,.8);
  }
  .intro .live-badge.on{
    background:rgba(22,163,74,.15);
    border-color:rgba(22,163,74,.35);
    color:#5FDF95;
  }
  .intro .live-badge .pulse{
    width:7px;height:7px;border-radius:50%;
    background:var(--faint);
    flex:0 0 auto;
  }
  .intro .live-badge.on .pulse{
    background:#5FDF95;
    box-shadow:0 0 0 0 rgba(95,223,149,.6);
    animation:pulse 2s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(95,223,149,.55)}
    70%{box-shadow:0 0 0 8px rgba(95,223,149,0)}
    100%{box-shadow:0 0 0 0 rgba(95,223,149,0)}
  }

  /* sheet */
  .sheet{
    position:relative;
    z-index:1;
    margin-top:-26px;
    background:var(--paper);
    border-radius:26px 26px 0 0;
    padding:20px 14px 30px;
  }

  /* meta card */
  .meta-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:15px 16px;
    margin-bottom:12px;
    box-shadow:0 1px 2px rgba(20,20,25,.03);
  }
  .meta-row{
    display:flex;align-items:center;gap:10px;
    margin-bottom:11px;
  }
  .meta-dot{
    width:9px;height:9px;border-radius:50%;flex:0 0 auto;
    background:var(--orange);
    box-shadow:0 0 0 3px var(--orange-soft);
  }
  .meta-dot.live{
    background:var(--green);
    box-shadow:0 0 0 3px var(--green-soft);
  }
  .meta-text{
    font-size:13.5px;
    color:var(--ink-2);
    line-height:1.4;
    min-width:0;
  }
  .meta-text b{color:var(--ink);font-weight:750}
  .meta-bar{
    height:6px;border-radius:99px;
    background:#EEF0F3;overflow:hidden;
    margin-bottom:10px;
  }
  .meta-bar i{
    display:block;height:100%;
    background:linear-gradient(90deg,var(--orange),var(--orange-2));
    border-radius:99px;
    transition:width .35s cubic-bezier(.4,0,.2,1);
  }
  .meta-foot{
    display:flex;justify-content:space-between;align-items:baseline;
    font-size:11px;font-weight:800;
    letter-spacing:.08em;text-transform:uppercase;
    color:var(--faint);
  }
  .meta-foot .val{color:var(--orange);font-size:12px}

  /* accordion stack */
  .stack{display:flex;flex-direction:column;gap:10px}
  .acc{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    overflow:hidden;
    transition:border-color .2s ease,box-shadow .2s ease;
  }
  .acc.open{
    border-color:var(--orange-line);
    box-shadow:0 4px 18px -6px rgba(255,90,31,.22);
  }
  .acc-head{
    width:100%;
    display:flex;align-items:center;gap:12px;
    padding:16px 15px;
    background:transparent;border:0;
    text-align:left;
    -webkit-tap-highlight-color:transparent;
    transition:background .15s;
  }
  .acc-head:active{background:#FAFBFC}
  .acc-head .dot{
    width:10px;height:10px;border-radius:50%;flex:0 0 auto;
    background:#D3D7DE;
    transition:background .25s ease,box-shadow .25s ease;
  }
  .acc.touched .acc-head .dot{
    background:var(--green);
    box-shadow:0 0 0 3px var(--green-soft);
  }
  .acc.warn .acc-head .dot{
    background:var(--amber);
    box-shadow:0 0 0 3px var(--amber-soft);
  }
  .acc-title{
    flex:1 1 auto;min-width:0;
    display:flex;flex-direction:column;gap:1px;
  }
  .acc-title b{
    font-size:15px;font-weight:750;
    letter-spacing:-.015em;
    color:var(--ink);
    line-height:1.25;
  }
  .acc-sub{
    font-size:11.5px;
    color:var(--faint);
    line-height:1.3;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .acc.touched .acc-sub{color:var(--green);font-weight:650}
  .acc.warn .acc-sub{color:var(--amber);font-weight:650}
  .acc-body{
    display:grid;
    grid-template-rows:0fr;
    transition:grid-template-rows .32s cubic-bezier(.4,0,.2,1);
  }
  .acc.open .acc-body{grid-template-rows:1fr}
  .acc-inner{overflow:hidden;min-height:0}
  .module{padding:2px 15px 18px}
  .module-note{
    font-size:12.5px;
    line-height:1.5;
    color:var(--muted);
    margin:0 0 14px;
    padding:11px 12px;
    background:#FAFBFC;
    border:1px solid var(--line-2);
    border-radius:11px;
  }

  /* stat tiles */
  .stat-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
  }
  .stat{
    background:#fff;
    border:1px solid var(--line);
    border-radius:13px;
    padding:13px;
    display:flex;
    flex-direction:column;
    gap:3px;
  }
  .stat .lbl{
    font-size:10px;font-weight:800;
    letter-spacing:.09em;text-transform:uppercase;
    color:var(--faint);
    line-height:1.3;
  }
  .stat .val{
    font-size:22px;font-weight:850;
    letter-spacing:-.03em;
    color:var(--ink);
    line-height:1.1;
  }
  .stat .sub{
    font-size:11px;
    color:var(--green);
    font-weight:700;
    letter-spacing:-.005em;
  }
  .stat .sub.dim{color:var(--faint)}

  /* action buttons */
  .action-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
  }
  .action-btn{
    background:#fff;
    border:1px solid var(--line);
    border-radius:13px;
    padding:14px 13px;
    text-align:left;
    -webkit-tap-highlight-color:transparent;
    transition:border-color .15s,transform .08s,background .15s;
    display:block;
  }
  .action-btn:active{transform:scale(.98);border-color:var(--orange-line);background:var(--orange-soft)}
  .action-btn .ico{
    width:30px;height:30px;
    border-radius:9px;
    background:var(--orange-soft);
    color:var(--orange);
    display:grid;place-items:center;
    font-size:16px;
    font-weight:800;
    margin-bottom:9px;
  }
  .action-btn .ttl{
    font-weight:750;
    font-size:13.5px;
    letter-spacing:-.01em;
    color:var(--ink);
    line-height:1.25;
  }
  .action-btn .sub{
    font-size:11.5px;
    color:var(--faint);
    margin-top:3px;
    line-height:1.35;
  }

  /* bar rows */
  .bar-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 0;
    font-size:13px;
  }
  .bar-row .nm{
    flex:1 1 auto;
    font-weight:700;
    color:var(--ink-2);
    min-width:0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .bar-row .bar{
    flex:0 0 90px;
    height:6px;
    background:#EEF0F3;
    border-radius:999px;
    overflow:hidden;
  }
  .bar-row .bar i{
    display:block;height:100%;
    background:linear-gradient(90deg,var(--orange),var(--orange-2));
    border-radius:999px;
  }
  .bar-row .v{
    font-weight:800;
    font-size:12px;
    min-width:44px;
    text-align:right;
    color:var(--ink);
    font-variant-numeric:tabular-nums;
  }

  /* table-like rows */
  .row-list{display:flex;flex-direction:column}
  .row-list .row{
    display:flex;align-items:center;justify-content:space-between;
    gap:10px;
    padding:11px 0;
    border-bottom:1px solid var(--line-2);
    font-size:13.5px;
  }
  .row-list .row:last-child{border-bottom:0}
  .row-list .row .k{
    color:var(--muted);
    font-weight:600;
    font-size:13px;
  }
  .row-list .row .v{
    font-weight:750;
    color:var(--ink);
    font-variant-numeric:tabular-nums;
  }

  /* content list rows (promos / events) */
  .content-row{
    display:flex;justify-content:space-between;align-items:flex-start;
    gap:12px;
    padding:12px 0;
    border-bottom:1px solid var(--line-2);
  }
  .content-row:last-child{border-bottom:0}
  .content-row .info{min-width:0;flex:1 1 auto}
  .content-row .info b{
    display:block;
    font-size:13.5px;font-weight:750;
    letter-spacing:-.01em;
    color:var(--ink);
    line-height:1.3;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .content-row .info .meta{
    font-size:11.5px;
    color:var(--faint);
    margin-top:3px;
    line-height:1.4;
  }
  .content-row .views{
    font-size:11.5px;
    font-weight:750;
    color:var(--muted);
    white-space:nowrap;
    flex:0 0 auto;
    padding-top:2px;
    font-variant-numeric:tabular-nums;
  }

  .sub-head{
    font-size:10.5px;font-weight:800;
    letter-spacing:.1em;text-transform:uppercase;
    color:var(--faint);
    margin:16px 0 6px;
  }
  .sub-head:first-child{margin-top:0}

  .empty-note{
    font-size:12.5px;
    color:var(--faint);
    text-align:center;
    padding:16px 12px;
    border:1.5px dashed #DCE0E6;
    border-radius:11px;
    background:#FAFBFC;
    line-height:1.5;
  }
  .empty-note a{color:var(--orange);font-weight:750}

  /* plan / billing */
  .plan-block{
    background:#FAFBFC;
    border:1px solid var(--line-2);
    border-radius:13px;
    padding:14px;
    margin-bottom:12px;
  }
  .plan-block .plan-name{
    font-size:16px;font-weight:850;
    letter-spacing:-.02em;
    color:var(--ink);
    margin-bottom:3px;
  }
  .plan-block .plan-meta{
    font-size:12px;color:var(--faint);
    margin-bottom:10px;
  }
  .plan-block .badges{
    display:flex;gap:6px;flex-wrap:wrap;
    margin-bottom:12px;
  }
  .badge-pill{
    display:inline-flex;align-items:center;gap:5px;
    padding:4px 10px;border-radius:999px;
    font-size:10px;font-weight:800;
    letter-spacing:.05em;text-transform:uppercase;
  }
  .badge-pill::before{
    content:"";
    width:5px;height:5px;border-radius:50%;
    background:currentColor;
    flex:0 0 auto;
  }
  .badge-pill.ok{background:var(--green-soft);color:var(--green)}
  .badge-pill.warn{background:var(--amber-soft);color:var(--amber)}
  .badge-pill.dim{background:#F0F1F4;color:var(--faint)}

  .glance-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:8px;
  }
  .glance-grid .item{
    padding:9px 11px;
    background:#fff;
    border:1px solid var(--line-2);
    border-radius:11px;
  }
  .glance-grid .item b{
    display:block;
    font-size:15px;font-weight:850;
    letter-spacing:-.02em;
    color:var(--ink);
    line-height:1.15;
    font-variant-numeric:tabular-nums;
  }
  .glance-grid .item span{
    display:block;
    font-size:10px;font-weight:800;
    letter-spacing:.08em;text-transform:uppercase;
    color:var(--faint);
    margin-top:2px;
  }

  /* buttons */
  .btn{
    width:100%;
    height:48px;
    border:0;
    border-radius:12px;
    font-family:inherit;
    font-size:14.5px;
    font-weight:750;
    letter-spacing:-.01em;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    transition:transform .1s ease,background .15s;
    -webkit-tap-highlight-color:transparent;
  }
  .btn:active{transform:scale(.98)}
  .btn + .btn{margin-top:9px}
  .btn-primary{
    background:linear-gradient(145deg,var(--orange-2),var(--orange));
    color:#fff;
    box-shadow:0 6px 18px -6px rgba(255,90,31,.5);
  }
  .btn-primary:active{background:var(--orange)}
  .btn-ghost{
    background:#F4F5F7;
    border:1px solid var(--line);
    color:var(--ink-2);
    height:46px;
    font-size:13.5px;
  }
  .btn-ghost:active{background:#EDE9DF}

  /* report modal */
  .modal-scrim{
    position:fixed;inset:0;z-index:100;
    background:rgba(15,15,18,.55);
    display:flex;align-items:flex-end;justify-content:center;
    animation:fade .18s ease;
  }
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @media(min-width:520px){.modal-scrim{align-items:center;padding:20px}}
  .modal{
    background:#fff;
    width:100%;max-width:460px;
    max-height:92vh;
    border-radius:20px 20px 0 0;
    display:flex;flex-direction:column;
    overflow:hidden;
    animation:slideup .25s cubic-bezier(.4,0,.2,1);
  }
  @keyframes slideup{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
  @media(min-width:520px){
    .modal{border-radius:18px}
    @keyframes slideup{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
  }
  .modal-hdr{
    padding:14px 18px;
    border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:12px;
    flex:0 0 auto;
  }
  .modal-hdr h3{
    margin:0;flex:1;
    font-size:16px;font-weight:800;
    letter-spacing:-.02em;
    color:var(--ink);
  }
  .modal-close{
    width:32px;height:32px;
    border:1px solid var(--line);
    background:#fff;
    border-radius:9px;
    color:var(--muted);
    font-size:14px;line-height:1;
    display:grid;place-items:center;
    -webkit-tap-highlight-color:transparent;
  }
  .modal-close:active{background:#F4F5F7}
  .modal-body{
    flex:1 1 auto;min-height:0;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding:16px 18px 8px;
    scrollbar-width:none;
  }
  .modal-body::-webkit-scrollbar{display:none}
  .modal-foot{
    flex:0 0 auto;
    padding:12px 18px calc(12px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line);
    background:#FAFBFC;
    display:flex;flex-direction:column;gap:9px;
  }
  .modal-foot .row2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .modal-foot .btn{height:46px;font-size:13.5px}

  /* report typography */
  .report-hd{
    font-size:10.5px;font-weight:800;
    letter-spacing:.14em;text-transform:uppercase;
    color:var(--orange);
    margin-bottom:6px;
  }
  .report-title{
    margin:0 0 4px;
    font-size:20px;font-weight:850;
    letter-spacing:-.025em;
    color:var(--ink);
    line-height:1.2;
  }
  .report-sub{
    font-size:12px;
    color:var(--faint);
    margin-bottom:14px;
  }
  .report-table{
    width:100%;
    border-collapse:collapse;
    margin-bottom:14px;
  }
  .report-table td{
    padding:9px 2px;
    border-bottom:1px solid var(--line-2);
    font-size:13.5px;
    color:var(--ink-2);
  }
  .report-table td:last-child{
    text-align:right;
    font-weight:800;
    color:var(--ink);
    font-variant-numeric:tabular-nums;
  }
  .report-section-title{
    font-size:10.5px;font-weight:800;
    letter-spacing:.1em;text-transform:uppercase;
    color:var(--faint);
    margin:16px 0 4px;
  }
  .report-foot{
    font-size:11.5px;
    color:var(--faint);
    margin-top:12px;
    line-height:1.55;
    padding-top:12px;
    border-top:1px solid var(--line-2);
  }

  /* toast */
  .toast{
    position:fixed;left:50%;z-index:200;
    bottom:calc(28px + env(safe-area-inset-bottom));
    transform:translate(-50%,10px);
    background:var(--ink);color:#fff;
    font-size:13.5px;font-weight:650;
    padding:12px 18px;border-radius:999px;
    max-width:88vw;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    opacity:0;pointer-events:none;
    transition:opacity .2s ease,transform .2s ease;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  @media print{
    body{background:#fff;display:block}
    #shell{max-width:none;height:auto;box-shadow:none;display:block;overflow:visible}
    .topbar,.actions{display:none!important}
    .scroll{overflow:visible;height:auto}
    .acc-body{grid-template-rows:1fr!important}
    .intro{border-radius:0}
    .sheet{margin-top:0;border-radius:0}
  }
</style>
</head>
<body>

<div id="shell">

  <header class="topbar">
    <div class="topbar-row">
      <a class="brand" href="index.html">
        <span class="mark">E</span>
        <span class="word">EatOuts</span>
      </a>
      <span class="hdr-chip">Dashboard</span>
    </div>
    <div class="progress">
      <div class="progress-top">
        <span class="progress-label">Profile completeness</span>
        <span class="progress-count" id="progressCount">0% complete</span>
      </div>

        <div class="progress-fill" id="progressFill"></div>
      </div>

  </header>

  <div class="scroll" id="scroll">
    <section class="intro">

    </section>
    <main class="sheet">
      <div class="meta-card" id="metaCard"></div>
      <div class="stack" id="stack"></div>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script src="js/eatouts-db.js"></script>
<script src="js/eatouts-auth.js"></script>
<script src="js/eatouts-owner-compat.js"></script>
<script>
/* Operator pages are only reachable through the About Us sign-in. */
try {
  if (window.EatoutsAuth) {
    if (!EatoutsAuth.requireSession()) { EatoutsAuth.redirectToLogin(); }
    else { EatoutsAuth.applyActive(); }
  }
} catch (e) {}
</script>
<script>
(function () {
  "use strict";

  /* ============================================================
     DATA LOAD
     ============================================================ */
  var DB_KEY = (window.EatoutsDB && EatoutsDB.KEY) || "eatouts_db_v1";

  function dbLoad() {
    try {
      if (window.EatoutsOwnerCompat) return EatoutsOwnerCompat.load();
    } catch (e) {}
    try {
      var raw = localStorage.getItem(DB_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return null;
  }
  function dbSave(d) {
    try {
      if (window.EatoutsOwnerCompat) { EatoutsOwnerCompat.save(d); return; }
    } catch (e) {}
    try { localStorage.setItem(DB_KEY, JSON.stringify(d)); } catch (e) {}
  }

  var DB = dbLoad() || {
    restaurant:{
      identity:{ name:"Untitled restaurant", status:"draft", types:[] },
      location:{ city:"", area:"" },
      contacts:[], socials:[],
      operatingHours:{ weekly:[], customSchedules:[] },
      character:{ options:[] }, amenities:{ options:[] }, menuTags:{ options:[] },
      capacity:[], payments:[],
      reservations:{}, reservationServices:[], serviceStaff:[], users:[]
    },
    menuCategories:[], menuItems:[], promos:[], events:[], performers:[],
    galleryGroups:[], settings:{ currencySymbol:"P" }
  };
  if (!DB.settings) DB.settings = { currencySymbol:"P" };
  if (!DB.restaurant) DB.restaurant = {};
  if (!DB.restaurant.identity) DB.restaurant.identity = { name:"", status:"draft", types:[] };

  /* ============================================================
     HELPERS
     ============================================================ */
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };

  function esc(v) {
    return String(v == null ? "" : v)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function money(v) { return (DB.settings.currencySymbol || "P") + (Number(v) || 0).toFixed(2); }
  function fmt(n) { return Number(n || 0).toLocaleString(); }

  var toastEl = $("#toast");
  var toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 2000);
  }

  /* ============================================================
     ANALYTICS (deterministic simulation, replaces later)
     ============================================================ */
  function deriveAnalytics() {
    var menuItems = (DB.menuItems || []);
    var promos = (DB.promos || []);
    var events = (DB.events || []);
    var groups = (DB.galleryGroups || []);
    var imgs = groups.reduce(function (s, g) { return s + ((g.images || []).length); }, 0);

    var seed = menuItems.length * 7 + promos.length * 11 + events.length * 13 + imgs * 3 + 17;
    function rand(n) {
      var x = Math.sin(seed * n) * 10000;
      return Math.floor((x - Math.floor(x)) * 1000);
    }
    return {
      profileViews: 800 + rand(1) % 4200,
      menuViews:    400 + rand(2) % 2600,
      whatsapp:     40  + rand(3) % 380,
      reservations: 6   + rand(4) % 90,
      promoInteractions: promos.length * 40 + rand(5) % 300,
      eventInteractions: events.length * 60 + rand(6) % 260,
      menuBreakdown: menuItems.slice(0, 5).map(function (it, i) {
        return { name: it.name || "Untitled", views: 200 + rand(10 + i) % 900 };
      }).sort(function (a, b) { return b.views - a.views; }),
      whatsappTypes: [
        { type:"Orders",         v: 40 + rand(20) % 180 },
        { type:"Reservations",   v: 20 + rand(21) % 80  },
        { type:"Delivery",       v: 10 + rand(22) % 60  },
        { type:"Pickup",         v: 8  + rand(23) % 40  },
        { type:"Event RSVP",     v: 5  + rand(24) % 30  },
        { type:"Catering",       v: 2  + rand(25) % 12  },
        { type:"Enquiries",      v: 10 + rand(26) % 40  }
      ]
    };
  }

  /* ============================================================
     COMPLETENESS
     ============================================================ */
  function completeness() {
    var r = DB.restaurant || {};
    var id = r.identity || {};
    var checks = [
      !!id.name,
      !!id.description,
      (id.types || []).length > 0,
      !!(r.location && r.location.city),
      !!(r.location && r.location.area),
      (r.contacts || []).length > 0,
      !!(r.socials && r.socials[0] && Object.keys(r.socials[0]).length),
      !!(r.operatingHours && (r.operatingHours.weekly || []).some(function (x) { return x.open && x.close; })),
      !!(r.character && (r.character.options || []).length > 0),
      !!(r.amenities && (r.amenities.options || []).length > 0),
      !!(r.menuTags && (r.menuTags.options || []).length > 0),
      (r.capacity || []).length > 0,
      (r.payments || []).length > 0,
      !!(r.reservations && r.reservations.enabled),
      (r.reservationServices || []).length > 0,
      (r.serviceStaff || []).length > 0
    ];
    var passed = checks.filter(Boolean).length;
    return Math.round((passed / checks.length) * 100);
  }

  function missingSuggestions() {
    var r = DB.restaurant || {};
    var out = [];
    if (!(r.amenities && (r.amenities.options || []).some(function (o) { return o.name === "Outdoor seating"; }))) out.push("Add outdoor seating");
    if (!(r.socials && r.socials[0] && r.socials[0].instagram)) out.push("Add Instagram");
    if (!(r.operatingHours && (r.operatingHours.weekly || []).some(function (x) { return x.day === "Sunday" && x.open; }))) out.push("Add Sunday hours");
    if (!(r.identity && r.identity.coverImage)) out.push("Upload a cover image");
    if (!(DB.galleryGroups || []).some(function (g) { return (g.images || []).length > 2; })) out.push("Add more photos");
    return out.slice(0, 3);
  }

  /* ============================================================
     SETUP-FEE STATUS (reads ops console state)
     ============================================================ */
  function venueSlug() {
    var r = DB.restaurant || {};
    var id = r.identity || {};
    if (id.slug || r.slug) return id.slug || r.slug;
    return String(id.name || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "";
  }
  function setupFeeStatus() {
    try {
      var ops = JSON.parse(localStorage.getItem("eatouts_ops_v1") || "null");
      var venues = (ops && ops.venues) || [];
      var slug = venueSlug();
      var name = (DB.restaurant && DB.restaurant.identity && DB.restaurant.identity.name) || "";
      var row = venues.filter(function (v) { return v && (v.slug === slug || (name && v.name === name)); })[0];
      return { paid: !!(row && (row.setupPaid || row.setupFeePaid)) };
    } catch (e) { return { paid: false }; }
  }

  /* ============================================================
     EXPORT (eatouts.venue.v1)
     ============================================================ */
  function exportVenue() {
    var r = DB.restaurant || {};
    var id = r.identity || {};
    var loc = r.location || {};
    var slug = venueSlug() || "restaurant";
    var galleryImages = [];
    (DB.galleryGroups || []).forEach(function (g) {
      (g.images || []).forEach(function (im, i) {
        galleryImages.push({
          id: im.id, cat: g.title || g.name || "",
          src: im.src || im.url || "", label: im.label || "",
          visible: im.visible !== false, order: i + 1,
          groupId: g.id, groupTitle: g.title || g.name || "",
          groupVisible: true, groupOrder: 1, coverImageId: null
        });
      });
    });
    var payload = {
      $schema: "eatouts.venue.v1",
      generatedAt: new Date().toISOString(),
      slug: slug,
      name: id.name || "",
      description: id.description || "",
      logo: id.logo || null,
      coverImage: id.coverImage || null,
      types: id.types || [],
      category: (id.types || [])[0] || "",
      location: {
        district: loc.district || "", districtName: loc.districtName || "",
        town: loc.town || loc.city || "", area: loc.area || "",
        plotNumber: loc.plotNumber || "", street: loc.street || loc.streetName || "",
        building: loc.building || "", landmark: loc.landmark || "",
        lat: loc.lat != null ? loc.lat : (loc.latitude != null ? loc.latitude : null),
        lng: loc.lng != null ? loc.lng : (loc.longitude != null ? loc.longitude : null)
      },
      landmark: loc.landmark || "",
      contacts: (r.contacts || []).map(function (c) {
        return {
          id: c.id, title: c.title, countryCode: c.countryCode, number: c.number,
          purpose: c.purpose, primary: !!c.primary, whatsapp: !!c.whatsapp,
          active: c.active !== false
        };
      }),
      socials: (r.socials || []).filter(Boolean),
      profile: Object.assign({ name: id.name || "" }, r),
      content: {
        menuCategories: DB.menuCategories || [],
        menuItems: DB.menuItems || [],
        promos: DB.promos || [],
        events: DB.events || [],
        performers: DB.performers || [],
        performances: [],
        galleryGroups: DB.galleryGroups || [],
        galleryImages: galleryImages
      }
    };
    try {
      var blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "venue_" + slug + ".json";
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      toast("Exported venue_" + slug + ".json");
    } catch (e) {
      toast("Export unavailable on this device");
    }
  }

  /* ============================================================
     REPORTS
     ============================================================ */
  function reportData(kind, A, name) {
    var period = kind === "monthly" ? "Last 30 days" : "Last 7 days";
    var rows = [
      ["Profile views", A.profileViews],
      ["Menu views", A.menuViews],
      ["WhatsApp actions", A.whatsapp],
      ["Reservation requests", A.reservations]
    ];
    if (kind === "monthly") {
      rows.push(["Promo interactions", A.promoInteractions]);
      rows.push(["Event interactions", A.eventInteractions]);
    }
    return {
      kind: kind,
      title: (kind === "monthly" ? "Monthly report" : "Weekly report"),
      name: name || "Restaurant",
      period: period,
      rows: rows,
      breakdown: (A.menuBreakdown || []).slice(0, 5),
      whatsappTypes: A.whatsappTypes || [],
      generated: new Date()
    };
  }

  function reportHTML(kind, A, name) {
    var d = reportData(kind, A, name);
    var h = '<div class="report-hd">EatOuts ' + esc(d.title) + '</div>' +
            '<h2 class="report-title">' + esc(d.name) + '</h2>' +
            '<div class="report-sub">' + esc(d.period) + ' · generated ' + d.generated.toLocaleString() + '</div>';

    h += '<table class="report-table"><tbody>';
    d.rows.forEach(function (r) {
      h += '<tr><td>' + esc(r[0]) + '</td><td>' + fmt(r[1]) + '</td></tr>';
    });
    h += '</tbody></table>';

    if (kind !== "monthly" && d.breakdown.length) {
      h += '<div class="report-section-title">Top menu items</div><table class="report-table"><tbody>';
      d.breakdown.forEach(function (m) {
        h += '<tr><td>' + esc(m.name) + '</td><td>' + fmt(m.views) + '</td></tr>';
      });
      h += '</tbody></table>';
    }
    if (kind === "monthly" && d.whatsappTypes.length) {
      h += '<div class="report-section-title">WhatsApp action types</div><table class="report-table"><tbody>';
      d.whatsappTypes.forEach(function (w) {
        h += '<tr><td>' + esc(w.type) + '</td><td>' + fmt(w.v) + '</td></tr>';
      });
      h += '</tbody></table>';
    }
    h += '<div class="report-foot">Generated from your local EatOuts data. Live analytics arrive with the analytics engine.</div>';
    return h;
  }

  function reportCSV(kind, A, name) {
    var d = reportData(kind, A, name);
    function cell(v) {
      var s = String(v == null ? "" : v);
      return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    }
    var lines = [
      ["EatOuts " + d.title],
      ["Business", d.name],
      ["Period", d.period],
      ["Generated", d.generated.toISOString()],
      [],
      ["Metric", "Value"]
    ];
    d.rows.forEach(function (r) { lines.push([r[0], r[1]]); });
    if (kind !== "monthly" && d.breakdown.length) {
      lines.push([]);
      lines.push(["Top menu items", "Views"]);
      d.breakdown.forEach(function (m) { lines.push([m.name, m.views]); });
    }
    if (kind === "monthly" && d.whatsappTypes.length) {
      lines.push([]);
      lines.push(["WhatsApp action type", "Count"]);
      d.whatsappTypes.forEach(function (w) { lines.push([w.type, w.v]); });
    }
    return "\ufeff" + lines.map(function (row) { return row.map(cell).join(","); }).join("\r\n");
  }

  function downloadReport(kind, A, name) {
    try {
      var blob = new Blob([reportCSV(kind, A, name)], { type: "text/csv;charset=utf-8;" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "eatouts_" + kind + "_report.csv";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      toast("Report downloaded");
    } catch (e) {
      toast("Download unavailable on this device");
    }
  }

  function printReport(kind, A, name) {
    try {
      var frame = document.createElement("iframe");
      frame.setAttribute("aria-hidden", "true");
      frame.style.cssText = "position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden";
      document.body.appendChild(frame);
      var w = frame.contentWindow;
      if (!w) return;
      w.document.open();
      w.document.write(
        '<!doctype html><html><head><meta charset="utf-8"><title>EatOuts ' + reportData(kind, A, name).title + '</title>' +
        '<style>body{font-family:Inter,system-ui,sans-serif;color:#0F0F12;margin:24px;font-size:14px;line-height:1.55}' +
        '.report-hd{font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#FF5A1F;margin-bottom:6px}' +
        '.report-title{margin:0 0 4px;font-size:22px;font-weight:850;letter-spacing:-.02em}' +
        '.report-sub{font-size:12px;color:#6B7280;margin-bottom:16px}' +
        '.report-section-title{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#9AA1AC;margin:18px 0 4px}' +
        'table{width:100%;border-collapse:collapse;margin-bottom:14px}' +
        'td{padding:9px 2px;border-bottom:1px solid #F0F1F4;font-size:13.5px;color:#2A2A30}' +
        'td:last-child{text-align:right;font-weight:800;color:#0F0F12}' +
        '.report-foot{font-size:11.5px;color:#9AA1AC;margin-top:14px;padding-top:12px;border-top:1px solid #F0F1F4}' +
        '</style></head><body>' + reportHTML(kind, A, name) + '</body></html>'
      );
      w.document.close();
      var run = function () {
        try { if (typeof w.print === "function") w.print(); } catch (e) {}
        setTimeout(function () { frame.remove(); }, 600);
      };
      if (w.document.readyState === "complete") run();
      else frame.onload = run;
    } catch (e) {
      toast("Print unavailable on this device");
    }
  }

  var activeScrim = null;
  function closeReport() {
    if (activeScrim) { activeScrim.remove(); activeScrim = null; }
    document.removeEventListener("keydown", onReportKey);
  }
  function onReportKey(e) { if (e.key === "Escape") closeReport(); }
  function showReport(kind, A, name) {
    closeReport();
    var scrim = document.createElement("div");
    scrim.className = "modal-scrim";
    scrim.innerHTML =
      '<div class="modal" role="dialog" aria-modal="true">' +
        '<div class="modal-hdr">' +
          '<h3>' + (kind === "monthly" ? "Monthly report" : "Weekly report") + '</h3>' +
          '<button class="modal-close" type="button" data-close aria-label="Close">✕</button>' +
        '</div>' +
        '<div class="modal-body">' + reportHTML(kind, A, name) + '</div>' +
        '<div class="modal-foot">' +
          '<div class="row2">' +
            '<button class="btn btn-primary" type="button" data-csv>Download CSV</button>' +
            '<button class="btn btn-ghost" type="button" data-print>Print</button>' +
          '</div>' +
          '<button class="btn btn-ghost" type="button" data-close>Close</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(scrim);
    activeScrim = scrim;
    scrim.addEventListener("click", function (e) { if (e.target === scrim) closeReport(); });
    document.addEventListener("keydown", onReportKey);
    scrim.querySelectorAll("[data-close]").forEach(function (b) { b.onclick = closeReport; });
    scrim.querySelector("[data-csv]").onclick = function () { downloadReport(kind, A, name); };
    scrim.querySelector("[data-print]").onclick = function () { printReport(kind, A, name); };
  }

  /* ============================================================
     MODULES
     ============================================================ */
  var openKey = null;
  var cachedAnalytics = null;
  var cachedPct = 0;
  var cachedPlan = "starter";
  var cachedPlanLabel = "EatOuts Starter";
  var cachedPlanPrice = 100;
  var cachedSetupFee = 300;
  var cachedSetupPaid = false;
  var cachedNext = "";

  function statTile(label, value, sub, subDim) {
    return '<div class="stat">' +
      '<span class="lbl">' + esc(label) + '</span>' +
      '<span class="val">' + esc(value) + '</span>' +
      (sub ? '<span class="sub' + (subDim ? " dim" : "") + '">' + esc(sub) + '</span>' : '') +
    '</div>';
  }

  function actionTile(href, ico, title, sub) {
    return '<a class="action-btn" href="' + esc(href) + '">' +
      '<span class="ico">' + esc(ico) + '</span>' +
      '<span class="ttl">' + esc(title) + '</span>' +
      '<span class="sub">' + esc(sub) + '</span>' +
    '</a>';
  }

  function bodyOverview() {
    var A = cachedAnalytics;
    return '' +
      '<div class="module">' +
        '<div class="sub-head">This month</div>' +
        '<div class="stat-grid">' +
          statTile("Profile views", fmt(A.profileViews), "+18% vs last month") +
          statTile("Menu views", fmt(A.menuViews), "+24% vs last month") +
          statTile("WhatsApp actions", fmt(A.whatsapp), "+11% vs last month") +
          statTile("Reservations", fmt(A.reservations), "+31% vs last month") +
        '</div>' +
        '<div class="sub-head">Today</div>' +
        '<div class="stat-grid">' +
          statTile("Profile views", fmt(Math.floor(A.profileViews / 30)), "", true) +
          statTile("Menu views", fmt(Math.floor(A.menuViews / 28)), "", true) +
          statTile("WhatsApp", fmt(Math.floor(A.whatsapp / 22)), "", true) +
          statTile("Reservations", fmt(Math.max(1, Math.floor(A.reservations / 12))), "", true) +
        '</div>' +
      '</div>';
  }

  function bodyProfile() {
    var pct = cachedPct;
    var miss = missingSuggestions();
    return '' +
      '<div class="module">' +
        '<p class="module-note">' +
          (pct === 100
            ? "Your profile is complete. Everything customers need is in place."
            : "Complete these to help customers find you faster.") +
        '</p>' +
        '<div class="plan-block">' +
          '<div class="plan-name">Profile completeness</div>' +
          '<div class="plan-meta">' + pct + '% complete</div>' +
          '<div class="meta-bar"><i style="width:' + pct + '%"></i></div>' +
        '</div>' +
        (miss.length
          ? '<div class="sub-head">Suggestions</div>' +
            '<div class="row-list">' +
              miss.map(function (m) {
                return '<div class="row"><span class="k">+ ' + esc(m) + '</span></div>';
              }).join("") +
            '</div>'
          : '') +
        '<div style="margin-top:14px">' +
          '<a class="btn btn-primary" href="restaurant-onboarding.html">Complete profile</a>' +
          '<a class="btn btn-ghost" href="index.html" target="_blank">View as customer</a>' +
          '<button class="btn btn-ghost" id="btnExport" type="button">Export this restaurant</button>' +
        '</div>' +
      '</div>';
  }

  function bodyActions() {
    return '' +
      '<div class="module">' +
        '<p class="module-note">Jump straight into the content you want to add.</p>' +
        '<div class="action-grid">' +
          actionTile("menu-onboarding.html", "+", "Menu item", "Add to your menu") +
          actionTile("promo-onboarding.html", "★", "Promo", "Launch a promotion") +
          actionTile("event-onboarding.html", "◷", "Event", "Schedule an event") +
          actionTile("gallery-onboarding.html", "▣", "Gallery", "Upload images") +
        '</div>' +
      '</div>';
  }

  function bodyMenuItems() {
    var A = cachedAnalytics;
    if (!A.menuBreakdown.length) {
      return '<div class="module"><div class="empty-note">Add menu items to see which dishes get the most views. <a href="menu-onboarding.html">Add menu →</a></div></div>';
    }
    var max = A.menuBreakdown[0].views;
    return '' +
      '<div class="module">' +
        '<p class="module-note">Your five most-viewed dishes this month.</p>' +
        A.menuBreakdown.map(function (m) {
          return '<div class="bar-row">' +
            '<span class="nm">' + esc(m.name) + '</span>' +
            '<span class="bar"><i style="width:' + Math.round(m.views / max * 100) + '%"></i></span>' +
            '<span class="v">' + fmt(m.views) + '</span>' +
          '</div>';
        }).join("") +
      '</div>';
  }

  function bodyWhatsapp() {
    var A = cachedAnalytics;
    var total = A.whatsappTypes.reduce(function (s, w) { return s + w.v; }, 0);
    return '' +
      '<div class="module">' +
        '<p class="module-note">How customers contacted you on WhatsApp this month. ' + fmt(total) + ' total actions.</p>' +
        '<div class="row-list">' +
          A.whatsappTypes.map(function (w) {
            return '<div class="row"><span class="k">' + esc(w.type) + '</span><span class="v">' + fmt(w.v) + '</span></div>';
          }).join("") +
        '</div>' +
      '</div>';
  }

  function bodyPromosEvents() {
    var promos = (DB.promos || []).slice(0, 3);
    var events = (DB.events || []).slice(0, 3);

    return '' +
      '<div class="module">' +

        '<div class="sub-head">Active promos</div>' +
        (promos.length
          ? promos.map(function (p) {
              var views = 40 + (((p.title || "x").length) * 7) % 260;
              return '<div class="content-row">' +
                '<div class="info">' +
                  '<b>' + esc(p.title || "Untitled") + '</b>' +
                  '<div class="meta">' + money(p.promoPrice) +
                    (p.originalPrice ? " · was " + money(p.originalPrice) : "") +
                  '</div>' +
                '</div>' +
                '<span class="views">' + fmt(views) + ' views</span>' +
              '</div>';
            }).join("")
          : '<div class="empty-note">No promos yet. <a href="promo-onboarding.html">Create one →</a></div>') +

        '<div class="sub-head">Upcoming events</div>' +
        (events.length
          ? events.map(function (e) {
              var views = 30 + (((e.name || "x").length) * 11) % 220;
              var when = (e.startDate || "") + (e.startTime ? " · " + e.startTime : "");
              return '<div class="content-row">' +
                '<div class="info">' +
                  '<b>' + esc(e.name || "Untitled") + '</b>' +
                  '<div class="meta">' + esc(when) + '</div>' +
                '</div>' +
                '<span class="views">' + fmt(views) + ' views</span>' +
              '</div>';
            }).join("")
          : '<div class="empty-note">No events yet. <a href="event-onboarding.html">Create one →</a></div>') +

      '</div>';
  }

  function bodyBilling() {
    var A = cachedAnalytics;
    return '' +
      '<div class="module">' +
        '<div class="plan-block">' +
          '<div class="plan-name">' + esc(cachedPlanLabel) + '</div>' +
          '<div class="plan-meta">P' + cachedPlanPrice + ' / month · Next billing ' + esc(cachedNext) + '</div>' +
          '<div class="badges">' +
            '<span class="badge-pill ok">Active</span>' +
            '<span class="badge-pill ' + (cachedSetupPaid ? "ok" : "warn") + '">' +
              'P' + cachedSetupFee + ' setup ' + (cachedSetupPaid ? "paid" : "owing") +
            '</span>' +
          '</div>' +
          '<button class="btn btn-ghost" id="btnChangePlan" type="button">Manage subscription</button>' +
        '</div>' +

        '<div class="sub-head">Your month at a glance</div>' +
        '<div class="glance-grid">' +
          '<div class="item"><b>' + fmt(A.profileViews) + '</b><span>Restaurant views</span></div>' +
          '<div class="item"><b>' + fmt(A.menuViews) + '</b><span>Menu views</span></div>' +
          '<div class="item"><b>' + fmt(A.whatsapp) + '</b><span>WhatsApp actions</span></div>' +
          '<div class="item"><b>' + fmt(A.reservations) + '</b><span>Reservations</span></div>' +
        '</div>' +

        '<div class="module-note" style="margin-top:14px">EatOuts helped generate <b>' + fmt(A.whatsapp) + ' customer actions</b> for you this month.</div>' +
      '</div>';
  }

  function bodyReports() {
    return '' +
      '<div class="module">' +
        '<p class="module-note">Generate a report from your local EatOuts data. Open one to view, download as CSV, or print.</p>' +
        '<button class="btn btn-primary" id="btnWeekly" type="button">Weekly report</button>' +
        '<button class="btn btn-ghost" id="btnMonthly" type="button">Monthly report</button>' +
      '</div>';
  }

  function bodyFor(key) {
    if (key === "overview")    return bodyOverview();
    if (key === "profile")     return bodyProfile();
    if (key === "actions")     return bodyActions();
    if (key === "menuItems")   return bodyMenuItems();
    if (key === "whatsapp")    return bodyWhatsapp();
    if (key === "promosEvents")return bodyPromosEvents();
    if (key === "billing")     return bodyBilling();
    if (key === "reports")     return bodyReports();
    return "";
  }

  /* ============================================================
     ACCORDION MODULES
     ============================================================ */
  function getModules() {
    var A = cachedAnalytics;
    var id = DB.restaurant.identity || {};
    var r = DB.restaurant || {};

    var promoCount = (DB.promos || []).length;
    var eventCount = (DB.events || []).length;
    var menuCount = (DB.menuItems || []).length;

    return [
      {
        key: "overview",
        title: "Overview",
        sub: fmt(A.profileViews) + " profile views · " + fmt(A.whatsapp) + " WhatsApp actions",
        touched: true
      },
      {
        key: "profile",
        title: "Profile & publishing",
        sub: cachedPct + "% complete" + (id.status === "published" ? " · published" : " · draft"),
        touched: cachedPct > 0,
        warn: cachedPct < 80
      },
      {
        key: "actions",
        title: "Quick actions",
        sub: "Add menu items, promos, events and photos",
        touched: false
      },
      {
        key: "menuItems",
        title: "Top menu items",
        sub: menuCount ? menuCount + " item" + (menuCount === 1 ? "" : "s") + " in menu" : "No menu items yet",
        touched: menuCount > 0
      },
      {
        key: "whatsapp",
        title: "WhatsApp activity",
        sub: fmt(A.whatsapp) + " actions this month",
        touched: true
      },
      {
        key: "promosEvents",
        title: "Promos & events",
        sub: promoCount + " promo" + (promoCount === 1 ? "" : "s") + " · " + eventCount + " event" + (eventCount === 1 ? "" : "s"),
        touched: promoCount > 0 || eventCount > 0
      },
      {
        key: "billing",
        title: "Billing & subscription",
        sub: cachedPlanLabel + " · P" + cachedPlanPrice + " / month",
        touched: true
      },
      {
        key: "reports",
        title: "Reports",
        sub: "Weekly and monthly summaries",
        touched: false
      }
    ];
  }

  function buildStack() {
    var stack = $("#stack");
    var modules = getModules();

    stack.innerHTML = modules.map(function (m) {
      var isOpen = openKey === m.key;
      var cls = "acc";
      if (isOpen) cls += " open";
      if (m.touched) cls += " touched";
      if (m.warn) cls += " warn";
      return '' +
        '<section class="' + cls + '" data-key="' + esc(m.key) + '">' +
          '<button class="acc-head" type="button" aria-expanded="' + isOpen + '">' +
            '<span class="dot"></span>' +
            '<span class="acc-title">' +
              '<b>' + esc(m.title) + '</b>' +
              '<span class="acc-sub">' + esc(m.sub) + '</span>' +
            '</span>' +
          '</button>' +
          '<div class="acc-body">' +
            '<div class="acc-inner" data-body="' + esc(m.key) + '">' +
              bodyFor(m.key) +
            '</div>' +
          '</div>' +
        '</section>';
    }).join("");
  }

  function refreshSubs() {
    // refresh accordion headers without touching input state
    var modules = getModules();
    modules.forEach(function (m) {
      var acc = document.querySelector('.acc[data-key="' + m.key + '"]');
      if (!acc) return;
      var sub = acc.querySelector(".acc-sub");
      if (sub) sub.textContent = m.sub;
      acc.classList.toggle("touched", m.touched);
      acc.classList.toggle("warn", !!m.warn);
    });
  }

  function openAccordion(key, scrollTo) {
    openKey = key;
    $$(".acc").forEach(function (acc) {
      var isOpen = acc.dataset.key === key;
      acc.classList.toggle("open", isOpen);
      var head = acc.querySelector(".acc-head");
      if (head) head.setAttribute("aria-expanded", isOpen ? "true" : "false");
    });
    if (key && scrollTo) {
      var acc = document.querySelector('.acc[data-key="' + key + '"]');
      if (acc) {
        setTimeout(function () {
          try { acc.scrollIntoView({ behavior:"smooth", block:"start" }); } catch (e) {}
        }, 320);
      }
    }
  }
  function toggleAccordion(key) {
    if (openKey === key) openAccordion(null);
    else openAccordion(key, true);
  }

  /* ============================================================
     HEADER / META
     ============================================================ */
  function renderHeader() {
    var id = DB.restaurant.identity || {};
    var r = DB.restaurant || {};
    var loc = r.location || {};
    var live = id.status === "published";

    $("#heroName").textContent = id.name || "Your restaurant";
    $("#heroLocation").textContent = (loc.city || loc.town || "—") + (loc.area ? " · " + loc.area : "");

    var badge = $("#heroLive");
    var badgeTxt = $("#heroLiveText");
    badge.classList.toggle("on", live);
    badgeTxt.textContent = live ? "Live" : "Draft";

    var pct = cachedPct;
    $("#progressFill").style.width = pct + "%";
    $("#progressCount").textContent = pct + "% complete";

    var meta = $("#metaCard");
    meta.innerHTML =
      '<div class="meta-row">' +
        '<span class="meta-dot' + (live ? " live" : "") + '"></span>' +
        '<span class="meta-text">' +
          (id.name
            ? '<b>' + esc(id.name) + '</b> · ' + (live ? "live on EatOuts" : "draft — not yet published")
            : "Add your restaurant name to begin") +
        '</span>' +
      '</div>' +
      '<div class="meta-bar"><i style="width:' + pct + '%"></i></div>' +
      '<div class="meta-foot">' +
        '<span>Profile completeness</span>' +
        '<span class="val">' + pct + '%</span>' +
      '</div>';
  }

  /* ============================================================
     BOOT
     ============================================================ */
  function computeCached() {
    cachedAnalytics = deriveAnalytics();
    cachedPct = completeness();
    cachedPlan = (DB.settings && DB.settings.plan) || "starter";
    cachedPlanLabel = ({ starter:"EatOuts Starter", growth:"EatOuts Growth", pro:"EatOuts Pro" })[cachedPlan] || "EatOuts Starter";

    // pricing single source
    var PRICING = window.EATOUTS_PRICING || (function () {
      try {
        var s = (window.EatoutsDB && EatoutsDB.load && EatoutsDB.load().settings) || DB.settings;
        if (s && s.pricing) return s.pricing;
      } catch (e) {}
      return { setup: 300, tiers: { starter: { price: 100 }, growth: { price: 300 }, pro: { price: 500 } } };
    })();
    cachedPlanPrice = (PRICING.tiers[cachedPlan] && PRICING.tiers[cachedPlan].price) || 100;
    cachedSetupFee = PRICING.setup || 300;

    var setup = setupFeeStatus();
    cachedSetupPaid = !!setup.paid;

    var d = new Date(); d.setDate(d.getDate() + 30);
    cachedNext = d.toLocaleDateString("en-GB", { day:"2-digit", month:"short", year:"numeric" });
  }

  function render() {
    computeCached();
    renderHeader();
    buildStack();
  }

  function wireActions(root) {
    root = root || document;
    var exp = root.querySelector("#btnExport");
    if (exp) exp.onclick = exportVenue;

    var changePlan = root.querySelector("#btnChangePlan");
    if (changePlan) changePlan.onclick = function () {
      var order = ["starter","growth","pro"];
      var i = order.indexOf(cachedPlan);
      var next = order[(i + 1) % order.length];
      DB.settings = DB.settings || {};
      DB.settings.plan = next;
      dbSave(DB);
      toast("Plan changed to " + next);
      render();
      wireActions();
    };

    var weekly = root.querySelector("#btnWeekly");
    if (weekly) weekly.onclick = function () { showReport("weekly", cachedAnalytics, DB.restaurant.identity.name); };

    var monthly = root.querySelector("#btnMonthly");
    if (monthly) monthly.onclick = function () { showReport("monthly", cachedAnalytics, DB.restaurant.identity.name); };
  }

  /* ---- event delegation on stack ---- */
  var stack = $("#stack");
  stack.addEventListener("click", function (e) {
    var head = e.target.closest(".acc-head");
    if (head) {
      var acc = head.closest(".acc");
      if (acc) {
        var key = acc.dataset.key;
        // re-render body on open to keep values fresh
        if (openKey !== key) {
          var body = acc.querySelector('[data-body="' + key + '"]');
          if (body) body.innerHTML = bodyFor(key);
        }
        toggleAccordion(key);
        // wire any actions inside the newly-opened body
        if (openKey === key) wireActions(acc);
      }
      return;
    }
  });

  /* ---- boot ---- */
  render();
  wireActions();
  openAccordion(null);
})();
</script>
</body>
</html>
