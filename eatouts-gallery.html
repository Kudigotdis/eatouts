<!doctype html>
<!-- PAGE: Gallery --><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#ffffff"><title>Gallery · EatOuts</title><link rel="stylesheet" href="assets/eatouts-manager.css"><style>.galgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.galgrid figure{margin:0;position:relative;aspect-ratio:1;overflow:hidden;border-radius:8px;background:#f4efe4}.galgrid img{width:100%;height:100%;object-fit:cover;display:block}.galgrid button{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-weight:900;cursor:pointer;line-height:1}</style></head><body data-page="eatouts-gallery"><div id="mount"></div><script src="js/eatouts-manager-db.js"></script><script src="assets/data/demo/the-food-place/demo-data.js"></script><script src="js/eatouts-manager-seed.js"></script><script src="js/eatouts-roles.js"></script><script src="js/eatouts-users.js"></script><script src="js/eatouts-feedback.js"></script><script src="js/eatouts-blog-admin.js"></script><script src="js/eatouts-auth.js"></script><script src="js/eatouts-manager.js"></script><script src="js/eatouts-customer.js"></script><script>document.addEventListener("DOMContentLoaded",()=>{
 if(!EO.guard({"roles":["customer"]}))return;
 const S=window.EatoutsCustomer;
 function render(){
  const rows=S?S.favourites.list("gallery"):[];
  document.querySelector("#grid").innerHTML=rows.length?'<div class="galgrid">'+rows.map(g=>{
   const src=g.imageRef||(g.payload&&g.payload.src)||"";
   return `<figure>${src?'<img src="'+EO.esc(src)+'" alt="'+EO.esc(g.title||"")+'" loading="lazy">':''}<button data-del="${EO.esc(g.refId||g.id)}" aria-label="Remove">&times;</button></figure>`;
  }).join("")+'</div>':EO.empty("No saved photos","Tap the heart on a gallery photo in the main app to save it here.");
 }
 document.querySelector("#mount").innerHTML=EO.shell("Gallery","Photos you have saved from EatOuts",`<div id="grid"></div>`,{section:"Customer"});
 document.querySelector("#grid").addEventListener("click",e=>{const d=e.target.closest("[data-del]");if(!d)return;S.favourites.remove({type:"gallery",refId:d.dataset.del});render();});
 render();
 S&&S.onChange&&S.onChange(render);
});</script></body></html>
