<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>About — EatOuts</title>
<!-- PAGE: venue-about -->
<style>
  :root{
    --brand-bg:       #f3ece0;
    --hero-logo-bg:   #ffffff;
    --acc-bg:         #ffffff;
    --acc-summary-bg: #f6f1e6;
    --chip-bg:        rgba(210,182,130,.10);
    --chip-border:    rgba(180,150,100,.22);
    --chip-ink:       #5c5140;

    --white:   #ffffff;
    --ink:     #191818;
    --ink-2:   #3a352b;
    --ink-3:   #7a7263;
    --muted:   #a89a7e;
    --border:  #ece5d5;
    --border-strong:#d5cab0;
    --accent:  #4d6b3a;
    --accent-soft: rgba(77,107,58,.12);
    --wa:      #25d366;
    --call:    #3c7cc4;
    --loc:     #d94f5c;
    --green:   #2e9e56;
    --red:     #c0392b;
    --shadow-sm: 0 1px 2px rgba(60,45,20,.06);
    --shadow-md: 0 4px 16px rgba(60,45,20,.10);
    --shadow-popup: 0 24px 70px rgba(15,10,0,.28), 0 0 0 1px rgba(0,0,0,.04);
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    color:var(--ink);
    line-height:1.55;
    -webkit-font-smoothing:antialiased;

  }
  [hidden]{display:none!important}
  button{font-family:inherit}

  /* ── APP SHELL ── */
  .app{
    max-width:520px;margin:0 auto;min-height:100vh;
    background:var(--brand-bg);
    display:flex;flex-direction:column;
    transition:background .25s ease;
    /* keeps the last content clear of the fixed #nav (56px bar + safe area) */
    padding-bottom:calc(56px + env(safe-area-inset-bottom));
    position:relative;
  }

  #hdr{flex:0 0 auto;height:58px;display:flex;align-items:center;gap:10px;padding:0 14px;background:#ffffff;border-bottom:1px solid #ece7db;position:sticky;top:0;z-index:58;padding-top:env(safe-area-inset-top)}
  .brand-mark{height:34px;width:auto;aspect-ratio:1172/504;flex:0 0 auto;display:flex;align-items:center;justify-content:flex-start;background:none;border:0;border-radius:0;box-shadow:none;overflow:hidden;padding:0;margin:0}
  .brand-mark img{width:100%;height:100%;object-fit:contain;display:block}
  .hdr-right{margin-left:auto}
  .hdr-chip{font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#a89a7e;border:1px solid #ece7db;border-radius:20px;padding:4px 9px;background:#faf8f2}

  /* ── HERO-LOGO STRIP ── */
  .hero-logo{
    width:100%;
    background:var(--hero-logo-bg);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    transition:background .25s ease, padding .15s ease;
  }
  .logo-btn{
    background:none;border:0;padding:0;cursor:pointer;
    display:block;
    width:200px;height:200px;
    max-width:calc(100vw - 60px);
    aspect-ratio:1;
    transition:transform .2s ease;
    margin-top:16px;
  }
  .logo-btn:hover{transform:scale(1.02)}
  .logo-btn:active{transform:scale(.98)}
  .logo-btn img{
    width:100%;height:100%;display:block;object-fit:contain;
  }

  /* Drag handle — 5% opacity */
  .drag-handle{
    width:100%;
    height:16px;
    display:flex;align-items:center;justify-content:center;
    cursor:ns-resize;
    touch-action:none;
    user-select:none;-webkit-user-select:none;
    background:transparent;
    margin-top:4px;
    opacity:.05;
    transition:opacity .2s ease;
  }
  .drag-handle:hover{opacity:.35}
  .drag-handle::before{
    content:'';
    width:48px;height:3px;border-radius:999px;
    background:rgba(0,0,0,.9);
  }

  /* ── HERO ── */
  .hero{
    width:100%;
    background:#fff;
    text-align:center;
    padding:18px 24px 22px;
  }
  .hero h1{
    margin:0 0 10px;
    font-size:23px;line-height:1.2;
    font-weight:800;letter-spacing:-.35px;color:var(--ink);
  }
  .status-line{
    margin:0;
    display:inline-flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
    justify-content:center;
    font-size:13.5px;
    font-weight:700;
    color:var(--ink-2);
  }
  .status-dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--green);
    box-shadow:0 0 0 3px rgba(46,158,86,.2);
    flex:0 0 auto;
  }
  .status-dot.open{animation:pulse 2s ease-in-out infinite}
  .status-dot.closed{background:var(--red);box-shadow:0 0 0 3px rgba(192,57,43,.18)}
  @keyframes pulse{
    0%,100%{box-shadow:0 0 0 3px rgba(46,158,86,.2)}
    50%    {box-shadow:0 0 0 6px rgba(46,158,86,.05)}
  }
  .status-sep{color:var(--muted);font-weight:500}

  /* ── CONTENT SHEET ── */
  .content-sheet{
    background:#fff;
    border-radius:22px;
    box-shadow:var(--shadow-md);
    margin:12px auto 20px;
    width:calc(100% - 32px);
    padding:22px 0 10px;
  }

  /* ── SOCIAL ROW (56px frames) ── */
  .social-wrap{padding:0 18px 22px;display:flex;justify-content:center}
  .social-row{
    display:flex;flex-wrap:wrap;justify-content:center;
    gap:12px;max-width:370px;
  }
  .social-row::after{
    content:"";flex-basis:100%;height:0;order:1;
  }
  .social-ico{order:0}
  .social-ico:nth-child(n+6){order:2}

  .social-ico{
    width:56px;height:56px;border-radius:50%;
    background:#f6f1e6;
    border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;
    color:var(--ink-3);text-decoration:none;
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease, background .15s ease, color .15s ease;
    position:relative;padding:0;
  }
  .social-ico svg{
    width:23px;height:23px;
    stroke:currentColor;fill:none;
    stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;
  }
  .social-ico img{width:100%;height:100%;object-fit:contain;display:block}
  .social-ico.off{
    color:#bfb49b;background:#f6f1e6;
    border-color:transparent;opacity:.9;cursor:default;
  }
  .social-ico.on{
    color:#fff;border-color:transparent;
    box-shadow:0 3px 14px rgba(0,0,0,.14);
  }
  .social-ico.on[data-channel="whatsapp"]{background:var(--wa)}
  .social-ico.on[data-channel="call"]    {background:var(--call)}
  .social-ico.on[data-channel="location"]{background:var(--loc)}
  .social-ico.on:hover{transform:translateY(-2px)}

  /* ── PAD / ACCORDIONS ── */
  .pad{padding:0 18px 8px}

  .acc{
    background:var(--acc-bg);
    border:1px solid var(--border);
    border-radius:16px;
    margin-bottom:10px;
    overflow:hidden;
    box-shadow:var(--shadow-sm);
    transition:background .2s ease;
  }
  .acc > summary{
    list-style:none;cursor:pointer;
    padding:15px 16px;
    font-size:15px;font-weight:800;color:var(--ink);
    letter-spacing:.1px;
    display:flex;align-items:center;user-select:none;
    background:var(--acc-summary-bg);
    transition:background .15s ease;
  }
  .acc > summary::-webkit-details-marker{display:none}
  .acc > summary::marker{content:""}
  .acc > summary:hover{filter:brightness(.97)}
  .acc[open] > summary{border-bottom:1px solid var(--border)}
  .acc-body{
    display:grid;grid-template-rows:0fr;
    transition:grid-template-rows .28s ease;
  }
  .acc[open] .acc-body{grid-template-rows:1fr}
  .acc-body > .acc-inner{overflow:hidden;min-height:0}
  .acc-content{
    padding:16px 16px 18px;
    font-size:14.5px;color:var(--ink-2);line-height:1.6;
  }

  /* ── Generic KV rows ── */
  .kv{
    display:flex;justify-content:space-between;gap:16px;
    padding:10px 0;
    border-bottom:1px dashed var(--border);
    font-size:14px;
  }
  .kv:first-child{padding-top:0}
  .kv:last-child{border-bottom:0;padding-bottom:0}
  .kv .k{color:var(--ink-3);font-weight:600;flex:1;min-width:0}
  .kv .v{color:var(--ink);font-weight:700;text-align:right;flex:1;min-width:0}
  .kv .v.closed{color:var(--red)}

  /* ── OPERATING HOURS — single-column stacked, centred ── */
  .acc-hours .acc-content{
    padding:0 16px 16px;
  }
  .acc-hours .hours{
    list-style:none;
    margin:0;
    padding:0;
    border-top:1px solid rgba(0,0,0,.08);
  }
  .acc-hours .hours__row{
    display:grid;
    grid-template-columns:1fr;
    justify-items:center;
    text-align:center;
    row-gap:.5rem;
    padding-block:.75rem;
    border-bottom:1px solid rgba(0,0,0,.08);
  }
  .acc-hours .hours__row:last-child{border-bottom:0}
  .acc-hours .hours__day,
  .acc-hours .hours__time{
    text-align:center;
    margin-inline:auto;
    line-height:1.3;
  }
  .acc-hours .hours__day{
    color:#4b5563;
    font-weight:500;
    font-size:16px;
  }
  .acc-hours .hours__time{
    color:#111827;
    font-weight:700;
    font-size:1.25rem;
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }
  .acc-hours .hours__time.is-closed{
    color:#b91c1c;
  }

  /* ── CHIPS ── */
  .tagwrap{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    justify-content:center;
    font-size:18px;
  }
  .chip{
    display:inline-flex;align-items:center;
    padding:9px 16px;border-radius:22px;
    background:var(--chip-bg);
    color:var(--chip-ink);
    font-size:16px;
    font-weight:700;letter-spacing:.1px;
    border:1px solid var(--chip-border);
    cursor:pointer;
    transition:transform .12s ease, background .15s ease, border-color .15s ease;
    text-align:left;
  }
  .chip:hover{
    background:rgba(210,182,130,.22);
    border-color:rgba(180,150,100,.36);
    transform:translateY(-1px);
  }
  .chip:active{transform:translateY(0)}
  /* Hosting chips are read-only labels, not buttons. */
  .tagwrap .chip.static{cursor:default;pointer-events:none}
  .tagwrap .chip.static:hover{background:var(--chip-bg);border-color:var(--chip-border);transform:none}

  /* ── OPTIONS LIST ── */
  .opt-list{
    display:flex;flex-direction:column;
    border-radius:12px;overflow:hidden;
    background:#faf7f0;
    border:1px solid var(--border);
  }
  .opt{
    display:flex;align-items:center;justify-content:center;gap:8px;
    padding:13px 15px;
    border:0;border-bottom:1px solid var(--border);
    font-size:14px;font-weight:800;color:var(--ink);
    background:transparent;text-align:center;width:100%;cursor:pointer;
    transition:background .12s ease;
  }
  .opt:last-child{border-bottom:0}
  .opt:hover{background:#fff}
  .opt .val{color:var(--ink);font-weight:800;font-size:14px}
  .opt .val.muted{color:var(--muted);font-weight:700;font-style:italic}

  /* ── CAROUSEL (used by Promos and Venue) ── */
  .promo-carousel{
    display:flex;
    gap:8px;
    overflow-x:auto;
    scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    padding:0 2px;
  }
  .promo-carousel::-webkit-scrollbar{display:none}

  .promo-thumb{
    flex:0 0 calc((100% - 16px) / 3);
    aspect-ratio:1;
    border-radius:12px;
    background:#e9e4da;
    border:0;
    scroll-snap-align:start;
    cursor:pointer;
    position:relative;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .promo-thumb:hover{transform:scale(1.02);box-shadow:0 4px 12px rgba(0,0,0,.08)}

  .promo-dots{
    display:flex;justify-content:center;gap:6px;
    padding:14px 0 4px;
  }
  .promo-dot{
    width:6px;height:6px;border-radius:50%;
    background:rgba(0,0,0,.15);
    transition:background .2s ease, width .2s ease;
  }
  .promo-dot.on{
    background:var(--ink-2);
    width:18px;border-radius:3px;
  }

  /* ── ACTIONS ── */
  .actions{padding:6px 18px 22px;display:flex;flex-direction:column;gap:10px}
  .btn{
    display:flex;align-items:center;justify-content:center;gap:8px;
    width:100%;padding:15px 18px;border-radius:14px;
    font-size:15px;font-weight:800;letter-spacing:.1px;
    border:1px solid transparent;cursor:pointer;text-decoration:none;
    transition:transform .12s ease, background .15s ease;
  }
  .btn:active{transform:scale(.985)}
  .btn-ghost{
    background:transparent;color:var(--ink);
    border-color:var(--border-strong);
  }
  .btn-ghost:hover{background:#faf7f0}

  /* ── BOTTOM NAV (BLACK, WHITE ICONS, NO TEXT) ── */
  /* position:fixed pins the bar to the bottom of the viewport so it always
     stays visible while the page scrolls; left/transform + max-width keep it
     centred inside the 520px .app column. */
  #nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;display:flex;background:#0a0a0a;border-top:1px solid #1a1a1a;padding-bottom:env(safe-area-inset-bottom);z-index:50}
  .nav-btn{flex:1;padding:16px 2px 15px;display:flex;align-items:center;justify-content:center;background:transparent;border:0;color:rgba(255,255,255,.42);transition:color .18s}
  .nav-btn svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;transition:transform .18s}
  .nav-btn.on{color:#ffffff}
  .nav-btn.on svg{transform:translateY(-1px);filter:drop-shadow(0 0 8px rgba(255,255,255,.35))}
  .nav-btn:active{color:rgba(255,255,255,.75)}

  /* ── LOGO OVERLAY ── */
  .logo-overlay{
    position:fixed;inset:0;z-index:110;
    background:rgba(10,8,4,.72);
    backdrop-filter:blur(16px) saturate(140%);
    -webkit-backdrop-filter:blur(16px) saturate(140%);
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    padding:32px 24px calc(32px + env(safe-area-inset-bottom));
    gap:28px;
    opacity:0;pointer-events:none;
    transition:opacity .25s ease;
  }
  .logo-overlay.open{opacity:1;pointer-events:auto}
  .logo-overlay .logo-large{
    width:min(280px, 72vw);height:min(280px, 72vw);
    object-fit:contain;border-radius:18px;
    box-shadow:0 24px 60px rgba(0,0,0,.55);
    transform:scale(.88);
    transition:transform .35s cubic-bezier(.34,1.56,.64,1);
    background:#fdf6e4;
  }
  .logo-overlay.open .logo-large{transform:scale(1)}
  .logo-overlay-close{
    position:absolute;top:18px;right:18px;
    width:40px;height:40px;border-radius:50%;
    background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.2);
    color:#fff;font-size:20px;line-height:1;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:background .15s ease;
  }
  .logo-overlay-close:hover{background:rgba(255,255,255,.22)}

  .settings-acc{
    width:min(360px, 100%);
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.15);
    border-radius:16px;color:#fff;overflow:hidden;
  }
  .settings-acc > summary{
    list-style:none;cursor:pointer;padding:15px 20px;
    font-weight:800;font-size:15px;
    display:flex;align-items:center;color:#fff;
  }
  .settings-acc > summary::-webkit-details-marker{display:none}
  .settings-acc > summary::marker{content:""}
  .settings-acc > summary:hover{background:rgba(255,255,255,.06)}
  .settings-acc[open] > summary{border-bottom:1px solid rgba(255,255,255,.12)}
  .settings-body{
    display:grid;grid-template-rows:0fr;
    transition:grid-template-rows .25s ease;
  }
  .settings-acc[open] .settings-body{grid-template-rows:1fr}
  .settings-body > .si{overflow:hidden;min-height:0}
  .settings-body .si-inner{
    padding:10px 12px 14px;
    display:flex;flex-direction:column;gap:6px;
  }
  .settings-btn{
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.12);
    color:#fff;padding:13px 16px;border-radius:10px;
    text-align:left;font-weight:600;font-size:14px;cursor:pointer;
    transition:background .15s ease;
    display:flex;align-items:center;justify-content:space-between;
  }
  .settings-btn:hover{background:rgba(255,255,255,.14)}
  .settings-btn small{color:rgba(255,255,255,.55);font-weight:500;font-size:12px}

  /* ── FLOATING POPUP ── */
  .popup-scrim{
    position:fixed;inset:0;z-index:90;
    background:rgba(15,10,5,.42);
    backdrop-filter:blur(3px);
    -webkit-backdrop-filter:blur(3px);
    opacity:0;pointer-events:none;
    transition:opacity .22s ease;
  }
  .popup-scrim.open{opacity:1;pointer-events:auto}

  .popup{
    position:fixed;
    top:50%;left:50%;
    transform:translate(-50%, -50%) scale(.94);
    width:calc(100% - 40px);
    max-width:420px;
    max-height:82vh;
    background:#fff;
    border-radius:20px;
    box-shadow:var(--shadow-popup);
    z-index:95;
    opacity:0;pointer-events:none;
    transition:opacity .22s ease, transform .3s cubic-bezier(.34,1.4,.64,1);
    display:flex;flex-direction:column;
    overflow:hidden;
  }
  .popup.open{
    opacity:1;pointer-events:auto;
    transform:translate(-50%, -50%) scale(1);
  }
  .popup-head{
    padding:20px 22px 12px;
    flex:0 0 auto;
  }
  .popup-title{
    margin:0;
    font-size:18px;font-weight:800;
    color:var(--ink);letter-spacing:-.2px;
  }
  .popup-body{
    padding:0 22px 22px;
    overflow-y:auto;flex:1 1 auto;
    -webkit-overflow-scrolling:touch;
  }
  .popup-body p{margin:0 0 12px;color:var(--ink-2);font-size:14.5px;line-height:1.6}

  .sheet-section{margin:14px 0 4px}
  .sheet-section:first-child{margin-top:0}
  .sheet-section h3{
    margin:0 0 4px;
    font-size:11.5px;font-weight:800;
    color:var(--ink-3);text-transform:uppercase;letter-spacing:.8px;
  }

  .popup-list{display:flex;flex-direction:column}
  .popup-row{
    display:block;width:100%;
    padding:18px 2px;
    margin:0;
    border:0;
    border-bottom:1px solid rgba(0,0,0,.08);
    background:transparent;
    text-align:left;
    text-decoration:none;
    color:var(--ink);
    font-size:21px;
    font-weight:700;
    letter-spacing:-.2px;
    cursor:pointer;
    transition:background .12s ease;
    font-family:inherit;
    line-height:1.25;
  }
  .popup-row:last-child{border-bottom:0}
  .popup-row:hover{background:rgba(0,0,0,.02)}

  .history-list{display:flex;flex-direction:column}
  .history-item{
    display:block;width:100%;padding:18px 2px;
    text-align:center;
    background:transparent;
    border:0;
    border-bottom:1px solid rgba(0,0,0,.08);
    font-size:17px;font-weight:700;color:var(--ink);
    cursor:pointer;
    font-family:inherit;
    transition:background .12s ease;
  }
  .history-item:last-child{border-bottom:0}
  .history-item:hover{background:rgba(0,0,0,.02)}
  .history-item:active{transform:scale(.99)}

  .chip-info-head{
    margin-bottom:6px;
    font-size:13px;font-weight:800;
    color:var(--accent);
    text-transform:uppercase;letter-spacing:.7px;
  }
  .chip-info-body{
    color:var(--ink-2);font-size:14.5px;line-height:1.65;margin:0;
  }

  .color-row{
    display:flex;align-items:center;gap:12px;
    padding:12px 0;border-bottom:1px dashed var(--border);
  }
  .color-row:last-child{border-bottom:0}
  .color-row label{flex:1;font-size:13.5px;font-weight:700;color:var(--ink-2)}
  .color-row .color-pickers{display:flex;gap:8px;align-items:center}
  .color-row input[type="color"]{
    width:40px;height:36px;border:1px solid var(--border);
    border-radius:9px;background:none;padding:2px;cursor:pointer;
  }
  .color-row input[type="text"]{
    width:98px;padding:8px 10px;border:1px solid var(--border);
    border-radius:9px;font:inherit;font-size:13px;font-weight:600;
    color:var(--ink);background:#faf7f0;
  }
  .color-row input[type="text"]:focus{outline:2px solid var(--accent);outline-offset:-1px}

  .sheet-actions{display:flex;gap:8px;margin-top:16px}
  .sheet-actions .btn{padding:13px}
  .sheet-actions .btn-primary{background:var(--ink);color:#fff}
  .sheet-actions .btn-secondary{background:#f6f1e6;color:var(--ink-2);border-color:var(--border)}

  .toast{
    position:fixed;bottom:96px;left:50%;transform:translate(-50%,20px);
    background:rgba(25,24,24,.92);color:#fff;
    padding:11px 20px;border-radius:12px;
    font-size:13.5px;font-weight:600;
    z-index:130;opacity:0;pointer-events:none;

﻿<script>
/* __VENUE_ABOUT_V2__ */
(function(){
  'use strict';

  var raw = (new URLSearchParams(location.search)).get('link') || (location.hash || '').replace(/^#\/?/, '');
  var slug = decodeURIComponent(String(raw || '').trim().toLowerCase());

  function canon(s) {
    var v = String(s || '').toLowerCase();
    if (window.EatoutsBrand && typeof EatoutsBrand.canonicalKey === 'function') {
      try { v = String(EatoutsBrand.canonicalKey(s) || v).toLowerCase(); } catch (e) {}
    }
    return v.replace(/[^a-z0-9]+/g, '');
  }

  function pickBranch(rec) {
    if (!rec) return null;
    if (Array.isArray(rec.branches) && rec.branches.length) return rec.branches[0];
    return null;
  }

  function resolve(s) {
    if (!s) return null;
    var target = canon(s);
    var dir = (window.DIRECTORY_RUNTIME_DATA && window.DIRECTORY_RUNTIME_DATA.restaurants) || [];

    for (var i = 0; i < dir.length; i++) {
      var r = dir[i] || {};
      var rs = String(r.slug || '').toLowerCase();
      var rid = String(r.id || '').toLowerCase();
      if (rs === s || rid === s || canon(rs) === target || canon(rid) === target) {
        return { kind: 'restaurant', slug: rs || s, name: r.name || s, logo: r.logo || null, record: r, branch: null };
      }
    }

    if (window.EatoutsBottleStores) {
      var bs = EatoutsBottleStores.get(s) || EatoutsBottleStores.get(target);
      if (!bs && bs === null) {
        var brands = EatoutsBottleStores.all();
        for (var b = 0; b < brands.length; b++) {
          if (canon(brands[b].slug) === target) { bs = brands[b]; break; }
        }
      }
      if (bs) {
        var b0 = pickBranch(bs) || {};
        return { kind: 'bottle_store', slug: bs.slug || s, name: bs.name || s, logo: bs.logo || null, record: bs, branch: b0 };
      }
    }

    if (window.EatoutsCatering) {
      var cat = EatoutsCatering.get(s) || EatoutsCatering.get(target);
      if (!cat) {
        var cbrands = EatoutsCatering.all();
        for (var c = 0; c < cbrands.length; c++) {
          if (canon(cbrands[c].slug) === target) { cat = cbrands[c]; break; }
        }
      }
      if (cat) {
        var c0 = pickBranch(cat) || {};
        return { kind: 'catering', slug: cat.slug || s, name: cat.name || s, logo: cat.logo || null, record: cat, branch: c0 };
      }
    }

    /* Bakeries: flat records from window.BAKERY_BUSINESSES_DATA, slugged
       "bakery-<id>" by the directory list in index.html. Fields may be
       incomplete ("Not specified"); normalise to empty so the page renders
       gracefully with whatever exists. */
    if (window.BAKERY_BUSINESSES_DATA) {
      var bk = window.BAKERY_BUSINESSES_DATA;
      var clean = function (v) { v = String(v || '').trim(); return (!v || v === 'Not specified') ? '' : v; };
      for (var k = 0; k < bk.length; k++) {
        var brec = bk[k] || {};
        var bslug = 'bakery-' + brec.id;
        var bname = String(brec.businessName || '');
        if (bslug === s || canon(bslug) === target || canon(bname) === target) {
          var bphone = clean(brec.contacts);
          var btw = clean(brec.town), bar = clean(brec.area), bad = clean(brec.address);
          return {
            kind: 'bakery',
            slug: bslug,
            name: bname || s,
            logo: 'assets/logo/logo_placement_image.png',
            record: {
              name: bname,
              town: btw,
              area: bar,
              address: bad,
              contacts: bphone ? [{ label: 'Phone', value: bphone }] : [],
              socials: []
            },
            branch: { id: bslug, slug: bslug, name: bname, town: btw, area: bar, address: bad, phones: bphone ? [bphone] : [] }
          };
        }
      }
    }

    return null;
  }

  var biz = resolve(slug);

  function closePopup() {
    var s = document.getElementById('popupScrim'); if (s) s.classList.remove('open');
    var p = document.getElementById('popup'); if (p) p.classList.remove('open');
  }
  function openPopup(title, html) {
    var t = document.getElementById('popupTitle'); if (t) t.textContent = title;
    var b = document.getElementById('popupBody'); if (b) b.innerHTML = html;
    var s = document.getElementById('popupScrim'); if (s) s.classList.add('open');
    var p = document.getElementById('popup'); if (p) p.classList.add('open');
  }
  var scrim = document.getElementById('popupScrim');
  if (scrim) scrim.addEventListener('click', closePopup);

  /* ---- No business resolved: hand back to the directory, no placeholder ---- */
  if (!biz) { window.location.replace('index.html#restaurants'); return; }

  /* ---- Title & hero ---- */
  document.title = biz.name + ' - About - EatOuts';

  var logoImg = document.getElementById('logoImg');
  var logoSrc = biz.logo;
  if (!logoSrc && window.EatoutsBrand && typeof EatoutsBrand.logoFor === 'function' && biz.record) {
    try { logoSrc = EatoutsBrand.logoFor(biz.record); } catch (e) {}
  }
  /* Bakeries have no logo art yet — show the shared placeholder image
     instead of the letter tile used for other logo-less venues. */
  if (biz.kind !== 'bakery' && logoSrc && window.EatoutsBrand && typeof EatoutsBrand.isPlaceholderLogo === 'function') {
    try { if (EatoutsBrand.isPlaceholderLogo(logoSrc)) logoSrc = null; } catch (e) {}
  }
  if (logoImg) {
    if (logoSrc) {
      logoImg.src = logoSrc;
      logoImg.alt = biz.name + ' logo';
      logoImg.style.opacity = '1';
      logoImg.onerror = function () { logoImg.style.opacity = '0'; };
    } else {
      var initial = (biz.name.charAt(0) || '?').toUpperCase();
      var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><rect width="200" height="200" fill="#f3ece0"/><text x="100" y="128" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="80" font-weight="800" fill="#a89a7e">' + initial + '</text></svg>';
      logoImg.src = 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
      logoImg.alt = biz.name;
      logoImg.style.opacity = '1';
    }
  }

  var h1 = document.querySelector('.hero h1'); if (h1) h1.textContent = biz.name;

  /* ---- Status line (no delivery) ---- */
  var sl = document.getElementById('statusLine');
  if (sl) {
    var now = new Date(), day = now.getDay(), hour = now.getHours() + now.getMinutes() / 60;
    var o = 7.5, c = 17.5, closed = false;
    if (day === 0) closed = true;
    else if (day === 4 || day === 5) c = 21;
    else if (day === 6) { o = 8; c = 16; }
    var f = function (n) { var hh = Math.floor(n), mm = Math.round((n - hh) * 60); return (hh < 10 ? '0' : '') + hh + ':' + (mm < 10 ? '0' : '') + mm; };
    var txt, dc;
    if (closed) { txt = 'Closed today - Opens Mon 07:30'; dc = 'closed'; }
    else if (hour >= o && hour < c) { txt = 'Open till ' + f(c); dc = 'open'; }
    else if (hour < o) { txt = 'Closed - Opens at ' + f(o); dc = 'closed'; }
    else { txt = 'Closed - Opens ' + (day === 6 ? 'Mon 07:30' : 'tomorrow 07:30'); dc = 'closed'; }
    sl.innerHTML = '<span class="status-dot ' + dc + '"></span><span>' + txt + '</span>';
  }

  /* ---- Build CONTACTS from resolved business ---- */
  var contacts = (biz.record && biz.record.contacts) || [];
  var branchPhones = (biz.branch && biz.branch.phones) || [];
  var C = { wa: [], call: [], loc: [] };
  contacts.forEach(function (c) {
    if (!c || !c.value) return;
    if (/whatsapp/i.test(c.label)) C.wa.push({ label: c.label, number: String(c.value) });
    else if (/phone|call|tel/i.test(c.label)) C.call.push({ label: c.label, number: String(c.value) });
  });
  branchPhones.forEach(function (n, i) {
    var lbl = (biz.branch && biz.branch.name) || biz.name;
    if (i > 0) lbl += ' ' + (i + 1);
    var s = String(n);
    if (!C.wa.some(function (x) { return x.number === s; })) C.wa.push({ label: lbl, number: s });
    if (!C.call.some(function (x) { return x.number === s; })) C.call.push({ label: lbl, number: s });
  });
  var town = (biz.record && biz.record.town) || (biz.branch && biz.branch.town) || '';
  var area = (biz.record && biz.record.area) || (biz.branch && biz.branch.area) || '';
  var place = (biz.record && biz.record.place) || '';
  if (town || area) {
    C.loc.push({
      label: [area, town].filter(Boolean).join(' · ') || biz.name,
      url: 'https://maps.google.com/?q=' + encodeURIComponent(biz.name + ' ' + town + ' Botswana')
    });
  }
  /* The mall / shopping centre the venue sits in, when the owner picked one. */
  if (place) {
    C.loc.push({
      label: place,
      url: 'https://maps.google.com/?q=' + encodeURIComponent(place + ' ' + town + ' Botswana')
    });
  }

  /* ---- Social row ---- */
  var socialRow = document.getElementById('socialRow');
  if (socialRow) {
    var socials = (biz.record && biz.record.socials) || [];
    function socialUrl(platform) {
      for (var i = 0; i < socials.length; i++) {
        var s = socials[i];
        if (s && s.platform && s.platform.toLowerCase().indexOf(platform) > -1 && s.url) return s.url;
      }
      return null;
    }
    function icon(channel, label, onSrc, offSrc) {
      var on = false, href = '#';
      if (channel === 'whatsapp') { on = C.wa.length > 0; href = on ? 'https://wa.me/' + String(C.wa[0].number).replace(/[^0-9]/g, '') : '#'; }
      else if (channel === 'call') { on = C.call.length > 0; href = on ? 'tel:' + String(C.call[0].number).replace(/[^0-9+]/g, '') : '#'; }
      else if (channel === 'location') { on = C.loc.length > 0; href = on ? C.loc[0].url : '#'; }
      else if (channel === 'share' || channel === 'rate') { on = true; href = '#'; }
      else { var u = socialUrl(channel) || (channel === 'website' ? (biz.record && biz.record.website) : null); on = !!u; href = u || '#'; }
      var src = on ? onSrc : offSrc;
      var tag = on
        ? '<a class="social-ico on" href="' + href + '" target="_blank" rel="noopener" aria-label="' + label + '"><img src="' + src + '" alt="' + label + '"></a>'
        : '<span class="social-ico off" role="img" aria-label="' + label + '"><img src="' + src + '" alt="' + label + '"></span>';
      return tag;
    }
    socialRow.innerHTML =
        icon('instagram', 'Instagram', 'assets/icons/Instagram_icon.png', 'assets/icons/Instagram_Off.png')
      + icon('facebook', 'Facebook', 'assets/icons/facebook_icon.png', 'assets/icons/facebook_icon_off.png')
      + icon('whatsapp', 'WhatsApp', 'assets/icons/whatsApp_icon_on.png', 'assets/icons/whatsApp_icon_off.png')
      + icon('tiktok', 'TikTok', 'assets/icons/TikTok_icon.png', 'assets/icons/TikTok_Off.png')
      + icon('twitter', 'X (Twitter)', 'assets/icons/Twitter_icon.png', 'assets/icons/Twitter_Off.png')
      + icon('youtube', 'YouTube', 'assets/icons/YouTube_icon.png', 'assets/icons/YouTube_Off.png')
      + icon('share', 'Share', 'assets/icons/Share_On.png', 'assets/icons/Share_On.png')
      + icon('rate', 'Rate', 'assets/icons/rate_on.webp', 'assets/icons/rate_on.webp')
      + icon('website', 'Website', 'assets/icons/Website_icon.png', 'assets/icons/Website_Off.png')
      + icon('call', 'Call', 'assets/icons/Call_icon.png', 'assets/icons/Call_Off.png')
      + icon('location', 'Location', 'assets/icons/GPS - icon.png', 'assets/icons/GPS - Off.png');
  }

  /* ---- Social popup clicks ---- */
  document.addEventListener('click', function (e) {
    var a = e.target.closest('.social-ico.on');
    if (!a) return;
    var label = a.getAttribute('aria-label') || '';
    if (/whatsapp/i.test(label)) { e.preventDefault(); doWa(); }
    else if (/call/i.test(label)) { e.preventDefault(); doCall(); }
    else if (/location/i.test(label)) { e.preventDefault(); doLoc(); }
    else if (/share/i.test(label)) { e.preventDefault(); doWa(); }
    else if (/rate/i.test(label)) { e.preventDefault(); doRate(); }
  });

  function doWa() {
    var text = 'Check out ' + biz.name + ' on EatOuts: https://www.eatouts.site/bw/' + biz.slug;
    var html = '<div class="sheet-section"><h3>Share</h3><div class="popup-list"><a class="popup-row" href="https://wa.me/?text=' + encodeURIComponent(text) + '" target="_blank" rel="noopener">Send to Contact</a></div></div>';
    if (C.wa.length) {
      html += '<div class="sheet-section"><h3>Contact List</h3><div class="popup-list">';
      C.wa.forEach(function (c) {
        var digits = String(c.number).replace(/[^0-9]/g, '');
        html += '<a class="popup-row" href="https://wa.me/' + digits + '?text=' + encodeURIComponent('Hi ' + c.label + ' team,') + '" target="_blank" rel="noopener">' + c.label + '</a>';
      });
      html += '</div></div>';
    } else {
      html += '<div class="sheet-section"><p style="color:var(--ink-3);padding:12px 2px">No WhatsApp numbers on file for this business.</p></div>';
    }
    openPopup('WhatsApp', html);
  }
  function doCall() {
    var html = '<div class="sheet-section"><h3>Contact List</h3><div class="popup-list">';
    if (C.call.length) {
      C.call.forEach(function (c) {
        html += '<a class="popup-row" href="tel:' + String(c.number).replace(/[^0-9+]/g, '') + '">' + c.label + '</a>';
      });
    } else {
      html += '<p style="color:var(--ink-3);padding:12px 2px">No phone numbers on file for this business.</p>';
    }
    html += '</div></div>';
    openPopup('Call', html);
  }
  function doLoc() {
    var html = '<div class="sheet-section"><h3>Location List</h3><div class="popup-list">';
    if (C.loc.length) {
      C.loc.forEach(function (c) { html += '<a class="popup-row" href="' + c.url + '" target="_blank" rel="noopener">' + c.label + '</a>'; });
    } else {
      html += '<p style="color:var(--ink-3);padding:12px 2px">No address on file for this business.</p>';
    }
    html += '</div></div>';
    openPopup('Locations', html);
  }
  function doRate() {
    var html = '<div class="sheet-section"><h3>Rate ' + esc(biz.name) + '</h3>'
      + '<p style="color:var(--ink-2);padding:4px 2px 10px">How was your experience?</p>'
      + '<div class="popup-list">';
    for (var i = 5; i >= 1; i--) {
      html += '<button class="popup-row" data-rate="' + i + '">' + i + ' star' + (i > 1 ? 's' : '') + '</button>';
    }
    html += '</div></div>';
    openPopup('Rate', html);
  }

  /* ---- Chips ---- */
  var CHIP = {
    'Cozy': 'Warm corners & good vibes - comfy seating, soft lighting, made for unwinding.',
    'Trendy': 'Fresh culture & cool energy - modern beats, stylish interiors.',
    'Aesthetic': 'Picture-perfect in every angle - latte art to curated corner lighting.',
    'Laptop-Friendly': 'Ideal remote work hub - power outlets, comfortable seating, quiet ambience.',
    'Free Wi-Fi': 'Fast, high-speed connectivity on the house.',
    'Table Service': "Sit back & we'll bring it over - our staff deliver to your table.",
    'Dedicated Parking': 'Hassle-free arrival with reserved parking.',
    'Kid-Friendly': 'Welcoming for the whole family - high chairs and safe environment.',
    'Specialty Coffee': 'Ethically sourced & expertly brewed by passionate baristas.',
    'Breakfast': 'Start your day right with freshly baked pastries and hearty plates.',
    'Brunch': 'Mid-morning magic - the perfect blend of sweet and savoury.',
    'Lunch': 'Fresh & satisfying meals crafted for a mid-day recharge.',
    'Desserts': 'Sweet treats & decadent bites paired with your favourite espresso.'
  };
  document.addEventListener('click', function (e) {
    var chip = e.target.closest('.chip');
    if (!chip) return;
    var k = chip.getAttribute('data-chip');
    if (!CHIP[k]) return;
    openPopup(k, '<p style="color:var(--ink-2)">' + CHIP[k] + '</p>');
  });

  /* ---- Options ---- */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  var toastEl = document.getElementById('toast');
  var toastTimer = null;
  function toast(msg) {
    if (!toastEl) return;
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2600);
  }

  function uniq(list) {
    var seen = {}, out = [];
    list.forEach(function (v) {
      var s = String(v == null ? '' : v).trim();
      if (!s) return;
      var k = s.toLowerCase();
      if (seen[k]) return;
      seen[k] = 1; out.push(s);
    });
    return out;
  }

  /* Every branch of this business, from whichever dataset it lives in.
     Restaurant chains (KFC, Nando's ...) are stored as many records that
     share a display name; catering/bottle-store brands carry a branches[]. */
  function bizBranches() {
    var out = [];
    var rec = biz.record || {};
    if (Array.isArray(rec.branches) && rec.branches.length) {
      rec.branches.forEach(function (b) { out.push({ town: b.town || (b.location && b.location.town) || '', area: b.area || (b.location && b.location.area) || '' }); });
      return out;
    }
    var dir = (window.DIRECTORY_RUNTIME_DATA && window.DIRECTORY_RUNTIME_DATA.restaurants) || [];
    for (var i = 0; i < dir.length; i++) {
      var r = dir[i] || {};
      if (canon(r.name) !== canon(biz.name)) continue;
      var areas = (r.areas && r.areas.length) ? r.areas : [r.area];
      areas.forEach(function (a) { out.push({ town: r.town || (r.location && r.location.town) || '', area: a || '' }); });
    }
    if (!out.length) out.push({ town: rec.town || (biz.branch && biz.branch.town) || '', area: rec.area || (biz.branch && biz.branch.area) || '' });
    return out;
  }
  var allBranches = bizBranches();
  var TOWNS = uniq(allBranches.map(function (b) { return b.town; }));
  var selectedTown = (TOWNS.length === 1) ? TOWNS[0] : '';
  var selectedArea = '';

  function areasForTown(t) {
    var ct = canon(t);
    return uniq(allBranches.filter(function (b) { return canon(b.town) === ct; }).map(function (b) { return b.area; }))
      .filter(function (a) { return canon(a) !== ct; });
  }

  function renderOptions() {
    var optList = document.getElementById('optList');
    if (!optList) return;
    var townLabel = TOWNS.length <= 1 ? (TOWNS[0] || 'Select Town') : (selectedTown || 'Select Town');
    var townMuted = (TOWNS.length > 1 && !selectedTown);
    var areas = selectedTown ? areasForTown(selectedTown) : [];
    var areaLabel, areaMuted;
    if (!selectedTown) { areaLabel = 'Select Area'; areaMuted = true; }
    else if (areas.length === 0) { areaLabel = 'Select Area'; areaMuted = true; }
    else if (areas.length === 1) { areaLabel = areas[0]; areaMuted = false; }
    else { areaLabel = selectedArea || 'Select Area'; areaMuted = !selectedArea; }
    optList.innerHTML =
      '<button class="opt" id="optTown" data-opt="town" type="button">'
      + '<span class="val' + (townMuted ? ' muted' : '') + '">' + esc(townLabel) + '</span></button>'
      + '<button class="opt" id="optArea" data-opt="area" type="button">'
      + '<span class="val' + (areaMuted ? ' muted' : '') + '">' + esc(areaLabel) + '</span></button>'
      + '<button class="opt" id="optMenu" data-opt="menu" type="button">'
      + '<span class="val">Menu Options</span></button>'
      + '<button class="opt" id="optPromos" data-opt="promos" type="button">'
      + '<span class="val">Promos Gallery</span></button>';
  }

  function townListItem(t) {
    var on = canon(t) === canon(selectedTown);
    return '<button class="popup-row" data-pick-town="' + esc(t) + '"' + (on ? ' style="font-weight:800"' : '') + '>' + esc(t) + '</button>';
  }
  function areaListItem(a) {
    var on = canon(a) === canon(selectedArea);
    return '<button class="popup-row" data-pick-area="' + esc(a) + '"' + (on ? ' style="font-weight:800"' : '') + '>' + esc(a) + '</button>';
  }

  /* Menu availability, from the same directory payload index.html uses.
     directory_runtime_data.js carries menusRaw/menuFiles keyed by the
     canonical brand slug (e.g. "kfc", "nandos", "the-yellow-giraffe-..."). */
  function importedMenusFor() {
    var src = window.DIRECTORY_RUNTIME_DATA || {};
    var raw = src.menusRaw || {};
    var files = src.menuFiles || {};
    var out = [];
    function take(key) {
      if (!key) return;
      var norm = canon(key);
      Object.keys(raw).forEach(function (k) { if (canon(k) === norm) out.push(raw[k]); });
      Object.keys(files).forEach(function (k) { if (canon(k) === norm) out.push(files[k]); });
    }
    take(biz.slug);
    take(biz.record && biz.record.slug);
    take(biz.record && biz.record.brandKey);
    take(biz.name);
    return out;
  }
  function rawHasMenu(v) {
    if (!v) return false;
    if (Array.isArray(v)) return v.length > 0;
    if (Array.isArray(v.menu)) return v.menu.length > 0;
    if (v.menu && (v.menu.categories || v.menu.items)) {
      return (v.menu.categories && v.menu.categories.length) || (v.menu.items && v.menu.items.length) ? true : false;
    }
    return true; /* menuFiles entries are paths -> presence means a menu */
  }

  function hasMenu() {
    var rec = biz.record || {};
    if (Array.isArray(rec.menu) && rec.menu.length) return true;
    if (Array.isArray(rec.menuCategories) && rec.menuCategories.length) return true;
    if (rec.menu && (rec.menu.categories && rec.menu.categories.length || rec.menu.items && rec.menu.items.length)) return true;
    if (importedMenusFor().some(rawHasMenu)) return true;
    try {
      if (window.EatoutsBridge && typeof EatoutsBridge.bundleOf === 'function') {
        var b = EatoutsBridge.bundleOf(rec.id);
        if (b && b.menu && b.menu.length) return true;
      }
    } catch (e) {}
    return false;
  }
  function hasPromos() {
    var rec = biz.record || {};
    if (Array.isArray(rec.promos) && rec.promos.length) return true;
    if (rec.promos) { for (var d0 in rec.promos) if ((rec.promos[d0] || []).length) return true; }
    try {
      if (window.EatoutsBridge && typeof EatoutsBridge.bundleOf === 'function') {
        var b = EatoutsBridge.bundleOf(rec.id);
        if (b && b.promos) {
          for (var d in b.promos) if ((b.promos[d] || []).length) return true;
        }
      }
    } catch (e) {}
    return false;
  }

  function openTownPicker() {
    if (TOWNS.length <= 1) { toast(TOWNS[0] ? 'Located in ' + TOWNS[0] : 'No town on file'); return; }
    openPopup('Select Town', '<div class="popup-list">' + TOWNS.map(townListItem).join('') + '</div>');
  }
  function openAreaPicker() {
    if (!selectedTown) { toast('Select a Town first'); return; }
    var areas = areasForTown(selectedTown);
    if (!areas.length) { toast('No areas on file for ' + selectedTown); return; }
    if (areas.length === 1) { toast('Located in ' + areas[0]); return; }
    openPopup('Select Area', '<div class="popup-list">' + areas.map(areaListItem).join('') + '</div>');
  }

  /* ---- Hosting (spaces, hostable event types, booking rules) ---- */
  function renderHosting() {
    var acc = document.getElementById('hostingAcc');
    if (!acc) return;
    var rec = biz.record || {};
    var h = rec.hosting || {};
    var spaces = Array.isArray(h.spaces) ? h.spaces : [];
    var types = Array.isArray(h.eventTypes) ? h.eventTypes : [];
    var rules = h.rules || {};
    var chips = [], rows = [];

    types.forEach(function (t) {
      var name = t.name || t.eventName || '';
      if (name) chips.push(name);
    });

    function pushSpace(title, value) {
      title = title || 'Space';
      if (!title && !value) return;
      rows.push({ label: title, value: value || '' });
    }

    if (spaces.length) {
      spaces.forEach(function (s) {
        var value = s.value || s.description || '';
        if (s.seated || s.standing) {
          value = [s.seated ? s.seated + ' seated' : '', s.standing ? s.standing + ' standing' : '']
            .filter(Boolean).join(' · ');
        }
        pushSpace(s.title || s.name || 'Space', value);
      });
    } else {
      /* Older records keep the capacity list on its own. */
      (Array.isArray(rec.capacity) ? rec.capacity : []).forEach(function (c) {
        pushSpace(c.title || c.name || 'Capacity', c.value || c.description || '');
      });
    }

    var min = rules.minimumGuests, max = rules.maximumGuests;
    if (min && max) chips.push('Guests ' + min + '–' + max);
    else if (min) chips.push('From ' + min + ' guests');
    else if (max) chips.push('Up to ' + max + ' guests');

    if (!chips.length && !rows.length) { acc.style.display = 'none'; return; }
    acc.style.display = '';

    var cw = document.getElementById('hostingChips');
    cw.innerHTML = chips.length
      ? chips.map(function (c) { return '<span class="chip static">' + esc(c) + '</span>'; }).join('')
      : '';

    var sl = document.getElementById('hostingSpaces');
    sl.innerHTML = rows.length
      ? rows.map(function (r) {
          return '<li class="hours__row"><span class="hours__day">' + esc(r.label) + '</span>' +
            '<span class="hours__time">' + esc(r.value || '—') + '</span></li>';
        }).join('')
      : '';
  }

  renderOptions();
  renderHosting();
  if (optList) optList.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-opt]');
    if (!btn) return;
    var which = btn.getAttribute('data-opt');
    if (which === 'town') openTownPicker();
    else if (which === 'area') openAreaPicker();
    else if (which === 'menu') {
      if (hasMenu()) window.location.href = 'index.html#' + biz.slug + '/menu';
      else toast(biz.name + ' has not yet loaded their menu');
    } else if (which === 'promos') {
      if (hasPromos()) window.location.href = 'index.html#' + biz.slug + '/promos';
      else toast(biz.name + ' has no promos available');
    }
  });
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-pick-town]');
    if (t) { selectedTown = t.getAttribute('data-pick-town'); selectedArea = ''; renderOptions(); closePopup(); return; }
    var a = e.target.closest('[data-pick-area]');
    if (a) { selectedArea = a.getAttribute('data-pick-area'); renderOptions(); closePopup(); }
    var r = e.target.closest('[data-rate]');
    if (r) { closePopup(); toast('Thanks for rating ' + biz.name + ' ' + r.getAttribute('data-rate') + '/5'); }
  });

  /* ---- Page history ---- */
  var backBtn = document.getElementById('backBtn');
  if (backBtn) backBtn.addEventListener('click', function () {
    if (document.referrer && document.referrer.indexOf(location.origin) === 0) { history.back(); return; }
    window.location.href = 'index.html#restaurants';
  });

  /* ---- Logo overlay ---- */
  var logoBtn = document.getElementById('logoBtn');
  var logoOverlay = document.getElementById('logoOverlay');
  var logoLarge = document.getElementById('logoLarge');
  if (logoBtn && logoOverlay && logoLarge && logoImg) {
    logoBtn.addEventListener('click', function () {
      logoLarge.src = logoImg.src;
      logoOverlay.classList.add('open');
    });
  }
  var logoClose = document.getElementById('logoOverlayClose');
  if (logoClose && logoOverlay) logoClose.addEventListener('click', function () { logoOverlay.classList.remove('open'); });
  if (logoOverlay) logoOverlay.addEventListener('click', function (e) { if (e.target === logoOverlay) logoOverlay.classList.remove('open'); });

  /* ---- Drag resize ---- */
  var dragHandle = document.getElementById('dragHandle');
  if (dragHandle && logoBtn) {
    var size = 200, dragging = false, sy = 0, ss = 0;
    dragHandle.addEventListener('pointerdown', function (e) { dragging = true; sy = e.clientY; ss = size; try { dragHandle.setPointerCapture(e.pointerId); } catch (x) {} e.preventDefault(); });
    dragHandle.addEventListener('pointermove', function (e) { if (!dragging) return; size = Math.max(120, Math.min(400, ss + (e.clientY - sy))); logoBtn.style.width = size + 'px'; logoBtn.style.height = size + 'px'; });
    dragHandle.addEventListener('pointerup', function (e) { dragging = false; try { dragHandle.releasePointerCapture(e.pointerId); } catch (x) {} });
    dragHandle.addEventListener('pointercancel', function () { dragging = false; });
  }

  /* ---- Settings buttons (toast only) ---- */
  function toast(msg) {
    var t = document.getElementById('toast'); if (!t) return;
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove('show'); }, 2200);
  }
  document.addEventListener('click', function (e) {
    var s = e.target.closest('[data-settings]');
    if (!s) return;
    var a = s.getAttribute('data-settings');
    if (a === 'change-logo') { var f = document.getElementById('fileInput'); if (f) f.click(); }
    else toast('"' + a + '" is not available on this page.');
  });
  var fi = document.getElementById('fileInput');
  if (fi && logoImg) fi.addEventListener('change', function (e) {
    var file = e.target.files && e.target.files[0]; if (!file) return;
    var r = new FileReader();
    r.onload = function (ev) { logoImg.src = ev.target.result; logoImg.style.opacity = '1'; toast('Logo updated'); };
    r.readAsDataURL(file); e.target.value = '';
  });

  /* Escape closes */
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closePopup(); });
})();
</script>

</body>
</html>
