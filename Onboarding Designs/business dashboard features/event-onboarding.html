<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#141418">
<title>Events & Performers — Eatouts</title>
<link rel="icon" type="image/png" href="assets/logo/EatOuts_Badge.png">
<link rel="apple-touch-icon" href="assets/logo/EatOuts_Badge.png">
<style>
  *,*::before,*::after{box-sizing:border-box}
  :root{
    --ink:#0F0F12;
    --ink-2:#2A2A30;
    --ink-3:#4A4A52;
    --paper:#F4F5F7;
    --card:#FFFFFF;
    --line:#E6E8EC;
    --line-2:#F0F1F4;
    --orange:#FF5A1F;
    --orange-2:#FF7A42;
    --orange-soft:#FFEDE4;
    --orange-line:#FFD5C2;
    --green:#16A34A;
    --green-soft:#E7F7EE;
    --red:#DC2626;
    --red-soft:#FEE2E2;
    --amber:#B45309;
    --amber-soft:#FEF3C7;
    --blue:#0284C7;
    --blue-soft:#E0F2FE;
    --muted:#6B7280;
    --faint:#9AA1AC;
  }
  html,body{height:100%}
  body{
    margin:0;
    background:#E9EBEF;
    color:var(--ink);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:15px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;
    display:flex;
    justify-content:center;
  }
  button,input,select,textarea{font-family:inherit}
  button{cursor:pointer}

  #shell{
    width:100%;
    max-width:460px;
    height:100vh;
    height:100dvh;
    background:var(--paper);
    display:flex;
    flex-direction:column;
    overflow:hidden;
    position:relative;
    box-shadow:0 0 70px rgba(20,20,25,.16);
  }

  /* ============ TOPBAR ============ */
  .topbar{
    flex:0 0 auto;
    background:#141418;
    padding:calc(13px + env(safe-area-inset-top)) 0 0;
    position:relative;
    z-index:10;
  }
  .topbar-row{
    display:flex;align-items:center;gap:10px;
    padding:0 18px 13px;
  }
  .brand{
    display:inline-flex;align-items:center;gap:9px;
    text-decoration:none;
  }
  .brand .mark{
    width:28px;height:28px;flex:0 0 auto;border-radius:8px;
    background:linear-gradient(145deg,var(--orange-2),var(--orange));
    color:#fff;
    display:grid;place-items:center;
    font-size:14px;font-weight:900;letter-spacing:-.03em;
    box-shadow:0 2px 10px rgba(255,90,31,.35);
  }
  .brand .word{
    color:#fff;font-size:15px;font-weight:800;
    letter-spacing:-.02em;
  }
  .hdr-chip{
    margin-left:auto;
    font-size:10px;font-weight:800;
    letter-spacing:.12em;text-transform:uppercase;
    color:var(--orange-2);
    border:1px solid rgba(255,122,66,.32);
    background:rgba(255,90,31,.1);
    border-radius:999px;
    padding:5px 11px;
    white-space:nowrap;
  }

  .progress{padding:0 18px 14px}
  .progress-top{
    display:flex;align-items:baseline;justify-content:space-between;
    gap:10px;margin-bottom:8px;
  }
  .progress-label{
    font-size:11px;font-weight:800;
    letter-spacing:.14em;text-transform:uppercase;
    color:rgba(255,255,255,.5);
  }
  .progress-count{
    font-size:11.5px;font-weight:800;
    color:var(--orange-2);
    letter-spacing:.02em;
  }
  .progress-track{
    height:5px;border-radius:99px;
    background:rgba(255,255,255,.13);
    overflow:hidden;
  }
  .progress-fill{
    height:100%;width:0%;
    border-radius:99px;
    background:linear-gradient(90deg,var(--orange),var(--orange-2));
    transition:width .35s cubic-bezier(.4,0,.2,1);
  }

  /* ============ TABS ============ */
  .tabs{
    display:flex;
    gap:6px;
    overflow-x:auto;
    overflow-y:hidden;
    padding:0 14px 12px;
    scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
  }
  .tabs::-webkit-scrollbar{display:none}
  .tab{
    flex:0 0 auto;
    padding:7px 13px;
    border-radius:999px;
    font-size:12.5px;
    font-weight:750;
    letter-spacing:-.01em;
    color:rgba(255,255,255,.55);
    text-decoration:none;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.08);
    white-space:nowrap;
    -webkit-tap-highlight-color:transparent;
    transition:background .15s,color .15s;
  }
  .tab.active{
    background:linear-gradient(145deg,var(--orange-2),var(--orange));
    color:#fff;
    border-color:transparent;
    box-shadow:0 4px 12px -6px rgba(255,90,31,.55);
  }

  /* ============ SCROLL ============ */
  .scroll{
    flex:1 1 auto;min-height:0;
    overflow-y:auto;
    overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
    scrollbar-width:none;
  }
  .scroll::-webkit-scrollbar{display:none}

  /* ============ INTRO ============ */
  .intro{
    background:linear-gradient(175deg,#141418 0%,#1B1B21 60%,#232329 100%);
    padding:4px 22px 46px;
    position:relative;
    overflow:hidden;
    text-align:center;
  }
  .intro::after{
    content:"";
    position:absolute;
    top:-80px;right:-80px;
    width:230px;height:230px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,90,31,.2),transparent 68%);
    pointer-events:none;
  }
  .intro h1{
    position:relative;
    margin:0 auto 12px;
    font-size:26px;
    line-height:1.15;
    font-weight:800;
    letter-spacing:-.03em;
    color:#fff;
    max-width:16ch;
  }
  .intro h1 em{font-style:normal;color:var(--orange-2)}
  .intro p{
    position:relative;
    margin:0 auto;
    font-size:14px;
    line-height:1.6;
    color:rgba(255,255,255,.6);
    max-width:32ch;
  }

  /* ============ SHEET ============ */
  .sheet{
    position:relative;
    z-index:1;
    margin-top:-26px;
    background:var(--paper);
    border-radius:26px 26px 0 0;
    padding:20px 14px 30px;
    min-height:60vh;
  }

  /* ============ META CARD ============ */
  .meta-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:15px 16px;
    margin-bottom:12px;
    box-shadow:0 1px 2px rgba(20,20,25,.03);
  }
  .meta-row{
    display:flex;align-items:center;gap:10px;
    margin-bottom:11px;
  }
  .meta-dot{
    width:9px;height:9px;border-radius:50%;flex:0 0 auto;
    background:var(--orange);
    box-shadow:0 0 0 3px var(--orange-soft);
  }
  .meta-dot.green{background:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
  .meta-dot.warn{background:var(--amber);box-shadow:0 0 0 3px var(--amber-soft)}
  .meta-text{
    font-size:13.5px;
    color:var(--ink-2);
    line-height:1.4;
    min-width:0;
    flex:1 1 auto;
  }
  .meta-text b{color:var(--ink);font-weight:750}
  .meta-stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    padding-top:11px;
    border-top:1px solid var(--line-2);
  }
  .stat{text-align:center}
  .stat b{
    display:block;
    font-size:19px;font-weight:850;
    letter-spacing:-.03em;
    color:var(--ink);
    line-height:1.1;
    font-variant-numeric:tabular-nums;
  }
  .stat span{
    display:block;
    margin-top:3px;
    font-size:9.5px;font-weight:800;
    letter-spacing:.1em;text-transform:uppercase;
    color:var(--faint);
  }

  /* ============ EVENT CARD (LIST VIEW) ============ */
  .event-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:12px;
    margin-bottom:10px;
    display:flex;
    gap:12px;
    box-shadow:0 1px 2px rgba(20,20,25,.03);
    transition:border-color .15s,box-shadow .15s;
  }
  .event-card:active{border-color:var(--orange-line)}
  .event-thumb{
    width:64px;height:64px;flex:0 0 auto;border-radius:11px;
    background:#F0F1F4 center/cover no-repeat;
    display:grid;place-items:center;
    color:#B7BDC6;font-size:22px;
    overflow:hidden;
    position:relative;
  }
  .event-body{flex:1 1 auto;min-width:0}
  .event-name{
    font-size:14.5px;font-weight:750;
    letter-spacing:-.015em;line-height:1.3;
    color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .event-meta{
    font-size:11.5px;color:var(--faint);
    margin-top:3px;font-weight:550;
    line-height:1.35;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .event-actions{
    display:flex;gap:6px;margin-top:9px;flex-wrap:wrap;
  }

  .badge{
    display:inline-flex;align-items:center;
    padding:2px 7px;border-radius:5px;
    font-size:9.5px;font-weight:800;
    letter-spacing:.06em;text-transform:uppercase;
    vertical-align:middle;margin-left:5px;
    line-height:1.4;
  }
  .badge.draft{background:#F0F1F4;color:var(--muted)}
  .badge.published{background:var(--green-soft);color:var(--green)}
  .badge.expired{background:var(--red-soft);color:var(--red)}
  .badge.paused{background:var(--amber-soft);color:var(--amber)}

  /* Mini action buttons */
  .mini-btn{
    height:30px;
    padding:0 11px;
    border-radius:8px;
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink-2);
    font-size:11.5px;
    font-weight:750;
    letter-spacing:-.005em;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    -webkit-tap-highlight-color:transparent;
    transition:background .15s,border-color .15s,color .15s;
  }
  .mini-btn:active{background:#F4F5F7}
  .mini-btn.danger{
    color:var(--red);
    border-color:#FECACA;
    background:#FEF2F2;
  }
  .mini-btn.danger:active{background:var(--red-soft)}

  /* ============ ACCORDION STACK ============ */
  .stack{display:flex;flex-direction:column;gap:10px}
  .acc{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    overflow:hidden;
    transition:border-color .2s ease,box-shadow .2s ease;
  }
  .acc.open{
    border-color:var(--orange-line);
    box-shadow:0 4px 18px -6px rgba(255,90,31,.22);
  }
  .acc-head{
    width:100%;
    display:flex;align-items:center;gap:12px;
    padding:13px 15px;
    background:transparent;border:0;
    text-align:left;
    -webkit-tap-highlight-color:transparent;
    transition:background .15s;
  }
  .acc-head:active{background:#FAFBFC}

  .grp-thumb{
    width:48px;height:48px;flex:0 0 auto;
    border-radius:11px;
    background:#F0F1F4;
    display:grid;place-items:center;
    font-size:20px;
    color:#B7BDC6;
    overflow:hidden;
    position:relative;
  }
  .grp-thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .grp-thumb.num{
    font-size:13px;font-weight:850;
    color:var(--orange);
    background:var(--orange-soft);
    letter-spacing:-.02em;
  }
  .grp-thumb .count{
    position:absolute;
    bottom:3px;right:3px;
    background:rgba(15,15,18,.72);
    color:#fff;
    font-size:9px;
    font-weight:800;
    letter-spacing:.02em;
    padding:1.5px 5px;
    border-radius:4px;
    line-height:1;
  }

  .acc-title{
    flex:1 1 auto;min-width:0;
    display:flex;flex-direction:column;gap:2px;
  }
  .acc-title b{
    font-size:15px;font-weight:750;
    letter-spacing:-.015em;
    color:var(--ink);
    line-height:1.25;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .acc-sub{
    font-size:11.5px;
    color:var(--faint);
    line-height:1.3;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    font-weight:550;
  }
  .acc.touched .acc-sub{color:var(--green);font-weight:650}

  .acc-body{
    display:grid;
    grid-template-rows:0fr;
    transition:grid-template-rows .32s cubic-bezier(.4,0,.2,1);
  }
  .acc.open .acc-body{grid-template-rows:1fr}
  .acc-inner{overflow:hidden;min-height:0}

  .module{padding:2px 15px 18px}

  /* ============ FORM FIELDS ============ */
  .field{margin-bottom:14px}
  .field:last-child{margin-bottom:0}
  .field > label{
    display:block;
    font-size:11.5px;font-weight:800;
    letter-spacing:.09em;text-transform:uppercase;
    color:var(--muted);
    margin-bottom:7px;
  }
  .field input,
  .field select,
  .field textarea{
    width:100%;
    border:1px solid var(--line);
    border-radius:11px;
    background:#fff;
    color:var(--ink);
    font-size:15px;
    line-height:1.4;
    padding:13px;
    outline:none;
    transition:border-color .15s,box-shadow .15s;
    -webkit-appearance:none;
    appearance:none;
    font-family:inherit;
  }
  .field textarea{min-height:80px;resize:vertical;line-height:1.55}
  .field input:focus,
  .field select:focus,
  .field textarea:focus{
    border-color:var(--orange);
    box-shadow:0 0 0 3px rgba(255,90,31,.13);
  }
  .field input::placeholder,
  .field textarea::placeholder{color:#B7BDC6}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:400px){.grid2{grid-template-columns:1fr}}

  .check-row{
    display:flex;align-items:center;gap:10px;
    padding:12px 13px;
    border:1px solid var(--line);
    border-radius:11px;
    background:#fff;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    font-size:14px;
    font-weight:650;
    color:var(--ink-2);
    margin-bottom:14px;
  }
  .check-row:active{background:#FAFBFC}
  .check-row input{
    width:20px;height:20px;
    accent-color:var(--orange);
    margin:0;flex:0 0 auto;
  }

  .upload-input-row{display:flex;gap:8px;align-items:stretch}
  .upload-input-row input{flex:1 1 auto;min-width:0}
  .upload-input-row button{
    flex:0 0 auto;
    padding:0 14px;
    border:1px solid var(--line);
    border-radius:11px;
    background:#fff;
    font-weight:750;
    font-size:13px;
    color:var(--orange);
    -webkit-tap-highlight-color:transparent;
  }
  .upload-input-row button:active{background:var(--orange-soft)}

  /* Capacity quick-fill chips */
  .chip-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .chip{
    height:32px;
    padding:0 12px;
    border-radius:999px;
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink-2);
    font-size:12px;
    font-weight:700;
    display:inline-flex;
    align-items:center;
    -webkit-tap-highlight-color:transparent;
  }
  .chip:active{background:var(--orange-soft);border-color:var(--orange-line);color:var(--orange)}

  /* Performer mini-card inside editor */
  .perf-row{
    border:1px solid var(--line);
    border-radius:12px;
    padding:11px 12px;
    margin-bottom:8px;
    background:#FAFBFC;
  }
  .perf-row .perf-name{font-weight:800;font-size:13.5px;color:var(--ink)}
  .perf-row .perf-meta{font-size:11.5px;color:var(--faint);margin-top:2px}
  .perf-row .perf-del{
    margin-top:8px;
    height:30px;padding:0 11px;border-radius:8px;
    border:1px solid #FECACA;background:#FEF2F2;color:var(--red);
    font-size:11.5px;font-weight:750;
  }

  .empty-note{
    font-size:12.5px;
    color:var(--faint);
    text-align:center;
    padding:18px 12px;
    border:1.5px dashed #DCE0E6;
    border-radius:11px;
    background:#FAFBFC;
    line-height:1.5;
  }

  /* Inline secondary buttons inside modules */
  .inline-btn{
    height:40px;
    padding:0 14px;
    border-radius:11px;
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink-2);
    font-size:13px;
    font-weight:750;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    -webkit-tap-highlight-color:transparent;
    transition:background .15s,border-color .15s;
  }
  .inline-btn:active{background:#F4F5F7}
  .inline-btn.orange{
    border-color:var(--orange-line);
    color:var(--orange);
    background:var(--orange-soft);
  }

  /* Editor footer inside module */
  .editor-actions{
    display:flex;
    gap:9px;
    margin-top:20px;
    padding-top:16px;
    border-top:1px solid var(--line-2);
  }
  .editor-actions .btn{flex:1;height:48px;font-size:14.5px}
  .editor-actions .btn-cancel{
    background:#F4F5F7;
    border:1px solid var(--line);
    color:var(--ink-2);
  }

  /* ============ BOTTOM ACTIONS ============ */
  .actions{
    flex:0 0 auto;
    display:flex;
    gap:9px;
    padding:11px 14px calc(11px + env(safe-area-inset-bottom));
    background:#fff;
    border-top:1px solid var(--line);
  }
  .btn{
    height:52px;
    border:0;
    border-radius:13px;
    font-family:inherit;
    font-size:15px;
    font-weight:750;
    letter-spacing:-.01em;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    text-decoration:none;
    -webkit-tap-highlight-color:transparent;
    transition:transform .1s ease,background .15s;
    cursor:pointer;
  }
  .btn:active{transform:scale(.98)}
  .btn-primary{
    flex:1.4 1 0;
    background:linear-gradient(145deg,var(--orange-2),var(--orange));
    color:#fff;
    box-shadow:0 6px 18px -6px rgba(255,90,31,.5);
  }
  .btn-primary:active{background:var(--orange)}
  .btn-ghost{
    flex:1 1 0;
    background:#F4F5F7;
    border:1px solid var(--line);
    color:var(--ink-2);
  }
  .btn-ghost:active{background:#EBEDF0}

  /* ============ MODAL ============ */
  .modal-scrim{
    position:fixed;inset:0;z-index:100;
    background:rgba(15,15,18,.55);
    display:flex;align-items:flex-end;justify-content:center;
    animation:fade .18s ease;
  }
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @media(min-width:520px){.modal-scrim{align-items:center;padding:20px}}
  .modal{
    background:#fff;
    width:100%;max-width:460px;
    max-height:92vh;height:auto;
    border-radius:20px 20px 0 0;
    display:flex;flex-direction:column;
    overflow:hidden;
    animation:slideup .25s cubic-bezier(.4,0,.2,1);
  }
  @keyframes slideup{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
  @media(min-width:520px){
    .modal{border-radius:18px}
    @keyframes slideup{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
  }
  .modal-hdr{
    padding:14px 18px;
    border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:12px;
    background:#fff;flex:0 0 auto;
  }
  .modal-hdr h3{
    margin:0;flex:1;
    font-size:16px;font-weight:800;
    letter-spacing:-.02em;color:var(--ink);
  }
  .modal-close{
    width:32px;height:32px;
    border:1px solid var(--line);
    background:#fff;border-radius:9px;
    color:var(--muted);
    font-size:14px;line-height:1;
    display:grid;place-items:center;
    -webkit-tap-highlight-color:transparent;
  }
  .modal-close:active{background:#F4F5F7}
  .modal-body{
    flex:1 1 auto;min-height:0;
    overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:16px 18px 20px;
    scrollbar-width:none;
  }
  .modal-body::-webkit-scrollbar{display:none}
  .modal-foot{
    flex:0 0 auto;
    padding:12px 18px calc(12px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line);
    background:#FAFBFC;
    display:flex;gap:9px;
  }
  .modal-foot .btn{flex:1;height:48px;font-size:14.5px}
  .modal-foot .btn-cancel{
    background:#F4F5F7;border:1px solid var(--line);color:var(--ink-2);
  }

  /* ============ TOAST ============ */
  .toast{
    position:fixed;left:50%;z-index:200;
    bottom:calc(88px + env(safe-area-inset-bottom));
    transform:translate(-50%,10px);
    background:var(--ink);color:#fff;
    font-size:13.5px;font-weight:650;
    padding:12px 18px;border-radius:999px;
    max-width:88vw;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    opacity:0;pointer-events:none;
    transition:opacity .2s ease,transform .2s ease;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body data-page="event-onboarding">
<div id="shell">

  <header class="topbar">
    <div class="topbar-row">

<script>
/* Operator pages are only reachable through the About Us sign-in.
   This runs before any page content paints. */
if(!EatoutsAuth.requireSession()){EatoutsAuth.redirectToLogin();}
else{EatoutsAuth.applyActive();}
</script>
<script>
const DB_KEY=EatoutsDB.KEY;
const EMPTY_DB={version:1,restaurant:{id:'rest_001',identity:{name:''},location:{city:'',area:''},contacts:[],capacity:[]},menuCategories:[],menuItems:[],promos:[],events:[],performers:[],performances:[],galleryGroups:[],galleryImages:[],settings:{currency:'BWP',currencySymbol:'P'}};
function dbLoad(){return EatoutsOwnerCompat.load();}
function dbSave(d){EatoutsOwnerCompat.save(d);}
function uid(p){return p+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
let toastTimer=null;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2000);}
let DB=dbLoad();function save(){dbSave(DB);render();}

/* ========== SERVER SYNC (D1) ========== */
const API=window.EatoutsBusinessApi;let SRID=(DB.settings||{}).serverRestaurantId||null,EV_SERVER=false;
function currentRestaurant(){try{const d=EatoutsDB.load();const list=d.restaurants||[];return list.find(r=>r.id===DB.restaurant.id)||list[0]||{};}catch(e){return {};}}
function resolveInput(){const cur=currentRestaurant();return {serverRestaurantId:SRID,id:DB.restaurant.id,slug:cur.slug,name:(DB.restaurant.identity||{}).name||cur.name};}
function push(fn){if(!EV_SERVER||!SRID||!API)return;try{Promise.resolve(fn(API,SRID)).then(r=>{if(r&&r.data&&r.data.error)toast('Server: '+r.data.error);}).catch(()=>{});}catch(e){}}
function eventServerSync(){if(!API)return;API.resolve(resolveInput(),{create:false}).then(r=>{if(!r||!r.rid)return;SRID=r.rid;EV_SERVER=true;if(!(DB.settings||{}).serverRestaurantId){DB.settings=DB.settings||{};DB.settings.serverRestaurantId=r.rid;dbSave(DB);}return API.eventsRead(SRID).then(res=>{if(!res.ok||!res.data)return;pushMissingLocal(res.data);mergeEvents(res.data);});}).catch(()=>{});}
function pushMissingLocal(server){if(!EV_SERVER||!SRID||!API)return;
  const sevents=server.events||[];
  DB.events.filter(e=>!sevents.some(s=>s.id===e.id)).forEach(e=>push((A,rid)=>A.eventAdd(rid,Object.assign({id:e.id},A.eventToServer(e)))));}
function mergeEvents(data){const list=data.events||[];let changed=false;
  list.forEach(s=>{const m=API.eventFromServer(s);let ev=DB.events.find(x=>x.id===s.id);if(!ev){DB.events.push(m);changed=true;}else{Object.assign(ev,{name:m.name,type:m.type,coverImage:m.coverImage||ev.coverImage,description:m.description,organizer:ev.organizer||m.organizer,sponsor:ev.sponsor||m.sponsor,location:m.location||ev.location,startDate:m.startDate,startTime:m.startTime,endDate:m.endDate,endTime:m.endTime,admission:m.admission,status:m.status});changed=true;}});
  if(changed){dbSave(DB);render();}}

/* ========== VIEW STATE ========== */
let VIEW={mode:'list',id:null};
let EDITOR_OPEN=null;   /* only one accordion open at a time; null = all closed */

/* ========== MODAL FORM HELPERS ========== */
function openForm({title,fields,values,onSave,saveLabel}){
  values=values||{};
  const scrim=document.createElement('div');scrim.className='modal-scrim';
  scrim.innerHTML=`<div class="modal">
    <div class="modal-hdr"><h3>${esc(title)}</h3><button class="modal-close" type="button" data-close aria-label="Close">✕</button></div>
    <div class="modal-body">${fields.map(f=>field(f,values[f.key])).join('')}</div>
    <div class="modal-foot">
      <button class="btn btn-cancel" type="button" data-close>Cancel</button>
      <button class="btn btn-primary" type="button" data-save>${esc(saveLabel||'Save')}</button>
    </div></div>`;
  document.body.appendChild(scrim);
  scrim.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>scrim.remove());
  scrim.addEventListener('click',e=>{if(e.target===scrim)scrim.remove();});
  scrim.querySelector('[data-save]').onclick=()=>{
    const out={};
    scrim.querySelectorAll('[name]').forEach(el=>{
      const k=el.getAttribute('name');
      if(el.type==='checkbox')out[k]=el.checked;
      else if(el.type==='number')out[k]=el.value===''?null:Number(el.value);
      else out[k]=el.value;
    });
    onSave(out,scrim);
  };
  return scrim;
}
function field(f,v){
  if(f.type==='html')return f.html;
  if(f.type==='textarea')return `<div class="field"><label>${esc(f.label)}</label><textarea name="${f.key}">${esc(v||'')}</textarea></div>`;
  if(f.type==='select')return `<div class="field"><label>${esc(f.label)}</label><select name="${f.key}">${(f.options||[]).map(o=>{const val=typeof o==='string'?o:o.value;const lbl=typeof o==='string'?o:o.label;return `<option value="${esc(val)}"${val===v?' selected':''}>${esc(lbl)}</option>`;}).join('')}</select></div>`;
  if(f.type==='checkbox')return `<label class="check-row"><input type="checkbox" name="${f.key}" ${v?'checked':''}> <span>${esc(f.label)}</span></label>`;
  return `<div class="field"><label>${esc(f.label)}</label><input type="${f.type||'text'}" name="${f.key}" value="${esc(v||'')}" placeholder="${esc(f.placeholder||'')}"></div>`;
}

/* ========== STATUS ========== */
function statusOf(e){
  if(e.status)return e.status;
  const now=new Date();
  if(e.startDate&&new Date(e.startDate)>now)return 'draft';
  if(e.endDate&&new Date(e.endDate)<now)return 'expired';
  return 'published';
}

/* ========== INTRO / PROGRESS ========== */
function updateIntro(){
  const intro=document.getElementById('intro');
  if(!intro)return;
  if(VIEW.mode==='edit'){
    const ev=DB.events.find(x=>x.id===VIEW.id);
    const nm=ev&&ev.name?esc(ev.name):'Edit event';
    intro.innerHTML=`<h1>${nm}</h1><p>Fill in the details and save when ready.</p>`;
  } else if(VIEW.mode==='performers'){
    intro.innerHTML=`<h1>Your <em>performers</em>.</h1><p>Manage the artists, DJs and acts you host.</p>`;
  } else {
    intro.innerHTML=`<h1>Host <em>events</em>.</h1><p>Create, schedule and manage live performances at your venue.</p>`;
  }
}
function updateProgress(){
  const total=(DB.events||[]).length;
  const published=(DB.events||[]).filter(e=>statusOf(e)==='published').length;
  const count=document.getElementById('progressCount');
  const fill=document.getElementById('progressFill');
  if(count)count.textContent=total+' event'+(total===1?'':'s')+' · '+published+' published';
  if(fill)fill.style.width=Math.min(total,5)/5*100+'%';
}

/* ========== SUMMARY HELPERS (accordion subtitles) ========== */
function sumIdentity(ev){
  if(ev.name)return ev.name+(ev.type?' · '+ev.type:'');
  return 'Name, type, description';
}
function sumLocation(ev){
  const loc=ev.location||{};
  if(loc.city)return loc.city+(loc.area?' · '+loc.area:'');
  return 'Where the event happens';
}
function sumDateTime(ev){
  if(!ev.startDate)return 'Date and time';
  const p=[];
  if(ev.startDate)p.push(ev.startDate);
  if(ev.startTime)p.push(ev.startTime);
  if(ev.endTime)p.push('–'+ev.endTime);
  return p.join(' · ');
}
function sumAttendance(ev){
  const p=[];
  if(ev.expectedGuests)p.push(ev.expectedGuests+' expected');
  if(ev.maxCapacity)p.push('max '+ev.maxCapacity);
  return p.length?p.join(' · '):'Guest numbers';
}
function sumAdmission(ev){
  return ev.admission||'Free / paid / RSVP';
}
function sumPerformers(ev){
  const n=(ev.performances||[]).length;
  return n?n+' performance'+(n===1?'':'s'):'No performers yet';
}
function sumServices(ev){
  const n=(ev.serviceIds||[]).length;
  return n?n+' service'+(n===1?'':'s')+' linked':'No services linked';
}
function sumRsvp(ev){
  if(ev.rsvpEnabled)return ev.rsvpMax?'RSVP · max '+ev.rsvpMax:'RSVP enabled';
  return 'RSVP disabled';
}

/* ========== RENDER ========== */
function render(){
  updateProgress();
  updateIntro();
  const app=document.getElementById('app');
  if(VIEW.mode==='edit'){app.innerHTML=editorHTML();wireEditor();return;}
  if(VIEW.mode==='performers'){app.innerHTML=performersHTML();wirePerformers();return;}
  app.innerHTML=listHTML();wireList();
}

/* ---------- LIST VIEW ---------- */
function listHTML(){
  const list=DB.events.slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  const total=list.length;
  const withCover=list.filter(e=>e.coverImage).length;
  const published=list.filter(e=>statusOf(e)==='published').length;

  const dotClass=total===0?'warn':(published>0?'green':'');
  let msg;
  if(total===0)msg='No events yet — tap below to create one';
  else if(published===0)msg='<b>'+total+'</b> event'+(total===1?'':'s')+' drafted · publish when ready';
  else msg='<b>'+published+'</b> published · '+total+' total';

  let h=`<div class="meta-card">
    <div class="meta-row">
      <span class="meta-dot ${dotClass}"></span>
      <span class="meta-text">${msg}</span>
    </div>
    <div class="meta-stats">
      <div class="stat"><b>${total}</b><span>Events</span></div>
      <div class="stat"><b>${published}</b><span>Live</span></div>
      <div class="stat"><b>${withCover}</b><span>Covers</span></div>
    </div>
  </div>`;

  if(!list.length){
    h+=`<div class="empty-note">No events yet. Tap <b>+ Create Event</b> below to get started.</div>`;
    return h;
  }

  h+=`<div class="stack">`;
  list.forEach(ev=>{
    const s=statusOf(ev);
    const dateStr=(ev.startDate||'')+(ev.startTime?' · '+ev.startTime:'')+(ev.endTime?'–'+ev.endTime:'');
    const locStr=(ev.location&&ev.location.city||'')+((ev.location&&ev.location.area)?' · '+ev.location.area:'');
    const thumb=ev.coverImage
      ? `<div class="event-thumb" style="background-image:url('${esc(ev.coverImage)}')"></div>`
      : `<div class="event-thumb">▣</div>`;
    h+=`<div class="event-card">
      ${thumb}
      <div class="event-body">
        <div class="event-name">${esc(ev.name||'Untitled event')}<span class="badge ${s}">${s}</span></div>
        <div class="event-meta">${esc(dateStr||'No date set')}</div>
        <div class="event-meta">${esc(locStr||'No location')}</div>
        <div class="event-actions">
          <button class="mini-btn" data-act="edit" data-id="${ev.id}">Edit</button>
          <button class="mini-btn" data-act="dup" data-id="${ev.id}">Duplicate</button>
          <button class="mini-btn danger" data-act="del" data-id="${ev.id}">Remove</button>
        </div>
      </div>
    </div>`;
  });
  h+=`</div>`;
  return h;
}
function wireList(){/* delegation handles clicks */}

/* ---------- ACCORDION SECTION ---------- */
function sec(num,key,title,sub,body){
  const isOpen=EDITOR_OPEN===key;
  const n=String(num).padStart(2,'0');
  const touched=!!(sub&&sub!=='');
  return `<section class="acc${isOpen?' open':''}${touched?' touched':''}" data-sec="${key}">
    <button class="acc-head" type="button" data-sec-toggle="${key}" aria-expanded="${isOpen?'true':'false'}">
      <span class="grp-thumb num"><span>${n}</span></span>
      <span class="acc-title">
        <b>${esc(title)}</b>
        <span class="acc-sub">${esc(sub||'')}</span>
      </span>
    </button>
    <div class="acc-body">
      <div class="acc-inner">${body}</div>
    </div>
  </section>`;
}

/* ---------- EDITOR VIEW ---------- */
function editorHTML(){
  const ev=DB.events.find(x=>x.id===VIEW.id);
  if(!ev){VIEW={mode:'list',id:null};return listHTML();}
  const contacts=DB.restaurant.contacts||[];
  const performers=DB.performers||[];
  const caps=DB.restaurant.capacity||[];
  const s=statusOf(ev);

  const perfRows=(ev.performances||[]).map((pf,i)=>{
    const p=performers.find(x=>x.id===pf.performerId);
    return `<div class="perf-row">
      <div class="perf-name">${esc(p?p.stageName:'Unknown')}</div>
      <div class="perf-meta">${esc(pf.startTime||'')}–${esc(pf.endTime||'')}${pf.title?' · '+esc(pf.title):''}</div>
      <button type="button" class="perf-del" data-perf-del="${i}">Remove</button>
    </div>`;
  }).join('');

  const svcNames=(ev.serviceIds||[]).map(id=>{
    const svc=(DB.restaurant.reservationServices||[]).find(x=>(typeof x==='string'?x===id:x.id===id));
    return svc?(typeof svc==='string'?svc:svc.name):'';
  }).filter(Boolean);

  return `<div class="meta-card">
    <div class="meta-row">
      <span class="meta-dot ${s==='published'?'green':''}"></span>
      <span class="meta-text"><b>${esc(ev.name||'Untitled event')}</b> · <span class="badge ${s}">${s}</span></span>
    </div>
  </div>
  <div class="stack">
    ${sec(1,'idn','Identity',sumIdentity(ev),`
      <div class="module">
        ${fld('Event Name *','name',ev.name)}
        ${fld('Event Type','type',ev.type,['Live Music','DJ Night','Comedy','Poetry','Themed Night','Sports Screening','Family','Corporate'])}
        ${fld('Cover Image URL','coverImage',ev.coverImage)}
        ${fldArea('Description','description',ev.description)}
        ${fld('Organizer','organizer',ev.organizer)}
        ${fld('Sponsor','sponsor',ev.sponsor)}
      </div>
    `)}
    ${sec(2,'loc','Location',sumLocation(ev),`
      <div class="module">
        <label class="check-row">
          <input type="checkbox" id="useRestLoc" ${ev.location&&ev.location.useRestaurantLocation?'checked':''}>
          <span>Use restaurant location</span>
        </label>
        <div class="grid2">
          ${fld('Village / Town / City','locCity',ev.location&&ev.location.city)}
          ${fld('Area / Neighbourhood','locArea',ev.location&&ev.location.area)}
        </div>
        ${fld('Building','locBuilding',ev.location&&ev.location.building)}
        ${fld('Landmark','locLandmark',ev.location&&ev.location.landmark)}
      </div>
    `)}
    ${sec(3,'dt','Date & Time',sumDateTime(ev),`
      <div class="module">
        <div class="grid2">${fldDate('Start Date','startDate',ev.startDate)}${fldTime('Start Time','startTime',ev.startTime)}</div>
        <div class="grid2">${fldDate('End Date','endDate',ev.endDate)}${fldTime('End Time','endTime',ev.endTime)}</div>
        ${fldChk('Recurring','recurring',ev.recurring)}
        ${fld('Recurrence (comma separated days)','recurrence',(ev.recurrence||[]).join(', '),null,'Monday, Friday')}
      </div>
    `)}
    ${sec(4,'att','Attendance',sumAttendance(ev),`
      <div class="module">
        ${fldNum('Expected Guests','expectedGuests',ev.expectedGuests)}
        ${fldNum('Maximum Capacity','maxCapacity',ev.maxCapacity)}
        ${caps.length?`<div class="field"><label>Use restaurant capacity</label><div class="chip-row">${caps.map(c=>`<button type="button" class="chip" data-cap="${c.value}">${esc(c.title)} (${c.value})</button>`).join('')}</div></div>`:''}
      </div>
    `)}
    ${sec(5,'adm','Admission',sumAdmission(ev),`
      <div class="module">
        ${fld('Admission','admission',ev.admission,['Free','RSVP required','Reservation required','Paid','Invite only'])}
        ${fldNum('Ticket Price','ticketPrice',ev.ticketPrice)}
        ${fld('Booking WhatsApp','bookingContactId',ev.bookingContactId,contacts.map(c=>({value:c.id,label:c.title||c.number})))}
      </div>
    `)}
    ${sec(6,'prf','Performers',sumPerformers(ev),`
      <div class="module">
        <div style="font-size:12.5px;color:var(--muted);margin-bottom:10px">Select existing performers or create a new one.</div>
        <div id="perfList">${perfRows||`<div class="empty-note">No performers added yet.</div>`}</div>
        <button type="button" class="inline-btn orange" id="addPerf" style="margin-top:6px">+ Add Performer</button>
      </div>
    `)}
    ${sec(7,'srv','Services',sumServices(ev),`
      <div class="module">
        ${svcNames.length?`<div style="font-size:13px;color:var(--ink-2);margin-bottom:10px">${svcNames.map(esc).join(', ')}</div>`:'<div class="empty-note" style="margin-bottom:10px">No services linked.</div>'}
        <button type="button" class="inline-btn" id="linkSvc">+ Add Service</button>
      </div>
    `)}
    ${sec(8,'rsvp','RSVP / Booking',sumRsvp(ev),`
      <div class="module">
        ${fldChk('RSVP enabled','rsvpEnabled',ev.rsvpEnabled)}
        ${fld('RSVP WhatsApp','rsvpContactId',ev.rsvpContactId,contacts.map(c=>({value:c.id,label:c.title||c.number})))}
        ${fldNum('Maximum RSVP guests','rsvpMax',ev.rsvpMax)}
      </div>
    `)}
  </div>
  <div class="editor-actions">
    <button class="btn btn-cancel" id="btnCancel" type="button">Cancel</button>
    <button class="btn btn-primary" id="btnSaveEv" type="button">Save Event</button>
  </div>`;
}

/* ---------- PERFORMERS VIEW ---------- */
function performersHTML(){
  const list=DB.performers||[];
  let h=`<div class="meta-card">
    <div class="meta-row">
      <span class="meta-dot ${list.length?'green':''}"></span>
      <span class="meta-text">${list.length?`<b>${list.length}</b> performer${list.length===1?'':'s'} on your roster`:'No performers yet'}</span>
    </div>
    <div class="meta-stats">
      <div class="stat"><b>${list.length}</b><span>Total</span></div>
      <div class="stat"><b>${list.filter(p=>p.genre).length}</b><span>Genres</span></div>
      <div class="stat"><b>${list.filter(p=>p.contact||p.whatsapp).length}</b><span>Contactable</span></div>
    </div>
  </div>`;

  if(!list.length){
    h+=`<div class="empty-note">No performers yet. Tap below to add your first.</div>`;
  } else {
    h+=`<div class="stack">`;
    list.forEach(p=>{
      const initial=(p.stageName||'?')[0].toUpperCase();
      const sub=[p.type,p.genre].filter(Boolean).join(' · ');
      h+=`<div class="event-card">
        <div class="event-thumb" style="font-size:18px;font-weight:850;color:var(--orange);background:var(--orange-soft)">${esc(initial)}</div>
        <div class="event-body">
          <div class="event-name">${esc(p.stageName||'Unnamed')}</div>
          <div class="event-meta">${esc(sub||'No type set')}</div>
          <div class="event-actions">
            <button class="mini-btn" data-perf-edit="${p.id}">Edit</button>
            <button class="mini-btn danger" data-perf-del2="${p.id}">Remove</button>
          </div>
        </div>
      </div>`;
    });
    h+=`</div>`;
  }
  h+=`<button class="inline-btn orange" id="btnNewPerf" style="width:100%;margin-top:12px;height:48px;font-size:14px">+ New Performer</button>`;
  return h;
}
function wirePerformers(){
  const nb=document.getElementById('btnNewPerf');
  if(nb)nb.onclick=()=>editPerformer(null);
  document.querySelectorAll('[data-perf-edit]').forEach(b=>b.onclick=()=>editPerformer(DB.performers.find(x=>x.id===b.getAttribute('data-perf-edit'))));
  document.querySelectorAll('[data-perf-del2]').forEach(b=>b.onclick=()=>{if(confirm('Remove performer?')){DB.performers=DB.performers.filter(x=>x.id!==b.getAttribute('data-perf-del2'));dbSave(DB);VIEW={mode:'performers'};render();}});
}

/* ========== FIELD HELPERS ========== */
function fld(label,key,val,options,placeholder){
  if(options)return `<div class="field"><label>${esc(label)}</label><select data-k="${key}">${['<option value="">—</option>',...options.map(o=>{const v=typeof o==='string'?o:o.value;const l=typeof o==='string'?o:o.label;return `<option value="${esc(v)}"${v===val?' selected':''}>${esc(l)}</option>`;})].join('')}</select></div>`;
  if(key==='coverImage')return `<div class="field"><label>${esc(label)}</label><div class="upload-input-row"><input data-k="${key}" data-upload value="${esc(val||'')}" placeholder="${esc(placeholder||'')}"><button type="button" data-upload-for="${key}">Upload</button></div></div>`;
  return `<div class="field"><label>${esc(label)}</label><input data-k="${key}" value="${esc(val||'')}" placeholder="${esc(placeholder||'')}"></div>`;
}
function fldNum(label,key,val){return `<div class="field"><label>${esc(label)}</label><input type="number" data-k="${key}" value="${val==null?'':val}"></div>`;}
function fldDate(l,k,v){return `<div class="field"><label>${esc(l)}</label><input type="date" data-k="${k}" value="${esc(v||'')}"></div>`;}
function fldTime(l,k,v){return `<div class="field"><label>${esc(l)}</label><input type="time" data-k="${k}" value="${esc(v||'')}"></div>`;}
function fldArea(l,k,v){return `<div class="field"><label>${esc(l)}</label><textarea data-k="${k}">${esc(v||'')}</textarea></div>`;}
function fldChk(l,k,v){return `<label class="check-row"><input type="checkbox" data-k="${k}" ${v?'checked':''}> <span>${esc(l)}</span></label>`;}

/* ========== EDITOR WIRING ========== */
function wireEditor(){
  const ev=DB.events.find(x=>x.id===VIEW.id);
  if(!ev)return;

  /* accordion toggles — only one open at a time, no visual chevrons */
  document.querySelectorAll('[data-sec-toggle]').forEach(el=>{
    el.onclick=()=>{
      const k=el.getAttribute('data-sec-toggle');
      EDITOR_OPEN=(EDITOR_OPEN===k)?null:k;
      document.querySelectorAll('.acc').forEach(acc=>{
        const isOpen=acc.getAttribute('data-sec')===EDITOR_OPEN;
        acc.classList.toggle('open',isOpen);
        const h=acc.querySelector('.acc-head');
        if(h)h.setAttribute('aria-expanded',isOpen?'true':'false');
      });
    };
  });

  /* field bindings */
  document.querySelectorAll('[data-k]').forEach(el=>{
    const k=el.getAttribute('data-k');
    el.onchange=el.oninput=()=>{
      let v=el.type==='checkbox'?el.checked:el.value;
      if(el.type==='number')v=v===''?null:Number(v);
      if(k==='locCity'||k==='locArea'||k==='locBuilding'||k==='locLandmark'){
        ev.location=ev.location||{};
        const map={locCity:'city',locArea:'area',locBuilding:'building',locLandmark:'landmark'};
        ev.location[map[k]]=v;
      } else if(k==='recurrence'){ev.recurrence=v.split(',').map(s=>s.trim()).filter(Boolean);}
      else ev[k]=v;
      dbSave(DB);
    };
  });

  const useLoc=document.getElementById('useRestLoc');
  if(useLoc)useLoc.onchange=()=>{
    ev.location=ev.location||{};
    ev.location.useRestaurantLocation=useLoc.checked;
    if(useLoc.checked){
      ev.location.city=DB.restaurant.location.city;
      ev.location.area=DB.restaurant.location.area;
    }
    dbSave(DB);render();
  };

  document.querySelectorAll('[data-cap]').forEach(b=>b.onclick=()=>{
    ev.maxCapacity=Number(b.getAttribute('data-cap'));
    dbSave(DB);render();
  });

  document.querySelectorAll('[data-perf-del]').forEach(b=>b.onclick=()=>{
    ev.performances.splice(Number(b.getAttribute('data-perf-del')),1);
    dbSave(DB);render();
  });

  const addP=document.getElementById('addPerf');
  if(addP)addP.onclick=()=>addPerformerToEvent(ev);

  const linkS=document.getElementById('linkSvc');
  if(linkS)linkS.onclick=()=>linkServices(ev);

  document.getElementById('btnCancel').onclick=()=>{
    EDITOR_OPEN=null;
    VIEW={mode:'list',id:null};
    render();
  };
  document.getElementById('btnSaveEv').onclick=()=>{
    if(!ev.name){toast('Event name is required');return;}
    EDITOR_OPEN=null;
    VIEW={mode:'list',id:null};
    save();
    toast('Event saved');
    push((A,rid)=>A.eventUpdate(rid,ev.id,A.eventToServer(ev)));
  };

  if(window.EatoutsUpload){
    try{EatoutsUpload.setUploadPrefix(EatoutsUpload.sessionPrefix('venues'));}catch(e){}
    EatoutsUpload.decorate(document.getElementById('app'));
  }
}

/* ========== PERFORMER MODALS ========== */
function addPerformerToEvent(ev){
  const performers=DB.performers||[];
  const listOptions=performers.map(p=>({value:p.id,label:p.stageName})).concat([{value:'__new',label:'+ Create new performer'}]);
  openForm({title:'Add Performer',fields:[
    {key:'performerId',label:'Performer',type:'select',options:listOptions},
    {key:'title',label:'Performance title',placeholder:'Sunset Afro House Set'},
    {key:'startTime',label:'Start time',type:'time'},
    {key:'endTime',label:'End time',type:'time'},
    {key:'description',label:'Description',type:'textarea'}
  ],onSave:(v,scrim)=>{
    if(v.performerId==='__new'){scrim.remove();createPerformer(ev,v);return;}
    if(!v.performerId){toast('Choose a performer');return;}
    ev.performances=ev.performances||[];
    ev.performances.push({id:uid('perf'),performerId:v.performerId,title:v.title,startTime:v.startTime,endTime:v.endTime,description:v.description});
    dbSave(DB);
    scrim.remove();
    render();
  }});
}
function createPerformer(ev,v){
  openForm({title:'New Performer',fields:[
    {key:'stageName',label:'Stage name *'},
    {key:'fullName',label:'Full name'},
    {key:'type',label:'Type',type:'select',options:['DJ','Solo Artist','Band','Singer','Rapper','Poet','MC','Comedian','Dancer','Producer','Live Music','Other']},
    {key:'genre',label:'Genre'},
    {key:'bio',label:'Short bio',type:'textarea'}
  ],onSave:(p,scrim)=>{
    if(!p.stageName){toast('Stage name required');return;}
    const perf={id:uid('performer'),...p};
    DB.performers.push(perf);
    ev.performances=ev.performances||[];
    ev.performances.push({id:uid('perf'),performerId:perf.id,title:v.title,startTime:v.startTime,endTime:v.endTime});
    dbSave(DB);
    scrim.remove();
    render();
  }});
}
function editPerformer(p){
  p=p||{};
  openForm({title:p.id?'Edit Performer':'New Performer',values:p,fields:[
    {key:'stageName',label:'Stage name *'},
    {key:'fullName',label:'Full name'},
    {key:'type',label:'Type',type:'select',options:['DJ','Solo Artist','Band','Singer','Rapper','Poet','MC','Comedian','Dancer','Producer','Live Music','Other']},
    {key:'genre',label:'Genre'},
    {key:'subGenre',label:'Sub-genre'},
    {key:'bio',label:'Short bio',type:'textarea'},
    {key:'description',label:'Full description',type:'textarea'},
    {key:'yearsActive',label:'Years active',type:'number'},
    {key:'location',label:'Location'},
    {key:'instagram',label:'Instagram'},
    {key:'tiktok',label:'TikTok'},
    {key:'website',label:'Website'},
    {key:'contact',label:'Contact'},
    {key:'whatsapp',label:'WhatsApp'}
  ],onSave:(v,scrim)=>{
    if(!v.stageName){toast('Stage name required');return;}
    if(p.id)Object.assign(p,v);else DB.performers.push({id:uid('performer'),...v});
    dbSave(DB);
    scrim.remove();
    VIEW={mode:'performers'};
    render();
  }});
}

/* ========== SERVICES ========== */
function linkServices(ev){
  ev.serviceIds=ev.serviceIds||[];
  const raw=DB.restaurant.reservationServices=(Array.isArray(DB.restaurant.reservationServices)?DB.restaurant.reservationServices:[]);
  raw.forEach((s,i)=>{if(typeof s==='string'&&String(s).trim()){raw[i]={id:String(s).trim(),name:String(s).trim(),price:null,description:''};}});
  const picked=ev.serviceIds.slice();
  const scrim=document.createElement('div');scrim.className='modal-scrim';
  scrim.innerHTML=`<div class="modal">
    <div class="modal-hdr"><h3>Link Services</h3><button class="modal-close" type="button" data-close aria-label="Close">✕</button></div>
    <div class="modal-body">
      <div style="font-size:12.5px;color:var(--muted);margin-bottom:12px">Choose the reservation services offered during this event. Linked services appear on the published event.</div>
      <div id="svcList">
        ${raw.length?raw.map(s=>`<label class="check-row" style="margin-bottom:8px">
          <input type="checkbox" data-svc="${esc(s.id)}" ${picked.includes(s.id)?'checked':''}>
          <span style="flex:1;min-width:0">
            <span style="display:block;font-weight:800;color:var(--ink)">${esc(s.name||'Service')}</span>
            <span style="display:block;font-size:11.5px;color:var(--faint);font-weight:550">${s.price!=null?'P'+Number(s.price).toFixed(2):'Price set by request'}${s.description?' · '+esc(s.description):''}</span>
          </span>
        </label>`).join(''):'<div class="empty-note">No reservation services yet. Add one below.</div>'}
      </div>
      <div style="border-top:1px solid var(--line);padding-top:14px;margin-top:14px">
        <div style="font-size:11.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:8px">Quick add</div>
        <div class="field"><input data-new-name placeholder="Service name (e.g. VIP booth)"></div>
        <div class="field"><input data-new-price type="number" placeholder="Optional price (P)"></div>
        <button type="button" class="inline-btn orange" id="addNewSvc" style="width:100%">+ Add Service</button>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-cancel" type="button" data-close>Cancel</button>
      <button class="btn btn-primary" type="button" data-save>Save</button>
    </div></div>`;
  document.body.appendChild(scrim);
  scrim.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>scrim.remove());
  scrim.addEventListener('click',e=>{if(e.target===scrim)scrim.remove();});
  scrim.querySelector('#addNewSvc').onclick=()=>{
    const name=scrim.querySelector('[data-new-name]').value.trim();
    if(!name){toast('Service name required');return;}
    const price=scrim.querySelector('[data-new-price]').value===''?null:Number(scrim.querySelector('[data-new-price]').value);
    const s={id:uid('svc'),name,price,description:''};
    raw.push(s);dbSave(DB);
    scrim.querySelector('[data-new-name]').value='';
    scrim.querySelector('[data-new-price]').value='';
    const list=scrim.querySelector('#svcList');
    const empty=list.querySelector('.empty-note');if(empty)empty.remove();
    const label=document.createElement('label');
    label.className='check-row';
    label.style.marginBottom='8px';
    label.innerHTML=`<input type="checkbox" data-svc="${esc(s.id)}" checked><span style="flex:1;min-width:0"><span style="display:block;font-weight:800;color:var(--ink)">${esc(s.name)}</span><span style="display:block;font-size:11.5px;color:var(--faint);font-weight:550">${s.price!=null?'P'+Number(s.price).toFixed(2):'Price set by request'}</span></span>`;
    list.appendChild(label);
    toast('Service added');
  };
  scrim.querySelector('[data-save]').onclick=()=>{
    ev.serviceIds=[...scrim.querySelectorAll('#svcList [data-svc]:checked')].map(x=>x.getAttribute('data-svc'));
    dbSave(DB);
    scrim.remove();
    render();
    toast(ev.serviceIds.length?ev.serviceIds.length+' service(s) linked.':'No services linked.');
  };
}

/* ========== NEW EVENT ========== */
function newEvent(){
  const ev={id:uid('event'),name:'',type:'Live Music',coverImage:'',description:'',organizer:'',sponsor:'',
    location:{useRestaurantLocation:true,city:DB.restaurant.location.city,area:DB.restaurant.location.area,building:'',landmark:''},
    startDate:'',startTime:'',endDate:'',endTime:'',recurring:false,recurrence:[],
    expectedGuests:null,maxCapacity:null,admission:'Free',ticketPrice:null,bookingContactId:null,
    performances:[],serviceIds:[],rsvpEnabled:true,rsvpContactId:null,rsvpMax:null,
    status:'draft',createdAt:Date.now()};
  DB.events.push(ev);dbSave(DB);
  EDITOR_OPEN=null;
  VIEW={mode:'edit',id:ev.id};
  render();
  push((A,rid)=>A.eventAdd(rid,Object.assign({id:ev.id},A.eventToServer(ev))));
}

/* ========== GLOBAL CLICK DELEGATION ========== */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const act=t.getAttribute('data-act');const id=t.getAttribute('data-id');
  if(act==='edit'){EDITOR_OPEN=null;VIEW={mode:'edit',id};render();return;}
  if(act==='dup'){
    const ev=DB.events.find(x=>x.id===id);if(!ev)return;
    const c=JSON.parse(JSON.stringify(ev));
    c.id=uid('event');c.name+=' (copy)';c.createdAt=Date.now();
    DB.events.push(c);save();
    push((A,rid)=>A.eventAdd(rid,Object.assign({id:c.id},A.eventToServer(c))));
    return;
  }
  if(act==='del'){
    if(confirm('Remove this event?')){
      DB.events=DB.events.filter(x=>x.id!==id);
      save();
      push((A,rid)=>A.eventDelete(rid,id));
    }
    return;
  }
});

document.getElementById('btnNewEvent').onclick=newEvent;
document.getElementById('btnPerformers').onclick=()=>{EDITOR_OPEN=null;VIEW={mode:'performers'};render();};

/* ========== BOOT ========== */
render();
eventServerSync();
</script>
