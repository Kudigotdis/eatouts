name = "eatouts"
compatibility_date = "2026-10-07"
pages_build_output_dir = "dist"

# ------------------------------------------------------------------
# Default environment (local dev + preview deploys).
# ENV is "development" here so the dev-login shortcut works locally.
# The PRODUCTION environment overrides ENV to "production" (below),
# which disables the shortcut in the live app.
# ------------------------------------------------------------------
[vars]
ENV = "development"
PUBLIC_BASE = ""

# D1 database  ->  npx wrangler d1 create eatouts
# Replace <D1_DATABASE_ID> with the database_id it prints.
[[d1_databases]]
binding = "DB"
database_name = "eatouts"
database_id = "138c97dd-95f1-4a99-9aa4-778f71090126"

# KV namespace ->  npx wrangler kv namespace create OPS_KV
# Replace <KV_NAMESPACE_ID> with the id it prints.
[[kv_namespaces]]
binding = "OPS_KV"
id = "315b0ddf742046eaab81843535adaf65"

# ------------------------------------------------------------------
# Media storage is Supabase Storage (not Cloudflare R2, which needs a
# card on file). No binding is needed — the upload function calls the
# Supabase Storage REST API. Provide these as secrets:
#   SUPABASE_URL      e.g. https://xxxxxxxx.supabase.co
#   SUPABASE_KEY      the service_role key (server-side only!)
#   SUPABASE_BUCKET   e.g. eatouts-media
#   PUBLIC_BASE       optional override for the public file URL prefix
# ------------------------------------------------------------------

# ------------------------------------------------------------------
# Production overrides.
# ENV MUST stay "production" so /api/auth/dev-login refuses to run.
# Set the real secrets in the Cloudflare dashboard
# (Workers & Pages -> eatouts -> Settings -> Variables and Secrets):
#   SESSION_SECRET, DEV_LOGIN_EMAILS, ADMIN_EMAILS,
#   SUPABASE_URL, SUPABASE_KEY, SUPABASE_BUCKET, PUBLIC_BASE
# ------------------------------------------------------------------
[env.production.vars]
ENV = "production"
PUBLIC_BASE = ""

# Bindings are NOT inherited by environments, so the D1 database and
# KV namespace are repeated for the production environment.
[[env.production.d1_databases]]
binding = "DB"
database_name = "eatouts"
database_id = "138c97dd-95f1-4a99-9aa4-778f71090126"

[[env.production.kv_namespaces]]
binding = "OPS_KV"
id = "315b0ddf742046eaab81843535adaf65"