  if(el) document.documentElement.style.setProperty("--navh",el.offsetHeight+"px");
}

/* ============================================================
   EVENT HANDLERS
   ============================================================ */
document.addEventListener("click",function(e){
  // bottom-nav tabs return to the main app on the matching tab
  const navTab=e.target.closest(".nav-btn[data-tab]");
  if(navTab){window.location.href="index.html#"+navTab.getAttribute("data-tab");return;}
  // scrim close (only if clicked directly on scrim, not panel)
  const scrim=e.target.closest(".fpop-scrim");
  if(scrim && e.target===scrim){
    const act=scrim.getAttribute("data-act");
    if(act==="closeSupplierTypeMenu"){STATE.supplierTypeMenu.open=false;render();return;}
    if(act==="closeFlyerMenu"){STATE.flyerMenuOpen=false;render();return;}
    if(act==="closeTitleEdit"){STATE.titleEditOpen=false;render();return;}
    if(act==="closePrompt"){STATE.prompt.open=false;render();return;}
    // fallback: close any open modal
    STATE.flyerMenuOpen=false;STATE.titleEditOpen=false;
    STATE.supplierTypeMenu.open=false;STATE.prompt.open=false;
    render();return;
  }

  const t=e.target.closest("[data-act]");
  if(!t) return;
  const act=t.getAttribute("data-act");

  // Venue bar
  if(act==="toggleVenueBar"){ STATE.venueBarExpanded=!STATE.venueBarExpanded; render(); return; }

  // Flyer
  if(act==="openFlyerMenu"){ STATE.flyerMenuOpen=true; render(); return; }
  if(act==="closeFlyerMenu"){ STATE.flyerMenuOpen=false; render(); return; }
  if(act==="addFlyerImage"){
    const input=document.createElement("input");
    input.type="file";input.accept="image/*";
    input.onchange=function(){
      const f=input.files&&input.files[0];
      if(!f) return;
      const reader=new FileReader();
      reader.onload=function(ev){
        STATE.flyerImages.push(ev.target.result);
        render();
        toast("Image added");
      };
      reader.readAsDataURL(f);
    };
    input.click();
    return;
  }
  if(act==="removeFlyer"){
    const i=Number(t.getAttribute("data-idx"));
    STATE.flyerImages.splice(i,1);
    render();
    return;
  }
  if(act==="makeMainFlyer"){
    const i=Number(t.getAttribute("data-idx"));
    if(i<=0||i>=STATE.flyerImages.length) return;
    const [img]=STATE.flyerImages.splice(i,1);
    STATE.flyerImages.unshift(img);
    render();
    toast("Main flyer updated");
    return;
  }

  // Title edit
  if(act==="openTitleEdit"){
    STATE.titleEditOpen=true;
    STATE.titleEditDraft={title:STATE.eventTitle,description:STATE.eventDescription};
    render();
    return;
  }
  if(act==="closeTitleEdit"){ STATE.titleEditOpen=false; render(); return; }
  if(act==="saveTitleEdit"){
    const titleEl=document.getElementById("titleDraft");
    const descEl=document.getElementById("descDraft");
    STATE.eventTitle=titleEl?titleEl.value:"";
    STATE.eventDescription=descEl?descEl.value:"";
    STATE.titleEditOpen=false;
    render();
    toast("Saved");
    return;
  }

  // Side-scroll / steps
  if(act==="jumpStep"){
    STATE.activeStep=t.getAttribute("data-step");
    render();
    setTimeout(function(){
      const el=document.querySelector('[data-sec="'+STATE.activeStep+'"]');
      if(el && el.scrollIntoView) el.scrollIntoView({behavior:"smooth",block:"start"});
    },40);
    return;
  }

  // Section toggle
  if(act==="toggleSec"){
    const key=t.getAttribute("data-sec");
    const open=!STATE.openSections[key];
    closeMainSections(key);
    STATE.openSections[key]=open;
    render();
    return;
  }
  if(act==="toggleSub"||act==="toggleSupGroup"||act==="toggleMenuCat"){
    const key=t.getAttribute("data-key");
    if(act==="toggleMenuCat"){
      const open=!STATE.menuOpen[key];
      Object.keys(STATE.menuOpen).forEach(function(k){
        if(k!==key) STATE.menuOpen[k]=false;
      });
      STATE.menuOpen[key]=open;
    } else if(act==="toggleSub"){
      const open=!STATE.openSections[key];
      closeOpenSectionsByPrefix("sub_",key);
      STATE.openSections[key]=open;
    } else {
      const open=!STATE.openSections[key];
      closeOpenSectionsByPrefix("sup_added_",key);
      STATE.openSections[key]=open;
    }
    render();
    return;
  }
  if(act==="toggleEtypeGroup"){
    const key=t.getAttribute("data-key");
    const open=!STATE.openSections[key];
    closeOpenSectionsByPrefix("et_cat_",key);
    STATE.openSections[key]=open;
    render();
    return;
  }

  // Event type
  if(act==="pickEventType"){
    const id=t.getAttribute("data-id");
    const et=findEventType(id);
    if(!et) return;
    STATE.eventType={eventId:et.id,name:et.name,categoryId:et.categoryId,categoryName:et.categoryName,subCategoryName:et.subCategoryName,description:et.description,icon:et.icon};
    STATE.activeStep="schedule";
    render();
    toast("Event type set");
    return;
  }
  if(act==="clearEventType"){
    STATE.eventType={eventId:null,name:null,categoryId:null,categoryName:null,subCategoryName:null,description:null,icon:null};
    render();
    return;
  }

  // Notes
  if(act==="addNote"){
    openPrompt("Add Note",[
      {key:"title",label:"Title",placeholder:"e.g. Cultural protocol"},
      {key:"body",label:"Note",type:"textarea",placeholder:"Detail the note…"}
    ],function(v){
      if(!v.title && !v.body) return;
      STATE.notes.push({id:uid("n"),title:v.title||"Note",body:v.body||""});
      render();
    });
    return;
  }
  if(act==="removeNote"){
    const i=Number(t.getAttribute("data-idx"));
    STATE.notes.splice(i,1);
    render();
    return;
  }

  // Schedule
  if(act==="setScheduleMode"){
    STATE.schedule.mode=t.getAttribute("data-val");
    if(STATE.schedule.mode==="one-day" && STATE.schedule.days.length>1){
      STATE.schedule.days=[STATE.schedule.days[0]];
    }
    render();
    return;
  }
  if(act==="addDay"){
    STATE.schedule.days.push({id:uid("d"),startDate:"",startTime:"",endDate:"",endTime:""});
    render();
    return;
  }
  if(act==="removeDay"){
    const i=Number(t.getAttribute("data-idx"));
    STATE.schedule.days.splice(i,1);
    render();
    return;
  }

  // Target audience
  if(act==="addAudience"){
    openPrompt("Add Target Audience",[
      {key:"title",label:"Title",placeholder:"e.g. Students"},
      {key:"note",label:"Note",type:"textarea",placeholder:"Describe this audience"},
      {key:"ageGroup",label:"Age group",placeholder:"e.g. 18–25"}
    ],function(v){
      if(!v.title) return;
      STATE.targetAudience.push({id:uid("a"),title:v.title,note:v.note||"",ageGroup:v.ageGroup||""});
      render();
    });
    return;
  }
  if(act==="removeAudience"){
    const i=Number(t.getAttribute("data-idx"));
    STATE.targetAudience.splice(i,1);
    render();
    return;
  }

  // Venue
  if(act==="pickVenue"){
    const id=t.getAttribute("data-id");
    if(STATE.venue && STATE.venue.id===id){
      STATE.venue=null;STATE.venueSpaces=[];STATE.venueGalleryOpen=null;
    } else {
      STATE.venue=findVenue(id);
      STATE.venueSpaces=[];
      STATE.venueGalleryOpen=null;
      STATE.activeStep="menu";
    }
    render();
    return;
  }
  if(act==="toggleSpace"){
    const id=t.getAttribute("data-id");
    const i=STATE.venueSpaces.indexOf(id);
    if(i>-1) STATE.venueSpaces.splice(i,1); else STATE.venueSpaces.push(id);
    render();
    return;
  }
  if(act==="openGalleryDetail"){
    const i=Number(t.getAttribute("data-idx"));
    STATE.venueGalleryOpen = STATE.venueGalleryOpen===i?null:i;
    render();
    return;
  }
  if(act==="addVenueRule"){
    openPrompt("Add Venue Rule",[
      {key:"title",label:"Rule title",placeholder:"e.g. No outside catering"},
      {key:"note",label:"Note",type:"textarea",placeholder:"Explain the rule"}
    ],function(v){
      if(!v.title) return;
      STATE.venueRules.push({id:uid("r"),title:v.title,note:v.note||""});
      render();
    });
    return;
  }
  if(act==="removeVenueRule"){
    const i=Number(t.getAttribute("data-idx"));
    STATE.venueRules.splice(i,1);
    render();
    return;
  }

  // Menu
  if(act==="incMenu"||act==="decMenu"){
    const cat=t.getAttribute("data-cat");
    const id=t.getAttribute("data-id");
    const list=cat==="beverages"?STATE.menuBeverages:STATE.menuFood;
    const items=getMenuItemsForVenue(cat==="beverages"?"Beverage":"Food");
    const m=items.find(function(x){return x.id===id;});
    if(!m) return;
    let entry=list.find(function(x){return x.itemId===id;});
    if(!entry){
      if(act==="decMenu") return;
      entry={itemId:id,name:m.name,price:m.price,qty:0};
      list.push(entry);
    }
    entry.qty += (act==="incMenu"?1:-1);
    if(entry.qty<=0){
      const idx=list.indexOf(entry);
      list.splice(idx,1);
    }
    render();
    return;
  }

  // Suppliers
  if(act==="openSupplierTypeMenu"){
    STATE.supplierTypeMenu={open:true,search:"",cat:t.getAttribute("data-cat")||"",openCat:null};
    render();
    return;
  }
  if(act==="closeSupplierTypeMenu"){
    STATE.supplierTypeMenu.open=false;
    render();
    return;
  }
  if(act==="toggleStmCat"){
    const cat=t.getAttribute("data-cat");
    STATE.supplierTypeMenu.openCat = STATE.supplierTypeMenu.openCat===cat?null:cat;
    render();
    return;
  }
  if(act==="pickSupplier"){
    const id=t.getAttribute("data-id");
    const cat=t.getAttribute("data-cat")||t.getAttribute("data-field");
    if(!cat) return;
    if(isSupplierAdded(id)){ STATE.supplierTypeMenu.open=false; render(); return; }
    if(!STATE.suppliers[cat]) STATE.suppliers[cat]=[];
    STATE.suppliers[cat].push({supplierId:id,customisations:{}});
    STATE.supplierTypeMenu.open=false;
    STATE.supplierCustomising={supplierId:id,fieldId:cat};
    render();
    toast("Supplier added");
    return;
  }
  if(act==="removeSupplier"){
    const field=t.getAttribute("data-field");
    const idx=Number(t.getAttribute("data-idx"));
    if(STATE.suppliers[field]) STATE.suppliers[field].splice(idx,1);
    if(STATE.supplierCustomising && STATE.supplierCustomising.fieldId===field) STATE.supplierCustomising=null;
    render();
    return;
  }
  if(act==="customiseSupplier"){
    const field=t.getAttribute("data-field");
    const idx=Number(t.getAttribute("data-idx"));
    const entry=(STATE.suppliers[field]||[])[idx];
    if(!entry) return;
    const same=STATE.supplierCustomising && STATE.supplierCustomising.supplierId===entry.supplierId && STATE.supplierCustomising.fieldId===field;
    STATE.supplierCustomising = same?null:{supplierId:entry.supplierId,fieldId:field};
    render();
    return;
  }
  if(act==="incSupQty"||act==="decSupQty"){
    const field=t.getAttribute("data-field");
    const idx=Number(t.getAttribute("data-idx"));
    const entry=(STATE.suppliers[field]||[])[idx];
    if(!entry) return;
    const c=entry.customisations||(entry.customisations={});
    let v=Number(c.qty)||1;
    v+=(act==="incSupQty"?1:-1);
    if(v<1) v=1;
    c.qty=v;
    render();
    return;
  }
  if(act==="incSupAddon"||act==="decSupAddon"){
    const field=t.getAttribute("data-field");
    const idx=Number(t.getAttribute("data-idx"));
    const i=Number(t.getAttribute("data-i"));
    const entry=(STATE.suppliers[field]||[])[idx];
    if(!entry) return;
    const c=entry.customisations||(entry.customisations={});
    let v=Number(c["addon_"+i])||0;
    v+=(act==="incSupAddon"?1:-1);
    if(v<0) v=0;
    c["addon_"+i]=v;
    render();
    return;
  }
  if(act==="saveSupplierCustom"){
    const field=t.getAttribute("data-field");
    const idx=Number(t.getAttribute("data-idx"));
    const entry=(STATE.suppliers[field]||[])[idx];
    if(!entry) return;
    const custom={};
    const qty=document.querySelector("[data-sup-qty]");
    const notes=document.querySelector("[data-sup-notes]");
    if(qty) custom.qty=qty.value;
    document.querySelectorAll("[data-sup-addon]").forEach(function(input){
      custom["addon_"+input.getAttribute("data-sup-addon")]=input.value;
    });
    if(notes) custom.notes=notes.value;
    entry.customisations=custom;
    STATE.supplierCustomising=null;
    render();
    toast("Customisation saved");
    return;
  }

  // Event details
  if(act==="setEventMode"){
    STATE.eventDetails.mode=t.getAttribute("data-val");
    render();
    return;
  }
  if(act==="setEntryType"){
    STATE.eventDetails.entryType=t.getAttribute("data-val");
    render();
    return;
  }
  if(act==="addTier"){
    openPrompt("Add Ticket Tier",[
      {key:"name",label:"Tier name",placeholder:"e.g. Early Bird"},
      {key:"price",label:"Price",type:"number",placeholder:"150"},
      {key:"notes",label:"Notes",type:"textarea",placeholder:"What's included"}
    ],function(v){
      if(!v.name) return;
      STATE.eventDetails.tiers.push({id:uid("t"),name:v.name,price:v.price,notes:v.notes||""});
      render();
    });
    return;
  }
  if(act==="removeTier"){
    const i=Number(t.getAttribute("data-idx"));
    STATE.eventDetails.tiers.splice(i,1);
    render();
    return;
  }
  if(act==="addContact"){
    openPrompt("Add Contact Link",[
      {key:"type",label:"Type",type:"select",options:["Call","WhatsApp","Facebook","Instagram","TikTok","Twitter/X","YouTube","LinkedIn"]},
      {key:"title",label:"Title",placeholder:"e.g. RSVP line"},
      {key:"value",label:"Link or number",placeholder:"+267 71 234 567 / @handle / https://..."},
      {key:"notes",label:"Notes",type:"textarea",placeholder:"Any notes for guests"}
    ],function(v){
      if(!v.value) return;
      STATE.eventDetails.contacts.push({id:uid("c"),type:v.type,title:v.title||"",value:v.value,notes:v.notes||""});
      render();
    });
    return;
  }
  if(act==="removeContact"){
    const i=Number(t.getAttribute("data-idx"));
    STATE.eventDetails.contacts.splice(i,1);
    render();
    return;
  }
  if(act==="addTicketLink"){
    openPrompt("Add Ticket Link",[
      {key:"url",label:"URL",type:"url",placeholder:"https://tickets.example.com/event"},
      {key:"notes",label:"Notes",type:"textarea",placeholder:"Explain the ticket details"}
    ],function(v){
      if(!v.url) return;
      STATE.eventDetails.ticketLinks.push({id:uid("tl"),url:v.url,notes:v.notes||""});
      render();
    });
    return;
  }
  if(act==="removeTicketLink"){
    const i=Number(t.getAttribute("data-idx"));
    STATE.eventDetails.ticketLinks.splice(i,1);
    render();
    return;
  }

  // Guests
  if(act==="addGuest"){
    openPrompt("Add Guest",[
      {key:"name",label:"Name",placeholder:"e.g. Kagiso M."},
      {key:"role",label:"Role",placeholder:"Guest / Speaker / VIP / Performer"},
      {key:"dietary",label:"Dietary notes",placeholder:"e.g. Vegetarian, Nut allergy"},
      {key:"plus",label:"Plus ones",type:"number",placeholder:"0"}
    ],function(v){
      if(!v.name) return;
      STATE.guests.push({id:uid("g"),name:v.name,role:v.role||"Guest",dietary:v.dietary||"",plus:Number(v.plus)||0});
      render();
    });
    return;
  }
  if(act==="removeGuest"){
    const i=Number(t.getAttribute("data-idx"));
    STATE.guests.splice(i,1);
    render();
    return;
  }

  // RSVP
  if(act==="addRsvp"){
    openPrompt("Add RSVP Contact",[
      {key:"title",label:"Title",placeholder:"e.g. RSVP line"},
      {key:"note",label:"Note",type:"textarea",placeholder:"Any notes"},
      {key:"contactType",label:"Contact type",type:"select",options:["Call","WhatsApp","Facebook","Instagram","TikTok","Twitter/X","YouTube","LinkedIn"]},
      {key:"contactValue",label:"Link or number",placeholder:"+267 ... / @handle / https://..."}
    ],function(v){
      if(!v.title) return;
      STATE.rsvp.push({id:uid("r"),title:v.title,note:v.note||"",contactType:v.contactType,contactValue:v.contactValue||""});
      render();
    });
    return;
  }
  if(act==="removeRsvp"){
    const i=Number(t.getAttribute("data-idx"));
    STATE.rsvp.splice(i,1);
    render();
    return;
  }

  // Share options
  if(act==="toggleShare"){
    const key=t.getAttribute("data-key");
    STATE.shareOptions[key]=!STATE.shareOptions[key];
    render();
    return;
  }

  // Privacy toggles
  if(act==="togglePrivacy"){
    const key=t.getAttribute("data-key");
    STATE[key]=!STATE[key];
    render();
    return;
  }

  // Calculator
  if(act==="toggleCalc"){
    STATE.calcExpanded=!STATE.calcExpanded;
    renderCalcBar();
    measureCalc();
    return;
  }
  if(act==="saveDraftNow"){
    saveDraft();
    toast("Draft saved");
    return;
  }

  // Share
  if(act==="shareWhatsApp"){
    const text=buildShareMessage();
    window.open("https://wa.me/?text="+encodeURIComponent(text),"_blank");
    return;
  }
  if(act==="sendToVenue"){
    if(!STATE.venue) return;
    const text=buildShareMessage();
    const number=STATE.venue.whatsapp || "26771844129";
    window.open("https://wa.me/"+number+"?text="+encodeURIComponent(text),"_blank");
    return;
  }

  // Prompt
  if(act==="closePrompt"){ STATE.prompt.open=false; render(); return; }
  if(act==="savePrompt"){ savePromptFromForm(); return; }
});

// Input handler
document.addEventListener("input",function(e){
  const t=e.target;
  if(t.matches("[data-dfield]")){
    const i=Number(t.getAttribute("data-day"));
    const field=t.getAttribute("data-dfield");
    if(STATE.schedule.days[i]) STATE.schedule.days[i][field]=t.value;
    scheduleSave();
    return;
  }
  if(t.matches("[data-field]")){
    const k=t.getAttribute("data-field");
    if(k==="dresscode") STATE.eventDetails.dresscode=t.value;
    scheduleSave();
    return;
  }
  if(t.matches("[data-sup-qty]")||t.matches("[data-sup-addon]")||t.matches("[data-sup-notes]")){
    const field=t.getAttribute("data-field");
    const idx=Number(t.getAttribute("data-idx"));
    const entry=(STATE.suppliers[field]||[])[idx];
    if(!entry) return;
    const c=entry.customisations||(entry.customisations={});
    if(t.matches("[data-sup-qty]")) c.qty=t.value;
    else if(t.matches("[data-sup-addon]")) c["addon_"+t.getAttribute("data-sup-addon")]=t.value;
    else c.notes=t.value;
    scheduleSave();
    return;
  }
  if(t.id==="stmSearch"){
    STATE.supplierTypeMenu.search=t.value;
    // Update the popup body in place for smooth typing
    const body=document.querySelector(".fpop-body");
    if(body && STATE.supplierTypeMenu.open){
      // re-render just the body via render()
    }
    // simple re-render (still fast enough)
    scheduleSave();
    return;
  }
});

// Special handler for STM search - re-render after typing to filter live
document.addEventListener("input",function(e){
  if(e.target.id==="stmSearch"){
    STATE.supplierTypeMenu.search=e.target.value;
    const val=e.target.value;
    const start=e.target.selectionStart;
    render();
    const inp=document.getElementById("stmSearch");
    if(inp){inp.focus();inp.setSelectionRange(start,start);}
  }
});

/* ============================================================
   SHARE MESSAGE
   ============================================================ */
function buildShareMessage(){
  const et=findEventType(STATE.eventType.eventId);
  const v=STATE.venue;
  let msg="*"+(STATE.eventTitle||"Untitled Event")+"*\n";
  if(et) msg+="Type: "+et.name+"\n";
  if(v) msg+="Venue: "+v.name+" ("+(v.city||"")+(v.area?" · "+v.area:"")+")\n";
  if(STATE.schedule.days.length && STATE.schedule.days[0].startDate){
    msg+="When: "+STATE.schedule.days.map(function(d,i){
      return "Day "+(i+1)+" "+(d.startDate||"")+" "+(d.startTime||"")+
        (d.endDate||d.endTime?" → "+(d.endDate||"")+" "+(d.endTime||""):"");
    }).join(" | ")+"\n";
  }
  if(totalGuests()) msg+="Guests: "+totalGuests()+"\n";
  const menuCount=STATE.menuFood.length+STATE.menuBeverages.length;
  if(menuCount) msg+="Menu items: "+menuCount+"\n";
  const supCount=Object.keys(STATE.suppliers).reduce(function(n,k){return n+(STATE.suppliers[k]||[]).length;},0);
  if(supCount) msg+="Suppliers: "+supCount+"\n";
  if(STATE.showBudget) msg+="Estimated budget: "+fmt(grandTotal())+"\n";
  if(STATE.eventDescription) msg+="\n"+STATE.eventDescription+"\n";
  msg+="\nPreview: https://eatouts.app/e/"+(v?v.id:"draft");
  return msg;
}

/* ============================================================
   BOOT
   ============================================================ */
(function boot(){
  loadDraft();
  try{
    var q=new URLSearchParams(location.search);
    var eid=q.get("event");
    if(eid){var et=findEventType(eid); if(et){
      STATE.eventType={eventId:et.id,name:et.name,categoryId:et.categoryId,
        categoryName:et.categoryName,subCategoryName:et.subCategoryName,
        description:et.description,icon:et.icon};
      }}
    var vid=q.get("venue");
    if(vid){
      var v=findVenue(vid);
      if(!v){
        /* Fallback: branch ids from groupedListing() may differ from the raw
           directory row ids used in EATOUTS_VENUES; match by venue name. */
        var want=String(q.get("vname")||"").trim().toLowerCase();
        v=getVenues().find(function(x){
          return String(x.name||"").trim().toLowerCase()===want;
        })||null;
      }
      if(v){STATE.venue=v; STATE.venueSpaces=[]; STATE.venueGalleryOpen=null;
        STATE.activeStep="menu";}
    }
  }catch(e){}
  render();
  /* Connectivity chip - shown only when offline (matches index.html) */
  var netChip=document.querySelector(".hdr-chip");
  function refreshNetChip(){if(netChip)netChip.style.display=navigator.onLine?"none":"";}
  window.addEventListener("online",refreshNetChip);
  window.addEventListener("offline",refreshNetChip);
  refreshNetChip();
  window.addEventListener("resize",function(){measureCalc();measureNav();});
  window.addEventListener("beforeunload",saveDraft);
})();
</script>
