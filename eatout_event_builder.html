<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>EatOuts — Event Planner</title>
<link rel="icon" type="image/png" href="assets/logo/EatOuts_Badge.png">
<style>
:root{
  --gold:#c9a84c;--black:#151515;--bg:#f0ece2;
  --card:#fff;--surface:#faf8f2;--text:#1a1a1a;
  --muted:#7a7466;--muted-2:#a89a7e;--border:#e7e4dd;--border-soft:#f1ece1;
  --danger:#c43c3c;--success:#17834b;--radius:16px;
  --navh:0px;--calch:0px;
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  color:var(--text);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;text-align:left;padding:0}
img{display:block;max-width:100%}
::-webkit-scrollbar{width:0;height:0;display:none}
*{scrollbar-width:none;-ms-overflow-style:none}

#shell{position:fixed;inset:0;max-width:460px;margin:0 auto;display:flex;flex-direction:column;
  background:#fff;box-shadow:0 0 80px rgba(0,0,0,.08);overflow:hidden}
@media(min-width:520px){#shell{border-left:1px solid var(--border);border-right:1px solid var(--border)}}

/* ---------- HEADER ---------- */
#hdr{flex:0 0 auto;height:58px;display:flex;align-items:center;gap:10px;padding:0 14px;
  background:#fff;border-bottom:1px solid var(--border);position:relative;z-index:58;
  padding-top:env(safe-area-inset-top)}
.brand-mark{height:34px;width:auto;aspect-ratio:1172/504;flex:0 0 auto;display:flex;align-items:center;justify-content:flex-start;background:none;border:0;border-radius:0;box-shadow:none;overflow:hidden}
.brand-mark img{width:100%;height:100%;object-fit:contain;display:block}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.hdr-chip{font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted-2);border:1px solid var(--border);border-radius:20px;padding:4px 9px;
  background:var(--surface);transition:all .15s}

/* ---------- VENUE BAR ---------- */
#venue-bar{flex:0 0 auto;background:#fff;border-bottom:1px solid var(--border);
  position:relative;z-index:30}
.venue-bar-inner{display:flex;align-items:center;gap:10px;padding:9px 14px;
  min-height:54px;cursor:pointer;transition:background .15s}
.venue-bar-inner:active{background:var(--surface)}
.venue-thumb{width:38px;height:38px;border-radius:10px;flex:0 0 auto;overflow:hidden;
  background:var(--surface);display:flex;align-items:center;justify-content:center;
  font-size:16px;border:1px solid var(--border-soft)}
.venue-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.venue-bar-info{flex:1;min-width:0}
.venue-bar-name{font-size:13px;font-weight:800;color:var(--text);line-height:1.2;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.venue-bar-sub{font-size:10.5px;color:var(--muted);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.venue-bar-sub b{color:var(--gold);font-weight:800}
.venue-bar-badge{font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  color:var(--muted-2);border:1px solid var(--border);border-radius:10px;padding:3px 7px;
  background:var(--surface);flex:0 0 auto}
.venue-bar-expand{border-top:1px solid var(--border-soft);padding:12px 14px;
  background:var(--surface);display:none}
.venue-bar-expand.open{display:block;animation:fadeIn .18s ease}
.venue-bar-expand h4{margin:0 0 8px;font-size:11px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted-2);font-weight:800}
.venue-kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;
  border-bottom:1px solid var(--border-soft);font-size:12px}
.venue-kv:last-child{border-bottom:0}
.venue-kv .k{color:var(--muted);font-weight:700}
.venue-kv .v{color:var(--text);font-weight:700;text-align:right;max-width:60%}

/* ---------- VIEWPORT ---------- */
#viewport{flex:1 1 auto;position:relative;overflow:hidden;background:#fff}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:#fff}
.scroll{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;padding-bottom:calc(84px + var(--calch) + env(safe-area-inset-bottom))}

/* ---------- FLYER (edge-to-edge) ---------- */
.flyer{width:100%;aspect-ratio:16/9;background:linear-gradient(135deg,#f5f3ee,#e8e4d8);
  cursor:pointer;position:relative;overflow:hidden;display:block;border:0;padding:0}
.flyer:active{opacity:.9}
.flyer img{width:100%;height:100%;object-fit:cover;display:block}
.flyer-empty{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  color:var(--muted-2);font-size:42px;font-weight:200;letter-spacing:-.02em}
.flyer-add-badge{position:absolute;right:12px;bottom:12px;width:32px;height:32px;
  border-radius:50%;background:rgba(0,0,0,.72);color:#fff;display:flex;align-items:center;
  justify-content:center;font-size:20px;font-weight:300;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.flyer-main-badge{position:absolute;left:12px;top:12px;background:rgba(0,0,0,.72);color:#fff;
  font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  padding:4px 8px;border-radius:20px;backdrop-filter:blur(6px)}
.flyer-count{position:absolute;right:12px;top:12px;background:rgba(0,0,0,.72);color:#fff;
  font-size:9.5px;font-weight:800;letter-spacing:.04em;padding:4px 8px;border-radius:20px;
  backdrop-filter:blur(6px)}

/* ---------- TITLE BLOCK ---------- */
.flyer-title-block{padding:16px 14px 12px;cursor:pointer;transition:background .15s}
.flyer-title-block:active{background:var(--surface)}
.flyer-title-block h1{margin:0;font-size:22px;font-weight:900;letter-spacing:-.015em;
  color:var(--text);line-height:1.15}
.flyer-title-block .desc{margin-top:6px;font-size:12.5px;color:var(--muted);font-weight:500;
  line-height:1.5;max-width:100%}
.flyer-title-block .desc.placeholder{font-style:italic;opacity:.7}
.flyer-title-block .edit-hint{margin-top:6px;font-size:10px;font-weight:800;
  letter-spacing:.1em;text-transform:uppercase;color:var(--muted-2)}

/* ---------- SIDE-SCROLL (no numbers, no pills, snap 4) ---------- */
.side-scroll-wrap{position:relative;padding:10px 0 12px;
  border-bottom:1px solid var(--border-soft);background:#fff}
.side-scroll{display:flex;gap:6px;overflow-x:auto;padding:0 14px;
  scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;
  scroll-padding-left:14px}
.side-scroll::-webkit-scrollbar{display:none}
.side-item{flex:0 0 calc((100% - 18px) / 4);scroll-snap-align:start;scroll-snap-stop:always;
  padding:8px 2px;text-align:center;
  font-size:11px;font-weight:800;letter-spacing:.01em;
  color:var(--muted-2);background:transparent;border:0;
  transition:color .18s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  min-width:0}
.side-item:active{color:var(--muted)}
.side-item.on{color:var(--text)}
.side-item.locked{opacity:.45;pointer-events:none}
.side-item .side-lbl{display:block;overflow:hidden;text-overflow:ellipsis}

/* ---------- SECTION ---------- */
.section{background:#fff;border:1px solid var(--border-soft);border-radius:14px;
  margin:12px 14px;overflow:hidden;transition:border-color .22s}
.section.open{border-color:var(--text)}
.section.locked{opacity:.72}
.section-hdr{width:100%;padding:14px 16px;display:flex;align-items:center;gap:12px;
  background:transparent;transition:background .15s}
.section-hdr:active{background:var(--surface)}
.section-num{font-size:10px;font-weight:900;letter-spacing:.14em;color:var(--muted-2);
  min-width:24px;flex:0 0 auto;transition:color .22s}
.section.open .section-num{color:var(--gold)}
.section-title-block{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.section-title{font-size:14px;font-weight:900;color:var(--text);letter-spacing:.01em}
.section-sub{font-size:11px;color:var(--muted);font-weight:600;line-height:1.35}
.section-count{font-size:10.5px;font-weight:800;letter-spacing:.04em;color:var(--muted-2);
  padding:2px 7px;border-radius:10px;background:var(--surface);
  border:1px solid var(--border-soft);flex:0 0 auto}
.section-count.has{color:var(--success);background:#effaf3;border-color:#c7ebd3}
.section-body{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.section.open .section-body{max-height:10000px}
.section-body-in{padding:2px 16px 16px;border-top:1px solid var(--border-soft)}

/* ---------- FIELDS ---------- */
.field{margin-bottom:12px}
.field:last-child{margin-bottom:0}
.field label{display:block;margin-bottom:6px;font-size:10px;font-weight:800;
  letter-spacing:.12em;text-transform:uppercase;color:var(--muted-2)}
.field-hint{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.45}
input[type="text"],input[type="tel"],input[type="email"],input[type="number"],
input[type="date"],input[type="time"],input[type="url"],textarea,select{
  width:100%;min-height:44px;padding:11px 13px;background:var(--surface);
  border:1px solid var(--border-soft);border-radius:11px;font-size:13px;color:var(--text);
  outline:none;transition:border-color .15s,background .15s}
input:focus,textarea:focus,select:focus{border-color:var(--text);background:#fff}
textarea{min-height:80px;resize:vertical;line-height:1.5}
select{appearance:none;-webkit-appearance:none;padding-right:32px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:360px){.grid2{grid-template-columns:1fr}}
.chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.chip{font-size:11px;font-weight:700;letter-spacing:.02em;padding:7px 12px;border-radius:20px;
  background:var(--surface);border:1px solid var(--border-soft);color:var(--muted);
  cursor:pointer;transition:all .15s}
.chip:active{transform:scale(.97)}
.chip.on{background:var(--black);color:#fff;border-color:var(--black)}

.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:11px 12px;background:var(--surface);border:1px solid var(--border-soft);
  border-radius:11px;margin-bottom:8px}
.toggle-row .lbl{font-size:12.5px;font-weight:800;color:var(--text);display:flex;flex-direction:column}
.toggle-row .lbl em{font-style:normal;font-size:10.5px;color:var(--muted);font-weight:600;margin-top:2px}
.switch{width:42px;height:24px;border-radius:20px;background:var(--border);position:relative;
  flex:0 0 auto;transition:background .18s;cursor:pointer}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;
  border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .18s}
.switch.on{background:var(--success)}
.switch.on::after{transform:translateX(18px)}

/* ---------- BUTTONS ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;
  padding:11px 16px;border-radius:11px;font-size:12.5px;font-weight:800;letter-spacing:.02em;
  background:var(--surface);border:1px solid var(--border-soft);color:var(--text);
  transition:background .15s,transform .1s;text-decoration:none}
.btn:active{transform:scale(.98);background:var(--border-soft)}
.btn.primary{background:var(--black);color:#fff;border-color:var(--black)}
.btn.primary:active{background:#000}
.btn.gold{background:var(--gold);color:#fff;border-color:var(--gold)}
.btn.ghost{background:transparent;border-color:var(--border);color:var(--muted)}
.btn.wa{background:#dff5e4;border-color:#b8e6c1;color:#1c6b2e}
.btn.wa:active{background:#c9ecd0}
.btn.full{width:100%}
.btn.half{flex:1}
.btn.sm{min-height:34px;padding:7px 12px;font-size:11px;border-radius:9px}
.btn.tiny{min-height:28px;padding:5px 10px;font-size:10.5px;border-radius:8px}
.btn.danger{background:#fbeaea;color:var(--danger);border-color:#f0d1d1}
.btn[disabled]{opacity:.4;cursor:default;transform:none}

/* ---------- EVENT TYPE GROUPS ---------- */
.etype-group{border:1px solid var(--border-soft);border-radius:12px;margin-bottom:8px;
  overflow:hidden;background:#fff;transition:border-color .2s}
.etype-group.open{border-color:var(--text)}
.etype-group-hdr{display:flex;align-items:center;gap:11px;padding:12px 13px;
  background:var(--surface);cursor:pointer;transition:background .15s;width:100%}
.etype-group-hdr:active{background:var(--border-soft)}
.etype-group.open .etype-group-hdr{background:#fff;border-bottom:1px solid var(--border-soft)}
.etype-ico{width:34px;height:34px;border-radius:9px;background:#fff;
  display:flex;align-items:center;justify-content:center;font-size:16px;flex:0 0 auto;
  border:1px solid var(--border-soft);overflow:hidden}
.etype-ico img{width:100%;height:100%;object-fit:cover}
.etype-info{flex:1;min-width:0}
.etype-name{font-size:13px;font-weight:800;color:var(--text);display:block}
.etype-meta{font-size:10.5px;color:var(--muted);margin-top:2px;display:block}
.etype-group-body{max-height:0;overflow:hidden;transition:max-height .3s cubic-bezier(.4,0,.2,1)}
.etype-group.open .etype-group-body{max-height:4000px}
.etype-sub{padding:10px 13px 4px;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted-2);font-weight:800}
.etype-list{padding:0 8px 8px}
.etype-option{display:block;width:100%;padding:10px 12px;border-radius:9px;
  font-size:12.5px;font-weight:700;color:var(--text);border:1px solid transparent;
  margin-bottom:2px;transition:all .12s}
.etype-option:active{background:var(--surface)}
.etype-option.on{background:var(--black);color:#fff;border-color:var(--black)}
.etype-option .desc{display:block;font-size:10.5px;font-weight:600;color:var(--muted);
  margin-top:3px;line-height:1.4}
.etype-option.on .desc{color:rgba(255,255,255,.7)}

/* Event type hero */
.eventtype-hero{padding:14px;border-radius:12px;background:linear-gradient(135deg,#151515,#2c2418);
  color:#fff;margin-bottom:12px}
.eventtype-hero .icon{font-size:28px;margin-bottom:6px;opacity:.9}
.eventtype-hero h3{margin:0 0 4px;font-size:16px;font-weight:900;letter-spacing:-.01em}
.eventtype-hero .cat{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:rgba(255,255,255,.5);font-weight:800;margin-bottom:8px}
.eventtype-hero .desc{font-size:12px;color:rgba(255,255,255,.82);line-height:1.5}
.eventtype-hero .actions{margin-top:12px;display:flex;gap:6px}

/* ---------- VENUE CARD ---------- */
.venue-card{border:1px solid var(--border-soft);border-radius:12px;margin-bottom:10px;
  overflow:hidden;background:#fff;transition:border-color .2s}
.venue-card.on{border-color:var(--text)}
.venue-card-hdr{width:100%;padding:12px;display:flex;gap:11px;align-items:center;background:#fff;
  transition:background .15s}
.venue-card-hdr:active{background:var(--surface)}
.venue-card-thumb{width:56px;height:56px;border-radius:10px;flex:0 0 auto;overflow:hidden;
  background:var(--surface);display:flex;align-items:center;justify-content:center;
  font-size:22px;border:1px solid var(--border-soft)}
.venue-card-thumb img{width:100%;height:100%;object-fit:cover}
.venue-card-info{flex:1;min-width:0}
.venue-card-name{font-size:13.5px;font-weight:800;color:var(--text);line-height:1.25}
.venue-card-meta{font-size:10.5px;color:var(--muted);margin-top:3px;line-height:1.4}
.venue-card-price{font-size:11.5px;font-weight:900;color:var(--gold);margin-top:4px}
.venue-card-check{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border);
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;
  color:transparent;font-size:13px;font-weight:900;transition:all .18s}
.venue-card.on .venue-card-check{background:var(--black);border-color:var(--black);color:#fff}
.venue-card-body{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.venue-card.on .venue-card-body{max-height:6000px}
.venue-body-in{padding:4px 12px 14px;border-top:1px solid var(--border-soft)}

.subacc{border:1px solid var(--border-soft);border-radius:10px;margin-bottom:8px;overflow:hidden;
  transition:border-color .2s}
.subacc.open{border-color:var(--text)}
.subacc-hdr{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface);
  cursor:pointer;transition:background .15s;width:100%}
.subacc-hdr:active{background:var(--border-soft)}
.subacc.open .subacc-hdr{background:#fff;border-bottom:1px solid var(--border-soft)}
.subacc-title{flex:1;font-size:12px;font-weight:800;color:var(--text);text-align:left}
.subacc-count{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.03em}
.subacc-body{max-height:0;overflow:hidden;transition:max-height .3s cubic-bezier(.4,0,.2,1)}
.subacc.open .subacc-body{max-height:3500px}
.subacc-in{padding:10px 12px 12px;font-size:12px;color:var(--text)}

/* Gallery */
.venue-gallery{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;padding-bottom:4px}
.venue-gallery::-webkit-scrollbar{display:none}
.venue-gallery .g-item{flex:0 0 auto;width:calc((100% - 12px)/3);aspect-ratio:1;
  border-radius:8px;overflow:hidden;scroll-snap-align:start;scroll-snap-stop:always;
  background:var(--surface);border:1px solid var(--border-soft);
  display:flex;align-items:center;justify-content:center;font-size:22px;
  color:var(--muted-2);cursor:pointer;position:relative;padding:0}
.venue-gallery .g-item img{width:100%;height:100%;object-fit:cover}
.g-detail{margin-top:8px;padding:10px;background:var(--surface);border-radius:9px;
  border:1px solid var(--border-soft);font-size:12px;line-height:1.5}
.g-detail h5{margin:0 0 5px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted-2);font-weight:800}
.g-detail .row{display:flex;justify-content:space-between;padding:3px 0;font-size:11.5px}
.g-detail .row .k{color:var(--muted);font-weight:700}
.g-detail .row .v{color:var(--text);font-weight:800}

/* Space tick */
.tick-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tick{display:flex;align-items:center;gap:8px;padding:10px;border:1px solid var(--border-soft);
  border-radius:9px;background:var(--surface);cursor:pointer;transition:all .15s;text-align:left}
.tick:active{background:var(--border-soft)}
.tick.on{background:var(--black);color:#fff;border-color:var(--black)}
.tick input{display:none}
.tick .bx{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--border);background:#fff;
  flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:transparent;
  font-size:11px;font-weight:900;transition:all .15s}
.tick.on .bx{background:var(--gold);border-color:var(--gold);color:#fff}
.tick .tx{font-size:11.5px;font-weight:700;line-height:1.25;min-width:0}
.tick .tx em{font-style:normal;display:block;font-size:9.5px;font-weight:600;
  opacity:.75;margin-top:2px}

/* ---------- NOTES / SCHEDULE / AUDIENCE ---------- */
.note-item{border:1px solid var(--border-soft);border-radius:11px;padding:10px 12px;
  margin-bottom:8px;background:var(--surface)}
.note-item h5{margin:0 0 5px;font-size:12px;font-weight:800;color:var(--text);
  display:flex;align-items:center;gap:8px}
.note-item h5 .rm{margin-left:auto;color:var(--danger);font-size:16px;font-weight:900;
  width:22px;height:22px;display:flex;align-items:center;justify-content:center;
  border-radius:50%;background:#fff;border:1px solid var(--border-soft)}
.note-item h5 .rm:active{background:#fbeaea}
.note-item p{margin:0;font-size:12px;color:var(--muted);line-height:1.5;white-space:pre-wrap}
.note-item .meta{font-size:10.5px;color:var(--muted-2);margin-top:4px;font-weight:700;
  letter-spacing:.04em;text-transform:uppercase}

.schedule-day{border:1px solid var(--border-soft);border-radius:11px;margin-bottom:9px;
  overflow:hidden;background:var(--surface)}
.schedule-day-hdr{display:flex;align-items:center;gap:10px;padding:9px 11px;background:#fff;
  border-bottom:1px solid var(--border-soft)}
.schedule-day-hdr .day-num{width:22px;height:22px;border-radius:50%;background:var(--black);
  color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;
  font-weight:900;flex:0 0 auto}
.schedule-day-hdr .day-title{flex:1;font-size:12px;font-weight:800}
.schedule-day-hdr .day-remove{width:24px;height:24px;border-radius:50%;display:flex;
  align-items:center;justify-content:center;color:var(--danger);font-size:15px;font-weight:900}
.schedule-day-hdr .day-remove:active{background:#fbeaea}
.schedule-day-in{padding:11px}

.audience-card{border:1px solid var(--border-soft);border-radius:11px;padding:11px 12px;
  margin-bottom:8px;background:var(--surface)}
.audience-card h5{margin:0 0 5px;font-size:12px;font-weight:800;color:var(--text);
  display:flex;align-items:center;gap:8px}
.audience-card h5 .rm{margin-left:auto;color:var(--danger);font-size:16px;font-weight:900;
  width:22px;height:22px;display:flex;align-items:center;justify-content:center;
  border-radius:50%;background:#fff;border:1px solid var(--border-soft)}
.audience-card p{margin:0;font-size:11.5px;color:var(--muted);line-height:1.5}
.audience-card .age{font-size:10.5px;color:var(--gold);font-weight:800;margin-top:5px;
  letter-spacing:.04em}

/* ---------- SUPPLIER FIELD ---------- */
.sup-summary{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:10px;
  background:var(--surface);border-radius:11px;margin-bottom:10px;
  border:1px solid var(--border-soft)}
.sup-stat{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px}
.sup-stat .l{font-size:9px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted-2);font-weight:800}
.sup-stat b{font-size:14px;font-weight:900;color:var(--text)}
.sup-stat b.gold{color:var(--gold)}

.sup-group{border:1px solid var(--border-soft);border-radius:12px;margin-bottom:8px;
  overflow:hidden;background:#fff;transition:border-color .2s}
.sup-group.open{border-color:var(--text)}
.sup-group-hdr{display:flex;align-items:center;gap:11px;padding:11px 13px;
  background:var(--surface);cursor:pointer;transition:background .15s;width:100%}
.sup-group-hdr:active{background:var(--border-soft)}
.sup-group.open .sup-group-hdr{background:#fff;border-bottom:1px solid var(--border-soft)}
.sup-group-ico{width:32px;height:32px;border-radius:9px;background:#fff;
  display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto;
  border:1px solid var(--border-soft)}
.sup-group-info{flex:1;min-width:0}
.sup-group-name{font-size:12.5px;font-weight:800;color:var(--text);display:block}
.sup-group-meta{font-size:10.5px;color:var(--muted);margin-top:2px;display:block}
.sup-group-body{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.sup-group.open .sup-group-body{max-height:7000px}
.sup-field{border-bottom:1px solid var(--border-soft)}
.sup-field:last-child{border-bottom:0}
.sup-field-hdr{display:flex;align-items:center;gap:9px;padding:11px 13px;cursor:pointer;
  transition:background .15s;width:100%}
.sup-field-hdr:active{background:var(--surface)}
.sup-field-info{flex:1;min-width:0;text-align:left}
.sup-field-name{font-size:12px;font-weight:700;color:var(--text);display:block}
.sup-field-count{font-size:10px;color:var(--muted-2);font-weight:700;margin-top:1px;
  letter-spacing:.03em;display:block}
.sup-field-count.has{color:var(--success)}
.sup-field-body{max-height:0;overflow:hidden;transition:max-height .3s cubic-bezier(.4,0,.2,1)}
.sup-field.open .sup-field-body{max-height:2500px}
.sup-field-in{padding:0 13px 12px}

.sup-slot{display:flex;align-items:center;gap:10px;padding:10px 11px;background:var(--surface);
  border:1px solid var(--border-soft);border-radius:10px;margin-bottom:6px}
.sup-slot-info{flex:1;min-width:0}
.sup-slot-name{font-size:12px;font-weight:800;color:var(--text)}
.sup-slot-meta{font-size:10.5px;color:var(--muted);margin-top:2px}
.sup-slot-price{font-size:12px;font-weight:900;color:var(--gold);margin-top:3px}
.sup-slot-acts{display:flex;gap:4px;flex:0 0 auto}
.sup-slot-btn{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;
  justify-content:center;background:#fff;border:1px solid var(--border-soft);
  font-size:14px;color:var(--muted)}
.sup-slot-btn:active{background:var(--border-soft)}
.sup-slot-btn.danger{color:var(--danger)}
.sup-add-btn{width:100%;padding:10px;border-radius:10px;background:transparent;
  border:1.5px dashed var(--border);color:var(--muted);font-size:11.5px;font-weight:800;
  display:flex;align-items:center;justify-content:center;gap:6px;transition:all .15s}
.sup-add-btn:active{background:var(--surface);border-color:var(--muted)}

.sup-custom{background:var(--surface);border:1px solid var(--border-soft);border-radius:10px;
  padding:11px 12px;margin:-4px 0 8px;animation:fadeIn .18s ease}
.sup-custom h5{margin:0 0 9px;font-size:10px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted-2);font-weight:800}
.sup-custom .field{margin-bottom:8px}
.sup-custom .field label{font-size:9.5px;margin-bottom:4px}
.sup-custom input,.sup-custom select{min-height:38px;font-size:12.5px;padding:8px 11px}

/* ---------- MENU ITEM ---------- */
.menu-item{display:flex;align-items:center;gap:11px;padding:10px;
  border:1px solid var(--border-soft);border-radius:11px;margin-bottom:7px;background:#fff}
.menu-item-thumb{width:44px;height:44px;border-radius:9px;overflow:hidden;flex:0 0 auto;
  background:var(--surface);display:flex;align-items:center;justify-content:center;
  font-size:18px;border:1px solid var(--border-soft)}
.menu-item-thumb img{width:100%;height:100%;object-fit:cover}
.menu-item-info{flex:1;min-width:0}
.menu-item-name{font-size:12.5px;font-weight:800;color:var(--text);line-height:1.25}
.menu-item-price{font-size:11px;color:var(--muted);margin-top:3px;font-weight:700}
.menu-item-price b{color:var(--gold);font-weight:900}
.menu-item-qty{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.qty-btn{width:28px;height:28px;border-radius:8px;border:1px solid var(--border-soft);
  background:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;
  font-weight:900;color:var(--text)}
.qty-btn:active{background:var(--surface)}
.qty-val{min-width:24px;text-align:center;font-size:12.5px;font-weight:900}

/* ---------- TICKET TIERS ---------- */
.tier{border:1px solid var(--border-soft);border-radius:11px;padding:10px 12px;
  margin-bottom:8px;background:var(--surface)}
.tier h5{margin:0 0 6px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:8px}
.tier h5 .rm{margin-left:auto;color:var(--danger);font-size:16px;font-weight:900;
  width:22px;height:22px;display:flex;align-items:center;justify-content:center;
  border-radius:50%;background:#fff;border:1px solid var(--border-soft)}
.tier .price{font-size:13px;font-weight:900;color:var(--gold);margin-bottom:4px}
.tier .notes{font-size:11.5px;color:var(--muted);line-height:1.5}

/* ---------- CALCULATOR BAR ---------- */
#calc-bar{flex:0 0 auto;background:#fff;border-top:1px solid var(--border);
  position:relative;z-index:38;padding-bottom:env(safe-area-inset-bottom)}
.calc-strip{display:flex;align-items:center;gap:12px;padding:11px 14px;min-height:64px}
.calc-strip-btn{flex:1;display:flex;flex-direction:column;align-items:flex-start;
  padding:4px 0;text-align:left}
.calc-strip-lbl{font-size:9px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted-2)}
.calc-strip-total{font-size:17px;font-weight:900;color:var(--text);margin-top:1px}
.calc-strip-items{font-size:10.5px;color:var(--muted);font-weight:700;margin-top:2px}
.calc-actions{display:flex;gap:6px;flex:0 0 auto}
.calc-actions .btn{min-height:40px;padding:0 14px;font-size:12px}
.calc-expand{border-top:1px solid var(--border-soft);padding:12px 14px 14px;display:none;
  background:var(--surface);max-height:60vh;overflow-y:auto}
.calc-expand.open{display:block;animation:fadeIn .18s ease}
.calc-expand h4{margin:0 0 9px;font-size:10px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted-2);font-weight:800}
.calc-line{display:flex;justify-content:space-between;gap:10px;padding:7px 0;
  border-bottom:1px solid var(--border-soft);font-size:12px}
.calc-line:last-child{border-bottom:0}
.calc-line .lbl{color:var(--muted);font-weight:700}
.calc-line .val{color:var(--text);font-weight:800}
.calc-line.sub .lbl{padding-left:10px;font-weight:600}
.calc-line.sub .val{font-weight:700}
.calc-line.total{border-top:1px solid var(--border);padding-top:9px;margin-top:5px;font-size:13px}
.calc-line.total .lbl{color:var(--text);font-weight:900;letter-spacing:.02em}
.calc-line.total .val{color:var(--text);font-weight:900;font-size:15px}
.calc-empty{padding:16px 4px;text-align:center;color:var(--muted-2);font-size:12px}

/* ---------- BOTTOM NAV ---------- */
#nav{flex:0 0 auto;position:relative;display:flex;background:#0a0a0a;
  border-top:1px solid #1a1a1a;padding-bottom:env(safe-area-inset-bottom);z-index:50}
.nav-btn{flex:1;padding:16px 2px 15px;display:flex;align-items:center;justify-content:center;
  color:rgba(255,255,255,.42);transition:color .18s}
.nav-btn svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round;transition:transform .18s}
.nav-btn.on{color:#fff}
.nav-btn.on svg{transform:translateY(-1px);filter:drop-shadow(0 0 8px rgba(255,255,255,.35))}
.nav-btn:active{color:rgba(255,255,255,.75)}

/* ---------- MODALS / FLOATING ---------- */
.fpop-scrim{position:fixed;inset:0;background:rgba(20,18,12,.5);z-index:55;
  display:flex;align-items:flex-end;justify-content:center;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fadeIn .18s ease}
@media(min-width:520px){.fpop-scrim{align-items:center;padding:20px}}
.fpop{background:#fff;width:100%;max-width:460px;max-height:86vh;border-radius:20px 20px 0 0;
  display:flex;flex-direction:column;overflow:hidden;animation:slideUp .22s cubic-bezier(.4,0,.2,1)}
@media(min-width:520px){.fpop{border-radius:20px}}
.fpop-hdr{padding:14px 18px;border-bottom:1px solid var(--border-soft);
  display:flex;align-items:center;gap:10px;flex:0 0 auto}
.fpop-hdr h3{margin:0;font-size:14px;font-weight:900;flex:1}
.fpop-close{width:30px;height:30px;border-radius:50%;background:var(--surface);
  display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;
  color:var(--muted)}
.fpop-search{padding:10px 14px;flex:0 0 auto;border-bottom:1px solid var(--border-soft)}
.fpop-search input{width:100%;min-height:42px;padding:10px 13px;background:var(--surface);
  border:1px solid var(--border-soft);border-radius:11px;font-size:13px;outline:none}
.fpop-body{flex:1 1 auto;overflow-y:auto;padding:8px 0}
.fpop-opt{width:100%;padding:11px 16px;display:flex;align-items:center;gap:11px;
  border-bottom:1px solid var(--border-soft);transition:background .12s}
.fpop-opt:active{background:var(--surface)}
.fpop-opt:last-child{border-bottom:0}
.fpop-opt-ico{width:38px;height:38px;border-radius:10px;flex:0 0 auto;background:var(--surface);
  border:1px solid var(--border-soft);display:flex;align-items:center;justify-content:center;
  font-size:16px;overflow:hidden}
.fpop-opt-ico img{width:100%;height:100%;object-fit:cover}
.fpop-opt-info{flex:1;min-width:0}
.fpop-opt-name{font-size:12.5px;font-weight:800;color:var(--text)}
.fpop-opt-meta{font-size:10.5px;color:var(--muted);margin-top:2px}
.fpop-opt-price{font-size:11px;font-weight:900;color:var(--gold);margin-top:3px}
.fpop-opt-add{flex:0 0 auto;font-size:10.5px;font-weight:900;padding:6px 11px;
  border-radius:20px;background:var(--black);color:#fff;letter-spacing:.04em}
.fpop-empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:12.5px}

/* Supplier type menu (floating) */
.stm-cat{border-bottom:1px solid var(--border-soft)}
.stm-cat-hdr{display:flex;align-items:center;gap:11px;padding:12px 16px;background:var(--surface);
  cursor:pointer;transition:background .15s;width:100%}
.stm-cat-hdr:active{background:var(--border-soft)}
.stm-cat.open .stm-cat-hdr{background:#fff;border-bottom:1px solid var(--border-soft)}
.stm-cat-ico{width:36px;height:36px;border-radius:10px;background:#fff;
  display:flex;align-items:center;justify-content:center;font-size:17px;flex:0 0 auto;
  border:1px solid var(--border-soft)}
.stm-cat-info{flex:1;min-width:0}
.stm-cat-name{font-size:13px;font-weight:800;color:var(--text);display:block}
.stm-cat-meta{font-size:10.5px;color:var(--muted);margin-top:2px;display:block}
.stm-cat-body{max-height:0;overflow:hidden;transition:max-height .3s cubic-bezier(.4,0,.2,1)}
.stm-cat.open .stm-cat-body{max-height:4000px}
.stm-sub{padding:8px 16px;background:#f7f5f0;font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted-2);font-weight:800;border-top:1px solid var(--border-soft)}
.stm-sup-list{padding:0 16px 12px}
.stm-sup{display:flex;align-items:center;gap:10px;padding:10px;background:#fff;
  border:1px solid var(--border-soft);border-radius:10px;margin-bottom:6px}
.stm-sup-info{flex:1;min-width:0}
.stm-sup-name{font-size:12.5px;font-weight:800;color:var(--text)}
.stm-sup-meta{font-size:10.5px;color:var(--muted);margin-top:2px}
.stm-sup-price{font-size:11px;color:var(--gold);font-weight:900;margin-top:3px}
.stm-add{background:var(--black);color:#fff;font-size:10px;font-weight:900;
  padding:6px 11px;border-radius:20px;letter-spacing:.04em;flex:0 0 auto}
.stm-add.on{background:var(--muted-2)}
.stm-sup-ico{width:36px;height:36px;border-radius:10px;background:var(--surface);
  display:flex;align-items:center;justify-content:center;font-size:17px;flex:0 0 auto;
  border:1px solid var(--border-soft)}
.stm-empty{padding:10px 16px;color:var(--muted);font-size:11.5px;font-style:italic}
.fpop-note{padding:12px 16px;font-size:10.5px;color:var(--muted);border-top:1px solid var(--border-soft)}

/* Supplier customise panel */
.sup-custom-meta{font-size:11px;color:var(--gold);font-weight:800;margin-bottom:8px}
.sup-custom-note{font-size:10px;color:var(--muted);text-align:center;margin-top:8px}
.qty-stepper{display:flex;align-items:center;gap:0;border:1px solid var(--border-soft);
  border-radius:10px;overflow:hidden;background:#fff;width:100%}
.qty-stepper button{flex:0 0 42px;height:42px;background:var(--surface);border:0;
  font-size:18px;font-weight:800;color:var(--text);cursor:pointer}
.qty-stepper button:active{background:var(--border-soft)}
.qty-stepper input{flex:1;min-width:0;border:0;text-align:center;font-size:14px;font-weight:800;
  color:var(--text);background:#fff;padding:0 6px;min-height:42px;-moz-appearance:textfield}
.qty-stepper input::-webkit-outer-spin-button,.qty-stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.qty-stepper.sm button{flex-basis:36px;height:36px;font-size:16px}
.qty-stepper.sm input{min-height:36px;font-size:13px}
.sup-addons-wrap{margin:10px 0;border-top:1px solid var(--border-soft);padding-top:10px}
.sup-addons-label{font-size:11px;font-weight:900;display:block;margin-bottom:7px}
.sup-addon{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed var(--border-soft)}
.sup-addon:last-child{border-bottom:0}
.sup-addon-info{flex:1;min-width:0}
.sup-addon-name{font-size:11.5px;font-weight:700;color:var(--text)}
.sup-addon-price{font-size:10.5px;color:var(--gold);font-weight:900;margin-top:2px}

/* Flyer add menu */
.flyer-menu-panel{background:#fff;width:100%;max-width:460px;max-height:88vh;
  border-radius:20px 20px 0 0;display:flex;flex-direction:column;overflow:hidden;
  animation:slideUp .22s cubic-bezier(.4,0,.2,1)}
@media(min-width:520px){.flyer-menu-panel{border-radius:20px}}
.flyer-menu-hdr{padding:16px 18px 12px;border-bottom:1px solid var(--border-soft);
  display:flex;align-items:center;gap:10px}
.flyer-menu-hdr h3{margin:0;font-size:15px;font-weight:900;flex:1}
.flyer-menu-hint{padding:10px 18px;font-size:11.5px;color:var(--muted);font-weight:600;
  background:var(--surface);border-bottom:1px solid var(--border-soft);line-height:1.5}
.flyer-menu-stack{flex:1 1 auto;overflow-y:auto;padding:14px 18px}
.flyer-item{position:relative;border-radius:12px;overflow:hidden;margin-bottom:10px;
  background:var(--surface);border:1.5px solid var(--border-soft)}
.flyer-item.main{border-color:var(--gold);border-width:2px}
.flyer-item img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.flyer-item-actions{position:absolute;top:8px;right:8px;display:flex;gap:6px}
.flyer-item-btn{width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.72);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;
  backdrop-filter:blur(6px)}
.flyer-item-btn:active{background:rgba(0,0,0,.9)}
.flyer-item-btn.make-main{background:rgba(201,168,76,.9);font-size:10.5px;font-weight:900;
  width:auto;padding:0 10px;border-radius:20px;height:28px;letter-spacing:.04em}
.flyer-item-main-label{position:absolute;left:8px;top:8px;background:var(--gold);color:#fff;
  font-size:9.5px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;
  padding:4px 9px;border-radius:20px}
.flyer-menu-foot{padding:14px 18px;border-top:1px solid var(--border-soft);background:#fafaf7;
  display:flex;flex-direction:column;gap:9px;padding-bottom:calc(14px + env(safe-area-inset-bottom))}

/* Title edit modal */
.title-edit-panel{background:#fff;width:100%;max-width:460px;max-height:88vh;
  border-radius:20px 20px 0 0;display:flex;flex-direction:column;overflow:hidden;
  animation:slideUp .22s cubic-bezier(.4,0,.2,1)}
@media(min-width:520px){.title-edit-panel{border-radius:20px}}
.title-edit-body{padding:16px 18px;flex:1 1 auto;overflow-y:auto}
.title-edit-body .field{margin-bottom:14px}
.title-edit-foot{padding:14px 18px;border-top:1px solid var(--border-soft);background:#fafaf7;
  display:flex;gap:10px;padding-bottom:calc(14px + env(safe-area-inset-bottom))}

/* Simple add item prompt panel */
.prompt-panel{background:#fff;width:100%;max-width:460px;border-radius:20px 20px 0 0;
  overflow:hidden;animation:slideUp .22s cubic-bezier(.4,0,.2,1)}
@media(min-width:520px){.prompt-panel{border-radius:20px}}
.prompt-body{padding:16px 18px}
.prompt-body .field{margin-bottom:12px}
.prompt-foot{padding:12px 18px 16px;display:flex;gap:10px;
  padding-bottom:calc(12px + env(safe-area-inset-bottom))}

/* ---------- REVIEW / PREVIEW ---------- */
.review-hero{margin-bottom:14px;padding:18px 16px;border-radius:14px;
  background:linear-gradient(135deg,#151515,#2c2418);color:#fff;position:relative;
  overflow:hidden}
.review-hero .lbl{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  color:rgba(255,255,255,.5);font-weight:800}
.review-hero h2{margin:6px 0 4px;font-size:19px;font-weight:900;letter-spacing:-.01em;
  line-height:1.15}
.review-hero .meta{font-size:11.5px;color:rgba(255,255,255,.72);font-weight:600}
.review-block{background:#fff;border:1px solid var(--border-soft);border-radius:12px;
  padding:13px 14px;margin-bottom:10px}
.review-block h4{margin:0 0 8px;font-size:10px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted-2);font-weight:800}
.review-row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:12px;
  border-bottom:1px solid var(--border-soft)}
.review-row:last-child{border-bottom:0}
.review-row .k{color:var(--muted);font-weight:700;min-width:0}
.review-row .v{color:var(--text);font-weight:800;text-align:right;max-width:62%}
.review-list{margin:0;padding:0 0 0 16px;font-size:12px;color:var(--text);line-height:1.6}
.review-list li{margin-bottom:3px}

.warning{
  display:flex;gap:10px;padding:10px 12px;border-radius:10px;margin-bottom:8px;
  font-size:12px;line-height:1.5;
}
.warning.capacity{background:#fdf3dc;border:1px solid #f0dcae;color:#7a5a0a}
.warning.budget{background:#fbeaea;border:1px solid #f0c8c8;color:#8a2a2a}
.warning.dietary{background:#eaf4ea;border:1px solid #c8e0c8;color:#1c5a1c}
.warning .ic{
  width:22px;height:22px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:13px;font-weight:900;flex:0 0 auto;
  background:rgba(0,0,0,.08)
}
.warning b{font-weight:900}

.privacy-row .lbl{flex:1;font-weight:700;color:var(--text)}

  font-weight:600;margin-top:2px}

/* ---------- PREVIEW (read-only page) ---------- */
.preview-page{background:var(--bg);min-height:100%}
.preview-hero{position:relative;aspect-ratio:16/9;overflow:hidden;background:#151515}
.preview-hero img{width:100%;height:100%;object-fit:cover;display:block}
.preview-hero-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.85),rgba(0,0,0,.05) 55%);
  display:flex;flex-direction:column;justify-content:flex-end;padding:16px;color:#fff}
.preview-hero-overlay .cat{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--gold);font-weight:800;margin-bottom:5px}
.preview-hero-overlay h1{margin:0;font-size:21px;font-weight:900;letter-spacing:-.015em;
  line-height:1.15}
.preview-hero-overlay .sub{font-size:11.5px;color:rgba(255,255,255,.75);margin-top:5px;
  font-weight:600}
.preview-body{padding:14px}
.preview-card{background:#fff;border:1px solid var(--border-soft);border-radius:14px;
  padding:14px;margin-bottom:12px}
.preview-card h3{margin:0 0 10px;font-size:11px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted-2);font-weight:800}
.preview-kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;
  border-bottom:1px solid var(--border-soft);font-size:12.5px}
.preview-kv:last-child{border-bottom:0}
.preview-kv .k{color:var(--muted);font-weight:700}
.preview-kv .v{color:var(--text);font-weight:800;text-align:right;max-width:62%}
.preview-tags{display:flex;flex-wrap:wrap;gap:6px}
.preview-tag{font-size:11px;font-weight:700;padding:5px 11px;border-radius:20px;
  background:var(--surface);border:1px solid var(--border-soft);color:var(--muted)}
.preview-tag.gold{background:rgba(201,168,76,.12);border-color:rgba(201,168,76,.3);
  color:#7a5a0a;font-weight:800}
.preview-social{display:flex;flex-wrap:wrap;gap:8px}
.preview-social-item{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;
  border-radius:20px;background:var(--surface);border:1px solid var(--border-soft);
  font-size:11.5px;font-weight:700;color:var(--text);text-decoration:none}
.preview-social-item:active{background:var(--border-soft)}

/* ---------- TOAST ---------- */
#toast{position:fixed;bottom:calc(var(--calch) + var(--navh) + 20px);left:50%;
  transform:translateX(-50%);background:var(--black);color:#fff;padding:11px 18px;
  border-radius:11px;font-size:12.5px;font-weight:800;z-index:200;opacity:0;
  pointer-events:none;transition:opacity .2s;max-width:calc(100% - 40px);text-align:center}
#toast.on{opacity:1}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.empty{padding:32px 20px;text-align:center;color:var(--muted-2);font-size:12.5px;line-height:1.6}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;transition-duration:.001ms !important}
}

function normalizeDemoSupplier(s){
  if(!s) return s;
  const pricing=s.pricing||{};
  const area=Array.isArray(s.serviceArea)?s.serviceArea:(Array.isArray(s.service_area)?s.service_area:(Array.isArray(s.serviceAreaList)?s.serviceAreaList:[]));
  const isActual=!(Array.isArray(area)&&area.length===0) || (s.price===undefined && !s.name);
  let price=Number(pricing.amount!==undefined?pricing.amount:(s.price!==undefined?s.price:0))||0;
  return {
    id: s.id,
    name: s.name||s.supplier_name||"Unnamed supplier",
    businessName: s.businessName||s.business_name||"",
    catName: s.catName||s.category||"",
    catId: s.catId||s.category_id||"",
    subcategory: s.subcategory||"",
    service: s.service||s.service_listing||"",
    description: s.description||"",
    price: price,
    displayPrice: s.displayPrice||pricing.display_price||"",
    model: s.model||pricing.model||"",
    unit: s.unit||"per event",
    included: s.included||s.included_in_base_price||"",
    addons: Array.isArray(s.addons)?s.addons:(Array.isArray(s.example_add_ons)?s.example_add_ons:[]),
    availability: s.availability||"",
    serviceArea: area.length?area:["Nationwide"],

    notes: s.notes||s.supplier_notes||""
  };
}

function parseAddonPrice(str){
  const m=String(str||"").match(/P\s?([\d,]+(?:\.\d+)?)/);

const UNIT_KEY_LABELS={
  "per person":"Guests","per hour":"Hours","per day":"Days","per night":"Nights",
  "per shift":"Shifts","per set":"Sets","per event":"Units","per item":"Items",
  "per trip":"Trips","per session":"Sessions","per installation":"Units",
  "per square metre":"Sq metres","per cake":"Qty","fixed":"Qty"
};
function supplierUnitQty(unit,c){
  if(c.qty!==undefined && Number(c.qty)>0) return Number(c.qty);
  if(unit==="per person") return totalGuests()||1;
  if(unit==="per day"||unit==="per night") return STATE.schedule.days.length||1;
  return 1;
}

function getAllEventTypes(){

          categoryId:cat.id,categoryName:cat.name,icon:cat.icon,

}

/* ============================================================
   PRICING
   ============================================================ */
function fmt(n){
  const v=Number(n)||0;
  return "P"+v.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,",");
}
function venueSpacesCost(){
  if(!STATE.venue) return 0;
  return STATE.venueSpaces.reduce(function(sum,sid){
    const sp=(STATE.venue.spaces||[]).find(function(s){return s.id===sid;});
    return sum + (sp && sp.price ? Number(sp.price) : 0);
  },0);
}
function venueDurationCost(){
  if(!STATE.venue) return 0;
  const base=Number(STATE.venue.fromPrice)||0;
  const hourly=(STATE.venue.pricing && STATE.venue.pricing.hourly)||0;
  return STATE.schedule.days.reduce(function(sum,d){
    let hours=0;
    if(d.startTime && d.endTime && d.startDate && d.endDate){
      // simple estimate: use time difference on start date
      const s=d.startTime.split(":").map(Number);
      const e=d.endTime.split(":").map(Number);
      let h=(e[0]*60+e[1])-(s[0]*60+s[1]);
      if(h<0) h+=24*60;
      hours=h/60;
    } else if(d.startDate && d.endDate){
      // multi-day range: use days * 8h
      const sd=new Date(d.startDate), ed=new Date(d.endDate);
      if(!isNaN(sd) && !isNaN(ed)){
        const days=Math.max(1, Math.round((ed-sd)/86400000)+1);
        hours=days*8;
      }
    }
    return sum + base + (hourly*hours);
  },0);
}
function venueCost(){ return venueDurationCost() + venueSpacesCost(); }
function menuFoodCost(){
  return STATE.menuFood.reduce(function(s,x){
    return s + (Number(x.price)||0)*(Number(x.qty)||0);
  },0);
}
function menuBeveragesCost(){
  return STATE.menuBeverages.reduce(function(s,x){
    return s + (Number(x.price)||0)*(Number(x.qty)||0);
  },0);
}
function menuCost(){ return menuFoodCost()+menuBeveragesCost(); }
function supplierLineCost(entry){
  const sup=findSupplier(entry.supplierId);
  if(!sup) return 0;
  const c=entry.customisations||{};
  let cost=(Number(sup.price)||0)*supplierUnitQty(sup.unit,c);
  (sup.addons||[]).forEach(function(add,i){
    const pm=parseAddonPrice(add);
    const n=Number(c["addon_"+i])||0;
    if(pm&&n>0) cost+=pm.price*n;
  });
  return cost;
}
function supplierCost(){
  let total=0;
  Object.keys(STATE.suppliers).forEach(function(fieldId){
    (STATE.suppliers[fieldId]||[]).forEach(function(entry){
      total+=supplierLineCost(entry);
    });
  });
  return total;
}
function customSummary(entry,sup){
  const c=entry.customisations||{};
  const bits=[];
  if(sup) bits.push(supplierUnitQty(sup.unit,c)+" "+sup.unit);
  (sup?sup.addons:[]).forEach(function(a,i){
    const n=Number(c["addon_"+i])||0;
    if(n>0) bits.push(String(a).replace(/\([^)]*\)\s*$/,"").trim()+" × "+n);
  });
  if(c.notes) bits.push(c.notes);
  return bits.join(" · ");
}
function totalGuests(){
  let n=0;
  STATE.guests.forEach(function(g){ n += 1 + (Number(g.plus)||0); });
  return n;
}
function grandTotal(){ return venueCost()+menuCost()+supplierCost(); }
function calculatorItemCount(){
  let n=0;
  if(STATE.venue) n++;
  n+=STATE.menuFood.length+STATE.menuBeverages.length;
  Object.keys(STATE.suppliers).forEach(function(k){ n+=(STATE.suppliers[k]||[]).length; });
  n+=STATE.guests.length;
  n+=STATE.notes.length;
  n+=STATE.targetAudience.length;
  return n;
}

function section(id,num,title,sub,count,body,opts){

function renderSupplierSlot(entry,fieldId,idx){
  const s=findSupplier(entry.supplierId);
  if(!s) return "";
  const c=entry.customisations||{};
  const customising=STATE.supplierCustomising && STATE.supplierCustomising.supplierId===entry.supplierId && STATE.supplierCustomising.fieldId===fieldId;
  const metaParts=[];
  if(s.city) metaParts.push(esc(s.city));
  if(s.unit) metaParts.push(esc(s.unit));
  if(s.rating) metaParts.push("★ "+esc(s.rating));
  let h='<div class="sup-slot">'+
    '<div class="sup-slot-info">'+

/* ============================================================
   SECTION 11 — REVIEW (with warnings)
   ============================================================ */
function getWarnings(){
  const w=[];
  if(STATE.venue){
    // Capacity
    const g=totalGuests();
    if(STATE.venue.capacity && g>STATE.venue.capacity){
      w.push({type:"capacity",title:"Capacity exceeded",
        msg:"Guest count ("+g+") exceeds venue capacity ("+STATE.venue.capacity+"). Consider a larger venue or trimming the list."});
    }
    // Dietary
    const hasDietary=STATE.guests.some(function(g){return g.dietary && g.dietary.trim();});
    if(hasDietary){
      const hasDietaryMenu=(STATE.venue.menu||[]).some(function(m){
        if(!m.dietary) return false;
        const selected=STATE.menuFood.some(function(f){return f.itemId===m.id;})||
                       STATE.menuBeverages.some(function(b){return b.itemId===m.id;});
        return selected;
      });
      const hasDietarySupplier=(STATE.suppliers["speciality_diets"]||[]).length>0;
      if(!hasDietaryMenu && !hasDietarySupplier){
        w.push({type:"dietary",title:"Dietary requirements not covered",
          msg:"Some guests have dietary requirements but no matching menu items or dietary supplier are selected."});
      }
    }
    // Budget
    const b=STATE.eventDetails.budget;
    if(b && Number(b)>0 && grandTotal()>Number(b)){
      w.push({type:"budget",title:"Budget exceeded",
        msg:"Estimated total "+fmt(grandTotal())+" exceeds the budget of "+fmt(b)+"."});
    }
  }
  return w;
}

  const showGuests=STATE.showGuests===true;
  const showSuppliers=STATE.showSuppliers!==false;
  const showAddress=STATE.showAddress!==false;
  const showRsvp=STATE.showRsvp!==false;

  let body='<div class="field-hint" style="margin-bottom:12px">This is the read-only page guests will see. Toggle visibility in the Review section.</div>';
  body+='<div class="preview-page" style="margin:0 -16px -16px">';
  // Hero
  if(STATE.flyerImages.length){
    body+='<div class="preview-hero"><img src="'+esc(STATE.flyerImages[0])+'" alt="">'+
      '<div class="preview-hero-overlay">'+
        '<div class="cat">'+esc(et?et.name:"Event")+'</div>'+
        '<h1>'+esc(STATE.eventTitle||"Untitled Event")+'</h1>'+
        (STATE.eventDescription?'<div class="sub">'+esc(STATE.eventDescription)+'</div>':'')+
      '</div>'+
    '</div>';
  } else {
    body+='<div class="preview-hero" style="background:linear-gradient(135deg,#2c2418,#151515)">'+
      '<div class="preview-hero-overlay" style="background:transparent">'+
        '<div class="cat">'+esc(et?et.name:"Event")+'</div>'+
        '<h1>'+esc(STATE.eventTitle||"Untitled Event")+'</h1>'+
        (STATE.eventDescription?'<div class="sub">'+esc(STATE.eventDescription)+'</div>':'')+
      '</div>'+
    '</div>';
  }
  body+='<div class="preview-body">';

  // Venue
  body+='<div class="preview-card">'+
    '<h3>Venue</h3>'+
    '<div class="preview-kv"><span class="k">Name</span><span class="v">'+esc(v.name)+'</span></div>'+
    (showAddress?'<div class="preview-kv"><span class="k">Location</span><span class="v">'+esc(v.city||"")+(v.area?" · "+esc(v.area):"")+'</span></div>':'<div class="preview-kv"><span class="k">Location</span><span class="v">'+esc(v.city||"")+'</span></div>')+
    (STATE.venueSpaces.length?'<div class="preview-kv"><span class="k">Spaces</span><span class="v">'+STATE.venueSpaces.map(function(id){
      const s=(v.spaces||[]).find(function(x){return x.id===id;});
      return s?esc(s.name):id;
    }).join(", ")+'</span></div>':'')+
  '</div>';

  // Date & time
  if(STATE.schedule.days.length && (STATE.schedule.days[0].startDate || STATE.schedule.days[0].startTime)){
    body+='<div class="preview-card">'+
      '<h3>Date & Time</h3>'+
      STATE.schedule.days.map(function(d,i){
        const s=[d.startDate,d.startTime].filter(Boolean).join(" ");
        const e=[d.endDate,d.endTime].filter(Boolean).join(" ");
        return '<div class="preview-kv"><span class="k">'+(STATE.schedule.days.length>1?("Day "+(i+1)):"When")+'</span><span class="v">'+esc(s||"—")+(e?" → "+esc(e):"")+'</span></div>';
      }).join("")+
    '</div>';
  }

  // Dress code
  if(STATE.eventDetails.dresscode){
    body+='<div class="preview-card">'+
      '<h3>Dress Code</h3>'+
      '<div style="font-size:13px;line-height:1.55">'+esc(STATE.eventDetails.dresscode)+'</div>'+
    '</div>';
  }

  // Menu
  if(STATE.menuFood.length || STATE.menuBeverages.length){
    body+='<div class="preview-card">'+
      '<h3>Menu</h3>';
    if(STATE.menuFood.length){
      body+='<div style="font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-2);font-weight:800;margin:4px 0 6px">Food</div>';
      STATE.menuFood.forEach(function(m){
        body+='<div class="preview-kv"><span class="k">'+esc(m.name)+'</span><span class="v">'+esc(String(m.qty))+' selected</span></div>';
      });
    }
    if(STATE.menuBeverages.length){
      body+='<div style="font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-2);font-weight:800;margin:10px 0 6px">Beverages</div>';
      STATE.menuBeverages.forEach(function(m){
        body+='<div class="preview-kv"><span class="k">'+esc(m.name)+'</span><span class="v">'+esc(String(m.qty))+' selected</span></div>';
      });
    }
    body+='</div>';
  }

  // Suppliers
  if(showSuppliers){
    const supLines=[];
    Object.keys(STATE.suppliers).forEach(function(fid){
      (STATE.suppliers[fid]||[]).forEach(function(entry){
        const s=findSupplier(entry.supplierId);
        if(s) supLines.push({field:fid,sup:s,entry:entry});
      });
    });
    if(supLines.length){
      body+='<div class="preview-card">'+
        '<h3>Suppliers</h3>'+
        supLines.map(function(l){
          const customBits=Object.keys(l.entry.customisations||{}).filter(function(k){return l.entry.customisations[k];}).map(function(k){
            return k+": "+l.entry.customisations[k];
          }).join(" · ");
          return '<div class="preview-kv"><span class="k">'+esc(l.sup.name)+(customBits?'<br><em style="font-style:normal;font-size:10.5px;color:var(--muted)">'+esc(customBits)+'</em>':'')+'</span><span class="v">'+fmt(supplierLineCost(l.entry))+'</span></div>';
        }).join("")+
      '</div>';
    }
  }

  // Contact links
  if(STATE.eventDetails.contacts.length){
    body+='<div class="preview-card">'+
      '<h3>Contact</h3>'+
      '<div class="preview-social">'+
        STATE.eventDetails.contacts.map(function(c){
          const href=contactHref(c.type, c.value);
          return '<a class="preview-social-item" href="'+esc(href||"#")+'" target="_blank" rel="noopener">'+esc(c.type||"Link")+': '+esc(c.value||"")+'</a>';
        }).join("")+
      '</div>'+
    '</div>';
  }

  // Ticket links
  if(STATE.eventDetails.ticketLinks.length){
    body+='<div class="preview-card">'+
      '<h3>Tickets</h3>'+
      STATE.eventDetails.ticketLinks.map(function(t){
        return '<div class="preview-kv"><span class="k">'+esc(t.url||"")+'</span><span class="v">'+esc(t.notes||"")+'</span></div>';
      }).join("")+
    '</div>';
  }

  // RSVP
  if(showRsvp && STATE.rsvp.length){
    body+='<div class="preview-card">'+
      '<h3>RSVP</h3>'+
      STATE.rsvp.map(function(r){
        return '<div class="preview-kv"><span class="k">'+esc(r.title||"")+(r.note?'<br><em style="font-style:normal;font-size:10.5px;color:var(--muted)">'+esc(r.note)+'</em>':'')+'</span><span class="v">'+esc(r.contactType||"")+': '+esc(r.contactValue||"")+'</span></div>';
      }).join("")+
    '</div>';
  }

  // Guest list
  if(showGuests && STATE.guests.length){
    body+='<div class="preview-card">'+
      '<h3>Guest List · '+totalGuests()+'</h3>'+
      STATE.guests.map(function(g){
        return '<div class="preview-kv"><span class="k">'+esc(g.name||"Guest")+(g.role?" ("+esc(g.role)+")":"")+'</span><span class="v">'+(g.plus?"+"+g.plus+"":'')+'</span></div>';
      }).join("")+
    '</div>';
  }

  // Budget
  if(showBudget){
    body+='<div class="preview-card">'+
      '<h3>Estimated Budget</h3>'+
      '<div class="preview-kv"><span class="k">Total</span><span class="v" style="color:var(--gold);font-weight:900;font-size:15px">'+fmt(grandTotal())+'</span></div>'+
    '</div>';
  }

  // Share row
  const shareChannels=[];
  if(STATE.shareOptions.whatsapp) shareChannels.push("WhatsApp");
  if(STATE.shareOptions.facebook) shareChannels.push("Facebook");
  if(STATE.shareOptions.instagram) shareChannels.push("Instagram");
  if(STATE.shareOptions.tiktok) shareChannels.push("TikTok");
  if(STATE.shareOptions.twitter) shareChannels.push("Twitter / X");
  if(shareChannels.length){
    body+='<div class="preview-card">'+
      '<h3>Share this event</h3>'+
      '<div class="preview-tags">'+
        shareChannels.map(function(c){return '<span class="preview-tag gold">'+esc(c)+'</span>';}).join("")+
      '</div>'+
    '</div>';
  }

  // Actions
  body+='<div style="display:flex;flex-direction:column;gap:9px;margin-top:14px">'+
    '<button class="btn wa full" data-act="shareWhatsApp">Share on WhatsApp</button>'+
    '<button class="btn primary full" data-act="sendToVenue">Send to Venue Provider</button>'+
  '</div>';

  body+='</div></div>'; // close preview-body + preview-page

  return section("preview","12","Preview",
    "Read-only page your guests will see",
    null, body, {locked:false});
}
function contactHref(type,value){
  if(!value) return "#";
  const v=String(value).trim();
  if(/^(https?:|tel:|mailto:)/.test(v)) return v;
  const t=(type||"").toLowerCase();
  if(t==="call") return "tel:"+v.replace(/[^\d+]/g,"");
  if(t==="whatsapp") return "https://wa.me/"+v.replace(/[^\d]/g,"");
  if(t==="facebook") return "https://facebook.com/"+v.replace(/^@/,"");
  if(t==="instagram") return "https://instagram.com/"+v.replace(/^@/,"");
  if(t==="tiktok") return "https://tiktok.com/@"+v.replace(/^@/,"");
  if(t==="twitter"||t==="x") return "https://x.com/"+v.replace(/^@/,"");
  if(t==="youtube") return "https://youtube.com/@"+v.replace(/^@/,"");
  if(t==="linkedin") return "https://linkedin.com/in/"+v.replace(/^@/,"");
  if(/\./.test(v)) return "https://"+v;
  return "#";
}

/* ============================================================
   PROMPT MODAL (generic add/edit)
   ============================================================ */
function renderPrompt(){
  const p=STATE.prompt;
  if(!p.open) return "";
  let fields='';
  (p.fields||[]).forEach(function(f){
    const val=p.values && p.values[f.key]!==undefined?p.values[f.key]:"";
    if(f.type==="textarea"){
      fields+='<div class="field"><label>'+esc(f.label)+'</label>'+
        '<textarea data-prompt-field="'+esc(f.key)+'" placeholder="'+esc(f.placeholder||"")+'">'+esc(val)+'</textarea></div>';
    } else if(f.type==="select"){
      fields+='<div class="field"><label>'+esc(f.label)+'</label>'+
        '<select data-prompt-field="'+esc(f.key)+'">'+
          (f.options||[]).map(function(o){
            const vv=typeof o==="string"?o:o.value;
            const ll=typeof o==="string"?o:o.label;
            return '<option value="'+esc(vv)+'"'+(val===vv?" selected":"")+'>'+esc(ll)+'</option>';
          }).join("")+
        '</select></div>';
    } else {
      fields+='<div class="field"><label>'+esc(f.label)+'</label>'+
        '<input type="'+(f.type||"text")+'" data-prompt-field="'+esc(f.key)+'" value="'+esc(val)+'" placeholder="'+esc(f.placeholder||"")+'"></div>';
    }
  });
  return '<div class="fpop-scrim" data-act="closePrompt">'+
    '<div class="prompt-panel" data-stop="1">'+
      '<div class="fpop-hdr">'+
        '<h3>'+esc(p.title||"Add")+'</h3>'+
        '<button class="fpop-close" data-act="closePrompt" aria-label="Close">×</button>'+
      '</div>'+
      '<div class="prompt-body">'+fields+'</div>'+
      '<div class="prompt-foot">'+
        '<button class="btn ghost half" data-act="closePrompt">Cancel</button>'+
        '<button class="btn primary half" data-act="savePrompt">Save</button>'+
      '</div>'+
    '</div>'+
  '</div>';
}
function openPrompt(title,fields,onSave){
  STATE.prompt={open:true,title:title,fields:fields,values:{},onSave:onSave};
  render();
}
function savePromptFromForm(){
  const p=STATE.prompt;
  const out={};
  document.querySelectorAll("[data-prompt-field]").forEach(function(el){
    out[el.getAttribute("data-prompt-field")]=el.value;
  });
  p.open=false;
  if(p.onSave) p.onSave(out);
  render();
}

function renderCalcBar(){
  const el=document.getElementById("calc-bar");
  if(!el) return;
  const count=calculatorItemCount();
  const total=grandTotal();
  let h='<div class="calc-strip">'+
    '<button class="calc-strip-btn" data-act="toggleCalc">'+
      '<span class="calc-strip-lbl">'+(STATE.calcExpanded?"Hide breakdown":"Total")+'</span>'+
      '<span class="calc-strip-total">'+fmt(total)+'</span>'+
      '<span class="calc-strip-items">'+count+' item'+(count===1?"":"s")+' · tap for breakdown</span>'+
    '</button>'+
    '<div class="calc-actions">'+
      '<button class="btn ghost sm" data-act="saveDraftNow">Save</button>'+
      '<button class="btn primary sm" data-act="jumpStep" data-step="preview"'+(STATE.venue?"":" disabled")+'>Preview</button>'+
    '</div>'+
  '</div>';
  if(STATE.calcExpanded){
    h+='<div class="calc-expand open">';
    h+='<h4>Breakdown</h4>';
    if(!count){
      h+='<div class="calc-empty">Nothing added yet.</div>';
    } else {
      if(STATE.venue){
        h+='<div class="calc-line"><span class="lbl">'+esc(STATE.venue.name)+' · venue</span><span class="val">'+fmt(venueCost())+'</span></div>';
      }
      if(STATE.menuFood.length){
        h+='<div class="calc-line"><span class="lbl">Food items</span><span class="val">'+fmt(menuFoodCost())+'</span></div>';
        STATE.menuFood.forEach(function(m){
          h+='<div class="calc-line sub"><span class="lbl">'+esc(m.name)+' × '+m.qty+'</span><span class="val">'+fmt((Number(m.price)||0)*m.qty)+'</span></div>';
        });
      }
      if(STATE.menuBeverages.length){
        h+='<div class="calc-line"><span class="lbl">Beverages</span><span class="val">'+fmt(menuBeveragesCost())+'</span></div>';
        STATE.menuBeverages.forEach(function(m){
          h+='<div class="calc-line sub"><span class="lbl">'+esc(m.name)+' × '+m.qty+'</span><span class="val">'+fmt((Number(m.price)||0)*m.qty)+'</span></div>';
        });
      }
      Object.keys(STATE.suppliers).forEach(function(fid){
        (STATE.suppliers[fid]||[]).forEach(function(entry){
          const s=findSupplier(entry.supplierId);
          if(!s) return;
          h+='<div class="calc-line sub"><span class="lbl">'+esc(s.name)+'</span><span class="val">'+fmt(supplierLineCost(entry))+'</span></div>';
        });
      });
      h+='<div class="calc-line total"><span class="lbl">Total</span><span class="val">'+fmt(grandTotal())+'</span></div>';
    }
    h+='</div>';
  }
  el.innerHTML=h;
}
