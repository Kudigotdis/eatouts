<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>EatOuts — Event Planner</title>
<link rel="icon" type="image/png" href="assets/logo/EatOuts_Badge.png">
<style>
:root{
  --black:#1a1a1a;--bg:#faf8f2;
  --card:#fff;--surface:#faf8f2;--text:#1a1a1a;
  --muted:#a89a7e;--muted-2:#8a8170;--border:#ece7db;--border-soft:#f1ece1;
  --danger:#c43c3c;--success:#17834b;--radius:16px;
  --navh:0px;--calch:0px;
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  color:var(--text);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;text-align:left;padding:0}
img{display:block;max-width:100%}
::-webkit-scrollbar{width:0;height:0;display:none}
*{scrollbar-width:none;-ms-overflow-style:none}

#shell{position:fixed;inset:0;max-width:460px;margin:0 auto;display:flex;flex-direction:column;
  background:#fff;box-shadow:0 0 80px rgba(0,0,0,.08);overflow:hidden}
@media(min-width:520px){#shell{border-left:1px solid var(--border);border-right:1px solid var(--border)}}

/* ---------- HEADER ---------- */
#hdr{flex:0 0 auto;height:58px;display:flex;align-items:center;gap:10px;padding:0 14px;
  background:#fff;border-bottom:1px solid var(--border);position:relative;z-index:58;
  padding-top:env(safe-area-inset-top)}
.brand-mark{height:34px;width:auto;aspect-ratio:1172/504;flex:0 0 auto;display:flex;align-items:center;justify-content:flex-start;background:none;border:0;border-radius:0;box-shadow:none;overflow:hidden}
.brand-mark img{width:100%;height:100%;object-fit:contain;display:block}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.hdr-chip{font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted-2);border:1px solid var(--border);border-radius:20px;padding:4px 9px;
  background:var(--surface);transition:all .15s}

/* ---------- VENUE BAR ---------- */
#venue-bar{flex:0 0 auto;background:#fff;border-bottom:1px solid var(--border);
  position:relative;z-index:30}
.venue-bar-inner{display:flex;align-items:center;gap:10px;padding:9px 14px;
  min-height:54px;cursor:pointer;background:rgba(0,0,0,.03);transition:background .15s}
.venue-bar-inner:active{background:rgba(0,0,0,.06)}
.venue-thumb{width:90px;height:90px;border-radius:10px;flex:0 0 auto;overflow:hidden;
  background:var(--surface);display:flex;align-items:center;justify-content:center;
  font-size:16px;border:1px solid var(--border-soft);cursor:pointer}
.venue-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.venue-bar-info{flex:1;min-width:0}
.venue-bar-name{font-size:18px;font-weight:800;color:var(--text);line-height:1.2;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.venue-bar-sub{font-size:14px;color:var(--muted);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.venue-bar-sub b{color:var(--muted-2);font-weight:800}
.venue-bar-expand{border-top:1px solid var(--border-soft);padding:12px 14px;
  background:var(--surface);display:none}
.venue-bar-expand.open{display:block;animation:fadeIn .18s ease}
.venue-bar-expand h4{margin:0 0 8px;font-size:11px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted-2);font-weight:800}
.venue-kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;
  border-bottom:1px solid var(--border-soft);font-size:12px}
.venue-kv:last-child{border-bottom:0}
.venue-kv .k{color:var(--muted);font-weight:700}
.venue-kv .v{color:var(--text);font-weight:700;text-align:right;max-width:60%}
.venue-logo-view{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.92);
  display:flex;align-items:center;justify-content:center;animation:fadeIn .18s ease}
.venue-logo-view img{max-width:78%;max-height:72%;border-radius:18px;
  box-shadow:0 20px 60px rgba(0,0,0,.5);object-fit:contain}
.venue-logo-fallback{font-size:64px}
.venue-logo-close{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px;
  width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;
  font-size:18px;line-height:1;display:flex;align-items:center;justify-content:center}

/* ---------- VIEWPORT ---------- */
#viewport{flex:1 1 auto;position:relative;overflow:hidden;background:#fff}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:#fff}
.scroll{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;padding-bottom:calc(16px + env(safe-area-inset-bottom))}

/* ---------- FLYER (swipe gallery, square) ---------- */
.flyer-gallery{width:100%;aspect-ratio:1/1;background:linear-gradient(135deg,#f5f3ee,#e8e4d8);
  cursor:pointer;position:relative;overflow:hidden;display:block;border:0;padding:0}
.flyer-gallery:active{opacity:.97}
.flyer-track{display:flex;height:100%;overflow-x:auto;overflow-y:hidden;
  scroll-snap-type:x mandatory;overscroll-behavior-x:contain;
  -webkit-overflow-scrolling:touch;scrollbar-width:none}
.flyer-track::-webkit-scrollbar{display:none}
.flyer-slide{flex:0 0 100%;height:100%;scroll-snap-align:start;scroll-snap-stop:always;
  display:flex;align-items:center;justify-content:center}
.flyer-slide img{width:100%;height:100%;object-fit:contain;display:block}
.flyer-dots{display:flex;justify-content:center;align-items:center;gap:6px;
  padding:12px 0 2px}
.flyer-dot{width:7px;height:7px;border-radius:50%;background:rgba(0,0,0,.22);
  border:0;padding:0;cursor:pointer}
.flyer-dot.on{background:#1a1a1a}
.flyer-empty{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  color:var(--muted-2);font-size:42px;font-weight:200;letter-spacing:-.02em}

/* ---------- TITLE BLOCK ---------- */
.flyer-title-block{padding:16px 14px 12px;cursor:pointer;transition:background .15s;
  text-align:center}
.flyer-title-block:active{background:var(--surface)}
.flyer-title-block h1{margin:0;font-size:22px;font-weight:900;letter-spacing:-.015em;
  color:var(--text);line-height:1.15}
.flyer-title-block .desc{margin-top:6px;font-size:12.5px;color:var(--muted);font-weight:500;
  line-height:1.5;max-width:100%}
.flyer-title-block .desc.placeholder{font-style:italic;opacity:.7}

/* ---------- SECTION ---------- */
.section{background:#fff;border:1px solid var(--border-soft);border-radius:14px;
  margin:12px 14px;overflow:hidden;transition:border-color .22s}
.section.open{border-color:rgba(0,0,0,.03)}
.section.locked{opacity:.72}
.section-hdr{width:100%;padding:14px 16px;display:flex;align-items:center;gap:12px;
  background:rgba(0,0,0,.03);transition:background .15s}
.section-hdr:active{background:rgba(0,0,0,.06)}
.section-title-block{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;
  text-align:center}
.section-title{font-size:16px;font-weight:900;color:var(--text);letter-spacing:.01em}
.section-sub{font-size:12px;color:var(--muted);font-weight:600;line-height:1.35}
.section-body{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.section.open .section-body{max-height:10000px}
.section-body-in{padding:2px 16px 16px;border-top:1px solid var(--border-soft)}

/* ---------- FIELDS ---------- */
.field{margin-bottom:12px}
.field:last-child{margin-bottom:0}
.field label{display:block;margin-bottom:6px;font-size:10px;font-weight:800;
  letter-spacing:.12em;text-transform:uppercase;color:var(--muted-2)}
.field-hint{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.45}
[data-sec="audience"] .field-hint{font-size:14px}
input[type="text"],input[type="tel"],input[type="email"],input[type="number"],
input[type="date"],input[type="time"],input[type="url"],textarea,select{
  width:100%;min-height:44px;padding:11px 13px;background:var(--surface);
  border:1px solid var(--border-soft);border-radius:11px;font-size:13px;color:var(--text);
  outline:none;transition:border-color .15s,background .15s}
input:focus,textarea:focus,select:focus{border-color:var(--text);background:#fff}
textarea{min-height:80px;resize:vertical;line-height:1.5}
select{appearance:none;-webkit-appearance:none;padding-right:32px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:360px){.grid2{grid-template-columns:1fr}}
.chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.chip{font-size:11px;font-weight:700;letter-spacing:.02em;padding:7px 12px;border-radius:20px;
  background:var(--surface);border:1px solid var(--border-soft);color:var(--muted);
  cursor:pointer;transition:all .15s}
.chip:active{transform:scale(.97)}
.chip.on{background:var(--black);color:#fff;border-color:var(--black)}

.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:11px 12px;background:var(--surface);border:1px solid var(--border-soft);
  border-radius:11px;margin-bottom:8px}
.toggle-row .lbl{font-size:12.5px;font-weight:800;color:var(--text);display:flex;flex-direction:column}
.toggle-row .lbl em{font-style:normal;font-size:10.5px;color:var(--muted);font-weight:600;margin-top:2px}
.switch{width:42px;height:24px;border-radius:20px;background:var(--border);position:relative;
  flex:0 0 auto;transition:background .18s;cursor:pointer}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;
  border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .18s}
.switch.on{background:var(--success)}
.switch.on::after{transform:translateX(18px)}

/* ---------- BUTTONS ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;
  padding:11px 16px;border-radius:11px;font-size:12.5px;font-weight:800;letter-spacing:.02em;
  background:var(--surface);border:1px solid var(--border-soft);color:var(--text);
  transition:background .15s,transform .1s;text-decoration:none}
.btn:active{transform:scale(.98);background:var(--border-soft)}
.btn.primary{background:var(--black);color:#fff;border-color:var(--black)}
.btn.primary:active{background:#000}
.btn.gold{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.btn.ghost{background:transparent;border-color:var(--border);color:var(--muted)}
.btn.wa{background:#dff5e4;border-color:#b8e6c1;color:#1c6b2e}
.btn.wa:active{background:#c9ecd0}
.btn.full{width:100%}
.btn.half{flex:1}
.btn.sm{min-height:34px;padding:7px 12px;font-size:11px;border-radius:9px}
.btn.tiny{min-height:28px;padding:5px 10px;font-size:10.5px;border-radius:8px}
.btn.danger{background:#fbeaea;color:var(--danger);border-color:#f0d1d1}
.btn[disabled]{opacity:.4;cursor:default;transform:none}
.back-btn{display:flex;align-items:center;justify-content:center;gap:8px;
  width:calc(100% - 28px);margin:20px 14px 8px;padding:14px 16px;border-radius:var(--radius);
  background:#1a1a1a;color:#fff;font-weight:800;font-size:14px;letter-spacing:.02em;
  text-align:center;transition:opacity .15s}
.back-btn:active{opacity:.85}

/* ---------- EVENT TYPE GROUPS ---------- */
.etype-group{border:1px solid var(--border-soft);border-radius:12px;margin-bottom:8px;
  overflow:hidden;background:#fff;transition:border-color .2s}
.etype-group.open{border-color:var(--text)}
.etype-group-hdr{display:flex;align-items:center;gap:11px;padding:12px 13px;
  background:var(--surface);cursor:pointer;transition:background .15s;width:100%}
.etype-group-hdr:active{background:var(--border-soft)}
.etype-group.open .etype-group-hdr{background:#fff;border-bottom:1px solid var(--border-soft)}
.etype-ico{width:34px;height:34px;border-radius:9px;background:#fff;
  display:flex;align-items:center;justify-content:center;font-size:16px;flex:0 0 auto;
  border:1px solid var(--border-soft);overflow:hidden}
.etype-ico img{width:100%;height:100%;object-fit:cover}
.etype-info{flex:1;min-width:0}
.etype-name{font-size:13px;font-weight:800;color:var(--text);display:block}
.etype-meta{font-size:10.5px;color:var(--muted);margin-top:2px;display:block}
.etype-group-body{max-height:0;overflow:hidden;transition:max-height .3s cubic-bezier(.4,0,.2,1)}
.etype-group.open .etype-group-body{max-height:4000px}
.etype-sub{padding:10px 13px 4px;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted-2);font-weight:800}
.etype-list{padding:0 8px 8px}
.etype-option{display:block;width:100%;padding:10px 12px;border-radius:9px;
  font-size:12.5px;font-weight:700;color:var(--text);border:1px solid transparent;
  margin-bottom:2px;transition:all .12s}
.etype-option:active{background:var(--surface)}
.etype-option.on{background:var(--black);color:#fff;border-color:var(--black)}
.etype-option .desc{display:block;font-size:10.5px;font-weight:600;color:var(--muted);
  margin-top:3px;line-height:1.4}
.etype-option.on .desc{color:rgba(255,255,255,.7)}

/* Event type hero */
.eventtype-hero{padding:14px;border-radius:12px;background:linear-gradient(135deg,#151515,#2c2418);
  color:#fff;margin-bottom:12px}
.eventtype-hero .icon{font-size:28px;margin-bottom:6px;opacity:.9}
.eventtype-hero h3{margin:0 0 4px;font-size:16px;font-weight:900;letter-spacing:-.01em}
.eventtype-hero .cat{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:rgba(255,255,255,.5);font-weight:800;margin-bottom:8px}
.eventtype-hero .desc{font-size:12px;color:rgba(255,255,255,.82);line-height:1.5}
.eventtype-hero .actions{margin-top:12px;display:flex;gap:6px}

/* ---------- VENUE CARD ---------- */
.venue-card{border:1px solid var(--border-soft);border-radius:12px;margin-bottom:10px;
  overflow:hidden;background:#fff;transition:border-color .2s}
.venue-card.on{border-color:var(--text)}
.venue-card-hdr{width:100%;padding:12px;display:flex;gap:11px;align-items:center;background:#fff;
  transition:background .15s}
.venue-card-hdr:active{background:var(--surface)}
.venue-card-thumb{width:56px;height:56px;border-radius:10px;flex:0 0 auto;overflow:hidden;
  background:var(--surface);display:flex;align-items:center;justify-content:center;
  font-size:22px;border:1px solid var(--border-soft)}
.venue-card-thumb img{width:100%;height:100%;object-fit:cover}
.venue-card-info{flex:1;min-width:0}
.venue-card-name{font-size:13.5px;font-weight:800;color:var(--text);line-height:1.25}
.venue-card-meta{font-size:10.5px;color:var(--muted);margin-top:3px;line-height:1.4}
.venue-card-price{font-size:11.5px;font-weight:900;color:var(--muted-2);margin-top:4px}
.venue-card-check{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border);
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;
  color:transparent;font-size:13px;font-weight:900;transition:all .18s}
.venue-card.on .venue-card-check{background:var(--black);border-color:var(--black);color:#fff}
.venue-card-body{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.venue-card.on .venue-card-body{max-height:6000px}
.venue-body-in{padding:4px 12px 14px;border-top:1px solid var(--border-soft)}

.subacc{border:1px solid var(--border-soft);border-radius:10px;margin-bottom:8px;overflow:hidden;
  transition:border-color .2s}
.subacc.open{border-color:var(--text)}
.subacc-hdr{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface);
  cursor:pointer;transition:background .15s;width:100%}
.subacc-hdr:active{background:var(--border-soft)}
.subacc.open .subacc-hdr{background:#fff;border-bottom:1px solid var(--border-soft)}
.subacc-title{flex:1;font-size:12px;font-weight:800;color:var(--text);text-align:left}
.subacc-count{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.03em}
.subacc-body{max-height:0;overflow:hidden;transition:max-height .3s cubic-bezier(.4,0,.2,1)}
.subacc.open .subacc-body{max-height:3500px}
.subacc-in{padding:10px 12px 12px;font-size:12px;color:var(--text)}

/* Gallery */
.venue-gallery{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;padding-bottom:4px}
.venue-gallery::-webkit-scrollbar{display:none}
.venue-gallery .g-item{flex:0 0 auto;width:calc((100% - 12px)/3);aspect-ratio:1;
  border-radius:8px;overflow:hidden;scroll-snap-align:start;scroll-snap-stop:always;
  background:var(--surface);border:1px solid var(--border-soft);
  display:flex;align-items:center;justify-content:center;font-size:22px;
  color:var(--muted-2);cursor:pointer;position:relative;padding:0}
.venue-gallery .g-item img{width:100%;height:100%;object-fit:cover}
.g-detail{margin-top:8px;padding:10px;background:var(--surface);border-radius:9px;
  border:1px solid var(--border-soft);font-size:12px;line-height:1.5}
.g-detail h5{margin:0 0 5px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted-2);font-weight:800}
.g-detail .row{display:flex;justify-content:space-between;padding:3px 0;font-size:11.5px}
.g-detail .row .k{color:var(--muted);font-weight:700}
.g-detail .row .v{color:var(--text);font-weight:800}

/* Space tick */
.tick-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tick{display:flex;align-items:center;gap:8px;padding:10px;border:1px solid var(--border-soft);
  border-radius:9px;background:var(--surface);cursor:pointer;transition:all .15s;text-align:left}
.tick:active{background:var(--border-soft)}
.tick.on{background:var(--black);color:#fff;border-color:var(--black)}
.tick input{display:none}
.tick .bx{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--border);background:#fff;
  flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:transparent;
  font-size:11px;font-weight:900;transition:all .15s}
.tick.on .bx{background:#1a1a1a;border-color:#1a1a1a;color:#fff}
.tick .tx{font-size:11.5px;font-weight:700;line-height:1.25;min-width:0}
.tick .tx em{font-style:normal;display:block;font-size:9.5px;font-weight:600;
  opacity:.75;margin-top:2px}

/* ---------- NOTES / SCHEDULE / AUDIENCE ---------- */
.note-item{border:1px solid var(--border-soft);border-radius:11px;padding:10px 12px;
  margin-bottom:8px;background:var(--surface)}
.note-item h5{margin:0 0 5px;font-size:12px;font-weight:800;color:var(--text);
  display:flex;align-items:center;gap:8px}
.note-item h5 .rm{margin-left:auto;color:var(--danger);font-size:16px;font-weight:900;
  width:22px;height:22px;display:flex;align-items:center;justify-content:center;
  border-radius:50%;background:#fff;border:1px solid var(--border-soft)}
.note-item h5 .rm:active{background:#fbeaea}
.note-item p{margin:0;font-size:12px;color:var(--muted);line-height:1.5;white-space:pre-wrap}
.note-item .meta{font-size:10.5px;color:var(--muted-2);margin-top:4px;font-weight:700;
  letter-spacing:.04em;text-transform:uppercase}

.schedule-day{border:1px solid var(--border-soft);border-radius:11px;margin-bottom:9px;
  overflow:hidden;background:var(--surface)}
.schedule-day-hdr{display:flex;align-items:center;gap:10px;padding:9px 11px;background:#fff;
  border-bottom:1px solid var(--border-soft)}
.schedule-day-hdr .day-num{width:22px;height:22px;border-radius:50%;background:var(--black);
  color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;
  font-weight:900;flex:0 0 auto}
.schedule-day-hdr .day-title{flex:1;font-size:12px;font-weight:800}
.schedule-day-hdr .day-remove{width:24px;height:24px;border-radius:50%;display:flex;
  align-items:center;justify-content:center;color:var(--danger);font-size:15px;font-weight:900}
.schedule-day-hdr .day-remove:active{background:#fbeaea}
.schedule-day-in{padding:11px}
.sched-note-box{margin-top:4px;border:1px solid var(--border-soft);border-radius:10px;padding:10px 12px;background:var(--surface)}
.sched-note-box .field:last-child{margin-bottom:0}

.audience-card{border:1px solid var(--border-soft);border-radius:11px;padding:11px 12px;
  margin-bottom:8px;background:var(--surface)}
.audience-card h5{margin:0 0 5px;font-size:12px;font-weight:800;color:var(--text);
  display:flex;align-items:center;gap:8px}
.audience-card h5 .rm{margin-left:auto;color:var(--danger);font-size:16px;font-weight:900;
  width:22px;height:22px;display:flex;align-items:center;justify-content:center;

.audience-card p{margin:0;font-size:11.5px;color:var(--muted);line-height:1.5}

/* ---------- SUPPLIER FIELD ---------- */
.sup-summary{display:grid;grid-template-columns:1fr;gap:6px;padding:10px;
  background:var(--surface);border-radius:11px;margin-top:20px;margin-bottom:10px;

.sup-stat{display:flex;flex-direction:row;align-items:center;justify-content:space-between;
  gap:8px;padding:2px 4px}
.sup-stat .l{font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--muted-2);font-weight:800}
.sup-stat b{font-size:15px;font-weight:900;color:var(--text)}
.sup-stat b.gold{color:var(--muted-2)}

.sup-group{border:1px solid var(--border-soft);border-radius:12px;margin-bottom:8px;
  overflow:hidden;background:#fff;transition:border-color .2s}
.sup-group.open{border-color:var(--text)}
.sup-group-hdr{display:flex;align-items:center;gap:11px;padding:11px 13px;
  background:var(--surface);cursor:pointer;transition:background .15s;width:100%}
.sup-group-hdr:active{background:var(--border-soft)}
.sup-group.open .sup-group-hdr{background:#fff;border-bottom:1px solid var(--border-soft)}
.sup-group-ico{width:32px;height:32px;border-radius:9px;background:#fff;
  display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto;
  border:1px solid var(--border-soft)}
.sup-group-info{flex:1;min-width:0}
.sup-group-name{font-size:12.5px;font-weight:800;color:var(--text);display:block}
.sup-group-meta{font-size:10.5px;color:var(--muted);margin-top:2px;display:block}
.sup-group-body{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.sup-group.open .sup-group-body{max-height:7000px}
.sup-field{border-bottom:1px solid var(--border-soft)}
.sup-field:last-child{border-bottom:0}
.sup-field-hdr{display:flex;align-items:center;gap:9px;padding:11px 13px;cursor:pointer;
  transition:background .15s;width:100%}
.sup-field-hdr:active{background:var(--surface)}
.sup-field-info{flex:1;min-width:0;text-align:left}
.sup-field-name{font-size:12px;font-weight:700;color:var(--text);display:block}
.sup-field-count{font-size:10px;color:var(--muted-2);font-weight:700;margin-top:1px;
  letter-spacing:.03em;display:block}
.sup-field-count.has{color:var(--success)}
.sup-field-body{max-height:0;overflow:hidden;transition:max-height .3s cubic-bezier(.4,0,.2,1)}
.sup-field.open .sup-field-body{max-height:2500px}
.sup-field-in{padding:0 13px 12px}

.sup-slot{display:flex;align-items:center;gap:10px;padding:10px 11px;background:var(--surface);
  border:1px solid var(--border-soft);border-radius:10px;margin-bottom:6px}
.sup-slot-info{flex:1;min-width:0}
.sup-slot-name{font-size:12px;font-weight:800;color:var(--text)}
.sup-slot-meta{font-size:10.5px;color:var(--muted);margin-top:2px}
.sup-slot-price{font-size:12px;font-weight:900;color:var(--muted-2);margin-top:3px}
.sup-slot-acts{display:flex;gap:4px;flex:0 0 auto}
.sup-slot-thumb{flex:0 0 auto;width:44px;height:44px;border-radius:12px;background:#fff;
  border:1px solid var(--border-soft);display:flex;align-items:center;justify-content:center;
  overflow:hidden;font-size:16px;color:var(--muted-2)}
.sup-slot-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.sup-slot-btn{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;
  justify-content:center;background:#fff;border:1px solid var(--border-soft);
  font-size:14px;color:var(--muted)}
.sup-slot-btn:active{background:var(--border-soft)}
.sup-slot-btn.danger{color:var(--danger)}
.sup-add-btn{width:100%;padding:10px;border-radius:10px;background:rgba(0,0,0,.03);
  border:1.5px dashed var(--border-soft);color:var(--muted-2);font-size:11.5px;font-weight:800;
  display:flex;align-items:center;justify-content:center;gap:6px;transition:all .15s}

/* ---------- EVENT LINKS ---------- */
.link-card{display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  padding:9px 11px;background:var(--surface);border:1px solid var(--border-soft);
  border-radius:10px;margin-bottom:6px;transition:background .15s}
.link-card:active{background:var(--border-soft)}
.link-card-ico{flex:0 0 auto;width:38px;height:38px;border-radius:10px;background:#fff;
  border:1px solid var(--border-soft);display:flex;align-items:center;justify-content:center;overflow:hidden}
.link-card-ico img{width:22px;height:22px;object-fit:contain;display:block}
.link-card-info{flex:1;min-width:0}
.link-card-title{display:block;font-size:12.5px;font-weight:800;color:var(--text)}
.link-card-sub{display:block;font-size:10.5px;color:var(--muted);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link-icon-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:16px 18px 20px;
  place-items:center}
.link-icon{background:none;border:0;padding:6px;border-radius:10px;display:flex;align-items:center;
  justify-content:center;cursor:pointer}
.link-icon:active{background:var(--border-soft)}
.link-icon img{width:40px;height:40px;object-fit:contain;display:block}

.sup-custom{background:var(--surface);border:1px solid var(--border-soft);border-radius:10px;
  padding:11px 12px;margin:-4px 0 8px;animation:fadeIn .18s ease}
.sup-custom h5{margin:0 0 9px;font-size:10px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted-2);font-weight:800}
.sup-custom .field{margin-bottom:8px}
.sup-custom .field label{font-size:9.5px;margin-bottom:4px}
.sup-custom input,.sup-custom select{min-height:38px;font-size:12.5px;padding:8px 11px}

/* ---------- MENU ITEM ---------- */
.menu-item{display:flex;align-items:center;gap:11px;padding:10px;
  border:1px solid var(--border-soft);border-radius:11px;margin-bottom:7px;background:#fff}
.menu-item-thumb{width:44px;height:44px;border-radius:9px;overflow:hidden;flex:0 0 auto;
  background:var(--surface);display:flex;align-items:center;justify-content:center;

.menu-item-qty{display:flex;align-items:center;gap:6px;flex:0 0 auto}

  font-weight:900;color:var(--text)}
.qty-btn:active{background:var(--surface)}
.qty-val{min-width:24px;text-align:center;font-size:12.5px;font-weight:900}

/* ---------- MENU PAGE (provider menu overlay) ---------- */
.menu-page-panel{background:#fff;width:100%;max-width:460px;height:94vh;max-height:94vh;
  border-radius:20px 20px 0 0;display:flex;flex-direction:column;overflow:hidden;
  animation:slideUp .22s cubic-bezier(.4,0,.2,1)}
@media(min-width:520px){.menu-page-panel{height:88vh;max-height:88vh;border-radius:20px}}
.menu-page-hdr{padding:14px 14px 12px;border-bottom:1px solid var(--border-soft);
  display:flex;align-items:center;gap:10px;flex:0 0 auto}
.menu-page-hdr .mp-title{flex:1;min-width:0}
.menu-page-hdr h3{margin:0;font-size:15px;font-weight:900;letter-spacing:-.01em;line-height:1.2}
.menu-page-hdr .mp-sub{font-size:11px;color:var(--muted);font-weight:700;margin-top:2px}
.menu-page-scroll{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;background:var(--bg)}
.menu-cat-head{padding:12px 14px 6px;font-size:10px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted-2);font-weight:900;background:var(--bg)}
.menu-page-list{padding:6px 14px 14px}
.menu-page-empty{padding:34px 20px;text-align:center;color:var(--muted);font-size:12.5px;line-height:1.6}
.menu-page-foot{flex:0 0 auto;padding:12px 14px calc(12px + env(safe-area-inset-bottom));
  border-top:1px solid var(--border-soft);background:#fafaf7;display:flex;flex-direction:column;gap:9px}
.menu-cbar{width:100%;display:flex;align-items:center;justify-content:center;text-align:center;
  padding:14px 12px;border-radius:12px;background:var(--black);color:#fff;font-size:13px;
  font-weight:900;letter-spacing:.01em}

.mp-anim{animation:fadeIn .22s ease}
.menu-back{display:flex;align-items:center;gap:5px;padding:0 14px 10px;
  font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.menu-back button{background:none;border:0;padding:8px 0;color:var(--muted);font-size:11px;
  font-weight:900;letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;gap:4px}
.menu-sum-list{padding:2px 14px}
.menu-srow{display:flex;align-items:baseline;gap:10px;padding:9px 0;border-bottom:1px dashed var(--border-soft)}
.menu-srow-name{flex:1;min-width:0;font-size:12.5px;font-weight:800;color:var(--text)}
.menu-srow-qty{font-size:11px;color:var(--muted);font-weight:800;flex:0 0 auto}
.menu-srow-tot{font-size:12px;font-weight:900;color:var(--text);flex:0 0 auto}
.menu-grade{margin:12px 14px 0}
.menu-sub{display:flex;justify-content:space-between;align-items:center;margin:4px 14px 2px;
  padding:11px 0;border-top:1px solid var(--border-soft);font-size:12px;font-weight:800;color:var(--muted)}
.menu-sub b{font-size:14px;font-weight:900;color:var(--text)}
.menu-notes{padding:10px 14px}
.menu-notes textarea{width:100%;box-sizing:border-box;min-height:84px;padding:12px 13px;
  background:var(--surface);border:1px solid var(--border-soft);border-radius:11px;
  color:var(--text);font-size:13px;outline:none;resize:vertical;font-family:inherit} 
.menu-notes textarea:focus{border-color:var(--text);background:#fff}

/* ---------- TICKET TIERS ---------- */
.tier{border:1px solid var(--border-soft);border-radius:11px;padding:10px 12px;
  margin-bottom:8px;background:var(--surface)}
.tier h5{margin:0 0 6px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:8px}
.tier h5 .rm{margin-left:auto;color:var(--danger);font-size:16px;font-weight:900;
  width:22px;height:22px;display:flex;align-items:center;justify-content:center;
  border-radius:50%;background:#fff;border:1px solid var(--border-soft)}
.tier .price{font-size:13px;font-weight:900;color:var(--muted-2);margin-bottom:4px}
.tier .notes{font-size:11.5px;color:var(--muted);line-height:1.5}

/* ---------- CALCULATOR BAR ---------- */
#calc-bar{flex:0 0 auto;background:rgba(0,0,0,.03);border-top:1px solid var(--border);
  position:relative;z-index:38;padding-bottom:env(safe-area-inset-bottom)}
.calc-strip{display:flex;align-items:center;gap:12px;padding:11px 14px;min-height:64px}
.calc-strip-btn{flex:1;display:flex;flex-direction:column;align-items:center;
  padding:4px 0;text-align:center}
.calc-strip-total{font-size:22px;font-weight:900;color:var(--text);margin-top:1px}
.calc-total-for{color:var(--muted-2);font-weight:600}
.calc-expand{border-top:1px solid var(--border-soft);padding:12px 14px 14px;display:none;
  background:var(--surface);max-height:60vh;overflow-y:auto}
.calc-expand.open{display:block;animation:fadeIn .18s ease}
.calc-expand h4{margin:0 0 9px;font-size:10px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted-2);font-weight:800}
.calc-line{display:flex;justify-content:space-between;gap:10px;padding:7px 0;
  border-bottom:1px solid var(--border-soft);font-size:12px}
.calc-line:last-child{border-bottom:0}
.calc-line .lbl{color:var(--muted);font-weight:700}
.calc-line .val{color:var(--text);font-weight:800}
.calc-line.sub .lbl{padding-left:10px;font-weight:600}
.calc-line.sub .val{font-weight:700}
.calc-line.total{border-top:1px solid var(--border);padding-top:9px;margin-top:5px;font-size:13px}
.calc-line.total .lbl{color:var(--text);font-weight:900;letter-spacing:.02em}
.calc-line.total .val{color:var(--text);font-weight:900;font-size:15px}
.calc-empty{padding:16px 4px;text-align:center;color:var(--muted-2);font-size:12px}

/* ---------- BOTTOM NAV ---------- */
#nav{flex:0 0 auto;position:relative;display:flex;background:#0a0a0a;
  border-top:1px solid #1a1a1a;padding-bottom:env(safe-area-inset-bottom);z-index:50}
.nav-btn{flex:1;padding:16px 2px 15px;display:flex;align-items:center;justify-content:center;
  color:rgba(255,255,255,.42);transition:color .18s}
.nav-btn svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round;transition:transform .18s}
.nav-btn.on{color:#fff}
.nav-btn.on svg{transform:translateY(-1px);filter:drop-shadow(0 0 8px rgba(255,255,255,.35))}
.nav-btn:active{color:rgba(255,255,255,.75)}

/* ---------- MODALS / FLOATING ---------- */
.fpop-scrim{position:fixed;inset:0;background:rgba(20,18,12,.5);z-index:55;
  display:flex;align-items:flex-end;justify-content:center;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fadeIn .18s ease}

.fpop{background:#fff;width:100%;max-width:460px;max-height:86vh;border-radius:20px 20px 0 0;

.fpop-hdr{padding:14px 18px;border-bottom:1px solid var(--border-soft);

.fpop-opt-info{flex:1;min-width:0}
.fpop-opt-name{font-size:12.5px;font-weight:800;color:var(--text)}
.fpop-opt-meta{font-size:10.5px;color:var(--muted);margin-top:2px}
.fpop-opt-price{font-size:11px;font-weight:900;color:var(--muted-2);margin-top:3px}
.fpop-opt-add{flex:0 0 auto;font-size:10.5px;font-weight:900;padding:6px 11px;
  border-radius:20px;background:var(--black);color:#fff;letter-spacing:.04em}
.fpop-empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:12.5px}

.stm-cat{border-bottom:1px solid var(--border-soft)}

.stm-cat.open .stm-cat-hdr{background:#fff;border-bottom:1px solid var(--border-soft)}

}

function saveDraft(){
  try{
    const toSave={
      eventType:STATE.eventType,
      notes:STATE.notes,
      flyerImages:STATE.flyerImages,
      eventTitle:STATE.eventTitle,
      eventDescription:STATE.eventDescription,
      schedule:STATE.schedule,
      targetAudience:STATE.targetAudience,
      venueId:STATE.venue?STATE.venue.id:null,
      venueSpaces:STATE.venueSpaces,
      venueRules:STATE.venueRules,
      menuFood:STATE.menuFood,
      menuBeverages:STATE.menuBeverages,
      menuOrderNotes:STATE.menuOrderNotes,
      suppliers:STATE.suppliers,
      eventDetails:STATE.eventDetails,
      guests:STATE.guests,
      rsvp:STATE.rsvp
    };
    localStorage.setItem(STATE.draftKey,JSON.stringify(toSave));
  }catch(e){console.warn("save failed",e);}
}
let _saveTimer=null;
function scheduleSave(){
  clearTimeout(_saveTimer);
  _saveTimer=setTimeout(saveDraft,400);
}
function loadDraft(){
  try{
    const raw=localStorage.getItem(STATE.draftKey);
    if(!raw)return;
    const d=JSON.parse(raw);
    Object.assign(STATE.eventType,d.eventType||{});
    STATE.notes=d.notes||[];
    STATE.flyerImages=d.flyerImages||[];
    STATE.eventTitle=d.eventTitle||"";
    STATE.eventDescription=d.eventDescription||"";
    if(d.schedule)STATE.schedule=d.schedule;
    STATE.targetAudience=d.targetAudience||[];
    if(d.venueId)STATE.venue=findVenue(d.venueId);
    STATE.venueSpaces=d.venueSpaces||[];
    STATE.venueRules=d.venueRules||[];
    STATE.menuFood=d.menuFood||[];
    STATE.menuBeverages=d.menuBeverages||[];
    STATE.menuOrderNotes=d.menuOrderNotes||"";
    STATE.suppliers=d.suppliers||{};
    if(d.eventDetails)Object.assign(STATE.eventDetails,d.eventDetails);
    STATE.guests=d.guests||[];
    STATE.rsvp=d.rsvp||[];
  }catch(e){console.warn("load draft failed",e);}
}

function normalizeDemoSupplier(s){
  if(!s) return s;
  const pricing=s.pricing||{};
  const area=Array.isArray(s.serviceArea)?s.serviceArea:(Array.isArray(s.service_area)?s.service_area:(Array.isArray(s.serviceAreaList)?s.serviceAreaList:[]));
  const isActual=!(Array.isArray(area)&&area.length===0) || (s.price===undefined && !s.name);
  let price=Number(pricing.amount!==undefined?pricing.amount:(s.price!==undefined?s.price:0))||0;
  return {
    id: s.id,
    name: s.name||s.supplier_name||"Unnamed supplier",
    businessName: s.businessName||s.business_name||"",
    catName: s.catName||s.category||"",
    catId: s.catId||s.category_id||"",
    subcategory: s.subcategory||"",
    service: s.service||s.service_listing||"",
    description: s.description||"",
    price: price,
    displayPrice: s.displayPrice||pricing.display_price||"",
    model: s.model||pricing.model||"",
    unit: s.unit||"per event",
    included: s.included||s.included_in_base_price||"",
    addons: Array.isArray(s.addons)?s.addons:(Array.isArray(s.example_add_ons)?s.example_add_ons:[]),
    availability: s.availability||"",
    serviceArea: area.length?area:["Nationwide"],
    rating: s.rating!==undefined?s.rating:(s.ratingScore||0),
    thumb: s.thumb||"📦",
    city: s.city||(area.length?area[0]:""),
    listingStatus: s.listingStatus||s.listing_status||"",
    verificationStatus: s.verificationStatus||s.supplier_verification_status||"",
    notes: s.notes||s.supplier_notes||""
  };
}

const DRINK_RE=/drink|beer|wine|cider|lager|spirit|cocktail|mocktail|shake|smoothie|coffee|tea|juice|soda|beverage|bar|vodka|gin|rum|whiskey|whisky|brandy|liqueur|shots?|fizz/i;
let _menuCacheVenue=null,_menuCacheItems=null;
function canonicalMenuKey(slug){
  const s=String(slug||"").toLowerCase().trim();
  if(s.indexOf("nando")===0)return "nandos";
  if(s.indexOf("zen-cafe")===0)return "zen-cafe";
  if(s.indexOf("rocomamas")===0||s==="roco-mamas")return "rocomamas";
  if(s.indexOf("bull-and-bush")===0)return "bull-and-bush";
  if(s.indexOf("spur")!==-1)return "spur";
  if(s.indexOf("chicken-licken")===0)return "chicken-licken";
  if(s.indexOf("hungry-lion")===0)return "hungry-lion";
  if(s.indexOf("kfc")===0)return "kfc";
  if(s.indexOf("pie-city")===0)return "pie-city";
  if(s.indexOf("butter-chicken")===0)return "butter-chicken-indian-restaurant";
  if(s.indexOf("the-game-reserve")===0)return "the-game-reserve";
  if(s.indexOf("mozambik")!==-1)return "mozambik";
  return s;
}
function menuSlugish(s){return String(s||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");}
function dirRows(){const d=window.DIRECTORY_RUNTIME_DATA;return (d&&Array.isArray(d.restaurants))?d.restaurants:[];}
function menuRawForVenue(v){
  if(!v)return null;
  const row=dirRows().find(function(r){return r.id===v.id;});
  const slug=(row&&row.slug)||v.slug||menuSlugish(v.name);
  const key=canonicalMenuKey(slug);
  const d=window.DIRECTORY_RUNTIME_DATA;
  const raw=(d&&d.menusRaw)?d.menusRaw[key]:null;
  return {key:key,row:row||null,raw:raw||null};
}
function moneyLike(v){
  if(typeof v==="string"){
    const m=String(v).replace(/[^0-9.\-]/g,"");
    const n=Number(m);
    return isFinite(n)?n:null;
  }
  const n=Number(v);
  return isFinite(n)?n:null;
}
function menuItemBasePrice(raw){
  if(!raw||typeof raw!=="object")return null;
  if(Array.isArray(raw.variants)&&raw.variants.length){
    let m=null;
    raw.variants.forEach(function(x){const p=moneyLike(x&&x.price);if(p!==null&&(m===null||p<m))m=p;});
    if(m!==null)return m;
  }
  if(Array.isArray(raw.options)&&raw.options.length){
    const firstHas=raw.options.some(function(o){return o&&typeof o==="object"&&o.price!==undefined&&o.price!==null;});
    let m=null;
    raw.options.forEach(function(o){
      const p=(typeof o==="string")?moneyLike(raw.price):moneyLike(firstHas?o.price:raw.price);
      if(p!==null&&(m===null||p<m))m=p;
    });
    if(m!==null)return m;
  }
  let base=raw.price;
  if(base===undefined||base===null)base=raw.price_token;
  return moneyLike(base);
}
function isMenuDrink(itemName,catName){
  return DRINK_RE.test(itemName)||DRINK_RE.test(catName);
}
/* Flatten the imported menu payload into builder item rows.
   Handles the four shapes found in menusRaw:
   - Array / .menu = [{category,items}]           (mozambik, nandos, spur, kfc ...)
   - .food_menu / .bar_menu = flat item arrays     (zen-cafe)
   - .menus = {food_menu|beverage_menu:{sections}}  (the-game-reserve) */
function normaliseMenuRaw(raw){
  const out=[];
  const pushRows=function(rows,defCat,defKey){
    if(!Array.isArray(rows))return;
    rows.forEach(function(it){
      if(!it||typeof it!=="object")return;
      const name=String(it.name||it.item||it.title||"").trim();
      const price=menuItemBasePrice(it);
      if(!name||price===null)return;
      const cat=(String(it.category||it.section||defCat||"Menu").trim()||"Menu");
      const catKey=defKey||(isMenuDrink(name,cat)?"beverages":"food");
      out.push({id:"",name:name,price:price,
        desc:String(it.description||it.desc||it.details||"").trim(),
        cat:cat,catKey:catKey});
    });
  };
  const menu=(Array.isArray(raw)?raw:(raw&&raw.menu));
  if(Array.isArray(menu)){
    menu.forEach(function(g){
      const cat=g&&g.category?String(g.category):"Menu";
      pushRows(g&&g.items,cat,null);
    });
  }
  if(raw&&Array.isArray(raw.food_menu)) pushRows(raw.food_menu,"Food","food");
  if(raw&&Array.isArray(raw.bar_menu)) pushRows(raw.bar_menu,"Beverages","beverages");
  if(raw&&raw.menus&&typeof raw.menus==="object"){
    Object.keys(raw.menus).forEach(function(k){
      const g=raw.menus[k];
      const defKey=/(bar|beverage|drink)/i.test(k)?"beverages":"food";
      if(g&&Array.isArray(g.sections)){
        g.sections.forEach(function(sec){
          pushRows(sec&&sec.items,String(sec&&sec.section||"Menu").trim(),defKey);
        });
      }else if(g&&Array.isArray(g.items)){
        pushRows(g.items,String(g.name||"Menu").trim(),defKey);
      }
    });
  }
  out.forEach(function(m,i){m.id="m"+(i+1);});
  return out;
}

function venueMenuItems(){
  const v=STATE.venue;

  if(_menuCacheVenue===v)return _menuCacheItems;
  let items=[];
  const src=menuRawForVenue(v);
  if(src&&src.raw)items=normaliseMenuRaw(src.raw);
  if(!items.length&&Array.isArray(v.menu)){
    let i=0;
    items=v.menu.map(function(m){
      i++;
      const catKey=String(m.cat||"").toLowerCase()==="beverage"?"beverages":"food";
      return {id:catalogId(m.id)||("m"+i),name:m.name,price:Number(m.price)||0,
        desc:"",cat:String(m.cat||""),catKey:catKey};
    });
  }
  _menuCacheVenue=v;_menuCacheItems=items;
  return items;
}

function fmt(n){
  const v=Number(n)||0;
  return "P"+v.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,",");
}
function venueSpacesCost(){
  if(!STATE.venue) return 0;
  return STATE.venueSpaces.reduce(function(sum,sid){
    const sp=(STATE.venue.spaces||[]).find(function(s){return s.id===sid;});
    return sum + (sp && sp.price ? Number(sp.price) : 0);
  },0);
}
function venueDurationCost(){
  if(!STATE.venue) return 0;
  const base=Number(STATE.venue.fromPrice)||0;
  const hourly=(STATE.venue.pricing && STATE.venue.pricing.hourly)||0;
  return STATE.schedule.days.reduce(function(sum,d){
    let hours=0;
    if(d.startTime && d.endTime && d.startDate && d.endDate){
      // simple estimate: use time difference on start date
      const s=d.startTime.split(":").map(Number);
      const e=d.endTime.split(":").map(Number);
      let h=(e[0]*60+e[1])-(s[0]*60+s[1]);
      if(h<0) h+=24*60;
      hours=h/60;
    } else if(d.startDate && d.endDate){
      // multi-day range: use days * 8h
      const sd=new Date(d.startDate), ed=new Date(d.endDate);
      if(!isNaN(sd) && !isNaN(ed)){
        const days=Math.max(1, Math.round((ed-sd)/86400000)+1);
        hours=days*8;
      }
    }
    return sum + base + (hourly*hours);
  },0);
}
function venueCost(){ return venueDurationCost() + venueSpacesCost(); }
function menuFoodCost(){
  return STATE.menuFood.reduce(function(s,x){
    return s + (Number(x.price)||0)*(Number(x.qty)||0);

}

function supplierLineCost(entry){
  const sup=findSupplier(entry.supplierId);
  if(!sup) return 0;
  const c=entry.customisations||{};
  let cost=(Number(sup.price)||0)*supplierUnitQty(sup.unit,c);
  (sup.addons||[]).forEach(function(add,i){
    const pm=parseAddonPrice(add);
    const n=Number(c["addon_"+i])||0;
    if(pm&&n>0) cost+=pm.price*n;
  });
  return cost;
}

function menuLaunchRow(key,title,items,selected,first){
  const selectedCount=selected.reduce(function(s,x){return s+(Number(x.qty)||0);},0);

    ? (selectedCount?selectedCount+" added · "+items.length+" items":items.length+" items")
    : "No menu";
  return '<div class="subacc"'+(first?' style="margin-top:20px"':'')+'">'+
    '<button class="subacc-hdr" data-act="openMenuPage" data-key="'+key+'">'+
      '<span class="subacc-title">'+esc(title)+'</span>'+
      '<span class="subacc-count">'+esc(count)+'</span>'+
    '</button>'+
  '</div>';
}

/* ------------------------------------------------------------
   MENU PAGE — full-screen overlay of the venue provider's menu.
   Items view shows the restaurant's food/beverages with steppers and
   a bottom cbar (cost · item count); summary view is the order recap
   with order notes + WhatsApp send. No split bill, no name/contact pad.
   ------------------------------------------------------------ */
function menuPageCat(){return STATE.menuPage.cat==="beverages"?"beverages":"food";}
function menuPageList(){return menuPageCat()==="beverages"?STATE.menuBeverages:STATE.menuFood;}
function menuPageCost(){return menuPageCat()==="beverages"?menuBeveragesCost():menuFoodCost();}
function menuPageCount(){return menuPageList().reduce(function(s,x){return s+(Number(x.qty)||0);},0);}
function menuPageLabel(catKey){return catKey==="beverages"?"Beverages":"Food";}
function renderMenuPage(){
  const p=STATE.menuPage;
  if(!p||!p.open||!STATE.venue) return "";
  const pang=p.cat==="beverages"?"🥂":"🍽";
  const catKey=menuPageCat();
  const list=menuPageList();
  const items=getMenuItemsForVenue(catKey);
  const cost=menuPageCost();
  const count=menuPageCount();
  let body="";
  if(p.view==="summary"){
    body=renderMenuPageSummary(list,cost);
  }else{
    let scroll='<div class="menu-page-scroll mp-anim">';
    if(!items.length){
      scroll+='<div class="menu-page-empty">'+esc(STATE.venue.name)+' has no '+
        catKey+" items in its menu yet.</div>";
    }else{
      menuCatGroups(catKey).forEach(function(g){
        scroll+='<div class="menu-cat-head">'+esc(g.name)+'</div>'+
          '<div class="menu-page-list">'+g.items.map(function(m){
            const e=list.find(function(x){return x.itemId===m.id;});
            const qty=e?e.qty:0;
            return '<div class="menu-item">'+
              '<div class="menu-item-thumb">'+pang+'</div>'+
              '<div class="menu-item-info">'+
                '<div class="menu-item-name">'+esc(m.name)+'</div>'+
                '<div class="menu-item-price"><b>'+fmt(m.price)+'</b> each</div>'+
              '</div>'+
              '<div class="menu-item-qty">'+
                '<button class="qty-btn" data-act="decMenu" data-cat="'+catKey+'" data-id="'+esc(m.id)+'">−</button>'+
                '<span class="qty-val">'+qty+'</span>'+
                '<button class="qty-btn" data-act="incMenu" data-cat="'+catKey+'" data-id="'+esc(m.id)+'">+</button>'+
              '</div>'+
            '</div>';
          }).join("")+'</div>';
      });
    }
    scroll+='</div>';
    body=scroll+
      '<div class="menu-page-foot">'+
        '<button class="menu-cbar" data-act="menuPageSummary"'+(count>0?"":" disabled")+'>'+
          esc(fmt(cost))+' <span class="mc-count">· '+count+' item'+(count===1?"":"s")+' · View Summary</span>'+
        '</button>'+
      '</div>';
  }
  return '<div class="fpop-scrim" data-act="closeMenuPage">'+
    '<div class="menu-page-panel" data-stop="1">'+
      '<div class="menu-page-hdr">'+
        '<div class="mp-title">'+
          '<h3>'+esc(STATE.venue.name)+'</h3>'+
          '<div class="mp-sub">'+pang+' '+esc(menuPageLabel(catKey))+' · '+(p.view==="summary"?"Order Summary":"select your items")+'</div>'+
        '</div>'+
        '<button class="fpop-close" data-act="closeMenuPage" aria-label="Close">×</button>'+
      '</div>'+
      body+
    '</div>'+
  '</div>';
}
function renderMenuPageSummary(list,cost){
  let rows="";
  if(!list.length){
    rows='<div class="menu-page-empty">No items added yet.</div>';
  }else{
    rows=list.map(function(e){
      return '<div class="menu-srow">'+
        '<span class="menu-srow-name">'+esc(e.name)+'</span>'+
        '<span class="menu-srow-qty">'+e.qty+'×</span>'+
        '<span class="menu-srow-tot">'+fmt((Number(e.price)||0)*e.qty)+'</span>'+
      '</div>';
    }).join("");
  }
  return '<div class="menu-back"><button data-act="menuPageItems">‹ Back to Menu</button></div>'+
    '<div class="menu-sum-list mp-anim">'+rows+'</div>'+
    '<div class="menu-sub"><span>Subtotal</span><b>'+esc(fmt(cost))+'</b></div>'+
    '<div class="menu-notes"><label style="font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:900;display:block;margin-bottom:6px">Order Notes</label>'+
      '<textarea id="menuNotes" placeholder="e.g. all dishes mild, no peanuts, serving time">'+esc(STATE.menuOrderNotes)+'</textarea></div>'+
    '<div class="menu-page-foot">'+
      '<button class="btn wa-solid full" data-act="waOrderMenu">Send via WhatsApp</button>'+
      '<button class="btn primary full" data-act="closeMenuPage">Back to Event Builder</button>'+
    '</div>';
}
function buildMenuOrderMessage(){
  const v=STATE.venue;
  const catKey=menuPageCat();
  const list=menuPageList();
  const cost=menuPageCost();
  let msg="*EVENT CATERING ORDER*\nVenue: "+(v?v.name:"EatOuts")+"\nCategory: "+menuPageLabel(catKey);
  msg+="\n\n*Order Details:*\n";
  list.forEach(function(e){
    msg+=e.qty+"x "+e.name+" @"+fmt(e.price)+" — "+fmt((Number(e.price)||0)*e.qty)+"\n";
  });
  msg+="\nSubtotal: "+fmt(cost)+"\n";
  if(STATE.menuOrderNotes.trim()) msg+="Notes: "+STATE.menuOrderNotes.trim()+"\n";
  msg+="\nSent from EatOuts Event Planner.";
  return msg;
}

/* Supplier directory popup */
function wrapWords(text,n){
  const words=String(text).split(" ");
  const out=[];
  for(let i=0;i<words.length;i++){
    out.push(words[i]);
    if(i>0 && (i+1)%n===0 && i<words.length-1) out.push("<br>");
  }
  return out.join(" ");
}
function renderSupplierTypeMenu(){
  const p=STATE.supplierTypeMenu;

      if(s.catId!==cat.id) return false;

(s.photo

/* Supplier profile — floating card with avatar, location and the supplier's
   priced services/goods. Cards toggle a highlight and carry a - # + stepper;
   the chosen quantities map into supplier customisations on Add. */
function renderSupplierProfile(){
  const pr=STATE.supplierProfile;
  if(!pr||!pr.open) return "";
  const s=findSupplier(pr.id);
  if(!s) return "";
  const items=supplierProfileItems(s);
  const qtyOf=function(k){return Number(pr.items[k]||0)||0;};
  let total=0;
  const cards=items.map(function(it){
    const q=qtyOf(it.key);
    if(it.price!==null) total+=it.price*q;
    const on=q>0;
    return '<div class="pit-card'+(on?" on":"")+'" data-act="toggleProfileItem" data-key="'+esc(it.key)+'">'+
      '<div class="pit-thumb">'+esc(it.thumb)+'</div>'+
      '<div class="pit-info">'+
        '<div class="pit-title">'+esc(it.title)+'</div>'+
        (it.price!==null
          ? '<div class="pit-price">'+esc(it.priceLabel)+(it.unit?' <span style="color:var(--muted);font-weight:700">'+esc(it.unit)+'</span>':'')+'</div>'
          : '<div class="pit-quote">On quote</div>')+
      '</div>'+
      (it.price!==null
        ? '<div class="qty-stepper sm" style="flex:0 0 auto;width:118px">'+
            '<button type="button" data-act="decProfileItem" data-key="'+esc(it.key)+'" aria-label="Decrease">−</button>'+

          '</div>'
        : '<span class="pit-check"></span>')+
    '</div>';
  }).join("");
  const added=isSupplierAdded(s.id);
  const locParts=[];
  if(s.city) locParts.push(s.city);
  if(Array.isArray(s.serviceArea)&&s.serviceArea.length&&s.serviceArea[0]!==s.city){
    locParts.push(s.serviceArea.slice(0,3).join(", "));

    '<div class="sup-profile-panel" data-stop="1">'+
      '<div class="sup-profile-scroll">'+
        '<div class="sup-profile-hero">'+
          '<div class="sup-profile-avatar"'+(s.photo?' data-act="openSupPhoto" data-photo="'+esc(s.photo)+'"':'')+'>'+(s.photo?'<img src="'+esc(s.photo)+'" alt="">':esc(s.thumb||"📦"))+'</div>'+
          '<div class="sup-profile-name">'+esc(s.businessName||s.name)+'</div>'+
          (locText?'<div class="sup-profile-loc">'+esc(locText)+'</div>':'')+
          (added?'<span class="sup-profile-added">Already added</span>':'')+
        '</div>'+
        '<div class="sup-profile-items">'+
          '<span class="sup-profile-h">Priced services &amp; goods</span>'+
          (cards||'<div class="stm-empty">No priced services listed.</div>')+
        '</div>'+
        '<div class="pit-total"><span>Offering total</span><b>'+esc(fmt(total))+'</b></div>'+
      '</div>'+
      '<div class="sup-profile-foot">'+
        '<button class="btn primary full" data-act="addSupplierFromProfile">'+esc(added?"Update offering":"Add to Event")+' · '+esc(fmt(total))+'</button>'+

function getWarnings(){
  const w=[];
  if(STATE.venue){
    // Capacity
    const g=totalGuests();
    if(STATE.venue.capacity && g>STATE.venue.capacity){
      w.push({type:"capacity",title:"Capacity exceeded",
        msg:"Guest count ("+g+") exceeds venue capacity ("+STATE.venue.capacity+"). Consider a larger venue or trimming the list."});
    }
    // Budget
    const b=STATE.eventDetails.budget;
    if(b && Number(b)>0 && grandTotal()>Number(b)){
      w.push({type:"budget",title:"Budget exceeded",
        msg:"Estimated total "+fmt(grandTotal())+" exceeds the budget of "+fmt(b)+"."});
    }
  }
  return w;
}

function contactHref(type,value){
  if(!value) return "#";
  const v=String(value).trim();
  if(/^(https?:|tel:|mailto:)/.test(v)) return v;
  const t=(type||"").toLowerCase();
  if(t==="call") return "tel:"+v.replace(/[^\d+]/g,"");
  if(t==="whatsapp") return "https://wa.me/"+v.replace(/[^\d]/g,"");
  if(t==="facebook") return "https://facebook.com/"+v.replace(/^@/,"");
  if(t==="instagram") return "https://instagram.com/"+v.replace(/^@/,"");
  if(t==="tiktok") return "https://tiktok.com/@"+v.replace(/^@/,"");
  if(t==="twitter"||t==="x") return "https://x.com/"+v.replace(/^@/,"");
  if(t==="youtube") return "https://youtube.com/@"+v.replace(/^@/,"");
  if(t==="linkedin") return "https://linkedin.com/in/"+v.replace(/^@/,"");
  if(/\./.test(v)) return "https://"+v;
  return "#";
}

   ============================================================ */
function renderPrompt(){
  const p=STATE.prompt;
  if(!p.open) return "";
  let fields='';
  (p.fields||[]).forEach(function(f){
    const val=p.values && p.values[f.key]!==undefined?p.values[f.key]:"";
    if(f.type==="thumb"){
      fields+='<div class="prompt-thumb" data-act="pickPromptThumb" data-key="'+esc(f.key)+'" role="button" aria-label="Add photo">'+
        (val?'<img src="'+esc(val)+'" alt="">':'<span class="pt-plus">＋</span><span>Add photo</span>')+'</div>';
    } else if(f.type==="stepper"){
      fields+='<div class="field"><label>'+esc(f.label)+'</label>'+
        '<div class="qty-stepper">'+
          '<button type="button" data-act="promptStepper" data-key="'+esc(f.key)+'" data-delta="-1" aria-label="Decrease">−</button>'+
          '<input type="number" data-prompt-field="'+esc(f.key)+'" value="'+esc(val||0)+'" min="0">'+
          '<button type="button" data-act="promptStepper" data-key="'+esc(f.key)+'" data-delta="1" aria-label="Increase">+</button>'+
        '</div></div>';
    } else if(f.type==="note"){
      const open=!!val;
      const noteTitle=p.values&&p.values[f.key+"Title"]!==undefined?p.values[f.key+"Title"]:"";
      const noteText=p.values&&p.values[f.key+"Text"]!==undefined?p.values[f.key+"Text"]:"";
      const hasNote=!!(noteTitle||noteText);
      fields+='<button type="button" class="sup-add-btn" style="margin-bottom:12px" data-act="togglePromptNote" data-key="'+esc(f.key)+'">'+
        (hasNote?'✓ Note added'+(noteTitle?' · '+esc(noteTitle):''):'＋ Add Note')+'</button>'+
        '<div class="prompt-note-box" data-note-box="'+esc(f.key)+'"'+(open?'':' style="display:none"')+'>'+
          '<div class="field"><label>Note title</label><input type="text" data-prompt-field="'+esc(f.key)+'Title" value="'+esc(noteTitle)+'" placeholder="e.g. VIP welcome package"></div>'+
          '<div class="field" style="margin-bottom:0"><label>Note</label><textarea data-prompt-field="'+esc(f.key)+'Text" placeholder="Any notes for this guest">'+esc(noteText)+'</textarea></div>'+
        '</div>';
    } else if(f.type==="textarea"){
      fields+='<div class="field"><label>'+esc(f.label)+'</label>'+
        '<textarea data-prompt-field="'+esc(f.key)+'" placeholder="'+esc(f.placeholder||"")+'">'+esc(val)+'</textarea></div>';
    } else if(f.type==="select"){
      fields+='<div class="field"'+(f.center?' style="text-align:center"':'')+'>'+
        (f.hideLabel?'':'<label>'+esc(f.label)+'</label>')+
        '<select data-prompt-field="'+esc(f.key)+'" style="text-align:center">'+
          (f.placeholder && val===""?'<option value="" disabled selected>'+esc(f.placeholder)+'</option>':'')+
          (f.options||[]).map(function(o){
            const vv=typeof o==="string"?o:o.value;
            const ll=typeof o==="string"?o:o.label;
            return '<option value="'+esc(vv)+'"'+(val===vv?" selected":"")+'>'+esc(ll)+'</option>';
          }).join("")+
        '</select></div>';
    } else {
      fields+='<div class="field"><label>'+esc(f.label)+'</label>'+
        '<input type="'+(f.type||"text")+'" data-prompt-field="'+esc(f.key)+'" value="'+esc(val)+'" placeholder="'+esc(f.placeholder||"")+'"></div>';
    }
  });
  return '<div class="fpop-scrim" data-act="closePrompt">'+
    '<div class="prompt-panel" data-stop="1">'+
      '<div class="fpop-hdr">'+
        '<h3>'+esc(p.title||"Add")+'</h3>'+
        '<button class="fpop-close" data-act="closePrompt" aria-label="Close">×</button>'+
      '</div>'+
      '<div class="prompt-body">'+fields+'</div>'+
      '<div class="prompt-foot" style="flex-wrap:wrap">'+
        (p.onDelete?'<button class="btn danger full" data-act="deletePrompt" style="margin-bottom:10px">Delete</button>':'')+
        '<div style="display:flex;gap:10px;width:100%">'+
          '<button class="btn ghost half" data-act="closePrompt">Cancel</button>'+
          '<button class="btn primary half" data-act="savePrompt">Save</button>'+
        '</div>'+
      '</div>'+
    '</div>'+
  '</div>';
}

  opts=opts||{};
  STATE.prompt={open:true,title:title,fields:fields,values:opts.values||{},onSave:onSave,onDelete:opts.onDelete||null};

function openLinkForm(type,index){
  const existing=index!=null?STATE.eventDetails.contacts[index]:null;
  let fields;
  let values={};
  if(type==="Call"){
    let cc="+267",num="";
    if(existing){
      const m=String(existing.value||"").match(/^(\+\d+)\s*(.*)$/);
      if(m){cc=m[1];num=m[2];} else {num=String(existing.value||"").trim();}
    }
    fields=[
      {key:"title",label:"Title",placeholder:"e.g. RSVP line"},
      {key:"cc",label:"Country code",type:"select",options:LINK_CC},
      {key:"number",label:"Number",type:"tel",placeholder:"71 234 567"},
      {key:"notes",label:"Note",type:"textarea",placeholder:"Any notes"}
    ];
    values={title:existing?existing.title:"",cc:cc,number:num,notes:existing?existing.notes:""};
  } else {
    const meta=LINK_TYPES.filter(function(x){return x.type===type;})[0]||LINK_TYPES[0];
    fields=[
      {key:"title",label:"Title",placeholder:"e.g. "+type},
      {key:"value",label:meta.valueLabel,placeholder:meta.valuePlaceholder},
      {key:"notes",label:"Note",type:"textarea",placeholder:"Any notes"}
    ];
    values={title:existing?existing.title:"",value:existing?existing.value:"",notes:existing?existing.notes:""};
  }
  openPrompt(index!=null?"Edit Link":"Add "+type,fields,function(v){
    const title=String(v.title||"").trim();
    const notes=String(v.notes||"").trim();
    const isCall=type==="Call";
    const number=String(v.number||"").trim();
    const value=isCall?((v.cc||"+267")+" "+number).trim():String(v.value||"").trim();
    if(isCall?(!number):(!value)) return;
    if(index!=null){
      const c=STATE.eventDetails.contacts[index];
      if(c){c.type=type;c.title=title;c.value=value;c.notes=notes;}
    } else {
      STATE.eventDetails.contacts.push({id:uid("c"),type:type,title:title,value:value,notes:notes});
    }
    render();
    if(index==null) toast("Link added");
  },{
    values:values,
    onDelete:index!=null?function(){
      STATE.eventDetails.contacts.splice(index,1);
      render();
      toast("Link removed");
    }:null
  });
}

function measureCalc(){

  if(el) document.documentElement.style.setProperty("--calch",el.offsetHeight+"px");

function measureNav(){

}
function measureFlyerTrack(){
  const tr=document.querySelector(".flyer-menu-track");
  if(!tr) return;
  const cs=getComputedStyle(tr);
  const availW=tr.clientWidth-parseFloat(cs.paddingLeft||0)-parseFloat(cs.paddingRight||0);
  const availH=tr.clientHeight-parseFloat(cs.paddingTop||0)-parseFloat(cs.paddingBottom||0);
  const s=Math.min(availW,availH);
  if(s>0) tr.style.setProperty("--flyer-item-size",Math.floor(s)+"px");
}

/* In-place refreshes for the supplier profile panel so stepper taps never
   re-run the slideUp animation (which made the panel flash). */
function refreshProfileItem(k){
  const pr=STATE.supplierProfile;
  const q=Number(pr.items[k])||0;
  const card=document.querySelector('.pit-card[data-key="'+k+'"]');
  if(!card) return;
  card.classList.toggle("on",q>0);
  const input=card.querySelector(".qty-stepper input");
  if(input) input.value=q;
  refreshProfileTotals();
}
function refreshProfileTotals(){
  const pr=STATE.supplierProfile;
  if(!pr||!pr.open) return;
  const s=pr.id?findSupplier(pr.id):null;
  if(!s) return;
  const items=supplierProfileItems(s);
  let total=0;
  items.forEach(function(it){
    const q=Number(pr.items[it.key])||0;
    if(it.price!==null) total+=it.price*q;
  });
  const tEl=document.querySelector(".sup-profile-scroll .pit-total b");
  if(tEl) tEl.textContent=fmt(total);
  const fEl=document.querySelector(".sup-profile-foot .btn");
  if(fEl) fEl.textContent=(isSupplierAdded(s.id)?"Update offering":"Add to Event")+" · "+fmt(total);
}
/* In-place refresh for the supplier customise panel (same flash fix). */
function refreshSupCustom(btn,field,idx){
  const entry=(STATE.suppliers[field]||[])[idx];
  if(!entry) return;
  const s=findSupplier(entry.supplierId);
  if(!s) return;
  const pnl=btn.closest(".sup-custom");
  if(!pnl) return;
  const c=entry.customisations||{};
  const qty=supplierUnitQty(s.unit,c);
  const qe=pnl.querySelector("[data-sup-qty]");
  if(qe) qe.value=qty;
  const hint=pnl.querySelector(".field-hint");
  if(hint) hint.textContent=fmt(s.price)+" × "+qty+" = "+fmt(s.price*qty);
  pnl.querySelectorAll("[data-sup-addon]").forEach(function(input){
    input.value=Number(c["addon_"+input.getAttribute("data-sup-addon")])||0;
  });
  const slotEl=pnl.previousElementSibling;
  const pe=slotEl?slotEl.querySelector(".sup-slot-price"):null;
  if(pe) pe.textContent=fmt(supplierLineCost(entry));
  const gold=document.querySelector(".sup-stat .gold");
  if(gold) gold.textContent=fmt(supplierCost());
  renderCalcBar();
  scheduleSave();
}

  if(act==="saveEvent"){
    const S=window.EatoutsCustomer;
    if(!S||!S.getUser()){ if(confirm("Sign in to save this event to your account. Continue to sign in?")) location.href="eatouts-login.html"; return; }
    S.events.save(eventSavePayload())
      .then(function(){ toast("Event saved to your account"); })
      .catch(function(){ toast("Saved on this device"); });
    return;
  }
  if(act==="postOnPromos"){
    const S=window.EatoutsCustomer;
    const payload=eventSavePayload();
    payload.promoPost={fee:50,currency:"BWP",status:"invoice_requested",requestedAt:Date.now()};
    if(S&&S.getUser()){ try{ S.events.save(payload); }catch(e){} }
    const msg="*PROMO POST REQUEST*\nEvent: "+(STATE.eventTitle||"Untitled Event")+
      (STATE.venue?("\nVenue: "+STATE.venue.name):"")+
      (firstWhen()?("\nWhen: "+firstWhen()):"")+
      "\nFee: P50 (promo listing)\n\nPlease send me an invoice for P50 to feature this event under Promos.";
    window.open("https://wa.me/26771844129?text="+encodeURIComponent(msg),"_blank");
    if(S&&S.getUser()&&window.fetch){
      const body={
        eventRef:eventRef(),
        title:STATE.eventTitle||"Untitled Event",
        venueId:(STATE.venue&&STATE.venue.id)||null,
        venueName:(STATE.venue&&STATE.venue.name)||null,
        whenText:firstWhen(),
        summary:STATE.eventDescription||null,
        imageRef:(STATE.flyerImages&&STATE.flyerImages[0])||null,
        fee:50,currency:"BWP",payload:payload
      };
      try{
        fetch("/api/customer/promo-submissions",{method:"POST",headers:{"content-type":"application/json"},credentials:"include",body:JSON.stringify(body)})
          .then(function(r){return r.json().catch(function(){return{};});})
          .then(function(d){ if(d&&d.ok) toast("Promo post queued for admin review · P50"); })
          .catch(function(){});
      }catch(e){}
    }
    toast("Promo post requested · P50 invoice");
    return;
  }

  // Prompt
  if(act==="closePrompt"){ STATE.prompt.open=false; render(); return; }
  if(act==="savePrompt"){ savePromptFromForm(); return; }
  if(act==="promptStepper"){
    const key=t.getAttribute("data-key");
    const delta=Number(t.getAttribute("data-delta"))||0;
    const input=document.querySelector('[data-prompt-field="'+key+'"]');
    if(input) input.value=Math.max(0,(Number(input.value)||0)+delta);
    return;
  }
  if(act==="togglePromptNote"){
    const key=t.getAttribute("data-key");
    STATE.prompt.values=STATE.prompt.values||{};
    const open=!STATE.prompt.values[key];
    STATE.prompt.values[key]=open;
    const box=document.querySelector('[data-note-box="'+key+'"]');
    if(box) box.style.display=open?"":"none";
    return;
  }
  if(act==="pickPromptThumb"){
    const key=t.getAttribute("data-key");
    const input=document.createElement("input");
    input.type="file";input.accept="image/*";
    input.onchange=function(){
      const f=input.files&&input.files[0];
      if(!f) return;
      const reader=new FileReader();
      reader.onload=function(ev){
        STATE.prompt.values=STATE.prompt.values||{};
        STATE.prompt.values[key]=ev.target.result;
        const thumb=document.querySelector('[data-act="pickPromptThumb"][data-key="'+key+'"]');
        if(thumb) thumb.innerHTML='<img src="'+ev.target.result+'" alt="">';
      };
      reader.readAsDataURL(f);
    };
    input.click();
    return;
  }
  if(act==="deletePrompt"){
    const dp=STATE.prompt;
    dp.open=false;
    if(dp.onDelete) dp.onDelete();
    render();
    return;
  }
});

// Input handler
document.addEventListener("input",function(e){
  const t=e.target;
  if(t.matches("[data-dfield]")){
    const i=Number(t.getAttribute("data-day"));
    const field=t.getAttribute("data-dfield");
    if(STATE.schedule.days[i]) STATE.schedule.days[i][field]=t.value;
    scheduleSave();
    return;
  }
  if(t.matches("[data-field]")){
    const k=t.getAttribute("data-field");
    if(k==="dresscode") STATE.eventDetails.dresscode=t.value;
    else if(k==="guestCount") STATE.eventDetails.guestCount=t.value;
    scheduleSave();
    return;
  }
  if(t.matches("[data-sup-qty]")||t.matches("[data-sup-addon]")||t.matches("[data-sup-notes]")){
    const field=t.getAttribute("data-field");
    const idx=Number(t.getAttribute("data-idx"));
    const entry=(STATE.suppliers[field]||[])[idx];
    if(!entry) return;
    const c=entry.customisations||(entry.customisations={});
    if(t.matches("[data-sup-qty]")) c.qty=t.value;
    else if(t.matches("[data-sup-addon]")) c["addon_"+t.getAttribute("data-sup-addon")]=t.value;
    else c.notes=t.value;
    scheduleSave();
    return;
  }
  if(t.id==="menuNotes"){
    STATE.menuOrderNotes=t.value;
    scheduleSave();
    return;
  }
  if(t.id==="stmSearch"){
    STATE.supplierTypeMenu.search=t.value;
    // Update the popup body in place for smooth typing
    const body=document.querySelector(".fpop-body");
    if(body && STATE.supplierTypeMenu.open){
      // re-render just the body via render()
    }
    // simple re-render (still fast enough)
    scheduleSave();
    return;
  }
});

// Special handler for STM search - re-render after typing to filter live
document.addEventListener("input",function(e){
  if(e.target.id==="stmSearch"){
    STATE.supplierTypeMenu.search=e.target.value;
    const val=e.target.value;
    const start=e.target.selectionStart;
    render();
    const inp=document.getElementById("stmSearch");
    if(inp){inp.focus();inp.setSelectionRange(start,start);}
  }
});

/* ============================================================
   SHARE MESSAGE
   ============================================================ */
function firstWhen(){
  const d=STATE.schedule.days&&STATE.schedule.days[0];
  if(!d||!d.startDate) return "";
  return d.startDate+(d.startTime?" "+d.startTime:"")+((d.endDate||d.endTime)?" → "+(d.endDate||"")+" "+(d.endTime||""):"");
}
function eventRef(){
  const base=(STATE.eventTitle||"event")+"-"+(STATE.venue?STATE.venue.id:"draft");
  return base.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"")||"event";
}
function eventFavItem(){
  return {type:"event",refId:eventRef(),title:STATE.eventTitle||"Untitled Event",
    subtitle:(STATE.venue?STATE.venue.name:"")+(firstWhen()?(" · "+firstWhen()):""),venueId:(STATE.venue&&STATE.venue.id)||null};
}
function eventFavHas(){
  try{ const S=window.EatoutsCustomer; return !!(S&&S.favourites&&S.favourites.has(eventFavItem())); }catch(e){ return false; }
}
function eventFavIcon(){ return "assets/icons/"+(eventFavHas()?"heart_active_icon.png":"heart_inactive_icon.png"); }
function eventSavePayload(){
  return {
    ref:eventRef(),
    type:"event",
    title:STATE.eventTitle||"Untitled Event",
    subtitle:(STATE.venue?STATE.venue.name:"")+(firstWhen()?(" · "+firstWhen()):""),
    meta:{venue:STATE.venue?STATE.venue.id:null,eventType:(STATE.eventType&&STATE.eventType.eventId)||null,
      when:firstWhen(),guests:totalGuests(),budget:STATE.showBudget?grandTotal():null,
      flyer:(STATE.flyerImages&&STATE.flyerImages[0])||null}
  };
}
function buildShareMessage(){
  const et=findEventType(STATE.eventType.eventId);
  const v=STATE.venue;
  let msg="*"+(STATE.eventTitle||"Untitled Event")+"*\n";
  if(et) msg+="Type: "+et.name+"\n";
  if(v) msg+="Venue: "+v.name+" ("+(v.city||"")+(v.area?" · "+v.area:"")+")\n";
  if(STATE.schedule.days.length && STATE.schedule.days[0].startDate){
    msg+="When: "+STATE.schedule.days.map(function(d,i){
      return "Day "+(i+1)+" "+(d.startDate||"")+" "+(d.startTime||"")+
        (d.endDate||d.endTime?" → "+(d.endDate||"")+" "+(d.endTime||""):"");
    }).join(" | ")+"\n";
  }
  if(totalGuests()) msg+="Guests: "+totalGuests()+"\n";
  const menuCount=STATE.menuFood.length+STATE.menuBeverages.length;
  if(menuCount) msg+="Menu items: "+menuCount+"\n";
  const supCount=Object.keys(STATE.suppliers).reduce(function(n,k){return n+(STATE.suppliers[k]||[]).length;},0);
  if(supCount) msg+="Suppliers: "+supCount+"\n";
  if(STATE.showBudget) msg+="Estimated budget: "+fmt(grandTotal())+"\n";
  if(STATE.eventDescription) msg+="\n"+STATE.eventDescription+"\n";
  msg+="\nPreview: https://eatouts.app/e/"+(v?v.id:"draft");
  return msg;
}

/* ============================================================
   BOOT
   ============================================================ */
(function boot(){
  loadDraft();
  try{
    var q=new URLSearchParams(location.search);
    var eid=q.get("event");
    if(eid){var et=findEventType(eid); if(et){
      STATE.eventType={eventId:et.id,name:et.name,categoryId:et.categoryId,
        categoryName:et.categoryName,subCategoryName:et.subCategoryName,
        description:et.description,icon:et.icon};
      }}
    var vid=q.get("venue");
    if(vid){
      var v=findVenue(vid);
      if(!v){
        /* Fallback: branch ids from groupedListing() may differ from the raw
           directory row ids used in EATOUTS_VENUES; match by venue name. */
        var want=String(q.get("vname")||"").trim().toLowerCase();
        v=getVenues().find(function(x){
          return String(x.name||"").trim().toLowerCase()===want;
        })||null;
      }
      if(v){STATE.venue=v; STATE.venueSpaces=[]; STATE.venueGalleryOpen=null;}
    }
  }catch(e){}
  if(!STATE.eventType.eventId || !STATE.venue){
    try{ location.replace("index.html"); }catch(err){}
    return;
  }
  render();
  /* Connectivity chip - shown only when offline (matches index.html) */
  var netChip=document.querySelector(".hdr-chip");
  function refreshNetChip(){if(netChip)netChip.style.display=navigator.onLine?"none":"";}
  window.addEventListener("online",refreshNetChip);
  window.addEventListener("offline",refreshNetChip);
  refreshNetChip();
  window.addEventListener("resize",function(){measureCalc();measureNav();measureFlyerTrack();});
  document.addEventListener("pointerdown",function(e){
    const track=e.target.closest?e.target.closest(".flyer-track"):null;
    _flyerDrag=track?{scrollLeft:track.scrollLeft}:null;
  },{passive:true});
  document.addEventListener("scroll",function(e){
    const track=e.target;
    if(!track||!track.classList)return;
    if(track.classList.contains("preview-hero-track")){
      const w=track.clientWidth; if(!w)return;
      const idx=Math.max(0,Math.min(STATE.flyerImages.length-1,Math.round(track.scrollLeft/w)));
      if(idx===STATE.previewHeroIndex)return;
      STATE.previewHeroIndex=idx;
      document.querySelectorAll(".preview-hero-dot").forEach(function(d,k){d.classList.toggle("on",k===idx);});
      return;
    }
    if(!track.classList.contains("flyer-track"))return;
    const w=track.clientWidth; if(!w)return;
    const idx=Math.max(0,Math.min(STATE.flyerImages.length-1,Math.round(track.scrollLeft/w)));
    if(idx===STATE.flyerIndex)return;
    STATE.flyerIndex=idx;
    document.querySelectorAll(".flyer-dot").forEach(function(d,k){d.classList.toggle("on",k===idx);});
  },{capture:true,passive:true});
  window.addEventListener("beforeunload",saveDraft);
})();
</script>
