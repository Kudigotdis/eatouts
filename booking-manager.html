<!doctype html>
<!-- PAGE: Booking manager --><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#ffffff"><title>Booking manager · EatOuts</title><link rel="stylesheet" href="assets/eatouts-manager.css"></head><body data-page="booking-manager"><div id="mount"></div><script src="js/eatouts-manager-db.js"></script><script src="assets/data/demo/the-food-place/demo-data.js"></script><script src="js/eatouts-manager-seed.js"></script><script src="js/eatouts-roles.js"></script><script src="js/eatouts-users.js"></script><script src="js/eatouts-feedback.js"></script><script src="js/eatouts-blog-admin.js"></script><script src="js/eatouts-auth.js"></script><script src="js/eatouts-manager.js"></script><script>document.addEventListener("DOMContentLoaded",()=>{const u=EO.guard({});if(!u)throw new Error("guard");document.querySelector("#mount").innerHTML=EO.shell("Booking manager","Supplier/lodge booking requests",`<div class="tabs"><button class="tab on">Requests</button><button class="tab">Calendar</button><button class="tab">History</button></div><div id="bookings" class="card"></div>`,{section:"Manager"});
const b=EO.business(),a=EatoutsMgrDB.filter("bookings",x=>x.businessId===b.id);document.querySelector("#bookings").innerHTML=a.length?a.map(x=>`<div class="listrow"><div class="listmain"><strong>${EO.esc(x.client||"Booking request")}</strong><small>${x.date||"TBC"} · ${EO.esc(x.service||"Service")} · ${EO.money(x.amount||0)}</small></div>${EO.status(x.status||"pending")}</div>`).join(""):"<div class='empty'>No booking requests yet.</div>";});</script></body></html>
