<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#ffffff"><title>Notifications · EatOuts</title><link rel="stylesheet" href="assets/eatouts-manager.css"></head><body><div id="mount"></div><script src="js/eatouts-manager-db.js"></script><script src="js/eatouts-roles.js"></script><script src="js/eatouts-users.js"></script><script src="js/eatouts-feedback.js"></script><script src="js/eatouts-blog-admin.js"></script><script src="js/eatouts-auth.js"></script><script src="js/eatouts-manager.js"></script><script>document.addEventListener("DOMContentLoaded",()=>{if(!EO.guard({"roles": ["platform_admin"]}))return;document.querySelector("#mount").innerHTML=EO.shell("Notifications","Push system messages to user segments",`<div class="card"><form id="n"><label class="field"><span>Segment</span><select name="segment"><option>All customers</option><option>Business owners</option><option>Suppliers</option><option>All users</option></select></label><label class="field"><span>Title</span><input name="title" required></label><label class="field"><span>Message</span><textarea name="message" required></textarea></label><button class="btn primary">Send notification</button></form></div><div class="card"><div class="card-title">Recent sends</div><div id="nlist"></div></div>`,{section:"Platform admin"});
function render(){document.querySelector("#nlist").innerHTML=EatoutsMgrDB.collection("notifications").slice().reverse().map(x=>`<div class="listrow"><div class="listmain"><strong>${EO.esc(x.title)}</strong><small>${x.segment} · ${x.created}</small></div>${EO.status("sent")}</div>`).join("")||"<div class='empty'>No notifications sent.</div>"}document.querySelector("#n").onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);EatoutsMgrDB.upsert("notifications",{id:"NT-"+Date.now(),segment:f.get("segment"),title:f.get("title"),message:f.get("message"),created:new Date().toISOString()});e.target.reset();render();EO.toast("Notification queued")};render();});</script></body></html>
