<!DOCTYPE html>
<!-- PAGE: Design Services -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Design Services — EatOuts</title>
<link rel="icon" type="image/png" href="assets/logo/EatOuts_Badge.png">
<style>
:root{--gold:#c9a84c;--black:#151515;--bg:#f7f6f3;--card:#fff;--text:#1b1b1b;--muted:#7a7466;--line:#ece7db;--soft:#faf8f2;--ok:#17834b;--warn:#946200;--danger:#a63d34;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#e9e5db;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:var(--text);font-size:14px;line-height:1.45}
::-webkit-scrollbar{width:0;height:0;display:none}
*{scrollbar-width:none;-ms-overflow-style:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;text-align:left}
img{display:block;max-width:100%}
#shell{position:fixed;inset:0;max-width:460px;margin:0 auto;display:flex;flex-direction:column;background:#fff;box-shadow:0 0 80px rgba(0,0,0,.08);overflow:hidden}
@media(min-width:520px){#shell{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
#hdr{flex:0 0 auto;height:58px;display:flex;align-items:center;gap:10px;padding:0 14px;background:#fff;border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.brand{font-weight:900;font-size:16px;letter-spacing:-.02em;color:var(--black)}
.brand span{color:var(--gold)}
.hdr-back{font-size:12.5px;font-weight:800;color:var(--gold)}
.hdr-back::before{content:"← ";font-weight:900}
.hdr-right{margin-left:auto;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.scroll{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:#fff;padding-bottom:calc(78px + env(safe-area-inset-bottom))}
.appnav{flex:0 0 auto;display:flex;align-items:center;justify-content:space-around;background:#fff;border-top:1px solid var(--line);padding:9px 4px calc(9px + env(safe-area-inset-bottom))}
.appnav a{display:grid;justify-items:center;gap:3px;font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#a89a7e;text-decoration:none}
.hero{padding:22px 16px 18px;background:#fff;border-bottom:1px solid var(--line)}
.hero .tag{font-size:10px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
.hero h1{margin:0 0 8px;font-size:24px;font-weight:900;letter-spacing:-.03em;line-height:1.15}
.hero p{margin:0;font-size:13px;color:var(--muted);line-height:1.5}
.hero-note{margin:10px 0 0;font-size:12px;font-weight:700;color:var(--muted)}
.cats{padding:12px 14px 10px;border-bottom:1px solid var(--line);background:#fff}
.cats-h{font-size:11px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.cat-chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.cat-chip{border:1px solid var(--line);background:#fff;padding:8px 11px;font-size:11px;font-weight:800;border-radius:999px;color:#5c5547;min-height:34px;display:inline-flex;align-items:center;gap:5px}
.cat-chip.active{background:var(--black);border-color:var(--black);color:#fff}
.list{padding:12px 14px}
.card{border:1px solid var(--line);background:#fff;margin-bottom:10px;overflow:hidden;border-radius:var(--r)}
.card-img{aspect-ratio:16/10;background:var(--soft);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:10px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;position:relative;overflow:hidden}
.card-img img{width:100%;height:100%;object-fit:cover}
.card-img .fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#f1ede0 0%,#e4ddc9 100%);color:#a89a7e}
.card-head{display:flex;align-items:flex-start;gap:10px;padding:12px 13px;width:100%;text-align:left}
.card-head .grow{flex:1;min-width:0}
.service-name{font-size:15px;font-weight:900;letter-spacing:-.01em;line-height:1.2}
.service-sub{font-size:16px;color:var(--muted);margin-top:3px;font-weight:600}
.price{font-size:14px;font-weight:900;color:var(--text);white-space:nowrap}
.price.mo small{font-size:10px;font-weight:700;color:var(--muted)}
.card-body{display:none;border-top:1px solid var(--line);padding:12px 13px 14px;background:#fbfaf8}
.card.open .card-body{display:block}
.card-body p{margin:0 0 10px;font-size:12.5px;color:#3a3324;line-height:1.5}
.subh{font-size:10.5px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:12px 0 6px}
.deliv{margin:0;padding:0 0 0 15px;font-size:12px;color:#3a3324;line-height:1.6}
.deliv li{margin:3px 0}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.micro{font-size:10.5px;color:var(--muted);font-weight:700}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;padding:4px 8px;border-radius:999px;background:var(--soft);border:1px solid var(--line);color:#5c5547}
.pill.warn{background:#fffbef;border-color:#ead8a8;color:var(--warn)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:11px;font-size:12.5px;font-weight:800;background:var(--soft);border:1px solid var(--line);color:#3a3324;text-decoration:none;gap:6px}
.btn:active{background:#efe9da}
.btn.primary{background:var(--black);color:#fff;border-color:var(--black)}
.btn.primary:active{background:#000}
.btn.full{width:100%;margin-top:10px}
.designer-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.designer-card{border:1px solid var(--line);padding:9px;border-radius:12px;background:#fff;overflow:hidden;text-align:center}
.designer-card.locked{opacity:.62}
.designer-top{display:flex;justify-content:center;margin-bottom:8px}
.av-btn{flex:0 0 auto;padding:0;border-radius:18px;overflow:hidden;display:block}
.av-wrap{position:relative;border-radius:16px;overflow:hidden;background:linear-gradient(135deg,#f1ede0,#e4ddc9);display:inline-flex;align-items:center;justify-content:center}
.av-wrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:16px}
.av-ini{display:inline-flex;align-items:center;justify-content:center;width:100%;height:100%;color:#a89a7e;font-weight:900;letter-spacing:.04em;text-transform:uppercase;border-radius:16px}
.designer-card h4{font-size:16px;font-weight:900;margin:0 0 3px;letter-spacing:-.01em;line-height:1.2}
.designer-card p{font-size:14px;color:var(--muted);margin:0 0 8px;line-height:1.35;font-weight:600}
.mosaic{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;border-radius:10px;margin-bottom:6px}
.mosaic .cell{flex:0 0 100%;scroll-snap-align:center;aspect-ratio:1/1;padding:0;border:0;background:var(--soft);border-radius:8px;overflow:hidden;position:relative}
.mosaic .cell img{width:100%;height:100%;object-fit:cover;display:block}
.mosaic .cell .fallback{width:100%;height:100%;background:linear-gradient(135deg,#f1ede0,#e4ddc9);display:flex;align-items:center;justify-content:center;color:#a89a7e;font-size:11px;font-weight:900;letter-spacing:.08em}
.mos-dots{display:flex;gap:5px;justify-content:center;align-items:center;width:100%;min-height:22px;margin:0 0 8px}
.mos-dots span{width:7px;height:7px;border-radius:50%;background:#d9d3c5;display:block}
.mos-dots span.on{background:var(--black)}
.designer-card .btn{min-height:36px;font-size:12.5px;padding:0 10px;width:100%;margin-top:0}
.seg{display:flex;gap:6px;margin-top:12px}
.seg-btn{flex:1;min-height:44px;border:1px solid var(--line);border-radius:11px;background:#fff;font-size:13px;font-weight:800;color:#5c5547;text-align:center;padding:0 8px}
.seg-btn.on{background:var(--black);border-color:var(--black);color:#fff}
.lb{position:fixed;inset:0;z-index:300;background:rgba(10,10,10,.94);display:flex;flex-direction:column}
.lb.hide{display:none}
.lb-top{display:flex;justify-content:flex-end;padding:calc(10px + env(safe-area-inset-top)) 12px 6px}
.lb-x{color:#fff;font-size:13px;font-weight:900;min-height:44px;padding:0 14px;border-radius:10px;background:rgba(255,255,255,.14);text-align:center}
.lb-cap{color:rgba(255,255,255,.72);font-size:13px;text-align:center;padding:0 16px 8px}
.lb-stage{flex:1 1 auto;display:flex;align-items:center;justify-content:center;padding:0 10px;overflow:hidden}
.lb-stage img{max-width:100%;max-height:100%;object-fit:contain;border-radius:10px}
.lb-ini{width:min(70vw,260px);height:min(70vw,260px);border-radius:22px;background:linear-gradient(135deg,#f1ede0,#e4ddc9);display:grid;place-items:center;color:#a89a7e;font-size:64px;font-weight:900}
.lb-dots{display:flex;gap:8px;justify-content:center;align-items:center;width:100%;padding:12px 0 calc(18px + env(safe-area-inset-bottom))}
.lb-dots span{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.35);display:block}
.lb-dots span.on{background:#fff}
.lb-grid{flex:1 1 auto;overflow-y:auto;columns:3;column-gap:5px;padding:0 10px calc(16px + env(safe-area-inset-bottom))}
.lb-grid img,.lb-grid .fallback{width:100%;display:block;margin:0 0 5px;break-inside:avoid;border-radius:4px;background:#1b1b1b;color:#a89a7e;font-size:11px;font-weight:900;letter-spacing:.08em}
.lb-grid .fallback{aspect-ratio:1/1;display:grid;place-items:center}
.field{margin:10px 0}
.field label{display:block;font-size:10px;color:var(--muted);font-weight:900;letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px}
.input{border:1px solid var(--line);min-height:44px;padding:11px 12px;background:#fbfaf8;border-radius:10px;font-size:13px;color:var(--text);outline:none;width:100%}
.input:focus{border-color:var(--black);background:#fff}
.input.area{min-height:76px;resize:vertical;font-family:inherit}
.summary{border:1px solid var(--line);padding:12px;margin:12px 0;background:#fbfaf8;border-radius:12px}
.sumrow{display:flex;justify-content:space-between;gap:10px;font-size:12px;padding:5px 0}
.sumrow.total{border-top:1px solid var(--line);margin-top:6px;padding-top:9px;font-size:14px;font-weight:900}
.sumrow.dim{color:var(--muted);font-size:11.5px}
.checkline{display:flex;gap:9px;align-items:flex-start;padding:11px 12px;background:#f5faf6;border:1px solid #d5e4d6;border-radius:10px;font-size:12px;line-height:1.5;margin:10px 0}
.checkline.alt{background:#fff;border-color:var(--line)}
.check{width:16px;height:16px;border:1.5px solid #777;border-radius:3px;flex:0 0 auto;margin-top:1px;background:#fff;position:relative}
.check.on{background:var(--black);border-color:var(--black)}
.check.on::after{content:"✓";position:absolute;top:-2px;left:2px;color:#fff;font-size:13px;font-weight:900}
.status-strip{border-left:3px solid var(--warn);padding:10px 12px;background:#fffbef;font-size:12px;margin:10px 0;border-radius:0 10px 10px 0;line-height:1.5}
.status-strip.ok{border-color:var(--ok);background:#f5faf6}
.step-wrap{position:relative;padding-left:26px}
.step-wrap:before{content:"";position:absolute;left:8px;top:20px;bottom:20px;width:1px;background:#cfc6b3}
.step{position:relative;border:1px solid var(--line);margin-bottom:10px;background:#fff;border-radius:var(--r);overflow:hidden}
.step:before{content:attr(data-n);position:absolute;z-index:2;left:-26px;top:16px;width:20px;height:20px;border:1px solid #b9a77f;background:#fff;border-radius:50%;display:grid;place-items:center;font-size:9px;font-weight:900}
.step.open{border-color:#b9a77f}
.step-img{height:96px;background:var(--soft);position:relative;overflow:hidden}
.step-img img{width:100%;height:100%;object-fit:cover}
.step-img .fallback{position:absolute;inset:0;background:linear-gradient(135deg,#f1ede0,#e4ddc9);display:flex;align-items:center;justify-content:center;color:#a89a7e;font-size:10px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}
.step-head{display:flex;align-items:center;gap:10px;padding:12px 13px;width:100%;text-align:left}
.step-head .grow{flex:1;min-width:0}
.step-title{font-size:14px;font-weight:900;letter-spacing:-.01em}
.step-sub{font-size:11.5px;color:var(--muted);margin-top:2px;font-weight:600}
.step-body{display:none;padding:12px 14px 15px;border-top:1px solid var(--line);background:#fbfaf8;font-size:12.5px;color:#3a3324;line-height:1.55}
.step.open .step-body{display:block}
.step-body h5{margin:0 0 6px;font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.deliv-tier{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);font-size:12px}
.deliv-tier:last-child{border:0}
.deliv-tier strong{font-weight:900;min-width:110px;flex:0 0 auto}
.summary-card{border:1px solid var(--line);padding:14px;background:#fff;border-radius:var(--r);margin:12px 0}
.action-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:460px;background:#fff;border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;z-index:40}
.action-bar .btn{flex:1;min-height:48px}
@media(min-width:520px){.action-bar{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
.hidden{display:none!important}
.toast{position:fixed;bottom:calc(70px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--black);color:#fff;padding:12px 22px;border-radius:12px;font-size:13px;font-weight:700;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none;max-width:92%;text-align:center}
.toast.on{opacity:1}
.empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:13px;line-height:1.6}
.footnote{padding:14px 16px 22px;font-size:16px;color:var(--muted);line-height:1.55;text-align:center}
.ds-workspace{text-align:center;padding:0 16px 26px;font-size:11.5px;color:var(--muted)}
.ds-workspace a{color:var(--black);font-weight:800;text-decoration:underline}
</style>
</head>
<body data-page="designer-services">
<div id="shell">
  <header id="hdr">
    <button class="hdr-back" id="hdrBack" type="button">EatOuts</button>
    <div class="brand">EAT<span>OUTS</span></div>
    <div class="hdr-right">Design Services</div>
  </header>

  <div class="scroll" id="view"></div>

  <div class="action-bar hidden" id="actionBar">
    <button class="btn ghost" id="btnBackStep">Back</button>
    <button class="btn primary" id="btnNextStep">Continue</button>
  </div>

  <nav class="appnav">
    <a href="index.html#promos">Promos</a>
    <a href="index.html#restaurants">Restaurants</a>
    <a href="index.html#reserve">Reserve</a>
    <a href="index.html#gallery">Gallery</a>
    <a href="index.html#about">About</a>
  </nav>
</div>
<div class="toast" id="toast"></div>
<div class="lb hide" id="lb"></div>

<script src="js/eatouts-db.js"></script>
<script src="js/eatouts-services-seed.js"></script>
<script src="js/eatouts-designers-seed.js"></script>
<script src="js/eatouts-brand-kit.js"></script>
<script>
(function(){
  'use strict';

  var S = window.EatoutsBrandKit;
  if(!S){ document.getElementById('view').innerHTML = '<div class="empty">Catalog unavailable.</div>'; return; }
  S.seedIfEmpty();

  /* ---------- state ---------- */
  var state = {
    step: 'catalogue',       /* catalogue | service | designer | brief | summary | done */
    category: null,
    serviceId: null,
    openServiceId: null,     /* which card is expanded in the list */
    designerId: null,
    designerTab: 'available', /* available | previous */
    lb: null,                /* lightbox: { items, i, grid } */
    /* brief */
    businessName: '',
    businessWhatsapp: '',
    industry: '',
    likes: '',
    dislikes: '',
    references: '',
    /* options */
    rush: false,
    extraRevisions: false,
    revealOptIn: false,
    onboardUpsell: true,
    founding: false,
    termsAccepted: false,
    /* output */
    job: null
  };

  /* ---------- helpers ---------- */
  function esc(s){
    return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function money(n){ return S.money(n); }
  function toast(m){
    var t = document.getElementById('toast');
    t.textContent = m; t.classList.add('on');
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ t.classList.remove('on'); }, 2200);
  }
  function el(id){ return document.getElementById(id); }
  function view(){ return el('view'); }
  function imgOrFallback(src, label, extraClass){
    var cls = extraClass ? ' '+extraClass : '';
    return '<div class="fallback'+cls+'">'+esc(label)+'</div>';
  }

  /* ---------- pricing preview ---------- */
  function currentPrice(){
    if(!state.serviceId) return null;
    var svc = S.serviceById(state.serviceId);
    if(!svc) return null;
    var codes = [];
    if(state.rush && !svc.is_recurring) codes.push('rush_48h');
    if(state.extraRevisions && !svc.is_recurring) codes.push('extra_rev_2');
    return S.calculatePrice(state.serviceId, {
      addOnCodes: codes,
      itemCount: 1,
      foundingGift: state.founding && svc.id === 'svc_brand_kit'
    });
  }

  /* ---------- availability ---------- */
  function designerAvailableFor(d, svc){
    if(S.isDesignerReserved(d.id)) return false;
    return svc && svc.is_recurring ? S.designerCanTakeRetainer(d) : S.designerCanTakeProject(d);
  }
  var OPEN_JOB_STATUSES = ['awaiting_admin','assigned','in_progress','draft_submitted','client_approved'];
  /* earliest date this designer could start, from the jobs already holding a slot */
  function availableFrom(d){
    var latest = 0;
    S.jobs().forEach(function(j){
      if(j.designer_id !== d.id || OPEN_JOB_STATUSES.indexOf(j.status) === -1) return;
      var start = (j.deadlines && j.deadlines.first_draft_due_by) || j.created_at || Date.now();
      var svc = S.serviceById(j.service_id);
      var days = (svc && svc.delivery_days) || d.avg_turnaround_days || 3;
      latest = Math.max(latest, start + days*86400000);
    });
    return latest || null;
  }
  function fmtDate(ms){
    try{ return new Date(ms).toLocaleDateString('en-GB', { day:'numeric', month:'short' }); }
    catch(e){ return new Date(ms).toDateString(); }
  }
  /* designers this browser has already requested work from (most recent first) */
  function previousDesigners(){
    var ids = [];
    S.jobs().slice().reverse().forEach(function(j){
      if(!j.designer_id || ids.indexOf(j.designer_id) !== -1) return;
      if(S.designerById(j.designer_id)) ids.push(j.designer_id);
    });
    return ids.map(function(id){ return S.designerById(id); });
  }
  function initials(name){
    return String(name||'?').split(/\s+/).map(function(w){ return w.charAt(0); }).slice(0,2).join('').toUpperCase();
  }
  function portfolioItems(d){
    var shots = (d.portfolio || []).filter(Boolean);
    if(!shots.length) return [{ ini: initials((d.private && d.private.full_name) || d.portfolio_style), label: d.portfolio_style || '' }];
    return shots.map(function(src){ return { src: src, label: d.portfolio_style || '' }; });
  }
  function avatarItem(d){
    var name = (d.private && d.private.full_name) || d.portfolio_style || '?';
    return d.photo ? { src: d.photo, label: d.portfolio_style || '' }
                   : { ini: initials(name), label: d.portfolio_style || '' };
  }

  /* ---------- renderers ---------- */
  function renderCatalogue(){
    var cats = S.allCategories();
    var services = S.allServices();
    var cat = state.category;
    var list = cat ? services.filter(function(s){ return s.category === cat; }) : services;
    var remaining = S.foundingRemaining();

    var h = '';
    h += '<div class="hero">';
    h += '<div class="tag">Design Services</div>';
    h += '<h1>Get anything designed for your business.</h1>';
    h += '<p>Logos, menus, promo graphics, event flyers, packaging and video — from local designers, delivered in a few days.</p>';
    h += '<p class="hero-note">From P120 · 15% platform fee';
    if(remaining > 0) h += ' · Founding: '+remaining+' of 20 left';
    h += '</p></div>';

    h += '<div class="cats">';
    h += '<div class="cats-h">What do you need?</div>';
    h += '<div class="cat-chips">';
    h += '<button class="cat-chip'+(cat?'':' active')+'" data-act="cat" data-val="">All</button>';
    cats.forEach(function(c){
      h += '<button class="cat-chip'+(cat===c.id?' active':'')+'" data-act="cat" data-val="'+esc(c.id)+'">'+esc(c.name)+'</button>';
    });
    h += '</div></div>';

    h += '<div class="list">';
    if(!list.length){
      h += '<div class="empty">No services in this category yet.</div>';
    }
    list.forEach(function(s){ h += renderServiceCard(s); });
    h += '</div>';

    h += '<div class="footnote">Every price includes the EatOuts 15% platform fee. The designer receives 85% on completion. Prices are one-time unless marked /month.</div>';
    h += '<div class="ds-workspace">Are you one of our designers? <a href="designer-dashboard.html">Open your workspace</a></div>';

    view().innerHTML = h;
    updateActionBar();
  }

  function renderServiceCard(s){
    var open = state.openServiceId === s.id;

  /* keep the carousel dots in step with the horizontal snap scroll */
  function wireMosaics(){
    Array.prototype.forEach.call(view().querySelectorAll('.mosaic'), function(m){
      var dots = m.parentNode.querySelector('.mos-dots');
      if(!dots) return;
      m.onscroll = function(){
        var i = Math.round(m.scrollLeft / Math.max(1, m.clientWidth));
        Array.prototype.forEach.call(dots.children, function(sp, n){ sp.className = (n === i ? 'on' : ''); });
      };
    });
  }

  /* ---------- lightbox (portfolio + avatar) ---------- */
  function openLightbox(items, i, grid){
    state.lb = { items: items, i: Math.max(0, Math.min(i || 0, items.length - 1)), grid: !!grid };
    renderLightbox();
  }
  function closeLightbox(){ state.lb = null; renderLightbox(); }
  function stepLightbox(dir){
    var o = state.lb;
    if(!o || o.grid) return;
    o.i = (o.i + dir + o.items.length) % o.items.length;
    renderLightbox();
  }
  function renderLightbox(){
    var lb = el('lb');
    if(!lb) return;
    if(!state.lb){ lb.className = 'lb hide'; lb.innerHTML = ''; return; }
    var o = state.lb;
    var it = o.items[o.i] || {};
    var h = '<div class="lb-top"><button class="lb-x" data-act="lbClose">Close</button></div>';
    if(o.grid){
      h += '<div class="lb-cap">'+esc(it.label || 'Work samples')+' · tap a photo to enlarge</div>';
      h += '<div class="lb-grid">';
      o.items.forEach(function(x, n){
        h += x.src ? '<img src="'+esc(x.src)+'" alt="" data-act="lbPick" data-i="'+n+'">'
                   : '<div class="fallback" data-act="lbPick" data-i="'+n+'">'+esc(x.ini || '')+'</div>';
      });
      h += '</div>';
    } else {
      h += '<div class="lb-stage">'+(it.src ? '<img src="'+esc(it.src)+'" alt="">' : '<div class="lb-ini">'+esc(it.ini || '?')+'</div>')+'</div>';
      h += '<button class="lb-dots" data-act="lbGrid" aria-label="See all work">';
      o.items.forEach(function(x, n){ h += '<span'+(n === o.i ? ' class="on"' : '')+'></span>'; });
      h += '</button>';
    }
    lb.innerHTML = h;
    lb.className = 'lb';
  }

  /* swipe left/right between photos (wired once — #lb is a permanent node) */
  (function wireLightboxSwipe(){
    var lb = el('lb');
    if(!lb) return;
    var x0 = 0;
    lb.addEventListener('touchstart', function(e){ x0 = (e.touches && e.touches[0]) ? e.touches[0].clientX : 0; }, { passive: true });
    lb.addEventListener('touchend', function(e){
      if(!state.lb || state.lb.grid) return;
      var t = e.changedTouches && e.changedTouches[0];
      var dx = t ? t.clientX - x0 : 0;
      if(Math.abs(dx) >= 40) stepLightbox(dx < 0 ? 1 : -1);
    });
  })();

  /* ---------- action bar ---------- */
  function updateActionBar(){
    var bar = el('actionBar');
    var step = state.step;
    if(step === 'catalogue'){
      bar.classList.add('hidden');
      return;
    }
    bar.classList.remove('hidden');
    if(step === 'done'){
      bar.classList.add('hidden');
      return;
    }
    var btnBack = el('btnBackStep');
    var btnNext = el('btnNextStep');
    if(step === 'brief'){
      btnBack.textContent = 'Back';
      btnNext.textContent = 'Review request';
    } else if(step === 'summary'){
      btnBack.textContent = 'Back';
      btnNext.textContent = 'Send my request';
    } else {
      btnBack.textContent = 'Back';
      btnNext.textContent = 'Continue';
    }
  }

  /* ---------- navigation ---------- */
  function goto(step){
    state.step = step;
    render();
    view().scrollTop = 0;
  }

  function render(){
    if(state.step === 'catalogue') return renderCatalogue();
    if(state.step === 'service')   return renderServiceDetail();
    if(state.step === 'designer')  return renderDesignerPicker();
    if(state.step === 'brief')     return renderBrief();
    if(state.step === 'summary')   return renderSummary();
    if(state.step === 'done')      return renderDone();
  }

  function validateBrief(){
    if(!state.businessName.trim()){ toast('Business name is required'); return false; }
    if(!state.businessWhatsapp.trim()){ toast('WhatsApp number is required'); return false; }
    if(!state.termsAccepted){ toast('Please accept the service terms'); return false; }
    return true;
  }

  function submitRequest(){
    if(!validateBrief()) return;
    var price = currentPrice();
    var svc = S.serviceById(state.serviceId);
    var refs = state.references.split(',').map(function(r){ return r.trim(); }).filter(Boolean).slice(0, 3);

    var job = S.createJob({
      service_id: svc.id,
      service_category: svc.category,
      service_name: svc.name,
      is_recurring: svc.is_recurring,
      business_name: state.businessName.trim(),
      business_whatsapp: state.businessWhatsapp.trim(),
      base_price: svc.base_price,
      add_ons: price.addOns,
      bundle_discount: 0,
      founding_discount: price.foundingDiscount,
      total: price.gross,
      platform_cut: price.platformCut,
      designer_payout: price.designerPayout,
      designer_id: state.designerId,
      brief: {
        industry: state.industry.trim(),
        likes: state.likes.trim(),
        dislikes: state.dislikes.trim(),
        references: refs
      },
      reveal_opt_in: state.revealOptIn,
      founding_gift: state.founding,
      onboard_upsell_checked: state.onboardUpsell,
      revision_rounds: svc.revision_rounds
    });

    state.job = job;
    state.step = 'done';
    render();

    /* Automatically open WhatsApp */
    setTimeout(function(){
      try{ window.open(S.whatsappLink(job), '_blank'); }catch(e){}
    }, 400);
  }

  /* ---------- click delegation ---------- */
  document.addEventListener('click', function(e){
    var t = e.target.closest('[data-act]');
    if(!t) return;
    var act = t.getAttribute('data-act');

    if(act === 'cat'){
      state.category = t.getAttribute('data-val') || null;
      state.openServiceId = null;
      renderCatalogue();
      return;
    }
    if(act === 'openService'){
      var id = t.getAttribute('data-id');
      state.openServiceId = (state.openServiceId === id) ? null : id;
      renderCatalogue();
      return;
    }
    if(act === 'pickService'){
      state.serviceId = t.getAttribute('data-id');
      state.rush = false;
      state.extraRevisions = false;
      state.founding = false;
      goto('service');
      return;
    }
    if(act === 'toggleRush'){ state.rush = !state.rush; renderServiceDetail(); return; }
    if(act === 'toggleExtraRev'){ state.extraRevisions = !state.extraRevisions; renderServiceDetail(); return; }
    if(act === 'toggleFounding'){ state.founding = !state.founding; renderServiceDetail(); return; }
    if(act === 'pickDesigner'){ state.designerId = t.getAttribute('data-id'); goto('brief'); return; }
    if(act === 'desTab'){
      state.designerTab = t.getAttribute('data-val') || 'available';
      renderDesignerPicker();
      return;
    }
    if(act === 'zoomAvatar'){
      var za = S.designerById(t.getAttribute('data-id'));
      if(za) openLightbox([avatarItem(za)], 0, false);
      return;
    }
    if(act === 'zoomPortfolio'){
      var zp = S.designerById(t.getAttribute('data-id'));
      if(zp) openLightbox(portfolioItems(zp), Number(t.getAttribute('data-i')) || 0, false);
      return;
    }
    if(act === 'lbGrid'){ if(state.lb) state.lb.grid = true; renderLightbox(); return; }
    if(act === 'lbPick'){
      if(state.lb){
        state.lb.grid = false;
        state.lb.i = Math.max(0, Math.min(Number(t.getAttribute('data-i')) || 0, state.lb.items.length - 1));
      }
      renderLightbox();
      return;
    }
    if(act === 'lbClose'){ closeLightbox(); return; }
    if(act === 'notifyMe'){
      var nd = S.designerById(t.getAttribute('data-id')) || {};
      var nmsg = 'Hi EatOuts — please notify me when the ' + (nd.portfolio_style || 'designer') + ' designer is free. I have design work waiting.';
      window.location.href = 'https://wa.me/' + S.adminWhatsapp() + '?text=' + encodeURIComponent(nmsg);
      return;
    }
    if(act === 'waitlist'){
      var n = S.adminWhatsapp();
      var msg = 'Hi EatOuts — I want to join the design services waitlist. All designers are currently engaged.';
      window.location.href = 'https://wa.me/' + n + '?text=' + encodeURIComponent(msg);
      return;
    }
    if(act === 'toggleOnboard'){ state.onboardUpsell = !state.onboardUpsell; renderBrief(); return; }
    if(act === 'toggleReveal'){ state.revealOptIn = !state.revealOptIn; renderBrief(); return; }
    if(act === 'toggleTerms'){ state.termsAccepted = !state.termsAccepted; renderBrief(); return; }
  });

  /* ---------- header back ---------- */
  el('hdrBack').addEventListener('click', function(){
    var step = state.step;
    if(step === 'catalogue'){ window.location.href = 'index.html'; return; }
    if(step === 'service'){ goto('catalogue'); return; }
    if(step === 'designer'){ goto('service'); return; }
    if(step === 'brief'){ goto('designer'); return; }
    if(step === 'summary'){ goto('brief'); return; }
    if(step === 'done'){ window.location.href = 'index.html'; return; }
  });

  /* ---------- action bar buttons ---------- */
  el('btnBackStep').addEventListener('click', function(){
    var step = state.step;
    if(step === 'service'){ goto('catalogue'); return; }
    if(step === 'designer'){ goto('service'); return; }
    if(step === 'brief'){ goto('designer'); return; }
    if(step === 'summary'){ goto('brief'); return; }
  });

  el('btnNextStep').addEventListener('click', function(){
    var step = state.step;
    if(step === 'service'){
      /* require nothing specific; go to designer */
      goto('designer'); return;
    }
    if(step === 'designer'){
      if(!state.designerId){ toast('Pick a designer first'); return; }
      goto('brief'); return;
    }
    if(step === 'brief'){
      if(!validateBrief()) return;
      goto('summary'); return;
    }
    if(step === 'summary'){
      submitRequest(); return;
    }
  });

  /* ---------- boot ---------- */
  render();
})();
</script>
</body>
</html>
