<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gallery — Eatouts</title>
<link rel="icon" type="image/png" href="assets/logo/EatOuts_Badge.png">
<link rel="apple-touch-icon" href="assets/logo/EatOuts_Badge.png">
<style>
:root{--gold:#c9a84c;--black:#151515;--bg:#f7f6f3;--card:#fff;--text:#1b1b1b;--muted:#7a7466;--border:#e7e4dd;--danger:#c43c3c;--radius:16px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;line-height:1.5}
.topbar{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:12px}
.brand{font-weight:900;font-size:16px;color:var(--black)}.brand span{color:var(--gold)}
.topbar .page{flex:1;font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.tabs{position:sticky;top:57px;z-index:49;background:#fff;border-bottom:1px solid var(--border);display:flex;overflow-x:auto;padding:0 8px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:12px 14px;font-size:12.5px;font-weight:800;color:var(--muted);text-decoration:none;border-bottom:2px solid transparent}
.tab.active{color:var(--black);border-bottom-color:var(--gold)}
.app{max-width:1180px;margin:0 auto;padding-bottom:130px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin:12px;padding:14px}
.grp{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin:12px;overflow:hidden}
.grp-hdr{padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer}
.grp-title{flex:1;font-weight:800;font-size:14.5px}
.grp-meta{font-size:11.5px;color:var(--muted);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px}
.cell{position:relative;aspect-ratio:1;overflow:hidden;background:#f0eee8;border-radius:8px}
.cell img{width:100%;height:100%;object-fit:cover;display:block}
.cell .rm{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.55);color:#fff;border:0;border-radius:50%;width:24px;height:24px;font-size:12px;font-weight:800;cursor:pointer}
.btn{min-height:44px;border:0;border-radius:12px;padding:0 16px;font:inherit;font-size:13px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-primary{background:var(--black);color:#fff}
.btn-gold{background:var(--gold);color:#fff}
.btn-ghost{background:transparent;border:1px solid var(--border);color:#3a3324}
.btn-danger{background:#fbeaea;color:var(--danger)}
.btn-sm{min-height:34px;padding:0 11px;font-size:11.5px;border-radius:9px}
.btn-full{width:100%}
.empty{border:1.5px dashed var(--border);border-radius:14px;padding:22px 16px;text-align:center;color:var(--muted);font-size:13px}
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:999px;font-size:10.5px;font-weight:800;text-transform:uppercase}
.badge.on{background:#e3f5e9;color:#17834b}
.badge.off{background:#eee;color:#999}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--black);color:#fff;padding:12px 22px;border-radius:12px;font-size:13px;font-weight:700;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.action-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:1180px;background:#fff;border-top:1px solid var(--border);border-left:1px solid var(--border);border-right:1px solid var(--border);border-radius:16px 16px 0 0;padding:12px 16px;display:flex;gap:10px;z-index:40;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
.action-bar .btn{flex:1}
.modal-scrim{position:fixed;inset:0;background:rgba(20,18,14,.55);z-index:100;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:701px){.modal-scrim{align-items:center;padding:20px}}
.modal{background:#fff;width:100%;max-width:560px;max-height:92vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;overflow:hidden}
@media(min-width:701px){.modal{border-radius:20px}}
.modal-hdr{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.modal-hdr h3{margin:0;font-size:15px;font-weight:800;flex:1}
.modal-body{padding:16px 20px;overflow-y:auto;flex:1}
.modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:10px;background:#fafaf7}
.modal-foot .btn{flex:1}
.field{margin-bottom:12px}
.field label{display:block;margin-bottom:6px;font-size:12.5px;font-weight:750;color:#3a3324}
input,textarea{width:100%;min-height:44px;border:1px solid var(--border);border-radius:12px;padding:10px 12px;background:#fff;font:inherit;font-size:13.5px;outline:0}
textarea{min-height:80px;resize:vertical}
input:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,168,76,.15)}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">EAT<span>OUTS</span></div>
  <div class="page">Gallery</div>
</header>
<nav class="tabs">
  <a class="tab" href="restaurant-onboarding.html">Restaurant</a>
  <a class="tab" href="menu-onboarding.html">Menu</a>
  <a class="tab" href="promo-onboarding.html">Promos</a>
  <a class="tab" href="event-onboarding.html">Events</a>
  <a class="tab active" href="gallery-onboarding.html">Gallery</a>
  <a class="tab" href="restaurant-dashboard.html">Dashboard</a>
</nav>
<main id="app" class="app"></main>
<div class="action-bar">
  <button class="btn btn-ghost" id="btnBack">← Back</button>
  <button class="btn btn-gold" id="btnNewGroup">+ Create Gallery Group</button>
</div>
<div id="toast" class="toast"></div>

<script src="js/eatouts-db.js"></script>
<script src="js/eatouts-auth.js"></script>
<script src="js/eatouts-owner-compat.js"></script>
<script>
/* Operator pages are only reachable through the About Us sign-in.
   This runs before any page content paints. */
if(!EatoutsAuth.requireSession()){EatoutsAuth.redirectToLogin();}
else{EatoutsAuth.applyActive();}
</script>
<script>
const DB_KEY=EatoutsDB.KEY;
const EMPTY_DB={version:1,restaurant:{id:'rest_001'},galleryGroups:[],galleryImages:[],settings:{currency:'BWP',currencySymbol:'P'}};
function dbLoad(){return EatoutsOwnerCompat.load();}
function dbSave(d){EatoutsOwnerCompat.save(d);}
function uid(p){return p+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800);}
let DB=dbLoad();function save(){dbSave(DB);render();}

function openForm({title,fields,values,onSave,saveLabel}){
  values=values||{};
  const scrim=document.createElement('div');scrim.className='modal-scrim';
  scrim.innerHTML=`<div class="modal">
    <div class="modal-hdr"><h3>${esc(title)}</h3><button class="btn btn-ghost btn-sm" data-close>Close</button></div>
    <div class="modal-body">${fields.map(f=>field(f,values[f.key])).join('')}</div>
    <div class="modal-foot"><button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-gold" data-save>${esc(saveLabel||'Save')}</button></div></div>`;
  document.body.appendChild(scrim);
  scrim.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>scrim.remove());
  scrim.querySelector('[data-save]').onclick=()=>{
    const out={};
    scrim.querySelectorAll('[name]').forEach(el=>{
      const k=el.getAttribute('name');
      if(el.type==='checkbox')out[k]=el.checked;
      else out[k]=el.value;
    });
    onSave(out);
  };
  return scrim;
}
function field(f,v){
  if(f.type==='textarea')return `<div class="field"><label>${esc(f.label)}</label><textarea name="${f.key}">${esc(v||'')}</textarea></div>`;
  if(f.type==='checkbox')return `<label style="display:flex;gap:8px;align-items:center;padding:8px 0;font-weight:700;font-size:13px"><input type="checkbox" name="${f.key}" ${v?'checked':''}> ${esc(f.label)}</label>`;
  return `<div class="field"><label>${esc(f.label)}</label><input name="${f.key}" value="${esc(v||'')}" placeholder="${esc(f.placeholder||'')}"></div>`;
}

/* ========== DEFAULT SEED ========== */
function seedIfEmpty(){
  if(!DB.galleryGroups.length){
    ['Food','Interior','Exterior','Events','Drinks','Atmosphere'].forEach((name,i)=>{
      DB.galleryGroups.push({id:uid('gg'),title:name,coverImageId:null,images:[],visible:true,order:i+1});
    });
    dbSave(DB);
  }
}

/* ========== RENDER ========== */
function render(){
  seedIfEmpty();
  const groups=DB.galleryGroups;
  let h=`<div class="card" style="display:flex;justify-content:space-between;align-items:center">
    <div><div style="font-weight:800;font-size:15px">Gallery</div>
    <div style="font-size:11.5px;color:var(--muted);margin-top:2px">${groups.length} group${groups.length===1?'':'s'}</div></div>
  </div>`;
  if(!groups.length)h+=`<div class="empty">No groups yet.</div>`;
  groups.forEach(g=>{
    h+=`<div class="grp">
      <div class="grp-hdr" data-act="toggleGrp" data-id="${g.id}">
        <div class="grp-title">${esc(g.title)} <span class="badge ${g.visible!==false?'on':'off'}">${g.visible!==false?'Visible':'Hidden'}</span></div>
        <div class="grp-meta">${g.images.length} image${g.images.length===1?'':'s'}</div>
      </div>`;
    if(OPEN[g.id]!==false){
      h+=`<div class="grid">`;
      g.images.forEach((im,i)=>{
        h+=`<div class="cell">
          ${im.src?`<img src="${esc(im.src)}" alt="">`:''}
          <button class="rm" data-act="delImg" data-g="${g.id}" data-i="${i}">✕</button>
        </div>`;
      });
      h+=`</div>`;
      h+=`<div style="padding:10px 14px;display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-ghost btn-sm" data-act="addImg" data-id="${g.id}">+ Add Image</button>
        <button class="btn btn-ghost btn-sm" data-act="editGrp" data-id="${g.id}">Rename</button>
        <button class="btn btn-ghost btn-sm" data-act="toggleVis" data-id="${g.id}">${g.visible!==false?'Hide':'Show'}</button>
        <button class="btn btn-ghost btn-sm" data-act="moveGrp" data-id="${g.id}" data-dir="-1">↑</button>
        <button class="btn btn-ghost btn-sm" data-act="moveGrp" data-id="${g.id}" data-dir="1">↓</button>
        <button class="btn btn-danger btn-sm" data-act="delGrp" data-id="${g.id}">Remove Group</button>
      </div>`;
    }
    h+=`</div>`;
  });
  document.getElementById('app').innerHTML=h;
}
const OPEN={};

function moveGrp(id,dir){
  const i=DB.galleryGroups.findIndex(x=>x.id===id);
  const j=i+dir;if(j<0||j>=DB.galleryGroups.length)return;
  const tmp=DB.galleryGroups[i];DB.galleryGroups[i]=DB.galleryGroups[j];DB.galleryGroups[j]=tmp;
  DB.galleryGroups.forEach((x,k)=>x.order=k+1);save();
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const act=t.getAttribute('data-act');const id=t.getAttribute('data-id');
  if(act==='toggleGrp'){OPEN[id]=OPEN[id]===false?true:false;render();return;}
  if(act==='editGrp'){const g=DB.galleryGroups.find(x=>x.id===id);openForm({title:'Rename Group',values:g,fields:[{key:'title',label:'Group title'}],onSave:v=>{g.title=v.title;save();}});return;}
  if(act==='toggleVis'){const g=DB.galleryGroups.find(x=>x.id===id);g.visible=g.visible===false?true:false;save();return;}
  if(act==='moveGrp'){moveGrp(id,Number(t.getAttribute('data-dir')));return;}
  if(act==='delGrp'){if(confirm('Remove this group and all its images?')){DB.galleryGroups=DB.galleryGroups.filter(x=>x.id!==id);save();}return;}
  if(act==='addImg'){
    const g=DB.galleryGroups.find(x=>x.id===id);
    openForm({title:'Add Image',fields:[{key:'src',label:'Image URL',placeholder:'assets/images/gallery/…'}],onSave:v=>{
      if(!v.src)return;g.images.push({id:uid('img'),src:v.src,visible:true,order:g.images.length+1});save();
    }});
    return;
  }
  if(act==='delImg'){
    const g=DB.galleryGroups.find(x=>x.id===t.getAttribute('data-g'));
    if(!g)return;g.images.splice(Number(t.getAttribute('data-i')),1);save();return;
  }
});

function newGroup(){
  openForm({title:'Create Gallery Group',fields:[
    {key:'title',label:'Group title',placeholder:'e.g. Rooftop'},
    {key:'visible',label:'Visible',type:'checkbox'}
  ],values:{visible:true},onSave:v=>{
    if(!v.title)return;
    DB.galleryGroups.push({id:uid('gg'),title:v.title,coverImageId:null,images:[],visible:v.visible,order:DB.galleryGroups.length+1});
    save();
  }});
}

document.getElementById('btnNewGroup').onclick=newGroup;
document.getElementById('btnBack').onclick=()=>history.back();

render();
</script>
</body>
</html>
