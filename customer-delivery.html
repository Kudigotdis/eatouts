<!DOCTYPE html>
<!-- PAGE: Delivery -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Delivery — EatOuts</title>
<link rel="icon" type="image/png" href="assets/logo/EatOuts_Badge.png">
<style>
:root{--ink:#1a1a1a;--bg:#faf8f2;--card:#ffffff;--muted:#a89a7e;--muted2:#8a8170;--bd:#ece7db;--bd2:#f1ece1;--ok:#17834b;--warn:#8a7a55;--danger:#c43c3c;--wa:#dff5e4;--wabd:#b8e6c1}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#e9e5db;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit;font-family:inherit}
button{cursor:pointer;border:0;background:none;text-align:left;padding:0}
img{display:block;max-width:100%}
::-webkit-scrollbar{width:0;height:0;display:none}
*{scrollbar-width:none;-ms-overflow-style:none}
#shell{position:fixed;inset:0;max-width:460px;margin:0 auto;display:flex;flex-direction:column;background:#fff;box-shadow:0 0 80px rgba(0,0,0,.08);overflow:hidden}
@media(min-width:520px){#shell{border-left:1px solid var(--bd);border-right:1px solid var(--bd)}}
#hdr{flex:0 0 auto;height:58px;display:flex;align-items:center;gap:10px;padding:0 14px;background:#fff;border-bottom:1px solid var(--bd);position:relative;z-index:58;padding-top:env(safe-area-inset-top)}
.brand-mark{height:34px;width:auto;aspect-ratio:1172/504;flex:0 0 auto;display:flex;align-items:center;justify-content:flex-start;background:none;border:0;border-radius:0;box-shadow:none;overflow:hidden;text-decoration:none}
.brand-mark img{width:100%;height:100%;object-fit:contain;display:block}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:8px}
/* ---- scroll fix: viewport is a positioning context, .scroll fills it ---- */
.viewport{flex:1 1 auto;position:relative;overflow:hidden;background:#fff}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:#fff}
#nav{flex:0 0 auto;position:relative;display:flex;background:#0a0a0a;border-top:1px solid #1a1a1a;padding-bottom:env(safe-area-inset-bottom);z-index:50}
.nav-btn{flex:1;padding:16px 2px 15px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.42);text-decoration:none;transition:color .18s}
.nav-btn svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav-btn:active{color:rgba(255,255,255,.75)}
/* Restaurant + order cards */
.rcard{display:flex;gap:12px;padding:14px;background:#fff;border-bottom:1px solid var(--bd)}
.rthumb{width:90px;height:90px;flex:0 0 auto;border-radius:12px;overflow:hidden;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:38px;border:1px solid var(--bd2)}
.rthumb img{width:100%;height:100%;object-fit:cover;display:block}
.rinfo{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.rname{font-size:18px;font-weight:900;color:var(--ink);line-height:1.2;letter-spacing:-.01em}
.rmeta{font-size:14px;color:var(--muted);margin-top:5px;font-weight:600;line-height:1.4}
.rmeta b{color:var(--ok);font-weight:800}
.osum{padding:15px 14px;background:#fff;border-bottom:1px solid var(--bd);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:100%}
.osum:active{background:var(--bg)}
.osum-line{display:flex;align-items:baseline;justify-content:center;gap:7px;flex-wrap:wrap;text-align:center}
.osum-lbl{font-size:9.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.osum-tot{font-size:20px;font-weight:900;color:var(--ink);letter-spacing:-.02em;line-height:1.1}
.osum-items{font-size:13px;color:var(--ink);font-weight:700}
/* Accordion — the .acc panel itself is the 3% grey container */
.acc{margin:12px 14px;background:rgba(0,0,0,.03);border:1px solid var(--bd);border-radius:14px;overflow:hidden;transition:border-color .2s}
.acc.locked{opacity:.55}
.acc.open{border-color:rgba(26,26,26,.05)}
.acc-hdr{width:100%;padding:14px 16px;display:flex;align-items:center;justify-content:center;gap:12px;background:transparent}
.acc-hdr:active{background:var(--bg)}
.acc-title{flex:1;min-width:0;text-align:center;border-radius:10px;transition:background .18s}
.acc.open .acc-title{background:rgba(0,0,0,.05);padding:7px 10px}
.acc-lbl{font-size:9.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;display:block}
.acc-val{font-size:13.5px;font-weight:800;color:var(--ink);line-height:1.3;display:block}
.acc-val.muted{color:var(--muted);font-style:italic;font-weight:600}
.acc-body{max-height:0;overflow:hidden;transition:max-height .3s cubic-bezier(.4,0,.2,1)}
.acc.open .acc-body{max-height:20000px}
.acc-in{padding:14px 16px 16px;border-top:1px solid var(--bd2)}
/* Fields */
.fld{margin-bottom:12px}
.fld:last-child{margin-bottom:0}
.fld label{display:block;font-size:9.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.fld input[type=text],.fld input[type=tel],.fld input[type=number],.fld input[type=date],.fld textarea{width:100%;min-height:44px;padding:11px 13px;background:var(--bg);border:1px solid var(--bd);border-radius:11px;font-size:13.5px;color:var(--ink);outline:none;transition:border-color .15s,background .15s}
.fld input:focus,.fld textarea:focus{border-color:var(--ink);background:#fff}
.fld textarea{min-height:80px;resize:vertical;line-height:1.5}
.fld .hint{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.45}
/* Searchable dropdown */
.drpset{position:relative}
.drp{width:100%;min-height:44px;padding:11px 13px;background:var(--bg);border:1px solid var(--bd);border-radius:11px;font-size:13.5px;color:var(--ink);display:flex;align-items:center;gap:8px;cursor:pointer;text-align:left}
.drp.ph{color:var(--muted)}
.drp:active{background:#f4efe4}
.drp-list{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1px solid var(--bd);border-radius:11px;box-shadow:0 10px 28px -10px rgba(0,0,0,.2);max-height:260px;overflow-y:auto;z-index:30;display:none}
.drp-list.open{display:block}
.drp-search{width:100%;padding:11px 13px;border:0;border-bottom:1px solid var(--bd2);font-size:13px;outline:none;background:var(--bg);border-radius:11px 11px 0 0}
.drp-opt{padding:11px 14px;font-size:13px;color:var(--ink);cursor:pointer;border-bottom:1px solid var(--bd2);display:flex;justify-content:space-between;gap:10px;align-items:center}
.drp-opt:last-child{border-bottom:0}
.drp-opt:hover,.drp-opt:active{background:var(--bg)}
.drp-opt.sel{background:var(--bg);font-weight:800}
.drp-opt small{font-size:10.5px;color:var(--muted);font-weight:700}
.drp-empty{padding:14px;font-size:12px;color:var(--muted);text-align:center}
/* Choice cards */
.choose{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choose-card{padding:14px 12px;border:1.5px solid var(--bd);border-radius:12px;background:#fff;text-align:left;cursor:pointer;min-height:98px;display:flex;flex-direction:column}
.choose-card:active{background:var(--bg)}
.choose-card.on{border-color:var(--ink);background:var(--bg)}
.choose-card b{font-size:12.5px;font-weight:900;color:var(--ink);line-height:1.2;margin-bottom:4px;display:block}
.choose-card .price{font-size:15px;font-weight:900;color:var(--ink);letter-spacing:-.01em;margin-bottom:4px;display:block}
.choose-card small{font-size:10.5px;color:var(--muted);font-weight:600;line-height:1.4;flex:1;display:block}
.choose-card.dim{opacity:.45}
/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:11px 16px;border-radius:11px;font-size:12.5px;font-weight:800;letter-spacing:.02em;background:var(--bg);border:1px solid var(--bd);color:var(--ink);font-family:inherit;cursor:pointer;text-decoration:none;transition:background .15s}
.btn:active{background:var(--bd2)}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.primary:active{background:#000}
.btn.ghost{background:transparent;color:var(--muted2)}
.btn.wa{background:var(--wa);border-color:var(--wabd);color:#1c6b2e}
.btn.full{width:100%}
.btn.half{flex:1}
.btn.sm{min-height:34px;padding:7px 12px;font-size:11px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
/* Slots */
.slots{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.slot{padding:12px 14px;border:1px solid var(--bd);border-radius:11px;background:#fff;text-align:left;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%}
.slot:active{background:var(--bg)}
.slot.on{border-color:var(--ink);background:var(--bg)}
.slot.full{opacity:.5;cursor:not-allowed}
.slot-lbl{font-size:13px;font-weight:800;color:var(--ink)}
.slot-sub{font-size:10.5px;color:var(--muted);font-weight:700;margin-top:2px;letter-spacing:.03em}
.slot-cap{font-size:11px;font-weight:800;color:var(--ok);flex:0 0 auto}
.slot.full .slot-cap,.slot.off .slot-cap{color:var(--muted2)}
/* Bar above nav */
.bar{flex:0 0 auto;background:#fff;border-top:1px solid var(--bd);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:10px}
.bar .btn.primary{flex:1;width:auto}
/* Sheet */
.sheet-scrim{position:fixed;inset:0;background:rgba(20,18,12,.5);z-index:100;display:none;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.sheet-scrim.on{display:flex;animation:fadeIn .18s ease}
.sheet{background:#fff;width:100%;max-width:420px;max-height:80dvh;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;animation:slideUp .22s cubic-bezier(.4,0,.2,1)}
.sheet-hdr{padding:14px 18px;border-bottom:1px solid var(--bd2);display:flex;align-items:center;gap:10px;flex:0 0 auto}
.sheet-hdr h3{margin:0;font-size:14.5px;font-weight:900;flex:1;color:var(--ink)}
.sheet-body{flex:1 1 auto;overflow-y:auto;padding:14px 18px}
.sheet-foot{padding:14px 18px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--bd2);background:#fafaf7;display:flex;gap:9px;flex:0 0 auto}
/* Line items */
.oline{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd2);align-items:flex-start}
.oline:last-child{border-bottom:0;padding-bottom:0}
.oline-info{flex:1;min-width:0;text-align:left}
.oline-name{font-size:13px;font-weight:800;color:var(--ink)}
.oline-meta{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.45}
.oline-price{font-size:13px;font-weight:900;color:var(--ink);flex:0 0 auto;padding-top:1px}
.oline-rm{font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--danger);padding:5px 9px;border-radius:7px;background:#fbeaea;border:1px solid #f0d1d1;cursor:pointer;font-family:inherit;flex:0 0 auto}
/* Textarea wrapper */
.wrap-tot{margin-top:12px;padding-top:12px;border-top:1px solid var(--bd2)}
.wrap-row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:12.5px;color:var(--muted2);font-weight:700}
.wrap-row.total{border-top:1px solid var(--bd);margin-top:6px;padding-top:9px;font-size:14px;color:var(--ink);font-weight:900}
.wrap-row.total b{font-weight:900;color:var(--ink)}
.msgbox{background:var(--bg);border:1px solid var(--bd);border-radius:11px;padding:14px;font-size:12px;line-height:1.6;color:var(--ink);white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;max-height:340px;overflow-y:auto}
.btn.danger{background:#fbeaea;border-color:#f0d1d1;color:var(--danger)}
/* Floating popup (gating + recipient viewer) */
.fpop-scrim{position:fixed;inset:0;background:rgba(20,18,12,.45);z-index:110;display:none;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
.fpop-scrim.on{display:block;animation:fadeIn .16s ease}
.fpop{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:calc(100% - 36px);max-width:400px;max-height:82dvh;overflow-y:auto;background:#fff;border-radius:16px;box-shadow:0 24px 60px -24px rgba(0,0,0,.45);padding:18px;z-index:120;display:none;flex-direction:column;gap:10px}
.fpop.on{display:flex;animation:fadeIn .16s ease}
.fpop-msg{font-size:14.5px;font-weight:800;color:var(--ink);text-align:center;line-height:1.5}
/* Floating dropdown list (area / property type / bank) */
.drp-list.float{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);right:auto;width:calc(100% - 36px);max-width:400px;max-height:70dvh;border-radius:16px;box-shadow:0 24px 60px -24px rgba(0,0,0,.45);z-index:120}
/* Attach-location button */
.gps-btn{width:100%;min-height:44px;display:flex;align-items:center;justify-content:center;gap:8px;background:rgba(0,0,0,.05);color:#4a463c;border:1px solid var(--bd);border-radius:11px;font-size:13px;font-weight:800;text-align:center;margin:0 0 12px}
.gps-btn:active{background:rgba(0,0,0,.08)}
.gps-btn.on{background:rgba(23,131,75,.1);color:var(--ok);border-color:rgba(23,131,75,.25)}
.hint.centre{text-align:center}
/* Recipient toggle + cards + viewer */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;background:rgba(0,0,0,.05);border-radius:13px;margin-bottom:14px}
.seg-btn{padding:11px 10px;border-radius:10px;font-size:13px;font-weight:800;color:var(--muted2);text-align:center}
.seg-btn.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px -4px rgba(0,0,0,.35)}
.rcpt-list{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.rcpt-card{display:flex;gap:12px;align-items:center;padding:10px;background:#fff;border:1.5px solid var(--bd);border-radius:13px;width:100%;text-align:left}
.rcpt-card.on{border-color:var(--ink);background:var(--bg)}
.rcpt-thumb{width:90px;height:90px;flex:0 0 auto;border-radius:12px;overflow:hidden;background:var(--bg);border:1px solid var(--bd2);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;color:var(--muted2)}
.rcpt-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.rcpt-pick{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;text-align:left}
.rcpt-name{font-size:14px;font-weight:900;color:var(--ink);line-height:1.25}
.rcpt-meta{font-size:12px;color:var(--muted);font-weight:700;margin-top:4px}
.rcpt-hero{width:150px;height:150px;margin:0 auto 12px;border-radius:16px;overflow:hidden;background:var(--bg);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:900;color:var(--muted2)}
.rcpt-hero img{width:100%;height:100%;object-fit:cover;display:block}
.rcpt-photo-pick{display:block;width:100%;text-align:center;font-size:11px;font-weight:800;color:var(--muted2);letter-spacing:.06em;text-transform:uppercase;margin-bottom:14px}
.rcpt-view-hero{width:100%;aspect-ratio:1/1;max-height:44dvh;border-radius:14px;overflow:hidden;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:52px;font-weight:900;color:var(--muted2)}
.rcpt-view-hero img{width:100%;height:100%;object-fit:cover;display:block}
.rcpt-view-name{font-size:16.5px;font-weight:900;text-align:center;margin-top:12px}
.rcpt-view-meta{font-size:12.5px;color:var(--muted);font-weight:700;text-align:center;margin-bottom:2px}
.rcpt-actions{display:flex;flex-direction:column;gap:8px}
/* Review page */
.review-page{margin:12px 14px 20px;padding:18px 16px;background:#fff;border:1px solid var(--bd);border-radius:16px}
.review-hdr{text-align:center;margin-bottom:14px}
.review-title{font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.review-sub{font-size:15px;font-weight:900;color:var(--ink);margin-top:5px}
.rev-sect{margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--bd2)}
.rev-lbl{font-size:9.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
#toast{position:fixed;bottom:calc(150px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:11px;font-size:12.5px;font-weight:800;z-index:200;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 40px);text-align:center}
#toast.on{opacity:1}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
</style>
</head>

    <a class="nav-btn" href="index.html#restaurants" aria-label="Restaurants"><svg viewBox="0 0 24 24"><path d="M3 9l1.5-5h15L21 9"/><path d="M3 9v11a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V9"/><path d="M3 9h18"/><path d="M9 13h6"/></svg></a>

</div>
<div class="fpop-scrim" id="fpopScrim"></div>
<div class="fpop" id="fpop" role="dialog" aria-modal="true"></div>
<div id="toast"></div>

<script>
(function(){
'use strict';

/* ============================================================
   SAFE STORAGE — file:// blocks localStorage in Firefox and some
   Chrome configurations. Every read/write goes through these
   wrappers so the page never crashes.
   ============================================================ */
function safeGet(key){
  try { return (window.localStorage ? window.localStorage.getItem(key) : null); }
  catch(e){ return null; }
}
function safeSet(key,val){
  try { if(window.localStorage) window.localStorage.setItem(key,val); }
  catch(e){}
}

/* ============================================================
   SHARED ORDER CONTEXT
   index.html writes eatouts_order_v1 when the customer taps
   "Delivery" on a checkout. We read the restaurant + itemised
   order from it, and write the chosen delivery back so index can
   show the fee and fold it into the WhatsApp message.
   ============================================================ */
var ORDER_KEY='eatouts_order_v1';

var DEMO_ORDER = {
  v:1, source:'menu',
  restaurant:{id:'the-yellow-giraffe',name:'The Yellow Giraffe Coffee Club',meta:'Gaborone · Kgale View',logo:null,whatsapp:'26771844129'},
  contact:{name:'',phone:'',notes:''},
  items:[
    {name:'The Big G Burger',size:null,qty:1,unit:125,extras:[{name:'Extra cheese',qty:1,price:10}],lineTotal:135},
    {name:'Cappuccino (Double)',size:null,qty:1,unit:35,extras:[],lineTotal:35},
    {name:'Chips',size:null,qty:2,unit:20,extras:[],lineTotal:40}
  ],
  subtotal:210, split:null, delivery:null
};

function loadOrder(){
  var raw=safeGet(ORDER_KEY);
  if(raw){ try{ var o=JSON.parse(raw); if(o&&o.restaurant) return o; }catch(e){} }
  return JSON.parse(JSON.stringify(DEMO_ORDER));
}
function saveOrder(){

   (address book or profile delivery location) when they open the

(function(){
  if(ORDER.delivery) return;
  var uid=null;
  try{ uid=safeGet('eatouts_auth_session_v1')||safeGet('eatouts_active_session_v2'); }catch(e){}
  if(!uid) return;
  var store={}; try{ store=JSON.parse(safeGet('eatouts_manager_v1')||'{}')||{}; }catch(e){ store={}; }
  var list=(store.addresses||[]).filter(function(x){return x.userId===uid;});

  var user=(store.users||[]).filter(function(x){return x.id===uid;})[0]||null;
  if(!addr&&user&&user.deliveryLocation){ addr={area:user.deliveryLocation.area,town:user.deliveryLocation.town,street:user.deliveryLocation.plot,contact:user.whatsapp}; }
  if(!addr) return;
  var wanted=String(addr.area||addr.town||'').toLowerCase();

    var match=null;
    (DL().allAreas()||[]).forEach(function(a){ var name=(a&&a.area)?a.area:(typeof a==='string'?a:''); if(!match&&String(name).toLowerCase()===wanted) match=name; });

  }
  if(addr.street||addr.plot) STATE.destination.street=addr.street||addr.plot;
  var num=String(addr.contact||(user&&user.whatsapp)||'').replace(/\D/g,'');
  if(num.indexOf('267')===0&&num.length>8) num=num.slice(3);

})();

/* ============================================================
   ORDER BRIDGE — persist a completed order into the shared
   stores the manager/customer/operator surfaces read:
     - EatoutsMgrDB 'orders'  (order-manager.html, eatouts-orders.html,
       and via the EatoutsData adapter the operator *1 workspaces)
     - eatouts_order_v1_history (the legacy union key the operator
       workspaces also merge against, deduped by id)
   Idempotent per order ref, so re-marking sent never duplicates.
   ============================================================ */
function resolveBusinessId(){
  var rid='';
  try{ rid=String((ORDER.restaurant&&(ORDER.restaurant.id||ORDER.restaurant.slug))||''); }catch(e){}
  var store={}; try{ store=JSON.parse(safeGet('eatouts_manager_v1')||'{}')||{}; }catch(e){ store={}; }
  var buses=Array.isArray(store.businesses)?store.businesses:[];
  function slugOf(b){ return String(b&&(b.slug||(b.identity&&b.identity.slug))||''); }
  var hit=buses.filter(function(b){ return String(b&&b.restaurantId||'')===rid || slugOf(b)===rid; })[0];
  if(hit) return hit.id;
  var rest=buses.filter(function(b){ return String(b&&b.type||'')==='restaurant'; })[0];
  return rest?rest.id:'biz-restaurant';
}
function persistCompletedOrder(){
  try{
    var d=new Date();
    function p(n){ return String(n).length<2?('0'+n):String(n); }
    var order={
      id:String(STATE.orderRef||('EO-'+Math.floor(Math.random()*9000)+1000)),
      businessId:resolveBusinessId(),
      customer:((ORDER.contact&&ORDER.contact.name)||'').trim()||'Delivery customer',
      items:(STATE.basket||[]).map(function(x){
        var n=String(x&&x.name||'Item');
        if(x&&x.size) n+=' ('+String(x.size)+')';
        if(x&&x.qty>1) n+=' x'+x.qty;
        return n;
      }),
      total:grandTotal(),
      status:'new',
      created:d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes()),
      delivery:STATE.deliveryMode==='schedule'?'Schedule delivery':'Deliver now',
      source:'whatsapp',
      restaurantId:(ORDER.restaurant&&ORDER.restaurant.id)||null,
      restaurant:{id:(ORDER.restaurant&&ORDER.restaurant.id)||null,name:(ORDER.restaurant&&ORDER.restaurant.name)||'',whatsapp:(ORDER.restaurant&&ORDER.restaurant.whatsapp)||'',meta:(ORDER.restaurant&&(ORDER.restaurant.meta||ORDER.restaurant.town||''))||''},
      meta:{
        subtotal:basketSubtotal(),
        deliveryFee:deliveryFee(),
        area:STATE.destination.area,
        tier:tierOf(),
        slotDate:STATE.slotDate||'',
        slotWindow:STATE.slotWindow||'',
        recipient:(STATE.recipient.first||STATE.recipient.isSelf)?{name:((STATE.recipient.first||'')+' '+(STATE.recipient.last||'')).trim()||(STATE.recipient.isSelf?'Self':'Recipient'),phone:((STATE.recipient.country||'')+' '+(STATE.recipient.number||'')).trim()}:null,
        payment:STATE.payment.method||'',
        notes:(ORDER.contact&&ORDER.contact.notes)||''
      }
    };
    var store={}; try{ store=JSON.parse(safeGet('eatouts_manager_v1')||'{}')||{}; }catch(e){ store={}; }
    if(!Array.isArray(store.orders)) store.orders=[];
    if(!store.orders.some(function(o){return String(o&&o.id||'')===String(order.id)})){ store.orders.unshift(order); safeSet('eatouts_manager_v1',JSON.stringify(store)); }
    var hist=[]; try{ hist=JSON.parse(safeGet('eatouts_order_v1_history')||'[]'); if(!Array.isArray(hist))hist=[]; }catch(e){ hist=[]; }
    if(!hist.some(function(o){return String(o&&o.id||o&&o.orderId||'')===String(order.id)})){ hist.unshift(order); safeSet('eatouts_order_v1_history',JSON.stringify(hist)); }
  }catch(e){}
}

  var search=((options||[]).length>6)?('<input class="drp-search" data-drp-search="'+esc(id)+'" placeholder="Search…" autocomplete="off">'):'';

/* --- 3. Schedule --- */
function renderSchedule(){
  var d=STATE.slotDate||todayISO();
  var w=STATE.slotWindow;
  var val=w?(formatDate(d)+' · '+w):'Choose a date and window';
  var body='';
  body+='<div class="fld"><label>Delivery date</label><input type="date" data-field="slotDate" value="'+esc(d)+'"></div>';
  body+='<div class="fld"><label>Available delivery windows</label>';
  body+='<div class="slots">';
  WINDOWS.forEach(function(win){
    var cap=SLOT_CAPACITY[win]||{cap:6,taken:0};
    var remaining=cap.cap-cap.taken;
    var isPast=new Date(d+'T00:00:00')<new Date(todayISO()+'T00:00:00');
    var isToday=d===todayISO();
    if(isToday){
      var now=new Date();
      var hh=parseInt(win.slice(0,2),10);
      if(hh<now.getHours()){ isPast=true }
    }
    if(isPast) return;
    var full=remaining<=0;
    var on=STATE.slotWindow===win;
    var capLabel=full?'Full':(remaining===1?'1 slot remaining':(remaining+' slots remaining'));
    body+='<button class="slot'+(on?' on':'')+(full?' full':'')+'" data-act="pickSlot" data-val="'+esc(win)+'"'+(full?' disabled':'')+'>'+
      '<span><span class="slot-lbl">'+esc(win)+'</span><span class="slot-sub">'+esc(WINDOW_HINTS[win]||'')+'</span></span>'+
      '<span class="slot-cap">'+esc(capLabel)+'</span>'+
    '</button>';
  });
  body+='</div>';
  body+='<div class="hint">Only windows the restaurant has opened for this destination appear. A slot is confirmed once the restaurant accepts your request.</div>';
  body+='</div>';
  return '<div class="'+accClass('schedule')+'">'+
    '<button class="acc-hdr" data-acc="schedule">'+
      '<span class="acc-title"><span class="acc-lbl">Delivery Date &amp; Time</span><span class="acc-val'+(w?'':' muted')+'">'+esc(val)+'</span></span>'+
    '</button>'+
    '<div class="acc-body"><div class="acc-in">'+body+'</div></div>'+
  '</div>';
}

function fullName(x){ return (((x&&x.first)||'')+' '+((x&&x.last)||'')).trim()||'Recipient'; }
function initials(x){
  var a=String((x&&x.first)||'?').charAt(0);
  var b=String((x&&x.last)||'').charAt(0);
  return (a+b).toUpperCase()||'?';
}
function recipientById(id){
  if(id==null||id==='') return null;
  return (STATE.recipients||[]).filter(function(x){return String(x.id)===String(id)})[0]||null;
}
function loadRecipients(){
  var arr=null;
  try{ arr=JSON.parse(safeGet('eatouts_recipients_v1')||'null'); }catch(e){ arr=null; }
  if(!Array.isArray(arr)){
    arr=[
      {id:'rc1',first:'Naledi',last:'Molefe',gender:'Female',country:'+267',number:'71234567',photo:'',orders:7},
      {id:'rc2',first:'Thabo',last:'Dube',gender:'Male',country:'+267',number:'72345678',photo:'',orders:3}
    ];
  }
  return arr;
}
function saveRecipients(){ safeSet('eatouts_recipients_v1',JSON.stringify(STATE.recipients||[])); }

function pickRecipient(id){
  var rc=recipientById(id);
  if(!rc) return;
  STATE.recipient.id=rc.id;
  STATE.recipient.isSelf=false;
  STATE.recipient.first=rc.first||'';
  STATE.recipient.last=rc.last||'';
  STATE.recipient.gender=rc.gender||'Prefer not to say';
  STATE.recipient.country=rc.country||'+267';
  STATE.recipient.number=rc.number||'';
  persistDelivery(); render();
  toast('Recipient set: '+fullName(rc));
}

function saveNewRecipient(){
  var n=STATE.newRec||{};
  if(!n.photo){ fpopAlert('Add a photo of the recipient before saving.'); return }
  if(!String(n.first||'').trim()||!String(n.last||'').trim()){ fpopAlert('First name and surname are required.'); return }
  if(String(n.number||'').replace(/\D/g,'').length<6){ fpopAlert('Enter a valid mobile number.'); return }
  var rc={
    id:'rc'+Date.now(),
    first:String(n.first).trim(), last:String(n.last).trim(),
    gender:n.gender||'Prefer not to say',
    country:n.country||'+267',
    number:String(n.number||'').replace(/\s+/g,''),
    photo:String(n.photo||''), orders:0
  };
  STATE.recipients.unshift(rc);
  saveRecipients();
  STATE.showNew=false;
  STATE.newRec={photo:'',first:'',last:'',gender:'Prefer not to say',country:'+267',number:''};
  pickRecipient(rc.id);
  toast('Recipient saved');
}

function saveRcEdit(){
  var rc=recipientById(STATE.popup&&STATE.popup.id);
  if(!rc) return;
  if(RC_EDIT.first!=null&&String(RC_EDIT.first).trim()) rc.first=String(RC_EDIT.first).trim();
  if(RC_EDIT.last!=null) rc.last=String(RC_EDIT.last).trim();
  if(RC_EDIT.number!=null) rc.number=String(RC_EDIT.number).replace(/\s+/g,'');
  saveRecipients();
  if(String(STATE.recipient.id)===String(rc.id)){
    STATE.recipient.first=rc.first;
    STATE.recipient.last=rc.last;
    STATE.recipient.number=rc.number;
  }
  RC_EDIT={};
  STATE.popup={kind:'rcpt',id:rc.id,edit:false};
  persistDelivery(); render();
  toast('Details updated');
}

function deleteRecipient(id){
  STATE.recipients=(STATE.recipients||[]).filter(function(x){return String(x.id)!==String(id)});

function renderPopup(){
  var scrim=document.getElementById('fpopScrim');

  var st=STATE.popup;
  if(!st){ scrim.classList.remove('on'); pop.classList.remove('on'); pop.innerHTML=''; return }
  var html='';
  if(st.kind==='alert'){
    html='<div class="fpop-msg">'+esc(st.msg)+'</div><button class="btn primary full" data-act="fpopClose">Got it</button>';
  } else if(st.kind==='rcpt'){
    html=renderRecipientViewer(st);

  pop.innerHTML=html;
  scrim.classList.add('on');
  pop.classList.add('on');

    el.oninput=function(){ RC_EDIT[el.getAttribute('data-rcedit')]=el.value; };

}

/* --- 7. WhatsApp --- */
function buildWAMessage(){
  var d=STATE.destination, r=STATE.recipient, p=STATE.payment;
  var lines=[];
  lines.push('EATOUTS DELIVERY REQUEST');
  lines.push('Order reference: '+STATE.orderRef);
  lines.push('Restaurant: '+(RESTAURANT.name||''));
  lines.push('');
  lines.push('DELIVERY TYPE');
  lines.push(STATE.deliveryMode?modeLabel(STATE.deliveryMode):'—');
  if(STATE.deliveryMode==='schedule' && STATE.slotWindow){
    lines.push('');
    lines.push('REQUESTED WINDOW');
    lines.push(formatDate(STATE.slotDate)+' · '+STATE.slotWindow);
  }
  lines.push('');
  lines.push('ITEMS');
  STATE.basket.forEach(function(it){
    lines.push(it.qty+' x '+it.name+(it.size?' ('+it.size+')':'')+'  '+money(it.lineTotal||(it.unit||0)*it.qty));
    (it.extras||[]).forEach(function(x){ if(x.qty>0) lines.push('   + '+x.qty+' x '+x.name); });
  });
  lines.push('');
  lines.push('ITEM SUBTOTAL: '+money(basketSubtotal()));
  lines.push('DELIVERY FEE: '+money(deliveryFee()));
  lines.push('ESTIMATED TOTAL: '+money(grandTotal()));
  lines.push('');
  lines.push('DESTINATION');
  if(d.area) lines.push('Area: '+d.area);
  if(d.tier) lines.push('Tier: '+tierLabel(d.tier));
  if(d.plot) lines.push('Plot: '+d.plot);
  if(d.propType){ var pt=PROPERTY_TYPES.filter(function(x){return x.id===d.propType})[0]; if(pt){ lines.push('Property: '+pt.name); } }
  Object.keys(d.cond||{}).forEach(function(k){
    if(!d.cond[k])return;
    var lbl=k;
    if(d.propType){ var p2=PROPERTY_TYPES.filter(function(x){return x.id===d.propType})[0]; if(p2){ p2.cond.forEach(function(c){if(c.k===k) lbl=c.l}) } }
    lines.push(lbl+': '+d.cond[k]);
  });
  if(d.street) lines.push('Street: '+d.street);
  if(d.directions){ lines.push(''); lines.push('DIRECTIONS'); lines.push(d.directions); }
  lines.push('');
  lines.push('RECIPIENT');
  lines.push('Name: '+(r.first||'')+' '+(r.last||''));
  lines.push('Mobile: '+(r.country||'+267')+' '+(r.number||''));
  lines.push('');
  lines.push('PAYMENT PREFERENCE');
  lines.push(p.method==='cash'?'Cash on Delivery':(p.method==='card'?'Card / Swipe on Delivery'+(p.bank?' · '+p.bank:''):'—'));
  lines.push('');
  lines.push('SLOT STATUS');
  lines.push('Requested. Awaiting restaurant confirmation.');
  lines.push('');
  lines.push('Please confirm order acceptance and the requested delivery window.');
  return lines.join('\n');
}

    '</div>';
  }
  return '<div class="'+accClass('wa')+'">'+
    '<button class="acc-hdr" data-acc="wa">'+
      '<span class="acc-title"><span class="acc-val'+(STATE.sent?'':' muted')+'">'+esc(val)+'</span></span>'+
    '</button>'+
    '<div class="acc-body"><div class="acc-in">'+body+'</div></div>'+
  '</div>';
}

/* ============================================================
   BOTTOM BAR — a single wide primary button (no left info block).
   ============================================================ */
function renderBar(){
  var bar=document.getElementById('bar');
  var n=basketCount();
  var label;
  if(!STATE.deliveryMode) label='Choose a delivery method';
  else label='Add '+money(deliveryFee())+' to '+money(basketSubtotal())+' for '+n+' item'+(n===1?'':'s');
  bar.innerHTML='<button class="btn primary" data-act="barPrimary">'+esc(label)+'</button>';
}

/* ============================================================
   BINDINGS
   ============================================================ */
function bindInputs(){
  document.querySelectorAll('[data-field]').forEach(function(el){
    el.oninput=el.onchange=function(){
      var k=el.getAttribute('data-field');
      if(k==='street'||k==='plot'||k==='directions'||k==='mapLink'){ STATE.destination[k]=el.value; persistDelivery(); }
      else if(k==='slotDate'){ STATE.slotDate=el.value; if(STATE.slotWindow){ STATE.slotWindow='' } persistDelivery(); render(); return; }
      else if(k==='isSelf'){ STATE.recipient.isSelf=el.checked; if(el.checked){STATE.recipient.first='Kagiso';STATE.recipient.last='Sithole';STATE.recipient.number='71100001'} persistDelivery(); render(); return; }
      else if(k==='first'||k==='last'||k==='number'){ STATE.recipient[k]=el.value; persistDelivery(); }
      renderBar();
    };
  });
  document.querySelectorAll('[data-newrec]').forEach(function(el){
    el.oninput=function(){ STATE.newRec[el.getAttribute('data-newrec')]=el.value; };
  });
  document.querySelectorAll('[data-cond]').forEach(function(el){
    el.oninput=function(){ STATE.destination.cond[el.getAttribute('data-cond')]=el.value; persistDelivery(); };
  });
}

/* ============================================================
   EVENT DELEGATION
   ============================================================ */
document.addEventListener('click',function(e){
  var drpSearch=e.target.closest('[data-drp-search]');
  if(drpSearch){
    var q=drpSearch.value.toLowerCase();
    var list=drpSearch.parentElement.querySelectorAll('.drp-opt');
    Array.prototype.forEach.call(list,function(o){
      o.style.display=o.textContent.toLowerCase().indexOf(q)>-1?'':'none';
    });
    return;
  }

  var drpOpen=e.target.closest('[data-drp-open]');
  if(drpOpen){
    var id=drpOpen.getAttribute('data-drp-open');
    STATE.openDrp=STATE.openDrp===id?null:id;
    render();
    if(STATE.openDrp){
      var s=document.querySelector('[data-drp-search="'+STATE.openDrp+'"]');
      if(s) s.focus();
    }
    return;
  }
  var drpPick=e.target.closest('[data-drp-pick]');
  if(drpPick){
    var id2=drpPick.getAttribute('data-drp-pick');
    var val=drpPick.getAttribute('data-drp-val');
    applyPick(id2,val);
    STATE.openDrp=null;
    render();
    return;
  }

  if(e.target.closest('[data-act="backToOrder"]')){
    window.location.href='index.html?resume=1#restaurants';
    return;
  }

  var acc=e.target.closest('[data-acc]');
  if(acc){
    var id3=acc.getAttribute('data-acc');
    if(id3!=='method' && !STATE.deliveryMode){ fpopAlert('Choose a delivery method first'); return }
    STATE.openAcc[id3]=!STATE.openAcc[id3];
    render();
    return;
  }
  var mode=e.target.closest('[data-act="pickMode"]');
  if(mode){ STATE.deliveryMode=mode.getAttribute('data-val'); if(STATE.deliveryMode!=='schedule'){ STATE.slotWindow='' } persistDelivery(); render(); return }
  var slot=e.target.closest('[data-act="pickSlot"]');
  if(slot){ STATE.slotWindow=slot.getAttribute('data-val'); persistDelivery(); render(); return }
  var pay=e.target.closest('[data-act="pickPay"]');
  if(pay){ STATE.payment.method=pay.getAttribute('data-val'); persistDelivery(); render(); return }
  if(e.target.closest('[data-act="openWA"]')){
    if(!isComplete()){ toast('Complete the delivery sections first'); return }
    var msg=buildWAMessage();
    window.open('https://wa.me/'+waTarget()+'?text='+encodeURIComponent(msg),'_blank');
    return;
  }
  if(e.target.closest('[data-act="copyWA"]')){
    var txt=buildWAMessage();
    if(navigator.clipboard) navigator.clipboard.writeText(txt).then(function(){toast('Message copied')},function(){toast('Copy failed')});
    else toast('Copy not available');
    return;
  }
  if(e.target.closest('[data-act="markSent"]')){
    STATE.sent=!STATE.sent;
    if(STATE.sent){ persistCompletedOrder(); toast('Order added to the venue queue'); }
    render();
    return;
  }
  if(e.target.closest('[data-act="barPrimary"]')){
    if(!STATE.deliveryMode){ STATE.openAcc['method']=true; render(); scrollToAcc('method'); return }
    window.location.href='index.html?resume=1#restaurants';
    return;
  }
  if(e.target.closest('[data-act="openMethod"]')||e.target.closest('[data-act="reviewEdit"]')){
    if(!STATE.deliveryMode){ fpopAlert('Choose a delivery method first'); return }
    STATE.openAcc['method']=true; render(); scrollToAcc('method');
    return;
  }
  if(e.target.closest('[data-act="reviewDelete"]')){
    STATE.deliveryMode=null;
    STATE.slotWindow='';
    STATE.destination={area:'',street:'',plot:'',propType:'',cond:{},directions:'',mapLink:'',tier:null,gps:null};
    STATE.recipient={isSelf:true,id:null,first:'',last:'',gender:'Prefer not to say',country:'+267',number:''};
    STATE.payment={method:'',bank:''};
    ORDER.delivery=null;
    saveOrder();
    render();
    toast('Delivery details deleted');
    return;
  }
  if(e.target.closest('[data-act="pickGps"]')){ pickGps(); return }
  var who=e.target.closest('[data-act="recipWho"]');
  if(who){
    STATE.recipient.isSelf=(who.getAttribute('data-val')==='me');
    if(STATE.recipient.isSelf&&!STATE.recipient.first){
      STATE.recipient.first='Kagiso'; STATE.recipient.last='Sithole'; STATE.recipient.number='71100001';
    }
    persistDelivery(); render();
    return;
  }
  var rcPick=e.target.closest('[data-act="rcPick"]');
  if(rcPick){ pickRecipient(rcPick.getAttribute('data-id')); return }
  var rcView=e.target.closest('[data-act="rcView"]');
  if(rcView){ STATE.popup={kind:'rcpt',id:rcView.getAttribute('data-id'),edit:false}; render(); return }
  if(e.target.closest('[data-act="rcNew"]')){
    STATE.showNew=!STATE.showNew;
    if(STATE.showNew) STATE.recipient.isSelf=false;
    render();
    return;
  }
  if(e.target.closest('[data-act="rcSaveNew"]')){ saveNewRecipient(); return }
  if(e.target.closest('[data-act="rcEdit"]')){
    STATE.popup={kind:'rcpt',id:(STATE.popup&&STATE.popup.id)||null,edit:true};
    render();
    return;
  }
  if(e.target.closest('[data-act="rcSaveEdit"]')){ saveRcEdit(); return }
  if(e.target.closest('[data-act="rcDelete"]')){ if(STATE.popup&&STATE.popup.id) deleteRecipient(STATE.popup.id); return }
  if(e.target.closest('[data-act="fpopClose"]')){ STATE.popup=null; render(); return }
});

function openMapsPick(){
  try{ window.open('https://www.google.com/maps','_blank'); }catch(e){}
}
function pickGps(){
  if(navigator.geolocation&&navigator.geolocation.getCurrentPosition){
    navigator.geolocation.getCurrentPosition(function(pos){
      var lat=pos&&pos.coords?pos.coords.latitude:null;
      var lng=pos&&pos.coords?pos.coords.longitude:null;
      if(lat==null||lng==null){ openMapsPick(); return }
      STATE.destination.gps={lat:lat,lng:lng};
      STATE.destination.mapLink='https://maps.google.com/?q='+lat+','+lng;
      persistDelivery(); render();
      toast('Location attached');
    },function(){ openMapsPick(); });
    return;
  }
  openMapsPick();
}
function attachPhoto(dataUrl,rcId){
  if(!dataUrl) return;
  if(rcId==null){
    STATE.newRec.photo=dataUrl;
  } else {
    var rc=recipientById(rcId);
    if(!rc) return;
    rc.photo=dataUrl;
    saveRecipients();
  }
  render();
  toast('Photo attached');
}
document.addEventListener('change',function(e){
  var el=e.target;
  if(!el||String(el.tagName||'').toUpperCase()!=='INPUT'||el.type!=='file') return;
  var isNew=el.hasAttribute('data-newphoto');
  var rcId=el.getAttribute('data-rcphoto');
  if(!isNew&&!rcId) return;
  var file=el.files&&el.files[0];
  if(!file) return;
  var rd=new FileReader();
  rd.onload=function(){ attachPhoto(String(rd.result||''),isNew?null:rcId); };
  rd.readAsDataURL(file);
});

function scrollToAcc(id){
  setTimeout(function(){
    var el=document.querySelector('[data-acc="'+id+'"]');
    if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
  },40);
}

/* ============================================================
   APPLY PICK
   ============================================================ */
function applyPick(id,val){
  var d=STATE.destination;
  if(id==='area'){
    d.area=val;
    var t=DL()&&DL().tierFor?DL().tierFor(val):null;
    d.tier=t?t.id:null;
  }
  else if(id==='propType'){ d.propType=val; d.cond={}; }
  else if(id==='gender'){ if(STATE.showNew){ STATE.newRec.gender=val; } else { STATE.recipient.gender=val; } }
  else if(id==='mobileCC'){ STATE.recipient.country=val; }
  else if(id==='newCC'){ STATE.newRec.country=val; }
  else if(id==='bank'){ STATE.payment.bank=val; }
}

/* ============================================================
   INIT
   ============================================================ */
STATE.slotDate=STATE.slotDate||todayISO();
if(STATE.recipient.isSelf && !STATE.recipient.first){
  STATE.recipient.first='Kagiso';
  STATE.recipient.last='Sithole';
  STATE.recipient.number='71100001';
}

try {
  render();
} catch (err) {
  var el=document.getElementById('scroll');
  if(el) el.innerHTML=
    '<div style="padding:40px 20px;color:#c43c3c;font-family:-apple-system,sans-serif;font-size:13px;line-height:1.7">'+
      '<b>EatOuts Delivery failed to start.</b><br><br>'+
      (err && err.message ? err.message : String(err))+
      '<br><br><span style="color:#7a7466;font-size:11px">Press F12 → Console for the full stack.</span>'+
    '</div>';
  if(window.console && console.error) console.error(err);
}
})();
</script>
