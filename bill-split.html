<body data-page="bill-split">
<div id="shell">
  <header id="hdr">
    <div class="bs-brand" aria-label="EatOuts">EatOuts</div>

  <main id="bill-main">
    <section class="bill-screen" data-page="bill-split" id="bill-screen" aria-label="Split the bill">
      <div class="placeholder-msg">Loading split bill…</div>

</div>

      <button class="secondary-action" data-act="close-photo" type="button">Done</button>

</div>

    <p>Splitting stays free — sending shares on WhatsApp or saving this order needs a free EatOuts account.</p>
    <a class="primary-action" href="eatouts-customer-signup.html" target="_top">Create free account</a>
    <a class="secondary-action" href="eatouts-login.html?next=index.html" target="_top">Log in</a>
    <button class="secondary-action" type="button" data-act="close-account-lock">Not now · keep exploring</button>

</div>

</noscript>

      { id:"c7", name:"Still Water",     category:"Drinks",  price:15,  desc:"500ml bottled water.", photo:"",
        sizes:[ {index:0,label:"500ml",price:15,priceText:"P15.00"} ] }
    ]
  };

  function fmt(n){ return "P" + (Number(n)||0).toFixed(2); }
  function findLine(key){ for(var i=0;i<state.lines.length;i++){ if(state.lines[i].key===key) return state.lines[i]; } return null; }
  function findPerson(id){ for(var i=0;i<state.people.length;i++){ if(state.people[i].id===id) return state.people[i]; } return null; }

  function snapshot(){
    var lines = state.lines.map(function(l){
      var assigned = 0;
      Object.keys(l.assignedById).forEach(function(k){ assigned += Number(l.assignedById[k]) || 0; });
      return {
        key: l.key,
        name: l.name,
        size: l.size || "",
        unit: l.unit,
        unitText: fmt(l.unit),
        photo: l.photo || "",
        desc: l.desc || "",
        extras: l.extras || [],
        assignedById: Object.assign({}, l.assignedById),
        unassigned: Math.max(0, l.qty - assigned)
      };
    });

    var people = state.people.map(function(p){
      var count = 0, total = 0;
      lines.forEach(function(l){
        var q = Number(l.assignedById[p.id] || 0);
        count += q;
        total += q * l.unit;
      });
      return {
        id: p.id, name: p.name, photo: p.photo || "", phone: p.phone || "",
        gender: p.gender || "", ageBand: p.ageBand || "", relationship: p.relationship || "",
        paymentMethod: p.paymentMethod || "", occasion: p.occasion || "", note: p.note || "",
        itemCount: count, total: total, totalText: fmt(total)
      };
    });

    var itemCount = lines.reduce(function(a,l){
      return a + (l.unassigned + Object.keys(l.assignedById).reduce(function(s,k){ return s + (Number(l.assignedById[k])||0); },0));
    }, 0);

    var total = lines.reduce(function(a,l){
      var q = Object.keys(l.assignedById).reduce(function(s,k){ return s + (Number(l.assignedById[k])||0); },0) + l.unassigned;
      return a + q * l.unit;
    }, 0);

    return {
      restaurant: state.restaurant,
      people: people,
      lines: lines,
      itemCount: itemCount,
      total: total,
      totalText: fmt(total),
      catalog: state.catalog,
      categories: state.categories,
      orderName: state.orderName,
      orderNotes: state.orderNotes
    };
  }

  function shareLines(id){
    var out = [];
    state.lines.forEach(function(l){
      var q = Number(l.assignedById[id] || 0);
      if(q > 0) out.push("• " + l.name + (l.size ? " (" + l.size + ")" : "") + " ×" + q + " — " + fmt(q * l.unit));
    });
    return out;
  }

  window.EatoutsBillSplitBridge = {

    format: fmt,
    snapshot: snapshot,
    signedIn: function(){ return true; },

    addPerson: function(name){
      name = String(name || "").trim();
      if(!name) return null;
      var dup = state.people.some(function(p){ return p.name.toLowerCase() === name.toLowerCase(); });
      if(dup) return null;
      var id = "p" + (++seq);
      state.people.push({ id:id, name:name, photo:"", phone:"", gender:"", ageBand:"", relationship:"", paymentMethod:"", occasion:"", note:"" });
      return id;
    },

    removePerson: function(id){
      state.people = state.people.filter(function(p){ return p.id !== id; });
      state.lines.forEach(function(l){ delete l.assignedById[id]; });
      return true;
    },

    updatePerson: function(arg){
      var p = findPerson(arg.id);
      if(!p) return false;
      if(arg.field === "name"){
        var name = String(arg.value || "").trim();
        if(!name) return false;
        var dup = state.people.some(function(x){ return x.id !== p.id && x.name.toLowerCase() === name.toLowerCase(); });
        if(dup) return false;
        p.name = name;
        return true;
      }
      p[arg.field] = arg.value;
      return true;
    },

    assignQty: function(arg){
      var line = findLine(arg.key);
      if(!line) return false;
      var others = 0;
      Object.keys(line.assignedById).forEach(function(k){
        if(k !== arg.id) others += Number(line.assignedById[k]) || 0;
      });
      var max = Math.max(0, line.qty - others);
      var next = Math.max(0, Math.min(Number(arg.qty) || 0, max));
      if(next > 0) line.assignedById[arg.id] = next;
      else delete line.assignedById[arg.id];
      return true;
    },

    moveOneTo: function(arg){
      var line = findLine(arg.key);
      if(!line) return false;
      var donors = Object.keys(line.assignedById).filter(function(k){
        return k !== arg.id && Number(line.assignedById[k]) > 0;
      });
      if(!donors.length) return false;
      donors.sort(function(a,b){ return Number(line.assignedById[b]) - Number(line.assignedById[a]); });
      var from = donors[0];
      line.assignedById[from] = Number(line.assignedById[from]) - 1;
      if(line.assignedById[from] <= 0) delete line.assignedById[from];
      line.assignedById[arg.id] = (Number(line.assignedById[arg.id]) || 0) + 1;
      return true;
    },

    balanceShares: function(){
      var prev = state.lines.map(function(l){
        return { key: l.key, assignedById: Object.assign({}, l.assignedById) };
      });
      if(state.people.length < 2) return prev;

      var units = [];
      state.lines.forEach(function(l){
        l.assignedById = {};
        for(var i = 0; i < l.qty; i++) units.push({ key: l.key, unit: l.unit });
      });
      units.sort(function(a,b){ return b.unit - a.unit; });

      var totals = {};
      state.people.forEach(function(p){ totals[p.id] = 0; });

      units.forEach(function(u){
        var best = state.people[0].id;
        state.people.forEach(function(p){ if(totals[p.id] < totals[best]) best = p.id; });
        totals[best] += u.unit;
        var line = findLine(u.key);
        line.assignedById[best] = (Number(line.assignedById[best]) || 0) + 1;
      });

      return prev;
    },

    restoreAssignments: function(prev){
      if(!prev) return false;
      prev.forEach(function(entry){
        var line = findLine(entry.key);
        if(line) line.assignedById = Object.assign({}, entry.assignedById);
      });
      return true;
    },

    addMenuItem: function(arg){
      var item = null;
      for(var i = 0; i < state.catalog.length; i++){
        if(String(state.catalog[i].id) === String(arg.itemId)) { item = state.catalog[i]; break; }
      }
      if(!item) return false;
      var sizes = item.sizes && item.sizes.length ? item.sizes : [{ index:0, label:"Regular", price:item.price }];
      var size = sizes[Number(arg.sizeIdx) || 0] || sizes[0];
      var key = "m" + item.id + "-" + (size.index || 0);

      var line = findLine(key);
      if(line){
        line.qty += 1;
        line.assignedById[arg.personId] = (Number(line.assignedById[arg.personId]) || 0) + 1;
      } else {
        var newLine = {
          key: key,
          name: item.name,
          size: sizes.length > 1 ? size.label : "",
          unit: size.price,
          qty: 1,
          assignedById: {},
          desc: item.desc || "",
          photo: item.photo || "",
          extras: []
        };
        newLine.assignedById[arg.personId] = 1;
        state.lines.push(newLine);
      }
      return true;
    },

    sharePerson: function(id){
      var p = findPerson(id);
      if(!p) return false;
      var s = snapshot();
      var person = null;
      for(var i=0;i<s.people.length;i++){ if(s.people[i].id === id) person = s.people[i]; }
      if(!person) return false;
      var text = "Hi " + person.name + ", here is your share at " + s.restaurant.name + ":\n\n" +
        shareLines(id).join("\n") + "\n\nTotal: " + person.totalText + "\n\nSent via EatOuts";
      window.alert("WhatsApp share preview\n\n" + text);
      return true;
    },

    sendFullBill: function(vals){
      var name = String((vals && vals.name) || "").trim();
      if(!name) return false;
      var s = snapshot();
      var text = "Split bill — " + s.restaurant.name + "\nOrdered by " + name + "\n\n";
      s.lines.forEach(function(l){
        var parts = [];
        Object.keys(l.assignedById).forEach(function(pid){
          var person = s.people.filter(function(p){ return p.id === pid; })[0];
          if(person) parts.push(person.name + " ×" + l.assignedById[pid]);
        });
        text += "• " + l.name + (l.size ? " (" + l.size + ")" : "") + " — " + parts.join(", ") +
                (l.unassigned ? (parts.length ? ", " : "") + "unassigned ×" + l.unassigned : "") + "\n";
      });
      text += "\nBill total: " + s.totalText;
      if(vals && vals.notes) text += "\nNotes: " + vals.notes;
      window.alert("WhatsApp hand-off preview\n\n" + text);
      return true;
    },

    returnToCheckout: function(){ window.alert("Demo: this would close the split screen and return to checkout."); return true; },
    addDelivery: function(){ window.alert("Demo: this would open the delivery details screen."); return true; },
    backToMenu: function(){ window.alert("Demo: this would go back to the restaurant menu."); return true; },
    sendStandardOrder: function(){ window.alert("Demo: this would send the standard (non-split) order via WhatsApp."); return true; },
    openReview: function(){ window.alert("Demo: this would open the WhatsApp review screen."); return true; },
    saveSummary: function(){ window.alert("Demo: order summary saved locally."); return true; },
    requestDeleteSummary: function(){
      if(window.confirm("Delete this saved order summary?")){ window.alert("Demo: summary deleted."); }
      return true;
    }
  };
})();
</script>

<script>
window.onerror = function(msg, src, line, col){
  try {
    var box = document.getElementById("fatal-error");
    if (box) {
      box.style.display = "block";
      box.textContent += "Error: " + msg + "\n  at " + src + ":" + line + ":" + col + "\n\n";
    }
  } catch(e) {}
};

(function(){
  "use strict";

  /* ---- Safe bridge lookup ---------------------------------------------------
     Inside the app this page is mounted in #billSplitHost, so the host bridge
     is the live cart and must win over the demo bridge on `window`. Every
     parent/opener read is wrapped because a cross-origin frame throws. */
  var bridge = null;

  try {
    if (window.parent && window.parent !== window && window.parent.EatoutsBillSplitBridge) {
      bridge = window.parent.EatoutsBillSplitBridge;
    }
  } catch(e) { /* cross-origin parent — ignore */ }

  if (!bridge) {
    try {
      if (window.EatoutsBillSplitBridge) bridge = window.EatoutsBillSplitBridge;
    } catch(e) {}
  }

  if (!bridge) {
    try {
      if (window.opener && !window.opener.closed && window.opener.EatoutsBillSplitBridge) {
        bridge = window.opener.EatoutsBillSplitBridge;
      }
    } catch(e) { /* cross-origin opener — ignore */ }
  }

  try {
    if (window.parent && window.parent !== window) document.body.classList.add("embedded");
  } catch(e) {}

  /* ---- State --------------------------------------------------------------- */
  var root = document.getElementById("bill-screen");
  var ui = {mode:"split",openPerson:null,openAdd:false,tabs:{},openItems:{},openCatalog:null,
    selectedPerson:null,search:"",category:"All",orderOpen:false,photoPerson:null,
    undoAssignments:null,orderName:"",orderNotes:"",toastTimer:null};
  var snap = null;

  /* ---- Helpers ------------------------------------------------------------- */
  function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
  function initials(name){return String(name||"?").trim().split(/\s+/).slice(0,2).map(function(x){return x.charAt(0);}).join("").toUpperCase()||"?";}
  function amount(n,formatted){if(formatted)return formatted;if(bridge&&bridge.format)return bridge.format(n||0);return Number(n||0).toFixed(2);}
  function getSnapshot(){
    try {
      if (bridge && typeof bridge.snapshot === "function") return bridge.snapshot();
    } catch(e) { console.error(e); }
    return null;
  }
  function personById(id){
    if (!snap || !snap.people) return null;
    for (var i = 0; i < snap.people.length; i++) if (snap.people[i].id === id) return snap.people[i];
    return null;
  }
  function personAvatar(p){
    var inner = p && p.photo ? '<img src="'+esc(p.photo)+'" alt="'+esc(p.name)+'">' : '<span class="avatar-initials">'+esc(initials(p&&p.name))+'</span>';
    return '<button class="person-avatar" type="button" data-act="open-photo" data-id="'+esc(p.id)+'" aria-label="View '+esc(p.name)+' profile image">'+inner+'</button>';
  }
  function itemImage(src,name){
    return src ? '<img src="'+esc(src)+'" alt="'+esc(name||"Menu item")+'">' : '<span class="item-photo-fallback">EO</span>';
  }
  function lineForPerson(p,line){
    return (line.assignedById && line.assignedById[p.id]) || 0;
  }
  function splitMetrics(){
    var total = snap.itemCount || 0, assigned = 0;
    (snap.lines || []).forEach(function(l){
      assigned += Object.keys(l.assignedById || {}).reduce(function(a,k){ return a + (Number(l.assignedById[k])||0); }, 0);
    });
    return {total:total, assigned:assigned, unassigned:Math.max(0,total-assigned)};
  }

  /* ---- Renderers ----------------------------------------------------------- */
  function renderHero(){
    var m = splitMetrics(), people = snap.people || [];
    var pct = m.total ? Math.min(100, Math.round(m.assigned/m.total*100)) : 0;
    var personText = people.length + " " + (people.length===1?"person":"people");
    return '<section class="hero">'+
      '<div class="eyebrow">Total bill</div>'+
      '<div class="hero-total">'+esc(amount(snap.total, snap.totalText))+'</div>'+
      '<div class="hero-summary"><strong>'+m.total+'</strong> item'+(m.total===1?"":"s")+' across <strong>'+personText+'</strong></div>'+
      '<div class="progress-copy">'+(m.unassigned ? m.unassigned+" item"+(m.unassigned===1?"":"s")+" still to assign" : "Every item has a person")+'</div>'+
      '<div class="progress-track" aria-label="'+pct+' percent assigned"><div class="progress-fill" style="width:'+pct+'%"></div></div>'+
      '</section>';
  }

  function renderSmartBalance(){
    if (!snap.people || snap.people.length < 2) return "";
    var hasAssignments = (snap.lines || []).some(function(l){
      return Object.keys(l.assignedById || {}).some(function(k){ return (Number(l.assignedById[k])||0) > 0; });
    });
    return '<div class="smart-row">'+
      '<button class="smart-btn" type="button" data-act="balance">Balance shares</button>'+
      (ui.undoAssignments ? '<button class="smart-undo" type="button" data-act="undo-balance">Undo</button>' : '')+
      '<div class="smart-hint">'+(hasAssignments ? "Auto-arrange whole items to bring each share closer in value." : "Assign items first, or let EatOuts balance them.")+'</div>'+
      '</div>';
  }

  function renderPersonMenuTab(p){
    var rows = (snap.lines || []).filter(function(l){ return lineForPerson(p,l) > 0; });
    var out = '<div class="item-list">';
    if (!rows.length) out += '<div class="empty-card">No items assigned yet. Add items from the menu or let the person choose their share.</div>';
    rows.forEach(function(l){
      var q = lineForPerson(p,l), opened = ui.openItems[p.id+"|"+l.key];
      var extras = (l.extras || []).filter(function(x){ return x.qty > 0; });
      var donorExists = Object.keys(l.assignedById || {}).some(function(pid){ return pid !== p.id && (Number(l.assignedById[pid])||0) > 0; });
      var addLabel = Number(l.unassigned||0) > 0 ? "Add one" : "Move one here";
      var canAdd = Number(l.unassigned||0) > 0 || donorExists;
      out += '<article class="item-card">'+
        '<button class="item-head" type="button" data-act="toggle-item" data-id="'+esc(p.id)+'" data-key="'+esc(l.key)+'" aria-expanded="'+(opened?"true":"false")+'">'+
          '<span class="item-photo">'+itemImage(l.photo,l.name)+'</span>'+
          '<span class="item-info"><span class="item-name">'+esc(l.name)+(l.size?' · '+esc(l.size):'')+'</span><span class="item-price">'+esc(amount(l.unit,l.unitText))+' each</span></span>'+
          '<span class="item-qty">× '+q+'</span>'+
        '</button>'+
        (opened ? '<div class="item-detail">'+
          (l.desc ? '<p class="item-desc">'+esc(l.desc)+'</p>' : '')+
          (extras.length ? '<p class="item-extras">Extras: '+extras.map(function(x){return esc(x.name)+' × '+x.qty;}).join(' · ')+'</p>' : '')+
          '<div class="quantity-control">'+
            '<button type="button" data-act="qty-minus" data-id="'+esc(p.id)+'" data-key="'+esc(l.key)+'">Remove one</button>'+
            '<span class="quantity-count">'+q+'</span>'+
            '<button type="button" data-act="'+(Number(l.unassigned||0)>0?"qty-plus":"qty-move")+'" data-id="'+esc(p.id)+'" data-key="'+esc(l.key)+'" '+(!canAdd?"disabled":"")+'>'+addLabel+'</button>'+
          '</div>'+
          '<div class="quantity-note">'+esc(amount(q*l.unit))+' assigned to '+esc(p.name)+'.</div>'+
        '</div>' : '')+
        '</article>';
    });
    out += '</div><button class="add-menu-btn" type="button" data-act="open-menu" data-id="'+esc(p.id)+'">Add from Menu</button>';
    return out;
  }

  function selectField(p,label,key,options){
    var val = p[key] || "";
    return '<div class="field"><label for="profile-'+esc(p.id)+'-'+esc(key)+'">'+esc(label)+'</label>'+
      '<select id="profile-'+esc(p.id)+'-'+esc(key)+'" data-profile-field="'+esc(key)+'" data-id="'+esc(p.id)+'">'+
      '<option value="">Not provided</option>'+options.map(function(o){return '<option value="'+esc(o[0])+'" '+(val===o[0]?"selected":"")+'>'+esc(o[1])+'</option>';}).join("")+
      '</select></div>';
  }

  function renderPersonDetails(p,isPrimary){
    var h = '<div class="fields">';
    h += '<div class="field"><label for="profile-'+esc(p.id)+'-name">Name</label><input class="inline-name" id="profile-'+esc(p.id)+'-name" type="text" maxlength="32" value="'+esc(p.name)+'" data-profile-field="name" data-id="'+esc(p.id)+'" placeholder="Tap to edit name"></div>';
    h += '<div class="field"><label for="profile-'+esc(p.id)+'-phone">Mobile number</label><input id="profile-'+esc(p.id)+'-phone" type="tel" inputmode="tel" value="'+esc(p.phone||"")+'" data-profile-field="phone" data-id="'+esc(p.id)+'" placeholder="e.g. +267 71 234 567"><div class="help">Optional. Include the country code to send their share directly on WhatsApp.</div></div>';
    h += selectField(p,"Gender","gender",[["male","Male"],["female","Female"]]);
    h += selectField(p,"Age range","ageBand",[["18-24","18–24"],["25-34","25–34"],["35-44","35–44"],["45-54","45–54"],["55+","55+"]]);
    h += selectField(p,"Relationship to the group","relationship",[["host","Host / organiser"],["friend","Friend"],["family","Family"],["partner","Partner"],["colleague","Colleague"],["guest","Guest"],["other","Other"]]);
    h += selectField(p,"Preferred payment method","paymentMethod",[["cash","Cash"],["mobile-money","Mobile money"],["card","Card"],["bank-transfer","Bank transfer"],["not-sure","Not decided"]]);
    if (isPrimary) h += selectField(p,"What is the occasion?","occasion",[["casual","Casual meal"],["birthday","Birthday"],["celebration","Celebration"],["family","Family outing"],["business","Business meal"],["date","Date"],["other","Other"]]);
    h += '<div class="field"><label for="profile-'+esc(p.id)+'-note">Notes</label><textarea id="profile-'+esc(p.id)+'-note" data-profile-field="note" data-id="'+esc(p.id)+'" placeholder="Anything useful to remember about this share">'+esc(p.note||"")+'</textarea></div>';
    h += '</div><div class="stats-note">These details are optional. EatOuts uses non-identifying group trends to understand how people split restaurant bills. Names, phone numbers, photos and notes are not included in split statistics.</div>';
    return h;
  }

  function renderPersonCard(p,index){
    var open = ui.openPerson === p.id, tab = ui.tabs[p.id] || "items", isPrimary = index === 0;
    var itemCount = Number(p.itemCount) || 0;
    var summary = amount(p.total, p.totalText) + " for " + itemCount + " item" + (itemCount===1?"":"s");
    var h = '<article class="person-card'+(open?" open":"")+'" data-person-card="'+esc(p.id)+'">';
    h += '<div class="person-head">'+personAvatar(p)+
      '<button class="person-head-main" type="button" data-act="toggle-person" data-id="'+esc(p.id)+'" aria-expanded="'+(open?"true":"false")+'">'+
        '<span class="person-name">'+esc(p.name)+'</span>'+
        '<span class="person-sub"><strong>'+esc(summary)+'</strong></span>'+
        '<span class="person-tag">'+(isPrimary?"PRIMARY SHARE":"PERSON "+(index+1))+'</span>'+
      '</button>'+
      (isPrimary ? '' : '<button class="person-remove" type="button" data-act="remove-person" data-id="'+esc(p.id)+'" aria-label="Remove '+esc(p.name)+'">Remove</button>')+
      '</div>';
    if (open) {
      h += '<div class="person-body">'+
        '<div class="person-tabs" role="tablist" aria-label="'+esc(p.name)+' details">'+
          '<button type="button" class="'+(tab==="items"?"on":"")+'" data-act="switch-tab" data-id="'+esc(p.id)+'" data-tab="items" role="tab" aria-selected="'+(tab==="items")+'">Menu items</button>'+
          '<button type="button" class="'+(tab==="details"?"on":"")+'" data-act="switch-tab" data-id="'+esc(p.id)+'" data-tab="details" role="tab" aria-selected="'+(tab==="details")+'">Person details</button>'+
        '</div>'+
        '<div class="tab-pager" data-pager="'+esc(p.id)+'" style="scroll-behavior:smooth">'+
          '<section class="tab-pane" aria-label="Menu items">'+renderPersonMenuTab(p)+'</section>'+
          '<section class="tab-pane" aria-label="Person details">'+renderPersonDetails(p,isPrimary)+'</section>'+
        '</div>'+
        '<div class="share-actions"><button class="wa-action'+(needsAccount()?" locked":"")+'" type="button" data-act="share-person" data-id="'+esc(p.id)+'">Send '+esc(p.name)+'’s share via WhatsApp · '+esc(amount(p.total,p.totalText))+'</button></div>'+
      '</div>';
    }
    h += '</article>';
    return h;
  }

  function renderAddPerson(){
    return '<article class="person-card add-card'+(ui.openAdd?" open":"")+'">'+
      '<div class="person-head">'+
        '<button class="person-avatar" type="button" data-act="toggle-addperson" aria-label="Add person"><span class="avatar-initials">ADD</span></button>'+
        '<button class="person-head-main" type="button" data-act="toggle-addperson" aria-expanded="'+(ui.openAdd?"true":"false")+'"><span class="person-name">Add Person</span><span class="person-sub">Create another share for your group</span><span class="person-tag">NEW SHARE</span></button>'+
      '</div>'+
      (ui.openAdd ? '<div class="person-body"><form class="add-person-form" id="add-person-form">'+
        '<div class="field"><label for="new-person-name">Person’s name</label><input id="new-person-name" type="text" maxlength="32" placeholder="e.g. Kagiso M." autocomplete="off" autocapitalize="words"></div>'+
        '<button class="primary-action" type="submit">Add this person</button>'+
        '</form></div>' : '')+
      '</article>';
  }

  function renderOrderOptions(){
    return '<section class="order-panel'+(ui.orderOpen?" open":"")+'">'+
      '<button class="order-toggle" type="button" data-act="toggle-order"><span><strong>Order &amp; delivery options</strong><span>Name, notes, delivery and sending</span></span><span aria-hidden="true">DETAILS</span></button>'+
      '<div class="order-body">'+
        '<div class="fields">'+
          '<div class="field"><label for="order-name">Your Name</label><input id="order-name" type="text" placeholder="e.g. Kagiso M." value="'+esc(ui.orderName||snap.orderName||"")+'"></div>'+
          '<div class="field"><label for="order-notes">Notes</label><textarea id="order-notes" rows="3" placeholder="e.g. extra spicy, pickup time, table number">'+esc(ui.orderNotes||snap.orderNotes||"")+'</textarea></div>'+
        '</div>'+
        '<div class="order-actions">'+
          '<button class="primary-action" type="button" data-act="go-delivery">Add Delivery Details</button>'+
          '<button class="secondary-action" type="button" data-act="back-from-checkout">Back to Menu</button>'+
          '<button class="wa-action'+(needsAccount()?" locked":"")+'" type="button" data-act="wa-order">Send via WhatsApp</button>'+
          '<button class="secondary-action" type="button" data-act="wa-review">WhatsApp Review</button>'+
          '<button class="secondary-action'+(needsAccount()?" locked":"")+'" type="button" data-act="save-summary">Save Order</button>'+
          '<button class="danger-action" type="button" data-act="delete-summary">Delete Summary</button>'+
        '</div>'+
      '</div>'+
      '</section>';
  }

  function renderMain(){
    var h = renderHero();
    if (needsAccount()) h += renderAccountNudge();
    h += renderSmartBalance();
    h += '<div class="section-kicker">Your group</div><div class="people-stack">';
    (snap.people || []).forEach(function(p,i){ h += renderPersonCard(p,i); });
    h += renderAddPerson() + '</div>';
    h += renderOrderOptions();
    h += '<div class="footer-actions"><button class="primary-action'+(needsAccount()?" locked":"")+'" type="button" data-act="send-full">Send Full Bill to Restaurant</button><button class="secondary-action" type="button" data-act="cancel-split">Cancel Split Bill · Return to Checkout</button></div>';
    return h;
  }

  function renderRestaurantCard(){
    var r = snap.restaurant || {};
    return '<div class="restaurant-card"><div class="restaurant-logo">'+
      (r.logo ? '<img src="'+esc(r.logo)+'" alt="'+esc(r.name)+'">' : '<span>EO</span>')+
      '</div><div class="restaurant-copy"><strong>'+esc(r.name||"Restaurant")+'</strong><span>Choose something to add to this share</span></div></div>';
  }

  function renderMenuPersonCard(){
    var p = personById(ui.selectedPerson);
    if (!p) return "";
    return '<button class="menu-person-card" type="button" data-act="return-person-card">'+
      '<span class="menu-person-avatar">'+(p.photo ? '<img src="'+esc(p.photo)+'" alt="">' : esc(initials(p.name)))+'</span>'+
      '<span class="menu-person-copy"><strong>'+esc(p.name)+'</strong><span>'+esc(amount(p.total,p.totalText))+' · '+(p.itemCount||0)+' item'+(p.itemCount===1?"":"s")+'</span></span>'+
      '<span class="menu-person-tap">RETURN</span>'+
      '</button>';
  }

  function renderCatalog(){
    var rows = (snap.catalog || []).filter(function(it){
      var catOk = ui.category === "All" || it.category === ui.category;
      var q = ui.search.toLowerCase();
      var text = (it.name + " " + (it.desc||"") + " " + (it.category||"")).toLowerCase();
      return catOk && (!q || text.indexOf(q) >= 0);
    });
    var h = '<div class="catalog-list">';
    if (!rows.length) h += '<div class="menu-empty">No menu items match this search.</div>';
    rows.forEach(function(it){
      var open = ui.openCatalog === String(it.id);
      var price = (it.sizes && it.sizes.length) ? it.sizes[0].priceText : amount(it.price);
      h += '<article class="catalog-card">'+
        '<button class="catalog-head" type="button" data-act="toggle-catalog" data-id="'+esc(it.id)+'">'+
          '<span class="item-photo">'+itemImage(it.photo,it.name)+'</span>'+
          '<span class="item-info"><span class="item-name">'+esc(it.name)+'</span><span class="item-price">'+esc(price)+(it.sizes&&it.sizes.length>1?" · from":"")+'</span></span>'+
          '<span class="item-qty">'+(open?"OPEN":"VIEW")+'</span>'+
        '</button>';
      if (open) {
        h += '<div class="catalog-detail">'+
          (it.desc ? '<p class="catalog-description">'+esc(it.desc)+'</p>' : '')+
          '<div class="size-list">'+(it.sizes || [{index:0,label:"Regular",price:it.price,priceText:amount(it.price)}]).map(function(s){
            return '<button class="size-option" type="button" data-act="menu-add" data-id="'+esc(it.id)+'" data-size="'+Number(s.index||0)+'"><span>'+esc(s.label||"Regular")+'</span><span>'+esc(s.priceText||amount(s.price))+' · Add to share</span></button>';
          }).join("")+'</div>'+
        '</div>';
      }
      h += '</article>';
    });
    h += '</div>';
    return h;
  }

  function renderMenu(){
    var categories = ["All"].concat((snap.categories || []).filter(Boolean));
    return '<div class="menu-view">'+
      '<div class="menu-topline"><strong>Add from Menu</strong><button type="button" data-act="back-split">Close</button></div>'+
      renderRestaurantCard()+
      renderMenuPersonCard()+
      '<input class="menu-search" id="menu-search" type="search" value="'+esc(ui.search)+'" placeholder="Search the restaurant menu" aria-label="Search menu">'+
      '<select class="menu-category" id="menu-category" aria-label="Filter by category">'+categories.map(function(c){
        return '<option value="'+esc(c)+'" '+(ui.category===c?"selected":"")+'>'+esc(c==="All"?"All categories":c)+'</option>';
      }).join("")+'</select>'+
      renderCatalog()+
      '<div class="menu-bottom"><button class="primary-action" type="button" data-act="back-split">Back to all people</button></div>'+
      '</div>';
  }

  function renderNoContext(){
    root.innerHTML = '<div class="empty-card" style="margin-top:35px"><strong style="display:block;color:#171717;font-size:20px;margin-bottom:9px">No checkout is connected</strong>This demo page could not reach the EatOuts bridge. Open Split the Bill from a restaurant checkout to load the current items, prices and restaurant details.</div><button class="secondary-action" type="button" style="margin-top:12px" onclick="location.reload()">Reload Demo</button>';
  }

  function render(){
    snap = getSnapshot();
    if (!snap) { renderNoContext(); return; }
    if (!ui.selectedPerson && snap.people && snap.people.length) ui.selectedPerson = snap.people[0].id;
    if (ui.mode === "menu") root.innerHTML = renderMenu();
    else root.innerHTML = renderMain();
    var modal = document.getElementById("photo-modal");
    if (modal) modal.classList.toggle("on", !!ui.photoPerson);
    if (ui.photoPerson) showPhoto(personById(ui.photoPerson));
  }

  function toast(message){
    var t = document.getElementById("toast");
    if (!t) return;
    t.textContent = message;
    t.classList.add("on");
    clearTimeout(ui.toastTimer);
    ui.toastTimer = setTimeout(function(){ t.classList.remove("on"); }, 2300);
  }

  function orderValues(){
    var n = document.getElementById("order-name"), o = document.getElementById("order-notes");
    ui.orderName = n ? n.value : ui.orderName;
    ui.orderNotes = o ? o.value : ui.orderNotes;
    return {name:ui.orderName, notes:ui.orderNotes};
  }

  function call(action,arg){
    if (!bridge || typeof bridge[action] !== "function") return null;
    try {
      var res = bridge[action](arg);
      /* Defence in depth: the host refuses sends/saves for guests. */
      if (res === "auth_required") { openAccountLock(); return null; }
      return res;
    }
    catch(e) { console.error(e); toast("That action could not be completed."); return null; }
  }

  /* Sending shares / saving the bill needs a free account; splitting itself is free. */
  function needsAccount(){
    if (!bridge || typeof bridge.signedIn !== "function") return false;
    try { return !bridge.signedIn(); } catch(e) { return false; }
  }

  function renderAccountNudge(){
    return '<div class="account-nudge">'+
      '<strong>Try every part free</strong>'+
      '<p>Splitting, assigning and balancing stay free. Sending shares on WhatsApp or saving this order needs a free EatOuts account.</p>'+
      '<a class="primary-action" href="eatouts-customer-signup.html" target="_top">Create free account</a>'+
      '<a class="secondary-action" href="eatouts-login.html?next=index.html" target="_top">Log in</a>'+
      '</div>';
  }

  function openAccountLock(){
    var el = document.getElementById("account-lock");
    if (!el) return;
    el.classList.add("on");
    el.setAttribute("aria-hidden","false");
  }

  function closeAccountLock(){
    var el = document.getElementById("account-lock");
    if (!el) return;
    el.classList.remove("on");
    el.setAttribute("aria-hidden","true");
  }

  function showPhoto(p){
    var img = document.getElementById("photo-preview");
    var ph = document.getElementById("photo-placeholder");
    if (!img || !ph) return;
    if (p && p.photo) { img.src = p.photo; img.style.display = "block"; ph.style.display = "none"; }
    else { img.removeAttribute("src"); img.style.display = "none"; ph.textContent = initials(p&&p.name); ph.style.display = "flex"; }
  }

  function compressPhoto(file,done){
    var reader = new FileReader();
    reader.onload = function(){
      var img = new Image();
      img.onload = function(){
        var max = 420, scale = Math.min(1, max / Math.max(img.width, img.height));
        var c = document.createElement("canvas");
        c.width = Math.round(img.width * scale);
        c.height = Math.round(img.height * scale);
        var ctx = c.getContext("2d");
        ctx.drawImage(img, 0, 0, c.width, c.height);
        done(c.toDataURL("image/jpeg", .78));
      };
      img.onerror = function(){ done(String(reader.result||"")); };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }

  /* ---- Event wiring -------------------------------------------------------- */
  root.addEventListener("click",function(e){
    var b = e.target.closest("[data-act]");
    if (!b) return;
    var act = b.getAttribute("data-act"), id = b.getAttribute("data-id"), key = b.getAttribute("data-key");

    if (act === "toggle-person") { ui.openPerson = ui.openPerson === id ? null : id; ui.openAdd = false; render(); return; }
    if (act === "toggle-addperson") { ui.openAdd = !ui.openAdd; ui.openPerson = null; render(); return; }
    if (act === "remove-person") {
      if (!window.confirm("Remove " + (personById(id)||{}).name + " from this split? Their items will become unassigned.")) return;
      call("removePerson", id);
      if (ui.openPerson === id) ui.openPerson = null;
      render(); return;
    }
    if (act === "switch-tab") {
      ui.tabs[id] = b.getAttribute("data-tab");
      render();
      var pager = root.querySelector('[data-pager="'+CSS.escape(id)+'"]');
      if (pager) pager.scrollLeft = ui.tabs[id] === "details" ? pager.clientWidth : 0;
      return;
    }
    if (act === "toggle-item") { var k = id+"|"+key; ui.openItems[k] = !ui.openItems[k]; render(); return; }
    if (act === "qty-move") { call("moveOneTo", {key:key, id:id}); render(); return; }
    if (act === "qty-plus" || act === "qty-minus") {
      var p = personById(id), l = (snap.lines||[]).filter(function(x){return x.key===key;})[0];
      if (!p || !l) return;
      var q = lineForPerson(p,l), next = act === "qty-plus" ? q+1 : q-1;
      call("assignQty", {key:key, id:id, qty:next});
      render(); return;
    }
    if (act === "open-menu") { ui.selectedPerson = id; ui.mode = "menu"; ui.search = ""; ui.category = "All"; ui.openCatalog = null; render(); return; }
    if (act === "back-split") { ui.mode = "split"; ui.openPerson = ui.selectedPerson; render(); return; }
    if (act === "return-person-card") { ui.mode = "split"; ui.openPerson = ui.selectedPerson; render(); return; }
    if (act === "toggle-catalog") { ui.openCatalog = ui.openCatalog === id ? null : id; render(); return; }
    if (act === "menu-add") {
      var person = personById(ui.selectedPerson);
      if (!person) return;
      call("addMenuItem", {personId:person.id, itemId:id, sizeIdx:Number(b.getAttribute("data-size")||0)});
      snap = getSnapshot(); render(); toast("Added to " + person.name + "'s share."); return;
    }
    if (act === "balance") {
      ui.undoAssignments = call("balanceShares") || null;
      render(); toast("Shares balanced using whole menu items."); return;
    }
    if (act === "undo-balance") {
      if (ui.undoAssignments) call("restoreAssignments", ui.undoAssignments);
      ui.undoAssignments = null; render(); return;
    }
    if (act === "share-person") { if (needsAccount()) { openAccountLock(); return; } call("sharePerson", id); return; }
    if (act === "send-full") {
      if (needsAccount()) { openAccountLock(); return; }
      var sent = call("sendFullBill", orderValues());
      if (!sent) toast("Enter your name in Order & delivery options first.");
      return;
    }
    if (act === "cancel-split") { call("returnToCheckout"); return; }
    if (act === "toggle-order") { ui.orderOpen = !ui.orderOpen; render(); return; }
    if (act === "go-delivery") { call("addDelivery", orderValues()); return; }
    if (act === "back-from-checkout") { call("backToMenu"); return; }
    if (act === "wa-order") { if (needsAccount()) { openAccountLock(); return; } call("sendStandardOrder", orderValues()); return; }
    if (act === "wa-review") { call("openReview", orderValues()); return; }
    if (act === "save-summary") { if (needsAccount()) { openAccountLock(); return; } call("saveSummary"); return; }
    if (act === "delete-summary") { call("requestDeleteSummary"); return; }
    if (act === "close-account-lock") { closeAccountLock(); return; }
    if (act === "open-photo") {
      ui.photoPerson = id;
      showPhoto(personById(id));
      var modal = document.getElementById("photo-modal");
      if (modal) modal.classList.add("on");
      return;
    }
    if (act === "close-photo") {
      ui.photoPerson = null;
      var modal2 = document.getElementById("photo-modal");
      if (modal2) modal2.classList.remove("on");
      return;
    }
    if (act === "change-photo") {
      var f = document.getElementById("photo-file");
      if (f) f.click();
      return;
    }
  });

  var photoModal = document.getElementById("photo-modal");
  if (photoModal) {
    photoModal.addEventListener("click", function(e){
      var b = e.target.closest("[data-act]");
      if (!b) return;
      var act = b.getAttribute("data-act");
      if (act === "close-photo") { ui.photoPerson = null; this.classList.remove("on"); }
      if (act === "change-photo") { var f = document.getElementById("photo-file"); if (f) f.click(); }
    });
  }

  var accountLock = document.getElementById("account-lock");
  if (accountLock) {
    accountLock.addEventListener("click", function(e){
      var b = e.target.closest("[data-act]");
      var act = b ? b.getAttribute("data-act") : null;
      if (act === "close-account-lock" || e.target === accountLock) closeAccountLock();
    });
  }

  root.addEventListener("submit", function(e){
    if (e.target && e.target.id === "add-person-form") {
      e.preventDefault();
      var input = document.getElementById("new-person-name");
      var name = input ? input.value.trim() : "";
      if (!name) { if (input) input.focus(); return; }
      var id = call("addPerson", name);
      if (!id) { toast("Enter a new name that is not already in the group."); return; }
      ui.selectedPerson = id; ui.openPerson = id; ui.openAdd = false;
      render(); toast("Person added."); return;
    }
  });

  root.addEventListener("input", function(e){
    var t = e.target;
    if (t.id === "menu-search") {
      ui.search = t.value;
      var pos = t.selectionStart;
      render();
      var n = document.getElementById("menu-search");
      if (n) { n.focus(); n.setSelectionRange(pos, pos); }
      return;
    }
    if (t.id === "order-name" || t.id === "order-notes") { orderValues(); return; }
    if (t.hasAttribute("data-profile-field")) {
      call("updatePerson", {id:t.getAttribute("data-id"), field:t.getAttribute("data-profile-field"), value:t.value});
      return;
    }
  });

  root.addEventListener("change", function(e){
    var t = e.target;
    if (t.id === "menu-category") { ui.category = t.value; render(); return; }
    if (t.hasAttribute("data-profile-field")) {
      var field = t.getAttribute("data-profile-field");
      var ok = call("updatePerson", {id:t.getAttribute("data-id"), field:field, value:t.value});
      if (field === "name") { if (!ok) toast("That name is already used or cannot be blank."); render(); }
      return;
    }
  });

  var photoFile = document.getElementById("photo-file");
  if (photoFile) {
    photoFile.addEventListener("change", function(e){
      var file = e.target.files && e.target.files[0];
      if (!file || !ui.photoPerson) return;
      if (!/^image\//.test(file.type)) { toast("Choose an image file."); return; }
      var id = ui.photoPerson;
      compressPhoto(file, function(data){
        call("updatePerson", {id:id, field:"photo", value:data});
        render(); toast("Profile image updated.");
      });
      e.target.value = "";
    });
  }

  // Keep the two swipeable tabs in sync when the user swipes.
  root.addEventListener("scroll", function(e){
    var pager = e.target.closest && e.target.closest(".tab-pager");
    if (!pager) return;
    var id = pager.getAttribute("data-pager");
    var tab = pager.scrollLeft > pager.clientWidth * 0.45 ? "details" : "items";
    if (ui.tabs[id] !== tab) {
      ui.tabs[id] = tab;
      var card = root.querySelector('[data-person-card="'+CSS.escape(id)+'"]');
      if (card) {
        card.querySelectorAll(".person-tabs button").forEach(function(x){
          var on = x.getAttribute("data-tab") === tab;
          x.classList.toggle("on", on);
          x.setAttribute("aria-selected", String(on));
        });
      }
    }
  }, true);

  var hdr = document.getElementById("hdr");
  if (hdr) {
    hdr.addEventListener("click", function(e){
      if (e.target.closest('[data-act="cancel-split"]')) call("returnToCheckout");
    });
  }

  if (bridge) {
    try {
      snap = getSnapshot();
      if (snap) { ui.orderName = snap.orderName || ""; ui.orderNotes = snap.orderNotes || ""; }
    } catch(e) { console.error(e); }
  }

  try { render(); }
  catch(e) {
    console.error(e);
    try {
      var box = document.getElementById("fatal-error");
      if (box) { box.style.display = "block"; box.textContent = "Render error: " + (e && e.message ? e.message : String(e)) + "\n"; }
    } catch(_) {}
    if (root) root.innerHTML = '<div class="empty-card" style="margin-top:35px">Something went wrong while rendering. Check the error panel above.</div>';
  }
})();
</script>
</body>
</html>
