<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#ffffff"><title>Staff manager · EatOuts</title><link rel="stylesheet" href="assets/eatouts-manager.css"></head><body><div id="mount"></div><script src="js/eatouts-manager-db.js"></script><script src="js/eatouts-roles.js"></script><script src="js/eatouts-users.js"></script><script src="js/eatouts-feedback.js"></script><script src="js/eatouts-blog-admin.js"></script><script src="js/eatouts-auth.js"></script><script src="js/eatouts-manager.js"></script><script>document.addEventListener("DOMContentLoaded",()=>{const u=EO.guard({});if(!u)throw new Error("guard");document.querySelector("#mount").innerHTML=EO.shell("Staff manager","CRUD, employment records, roles and responsibilities",`<div class="actions" style="margin-bottom:10px"><button class="btn primary" id="add">Add staff member</button></div><div id="list"></div><div id="form" class="card" style="display:none"></div>`,{section:"Manager"});
const b=EO.business(),list=document.querySelector("#list"),form=document.querySelector("#form");
function render(){const rows=EatoutsMgrDB.filter("staff",x=>x.businessId===b.id);list.innerHTML=rows.length?rows.map(x=>`<div class="card"><div class="listrow"><div class="listmain"><strong>${EO.esc(x.firstName+" "+x.surname)}</strong><small>${EO.esc((x.roles||[]).join(", "))} · ${EO.status(x.status)}</small></div><div class="actions"><button class="btn" data-edit="${x.id}">Edit</button><button class="btn danger" data-del="${x.id}">Delete</button></div></div><div style="margin-top:9px;font-size:10px;color:#777164">Salary: ${EO.money(x.salaryAmount)} / ${x.salaryPeriod}. Start: ${x.startDate||"—"}. Emergency: ${EO.esc(x.emergencyContact||"—")}</div></div>`).join(""):"<div class='empty'>No staff records.</div>"}
function show(x={}){form.style.display="block";form.innerHTML=`<div class="card-title">${x.id?"Edit":"Add"} staff</div><form id="sf"><div class="two"><label class="field"><span>First name</span><input name="firstName" required value="${EO.esc(x.firstName||"")}"></label><label class="field"><span>Surname</span><input name="surname" required value="${EO.esc(x.surname||"")}"></label></div><div class="two"><label class="field"><span>DOB</span><input name="dob" type="date" value="${x.dob||""}"></label><label class="field"><span>Gender</span><select name="gender"><option>Female</option><option>Male</option><option>Other</option><option>Prefer not to say</option></select></label></div><div class="field"><span>Roles</span><div class="checkgrid">${["manager","cashier","server","chef","driver","housekeeping","admin"].map(r=>`<label class="check"><input type="checkbox" name="roles" value="${r}" ${(x.roles||[]).includes(r)?"checked":""}>${r}</label>`).join("")}</div></div><label class="field"><span>Responsibilities — one per line</span><textarea name="responsibilities">${EO.esc((x.responsibilities||[]).join("\n"))}</textarea></label><div class="three"><label class="field"><span>Salary amount</span><input name="salaryAmount" type="number" value="${x.salaryAmount||""}"></label><label class="field"><span>Per</span><select name="salaryPeriod"><option value="week">week</option><option value="month">month</option></select></label><label class="field"><span>Status</span><select name="status">${["active","leave","terminated"].map(s=>`<option ${x.status===s?"selected":""}>${s}</option>`).join("")}</select></label></div><div class="two"><label class="field"><span>Contact</span><input name="contact" value="${EO.esc(x.contact||"")}"></label><label class="field"><span>Emergency contact</span><input name="emergencyContact" value="${EO.esc(x.emergencyContact||"")}"></label></div><label class="field"><span>Employment start date</span><input name="startDate" type="date" value="${x.startDate||""}"></label><div class="actions"><button class="btn primary">Save</button><button type="button" class="btn" id="cancel">Cancel</button></div></form>`;form.querySelector("[name=gender]").value=x.gender||"Prefer not to say";form.querySelector("[name=salaryPeriod]").value=x.salaryPeriod||"week";form.querySelector("#cancel").onclick=()=>form.style.display="none";form.querySelector("#sf").onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),data={id:x.id||"st-"+Date.now(),businessId:b.id,firstName:f.get("firstName"),surname:f.get("surname"),dob:f.get("dob"),gender:f.get("gender"),roles:f.getAll("roles"),responsibilities:String(f.get("responsibilities")||"").split("\n").filter(Boolean),salaryAmount:Number(f.get("salaryAmount")||0),salaryPeriod:f.get("salaryPeriod"),contact:f.get("contact"),emergencyContact:f.get("emergencyContact"),startDate:f.get("startDate"),status:f.get("status")};EatoutsMgrDB.upsert("staff",data);form.style.display="none";render();EO.toast("Staff saved")}}
document.querySelector("#add").onclick=()=>show();list.onclick=e=>{const id=e.target.dataset.edit||e.target.dataset.del;if(!id)return;if(e.target.dataset.del){EatoutsMgrDB.remove("staff",id);render()}else show(EatoutsMgrDB.find("staff",id))};render();});</script></body></html>
