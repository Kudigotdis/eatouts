<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#ffffff"><title>Staff manager · EatOuts</title><link rel="stylesheet" href="assets/eatouts-manager.css"></head><body><div id="mount"></div><script src="js/eatouts-manager-db.js"></script><script src="assets/data/demo/the-food-place/demo-data.js"></script><script src="js/eatouts-manager-seed.js"></script><script src="js/eatouts-roles.js"></script><script src="js/eatouts-users.js"></script><script src="js/eatouts-feedback.js"></script><script src="js/eatouts-blog-admin.js"></script><script src="js/eatouts-auth.js"></script><script src="js/eatouts-manager.js"></script><script src="js/eatouts-audit.js"></script><script>document.addEventListener("DOMContentLoaded",()=>{const u=EO.guard({});if(!u)throw new Error("guard");
document.querySelector("#mount").innerHTML=EO.shell("Staff manager","Profiles, shifts, attendance, tips, performance and payroll",`<div class="tabs" id="tabs">${["roster","attendance","tips","performance","payroll"].map(t=>`<button class="tab${t==="roster"?" on":""}" data-tab="${t}">${t}</button>`).join("")}</div><div id="panel-roster"><div class="actions" style="margin-bottom:10px"><button class="btn primary" id="add">Add staff member</button></div><div id="list"></div><div id="form" class="card" style="display:none"></div></div><div id="panel-attendance" style="display:none"></div><div id="panel-tips" style="display:none"></div><div id="panel-performance" style="display:none"></div><div id="panel-payroll" style="display:none"></div>`,{section:"Manager"});

const b=EO.business(),list=document.querySelector("#list"),form=document.querySelector("#form"),esc=EO.esc;
const staff=()=>EatoutsMgrDB.filter("staff",x=>x.businessId===b.id);
const hhmm=v=>v?(String(v).split("T")[1]||v):"—";
const num=v=>(v==null?"—":v);
const ROLES=["manager","floor_manager","admin","accountant","chef","cashier","server","bartender","driver","security","housekeeping","cleaner"];
const sel=(name,opts,val)=>`<select name="${name}">${opts.map(o=>`<option ${o===val?"selected":""}>${o}</option>`).join("")}</select>`;

/* ---------------------------- Roster ---------------------------- */
const iniOf=x=>esc(((x.firstName||" ").charAt(0)+(x.surname||" ").charAt(0)).toUpperCase());
const avHtml=x=>`<span class="av-wrap av-lg">${x.photo?`<img src="${esc(x.photo)}" alt="${esc(x.firstName+" "+x.surname)}" onerror="this.style.display='none'">`:""}<span class="av-ini">${iniOf(x)}</span></span>`;
let _av;
function openAv(src){if(!_av){_av=document.createElement("div");_av.className="av-modal";_av.innerHTML=`<button class="close">Close</button><img alt="Profile photo" onclick="event.stopPropagation()">`;_av.addEventListener("click",e=>{if(e.target===_av||e.target.classList.contains("close"))_av.classList.remove("on")});document.body.appendChild(_av)}_av.querySelector("img").src=src;_av.classList.add("on")}
function renderRoster(){const rows=staff();list.innerHTML=rows.length?rows.map(x=>`<div class="card"><div class="listrow">${avHtml(x)}<div class="listmain"><strong>${esc(x.firstName+" "+x.surname)}${x.preferredName?` "${esc(x.preferredName)}"`:""}</strong><small>${esc(x.employeeId||"")} · ${esc(x.jobTitle||(x.roles||[]).join(", "))} · ${esc(x.department||"")} · ${esc(x.shift||"")} shift · ${EO.status(x.status)}</small></div><div class="actions"><button class="btn" data-edit="${esc(x.id)}">Edit</button><button class="btn danger" data-del="${esc(x.id)}">Delete</button></div></div><div style="margin-top:9px;font-size:10px;color:#777164">${EO.money(x.salaryAmount)} / ${esc(x.salaryPeriod||"")} · ${esc(x.employmentType||"")} · access ${esc(x.accessLevel||"")} · start ${esc(x.startDate||"—")} · ${esc(EO.phoneDisplay(x.contact))}${x.email?` · ${esc(x.email)}`:""}</div></div>`).join(""):"<div class='empty'>No staff records.</div>"}

function show(x={}){form.style.display="block";form.innerHTML=`<div class="card-title">${x.id?"Edit":"Add"} staff</div><form id="sf"><div class="two"><label class="field"><span>First name</span><input name="firstName" required value="${esc(x.firstName||"")}"></label><label class="field"><span>Surname</span><input name="surname" required value="${esc(x.surname||"")}"></label></div><div class="two"><label class="field"><span>Preferred name</span><input name="preferredName" value="${esc(x.preferredName||"")}"></label><label class="field"><span>Employee ID</span><input name="employeeId" value="${esc(x.employeeId||"")}" placeholder="TFP-000"></label></div><div class="two"><label class="field"><span>DOB</span><input name="dob" type="date" value="${esc(x.dob||"")}"></label><label class="field"><span>Gender</span>${sel("gender",["Female","Male","Other","Prefer not to say"],x.gender)}</label></div><div class="two"><label class="field"><span>Nationality</span><input name="nationality" value="${esc(x.nationality||"")}"></label><label class="field"><span>ID type</span>${sel("idType",["omang","passport","none"],x.idType)}</label></div><label class="field"><span>ID / passport number</span><input name="idNumber" value="${esc(x.idNumber||"")}"></label><div class="two"><label class="field"><span>Job title</span><input name="jobTitle" value="${esc(x.jobTitle||"")}"></label><label class="field"><span>Department</span><input name="department" value="${esc(x.department||"")}"></label></div><div class="field"><span>Roles</span><div class="checkgrid">${ROLES.map(r=>`<label class="check"><input type="checkbox" name="roles" value="${r}" ${(x.roles||[]).includes(r)?"checked":""}>${r}</label>`).join("")}</div></div><label class="field"><span>Responsibilities - one per line</span><textarea name="responsibilities">${esc((x.responsibilities||[]).join("\n"))}</textarea></label><div class="three"><label class="field"><span>Shift</span>${sel("shift",["morning","evening","split","weekend","night","off"],x.shift)}</label><label class="field"><span>Employment type</span>${sel("employmentType",["full_time","part_time","contract"],x.employmentType)}</label><label class="field"><span>Access level</span>${sel("accessLevel",["owner","admin","manager","pos","driver","read_only"],x.accessLevel)}</label></div><div class="three"><label class="field"><span>Salary amount</span><input name="salaryAmount" type="number" value="${esc(x.salaryAmount||"")}"></label><label class="field"><span>Per</span>${sel("salaryPeriod",["week","month"],x.salaryPeriod||"month")}</label><label class="field"><span>Pay frequency</span>${sel("payFrequency",["weekly","biweekly","monthly"],x.payFrequency)}</label></div><label class="field"><span>Overtime rate (x base)</span><input name="overtimeRate" type="number" step="0.1" value="${esc(x.overtimeRate!=null?x.overtimeRate:"")}"></label><div class="two"><label class="field"><span>Bank</span><input name="bankName" value="${esc((x.bank&&x.bank.name)||"")}"></label><label class="field"><span>Branch code</span><input name="bankBranch" value="${esc((x.bank&&x.bank.branch)||"")}"></label></div><div class="two"><label class="field"><span>Account</span><input name="bankAccount" value="${esc((x.bank&&x.bank.account)||"")}"></label><label class="field"><span>Payout method</span><input name="bankPayout" value="${esc((x.bank&&x.bank.payoutMethod)||"")}"></label></div><div class="two"><label class="field"><span>Start date</span><input name="startDate" type="date" value="${esc(x.startDate||"")}"></label><label class="field"><span>Status</span>${sel("status",["active","leave","terminated"],x.status)}</label></div><div class="two"><label class="field"><span>Contact</span><input name="contact" value="${esc(x.contact||"")}"></label><label class="field"><span>Email</span><input name="email" value="${esc(x.email||"")}"></label></div><label class="field"><span>Emergency contact</span><input name="emergencyContact" value="${esc(x.emergencyContact||"")}"></label><div class="actions"><button class="btn primary">Save</button><button type="button" class="btn" id="cancel">Cancel</button></div></form>`;
form.querySelector("#cancel").onclick=()=>form.style.display="none";form.querySelector("#sf").onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),data=Object.assign({},x,{id:x.id||"st-"+Date.now(),businessId:b.id,firstName:f.get("firstName"),surname:f.get("surname"),preferredName:f.get("preferredName"),employeeId:f.get("employeeId"),dob:f.get("dob"),gender:f.get("gender"),nationality:f.get("nationality"),idType:f.get("idType"),idNumber:f.get("idNumber"),jobTitle:f.get("jobTitle"),department:f.get("department"),roles:f.getAll("roles"),responsibilities:String(f.get("responsibilities")||"").split("\n").filter(Boolean),shift:f.get("shift"),employmentType:f.get("employmentType"),accessLevel:f.get("accessLevel"),salaryAmount:Number(f.get("salaryAmount")||0),salaryPeriod:f.get("salaryPeriod"),payFrequency:f.get("payFrequency"),overtimeRate:Number(f.get("overtimeRate")||0),contact:f.get("contact"),email:f.get("email"),emergencyContact:f.get("emergencyContact"),startDate:f.get("startDate"),status:f.get("status"),bank:{name:f.get("bankName"),branch:f.get("bankBranch"),account:f.get("bankAccount"),payoutMethod:f.get("bankPayout")}});EatoutsMgrDB.upsert("staff",data);form.style.display="none";renderRoster();EO.toast("Staff saved")}}

/* -------------------------- Attendance -------------------------- */
function renderAttendance(){const rows=staff();const clocked=rows.filter(x=>x.attendance&&x.attendance.lastClockIn).length;const late=rows.reduce((s,x)=>s+(((x.attendance||{}).lateness||{}).late||0),0);const absent=rows.reduce((s,x)=>s+(((x.attendance||{}).lateness||{}).absent||0),0);const grid=`<div class="grid">${EO.metric("Staff on record",rows.length)}${EO.metric("Clocked in",clocked)}${EO.metric("Late events",late)}${EO.metric("Absences",absent)}</div>`;const t=EO.table(["Staff","Clock in","Clock out","Reg h","OT h","Break","Late / Abs"],rows.map(x=>{const a=x.attendance||{},h=a.hours||{};const br=(a.breaks&&a.breaks[0])?`${a.breaks[0].start}-${a.breaks[0].end}`:"—";const la=a.lateness?`${a.lateness.late} / ${a.lateness.absent}`:"—";return[`<strong>${esc(x.firstName+" "+x.surname)}</strong>`,hhmm(a.lastClockIn),hhmm(a.lastClockOut),num(h.regular),num(h.overtime),br,la]}));document.querySelector("#panel-attendance").innerHTML=grid+EO.card("Time clock & shifts",t)}

/* ------------------------------ Tips ------------------------------ */
function renderTips(){const rows=staff().filter(x=>x.tips);const sum=(k)=>rows.reduce((s,x)=>s+(x.tips[k]||0),0);const grid=`<div class="grid">${EO.metric("Staff earning tips",rows.length)}${EO.metric("Cash tips",EO.money(sum("cash")))}${EO.metric("Card tips",EO.money(sum("card")))}${EO.metric("Pool to kitchen",EO.money(sum("poolToKitchen")))}${EO.metric("Net tips",EO.money(sum("net")))}</div>`;const t=EO.table(["Staff","Cash","Card","To kitchen","Net","% of sales"],rows.map(x=>[`<strong>${esc(x.firstName+" "+x.surname)}</strong>`,EO.money(x.tips.cash),EO.money(x.tips.card),EO.money(x.tips.poolToKitchen),`<strong>${EO.money(x.tips.net)}</strong>`,(x.tips.tipPctOfSales!=null?x.tips.tipPctOfSales+" %":"—")]));document.querySelector("#panel-tips").innerHTML=grid+EO.card("Tips & tip-pool split",t)}

/* --------------------------- Performance --------------------------- */
function renderPerformance(){const rows=staff();let html="";const kitchen=rows.filter(x=>x.kitchen);if(kitchen.length)html+=EO.card("Kitchen - KDS & prep",EO.table(["Chef","Pending","Preparing","Done today","Avg prep","Efficiency","Waste"],kitchen.map(x=>[`<strong>${esc(x.firstName+" "+x.surname)}</strong>`,x.kitchen.pending,x.kitchen.preparing,x.kitchen.completedToday,x.kitchen.avgPrepMins+" min",x.kitchen.efficiencyPct+" %",EO.money(x.kitchen.wasteCost)])));const drivers=rows.filter(x=>x.delivery);if(drivers.length)html+=EO.card("Logistics - drivers",EO.table(["Driver","Active","Done today","Avg time","Km this week","Rating","Fuel"],drivers.map(x=>[`<strong>${esc(x.firstName+" "+x.surname)}</strong>`,x.delivery.active,x.delivery.completedToday,x.delivery.avgMins+" min",x.delivery.kmWeek,x.delivery.rating+" ★",EO.money(x.delivery.fuelAllowance)])));const foh=rows.filter(x=>x.tips);if(foh.length)html+=EO.card("Front of house - sales",EO.table(["Staff","Sales today","Avg order","Tables","Upsell","Voids"],foh.map(x=>{const p=x.performance||{};return[`<strong>${esc(x.firstName+" "+x.surname)}</strong>`,p.salesDaily!=null?EO.money(p.salesDaily):"—",p.avgOrderValue!=null?EO.money(p.avgOrderValue):"—",num(p.tablesTurned),p.upsellRate!=null?p.upsellRate+" %":"—",num(p.voids)]})));const sec=rows.filter(x=>x.security);if(sec.length)html+=EO.card("Security - incidents",EO.table(["Guard","Incidents (open)","Patrol rounds","Contractor checks","Visitor log"],sec.map(x=>[`<strong>${esc(x.firstName+" "+x.surname)}</strong>`,x.security.incidents,(x.performance||{}).patrolRounds,(x.performance||{}).contractorChecks,(x.security.visitorLog||[]).length])));const mgmt=rows.filter(x=>(x.performance&&!x.kitchen&&!x.delivery&&!x.tips&&!x.security));if(mgmt.length)html+=EO.card("Management",EO.table(["Member","Revenue today","Labour %","Food cost %","Net margin %"],mgmt.map(x=>{const p=x.performance||{};return[`<strong>${esc(x.firstName+" "+x.surname)}</strong>`,p.revenueToday!=null?EO.money(p.revenueToday):"—",p.labourPct!=null?p.labourPct+" %":"—",p.foodCostPct!=null?p.foodCostPct+" %":"—",p.netMarginPct!=null?p.netMarginPct+" %":"—"]})));document.querySelector("#panel-performance").innerHTML=html||"<div class='empty'>No performance data.</div>"}

/* ----------------------------- Payroll ----------------------------- */
function renderPayroll(){const rows=staff().filter(x=>x.payroll||x.salaryAmount);const sum=(k)=>rows.reduce((s,x)=>s+(((x.payroll||{})[k])||0),0);const grid=`<div class="grid">${EO.metric("Payslips",rows.length)}${EO.metric("Gross",EO.money(sum("gross")))}${EO.metric("PAYE",EO.money(sum("paye")))}${EO.metric("BPOPF",EO.money(sum("bpopf")))}${EO.metric("Net",EO.money(sum("net")))}</div>`;const t=EO.table(["Staff","Gross","Tips","PAYE","BPOPF","Net","Period"],rows.map(x=>{const p=x.payroll||{gross:x.salaryAmount||0,paye:0,bpopf:0,net:x.salaryAmount||0,period:(x.payFrequency||x.salaryPeriod||"—")};return[`<strong>${esc(x.firstName+" "+x.surname)}</strong>`,EO.money(p.gross),p.tips!=null?EO.money(p.tips):"—",EO.money(p.paye),EO.money(p.bpopf),`<strong>${EO.money(p.net)}</strong>`,esc(p.period||"—")]}));document.querySelector("#panel-payroll").innerHTML=grid+EO.card("Payroll - current period",t)}

/* ------------------------------ Wiring ------------------------------ */
const panels={roster:renderRoster,attendance:renderAttendance,tips:renderTips,performance:renderPerformance,payroll:renderPayroll};
function showTab(t){document.querySelectorAll("#tabs .tab").forEach(el=>el.classList.toggle("on",el.dataset.tab===t));["roster","attendance","tips","performance","payroll"].forEach(k=>{document.querySelector("#panel-"+k).style.display=k===t?"":"none"});if(panels[t])panels[t]()}
document.querySelector("#tabs").onclick=e=>{const t=e.target.dataset.tab;if(t)showTab(t)};
document.querySelector("#add").onclick=()=>show();
list.onclick=e=>{const av=e.target.closest(".av-wrap");if(av&&av.querySelector("img")){openAv(av.querySelector("img").src);return}const id=e.target.dataset.edit||e.target.dataset.del;if(!id)return;if(e.target.dataset.del){if(!EO.confirm("Delete this staff member? This cannot be undone."))return;const before=EatoutsMgrDB.find("staff",id);EatoutsMgrDB.remove("staff",id);if(window.EatoutsAudit&&window.EatoutsAudit.log)EatoutsAudit.log("staff.delete",id,before?{id:before.id,firstName:before.firstName,surname:before.surname}:null,null,{businessId:b.id});renderRoster()}else show(EatoutsMgrDB.find("staff",id))};
showTab("roster");});</script></body></html>
