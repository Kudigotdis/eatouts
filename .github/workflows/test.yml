name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python deps
        run: pip install -r scripts/requirements.txt

      - name: Build directory data (merge step)
        run: python scripts/build_restaurant_directory.py

      - name: Validate D1 schema + seed (local)
        run: |
          npx wrangler d1 migrations apply eatouts --local
          python scripts/build_d1_seed.py
          npx wrangler d1 execute eatouts --file scripts/seeds/restaurants.sql --local

      - name: Install test deps
        working-directory: tests
        run: npm install

      - name: Run test suites
        working-directory: tests
        run: npm test