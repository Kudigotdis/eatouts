<script>
document.addEventListener('DOMContentLoaded',()=>{
 const user=EO.guard({demo:false});if(!user)return;const params=new URLSearchParams(location.search);
 const allBusinesses=EatoutsDB.collection('businesses');function userBusinesses(){const ids=new Set([user.businessId,...(user.businessIds||[])].filter(Boolean));return allBusinesses.filter(b=>b.ownerId===user.id||b.ownerUserId===user.id||ids.has(b.id));}
 const platformRoles=(user.roles||[]).concat(user.platformRole||[]);const isPlatform=platformRoles.some(r=>['platform_admin','super_admin','platform_ops','platform_analyst'].includes(r))||user.type==='platform_admin';

 let biz=EatoutsDB.find('businesses',bizId);if(!biz){location.href='eatouts-business-signup.html';return;}
 const canAccess=isPlatform||userBusinesses().some(b=>b.id===biz.id)||biz.ownerId===user.id||biz.ownerUserId===user.id||user.businessId===biz.id||(user.businessIds||[]).includes(biz.id);
 if(!canAccess){document.querySelector('#mount').innerHTML='<main class="blocked"><h1>Business access denied</h1><p>This workspace is not linked to your account. You cannot open another business by changing the URL.</p><a class="btn primary" href="eatouts-login.html">Sign in with another account</a></main>';return;}
 const type=EatoutsBusinessTypes.normalize(biz.type),roleList=platformRoles.map(String);const isOwner=roleList.some(r=>['biz_owner','biz_admin','owner','admin'].includes(r))||biz.ownerId===user.id||biz.ownerUserId===user.id;const isAdmin=roleList.some(r=>['biz_owner','biz_admin','owner','admin'].includes(r));const isManager=roleList.includes('biz_manager')||roleList.includes('manager');const isDriver=roleList.includes('driver')||(user.role==='driver');const readOnly=isPlatform||roleList.includes('staff_support')||user.platformRole==='staff_support';const canOrders=isPlatform||isOwner||isManager||roleList.some(r=>['staff','waiter','waitress','cashier','driver'].includes(r));const canDeliveries=isPlatform||isOwner||roleList.some(r=>['driver','biz_admin','biz_owner','biz_manager','admin','manager','delivery_manager'].includes(r));const canStaff=isPlatform||roleList.some(r=>['biz_owner','biz_admin','biz_manager','owner','admin','manager','staff_manager'].includes(r));const canEdit=canOrders&&!readOnly&&!isPlatform;const canWriteBusiness=isOwner&&!readOnly&&!isPlatform;
 const tabDefs=[
  ['overview','Overview',()=>true],['orders','Orders',()=>canOrders],['deliveries','Deliveries',()=>canDeliveries],['menu','Menu / Catalog',()=>isPlatform||isOwner||roleList.some(r=>['catalog_manager','menu_manager'].includes(r))],['beverage','Beverages',()=>isPlatform||(['restaurant','bottlestore','lodge','foodtruck'].includes(type)&&(isOwner||roleList.includes('beverage_manager')))],['promos','Promos',()=>isPlatform||isOwner||roleList.includes('marketing_manager')],['events','Events',()=>isPlatform||(['restaurant','lodge','caterer'].includes(type)&&isOwner)],['reservations','Reservations',()=>isPlatform||(['restaurant','lodge','caterer'].includes(type)&&(isOwner||roleList.includes('host')))],['rooms','Rooms',()=>isPlatform||(type==='lodge'&&(isOwner||roleList.includes('front_desk')||roleList.includes('housekeeping')))],['schedule','Schedule',()=>isPlatform||(type==='foodtruck'&&(isOwner||roleList.includes('schedule_manager')))],['services','Services',()=>isPlatform||(['supplier','caterer'].includes(type)&&isOwner)],['portfolio','Portfolio',()=>isPlatform||(type==='supplier'&&isOwner)],['gallery','Gallery',()=>isPlatform||isOwner],['staff','Staff',()=>canStaff],['users','Users & Roles',()=>isAdmin||isPlatform],['reviews','Reviews',()=>isPlatform||isOwner],['reports','Reports',()=>isPlatform||isOwner||roleList.includes('platform_analyst')],['billing','Billing',()=>isOwner||isPlatform],['quotes','Quotes',()=>type==='supplier'||type==='caterer'],['bookings','Bookings',()=>type==='supplier'||type==='lodge'],['settings','Settings',()=>isOwner||isPlatform]
 ];
 const availableTabs=tabDefs.filter(t=>t[2]()).map(t=>({id:t[0],label:t[1]}));if(!availableTabs.length){document.querySelector('#mount').innerHTML='<main class="blocked"><h1>No workspace access</h1><p>Your assigned role does not currently have any tabs in this business.</p><a class="btn" href="eatouts-login.html">Sign out and switch account</a></main>';return;}
 let active=params.get('tab')||((isDriver&&!canOrders)?'deliveries':'overview');if(!availableTabs.some(t=>t.id===active))active=availableTabs[0].id;
 function onboardingHref(b){return EatoutsBusinessTypes.onboardingPage(b&&b.type)+'?biz='+encodeURIComponent((b&&b.id)||'');}function bName(b=biz){return b.identity?.name||b.name||'New business'}function esc(v){return EO.esc(v)}function asArray(v){return Array.isArray(v)?v:[]}
 function parseStore(key){try{const x=JSON.parse(localStorage.getItem(key)||'[]');return Array.isArray(x)?x:[]}catch(e){return []}}

 function businessRecord(){return EatoutsDB.find('businesses',biz.id)||biz}function ensureModules(){biz=businessRecord();biz.modules=biz.modules||{};biz.modules.menu=Object.assign({categories:[],items:[]},biz.modules.menu||{});biz.modules.beverage=Object.assign({categories:[],items:[]},biz.modules.beverage||{});biz.modules.gallery=Object.assign({groups:[],images:[]},biz.modules.gallery||{});biz.modules.schedule=Array.isArray(biz.modules.schedule)?{weekly:biz.modules.schedule,substitutions:[]}:Object.assign({weekly:[],substitutions:[]},biz.modules.schedule||{});return biz.modules}
 function orders(){const seen=new Map();EatoutsDB.collection('orders').forEach(o=>seen.set(String(o.id),o));parseStore('eatouts_order_v1_history').forEach(o=>seen.set(String(o.id||o.orderId),o));return [...seen.values()].filter(o=>String(o.businessId||o.bizId||o.business_id||'')===String(biz.id));}
 function deliveries(){const seen=new Map();EatoutsDB.collection('deliveries').forEach(x=>seen.set(String(x.id),x));parseStore('eatouts_delivery_orders_v1').forEach(x=>seen.set(String(x.id||x.orderId),x));return [...seen.values()].filter(x=>String(x.businessId||x.bizId||x.business_id||'')===String(biz.id));}
 function reservations(){return EatoutsDB.collection('reservations').filter(x=>x.businessId===biz.id).concat(asArray(biz.modules?.reservations?.items));}
 function invoices(){const db=EatoutsDB.collection('invoices').filter(x=>x.businessId===biz.id);let ops=[];try{const o=JSON.parse(localStorage.getItem('eatouts_ops_v1')||'{}');ops=Array.isArray(o)?o:(o.invoices||[])}catch(e){}return [...db,...ops.filter(x=>x.businessId===biz.id)].filter((x,i,a)=>a.findIndex(y=>y.id===x.id)===i)}
 function setupPaid(){if(biz.setupPaid||biz.billing?.setupPaidAt)return true;let ops=[];try{const o=JSON.parse(localStorage.getItem('eatouts_ops_v1')||'{}');ops=Array.isArray(o)?o:(o.setupFees||[])}catch(e){}return ops.some(x=>x.businessId===biz.id&&x.status==='paid'&&String(x.kind||x.type)==='setup_fee')}
 const ownBusinesses=userBusinesses();if(!isPlatform&&ownBusinesses.length>1&&!ownBusinesses.some(b=>b.id===biz.id)){location.href='operator-dashboard1.html?biz='+encodeURIComponent(ownBusinesses[0].id);return;}
 localStorage.setItem('eatouts_active_business_v2',biz.id);sessionStorage.setItem('eatouts_active_business_v2',biz.id);
 document.querySelector('#mount').innerHTML=`<div class="app"><header class="top"><a class="brand" href="index.html">EatOuts</a><div class="top-right"><select id="business-switch" aria-label="Switch business" class="icon-btn" ${ownBusinesses.length<2?'hidden':''}>${ownBusinesses.map(b=>`<option value="${esc(b.id)}" ${b.id===biz.id?'selected':''}>${esc(bName(b))}</option>`).join('')}</select><span class="mode">${esc((user.firstName||'')+' '+(user.surname||''))}</span><button class="icon-btn" id="logout">Exit</button></div></header><main class="page"><div class="crumb">Business workspace · ${esc(EatoutsBusinessTypes.get(type).label)}</div><div class="hero"><div><h1>${esc(bName())}</h1><p>${esc(EatoutsBusinessTypes.get(type).description)} <span class="status ${esc(biz.status||'draft')}">${esc(biz.status||'draft')}</span></p></div>${canWriteBusiness?`<a class="btn" href="${onboardingHref(biz)}">Edit profile</a>`:''}</div><div id="banners"></div><div class="workspace-tabs" id="tabs" role="tablist"></div><div id="content" class="workspace-main"></div></main><nav class="bottom"><a href="operator-dashboard1.html?biz=${encodeURIComponent(biz.id)}">Home</a><a href="operator-dashboard1.html?biz=${encodeURIComponent(biz.id)}&tab=orders">Orders</a><a href="staff-manager.html?biz=${encodeURIComponent(biz.id)}">Staff</a><a href="operator-dashboard1.html?biz=${encodeURIComponent(biz.id)}&tab=reports">Reports</a><a href="operator-dashboard1.html?biz=${encodeURIComponent(biz.id)}&tab=settings">Settings</a></nav></div>`;
 document.querySelector('#business-switch').addEventListener('change',e=>{sessionStorage.setItem('eatouts_active_business_v2',e.target.value);EatoutsAuth.setActiveBusiness(e.target.value);location.href='operator-dashboard1.html?biz='+encodeURIComponent(e.target.value)+'&tab='+encodeURIComponent(active)});document.querySelector('#logout').onclick=()=>{EatoutsAuth.logout();location.href='eatouts-login.html'};
 function banners(){const out=[];if(readOnly)out.push('<div class="banner readonly">Read only — your role can inspect information but cannot change records in this workspace.</div>');if(!setupPaid())out.push('<div class="banner">Publish pending setup fee. The setup fee is not confirmed as paid. Only platform operations can confirm off-platform payments. <a href="operator-dashboard1.html?biz='+encodeURIComponent(biz.id)+'&tab=billing">Open Billing</a></div>');const stuck=orders().filter(o=>['new','pending','accepted','preparing'].includes(String(o.status).toLowerCase()));if(stuck.length)out.push('<div class="banner">Needs attention: '+stuck.length+' order(s) are still in progress. Review the Orders tab and confirm the next status.</div>');document.querySelector('#banners').innerHTML=out.join('')}
 function renderTabs(){document.querySelector('#tabs').innerHTML=availableTabs.map(t=>`<button role="tab" aria-selected="${t.id===active}" class="workspace-tab ${t.id===active?'on':''}" data-tab="${t.id}">${esc(t.label)}</button>`).join('')}
 function card(title,html){return `<section class="card"><div class="card-title">${title}</div>${html}</section>`}function empty(s){return `<div class="empty">${esc(s)}</div>`}
 function table(headers,rows){if(!rows.length)return empty('No records to show yet.');return `<div class="table-wrap"><table><thead><tr>${headers.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
 const miniAv=p=>`<span class="av-wrap av-sm">${p&&p.photo?`<img src="${esc(p.photo)}" alt="${esc((p.firstName||'')+' '+(p.surname||''))}" onerror="this.style.display='none'">`:''}<span class="av-ini" style="font-size:11px">${esc(((p.firstName||' ').charAt(0)+(p.surname||' ').charAt(0)).toUpperCase())}</span></span>`;
 let _av;
 function openAv(src){if(!_av){_av=document.createElement("div");_av.className="av-modal";_av.innerHTML=`<button class="close">Close</button><img alt="Profile photo" onclick="event.stopPropagation()">`;_av.addEventListener("click",e=>{if(e.target===_av||e.target.classList.contains("close"))_av.classList.remove("on")});document.body.appendChild(_av)}_av.querySelector("img").src=src;_av.classList.add("on")}
 document.addEventListener("click",e=>{const w=e.target.closest(".av-wrap");if(w&&w.querySelector("img")){openAv(w.querySelector("img").src)}});
 function records(items,titleKey='title',subKey='description',canAdd=false,kind='promos'){return `${items.length?items.map((it,i)=>`<div class="record-entry"><div class="listrow"><div class="listmain"><strong>${esc(it[titleKey]||it.name||it.id||'Untitled')}</strong><small>${esc(it.category||it.date||it.type||'')}</small><p>${esc(it[subKey]||'')}</p></div>${canWriteBusiness?`<button class="btn danger" data-remove-record="${i}" data-kind="${kind}">Remove</button>`:''}</div></div>`).join(''):empty('No '+titleKey+' records have been added yet.')}${canAdd&&canWriteBusiness?`<form class="card" data-record-form="${kind}"><div class="card-title">Add ${esc(kind.slice(0,-1))}</div><div class="two"><label class="field"><span>Name / title</span><input name="title" required></label><label class="field"><span>Price / date / category</span><input name="detail"></label></div><label class="field"><span>Description</span><textarea name="description"></textarea></label><button class="btn primary">Add record</button></form>`:''}`}
 function renderOverview(){
  const o=orders(),d=deliveries(),pending=o.filter(x=>['new','pending'].includes(String(x.status).toLowerCase())).length,preparing=o.filter(x=>['preparing','accepted'].includes(String(x.status).toLowerCase())).length;
  const today=new Intl.DateTimeFormat('en-CA',{timeZone:'Africa/Gaborone',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
  const todayOrders=o.filter(x=>String(x.created||x.placedAt||'').slice(0,10)===today),totalToday=todayOrders.reduce((n,x)=>n+Number(x.total||x.grandTotal||0),0);
  const incoming=d.filter(x=>!['delivered','cancelled','complete'].includes(String(x.status).toLowerCase())).length,fb=EatoutsFeedback.all().filter(x=>x.businessId===biz.id&&!['resolved','closed'].includes(x.status)).length;
  const metrics='<div class="grid3">'+EO.metric('Orders today',todayOrders.length,'all order modes')+EO.metric('Revenue logged',EO.money(totalToday),'off-platform recorded value')+EO.metric('Pending orders',pending,'awaiting acceptance')+EO.metric('Orders in progress',preparing,'accepted / preparing')+EO.metric('Deliveries active',incoming,'not yet completed')+EO.metric('Open feedback',fb,'about this business')+'</div>';
  let attention='';
  if(pending)attention+='<div class="item-line"><div><strong>'+pending+' order(s) waiting for acceptance</strong><div class="minor">Review the live order queue.</div></div><button class="btn" data-go-tab="orders">Open orders</button></div>';
  if(d.some(x=>!x.driver&&!['delivered','cancelled'].includes(String(x.status).toLowerCase())))attention+='<div class="item-line"><div><strong>Delivery needs a driver</strong><div class="minor">Assign a driver before dispatch.</div></div><button class="btn" data-go-tab="deliveries">Review deliveries</button></div>';
  if(!setupPaid())attention+='<div class="item-line"><div><strong>Setup fee pending</strong><div class="minor">Publishing remains blocked until operations confirms payment.</div></div><button class="btn" data-go-tab="billing">Billing</button></div>';
  if(!biz.modules?.menu?.items?.length)attention+='<div class="item-line"><div><strong>Menu / catalog is empty</strong><div class="minor">Add items so customers can discover your offer.</div></div><button class="btn" data-go-tab="menu">Add items</button></div>';
  if(!attention)attention='<div class="empty">Nothing urgent is flagged right now.</div>';
  const attCard=card('Needs attention',attention);
  const actCard=card('Quick actions','<div class="actions"><button class="btn primary" data-go-tab="menu">+ New menu item</button><button class="btn" data-go-tab="promos">+ New promo</button>'+(['restaurant','lodge','caterer'].includes(type)?'<button class="btn" data-go-tab="events">+ New event</button>':'')+'<button class="btn" data-go-tab="deliveries">Open deliveries</button></div>');
  const recentRows=o.slice().sort((a,b)=>String(b.created||'').localeCompare(String(a.created||''))).slice(0,5).map(x=>[esc(x.id),esc(x.customer||x.customerName||'Customer'),esc(EO.money(x.total||x.grandTotal||0)),'<span class="status '+esc(x.status||'new')+'">'+esc(x.status||'new')+'</span>','<button class="btn" data-go-tab="orders">Manage</button>']);
  return metrics+attCard+actCard+card('Recent orders',table(['Order','Customer','Total','Status','Next action'],recentRows));
 }
 function renderOrders(){const arr=orders().slice().sort((a,b)=>String(b.created||b.placedAt||'').localeCompare(String(a.created||a.placedAt||'')));return card('Order queue',`<div class="two"><label class="field"><span>Filter by status</span><select id="order-filter"><option value="">All statuses</option>${['new','pending','accepted','preparing','ready','dispatched','delivered','cancelled'].map(s=>`<option>${s}</option>`).join('')}</select></label><label class="field"><span>Search orders</span><input id="order-search" placeholder="Order ID or customer"></label></div><div id="order-table"></div>`)}
 function renderOrderTable(){let arr=orders().slice().sort((a,b)=>String(b.created||b.placedAt||'').localeCompare(String(a.created||a.placedAt||'')));const st=document.querySelector('#order-filter')?.value||'',search=(document.querySelector('#order-search')?.value||'').toLowerCase();if(st)arr=arr.filter(o=>String(o.status).toLowerCase()===st);if(search)arr=arr.filter(o=>(String(o.id)+' '+String(o.customer||o.customerName||'')).toLowerCase().includes(search));const rows=arr.map(o=>{const items=Array.isArray(o.items)?o.items.map(i=>typeof i==='string'?i:(i.name||i.title||'item')).join(', '):String(o.items||'—');const editable=canEdit&& !['delivered','cancelled'].includes(String(o.status).toLowerCase());const next={new:'accepted',pending:'accepted',accepted:'preparing',preparing:'ready',ready:'delivered',dispatched:'delivered'}[String(o.status).toLowerCase()];return [esc(o.id),esc(o.customer||o.customerName||'Guest'),esc(items),esc(EO.money(o.total||o.grandTotal||0)),esc(o.delivery||o.mode||'—'),`<span class="status ${esc(o.status||'new')}">${esc(o.status||'new')}</span>`,editable?`<div class="row-actions">${next?`<button class="btn primary" data-order-status="${esc(next)}" data-order-id="${esc(o.id)}">${esc(next)}</button>`:''}<button class="btn" data-order-view="${esc(o.id)}">View</button><button class="btn" data-order-whatsapp="${esc(o.id)}">WhatsApp</button><button class="btn danger" data-order-status="cancelled" data-order-id="${esc(o.id)}">Cancel</button></div>`:`<button class="btn" data-order-view="${esc(o.id)}">View</button>`]});return table(['Order','Customer','Items','Total','Mode','Status','Actions'],rows)}
 function updateOrderStatus(id,status){if(!canEdit){EO.toast('Your role cannot change orders');return}const before=orders().find(o=>String(o.id)===String(id));if(!before)return;const updated=Object.assign({},before,{status,updatedAt:new Date().toISOString()});if(EatoutsDB.find('orders',id))EatoutsDB.upsert('orders',updated);const history=parseStore('eatouts_order_v1_history');const hi=history.findIndex(x=>String(x.id||x.orderId)===String(id));if(hi>=0){history[hi]=updated;localStorage.setItem('eatouts_order_v1_history',JSON.stringify(history));}audits('order.status.changed',id,before,updated);EO.toast('Order status updated');renderContent();}
  function orderDetail(o){
    const items=Array.isArray(o.items)?o.items:[];
    const lines=[['Mode',o.delivery||o.mode],['Method',o.method||o.orderMethod]].filter(x=>x[1]);
    const d=document.createElement('div');d.style.cssText='position:fixed;inset:0;background:rgba(10,10,10,.5);z-index:1000;display:flex;align-items:flex-end;justify-content:center';
    d.innerHTML=`<div style="background:#fff;width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px 10px">

      <p style="margin:4px 0;font-size:13px"><strong>Customer:</strong> ${esc(o.customer||o.customerName||'Guest')}</p>
      ${o.whatsapp||o.customerWhatsapp?`<p style="margin:4px 0;font-size:13px"><strong>WhatsApp:</strong> ${esc(o.whatsapp||o.customerWhatsapp)}</p>`:''}
      ${lines.map(r=>`<p style="margin:4px 0;font-size:13px"><strong>${r[0]}:</strong> ${esc(r[1])}</p>`).join('')}
      ${o.created||o.placedAt?`<p style="margin:4px 0;font-size:13px"><strong>Created:</strong> ${esc(o.created||o.placedAt)}</p>`:''}
      ${o.notes?`<p style="margin:4px 0;font-size:13px"><strong>Notes:</strong> ${esc(o.notes)}</p>`:''}
      <div style="font-weight:900;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#888;margin:12px 0 4px">Items (${items.length})</div>
      ${items.length?items.map(i=>{const nm=typeof i==='string'?i:(i.name||i.title||'Item');const qty=Number(typeof i==='string'?1:(i.qty||i.quantity||1))||1;const price=Number(typeof i==='string'?0:(i.price||i.unitPrice||0))||0;return `<div style="display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid #eee;font-size:13px"><span>${esc(nm)} <span style="color:#888">× ${qty}</span></span><span>${esc(EO.money(price*qty))}</span></div>`;}).join(''):'<div style="color:#999;font-size:12px;padding:8px 0">No item lines saved with this order.</div>'}
      <div style="display:flex;justify-content:space-between;align-items:center;font-weight:900;font-size:15px;padding:10px 0 4px">Total <span>${esc(EO.money(o.total||o.grandTotal||0))}</span></div>
      <div style="display:flex;gap:8px;margin:10px 0 4px"><button type="button" class="btn" style="flex:1" data-close>Close</button></div>
    </div>`;
    document.body.appendChild(d);
    d.addEventListener('click',e=>{if(e.target===d||e.target.closest('[data-close]'))d.remove();});
  }
 function renderDeliveries(){const list=deliveries();return card('Delivery dispatch',`${list.length?list.map(d=>`<div class="record-entry"><div class="listrow"><div class="listmain"><strong>${esc(d.id||d.orderId||'Delivery')}</strong><small>${esc(d.recipient||d.customer||'Recipient')} · ${esc(d.town||biz.town||'')} · ${esc(d.mode||'immediate')}</small><p>Window: ${esc(d.window||d.deliveryWindow||'—')} · Driver: ${esc(d.driver||'Unassigned')} · Fee: ${esc(EO.money(d.fee||d.deliveryFee||0))}</p><span class="status ${esc(d.status||'new')}">${esc(d.status||'new')}</span></div><div class="row-actions">${canDeliveries&&!readOnly?`<button class="btn" data-assign-driver="${esc(d.id||d.orderId)}">Assign driver</button><button class="btn primary" data-delivery-status="dispatched" data-delivery-id="${esc(d.id||d.orderId)}">Dispatch</button><button class="btn" data-delivery-status="delivered" data-delivery-id="${esc(d.id||d.orderId)}">Delivered</button>`:''}</div></div></div>`).join(''):empty('No delivery records have been saved for this business yet.')}<div class="actions" style="margin-top:12px"><a class="btn" href="delivery-manager.html">Open delivery manager</a><a class="btn" href="order-manager.html">Full order manager</a></div>`)}
 function updateDelivery(id,patch){if(!canDeliveries||readOnly){EO.toast('Your role cannot edit deliveries');return}const before=deliveries().find(x=>String(x.id||x.orderId)===String(id));if(!before)return;const updated=Object.assign({},before,patch,{updatedAt:new Date().toISOString()});if(EatoutsDB.find('deliveries',id))EatoutsDB.upsert('deliveries',updated);const list=parseStore('eatouts_delivery_orders_v1'),i=list.findIndex(x=>String(x.id||x.orderId)===String(id));if(i>=0){list[i]=updated;localStorage.setItem('eatouts_delivery_orders_v1',JSON.stringify(list))}audits('delivery.updated',id,before,updated);renderContent();}
 function renderMenu(k){ensureModules();const name=k==='menu'?(type==='bottlestore'||type==='bakery'?'Product catalog':type==='caterer'?'Packages':'Menu'):k==='beverage'?'Beverages':k==='promos'?'Promotions':k==='events'?'Events':k==='gallery'?'Gallery':k==='services'?'Services':'Portfolio';let items;if(k==='menu')items=biz.modules.menu.items;else if(k==='beverage')items=biz.modules.beverage.items;else if(k==='gallery')items=biz.modules.gallery.images;else items=asArray(biz.modules[k]);const titleKey=k==='menu'||k==='beverage'?'name':(k==='gallery'?'caption':'title');return card(name,`${items.length?items.map((it,i)=>`<div class="record-entry"><div class="listrow"><div class="listmain"><strong>${esc(it[titleKey]||it.name||it.url||'Untitled')}</strong><small>${esc(it.category||it.date||'')}</small><p>${esc(it.description||it.alt||'')} ${it.price!=null?'· '+esc(EO.money(it.price)):''} ${it.isAlcohol?'· 18+ alcohol':''}</p></div>${canWriteBusiness?`<button class="btn danger" data-module-remove="${k}" data-index="${i}">Remove</button>`:''}</div></div>`).join(''):empty('No records yet. Add the first item below.')} ${canWriteBusiness?`<form class="card" id="module-add" data-kind="${k}"><div class="card-title">Add ${esc(name.toLowerCase().replace(/s$/,''))}</div><div class="two"><label class="field"><span>${k==='menu'||k==='beverage'?'Name':'Title'}</span><input name="name" required></label><label class="field"><span>${k==='menu'||k==='beverage'?'Category':'Price / date / category'}</span><input name="detail"></label></div>${k==='beverage'?'<label class="check"><input type="checkbox" name="isAlcohol"> Contains alcohol (18+)</label>':''}${k==='menu'?'<label class="field"><span>Price (BWP)</span><input name="price" type="number" min="0" step="0.01"></label>':''}${k==='beverage'?'<label class="field"><span>Price (BWP)</span><input name="price" type="number" min="0" step="0.01"></label>':''}${k==='gallery'?'<label class="field"><span>Image URL</span><input name="url" type="url"></label>':''}<label class="field"><span>Description / notes</span><textarea name="description"></textarea></label><button class="btn primary">Add</button></form>`:''}`)}
 function addRecord(k,data){ensureModules();const item=Object.assign({id:'rec-'+Date.now()},data);if(k==='menu') {item.price=Number(item.price||item.detail||0);item.category=item.detail||'General';biz.modules.menu.items.push(item)}else if(k==='beverage'){item.price=Number(item.price||item.detail||0);item.category=item.detail||'Other';item.isAlcohol=!!item.isAlcohol;biz.modules.beverage.items.push(item)}else if(k==='gallery'){item.caption=item.name;item.alt=item.description;biz.modules.gallery.images.push(item)}else {item.title=item.name||item.title;item.category=item.detail||item.category;item.date=item.date||'';if(!Array.isArray(biz.modules[k]))biz.modules[k]=[];biz.modules[k].push(item)}const before=JSON.parse(JSON.stringify(biz));biz.updatedAt=Date.now();EatoutsDB.upsert('businesses',biz);audits('business.module.record.created',item.id,before,biz);renderContent();EO.toast('Saved');}
 function renderReservations(){const r=reservations();return card('Reservation requests',`${r.length?table(['Guest','Date','Time','Guests','Deposit','Status'],r.map(x=>[esc(x.guest||x.customer||'Guest'),esc(x.date||'—'),esc(x.time||'—'),esc(x.guests||1),esc(EO.money(x.deposit||0)),`<span class="status ${esc(x.status||'pending')}">${esc(x.status||'pending')}</span>`])):empty('No table or room reservations have been manually logged yet.')}<div class="actions" style="margin-top:12px"><a class="btn" href="reservation-manager.html">Open reservation manager</a><a class="btn" href="booking-manager.html">Booking requests</a></div>`)}
 function renderRooms(){let rooms=asArray(biz.modules?.rooms);if(!rooms.length)rooms=EatoutsDB.collection('rooms').filter(x=>x.businessId===biz.id);return card('Rooms and housekeeping',`${rooms.length?table(['Room','Type','Nightly rate','Occupancy','Housekeeping'],rooms.map(x=>[esc(x.name||x.number||'Room'),esc(x.type||'Standard'),esc(EO.money(x.rate||x.nightlyRate||0)),`<span class="status ${esc(x.status||'available')}">${esc(x.status||'available')}</span>`,esc(x.housekeeping||'—')])):empty('No rooms have been defined yet.')}<div class="actions" style="margin-top:12px"><a class="btn" href="room-manager.html">Open room manager</a></div>`)}
 function renderSchedule(){ensureModules();const rows=asArray(biz.modules.schedule.weekly);const names={mon:'Monday',tue:'Tuesday',wed:'Wednesday',thu:'Thursday',fri:'Friday',sat:'Saturday',sun:'Sunday'};return card('Food-truck weekly route',`${rows.length?rows.map(x=>`<div class="item-line"><div><strong>${esc(names[x.day]||x.day)} · ${esc([x.location?.town,x.location?.area,x.location?.plot].filter(Boolean).join(' · ')||'Location not set')}</strong><div class="minor">${esc(x.startTime||'—')}–${esc(x.endTime||'—')} · ${esc(x.status||'tentative')} ${x.liveNow?'<span class="status active">Live now</span>':''}</div></div></div>`).join(''):empty('No weekly route defined yet.')}<div class="actions" style="margin-top:12px"><a class="btn primary" href="food-truck-schedule1.html?biz=${encodeURIComponent(biz.id)}">Edit schedule</a></div>`)}
 function renderStaff(){const staff=EatoutsDB.collection('staff').filter(s=>s.businessId===biz.id);return card('Staff overview',`${EO.metric('Active staff',staff.filter(s=>s.status==='active').length,'team members')}${staff.length?table(['Name','Roles','Status'],staff.map(s=>[miniAv(s)+' &nbsp; '+esc(s.firstName+' '+s.surname),esc((s.roles||[]).join(', ')),`<span class="status ${esc(s.status||'active')}">${esc(s.status||'active')}</span>`])):empty('No staff records yet.')}<div class="actions" style="margin-top:12px"><a class="btn primary" href="staff-manager.html?biz=${encodeURIComponent(biz.id)}">Manage staff</a></div>`)}
 function renderUsers(){const rows=EatoutsDB.collection('users').filter(u=>u.businessId===biz.id||u.id===biz.ownerUserId||u.id===biz.ownerId);return card('Users and roles',`${rows.length?table(['Name','WhatsApp','Role(s)','Status'],rows.map(u=>[miniAv(u)+' &nbsp; '+esc((u.firstName||'')+' '+(u.surname||'')),esc(u.whatsapp||'—'),esc((u.roles||[]).join(', ')),`<span class="status ${esc(u.status||'active')}">${esc(u.status||'active')}</span>`])):empty('No account records linked to this business.')}<div class="minor">Business access should be provisioned by matching the staff member's WhatsApp identity; do not create duplicate user records.</div>`)}
 function renderReviews(){const items=EatoutsDB.collection('reviews').filter(x=>x.businessId===biz.id);const average=items.length?(items.reduce((n,x)=>n+Number(x.stars||x.rating||0),0)/items.length).toFixed(1):'—';return `<div class="grid3">${EO.metric('Reviews',items.length,'published / demo records')}${EO.metric('Average rating',average,'out of 5')}${EO.metric('Replies',items.filter(x=>x.reply).length,'with a reply')}</div>`+card('Customer reviews',items.length?items.map(x=>`<div class="record-entry"><strong>${'★'.repeat(Number(x.stars||x.rating||0))}${'☆'.repeat(5-Number(x.stars||x.rating||0))} · ${esc(x.customer||'Customer')}</strong><p>${esc(x.text||x.comment||'')}</p><small class="muted">${esc(x.date||'')}</small>${x.reply?`<p><b>Reply:</b> ${esc(x.reply)}</p>`:''}</div>`).join(''):empty('Reviews have not been connected to a customer-facing review flow yet.'))}
 function exportCsv(){const arr=orders(),csvText=['order_id,customer,total,status,mode,created',...arr.map(x=>[x.id,x.customer||x.customerName||'',x.total||0,x.status||'',x.mode||x.delivery||'',x.created||x.placedAt||''].map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(','))].join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csvText],{type:'text/csv;charset=utf-8'}));a.download='eatouts-'+biz.id+'-orders.csv';a.click();URL.revokeObjectURL(a.href);}
 function renderReports(){const arr=orders(),total=arr.reduce((n,x)=>n+Number(x.total||x.grandTotal||0),0),complete=arr.filter(x=>x.status==='delivered').length;return `<div class="grid3">${EO.metric('Orders',arr.length,'all recorded orders')}${EO.metric('Value logged',EO.money(total),'not a payment processor')}${EO.metric('Delivered',complete,'completed status')}</div>${card('Reports',`<p class="minor">These figures come from locally recorded orders. They represent logged activity, not independently verified revenue or transactions.</p><div class="actions"><button class="btn primary" id="export-orders">Export orders CSV</button><button class="btn" onclick="window.print()">Print report</button><a class="btn" href="analytics-manager.html">Analytics manager</a></div>`)}${card('Order status breakdown',table(['Status','Count'],['new','pending','accepted','preparing','ready','dispatched','delivered','cancelled'].map(s=>[esc(s),String(arr.filter(o=>String(o.status).toLowerCase()===s).length)])))}${card('Data quality',`<p class="minor">Analytics pages can only report fields that have been saved by the relevant flows. If older orders lack a business ID or a timestamp, they cannot be reliably included in this business-scoped report.</p>`)}`}
 function renderBilling(){const inv=invoices();return `<div class="grid3">${EO.metric('Plan',String(biz.plan||biz.subscription||'starter').toUpperCase(),'current plan')}${EO.metric('Setup fee',setupPaid()?'Confirmed':'Pending','manual confirmation')}${EO.metric('Invoices',inv.length,'business records')}</div>${card('Billing status',`<div class="item-line"><div><strong>Setup fee</strong><div class="minor">Business users may acknowledge payment; platform ops must confirm it.</div></div><span class="status ${setupPaid()?'paid':'pending'}">${setupPaid()?'Paid':'Pending'}</span></div><div class="actions" style="margin-top:10px">${!setupPaid()&&!readOnly&&!isPlatform?'<button class="btn primary" id="ack-payment">I have paid the setup fee</button>':''}<a class="btn" href="billing-manager.html">Open billing manager</a></div>`)}${card('Invoice history',inv.length?table(['Invoice','Date','Amount','Status'],inv.map(x=>[esc(x.number||x.id),esc(x.date||x.issuedAt||'—'),esc(EO.money(x.amount||x.total||0)),`<span class="status ${esc(x.status||'unpaid')}">${esc(x.status||'unpaid')}</span>`])):empty('No invoices have been issued for this business.'))}`}
 function renderSettings(){return card('Business settings',`<div class="item-line"><div><strong>Business profile</strong><div class="minor">Edit identity, contacts, hours, modules and media.</div></div><a class="btn" href="${onboardingHref(biz)}">Edit profile</a></div><div class="item-line"><div><strong>Publishing</strong><div class="minor">Current status: ${esc(biz.status||'draft')}</div></div>${canWriteBusiness?`<button class="btn" id="toggle-publish">${biz.status==='live'?'Unpublish':'Publish business'}</button>`:''}</div><div class="item-line"><div><strong>Manage staff</strong><div class="minor">Roles, employment and login access.</div></div><a class="btn" href="staff-manager.html?biz=${encodeURIComponent(biz.id)}">Staff manager</a></div>${type==='foodtruck'?`<div class="item-line"><div><strong>Weekly schedule</strong><div class="minor">Locations and live status.</div></div><a class="btn" href="food-truck-schedule1.html?biz=${encodeURIComponent(biz.id)}">Edit schedule</a></div>`:''}<div class="item-line"><div><strong>Delete / transfer</strong><div class="minor">Sensitive actions need confirmation and should preserve audit history.</div></div>${isAdmin&&!readOnly?'<button class="btn danger" id="delete-business">Delete business</button>':''}</div>`)}
 function renderSimple(kind){let href={quotes:'quote-manager.html',bookings:'booking-manager.html',services:onboardingHref(biz),portfolio:onboardingHref(biz)}[kind]||'#';const arr=kind==='quotes'?EatoutsDB.collection('quotes').filter(x=>x.businessId===biz.id):kind==='bookings'?EatoutsDB.collection('bookings').filter(x=>x.businessId===biz.id):asArray(biz.modules?.[kind]);return card(kind[0].toUpperCase()+kind.slice(1),`${arr.length?table(['Reference','Name','Status'],arr.map(x=>[esc(x.id||'—'),esc(x.title||x.name||x.customer||'—'),esc(x.status||'—')])):empty('No '+kind+' records have been saved for this business yet.')}<div class="actions" style="margin-top:12px"><a class="btn" href="${href}">Open ${esc(kind)} manager</a></div>`)}
 function renderContent(){biz=businessRecord();ensureModules();banners();renderTabs();const c=document.querySelector('#content');switch(active){case'overview':c.innerHTML=renderOverview();break;case'orders':c.innerHTML=renderOrders();c.querySelector('#order-table').innerHTML=renderOrderTable();c.querySelector('#order-filter').onchange=()=>c.querySelector('#order-table').innerHTML=renderOrderTable();c.querySelector('#order-search').oninput=()=>c.querySelector('#order-table').innerHTML=renderOrderTable();break;case'deliveries':c.innerHTML=renderDeliveries();break;case'menu':case'beverage':case'promos':case'events':case'gallery':case'services':case'portfolio':c.innerHTML=renderMenu(active);break;case'reservations':c.innerHTML=renderReservations();break;case'rooms':c.innerHTML=renderRooms();break;case'schedule':c.innerHTML=renderSchedule();break;case'staff':c.innerHTML=renderStaff();break;case'users':c.innerHTML=renderUsers();break;case'reviews':c.innerHTML=renderReviews();break;case'reports':c.innerHTML=renderReports();break;case'billing':c.innerHTML=renderBilling();break;case'quotes':case'bookings':c.innerHTML=renderSimple(active);break;case'settings':c.innerHTML=renderSettings();break;default:c.innerHTML='<section class="card"><div class="empty">Not available for your role.</div></section>';}
 }
 document.querySelector('#tabs').addEventListener('click',e=>{const t=e.target.closest('[data-tab]');if(!t)return;active=t.dataset.tab;const url=new URL(location.href);url.searchParams.set('tab',active);history.replaceState({},'',url);renderContent()});document.querySelector('#content').addEventListener('click',e=>{const go=e.target.closest('[data-go-tab]');if(go){active=go.dataset.goTab;const url=new URL(location.href);url.searchParams.set('tab',active);history.replaceState({},'',url);renderContent();return}const status=e.target.closest('[data-order-status]');if(status){updateOrderStatus(status.dataset.orderId,status.dataset.orderStatus);return}const view=e.target.closest('[data-order-view]');if(view){const o=orders().find(x=>String(x.id)===String(view.dataset.orderView));if(o)orderDetail(o);return}const wa=e.target.closest('[data-order-whatsapp]');if(wa){const o=orders().find(x=>String(x.id)===String(wa.dataset.orderWhatsapp));const phone=String(o?.whatsapp||o?.customerWhatsapp||'').replace(/\D/g,'');const text=encodeURIComponent('EatOuts order '+o.id+' status update: '+o.status+'.');if(phone)window.open('https://wa.me/'+phone+'?text='+text,'_blank','noopener');else EO.toast('No customer WhatsApp number was saved with this order');return}const driver=e.target.closest('[data-assign-driver]');if(driver){const name=prompt('Enter the assigned driver name or WhatsApp number:');if(name)updateDelivery(driver.dataset.assignDriver,{driver:name,status:'assigned'});return}const ds=e.target.closest('[data-delivery-status]');if(ds){updateDelivery(ds.dataset.deliveryId,{status:ds.dataset.deliveryStatus});return}const rem=e.target.closest('[data-module-remove]');if(rem){if(!canWriteBusiness||!confirm('Remove this record?'))return;ensureModules();const k=rem.dataset.moduleRemove,i=Number(rem.dataset.index),before=JSON.parse(JSON.stringify(biz));let arr=k==='menu'?biz.modules.menu.items:k==='beverage'?biz.modules.beverage.items:k==='gallery'?biz.modules.gallery.images:biz.modules[k];arr.splice(i,1);EatoutsDB.upsert('businesses',biz);audits('business.module.record.deleted',k,before,biz);renderContent();return}const pay=e.target.closest('#ack-payment');if(pay){if(readOnly||isPlatform||!isOwner){EO.toast('Your role cannot acknowledge setup payments');return}const note={id:'SETUP-'+Date.now(),businessId:biz.id,kind:'setup_fee',status:'awaiting_confirmation',acknowledgedBy:user.id,acknowledgedAt:new Date().toISOString()};const list=parseStore('eatouts_ops_v1');list.push(note);localStorage.setItem('eatouts_ops_v1',JSON.stringify(list));audits('billing.setup_fee.acknowledged',biz.id,null,note);EO.toast('Payment acknowledgement recorded; operations must confirm it');renderContent();return}if(e.target.id==='export-orders'){exportCsv();return}if(e.target.id==='toggle-publish'){if(!canWriteBusiness){EO.toast('Your role cannot change publishing status');return}const before=JSON.parse(JSON.stringify(biz));if(biz.status==='live'){biz.status='ready'}else{const hasName=!!(biz.identity?.name||biz.name),hasTown=!!(biz.location?.town||biz.town),hasWhatsapp=asArray(biz.contacts).some(x=>x.whatsapp&&x.active&&x.number)||!!biz.whatsapp;if(!hasName||!hasTown||!hasWhatsapp||!setupPaid()){EO.toast('Publishing blocked: complete profile, WhatsApp contact and setup fee confirmation');return}if(type==='foodtruck'&&!asArray(biz.modules?.schedule?.weekly).some(x=>x.status==='confirmed')){EO.toast('Add at least one confirmed route day before publishing');return}biz.status='live';}biz.updatedAt=Date.now();EatoutsDB.upsert('businesses',biz);audits('business.publish.status.changed',biz.id,before,biz);renderContent();return}if(e.target.id==='delete-business'){if(!isAdmin||readOnly){EO.toast('Your role cannot delete this business');return}if(!confirm('Delete this business record? Orders and staff history will remain.'))return;const before=JSON.parse(JSON.stringify(biz));EatoutsDB.remove('businesses',biz.id);audits('business.deleted',biz.id,before,null);location.href='eatouts_admin_dashboard.html';}});
 document.querySelector('#content').addEventListener('submit',e=>{const form=e.target.closest('[data-record-form],#module-add');if(!form)return;e.preventDefault();if(!canWriteBusiness){EO.toast('Your role cannot edit this module');return}const f=new FormData(form),kind=form.dataset.recordForm||form.dataset.kind;const data={name:f.get('name'),title:f.get('title')||f.get('name'),detail:f.get('detail'),description:f.get('description'),price:f.get('price'),date:f.get('date'),url:f.get('url'),isAlcohol:f.get('isAlcohol')==='on'};addRecord(kind,data)});
 document.querySelector('#export-orders')?.addEventListener('click',exportCsv);renderContent();
});
