<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff"><title>EatOuts staff workspace</title><link rel="stylesheet" href="assets/eatouts-manager.css"><style>.staff-tabs{display:flex;gap:5px;overflow:auto;border-bottom:1px solid var(--line);margin-bottom:12px}.staff-tab{border:1px solid transparent;background:#fff;white-space:nowrap;padding:10px 12px;font-size:10px;font-weight:900;text-transform:uppercase;color:#807767}.staff-tab.on{background:#111;color:#fff;border-color:#111}.read-tag{font-size:9px;text-transform:uppercase;letter-spacing:.06em;font-weight:900;padding:4px 7px;border:1px solid #ddd}.action-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.staff-entry{padding:10px 0;border-bottom:1px solid var(--line)}.staff-entry:last-child{border:0}.staff-entry strong{font-size:12px}.staff-entry p{font-size:10px;line-height:1.4;color:var(--muted);margin:4px 0}@media(max-width:520px){.staff-tabs{margin-left:-16px;margin-right:-16px;padding:0 16px}.action-row{justify-content:flex-start}}
</style></head><body><div id="mount"></div>
<script src="js/eatouts-db.js"></script><script src="js/eatouts-manager-db.js"></script><script src="js/eatouts-roles.js"></script><script src="js/eatouts-users.js"></script><script src="js/eatouts-feedback.js"></script><script src="js/eatouts-blog.js"></script><script src="js/eatouts-data.js"></script><script src="js/eatouts-auth.js"></script><script src="js/eatouts-manager.js"></script><script src="js/eatouts-audit.js"></script><script src="js/eatouts-analytics.js"></script>
<script>
document.addEventListener('DOMContentLoaded',()=>{
 const user=EO.guard({demo:false});if(!user)return;const roles=[...(user.roles||[]),user.platformRole,user.type].filter(Boolean).map(String);const platformRole=user.platformRole||roles.find(r=>['staff_content','staff_ops','staff_support','moderator','super_admin','platform_admin','platform_ops','platform_support','platform_author','platform_author_editor','platform_analyst'].includes(r))||'';const fullAdmin=['super_admin','platform_admin'].includes(platformRole)||user.type==='platform_admin';
 if(fullAdmin){document.querySelector('#mount').innerHTML=`<main class="blocked"><h1>You have full admin access</h1><p>Your account can use the full EatOuts platform dashboard instead of the restricted staff workspace.</p><a class="btn primary" href="eatouts-admin-dashboard.html">Open full admin dashboard</a><div style="margin-top:8px"><a class="btn" href="eatouts-login.html">Sign out</a></div></main>`;return;}
 const roleSet=new Set(roles);const roleAliases=new Set([platformRole,...roles]);const specs={
  staff_content:[['blog','Blog'],['feedback','Feedback'],['analytics','Analytics']],
  staff_ops:[['venues','Venues'],['invoices','Invoices'],['deliveries','Deliveries'],['feedback','Feedback'],['analytics','Analytics']],
  staff_support:[['feedback','Feedback'],['orders','Orders'],['deliveries','Deliveries']],
  moderator:[['flags','Content flags'],['blog','Blog'],['feedback','Feedback']]
 };
 let tabSpecs=[];Object.entries(specs).forEach(([role,tabs])=>{if(roleAliases.has(role)||roleSet.has(role))tabs.forEach(t=>{if(!tabSpecs.some(x=>x[0]===t[0]))tabSpecs.push(t)})});
 if(platformRole==='platform_ops'&&!tabSpecs.length)tabSpecs=specs.staff_ops.slice();
 if(platformRole==='platform_support'&&!tabSpecs.length)tabSpecs=specs.staff_support.slice();
 if(roleAliases.has('platform_analyst')&&!tabSpecs.some(x=>x[0]==='analytics'))tabSpecs.push(['analytics','Analytics']);
 if(roleAliases.has('platform_author')||roleAliases.has('platform_author_editor')){if(!tabSpecs.some(x=>x[0]==='blog'))tabSpecs.push(['blog','Blog']);}
 if(!tabSpecs.length){document.querySelector('#mount').innerHTML='<main class="blocked"><h1>Contact your admin</h1><p>Your account does not currently have a staff workspace role.</p><a class="btn primary" href="eatouts-login.html">Return to sign in</a></main>';return;}
 const canOps=roleAliases.has('staff_ops')||roleAliases.has('platform_ops');const canContent=roleAliases.has('staff_content')||roleAliases.has('platform_author')||roleAliases.has('platform_author_editor');const canSupport=roleAliases.has('staff_support')||roleAliases.has('platform_support');const canModerate=roleAliases.has('moderator');
 const params=new URLSearchParams(location.search);let active=params.get('tab')||tabSpecs[0][0];if(!tabSpecs.some(x=>x[0]===active))active='__forbidden';
 function esc(v){return EO.esc(v)}function arr(v){return Array.isArray(v)?v:[]}function readKey(k){try{const x=JSON.parse(localStorage.getItem(k)||'[]');return Array.isArray(x)?x:(x.items||x.feedback||[])}catch(e){return []}}
 function audit(action,target,before,after){if(window.EatoutsAudit)EatoutsAudit.log(action,target,before,after,{staffRole:platformRole})}
 function getVenues(){return EatoutsDB.collection('businesses').slice().sort((a,b)=>String(a.name||'').localeCompare(String(b.name||'')))}
 function getOrders(){const m=new Map();EatoutsDB.collection('orders').forEach(x=>m.set(String(x.id),x));readKey('eatouts_order_v1_history').forEach(x=>m.set(String(x.id||x.orderId),x));return [...m.values()]}
 function getDeliveries(){const m=new Map();EatoutsDB.collection('deliveries').forEach(x=>m.set(String(x.id),x));readKey('eatouts_delivery_orders_v1').forEach(x=>m.set(String(x.id||x.orderId),x));return [...m.values()]}
 function getInvoices(){const a=EatoutsDB.collection('invoices').slice();let ops=[];try{const x=JSON.parse(localStorage.getItem('eatouts_ops_v1')||'{}');ops=Array.isArray(x)?x:(x.invoices||[])}catch(e){}return [...a,...ops.filter(x=>String(x.id||x.number||'').startsWith('INV'))].filter((x,i,z)=>z.findIndex(y=>String(y.id||y.number)===String(x.id||x.number))===i)}
 function getFeedback(){const m=new Map();EatoutsFeedback.all().forEach(x=>m.set(String(x.id||x.ref),x));readKey('eatouts_feedback_v2').forEach(x=>m.set(String(x.id||x.ref),x));readKey('eatouts_feedback_queue_v1').forEach(x=>m.set(String(x.id||x.ref),x));return [...m.values()].sort((a,b)=>String(b.created||b.submittedAt||'').localeCompare(String(a.created||a.submittedAt||'')))}
 function getPosts(){const m=new Map();EatoutsBlog.all().forEach(x=>m.set(String(x.id),x));readKey('eatouts_blog_posts_v1').forEach(x=>m.set(String(x.id),x));return [...m.values()]}
 function empty(s){return `<div class="empty">${esc(s)}</div>`}function status(s){return `<span class="status ${esc(String(s||'unknown').toLowerCase().replace(/\s+/g,'-'))}">${esc(s||'—')}</span>`}
 function table(head,rows){return rows.length?`<div class="table-wrap"><table><thead><tr>${head.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:empty('No matching records yet.')}
 document.querySelector('#mount').innerHTML=`<div class="app"><header class="top"><a class="brand" href="index.html">EatOuts</a><div class="top-right"><span class="mode">Staff · ${esc(platformRole.replace(/_/g,' '))}</span><button class="icon-btn" id="logout">Exit</button></div></header><main class="page"><div class="crumb">Platform staff workspace</div><div class="hero"><div><h1>Staff workspace</h1><p>Your tabs are limited to the responsibilities assigned to your platform role.</p></div><span class="read-tag">Restricted access</span></div><div id="admin-banner"></div><div class="staff-tabs" id="tabs"></div><div id="content"></div></main><nav class="bottom"><a href="eatouts-staff-admin1.html">Home</a><a href="eatouts-staff-admin1.html?tab=feedback">Feedback</a><a href="blog-creator-dashboard.html">Blog</a><a href="eatouts-staff-admin1.html?tab=analytics">Analytics</a><a href="eatouts-login.html">Account</a></nav></div>`;
 document.querySelector('#logout').onclick=()=>{EatoutsAuth.logout();location.href='eatouts-login.html'};
 function renderTop(){document.querySelector('#admin-banner').innerHTML=(roleSet.has('staff_content')&&roleSet.has('staff_ops'))?'<div class="notice" style="margin-bottom:10px">You hold multiple staff roles. Tabs shown are the union of those permissions.</div>':'';document.querySelector('#tabs').innerHTML=tabSpecs.map(([id,label])=>`<button class="staff-tab ${id===active?'on':''}" data-tab="${id}" role="tab" aria-selected="${id===active}">${esc(label)}</button>`).join('')}
 function renderBlog(){const posts=getPosts();return `<section class="card"><div class="listrow"><div class="listmain"><div class="card-title">Blog posts</div><small>Editorial publishing is handled by the dedicated blog creator.</small></div>${canContent?'<a class="btn primary" href="blog-creator-dashboard.html?new=1">New post</a>':''}</div>${table(['Title','Author','Status','Updated','Action'],posts.map(p=>[esc(p.title||'Untitled'),esc(p.authorName||p.author||'—'),status(p.status||'draft'),esc(p.updatedAt||p.updated||''),canContent?`<a class="btn" href="blog-creator-dashboard.html?id=${encodeURIComponent(p.id)}">Edit</a>`:`<a class="btn" href="blog-creator-dashboard.html?id=${encodeURIComponent(p.id)}">View</a>`]))}</section>`}
 function renderFeedback(){const data=getFeedback();const readOnly=!canOps;return `<section class="card"><div class="listrow"><div class="listmain"><div class="card-title">Feedback queue</div><small>Customer and business-submitted issues. Detailed triage is available to authorised operations staff.</small></div>${canOps?'<a class="btn primary" href="feedback-manager.html">Open manager</a>':'<span class="read-tag">Read only</span>'}</div>${table(['Reference','Type','Summary','Business','Submitted','Status','Action'],data.map(f=>[esc(f.id||f.ref||'—'),esc(f.type||'other'),esc(f.summary||f.message||f.title||'No summary'),esc(f.businessName||f.businessId||'—'),esc(f.created||f.submittedAt||''),status(f.status),canOps?`<a class="btn" href="feedback-manager.html?id=${encodeURIComponent(f.id||f.ref||'')}">Open</a>`:'<span class="read-tag">View only</span>']))}${readOnly?'<p class="minor">Read-only tab. Reply, assign and status-changing actions are hidden for this role.</p>':''}</section>`}
 function renderAnalytics(){const orders=getOrders(),deliveries=getDeliveries(),feedback=getFeedback(),events=readKey('eatouts_analytics_events_v1'),businesses=getVenues();const total=orders.reduce((n,o)=>n+Number(o.total||o.grandTotal||0),0);return `<div class="grid3">${EO.metric('Users',EatoutsDB.collection('users').length,'current local store')}${EO.metric('Businesses',businesses.length,'all types')}${EO.metric('Orders',orders.length,'recorded')}${EO.metric('Value logged',EO.money(total),'not verified payments')}${EO.metric('Deliveries',deliveries.length,'saved records')}${EO.metric('Feedback',feedback.length,'submitted items')}</div><section class="card"><div class="card-title">Event telemetry</div><p class="minor">${events.length} analytics events exist in the local event store. Cohort analysis and cross-device totals are not available offline.</p>${table(['Event','Timestamp','Properties'],events.slice(-15).reverse().map(e=>[esc(e.eventName||e.event||e.name||'event'),esc(e.at||e.timestamp||e.createdAt||''),esc(JSON.stringify(e.properties||{}).slice(0,180))]))}</section>`}
 function renderVenues(){const data=getVenues();return `<section class="card"><div class="card-title">Venue and business review</div><p class="minor">Approve the business record for operational review. This does not bypass the setup-fee or profile-completeness publish gates.</p>${table(['Business','Type','Town','Status','Action'],data.map(b=>[esc(b.identity?.name||b.name||'Untitled'),esc(b.type||'restaurant'),esc(b.location?.town||b.town||'—'),status(b.status),canOps?`<button class="btn primary" data-venue-approve="${esc(b.id)}">Mark verified</button>`:'<span class="read-tag">Read only</span>']))}</section>`}
 function renderInvoices(){const list=getInvoices();return `<section class="card"><div class="card-title">Invoice log</div><p class="minor">This view records invoice statuses. Actual payment verification remains a manual platform operation.</p>${table(['Invoice','Business','Amount','Issued','Status','Action'],list.map(i=>{const b=EatoutsDB.find('businesses',i.businessId);return [esc(i.number||i.id||'—'),esc(b?.name||b?.identity?.name||i.businessId||'—'),esc(EO.money(i.amount||i.total||0)),esc(i.issued||i.issuedAt||i.date||'—'),status(i.status),canOps&&i.status!=='paid'?`<button class="btn" data-invoice-paid="${esc(i.id||i.number)}">Mark paid</button>`:'<span class="read-tag">Logged</span>']}))}</section>`}
 function renderDeliveries(){const list=getDeliveries();return `<section class="card"><div class="card-title">Delivery oversight</div>${table(['Reference','Business','Recipient','Town','Driver','Status','Action'],list.map(d=>{const b=EatoutsDB.find('businesses',d.businessId||d.bizId);return [esc(d.id||d.orderId||'—'),esc(b?.name||b?.identity?.name||d.businessId||'—'),esc(d.recipient||d.customer||'—'),esc(d.town||'—'),esc(d.driver||'Unassigned'),status(d.status),canOps?`<div class="action-row"><button class="btn" data-driver="${esc(d.id||d.orderId)}">Assign</button><button class="btn" data-deliver="${esc(d.id||d.orderId)}">Delivered</button></div>`:'<span class="read-tag">Read only</span>']}))}</section>`}
 function renderOrders(){const list=getOrders();return `<section class="card"><div class="card-title">Order oversight</div><p class="minor">This tab is read-only in the staff console. Open the business workspace to fulfil orders if your role grants access.</p>${table(['Order','Business','Customer','Total','Status','Placed'],list.map(o=>{const b=EatoutsDB.find('businesses',o.businessId||o.bizId);return [esc(o.id||'—'),esc(b?.name||b?.identity?.name||o.businessId||'—'),esc(o.customer||o.customerName||'Guest'),esc(EO.money(o.total||0)),status(o.status),esc(o.created||o.placedAt||'—')]}))}</section>`}
 function renderFlags(){const reviews=EatoutsDB.collection('reviews').filter(r=>r.flagged||r.hidden||r.status==='flagged'||r.status==='hidden');const feedback=getFeedback().filter(f=>f.type==='content'&&['flagged','open','new'].includes(f.status));const flags=[...reviews.map(r=>({id:r.id,kind:'Review',summary:r.text||r.comment||'Review flag',status:r.status||'flagged',record:r})),...feedback.map(f=>({id:f.id,kind:'Feedback',summary:f.summary||f.message||'Content flag',status:f.status,record:f}))];return `<section class="card"><div class="card-title">Content moderation queue</div>${flags.length?flags.map(f=>`<div class="staff-entry"><div class="listrow"><div class="listmain"><strong>${esc(f.kind)} · ${esc(f.id)}</strong><p>${esc(f.summary)}</p><small>${status(f.status)}</small></div>${canModerate?`<button class="btn ${f.record.hidden?'primary':'danger'}" data-moderate="${esc(f.id)}" data-kind="${esc(f.kind)}">${f.record.hidden?'Restore':'Hide'}</button>`:''}</div></div>`).join(''):empty('No flagged or hidden content records are currently stored.')}</section>`}
 function renderContent(){renderTop();const c=document.querySelector('#content');if(active==='__forbidden'||!tabSpecs.some(t=>t[0]===active)){c.innerHTML='<section class="card"><h2>Not available for your role</h2><p class="minor">The requested tab is not part of your permitted workspace.</p></section>';return}switch(active){case'blog':c.innerHTML=renderBlog();break;case'feedback':c.innerHTML=renderFeedback();break;case'analytics':c.innerHTML=renderAnalytics();break;case'venues':c.innerHTML=renderVenues();break;case'invoices':c.innerHTML=renderInvoices();break;case'deliveries':c.innerHTML=renderDeliveries();break;case'orders':c.innerHTML=renderOrders();break;case'flags':c.innerHTML=renderFlags();break;default:c.innerHTML='<section class="card">Not available.</section>'}}
 document.querySelector('#tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;if(!tabSpecs.some(t=>t[0]===b.dataset.tab)){active='__forbidden'}else active=b.dataset.tab;const u=new URL(location.href);u.searchParams.set('tab',b.dataset.tab);history.replaceState({},'',u);renderContent()});
 document.querySelector('#content').addEventListener('click',e=>{
  const venue=e.target.closest('[data-venue-approve]');if(venue&&canOps){const b=EatoutsDB.find('businesses',venue.dataset.venueApprove);if(!b)return;const before=JSON.parse(JSON.stringify(b));b.verificationStatus='approved';if(['pending','draft'].includes(b.status))b.status='verified';b.updatedAt=Date.now();EatoutsDB.upsert('businesses',b);audit('business.verification.marked',b.id,before,b);EO.toast('Business marked verified');renderContent();return;}
  const invoice=e.target.closest('[data-invoice-paid]');if(invoice&&canOps){const id=invoice.dataset.invoicePaid;let item=EatoutsDB.collection('invoices').find(x=>String(x.id||x.number)===String(id));if(item){const before=JSON.parse(JSON.stringify(item));item.status='paid';item.paidAt=new Date().toISOString();item.paidMarkedBy=user.id;EatoutsDB.upsert('invoices',item);audit('invoice.marked_paid',id,before,item)}let ops;try{ops=JSON.parse(localStorage.getItem('eatouts_ops_v1')||'{}')}catch(err){ops={}}if(Array.isArray(ops)){const i=ops.findIndex(x=>String(x.id||x.number)===String(id));if(i>=0){const before=JSON.parse(JSON.stringify(ops[i]));ops[i].status='paid';ops[i].paidAt=new Date().toISOString();localStorage.setItem('eatouts_ops_v1',JSON.stringify(ops));audit('invoice.marked_paid',id,before,ops[i])}}EO.toast('Invoice payment status recorded');renderContent();return;}
  const driver=e.target.closest('[data-driver]');if(driver&&canOps){const id=driver.dataset.driver,name=prompt('Driver name or contact:');if(!name)return;const list=readKey('eatouts_delivery_orders_v1'),i=list.findIndex(x=>String(x.id||x.orderId)===String(id));if(i>=0){const before=JSON.parse(JSON.stringify(list[i]));list[i].driver=name;list[i].status=list[i].status||'assigned';localStorage.setItem('eatouts_delivery_orders_v1',JSON.stringify(list));audit('delivery.driver.assigned',id,before,list[i])}else{const x=EatoutsDB.find('deliveries',id);if(x){const before=JSON.parse(JSON.stringify(x));x.driver=name;x.status=x.status||'assigned';EatoutsDB.upsert('deliveries',x);audit('delivery.driver.assigned',id,before,x)}}EO.toast('Driver assignment saved');renderContent();return;}
  const delivered=e.target.closest('[data-deliver]');if(delivered&&canOps){const id=delivered.dataset.deliver,list=readKey('eatouts_delivery_orders_v1'),i=list.findIndex(x=>String(x.id||x.orderId)===String(id));if(i>=0){const before=JSON.parse(JSON.stringify(list[i]));list[i].status='delivered';list[i].deliveredAt=new Date().toISOString();localStorage.setItem('eatouts_delivery_orders_v1',JSON.stringify(list));audit('delivery.status.changed',id,before,list[i])}else{const x=EatoutsDB.find('deliveries',id);if(x){const before=JSON.parse(JSON.stringify(x));x.status='delivered';x.deliveredAt=new Date().toISOString();EatoutsDB.upsert('deliveries',x);audit('delivery.status.changed',id,before,x)}}renderContent();return;}
  const mod=e.target.closest('[data-moderate]');if(mod&&canModerate){const id=mod.dataset.moderate;if(mod.dataset.kind==='Review'){const r=EatoutsDB.find('reviews',id);if(r){const before=JSON.parse(JSON.stringify(r));r.hidden=!r.hidden;r.status=r.hidden?'hidden':'published';EatoutsDB.upsert('reviews',r);audit('content.moderation.changed',id,before,r)}}else{const r=EatoutsFeedback.all().find(x=>String(x.id)===String(id));if(r){const before=JSON.parse(JSON.stringify(r));EatoutsFeedback.update(id,{hidden:true,status:'closed'});audit('content.moderation.changed',id,before,EatoutsFeedback.all().find(x=>String(x.id)===String(id)))}}renderContent();return;}
 });
 renderContent();
});
</script></body></html>
