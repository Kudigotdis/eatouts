<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#ffffff"><title>Login · EatOuts</title><link rel="stylesheet" href="assets/eatouts-manager.css"></head><body>
<div class="login"><div class="loginbox">
  <header class="topbar loginbar"><a class="brand" href="index.html#promos"><img src="assets/logo/EatOuts_Logo.png" alt="EatOuts" style="height:30px;width:auto;display:block"></a><div class="hdr-right"><span class="hdr-chip">EatOuts</span></div></header><div style="font-size:10px;color:#928875;text-transform:uppercase;letter-spacing:.12em;font-weight:900">Universal sign-in</div>
  <h1>Sign in with WhatsApp</h1><p>Your WhatsApp number identifies your account. EatOuts routes you to the correct workspace automatically.</p>
  <form id="login"><label class="field"><span>WhatsApp number</span><input id="wa" inputmode="tel" placeholder="+267 70 000 001" required></label><label class="field"><span>PIN</span><input id="pin" type="password" inputmode="numeric" maxlength="8" placeholder="1234" required></label><button class="btn primary full">Sign in</button></form>
  <div id="err" class="notice" style="display:none;margin-top:10px"></div>
  <div class="card" style="margin-top:18px"><div class="card-title">Demo accounts</div><div class="demo-list">
    <button class="demo" data-demo="customer">Customer</button><button class="demo" data-demo="restaurant">Restaurant owner</button><button class="demo" data-demo="bottle_store">Bottle store</button><button class="demo" data-demo="caterer">Caterer</button><button class="demo" data-demo="lodge">Lodge</button><button class="demo" data-demo="supplier">Supplier</button><button class="demo" data-demo="platform_admin">Platform admin</button>
  </div><small style="display:block;color:#928875;margin-top:9px">Demo PIN: 1234</small></div>
</div></div><script src="js/eatouts-manager-db.js"></script><script src="js/eatouts-roles.js"></script><script src="js/eatouts-users.js"></script><script src="js/eatouts-feedback.js"></script><script src="js/eatouts-blog-admin.js"></script><script src="js/eatouts-auth.js"></script><script src="js/eatouts-manager.js"></script><script>
document.addEventListener("DOMContentLoaded",()=>{
 document.querySelector("#login").addEventListener("submit",e=>{e.preventDefault();EatoutsAuth.loginManager(document.querySelector("#wa").value,document.querySelector("#pin").value).then(r=>{if(r.ok)location.href=r.route;else{const x=document.querySelector("#err");x.textContent=r.message;x.style.display="block"}})});
 document.querySelectorAll("[data-demo]").forEach(b=>b.onclick=()=>EatoutsAuth.loginDemoRole(b.dataset.demo).then(r=>{if(r.ok)location.href=r.route}));
});
</script></body></html>
