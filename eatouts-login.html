<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#ffffff"><title>Login · EatOuts</title><link rel="stylesheet" href="assets/eatouts-manager.css"></head><body>
<div class="login"><div class="loginbox">
  <header class="topbar loginbar"><a class="brand" href="index.html#promos"><img src="assets/logo/EatOuts_Logo.png" alt="EatOuts" style="height:30px;width:auto;display:block"></a><div class="hdr-right"><span class="hdr-chip">EatOuts</span></div></header>
  <div style="font-size:10px;color:#928875;text-transform:uppercase;letter-spacing:.12em;font-weight:900">Customer sign-in</div>
  <h1>Welcome back</h1><p>Sign in with your username, WhatsApp number and password.</p>
  <form id="clogin">
    <label class="field"><span>Username</span><input id="cuser" autocomplete="username" placeholder="yourname" required></label>
    <label class="field"><span>WhatsApp number</span><input id="cwa" inputmode="tel" autocomplete="tel" placeholder="+267 70 000 001" required></label>
    <label class="field"><span>Password</span><input id="cpass" type="password" autocomplete="current-password" placeholder="••••••••" required></label>
    <button class="btn primary full">Sign in</button>
  </form>
  <div id="cerr" class="notice" style="display:none;margin-top:10px"></div>
  <p style="margin-top:12px;font-size:13px;color:#6b6255">New to EatOuts? <a href="eatouts-user-onboarding.html" style="font-weight:800;color:#0a0a0a">Create an account</a></p>

  <details style="margin-top:16px">
    <summary style="cursor:pointer;font-weight:800;font-size:13px;color:#928875;text-transform:uppercase;letter-spacing:.08em">Business sign-in</summary>
    <form id="blogin" style="margin-top:12px"><label class="field"><span>WhatsApp number</span><input id="wa" inputmode="tel" placeholder="+267 70 000 001" required></label><label class="field"><span>PIN</span><input id="pin" type="password" inputmode="numeric" maxlength="8" placeholder="1234" required></label><button class="btn primary full">Sign in</button></form>
    <div id="err" class="notice" style="display:none;margin-top:10px"></div>
  </details>

  <div class="card" style="margin-top:18px"><div class="card-title">Demo accounts</div><div class="demo-list">
    <button class="demo" data-demo="customer">Customer</button><button class="demo" data-demo="restaurant">Restaurant owner</button><button class="demo" data-demo="bottle_store">Bottle store</button><button class="demo" data-demo="caterer">Caterer</button><button class="demo" data-demo="lodge">Lodge</button>    <button class="demo" data-demo="supplier">Supplier</button><button class="demo" data-demo="investor">Investor</button><button class="demo" data-demo="platform_admin">Platform admin</button>
  </div><small style="display:block;color:#928875;margin-top:9px">Demo PIN: 1234</small></div>
</div></div><script src="js/eatouts-manager-db.js"></script><script src="assets/data/demo/the-food-place/demo-data.js"></script><script src="js/eatouts-manager-seed.js"></script><script src="assets/data/business_types.js"></script><script src="js/eatouts-roles.js"></script><script src="js/eatouts-users.js"></script><script src="js/eatouts-feedback.js"></script><script src="js/eatouts-blog-admin.js"></script><script src="js/eatouts-auth.js"></script><script src="js/eatouts-manager.js"></script><script src="js/eatouts-customer.js"></script><script>
function showErr(el,msg){el.textContent=msg;el.style.display="block";}
document.addEventListener("DOMContentLoaded",()=>{
 const ecustomer=window.EatoutsCustomer;
 document.querySelector("#clogin").addEventListener("submit",e=>{
  e.preventDefault();
  const btn=e.target.querySelector("button");btn.disabled=true;
  const body={username:document.querySelector("#cuser").value,whatsapp:document.querySelector("#cwa").value,password:document.querySelector("#cpass").value};
  ecustomer.login(body).then(r=>{
   btn.disabled=false;
   if(r&&r.ok&&r.route){location.href=r.route;return;}
   const msg=(r&&r.error==="backend_not_configured")?"This build has no account server. Use a demo account below or run the app with Cloudflare Pages.":((r&&r.error)||"Sign-in failed. Check your details.");
   showErr(document.querySelector("#cerr"),msg);
  }).catch(()=>{btn.disabled=false;showErr(document.querySelector("#cerr"),"Network error. Try again.");});
 });
 document.querySelector("#blogin").addEventListener("submit",e=>{e.preventDefault();EatoutsAuth.loginManager(document.querySelector("#wa").value,document.querySelector("#pin").value).then(r=>{if(r.ok)location.href=r.route;else{showErr(document.querySelector("#err"),r.message);}})});
 document.querySelectorAll("[data-demo]").forEach(b=>b.onclick=()=>EatoutsAuth.loginDemoRole(b.dataset.demo).then(r=>{if(r.ok)location.href=r.route}));
});
</script></body></html>
