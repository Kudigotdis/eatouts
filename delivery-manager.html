<!doctype html>
<!-- PAGE: Delivery manager --><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#ffffff"><title>Delivery manager · EatOuts</title><link rel="stylesheet" href="assets/eatouts-manager.css"></head><body data-page="delivery-manager"><div id="mount"></div><script src="js/eatouts-manager-db.js"></script><script src="assets/data/demo/the-food-place/demo-data.js"></script><script src="js/eatouts-manager-seed.js"></script><script src="js/eatouts-roles.js"></script><script src="js/eatouts-users.js"></script><script src="js/eatouts-feedback.js"></script><script src="js/eatouts-blog-admin.js"></script><script src="js/eatouts-auth.js"></script><script src="js/eatouts-manager.js"></script><script>document.addEventListener("DOMContentLoaded",()=>{const u=EO.guard({});if(!u)throw new Error("guard");document.querySelector("#mount").innerHTML=EO.shell("Delivery manager","Zones, fees, capacity, drivers and delivery windows",`<div class="grid3" id="metrics"></div><div class="card"><div class="card-title">Zones</div><div id="zones"></div></div><div class="card"><div class="card-title">Delivery windows</div><form id="cfg"><div class="two"><label class="field"><span>Default fee</span><input name="fee" type="number"></label><label class="field"><span>Slot capacity</span><input name="capacity" type="number" value="12"></label></div><div class="two"><label class="field"><span>Start</span><input name="start" type="time" value="10:00"></label><label class="field"><span>End</span><input name="end" type="time" value="22:00"></label></div><button class="btn primary">Save delivery config</button></form></div><div class="card"><div class="card-title">Driver roster</div><div class="listrow"><div class="listmain"><strong>Kabelo Driver</strong><small>+267 70 123 456 · Gaborone CBD</small></div>${EO.status("active")}</div><div class="listrow"><div class="listmain"><strong>Neo Driver</strong><small>+267 71 987 654 · Broadhurst</small></div>${EO.status("active")}</div></div>`,{section:"Manager"});
const s=EatoutsMgrDB.get().settings;document.querySelector("#metrics").innerHTML=EO.metric("Active zones",s.zones.length,"configured")+EO.metric("Default fee",EO.money(s.defaultDeliveryFee),"per delivery")+EO.metric("Capacity",12,"orders / slot");document.querySelector("#zones").innerHTML=s.zones.map((z,i)=>`<div class="listrow"><div class="listmain"><strong>${EO.esc(z)}</strong><small>Fee ${EO.money(s.defaultDeliveryFee)} · capacity 12</small></div><button class="btn">Edit</button></div>`).join("");document.querySelector("#cfg").fee.value=s.defaultDeliveryFee;document.querySelector("#cfg").onsubmit=e=>{e.preventDefault();s.defaultDeliveryFee=Number(e.target.fee.value);EatoutsMgrDB.save();EO.toast("Delivery settings saved")};});</script></body></html>
