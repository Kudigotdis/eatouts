<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#ffffff"><title>Quote manager · EatOuts</title><link rel="stylesheet" href="assets/eatouts-manager.css"></head><body><div id="mount"></div><script src="js/eatouts-manager-db.js"></script><script src="js/eatouts-roles.js"></script><script src="js/eatouts-users.js"></script><script src="js/eatouts-feedback.js"></script><script src="js/eatouts-blog-admin.js"></script><script src="js/eatouts-auth.js"></script><script src="js/eatouts-manager.js"></script><script>document.addEventListener("DOMContentLoaded",()=>{const u=EO.guard({});if(!u)throw new Error("guard");document.querySelector("#mount").innerHTML=EO.shell("Quote manager","Custom quote builder and quote tracker",`<div class="card"><div class="card-title">Create quote</div><form id="q"><div class="two"><label class="field"><span>Client</span><input name="client" required></label><label class="field"><span>Event date</span><input name="date" type="date"></label></div><label class="field"><span>Requirements</span><textarea name="details" required></textarea></label><div class="three"><label class="field"><span>Guests</span><input name="guests" type="number" value="50"></label><label class="field"><span>Price</span><input name="amount" type="number"></label><label class="field"><span>Valid until</span><input name="valid" type="date"></label></div><button class="btn primary">Create quote</button></form></div><div class="card"><div class="card-title">Tracker</div><div id="quotes"></div></div>`,{section:"Manager"});
const b=EO.business();function render(){document.querySelector("#quotes").innerHTML=EatoutsMgrDB.filter("quotes",x=>x.businessId===b.id).map(x=>`<div class="listrow"><div class="listmain"><strong>${EO.esc(x.client)}</strong><small>${x.date||"TBC"} · ${EO.money(x.amount)} · ${EO.esc(x.details)}</small></div>${EO.status(x.status)}</div>`).join("")||"<div class='empty'>No quotes yet.</div>"}document.querySelector("#q").onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);EatoutsMgrDB.upsert("quotes",{id:"QT-"+Date.now(),businessId:b.id,client:f.get("client"),date:f.get("date"),details:f.get("details"),guests:Number(f.get("guests")),amount:Number(f.get("amount")),valid:f.get("valid"),status:"draft"});e.target.reset();render();EO.toast("Quote created")};render();});</script></body></html>
