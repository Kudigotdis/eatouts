<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#151515">
<title>Blog — EatOuts</title>
<link rel="icon" type="image/png" href="assets/logo/EatOuts_Badge.png">
<link rel="apple-touch-icon" href="assets/logo/EatOuts_Badge.png">
<style>
:root{
  --gold:#c9a84c;
  --black:#151515;
  --bg:#f7f6f3;
  --card:#fff;
  --text:#1b1b1b;
  --muted:#7a7466;
  --border:#e7e4dd;
  --ok:#17834b;
  --danger:#c43c3c;
  --radius:16px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--bg)}
body{
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  color:var(--text);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:0;height:0;display:none}
*{scrollbar-width:none;-ms-overflow-style:none}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;text-align:left}
img{max-width:100%;display:block}

/* ---------- SHELL ---------- */
.shell{
  position:fixed;inset:0;max-width:760px;margin:0 auto;
  display:flex;flex-direction:column;background:var(--card);
  box-shadow:0 0 60px -20px rgba(0,0,0,.25);overflow:hidden;
}
@media(min-width:760px){
  .shell{border-left:1px solid var(--border);border-right:1px solid var(--border)}
}

/* ---------- HEADER ---------- */
.topbar{
  flex:0 0 auto;height:58px;display:flex;align-items:center;gap:10px;
  padding:0 14px;background:#fff;border-bottom:1px solid var(--border);
  position:relative;z-index:58;padding-top:env(safe-area-inset-top);
}
.brand{font-weight:900;font-size:16px;color:var(--black);text-decoration:none}
.brand span{color:var(--gold)}
.topbar .page{flex:1;font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.hdr-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.chip{font-size:9.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border:1px solid var(--border);border-radius:20px;padding:4px 9px;background:#faf8f2}
.chip.admin{color:var(--ok);border-color:#b8e6c1;background:#e3f5e9;cursor:pointer}
.chip.admin:active{background:#c9eed0}
.hdr-back{font-size:12px;font-weight:800;color:var(--gold);padding:6px 0}
.hdr-back::before{content:"← ";font-weight:900}

/* ---------- VIEWPORT ---------- */
.viewport{flex:1 1 auto;position:relative;overflow:hidden;background:var(--card)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--card)}
.scroll{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:var(--card)}

/* ---------- BOTTOM NAV ---------- */
.bottom-nav{
  flex:0 0 auto;display:flex;background:#fff;border-top:1px solid var(--border);
  padding-bottom:env(safe-area-inset-bottom);position:relative;z-index:50;
}
.nav-btn{
  flex:1;padding:14px 2px 13px;display:flex;align-items:center;justify-content:center;gap:8px;
  color:var(--muted);transition:color .18s;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
}
.nav-btn.on{color:var(--black)}
.nav-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* ---------- COMMON ---------- */
.pad{padding:14px}
.subh{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:800;margin:0 0 9px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:11px 15px;border-radius:11px;font-size:12.5px;font-weight:800;
  background:#f7f4ec;border:1px solid var(--border);color:#3a3324;
  letter-spacing:.02em;transition:background .15s;min-height:44px;text-decoration:none;
}
.btn:active{background:#efe9da}
.btn.primary{background:var(--black);border-color:var(--black);color:#fff}
.btn.primary:active{background:#000}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
.btn.gold:active{background:#b59437}
.btn.wa{background:#dff5e4;border-color:#b8e6c1;color:#1c6b2e}
.btn.wa:active{background:#c9ecd0}
.btn.danger{background:#fbeaea;color:var(--danger);border-color:#e0c9c9}
.btn.full{width:100%}
.btn.half{flex:1}
.btn.sm{padding:8px 12px;font-size:11.5px;border-radius:9px;min-height:34px}
.btn.ghost{background:transparent;border-color:#e2dccd;color:#6f6754}
.btn.link{background:transparent;border-color:transparent;color:var(--gold);padding:6px 8px;min-height:auto}
.btn.link:active{background:#fdf9ef}
.btn[disabled]{opacity:.35;cursor:not-allowed}

/* ---------- SEARCH BAR ---------- */
.search-wrap{padding:12px 14px;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
.search-box{display:flex;align-items:center;gap:9px;background:#faf8f2;border:1px solid var(--border);border-radius:12px;padding:0 12px}
.search-box input{flex:1;background:none;border:0;outline:none;padding:11px 0;font-size:13.5px;color:var(--text);min-height:44px}
.search-box input::placeholder{color:#b5a888}
.search-clear{background:transparent;color:var(--muted);font-size:16px;padding:4px 6px;cursor:pointer;line-height:1;display:none}
.search-clear.on{display:block}

/* ---------- TAG STRIP ---------- */
.tag-strip{display:flex;gap:6px;overflow-x:auto;padding:0 0 4px;margin-top:10px;-webkit-overflow-scrolling:touch}
.tag-strip::-webkit-scrollbar{display:none}
.tag-pill{flex:0 0 auto;font-size:10.5px;font-weight:800;letter-spacing:.04em;padding:6px 11px;border-radius:999px;background:#faf8f2;border:1px solid var(--border);color:#5c5547;cursor:pointer;transition:background .15s,color .15s;white-space:nowrap}
.tag-pill:hover{background:#f4efe4}
.tag-pill.on{background:var(--black);border-color:var(--black);color:#fff}
.tag-pill.hash::before{content:"#";color:var(--gold)}

/* ---------- TIMELINE ---------- */
.timeline{padding:20px 14px 40px;position:relative}
.timeline::before{
  content:"";position:absolute;left:31px;top:20px;bottom:40px;width:2px;
  background:linear-gradient(to bottom,#e8e3d8 0%,#f4efe4 100%);
}
.tl-item{position:relative;padding-left:44px;margin-bottom:22px}
.tl-item::before{
  content:"";position:absolute;left:26px;top:8px;width:12px;height:12px;border-radius:50%;
  background:var(--gold);border:3px solid #fff;box-shadow:0 0 0 1px #e8e3d8;z-index:2;
}
.tl-card{
  display:block;width:100%;background:#fff;border:1px solid var(--border);border-radius:14px;
  overflow:hidden;box-shadow:0 2px 8px -4px rgba(0,0,0,.06);
  transition:border-color .15s;text-decoration:none;color:inherit;cursor:pointer;padding:0;
}
.tl-card:hover,.tl-card:focus-visible{outline:none;border-color:var(--gold)}
.tl-card-img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#f4efe4}
.tl-card-body{padding:14px 15px}
.tl-card-date{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.tl-card-title{font-size:16px;font-weight:900;color:var(--text);line-height:1.25;letter-spacing:-.01em;margin:0 0 4px}
.tl-card-sub{font-size:12.5px;color:#8a8170;line-height:1.45;margin:0 0 10px}
.tl-card-tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.tl-card-tag{font-size:9.5px;font-weight:800;letter-spacing:.03em;padding:3px 8px;border-radius:999px;background:#faf8f2;border:1px solid var(--border);color:#8a6a1a}
.tl-card-foot{display:flex;justify-content:space-between;align-items:center;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tl-card-read{color:var(--gold)}
.tl-empty{padding:60px 20px;text-align:center;color:var(--muted);font-size:13px;line-height:1.6}

/* ---------- POST VIEW ---------- */
.post{max-width:640px;margin:0 auto;padding:0 0 40px}
.post-cover{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#f4efe4;border-radius:14px}
.post-head{padding:18px 20px 12px}
.post-meta{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;display:flex;gap:10px;flex-wrap:wrap}
.post-title{font-size:24px;font-weight:900;color:var(--text);line-height:1.18;letter-spacing:-.015em;margin:0 0 6px}
.post-subtitle{font-size:14px;color:#8a8170;line-height:1.5;margin:0 0 12px;font-weight:500}
.post-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px}
.post-tag{font-size:10px;font-weight:800;padding:4px 10px;border-radius:999px;background:#faf8f2;border:1px solid var(--border);color:#8a6a1a;cursor:pointer;text-decoration:none}
.post-tag:hover{background:#f4efe4}
.post-body{padding:6px 20px 20px}
.post-actions{padding:12px 20px;border-top:1px solid var(--border);background:#faf8f2;display:flex;gap:8px;flex-wrap:wrap}

/* ---------- BLOCKS (user view) ---------- */
.blk-heading{font-size:20px;font-weight:900;color:var(--text);letter-spacing:-.015em;line-height:1.25;margin:26px 0 8px}
.blk-heading:first-child{margin-top:0}
.blk-subheading{font-size:15.5px;font-weight:900;color:#3a3324;letter-spacing:-.01em;line-height:1.3;margin:22px 0 6px}
.blk-text{font-size:14.5px;color:#3a3324;line-height:1.68;margin:0 0 14px}
.blk-text strong{font-weight:900;color:var(--text)}
.blk-text em{font-style:italic}
.blk-image{margin:16px 0;padding:0}
.blk-image img{width:100%;border-radius:12px;display:block;background:#f4efe4}
.blk-image figcaption,.blk-video figcaption{font-size:11.5px;color:var(--muted);text-align:center;padding-top:6px;font-style:italic;line-height:1.4}
.blk-video{margin:16px 0;padding:0}
.blk-video video{width:100%;border-radius:12px;display:block;background:#0a0a0a}
.blk-gallery{margin:16px 0;display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.blk-gallery img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:#f4efe4}
.blk-gallery img:first-child:last-child{grid-column:1/-1;aspect-ratio:16/9}
.blk-link{display:block;padding:14px 16px;margin:14px 0;border-radius:12px;background:#faf8f2;border:1px solid var(--border);text-decoration:none;color:inherit;transition:background .15s,border-color .15s}
.blk-link:hover{background:#f4efe4;border-color:var(--gold)}
.blk-link b{display:block;font-size:13.5px;font-weight:900;color:var(--text);margin-bottom:3px}
.blk-link span{display:block;font-size:12px;color:#8a8170;line-height:1.45}
.blk-divider{border:0;height:1px;background:#f1ece1;margin:26px 0}
.blk-quote{margin:18px 0;padding:4px 0 4px 16px;border-left:3px solid var(--gold)}
.blk-quote p{font-size:15px;font-style:italic;color:#3a3324;line-height:1.6;margin:0 0 6px}
.blk-quote cite{font-size:11.5px;color:var(--muted);font-weight:800;font-style:normal;letter-spacing:.02em}
.blk-list{margin:0 0 14px;padding-left:24px}
.blk-list li{font-size:14px;color:#3a3324;line-height:1.65;margin-bottom:5px}
.blk-list li strong{color:var(--text);font-weight:900}
.blk-callout{margin:16px 0;padding:14px 16px;border-radius:12px;font-size:13.5px;line-height:1.55}
.blk-callout.info{background:#eef4ff;border:1px solid #cfdcf4;color:#24476e}
.blk-callout.success{background:#e3f5e9;border:1px solid #b8e6c1;color:#1c6b2e}
.blk-callout.warning{background:#fdf3dc;border:1px solid #ece0be;color:#8a6a1a}
.blk-callout strong{font-weight:900}
.tag-inline{color:var(--gold);font-weight:800;text-decoration:none;cursor:pointer;border-bottom:1px dashed rgba(201,168,76,.4)}
.tag-inline:hover{color:#8a6a1a}

/* ---------- ADMIN ---------- */
.admin-wrap{padding:14px 14px 60px;max-width:640px;margin:0 auto}
.admin-h1{font-size:22px;font-weight:900;letter-spacing:-.015em;margin:6px 0 4px;color:var(--text)}
.admin-sub{font-size:12.5px;color:var(--muted);margin:0 0 18px;line-height:1.5}
.admin-post-row{
  display:flex;gap:12px;padding:13px 14px;background:#fff;border:1px solid var(--border);
  border-radius:12px;margin-bottom:8px;cursor:pointer;transition:border-color .15s;
}
.admin-post-row:hover{border-color:var(--gold)}
.admin-post-thumb{width:54px;height:54px;flex:0 0 auto;border-radius:8px;overflow:hidden;background:#f4efe4;position:relative}
.admin-post-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.admin-post-thumb .placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:22px;color:#c9c2b3}
.admin-post-info{flex:1;min-width:0}
.admin-post-title{font-size:14px;font-weight:800;color:var(--text);line-height:1.3;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.admin-post-meta{font-size:11px;color:var(--muted);font-weight:700}
.admin-post-status{flex:0 0 auto;font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:999px;align-self:flex-start}
.admin-post-status.published{background:#e3f5e9;color:var(--ok)}
.admin-post-status.draft{background:#f0eee8;color:var(--muted)}

.edit-meta{background:#faf8f2;border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:14px}
.edit-meta .field{margin-bottom:11px}
.edit-meta .field:last-child{margin-bottom:0}
.field label{display:block;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:800;margin-bottom:6px}
.field input,.field textarea{width:100%;padding:11px 12px;background:#fff;border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:13.5px;outline:none;transition:border-color .16s;min-height:44px}
.field input:focus,.field textarea:focus{border-color:var(--gold)}
.field textarea{resize:vertical;min-height:76px;line-height:1.5}
.field .hint{font-size:10.5px;color:var(--muted);margin-top:4px;line-height:1.4}

.tag-input{display:flex;flex-wrap:wrap;gap:5px;padding:7px;background:#fff;border:1px solid var(--border);border-radius:10px;min-height:44px;align-items:center}
.tag-input input{flex:1;min-width:100px;background:none;border:0;outline:none;padding:6px;font-size:13px;min-height:auto}
.tag-chip{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;background:#faf8f2;border:1px solid var(--border);border-radius:999px;font-size:11px;font-weight:800;color:#8a6a1a}
.tag-chip button{color:var(--muted);font-size:13px;padding:0 2px;line-height:1;cursor:pointer}
.tag-chip button:hover{color:var(--danger)}

.block-stack{margin-bottom:14px}
.block-card{background:#fff;border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden}
.block-head{display:flex;align-items:center;gap:8px;padding:9px 12px;background:#faf8f2;border-bottom:1px solid var(--border)}
.block-type{font-size:9.5px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:#8a6a1a;background:#fdf9ef;padding:3px 8px;border-radius:999px;border:1px solid #ece0be}
.block-num{font-size:10.5px;font-weight:800;color:var(--muted)}
.block-actions{margin-left:auto;display:flex;gap:4px}
.block-actions button{width:26px;height:26px;border-radius:6px;background:#fff;border:1px solid var(--border);font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center;color:#5c5547;cursor:pointer;padding:0;min-height:auto}
.block-actions button:hover{background:#f4efe4}
.block-actions button.danger{color:var(--danger)}
.block-body{padding:12px}
.block-body .field{margin-bottom:10px}
.block-body .field:last-child{margin-bottom:0}

.add-block{background:#faf8f2;border:1.5px dashed var(--border);border-radius:12px;padding:14px;margin-bottom:14px}
.add-block-title{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:800;margin-bottom:10px;text-align:center}
.add-block-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
@media(min-width:520px){.add-block-grid{grid-template-columns:repeat(3,1fr)}}
.add-block-grid button{padding:10px 8px;background:#fff;border:1px solid var(--border);border-radius:10px;font-size:11px;font-weight:800;color:#5c5547;cursor:pointer;text-align:center;transition:background .15s,border-color .15s;min-height:44px}
.add-block-grid button:hover{background:#f4efe4;border-color:var(--gold)}
.add-block-grid button span{display:block;font-size:16px;margin-bottom:3px;line-height:1}

.admin-bar{flex:0 0 auto;display:flex;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--border)}
.admin-bar .btn{flex:1;min-height:44px}

.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--black);color:#fff;padding:12px 22px;border-radius:12px;font-size:13px;font-weight:700;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none;box-shadow:0 8px 30px -8px rgba(0,0,0,.4);max-width:90%;text-align:center}
.toast.on{opacity:1}

.preview-scrim{
  position:fixed;inset:0;background:rgba(20,18,12,.55);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:14px;
}
.preview-inner{background:#fff;border-radius:16px;width:100%;max-width:640px;max-height:92vh;overflow:hidden;display:flex;flex-direction:column;margin-top:14px}
.preview-head{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.preview-head h3{margin:0;font-size:13.5px;font-weight:900;flex:1}
.preview-body{overflow-y:auto;flex:1;padding:0}

.empty-admin{padding:44px 20px;text-align:center;color:var(--muted);font-size:13px;line-height:1.6}
.empty-post{padding:60px 20px;text-align:center;color:var(--muted);font-size:13px;line-height:1.6}

/* modal */
.modal-scrim{position:fixed;inset:0;background:rgba(20,18,12,.55);z-index:90;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:701px){.modal-scrim{align-items:center;padding:20px}}
.modal{background:#fff;width:100%;max-width:560px;max-height:92vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;overflow:hidden}
@media(min-width:701px){.modal{border-radius:20px}}
.modal-hdr{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.modal-hdr h3{margin:0;font-size:15px;font-weight:800;flex:1}
.modal-body{padding:16px 20px;overflow-y:auto;flex:1}
.modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:10px;background:#fafaf7}
.modal-foot .btn{flex:1}

/* print */
@media print{
  .topbar,.bottom-nav,.admin-bar,.search-wrap,.admin-wrap,.toast,.modal-scrim{display:none!important}
  body{background:#fff;overflow:visible;height:auto}
  .shell{max-width:none;border:0;box-shadow:none;overflow:visible}
  .viewport{overflow:visible;height:auto}
  .screen{position:static}
  .post{max-width:none;padding:0}
  .post-cover{border-radius:0}
}

/* OG — set on the head for deep-linked posts */
meta[name=title],.meta-desc,.meta-og{display:none}
</style>

<!-- Open Graph — filled dynamically for deep-linked posts. Without these, WhatsApp shares show a bare URL. -->

<body>
<div class="shell">
  <header class="topbar">
    <button class="hdr-back" id="hdrBack" style="display:none" type="button">Blog</button>
    <a class="brand" href="index.html">EAT<span>OUTS</span></a>
    <div class="page" id="hdrPage">Blog</div>
    <div class="hdr-right">
      <span class="chip" id="hdrStatus" type="button">Blog</span>
    </div>
  </header>

  <div class="viewport" id="viewport"></div>

  <nav class="bottom-nav" id="bottomNav"></nav>
</div>
<div class="toast" id="toast"></div>

<!-- ============================================================
     Load order (all files must live in js/):
       1. Auth + DB (session check)
       2. Brand (esc, slugify)
       3. Image compressor + video validator (used by block editors)
       4. Cloud client (optional — stub is fine if not configured)
       5. Blog engine (reads assets/data/blog_posts.json)
     ============================================================ -->
<script src="js/eatouts-db.js"></script>
<script src="js/eatouts-auth.js"></script>
<script src="js/eatouts-brand.js"></script>
<script src="js/eatouts-image-compressor.js"></script>
<script src="js/eatouts-video-validator.js"></script>
<script src="js/eatouts-cloud.js"></script>
<script src="js/eatouts-blog.js"></script>
<script>
(function(){
  'use strict';

  /* ============================================================
     Dependency probe — log anything that failed to load, but
     don't hard-fail if the optional ones are missing.
     ============================================================ */
  var required = ['EatoutsDB','EatoutsAuth','EatoutsBlog'];
  var optional = ['EatoutsBrand','EatoutsImageCompressor','EatoutsVideoValidator','EatoutsCloud'];
  required.forEach(function(name){
    if (typeof window[name] === 'undefined') {
      console.error('[blog] MISSING required dependency: ' + name);
    }
  });
  optional.forEach(function(name){
    if (typeof window[name] === 'undefined') {
      console.warn('[blog] optional dependency not loaded: ' + name);
    }
  });

  /* ============================================================
     Admin detection — the previous version only checked that the
     FUNCTION exists, which is always true. This actually calls
     currentSession() to see if a user is signed in.
     ============================================================ */
  var isAdmin = false;
  try {
    if (window.EatoutsAuth && typeof EatoutsAuth.currentSession === 'function') {
      isAdmin = !!EatoutsAuth.currentSession();
    }
  } catch(e) {
    console.warn('[blog] session probe failed', e);
  }

  /* ============================================================
     Header status chip
     ============================================================ */
  var chip = document.getElementById('hdrStatus');
  if (isAdmin) {
    chip.className = 'chip admin';
    chip.textContent = 'Admin';
    chip.setAttribute('aria-label', 'Toggle admin view');
  } else {
    chip.textContent = 'Blog';
  }

  /* ============================================================
     Boot the engine
     ============================================================ */
  if (typeof window.EatoutsBlog === 'undefined') {
    document.getElementById('viewport').innerHTML =
      '<div style="padding:60px 24px;text-align:center;color:#c43c3c;font-size:13px;line-height:1.7">' +
        '<b>Blog engine not loaded.</b><br><br>' +
        'Check that <code>js/eatouts-blog.js</code> exists.<br>' +
        'Press F12 → Console for details.' +
      '</div>';
    return;
  }

  try {
    EatoutsBlog.init({
      mount: document.getElementById('viewport'),
      isAdmin: isAdmin
    });
  } catch(err) {
    console.error('[blog] init threw', err);
    document.getElementById('viewport').innerHTML =
      '<div style="padding:60px 24px;text-align:center;color:#c43c3c;font-size:13px;line-height:1.7">' +
        '<b>Blog failed to start.</b><br><br>' +
        String(err && err.message || err) +
        '<br><br>Press F12 → Console for the full stack.' +
      '</div>';
    return;
  }

  /* ============================================================
     Bottom nav: Blog home + optional Admin button
     ============================================================ */
  var nav = document.getElementById('bottomNav');
  nav.innerHTML =
    '<button class="nav-btn on" data-act="blogHome" type="button">' +
      '<svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>' +
      '<path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>' +
      'Blog home' +
    '</button>' +
    (isAdmin
      ? '<button class="nav-btn" data-act="blogAdmin" type="button">' +
          '<svg viewBox="0 0 24 24"><path d="M12 20h9"/>' +
          '<path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>' +
          'Admin' +
        '</button>'
      : '');

  /* ============================================================
     Back button (top-left) hides until we're in a sub-view
     ============================================================ */
  document.getElementById('hdrBack').addEventListener('click', function(){
    if (typeof EatoutsBlog.back === 'function') EatoutsBlog.back();
  });

  /* ============================================================
     Header chip toggles admin on/off for the session
     ============================================================ */
  chip.addEventListener('click', function(){
    if (!isAdmin) return;
    EatoutsBlog.setAdmin(!EatoutsBlog.isAdmin());
  });

  /* ============================================================
     Delegated click + live search
     ============================================================ */
  document.addEventListener('click', function(e){
    var t = e.target.closest('[data-act]');
    if (t) {
      e.preventDefault();
      EatoutsBlog.handleAction(t.getAttribute('data-act'), t, e);
    }
  });

  document.addEventListener('input', function(e){
    if (e.target && e.target.id === 'blogSearch') {
      EatoutsBlog.setSearch(e.target.value);
    }
  });

  /* ============================================================
     Deep link: ?post=slug opens the full post directly
     ============================================================ */
  var params = (function(){
    var p = {}, seg = window.location.search.replace(/^\?/,'').split('&');
    seg.forEach(function(s){
      var i = s.indexOf('=');
      if (i > 0) p[decodeURIComponent(s.slice(0,i))] = decodeURIComponent(s.slice(i+1));
    });
    return p;
  })();

  if (params.post && typeof EatoutsBlog.openPostBySlug === 'function') {
    EatoutsBlog.openPostBySlug(params.post);
  }
})();
</script>
</body>
</html>
