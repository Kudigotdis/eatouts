<!doctype html>
<!-- PAGE: Checkout summary -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#141418">
<title>Checkout summary · EatOuts</title>
<style>
::-webkit-scrollbar{width:0;height:0;display:none}
*{scrollbar-width:none;-ms-overflow-style:none}

  *,*::before,*::after{box-sizing:border-box}
  :root{
    --ink:#0F0F12;--ink-2:#2A2A30;--paper:#F4F5F7;--card:#FFF;
    --line:#E6E8EC;--line-2:#F0F1F4;
    --orange:#FF5A1F;--orange-2:#FF7A42;--orange-soft:#FFEDE4;--orange-line:#FFD5C2;
    --green:#16A34A;--green-soft:#E7F7EE;
    --red:#DC2626;--red-soft:#FEE2E2;
    --amber:#B45309;--amber-soft:#FEF3C7;
    --muted:#6B7280;--faint:#9AA1AC;
  }
  html,body{height:100%}
  body{margin:0;background:#E9EBEF;color:var(--ink);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;overscroll-behavior:none;
    display:flex;justify-content:center;}
  button,input,select,textarea{font-family:inherit}
  button{cursor:pointer}
  #shell{width:100%;max-width:460px;height:100vh;height:100dvh;
    background:var(--paper);display:flex;flex-direction:column;
    overflow:hidden;position:relative;box-shadow:0 0 70px rgba(20,20,25,.16);}
  .topbar{flex:0 0 auto;background:#141418;
    padding:calc(13px + env(safe-area-inset-top)) 18px 14px;
    position:relative;z-index:10;}
  .topbar-row{display:flex;align-items:center;gap:10px;padding-bottom:13px;}
  .brand{display:inline-flex;align-items:center;gap:9px;text-decoration:none;}
  .brand .mark{width:28px;height:28px;flex:0 0 auto;border-radius:8px;
    background:linear-gradient(145deg,var(--orange-2),var(--orange));
    color:#fff;display:grid;place-items:center;
    font-size:14px;font-weight:900;letter-spacing:-.03em;
    box-shadow:0 2px 10px rgba(255,90,31,.35);}
  .brand .word{color:#fff;font-size:15px;font-weight:800;letter-spacing:-.02em;}
  .hdr-chip{margin-left:auto;font-size:10px;font-weight:800;
    letter-spacing:.12em;text-transform:uppercase;color:var(--orange-2);
    border:1px solid rgba(255,122,66,.32);background:rgba(255,90,31,.1);
    border-radius:999px;padding:5px 11px;white-space:nowrap;}
  .progress{padding-bottom:2px}
  .progress-top{display:flex;align-items:baseline;justify-content:space-between;
    gap:10px;margin-bottom:8px;}
  .progress-label{font-size:11px;font-weight:800;letter-spacing:.14em;
    text-transform:uppercase;color:rgba(255,255,255,.5);}
  .progress-count{font-size:11.5px;font-weight:800;color:var(--orange-2);}
  .progress-track{height:5px;border-radius:99px;background:rgba(255,255,255,.13);
    overflow:hidden;}
  .progress-fill{height:100%;width:0%;border-radius:99px;
    background:linear-gradient(90deg,var(--orange),var(--orange-2));
    transition:width .35s cubic-bezier(.4,0,.2,1);}
  .scroll{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;
    -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
    scrollbar-width:none;}
  .scroll::-webkit-scrollbar{display:none}
  .intro{background:linear-gradient(175deg,#141418 0%,#1B1B21 60%,#232329 100%);
    padding:4px 22px 46px;position:relative;overflow:hidden;text-align:center;}
  .intro::after{content:"";position:absolute;top:-80px;right:-80px;
    width:230px;height:230px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,90,31,.2),transparent 68%);
    pointer-events:none;}
  .intro h1{position:relative;margin:0 auto 12px;font-size:26px;
    line-height:1.15;font-weight:800;letter-spacing:-.03em;color:#fff;
    max-width:15ch;}
  .intro h1 em{font-style:normal;color:var(--orange-2)}
  .intro p{position:relative;margin:0 auto;font-size:14px;line-height:1.6;
    color:rgba(255,255,255,.6);max-width:32ch;}
  .sheet{position:relative;z-index:1;margin-top:-26px;background:var(--paper);
    border-radius:26px 26px 0 0;padding:20px 14px 30px;min-height:60vh;}
  .meta-card{background:var(--card);border:1px solid var(--line);
    border-radius:16px;padding:15px 16px;margin-bottom:12px;
    box-shadow:0 1px 2px rgba(20,20,25,.03);}
  .meta-row{display:flex;align-items:center;gap:10px;margin-bottom:11px;}
  .meta-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;
    background:var(--orange);box-shadow:0 0 0 3px var(--orange-soft);}
  .meta-dot.green{background:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
  .meta-dot.warn{background:var(--amber);box-shadow:0 0 0 3px var(--amber-soft)}
  .meta-text{font-size:13.5px;color:var(--ink-2);line-height:1.4;
    min-width:0;flex:1 1 auto;}
  .meta-text b{color:var(--ink);font-weight:750}
  .meta-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
    padding-top:11px;border-top:1px solid var(--line-2);}
  .stat{text-align:center}
  .stat b{display:block;font-size:19px;font-weight:850;
    letter-spacing:-.03em;color:var(--ink);line-height:1.1;
    font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;}
  .stat span{display:block;margin-top:3px;font-size:9.5px;font-weight:800;
    letter-spacing:.1em;text-transform:uppercase;color:var(--faint);}
  .stack{display:flex;flex-direction:column;gap:10px}
  .acc{background:var(--card);border:1px solid var(--line);border-radius:16px;
    overflow:hidden;transition:border-color .2s ease,box-shadow .2s ease;}
  .acc.open{border-color:var(--orange-line);
    box-shadow:0 4px 18px -6px rgba(255,90,31,.22);}
  .acc-head{width:100%;display:flex;align-items:center;gap:12px;
    padding:13px 15px;background:transparent;border:0;text-align:left;
    -webkit-tap-highlight-color:transparent;transition:background .15s;}
  .acc-head:active{background:#FAFBFC}
  .sec-thumb{width:48px;height:48px;flex:0 0 auto;border-radius:11px;
    background:var(--orange-soft);color:var(--orange);
    display:grid;place-items:center;font-size:17px;font-weight:850;
    letter-spacing:-.02em;position:relative;}
  .sec-thumb .count{position:absolute;bottom:3px;right:3px;
    background:rgba(15,15,18,.72);color:#fff;font-size:9px;font-weight:800;
    padding:1.5px 5px;border-radius:4px;line-height:1;}
  .acc-title{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .acc-title b{font-size:15px;font-weight:750;letter-spacing:-.015em;
    color:var(--ink);line-height:1.25;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;}
  .acc-sub{font-size:11.5px;color:var(--faint);line-height:1.3;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:550;}
  .vis-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;
    background:var(--green);box-shadow:0 0 0 3px var(--green-soft);}
  .acc-body{display:grid;grid-template-rows:0fr;
    transition:grid-template-rows .32s cubic-bezier(.4,0,.2,1);}
  .acc.open .acc-body{grid-template-rows:1fr}
  .acc-inner{overflow:hidden;min-height:0}
  .module{padding:2px 15px 18px}
  .info-block{background:#FAFBFC;border:1px solid var(--line-2);
    border-radius:12px;padding:13px 14px;margin-bottom:10px;}
  .info-block:last-of-type{margin-bottom:0}
  .info-block h4{margin:0 0 8px;font-size:11.5px;font-weight:800;
    letter-spacing:.09em;text-transform:uppercase;color:var(--muted);}
  .def-row{display:flex;justify-content:space-between;align-items:flex-start;
    gap:12px;padding:7px 0;border-bottom:1px solid var(--line-2);
    font-size:13px;}
  .def-row:last-child{border-bottom:0;padding-bottom:0}
  .def-row:first-child{padding-top:0}
  .def-row .k{color:var(--faint);font-weight:650;flex:0 0 auto}
  .def-row .v{color:var(--ink-2);font-weight:700;text-align:right;
    word-break:break-word;min-width:0}
  .def-row .v.total{color:var(--ink);font-weight:850;font-size:16px;
    letter-spacing:-.02em;font-variant-numeric:tabular-nums;}
  .item-row{display:flex;justify-content:space-between;align-items:flex-start;
    gap:12px;padding:8px 0;border-bottom:1px solid var(--line-2);font-size:13px;}
  .item-row:last-child{border-bottom:0;padding-bottom:0}
  .item-row:first-child{padding-top:0}
  .item-name{color:var(--ink-2);font-weight:650;min-width:0;
    word-break:break-word;line-height:1.35;}
  .item-qty{color:var(--faint);font-weight:650;font-size:11.5px;
    margin-left:6px;}
  .item-price{color:var(--ink);font-weight:750;white-space:nowrap;
    font-variant-numeric:tabular-nums;}
  .action-btn{display:flex;align-items:center;justify-content:center;
    width:100%;height:52px;border-radius:13px;border:0;
    font-size:15px;font-weight:750;text-decoration:none;
    letter-spacing:-.01em;-webkit-tap-highlight-color:transparent;
    transition:transform .1s ease,background .15s;margin-bottom:9px;}
  .action-btn:last-child{margin-bottom:0}
  .action-btn:active{transform:scale(.98)}
  .action-btn.primary{background:linear-gradient(145deg,var(--orange-2),var(--orange));
    color:#fff;box-shadow:0 6px 18px -6px rgba(255,90,31,.5);}
  .action-btn.primary:active{background:var(--orange)}
  .action-btn.ghost{background:#F4F5F7;border:1px solid var(--line)!important;
    color:var(--ink-2);}
  .action-btn.ghost:active{background:#EBEDF0}
  .empty-note{font-size:12.5px;color:var(--faint);text-align:center;
    padding:22px 16px;border:1.5px dashed #DCE0E6;border-radius:11px;
    background:#FAFBFC;line-height:1.55;}
  .empty-note b{color:var(--ink-2);font-weight:750}
  .toast{position:fixed;left:50%;z-index:200;
    bottom:calc(28px + env(safe-area-inset-bottom));
    transform:translate(-50%,10px);background:var(--ink);color:#fff;
    font-size:13.5px;font-weight:650;padding:12px 18px;border-radius:999px;
    max-width:88vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;}
  .toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body data-page="eatouts-checkout-summary">
<div id="shell">
  <header class="topbar">
    <div class="topbar-row">
      <a class="brand" href="index.html">
        <span class="mark">E</span><span class="word">EatOuts</span>
      </a>
      <span class="hdr-chip">Checkout Summary</span>
    </div>
    <div class="progress">
      <div class="progress-top">
        <span class="progress-label">Checkout</span>
        <span class="progress-count" id="progressCount">—</span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
  </header>
  <div class="scroll" id="scroll">
    <section class="intro">
      <h1>Order <em>summary</em>.</h1>
      <p>A saved order or checkout summary you can share with your venue.</p>
    </section>
    <main class="sheet" id="mount"></main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script src="js/eatouts-manager-db.js"></script>
<script src="assets/data/demo/the-food-place/demo-data.js"></script>
<script src="js/eatouts-manager-seed.js"></script>
<script src="js/eatouts-roles.js"></script>
<script src="js/eatouts-users.js"></script>
<script src="js/eatouts-feedback.js"></script>
<script src="js/eatouts-blog-admin.js"></script>
<script src="js/eatouts-auth.js"></script>
<script src="js/eatouts-manager.js"></script>
<script src="js/eatouts-customer.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  if (!EO.guard({"roles":["customer"]})) return;
  var S = window.EatoutsCustomer;

  function esc(v){return String(v==null?"":v).replace(/&/g,"&amp;")
    .replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");}
  function escapeAttr(v){return esc(v).replace(/`/g,"&#96;");}
  function cssEscape(s){return String(s).replace(/["\\]/g,'\\$&');}

  var toastEl = document.getElementById("toast");
  var toastTimer = null;
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove("show"); }, 2000);
  }

  var OPEN = null;

  var id = (new URLSearchParams(location.search)).get("id") || "";
  var s = (S && S.summaries ? S.summaries.list() : []).find(function(x){
    return String(x.id) === String(id);
  }) || null;
  var payload = (s && s.payload) || {};
  var items = payload.items || [];
  var venue = (s && s.venueName) || payload.venueName || "Your order";
  var total = (s && s.total != null) ? s.total : (payload.total || 0);

  function waText(){
    var t = "*ORDER SUMMARY*\n" + venue + "\n\n";
    items.forEach(function(it){
      var name = it.name || it.title || "Item";
      t += "• " + name + (it.qty ? (" x" + it.qty) : "") +
           (it.price ? (" — " + EO.money(it.price)) : "") + "\n";
    });
    t += "\nTotal: " + EO.money(total) + "\n\nSent from EatOuts";
    return t;
  }

  function itemsBody(){
    if (!items.length){
      return '<div class="module"><div class="empty-note">No line items recorded for this summary.</div></div>';
    }
    return '<div class="module">' +
      items.map(function(it){
        var name = it.name || it.title || "Item";
        var qty = it.qty ? '<span class="item-qty">× ' + esc(it.qty) + '</span>' : '';
        var price = it.price ? '<span class="item-price">' + esc(EO.money(it.price)) + '</span>' : '';
        return '<div class="item-row">' +
          '<span class="item-name">' + esc(name) + qty + '</span>' +
          price +
        '</div>';
      }).join('') +
    '</div>';
  }

  function detailsBody(){
    return '<div class="module">' +
      '<div class="info-block">' +
        '<h4>Venue</h4>' +
        '<div class="def-row"><span class="k">Name</span><span class="v">' + esc(venue) + '</span></div>' +
        '<div class="def-row"><span class="k">Items</span><span class="v">' + items.length + '</span></div>' +
        '<div class="def-row"><span class="k">Total</span><span class="v total">' + esc(EO.money(total)) + '</span></div>' +
      '</div>' +
    '</div>';
  }

  function actionsBody(){
    var wa = "https://wa.me/?text=" + encodeURIComponent(waText());
    return '<div class="module">' +
      '<div class="info-block">' +
        '<h4>Share this summary</h4>' +
        '<p>Send this order as a WhatsApp message to the venue or to a friend.</p>' +
      '</div>' +
      '<a class="action-btn primary" href="' + escapeAttr(wa) + '" target="_blank" rel="noopener">Send via WhatsApp</a>' +
      '<a class="action-btn ghost" href="eatouts-summaries.html">All summaries</a>' +
    '</div>';
  }

  function section(key, letter, title, sub, body){
    var isOpen = OPEN === key;
    var cls = 'acc' + (isOpen ? ' open' : '');
    return '<section class="' + cls + '" data-key="' + escapeAttr(key) + '">' +
      '<button class="acc-head" type="button" aria-expanded="' + (isOpen ? 'true' : 'false') + '">' +
        '<span class="sec-thumb">' + esc(letter) + '</span>' +
        '<span class="acc-title">' +
          '<b>' + esc(title) + '</b>' +
          '<span class="acc-sub">' + esc(sub) + '</span>' +
        '</span>' +
        '<span class="vis-dot"></span>' +
      '</button>' +
      '<div class="acc-body"><div class="acc-inner">' + body + '</div></div>' +
    '</section>';
  }

  function renderMeta(){
    var dotClass = s ? "green" : "warn";
    var msg = s
      ? "<b>" + esc(venue) + "</b> · " + items.length + " item" + (items.length === 1 ? "" : "s")
      : "Summary not found";

    return '<div class="meta-card">' +
      '<div class="meta-row">' +
        '<span class="meta-dot ' + dotClass + '"></span>' +
        '<span class="meta-text">' + msg + '</span>' +
      '</div>' +
      '<div class="meta-stats">' +
        '<div class="stat"><b>' + items.length + '</b><span>Items</span></div>' +
        '<div class="stat"><b>' + esc(EO.money(total)) + '</b><span>Total</span></div>' +
        '<div class="stat"><b>' + (s ? 'Saved' : '—') + '</b><span>Status</span></div>' +
      '</div>' +
    '</div>';
  }

  function updateProgress(){
    var pct = s ? 100 : 0;
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('progressCount').textContent = s
      ? items.length + ' item' + (items.length === 1 ? '' : 's') + ' · ' + EO.money(total)
      : 'Not found';
  }

  var mount = document.getElementById("mount");

  function render(){
    if (!s){
      mount.innerHTML = renderMeta() +
        '<div class="empty-note">Summary not found.<br><b>Open this page</b> from a saved summary.</div>';
      updateProgress();
      return;
    }
    mount.innerHTML =
      renderMeta() +
      '<div class="stack">' +
        section('details', 'V', 'Order details', venue + ' · ' + items.length + ' item' + (items.length === 1 ? '' : 's'), detailsBody()) +
        section('items',   'I', 'Items',          items.length + ' line item' + (items.length === 1 ? '' : 's'), itemsBody()) +
        section('actions', 'A', 'Share & actions', 'WhatsApp or view all summaries', actionsBody()) +
      '</div>';
    updateProgress();
  }

  function toggleAccordion(key){
    OPEN = (OPEN === key) ? null : key;
    var accs = mount.querySelectorAll('.acc');
    for (var i = 0; i < accs.length; i++){
      var acc = accs[i];
      var isOpen = acc.getAttribute('data-key') === OPEN;
      acc.classList.toggle('open', isOpen);
      var head = acc.querySelector('.acc-head');
      if (head) head.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    }
    if (OPEN){
      var opened = mount.querySelector('.acc[data-key="' + cssEscape(OPEN) + '"]');
      if (opened){
        setTimeout(function(){
          try { opened.scrollIntoView({ behavior:'smooth', block:'start' }); } catch (e) {}
        }, 320);
      }
    }
  }

  mount.addEventListener('click', function(e){
    var head = e.target.closest('.acc-head');
    if (head){
      var acc = head.closest('.acc');
      if (acc) toggleAccordion(acc.getAttribute('data-key'));
    }
  });

  render();
});
</script>
</body>
</html>
