<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#ffffff"><title>Analytics manager · EatOuts</title><link rel="stylesheet" href="assets/eatouts-manager.css"></head><body><div id="mount"></div><script src="js/eatouts-manager-db.js"></script><script src="js/eatouts-roles.js"></script><script src="js/eatouts-users.js"></script><script src="js/eatouts-feedback.js"></script><script src="js/eatouts-blog-admin.js"></script><script src="js/eatouts-auth.js"></script><script src="js/eatouts-analytics.js"></script><script src="js/eatouts-manager.js"></script><script>document.addEventListener("DOMContentLoaded",()=>{const u=EO.guard({});if(!u)throw new Error("guard");document.querySelector("#mount").innerHTML=EO.shell("Analytics manager","Real aggregates from orders, promos and deliveries",`<div class="grid3" id="m"></div><div class="card"><div class="card-title">Performance</div><div class="timeline"><div class="item"><strong>New → accepted</strong><div style="font-size:10px;color:#777">Acceptance SLA.</div></div><div class="item"><strong>Preparing → ready</strong><div style="font-size:10px;color:#777">Kitchen preparation time.</div></div><div class="item"><strong>Ready → delivered</strong><div style="font-size:10px;color:#777">Dispatch/delivery time.</div></div></div></div>`,{section:"Manager"});
const b=EO.business(),o=EatoutsMgrDB.filter("orders",x=>x.businessId===b.id),g=o.reduce((s,x)=>s+x.total,0),del=o.filter(x=>x.delivery==="Delivery").length;document.querySelector("#m").innerHTML=EO.metric("Orders",o.length,"loaded from DB")+EO.metric("GMV",EO.money(g),"gross order value")+EO.metric("Delivery share",o.length?Math.round(del/o.length*100)+"%":"0%","of orders");});</script></body></html>
